vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Chuyến tham quan'
  page_icon: 'ph:bold/signpost'
  intro: 'Một chuyến tham quan hướng dẫn về một trang: từng bước một, phần tử liên quan được chiếu sáng trên trang mờ và một thẻ bên cạnh nó, với lối vào và lối ra. Nó tự động bắt đầu cho một khách truy cập chưa hoàn thành hoặc từ chối nó — những gì họ đã làm được ghi lại, và nó sẽ không quay lại — và bất kỳ phần tử nào mang dữ liệu-tour-start sẽ phát lại. Các phím mũi tên trên bàn phím di chuyển qua nó, phím Escape sẽ thoát khỏi nó.'
  start: 'Bắt đầu chuyến tham quan'
  status:
    none: 'Bạn chưa xem chuyến tham quan này — nó sẽ tự động bắt đầu.'
    completed: 'Bạn đã hoàn thành chuyến tham quan này; nó sẽ không tự động bắt đầu lại.'
    dismissed: 'Bạn đã đóng chuyến tham quan này trước khi kết thúc; nó sẽ không tự động bắt đầu lại.'
  area:
    filters:
      title: 'Bộ lọc'
      body: 'Danh sách hiển thị gì.'
    list:
      title: 'Danh sách'
      body: 'Có gì ở đây.'
    export:
      title: Xuất
      body: 'Những gì rời khỏi trang.'
  step:
    welcome:
      title: 'Chào mừng'
      body: 'Một chuyến tham quan ngắn về trang này. Sử dụng các phím mũi tên trên bàn phím, hoặc các nút bên dưới.'
    filters:
      title: 'Thu hẹp lại'
      body: 'Các bộ lọc quyết định danh sách hiển thị gì; chúng được giữ trong địa chỉ.'
    list:
      title: 'Có gì ở đây'
      body: 'Mỗi hàng mở chi tiết bên cạnh danh sách.'
    export:
      title: 'Mang theo bạn'
      body: 'Xuất sẽ lấy những gì mà các bộ lọc đã giữ lại, không hơn.'

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 导览
  page_icon: 'ph:bold/signpost'
  intro: 页面的引导式导览：一步一步，相关元素在暗淡的页面中高亮，旁边有一张卡片，展示前进和退出的方式。对于尚未完成或关闭导览的访客，它会自动开始——他们的操作会被记录，并且不会再次出现——任何携带数据-tour-start的元素会再次播放它。键盘的箭头可以在其中移动，Escape键可以退出。
  start: 开始导览
  status:
    none: 您还没有观看过此导览——它会自动开始。
    completed: 您已经完成了此导览；它不会再次自动开始。
    dismissed: 您在导览结束前关闭了它；它不会再次自动开始。
  area:
    filters:
      title: 过滤器
      body: 列表所显示的内容。
    list:
      title: 列表
      body: 存在的内容。
    export:
      title: 导出
      body: 离开页面的内容。
  step:
    welcome:
      title: 欢迎
      body: 此页面的简短导览。使用键盘的箭头，或下面的按钮。
    filters:
      title: 缩小范围
      body: 过滤器决定列表显示的内容；它们会保留在地址中。
    list:
      title: 存在的内容
      body: 每一行在列表旁边打开其详细信息。
    export:
      title: 带走它
      body: 导出包含过滤器所保留的内容，其他内容不包括。
