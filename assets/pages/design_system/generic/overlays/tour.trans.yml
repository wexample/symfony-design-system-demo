      body: 'کیا موجود ہے۔'
    export:
      title: 'برآمد کریں'
      body: 'کیا صفحے سے نکلتا ہے۔'
  step:
    welcome:
      title: 'خوش آمدید'
      body: 'اس صفحے کا ایک مختصر ٹور۔ کی بورڈ کے تیر استعمال کریں، یا نیچے دیے گئے بٹن۔'
    filters:
      title: 'اسے محدود کریں'
      body: 'فلٹرز فیصلہ کرتے ہیں کہ فہرست میں کیا دکھایا جائے؛ یہ ایڈریس میں محفوظ رہتے ہیں۔'
    list:
