en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Tour
  page_icon: ph:bold/signpost

  intro: "A guided tour of a page: one step at a time, the element it is about lit in a dimmed page and a card beside it, with the way on and the way out. It starts on its own for a visitor who has neither finished nor dismissed it — what they did is kept, and it does not come back — and any element carrying data-tour-start plays it again. The arrows of the keyboard move through it, Escape leaves it."

  start: Play the tour

  status:
    none: You have not seen this tour yet — it starts on its own.
    completed: You went through this tour; it will not start on its own again.
    dismissed: You closed this tour before its end; it will not start on its own again.

  area:
    filters:
      title: Filters
      body: What the list shows.
    list:
      title: The list
      body: What there is.
    export:
      title: Export
      body: What leaves the page.

  step:
    welcome:
      title: Welcome
      body: A short tour of this page. Use the arrows of the keyboard, or the buttons below.
    filters:
      title: Narrow it down
      body: The filters decide what the list shows; they are kept in the address.
    list:
      title: What there is
      body: Each row opens its detail beside the list.
    export:
      title: Take it with you
      body: The export takes what the filters kept, nothing more.

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: جولة
  page_icon: 'ph:bold/signpost'
  intro: 'جولة موجهة في الصفحة: خطوة بخطوة، العنصر المعني مضاء في صفحة مظللة وبطاقة بجانبه، مع الاتجاه للدخول والخروج. تبدأ تلقائياً للزائر الذي لم ينتهِ منها أو يغلقها - ما فعله مُحتفظ به، ولا تعود مرة أخرى - وأي عنصر يحمل data-tour-start يعيد تشغيلها. تتحرك الأسهم بواسطة لوحة المفاتيح من خلالها، والزر Escape يخرج منها.'
  start: 'ابدأ الجولة'
  status:
    none: 'لم تشاهد هذه الجولة بعد - تبدأ تلقائياً.'
    completed: 'لقد مررت بهذه الجولة؛ لن تبدأ تلقائياً مرة أخرى.'
    dismissed: 'لقد أغلقت هذه الجولة قبل انتهائها؛ لن تبدأ تلقائياً مرة أخرى.'
  area:
    filters:
      title: الفلاتر
      body: 'ما تظهره القائمة.'
    list:
      title: القائمة
      body: 'ما هو موجود.'
    export:
      title: تصدير
      body: 'ما يغادر الصفحة.'
  step:
    welcome:
      title: 'مرحبا بك'
      body: 'جولة قصيرة في هذه الصفحة. استخدم أسهم لوحة المفاتيح، أو الأزرار أدناه.'
    filters:
      title: 'تضييق المجال'
      body: 'تحدد الفلاتر ما تظهره القائمة؛ تُحتفظ في العنوان.'
    list:
      title: 'ما هو موجود'
      body: 'يفتح كل صف تفاصيله بجانب القائمة.'
    export:
      title: 'خذها معك'
      body: 'التصدير يأخذ ما احتفظت به الفلاتر، لا شيء أكثر.'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ভ্রমণ
  page_icon: 'ph:bold/signpost'
  intro: 'একটি পৃষ্ঠার গাইডেড ট্যুর: এক সময়ে একটি পদক্ষেপ, এটি সম্পর্কে যে উপাদানটি রয়েছে তা একটি ম্লান পৃষ্ঠায় আলোকিত এবং তার পাশে একটি কার্ড, সঙ্গে পথে এবং বের হওয়ার পথে। এটি নিজের থেকেই শুরু হয় একটি দর্শকের জন্য যিনি এটি শেষ করেননি বা বাতিল করেননি — তাদের করা কাজ রাখা হয়, এবং এটি আবার ফিরে আসে না — এবং যে কোনও উপাদান যার মধ্যে data-tour-start রয়েছে তা আবার চালায়। কীবোর্ডের তীরগুলি এর মধ্য দিয়ে চলে, Escape এটি বন্ধ করে।'
  start: 'ভ্রমণ শুরু করুন'
  status:
    none: 'আপনি এখনও এই ভ্রমণটি দেখেননি — এটি নিজের থেকেই শুরু হয়।'
    completed: 'আপনি এই ভ্রমণটি সম্পন্ন করেছেন; এটি আবার নিজের থেকেই শুরু হবে না।'
    dismissed: 'আপনি এই ভ্রমণটি শেষ হওয়ার আগে বন্ধ করেছেন; এটি আবার নিজের থেকেই শুরু হবে না।'
  area:
    filters:
      title: ফিল্টার
      body: 'তালিকাটি কী দেখায়।'
    list:
      title: তালিকা
      body: 'এখানে কী আছে।'
    export:
      title: রপ্তানি
      body: 'পৃষ্ঠাটি থেকে কী বের হয়।'
  step:
    welcome:
      title: স্বাগতম
      body: 'এই পৃষ্ঠার একটি সংক্ষিপ্ত ট্যুর। কীবোর্ডের তীরগুলি ব্যবহার করুন, অথবা নিচের বোতামগুলি।'
    filters:
      title: 'এটি সংকীর্ণ করুন'
      body: 'ফিল্টারগুলি নির্ধারণ করে তালিকাটি কী দেখাবে; এগুলি ঠিকানায় রাখা হয়।'
    list:
      title: 'এখানে কী আছে'
      body: 'প্রতিটি সারি তার পাশে তালিকার বিশদ খুলে।'
    export:
      title: 'এটি আপনার সঙ্গে নিন'
      body: 'রপ্তানি ফিল্টার দ্বারা রাখা তথ্য নিয়ে আসে, আর কিছু নয়।'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Tour
  page_icon: 'ph:bold/signpost'
  intro: 'Eine geführte Tour über eine Seite: Schritt für Schritt wird das jeweilige Element auf einer abgedunkelten Seite hervorgehoben, daneben befindet sich eine Karte mit dem Weg hinein und hinaus. Sie beginnt automatisch für einen Besucher, der sie weder abgeschlossen noch abgebrochen hat – das, was er getan hat, wird gespeichert, und sie kommt nicht zurück – und jedes Element mit dem Datenattribut data-tour-start spielt sie erneut ab. Die Pfeiltasten der Tastatur navigieren durch die Tour, Escape verlässt sie.'
  start: 'Tour starten'
  status:
    none: 'Du hast diese Tour noch nicht gesehen – sie beginnt automatisch.'
    completed: 'Du hast diese Tour abgeschlossen; sie wird nicht automatisch erneut gestartet.'
    dismissed: 'Du hast diese Tour vor dem Ende geschlossen; sie wird nicht automatisch erneut gestartet.'
  area:
    filters:
      title: Filter
      body: 'Was die Liste anzeigt.'
    list:
      title: 'Die Liste'
      body: 'Was vorhanden ist.'
    export:
      title: Exportieren
      body: 'Was die Seite verlässt.'
  step:
    welcome:
      title: Willkommen
      body: 'Eine kurze Tour über diese Seite. Nutze die Pfeiltasten auf der Tastatur oder die Schaltflächen unten.'
    filters:
      title: Eingrenzen
      body: 'Die Filter entscheiden, was die Liste anzeigt; sie werden in der Adresse gespeichert.'
    list:
      title: 'Was vorhanden ist'
      body: 'Jede Zeile öffnet ihre Details neben der Liste.'
    export:
      title: 'Nimm es mit'
      body: 'Der Export nimmt das, was die Filter behalten haben, nichts weiter.'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Tour
  page_icon: 'ph:bold/signpost'
  intro: 'Una visita guiada de una página: paso a paso, el elemento del que se trata iluminado en una página atenuada y una tarjeta al lado, con el camino de entrada y el de salida. Comienza por sí solo para un visitante que no lo ha terminado ni lo ha desestimado: lo que hicieron se mantiene, y no regresa; y cualquier elemento que lleve data-tour-start lo reproduce nuevamente. Las flechas del teclado permiten navegar por él, Escape lo cierra.'
  start: 'Reproducir el tour'
  status:
    none: 'No has visto este tour aún — comienza por sí solo.'
    completed: 'Has recorrido este tour; no comenzará por sí solo nuevamente.'
    dismissed: 'Cerraste este tour antes de que terminara; no comenzará por sí solo nuevamente.'
  area:
    filters:
      title: Filtros
      body: 'Lo que muestra la lista.'
    list:
      title: 'La lista'
      body: 'Lo que hay.'
    export:
      title: Exportar
      body: 'Lo que sale de la página.'
  step:
    welcome:
      title: Bienvenido
      body: 'Una breve visita a esta página. Usa las flechas del teclado, o los botones de abajo.'
    filters:
      title: Redúcelo
      body: 'Los filtros deciden lo que muestra la lista; se mantienen en la dirección.'
    list:
      title: 'Lo que hay'
      body: 'Cada fila abre su detalle al lado de la lista.'
    export:
      title: 'Llévatelo contigo'
      body: 'La exportación toma lo que los filtros mantienen, nada más.'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: تور
  page_icon: 'ph:bold/signpost'
  intro: 'یک تور راهنما از یک صفحه: قدم به قدم، عنصری که درباره‌اش صحبت می‌شود در صفحه‌ای کمرنگ روشن می‌شود و یک کارت در کنار آن، با راه ورودی و خروجی. این تور به‌طور خودکار برای بازدیدکننده‌ای که نه آن را به پایان رسانده و نه رد کرده است شروع می‌شود — آنچه انجام داده‌اند حفظ می‌شود و دوباره برنمی‌گردد — و هر عنصر دارای داده‌های data-tour-start دوباره آن را پخش می‌کند. کلیدهای جهت‌نما در آن حرکت می‌کنند، Escape آن را ترک می‌کند.'
  start: 'شروع تور'
  status:
    none: 'شما هنوز این تور را ندیده‌اید — به‌طور خودکار شروع می‌شود.'
    completed: 'شما از این تور عبور کردید؛ دوباره به‌طور خودکار شروع نخواهد شد.'
    dismissed: 'شما این تور را قبل از پایان آن بستید؛ دوباره به‌طور خودکار شروع نخواهد شد.'
  area:
    filters:
      title: فیلترها
      body: 'آنچه در لیست نمایش داده می‌شود.'
    list:
      title: لیست
      body: 'آنچه وجود دارد.'
    export:
      title: صادرات
      body: 'آنچه از صفحه خارج می‌شود.'
  step:
    welcome:
      title: 'خوش آمدید'
      body: 'یک تور کوتاه از این صفحه. از کلیدهای جهت‌نما استفاده کنید، یا دکمه‌های زیر.'
    filters:
      title: 'محدود کردن'
      body: 'فیلترها تصمیم می‌گیرند که لیست چه چیزی را نشان می‌دهد؛ آنها در آدرس حفظ می‌شوند.'
    list:
      title: 'آنچه وجود دارد'
      body: 'هر ردیف جزئیات خود را در کنار لیست باز می‌کند.'
    export:
      title: 'با خود ببرید'
      body: 'صادرات آنچه را که فیلترها حفظ کرده‌اند می‌گیرد، و بس.'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Kierros
  page_icon: 'ph:bold/signpost'
  intro: 'Ohjattu kierros sivusta: askel kerrallaan, asiaan liittyvä elementti valaistuna himmeällä sivulla ja kortti sen vieressä, kulku- ja poistumistie. Se alkaa itsestään vierailijalle, joka ei ole vielä päättänyt tai sulkenut sitä — mitä he tekivät säilytetään, eikä se palaudu — ja mikä tahansa elementti, jossa on data-tour-start, toistaa sen uudelleen. Näppäimistön nuolipainikkeet liikkuvat sen läpi, Escape poistuu siitä.'
  start: 'Aloita kierros'
  status:
    none: 'Et ole vielä nähnyt tätä kierrosta — se alkaa itsestään.'
    completed: 'Kävit tämän kierroksen läpi; se ei ala itsestään uudelleen.'
    dismissed: 'Sulkisit tämän kierroksen ennen sen loppua; se ei ala itsestään uudelleen.'
  area:
    filters:
      title: Suodattimet
      body: 'Mitä lista näyttää.'
    list:
      title: Lista
      body: 'Mitä on saatavilla.'
    export:
      title: Vie
      body: 'Mikä lähtee sivulta.'
  step:
    welcome:
      title: Tervetuloa
      body: 'Lyhyt kierros tästä sivusta. Käytä näppäimistön nuolia tai alla olevia painikkeita.'
    filters:
      title: 'Rajoita valintaa'
      body: 'Suodattimet päättävät, mitä lista näyttää; ne säilytetään osoitteessa.'
    list:
      title: 'Mitä on'
      body: 'Jokainen rivi avaa yksityiskohdat listan vieressä.'
    export:
      title: 'Ota se mukaasi'
      body: 'Vienti ottaa sen, mitä suodattimet säilyttivät, ei enempää.'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Visite
  page_icon: 'ph:bold/panneau'
  intro: "Une visite guidée d'une page : étape par étape, l'élément concerné est éclairé sur une page assombrie et une carte à côté, avec le chemin d'entrée et de sortie. Elle commence d'elle-même pour un visiteur qui ne l'a ni terminée ni rejetée — ce qu'il a fait est conservé et elle ne revient pas — et tout élément portant des données-tour-start la relance. Les flèches du clavier naviguent à travers, Échap le quitte."
  start: 'Jouer la visite'
  status:
    none: "Vous n'avez pas encore vu cette visite — elle commence d'elle-même."
    completed: "Vous avez terminé cette visite ; elle ne recommencera pas d'elle-même."
    dismissed: "Vous avez fermé cette visite avant sa fin ; elle ne recommencera pas d'elle-même."
  area:
    filters:
      title: Filtres
      body: 'Ce que la liste montre.'
    list:
      title: 'La liste'
      body: "Ce qu'il y a."
    export:
      title: Exporter
      body: 'Ce qui quitte la page.'
  step:
    welcome:
      title: Bienvenue
      body: 'Une courte visite de cette page. Utilisez les flèches du clavier ou les boutons ci-dessous.'
    filters:
      title: Affinez
      body: "Les filtres décident de ce que la liste montre ; ils sont conservés dans l'adresse."
    list:
      title: "Ce qu'il y a"
      body: 'Chaque ligne ouvre son détail à côté de la liste.'
    export:
      title: 'Emportez-le avec vous'
      body: "L'exportation prend ce que les filtres ont conservé, rien de plus."

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: סיור
  page_icon: 'ph:bold/signpost'
  intro: 'סיור מודרך של העמוד: שלב אחרי שלב, האלמנט המדובר מואר בעמוד מעומעם וכרטיס לידו, עם הדרך פנימה והדרך החוצה. הוא מתחיל מעצמו עבור מבקר שלא סיים או דחה אותו — מה שהם עשו נשמר, והוא לא יחזור — וכל אלמנט שמכיל data-tour-start מפעיל אותו שוב. חיצי המקלדת נעים דרכו, Escape יוצא ממנו.'
  start: 'שחק את הסיור'
  status:
    none: 'לא ראית את הסיור הזה עדיין — הוא מתחיל מעצמו.'
    completed: 'עברתי את הסיור הזה; הוא לא יתחיל מעצמו שוב.'
    dismissed: 'סגרת את הסיור הזה לפני סופו; הוא לא יתחיל מעצמו שוב.'
  area:
    filters:
      title: מסננים
      body: 'מה שהרשימה מראה.'
    list:
      title: הרשימה
      body: 'מה שיש.'
    export:
      title: ייצוא
      body: 'מה שיוצא מהעמוד.'
  step:
    welcome:
      title: 'ברוך הבא'
      body: 'סיור קצר בעמוד הזה. השתמש בחיצי המקלדת, או בכפתורים למטה.'
    filters:
      title: 'צמצם את זה'
      body: 'המסננים קובעים מה הרשימה מראה; הם נשמרים בכתובת.'
    list:
      title: 'מה שיש'
      body: 'כל שורה פותחת את פרטיה לצד הרשימה.'
    export:
      title: 'קח את זה איתך'
      body: 'הייצוא לוקח את מה שהמסננים שמרו, שום דבר יותר.'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: टूर
  page_icon: 'ph:bold/signpost'
  intro: 'एक पृष्ठ का मार्गदर्शित टूर: एक बार में एक कदम, जिस तत्व के बारे में है वह मंद पृष्ठ में रोशन होता है और इसके बगल में एक कार्ड होता है, जिसमें जाने का रास्ता और बाहर जाने का रास्ता होता है। यह अपने आप एक आगंतुक के लिए शुरू होता है जिसने न तो इसे खत्म किया है और न ही इसे खारिज किया है - जो उन्होंने किया है वह रखा गया है, और यह वापस नहीं आता है - और कोई भी तत्व जो डेटा-tour-start ले जाता है, इसे फिर से चलाता है। कीबोर्ड के तीर इसके माध्यम से चलते हैं, Escape इसे छोड़ देता है।'
  start: 'टूर खेलें'
  status:
    none: 'आपने अभी तक यह टूर नहीं देखा - यह अपने आप शुरू होता है।'
    completed: 'आपने इस टूर को पूरा किया; यह फिर से अपने आप शुरू नहीं होगा।'
    dismissed: 'आपने इस टूर को इसके अंत से पहले बंद कर दिया; यह फिर से अपने आप शुरू नहीं होगा।'
  area:
    filters:
      title: फिल्टर
      body: 'सूची क्या दिखाती है।'
    list:
      title: सूची
      body: 'यहाँ क्या है।'
    export:
      title: निर्यात
      body: 'जो पृष्ठ को छोड़ता है।'
  step:
    welcome:
      title: 'स्वागत है'
      body: 'इस पृष्ठ का एक संक्षिप्त टूर। कीबोर्ड के तीरों का उपयोग करें, या नीचे दिए गए बटन।'
    filters:
      title: 'संकीर्ण करें'
      body: 'फिल्टर तय करते हैं कि सूची क्या दिखाती है; उन्हें पते में रखा जाता है।'
    list:
      title: 'यहाँ क्या है'
      body: 'प्रत्येक पंक्ति अपनी विस्तार को सूची के बगल में खोलती है।'
    export:
