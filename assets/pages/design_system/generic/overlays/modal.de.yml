~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Dialog
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'Modal mit Tabs. Öffnen Sie es, wechseln Sie die Tabs, drücken Sie F5 — das Modal öffnet sich wieder im selben Tab.'
    button: 'Modal öffnen'
  simple:
    description: 'Ein einfaches Modal anzeigen. Sie können es mit Escape oder durch Klicken außerhalb des Modals schließen.'
    button: 'Modal öffnen'
  components:
    description: 'Ein Modal mit Komponenten und einem Toast-Trigger anzeigen. Escape ist deaktiviert, aber Sie können trotzdem außerhalb klicken, um es zu schließen.'
    button: 'Modal öffnen'
  medium:
    description: 'Ein Modal mit Text mittlerer Länge anzeigen. Ein Klick außerhalb schließt es nicht.'
    button: 'Modal öffnen'
  long:
    description: 'Ein Modal mit langem Text anzeigen. Es fragt nach Bestätigung, bevor es geschlossen wird.'
    button: 'Modal öffnen'
  form_rendered:
    description: 'Ein gerendertes Demofeld innerhalb eines Modals anzeigen. Escape und das Klicken außerhalb sind deaktiviert, und es fragt vor dem Schließen, ob das Feld geändert wurde.'
    button: 'Modal öffnen'
  form_ajax:
    description: 'Ein gerendertes Demofeld innerhalb eines Modals mit AJAX anzeigen. Escape und das Klicken außerhalb sind deaktiviert, und es fragt vor dem Schließen, ob das Feld geändert wurde.'
    button: 'Modal öffnen'
  recursive:
    description: 'Eine Dialogseite innerhalb eines anderen Dialogs öffnen — Modal oder Panel wählen.'
    button_modal: 'In Modal öffnen'
    button_panel: 'In Panel öffnen'
