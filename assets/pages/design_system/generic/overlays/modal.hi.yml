~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: संवाद
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'टैब के साथ मोडल। इसे खोलें, टैब बदलें, F5 दबाएं — मोडल उसी टैब पर फिर से खुलता है।'
    button: 'मोडल खोलें'
  simple:
    description: 'एक साधारण मोडल दिखाएं। आप इसे Escape दबाकर या मोडल के बाहर क्लिक करके बंद कर सकते हैं।'
    button: 'मोडल खोलें'
  components:
    description: 'घटक और एक टोस्ट ट्रिगर के साथ एक मोडल दिखाएं। Escape अक्षम है, लेकिन आप इसे बंद करने के लिए अभी भी बाहर क्लिक कर सकते हैं।'
    button: 'मोडल खोलें'
  medium:
    description: 'मध्यम लंबाई के पाठ के साथ एक मोडल दिखाएं। बाहर क्लिक करने से यह बंद नहीं होगा।'
    button: 'मोडल खोलें'
  long:
    description: 'लंबे पाठ के साथ एक मोडल दिखाएं। यह बंद करने से पहले पुष्टि मांगता है।'
    button: 'मोडल खोलें'
  form_rendered:
    description: 'मोडल के अंदर एक प्रदर्शित डेमो फॉर्म दिखाएं। Escape और बाहर क्लिक अक्षम हैं, और यदि फॉर्म में बदलाव किया गया है तो यह बंद करने से पहले पूछता है।'
    button: 'मोडल खोलें'
  form_ajax:
    description: 'AJAX का उपयोग करके मोडल के अंदर एक प्रदर्शित डेमो फॉर्म दिखाएं। Escape और बाहर क्लिक अक्षम हैं, और यदि फॉर्म में बदलाव किया गया है तो यह बंद करने से पहले पूछता है।'
    button: 'मोडल खोलें'
  recursive:
    description: 'एक संवाद पृष्ठ को दूसरे संवाद के अंदर खोलें — मोडल या पैनल चुनें।'
    button_modal: 'मोडल में खोलें'
    button_panel: 'पैनल में खोलें'
