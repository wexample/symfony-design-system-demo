  form_rendered:
    description: 'پینل کے اندر ایک ڈیمو فارم دکھائیں۔ Escape اور باہر کلک غیر فعال ہیں، اور اگر فارم میں تبدیلی کی گئی تو بند کرنے سے پہلے تصدیق مانگتا ہے۔'
    button: 'پینل کھولیں'
  form_ajax:
    description: 'AJAX کا استعمال کرتے ہوئے پینل کے اندر ایک ڈیمو فارم دکھائیں۔ Escape اور باہر کلک غیر فعال ہیں، اور اگر فارم میں تبدیلی کی گئی تو بند کرنے سے پہلے تصدیق مانگتا ہے۔'
    button: 'پینل کھولیں'
  recursive:
    description: 'ایک ڈائیلاگ کے اندر دوسرے ڈائیلاگ کا صفحہ کھولیں — موڈل یا پینل کا انتخاب کریں۔'
