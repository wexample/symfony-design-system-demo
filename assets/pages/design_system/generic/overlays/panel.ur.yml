  components:
    description: 'اجزاء اور ایک ٹوسٹ ٹریگر کے ساتھ پینل دکھائیں۔ Escape غیر فعال ہے، لیکن آپ باہر کلک کرکے ابھی بھی اسے بند کر سکتے ہیں۔'
    button: 'پینل کھولیں'
  medium:
    description: 'درمیانی لمبائی کا متن دکھانے والا پینل۔ باہر کلک کرنے سے یہ بند نہیں ہوگا۔'
