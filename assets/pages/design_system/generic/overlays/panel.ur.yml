page_title: پینل
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'ٹیب کے ساتھ پینل۔ اسے کھولیں، ٹیب بدلیں، F5 دبائیں — پینل اسی ٹیب پر دوبارہ کھلتا ہے۔'
    button: 'پینل کھولیں'
  simple:
    description: 'ایک سادہ پینل دکھائیں۔ آپ اسے Escape دباکر یا پینل کے باہر کلک کرکے بند کر سکتے ہیں۔'
