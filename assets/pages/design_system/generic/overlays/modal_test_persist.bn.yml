content:
  overview: 'এটি সারসংক্ষেপ ট্যাব। ট্যাব পরিবর্তন করুন তারপর F5 প্রেস করুন — ওভারলে পুনরায় খুললে এই ট্যাবটি সক্রিয় থাকবে।'
  details: 'এটি বিস্তারিত ট্যাব। সক্রিয় ট্যাবটি URL হ্যাশে সংরক্ষিত হয়, তাই এটি পৃষ্ঠা রিলোডের সময় টিকে থাকে।'
  settings: 'এটি সেটিংস ট্যাব। উভয় ওভারলে (মোডাল/প্যানেল) এবং সক্রিয় ট্যাবটি URL হ্যাশ থেকে পুনরুদ্ধার করা হয়।'
  loading: 'নীচের বোতামগুলি ব্যবহার করে ম্যানুয়ালি লোডিং বার অ্যানিমেশন শুরু করুন। একটি ফর্ম জমা দেওয়ার সময় এই বারটি ওভারলের উপরে প্রদর্শিত হয়।'
