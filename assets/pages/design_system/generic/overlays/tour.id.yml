page_title: Tur
page_icon: 'ph:bold/signpost'
intro: 'Tur terpandu dari sebuah halaman: satu langkah demi langkah, elemen yang dimaksud akan diterangi di halaman yang redup dan sebuah kartu di sampingnya, dengan jalan masuk dan jalan keluar. Ini dimulai secara otomatis untuk pengunjung yang belum menyelesaikannya atau menolaknya — apa yang mereka lakukan disimpan, dan tidak akan kembali — dan elemen mana pun yang membawa data-tour-start akan memutarnya lagi. Tombol panah pada keyboard bergerak melaluinya, Escape keluar dari tur.'
start: 'Mulai tur'
status:
  none: 'Anda belum melihat tur ini — tur dimulai secara otomatis.'
  completed: 'Anda telah menyelesaikan tur ini; tur tidak akan dimulai secara otomatis lagi.'
  dismissed: 'Anda menutup tur ini sebelum selesai; tur tidak akan dimulai secara otomatis lagi.'
