page_title: پنل
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'پنل با زبانه‌ها. آن را باز کنید، زبانه‌ها را عوض کنید، کلید F5 را فشار دهید — پنل دوباره روی همان زبانه باز می‌شود.'
    button: 'پنل را باز کن'
  simple:
    description: 'یک پنل ساده را نمایش دهید. می‌توانید با فشار دادن کلید Escape یا کلیک کردن در خارج از پنل آن را ببندید.'
    button: 'پنل را باز کن'
  components:
    description: 'پنلی با کامپوننت‌ها و یک تریگر نوتیفیکیشن نشان دهید. کلید Escape غیر فعال است، اما می‌توانید با کلیک در خارج از پنل آن را ببندید.'
    button: 'پنل را باز کن'
  medium:
    description: 'پنلی با متن متوسط را نمایش دهید. کلیک در خارج پنل آن را نخواهد بست.'
    button: 'پنل را باز کن'
  long:
    description: 'پنلی با متن طولانی نشان دهید. قبل از بستن از شما تأیید می‌خواهد.'
    button: 'پنل را باز کن'
  form_rendered:
    description: 'یک فرم دمو که در داخل پنل رندر شده را نشان دهید. کلید Escape و کلیک خارج غیر فعال است، و قبل از بستن اگر فرم تغییر یافته باشد از شما تأیید می‌خواهد.'
    button: 'پنل را باز کن'
  form_ajax:
    description: 'یک فرم دمو که در داخل پنل با استفاده از AJAX رندر شده را نشان دهید. کلید Escape و کلیک خارج غیر فعال است، و قبل از بستن اگر فرم تغییر یافته باشد از شما تأیید می‌خواهد.'
    button: 'پنل را باز کن'
  recursive:
    description: 'یک صفحه دیالوگ را در داخل دیالوگ دیگری باز کنید — حالت یا پنل را انتخاب کنید.'
    button_modal: 'باز کردن در حالت مدال'
    button_panel: 'باز کردن در پنل'
