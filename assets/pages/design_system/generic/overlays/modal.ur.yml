~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ڈائیلاگ
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'ٹیب کے ساتھ موڈل۔ اسے کھولیں، ٹیب تبدیل کریں، F5 دبائیں — موڈل اسی ٹیب پر دوبارہ کھل جائے گا۔'
    button: 'موڈل کھولیں'
  simple:
    description: 'ایک سادہ موڈل دکھائیں۔ آپ اسے Escape سے بند کر سکتے ہیں یا موڈل کے باہر کلک کرکے۔'
    button: 'موڈل کھولیں'
  components:
    description: 'اجزاء اور ٹوسٹ ٹریگر کے ساتھ موڈل دکھائیں۔ Escape غیر فعال ہے، لیکن آپ اب بھی باہر کلک کرکے اسے بند کر سکتے ہیں۔'
    button: 'موڈل کھولیں'
  medium:
    description: 'درمیانے لمبائی کے متن کے ساتھ موڈل دکھائیں۔ باہر کلک کرنا اسے بند نہیں کرے گا۔'
    button: 'موڈل کھولیں'
  long:
    description: 'طویل متن کے ساتھ موڈل دکھائیں۔ یہ بند کرنے سے پہلے تصدیق چاہتا ہے۔'
    button: 'موڈل کھولیں'
  form_rendered:
    description: 'موڈل کے اندر ایک تیار کردہ ڈیمو فارم دکھائیں۔ Escape اور باہر کلک کرنا غیر فعال ہے، اور اگر فارم میں تبدیلی کی گئی تو یہ بند ہونے سے پہلے پوچھے گا۔'
    button: 'موڈل کھولیں'
  form_ajax:
    description: 'AJAX کا استعمال کرتے ہوئے موڈل کے اندر ایک تیار کردہ ڈیمو فارم دکھائیں۔ Escape اور باہر کلک کرنا غیر فعال ہے، اور اگر فارم میں تبدیلی کی گئی تو یہ بند ہونے سے پہلے پوچھے گا۔'
    button: 'موڈل کھولیں'
  recursive:
    description: 'ایک ڈائیلاگ کے اندر دوسرے ڈائیلاگ کا صفحہ کھولیں — موڈل یا پینل کا انتخاب کریں۔'
    button_modal: 'موڈل میں کھولیں'
    button_panel: 'پینل میں کھولیں'
