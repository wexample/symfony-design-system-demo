page_title: Rondleiding
page_icon: 'ph:bold/signpost'
intro: 'Een begeleide rondleiding door een pagina: stap voor stap, het element waar het om gaat wordt verlicht op een verduisterde pagina en een kaart ernaast, met de weg erin en de weg eruit. Het start automatisch voor een bezoeker die het nog niet heeft afgemaakt of afgewimpeld — wat ze deden wordt bewaard, en het komt niet terug — en elk element met data-tour-start speelt het opnieuw af. De pijlen van het toetsenbord navigeren erdoorheen, Escape verlaat het.'
start: 'Speel de rondleiding'
status:
  none: 'Je hebt deze rondleiding nog niet gezien — het start automatisch.'
  completed: 'Je hebt deze rondleiding doorlopen; het zal niet opnieuw automatisch starten.'
  dismissed: 'Je hebt deze rondleiding vóór het einde gesloten; het zal niet opnieuw automatisch starten.'
