page_title: פאנל
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'פאנל עם טאבים. פתח אותו, החלף טאבים, לחץ על F5 — הפאנל ייפתח שוב על אותו טאב.'
    button: 'פתח פאנל'
  simple:
    description: 'הצג פאנל פשוט. אפשר לסגור אותו עם Escape או על ידי לחיצה מחוץ לפאנל.'
    button: 'פתח פאנל'
  components:
    description: 'הצג פאנל עם רכיבים וטריגר להודעת toast. Escape מושבת, אבל אפשר עדיין ללחוץ מחוץ כדי לסגור אותו.'
    button: 'פתח פאנל'
  medium:
    description: 'הצג פאנל עם טקסט באורך בינוני. לחיצה מחוץ לא תסגור אותו.'
    button: 'פתח פאנל'
  long:
    description: 'הצג פאנל עם טקסט ארוך. הוא מבקש אישור לפני סגירה.'
    button: 'פתח פאנל'
  form_rendered:
    description: 'הצג טופס דמו מוכן בתוך פאנל. Escape ולחיצה מחוץ מושבתות, והוא מבקש אישור לפני סגירה אם הטופס שונה.'
    button: 'פתח פאנל'
  form_ajax:
    description: 'הצג טופס דמו מוכן בתוך פאנל באמצעות AJAX. Escape ולחיצה מחוץ מושבתות, והוא מבקש אישור לפני סגירה אם הטופס שונה.'
    button: 'פתח פאנל'
  recursive:
    description: 'פתח דף דיאלוג בתוך דיאלוג אחר — בחר מודאלי או פאנל.'
    button_modal: 'פתח במודאלי'
    button_panel: 'פתח בפאנל'
