page_title: Paneel
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'Paneel met tabbladen. Open het, wissel van tabblad, druk op F5 — het paneel opent opnieuw op hetzelfde tabblad.'
    button: 'Paneel openen'
  simple:
    description: 'Toon een eenvoudig paneel. Je kunt het sluiten met Escape of door buiten het paneel te klikken.'
    button: 'Paneel openen'
  components:
    description: 'Toon een paneel met componenten en een toast-trigger. Escape is uitgeschakeld, maar je kunt nog steeds buiten klikken om het te sluiten.'
    button: 'Paneel openen'
  medium:
    description: 'Toon een paneel met tekst van gemiddelde lengte. Klikken buiten zal het niet sluiten.'
    button: 'Paneel openen'
  long:
    description: 'Toon een paneel met lange tekst. Het vraagt om bevestiging voordat het sluit.'
    button: 'Paneel openen'
  form_rendered:
    description: 'Toon een weergegeven demoformulier binnen een paneel. Escape en buiten klikken zijn uitgeschakeld, en het vraagt voordat het sluit of het formulier is gewijzigd.'
    button: 'Paneel openen'
  form_ajax:
    description: 'Toon een weergegeven demoformulier binnen een paneel met AJAX. Escape en buiten klikken zijn uitgeschakeld, en het vraagt voordat het sluit of het formulier is gewijzigd.'
    button: 'Paneel openen'
  recursive:
    description: 'Open een dialoogpagina binnen een andere dialoog — kies modaal of paneel.'
    button_modal: 'Open in modaal'
    button_panel: 'Open in paneel'
