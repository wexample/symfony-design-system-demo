page_title: Panel
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'Panel mit Tabs. Öffne es, wechsle die Tabs, drücke F5 — das Panel öffnet sich wieder im selben Tab.'
    button: 'Panel öffnen'
  simple:
    description: 'Ein einfaches Panel anzeigen. Du kannst es mit Escape oder durch Klicken außerhalb des Panels schließen.'
    button: 'Panel öffnen'
  components:
    description: 'Ein Panel mit Komponenten und einem Toast-Trigger anzeigen. Escape ist deaktiviert, aber du kannst trotzdem außerhalb klicken, um es zu schließen.'
    button: 'Panel öffnen'
  medium:
    description: 'Ein Panel mit Text mittlerer Länge anzeigen. Ein Klick außerhalb schließt es nicht.'
    button: 'Panel öffnen'
  long:
    description: 'Ein Panel mit langem Text anzeigen. Es fragt nach Bestätigung, bevor es geschlossen wird.'
    button: 'Panel öffnen'
  form_rendered:
    description: 'Ein gerendertes Demofeld innerhalb eines Panels anzeigen. Escape und Klicks außerhalb sind deaktiviert, und es fragt vor dem Schließen, ob das Feld geändert wurde.'
    button: 'Panel öffnen'
  form_ajax:
    description: 'Ein gerendertes Demofeld innerhalb eines Panels mit AJAX anzeigen. Escape und Klicks außerhalb sind deaktiviert, und es fragt vor dem Schließen, ob das Feld geändert wurde.'
    button: 'Panel öffnen'
  recursive:
    description: 'Eine Dialogseite innerhalb eines anderen Dialogs öffnen — wähle modal oder Panel.'
    button_modal: 'Modales Fenster öffnen'
    button_panel: 'Panel öffnen'
