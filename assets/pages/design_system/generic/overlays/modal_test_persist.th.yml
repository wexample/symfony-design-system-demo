content:
  overview: 'นี่คือแท็บภาพรวม เปลี่ยนแท็บแล้วกด F5 — แท็บนี้จะยังคงเปิดอยู่เมื่อหน้าต่าง overlay กลับมาอีกครั้ง.'
  details: 'นี่คือแท็บรายละเอียด แท็บที่เปิดอยู่จะถูกเก็บใน URL hash ดังนั้นมันจะอยู่เมื่อรีโหลดหน้า.'
  settings: 'นี่คือแท็บการตั้งค่า ทั้ง overlay (โมดัล/พาแนล) และแท็บที่เปิดอยู่จะถูกกู้คืนจาก URL hash.'
  loading: 'ใช้ปุ่มด้านล่างเพื่อเรียกการเคลื่อนไหวของแถบการโหลดด้วยตนเอง แถบนี้จะแสดงที่ด้านบนของ overlay เมื่อมีการส่งแบบฟอร์มอยู่.'
