content:
  overview: 'هذه هي علامة التبويب نظرة عامة. قم بالتبديل بين علامات التبويب ثم اضغط F5 — ستظل هذه العلامة نشطة عندما يعاد فتح التراكب.'
  details: 'هذه هي علامة التبويب تفاصيل. يتم تخزين العلامة النشطة في تجزئة عنوان URL، لذا فهي تبقى قائمة عند إعادة تحميل الصفحة.'
  settings: 'هذه هي علامة التبويب إعدادات. يتم استعادة كل من التراكب (النموذج/اللوحة) والعلامة النشطة من تجزئة عنوان URL.'
  loading: 'استخدم الأزرار أدناه لتفعيل رسوم متحركة شريط التحميل يدويًا. يظهر هذا الشريط في أعلى التراكب عندما تكون عملية إرسال النموذج جارية.'
