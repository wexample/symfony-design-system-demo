~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ডায়ালগ
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'ট্যাব সহ মডাল। এটি খুলুন, ট্যাব পরিবর্তন করুন, F5 চাপুন — মডাল একই ট্যাবে আবার খোলে।'
    button: 'মডাল খুলুন'
  simple:
    description: 'একটি সাধারণ মডাল দেখান। আপনি এটি Escape চেপে অথবা মডালের বাইরের দিকে ক্লিক করে বন্ধ করতে পারেন।'
    button: 'মডাল খুলুন'
  components:
    description: 'উপাদান এবং একটি টোস্ট ট্রিগার সহ একটি মডাল দেখান। Escape অক্ষম, তবে আপনি এখনও বন্ধ করতে বাইরের দিকে ক্লিক করতে পারেন।'
    button: 'মডাল খুলুন'
  medium:
    description: 'মাঝারি দৈর্ঘ্যের টেক্সট সহ একটি মডাল দেখান। বাইরের দিকে ক্লিক করলে এটি বন্ধ হবে না।'
    button: 'মডাল খুলুন'
  long:
    description: 'দীর্ঘ টেক্সট সহ একটি মডাল দেখান। এটি বন্ধ করার আগে নিশ্চিতকরণ চায়।'
    button: 'মডাল খুলুন'
  form_rendered:
    description: 'একটি মডালের ভিতরে একটি রেন্ডার করা ডেমো ফর্ম দেখান। Escape এবং বাইরের ক্লিক অক্ষম, এবং যদি ফর্মটি পরিবর্তিত হয় তবে এটি বন্ধ করার আগে জিজ্ঞাসা করে।'
    button: 'মডাল খুলুন'
  form_ajax:
    description: 'AJAX ব্যবহার করে একটি মডালের ভিতরে একটি রেন্ডার করা ডেমো ফর্ম দেখান। Escape এবং বাইরের ক্লিক অক্ষম, এবং যদি ফর্মটি পরিবর্তিত হয় তবে এটি বন্ধ করার আগে জিজ্ঞাসা করে।'
    button: 'মডাল খুলুন'
  recursive:
    description: 'একটি ডায়ালগ পৃষ্ঠাকে অন্য একটি ডায়ালগের ভিতরে খুলুন — মডাল বা প্যানেল চয়ন করুন।'
    button_modal: 'মডালে খুলুন'
    button_panel: 'প্যানেলে খুলুন'
