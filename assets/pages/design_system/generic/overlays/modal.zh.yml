~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 对话框
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 带标签的模态框。打开它，切换标签，按F5——模态框将在同一标签上重新打开。
    button: 打开模态框
  simple:
    description: 显示一个简单的模态框。你可以按Escape键或点击模态框外部来关闭它。
    button: 打开模态框
  components:
    description: 显示一个包含组件和吐司触发器的模态框。Escape键被禁用，但你仍然可以点击外部来关闭它。
    button: 打开模态框
  medium:
    description: 显示一个中等长度文本的模态框。点击外部不会关闭它。
    button: 打开模态框
  long:
    description: 显示一个长文本的模态框。在关闭之前会要求确认。
    button: 打开模态框
  form_rendered:
    description: 在模态框内显示一个已渲染的演示表单。Escape键和外部点击被禁用，如果表单被修改，它会在关闭前询问。
    button: 打开模态框
  form_ajax:
    description: 在模态框内使用AJAX显示一个已渲染的演示表单。Escape键和外部点击被禁用，如果表单被修改，它会在关闭前询问。
    button: 打开模态框
  recursive:
    description: 在另一个对话框内打开一个对话框页面——选择模态框或面板。
    button_modal: 在模态框中打开
    button_panel: 在面板中打开
