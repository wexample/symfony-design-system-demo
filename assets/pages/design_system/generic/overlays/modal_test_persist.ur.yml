content:
  overview: 'یہ جائزہ ٹیب ہے۔ ٹیب تبدیل کریں پھر F5 دبائیں — یہ ٹیب اوورلے دوبارہ کھلنے پر بھی فعال رہے گا۔'
  details: 'یہ تفصیلات ٹیب ہے۔ فعال ٹیب URL ہیش میں محفوظ ہوتا ہے، اس لیے یہ صفحے کے دوبارہ لوڈ ہونے پر بھی برقرار رہتا ہے۔'
  settings: 'یہ ترتیبات ٹیب ہے۔ اوورلے (موڈل/پینل) اور فعال ٹیب دونوں URL ہیش سے بحال ہوتے ہیں۔'
  loading: 'نیچے دیے گئے بٹنوں کا استعمال کریں تاکہ دستی طور پر لوڈنگ بار کی حرکت کو متحرک کریں۔ یہ بار اوورلے کے اوپر اس وقت ظاہر ہوتی ہے جب فارم کی جمع کروانے کا عمل جاری ہو۔'
