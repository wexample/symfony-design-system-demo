~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ツアー
page_icon: 'ph:bold/signpost'
intro: 'ページのガイドツアー：一歩ずつ、その要素が薄暗いページで照らされ、その横にカードが表示され、進む道と出口が示されます。訪問者が終了やキャンセルをしていない場合は自動的に開始されます — 彼らが行ったことは保持され、再度表示されることはありません — データツアースタートを持つ要素がそれを再生します。キーボードの矢印で移動し、Escキーで終了します。'
start: ツアーを開始
status:
  none: 'このツアーはまだ見ていません — 自動的に開始されます。'
  completed: このツアーを終えました；再度自動的に開始することはありません。
  dismissed: ツアーを終了前に閉じました；再度自動的に開始することはありません。
area:
  filters:
    title: フィルター
    body: リストが表示する内容。
  list:
    title: リスト
    body: 存在するもの。
  export:
    title: エクスポート
    body: ページから出ていくもの。
step:
  welcome:
    title: ようこそ
    body: このページの簡単なツアーです。キーボードの矢印、または下のボタンを使用してください。
  filters:
    title: 絞り込み
    body: フィルターはリストが表示する内容を決定します；アドレスに保持されます。
  list:
    title: 存在するもの
    body: 各行はリストの横に詳細を表示します。
  export:
    title: 持って行く
    body: エクスポートはフィルターが保持した内容を取り出します、それ以上はありません。
