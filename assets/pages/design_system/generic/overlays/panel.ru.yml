page_title: Панель
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'Панель с вкладками. Откройте её, переключите вкладки, нажмите F5 — панель откроется на той же вкладке.'
    button: 'Открыть панель'
  simple:
    description: 'Показать простую панель. Вы можете закрыть её с помощью Esc или щелчка вне панели.'
    button: 'Открыть панель'
  components:
    description: 'Показать панель с компонентами и триггером тоста. Esc отключен, но вы все равно можете щелкнуть вне панели, чтобы закрыть её.'
    button: 'Открыть панель'
  medium:
    description: 'Показать панель со средним текстом. Щелчок вне не закроет её.'
    button: 'Открыть панель'
  long:
    description: 'Показать панель с длинным текстом. Запрашивает подтверждение перед закрытием.'
    button: 'Открыть панель'
  form_rendered:
    description: 'Показать отрендеренную демо-форму внутри панели. Esc и щелчок вне отключены, и она спрашивает перед закрытием, если форма была изменена.'
    button: 'Открыть панель'
  form_ajax:
    description: 'Показать отрендеренную демо-форму внутри панели с использованием AJAX. Esc и щелчок вне отключены, и она спрашивает перед закрытием, если форма была изменена.'
    button: 'Открыть панель'
  recursive:
    description: 'Открыть диалоговую страницу внутри другого диалога — выберите модальное окно или панель.'
    button_modal: 'Открыть в модальном окне'
    button_panel: 'Открыть в панели'
