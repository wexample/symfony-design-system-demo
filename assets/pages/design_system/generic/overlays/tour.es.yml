~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Tour
page_icon: 'ph:bold/signpost'
intro: 'Una visita guiada de una página: paso a paso, el elemento del que se trata iluminado en una página atenuada y una tarjeta al lado, con el camino de entrada y el de salida. Comienza por sí solo para un visitante que no lo ha terminado ni lo ha desestimado: lo que hicieron se mantiene, y no regresa; y cualquier elemento que lleve data-tour-start lo reproduce nuevamente. Las flechas del teclado permiten navegar por él, Escape lo cierra.'
start: 'Reproducir el tour'
status:
  none: 'No has visto este tour aún — comienza por sí solo.'
  completed: 'Has recorrido este tour; no comenzará por sí solo nuevamente.'
  dismissed: 'Cerraste este tour antes de que terminara; no comenzará por sí solo nuevamente.'
area:
  filters:
    title: Filtros
    body: 'Lo que muestra la lista.'
  list:
