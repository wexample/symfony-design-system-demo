~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Dialogi
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'Modal, jossa on välilehtiä. Avaa se, vaihda välilehtiä, paina F5 — modal avautuu uudelleen samalla välilehdellä.'
    button: 'Avaa modal'
  simple:
    description: 'Näytä yksinkertainen modal. Voit sulkea sen Escape-näppäimellä tai klikkaamalla modalin ulkopuolella.'
    button: 'Avaa modal'
  components:
    description: 'Näytä modal, jossa on komponentteja ja toast-laite. Escape on pois käytöstä, mutta voit silti klikata ulkopuolelle sulkeaksesi sen.'
    button: 'Avaa modal'
  medium:
    description: 'Näytä modal, jossa on keskipitkä teksti. Klikkaaminen ulkopuolelle ei sulje sitä.'
    button: 'Avaa modal'
  long:
    description: 'Näytä modal, jossa on pitkä teksti. Se kysyy vahvistuksen ennen sulkemista.'
    button: 'Avaa modal'
  form_rendered:
    description: 'Näytä renderöity demon muodossa modalin sisällä. Escape ja ulkopuolinen klikkaus on pois käytöstä, ja se kysyy ennen sulkemista, jos lomaketta on muokattu.'
    button: 'Avaa modal'
  form_ajax:
    description: 'Näytä renderöity demon muodossa modalin sisällä käyttäen AJAX:ia. Escape ja ulkopuolinen klikkaus on pois käytöstä, ja se kysyy ennen sulkemista, jos lomaketta on muokattu.'
    button: 'Avaa modal'
  recursive:
    description: 'Avaa dialogisivu toisen dialogin sisällä — valitse modal tai paneeli.'
    button_modal: 'Avaa modaalina'
    button_panel: 'Avaa paneelina'
