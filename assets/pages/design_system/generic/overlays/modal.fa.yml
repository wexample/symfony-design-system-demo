~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: دیالوگ
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'مدالی با تب‌ها. آن را باز کنید، تب‌ها را عوض کنید، کلید F5 را فشار دهید — مدال دوباره روی همان تب باز می‌شود.'
    button: 'باز کردن مدال'
  simple:
    description: 'یک مدال ساده نمایش دهید. می‌توانید با کلید Escape یا کلیک کردن خارج از مدال آن را ببندید.'
    button: 'باز کردن مدال'
  components:
    description: 'یک مدال با کامپوننت‌ها و یک تحریک توست نمایش دهید. کلید Escape غیرفعال است، اما می‌توانید همچنان با کلیک خارج، آن را ببندید.'
    button: 'باز کردن مدال'
  medium:
    description: 'یک مدال با متن متوسط نمایش دهید. کلیک کردن خارج آن را نمی‌بندد.'
    button: 'باز کردن مدال'
  long:
    description: 'یک مدال با متن طولانی نمایش دهید. قبل از بستن از شما تأیید می‌خواهد.'
    button: 'باز کردن مدال'
  form_rendered:
    description: 'یک فرم دمو رندر شده را درون یک مدال نمایش دهید. کلید Escape و کلیک خارج غیرفعال هستند و اگر فرم تغییر کرده باشد، قبل از بستن از شما سؤال می‌کند.'
    button: 'باز کردن مدال'
  form_ajax:
    description: 'یک فرم دمو رندر شده را درون یک مدال با استفاده از AJAX نمایش دهید. کلید Escape و کلیک خارج غیرفعال هستند و اگر فرم تغییر کرده باشد، قبل از بستن از شما سؤال می‌کند.'
    button: 'باز کردن مدال'
  recursive:
    description: 'یک صفحه دیالوگ را درون یک دیالوگ دیگر باز کنید — مدال یا پنل را انتخاب کنید.'
    button_modal: 'باز کردن در مدال'
    button_panel: 'باز کردن در پنل'
