en:
  page_title: Dock
  page_icon: ph:bold/rows

  intro: "A window docked at the foot of the screen, beside the page and not over it: nothing dims, nothing waits, the page stays usable. Its header folds it to its title and back. It takes a page the server renders — `target: 'dock'` — or what a script shows there, like a modal and a panel."
  section:
    page:
      description: "A page loaded in a dock (`button_target(…, 'dock')`). Open both: they stand side by side."
      button: Open a page
      button_long: Open a long page
    content:
      description: "What a script shows itself — `showInTarget(app, target, { title, body, actions })` — in a modal, a panel or a dock: the same shell as a page's, drawn in the browser."
      modal: In a modal
      panel: In a panel
      dock: In a dock
  content:
    title: Shown by a script
    body: No page was asked of the server for this window; the script that opened it wrote what it holds.

fr:
  page_title: Dock
  page_icon: 'ph:bold/rows'
  intro: "Une fenêtre ancrée au bas de l'écran, à côté de la page et non par-dessus : rien ne s'assombrit, rien n'attend, la page reste utilisable. Son en-tête la replie sur son titre et vice versa. Elle prend une page que le serveur rend — `target: 'dock'` — ou ce qu'un script y montre, comme un modal et un panneau."
  section:
    page:
      description: "Une page chargée dans un dock (`button_target(…, 'dock')`). Ouvrez les deux : ils se tiennent côte à côte."
      button: 'Ouvrir une page'
      button_long: 'Ouvrir une longue page'
    content:
      description: "Ce qu'un script montre — `showInTarget(app, target, { title, body, actions })` — dans un modal, un panneau ou un dock : la même structure que celle d'une page, dessinée dans le navigateur."
      modal: 'Dans un modal'
      panel: 'Dans un panneau'
      dock: 'Dans un dock'
  content:
    title: 'Montré par un script'
    body: "Aucune page n'a été demandée au serveur pour cette fenêtre ; le script qui l'a ouverte a écrit ce qu'elle contient."

zh:
  page_title: 停靠
  page_icon: 'ph:bold/rows'
  intro: "一个停靠在屏幕底部的窗口，紧挨着页面而不是覆盖在上面：没有任何变暗，没有任何等待，页面保持可用。它的标题可以折叠成标题和返回。它接受服务器渲染的页面 — `target: 'dock'` — 或者脚本在此显示的内容，比如模态框和面板。"
  section:
    page:
      description: "在停靠中加载的页面（`button_target(…, 'dock')`）。同时打开两个：它们并排显示。"
      button: 打开一个页面
      button_long: 打开一个长页面
    content:
      description: '脚本展示的内容 — `showInTarget(app, target, { title, body, actions })` — 在模态框、面板或停靠中：与页面相同的外壳，在浏览器中绘制。'
      modal: 在模态框中
      panel: 在面板中
      dock: 在停靠中
  content:
    title: 由脚本展示
    body: 此窗口没有向服务器请求页面；打开它的脚本写入了其内容。

ar:
  page_title: الشريط
  page_icon: 'ph:bold/rows'
  intro: "نافذة مثبتة في أسفل الشاشة، بجانب الصفحة وليس فوقها: لا شيء يتلاشى، لا شيء ينتظر، تبقى الصفحة قابلة للاستخدام. رأسها يطويها إلى عنوانها والعكس. تأخذ صفحة يتم عرضها من الخادم — `target: 'dock'` — أو ما يظهره السكريبت هناك، مثل نافذة منبثقة أو لوحة."
  section:
    page:
      description: "صفحة تم تحميلها في شريط (`button_target(…, 'dock')`). افتح كلاهما: يقفان جنبًا إلى جنب."
      button: 'افتح صفحة'
      button_long: 'افتح صفحة طويلة'
    content:
      description: 'ما يظهره السكريبت بنفسه — `showInTarget(app, target, { title, body, actions })` — في نافذة منبثقة، لوحة أو شريط: نفس القشرة مثل الصفحة، مرسومة في المتصفح.'
      modal: 'في نافذة منبثقة'
      panel: 'في لوحة'
      dock: 'في شريط'
  content:
    title: 'مُعرض بواسطة سكريبت'
    body: 'لم تُطلب أي صفحة من الخادم لهذه النافذة؛ السكريبت الذي فتحها كتب ما تحتويه.'

hi:
  page_title: डॉक
  page_icon: 'ph:bold/rows'
  intro: "स्क्रीन के नीचे, पृष्ठ के बगल में और इसके ऊपर नहीं, एक विंडो डॉक की गई है: कुछ भी मंद नहीं होता, कुछ भी इंतज़ार नहीं करता, पृष्ठ उपयोगी बना रहता है। इसका शीर्षक इसे उसके शीर्षक में और वापस मोड़ता है। यह एक पृष्ठ लेता है जिसे सर्वर प्रस्तुत करता है — `target: 'dock'` — या जो कुछ एक स्क्रिप्ट वहां दिखाती है, जैसे एक मोडल और एक पैनल।"
  section:
    page:
      description: "एक पृष्ठ जो डॉक में लोड किया गया है (`button_target(…, 'dock')`)। दोनों खोलें: वे बगल में खड़े होते हैं।"
      button: 'एक पृष्ठ खोलें'
      button_long: 'एक लंबा पृष्ठ खोलें'
    content:
      description: 'जो एक स्क्रिप्ट स्वयं दिखाती है — `showInTarget(app, target, { title, body, actions })` — एक मोडल, एक पैनल या एक डॉक में: पृष्ठ के समान खोल, जो ब्राउज़र में खींचा गया है।'
      modal: 'एक मोडल में'
      panel: 'एक पैनल में'
      dock: 'एक डॉक में'
  content:
    title: 'एक स्क्रिप्ट द्वारा दिखाया गया'
    body: 'इस विंडो के लिए सर्वर से कोई पृष्ठ नहीं मांगा गया; इसे खोले जाने वाली स्क्रिप्ट ने जो कुछ भी इसमें है, वही लिखा।'

he:
  page_title: דוק
  page_icon: 'ph:bold/rows'
  intro: "חלון שנמצא בתחתית המסך, ליד העמוד ולא מעליו: כלום לא מעומעם, כלום לא מחכה, העמוד נשאר נגיש. הכותרת שלו מקפלת אותו לכותרת שלו וחזרה. הוא לוקח עמוד שהשרת מציג — `target: 'dock'` — או מה שסקריפט מציג שם, כמו מודל ופאנל."
  section:
    page:
      description: "עמוד שנפתח בדוק (`button_target(…, 'dock')`). פתח את שניהם: הם עומדים זה לצד זה."
      button: 'פתח עמוד'
      button_long: 'פתח עמוד ארוך'
    content:
      description: 'מה שסקריפט מציג — `showInTarget(app, target, { title, body, actions })` — במודל, פאנל או דוק: אותו מסגרת כמו של עמוד, מוצג בדפדפן.'
      modal: במודל
      panel: בפאנל
      dock: בדוק
  content:
    title: 'מוצג על ידי סקריפט'
    body: 'לא נדרש עמוד מהשרת עבור חלון זה; הסקריפט שפתח אותו כתב מה שהוא מחזיק.'

fa:
  page_title: داک
  page_icon: 'ph:bold/rows'
  intro: "یک پنجره که در پایین صفحه قرار دارد، در کنار صفحه و نه روی آن: هیچ چیز کم رنگ نمی‌شود، هیچ چیزی منتظر نمی‌ماند، صفحه قابل استفاده باقی می‌ماند. هدر آن به عنوان عنوانش جمع می‌شود و دوباره باز می‌شود. این یک صفحه است که سرور آن را رندر می‌کند — `target: 'dock'` — یا چیزی که یک اسکریپت در آن نشان می‌دهد، مانند یک مدال و یک پنل."
  section:
    page:
      description: "یک صفحه بارگذاری شده در داک (`button_target(…, 'dock')`). هر دو را باز کنید: آنها در کنار هم قرار می‌گیرند."
      button: 'باز کردن یک صفحه'
      button_long: 'باز کردن یک صفحه طولانی'
    content:
      description: 'آنچه یک اسکریپت خود را نشان می‌دهد — `showInTarget(app, target, { title, body, actions })` — در یک مدال، یک پنل یا یک داک: همان پوسته‌ای که یک صفحه دارد، در مرورگر کشیده شده است.'
      modal: 'در یک مدال'
      panel: 'در یک پنل'
      dock: 'در یک داک'
  content:
    title: 'توسط یک اسکریپت نشان داده شده'
    body: 'هیچ صفحه‌ای از سرور برای این پنجره درخواست نشده است؛ اسکریپتی که آن را باز کرد، آنچه را که دارد نوشت.'

ur:
  page_title: ڈوک
  page_icon: 'ph:bold/rows'
  intro: "اسکرین کے نیچے ایک ونڈو جو صفحے کے ساتھ ساتھ ہے اور اس پر نہیں ہے: کچھ مدھم نہیں ہوتا، کچھ انتظار نہیں کرتا، صفحہ استعمال کے قابل رہتا ہے۔ اس کا ہیڈر اسے اس کے عنوان میں اور واپس سمیٹ لیتا ہے۔ یہ ایک صفحے کو لیتا ہے جسے سرور رینڈر کرتا ہے — `target: 'dock'` — یا جو ایک اسکرپٹ وہاں دکھاتا ہے، جیسے کہ ایک موڈل اور ایک پینل۔"
  section:
    page:
      description: "ایک ڈوک میں لوڈ ہونے والا صفحہ (`button_target(…, 'dock')`)۔ دونوں کھولیں: وہ ایک ساتھ کھڑے ہیں۔"
      button: 'ایک صفحہ کھولیں'
      button_long: 'ایک طویل صفحہ کھولیں'
    content:
      description: 'جو ایک اسکرپٹ خود دکھاتا ہے — `showInTarget(app, target, { title, body, actions })` — ایک موڈل، ایک پینل یا ایک ڈوک میں: ایک صفحے کا وہی خول، جو براؤزر میں کھینچا گیا ہے۔'
      modal: 'ایک موڈل میں'
      panel: 'ایک پینل میں'
      dock: 'ایک ڈوک میں'
  content:
    title: 'ایک اسکرپٹ کے ذریعہ دکھایا گیا'
    body: 'اس ونڈو کے لیے سرور سے کوئی صفحہ نہیں مانگا گیا؛ جس اسکرپٹ نے اسے کھولا اس نے جو کچھ یہ رکھتا ہے وہ لکھا۔'

ja:
  page_title: ドック
  page_icon: 'ph:bold/rows'
  intro: "画面の下部にドッキングされたウィンドウで、ページの横にあり、上に重ならない：何も暗くならず、何も待機せず、ページは操作可能なままです。そのヘッダーはタイトルに折りたたまれ、元に戻ります。サーバーがレンダリングするページを取り込みます — `target: 'dock'` — または、モーダルやパネルのように、スクリプトがそこに表示するものを取り込みます。"
  section:
    page:
      description: "ドック内に読み込まれたページ（`button_target(…, 'dock')`）。両方を開くと、並んで表示されます。"
      button: ページを開く
      button_long: 長いページを開く
    content:
      description: 'スクリプトが自ら表示するもの — `showInTarget(app, target, { title, body, actions })` — モーダル、パネル、またはドック内に：ページと同じシェルがブラウザに描画されます。'
      modal: モーダル内
      panel: パネル内
      dock: ドック内
  content:
    title: スクリプトによって表示された
    body: このウィンドウのためにサーバーにページは要求されていません；それを開いたスクリプトが保持する内容を書きました。

ko:
  page_title: 독
  page_icon: 'ph:bold/rows'
  intro: "화면 하단에 고정된 창으로, 페이지 옆에 위치하고 페이지 위에 있지 않음: 아무것도 흐릿해지지 않고, 아무것도 기다리지 않으며, 페이지는 사용 가능합니다. 헤더는 제목으로 접었다가 다시 펼칠 수 있습니다. 서버가 렌더링한 페이지를 가져오거나 — `target: 'dock'` — 모달이나 패널처럼 스크립트가 그곳에 표시하는 내용을 가져옵니다."
  section:
    page:
      description: "독에 로드된 페이지 (`button_target(…, 'dock')`). 둘 다 열면 나란히 표시됩니다."
      button: '페이지 열기'
      button_long: '긴 페이지 열기'
    content:
      description: '스크립트가 자체적으로 보여주는 내용 — `showInTarget(app, target, { title, body, actions })` — 모달, 패널 또는 독에서: 페이지와 동일한 쉘로 브라우저에 그려집니다.'
      modal: 모달에서
      panel: 패널에서
      dock: 독에서
  content:
    title: '스크립트에 의해 표시됨'
    body: '이 창을 위해 서버에 요청된 페이지는 없으며, 이를 열었던 스크립트가 담고 있는 내용을 작성했습니다.'

bn:
  page_title: ডক
  page_icon: 'ph:bold/rows'
  intro: "স্ক্রীনের নিচে পেজের পাশে, এর উপর নয় এমন একটি উইন্ডো ডক করা হয়েছে: কিছু নষ্ট হয় না, কিছু অপেক্ষা করে না, পেজ ব্যবহারযোগ্য থাকে। এর হেডার এটি তার শিরোনামে ভাঁজ করে এবং পরে আবার। এটি একটি পেজ গ্রহণ করে যা সার্ভার রেন্ডার করে — `target: 'dock'` — অথবা যা একটি স্ক্রিপ্ট সেখানে দেখায়, যেমন একটি মোডাল এবং একটি প্যানেল।"
  section:
    page:
      description: "একটি ডকে লোড করা পেজ (`button_target(…, 'dock')`)। উভয়টি খুলুন: তারা পাশাপাশি দাঁড়িয়ে থাকে।"
      button: 'একটি পেজ খুলুন'
      button_long: 'একটি লম্বা পেজ খুলুন'
    content:
      description: 'যা একটি স্ক্রিপ্ট নিজেই দেখায় — `showInTarget(app, target, { title, body, actions })` — একটি মোডাল, একটি প্যানেল বা একটি ডকে: এটি একটি পেজের মতো একই শেল, ব্রাউজারে অঙ্কিত।'
      modal: 'একটি মোডালে'
      panel: 'একটি প্যানেলে'
      dock: 'একটি ডকে'
  content:
    title: 'একটি স্ক্রিপ্ট দ্বারা প্রদর্শিত'
    body: 'এই উইন্ডোর জন্য সার্ভার থেকে কোন পেজের আবেদন করা হয়নি; এটি খুলে দেয়া স্ক্রিপ্ট যা এটি ধারণ করে তাতে লিখেছে।'

th:
  page_title: ด็อก
  page_icon: 'ph:bold/rows'
  intro: "หน้าต่างที่ถูกยึดที่ด้านล่างของหน้าจอ ข้างๆ หน้าต่างและไม่ทับซ้อน: ไม่มีสิ่งใดมืดลง ไม่มีสิ่งใดรอ หน้าเว็บยังสามารถใช้งานได้ หัวข้อของมันพับไปที่ชื่อและกลับมา มันรับหน้าจากเซิร์ฟเวอร์ — `target: 'dock'` — หรือสิ่งที่สคริปต์แสดงที่นั่น เช่น โมดัลและแผง."
  section:
    page:
      description: "หน้าเว็บที่โหลดในด็อก (`button_target(…, 'dock')`). เปิดทั้งสอง: พวกมันยืนอยู่ข้างกัน."
      button: เปิดหน้าเว็บ
      button_long: เปิดหน้ายาว
    content:
      description: 'สิ่งที่สคริปต์แสดงเอง — `showInTarget(app, target, { title, body, actions })` — ในโมดัล แผง หรือด็อก: เปลือกเดียวกับหน้าเว็บ วาดในเบราว์เซอร์.'
      modal: ในโมดัล
      panel: ในแผง
      dock: ในด็อก
  content:
    title: แสดงโดยสคริปต์
    body: 'ไม่มีหน้าที่ร้องขอจากเซิร์ฟเวอร์สำหรับหน้าต่างนี้; สคริปต์ที่เปิดมันเขียนสิ่งที่มันถืออยู่.'

de:
  page_title: Dock
  page_icon: 'ph:bold/rows'
  intro: "Ein Fenster, das am Fuß des Bildschirms angedockt ist, neben der Seite und nicht darüber: nichts wird dunkler, nichts wartet, die Seite bleibt benutzbar. Ihr Header klappt sie auf ihren Titel und zurück. Sie nimmt eine Seite, die der Server rendert — `target: 'dock'` — oder was ein Skript dort anzeigt, wie ein Modal und ein Panel."
  section:
    page:
      description: "Eine Seite, die in einem Dock geladen wurde (`button_target(…, 'dock')`). Beide öffnen: sie stehen nebeneinander."
      button: 'Eine Seite öffnen'
      button_long: 'Eine lange Seite öffnen'
    content:
      description: 'Was ein Skript selbst anzeigt — `showInTarget(app, target, { title, body, actions })` — in einem Modal, einem Panel oder einem Dock: dasselbe Shell wie bei einer Seite, im Browser dargestellt.'
      modal: 'In einem Modal'
      panel: 'In einem Panel'
      dock: 'In einem Dock'
  content:
    title: 'Von einem Skript angezeigt'
    body: 'Es wurde keine Seite vom Server für dieses Fenster angefordert; das Skript, das es geöffnet hat, schrieb, was es enthält.'

fi:
  page_title: Telakka
  page_icon: 'ph:bold/rows'
  intro: "Ikkuna, joka on kiinnitetty näytön alaosaan, sivulle sivun vieressä eikä sen päällä: mikään ei himmene, mikään ei odota, sivu pysyy käytettävissä. Sen yläosa taittaa sen otsikoksi ja takaisin. Se ottaa sivun, jonka palvelin renderoi — `target: 'dock'` — tai mitä skripti näyttää siellä, kuten modaalin ja paneelin."
  section:
    page:
