content:
  overview: 'これは概要タブです。タブを切り替えてからF5を押してください — オーバーレイが再オープンするとき、このタブはまだアクティブのままです。'
  details: これは詳細タブです。アクティブなタブはURLのハッシュに保存されているため、ページのリロード時にも維持されます。
  settings: これは設定タブです。オーバーレイ（モーダル／パネル）とアクティブなタブは、URLのハッシュから復元されます。
  loading: 以下のボタンを使用して、手動で読み込みバーのアニメーションをトリガーします。このバーは、フォーム送信が進行中のときにオーバーレイの上部に表示されます。
loading:
  start: 開始
  end: 完了
  simulate: シミュレート（自動補完）
