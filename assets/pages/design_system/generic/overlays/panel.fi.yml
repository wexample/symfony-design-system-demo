page_title: Paneeli
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'Paneeli, jossa on välilehdet. Avaa se, vaihda välilehtiä, paina F5 — paneeli avautuu uudelleen samalle välilehdelle.'
    button: 'Avaa paneeli'
  simple:
    description: 'Näytä yksinkertainen paneeli. Voit sulkea sen Escape-näppäimellä tai klikkaamalla paneelin ulkopuolella.'
    button: 'Avaa paneeli'
  components:
    description: 'Näytä paneeli komponenteilla ja toast-triggerillä. Escape on pois käytöstä, mutta voit silti klikata ulkopuolella sulkeaksesi sen.'
    button: 'Avaa paneeli'
  medium:
    description: 'Näytä paneeli keskikokoisella tekstillä. Klikkaaminen ulkopuolella ei sulje sitä.'
    button: 'Avaa paneeli'
  long:
    description: 'Näytä paneeli pitkällä tekstillä. Se kysyy vahvistusta ennen sulkemista.'
    button: 'Avaa paneeli'
  form_rendered:
    description: 'Näytä renderoitu demo-lomake paneelin sisällä. Escape ja ulkopuolinen klikkaus ovat pois käytöstä, ja se kysyy ennen sulkemista, jos lomaketta on muokattu.'
    button: 'Avaa paneeli'
  form_ajax:
    description: 'Näytä renderoitu demo-lomake paneelin sisällä AJAX:n avulla. Escape ja ulkopuolinen klikkaus ovat pois käytöstä, ja se kysyy ennen sulkemista, jos lomaketta on muokattu.'
    button: 'Avaa paneeli'
  recursive:
    description: 'Avaa dialogisivu toisen dialogin sisällä — valitse modaalinen tai paneeli.'
    button_modal: 'Avaa modaalina'
    button_panel: 'Avaa paneelina'
