page_title: Wycieczka
page_icon: 'ph:bold/signpost'
intro: 'Prowadzona wycieczka po stronie: krok po kroku, element, którego dotyczy, podświetlony na przyciemnionej stronie, a obok niego karta z drogą do i z niej. Rozpoczyna się automatycznie dla odwiedzającego, który ani nie zakończył, ani nie odrzucił wycieczki — to, co zrobili, jest zachowane i nie wraca — a każdy element z danymi data-tour-start uruchamia ją ponownie. Strzałki na klawiaturze poruszają się przez nią, a klawisz Escape ją zamyka.'
start: 'Rozpocznij wycieczkę'
status:
  none: 'Nie widziałeś jeszcze tej wycieczki — rozpoczyna się automatycznie.'
  completed: 'Przeszedłeś tę wycieczkę; nie rozpocznie się ponownie automatycznie.'
  dismissed: 'Zamknąłeś tę wycieczkę przed jej zakończeniem; nie rozpocznie się ponownie automatycznie.'
