content:
  overview: 'این زبانه مرور است. زبانه‌ها را عوض کنید و سپس F5 را فشار دهید — این زبانه هنوز فعال خواهد بود وقتی که پوشش دوباره باز می‌شود.'
  details: 'این زبانه جزئیات است. زبانه فعال در هش URL ذخیره می‌شود، بنابراین در هنگام بارگذاری مجدد صفحه باقی می‌ماند.'
  settings: 'این زبانه تنظیمات است. هم پوشش (مدال/پنل) و هم زبانه فعال از هش URL بازیابی می‌شوند.'
  loading: 'از دکمه‌های زیر برای فعال‌سازی دستی انیمیشن نوار بارگذاری استفاده کنید. این نوار در بالای پوشش زمانی که یک ارسال فرم در حال انجام است، ظاهر می‌شود.'
