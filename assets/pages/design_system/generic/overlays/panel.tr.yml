page_title: Panel
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'Sekmeli panel. Açın, sekmeleri değiştirin, F5 tuşuna basın — panel aynı sekmede yeniden açılır.'
    button: 'Paneli aç'
  simple:
    description: 'Basit bir panel göster. Escape tuşuyla veya panelin dışına tıklayarak kapatabilirsin.'
    button: 'Paneli aç'
  components:
    description: 'Bileşenler ve bir toast tetikleyici içeren bir panel göster. Escape devre dışı, ancak yine de kapatmak için dışarıya tıklayabilirsin.'
    button: 'Paneli aç'
  medium:
    description: 'Orta uzunlukta metin içeren bir panel göster. Dışarıya tıklamak paneli kapatmaz.'
    button: 'Paneli aç'
  long:
    description: 'Uzun metin içeren bir panel göster. Kapatmadan önce onay ister.'
    button: 'Paneli aç'
  form_rendered:
    description: 'Bir panel içinde işlenmiş bir demo formu göster. Escape ve dışarıya tıklama devre dışı, form değiştirilmişse kapatmadan önce onay ister.'
    button: 'Paneli aç'
  form_ajax:
    description: 'AJAX kullanarak bir panel içinde işlenmiş bir demo formu göster. Escape ve dışarıya tıklama devre dışı, form değiştirilmişse kapatmadan önce onay ister.'
    button: 'Paneli aç'
  recursive:
    description: 'Bir diyalog penceresi içinde başka bir diyalog sayfası aç — modal veya panel seç.'
    button_modal: 'Modalda aç'
    button_panel: 'Panelde aç'
