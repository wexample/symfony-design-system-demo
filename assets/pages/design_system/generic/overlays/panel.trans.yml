en:
  page_title: Panel
  page_icon: ph:bold/sidebar-simple-duotone

  section:
    persist:
      description: "Panel with tabs. Open it, switch tabs, press F5 — the panel reopens on the same tab."
      button: Open panel
    simple:
      description: Show a simple panel. You can close it with Escape or by clicking outside the panel.
      button: Open panel
    components:
      description: Show a panel with components and a toast trigger. Escape is disabled, but you can still click outside to close it.
      button: Open panel
    medium:
      description: Show a panel with medium-length text. Clicking outside will not close it.
      button: Open panel
    long:
      description: Show a panel with long text. It asks for confirmation before closing.
      button: Open panel
    form_rendered:
      description: Show a rendered demo form inside a panel. Escape and outside click are disabled, and it asks before closing if the form was modified.
      button: Open panel
    form_ajax:
      description: Show a rendered demo form inside a panel using AJAX. Escape and outside click are disabled, and it asks before closing if the form was modified.
      button: Open panel
    recursive:
      description: Open a dialog page inside another dialog — choose modal or panel.
      button_modal: Open in modal
      button_panel: Open in panel

ar:
  page_title: لوحة
  page_icon: 'ph:bold/sidebar-simple-duotone'
  section:
    persist:
      description: 'لوحة مع علامات تبويب. افتحها، قم بالتبديل بين علامات التبويب، اضغط F5 — ستفتح اللوحة مرة أخرى على نفس علامة التبويب.'
      button: 'افتح اللوحة'
    simple:
      description: 'عرض لوحة بسيطة. يمكنك إغلاقها باستخدام مفتاح الهروب أو بالنقر خارج اللوحة.'
      button: 'افتح اللوحة'
    components:
      description: 'عرض لوحة مع مكونات وزر إشعار. مفتاح الهروب معطل، لكن يمكنك النقر خارج اللوحة لإغلاقها.'
      button: 'افتح اللوحة'
    medium:
      description: 'عرض لوحة بنص متوسط الطول. النقر خارجها لن يغلقها.'
      button: 'افتح اللوحة'
    long:
      description: 'عرض لوحة بنص طويل. يطلب تأكيدًا قبل الإغلاق.'
      button: 'افتح اللوحة'
    form_rendered:
      description: 'عرض نموذج عرض داخل لوحة. مفتاح الهروب والنقر الخارجي معطلان، ويطلب تأكيدًا قبل الإغلاق إذا تم تعديل النموذج.'
      button: 'افتح اللوحة'
    form_ajax:
      description: 'عرض نموذج عرض داخل لوحة باستخدام AJAX. مفتاح الهروب والنقر الخارجي معطلان، ويطلب تأكيدًا قبل الإغلاق إذا تم تعديل النموذج.'
      button: 'افتح اللوحة'
    recursive:
      description: 'افتح صفحة حوار داخل حوار آخر — اختر الوضع أو اللوحة.'
      button_modal: 'افتح في نافذة منبثقة'
      button_panel: 'افتح في لوحة'

bn:
  page_title: প্যানেল
  page_icon: 'ph:bold/sidebar-simple-duotone'
  section:
    persist:
      description: 'ট্যাব সহ প্যানেল। এটি খুলুন, ট্যাব পরিবর্তন করুন, F5 চাপুন — প্যানেল একই ট্যাবে পুনরায় খোলে।'
      button: 'প্যানেল খুলুন'
    simple:
      description: 'একটি সাধারণ প্যানেল দেখান। আপনি এটি Escape চাপিয়ে বা প্যানেলের বাইরে ক্লিক করে বন্ধ করতে পারেন।'
      button: 'প্যানেল খুলুন'
    components:
      description: 'কম্পোনেন্ট এবং একটি টোস্ট ট্রিগার সহ একটি প্যানেল দেখান। Escape নিষ্ক্রিয়, তবে আপনি এখনও বাইরে ক্লিক করে এটি বন্ধ করতে পারেন।'
      button: 'প্যানেল খুলুন'
    medium:
      description: 'মাঝারি দৈর্ঘ্যের টেক্সট সহ একটি প্যানেল দেখান। বাইরে ক্লিক করলে এটি বন্ধ হবে না।'
      button: 'প্যানেল খুলুন'
    long:
      description: 'দীর্ঘ টেক্সট সহ একটি প্যানেল দেখান। এটি বন্ধ করার আগে নিশ্চিতকরণ চায়।'
      button: 'প্যানেল খুলুন'
    form_rendered:
      description: 'একটি প্যানেলের মধ্যে একটি রেন্ডার করা ডেমো ফর্ম দেখান। Escape এবং বাইরের ক্লিক নিষ্ক্রিয়, এবং ফর্ম পরিবর্তিত হলে এটি বন্ধ করার আগে জিজ্ঞাসা করে।'
      button: 'প্যানেল খুলুন'
    form_ajax:
      description: 'AJAX ব্যবহার করে একটি প্যানেলের মধ্যে একটি রেন্ডার করা ডেমো ফর্ম দেখান। Escape এবং বাইরের ক্লিক নিষ্ক্রিয়, এবং ফর্ম পরিবর্তিত হলে এটি বন্ধ করার আগে জিজ্ঞাসা করে।'
      button: 'প্যানেল খুলুন'
    recursive:
      description: 'একটি ডায়ালগ পৃষ্ঠাকে অন্য ডায়ালগের মধ্যে খুলুন — মডাল বা প্যানেল চয়ন করুন।'
      button_modal: 'মডালে খুলুন'
      button_panel: 'প্যানেলে খুলুন'

de:
  page_title: Panel
  page_icon: 'ph:bold/sidebar-simple-duotone'
  section:
    persist:
      description: 'Panel mit Tabs. Öffne es, wechsle die Tabs, drücke F5 — das Panel öffnet sich wieder im selben Tab.'
      button: 'Panel öffnen'
    simple:
      description: 'Ein einfaches Panel anzeigen. Du kannst es mit Escape oder durch Klicken außerhalb des Panels schließen.'
      button: 'Panel öffnen'
    components:
      description: 'Ein Panel mit Komponenten und einem Toast-Trigger anzeigen. Escape ist deaktiviert, aber du kannst trotzdem außerhalb klicken, um es zu schließen.'
      button: 'Panel öffnen'
    medium:
      description: 'Ein Panel mit Text mittlerer Länge anzeigen. Ein Klick außerhalb schließt es nicht.'
      button: 'Panel öffnen'
    long:
      description: 'Ein Panel mit langem Text anzeigen. Es fragt nach Bestätigung, bevor es geschlossen wird.'
      button: 'Panel öffnen'
    form_rendered:
      description: 'Ein gerendertes Demofeld innerhalb eines Panels anzeigen. Escape und Klicks außerhalb sind deaktiviert, und es fragt vor dem Schließen, ob das Feld geändert wurde.'
      button: 'Panel öffnen'
    form_ajax:
      description: 'Ein gerendertes Demofeld innerhalb eines Panels mit AJAX anzeigen. Escape und Klicks außerhalb sind deaktiviert, und es fragt vor dem Schließen, ob das Feld geändert wurde.'
      button: 'Panel öffnen'
    recursive:
      description: 'Eine Dialogseite innerhalb eines anderen Dialogs öffnen — wähle modal oder Panel.'
      button_modal: 'Modales Fenster öffnen'
      button_panel: 'Panel öffnen'

es:
  page_title: Panel
  page_icon: 'ph:bold/sidebar-simple-duotone'
  section:
    persist:
      description: 'Panel con pestañas. Ábrelo, cambia de pestañas, presiona F5 — el panel se reabre en la misma pestaña.'
      button: 'Abrir panel'
    simple:
      description: 'Mostrar un panel simple. Puedes cerrarlo con Escape o haciendo clic fuera del panel.'
      button: 'Abrir panel'
    components:
      description: 'Mostrar un panel con componentes y un disparador de toast. Escape está deshabilitado, pero aún puedes hacer clic fuera para cerrarlo.'
      button: 'Abrir panel'
    medium:
      description: 'Mostrar un panel con texto de longitud media. Hacer clic fuera no lo cerrará.'
      button: 'Abrir panel'
    long:
      description: 'Mostrar un panel con texto largo. Pide confirmación antes de cerrar.'
      button: 'Abrir panel'
    form_rendered:
      description: 'Mostrar un formulario de demostración renderizado dentro de un panel. Escape y clic fuera están deshabilitados, y pide confirmación antes de cerrar si se ha modificado el formulario.'
      button: 'Abrir panel'
    form_ajax:
      description: 'Mostrar un formulario de demostración renderizado dentro de un panel usando AJAX. Escape y clic fuera están deshabilitados, y pide confirmación antes de cerrar si se ha modificado el formulario.'
      button: 'Abrir panel'
    recursive:
      description: 'Abrir una página de diálogo dentro de otro diálogo — elegir modal o panel.'
      button_modal: 'Abrir en modal'
      button_panel: 'Abrir en panel'

fa:
  page_title: پنل
  page_icon: 'ph:bold/sidebar-simple-duotone'
  section:
    persist:
      description: 'پنل با زبانه‌ها. آن را باز کنید، زبانه‌ها را عوض کنید، کلید F5 را فشار دهید — پنل دوباره روی همان زبانه باز می‌شود.'
      button: 'پنل را باز کن'
    simple:
      description: 'یک پنل ساده را نمایش دهید. می‌توانید با فشار دادن کلید Escape یا کلیک کردن در خارج از پنل آن را ببندید.'
      button: 'پنل را باز کن'
    components:
      description: 'پنلی با کامپوننت‌ها و یک تریگر نوتیفیکیشن نشان دهید. کلید Escape غیر فعال است، اما می‌توانید با کلیک در خارج از پنل آن را ببندید.'
      button: 'پنل را باز کن'
    medium:
      description: 'پنلی با متن متوسط را نمایش دهید. کلیک در خارج پنل آن را نخواهد بست.'
      button: 'پنل را باز کن'
    long:
      description: 'پنلی با متن طولانی نشان دهید. قبل از بستن از شما تأیید می‌خواهد.'
      button: 'پنل را باز کن'
    form_rendered:
      description: 'یک فرم دمو که در داخل پنل رندر شده را نشان دهید. کلید Escape و کلیک خارج غیر فعال است، و قبل از بستن اگر فرم تغییر یافته باشد از شما تأیید می‌خواهد.'
      button: 'پنل را باز کن'
    form_ajax:
      description: 'یک فرم دمو که در داخل پنل با استفاده از AJAX رندر شده را نشان دهید. کلید Escape و کلیک خارج غیر فعال است، و قبل از بستن اگر فرم تغییر یافته باشد از شما تأیید می‌خواهد.'
      button: 'پنل را باز کن'
    recursive:
      description: 'یک صفحه دیالوگ را در داخل دیالوگ دیگری باز کنید — حالت یا پنل را انتخاب کنید.'
      button_modal: 'باز کردن در حالت مدال'
      button_panel: 'باز کردن در پنل'

fi:
  page_title: Paneeli
  page_icon: 'ph:bold/sidebar-simple-duotone'
  section:
    persist:
      description: 'Paneeli, jossa on välilehdet. Avaa se, vaihda välilehtiä, paina F5 — paneeli avautuu uudelleen samalle välilehdelle.'
      button: 'Avaa paneeli'
    simple:
      description: 'Näytä yksinkertainen paneeli. Voit sulkea sen Escape-näppäimellä tai klikkaamalla paneelin ulkopuolella.'
      button: 'Avaa paneeli'
    components:
      description: 'Näytä paneeli komponenteilla ja toast-triggerillä. Escape on pois käytöstä, mutta voit silti klikata ulkopuolella sulkeaksesi sen.'
      button: 'Avaa paneeli'
    medium:
      description: 'Näytä paneeli keskikokoisella tekstillä. Klikkaaminen ulkopuolella ei sulje sitä.'
      button: 'Avaa paneeli'
    long:
      description: 'Näytä paneeli pitkällä tekstillä. Se kysyy vahvistusta ennen sulkemista.'
      button: 'Avaa paneeli'
    form_rendered:
      description: 'Näytä renderoitu demo-lomake paneelin sisällä. Escape ja ulkopuolinen klikkaus ovat pois käytöstä, ja se kysyy ennen sulkemista, jos lomaketta on muokattu.'
      button: 'Avaa paneeli'
    form_ajax:
      description: 'Näytä renderoitu demo-lomake paneelin sisällä AJAX:n avulla. Escape ja ulkopuolinen klikkaus ovat pois käytöstä, ja se kysyy ennen sulkemista, jos lomaketta on muokattu.'
      button: 'Avaa paneeli'
    recursive:
      description: 'Avaa dialogisivu toisen dialogin sisällä — valitse modaalinen tai paneeli.'
      button_modal: 'Avaa modaalina'
      button_panel: 'Avaa paneelina'

fr:
  page_title: Panneau
  page_icon: 'ph:bold/sidebar-simple-duotone'
  section:
    persist:
      description: "Panneau avec des onglets. Ouvrez-le, changez d'onglet, appuyez sur F5 — le panneau se rouvre sur le même onglet."
      button: 'Ouvrir le panneau'
    simple:
      description: 'Afficher un panneau simple. Vous pouvez le fermer avec Échap ou en cliquant en dehors du panneau.'
      button: 'Ouvrir le panneau'
    components:
      description: 'Afficher un panneau avec des composants et un déclencheur de toast. Échap est désactivé, mais vous pouvez toujours cliquer en dehors pour le fermer.'
      button: 'Ouvrir le panneau'
    medium:
      description: "Afficher un panneau avec un texte de longueur moyenne. Cliquer à l'extérieur ne le fermera pas."
      button: 'Ouvrir le panneau'
    long:
      description: 'Afficher un panneau avec un long texte. Il demande confirmation avant de se fermer.'
      button: 'Ouvrir le panneau'
    form_rendered:
      description: "Afficher un formulaire de démonstration rendu à l'intérieur d'un panneau. Échap et le clic extérieur sont désactivés, et il demande avant de fermer si le formulaire a été modifié."
      button: 'Ouvrir le panneau'
    form_ajax:
      description: "Afficher un formulaire de démonstration rendu à l'intérieur d'un panneau utilisant AJAX. Échap et le clic extérieur sont désactivés, et il demande avant de fermer si le formulaire a été modifié."
      button: 'Ouvrir le panneau'
    recursive:
      description: "Ouvrir une page de dialogue à l'intérieur d'un autre dialogue — choisissez modal ou panneau."
      button_modal: 'Ouvrir en modal'
      button_panel: 'Ouvrir en panneau'

he:
  page_title: פאנל
  page_icon: 'ph:bold/sidebar-simple-duotone'
  section:
    persist:
      description: 'פאנל עם טאבים. פתח אותו, החלף טאבים, לחץ על F5 — הפאנל ייפתח שוב על אותו טאב.'
      button: 'פתח פאנל'
    simple:
      description: 'הצג פאנל פשוט. אפשר לסגור אותו עם Escape או על ידי לחיצה מחוץ לפאנל.'
      button: 'פתח פאנל'
    components:
      description: 'הצג פאנל עם רכיבים וטריגר להודעת toast. Escape מושבת, אבל אפשר עדיין ללחוץ מחוץ כדי לסגור אותו.'
      button: 'פתח פאנל'
    medium:
      description: 'הצג פאנל עם טקסט באורך בינוני. לחיצה מחוץ לא תסגור אותו.'
      button: 'פתח פאנל'
    long:
      description: 'הצג פאנל עם טקסט ארוך. הוא מבקש אישור לפני סגירה.'
      button: 'פתח פאנל'
    form_rendered:
      description: 'הצג טופס דמו מוכן בתוך פאנל. Escape ולחיצה מחוץ מושבתות, והוא מבקש אישור לפני סגירה אם הטופס שונה.'
      button: 'פתח פאנל'
    form_ajax:
      description: 'הצג טופס דמו מוכן בתוך פאנל באמצעות AJAX. Escape ולחיצה מחוץ מושבתות, והוא מבקש אישור לפני סגירה אם הטופס שונה.'
      button: 'פתח פאנל'
    recursive:
      description: 'פתח דף דיאלוג בתוך דיאלוג אחר — בחר מודאלי או פאנל.'
      button_modal: 'פתח במודאלי'
      button_panel: 'פתח בפאנל'

hi:
  page_title: पैनल
  page_icon: 'ph:bold/sidebar-simple-duotone'
  section:
    persist:
      description: 'टैब्स वाला पैनल। इसे खोलें, टैब्स स्विच करें, F5 दबाएँ — पैनल उसी टैब पर फिर से खुलता है।'
      button: 'पैनल खोलें'
    simple:
      description: 'एक साधारण पैनल दिखाएँ। आप इसे Escape दबाकर या पैनल के बाहर क्लिक करके बंद कर सकते हैं।'
      button: 'पैनल खोलें'
    components:
      description: 'घटक और टोस्ट ट्रिगर वाला पैनल दिखाएँ। Escape बंद नहीं है, लेकिन आप अभी भी बाहर क्लिक करके इसे बंद कर सकते हैं।'
      button: 'पैनल खोलें'
    medium:
      description: 'मध्यम लंबाई के पाठ वाला पैनल दिखाएँ। बाहर क्लिक करने से यह बंद नहीं होगा।'
      button: 'पैनल खोलें'
    long:
      description: 'लंबे पाठ वाला पैनल दिखाएँ। बंद करने से पहले यह पुष्टि मांगता है।'
      button: 'पैनल खोलें'
    form_rendered:
      description: 'पैनल के अंदर एक प्रस्तुत डेमो फॉर्म दिखाएँ। Escape और बाहर क्लिक अक्षम हैं, और यदि फॉर्म को संशोधित किया गया है तो यह बंद करने से पहले पुष्टि मांगता है।'
      button: 'पैनल खोलें'
    form_ajax:
      description: 'AJAX का उपयोग करके एक प्रस्तुत डेमो फॉर्म पैनल के अंदर दिखाएँ। Escape और बाहर क्लिक अक्षम हैं, और यदि फॉर्म को संशोधित किया गया है तो यह बंद करने से पहले पुष्टि मांगता है।'
      button: 'पैनल खोलें'
    recursive:
      description: 'एक संवाद पृष्ठ को दूसरे संवाद के अंदर खोलें — मॉडल या पैनल चुनें।'
      button_modal: 'मॉडल में खोलें'
      button_panel: 'पैनल में खोलें'

id:
  page_title: Panel
  page_icon: 'ph:bold/sidebar-simple-duotone'
  section:
    persist:
      description: 'Panel dengan tab. Buka, ganti tab, tekan F5 — panel akan terbuka kembali pada tab yang sama.'
      button: 'Buka panel'
    simple:
      description: 'Tampilkan panel sederhana. Anda dapat menutupnya dengan Escape atau dengan mengklik di luar panel.'
      button: 'Buka panel'
    components:
      description: 'Tampilkan panel dengan komponen dan pemicu toast. Escape dinonaktifkan, tetapi Anda masih bisa mengklik di luar untuk menutupnya.'
      button: 'Buka panel'
    medium:
      description: 'Tampilkan panel dengan teks panjang sedang. Mengklik di luar tidak akan menutupnya.'
      button: 'Buka panel'
    long:
      description: 'Tampilkan panel dengan teks panjang. Panel ini meminta konfirmasi sebelum menutup.'
      button: 'Buka panel'
    form_rendered:
      description: 'Tampilkan formulir demo yang dirender di dalam panel. Escape dan klik di luar dinonaktifkan, dan akan meminta konfirmasi sebelum menutup jika formulir telah dimodifikasi.'
      button: 'Buka panel'
    form_ajax:
