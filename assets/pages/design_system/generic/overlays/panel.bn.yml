page_title: প্যানেল
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'ট্যাব সহ প্যানেল। এটি খুলুন, ট্যাব পরিবর্তন করুন, F5 চাপুন — প্যানেল একই ট্যাবে পুনরায় খোলে।'
    button: 'প্যানেল খুলুন'
  simple:
    description: 'একটি সাধারণ প্যানেল দেখান। আপনি এটি Escape চাপিয়ে বা প্যানেলের বাইরে ক্লিক করে বন্ধ করতে পারেন।'
    button: 'প্যানেল খুলুন'
  components:
    description: 'কম্পোনেন্ট এবং একটি টোস্ট ট্রিগার সহ একটি প্যানেল দেখান। Escape নিষ্ক্রিয়, তবে আপনি এখনও বাইরে ক্লিক করে এটি বন্ধ করতে পারেন।'
    button: 'প্যানেল খুলুন'
  medium:
    description: 'মাঝারি দৈর্ঘ্যের টেক্সট সহ একটি প্যানেল দেখান। বাইরে ক্লিক করলে এটি বন্ধ হবে না।'
    button: 'প্যানেল খুলুন'
  long:
    description: 'দীর্ঘ টেক্সট সহ একটি প্যানেল দেখান। এটি বন্ধ করার আগে নিশ্চিতকরণ চায়।'
    button: 'প্যানেল খুলুন'
  form_rendered:
    description: 'একটি প্যানেলের মধ্যে একটি রেন্ডার করা ডেমো ফর্ম দেখান। Escape এবং বাইরের ক্লিক নিষ্ক্রিয়, এবং ফর্ম পরিবর্তিত হলে এটি বন্ধ করার আগে জিজ্ঞাসা করে।'
    button: 'প্যানেল খুলুন'
  form_ajax:
    description: 'AJAX ব্যবহার করে একটি প্যানেলের মধ্যে একটি রেন্ডার করা ডেমো ফর্ম দেখান। Escape এবং বাইরের ক্লিক নিষ্ক্রিয়, এবং ফর্ম পরিবর্তিত হলে এটি বন্ধ করার আগে জিজ্ঞাসা করে।'
    button: 'প্যানেল খুলুন'
  recursive:
    description: 'একটি ডায়ালগ পৃষ্ঠাকে অন্য ডায়ালগের মধ্যে খুলুন — মডাল বা প্যানেল চয়ন করুন।'
    button_modal: 'মডালে খুলুন'
    button_panel: 'প্যানেলে খুলুন'
