page_title: Painel
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'Painel com abas. Abra-o, troque de abas, pressione F5 — o painel reabre na mesma aba.'
    button: 'Abrir painel'
  simple:
    description: 'Mostrar um painel simples. Você pode fechá-lo com Escape ou clicando fora do painel.'
    button: 'Abrir painel'
  components:
    description: 'Mostrar um painel com componentes e um gatilho de toast. Escape está desativado, mas você ainda pode clicar fora para fechá-lo.'
    button: 'Abrir painel'
  medium:
    description: 'Mostrar um painel com texto de comprimento médio. Clicar fora não o fechará.'
    button: 'Abrir painel'
  long:
    description: 'Mostrar um painel com texto longo. Ele pede confirmação antes de fechar.'
    button: 'Abrir painel'
  form_rendered:
    description: 'Mostrar um formulário de demonstração renderizado dentro de um painel. Escape e clique fora estão desativados, e ele pergunta antes de fechar se o formulário foi modificado.'
    button: 'Abrir painel'
  form_ajax:
    description: 'Mostrar um formulário de demonstração renderizado dentro de um painel usando AJAX. Escape e clique fora estão desativados, e ele pergunta antes de fechar se o formulário foi modificado.'
    button: 'Abrir painel'
  recursive:
    description: 'Abrir uma página de diálogo dentro de outro diálogo — escolha modal ou painel.'
    button_modal: 'Abrir em modal'
    button_panel: 'Abrir em painel'
