~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ٹور
page_icon: 'ph:bold/signpost'
intro: 'ایک صفحے کا گائیڈڈ ٹور: ایک وقت میں ایک قدم، جس عنصر کے بارے میں ہے وہ مدھم صفحے میں روشن ہوتا ہے اور اس کے ساتھ ایک کارڈ ہوتا ہے، جس میں داخلہ اور خروج کی راہ ہوتی ہے۔ یہ خود ہی شروع ہوتا ہے کسی زائر کے لئے جس نے نہ تو اسے ختم کیا ہے اور نہ ہی مسترد کیا ہے — جو انہوں نے کیا ہے وہ محفوظ رہتا ہے، اور یہ دوبارہ نہیں آتا — اور کوئی بھی عنصر جو data-tour-start رکھتا ہے اسے دوبارہ چلاتا ہے۔ کی بورڈ کے تیر اس کے ذریعے حرکت کرتے ہیں، Escape اسے چھوڑ دیتا ہے۔'
start: 'ٹور شروع کریں'
status:
  none: 'آپ نے ابھی تک یہ ٹور نہیں دیکھا — یہ خود بخود شروع ہوتا ہے۔'
  completed: 'آپ نے اس ٹور کا دورہ کیا؛ یہ دوبارہ خود بخود شروع نہیں ہوگا۔'
  dismissed: 'آپ نے اس ٹور کو اس کے اختتام سے پہلے بند کر دیا؛ یہ دوبارہ خود بخود شروع نہیں ہوگا۔'
area:
  filters:
    title: فلٹرز
    body: 'فہرست میں کیا دکھایا جاتا ہے۔'
  list:
    title: فہرست
    body: 'کیا موجود ہے۔'
  export:
    title: 'برآمد کریں'
    body: 'کیا صفحے سے نکلتا ہے۔'
step:
  welcome:
    title: 'خوش آمدید'
    body: 'اس صفحے کا ایک مختصر ٹور۔ کی بورڈ کے تیر استعمال کریں، یا نیچے دیے گئے بٹن۔'
  filters:
    title: 'اسے محدود کریں'
    body: 'فلٹرز فیصلہ کرتے ہیں کہ فہرست میں کیا دکھایا جائے؛ یہ ایڈریس میں محفوظ رہتے ہیں۔'
  list:
    title: 'کیا موجود ہے'
    body: 'ہر صف کا تفصیل فہرست کے ساتھ کھلتا ہے۔'
  export:
    title: 'اپنے ساتھ لے جائیں'
    body: 'برآمد وہی لیتا ہے جو فلٹرز نے محفوظ کیا، کچھ زیادہ نہیں۔'
