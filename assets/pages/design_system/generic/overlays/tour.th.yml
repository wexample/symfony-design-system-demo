~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ทัวร์
page_icon: 'ph:bold/signpost'
intro: 'ทัวร์แนะนำของหน้า: ทีละขั้นตอน, องค์ประกอบที่เกี่ยวข้องจะถูกทำให้สว่างในหน้าเบลอและมีการ์ดอยู่ข้างๆ, พร้อมเส้นทางเข้าและออก. มันเริ่มต้นเองสำหรับผู้เข้าชมที่ยังไม่ได้เสร็จสิ้นหรือปฏิเสธมัน — สิ่งที่พวกเขาทำจะถูกเก็บไว้, และมันจะไม่กลับมา — และองค์ประกอบใดๆ ที่มีข้อมูล data-tour-start จะเล่นอีกครั้ง. ลูกศรของแป้นพิมพ์จะเคลื่อนที่ผ่านมัน, Escape ออกไป.'
start: เริ่มทัวร์
status:
  none: 'คุณยังไม่เคยเห็นทัวร์นี้ — มันเริ่มต้นเอง.'
  completed: 'คุณได้ผ่านทัวร์นี้แล้ว; มันจะไม่เริ่มต้นเองอีกครั้ง.'
  dismissed: 'คุณปิดทัวร์นี้ก่อนที่จะจบ; มันจะไม่เริ่มต้นเองอีกครั้ง.'
area:
  filters:
    title: ตัวกรอง
    body: สิ่งที่รายการแสดง.
  list:
    title: รายการ
    body: สิ่งที่มีอยู่.
  export:
    title: ส่งออก
    body: สิ่งที่ออกจากหน้า.
step:
  welcome:
    title: ยินดีต้อนรับ
    body: 'ทัวร์สั้นๆ ของหน้านี้. ใช้ลูกศรของแป้นพิมพ์, หรือปุ่มด้านล่าง.'
  filters:
    title: จำกัดให้แคบลง
    body: 'ตัวกรองตัดสินใจว่าสิ่งที่รายการจะแสดง; จะถูกเก็บในที่อยู่.'
  list:
    title: สิ่งที่มีอยู่
    body: แต่ละแถวจะแสดงรายละเอียดข้างรายการ.
  export:
    title: นำมันติดตัวไปด้วย
    body: 'การส่งออกจะนำสิ่งที่ตัวกรองเก็บไว้, ไม่มีอะไรเพิ่มเติม.'
