page_title: لوحة
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'لوحة مع علامات تبويب. افتحها، قم بالتبديل بين علامات التبويب، اضغط F5 — ستفتح اللوحة مرة أخرى على نفس علامة التبويب.'
    button: 'افتح اللوحة'
  simple:
    description: 'عرض لوحة بسيطة. يمكنك إغلاقها باستخدام مفتاح الهروب أو بالنقر خارج اللوحة.'
    button: 'افتح اللوحة'
  components:
    description: 'عرض لوحة مع مكونات وزر إشعار. مفتاح الهروب معطل، لكن يمكنك النقر خارج اللوحة لإغلاقها.'
    button: 'افتح اللوحة'
  medium:
    description: 'عرض لوحة بنص متوسط الطول. النقر خارجها لن يغلقها.'
    button: 'افتح اللوحة'
  long:
    description: 'عرض لوحة بنص طويل. يطلب تأكيدًا قبل الإغلاق.'
    button: 'افتح اللوحة'
  form_rendered:
    description: 'عرض نموذج عرض داخل لوحة. مفتاح الهروب والنقر الخارجي معطلان، ويطلب تأكيدًا قبل الإغلاق إذا تم تعديل النموذج.'
    button: 'افتح اللوحة'
  form_ajax:
    description: 'عرض نموذج عرض داخل لوحة باستخدام AJAX. مفتاح الهروب والنقر الخارجي معطلان، ويطلب تأكيدًا قبل الإغلاق إذا تم تعديل النموذج.'
    button: 'افتح اللوحة'
  recursive:
    description: 'افتح صفحة حوار داخل حوار آخر — اختر الوضع أو اللوحة.'
    button_modal: 'افتح في نافذة منبثقة'
    button_panel: 'افتح في لوحة'
