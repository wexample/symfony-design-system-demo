page_title: 패널
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: '탭이 있는 패널입니다. 패널을 열고, 탭을 전환한 후 F5를 누르면 같은 탭에서 패널이 다시 열립니다.'
    button: '패널 열기'
  simple:
    description: '간단한 패널을 표시합니다. Escape 키를 누르거나 패널 외부를 클릭하여 닫을 수 있습니다.'
    button: '패널 열기'
  components:
    description: '컴포넌트와 토스트 트리거가 있는 패널을 표시합니다. Escape는 비활성화되어 있지만, 여전히 외부를 클릭하여 닫을 수 있습니다.'
    button: '패널 열기'
  medium:
    description: '중간 길이의 텍스트가 있는 패널을 표시합니다. 외부 클릭으로는 닫히지 않습니다.'
    button: '패널 열기'
  long:
    description: '긴 텍스트가 있는 패널을 표시합니다. 닫기 전에 확인을 요청합니다.'
    button: '패널 열기'
  form_rendered:
    description: '패널 내에 렌더링된 데모 양식을 표시합니다. Escape와 외부 클릭은 비활성화되어 있으며, 양식이 수정된 경우 닫기 전에 확인을 요청합니다.'
    button: '패널 열기'
  form_ajax:
    description: 'AJAX를 사용하여 패널 내에 렌더링된 데모 양식을 표시합니다. Escape와 외부 클릭은 비활성화되어 있으며, 양식이 수정된 경우 닫기 전에 확인을 요청합니다.'
    button: '패널 열기'
  recursive:
    description: '다른 대화 상자 내에서 대화 상자 페이지를 엽니다 — 모달 또는 패널을 선택하세요.'
    button_modal: '모달로 열기'
    button_panel: '패널로 열기'
