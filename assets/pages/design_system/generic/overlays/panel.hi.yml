page_title: पैनल
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'टैब्स वाला पैनल। इसे खोलें, टैब्स स्विच करें, F5 दबाएँ — पैनल उसी टैब पर फिर से खुलता है।'
    button: 'पैनल खोलें'
  simple:
    description: 'एक साधारण पैनल दिखाएँ। आप इसे Escape दबाकर या पैनल के बाहर क्लिक करके बंद कर सकते हैं।'
    button: 'पैनल खोलें'
  components:
    description: 'घटक और टोस्ट ट्रिगर वाला पैनल दिखाएँ। Escape बंद नहीं है, लेकिन आप अभी भी बाहर क्लिक करके इसे बंद कर सकते हैं।'
    button: 'पैनल खोलें'
  medium:
    description: 'मध्यम लंबाई के पाठ वाला पैनल दिखाएँ। बाहर क्लिक करने से यह बंद नहीं होगा।'
    button: 'पैनल खोलें'
  long:
    description: 'लंबे पाठ वाला पैनल दिखाएँ। बंद करने से पहले यह पुष्टि मांगता है।'
    button: 'पैनल खोलें'
  form_rendered:
    description: 'पैनल के अंदर एक प्रस्तुत डेमो फॉर्म दिखाएँ। Escape और बाहर क्लिक अक्षम हैं, और यदि फॉर्म को संशोधित किया गया है तो यह बंद करने से पहले पुष्टि मांगता है।'
    button: 'पैनल खोलें'
  form_ajax:
    description: 'AJAX का उपयोग करके एक प्रस्तुत डेमो फॉर्म पैनल के अंदर दिखाएँ। Escape और बाहर क्लिक अक्षम हैं, और यदि फॉर्म को संशोधित किया गया है तो यह बंद करने से पहले पुष्टि मांगता है।'
    button: 'पैनल खोलें'
  recursive:
    description: 'एक संवाद पृष्ठ को दूसरे संवाद के अंदर खोलें — मॉडल या पैनल चुनें।'
    button_modal: 'मॉडल में खोलें'
    button_panel: 'पैनल में खोलें'
