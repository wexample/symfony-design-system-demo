~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ダイアログ
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: タブ付きのモーダル。開いてタブを切り替え、F5を押すと、同じタブでモーダルが再オープンします。
    button: モーダルを開く
  simple:
    description: シンプルなモーダルを表示します。Escapeキーまたはモーダルの外側をクリックすることで閉じることができます。
    button: モーダルを開く
  components:
    description: コンポーネントとトーストトリガーを持つモーダルを表示します。Escapeは無効ですが、外側をクリックして閉じることはできます。
    button: モーダルを開く
  medium:
    description: 中程度の長さのテキストを持つモーダルを表示します。外側をクリックしても閉じません。
    button: モーダルを開く
  long:
    description: 長いテキストを持つモーダルを表示します。閉じる前に確認を求めます。
    button: モーダルを開く
  form_rendered:
    description: モーダル内にレンダリングされたデモフォームを表示します。Escapeキーと外側のクリックは無効で、フォームが変更されていた場合は閉じる前に確認を求めます。
    button: モーダルを開く
  form_ajax:
    description: AJAXを使用してモーダル内にレンダリングされたデモフォームを表示します。Escapeキーと外側のクリックは無効で、フォームが変更されていた場合は閉じる前に確認を求めます。
    button: モーダルを開く
  recursive:
    description: '別のダイアログ内にダイアログページを開きます — モーダルまたはパネルを選択してください。'
    button_modal: モーダルで開く
    button_panel: パネルで開く
