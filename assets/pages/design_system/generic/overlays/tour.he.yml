intro: 'סיור מודרך של העמוד: שלב אחרי שלב, האלמנט המדובר מואר בעמוד מעומעם וכרטיס לידו, עם הדרך פנימה והדרך החוצה. הוא מתחיל מעצמו עבור מבקר שלא סיים או דחה אותו — מה שהם עשו נשמר, והוא לא יחזור — וכל אלמנט שמכיל data-tour-start מפעיל אותו שוב. חיצי המקלדת נעים דרכו, Escape יוצא ממנו.'
