~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Диалог
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'Модальное окно с вкладками. Откройте его, переключите вкладки, нажмите F5 — модальное окно откроется снова на той же вкладке.'
    button: 'Открыть модальное окно'
  simple:
    description: 'Показать простое модальное окно. Вы можете закрыть его клавишей Escape или щелчком вне модального окна.'
    button: 'Открыть модальное окно'
  components:
    description: 'Показать модальное окно с компонентами и триггером уведомления. Escape отключен, но вы все равно можете щелкнуть вне, чтобы закрыть его.'
    button: 'Открыть модальное окно'
  medium:
    description: 'Показать модальное окно со средним текстом. Щелчок вне не закроет его.'
    button: 'Открыть модальное окно'
  long:
    description: 'Показать модальное окно с длинным текстом. Оно запрашивает подтверждение перед закрытием.'
    button: 'Открыть модальное окно'
  form_rendered:
    description: 'Показать отрендеренную демонстрационную форму внутри модального окна. Escape и щелчок вне отключены, и оно запрашивает подтверждение перед закрытием, если форма была изменена.'
    button: 'Открыть модальное окно'
  form_ajax:
    description: 'Показать отрендеренную демонстрационную форму внутри модального окна с использованием AJAX. Escape и щелчок вне отключены, и оно запрашивает подтверждение перед закрытием, если форма была изменена.'
    button: 'Открыть модальное окно'
  recursive:
    description: 'Открыть страницу диалога внутри другого диалога — выберите модальное окно или панель.'
    button_modal: 'Открыть в модальном окне'
    button_panel: 'Открыть в панели'
