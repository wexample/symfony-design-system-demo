bn:
  page_title: 'নিশ্চিত করুন'
  section:
    form:
      description: 'এটি একটি ফর্ম যা পাঠানোর আগে জিজ্ঞাসা করে, এর নিজস্ব কোন স্ক্রিপ্ট নেই: ফর্মে data-confirm-message, অথবা এটিকে পাঠানো বোতামে। যদি হ্যাঁ উত্তর দেওয়া হয়, এটি যেমন হবে তেমন পাঠানো হয়।'
      button: 'রেকর্ড আর্কাইভ করুন'
      title: 'এই রেকর্ডটি আর্কাইভ করবেন?'
      message: 'এটি তালিকা থেকে চলে যাবে; এটি যা ধারণ করে সব কিছু রাখা হয়।'
      accept: 'আর্কাইভ করুন'
    destructive:
