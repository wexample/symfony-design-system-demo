en:
  page_title: Confirm
  section:
    form:
      description: "A form asking before it is sent, with no script of its own: data-confirm-message on the form, or on the button sending it. Answered yes, it is sent as it would have been."
      button: Archive the record
      title: Archive this record?
      message: It leaves the lists; everything it holds is kept.
      accept: Archive
    destructive:
      description: "An answer that cannot be undone: drawn as a danger, and neither the focus nor Enter starts on it — Escape and Enter both back out."
      button: Deactivate an account
      title: Deactivate this account?
      message: "Julien Gautier will no longer be able to sign in."
      action:
        confirm: Deactivate
        cancel: Cancel
    short:
      description: Confirm with short text (overlay).
      button: Open confirm
      title: Please confirm
      message: Do you want to continue?
      result_title: Confirm result
      result_prefix: Result:
    toast_short:
      description: Confirm with short text (toast).
      button: Open confirm
      title: Confirm toast
      message: Continue with toast?
      result_title: Toast confirm result
      result_prefix: Result:
    medium:
      description: Confirm with medium text (overlay).
      button: Open confirm
      title: Medium confirm
    long:
      description: Confirm with long text (overlay).
      button: Open confirm
      title: Long confirm
    toast_medium:
      description: Confirm with medium text (toast).
      button: Open confirm
      title: Medium confirm toast
    toast_long:
      description: Confirm with long text (toast).
      button: Open confirm
      title: Long confirm toast
    custom:
      description: Custom confirm actions (stacking).
      button: Open confirm
      title: Stacking confirm
      message: Open another confirm or close them all?
      action:
        new: New confirm
        close_all: Close all confirm
        cancel: Cancel

ar:
  page_title: تأكيد
  section:
    form:
      description: 'استمارة تطلب التأكيد قبل الإرسال، دون سكربت خاص بها: رسالة تأكيد البيانات على الاستمارة، أو على الزر الذي يرسلها. إذا كانت الإجابة نعم، سيتم إرسالها كما لو كانت.'
      button: 'أرشفة السجل'
      title: 'هل تريد أرشفة هذا السجل؟'
      message: 'سوف يغادر القوائم؛ كل ما يحتويه سيتم الاحتفاظ به.'
      accept: أرشفة
    destructive:
      description: 'إجابة لا يمكن التراجع عنها: مصممة كخطر، ولا يبدأ التركيز ولا زر Enter عليها — كل من Escape و Enter للخروج.'
      button: 'إلغاء تفعيل الحساب'
      title: 'هل تريد إلغاء تفعيل هذا الحساب؟'
      message: 'لن يتمكن جولين غوتييه من تسجيل الدخول بعد الآن.'
      action:
        confirm: 'إلغاء التفعيل'
        cancel: إلغاء
    short:
      description: 'تأكيد مع نص قصير (تراكب).'
