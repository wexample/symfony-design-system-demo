page_title: แผงควบคุม
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: 'แผงควบคุมมีแท็บ เปิดมัน เปลี่ยนแท็บ กด F5 — แผงควบคุมจะเปิดขึ้นที่แท็บเดิม'
    button: เปิดแผงควบคุม
  simple:
    description: 'แสดงแผงควบคุมแบบง่าย คุณสามารถปิดมันได้ด้วย Escape หรือการคลิกนอกแผงควบคุม'
    button: เปิดแผงควบคุม
  components:
    description: 'แสดงแผงควบคุมที่มีส่วนประกอบและตัวกระตุ้นการแจ้งเตือน Escape ถูกปิดใช้งาน แต่คุณยังสามารถคลิกนอกเพื่อปิดมันได้'
    button: เปิดแผงควบคุม
  medium:
    description: 'แสดงแผงควบคุมที่มีข้อความยาวปานกลาง การคลิกนอกจะไม่ปิดมัน'
    button: เปิดแผงควบคุม
  long:
    description: 'แสดงแผงควบคุมที่มีข้อความยาว มันจะขอการยืนยันก่อนที่จะปิด'
    button: เปิดแผงควบคุม
  form_rendered:
    description: 'แสดงแบบฟอร์มตัวอย่างที่เรนเดอร์แล้วภายในแผงควบคุม Escape และการคลิกนอกถูกปิดใช้งาน และมันจะขอการยืนยันก่อนปิดถ้าแบบฟอร์มถูกแก้ไข'
    button: เปิดแผงควบคุม
  form_ajax:
    description: 'แสดงแบบฟอร์มตัวอย่างที่เรนเดอร์แล้วภายในแผงควบคุมโดยใช้ AJAX Escape และการคลิกนอกถูกปิดใช้งาน และมันจะขอการยืนยันก่อนปิดถ้าแบบฟอร์มถูกแก้ไข'
    button: เปิดแผงควบคุม
  recursive:
    description: 'เปิดหน้าต่างสนทนาในหน้าต่างสนทนาอื่น — เลือกโมดัลหรือแผงควบคุม'
    button_modal: เปิดในโมดัล
    button_panel: เปิดในแผงควบคุม
