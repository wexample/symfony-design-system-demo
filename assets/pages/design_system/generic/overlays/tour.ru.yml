~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Экскурсия
page_icon: 'ph:bold/signpost'
intro: 'Пошаговая экскурсия по странице: один шаг за раз, элемент, о котором идет речь, подсвечен на затемненной странице, и рядом с ним карточка с указанием пути вперед и назад. Она начинается автоматически для посетителя, который не завершил и не закрыл её — то, что он сделал, сохраняется, и она не повторяется — и любой элемент с данными data-tour-start запускает её снова. Стрелки на клавиатуре перемещаются по ней, клавиша Escape закрывает её.'
start: 'Начать экскурсию'
status:
  none: 'Вы еще не видели эту экскурсию — она начинает автоматически.'
  completed: 'Вы прошли эту экскурсию; она больше не начнется автоматически.'
  dismissed: 'Вы закрыли эту экскурсию до её завершения; она больше не начнется автоматически.'
area:
  filters:
    title: Фильтры
    body: 'Что отображает список.'
  list:
    title: Список
    body: 'Что есть.'
  export:
    title: Экспорт
    body: 'Что покидает страницу.'
step:
  welcome:
    title: 'Добро пожаловать'
    body: 'Краткая экскурсия по этой странице. Используйте стрелки на клавиатуре или кнопки ниже.'
  filters:
    title: Уточните
    body: 'Фильтры определяют, что отображает список; они сохраняются в адресе.'
  list:
    title: 'Что есть'
    body: 'Каждая строка открывает свои детали рядом со списком.'
  export:
    title: 'Возьмите с собой'
    body: 'Экспорт берет то, что сохранили фильтры, ничего больше.'
