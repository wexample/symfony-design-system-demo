~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 투어
page_icon: 'ph:bold/signpost'
intro: '페이지에 대한 가이드 투어: 한 걸음씩 진행되며, 해당 요소는 어두운 페이지에서 강조되고 옆에 카드가 표시됩니다. 진행 경로와 종료 경로가 함께 제공됩니다. 사용자가 완료하지 않았거나 투어를 거부하지 않은 경우 자동으로 시작됩니다 — 사용자가 한 작업은 유지되며 다시 나타나지 않습니다 — 데이터 투어 시작을 가진 모든 요소는 다시 재생됩니다. 키보드의 화살표로 이동하며, Escape 키를 누르면 종료됩니다.'
start: '투어 시작'
status:
  none: '이 투어를 아직 보지 않았습니다 — 자동으로 시작됩니다.'
  completed: '이 투어를 완료했습니다; 다시 자동으로 시작되지 않습니다.'
  dismissed: '투어를 끝내기 전에 닫았습니다; 다시 자동으로 시작되지 않습니다.'
area:
  filters:
    title: 필터
    body: '목록에서 보여주는 내용입니다.'
  list:
    title: 목록
    body: '존재하는 내용입니다.'
  export:
    title: 내보내기
    body: '페이지에서 나가는 내용입니다.'
step:
  welcome:
    title: 환영합니다
    body: '이 페이지에 대한 짧은 투어입니다. 키보드의 화살표 또는 아래 버튼을 사용하세요.'
  filters:
    title: '범위를 좁히세요'
    body: '필터는 목록에서 보여주는 내용을 결정하며, 주소에 유지됩니다.'
  list:
    title: '존재하는 내용'
    body: '각 행은 목록 옆에 세부 정보를 엽니다.'
  export:
    title: 가져가세요
    body: '내보내기는 필터가 유지한 내용을 가져가며, 그 이상은 없습니다.'
