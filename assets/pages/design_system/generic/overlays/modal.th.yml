~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: กล่องสนทนา
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'โมดัลที่มีแท็บ เปิดมัน สลับแท็บ กด F5 — โมดัลจะเปิดขึ้นมาในแท็บเดิมอีกครั้ง'
    button: เปิดโมดัล
  simple:
    description: 'แสดงโมดัลแบบง่าย คุณสามารถปิดมันได้ด้วยการกด Escape หรือโดยการคลิกนอกโมดัล'
    button: เปิดโมดัล
  components:
    description: 'แสดงโมดัลที่มีคอมโพเนนต์และทริกเกอร์ทอสต์ Escape ถูกปิดใช้งาน แต่คุณยังสามารถคลิกนอกเพื่อปิดมันได้'
    button: เปิดโมดัล
  medium:
    description: 'แสดงโมดัลที่มีข้อความยาวปานกลาง การคลิกนอกจะไม่ปิดมัน'
    button: เปิดโมดัล
  long:
    description: 'แสดงโมดัลที่มีข้อความยาว มันจะขอการยืนยันก่อนที่จะปิด'
    button: เปิดโมดัล
  form_rendered:
    description: 'แสดงแบบฟอร์มเดโมที่แสดงผลในโมดัล Escape และการคลิกนอกถูกปิดใช้งาน และมันจะขอการยืนยันก่อนที่จะปิดหากแบบฟอร์มถูกแก้ไข'
    button: เปิดโมดัล
  form_ajax:
    description: 'แสดงแบบฟอร์มเดโมที่แสดงผลในโมดัลโดยใช้ AJAX Escape และการคลิกนอกถูกปิดใช้งาน และมันจะขอการยืนยันก่อนที่จะปิดหากแบบฟอร์มถูกแก้ไข'
    button: เปิดโมดัล
  recursive:
    description: 'เปิดหน้าไดอะล็อกภายในไดอะล็อกอื่น — เลือกโมดัลหรือแผง'
    button_modal: เปิดในโมดัล
    button_panel: เปิดในแผง
