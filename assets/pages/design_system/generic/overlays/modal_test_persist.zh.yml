page_title: 具有持久性的选项卡
tab:
  overview: 概述
  details: 详情
  settings: 设置
  loading: 加载条
content:
  overview: '这是概述选项卡。切换选项卡后按F5 - 当覆盖层重新打开时，此选项卡仍然处于活动状态。'
  details: 这是详情选项卡。活动选项卡存储在URL哈希中，因此在页面重新加载时仍然有效。
  settings: 这是设置选项卡。覆盖层（模态/面板）和活动选项卡都从URL哈希中恢复。
  loading: 使用下面的按钮手动触发加载条动画。当表单提交正在进行时，此条在覆盖层顶部出现。
loading:
  start: 开始
  end: 完成
  simulate: 模拟（自动完成）
