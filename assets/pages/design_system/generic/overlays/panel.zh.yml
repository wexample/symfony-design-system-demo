page_title: 面板
page_icon: 'ph:bold/sidebar-simple-duotone'
section:
  persist:
    description: '带标签的面板。打开它，切换标签，按F5 — 面板将在同一标签上重新打开。'
    button: 打开面板
  simple:
    description: 显示一个简单的面板。您可以按Escape键或单击面板外部来关闭它。
    button: 打开面板
  components:
    description: 显示一个带有组件和吐司触发器的面板。Escape键被禁用，但您仍然可以单击外部来关闭它。
    button: 打开面板
  medium:
    description: 显示一个包含中等长度文本的面板。单击外部不会关闭它。
    button: 打开面板
  long:
    description: 显示一个包含长文本的面板。在关闭之前会要求确认。
    button: 打开面板
  form_rendered:
    description: 在面板内显示一个渲染的演示表单。Escape和外部单击被禁用，如果表单被修改，关闭时会询问。
    button: 打开面板
  form_ajax:
    description: 在面板内使用AJAX显示一个渲染的演示表单。Escape和外部单击被禁用，如果表单被修改，关闭时会询问。
    button: 打开面板
  recursive:
    description: '在另一个对话框内打开一个对话框页面 — 选择模态或面板。'
    button_modal: 在模态中打开
    button_panel: 在面板中打开
