intro: 'একটি পৃষ্ঠার গাইডেড ট্যুর: এক সময়ে একটি পদক্ষেপ, এটি সম্পর্কে যে উপাদানটি রয়েছে তা একটি ম্লান পৃষ্ঠায় আলোকিত এবং তার পাশে একটি কার্ড, সঙ্গে পথে এবং বের হওয়ার পথে। এটি নিজের থেকেই শুরু হয় একটি দর্শকের জন্য যিনি এটি শেষ করেননি বা বাতিল করেননি — তাদের করা কাজ রাখা হয়, এবং এটি আবার ফিরে আসে না — এবং যে কোনও উপাদান যার মধ্যে data-tour-start রয়েছে তা আবার চালায়। কীবোর্ডের তীরগুলি এর মধ্য দিয়ে চলে, Escape এটি বন্ধ করে।'
start: 'ভ্রমণ শুরু করুন'
