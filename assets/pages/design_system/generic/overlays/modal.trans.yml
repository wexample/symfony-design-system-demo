en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Dialog
  page_icon: ph:bold/app-window

  section:
    persist:
      description: "Modal with tabs. Open it, switch tabs, press F5 — the modal reopens on the same tab."
      button: Open modal
    simple:
      description: Show a simple modal. You can close it with Escape or by clicking outside the modal.
      button: Open modal
    components:
      description: Show a modal with components and a toast trigger. Escape is disabled, but you can still click outside to close it.
      button: Open modal
    medium:
      description: Show a modal with medium-length text. Clicking outside will not close it.
      button: Open modal
    long:
      description: Show a modal with long text. It asks for confirmation before closing.
      button: Open modal
    form_rendered:
      description: Show a rendered demo form inside a modal. Escape and outside click are disabled, and it asks before closing if the form was modified.
      button: Open modal
    form_ajax:
      description: Show a rendered demo form inside a modal using AJAX. Escape and outside click are disabled, and it asks before closing if the form was modified.
      button: Open modal
    recursive:
      description: Open a dialog page inside another dialog — choose modal or panel.
      button_modal: Open in modal
      button_panel: Open in panel

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: حوار
  page_icon: 'ph:bold/app-window'
  section:
    persist:
      description: 'نافذة منبثقة مع علامات تبويب. افتحها، انتقل بين علامات التبويب، اضغط F5 — ستعاد فتح النافذة المنبثقة على نفس العلامة.'
      button: 'فتح النافذة المنبثقة'
    simple:
      description: 'عرض نافذة منبثقة بسيطة. يمكنك إغلاقها باستخدام مفتاح Escape أو بالنقر خارج النافذة المنبثقة.'
      button: 'فتح النافذة المنبثقة'
    components:
      description: 'عرض نافذة منبثقة مع مكونات وزر إشعار. تم تعطيل مفتاح Escape، ولكن يمكنك النقر خارج النافذة لإغلاقها.'
      button: 'فتح النافذة المنبثقة'
    medium:
      description: 'عرض نافذة منبثقة بنص متوسط الطول. النقر خارجها لن يغلقها.'
      button: 'فتح النافذة المنبثقة'
    long:
      description: 'عرض نافذة منبثقة بنص طويل. يطلب تأكيد قبل الإغلاق.'
      button: 'فتح النافذة المنبثقة'
    form_rendered:
      description: 'عرض نموذج تجريبي داخل نافذة منبثقة. يتم تعطيل مفتاح Escape والنقر الخارجي، ويطلب التأكيد قبل الإغلاق إذا تم تعديل النموذج.'
      button: 'فتح النافذة المنبثقة'
    form_ajax:
      description: 'عرض نموذج تجريبي داخل نافذة منبثقة باستخدام AJAX. يتم تعطيل مفتاح Escape والنقر الخارجي، ويطلب التأكيد قبل الإغلاق إذا تم تعديل النموذج.'
      button: 'فتح النافذة المنبثقة'
    recursive:
      description: 'فتح صفحة حوار داخل حوار آخر — اختر نافذة منبثقة أو لوحة.'
      button_modal: 'فتح في نافذة منبثقة'
      button_panel: 'فتح في لوحة'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ডায়ালগ
  page_icon: 'ph:bold/app-window'
  section:
    persist:
      description: 'ট্যাব সহ মডাল। এটি খুলুন, ট্যাব পরিবর্তন করুন, F5 চাপুন — মডাল একই ট্যাবে আবার খোলে।'
      button: 'মডাল খুলুন'
    simple:
      description: 'একটি সাধারণ মডাল দেখান। আপনি এটি Escape চেপে অথবা মডালের বাইরের দিকে ক্লিক করে বন্ধ করতে পারেন।'
      button: 'মডাল খুলুন'
    components:
      description: 'উপাদান এবং একটি টোস্ট ট্রিগার সহ একটি মডাল দেখান। Escape অক্ষম, তবে আপনি এখনও বন্ধ করতে বাইরের দিকে ক্লিক করতে পারেন।'
      button: 'মডাল খুলুন'
    medium:
      description: 'মাঝারি দৈর্ঘ্যের টেক্সট সহ একটি মডাল দেখান। বাইরের দিকে ক্লিক করলে এটি বন্ধ হবে না।'
      button: 'মডাল খুলুন'
    long:
      description: 'দীর্ঘ টেক্সট সহ একটি মডাল দেখান। এটি বন্ধ করার আগে নিশ্চিতকরণ চায়।'
      button: 'মডাল খুলুন'
    form_rendered:
      description: 'একটি মডালের ভিতরে একটি রেন্ডার করা ডেমো ফর্ম দেখান। Escape এবং বাইরের ক্লিক অক্ষম, এবং যদি ফর্মটি পরিবর্তিত হয় তবে এটি বন্ধ করার আগে জিজ্ঞাসা করে।'
      button: 'মডাল খুলুন'
    form_ajax:
      description: 'AJAX ব্যবহার করে একটি মডালের ভিতরে একটি রেন্ডার করা ডেমো ফর্ম দেখান। Escape এবং বাইরের ক্লিক অক্ষম, এবং যদি ফর্মটি পরিবর্তিত হয় তবে এটি বন্ধ করার আগে জিজ্ঞাসা করে।'
      button: 'মডাল খুলুন'
    recursive:
      description: 'একটি ডায়ালগ পৃষ্ঠাকে অন্য একটি ডায়ালগের ভিতরে খুলুন — মডাল বা প্যানেল চয়ন করুন।'
      button_modal: 'মডালে খুলুন'
      button_panel: 'প্যানেলে খুলুন'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Dialog
  page_icon: 'ph:bold/app-window'
  section:
    persist:
      description: 'Modal mit Tabs. Öffnen Sie es, wechseln Sie die Tabs, drücken Sie F5 — das Modal öffnet sich wieder im selben Tab.'
      button: 'Modal öffnen'
    simple:
      description: 'Ein einfaches Modal anzeigen. Sie können es mit Escape oder durch Klicken außerhalb des Modals schließen.'
      button: 'Modal öffnen'
    components:
      description: 'Ein Modal mit Komponenten und einem Toast-Trigger anzeigen. Escape ist deaktiviert, aber Sie können trotzdem außerhalb klicken, um es zu schließen.'
      button: 'Modal öffnen'
    medium:
      description: 'Ein Modal mit Text mittlerer Länge anzeigen. Ein Klick außerhalb schließt es nicht.'
      button: 'Modal öffnen'
    long:
      description: 'Ein Modal mit langem Text anzeigen. Es fragt nach Bestätigung, bevor es geschlossen wird.'
      button: 'Modal öffnen'
    form_rendered:
      description: 'Ein gerendertes Demofeld innerhalb eines Modals anzeigen. Escape und das Klicken außerhalb sind deaktiviert, und es fragt vor dem Schließen, ob das Feld geändert wurde.'
      button: 'Modal öffnen'
    form_ajax:
      description: 'Ein gerendertes Demofeld innerhalb eines Modals mit AJAX anzeigen. Escape und das Klicken außerhalb sind deaktiviert, und es fragt vor dem Schließen, ob das Feld geändert wurde.'
      button: 'Modal öffnen'
    recursive:
      description: 'Eine Dialogseite innerhalb eines anderen Dialogs öffnen — Modal oder Panel wählen.'
      button_modal: 'In Modal öffnen'
      button_panel: 'In Panel öffnen'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Diálogo
  page_icon: 'ph:bold/app-window'
  section:
    persist:
      description: 'Modal con pestañas. Ábrelo, cambia de pestañas, presiona F5: el modal se reabre en la misma pestaña.'
      button: 'Abrir modal'
    simple:
      description: 'Mostrar un modal simple. Puedes cerrarlo con Escape o haciendo clic fuera del modal.'
      button: 'Abrir modal'
    components:
      description: 'Mostrar un modal con componentes y un disparador de toast. Escape está deshabilitado, pero aún puedes hacer clic fuera para cerrarlo.'
      button: 'Abrir modal'
    medium:
      description: 'Mostrar un modal con texto de longitud media. Hacer clic fuera no lo cerrará.'
      button: 'Abrir modal'
    long:
      description: 'Mostrar un modal con texto largo. Pide confirmación antes de cerrar.'
      button: 'Abrir modal'
    form_rendered:
      description: 'Mostrar un formulario de demostración renderizado dentro de un modal. Escape y el clic fuera están deshabilitados, y pide confirmación antes de cerrar si el formulario fue modificado.'
      button: 'Abrir modal'
    form_ajax:
      description: 'Mostrar un formulario de demostración renderizado dentro de un modal usando AJAX. Escape y el clic fuera están deshabilitados, y pide confirmación antes de cerrar si el formulario fue modificado.'
      button: 'Abrir modal'
    recursive:
      description: 'Abrir una página de diálogo dentro de otro diálogo: elige modal o panel.'
      button_modal: 'Abrir en modal'
      button_panel: 'Abrir en panel'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: دیالوگ
  page_icon: 'ph:bold/app-window'
  section:
    persist:
      description: 'مدالی با تب‌ها. آن را باز کنید، تب‌ها را عوض کنید، کلید F5 را فشار دهید — مدال دوباره روی همان تب باز می‌شود.'
      button: 'باز کردن مدال'
    simple:
      description: 'یک مدال ساده نمایش دهید. می‌توانید با کلید Escape یا کلیک کردن خارج از مدال آن را ببندید.'
      button: 'باز کردن مدال'
    components:
      description: 'یک مدال با کامپوننت‌ها و یک تحریک توست نمایش دهید. کلید Escape غیرفعال است، اما می‌توانید همچنان با کلیک خارج، آن را ببندید.'
      button: 'باز کردن مدال'
    medium:
      description: 'یک مدال با متن متوسط نمایش دهید. کلیک کردن خارج آن را نمی‌بندد.'
      button: 'باز کردن مدال'
    long:
      description: 'یک مدال با متن طولانی نمایش دهید. قبل از بستن از شما تأیید می‌خواهد.'
      button: 'باز کردن مدال'
    form_rendered:
      description: 'یک فرم دمو رندر شده را درون یک مدال نمایش دهید. کلید Escape و کلیک خارج غیرفعال هستند و اگر فرم تغییر کرده باشد، قبل از بستن از شما سؤال می‌کند.'
      button: 'باز کردن مدال'
    form_ajax:
      description: 'یک فرم دمو رندر شده را درون یک مدال با استفاده از AJAX نمایش دهید. کلید Escape و کلیک خارج غیرفعال هستند و اگر فرم تغییر کرده باشد، قبل از بستن از شما سؤال می‌کند.'
      button: 'باز کردن مدال'
    recursive:
      description: 'یک صفحه دیالوگ را درون یک دیالوگ دیگر باز کنید — مدال یا پنل را انتخاب کنید.'
      button_modal: 'باز کردن در مدال'
      button_panel: 'باز کردن در پنل'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Dialogi
  page_icon: 'ph:bold/app-window'
  section:
    persist:
      description: 'Modal, jossa on välilehtiä. Avaa se, vaihda välilehtiä, paina F5 — modal avautuu uudelleen samalla välilehdellä.'
      button: 'Avaa modal'
    simple:
      description: 'Näytä yksinkertainen modal. Voit sulkea sen Escape-näppäimellä tai klikkaamalla modalin ulkopuolella.'
      button: 'Avaa modal'
    components:
      description: 'Näytä modal, jossa on komponentteja ja toast-laite. Escape on pois käytöstä, mutta voit silti klikata ulkopuolelle sulkeaksesi sen.'
      button: 'Avaa modal'
    medium:
      description: 'Näytä modal, jossa on keskipitkä teksti. Klikkaaminen ulkopuolelle ei sulje sitä.'
      button: 'Avaa modal'
    long:
      description: 'Näytä modal, jossa on pitkä teksti. Se kysyy vahvistuksen ennen sulkemista.'
      button: 'Avaa modal'
    form_rendered:
      description: 'Näytä renderöity demon muodossa modalin sisällä. Escape ja ulkopuolinen klikkaus on pois käytöstä, ja se kysyy ennen sulkemista, jos lomaketta on muokattu.'
      button: 'Avaa modal'
    form_ajax:
      description: 'Näytä renderöity demon muodossa modalin sisällä käyttäen AJAX:ia. Escape ja ulkopuolinen klikkaus on pois käytöstä, ja se kysyy ennen sulkemista, jos lomaketta on muokattu.'
      button: 'Avaa modal'
    recursive:
      description: 'Avaa dialogisivu toisen dialogin sisällä — valitse modal tai paneeli.'
      button_modal: 'Avaa modaalina'
      button_panel: 'Avaa paneelina'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Dialogue
  page_icon: 'ph:bold/app-window'
  section:
    persist:
      description: "Modal avec onglets. Ouvrez-le, changez d'onglet, appuyez sur F5 — le modal se rouvre sur le même onglet."
      button: 'Ouvrir le modal'
    simple:
      description: 'Afficher un modal simple. Vous pouvez le fermer avec Échap ou en cliquant en dehors du modal.'
      button: 'Ouvrir le modal'
    components:
      description: 'Afficher un modal avec des composants et un déclencheur de toast. Échap est désactivé, mais vous pouvez toujours cliquer en dehors pour le fermer.'
      button: 'Ouvrir le modal'
    medium:
      description: 'Afficher un modal avec un texte de longueur moyenne. Cliquer en dehors ne le fermera pas.'
      button: 'Ouvrir le modal'
    long:
      description: 'Afficher un modal avec un long texte. Il demande une confirmation avant de se fermer.'
      button: 'Ouvrir le modal'
    form_rendered:
      description: "Afficher un formulaire de démonstration rendu à l'intérieur d'un modal. Échap et le clic extérieur sont désactivés, et il demande avant de se fermer si le formulaire a été modifié."
      button: 'Ouvrir le modal'
    form_ajax:
      description: "Afficher un formulaire de démonstration rendu à l'intérieur d'un modal utilisant AJAX. Échap et le clic extérieur sont désactivés, et il demande avant de se fermer si le formulaire a été modifié."
      button: 'Ouvrir le modal'
    recursive:
      description: "Ouvrir une page de dialogue à l'intérieur d'un autre dialogue — choisir modal ou panneau."
      button_modal: 'Ouvrir en modal'
      button_panel: 'Ouvrir en panneau'

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: דיאלוג
  page_icon: 'ph:bold/app-window'
  section:
    persist:
      description: 'מודל עם טאבים. פתח אותו, החלף טאבים, לחץ F5 — המודל ייפתח שוב באותו טאב.'
      button: 'פתח מודל'
    simple:
      description: 'הצג מודל פשוט. ניתן לסגור אותו עם Escape או על ידי לחיצה מחוץ למודל.'
      button: 'פתח מודל'
    components:
      description: 'הצג מודל עם רכיבים וטריגר טוסט. Escape מושבת, אבל עדיין אפשר ללחוץ מחוץ כדי לסגור אותו.'
      button: 'פתח מודל'
    medium:
      description: 'הצג מודל עם טקסט באורך בינוני. לחיצה מחוץ לא תסגור אותו.'
      button: 'פתח מודל'
    long:
      description: 'הצג מודל עם טקסט ארוך. הוא מבקש אישור לפני סגירה.'
      button: 'פתח מודל'
    form_rendered:
      description: 'הצג טופס לדוגמה בתוך מודל. Escape ולחיצה מחוץ מושבתים, והוא שואל לפני סגירה אם הטופס שונה.'
      button: 'פתח מודל'
    form_ajax:
      description: 'הצג טופס לדוגמה בתוך מודל באמצעות AJAX. Escape ולחיצה מחוץ מושבתים, והוא שואל לפני סגירה אם הטופס שונה.'
      button: 'פתח מודל'
    recursive:
      description: 'פתח דף דיאלוג בתוך דיאלוג אחר — בחר מודל או פאנל.'
      button_modal: 'פתח במודל'
      button_panel: 'פתח בפאנל'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: संवाद
  page_icon: 'ph:bold/app-window'
  section:
    persist:
      description: 'टैब के साथ मोडल। इसे खोलें, टैब बदलें, F5 दबाएं — मोडल उसी टैब पर फिर से खुलता है।'
      button: 'मोडल खोलें'
    simple:
      description: 'एक साधारण मोडल दिखाएं। आप इसे Escape दबाकर या मोडल के बाहर क्लिक करके बंद कर सकते हैं।'
      button: 'मोडल खोलें'
    components:
      description: 'घटक और एक टोस्ट ट्रिगर के साथ एक मोडल दिखाएं। Escape अक्षम है, लेकिन आप इसे बंद करने के लिए अभी भी बाहर क्लिक कर सकते हैं।'
      button: 'मोडल खोलें'
    medium:
      description: 'मध्यम लंबाई के पाठ के साथ एक मोडल दिखाएं। बाहर क्लिक करने से यह बंद नहीं होगा।'
      button: 'मोडल खोलें'
    long:
      description: 'लंबे पाठ के साथ एक मोडल दिखाएं। यह बंद करने से पहले पुष्टि मांगता है।'
      button: 'मोडल खोलें'
    form_rendered:
      description: 'मोडल के अंदर एक प्रदर्शित डेमो फॉर्म दिखाएं। Escape और बाहर क्लिक अक्षम हैं, और यदि फॉर्म में बदलाव किया गया है तो यह बंद करने से पहले पूछता है।'
      button: 'मोडल खोलें'
    form_ajax:
      description: 'AJAX का उपयोग करके मोडल के अंदर एक प्रदर्शित डेमो फॉर्म दिखाएं। Escape और बाहर क्लिक अक्षम हैं, और यदि फॉर्म में बदलाव किया गया है तो यह बंद करने से पहले पूछता है।'
      button: 'मोडल खोलें'
    recursive:
      description: 'एक संवाद पृष्ठ को दूसरे संवाद के अंदर खोलें — मोडल या पैनल चुनें।'
      button_modal: 'मोडल में खोलें'
      button_panel: 'पैनल में खोलें'

id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Dialog
  page_icon: 'ph:bold/app-window'
  section:
    persist:
      description: 'Modal dengan tab. Buka, ganti tab, tekan F5 — modal akan terbuka kembali di tab yang sama.'
      button: 'Buka modal'
    simple:
      description: 'Tampilkan modal sederhana. Anda dapat menutupnya dengan Escape atau dengan mengklik di luar modal.'
      button: 'Buka modal'
    components:
      description: 'Tampilkan modal dengan komponen dan pemicu toast. Escape dinonaktifkan, tetapi Anda masih bisa mengklik di luar untuk menutupnya.'
      button: 'Buka modal'
    medium:
      description: 'Tampilkan modal dengan teks panjang sedang. Mengklik di luar tidak akan menutupnya.'
      button: 'Buka modal'
