~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Hộp thoại'
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'Hộp thoại có các tab. Mở nó, chuyển tab, nhấn F5 — hộp thoại sẽ mở lại ở tab giống như trước.'
    button: 'Mở hộp thoại'
  simple:
    description: 'Hiển thị một hộp thoại đơn giản. Bạn có thể đóng nó bằng phím Escape hoặc bằng cách nhấp bên ngoài hộp thoại.'
    button: 'Mở hộp thoại'
  components:
    description: 'Hiển thị một hộp thoại với các thành phần và một nút thông báo. Phím Escape bị vô hiệu hóa, nhưng bạn vẫn có thể nhấp bên ngoài để đóng nó.'
    button: 'Mở hộp thoại'
  medium:
    description: 'Hiển thị một hộp thoại với văn bản dài vừa. Nhấp bên ngoài sẽ không đóng nó.'
    button: 'Mở hộp thoại'
  long:
    description: 'Hiển thị một hộp thoại với văn bản dài. Nó yêu cầu xác nhận trước khi đóng.'
    button: 'Mở hộp thoại'
  form_rendered:
    description: 'Hiển thị một mẫu demo đã được render bên trong hộp thoại. Phím Escape và nhấp bên ngoài đều bị vô hiệu hóa, và nó yêu cầu xác nhận trước khi đóng nếu mẫu đã được chỉnh sửa.'
    button: 'Mở hộp thoại'
  form_ajax:
    description: 'Hiển thị một mẫu demo đã được render bên trong hộp thoại bằng AJAX. Phím Escape và nhấp bên ngoài đều bị vô hiệu hóa, và nó yêu cầu xác nhận trước khi đóng nếu mẫu đã được chỉnh sửa.'
    button: 'Mở hộp thoại'
  recursive:
    description: 'Mở một trang hộp thoại bên trong một hộp thoại khác — chọn modal hoặc panel.'
    button_modal: 'Mở trong modal'
    button_panel: 'Mở trong panel'
