~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Dialog
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'Modal z zakładkami. Otwórz go, przełącz zakładki, naciśnij F5 — modal otworzy się ponownie na tej samej zakładce.'
    button: 'Otwórz modal'
  simple:
    description: 'Pokaż prosty modal. Możesz go zamknąć klawiszem Escape lub klikając poza modalem.'
    button: 'Otwórz modal'
  components:
    description: 'Pokaż modal z komponentami i wyzwalaczem powiadomienia. Escape jest wyłączony, ale nadal możesz kliknąć poza, aby go zamknąć.'
    button: 'Otwórz modal'
  medium:
    description: 'Pokaż modal z tekstem średniej długości. Kliknięcie poza nie zamknie go.'
    button: 'Otwórz modal'
  long:
    description: 'Pokaż modal z długim tekstem. Prosi o potwierdzenie przed zamknięciem.'
    button: 'Otwórz modal'
  form_rendered:
    description: 'Pokaż renderowany formularz demo w modal. Escape i kliknięcie poza są wyłączone, a przed zamknięciem prosi o potwierdzenie, jeśli formularz został zmodyfikowany.'
    button: 'Otwórz modal'
  form_ajax:
    description: 'Pokaż renderowany formularz demo w modal z użyciem AJAX. Escape i kliknięcie poza są wyłączone, a przed zamknięciem prosi o potwierdzenie, jeśli formularz został zmodyfikowany.'
    button: 'Otwórz modal'
  recursive:
    description: 'Otwórz stronę dialogu w innym dialogu — wybierz modal lub panel.'
    button_modal: 'Otwórz w modal'
    button_panel: 'Otwórz w panelu'
