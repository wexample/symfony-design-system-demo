~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: דיאלוג
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'מודל עם טאבים. פתח אותו, החלף טאבים, לחץ F5 — המודל ייפתח שוב באותו טאב.'
    button: 'פתח מודל'
  simple:
    description: 'הצג מודל פשוט. ניתן לסגור אותו עם Escape או על ידי לחיצה מחוץ למודל.'
    button: 'פתח מודל'
  components:
    description: 'הצג מודל עם רכיבים וטריגר טוסט. Escape מושבת, אבל עדיין אפשר ללחוץ מחוץ כדי לסגור אותו.'
    button: 'פתח מודל'
  medium:
    description: 'הצג מודל עם טקסט באורך בינוני. לחיצה מחוץ לא תסגור אותו.'
    button: 'פתח מודל'
  long:
    description: 'הצג מודל עם טקסט ארוך. הוא מבקש אישור לפני סגירה.'
    button: 'פתח מודל'
  form_rendered:
    description: 'הצג טופס לדוגמה בתוך מודל. Escape ולחיצה מחוץ מושבתים, והוא שואל לפני סגירה אם הטופס שונה.'
    button: 'פתח מודל'
  form_ajax:
    description: 'הצג טופס לדוגמה בתוך מודל באמצעות AJAX. Escape ולחיצה מחוץ מושבתים, והוא שואל לפני סגירה אם הטופס שונה.'
    button: 'פתח מודל'
  recursive:
    description: 'פתח דף דיאלוג בתוך דיאלוג אחר — בחר מודל או פאנל.'
    button_modal: 'פתח במודל'
    button_panel: 'פתח בפאנל'
