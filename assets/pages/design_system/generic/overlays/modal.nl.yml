~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Dialoog
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'Modaal met tabbladen. Open het, wissel van tab, druk op F5 — het modaal opent opnieuw op dezelfde tab.'
    button: 'Open modaal'
  simple:
    description: 'Toon een eenvoudig modaal. Je kunt het sluiten met Escape of door buiten het modaal te klikken.'
    button: 'Open modaal'
  components:
    description: 'Toon een modaal met componenten en een toast-trigger. Escape is uitgeschakeld, maar je kunt nog steeds buiten klikken om het te sluiten.'
    button: 'Open modaal'
  medium:
    description: 'Toon een modaal met tekst van gemiddelde lengte. Buiten klikken sluit het niet.'
    button: 'Open modaal'
  long:
    description: 'Toon een modaal met lange tekst. Het vraagt om bevestiging voordat het sluit.'
    button: 'Open modaal'
  form_rendered:
    description: 'Toon een weergegeven demoformulier binnen een modaal. Escape en buiten klikken zijn uitgeschakeld, en het vraagt voordat het sluit of het formulier is gewijzigd.'
    button: 'Open modaal'
  form_ajax:
    description: 'Toon een weergegeven demoformulier binnen een modaal met behulp van AJAX. Escape en buiten klikken zijn uitgeschakeld, en het vraagt voordat het sluit of het formulier is gewijzigd.'
    button: 'Open modaal'
  recursive:
    description: 'Open een dialoogpagina binnen een andere dialoog — kies modaal of paneel.'
    button_modal: 'Open in modaal'
    button_panel: 'Open in paneel'
