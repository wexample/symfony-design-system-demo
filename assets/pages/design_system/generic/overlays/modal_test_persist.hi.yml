  settings: सेटिंग्स
  loading: 'लोडिंग बार'
content:
  overview: 'यह अवलोकन टैब है। टैब स्विच करें फिर F5 दबाएं — जब ओवरले फिर से खुलता है, तब भी यह टैब सक्रिय रहेगा।'
  details: 'यह विवरण टैब है। सक्रिय टैब URL हैश में संग्रहीत होता है, इसलिए यह पृष्ठ के पुनः लोड होने पर भी बना रहता है।'
  settings: 'यह सेटिंग्स टैब है। ओवरले (मोडल/पैनल) और सक्रिय टैब दोनों URL हैश से पुनर्स्थापित होते हैं।'
  loading: 'नीचे दिए गए बटनों का उपयोग करके लोडिंग बार एनीमेशन को मैन्युअल रूप से ट्रिगर करें। यह बार ओवरले के शीर्ष पर तब दिखाई देता है जब एक फ़ॉर्म सबमिशन प्रगति में होता है।'
loading:
  start: 'शुरू करें'
  end: पूर्ण
