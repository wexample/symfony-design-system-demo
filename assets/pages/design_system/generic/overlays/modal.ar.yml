~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: حوار
page_icon: 'ph:bold/app-window'
section:
  persist:
    description: 'نافذة منبثقة مع علامات تبويب. افتحها، انتقل بين علامات التبويب، اضغط F5 — ستعاد فتح النافذة المنبثقة على نفس العلامة.'
    button: 'فتح النافذة المنبثقة'
  simple:
    description: 'عرض نافذة منبثقة بسيطة. يمكنك إغلاقها باستخدام مفتاح Escape أو بالنقر خارج النافذة المنبثقة.'
    button: 'فتح النافذة المنبثقة'
  components:
    description: 'عرض نافذة منبثقة مع مكونات وزر إشعار. تم تعطيل مفتاح Escape، ولكن يمكنك النقر خارج النافذة لإغلاقها.'
    button: 'فتح النافذة المنبثقة'
  medium:
    description: 'عرض نافذة منبثقة بنص متوسط الطول. النقر خارجها لن يغلقها.'
    button: 'فتح النافذة المنبثقة'
  long:
    description: 'عرض نافذة منبثقة بنص طويل. يطلب تأكيد قبل الإغلاق.'
    button: 'فتح النافذة المنبثقة'
  form_rendered:
    description: 'عرض نموذج تجريبي داخل نافذة منبثقة. يتم تعطيل مفتاح Escape والنقر الخارجي، ويطلب التأكيد قبل الإغلاق إذا تم تعديل النموذج.'
    button: 'فتح النافذة المنبثقة'
  form_ajax:
    description: 'عرض نموذج تجريبي داخل نافذة منبثقة باستخدام AJAX. يتم تعطيل مفتاح Escape والنقر الخارجي، ويطلب التأكيد قبل الإغلاق إذا تم تعديل النموذج.'
    button: 'فتح النافذة المنبثقة'
  recursive:
    description: 'فتح صفحة حوار داخل حوار آخر — اختر نافذة منبثقة أو لوحة.'
    button_modal: 'فتح في نافذة منبثقة'
    button_panel: 'فتح في لوحة'
