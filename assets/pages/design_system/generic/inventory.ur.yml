cell:
  absent: 'اس فارمیٹ میں نہیں ملا، اور اعلان یہ نہیں بتاتا کہ کیوں — ایک فیصلہ ابھی نہیں ہوا'
  todo: 'اس فارمیٹ میں مطلوب ہے اور ابھی وہاں نہیں ہے'
  shared: '%bundles% کے ذریعہ بھی رکھا گیا ہے۔ یہ کوئی غلطی نہیں ہے — لوڈر انہیں ایلیاس کے ذریعہ الگ کرتا ہے — لیکن یہ جاننا اہم ہے کہ آیا یہ ایک دوبارہ بنائی گئی عنصر ہے یا دو ہیں جو ایک نام بانٹتے ہیں۔'
format:
  style:
    title: انداز
    description: 'شیلی اسٹائل، لوڈر کے ذریعہ صفحہ پر ہونے پر لوڈ کیا جاتا ہے۔'
  template:
    title: سانچہ
    description: 'سرور ریندرر، جو ٹوئگ کے ذریعہ بنایا گیا ہے۔'
  vue:
    title: Vue
    description: 'کلائنٹ کا ہم شکل، جو ایک ہی اختیارات سے براؤزر میں بنایا گیا ہے۔'
  script:
    title: اسکرپٹ
    description: 'رویے، جو ایک بار دستاویز میں ہونے پر مارک اپ سے بندھ جاتا ہے۔'
  schema:
    title: سکیمہ
    description: 'معاہدہ: جو چیز عنصر لیتا ہے، اقسام اور ڈیفالٹس کے ساتھ۔ ہر دوسرے ریندرر کو اس کے خلاف چیک کیا جا سکتا ہے۔'
  ai:
    title: AI
    description: 'ایجنٹ کو عنصر کے بارے میں کیا بتایا جاتا ہے: سکیمہ، اسے کیسے استعمال کرنا ہے، وہ اوزار جو اس پر عمل کرتے ہیں۔'
  react:
    title: React
    description: 'ریئیکٹ ریندرر۔'
  flutter:
    title: Flutter
    description: 'فلٹر ریندرر، سکیمہ کے خلاف ڈارٹ میں لکھا گیا۔ مارک اپ منتقل نہیں ہوتا؛ معاہدہ اور ٹوکن ہی رہتے ہیں۔'
section:
  matrix:
    title: 'فارمیٹ کے مطابق عنصر'
    description: 'ہر کمپوننٹ کے لیے ایک قطار، ہر ریندرر کے لیے ایک کالم۔ ایک کمپوننٹ `components/` کے تحت ایک ڈائریکٹری ہے جس میں ہر طریقہ شامل ہے جس سے اسے بنایا جا سکتا ہے — `spinner/spinner.scss`, `spinner.html.twig`, `spinner.vue`, `spinner.ts` — تو یہاں کچھ بھی نام کے ذریعہ چار ڈائریکٹریوں کو ملانے کی ضرورت نہیں ہے۔ ایک سیل اس کے پیچھے کی فائلوں کی تعداد شمار کرتا ہے — ایک کو ہور کر کے انہیں دیکھیں۔ ہر اعلان کردہ عنصر اسی سطح پر پڑھتا ہے — ایک واحد فارمیٹ میں پائی گئی قطار ایک خلا یا ایک بنیادی چیز ہو سکتی ہے جو کچھ اور نہیں چاہتی، اور اس کو ترتیب دینا اس جدول کا کام ہے نہ کہ کچھ جو یہ پہلے سے جانتا ہے۔ چار حالتیں، جنہیں بتایا جاتا ہے کہ آگے کس کی باری ہے: ایک چیک، عنصر وہاں ہے؛ ایک انتباہ، یہ مطلوب ہے اور غائب ہے؛ ایک مٹا ہوا دائرہ، یہ جان بوجھ کر بغیر ہے؛ ایک خالی، ابھی تک کسی نے فیصلہ نہیں کیا۔ انتباہ یا دائرے پر ہور کریں تاکہ دیکھا جا سکے کہ اعلان کیا کہتا ہے۔'
  sources:
    title: 'یہ کہاں سے آتے ہیں'
    description: 'ایک بنڈل جدول میں ہے کیونکہ اس نے ایسا کہا — `DesignSystemElementsBundleInterface` کو نافذ کر کے، جس طرح ایک بنڈل لوڈر کو اپنے سامنے کے راستوں کے بارے میں بتاتا ہے۔ ہر ایک اپنے ہی اثاثوں کے اندر `data/elements.json` لکھتا ہے، جو ان کے ساتھ شائع ہوتا ہے، تاکہ تعمیر، نوڈ سائیڈ، دوسرے زبان یا ایجنٹ سب ایک ہی فائلوں سے کام کریں؛ یہ صفحہ صرف ان کا اتحاد ہے۔'
  abstract:
    title: خلاصہ
    description: 'پانچ بنیادیات `components/_abstract/` کے تحت، جنہیں کبھی نہیں بنایا جاتا — وہ صرف بڑھائے جاتے ہیں۔ `_abstract/vue` تین خالی ٹوئگ بلاک ہیں جن میں اکتیس سانچے بھرے جاتے ہیں؛ `_abstract/form-field` وہ ہے جس پر بارہ ان پٹس بنائے جاتے ہیں۔ وہ شکلوں کی طرح میٹرکس سے باہر ہیں: وہ کسی کو فراہم نہیں کیے جاتے، لہذا ان سے سکیمہ یا ریئیکٹ ہم شکل مانگنا ایک ایسا سوال ہے جس کا جواب دینے کا ان کے پاس کوئی طریقہ نہیں ہے۔ ٹائل کا نشان اس بات کا اشارہ دیتا ہے کہ کوئی بھی ڈائریکٹری کو کھولنے سے پہلے۔ جو دکھایا جاتا ہے وہ ہے جو ہر ایک پہلے سے ہی کسی کو بڑھاتے وقت لاتا ہے۔'
  shapes:
    title: شکلیں
    description: 'ایک شکل ایک انداز ہے جس کا کوئی ریندرر نہیں ہے: آپ مارک اپ لکھتے ہیں، اس پر کلاس لگاتے ہیں، اور اپنی شیلی اسٹائل سے `@use` کرتے ہیں۔ `.stack`, `.grid`, `.block`, `.cluster`۔ انہیں یہاں فہرست بند کیا گیا ہے اور اوپر جدول میں نہیں کیونکہ ریندرروں کی ایک جدول کے پاس کچھ پیش کرنے کے لیے کوئی کالم نہیں ہے جس کا کوئی نہیں ہے — اور اس کی عدم موجودگی ہی وجہ ہے کہ اس کے انتباہات کا مطلب کام ہے نہ کہ ایک غلط سوال۔ لائن فائلوں کے ذریعہ کھینچی گئی ہے، ذائقہ کے ذریعہ نہیں: ایک شکل بالکل ایک `.scss` ہے اور کچھ بھی اسے نہیں بناتا، تو جب ایک `.html.twig` حاصل ہوتا ہے تو یہ `components/` میں منتقل ہو جاتی ہے اور میٹرکس میں شامل ہو جاتی ہے۔ وہ حرکت ہی واحد ترقی ہے جو ہوتی ہے۔ جو ہر ایک اپنے بارے میں کہتا ہے وہ اپنی ہی شیلی اسٹائل کے سر سے پڑھا جاتا ہے، لہذا اس کے لیے کہیں اور جانے کی جگہ نہیں ہے۔'
  coverage:
    title: 'یہ کیا چھوڑتا ہے'
    description: '`assets/` کی ڈائریکٹریاں جو اسکین نہیں کرتی، ڈسک سے فہرست بند کی گئی ہیں نہ کہ یاداشت سے۔ مکسینز، یوٹیلٹیز اور ٹوکن عناصر نہیں ہیں اور یہاں کبھی بھی قطاریں نہیں ہو سکتیں؛ لے آؤٹ اور مشترکہ اسکرپٹس ہیں، اور ابھی تک احاطہ نہیں کیا گیا ہے۔'
