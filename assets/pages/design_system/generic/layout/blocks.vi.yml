    description: 'Một khối khác để minh họa khoảng cách.'
  three:
    title: 'Khối thứ ba'
    description: 'Một khối thứ ba trong hàng.'
  four:
    title: 'Khối thứ tư'
    description: 'Một khối thứ tư cho bản demo bố cục.'
  advanced:
    title: 'Dự đoán quy trình'
    status: 'Sẵn sàng'
    description: 'Khối này kết hợp các khe tiêu đề và nội dung trong một cấu trúc có thể tái sử dụng duy nhất.'
    details: 'Các toán tử có thể được thêm vào mà không cần rời khỏi ngữ cảnh hiện tại.'
  zones:
    main:
      title: 'Khu vực chính'
      description: 'Nội dung chính có thể phát triển tự nhiên với khoảng cách tiêu chuẩn.'
    aside:
      title: 'Khu vực bên'
      description: 'Khu vực bên này sử dụng nền sáng để làm nổi bật nội dung bổ sung.'
  zones_three:
    title: 'Bố cục ba khu vực'
    status: Nháp
    left:
      title: 'Bảng bên trái'
      description: 'Điều hướng phụ hoặc siêu dữ liệu có thể sống ở đây.'
    main:
      title: 'Nội dung chính'
      description: 'Thông tin chính được giữ ở giữa để dễ đọc.'
    right:
      title: 'Bảng bên phải'
      description: 'Các hành động và thông tin ngữ cảnh có thể được nhóm ở phía bên này.'
    footer:
      meta: 'Cập nhật 2 phút trước'
      action: 'Mở chi tiết'
