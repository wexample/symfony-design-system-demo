en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Tabs
  page_icon: ph:bold/signpost

  section:
    vue:
      title: Tabs in vue
      description: "The twig bar is a row of links and the address says which one is open. The vue bar only reports that a tab was asked for, so something around it holds the answer — here, a demo component."
    breadcrumb:
      vue_description: "The vue twin takes its items already resolved: the server holds the route table, so it answers it, and what crosses is the answer."
      title: Breadcrumb
      description: "Shows the user's location within the hierarchy. Use the breadcrumb partial — pass items with route and label; the last item is always rendered as current."
    tabs:
      title: Tabs
    default:
      normal:
        title: Basic tabs
      full:
        title: Basic tabs (full width)
      half:
        title: Basic tabs (half width zone)
    counts:
      title: Tabs with a count
      description: "How many of whatever the tab holds, at the end of the label. It is a pill and nothing else — pass `count` beside the label and the tab places it. An item without the key shows nothing, which is how a tab with nothing to count stays quiet."
    icons:
      normal:
        title: Tabs with icons
      full:
        title: Tabs with icons (full width)
      half:
        title: Tabs with icons (half width zone)

  breadcrumb:
    example:
      vue: In vue
      two_levels: Two levels
      three_levels: Three levels
    item:
      home: Home
      layout: Layout
      section: Blocks
      current: Navigation

  tab:
    one: Overview
    two: Activity
    three: Settings

  vue:
    panel:
      one: The first panel. Nothing was fetched and no address changed — the bar emitted, the holder swapped.
      two: The second panel.
      three: The third panel.

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'علامات التبويب'
  page_icon: 'ph:bold/signpost'
  section:
    vue:
      title: 'علامات التبويب في Vue'
      description: 'شريط التويج هو صف من الروابط والعنوان يوضح أي منها مفتوح. شريط Vue يبلغ فقط أنه تم الطلب لعلامة تبويب، لذا شيء حولها يحمل الإجابة — هنا، مكون عرض تجريبي.'
    breadcrumb:
      vue_description: 'التوأم في Vue يأخذ عناصره التي تم حلها مسبقًا: الخادم يحتفظ بجدول المسارات، لذا يجيب عليه، وما يعبر هو الإجابة.'
      title: 'مسار التنقل'
      description: 'يعرض موقع المستخدم داخل الهيكل. استخدم جزئية مسار التنقل — مرر العناصر مع المسار والتسمية؛ العنصر الأخير دائمًا يتم عرضه كحالي.'
    tabs:
      title: 'علامات التبويب'
    default:
      normal:
        title: 'علامات التبويب الأساسية'
      full:
        title: 'علامات التبويب الأساسية (عرض كامل)'
      half:
        title: 'علامات التبويب الأساسية (منطقة نصف العرض)'
    counts:
      title: 'علامات التبويب مع عد'
      description: 'عدد العناصر الموجودة في أي علامة تبويب، في نهاية التسمية. إنها حبة ولا شيء آخر — مرر `count` بجانب التسمية وستضعها علامة التبويب. عنصر بدون المفتاح لا يظهر شيئًا، وهذا هو كيف تبقى علامة التبويب التي ليس لديها شيء للعد هادئة.'
    icons:
      normal:
        title: 'علامات التبويب مع الرموز'
      full:
        title: 'علامات التبويب مع الرموز (عرض كامل)'
      half:
        title: 'علامات التبويب مع الرموز (منطقة نصف العرض)'
  breadcrumb:
    example:
      vue: 'في Vue'
      two_levels: مستويين
      three_levels: 'ثلاث مستويات'
    item:
      home: الرئيسية
      layout: التخطيط
      section: الكتل
      current: التنقل
  tab:
    one: 'نظرة عامة'
    two: النشاط
    three: الإعدادات
  vue:
    panel:
      one: 'اللوحة الأولى. لم يتم جلب أي شيء ولم يتغير العنوان — الشريط أصدر الصوت، وبدل الحامل.'
      two: 'اللوحة الثانية.'
      three: 'اللوحة الثالثة.'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ট্যাব
  page_icon: 'ph:bold/signpost'
  section:
    vue:
      title: 'ভিউতে ট্যাব'
      description: 'টুইগবার হলো লিংকের একটি সারি এবং ঠিকানা বলে কোনটি খোলা। ভিউবার কেবল জানায় যে একটি ট্যাব চাওয়া হয়েছে, তাই এর চারপাশে কিছু একটা উত্তর ধারণ করে — এখানে, একটি ডেমো কম্পোনেন্ট।'
    breadcrumb:
      vue_description: 'ভিউ টুইন ইতিমধ্যে সমাধান করা আইটেমগুলি গ্রহণ করে: সার্ভার রুট টেবিল ধারণ করে, তাই এটি উত্তর দেয়, এবং যা অতিক্রম করে সেটিই উত্তর।'
      title: ব্রেডক্রাম্ব
      description: 'হায়ারার্কির মধ্যে ব্যবহারকারীর অবস্থান প্রদর্শন করে। ব্রেডক্রাম্ব পার্সিয়াল ব্যবহার করুন — রুট এবং লেবেলসহ আইটেম পাস করুন; শেষ আইটেমটি সর্বদা বর্তমান হিসাবে রেন্ডার হয়।'
    tabs:
      title: ট্যাব
    default:
      normal:
        title: 'বেসিক ট্যাব'
      full:
        title: 'বেসিক ট্যাব (পূর্ণ প্রস্থ)'
      half:
        title: 'বেসিক ট্যাব (অর্ধ প্রস্থ অঞ্চল)'
    counts:
      title: 'গণনার সাথে ট্যাব'
      description: 'ট্যাবের কাছে যা কিছু আছে তার সংখ্যা, লেবেলের শেষে। এটি একটি পিল এবং আর কিছুই নয় — লেবেলের পাশে `count` পাস করুন এবং ট্যাব এটি স্থাপন করে। একটি কী ছাড়া একটি আইটেম কিছুই দেখায় না, যা একটি ট্যাবকে কিছু গণনা না করার জন্য চুপ থাকতে দেয়।'
    icons:
      normal:
        title: 'আইকনের সাথে ট্যাব'
      full:
        title: 'আইকনের সাথে ট্যাব (পূর্ণ প্রস্থ)'
      half:
        title: 'আইকনের সাথে ট্যাব (অর্ধ প্রস্থ অঞ্চল)'
  breadcrumb:
    example:
      vue: ভিউতে
      two_levels: 'দুই স্তর'
      three_levels: 'তিন স্তর'
    item:
      home: হোম
      layout: লেআউট
      section: ব্লক
      current: নেভিগেশন
  tab:
    one: সারসংক্ষেপ
    two: কার্যকলাপ
    three: সেটিংস
  vue:
    panel:
      one: 'প্রথম প্যানেল। কিছু তুলা হয়নি এবং কোন ঠিকানা পরিবর্তন হয়নি — বারটি নির্গত হয়েছে, হোল্ডারটি পরিবর্তিত হয়েছে।'
      two: 'দ্বিতীয় প্যানেল।'
      three: 'তৃতীয় প্যানেল।'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Tabs
  page_icon: 'ph:bold/signpost'
  section:
    vue:
      title: 'Tabs in Vue'
      description: 'Die Twig-Leiste ist eine Reihe von Links und die Adresse zeigt an, welcher geöffnet ist. Die Vue-Leiste meldet nur, dass eine Registerkarte angefordert wurde, daher hält etwas darum die Antwort — hier eine Demokomponente.'
    breadcrumb:
      vue_description: 'Der Vue-Zwilling nimmt seine Elemente bereits gelöst: Der Server hält die Routentabelle, also beantwortet er sie, und was kreuzt, ist die Antwort.'
      title: Breadcrumb
      description: 'Zeigt den Standort des Benutzers innerhalb der Hierarchie an. Verwenden Sie den Breadcrumb-Teil — übergeben Sie Elemente mit Route und Bezeichnung; das letzte Element wird immer als aktuell gerendert.'
    tabs:
      title: Tabs
    default:
      normal:
        title: 'Einfache Tabs'
      full:
        title: 'Einfache Tabs (volle Breite)'
      half:
        title: 'Einfache Tabs (halbe Breite)'
    counts:
      title: 'Tabs mit Zählung'
      description: 'Wie viele von dem, was die Registerkarte enthält, am Ende der Bezeichnung. Es ist eine Pille und sonst nichts — übergeben Sie `count` neben der Bezeichnung und die Registerkarte platziert es. Ein Element ohne den Schlüssel zeigt nichts an, so bleibt eine Registerkarte ohne etwas zu zählen still.'
    icons:
      normal:
        title: 'Tabs mit Icons'
      full:
        title: 'Tabs mit Icons (volle Breite)'
      half:
        title: 'Tabs mit Icons (halbe Breite)'
  breadcrumb:
    example:
      vue: 'In Vue'
      two_levels: 'Zwei Ebenen'
      three_levels: 'Drei Ebenen'
    item:
      home: Startseite
      layout: Layout
      section: Blöcke
      current: Navigation
  tab:
    one: Übersicht
    two: Aktivität
    three: Einstellungen
  vue:
    panel:
      one: 'Das erste Panel. Nichts wurde abgerufen und keine Adresse hat sich geändert — die Leiste hat ausgesendet, der Halter hat gewechselt.'
      two: 'Das zweite Panel.'
      three: 'Das dritte Panel.'

