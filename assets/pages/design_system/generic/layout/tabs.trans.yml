    counts:
      title: 'برگه‌ها با شمارش'
      description: 'چند تا از هر آنچه برگه نگه می‌دارد، در انتهای برچسب. این یک قرص است و هیچ چیز دیگری — `count` را در کنار برچسب بگذارید و برگه آن را قرار می‌دهد. یک مورد بدون کلید هیچ چیزی نشان نمی‌دهد، که اینگونه یک برگه با هیچ شماری سکوت می‌کند.'
    icons:
      normal:
        title: 'برگه‌ها با آیکون‌ها'
