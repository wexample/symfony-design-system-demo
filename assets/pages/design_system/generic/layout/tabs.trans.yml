    two: فعالیت
    three: تنظیمات
  vue:
    panel:
      one: 'پنل اول. هیچ چیزی دریافت نشد و آدرس تغییر نکرد — نوار صادر شد، نگهدارنده تعویض شد.'
      two: 'پنل دوم.'
      three: 'پنل سوم.'

