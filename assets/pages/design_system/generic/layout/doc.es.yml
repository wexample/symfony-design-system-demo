page_title: 'Diseño del documento'
page_icon: 'ph:bold/book-open'
intro: 'El diseño del documento es un patrón de dos columnas para páginas de documentación: descripción a la izquierda, código a la derecha, que se colapsa a una sola columna en dispositivos móviles.'
section:
  structure:
    title: Estructura
    body: 'Usa .doc como el contenedor exterior y .doc-section para cada fila. Cada sección tiene una columna .doc-section--description y una columna .doc-section--code.'
example:
  demo_placeholder: 'Contenido de demostración'
  one:
    title: 'Sección básica'
    body: 'Una sección típica empareja un bloque de descripción con un fragmento de código.'
  two:
    title: 'Con un bloque de código'
    body: 'Usa el fragmento de código dentro de .doc-section--code para ejemplos con resaltado de sintaxis.'
