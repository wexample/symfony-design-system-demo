~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Пять колонок'
page_icon: 'ph:bold/arrows-horizontal'
intro: 'Пять областей в ряд шире экрана, читаются прокруткой вбок. Навигация слева не входит в их число — это область страницы, и она остается на месте.'
section:
  scroll:
    title: 'Ряд прокручивается, страница — нет'
    description: '`zone--split--scroll` помещает переполнение в ряд: колонки сохраняют свою заданную ширину, а раздел прокручивается под ними. Каждая из них все еще имеет собственное вертикальное переполнение, поэтому длинная колонка прокручивается там, где она стоит.'
  width:
    title: 'Каждая колонка задает свою ширину'
    description: 'Ничто не занимает оставшееся здесь пространство, поскольку его нет: ряд шире страницы намеренно. Область, которая не задает размер, отступает к колонке, широкой достаточно для чего-то, и они задают свои размеры — по 24rem каждая, всего пять.'
  fold:
    title: 'Свертывание области'
    description: 'Каждая колонка здесь является `zone-collapsible`. В свернутом состоянии она не исчезает: сохраняет свое место в ряду и свою основу, а ее панель поворачивается на бок — так что кнопка, которая ее свернула, является кнопкой, которая ее открывает, и ничто внешнее не должно знать о ее существовании.'
    more: 'Названная область запоминается: состояние записывается в состояние интерфейса под ее именем и считывается обратно, когда страница загружается, так что она приходит свернутой, а не свертывается у вас на глазах. Третья колонка открывается свернутой, а последняя отображается с помощью vue — один и тот же компонент, одни и те же классы, один и тот же ключ.'
column:
  first: 'Прочитай меня'
  second: Бэклог
  third: 'В процессе'
  fourth: 'На проверке'
  fifth: Сделано
card:
  second: Заявка
  third: Заявка
  fourth: Заявка
  fifth: Заявка
  body: 'То, что содержит колонка, не касается ряда: она прокручивается сама, под панелью, которая остается.'
