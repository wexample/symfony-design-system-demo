~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: เลย์เอาต์
page_icon: 'ph:bold/layout'
intro: 'วิธีการแบ่งหน้า หน้าเหล่านี้ใช้พื้นที่มากกว่าคอนเทนต์: มันบอกว่ามีสิ่งใดอยู่ที่ไหน และไม่รู้ว่ามีอะไรอยู่ตรงนั้น'
page:
  zones:
    title: โซน
    description: 'พื้นที่ทำงานแบบสองบาน: แบ่ง, คอลัมน์ขนาด, เนื้อหาที่เลื่อนดูได้ สิ่งที่นักสำรวจ, บรรณาธิการ และการดูรายละเอียดในแอปทุกตัวสร้างขึ้นมา'
  workspace:
    title: พื้นที่ทำงาน
    description: 'หน้าเว็บที่ประกอบด้วยพื้นที่จัดเรียงข้างกัน แยกจากกันด้วยช่องว่างระหว่างพวกเขาและไม่มีอย่างอื่น การจัดเรียงสามแบบ เคลื่อนที่ระหว่างกันด้วยต้นไม้ที่อยู่ในแต่ละพื้นที่'
  blocks:
    title: บล็อก
    description: 'พื้นผิวที่กลุ่มของสิ่งต่าง ๆ นั่งอยู่ มีการใส่ขอบหรือไม่ก็ตาม พร้อมด้วยรูปแบบการ์ดและรูปภาพ'
  toolbar:
    title: แถบเครื่องมือ
    description: 'แถบของการกระทำที่อยู่ด้านบนหรือล่างของสิ่งที่มันทำงานอยู่ โดยมีความหนาที่กว้างและกะทัดรัด'
  tabs:
    title: แท็บ
    description: 'หนึ่งหน้าที่แสดงหนึ่งในหลายหน้า พร้อมกับแผงที่ตามตัวเลือกนั้น'
  doc:
    title: การจัดเลย์เอาต์เอกสาร
    description: 'รูปแบบเอกสารแบบสองคอลัมน์ — เนื้อหาอยู่ด้านหนึ่ง, โค้ดอยู่ด้านอื่น — ที่พับเป็นหนึ่งคอลัมน์เมื่อไม่มีพื้นที่'
