page_title: Loitsut
page_icon: 'ph:bold/squares-four'
tone:
  body: 'maan pinta pysyy lohkon omana, vain etureuna kantaa väriä.'
section:
  tone:
    title: 'Väriä kantava lohko'
    description: 'Valtion — tai kategorian — väri etureunassa, eikä mitään muuta: sama palkki, jonka viesti kantaa, ilman värillistä taustaa, jotta niiden lista luettaisiin listana eikä hälytyksenä. Mikä tahansa lohko ottaa sen, myös palkki, joka seisoo lohkolla.'
  default:
    title: Peruslohkot
  advanced:
    title: 'Edistyneet lohkot'
  aside:
    title: 'Kiinteä sivupaneeli'
    description: 'Kapea sarake, joka on mitoitettu --size-asteikolla, vartalon viereen, joka vie jäljelle jäävän leveyden.'
  card:
    title: Kortit
  link:
    title: 'Lohko, joka on linkki'
    description: 'Koko kortti on linkki — valinta, joka tehdään valitsemalla yksi kortti useista: suunnitelma, haara, malli. Se luetaan tekstinä, ei vaimeana toimintona; osoittimen alla sen tausta saa sävyn ja sen reuna tiivistyy, ja näppäimistö löytää sen fokussiren avulla, joka jokaisella ohjaimella on.'
  figure:
    title: Kuvastot
    description: 'Yksi suurennettu arvo tai ikoni, keskitetty. Käytetään hallintapaneelin laskureissa ja tilatilanteissa — lisää block--square, jotta laatikko pysyy neliönä sen leveydestä huolimatta.'
  stacks:
    title: Pinoja
  stack_horizontal:
    title: Vaakasuora
    description: 'Tasakokoiset sarakkeet, täysi leveys, kääntyy ylivuodossa.'
  stack_vertical:
    title: Pystysuora
    description: 'Pinoamattomat rivit, täysi leveys, tasainen väli.'
  stack_split:
    title: Jaettu
    description: 'Ensimmäinen lapsi kasvaa, viimeinen lapsi pysyy kiinteänä — käytetään johtaja + toiminta riveissä.'
  stack_nested:
    title: Sisäkkäin
    description: 'Vaakasuora pino, joka sisältää pystysuoria pinoja — tyypillinen hallintapaneelin ruudukko.'
