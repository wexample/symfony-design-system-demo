page_title: ট্যাব
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'ভিউতে ট্যাব'
    description: 'টুইগবার হলো লিংকের একটি সারি এবং ঠিকানা বলে কোনটি খোলা। ভিউবার কেবল জানায় যে একটি ট্যাব চাওয়া হয়েছে, তাই এর চারপাশে কিছু একটা উত্তর ধারণ করে — এখানে, একটি ডেমো কম্পোনেন্ট।'
  breadcrumb:
    vue_description: 'ভিউ টুইন ইতিমধ্যে সমাধান করা আইটেমগুলি গ্রহণ করে: সার্ভার রুট টেবিল ধারণ করে, তাই এটি উত্তর দেয়, এবং যা অতিক্রম করে সেটিই উত্তর।'
    title: ব্রেডক্রাম্ব
    description: 'হায়ারার্কির মধ্যে ব্যবহারকারীর অবস্থান প্রদর্শন করে। ব্রেডক্রাম্ব পার্সিয়াল ব্যবহার করুন — রুট এবং লেবেলসহ আইটেম পাস করুন; শেষ আইটেমটি সর্বদা বর্তমান হিসাবে রেন্ডার হয়।'
  tabs:
    title: ট্যাব
  default:
    normal:
      title: 'বেসিক ট্যাব'
    full:
      title: 'বেসিক ট্যাব (পূর্ণ প্রস্থ)'
    half:
      title: 'বেসিক ট্যাব (অর্ধ প্রস্থ অঞ্চল)'
  counts:
    title: 'গণনার সাথে ট্যাব'
    description: 'ট্যাবের কাছে যা কিছু আছে তার সংখ্যা, লেবেলের শেষে। এটি একটি পিল এবং আর কিছুই নয় — লেবেলের পাশে `count` পাস করুন এবং ট্যাব এটি স্থাপন করে। একটি কী ছাড়া একটি আইটেম কিছুই দেখায় না, যা একটি ট্যাবকে কিছু গণনা না করার জন্য চুপ থাকতে দেয়।'
  icons:
