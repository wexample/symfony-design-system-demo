link:
  starter:
    title: 스타터
    description: '한 사람, 필수 요소, 지불할 필요 없음.'
  team:
    title: 팀
    description: '같은 일에 함께하는 몇 명의 사람들입니다.'
  company:
    title: 회사
    description: '모든 팀과 조직이 요청하는 제어 기능이 포함됩니다.'
