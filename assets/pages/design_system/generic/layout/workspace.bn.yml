~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: কর্মক্ষেত্র
page_icon: 'ph:bold/sidebar-simple'
intro: 'এই পৃষ্ঠাটি একটি উদাহরণ: আপনি যা পড়ছেন তা তিনটি অঞ্চলের মাঝখানে অবস্থিত, যা পৃষ্ঠার দেহে পাশাপাশি রাখা হয়েছে।'
section:
  gap:
    title: 'ফাঁক হল বিভাজক'
    description: 'দুই অঞ্চলের মধ্যে কিছুই আঁকা হয়নি। তাদের আলাদা করে যা রয়েছে তা হল তাদের মধ্যে ফাঁকা স্থান, যার মাধ্যমে পৃষ্ঠাটি দেখায় — একই মাটিতে যা মেনু এবং হেডার দাঁড়িয়ে আছে। প্রতিটি অঞ্চল নিজস্ব ধারণ করে, যা হল একটি দেহের সবসময় থাকা মাটি।'
  each:
    title: 'প্রতিটি নিজের মতো'
    description: 'দুইটি কলাম তাদের প্রদত্ত প্রস্থ ধরে রাখে এবং মাঝেরটি যা অবশিষ্ট থাকে তা নেয়। তিনটির মধ্যে একটি স্ক্রোল করুন এবং অন্য দুটি যেখানে আছে সেখানে থাকে: একটি অঞ্চল তার নিজের অতিরিক্ত ধারণ করে, এবং পৃষ্ঠা কোন অতিরিক্ত ধারণ করে না।'
    more: 'একটি অঞ্চল তার প্রতিবেশীদের সম্পর্কে কিছুই জানে না। বামপাশের এক্সপ্লোরার হল তার নিজস্ব একটি বিভাজন — একটি বার যা থাকে, একটি গাছ যা এর নীচে স্ক্রোল করে — এবং এটি পৃষ্ঠার অন্য কোথাও একই আকারের হবে।'
  size:
    title: 'একটিকে আকার দেওয়া'
    description: 'বামপাশের অঞ্চল একটি `zone-resizer` ধারণ করে: একটি হ্যান্ডেল যা এর পাশে ফাঁকা স্থান পূরণ করে, যা কিছুই আঁকে না — কার্সর বলে এটি সরানো যায়। এটি টেনে এনে, বা একে ফোকাস দিয়ে তীরচিহ্ন ব্যবহার করুন; একটি ডাবল ক্লিক অঞ্চলটিকে সেই প্রস্থ ফিরিয়ে দেয় যা পৃষ্ঠা এটিকে দিয়েছে।'
    more: 'একটি হ্যান্ডেল একটি অঞ্চলের আকার দেয় যা একটি আকার ধারণ করে — একটি প্রস্থ দেওয়া হয়েছে বরং যা অবশিষ্ট তা নেওয়া — এবং পাশের নমনীয়টি পার্থক্য শোষণ করে। প্রস্থটি অঞ্চলের নামে মনে রাখা হয়, তাই এটি পৃষ্ঠার সঙ্গে ফিরে আসে, এখানে তিনটি বিন্যাসের মধ্যে যেহেতু এটি একই অঞ্চল চলছে।'
