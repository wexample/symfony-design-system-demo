~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 레이아웃
page_icon: 'ph:bold/layout'
intro: '페이지가 어떻게 나뉘는지에 대한 설명. 이 형태는 콘텐츠가 아닌 영역을 차지하며, 사물이 어디에 위치하는지를 나타내고, 그곳에 무엇이 있는지는 알지 못합니다.'
page:
  zones:
    title: 존
    description: '두 개의 패널로 구성된 작업 공간: 분할된 크기 열과 스크롤 가능한 본문. 모든 탐색기, 편집기 및 앱의 세부 정보 뷰가 기반하는 것입니다.'
  workspace:
    title: '작업 공간'
    description: '나란히 배치된 영역으로 구성된 페이지, 그들 사이의 공간에 의해 구분되며 그 외에는 아무것도 없습니다. 세 가지 배열이 있으며, 각 배열 사이에는 트리가 있습니다.'
  blocks:
    title: 블록
    description: '물체 그룹이 놓이는 표면, 패딩이 있든 없든, 카드 및 도형 변형이 포함됩니다.'
  toolbar:
    title: 툴바
    description: '작용하는 것의 위 또는 아래에 있는 동작의 줄, 널찍하고 컴팩트한 밀도로 구성됩니다.'
  tabs:
    title: 탭
    description: '여러 면 중 하나를 보여주는 한 페이지, 선택에 따라 패널이 따라옵니다.'
  doc:
    title: '문서 레이아웃'
    description: '한쪽에는 프로세가, 다른 쪽에는 코드가 있는 두 열 문서 패턴 — 공간이 없을 때는 한 열로 접히는 형식입니다.'
