~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ความกว้างคงที่
page_icon: 'ph:bold/arrows-in-line-horizontal'
intro: 'สามพื้นที่เหมือนเดิม แต่พื้นที่ที่คุณกำลังอ่านมีความกว้างที่กำหนดแทนที่จะรับความกว้าง — และความกว้างที่ไม่มีใครต้องการจะไปอยู่ในพื้นที่ที่ไม่มีอะไรอยู่เลย'
section:
  sized:
    title: พื้นที่ที่กำหนดความกว้าง
    description: '`zone--narrow` ที่มีขนาดขั้น: พื้นที่นี้มีความกว้างเท่านี้และยังคงความกว้างนี้ไม่ว่าในหน้าต่างจะมีพื้นที่เหลือเท่าไหร่ นี่คือวิธีที่ทำให้ข้อความอ่านได้ — คอลัมน์ที่ขยายตามหน้าจอจะไม่ถือว่าเป็นคอลัมน์อีกต่อไป'
  slack:
    title: พื้นที่ว่างมีไว้ทำอะไร
    description: 'พื้นที่สุดท้ายไม่มีอะไรอยู่ และยังคงยืนอยู่ได้: ว่างเปล่าไม่ได้หมายความว่าไม่มี และแผงที่รออยู่จะถูกมองว่าเป็นแผงมากกว่าที่จะเป็นหลุม มันมีไว้เพื่อรับความกว้างที่พื้นที่ที่มีขนาดไม่ต้องการ'
    more: 'การแบ่งจะส่งมอบส่วนที่เหลือให้กับสิ่งที่ขอ มันไม่มีอะไรขอ, พื้นที่ที่มีขนาดจะถูกยืดหรือดันไปจนถึงขอบ; แต่ด้วยสิ่งนี้ พวกมันจะรักษาความกว้างของตัวเองและหน้าเว็บจะเก็บส่วนที่เหลือไว้'
work:
  size: 32rem
