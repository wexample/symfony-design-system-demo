page_title: 'Mise en page du doc'
page_icon: 'ph:bold/book-open'
intro: 'La mise en page du doc est un modèle à deux colonnes pour les pages de documentation — description à gauche, code à droite — qui se réduit à une seule colonne sur mobile.'
section:
  structure:
    title: Structure
    body: 'Utilisez .doc comme conteneur extérieur et .doc-section pour chaque ligne. Chaque section a une colonne .doc-section--description et une colonne .doc-section--code.'
example:
  demo_placeholder: 'Contenu de démonstration'
  one:
    title: 'Section de base'
    body: 'Une section typique associe un bloc de description à un extrait de code.'
  two:
    title: 'Avec un bloc de code'
    body: "Utilisez le partiel code-block à l'intérieur de .doc-section--code pour des exemples avec mise en surbrillance de la syntaxe."
