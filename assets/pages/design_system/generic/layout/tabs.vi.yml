  panel:
    one: 'Bảng đầu tiên. Không có gì được lấy và không có địa chỉ nào thay đổi — thanh đã phát ra, người giữ đã hoán đổi.'
    two: 'Bảng thứ hai.'
    three: 'Bảng thứ ba.'
