~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Thẻ
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'Thẻ trong vue'
    description: 'Thanh twig là một hàng các liên kết và địa chỉ cho biết cái nào đang mở. Thanh vue chỉ báo rằng một thẻ đã được yêu cầu, vì vậy cái gì đó xung quanh nó giữ câu trả lời — ở đây, một thành phần demo.'
  breadcrumb:
    vue_description: 'Cặp vue lấy các mục của nó đã được giải quyết: máy chủ giữ bảng định tuyến, vì vậy nó trả lời và cái gì đi qua là câu trả lời.'
    title: 'Dấu hiệu đường đi'
    description: 'Hiển thị vị trí của người dùng trong cấu trúc phân cấp. Sử dụng phần dấu hiệu đường đi — truyền các mục với lộ trình và nhãn; mục cuối cùng luôn được hiển thị như hiện tại.'
  tabs:
    title: Thẻ
  default:
    normal:
      title: 'Thẻ cơ bản'
    full:
      title: 'Thẻ cơ bản (đầy đủ chiều rộng)'
    half:
      title: 'Thẻ cơ bản (nửa chiều rộng)'
  counts:
    title: 'Thẻ với số lượng'
    description: 'Bao nhiêu cái gì đó mà thẻ giữ, ở cuối nhãn. Nó là một viên thuốc và không gì khác — truyền `count` bên cạnh nhãn và thẻ sẽ đặt nó. Một mục không có khóa sẽ không hiển thị gì, đó là cách một thẻ không có gì để đếm giữ im lặng.'
  icons:
    normal:
      title: 'Thẻ với biểu tượng'
    full:
      title: 'Thẻ với biểu tượng (đầy đủ chiều rộng)'
    half:
      title: 'Thẻ với biểu tượng (nửa chiều rộng)'
breadcrumb:
  example:
    vue: 'Trong vue'
    two_levels: 'Hai cấp'
    three_levels: 'Ba cấp'
  item:
    home: 'Trang chủ'
