page_title: בלוקים
page_icon: 'ph:bold/squares-four'
tone:
  body: 'הקרקע נשארת של הבלוק, רק הקצה המוביל נושא את הצבע.'
section:
  tone:
    title: 'בלוק נושא גוון'
    description: 'צבע של מצב — או של קטגוריה — כמו פס לאורך הקצה המוביל, ולא יותר: אותו פס שלובש הודעה, בלי הקרקע המגוננת, כך שרשימה מהם נקראת כרשימה ולא כאזעקה. כל בלוק לוקח את זה, פס העומד על בלוק כלול.'
  default:
    title: 'בלוקים בסיסיים'
  advanced:
    title: 'בלוקים מתקדמים'
  aside:
    title: 'עמודה קבועה בצד'
    description: 'עמודה צרה בגודל על פי --גודל, ליד גוף שסופג את הרוחב הנותר.'
  card:
    title: כרטיסים
  link:
    title: 'בלוק שהוא קישור'
    description: 'הכרטיס כולו הוא הקישור — עבור בחירה שנעשית על ידי בחירת כרטיס אחד מתוך מספר: תוכנית, ענף, תבנית. זה נקרא כטקסט, לא כפעולה מוחלשת; תחת הסמן הקרקע שלו לוקחת גוון והקצה מתייצב, והמקלדת מוצאת אותו על ידי טבעת הפוקוס שכל שליטה נושאת.'
  figure:
    title: דמויות
    description: 'ערך או אייקון אחד מוגדל, ממורכז. משמש עבור מדדים בלוח מחוונים ולוחות סטטוס — הוסף block--square כדי לשמור על הלוח מרובע לא משנה מה רוחבו.'
  stacks:
    title: ערימות
  stack_horizontal:
    title: אופקי
    description: 'עמודות שוות, ברוחב מלא, מתעטפות כאשר יש שפע.'
  stack_vertical:
    title: אנכי
    description: 'שורות מוערמות, ברוחב מלא, רווח אחיד.'
  stack_split:
    title: מפוצל
    description: 'הילד הראשון גדל, הילד האחרון נשאר קבוע — משמש עבור שורות מובילות + פעולות.'
  stack_nested:
    title: מקונן
    description: 'ערימה אופקית המכילה ערימות אנכיות — רשת לוח מחוונים טיפוסית.'
