~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 固定宽度
page_icon: 'ph:bold/arrows-in-line-horizontal'
intro: 三个区域，但你正在阅读的区域是有宽度的，而不是随意取宽度——而没有人想要的宽度则被分配给一个空的区域。
section:
  sized:
    title: 指定宽度的区域
    description: '`zone--narrow` 具有大小步骤：该区域宽度固定，无论窗口有多大，它都保持这个宽度。这是保持文本可读性的方式——一个随着屏幕增长的列不再是一个列。'
  slack:
    title: 松弛的作用
    description: 最后一个区域是空的，但仍然占据空间：空并不等于缺失，等待的窗格看起来像一个窗格，而不是一个洞。它的存在是为了占据指定区域拒绝的宽度。
    more: 一个分隔将剩余的空间分配给任何需要它的地方。没有任何需求时，指定区域会被拉伸或推向边缘；有了这个，它们保持自己的宽度，页面保留其余部分。
work:
  size: 32rem
