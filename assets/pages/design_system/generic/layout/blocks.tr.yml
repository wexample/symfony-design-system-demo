    description: 'İlk çocuk büyür, son çocuk sabit kalır — lider + eylem satırları için kullanılır.'
  stack_nested:
    title: 'İç içe'
    description: 'Dikey yığınlar içeren yatay yığın — tipik gösterge panosu ızgarası.'
