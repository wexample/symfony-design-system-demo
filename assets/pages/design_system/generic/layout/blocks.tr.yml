tone:
  body: 'Zemin bloğun kendine ait kalır, yalnızca ön kenar renk taşır.'
section:
  tone:
    title: 'Bir tonu taşıyan blok'
    description: 'Bir durumun — veya bir kategorinin — ön kenarda bir çubuk olarak rengi, ve başka bir şey değil: bir mesajın taşıdığı aynı çubuk, boyalı zemin olmadan, böylece bir listesinin bir liste olarak okunmasını sağlar ve bir alarm olarak değil. Her blok bunu alır, bir blok üzerinde duran bir çubuk da dahil.'
  default:
    title: 'Temel bloklar'
  advanced:
    title: 'Gelişmiş bloklar'
  aside:
    title: 'Sabit yan sütun'
    description: 'Kalan genişliği absorbe eden bir gövdenin yanında, --boyut ölçeğine göre boyutlandırılmış dar bir sütun.'
  card:
    title: Kartlar
  link:
    title: 'Bir bağlantı olan blok'
    description: 'Tüm kart bağlantıdır — birkaç kart arasından birini seçerek yapılan bir seçim için: bir plan, bir dal, bir şablon. Metin olarak okunur, sönük bir eylem olarak değil; imleç altında zemini bir nüans alır ve kenarı sıkılaşır, klavye her kontrolün giydiği odak halkasıyla onu bulur.'
  figure:
    title: Figürler
    description: 'Ortada, tek bir büyük değer veya simge. Gösterge panelleri sayaçları ve durum kutucukları için kullanılır — genişliği ne olursa olsun kutucuğun kare kalmasını sağlamak için block--square ekleyin.'
