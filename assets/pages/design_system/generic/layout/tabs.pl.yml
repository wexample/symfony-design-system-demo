~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Karty
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'Karty w vue'
    description: 'Pasek z zakładkami to rząd linków, a adres wskazuje, który jest otwarty. Pasek vue tylko informuje, że poproszono o kartę, więc coś wokół niego zawiera odpowiedź — tutaj, komponent demonstracyjny.'
  breadcrumb:
    vue_description: 'Vue twin bierze swoje elementy już rozwiązane: serwer trzyma tabelę tras, więc odpowiada na nią, a to, co przechodzi, to odpowiedź.'
    title: Okruszki
    description: 'Pokazuje lokalizację użytkownika w hierarchii. Użyj części okruszków — przekaż elementy z trasą i etykietą; ostatni element zawsze renderowany jest jako aktualny.'
  tabs:
    title: Karty
  default:
    normal:
      title: 'Podstawowe karty'
    full:
      title: 'Podstawowe karty (pełna szerokość)'
    half:
      title: 'Podstawowe karty (połowa szerokości)'
  counts:
    title: 'Karty z licznikiem'
    description: 'Ile czegokolwiek zawiera karta, na końcu etykiety. To jest pigułka i nic więcej — przekaż `count` obok etykiety, a karta umieści to. Element bez klucza nic nie pokazuje, dlatego karta bez niczego do policzenia milczy.'
  icons:
    normal:
      title: 'Karty z ikonami'
    full:
      title: 'Karty z ikonami (pełna szerokość)'
    half:
      title: 'Karty z ikonami (połowa szerokości)'
breadcrumb:
  example:
    vue: 'W vue'
    two_levels: 'Dwa poziomy'
    three_levels: 'Trzy poziomy'
  item:
    home: 'Strona główna'
    layout: Układ
    section: Bloki
    current: Nawigacja
tab:
  one: Przegląd
  two: Aktywność
  three: Ustawienia
vue:
  panel:
    one: 'Pierwszy panel. Nic nie zostało pobrane i żaden adres się nie zmienił — pasek wyemitował, uchwyt wymieniono.'
    two: 'Drugi panel.'
    three: 'Trzeci panel.'
