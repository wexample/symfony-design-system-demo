~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'مساحة العمل'
page_icon: 'ph:bold/sidebar-simple'
intro: 'هذه الصفحة هي المثال: ما تقرأه يقع في وسط ثلاث مناطق، موضوعة جنبًا إلى جنب في جسم الصفحة.'
section:
  gap:
    title: 'الفجوة هي الفاصل'
    description: 'لا يوجد شيء مرسوم بين منطقتين. ما يميز بينهما هو المساحة التي تتركها بينهما، والتي من خلالها تظهر الصفحة — نفس الأرض التي يقف عليها القائمة والرأس. كل منطقة تحمل خاصيتها، وهي الأرض التي كانت دائمًا موجودة في الجسم.'
  each:
    title: 'كل واحدة بمفردها'
    description: 'تحافظ العمودان على العرض الذي تم إعطاؤه لهما ويأخذ الوسط ما تبقى. قم بالتمرير في واحدة من الثلاثة وستبقى الاثنتين الأخريين في مكانهما: تحتفظ المنطقة بتجاوزها الخاص، والصفحة لا تحتفظ بأي.'
    more: 'لا تعرف المنطقة شيئًا عن جيرانها. المستكشف على اليسار هو قسم خاص بها — شريط يبقى، شجرة تتمرر تحتها — وسيكون بنفس الشكل في أي مكان آخر في الصفحة.'
  size:
    title: 'تغيير حجم أحدها'
    description: 'تحمل المنطقة على اليسار `موسع المنطقة`: مقبض يملأ الفجوة بجانبها، والذي لا يرسم شيئًا — المؤشر يقول إنه يتحرك. اسحبه، أو امنحه التركيز واستخدم الأسهم؛ نقرة مزدوجة تعيد للمنطقة العرض الذي منحته إياها الصفحة.'
    more: 'يغير المقبض حجم منطقة لها حجم — واحدة تم إعطاؤها عرضًا بدلاً من أخذ ما تبقى — ويمتص المرن بجانبها الفرق. يتم تذكر العرض تحت اسم المنطقة، لذا يعود مع الصفحة، هنا في جميع التخطيطات الثلاثة لأنه نفس المنطقة التي تتحرك.'
