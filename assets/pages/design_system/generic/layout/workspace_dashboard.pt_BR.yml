~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Painel
page_icon: 'ph:bold/squares-four'
mode:
  reopen: 'Reabrir o painel da API'
  gap: 'Com lacunas'
  flush: Esvaziar
state:
  success: Normal
  warning: Degradado
  error: Falhando
  running: Descarregando
tile:
  traffic:
    title: Tráfego
    figure: '12,4k req/min'
    description: 'Divisões dentro de uma divisão: a parede é uma divisão vertical de linhas, cada linha é uma divisão própria. Arraste a borda abaixo desta linha para aumentar sua altura, ou a ao lado deste painel para mais largura.'
  latency:
    title: 'Latência p95'
    figure: '184 ms'
    description: 'Cada painel nomeia um andar, `zone--min-*`: abaixo dele o painel não é comprimido, a moldura rola em vez disso — para os lados e para baixo.'
  errors:
    title: Erros
    figure: '2.1 %'
    description: 'Redimensionado, uma zona mantém o tamanho em que foi deixada ao longo do eixo de sua divisão, e retorna com ele; um duplo clique na alça devolve ao estado original da divisão.'
  queue:
    title: Fila
    figure: '318 trabalhos'
    description: '`zone--split--flush` reduz a lacuna a um pixel, a base da parede traçando a linha entre os painéis. Uma classe na parede é suficiente, as linhas herdam isso.'
  deploys:
    title: Implantações
    figure: '7 hoje'
    description: 'Sem isso, a mesma parede mantém o espaço entre seus painéis, através do qual o fundo da página aparece — mude na barra acima. Role para a direita para um painel carregado apenas quando é visto.'
