en:
  page_title: Focus
  card:
    title: One thing to do
    body: "The window is one region: its ground is a zone's, the header and the footer stand on it without one of their own, and this card sits in the middle — the way a sign-in, a code or a tunnel's step reads."
    back: Back to layouts

fr:
  page_title: Focus
  card:
    title: Une seule chose à faire
    body: "La fenêtre est une seule région : son fond est celui d'une zone, le header et le footer y sont posés sans fond propre, et cette carte se tient au milieu — comme une connexion, un code ou l'étape d'un tunnel."
    back: Retour aux layouts

zh:
  page_title: 专注
  card:
    title: 要做的一件事
    body: 窗口是一个区域：它的底部是一个区域的，头部和底部站在上面，没有自己的底部，这个卡片位于中间——就像一个登录、一个代码或一个隧道的步骤一样。
    back: 返回布局

ar:
  page_title: تركيز
  card:
    title: 'شيء واحد للقيام به'
    body: 'النافذة هي منطقة واحدة: أرضيتها تعود لمنطقة، والعنوان والتذييل يقفان عليها دون أن يكون لهما أرضية خاصة، وهذه البطاقة تجلس في المنتصف - كما تقرأ شاشة تسجيل الدخول، أو رمز، أو خطوة نفق.'
    back: 'العودة إلى التخطيطات'
