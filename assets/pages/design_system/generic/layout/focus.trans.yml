en:
  page_title: Focus
  card:
    title: One thing to do
    body: "The window is one region: its ground is a zone's, the header and the footer stand on it without one of their own, and this card sits in the middle — the way a sign-in, a code or a tunnel's step reads."
    back: Back to layouts

fr:
  page_title: Focus
  card:
    title: Une seule chose à faire
    body: "La fenêtre est une seule région : son fond est celui d'une zone, le header et le footer y sont posés sans fond propre, et cette carte se tient au milieu — comme une connexion, un code ou l'étape d'un tunnel."
    back: Retour aux layouts

zh:
  page_title: 专注
  card:
    title: 要做的一件事
    body: 窗口是一个区域：它的底部是一个区域的，头部和底部站在上面，没有自己的底部，这个卡片位于中间——就像一个登录、一个代码或一个隧道的步骤一样。
    back: 返回布局

ar:
  page_title: تركيز
  card:
    title: 'شيء واحد للقيام به'
    body: 'النافذة هي منطقة واحدة: أرضيتها تعود لمنطقة، والعنوان والتذييل يقفان عليها دون أن يكون لهما أرضية خاصة، وهذه البطاقة تجلس في المنتصف - كما تقرأ شاشة تسجيل الدخول، أو رمز، أو خطوة نفق.'
    back: 'العودة إلى التخطيطات'

hi:
  page_title: फोकस
  card:
    title: 'एक काम करना है'
    body: 'यह विंडो एक क्षेत्र है: इसका आधार एक ज़ोन का है, इसका शीर्षक और तला इसके बिना खड़े होते हैं, और यह कार्ड बीच में बैठता है - जैसे एक साइन-इन, एक कोड या एक सुरंग का कदम पढ़ता है।'
    back: 'लेआउट्स पर वापस'

he:
  page_title: מיקוד
  card:
    title: 'דבר אחד לעשות'
    body: 'החלון הוא אזור אחד: הקרקע שלו היא של אזור, הכותרת והכותרת התחתונה עומדות עליו ללא אחת משלהן, וכרטיס זה יושב באמצע - כמו קריאת כניסה, קוד או שלב של מנהרה.'
    back: 'חזרה לתבניות'

fa:
  page_title: تمرکز
  card:
    title: 'یک کار برای انجام دادن'
    body: 'این پنجره یک منطقه است: زمین آن متعلق به یک ناحیه است، هدر و فوتر بر روی آن قرار دارند بدون اینکه بخشی از خودشان داشته باشند، و این کارت در وسط قرار دارد - مانند نحوه‌ای که یک ورود، یک کد یا مرحله‌ای از یک تونل خوانده می‌شود.'
    back: 'بازگشت به طرح‌ها'

ur:
  page_title: 'توجہ مرکوز کریں'
  card:
    title: 'ایک کام کرنا ہے'
    body: 'یہ ونڈو ایک علاقہ ہے: اس کی بنیاد ایک زون کی ہے، ہیڈر اور فوٹر اس پر کھڑے ہیں بغیر اپنے کسی کی، اور یہ کارڈ درمیان میں بیٹھا ہے — جیسے کہ سائن ان، کوڈ یا سرنگ کا قدم پڑھتا ہے۔'
    back: 'لے آؤٹ پر واپس'

ja:
  page_title: フォーカス
  card:
    title: やるべき一つのこと
    body: 'ウィンドウは一つの領域です。その地面はゾーンのもので、ヘッダーとフッターはそれぞれ独自のものを持たずにその上にあります。このカードは真ん中に置かれています — サインイン、コード、またはトンネルのステップが表示されるように。'
    back: レイアウトに戻る

ko:
  page_title: 집중하기
  card:
    title: '할 일 하나'
    body: '이 창은 하나의 영역입니다: 바닥은 존의 것이고, 헤더와 푸터는 자신의 바닥 없이 그 위에 있습니다, 그리고 이 카드는 가운데에 위치합니다 — 로그인, 코드 또는 터널의 단계를 읽는 방식입니다.'
    back: '레이아웃으로 돌아가기'

bn:
  page_title: ফোকাস
  card:
    title: 'একটি কাজ করতে হবে'
    body: 'এই জানালাটি একটি অঞ্চল: এর ভিত্তি একটি জোনের, শিরোনাম এবং পাদচরণ এতে দাঁড়িয়ে থাকে তাদের নিজেদের কিছু ছাড়াই, এবং এই কার্ডটি মাঝখানে বসে — যেমন একটি সাইন ইন, একটি কোড বা একটি টানেলের পদক্ষেপ পড়ে।'
    back: 'লেআউটে ফিরে যান'

th:
  page_title: มุ่งเน้น
  card:
    title: สิ่งเดียวที่ต้องทำ
    body: 'หน้าต่างคือพื้นที่หนึ่ง: พื้นของมันเป็นของโซน, ส่วนหัวและส่วนท้ายตั้งอยู่บนมันโดยไม่มีของตัวเอง, และการ์ดนี้นั่งอยู่ตรงกลาง — เหมือนกับการลงชื่อเข้าใช้, รหัส หรือขั้นตอนของอุโมงค์อ่าน.'
    back: กลับไปที่รูปแบบ

de:
  page_title: Fokus
  card:
    title: 'Eine Sache zu tun'
    body: 'Das Fenster ist eine Region: sein Boden gehört zu einer Zone, der Kopf- und Fußbereich stehen darauf, ohne einen eigenen, und diese Karte sitzt in der Mitte – so wie ein Anmeldeformular, ein Code oder eine Tunnelstufe gelesen wird.'
    back: 'Zurück zu Layouts'

fi:
  page_title: Keskity
  card:
    title: 'Yksi asia tehtävänä'
    body: 'Ikkuna on yksi alue: sen pohja kuuluu vyöhykkeelle, ylä- ja alareuna lepäävät sen päällä ilman omaa pohjaa, ja tämä kortti istuu keskellä – kuten kirjautuminen, koodi tai tunnelin askel lukee.'
    back: 'Takaisin asetteluihin'

ru:
  page_title: Фокус
  card:
    title: 'Одно дело'
    body: 'Окно — это одна область: его основание принадлежит зоне, заголовок и нижний колонтитул находятся на нём без своего собственного, а эта карточка расположена посередине — так, как читается вход, код или этап туннеля.'
    back: 'Назад к макетам'

pl:
  page_title: Skupienie
  card:
    title: 'Jedna rzecz do zrobienia'
    body: 'Okno to jeden obszar: jego dno należy do strefy, nagłówek i stopka opierają się na nim bez własnego, a ta karta znajduje się pośrodku — tak jak odczytuje się formularz logowania, kod lub krok tunelu.'
    back: 'Powrót do układów'

es:
  page_title: Enfocar
  card:
    title: 'Una cosa por hacer'
    body: 'La ventana es una región: su suelo es de una zona, el encabezado y el pie de página se apoyan en él sin uno propio, y esta tarjeta está en el medio — como se lee un inicio de sesión, un código o un paso de túnel.'
    back: 'Volver a los diseños'

it:
  page_title: Concentrazione
  card:
    title: 'Una cosa da fare'
    body: "La finestra è una regione: il suo fondo è quello di una zona, l'intestazione e il piè di pagina si trovano su di essa senza avere uno tutto loro, e questa scheda è posizionata al centro — come si legge un accesso, un codice o un passaggio di un tunnel."
    back: 'Torna ai layout'

pt_BR:
  page_title: Foco
  card:
    title: 'Uma coisa para fazer'
    body: 'A janela é uma região: seu fundo é de uma zona, o cabeçalho e o rodapé estão apoiados nela sem ter um próprio, e este cartão fica no meio — da maneira que um login, um código ou um passo de túnel é lido.'
    back: 'Voltar para layouts'

tr:
  page_title: Odak
  card:
    title: 'Yapılacak bir şey'
    body: 'Pencere bir bölgedir: tabanı bir alanın, üst kısmı ve alt kısmı kendi alanları olmadan üzerinde durur ve bu kart ortada yer alır — bir giriş, bir kod veya bir tünelin adımının okunma şekli gibi.'
    back: 'Düzenlere geri'

vi:
  page_title: 'Tập trung'
  card:
    title: 'Một việc cần làm'
    body: 'Cửa sổ là một vùng: nền của nó thuộc về một khu vực, tiêu đề và chân trang đứng trên đó mà không có nền riêng, và thẻ này nằm ở giữa — giống như cách một bước đăng nhập, mã hoặc bước của một đường hầm được đọc.'
    back: 'Quay lại các bố cục'

id:
  page_title: Fokus
  card:
    title: 'Satu hal untuk dilakukan'
    body: 'Jendela adalah satu wilayah: dasar jendela adalah milik zona, header dan footer berdiri di atasnya tanpa yang milik mereka sendiri, dan kartu ini berada di tengah — seperti saat membaca tanda masuk, kode, atau langkah terowongan.'
    back: 'Kembali ke tata letak'

nl:
  page_title: Focus
  card:
    title: 'Één ding om te doen'
    body: 'Het venster is één gebied: de ondergrond is van een zone, de koptekst en de voettekst staan erop zonder een eigen ondergrond, en deze kaart zit in het midden — zoals een aanmeldingsformulier, een code of een stap van een tunnel wordt gelezen.'
    back: 'Terug naar indelingen'
