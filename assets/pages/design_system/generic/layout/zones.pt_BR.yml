~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Zonas
page_icon: 'ph:bold/columns'
intro: 'O espaço de trabalho em duas painéis em que cada explorador, editor e visualização de detalhes é construído. Uma zona não tem largura e altura próprias: o espaço em que está determina seu tamanho, e cada lado rola de forma independente. Duas zonas são dois objetos dispostos na página, não um painel cortado ao meio — o que as diferencia é o espaço entre elas, e `zone--panel` é o chão em que cada uma se apoia.'
section:
  split:
    title: 'Uma divisão'
    description: 'Uma coluna dimensionada, a outra ocupando o que resta. O tamanho é dado por um passo, e é próprio da zona — não é herdado por nada que esteja aninhado dentro dela.'
  scrollable:
    title: 'Cada lado rola de forma independente'
    description: 'Uma zona rolável é o que mantém o transbordo, não a página. Role uma dessas duas e a outra permanece onde está, que é a razão principal para a forma.'
  vertical:
    title: 'Um cabeçalho que não rola'
    description: 'Uma divisão transformada em vertical: uma zona estreita tem a altura do que abriga, o corpo ocupa o restante e rola abaixo dela. Esta é a disposição de um painel com uma barra de ferramentas na parte superior.'
  wrap:
    title: 'Abaixo de um chão'
    description: 'Dado um chão, a zona flexível ocupa uma linha completa e a coluna dimensionada se move acima dela em vez de ambas serem espremidas a nada. Reduza a janela para vê-la se dobrar.'
split:
  body: 'Este lado ocupa o que a coluna dimensionada deixa.'
scrollable:
  item: Item
  line: Linha
vertical:
  action: Criar
wrap:
  body: 'Abaixo do chão que esta zona recebe, ela ocupa uma linha própria.'
