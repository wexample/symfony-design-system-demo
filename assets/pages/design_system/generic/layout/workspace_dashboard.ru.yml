~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Панель управления'
page_icon: 'ph:bold/squares-four'
mode:
  reopen: 'Повторно открыть панель API'
  gap: 'С промежутками'
  flush: Сбросить
state:
  success: Нормальный
  warning: Пониженный
  error: Сбой
  running: Сливается
tile:
  traffic:
    title: Трафик
    figure: '12.4k req/мин'
    description: 'Разделы внутри раздела: стена — это вертикальный раздел строк, каждая строка — это отдельный раздел. Перетащите край под этой строкой, чтобы увеличить ее высоту, или рядом с этой плиткой для увеличения ширины.'
  latency:
    title: 'Задержка p95'
    figure: '184 мс'
    description: 'Каждая плитка обозначает этаж, `zone--min-*`: ниже нее плитка не сжимается, вместо этого прокручивается рамка — как в сторону, так и вниз.'
  errors:
    title: Ошибки
    figure: '2.1 %'
    description: 'При изменении размера зона сохраняет размер, на котором она осталась вдоль оси своего раздела, и возвращается к нему; двойной щелчок по ручке возвращает его к разделу.'
  queue:
    title: Очередь
    figure: '318 задач'
    description: '`zone--split--flush` сужает промежуток до пикселя, основание стены проводит линию между плитками. Одного класса на стене достаточно, строки наследуют его.'
  deploys:
    title: Развертывания
    figure: '7 сегодня'
    description: 'Без этого та же стена сохраняет пространство между своими плитками, через которое отображается основание страницы — переключитесь в верхней панели. Прокрутите вправо для панели, загружаемой только после того, как она будет видна.'
