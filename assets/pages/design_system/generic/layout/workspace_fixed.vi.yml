~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Chiều rộng cố định'
page_icon: 'ph:bold/arrows-in-line-horizontal'
intro: 'Ba vùng giống nhau, nhưng vùng bạn đang đọc được cho một chiều rộng thay vì phải chiếm lấy — và chiều rộng không ai muốn sẽ được dành cho một vùng trống.'
section:
  sized:
    title: 'Một vùng có chiều rộng riêng'
    description: '`zone--narrow` với một bước kích thước: vùng này có chiều rộng đó và giữ nguyên chiều rộng đó, bất kể không gian mà cửa sổ có. Đây là cách giữ cho văn bản dễ đọc — một cột phát triển cùng với màn hình thì không còn là một cột nữa.'
  slack:
    title: 'Mục đích của vùng trống'
    description: 'Vùng cuối cùng không chứa gì, nhưng vẫn giữ vị trí của nó: trống không có nghĩa là vắng mặt, và một khung chờ đợi được coi là một khung chứ không phải là một lỗ trống. Nó ở đó để chiếm chiều rộng mà các vùng có kích thước từ chối.'
    more: 'Một sự phân chia sẽ bàn giao phần còn lại cho bất kỳ ai yêu cầu. Với việc không có gì yêu cầu, các vùng có kích thước sẽ bị kéo dài hoặc đẩy về các cạnh; với điều này, chúng giữ nguyên chiều rộng và trang giữ lại phần còn lại.'
work:
  size: 32rem
