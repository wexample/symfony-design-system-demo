~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Bloques
page_icon: 'ph:bold/squares-four'
tone:
  body: 'el suelo es propio del bloque, solo el borde delantero lleva el color.'
section:
  tone:
    title: 'Un bloque que lleva un tono'
    description: 'El color de un estado — o de una categoría — como una barra en el borde delantero, y nada más: la misma barra que lleva un mensaje, sin el suelo tintado, para que una lista de ellos se lea como una lista y no como una alarma. Cualquier bloque lo acepta, incluida una barra que se sostiene en un bloque.'
  default:
    title: 'Bloques básicos'
  advanced:
    title: 'Bloques avanzados'
  aside:
    title: 'Columna fija al lado'
    description: 'Una columna estrecha dimensionada en la escala --size, al lado de un cuerpo que absorbe el ancho restante.'
  card:
    title: Tarjetas
  link:
    title: 'Un bloque que es un enlace'
    description: 'Toda la tarjeta es el enlace — para una elección hecha al seleccionar una tarjeta entre varias: un plan, una rama, una plantilla. Se lee como texto, no como una acción atenuada; bajo el puntero su suelo toma un matiz y su borde se endurece, y el teclado lo encuentra por el anillo de enfoque que cada control lleva.'
  figure:
    title: Figuras
    description: 'Un único valor o ícono sobredimensionado, centrado. Usado para contadores de panel y mosaicos de estado — añade block--square para mantener el mosaico cuadrado sin importar su ancho.'
  stacks:
    title: Pilotes
  stack_horizontal:
    title: Horizontal
    description: 'Columnas iguales, ancho completo, se envuelven al desbordarse.'
  stack_vertical:
    title: Vertical
    description: 'Filas apiladas, ancho completo, separación uniforme.'
  stack_split:
    title: Dividido
    description: 'El primer hijo crece, el último hijo permanece fijo — utilizado para filas de lead + acción.'
  stack_nested:
    title: Anidado
    description: 'Pila horizontal que contiene pilas verticales — cuadrícula de panel típica.'
stack:
  item:
    one: Uno
    two: Dos
    three: Tres
    four: Cuatro
    lead: 'Describe la acción en este texto de lead.'
    action: Acción
block:
  title: 'Título del bloque'
  no_padding: 'Bloque sin relleno (usando block--body).'
  one:
    title: 'Bloque primario'
    description: 'Un bloque con un título y texto en el cuerpo.'
  two:
    title: 'Bloque secundario'
    description: 'Otro bloque para demostrar el espaciado.'
  three:
    title: 'Bloque terciario'
    description: 'Un tercer bloque en la fila.'
  four:
    title: 'Bloque cuaternario'
    description: 'Un cuarto bloque para la demostración del diseño.'
  advanced:
    title: 'Proyección de pipeline'
    status: Listo
    description: 'Este bloque combina espacios de título y contenido en una única estructura reutilizable.'
    details: 'Se pueden agregar operadores sin salir del contexto actual.'
  zones:
    main:
      title: 'Zona principal'
      description: 'El contenido principal puede crecer naturalmente con espaciado estándar.'
    aside:
      title: 'Zona lateral'
      description: 'Esta zona lateral utiliza un fondo claro para resaltar contenido complementario.'
  zones_three:
    title: 'Diseño de tres zonas'
    status: Borrador
    left:
      title: 'Panel izquierdo'
      description: 'La navegación secundaria o los metadatos pueden vivir aquí.'
    main:
      title: 'Contenido principal'
      description: 'La información primaria se mantiene centrada para facilitar la lectura.'
    right:
      title: 'Panel derecho'
      description: 'Las acciones contextuales y los conocimientos pueden agruparse en este lado.'
    footer:
      meta: 'Actualizado hace 2 minutos'
      action: 'Abrir detalles'
