~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Indeling
page_icon: 'ph:bold/layout'
intro: 'Hoe een pagina is verdeeld. Deze vormen nemen gebieden in plaats van inhoud: ze geven aan waar dingen staan, en weten niet wat daar staat.'
page:
  zones:
    title: Zones
    description: 'De werkruimte met twee panelen: een split, een gekleurde kolom, een scrollbare inhoud. Waarop elke verkenner, editor en detailweergave in een app is gebouwd.'
  workspace:
    title: Werkruimte
    description: "Pagina's gemaakt van naast elkaar gelegde gebieden, van elkaar te onderscheiden door de ruimte ertussen en verder niets. Drie indelingen, waarmee je tussen de bomen kunt bewegen die in elk van hen staan."
  blocks:
    title: Blokken
    description: 'Het oppervlak waarop een groep dingen staat, met of zonder opvulling, met zijn kaart- en figuurvarianten.'
  toolbar:
    title: Werkbalk
    description: 'Een rij acties boven of onder waar ze op inwerken, in zijn ruime en compacte dichtheden.'
  tabs:
    title: Tabbladen
    description: 'Één pagina die een van de verschillende gezichten toont, met de panelen die de keuze volgen.'
  doc:
    title: Documentindeling
    description: 'Het documentpatroon met twee kolommen — proza aan de ene kant, code aan de andere — dat naar één kolom vouwt wanneer er geen ruimte is.'
