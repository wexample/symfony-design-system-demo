~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Zona
page_icon: 'ph:bold/columns'
intro: 'Workspace dua panel yang menjadi dasar setiap penjelajah, editor, dan tampilan detail. Sebuah zona tidak memiliki lebar dan tinggi sendiri: pemisahan tempatnya berada yang menentukan ukurannya, dan setiap sisi dapat menggulir secara terpisah. Dua zona adalah dua objek yang diletakkan di halaman, bukan satu panel yang dibagi dua — yang membedakannya adalah ruang di antara keduanya, dan `zone--panel` adalah dasar tempat masing-masing berdiri.'
section:
  split:
    title: 'Sebuah pemisahan'
    description: 'Satu kolom berukuran, yang lainnya mengambil sisa ruang. Ukurannya ditentukan oleh langkah, dan itu adalah milik zona itu sendiri — tidak diwariskan oleh apa pun yang ada di dalamnya.'
  scrollable:
    title: 'Setiap sisi menggulir secara terpisah'
    description: 'Zona yang dapat digulir adalah yang menampung overflow, bukan halaman. Gulir salah satu dari dua ini dan yang lainnya tetap di tempatnya, yang merupakan alasan utama bentuknya.'
  vertical:
    title: 'Sebuah header yang tidak menggulir'
    description: 'Sebuah pemisahan yang berubah vertikal: zona sempit adalah tinggi dari apa yang dipegangnya, tubuh mengambil sisa dan menggulir di bawahnya. Ini adalah pengaturan panel dengan toolbar di atas.'
  wrap:
    title: 'Di bawah lantai'
    description: 'Diberikan sebuah lantai, zona fleksibel mengklaim satu baris penuh dan kolom yang berukuran bergerak di atasnya daripada keduanya dipaksa menjadi tidak ada. Persempit jendela untuk melihatnya melipat.'
split:
  body: 'Sisi ini mengambil apa pun yang ditinggalkan kolom berukuran.'
scrollable:
  item: Item
  line: Baris
vertical:
  action: Buat
wrap:
  body: 'Di bawah lantai yang diberikan kepada zona ini, ia mengambil satu baris sendiri.'
