bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: টুলবার
  page_icon: 'ph:bold/rows'
  section:
    markers:
      title: 'একটি শিরোনাম এবং এর মার্কারসমূহ'
      description: 'কীভাবে একটি জিনিস ফাইল করা হয়, এটি কোথায় থাকে এবং কোন সংস্করণ: তিনটি মার্কার এক সারিতে পড়ে, তাই তারা যা কিছু তৈরি করা হোক না কেন, একটি উচ্চতা ভাগ করে — একটি পিল সাধারণত যেখানে থাকে তার জন্য টেক্সটের জন্য ইএমস-এ আকার দেওয়া হয়, এবং একটি বার এটি পাশে ক্যাপসুলে স্তরিত করে। শিরোনামটি এর মার্জিন ত্যাগ করে এবং নামটি বাম দিকে রাখে।'
    default:
      title: 'বেসিক টুলবার'
    title:
      title: 'শিরোনামসহ টুলবার'
    title_multi:
      title: 'ক্রিয়াকলাপসহ বিভাগীয় শিরোনাম'
    fields:
      title: 'একটি বারের ক্ষেত্র'
      description: 'একটি সম্পাদকদের বিকল্পের বারের মধ্যে বোতামের পাশাপাশি কি থাকে: একটি আকার, একটি মোড, একটি টগল, একটি পছন্দ, একটি অনুসন্ধান এবং তার বোতাম। প্রতিটি বারের নিয়ন্ত্রণের উচ্চতায় দাঁড়ায়, তাই একটি সংক্ষিপ্ত বার তার পুরুত্ব বজায় রাখে; একটি ক্ষেত্র এবং এর কার্যকলাপ একসাথে (ফর্ম--ইনলাইন) বারের জন্য স্থান নেয়।'
  title:
