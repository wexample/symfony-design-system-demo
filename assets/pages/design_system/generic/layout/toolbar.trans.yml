en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Toolbar
  page_icon: ph:bold/rows

  section:
    markers:
      title: A heading and its markers
      description: "What a thing is filed as, where it stands and which version: three markers read as one row, so they share a height whatever they are made of — a pill is sized in ems for the text it usually sits inside, and a bar levels it on the capsule beside it. The heading gives up its margins and keeps the name at the far left."
    default:
      title: Basic toolbar
    title:
      title: Toolbar with title
    title_multi:
      title: Section title with actions
    fields:
      title: Fields in a bar
      description: "What an editor's bar of options holds besides buttons: a size, a mode, a toggle, a choice, a search and its button. Each stands at the height of the bar's controls, so a compact bar keeps its thickness; a field and its action together (form--inline) take the room the bar leaves."

  title:
    example: Page title
    section: Section title
    document: Design and development

  marker:
    state: evergreen

  field:
    size: Size
    mode: Mode
    mode_normal: Normal
    mode_multiply: Multiply
    snap: Snap
    preview: Preview
    search: Search
    message: Message

  button:
    search: Search
    send: Send
    create: Create
    refresh: Refresh
    export: Export
    edit: Edit
    delete: Delete
    history: History
    share: Share

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'شريط الأدوات'
  page_icon: 'ph:bold/rows'
  section:
    markers:
      title: 'عنوان وعلاماته'
      description: 'ما يتم تصنيفه كشيء، وأين يقف، وأي إصدار: ثلاث علامات تقرأ كصف واحد، لذا تشارك ارتفاعًا مهما كانت مصنوعة منه - تكون الحبة بحجم ems للنص الذي تجلس فيه عادة، ويقوم الشريط بتسويته على الكبسولة بجانبه. العنوان يتخلى عن هوامشه ويحتفظ بالاسم في أقصى اليسار.'
    default:
      title: 'شريط أدوات أساسي'
    title:
      title: 'شريط أدوات مع عنوان'
    title_multi:
      title: 'عنوان القسم مع الإجراءات'
    fields:
      title: 'حقول في شريط'
      description: 'ما يحتويه شريط خيارات المحرر بجانب الأزرار: حجم، وضع، مفتاح تبديل، خيار، بحث وزر البحث. كل منها يكون على ارتفاع عناصر تحكم الشريط، لذا فإن الشريط المدمج يحتفظ بسماكته؛ حقل وإجراءه معًا (نموذج--مضمن) يأخذان المساحة التي يتركها الشريط.'
  title:
    example: 'عنوان الصفحة'
    section: 'عنوان القسم'
    document: 'التصميم والتطوير'
  marker:
    state: 'دائم الخضرة'
