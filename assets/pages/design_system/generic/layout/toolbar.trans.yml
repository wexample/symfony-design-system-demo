de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Werkzeugleiste
  page_icon: 'ph:bold/rows'
  section:
    markers:
      title: 'Eine Überschrift und ihre Marker'
      description: 'Wie eine Sache abgelegt ist, wo sie steht und welche Version: drei Marker werden als eine Reihe gelesen, sodass sie eine gemeinsame Höhe haben, unabhängig davon, woraus sie bestehen – eine Pille ist in ems für den Text dimensioniert, in dem sie normalerweise sitzt, und eine Leiste nivelliert sie auf der Kapsel daneben. Die Überschrift gibt ihre Ränder auf und behält den Namen ganz links.'
    default:
      title: Basiswerkzeugleiste
    title:
      title: 'Werkzeugleiste mit Titel'
    title_multi:
      title: 'Abschnittsüberschrift mit Aktionen'
    fields:
      title: 'Felder in einer Leiste'
      description: 'Was die Optionsleiste eines Editors neben Schaltflächen enthält: eine Größe, einen Modus, einen Schalter, eine Auswahl, eine Suche und deren Schaltfläche. Jede steht auf der Höhe der Steuerelemente der Leiste, sodass eine kompakte Leiste ihre Dicke beibehält; ein Feld und seine Aktion zusammen (Formular--inline) nehmen den Raum ein, den die Leiste lässt.'
  title:
    example: Seitentitel
    section: Abschnittsüberschrift
    document: 'Design und Entwicklung'
  marker:
    state: evergreen
  field:
    size: Größe
    mode: Modus
    mode_normal: Normal
    mode_multiply: Multiplizieren
    snap: Einrasten
    preview: Vorschau
    search: Suche
    message: Nachricht
  button:
    search: Suche
    send: Senden
    create: Erstellen
    refresh: Aktualisieren
    export: Exportieren
    edit: Bearbeiten
    delete: Löschen
    history: Verlauf
    share: Teilen

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Barra de herramientas'
  page_icon: 'ph:bold/rows'
  section:
    markers:
      title: 'Un encabezado y sus marcadores'
      description: 'Cómo se clasifica algo, dónde se encuentra y qué versión: tres marcadores se leen como una fila, por lo que comparten una altura, sea lo que sea de lo que están hechos; una cápsula se dimensiona en ems para el texto que suele contener, y una barra lo nivela en la cápsula que está al lado. El encabezado renuncia a sus márgenes y mantiene el nombre a la extrema izquierda.'
    default:
      title: 'Barra de herramientas básica'
    title:
      title: 'Barra de herramientas con título'
    title_multi:
      title: 'Título de sección con acciones'
    fields:
      title: 'Campos en una barra'
      description: 'Lo que contiene la barra de opciones de un editor además de botones: un tamaño, un modo, un interruptor, una elección, una búsqueda y su botón. Cada uno se sitúa a la altura de los controles de la barra, por lo que una barra compacta mantiene su grosor; un campo y su acción juntos (form--inline) ocupan el espacio que deja la barra.'
  title:
