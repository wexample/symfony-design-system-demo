hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: टूलबार
  page_icon: 'ph:bold/rows'
  section:
    markers:
      title: 'एक शीर्षक और इसके मार्कर'
      description: 'एक चीज़ को किस रूप में दर्ज किया गया है, यह कहाँ खड़ा है और कौन सा संस्करण है: तीन मार्कर एक पंक्ति के रूप में पढ़े जाते हैं, इसलिए वे जो भी हों, उनकी ऊँचाई साझा करते हैं - एक गोली आमतौर पर जिस पाठ के अंदर होती है, उसके लिए ems में मापी जाती है, और एक बार इसे उसके बगल के कैप्सूल पर स्तरित करती है। शीर्षक अपने मार्जिन को छोड़ देता है और नाम को सबसे बाईं ओर रखता है।'
    default:
      title: 'बुनियादी टूलबार'
    title:
      title: 'शीर्षक के साथ टूलबार'
    title_multi:
      title: 'कार्रवाइयों के साथ अनुभाग शीर्षक'
    fields:
      title: 'बार में फ़ील्ड्स'
      description: 'एक संपादक के विकल्पों की पट्टी में बटन के अलावा क्या है: एक आकार, एक मोड, एक टॉगल, एक विकल्प, एक खोज और इसका बटन। प्रत्येक बार के नियंत्रणों की ऊंचाई पर होता है, इसलिए एक कॉम्पैक्ट बार अपनी मोटाई बनाए रखता है; एक फ़ील्ड और इसकी क्रिया (फॉर्म--इनलाइन) बार द्वारा छोड़े गए स्थान को लेती है।'
  title:
    example: 'पृष्ठ शीर्षक'
    section: 'अनुभाग शीर्षक'
    document: 'डिजाइन और विकास'
  marker:
    state: हरित
