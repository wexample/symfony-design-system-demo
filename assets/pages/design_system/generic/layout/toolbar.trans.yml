    title_multi:
      title: 'عنوان بخش با عملیات'
    fields:
      title: 'فیلدها در نوار'
      description: 'آنچه نوار گزینه‌های ویرایشگر غیر از دکمه‌ها دارد: یک اندازه، یک حالت، یک تغییر حالت، یک انتخاب، یک جستجو و دکمه‌اش. هر کدام در ارتفاع کنترل‌های نوار قرار دارد، بنابراین یک نوار فشرده ضخامت خود را حفظ می‌کند؛ یک فیلد و اقدام آن با هم (فرم--درون‌خط) فضایی را که نوار باقی می‌گذارد، اشغال می‌کنند.'
