~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Espace de travail'
page_icon: 'ph:bold/sidebar-simple'
intro: "Cette page est l'exemple : ce que vous lisez se trouve au milieu de trois régions, disposées côte à côte dans le corps de la page."
section:
  gap:
    title: "L'écart est le séparateur"
    description: "Rien n'est dessiné entre deux régions. Ce qui les distingue, c'est l'espace qu'elles laissent entre elles, à travers lequel la page se montre — le même sol sur lequel se tiennent le menu et l'en-tête. Chaque région a la sienne, qui est le sol que possède toujours un corps."
  each:
    title: 'Chacune à part'
    description: "Les deux colonnes conservent la largeur qui leur est donnée et le milieu prend ce qui reste. Faites défiler l'une des trois et les deux autres restent là où elles sont : une région gère son propre débordement, et la page n'en gère aucun."
    more: "Une région ne sait rien de ses voisines. L'explorateur à gauche est une séparation à part — une barre qui reste, un arbre qui défile en dessous — et il aurait la même forme n'importe où ailleurs sur la page."
  size:
    title: "Dimensionner l'une d'elles"
    description: "La région à gauche a un `zone-resizer` : une poignée qui remplit l'écart à côté d'elle, qui ne dessine rien — le curseur indique qu'elle se déplace. Faites-la glisser, ou donnez-lui le focus et utilisez les flèches ; un double clic redonne à la région la largeur que la page lui a donnée."
    more: "Une poignée dimensionne une région qui a une taille — une à laquelle on donne une largeur plutôt que de prendre ce qui reste — et celle à côté, flexible, absorbe la différence. La largeur est mémorisée sous le nom de la région, donc elle revient avec la page, ici sur les trois mises en page puisque c'est la même région qui se déplace."
editor:
  state: Enregistré
inspector:
  title: Détails
  field:
    path:
      key: Chemin
    size:
      key: Taille
    changed:
      key: Modifié
      value: 'Il y a 3 minutes'
