~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Vyöhykkeet
page_icon: 'ph:bold/columns'
intro: 'Kaksipaneelinen työtila, johon jokainen tutkimus-, muokkaus- ja yksityiskohtanäkymä perustuu. Vyöhykkeellä ei ole omaa leveyttä eikä korkeutta: se, missä jakautumisessa se sijaitsee, määrittää sen koon, ja jokainen puoli vierittää itsenäisesti. Kaksi vyöhykettä ovat kaksi objektia sivulla, ei yksi paneeli, joka on leikattu kahtia — niiden erottava tekijä on niiden väli, ja `zone--panel` on se maapinta, jolla jokainen seisoo.'
section:
  split:
    title: Jakautuminen
    description: 'Yksi sarake on kooltaan, toinen ottaa sen, mitä jää. Koko määritellään askeleena, ja se on vyöhykkeen oma — sitä ei peritä sen sisällä olevilta.'
  scrollable:
    title: 'Jokainen puoli vierittää itsenäisesti'
    description: 'Vieritettävä vyöhyke on se, joka pitää ylivuodon, ei sivu. Vieritä näistä kahdesta yksi ja toinen pysyy paikallaan, mikä on koko muodon syy.'
  vertical:
    title: 'Otsikko, joka ei vieri'
    description: 'Jakautuminen käännettynä pystysuoraan: kapea vyöhyke on se korkeus, mitä se pitää, runko ottaa loput ja vierii sen alapuolella. Tämä on paneelin asettelu, jossa on työkalupalkki päällä.'
  wrap:
    title: 'Lattian alapuolella'
    description: 'Kun on lattia, joustava vyöhyke vie koko rivin ja kooltaan määritelty sarake liikkuu sen ylle sen sijaan, että molemmat puristuisivat olemattomiin. Supista ikkunaa nähdäksesi sen taittuvan.'
split:
  body: 'Tämä puoli ottaa mitä tahansa kooltaan määritetty sarake jättää.'
scrollable:
  item: Kohde
  line: Rivi
vertical:
  action: Luo
wrap:
  body: 'Lattian alapuolella, jolle tämä vyöhyke on annettu, se vie oman rivinsä.'
