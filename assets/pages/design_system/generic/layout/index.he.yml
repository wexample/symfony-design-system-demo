~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: פריסה
page_icon: 'ph:bold/layout'
intro: 'איך דף מחולק. הצורות הללו תופסות אזורים ולא תוכן: הן מציינות היכן הדברים נמצאים, ואינן יודעות מה נמצא שם.'
page:
  zones:
    title: אזורים
    description: 'סביבת עבודה עם שני פאנלים: עמודה מחולקת, עמודה ממדי, גוף ניתן לגלילה. על מה שכל חוקר, עורך ותצוגת פרטים באפליקציה בנויה.'
  workspace:
    title: 'סביבת עבודה'
    description: 'דפים עשויים אזורים מונחים זה לצד זה, המופרדים על ידי המרווח ביניהם ושום דבר נוסף. שלוש סידורים, מועברים ביניהם על ידי העץ העומד בכל אחד מהם.'
  blocks:
    title: בלוקים
    description: 'המשטח שעליו יושבת קבוצת דברים, עם ריפוד או בלי, עם גרסאות כרטיס ודמות.'
  toolbar:
    title: 'סרגל הכלים'
    description: 'שורת פעולות מעל או מתחת למה שהן פועלות עליו, בצפיפות מרווחה ודחוסה.'
  tabs:
    title: כרטיסיות
    description: 'דף אחד המראה אחד מכמה פנים, עם הפאנלים שעוקבים אחרי הבחירה.'
  doc:
    title: 'פריסת מסמך'
    description: 'תבנית תיעוד עם שני עמודים — טקסט בצד אחד, קוד בצד השני — שמתמזגת לעמודה אחת כשאין מקום.'
