section:
  vue:
    title: 'برگه‌ها در vue'
    description: 'نوار تگ یک ردیف از پیوندها است و آدرس مشخص می‌کند که کدام یک باز است. نوار vue فقط گزارش می‌دهد که یک برگه درخواست شده است، بنابراین چیزی در اطراف آن پاسخ را در بر دارد — در اینجا، یک مؤلفه نمایشی.'
  breadcrumb:
    vue_description: 'دوین vue اقلام خود را که قبلاً حل شده‌اند، می‌گیرد: سرور جدول مسیر را نگه می‌دارد، بنابراین به آن پاسخ می‌دهد و آنچه که عبور می‌کند، پاسخ است.'
    title: 'نوار ناوبری'
    description: 'موقعیت کاربر را درون سلسله‌مراتب نمایش می‌دهد. از بخش نوار ناوبری استفاده کنید — اقلامی با مسیر و برچسب ارسال کنید؛ آخرین مورد همیشه به عنوان مورد جاری نمایش داده می‌شود.'
  tabs:
