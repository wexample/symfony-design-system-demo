    label: 'Eventos por segundo'
tab:
  one: 'Visão geral'
  two: Atividade
  three: Configurações
button:
  create: 'Criar projeção'
  refresh: 'Atualizar dados'
  export: Exportar
action:
  add_projection: 'Adicionar projeção'
link:
  starter:
    title: Iniciante
    description: 'Uma pessoa, o essencial, nada a pagar.'
  team:
