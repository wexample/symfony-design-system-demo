~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Blocos
page_icon: 'ph:bold/squares-four'
tone:
  body: 'o chão permanece pertencente ao bloco, apenas a borda da frente carrega a cor.'
section:
  tone:
    title: 'Um bloco que carrega um tom'
    description: 'A cor de um estado — ou de uma categoria — como uma barra ao longo da borda da frente, e nada mais: a mesma barra que uma mensagem usa, sem o fundo colorido, para que uma lista delas seja lida como uma lista e não como um alerta. Qualquer bloco pode usá-la, uma barra em cima de um bloco incluído.'
  default:
    title: 'Blocos básicos'
  advanced:
    title: 'Blocos avançados'
  aside:
    title: 'Coluna fixa ao lado'
    description: 'Uma coluna estreita dimensionada na escala --size, ao lado de um corpo que absorve a largura restante.'
  card:
    title: Cartões
  link:
    title: 'Um bloco que é um link'
    description: 'Todo o cartão é o link — para uma escolha feita ao selecionar um cartão entre vários: um plano, um ramo, um modelo. Ele é lido como texto, não como uma ação sutil; sob o ponteiro, seu fundo ganha uma nuance e sua borda se torna firme, e o teclado o encontra pelo anel de foco que todo controle possui.'
  figure:
    title: Figuras
    description: 'Um único valor ou ícone grande, centralizado. Usado para contadores de painel e azulejos de status — adicione block--square para manter o azulejo quadrado, independentemente de sua largura.'
  stacks:
    title: Pilhas
  stack_horizontal:
    title: Horizontal
    description: 'Colunas iguais, largura total, se ajusta em caso de transbordo.'
  stack_vertical:
    title: Vertical
    description: 'Linhas empilhadas, largura total, espaçamento uniforme.'
  stack_split:
    title: Dividido
    description: 'O primeiro filho cresce, o último filho permanece fixo — usado para linhas de lead + ação.'
  stack_nested:
    title: Aninhado
    description: 'Pilhas horizontais contendo pilhas verticais — grade típica de painel.'
stack:
  item:
    one: Um
    two: Dois
    three: Três
    four: Quatro
    lead: 'Descreva a ação neste texto de lead.'
    action: Ação
block:
  title: 'Título do bloco'
  no_padding: 'Bloco sem preenchimento (usando block--body).'
  one:
    title: 'Bloco primário'
    description: 'Um bloco com um título e texto de corpo.'
  two:
    title: 'Bloco secundário'
    description: 'Outro bloco para demonstrar espaçamento.'
  three:
    title: 'Bloco terciário'
    description: 'Um terceiro bloco na linha.'
  four:
    title: 'Bloco quaternário'
    description: 'Um quarto bloco para a demonstração de layout.'
  advanced:
    title: 'Projeção de pipeline'
    status: Pronto
    description: 'Este bloco combina slots de título e conteúdo em uma única estrutura reutilizável.'
    details: 'Operadores podem ser adicionados sem sair do contexto atual.'
  zones:
    main:
      title: 'Zona principal'
      description: 'O conteúdo principal pode crescer naturalmente com espaçamento padrão.'
    aside:
      title: 'Zona ao lado'
      description: 'Esta zona lateral usa um fundo claro para destacar conteúdo complementar.'
  zones_three:
    title: 'Layout de três zonas'
    status: Rascunho
    left:
      title: 'Painel esquerdo'
      description: 'Navegação secundária ou metadados podem viver aqui.'
    main:
      title: 'Conteúdo principal'
      description: 'Informações primárias permanecem centralizadas para legibilidade.'
    right:
      title: 'Painel direito'
      description: 'Ações e insights contextuais podem ser agrupados deste lado.'
    footer:
      meta: 'Atualizado há 2 minutos'
      action: 'Abrir detalhes'
figure:
  projections: Projeções
  uptime: 'Tempo de atividade'
  status: 'Ao vivo'
  framed:
