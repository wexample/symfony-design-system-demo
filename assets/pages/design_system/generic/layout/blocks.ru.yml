~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Блоки
page_icon: 'ph:bold/squares-four'
tone:
  body: 'земля остается за блоком, только передний край несет цвет.'
section:
  tone:
    title: 'Блок с оттенком'
    description: 'Цвет состояния — или категории — в виде полосы на переднем крае, и ничего больше: та же полоса, что носит сообщение, без окрашенной земли, так что список воспринимается как список, а не как сигнал тревоги. Любой блок принимает это, включая полосу, стоящую на блоке.'
  default:
    title: 'Основные блоки'
  advanced:
    title: 'Расширенные блоки'
  aside:
    title: 'Фиксированная боковая колонка'
    description: 'Узкая колонка, размер которой соответствует шкале --size, рядом с основным контентом, который занимает оставшуюся ширину.'
  card:
    title: Карты
  link:
    title: Блок-ссылка
    description: 'Вся карта является ссылкой — для выбора, сделанного путем выбора одной карты из нескольких: план, ветка, шаблон. Она воспринимается как текст, а не как приглушенное действие; под указателем ее земля принимает нюанс, а край усиливается, и клавиатура находит ее по кольцу фокуса, которое носит каждый элемент управления.'
  figure:
    title: Фигуры
    description: 'Единственное увеличенное значение или иконка, по центру. Используется для счетчиков на панели инструментов и плиток состояния — добавьте block--square, чтобы плитка оставалась квадратной, независимо от ширины.'
  stacks:
    title: Стеки
  stack_horizontal:
    title: Горизонтально
    description: 'Равные колонки, полная ширина, оборачиваются при переполнении.'
  stack_vertical:
    title: Вертикально
    description: 'Сложенные ряды, полная ширина, равный промежуток.'
  stack_split:
    title: Разделенный
    description: 'Первый элемент растет, последний элемент остается фиксированным — используется для рядов ведущий + действие.'
  stack_nested:
    title: Вложенный
    description: 'Горизонтальный стек, содержащий вертикальные стеки — типичная сетка панели инструментов.'
stack:
  item:
    one: Один
    two: Два
    three: Три
    four: Четыре
    lead: 'Опишите действие в этом ведующем тексте.'
    action: Действие
block:
  title: 'Название блока'
  no_padding: 'Блок без отступов (используя block--body).'
  one:
    title: 'Первичный блок'
    description: 'Блок с заголовком и телом текста.'
  two:
    title: 'Вторичный блок'
    description: 'Другой блок для демонстрации отступов.'
  three:
    title: 'Третичный блок'
    description: 'Третий блок в ряду.'
  four:
    title: 'Четвертичный блок'
    description: 'Четвертый блок для демонстрации макета.'
  advanced:
    title: 'Проекция пайплайна'
    status: Готово
    description: 'Этот блок объединяет слоты заголовков и контент в одной многоразовой структуре.'
    details: 'Операторы могут добавляться, не выходя из текущего контекста.'
  zones:
    main:
      title: 'Основная зона'
      description: 'Основной контент может естественно расти с обычными отступами.'
    aside:
      title: 'Боковая зона'
      description: 'Эта боковая зона использует светлый фон, чтобы выделить дополнительный контент.'
  zones_three:
    title: 'Макет с тремя зонами'
    status: Черновик
    left:
      title: 'Левая панель'
      description: 'Вторичная навигация или метаданные могут находиться здесь.'
    main:
      title: 'Основной контент'
      description: 'Основная информация остается по центру для удобства чтения.'
    right:
      title: 'Правая панель'
      description: 'Контекстные действия и идеи могут быть сгруппированы с этой стороны.'
    footer:
      meta: 'Обновлено 2 минуты назад'
      action: 'Открыть детали'
figure:
  projections: Проекции
  uptime: 'Время безотказной работы'
  status: 'В прямом эфире'
  framed:
    title: 'Пропускная способность'
    label: 'События в секунду'
tab:
  one: Обзор
  two: Активность
  three: Настройки
button:
  create: 'Создать проекцию'
  refresh: 'Обновить данные'
  export: Экспортировать
action:
  add_projection: 'Добавить проекцию'
link:
  starter:
    title: Стартовый
    description: 'Один человек, основные вещи, ничего не нужно платить.'
  team:
    title: Команда
    description: 'Несколько человек работают над одними и теми же задачами.'
  company:
    title: Компания
    description: 'Каждая команда с контролем, который запрашивает организация.'
