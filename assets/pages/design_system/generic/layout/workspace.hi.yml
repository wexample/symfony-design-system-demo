~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: कार्यक्षेत्र
page_icon: 'ph:bold/sidebar-simple'
intro: 'यह पृष्ठ उदाहरण है: जो आप पढ़ रहे हैं वह तीन क्षेत्रों के बीच में है, जो पृष्ठ के शरीर में बगल में रखे गए हैं।'
section:
  gap:
    title: 'अंतर separator है'
    description: 'दो क्षेत्रों के बीच कुछ नहीं खींचा गया है। उन्हें अलग करने वाली चीज़ वह जगह है जो वे बीच में छोड़ते हैं, जिसके माध्यम से पृष्ठ दिखता है - वही आधार जिस पर मेनू और शीर्षक खड़े हैं। प्रत्येक क्षेत्र में अपना होता है, जो हमेशा एक शरीर का आधार होता है।'
  each:
    title: 'प्रत्येक अपने आप में'
    description: 'दो कॉलम अपनी दी गई चौड़ाई बनाए रखते हैं और बीच वाला बची हुई जगह लेता है। तीन में से एक को स्क्रॉल करें और अन्य दो अपनी जगह पर बने रहते हैं: एक क्षेत्र अपनी ओवरफ्लो को रखता है, और पृष्ठ कोई नहीं रखता।'
    more: 'एक क्षेत्र अपने पड़ोसियों के बारे में कुछ नहीं जानता। बाईं ओर का अन्वेषक अपना खुद का विभाजन है - एक बार जो रहता है, एक पेड़ जो इसके नीचे स्क्रॉल करता है - और यह पृष्ठ पर कहीं और उसी आकार का होगा।'
  size:
    title: 'उनमें से एक का आकार'
    description: 'बाईं ओर का क्षेत्र एक `zone-resizer` ले जाता है: एक हैंडल जो इसके बगल में खाई भरता है, जो कुछ नहीं खींचता - कर्सर कहता है कि यह चलता है। इसे खींचें, या इसे ध्यान में लाएं और तीर का उपयोग करें; एक डबल क्लिक क्षेत्र को वह चौड़ाई वापस देता है जो पृष्ठ ने इसे दी थी।'
    more: 'एक हैंडल एक क्षेत्र का आकार देता है जो एक आकार रखता है - एक जो चौड़ाई दी जाती है बजाय इसके कि जो बचा है उसे ले। और इसके बगल वाला लचीला क्षेत्र अंतर को अवशोषित करता है। चौड़ाई क्षेत्र के नाम के तहत याद रखी जाती है, इसलिए यह पृष्ठ के साथ वापस आती है, यहां तीनों लेआउट में क्योंकि यह वही क्षेत्र है जो चल रहा है।'
editor:
