~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Khu vực'
page_icon: 'ph:bold/columns'
intro: 'Không gian làm việc hai ngăn mà mọi trình duyệt, trình chỉnh sửa và chế độ xem chi tiết đều dựa vào. Một khu vực không có chiều rộng và chiều cao riêng: sự phân chia mà nó nằm trong đó sẽ xác định kích thước của nó, và mỗi bên cuộn độc lập. Hai khu vực là hai đối tượng đặt trên trang, không phải một bảng bị cắt đôi — điều phân biệt chúng là khoảng trống giữa chúng, và `zone--panel` là nền tảng mà mỗi cái đứng trên đó.'
section:
  split:
    title: 'Một sự phân chia'
    description: 'Một cột đã được định kích thước, cột kia chiếm lấy phần còn lại. Kích thước được xác định bởi một bước, và đó là của riêng khu vực — nó không được kế thừa từ bất kỳ thứ gì nằm bên trong nó.'
  scrollable:
    title: 'Mỗi bên cuộn độc lập'
    description: 'Một khu vực có thể cuộn là cái chứa phần tràn, không phải trang. Cuộn một trong hai cái này và cái kia vẫn ở nguyên vị trí, đó là lý do chính cho hình dạng này.'
  vertical:
    title: 'Một tiêu đề không cuộn'
    description: 'Một sự phân chia chuyển thành dọc: một khu vực hẹp có chiều cao bằng những gì nó chứa, thân sẽ chiếm phần còn lại và cuộn bên dưới nó. Đây là cách sắp xếp của một bảng với thanh công cụ ở trên.'
  wrap:
    title: 'Dưới một sàn'
    description: 'Khi có một sàn, khu vực linh hoạt chiếm một dòng đầy đủ và cột đã được định kích thước di chuyển ở trên thay vì cả hai bị ép lại thành không gì cả. Thu hẹp cửa sổ để thấy nó gập lại.'
split:
  body: 'Bên này lấy bất cứ thứ gì cột đã định kích thước để lại.'
scrollable:
  item: Mục
  line: Dòng
vertical:
  action: Tạo
wrap:
  body: 'Dưới sàn mà khu vực này được cung cấp, nó chiếm một dòng riêng.'
