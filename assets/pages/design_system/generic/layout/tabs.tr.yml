section:
  vue:
    title: "Vue'de Sekmeler"
    description: 'Twig çubuğu, bağlantılardan oluşan bir satırdır ve adres hangi bağlantının açık olduğunu gösterir. Vue çubuğu yalnızca bir sekmenin istendiğini bildirir, bu nedenle etrafında bir şeyler cevap tutar — burada, bir demo bileşeni.'
