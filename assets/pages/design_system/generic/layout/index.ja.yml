~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: レイアウト
page_icon: 'ph:bold/layout'
intro: ページがどのように分けられるか。これらの形はコンテンツではなく領域を取ります：物がどこにあるかを示し、そこに何があるかは知りません。
page:
  zones:
    title: ゾーン
    description: 二分割のワークスペース：分割され、サイズのあるカラム、スクロール可能なボディ。アプリのすべてのエクスプローラー、エディター、および詳細ビューはこれに基づいています。
  workspace:
    title: ワークスペース
    description: 横に並べられた領域で構成され、間のスペース以外には何も区別がないページ。各領域に立つ木を介して移動する3つの配置。
  blocks:
    title: ブロック
    description: 物のグループが座る表面、パディングの有無にかかわらず、そのカードとフィギュアのバリアントがあります。
  toolbar:
    title: ツールバー
    description: その作用対象の上または下にあるアクションのライン、広々とした密度とコンパクトな密度で。
  tabs:
    title: タブ
    description: 1つのページがいくつかの顔のうちの1つを表示し、その選択に続くパネルを伴います。
  doc:
    title: ドキュメントレイアウト
    description: '片側にプローズ、もう片側にコードがある二カラムのドキュメントパターン — スペースがないときは一カラムに折りたたまれます。'
