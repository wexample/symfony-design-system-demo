~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: אזורים
page_icon: 'ph:bold/columns'
intro: 'המרחב העבודה עם שני הפאנלים שעליו כל חוקר, עורך ותצוגת פרטים מבוססים. אזור לא נושא רוחב או גובה משלו: הפיצול שבו הוא זה שמגדיר את גודלו, וכל צד גולל בנפרד. שני אזורים הם שני אובייקטים המניחים על הדף, לא פאנל אחד שחצוי - מה שמפריד ביניהם הוא החלל ביניהם, ו`zone--panel` הוא הקרקע שעליה כל אחד מהם עומד.'
section:
  split:
    title: פיצול
    description: 'עמודה אחת בגודל קבוע, והשנייה תופסת את מה שנותר. הגודל נקבע על ידי שלב, והוא של האזור עצמו - הוא לא מועבר על ידי שום דבר שמסודר בתוכו.'
  scrollable:
    title: 'כל צד גולל בנפרד'
    description: 'אזור גולל הוא זה שמחזיק את התוכן העודף, לא הדף. גולל אחד משני אלה והשני נשאר במקום שלו, וזה כל הסיבה לצורתו.'
  vertical:
    title: 'כותרת שלא גוללת'
    description: 'פיצול שהפך לקטן: אזור צר הוא בגובה מה שהוא מחזיק, הגוף תופס את השאר וגולל מתחתיו. זהו הסידור של פאנל עם סרגל כלים למעלה.'
  wrap:
    title: 'מתחת לרצפה'
    description: 'בהינתן רצפה, האזור הגמיש תופס שורה מלאה והעמודה בגודל קבוע זזה מעליו במקום ששניהם יידחקו לאפס. הקטין את החלון כדי לראות את זה מתקפל.'
split:
  body: 'צד זה לוקח מה שהעמודה בגודל קבוע משאירה.'
scrollable:
  item: פריט
  line: שורה
vertical:
  action: צור
wrap:
  body: 'מתחת לרצפה שניתנה לאזור הזה, הוא לוקח שורה משלו.'
