~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Arbeitsbereich
page_icon: 'ph:bold/sidebar-simple'
intro: 'Diese Seite ist das Beispiel: Was Sie lesen, steht in der Mitte von drei Bereichen, die nebeneinander im Seiteninhalt angeordnet sind.'
section:
  gap:
    title: 'Die Lücke ist der Separator'
    description: 'Nichts wird zwischen zwei Bereichen gezeichnet. Was sie unterscheidet, ist der Platz, den sie zwischen sich lassen, durch den die Seite zeigt — der gleiche Boden, auf dem das Menü und der Header stehen. Jeder Bereich hat seinen eigenen, der der Boden ist, den ein Körper immer hatte.'
  each:
    title: 'Jeder für sich'
    description: 'Die beiden Spalten behalten die Breite, die ihnen gegeben wird, und die Mitte nimmt, was übrig bleibt. Scrollen Sie einen der drei, bleiben die anderen zwei an ihrem Platz: Ein Bereich hat seinen eigenen Überlauf, und die Seite hat keinen.'
    more: 'Ein Bereich weiß nichts von seinen Nachbarn. Der Explorer auf der linken Seite ist eine eigene Teilung — eine Leiste, die bleibt, ein Baum, der darunter scrollt — und er hätte überall auf der Seite die gleiche Form.'
  size:
    title: 'Größe eines von ihnen ändern'
    description: 'Der Bereich auf der linken Seite hat einen `zone-resizer`: einen Griff, der die Lücke neben ihm ausfüllt und nichts zeichnet — der Cursor zeigt an, dass er bewegt wird. Ziehen Sie ihn, oder setzen Sie den Fokus darauf und verwenden Sie die Pfeile; ein Doppelklick gibt dem Bereich die Breite zurück, die die Seite ihm gegeben hat.'
    more: 'Ein Griff ändert die Größe eines Bereichs, der eine Größe hat — einer, der eine Breite zugewiesen bekommt, anstatt das zu nehmen, was übrig bleibt — und der flexible daneben absorbiert den Unterschied. Die Breite wird unter dem Namen des Bereichs gespeichert, sodass sie mit der Seite zurückkommt, hier in allen drei Layouts, da es derselbe Bereich ist, der sich bewegt.'
editor:
  state: Gespeichert
inspector:
  title: Details
  field:
    path:
      key: Pfad
    size:
      key: Größe
    changed:
      key: Geändert
      value: 'Vor 3 Minuten'
