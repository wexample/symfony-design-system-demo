~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Zone
page_icon: 'ph:bold/columns'
intro: 'Lo spazio di lavoro a due pannelli su cui è costruito ogni esploratore, editor e vista dettagliata. Una zona non ha larghezza né altezza proprie: è la suddivisione in cui si trova a determinarne le dimensioni, e ciascun lato scorre in modo indipendente. Due zone sono due oggetti posati sulla pagina, non un pannello diviso in due — ciò che le distingue è lo spazio tra di esse, e `zone--panel` è il terreno su cui ognuna si poggia.'
section:
  split:
    title: 'Una suddivisione'
    description: "Una colonna di dimensioni fisse, l'altra prende ciò che resta. La dimensione è data da un passaggio, ed è propria della zona — non viene ereditata da nulla di annidato al suo interno."
  scrollable:
    title: 'Ciascun lato scorre in modo indipendente'
    description: "Una zona scrollabile è ciò che contiene l'overflow, non la pagina. Scorri uno di questi due e l'altro rimane fermo, ed è proprio questa la ragione della forma."
  vertical:
    title: "Un'intestazione che non scorre"
    description: "Una suddivisione verticale: una zona stretta è l'altezza di ciò che contiene, il corpo prende il resto e scorre sotto di essa. Questo è l'assetto di un pannello con una barra degli strumenti in cima."
  wrap:
    title: 'Sotto un pavimento'
    description: "Data una base, la zona flessibile occupa un'intera riga e la colonna di dimensioni fisse si sposta sopra di essa invece di essere entrambe costrette a nulla. Riduci la finestra per vedere come si piega."
split:
  body: 'Questo lato prende ciò che la colonna di dimensioni fisse lascia.'
scrollable:
  item: Elemento
  line: Linea
vertical:
  action: Crea
wrap:
  body: 'Sotto il pavimento che questa zona riceve, occupa una propria riga.'
