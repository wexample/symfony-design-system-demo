~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Вкладки
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'Вкладки в vue'
    description: 'Полоса с ссылками — это ряд ссылок, и адрес показывает, какая из них открыта. Полоса vue просто сообщает, что была запрошена вкладка, поэтому что-то вокруг содержит ответ — здесь демонстрационный компонент.'
  breadcrumb:
    vue_description: 'Вью-двойник берет свои элементы уже разрешенными: сервер хранит таблицу маршрутов, поэтому он на нее отвечает, а то, что пересекается, — это ответ.'
    title: 'Хлебные крошки'
    description: 'Показывает местоположение пользователя в иерархии. Используйте частичное представление хлебных крошек — передайте элементы с маршрутом и меткой; последний элемент всегда отображается как текущий.'
  tabs:
    title: Вкладки
  default:
    normal:
      title: 'Основные вкладки'
    full:
      title: 'Основные вкладки (на всю ширину)'
    half:
      title: 'Основные вкладки (половина ширины)'
  counts:
    title: 'Вкладки с количеством'
    description: 'Сколько бы то ни было в том, что хранит вкладка, в конце метки. Это таблетка и ничего больше — передайте `count` рядом с меткой, и вкладка разместит его. Элемент без ключа ничего не показывает, поэтому вкладка без ничего для подсчета остается молчаливой.'
  icons:
    normal:
      title: 'Вкладки с иконками'
    full:
      title: 'Вкладки с иконками (на всю ширину)'
    half:
      title: 'Вкладки с иконками (половина ширины)'
breadcrumb:
  example:
    vue: 'В vue'
    two_levels: 'Два уровня'
    three_levels: 'Три уровня'
  item:
    home: Главная
    layout: Макет
    section: Блоки
    current: Навигация
