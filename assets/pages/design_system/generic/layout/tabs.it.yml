~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Schede
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'Schede in vue'
    description: "La barra delle schede è una riga di collegamenti e l'indirizzo indica quale è aperto. La barra vue riporta solo che è stata richiesta una scheda, quindi qualcosa attorno a essa contiene la risposta — qui, un componente demo."
  breadcrumb:
    vue_description: 'Il gemello vue prende già i suoi elementi risolti: il server ha la tabella delle rotte, quindi risponde, e ciò che attraversa è la risposta.'
    title: Breadcrumb
    description: "Mostra la posizione dell'utente all'interno della gerarchia. Usa il parziale del breadcrumb — passa gli elementi con rotta e etichetta; l'ultimo elemento è sempre reso come attuale."
  tabs:
    title: Schede
  default:
    normal:
      title: 'Schede di base'
    full:
      title: 'Schede di base (largo intero)'
    half:
      title: 'Schede di base (zona larga metà)'
  counts:
    title: 'Schede con un conteggio'
    description: "Quanti di qualsiasi cosa contenga la scheda, alla fine dell'etichetta. È una pillola e nient'altro — passa `count` accanto all'etichetta e la scheda lo posiziona. Un elemento senza la chiave non mostra nulla, così una scheda senza nulla da contare rimane silenziosa."
  icons:
    normal:
      title: 'Schede con icone'
    full:
      title: 'Schede con icone (largo intero)'
    half:
      title: 'Schede con icone (zona larga metà)'
breadcrumb:
  example:
    vue: 'In vue'
    two_levels: 'Due livelli'
    three_levels: 'Tre livelli'
  item:
    home: Home
    layout: Layout
    section: Blocchi
    current: Navigazione
tab:
  one: Panoramica
  two: Attività
  three: Impostazioni
vue:
  panel:
    one: 'Il primo pannello. Niente è stato recuperato e nessun indirizzo è cambiato — la barra ha emesso, il supporto è cambiato.'
    two: 'Il secondo pannello.'
    three: 'Il terzo pannello.'
