~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Tab
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'Tab di vue'
    description: 'Baris twig adalah deretan tautan dan alamat menunjukkan yang mana yang terbuka. Bar vue hanya melaporkan bahwa tab diminta, jadi sesuatu di sekitarnya menyimpan jawabannya — di sini, sebuah komponen demo.'
  breadcrumb:
    vue_description: 'Kembar vue mengambil item-nya yang sudah terpecahkan: server menyimpan tabel rute, jadi ia menjawabnya, dan apa yang melintas adalah jawabannya.'
    title: Breadcrumb
    description: 'Menunjukkan lokasi pengguna dalam hierarki. Gunakan partial breadcrumb — berikan item dengan rute dan label; item terakhir selalu ditampilkan sebagai saat ini.'
  tabs:
    title: Tab
  default:
    normal:
      title: 'Tab dasar'
    full:
      title: 'Tab dasar (lebar penuh)'
    half:
      title: 'Tab dasar (setengah lebar)'
  counts:
    title: 'Tab dengan hitungan'
    description: 'Seberapa banyak dari apa pun yang dipegang tab, di akhir label. Ini adalah pil dan tidak ada yang lain — berikan `count` di samping label dan tab akan menempatkannya. Item tanpa kunci tidak menunjukkan apa-apa, itulah cara tab tanpa apa-apa untuk dihitung tetap diam.'
  icons:
    normal:
      title: 'Tab dengan ikon'
    full:
      title: 'Tab dengan ikon (lebar penuh)'
    half:
      title: 'Tab dengan ikon (setengah lebar)'
breadcrumb:
  example:
    vue: 'Di vue'
    two_levels: 'Dua tingkat'
    three_levels: 'Tiga tingkat'
  item:
    home: Beranda
    layout: 'Tata Letak'
    section: Blok
    current: Navigasi
tab:
  one: Ikhtisar
  two: Aktivitas
  three: Pengaturan
vue:
  panel:
    one: 'Panel pertama. Tidak ada yang diambil dan tidak ada alamat yang berubah — bar mengeluarkan, pemegang bertukar.'
    two: 'Panel kedua.'
    three: 'Panel ketiga.'
