~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Bloki
page_icon: 'ph:bold/squares-four'
tone:
  body: 'grunt jest własnością bloku, tylko krawędź prowadząca nosi kolor.'
section:
  tone:
    title: 'Blok z tonem'
    description: 'Kolor stanu — lub kategorii — jako pasek wzdłuż krawędzi prowadzącej, i nic więcej: ten sam pasek, który nosi wiadomość, bez zabarwionego tła, dzięki czemu lista wygląda jak lista, a nie jak alarm. Każdy blok to przyjmuje, w tym pasek stojący na bloku.'
  default:
    title: 'Podstawowe bloki'
  advanced:
    title: 'Zaawansowane bloki'
  aside:
    title: 'Stała kolumna boczna'
    description: 'Wąska kolumna o rozmiarze zgodnym z skalą --size, obok treści, która wchłania pozostałą szerokość.'
  card:
    title: Karty
  link:
    title: 'Blok, który jest linkiem'
    description: 'Cała karta jest linkiem — dla wyboru dokonanego przez wybranie jednej karty spośród kilku: plan, gałąź, szablon. Wygląda jak tekst, a nie jak stłumiona akcja; pod wskaźnikiem jej tło zyskuje odcień, a krawędź się utwardza, a klawiatura znajduje ją przez pierścień skupienia, który nosi każda kontrolka.'
  figure:
    title: Figury
    description: 'Pojedyncza, dużych rozmiarów wartość lub ikona, wyśrodkowana. Używana do liczników na pulpicie i kafelków statusu — dodaj block--square, aby kafelek pozostał kwadratowy, niezależnie od jego szerokości.'
  stacks:
    title: Stosy
  stack_horizontal:
    title: Poziomy
    description: 'Równe kolumny, pełna szerokość, zawija przy przepełnieniu.'
  stack_vertical:
    title: Pionowy
    description: 'Ułożone wiersze, pełna szerokość, jednolita przerwa.'
  stack_split:
    title: Podzielony
    description: 'Pierwsze dziecko rośnie, ostatnie dziecko pozostaje stałe — używane do wierszy prowadzących + akcji.'
  stack_nested:
    title: Zagnieżdżony
    description: 'Poziomy stos zawierający pionowe stosy — typowa siatka pulpitu.'
stack:
  item:
    one: Jeden
    two: Dwa
    three: Trzy
    four: Cztery
    lead: 'Opisz akcję w tym wiodącym tekście.'
    action: Akcja
block:
  title: 'Tytuł bloku'
  no_padding: 'Blok bez paddingu (używając block--body).'
  one:
    title: 'Blok podstawowy'
    description: 'Blok z tytułem i tekstem treści.'
  two:
    title: 'Blok podrzędny'
    description: 'Inny blok do pokazania odstępu.'
  three:
    title: 'Blok trzeciorzędny'
    description: 'Trzeci blok w wierszu.'
  four:
    title: 'Blok czwartorzędny'
    description: 'Czwarty blok do demonstracji układu.'
  advanced:
    title: 'Projekcja potoku'
    status: Gotowe
    description: 'Ten blok łączy sloty tytułowe i treść w jedną wielokrotnego użytku strukturę.'
    details: 'Operatorzy mogą być dodawani bez opuszczania bieżącego kontekstu.'
  zones:
    main:
      title: 'Główna strefa'
      description: 'Główna treść może naturalnie rosnąć z standardowym odstępem.'
    aside:
      title: 'Strefa boczna'
      description: 'Ta boczna strefa używa jasnego tła, aby wyróżnić treści uzupełniające.'
  zones_three:
    title: 'Układ trzech stref'
    status: Szkic
    left:
      title: 'Lewy panel'
      description: 'Tutaj może znajdować się nawigacja podrzędna lub metadane.'
    main:
      title: 'Główna treść'
      description: 'Podstawowe informacje pozostają wyśrodkowane dla czytelności.'
    right:
      title: 'Prawy panel'
      description: 'Kontekstowe działania i spostrzeżenia mogą być grupowane po tej stronie.'
    footer:
      meta: 'Zaktualizowano 2 minuty temu'
      action: 'Otwórz szczegóły'
figure:
