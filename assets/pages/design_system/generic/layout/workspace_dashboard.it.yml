~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Cruscotto
page_icon: 'ph:bold/squares-four'
mode:
  reopen: 'Riapri il pannello API'
  gap: 'Con gap'
  flush: Flush
state:
  success: Nominale
  warning: Degradato
  error: 'In errore'
  running: Scarico
tile:
  traffic:
    title: Traffico
    figure: '12.4k req/min'
    description: "Divisioni all'interno di una divisione: il muro è una divisione verticale di righe, ogni riga è una divisione a sé stante. Trascina il bordo sotto questa riga per aumentare l'altezza, o quello accanto a questo riquadro per aumentare la larghezza."
  latency:
    title: 'Latenza p95'
    figure: '184 ms'
    description: 'Ogni riquadro rappresenta un piano, `zone--min-*`: al di sotto di esso il riquadro non viene compresso, il frame scorre invece — lateralmente così come in basso.'
  errors:
    title: Errori
    figure: '2.1 %'
    description: "Ridimensionato, una zona mantiene la dimensione a cui è stata lasciata lungo l'asse della sua divisione e vi torna; un doppio clic sulla maniglia la riporta alla divisione."
  queue:
    title: Coda
    figure: '318 lavori'
    description: '`zone--split--flush` riduce il gap a un pixel, il disegno del muro traccia la linea tra i riquadri. Una classe sul muro è sufficiente, le righe la ereditano.'
  deploys:
    title: Deploy
    figure: '7 oggi'
    description: 'Senza di essa lo stesso muro mantiene lo spazio tra i suoi riquadri, attraverso il quale mostra il fondo della pagina — cambia nella barra sopra. Scorri a destra per un pannello caricato solo una volta che è visibile.'
