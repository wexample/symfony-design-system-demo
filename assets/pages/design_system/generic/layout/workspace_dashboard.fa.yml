~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: داشبورد
page_icon: 'ph:bold/squares-four'
mode:
  reopen: 'پنل API را دوباره باز کنید'
  gap: 'با شکاف‌ها'
  flush: 'خالی کردن'
state:
  success: نرمال
  warning: 'کاهش عملکرد'
  error: 'در حال شکست'
  running: 'در حال تخلیه'
tile:
  traffic:
    title: ترافیک
    figure: '۱۲.۴k درخواست/دقیقه'
    description: 'شکاف‌ها درون یک شکاف: دیوار یک شکاف عمودی از ردیف‌ها است، هر ردیف شکاف خود را دارد. لبه زیر این ردیف را بکشید تا ارتفاع بیشتری بگیرد، یا لبه کنار این کاشی را برای عرض بیشتر.'
  latency:
    title: 'تاخیر p95'
    figure: '۱۸۴ میلی‌ثانیه'
    description: 'هر کاشی یک طبقه را نامگذاری می‌کند، `zone--min-*`: در زیر آن کاشی فشرده نمی‌شود، به جای آن فریم به طرفین و پایین حرکت می‌کند.'
  errors:
    title: خطاها
    figure: '2.1 %'
    description: 'با تغییر اندازه، یک ناحیه اندازه‌ای را که در محور شکاف خود رها شده حفظ می‌کند و با آن باز می‌گردد؛ دو بار کلیک بر روی دستگیره آن را به شکاف برمی‌گرداند.'
  queue:
    title: صف
    figure: '۳۱۸ کار'
    description: '`zone--split--flush` فاصله را به یک پیکسل تنگ می‌کند، زمین دیوار خطی را بین کاشی‌ها ترسیم می‌کند. یک کلاس روی دیوار کافی است، ردیف‌ها آن را به ارث می‌برند.'
  deploys:
    title: استقرارها
    figure: '۷ امروز'
    description: 'بدون آن، همان دیوار فضای بین کاشی‌های خود را حفظ می‌کند، که از طریق آن زمین صفحه نمایش داده می‌شود — در نوار بالایی سوئیچ کنید. به سمت راست اسکرول کنید تا پنلی بارگذاری شود که تنها زمانی دیده می‌شود.'
