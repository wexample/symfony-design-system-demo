~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'علامات التبويب'
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'علامات التبويب في Vue'
    description: 'شريط التويج هو صف من الروابط والعنوان يوضح أي منها مفتوح. شريط Vue يبلغ فقط أنه تم الطلب لعلامة تبويب، لذا شيء حولها يحمل الإجابة — هنا، مكون عرض تجريبي.'
  breadcrumb:
    vue_description: 'التوأم في Vue يأخذ عناصره التي تم حلها مسبقًا: الخادم يحتفظ بجدول المسارات، لذا يجيب عليه، وما يعبر هو الإجابة.'
    title: 'مسار التنقل'
    description: 'يعرض موقع المستخدم داخل الهيكل. استخدم جزئية مسار التنقل — مرر العناصر مع المسار والتسمية؛ العنصر الأخير دائمًا يتم عرضه كحالي.'
  tabs:
    title: 'علامات التبويب'
  default:
    normal:
      title: 'علامات التبويب الأساسية'
    full:
      title: 'علامات التبويب الأساسية (عرض كامل)'
    half:
      title: 'علامات التبويب الأساسية (منطقة نصف العرض)'
  counts:
    title: 'علامات التبويب مع عد'
    description: 'عدد العناصر الموجودة في أي علامة تبويب، في نهاية التسمية. إنها حبة ولا شيء آخر — مرر `count` بجانب التسمية وستضعها علامة التبويب. عنصر بدون المفتاح لا يظهر شيئًا، وهذا هو كيف تبقى علامة التبويب التي ليس لديها شيء للعد هادئة.'
  icons:
    normal:
      title: 'علامات التبويب مع الرموز'
    full:
      title: 'علامات التبويب مع الرموز (عرض كامل)'
    half:
      title: 'علامات التبويب مع الرموز (منطقة نصف العرض)'
