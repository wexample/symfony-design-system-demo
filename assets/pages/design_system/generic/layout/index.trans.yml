en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Layout
  page_icon: ph:bold/layout

  intro: "How a page is divided. These shapes take regions rather than content: they say where things stand, and know nothing of what stands there."

  page:
    zones:
      title: Zones
      description: "The two-pane workspace: a split, a sized column, a scrollable body. What every explorer, editor and detail view in an app is built on."
    workspace:
      title: Workspace
      description: "Pages made of regions laid side by side, told apart by the room between them and nothing else. Three arrangements, moved between by the tree standing in each of them."
    blocks:
      title: Blocks
      description: "The surface a group of things sits on, padded or not, with its card and figure variants."
    toolbar:
      title: Toolbar
      description: "A line of actions above or below what they act on, in its roomy and compact densities."
    tabs:
      title: Tabs
      description: "One page showing one of several faces, with the panels that follow the choice."
    doc:
      title: Doc layout
      description: "The two-column documentation pattern — prose on one side, code on the other — that folds to one column when there is no room."

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: تصميم
  page_icon: 'ph:bold/layout'
  intro: 'كيف يتم تقسيم الصفحة. هذه الأشكال تأخذ مناطق بدلاً من المحتوى: تحدد أين تقع الأشياء، ولا تعرف شيئًا عما يوجد هناك.'
  page:
    focus:
      title: Focus
      description: "One thing to do and nothing around it: the window as one region, a card in its middle."
    zones:
      title: المناطق
      description: 'مساحة العمل ذات اللوحين: عمود مقسوم، عمود بحجم محدد، جسم قابل للتمرير. ما يُبنى عليه كل مستكشف، ومحرر، وعرض تفاصيل في التطبيق.'
    workspace:
      title: 'مساحة العمل'
      description: 'صفحات مكونة من مناطق موضوعة جنبًا إلى جنب، تُميزها المسافة بينها ولا شيء آخر. ثلاث ترتيبات، يتم التنقل بينها بواسطة الشجرة الموجودة في كل منها.'
    blocks:
      title: الكتل
      description: 'السطح الذي يجلس عليه مجموعة من الأشياء، مبطنًا أو غير مبطن، مع متغيراته من البطاقة والشكل.'
    toolbar:
      title: 'شريط الأدوات'
      description: 'خط من الإجراءات فوق أو تحت ما تعمل عليه، بكثافاته الفسيحة والمضغوطة.'
    tabs:
      title: 'علامات التبويب'
      description: 'صفحة واحدة تظهر واحدة من عدة وجوه، مع الألواح التي تتبع الاختيار.'
    doc:
      title: 'تصميم الوثيقة'
      description: 'نمط الوثائق ذو العمودين — نص في جانب، كود في الجانب الآخر — الذي يطوى إلى عمود واحد عندما لا يوجد مكان.'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: লেআউট
  page_icon: 'ph:bold/layout'
  intro: 'একটি পৃষ্ঠা কিভাবে বিভক্ত হয়। এই আকৃতিগুলি বিষয়বস্তু না নিয়ে অঞ্চল গ্রহণ করে: তারা বলছে জিনিসগুলি কোথায় অবস্থান করছে, এবং সেখানে কি আছে তা জানে না।'
  page:
    zones:
      title: জোন
      description: 'দুই-প্যানের কাজের স্থান: একটি বিভাজিত, একটি আকারযুক্ত কলাম, একটি স্ক্রলযোগ্য দেহ। একটি অ্যাপে প্রতিটি অনুসন্ধানকারী, সম্পাদক এবং বিস্তারিত দৃশ্য যা তৈরি হয়।'
    workspace:
      title: 'কাজের স্থান'
      description: 'পৃষ্ঠাগুলি পাশে পাশে সাজানো অঞ্চলে তৈরি হয়, তাদের মধ্যে ঘরের মাধ্যমে পৃথক করা হয় এবং কিছুই নয়। তিনটি বিন্যাস, প্রতিটি মধ্যে দাঁড়িয়ে থাকা গাছের দ্বারা চলাচল করে।'
    blocks:
      title: ব্লক
      description: 'যার উপর একটি গ্রুপ বসে থাকে, প্যাডেড বা না, এর কার্ড এবং ফিগার ভ্যারিয়েন্ট সহ।'
    toolbar:
      title: টুলবার
      description: 'যা তারা কার্যকর করে তার উপরে বা নিচে ক্রিয়াকলাপের একটি লাইন, এর প্রশস্ত এবং সংক্ষিপ্ত ঘনত্বে।'
    tabs:
      title: ট্যাব
      description: 'একটি পৃষ্ঠা একাধিক মুখের একটি প্রদর্শন করছে, নির্বাচনের অনুসরণ করা প্যানেল সহ।'
    doc:
      title: 'ডক লেআউট'
      description: 'দুই-কলামের ডকুমেন্টেশন প্যাটার্ন — একপক্ষে প্রজার লেখা, অন্যপক্ষে কোড — যা কোনো ঘর না থাকলে এক কলামে ভাঁজ করে।'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Layout
  page_icon: 'ph:bold/layout'
  intro: 'Wie eine Seite unterteilt ist. Diese Formen nehmen Bereiche statt Inhalte ein: sie zeigen, wo Dinge stehen, und wissen nichts darüber, was dort steht.'
  page:
    zones:
      title: Zonen
      description: 'Der Arbeitsbereich mit zwei Fenstern: eine Teilung, eine formatierte Spalte, ein scrollbarer Bereich. Darauf basieren alle Explorer, Editor und Detailansichten in einer App.'
    workspace:
      title: Arbeitsbereich
      description: 'Seiten, die aus nebeneinander liegenden Bereichen bestehen, die sich nur durch den Abstand zwischen ihnen unterscheiden. Drei Anordnungen, zwischen denen man durch den Baum in jedem von ihnen wechselt.'
    blocks:
      title: Blocks
      description: 'Die Fläche, auf der eine Gruppe von Dingen sitzt, gepolstert oder nicht, mit ihren Karten- und Figurenvarianten.'
    toolbar:
      title: Werkzeugleiste
      description: 'Eine Reihe von Aktionen über oder unter dem, was sie beeinflussen, in ihren geräumigen und kompakten Dichten.'
    tabs:
      title: Tabs
      description: 'Eine Seite, die eines von mehreren Gesichtern zeigt, mit den Panels, die der Auswahl folgen.'
    doc:
      title: Dokumentlayout
      description: 'Das zweispaltige Dokumentationsmuster — Prosa auf der einen Seite, Code auf der anderen — das bei Platzmangel zu einer Spalte zusammenklappt.'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Diseño
  page_icon: 'ph:bold/layout'
  intro: 'Cómo se divide una página. Estas formas ocupan regiones en lugar de contenido: indican dónde están las cosas y no saben nada de lo que hay allí.'
  page:
    zones:
      title: Zonas
      description: 'El espacio de trabajo de dos paneles: un dividido, una columna de tamaño definido, un cuerpo desplazable. En lo que se basa cada explorador, editor y vista de detalle en una aplicación.'
    workspace:
      title: 'Espacio de trabajo'
      description: 'Páginas compuestas de regiones dispuestas lado a lado, diferenciadas por el espacio entre ellas y nada más. Tres disposiciones, entre las que se puede mover a través del árbol que se encuentra en cada una de ellas.'
    blocks:
      title: Bloques
      description: 'La superficie sobre la que se asienta un grupo de cosas, acolchada o no, con sus variantes de tarjeta y figura.'
    toolbar:
      title: 'Barra de herramientas'
      description: 'Una línea de acciones por encima o por debajo de lo que actúan, en sus densidades amplias y compactas.'
    tabs:
      title: Pestañas
      description: 'Una página mostrando una de varias caras, con los paneles que siguen la elección.'
    doc:
      title: 'Diseño de documento'
      description: 'El patrón de documentación de dos columnas —prosa de un lado, código del otro— que se pliega a una columna cuando no hay espacio.'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: چیدمان
  page_icon: 'ph:bold/layout'
  intro: 'چگونه یک صفحه تقسیم می‌شود. این شکل‌ها نواحی را به جای محتوا می‌گیرند: آن‌ها می‌گویند چیزها کجا قرار دارند و هیچ چیز از آنچه در آنجا ایستاده‌اند نمی‌دانند.'
  page:
    zones:
      title: زون‌ها
      description: 'فضای کاری دو قسمتی: یک تقسیم، یک ستون اندازه‌دار، یک بدنه قابل اسکرول. هر کاوشگر، ویرایشگر و نمای جزئی در یک برنامه بر اساس این ساخته شده است.'
    workspace:
      title: 'فضای کاری'
      description: 'صفحات ساخته شده از نواحی که در کنار هم قرار گرفته‌اند، که فقط با فضای بین آن‌ها از هم متمایز می‌شوند. سه چیدمان، که با درختی که در هر یک از آن‌ها ایستاده است جابجا می‌شوند.'
    blocks:
      title: بلوک‌ها
      description: 'سطحی که یک گروه از چیزها بر روی آن نشسته‌اند، با یا بدون پد، با انواع کارت و شکل آن.'
    toolbar:
      title: 'نوار ابزار'
      description: 'یک خط از اقدامات بالای یا زیر آنچه بر روی آن عمل می‌کند، در چگالی‌های جادار و فشرده.'
    tabs:
      title: برگه‌ها
      description: 'یک صفحه که یکی از چندین چهره را نشان می‌دهد، با پنل‌هایی که انتخاب را دنبال می‌کنند.'
    doc:
      title: 'چیدمان سند'
      description: 'الگوی مستندات دو ستونی — نثر در یک سمت، کد در سمت دیگر — که هنگامی که جا نیست به یک ستون جمع می‌شود.'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Asettelu
  page_icon: 'ph:bold/layout'
  intro: 'Miten sivu jakautuu. Nämä muodot vievät alueita eivätkä sisältöä: ne sanovat, missä asiat sijaitsevat, eivätkä tiedä, mitä siellä on.'
  page:
    zones:
      title: Alueet
      description: 'Kaksiosainen työtila: jakautunut, mitoitettu sarake, vieritettävä sisältö. Mikä tahansa explorer, editor ja yksityiskohtanäkymä sovelluksessa perustuu tähän.'
    workspace:
      title: Työtila
      description: 'Sivut, jotka koostuvat vierekkäisistä alueista, erotettu toisistaan niiden välissä olevalla tilalla, eikä muulla. Kolme asettelua, joista siirrytään puun kautta, joka on jokaisessa niistä.'
    blocks:
      title: Blokit
      description: 'Pinta, jolla joukko asioita istuu, pehmustettuna tai ilman, kortti- ja kuvamuunnelmat mukana.'
    toolbar:
      title: Työkalupalkki
      description: 'Rivi toimintoja sen ylä- tai alapuolella, johon ne vaikuttavat, tilavissa ja kompakteissa tiheyksissä.'
    tabs:
      title: Välilehdet
      description: 'Yksi sivu, joka näyttää yhden useista näkymistä, paneeleilla, jotka seuraavat valintaa.'
    doc:
      title: 'Dokumentin asettelu'
      description: 'Kaksisarakkeinen dokumentointimalli — proosa yhdellä puolella, koodi toisella — joka taittuu yhteen sarakkeeseen, kun tilaa ei ole.'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Mise en page'
  page_icon: 'ph:bold/layout'
  intro: "Comment une page est divisée. Ces formes prennent des régions plutôt que du contenu : elles indiquent où se trouvent les choses, et ne savent rien de ce qui s'y trouve."
  page:
    zones:
      title: Zones
      description: "L'espace de travail à deux volets : une division, une colonne de taille, un corps défilable. Sur quoi chaque explorateur, éditeur et vue détaillée dans une application est construit."
    workspace:
      title: 'Espace de travail'
      description: "Pages composées de régions placées côte à côte, distinguées par l'espace entre elles et rien d'autre. Trois dispositions, déplacées entre par l'arbre se tenant dans chacune d'elles."
    blocks:
      title: Blocs
      description: 'La surface sur laquelle un groupe de choses repose, rembourrée ou non, avec ses variantes de carte et de figure.'
    toolbar:
      title: "Barre d'outils"
      description: "Une ligne d'actions au-dessus ou en dessous de ce sur quoi elles agissent, dans ses densités spacieuses et compactes."
    tabs:
      title: Onglets
      description: 'Une page montrant un des plusieurs visages, avec les panneaux qui suivent le choix.'
    doc:
      title: 'Mise en page du document'
      description: "Le modèle de documentation à deux colonnes — prose d'un côté, code de l'autre — qui se replie en une colonne lorsqu'il n'y a pas de place."

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: פריסה
  page_icon: 'ph:bold/layout'
  intro: 'איך דף מחולק. הצורות הללו תופסות אזורים ולא תוכן: הן מציינות היכן הדברים נמצאים, ואינן יודעות מה נמצא שם.'
  page:
    focus:
      title: Focus
      description: "Une seule chose à faire, rien autour : la fenêtre en une région, une carte au milieu."
    zones:
      title: אזורים
      description: 'סביבת עבודה עם שני פאנלים: עמודה מחולקת, עמודה ממדי, גוף ניתן לגלילה. על מה שכל חוקר, עורך ותצוגת פרטים באפליקציה בנויה.'
    workspace:
      title: 'סביבת עבודה'
      description: 'דפים עשויים אזורים מונחים זה לצד זה, המופרדים על ידי המרווח ביניהם ושום דבר נוסף. שלוש סידורים, מועברים ביניהם על ידי העץ העומד בכל אחד מהם.'
    blocks:
      title: בלוקים
      description: 'המשטח שעליו יושבת קבוצת דברים, עם ריפוד או בלי, עם גרסאות כרטיס ודמות.'
    toolbar:
      title: 'סרגל הכלים'
      description: 'שורת פעולות מעל או מתחת למה שהן פועלות עליו, בצפיפות מרווחה ודחוסה.'
    tabs:
      title: כרטיסיות
      description: 'דף אחד המראה אחד מכמה פנים, עם הפאנלים שעוקבים אחרי הבחירה.'
    doc:
      title: 'פריסת מסמך'
      description: 'תבנית תיעוד עם שני עמודים — טקסט בצד אחד, קוד בצד השני — שמתמזגת לעמודה אחת כשאין מקום.'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: लेआउट
  page_icon: 'ph:bold/layout'
  intro: 'एक पृष्ठ कैसे विभाजित होता है। ये आकृतियाँ क्षेत्रों को लेती हैं न कि सामग्री को: वे बताती हैं कि चीजें कहां हैं, और यह नहीं जानती कि वहां क्या है।'
  page:
    zones:
      title: क्षेत्र
      description: 'दो-पैन कार्यक्षेत्र: एक विभाजन, एक आकार का कॉलम, एक स्क्रॉल करने योग्य शरीर। जो हर अन्वेषक, संपादक और ऐप में विवरण दृश्य पर आधारित है।'
    workspace:
      title: कार्यक्षेत्र
      description: 'पृष्ठ जो एक साथ रखे गए क्षेत्रों से बने होते हैं, जो उनके बीच की जगह से अलग होते हैं और कुछ नहीं। तीन व्यवस्थाएँ, जो प्रत्येक में खड़े पेड़ द्वारा एक-दूसरे के बीच स्थानांतरित होती हैं।'
    blocks:
      title: ब्लॉक्स
      description: 'एक समूह की चीजें जिस सतह पर बैठती हैं, पैडेड या नहीं, इसके कार्ड और आकृति भिन्नताओं के साथ।'
    toolbar:
      title: टूलबार
      description: 'एक क्रियाओं की पंक्ति जो वे जिस पर कार्य करती हैं, उसके ऊपर या नीचे होती है, इसके विशाल और संक्षिप्त घनत्व में।'
    tabs:
      title: टैब
      description: 'एक पृष्ठ जो कई चेहरों में से एक दिखा रहा है, जिसके पैनल चयन का पालन करते हैं।'
    doc:
      title: 'दस्तावेज़ लेआउट'
      description: 'दो-स्तंभ दस्तावेज़ीकरण पैटर्न - एक तरफ गद्य, दूसरी तरफ कोड - जो जब कोई जगह नहीं होती है तो एक कॉलम में मुड़ जाता है।'

id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Tata Letak'
  page_icon: 'ph:bold/layout'
  intro: 'Bagaimana sebuah halaman dibagi. Bentuk-bentuk ini mengambil wilayah daripada konten: mereka menunjukkan posisi sesuatu, dan tidak tahu apa yang berada di sana.'
  page:
    zones:
      title: Zona
      description: 'Workspace dua panel: sebuah pembagian, kolom berukuran, tubuh yang dapat digulir. Apa yang menjadi dasar setiap penjelajah, editor, dan tampilan detail dalam aplikasi.'
    workspace:
      title: Workspace
      description: 'Halaman yang terdiri dari wilayah yang diletakkan berdampingan, dibedakan oleh ruang di antara mereka dan tidak ada yang lain. Tiga susunan, berpindah di antara mereka dengan pohon yang berdiri di masing-masing.'
    blocks:
      title: Blok
      description: 'Permukaan tempat sekelompok benda berada, dengan atau tanpa padding, dengan variasi kartu dan figur.'
    toolbar:
      title: Toolbar
      description: 'Serangkaian aksi di atas atau di bawah apa yang mereka lakukan, dalam kepadatan yang luas dan kompak.'
    tabs:
      title: Tab
      description: 'Satu halaman menampilkan salah satu dari beberapa wajah, dengan panel yang mengikuti pilihan.'
    doc:
      title: 'Tata Letak Dokumen'
      description: 'Pola dokumentasi dua kolom — prosa di satu sisi, kode di sisi lainnya — yang dilipat menjadi satu kolom ketika tidak ada ruang.'

it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Layout
  page_icon: 'ph:bold/layout'
  intro: "Come è divisa una pagina. Queste forme occupano spazi piuttosto che contenuti: indicano dove si trovano le cose e non sanno nulla di ciò che c'è."
  page:
    zones:
      title: Zone
      description: "L'area di lavoro a due pannelli: una divisione, una colonna dimensionata, un corpo scorrevole. Su cui si basa ogni esploratore, editor e vista dettagliata in un'app."
    workspace:
      title: 'Area di lavoro'
      description: "Pagine composte da regioni disposte affiancate, distinte solo dallo spazio tra di esse. Tre disposizioni, tra cui spostarsi tramite l'albero che si trova in ciascuna di esse."
    blocks:
      title: Blocchi
      description: 'La superficie su cui si trova un gruppo di elementi, imbottita o meno, con le sue varianti a scheda e figura.'
    toolbar:
      title: 'Barra degli strumenti'
      description: 'Una linea di azioni sopra o sotto a ciò su cui agiscono, nelle sue densità ampie e compatte.'
    tabs:
      title: Schede
      description: 'Una pagina che mostra uno dei vari volti, con i pannelli che seguono la scelta.'
    doc:
      title: 'Layout del documento'
      description: "Il modello di documentazione a due colonne — testo da un lato, codice dall'altro — che si piega in una colonna quando non c'è spazio."

ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: レイアウト
  page_icon: 'ph:bold/layout'
  intro: ページがどのように分けられるか。これらの形はコンテンツではなく領域を取ります：物がどこにあるかを示し、そこに何があるかは知りません。
  page:
    zones:
      title: ゾーン
      description: 二分割のワークスペース：分割され、サイズのあるカラム、スクロール可能なボディ。アプリのすべてのエクスプローラー、エディター、および詳細ビューはこれに基づいています。
    workspace:
      title: ワークスペース
      description: 横に並べられた領域で構成され、間のスペース以外には何も区別がないページ。各領域に立つ木を介して移動する3つの配置。
    blocks:
      title: ブロック
      description: 物のグループが座る表面、パディングの有無にかかわらず、そのカードとフィギュアのバリアントがあります。
    toolbar:
      title: ツールバー
      description: その作用対象の上または下にあるアクションのライン、広々とした密度とコンパクトな密度で。
    tabs:
      title: タブ
      description: 1つのページがいくつかの顔のうちの1つを表示し、その選択に続くパネルを伴います。
    doc:
      title: ドキュメントレイアウト
      description: '片側にプローズ、もう片側にコードがある二カラムのドキュメントパターン — スペースがないときは一カラムに折りたたまれます。'

ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 레이아웃
  page_icon: 'ph:bold/layout'
  intro: '페이지가 어떻게 나뉘는지에 대한 설명. 이 형태는 콘텐츠가 아닌 영역을 차지하며, 사물이 어디에 위치하는지를 나타내고, 그곳에 무엇이 있는지는 알지 못합니다.'
  page:
    zones:
      title: 존
      description: '두 개의 패널로 구성된 작업 공간: 분할된 크기 열과 스크롤 가능한 본문. 모든 탐색기, 편집기 및 앱의 세부 정보 뷰가 기반하는 것입니다.'
    workspace:
      title: '작업 공간'
      description: '나란히 배치된 영역으로 구성된 페이지, 그들 사이의 공간에 의해 구분되며 그 외에는 아무것도 없습니다. 세 가지 배열이 있으며, 각 배열 사이에는 트리가 있습니다.'
    blocks:
      title: 블록
      description: '물체 그룹이 놓이는 표면, 패딩이 있든 없든, 카드 및 도형 변형이 포함됩니다.'
    toolbar:
      title: 툴바
      description: '작용하는 것의 위 또는 아래에 있는 동작의 줄, 널찍하고 컴팩트한 밀도로 구성됩니다.'
    tabs:
      title: 탭
      description: '여러 면 중 하나를 보여주는 한 페이지, 선택에 따라 패널이 따라옵니다.'
    doc:
      title: '문서 레이아웃'
      description: '한쪽에는 프로세가, 다른 쪽에는 코드가 있는 두 열 문서 패턴 — 공간이 없을 때는 한 열로 접히는 형식입니다.'

nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Indeling
  page_icon: 'ph:bold/layout'
  intro: 'Hoe een pagina is verdeeld. Deze vormen nemen gebieden in plaats van inhoud: ze geven aan waar dingen staan, en weten niet wat daar staat.'
  page:
    zones:
      title: Zones
      description: 'De werkruimte met twee panelen: een split, een gekleurde kolom, een scrollbare inhoud. Waarop elke verkenner, editor en detailweergave in een app is gebouwd.'
    workspace:
      title: Werkruimte
      description: "Pagina's gemaakt van naast elkaar gelegde gebieden, van elkaar te onderscheiden door de ruimte ertussen en verder niets. Drie indelingen, waarmee je tussen de bomen kunt bewegen die in elk van hen staan."
    blocks:
      title: Blokken
      description: 'Het oppervlak waarop een groep dingen staat, met of zonder opvulling, met zijn kaart- en figuurvarianten.'
    toolbar:
      title: Werkbalk
      description: 'Een rij acties boven of onder waar ze op inwerken, in zijn ruime en compacte dichtheden.'
    tabs:
      title: Tabbladen
      description: 'Één pagina die een van de verschillende gezichten toont, met de panelen die de keuze volgen.'
    doc:
      title: Documentindeling
      description: 'Het documentpatroon met twee kolommen — proza aan de ene kant, code aan de andere — dat naar één kolom vouwt wanneer er geen ruimte is.'

pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Układ
  page_icon: 'ph:bold/layout'
  intro: 'Jak strona jest podzielona. Te kształty zajmują obszary, a nie treści: wskazują, gdzie co stoi, i nic nie wiedzą o tym, co tam stoi.'
  page:
    zones:
      title: Strefy
      description: 'Dwupanelowe miejsce pracy: podział, kolumna o określonym rozmiarze, przewijalne ciało. Na czym opiera się każdy eksplorator, edytor i widok szczegółowy w aplikacji.'
    workspace:
      title: 'Obszar roboczy'
      description: 'Strony składające się z obszarów ułożonych obok siebie, rozróżniane przez przestrzeń między nimi i nic innego. Trzy układy, przemieszczane przez drzewo znajdujące się w każdym z nich.'
    blocks:
      title: Bloki
      description: 'Powierzchnia, na której siedzi grupa rzeczy, wyściełana lub nie, z wariantami kart i figur.'
    toolbar:
      title: 'Pasek narzędzi'
      description: 'Linia działań nad lub pod tym, na co działają, w swoich przestronnych i kompaktowych gęstościach.'
    tabs:
      title: Karty
      description: 'Jedna strona pokazująca jedną z kilku twarzy, z panelami, które następują po wyborze.'
    doc:
      title: 'Układ dokumentu'
      description: 'Wzór dokumentacji w dwóch kolumnach — tekst po jednej stronie, kod po drugiej — który zwija się do jednej kolumny, gdy brakuje miejsca.'

pt_BR:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Layout
  page_icon: 'ph:bold/layout'
  intro: 'Como uma página é dividida. Essas formas ocupam regiões ao invés de conteúdo: elas indicam onde as coisas estão e não sabem nada sobre o que está lá.'
  page:
    zones:
      title: Zonas
      description: 'O espaço de trabalho em duas partes: uma divisão, uma coluna dimensionada, um corpo rolável. O que cada explorador, editor e visualização de detalhe em um aplicativo é construído.'
    workspace:
      title: 'Espaço de trabalho'
      description: 'Páginas feitas de regiões dispostas lado a lado, diferenciadas pelo espaço entre elas e nada mais. Três arranjos, alternados pela árvore que está em cada uma delas.'
    blocks:
      title: Blocos
      description: 'A superfície onde um grupo de coisas está, com ou sem acolchoamento, com suas variantes de cartão e figura.'
    toolbar:
      title: 'Barra de ferramentas'
      description: 'Uma linha de ações acima ou abaixo do que elas atuam, em suas densidades amplas e compactas.'
    tabs:
      title: Abas
      description: 'Uma página mostrando um de vários aspectos, com os painéis que seguem a escolha.'
    doc:
      title: 'Layout do doc'
      description: 'O padrão de documentação em duas colunas — prosa de um lado, código do outro — que se dobra em uma coluna quando não há espaço.'

ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Макет
  page_icon: 'ph:bold/layout'
  intro: 'Как страница разделена. Эти формы занимают области, а не содержимое: они указывают, где что находится, и ничего не знают о том, что там стоит.'
  page:
    zones:
      title: Зоны
      description: 'Рабочее пространство с двумя панелями: разделенное, колонка заданного размера, прокручиваемое тело. На чем основаны все эксплореры, редакторы и представления деталей в приложении.'
    workspace:
      title: 'Рабочее пространство'
      description: 'Страницы, состоящие из регионов, расположенных рядом, различающиеся пространством между ними и ничем другим. Три расположения, между которыми можно перемещаться через дерево, стоящее в каждом из них.'
    blocks:
      title: Блоки
      description: 'Поверхность, на которой располагается группа объектов, с подкладкой или без, с вариантами карточек и фигур.'
    toolbar:
      title: 'Панель инструментов'
      description: 'Линия действий над или под тем, на что они воздействуют, в своих просторных и компактных плотностях.'
    tabs:
      title: Вкладки
      description: 'Одна страница, показывающая одно из нескольких лиц, с панелями, которые следуют за выбором.'
    doc:
      title: 'Макет документа'
      description: 'Шаблон документации с двумя колонками — текст с одной стороны, код с другой — который сворачивается в одну колонку, когда не хватает места.'

th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: เลย์เอาต์
  page_icon: 'ph:bold/layout'
  intro: 'วิธีการแบ่งหน้า หน้าเหล่านี้ใช้พื้นที่มากกว่าคอนเทนต์: มันบอกว่ามีสิ่งใดอยู่ที่ไหน และไม่รู้ว่ามีอะไรอยู่ตรงนั้น'
  page:
    zones:
      title: โซน
      description: 'พื้นที่ทำงานแบบสองบาน: แบ่ง, คอลัมน์ขนาด, เนื้อหาที่เลื่อนดูได้ สิ่งที่นักสำรวจ, บรรณาธิการ และการดูรายละเอียดในแอปทุกตัวสร้างขึ้นมา'
    workspace:
      title: พื้นที่ทำงาน
      description: 'หน้าเว็บที่ประกอบด้วยพื้นที่จัดเรียงข้างกัน แยกจากกันด้วยช่องว่างระหว่างพวกเขาและไม่มีอย่างอื่น การจัดเรียงสามแบบ เคลื่อนที่ระหว่างกันด้วยต้นไม้ที่อยู่ในแต่ละพื้นที่'
    blocks:
      title: บล็อก
      description: 'พื้นผิวที่กลุ่มของสิ่งต่าง ๆ นั่งอยู่ มีการใส่ขอบหรือไม่ก็ตาม พร้อมด้วยรูปแบบการ์ดและรูปภาพ'
    toolbar:
      title: แถบเครื่องมือ
      description: 'แถบของการกระทำที่อยู่ด้านบนหรือล่างของสิ่งที่มันทำงานอยู่ โดยมีความหนาที่กว้างและกะทัดรัด'
    tabs:
      title: แท็บ
      description: 'หนึ่งหน้าที่แสดงหนึ่งในหลายหน้า พร้อมกับแผงที่ตามตัวเลือกนั้น'
    doc:
      title: การจัดเลย์เอาต์เอกสาร
      description: 'รูปแบบเอกสารแบบสองคอลัมน์ — เนื้อหาอยู่ด้านหนึ่ง, โค้ดอยู่ด้านอื่น — ที่พับเป็นหนึ่งคอลัมน์เมื่อไม่มีพื้นที่'

tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Düzen
  page_icon: 'ph:bold/layout'
  intro: 'Bir sayfanın nasıl bölündüğü. Bu şekiller içerikten ziyade alan alır: nerede ne olduğunu söyler ve orada ne olduğunu bilmez.'
  page:
    zones:
      title: Bölgeler
      description: 'İki bölmeli çalışma alanı: bölünmüş, boyutlandırılmış bir sütun, kaydırılabilir bir gövde. Bir uygulamadaki her gezgin, editör ve detay görünümü bunun üzerine inşa edilmiştir.'
    workspace:
      title: 'Çalışma Alanı'
      description: 'Yan yana yerleştirilmiş bölgelerden oluşan sayfalar, aralarındaki boşlukla ayrılır ve başka bir şeyle değil. Üç düzenleme, her birinde bulunan ağaçla geçiş yapılır.'
    blocks:
      title: Bloklar
      description: 'Bir grup nesnenin üzerinde oturduğu yüzey, yastıklı veya yastıksız, kart ve şekil varyantları ile.'
    toolbar:
      title: 'Araç Çubuğu'
      description: 'Eylemde bulundukları şeyin üstünde veya altında bir dizi eylem, geniş ve kompakt yoğunluklarda.'
    tabs:
      title: Sekmeler
      description: 'Bir sayfa, seçimle birlikte gelen panellerle birkaç yüzden birini gösteriyor.'
    doc:
      title: 'Doküman düzeni'
      description: 'İki sütunlu dokümantasyon düzeni — bir tarafta yazı, diğer tarafta kod — yer kalmadığında tek sütuna katlanır.'

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'لے آؤٹ'
  page_icon: 'ph:bold/layout'
  intro: 'ایک صفحہ کس طرح تقسیم ہوتا ہے۔ یہ اشکال علاقوں کو لیتے ہیں نہ کہ مواد: یہ بتاتے ہیں کہ چیزیں کہاں ہیں، اور اس بارے میں کچھ نہیں جانتے کہ وہاں کیا ہے۔'
  page:
    zones:
      title: زونز
      description: 'دو پین ورک اسپیس: ایک تقسیم، ایک سائز دیا گیا کالم، ایک سکرول کرنے والا جسم۔ ہر ایک ایکسپلورر، ایڈیٹر اور ایپ میں تفصیلی منظر جس پر یہ بنایا گیا ہے۔'
    workspace:
      title: 'ورک اسپیس'
      description: 'ایسے صفحات جو کناروں کے ساتھ ساتھ رکھے گئے ہیں، ان کے درمیان کی جگہ سے الگ ہوتے ہیں اور کچھ نہیں۔ تین ترتیبیں، جن کے درمیان درخت کی مدد سے منتقل کیا جاتا ہے جو ہر ایک میں موجود ہوتا ہے۔'
    blocks:
      title: بلاک
      description: 'وہ سطح جس پر چیزوں کا ایک گروپ بیٹھتا ہے، پیڈڈ ہو یا نہ ہو، اس کے کارڈ اور شکل کے مختلف ورژن کے ساتھ۔'
    toolbar:
      title: 'ٹول بار'
      description: 'ایک لائن عمل کی جو ان کے اوپر یا نیچے ہوتی ہے جن پر یہ عمل کرتی ہے، اپنی کشادہ اور کمپیکٹ کثافتوں میں۔'
    tabs:
      title: ٹیب
      description: 'ایک صفحہ جو کئی چہروں میں سے ایک دکھاتا ہے، اس کے ساتھ پینل جو انتخاب کے بعد آتے ہیں۔'
    doc:
      title: 'دستاویز کا لے آؤٹ'
      description: 'دو کالم کی دستاویزی پیٹرن — ایک طرف نثر، دوسری طرف کوڈ — جو جب جگہ نہیں ہوتی تو ایک کالم میں مڑ جاتا ہے۔'

vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Bố cục'
  page_icon: 'ph:bold/layout'
  intro: 'Cách một trang được chia ra. Những hình dạng này chiếm các khu vực thay vì nội dung: chúng cho biết vị trí của mọi thứ, và không biết gì về những gì đứng ở đó.'
  page:
    zones:
      title: 'Khu vực'
      description: 'Không gian làm việc hai ngăn: một sự chia tách, một cột có kích thước, một thân cuộn. Những gì mà mọi trình khám phá, trình chỉnh sửa và chế độ xem chi tiết trong một ứng dụng được xây dựng trên đó.'
    workspace:
      title: 'Không gian làm việc'
      description: 'Các trang được tạo thành từ các khu vực nằm cạnh nhau, được phân biệt bởi khoảng trống giữa chúng và không gì khác. Ba cách sắp xếp, di chuyển giữa chúng bằng cây đứng ở mỗi khu vực.'
    blocks:
      title: Khối
      description: 'Bề mặt mà một nhóm các vật nằm trên, có thể có hoặc không có đệm, với các biến thể thẻ và hình.'
    toolbar:
      title: 'Thanh công cụ'
      description: 'Một dòng hành động nằm ở trên hoặc dưới những gì mà chúng tác động đến, trong các mật độ rộng rãi và gọn gàng.'
    tabs:
      title: Thẻ
      description: 'Một trang hiển thị một trong nhiều mặt, với các bảng điều khiển theo lựa chọn.'
    doc:
      title: 'Bố cục tài liệu'
      description: 'Mẫu tài liệu hai cột — văn bản ở một bên, mã ở bên kia — gập lại thành một cột khi không còn không gian.'

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 布局
  page_icon: 'ph:bold/layout'
  intro: 页面是如何划分的。这些形状占据区域而不是内容：它们说明事物的位置，而对其中的内容一无所知。
  page:
    zones:
      title: 区域
      description: 双窗格工作区：一个分裂、一个大小列、一个可滚动的主体。每个应用程序中的探索者、编辑器和详细视图都是基于此构建的。
    workspace:
      title: 工作区
      description: 由并排放置的区域组成的页面，通过它们之间的空间区分开来，别无他法。三种布局，由站在每个区域中的树木之间移动。
    blocks:
      title: 块
      description: 一组事物所处的表面，有或没有填充，包含卡片和图形变体。
    toolbar:
      title: 工具栏
      description: 在其作用对象的上方或下方的一系列操作，以宽敞和紧凑的密度呈现。
    tabs:
      title: 标签
      description: 一个页面显示多个面貌之一，面板根据选择而变化。
    doc:
      title: 文档布局
      description: 两列文档模式——一侧是文字，另一侧是代码——在没有空间时折叠成一列。
