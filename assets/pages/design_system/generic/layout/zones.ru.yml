~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Зоны
page_icon: 'ph:bold/columns'
intro: 'Рабочее пространство с двумя панелями, на основе которого построены все обозреватели, редакторы и детализированные представления. Зона не имеет собственной ширины и высоты: размер определяется разделением, в котором она находится, и каждая сторона прокручивается отдельно. Две зоны — это два объекта, расположенные на странице, а не одна панель, разрезанная пополам — отличает их пространство между собой, а `zone--panel` — это основание, на котором стоит каждая из них.'
section:
  split:
    title: Разделение
    description: 'Одна колонка с заданным размером, другая занимает оставшееся пространство. Размер определяется шагом, и он принадлежит зоне — не наследуется от чего-либо вложенного внутри.'
  scrollable:
    title: 'Каждая сторона прокручивается отдельно'
    description: 'Прокручиваемая зона удерживает переполнение, а не страница. Прокрутите одну из этих двух, и другая останется на месте, что и является основной причиной этой формы.'
  vertical:
    title: 'Заголовок, который не прокручивается'
    description: 'Разделение, перевернутое вертикально: узкая зона имеет высоту того, что она содержит, тело занимает остальное и прокручивается под ним. Это расположение панели с панелью инструментов сверху.'
  wrap:
    title: 'Под полом'
    description: 'Имея пол, гибкая зона занимает полную строку, а колонка с заданным размером перемещается над ней, вместо того чтобы обе сжимались до нуля. Уменьшите окно, чтобы увидеть, как это складывается.'
split:
  body: 'Эта сторона принимает всё, что оставляет колонка с заданным размером.'
scrollable:
  item: Элемент
  line: Строка
vertical:
  action: Создать
wrap:
  body: 'Под полом, который задан этой зоной, она занимает свою строку.'
