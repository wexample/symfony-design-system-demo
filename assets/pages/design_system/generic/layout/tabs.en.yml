~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

page_title: Tabs
page_icon: ph:bold/signpost

section:
  vue:
    title: Tabs in vue
    description: "The twig bar is a row of links and the address says which one is open. The vue bar only reports that a tab was asked for, so something around it holds the answer — here, a demo component."
  breadcrumb:
    vue_description: "The vue twin takes its items already resolved: the server holds the route table, so it answers it, and what crosses is the answer."
    title: Breadcrumb
    description: "Shows the user's location within the hierarchy. Use the breadcrumb partial — pass items with route and label; the last item is always rendered as current."
  tabs:
    title: Tabs
  default:
    normal:
      title: Basic tabs
    full:
      title: Basic tabs (full width)
    half:
      title: Basic tabs (half width zone)
  counts:
    title: Tabs with a count
    description: "How many of whatever the tab holds, at the end of the label. It is a pill and nothing else — pass `count` beside the label and the tab places it. An item without the key shows nothing, which is how a tab with nothing to count stays quiet."
  icons:
    normal:
      title: Tabs with icons
    full:
      title: Tabs with icons (full width)
    half:
      title: Tabs with icons (half width zone)

breadcrumb:
  example:
    vue: In vue
    two_levels: Two levels
    three_levels: Three levels
  item:
    home: Home
    layout: Layout
    section: Blocks
    current: Navigation

tab:
  one: Overview
  two: Activity
  three: Settings

vue:
  panel:
    one: The first panel. Nothing was fetched and no address changed — the bar emitted, the holder swapped.
    two: The second panel.
    three: The third panel.
