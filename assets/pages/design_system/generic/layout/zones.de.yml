~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Zonen
page_icon: 'ph:bold/columns'
intro: 'Der Arbeitsbereich mit zwei Fenstern, auf dem jeder Explorer, Editor und Detailansicht basiert. Eine Zone hat keine eigene Breite und Höhe: Die Teilung, in der sie sich befindet, bestimmt ihre Größe, und jede Seite scrollt für sich allein. Zwei Zonen sind zwei Objekte, die auf der Seite liegen, nicht ein Panel, das in zwei Hälften geschnitten ist — was sie unterscheidet, ist der Raum zwischen ihnen, und `zone--panel` ist der Grund, auf dem jede steht.'
section:
  split:
    title: 'Eine Teilung'
    description: 'Eine Spalte hat eine feste Größe, die andere nimmt den Rest ein. Die Größe wird durch einen Schritt festgelegt und ist die eigene der Zone — sie wird von nichts, was darin verschachtelt ist, geerbt.'
  scrollable:
    title: 'Jede Seite scrollt für sich allein'
    description: 'Eine scrollbare Zone hält den Überlauf, nicht die Seite. Wenn eine von diesen beiden gescrollt wird, bleibt die andere an ihrem Platz, was der ganze Grund für die Form ist.'
  vertical:
    title: 'Ein Kopfbereich, der nicht scrollt'
    description: 'Eine vertikal geteilte Ansicht: Eine schmale Zone hat die Höhe dessen, was sie hält, der Körper nimmt den Rest ein und scrollt darunter. Dies ist die Anordnung eines Panels mit einer Werkzeugleiste oben.'
  wrap:
    title: 'Unter einem Fußboden'
    description: 'Bei einem Fußboden beansprucht die flexible Zone eine volle Zeile und die feste Spalte bewegt sich darüber, anstatt beide auf nichts zusammengedrückt zu werden. Verkleinern Sie das Fenster, um zu sehen, wie es sich zusammenfaltet.'
split:
  body: 'Diese Seite nimmt alles auf, was die feste Spalte übrig lässt.'
scrollable:
  item: Element
  line: Zeile
vertical:
  action: Erstellen
wrap:
  body: 'Unter dem Fußboden, der dieser Zone gegeben ist, nimmt sie eine eigene Zeile ein.'
