~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'רוחב קבוע'
page_icon: 'ph:bold/arrows-in-line-horizontal'
intro: 'שלוש האזורים הם אותם שלושה, אבל זה שאתה קורא הוא בעל רוחב במקום לקחת אחד — והרוחב שאף אחד לא רוצה הולך לאזור שאין בו כלום.'
section:
  sized:
    title: 'אזור עם רוחב קבוע'
    description: '`zone--narrow` עם שלב גודל: האזור ברוחב הזה ונשאר ברוחב הזה, לא משנה כמה מקום יש לחלון. כך טקסט נשאר קריא — עמודה שגדלה עם המסך מפסיקה להיות אחת.'
  slack:
    title: 'למה יש את הריווח'
    description: 'האזור האחרון לא מחזיק כלום, ועדיין שומר על מקומו: ריק אינו נעדר, ופאנל שממתין נקרא פאנל ולא חור. הוא שם כדי לקחת את הרוחב שהאזורים עם הרוחב מסרבים לו.'
    more: 'חלקה נותנת את השאריות לכל מה שמבקש אותן. כשאין דבר שמבקש, האזורים עם הרוחב היו נמתחים או נדחפים לקצוות; עם זה, הם שומרים על רוחבם והדף שומר על השאר.'
work:
  size: 32rem
