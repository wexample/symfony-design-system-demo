    description: 'কীভাবে একটি জিনিস ফাইল করা হয়, এটি কোথায় থাকে এবং কোন সংস্করণ: তিনটি মার্কার এক সারিতে পড়ে, তাই তারা যা কিছু তৈরি করা হোক না কেন, একটি উচ্চতা ভাগ করে — একটি পিল সাধারণত যেখানে থাকে তার জন্য টেক্সটের জন্য ইএমস-এ আকার দেওয়া হয়, এবং একটি বার এটি পাশে ক্যাপসুলে স্তরিত করে। শিরোনামটি এর মার্জিন ত্যাগ করে এবং নামটি বাম দিকে রাখে।'
