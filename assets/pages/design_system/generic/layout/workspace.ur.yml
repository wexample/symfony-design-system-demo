~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'ورک اسپیس'
page_icon: 'ph:bold/sidebar-simple'
intro: 'یہ صفحہ ایک مثال ہے: جو آپ پڑھ رہے ہیں وہ تین علاقوں کے درمیان میں ہے، جو صفحے کے جسم میں ایک ساتھ رکھے گئے ہیں۔'
section:
  gap:
    title: 'فاصلہ علیحدگی کرنے والا ہے'
    description: 'دو علاقوں کے درمیان کچھ نہیں کھینچا گیا ہے۔ انہیں علیحدہ کرنے والی چیز وہ جگہ ہے جو وہ اپنے درمیان چھوڑتے ہیں، جس کے ذریعے صفحہ دکھاتا ہے — وہی سرزمین جس پر مینو اور ہیڈر کھڑے ہیں۔ ہر علاقہ اپنی خاص چیز رکھتا ہے، جو ایک جسم ہمیشہ رکھتا ہے۔'
  each:
    title: 'ہر ایک اپنے طور پر'
    description: 'دو کالم وہ چوڑائی رکھتے ہیں جو انہیں دی گئی ہے اور درمیان وہی لیتا ہے جو باقی بچتا ہے۔ ان تینوں میں سے کسی ایک کو اسکرول کریں اور باقی دو اپنی جگہ پر رہتے ہیں: ایک علاقہ اپنی اضافی جگہ کو سنبھالتا ہے، اور صفحہ کچھ نہیں سنبھالتا۔'
    more: 'ایک علاقہ اپنے ہمسائے کے بارے میں کچھ نہیں جانتا۔ بائیں جانب کا ایکسپلورر اس کا اپنا ایک تقسیم ہے — ایک بار جو رہتا ہے، ایک درخت جو اس کے نیچے اسکرول ہوتا ہے — اور یہ صفحے پر کہیں اور بھی اسی شکل میں ہوگا۔'
  size:
    title: 'ان میں سے ایک کا سائز'
    description: 'بائیں جانب کا علاقہ ایک `zone-resizer` رکھتا ہے: ایک ہینڈل جو اس کے ساتھ والے فاصلہ کو بھرتا ہے، جو کچھ نہیں کھینچتا — کرسر کہتا ہے کہ یہ حرکت کرتا ہے۔ اسے کھینچیں، یا اسے توجہ دیں اور تیروں کا استعمال کریں؛ ڈبل کلک کرنے سے علاقہ وہ چوڑائی واپس لے لیتا ہے جو صفحے نے اسے دی تھی۔'
    more: 'ایک ہینڈل ایک ایسے علاقے کا سائز بناتا ہے جس کا سائز ہوتا ہے — ایک ایسا جو چوڑائی دی گئی ہو بجائے اس کے کہ جو باقی بچتا ہے لے لے — اور اس کے ساتھ والا لچکدار فرق کو جذب کرتا ہے۔ چوڑائی علاقہ کے نام کے نیچے یاد رکھی جاتی ہے، لہذا یہ صفحے کے ساتھ واپس آتا ہے، یہاں تینوں لے آؤٹ میں چونکہ یہ ایک ہی علاقہ ہے جو حرکت کر رہا ہے۔'
