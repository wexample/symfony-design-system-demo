~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: แท็บ
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'แท็บใน vue'
    description: 'แถบทวิกคือแถวของลิงก์และที่อยู่บอกว่าอันไหนเปิดอยู่ แถบ vue รายงานเพียงว่ามีการร้องขอแท็บ ดังนั้นบางสิ่งรอบๆ มันจึงถือคำตอบ — ที่นี่คือคอมโพเนนต์สาธิต'
  breadcrumb:
    vue_description: 'คู่แฝด vue จะนำรายการที่แก้ไขแล้ว: เซิร์ฟเวอร์ถือแผนที่เส้นทาง ดังนั้นจึงตอบกลับ และสิ่งที่ข้ามคือคำตอบ'
    title: เส้นทาง
    description: 'แสดงตำแหน่งของผู้ใช้ภายในลำดับชั้น ใช้ส่วนเส้นทาง — ส่งรายการที่มีเส้นทางและป้ายกำกับ; รายการสุดท้ายจะแสดงเป็นปัจจุบันเสมอ'
  tabs:
    title: แท็บ
  default:
    normal:
      title: แท็บพื้นฐาน
    full:
      title: 'แท็บพื้นฐาน (ความกว้างเต็ม)'
    half:
      title: 'แท็บพื้นฐาน (ความกว้างครึ่ง)'
  counts:
    title: แท็บพร้อมจำนวน
    description: 'จำนวนของสิ่งที่แท็บถืออยู่ ที่ท้ายของป้ายกำกับ มันคือยาเม็ดและไม่มีอะไรอื่น — ส่ง `count` ข้างป้ายกำกับและแท็บจะวางมันไว้ รายการที่ไม่มีคีย์จะแสดงว่าไม่มีอะไร ซึ่งเป็นวิธีที่แท็บที่ไม่มีอะไรนับจะเงียบ'
