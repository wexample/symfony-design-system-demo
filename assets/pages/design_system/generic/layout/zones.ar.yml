~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: المناطق
page_icon: 'ph:bold/columns'
intro: 'مساحة العمل ذات اللوحين التي يعتمد عليها كل مستكشف ومحرر وعرض تفاصيل. المنطقة ليس لها عرض أو ارتفاع خاص بها: الانقسام الذي تجلس فيه هو ما يحدد حجمها، وكل جانب يتمرر بمفرده. منطقتان هما كائنان موضوعة على الصفحة، وليست لوحة واحدة مقسومة إلى نصفين - ما يميزها هو المسافة بينهما، و`zone--panel` هو الأساس الذي تقف عليه كل واحدة منها.'
section:
  split:
    title: انقسام
    description: 'عمود واحد بالحجم، والآخر يأخذ ما تبقى. الحجم محدد بخطوة، وهو خاص بالمنطقة - لا يتم وراثته من أي شيء داخلها.'
  scrollable:
    title: 'كل جانب يتمرر بمفرده'
    description: 'المنطقة القابلة للتمرير هي ما يحمل الفائض، وليس الصفحة. قم بالتمرير في أحد هذين الجانبين وسيبقى الآخر في مكانه، وهو السبب الكامل لشكلها.'
  vertical:
    title: 'رأس لا يتمرر'
    description: 'انقسام تحول إلى رأسي: منطقة ضيقة بارتفاع ما تحتويه، والجسم يأخذ الباقي ويتم تمريره تحتها. هذا هو ترتيب لوحة مع شريط أدوات في الأعلى.'
  wrap:
    title: 'أسفل الأرضية'
    description: 'عند وجود أرضية، تأخذ المنطقة المرنة خطًا كاملًا وينتقل العمود المحدد فوقها بدلاً من أن يتم ضغط كلاهما إلى لا شيء. قم بتضييق النافذة لترى كيف تنطوي.'
split:
  body: 'هذا الجانب يأخذ ما تتركه العمود المحدد.'
scrollable:
  item: عنصر
  line: خط
vertical:
  action: إنشاء
wrap:
  body: 'أسفل الأرضية التي تعطى لهذه المنطقة، تأخذ خطًا خاصًا بها.'
