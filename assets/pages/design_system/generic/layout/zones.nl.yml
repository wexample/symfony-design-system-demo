~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Zones
page_icon: 'ph:bold/columns'
intro: 'De werkruimte met twee panelen waarop elke verkenner, editor en detailweergave is gebouwd. Een zone heeft geen eigen breedte en hoogte: de split waarin het zich bevindt bepaalt de grootte, en elke kant scrollt afzonderlijk. Twee zones zijn twee objecten op de pagina, geen paneel dat in tweeën is gesneden — wat ze onderscheidt is de ruimte ertussen, en `zone--panel` is de grond waarop elk staat.'
section:
  split:
    title: 'Een split'
    description: 'De ene kolom is van een bepaalde grootte, de andere neemt de rest in. De grootte wordt gegeven door een stap, en het is de eigen grootte van de zone — het wordt niet geërfd door iets wat erin genest is.'
  scrollable:
    title: 'Elke kant scrollt afzonderlijk'
    description: 'Een scrollbare zone houdt de overflow vast, niet de pagina. Scroll één van deze twee en de andere blijft staan waar hij is, wat de hele reden is voor de vorm.'
  vertical:
    title: 'Een koptekst die niet scrollt'
    description: 'Een split die verticaal is: een smalle zone heeft de hoogte van wat hij bevat, het lichaam neemt de rest en scrollt eronder. Dit is de opstelling van een paneel met een werkbalk bovenaan.'
  wrap:
    title: 'Onder een vloer'
    description: 'Gegeven een vloer, neemt de flexibele zone een volle regel in beslag en beweegt de gekleurde kolom erboven in plaats van dat beide worden samengedrukt tot niets. Vernauw het venster om het in te zien vouwen.'
split:
  body: 'Deze kant neemt wat de gekleurde kolom laat liggen.'
scrollable:
  item: Item
  line: Lijn
vertical:
  action: Aanmaken
wrap:
  body: 'Onder de vloer die deze zone heeft, neemt het een eigen regel in.'
