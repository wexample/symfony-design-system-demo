      body: 'Uma página descreve suas ferramentas em seu bloco page_zones_after, e o dock desenha a coluna, suas zonas, suas alças e a barra. Uma ferramenta mostra o que a página desenhou para ela (conteúdo), ou uma página carregada da primeira vez que é aberta (url).'
