de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Werkzeugdock
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Werkzeuge am Ende einer Seite, wie sie ein IDE hat: eine Leiste von Symbolen, die jeweils eine Zone in einer Spalte neben der Seite öffnen. Die Leiste auf der rechten Seite dieser Seite ist eine davon.'
  section:
    groups:
      title: 'Zwei Gruppen, eine jeweils geöffnet'
      body: 'Die Symbole oben in der Leiste öffnen ihre Zone im oberen Teil der Spalte, die unten in ihrem Fuß im unteren Teil, jeweils eine in jedem. Allein nimmt eine Zone die gesamte Spalte ein; wenn nichts geöffnet ist, ist die Spalte weg. Die Spalte kann von ihrer Startkante aus breiter gezogen werden, und was jedes Werkzeug hatte, kommt mit der Seite zurück.'
    horizontal:
      title: 'Liegend oben'
      body: 'Bei horizontaler Ausrichtung liegt die Leiste oben und das Dock ist der Körper einer Seite, geschrieben in einer Seite--füllend: was der Anfang der Leiste öffnet, steht neben dem, was ihr Ende öffnet, darunter. Ein Werkzeug, das randlos gezeichnet ist und die Höhe der Zone einnimmt – ein Editor – sagt das mit Füllung.'
    usage:
      title: Verwendung
      body: 'Eine Seite beschreibt ihre Werkzeuge in ihrem page_zones_after Block, und das Dock zeichnet die Spalte, ihre Zonen, ihre Griffe und die Leiste. Ein Werkzeug zeigt, was die Seite für es gezeichnet hat (Inhalt), oder eine Seite, die beim ersten Öffnen geladen wurde (url).'
  tool:
    source: Quelle
    preview: Vorschau
    outline: Umriss
    search: Suche
    detail: Detail
    history: Verlauf
  content:
    search: 'Noch nichts gesucht.'
    history: 'Keine Änderung aufgezeichnet.'
    preview: 'Die Datei, wie sie einmal gerendert gelesen wird.'
    line: Zeile
  field:
    name: Name
    type: Typ
    size: Größe

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Työkalupaneeli
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Työkalut sivun lopussa, kuten IDE:ssä: ikonipalkki, joka avaa vyöhykkeen sarakkeessa sivun vieressä. Tämän sivun oikealla puolella oleva palkki on yksi niistä.'
  section:
    groups:
      title: 'Kaksi ryhmää, yksi avoinna kummassakin'
      body: 'Palkin yläosassa olevat ikonit avaavat vyöhykkeen sarakkeen yläosassa, alhaalla olevat sen alaosassa, yksi kerrallaan kummassakin. Yksin vyöhyke vie koko sarakkeen; kun mikään ei ole auki, sarake häviää. Saraketta voi vetää leveämmäksi sen alareunasta, ja mitä kukin työkalu oli jäljellä, palaa sivun mukana.'
    horizontal:
      title: 'Aivan ylhäällä'
      body: 'Vaaka-orientaation myötä palkki on ylhäällä ja paneeli on sivun runko, kirjoitettuna sivun täyttöön: palkin alku avaa sen vieressä, mitä sen loppu avaa, sen alla. Työkalu, joka on vedetty reunasta reunaan ja ottaa vyöhykkeen korkeuden — esimerkiksi editori — kertoo sen täytteen avulla.'
    usage:
      title: Käyttö
      body: 'Sivu kuvaa työkalujaan sen page_zones_after-lohkossa, ja paneeli piirtää sarakkeen, sen vyöhykkeet, niiden kahvat ja palkin. Työkalu näyttää mitä sivu piirsi sille (sisältö), tai sivun, joka ladattiin ensimmäisen kerran avattaessa (url).'
  tool:
    source: Lähde
    preview: Esikatselu
    outline: Rakenne
    search: Haku
    detail: Yksityiskohta
    history: Historia
  content:
    search: 'Ei vielä haettu mitään.'
    history: 'Muutoksia ei ole kirjattu.'
    preview: 'Tiedosto sellaisena kuin se näkyy renderöitynä.'
    line: Rivi
  field:
    name: Nimi
    type: Tyyppi
    size: Koko

ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Панель инструментов'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Инструменты в конце страницы, как в IDE: панель значков, каждый из которых открывает зону в колонне рядом со страницей. Панель справа от этой страницы — одна из них.'
  section:
    groups:
      title: 'Две группы, по одной открытой в каждой'
      body: 'Значки в верхней части панели открывают свою зону в верхней части колонны, а те, что внизу — в нижней части, по одной открытой в каждой. Одна зона занимает всю колонну; если ничего не открыто, колонна исчезает. Колонну можно растянуть шире от ее начального края, и то, что осталось от каждого инструмента, вернется с страницей.'
    horizontal:
      title: 'Лежит вдоль верха'
      body: 'При горизонтальной ориентации панель лежит вдоль верха, а док — это тело страницы, написанное в странице — заполнение: то, что открывает начало панели, стоит рядом с тем, что открывает ее конец, под ней. Инструмент, нарисованный от края до края и занимающий высоту зоны — редактор — говорит об этом с помощью заполнения.'
    usage:
      title: Использование
      body: 'Страница описывает свои инструменты в блоке page_zones_after, а док рисует колонну, ее зоны, их ручки и панель. Инструмент показывает то, что страница нарисовала для него (контент), или страницу, загруженную в первый раз при открытии (url).'
  tool:
