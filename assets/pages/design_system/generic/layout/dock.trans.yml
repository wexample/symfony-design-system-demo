nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Hulpmiddelen dock'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Hulpmiddelen langs het einde van een pagina, zoals een IDE die heeft: een balk met pictogrammen, elk opent een zone in een kolom naast de pagina. De balk aan de rechterkant van deze pagina is er één.'
  section:
    groups:
      title: 'Twee groepen, één open in elke'
      body: 'De pictogrammen bovenaan de balk openen hun zone in het bovenste gedeelte van de kolom, die aan de voet in het onderste gedeelte, één tegelijk in elke. Alleen neemt een zone de hele kolom; als er niets open is, is de kolom verdwenen. De kolom wordt breder getrokken vanaf de startrand, en wat elk hulpmiddel was, komt terug met de pagina.'
    horizontal:
      title: 'Liggend langs de bovenkant'
      body: 'Gegeven dat de oriëntatie horizontaal is, ligt de balk langs de bovenkant en is het dock het lichaam van een pagina, geschreven in een pagina--vullen: wat het begin van de balk opent staat naast wat het einde opent, eronder. Een hulpmiddel dat van rand tot rand getekend is en de hoogte van de zone neemt — een editor — zegt dat zo met vullen.'
    usage:
      title: Gebruik
      body: 'Een pagina beschrijft zijn hulpmiddelen in zijn page_zones_after-blok, en het dock tekent de kolom, zijn zones, hun handvatten en de balk. Een hulpmiddel toont wat de pagina voor het heeft getekend (inhoud), of een pagina die voor het eerst wordt geladen wanneer deze opent (url).'
