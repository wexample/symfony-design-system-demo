    outline: Контур
    search: Поиск
    detail: Детали
    history: История
  content:
    search: 'Пока ничего не искали.'
    history: 'Изменения не зафиксированы.'
    preview: 'Файл, как он читается после рендеринга.'
    line: Строка
  field:
