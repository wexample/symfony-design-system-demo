en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Tool dock
  page_icon: ph:bold/sidebar-simple

  intro: "Tools along the end of a page, as an IDE has them: a bar of icons, each opening a zone in a column beside the page. The bar on the right of this page is one."

  section:
    groups:
      title: Two groups, one open in each
      body: "The icons at the top of the bar open their zone in the upper part of the column, those at its foot in the lower part, one open at a time in each. Alone, a zone takes the column whole; with nothing open, the column is gone. The column is dragged wider from its start edge, and what each tool was left at comes back with the page."
    horizontal:
      title: Lying along the top
      body: "Given orientation horizontal, the bar lies along the top and the dock is the body of a page, written in a page--fill: what the start of the bar opens stands beside what its end opens, under it. A tool drawn edge to edge and taking the zone's height — an editor — says so with fill."
    usage:
      title: Usage
      body: "A page describes its tools in its page_zones_after block, and the dock draws the column, its zones, their handles and the bar. A tool shows what the page drew for it (content), or a page loaded the first time it opens (url)."

  tool:
    source: Source
    preview: Preview
    outline: Outline
    search: Search
    detail: Detail
    history: History

  content:
    search: Nothing searched yet.
    history: No change recorded.
    preview: The file as it reads once rendered.
    line: Line

  field:
    name: Name
    type: Type
    size: Size

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: "Dock d'outils"
  page_icon: 'ph:bold/sidebar-simple'
  intro: "Des outils au bord d'une page, comme dans un IDE : une barre d'icônes, chacune ouvrant une zone dans une colonne à côté de la page. La barre à droite de cette page en est une."
  section:
    groups:
      title: 'Deux groupes, une zone ouverte dans chacun'
      body: "Les icônes du haut de la barre ouvrent leur zone dans la partie haute de la colonne, celles du bas dans la partie basse, une seule ouverte à la fois dans chaque groupe. Seule, une zone prend toute la colonne ; quand rien n'est ouvert, la colonne disparaît. La colonne s'élargit en tirant son bord de début, et l'état de chaque outil revient avec la page."
    horizontal:
      title: 'Couché en haut'
      body: "Avec l'orientation horizontal, la barre est posée en haut et le dock devient le corps d'une page, écrit dans un page--fill : ce qu'ouvre le début de la barre se place à côté de ce qu'ouvre sa fin, en dessous. Un outil dessiné bord à bord sur toute la hauteur de la zone — un éditeur — le demande avec fill."
    usage:
      title: Utilisation
      body: 'Une page décrit ses outils dans son bloc page_zones_after, et le dock dessine la colonne, ses zones, leurs poignées et la barre. Un outil affiche ce que la page a dessiné pour lui (content), ou une page chargée à sa première ouverture (url).'
  tool:
    source: Source
    preview: Aperçu
    outline: Plan
    search: Recherche
    detail: Détail
    history: Historique
  content:
    search: "Aucune recherche pour l'instant."
    history: 'Aucune modification enregistrée.'
    preview: "Le fichier tel qu'il se lit une fois rendu."
    line: Ligne
  field:
    name: Nom
    type: Type
    size: Taille

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 工具停靠
  page_icon: 'ph:bold/sidebar-simple'
  intro: 页面末尾的工具，类似于IDE：一排图标，每个图标打开页面旁边列中的一个区域。当前页面右侧的工具条就是一个例子。
  section:
    groups:
      title: 两个组，每个组一个打开
      body: 工具条顶部的图标打开列的上部区域，底部的图标打开下部区域，每次只能打开一个。单独一个区域占据整个列；没有打开任何区域，列就消失。可以从起始边缘拖动列变宽，工具的状态会随着页面返回。
    horizontal:
      title: 位于顶部
      body: 在横向布局下，工具条位于顶部，停靠是页面的主体，填充在页面中——工具条开始处打开的区域位于结束处打开的区域旁边，下面。一个工具从边到边并占据区域的高度——一个编辑器——这样显示了填充。
    usage:
      title: 使用方式
      body: 页面在其page_zones_after块中描述其工具，停靠绘制列、区域、手柄和工具条。工具显示页面为其绘制的内容，或页面在第一次打开时加载的内容（url）。
  tool:
    source: 源
    preview: 预览
    outline: 大纲
    search: 搜索
    detail: 详情
    history: 历史
  content:
    search: 尚未搜索任何内容。
    history: 没有记录任何更改。
    preview: 文件在渲染后读取的样子。
    line: 行
  field:
    name: 名称
    type: 类型
    size: 大小

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'شريط الأدوات'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'أدوات على نهاية الصفحة، كما تفعل IDE: شريط أيقونات، كل منها يفتح منطقة في عمود بجانب الصفحة. الشريط على اليمين من هذه الصفحة هو واحد منها.'
  section:
    groups:
      title: 'مجموعتان، واحدة مفتوحة في كل منهما'
      body: 'تفتح الأيقونات في أعلى الشريط منطقتها في الجزء العلوي من العمود، وتلك في أسفل الشريط في الجزء السفلي، واحدة مفتوحة في كل مرة. بمفردها، تأخذ المنطقة العمود بالكامل؛ وعندما لا يوجد شيء مفتوح، يختفي العمود. يمكن سحب العمود ليصبح أوسع من حافته الأمامية، وما تركه كل أداة يعود مع الصفحة.'
    horizontal:
      title: 'ممتد على القمة'
      body: 'مع الاتجاه الأفقي، يمتد الشريط على القمة ويكون الرصيف هو جسم الصفحة، مكتوب في صفحة--ملء: ما يفتحه بداية الشريط يقف بجانب ما يفتحه نهايته، تحته. أداة تمتد من طرف إلى طرف وتأخذ ارتفاع المنطقة - محرر - تقول ذلك مع الملء.'
    usage:
      title: الاستخدام
      body: 'تصف الصفحة أدواتها في كتلة page_zones_after، ويقوم الرصيف برسم العمود، مناطقه، مقابضها والشريط. تظهر الأداة ما رسمته الصفحة لها (المحتوى)، أو صفحة تم تحميلها في المرة الأولى التي تفتح فيها (url).'
  tool:
    source: المصدر
    preview: معاينة
    outline: مخطط
    search: بحث
    detail: تفاصيل
    history: تاريخ
  content:
    search: 'لم يتم البحث عن شيء بعد.'
    history: 'لا تغيير مسجل.'
    preview: 'الملف كما يُقرأ بمجرد أن يتم عرضه.'
    line: السطر
  field:
    name: الاسم
    type: النوع
    size: الحجم

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'टूल डॉक'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'एक पृष्ठ के अंत में उपकरण, जैसे एक IDE में होते हैं: आइकनों की एक पट्टी, प्रत्येक एक कॉलम में एक क्षेत्र खोलती है जो पृष्ठ के बगल में है। इस पृष्ठ के दाएं ओर की पट्टी एक है।'
  section:
    groups:
      title: 'दो समूह, प्रत्येक में एक खुला'
      body: 'पट्टी के शीर्ष पर आइकन अपने क्षेत्र को कॉलम के ऊपरी भाग में खोलते हैं, नीचे की ओर वाले अपने क्षेत्र को निचले भाग में खोलते हैं, प्रत्येक में एक बार में एक खुलता है। अकेले, एक क्षेत्र पूरे कॉलम को ले लेता है; कुछ भी न खुलने पर, कॉलम गायब हो जाता है। कॉलम को इसके प्रारंभिक किनारे से चौड़ा किया जाता है, और जो भी उपकरण छोड़ा गया था, वह पृष्ठ के साथ वापस आ जाता है।'
    horizontal:
      title: 'ऊपर की ओर फैला हुआ'
      body: 'क्षितिज का उन्मुखीकरण दिया गया, पट्टी ऊपर की ओर फैली हुई है और डॉक एक पृष्ठ का शरीर है, एक पृष्ठ में लिखा गया--भरना: पट्टी का प्रारंभ जो खोलता है, वह उसके अंत के द्वारा खोले गए की बगल में है, इसके नीचे। एक उपकरण जो किनारे से किनारे खींचा गया है और क्षेत्र की ऊँचाई लेता है - एक संपादक - ऐसा ही भरने के साथ कहता है।'
    usage:
      title: उपयोग
      body: 'एक पृष्ठ अपने उपकरणों का वर्णन अपने page_zones_after ब्लॉक में करता है, और डॉक कॉलम, इसके क्षेत्रों, उनके हैंडल और पट्टी को खींचता है। एक उपकरण दिखाता है कि पृष्ठ ने इसके लिए क्या बनाया (सामग्री), या एक पृष्ठ जो पहली बार खुलने पर लोड हुआ (url)।'
  tool:
    source: स्रोत
    preview: पूर्वावलोकन
    outline: आउटलाइन
    search: खोजें
    detail: विवरण
    history: इतिहास
  content:
    search: 'अभी तक कुछ नहीं खोजा गया।'
    history: 'कोई परिवर्तन रिकॉर्ड नहीं किया गया।'
    preview: 'फाइल जैसा कि एक बार प्रस्तुत होने पर पढ़ता है।'
    line: लाइन
  field:
    name: नाम
    type: प्रकार
    size: आकार

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'דוק הכלים'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'כלים לאורך קצה של עמוד, כפי שיש ל-IDE: שורת סמלים, כל אחד פותח אזור בעמודה לצד העמוד. השורה בצד ימין של עמוד זה היא אחת כזו.'
  section:
    groups:
      title: 'שתי קבוצות, אחת פתוחה בכל אחת'
      body: 'הסמלים בחלק העליון של השורה פותחים את האזור שלהם בחלק העליון של העמודה, ואלה שבסוף פותחים בחלק התחתון, אחד פתוח בכל פעם. לבד, אזור תופס את כל העמודה; כשאין כלום פתוח, העמודה נעלמת. העמודה נגררת רחבה מקצה ההתחלה שלה, ומה שכל כלי הושאר עליו חוזר עם העמוד.'
    horizontal:
      title: 'שוכב לאורך החלק העליון'
      body: 'בהתאם לכיוון אופקי, השורה שוכבת לאורך החלק העליון ודוק הכלים הוא גוף העמוד, נכתב בעמוד--מילוי: מה שהתחלת השורה פותחת עומד לצד מה שסופה פותחת, מתחתיו. כלי שנמשך מקצה לקצה ותופס את גובה האזור — עורך — אומר זאת עם מילוי.'
    usage:
      title: שימוש
      body: 'עמוד מתאר את הכלים שלו בחסימת page_zones_after שלו, ודוק הכלים מצייר את העמודה, את האזורים שלה, את הידיות ואת השורה. כלי מציג מה שהעמוד צייר עבורו (תוכן), או עמוד שטען בפעם הראשונה שהוא נפתח (url).'
  tool:
    source: מקור
    preview: 'תצוגה מקדימה'
    outline: מתאר
    search: חיפוש
    detail: פרט
    history: היסטוריה
  content:
    search: 'עדיין לא בוצע חיפוש.'
    history: 'לא נרשם שינוי.'
    preview: 'הקובץ כפי שהוא נקרא לאחר רינדור.'
    line: שורה
  field:
    name: שם
    type: סוג
    size: גודל

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'پانل ابزار'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'ابزارها در انتهای یک صفحه، همانطور که یک IDE دارد: نوار نمادها، هرکدام یک ناحیه را در ستونی در کنار صفحه باز می‌کند. نوار در سمت راست این صفحه یکی از آن‌هاست.'
  section:
    groups:
      title: 'دو گروه، یکی در هر کدام باز'
      body: 'نمادهای بالای نوار ناحیه خود را در قسمت بالای ستون باز می‌کنند، آن‌هایی که در پایین هستند در قسمت پایین، به‌طور همزمان یکی در هر کدام باز می‌شود. به‌تنهایی، یک ناحیه کل ستون را می‌گیرد؛ با هیچ چیزی باز، ستون ناپدید می‌شود. ستون از لبه شروع خود عریض‌تر کشیده می‌شود، و آنچه هر ابزاری بر روی آن تنظیم شده با صفحه برمی‌گردد.'
    horizontal:
      title: 'در امتداد بالای صفحه'
      body: 'با تنظیم افقی، نوار در بالای صفحه قرار می‌گیرد و داک بدنه یک صفحه است، نوشته شده در صفحه--پر: آنچه شروع نوار باز می‌کند در کنار آنچه انتهای آن باز می‌کند، زیر آن قرار دارد. ابزاری که از لبه‌ای به لبه دیگر کشیده شده و ارتفاع ناحیه را می‌گیرد — یک ویرایشگر — این را با پر نشان می‌دهد.'
    usage:
      title: استفاده
      body: 'یک صفحه ابزارهای خود را در بلاک page_zones_after توصیف می‌کند و داک ستون، نواحی، دستگیره‌های آن‌ها و نوار را ترسیم می‌کند. یک ابزار آنچه صفحه برای آن ترسیم کرده است (محتوا) یا یک صفحه که برای اولین بار هنگام باز شدن بارگذاری شده است (url) را نمایش می‌دهد.'
  tool:
    source: منبع
    preview: پیش‌نمایش
    outline: 'طرح کلی'
    search: جستجو
    detail: جزئیات
    history: تاریخچه
  content:
    search: 'هنوز چیزی جستجو نشده است.'
    history: 'تغییری ثبت نشده است.'
    preview: 'فایل به‌صورت آنچه پس از رندر خوانده می‌شود.'
    line: خط
  field:
    name: نام
    type: نوع
    size: اندازه

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'ٹول ڈاک'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'صفحه کے آخر میں ٹولز، جیسے کہ IDE میں ہوتے ہیں: آئیکونز کی ایک بار، ہر ایک صفحے کے ساتھ ایک کالم میں ایک زون کھولتا ہے۔ اس صفحے کے دائیں جانب بار ایک ہے۔'
  section:
    groups:
      title: 'دو گروپ، ہر ایک میں ایک کھلا'
      body: 'بار کے اوپر کے آئیکونز اپنے زون کو کالم کے اوپر کے حصے میں کھولتے ہیں، اس کے نیچے کے حصے میں نیچے کے آئیکونز، ہر ایک وقت میں ایک کھلا۔ اکیلا، ایک زون پورے کالم کو لیتا ہے؛ کچھ بھی کھلا نہ ہونے پر، کالم غائب ہوتا ہے۔ کالم کو اس کے شروع کے کنارے سے چوڑا کیا جاتا ہے، اور جو بھی ٹول چھوڑا گیا تھا وہ صفحے کے ساتھ واپس آتا ہے۔'
    horizontal:
      title: 'اوپر کی طرف لیٹا ہوا'
      body: 'جب افقی سمت دی جائے تو بار اوپر کی طرف لیٹی ہوتی ہے اور ڈاک ایک صفحے کا جسم ہوتا ہے، جس میں صفحے کی بھرائی ہوتی ہے: بار کے شروع کا کھلا ہوا اس کے آخر کے کھولے کے ساتھ ساتھ ہوتا ہے، اس کے نیچے۔ ایک ٹول جو کنارے سے کنارے کھینچا گیا ہے اور زون کی اونچائی لیتا ہے — ایک ایڈیٹر — اس بات کا اشارہ دیتا ہے کہ بھرائی کی گئی ہے۔'
    usage:
      title: استعمال
      body: 'ایک صفحہ اپنے ٹولز کو اپنے page_zones_after بلاک میں بیان کرتا ہے، اور ڈاک کالم، اس کے زونز، ان کے ہینڈلز اور بار کو کھینچتا ہے۔ ایک ٹول وہ دکھاتا ہے جو صفحے نے اس کے لیے بنایا (مواد)، یا ایک صفحہ جو پہلی بار کھولتے وقت لوڈ ہوا (یو آر ایل)۔'
  tool:
    source: ذرائع
    preview: 'پیش نظارہ'
    outline: خاکہ
    search: تلاش
    detail: تفصیل
    history: تاریخ
  content:
    search: 'ابھی تک کچھ نہیں تلاش کیا گیا۔'
    history: 'کوئی تبدیلی ریکارڈ نہیں کی گئی۔'
    preview: 'فائل جیسے یہ پڑھتا ہے جب یہ رینڈر ہو جائے۔'
    line: لائن
  field:
    name: نام
    type: قسم
    size: سائز

ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ツールドック
  page_icon: 'ph:bold/sidebar-simple'
  intro: IDEのようにページの端にあるツール：アイコンのバーがあり、それぞれがページの横にある列のゾーンを開きます。このページの右側にあるバーがそれです。
  section:
    groups:
      title: 二つのグループ、各々に一つ開いている
      body: バーの上部にあるアイコンは列の上部にあるゾーンを開き、下部にあるアイコンは下部のゾーンを開きます。各々一つずつ開くことができます。ゾーンが単独の場合、列全体を占めます。何も開いていないと列は消えます。列は開始エッジから広げられ、各ツールの設定がページと共に戻ります。
    horizontal:
      title: 上部に横たわる
