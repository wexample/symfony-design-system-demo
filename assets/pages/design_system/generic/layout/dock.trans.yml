      body: "Data l'orientazione orizzontale, la barra si distende lungo la parte superiore e il dock è il corpo di una pagina, scritta in una pagina--riempi: ciò che l'inizio della barra apre sta accanto a ciò che la sua fine apre, sotto di essa. Uno strumento disegnato da bordo a bordo e che prende l'altezza della zona — un editor — lo indica con il riempimento."
    usage:
