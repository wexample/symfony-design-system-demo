    type: Тип
    size: Размер

pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Dock narzędzi'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Narzędzia wzdłuż końca strony, tak jak ma to IDE: pasek ikon, z których każda otwiera strefę w kolumnie obok strony. Pasek po prawej stronie tej strony jest jednym z nich.'
  section:
    groups:
      title: 'Dwie grupy, jedna otwarta w każdej'
      body: 'Ikony na górze paska otwierają swoją strefę w górnej części kolumny, te na jego końcu w dolnej części, jedna otwarta na raz w każdej. Sama strefa zajmuje całą kolumnę; przy braku otwartych stref, kolumna znika. Kolumna jest przeciągana szerzej od swojego początkowego krawędzi, a to, co każde narzędzie miało, powraca z stroną.'
    horizontal:
      title: 'Leżący wzdłuż góry'
      body: 'Przy poziomej orientacji, pasek leży wzdłuż góry, a dock jest ciałem strony, zapisanym w stronie--wypełnieniu: to, co otwiera początek paska, stoi obok tego, co otwiera jego koniec, pod nim. Narzędzie narysowane od krawędzi do krawędzi i zajmujące wysokość strefy — edytor — mówi to za pomocą wypełnienia.'
    usage:
      title: Użycie
      body: 'Strona opisuje swoje narzędzia w bloku page_zones_after, a dock rysuje kolumnę, jej strefy, ich uchwyty i pasek. Narzędzie pokazuje to, co strona narysowała dla niego (zawartość), lub stronę załadowaną po raz pierwszy, gdy się otwiera (url).'
  tool:
    source: Źródło
    preview: Podgląd
    outline: Zarys
    search: Szukaj
    detail: Szczegóły
    history: Historia
  content:
    search: 'Nic jeszcze nie wyszukano.'
    history: 'Brak zapisanej zmiany.'
    preview: 'Plik tak, jak się odczytuje po renderowaniu.'
    line: Linia
  field:
    name: Nazwa
    type: Typ
    size: Rozmiar

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Dock de herramientas'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Herramientas a lo largo del final de una página, como las que tiene un IDE: una barra de íconos, cada uno abriendo una zona en una columna al lado de la página. La barra a la derecha de esta página es una.'
  section:
    groups:
      title: 'Dos grupos, uno abierto en cada uno'
      body: 'Los íconos en la parte superior de la barra abren su zona en la parte superior de la columna, aquellos en su pie en la parte inferior, uno abierto a la vez en cada uno. Solo, una zona ocupa toda la columna; con nada abierto, la columna desaparece. La columna se arrastra más ancha desde su borde inicial, y lo que cada herramienta tenía se recupera con la página.'
    horizontal:
      title: 'Acostado en la parte superior'
      body: 'Con orientación horizontal, la barra se encuentra a lo largo de la parte superior y el dock es el cuerpo de una página, escrito en una página--relleno: lo que el inicio de la barra abre se encuentra al lado de lo que su final abre, debajo de ella. Una herramienta dibujada de borde a borde y ocupando la altura de la zona — un editor — lo indica con relleno.'
