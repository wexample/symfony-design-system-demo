pt_BR:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Dock de ferramentas'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Ferramentas ao longo do final de uma página, como um IDE as tem: uma barra de ícones, cada uma abrindo uma zona em uma coluna ao lado da página. A barra à direita desta página é uma delas.'
  section:
    groups:
      title: 'Dois grupos, um aberto em cada'
      body: 'Os ícones na parte superior da barra abrem sua zona na parte superior da coluna, aqueles na parte inferior na parte inferior, um aberto por vez em cada. Sozinha, uma zona ocupa toda a coluna; com nada aberto, a coluna desaparece. A coluna é arrastada para ficar mais larga a partir de sua borda inicial, e o que cada ferramenta estava configurada volta com a página.'
    horizontal:
      title: 'Deitado ao longo do topo'
      body: 'Com a orientação horizontal, a barra fica ao longo do topo e o dock é o corpo de uma página, escrito em uma página--preencher: o que o início da barra abre fica ao lado do que seu fim abre, abaixo dele. Uma ferramenta desenhada de borda a borda e ocupando a altura da zona — um editor — diz isso com preenchimento.'
    usage:
