th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: เครื่องมือด็อค
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'เครื่องมือที่อยู่ตามขอบของหน้าเหมือนที่ IDE มี: แถบไอคอนที่เปิดโซนในคอลัมน์ข้างๆ หน้า แถบที่อยู่ทางขวาของหน้านี้คือหนึ่งในนั้น'
  section:
    groups:
      title: 'สองกลุ่ม หนึ่งเปิดในแต่ละกลุ่ม'
      body: 'ไอคอนที่อยู่ด้านบนของแถบจะเปิดโซนของมันในส่วนบนของคอลัมน์ ส่วนที่อยู่ด้านล่างจะเปิดในส่วนล่าง เปิดได้ทีละหนึ่งเท่านั้น โซนที่เปิดอยู่จะใช้คอลัมน์ทั้งหมด หากไม่มีอะไรเปิด คอลัมน์จะหายไป คอลัมน์สามารถลากให้กว้างขึ้นจากขอบเริ่มต้น และสิ่งที่แต่ละเครื่องมือถูกตั้งไว้จะกลับมาเมื่อหน้าโหลดใหม่'
    horizontal:
      title: อยู่ตามด้านบน
      body: 'เมื่อมีการจัดแนวเป็นแนวนอน แถบจะอยู่ตามด้านบนและด็อคคือเนื้อหาของหน้า เขียนในหน้า--เติม: สิ่งที่จุดเริ่มต้นของแถบเปิดจะอยู่ข้างๆ สิ่งที่จุดสิ้นสุดเปิดอยู่ใต้แถบ เครื่องมือที่ลากจากขอบจนถึงขอบและใช้ความสูงของโซน — เช่น โปรแกรมแก้ไข — จะบอกเช่นนั้นด้วยการเติม'
    usage:
      title: การใช้งาน
      body: 'หน้าอธิบายเครื่องมือของมันในบล็อก page_zones_after และด็อคจะวาดคอลัมน์ โซนของมัน ที่จับและแถบ เครื่องมือจะแสดงสิ่งที่หน้าวาดให้มัน (เนื้อหา) หรือหน้าโหลดครั้งแรกเมื่อเปิด (url)'
