vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Bảng công cụ'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Các công cụ nằm ở cuối trang, giống như trong IDE: một thanh biểu tượng, mỗi biểu tượng mở một khu vực trong cột bên cạnh trang. Thanh ở bên phải của trang này là một ví dụ.'
  section:
    groups:
      title: 'Hai nhóm, mỗi nhóm mở một'
      body: 'Các biểu tượng ở đầu thanh mở khu vực của chúng ở phần trên của cột, các biểu tượng ở dưới cùng mở ở phần dưới, mỗi lần chỉ mở một. Một khu vực đơn lẻ chiếm toàn bộ cột; khi không có gì được mở, cột sẽ biến mất. Cột có thể được kéo rộng từ cạnh bắt đầu của nó, và những gì mỗi công cụ để lại sẽ trở lại cùng với trang.'
    horizontal:
      title: 'Nằm ngang ở trên cùng'
      body: 'Khi có hướng ngang, thanh nằm ngang ở trên cùng và bảng công cụ là phần thân của trang, được viết trong một trang--điền: những gì đầu của thanh mở nằm bên cạnh những gì cuối của nó mở, bên dưới nó. Một công cụ kéo dài từ cạnh này đến cạnh kia và chiếm chiều cao của khu vực — một trình chỉnh sửa — nói như vậy với phần điền.'
    usage:
      title: 'Cách sử dụng'
      body: 'Một trang mô tả các công cụ của nó trong khối page_zones_after, và bảng công cụ vẽ cột, các khu vực của nó, các tay cầm của chúng và thanh. Một công cụ hiển thị những gì trang đã vẽ cho nó (nội dung), hoặc một trang được tải lần đầu tiên khi mở (url).'
