    type: 유형
    size: 크기

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'টুল ডক'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'একটি পৃষ্ঠার শেষে টুলস, যেমন একটি IDE-তে থাকে: আইকনের একটি বার, প্রতিটি একটি কলামে পৃষ্ঠার পাশে একটি অঞ্চল খুলে। এই পৃষ্ঠার ডানদিকে বারটি একটি।'
  section:
    groups:
      title: 'দুটি গ্রুপ, একটি করে উন্মুক্ত'
      body: 'বারের উপরের আইকনগুলি তাদের অঞ্চলকে কলামের উপরের অংশে খুলে, এর পাদদেশে থাকা আইকনগুলি নীচের অংশে, একটি করে একবারে খোলা হয়। একা, একটি অঞ্চল পুরো কলাম দখল করে; কিছু খোলা না থাকলে, কলামটি চলে যায়। কলামটি এর শুরু প্রান্ত থেকে চওড়া করা হয়, এবং প্রতিটি টুল যেখানে ছিল তা পৃষ্ঠার সাথে ফিরে আসে।'
    horizontal:
      title: 'শীর্ষের বরাবর'
      body: 'যেহেতু দিক horizontal, বারটি শীর্ষ বরাবর থাকে এবং ডকটি একটি পৃষ্ঠার শরীর, একটি পৃষ্ঠায় লেখা--ফিল: বারটির শুরু যা খুলে তা তার শেষ যা খুলে তার পাশে থাকে, এর নিচে। একটি টুল যা প্রান্ত থেকে প্রান্তে এবং অঞ্চলের উচ্চতা গ্রহণ করে — একটি সম্পাদক — এটি ফিলের মাধ্যমে বলে।'
    usage:
      title: ব্যবহার
      body: 'একটি পৃষ্ঠা তার টুলগুলি তার page_zones_after ব্লকে বর্ণনা করে, এবং ডক কলামটি, তার অঞ্চলগুলি, তাদের হ্যান্ডেলগুলি এবং বারটি আঁকে। একটি টুল দেখায় যে পৃষ্ঠা তার জন্য যা অঙ্কন করেছে (বিষয়বস্তু), অথবা একটি পৃষ্ঠা প্রথমবার যখন এটি খোলা হয় (url)।'
  tool:
    source: সূত্র
    preview: পূর্বদর্শন
    outline: রূপরেখা
    search: অনুসন্ধান
    detail: বিস্তারিত
    history: ইতিহাস
  content:
    search: 'এখনও কিছু অনুসন্ধান করা হয়নি।'
    history: 'কোন পরিবর্তন রেকর্ড করা হয়নি।'
    preview: 'ফাইলটি যখন রেন্ডার করা হয় তখন এটি কেমন দেখায়।'
    line: লাইন
