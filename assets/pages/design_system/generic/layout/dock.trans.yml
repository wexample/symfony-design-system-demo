      body: 'Una pagina descrive i suoi strumenti nel suo blocco page_zones_after, e il dock disegna la colonna, le sue zone, le loro maniglie e la barra. Uno strumento mostra ciò che la pagina ha disegnato per esso (contenuto), o una pagina caricata la prima volta che si apre (url).'
