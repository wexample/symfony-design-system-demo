    search: 검색
    detail: 세부정보
    history: 기록
  content:
    search: '아직 검색된 내용이 없습니다.'
    history: '변경 사항이 기록되지 않았습니다.'
    preview: '렌더링된 후 읽히는 파일입니다.'
    line: 라인
  field:
