tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Araç rıhtımı'
  page_icon: 'ph:bold/sidebar-simple'
  intro: "Bir sayfanın sonunda bulunan araçlar, bir IDE'de olduğu gibi: her biri sayfanın yanındaki bir sütunda bir alan açan simgelerden oluşan bir çubuk. Bu sayfanın sağındaki çubuk böyle bir çubuktur."
  section:
    groups:
      title: 'İki grup, her birinde biri açık'
      body: 'Çubuğun üst kısmındaki simgeler, sütunun üst kısmındaki alanlarını açar, alt kısmındaki simgeler ise alt kısımda açar, her seferinde bir tane açık olur. Tek başına bir alan sütunu tamamen kaplar; hiçbir şey açık değilse, sütun kaybolur. Sütun, başlangıç kenarından daha geniş hale getirilir ve her aracın bırakıldığı yer sayfa ile geri gelir.'
    horizontal:
      title: 'Üst kısımda yatay'
      body: 'Yatay bir yönlendirme verildiğinde, çubuk üst kısımda yer alır ve rıhtım, bir sayfanın gövdesidir, bir sayfa içinde yazılmıştır: çubuğun başlangıcı, sonunun açtığı şeyin yanında durur, onun altında. Kenar kenara çekilmiş ve alanın yüksekliğini alan bir araç — bir editör — dolgu ile bunu belirtir.'
    usage:
      title: Kullanım
      body: 'Bir sayfa, araçlarını page_zones_after bloğunda tanımlar ve rıhtım, sütunu, alanlarını, tutacaklarını ve çubuğu çizer. Bir araç, sayfanın kendisi için çizdiğini (içerik) veya ilk kez açıldığında yüklenen bir sayfayı (url) gösterir.'
  tool:
