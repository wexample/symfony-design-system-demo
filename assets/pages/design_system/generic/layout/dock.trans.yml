it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Dock degli strumenti'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Strumenti lungo la fine di una pagina, come in un IDE: una barra di icone, ciascuna apre una zona in una colonna accanto alla pagina. La barra a destra di questa pagina è una di esse.'
  section:
    groups:
      title: 'Due gruppi, uno aperto in ciascuno'
      body: "Le icone in cima alla barra aprono la loro zona nella parte superiore della colonna, quelle in fondo nella parte inferiore, una aperta alla volta in ciascuna. Da sole, una zona occupa l'intera colonna; con nulla aperto, la colonna scompare. La colonna può essere allargata dal suo bordo iniziale, e ciò che ogni strumento aveva impostato torna con la pagina."
    horizontal:
