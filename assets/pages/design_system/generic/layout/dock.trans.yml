id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Dock Alat'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Alat-alat di sepanjang akhir halaman, seperti yang dimiliki IDE: sebuah bilah ikon, masing-masing membuka zona di kolom di samping halaman. Bilah di sebelah kanan halaman ini adalah salah satunya.'
  section:
    groups:
      title: 'Dua grup, satu terbuka di masing-masing'
      body: 'Ikon di bagian atas bilah membuka zona mereka di bagian atas kolom, yang di bagian bawah membuka di bagian bawah, satu terbuka pada satu waktu di masing-masing. Sendirian, sebuah zona mengambil seluruh kolom; dengan tidak ada yang terbuka, kolom menghilang. Kolom dapat diseret lebih lebar dari tepi awalnya, dan apa yang ditinggalkan masing-masing alat akan kembali dengan halaman.'
    horizontal:
      title: 'Berbaring di sepanjang atas'
      body: 'Dengan orientasi horizontal, bilah berbaring di sepanjang atas dan dock adalah bagian dari halaman, ditulis dalam halaman--isi: apa yang dibuka oleh awal bilah berdampingan dengan apa yang dibuka oleh akhirnya, di bawahnya. Sebuah alat yang ditarik dari tepi ke tepi dan mengambil tinggi zona — sebuah editor — mengatakan demikian dengan isi.'
    usage:
      title: Penggunaan
      body: 'Sebuah halaman menjelaskan alat-alatnya di blok page_zones_after, dan dock menggambar kolom, zona-zonanya, pegangan mereka dan bilah. Sebuah alat menunjukkan apa yang digambar halaman untuknya (konten), atau sebuah halaman yang dimuat pertama kali saat dibuka (url).'
