~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Pestañas
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'Pestañas en vue'
    description: 'La barra de pestañas es una fila de enlaces y la dirección indica cuál está abierta. La barra vue solo informa que se solicitó una pestaña, así que algo alrededor tiene la respuesta — aquí, un componente de demostración.'
  breadcrumb:
    vue_description: 'El gemelo vue toma sus elementos ya resueltos: el servidor mantiene la tabla de rutas, así que responde a eso, y lo que cruza es la respuesta.'
    title: Breadcrumb
    description: 'Muestra la ubicación del usuario dentro de la jerarquía. Usa la parte parcial de breadcrumb — pasa elementos con ruta y etiqueta; el último elemento siempre se renderiza como actual.'
  tabs:
    title: Pestañas
  default:
    normal:
      title: 'Pestañas básicas'
    full:
      title: 'Pestañas básicas (ancho completo)'
    half:
      title: 'Pestañas básicas (zona de medio ancho)'
  counts:
    title: 'Pestañas con un conteo'
    description: 'Cuántos de lo que sea que contenga la pestaña, al final de la etiqueta. Es una pastilla y nada más — pasa `count` junto a la etiqueta y la pestaña lo coloca. Un elemento sin la clave no muestra nada, que es como una pestaña sin nada que contar permanece en silencio.'
  icons:
    normal:
      title: 'Pestañas con íconos'
    full:
      title: 'Pestañas con íconos (ancho completo)'
    half:
      title: 'Pestañas con íconos (zona de medio ancho)'
breadcrumb:
  example:
    vue: 'En vue'
    two_levels: 'Dos niveles'
    three_levels: 'Tres niveles'
  item:
    home: Inicio
    layout: Diseño
    section: Bloques
    current: Navegación
tab:
  one: Resumen
  two: Actividad
  three: Configuraciones
vue:
  panel:
    one: 'El primer panel. No se obtuvo nada y no se cambió la dirección — la barra emitió, el titular cambió.'
    two: 'El segundo panel.'
    three: 'El tercer panel.'
