~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: জোনস
page_icon: 'ph:bold/columns'
intro: 'প্রতিটি অনুসন্ধানকারী, সম্পাদক এবং বিস্তারিত দৃশ্যের জন্য নির্মিত দুটি প্যানের কাজের স্থান। একটি জোনের নিজস্ব প্রস্থ এবং উচ্চতা নেই: এটি যে বিভাজনে বসে থাকে সেটিই এটি আকার দেয়, এবং প্রতিটি দিক স্বাধীনভাবে স্ক্রল হয়। দুটি জোন হল পৃষ্ঠায় রাখা দুটি অবজেক্ট, একটি প্যানেল অর্ধেক কাটা নয় — তাদের আলাদা করে যা, তা হল তাদের মধ্যে স্থান, এবং `zone--panel` হল প্রত্যেকটির ভিত্তি।'
section:
  split:
    title: 'একটি বিভাজন'
    description: 'একটি কলাম আকারে, অন্যটি বাকি যা নেয়। আকার একটি ধাপে দেওয়া হয়, এবং এটি জোনের নিজস্ব — এটি এর মধ্যে কিছু নেস্টেড দ্বারা উত্তরাধিকার সূত্রে পাওয়া যায় না।'
  scrollable:
    title: 'প্রতিটি দিক স্বাধীনভাবে স্ক্রল হয়'
    description: 'একটি স্ক্রলযোগ্য জোন হল যা ওভারফ্লো ধারণ করে, পৃষ্ঠা নয়। এই দুইটিতে একটি স্ক্রল করুন এবং অন্যটি যেখানে আছে সেখানে থাকে, যা আকৃতির পুরো কারণ।'
  vertical:
    title: 'একটি হেডার যা স্ক্রল হয় না'
    description: 'একটি বিভাজন উল্লম্বে: একটি সংকীর্ণ জোন যা এটি ধারণ করে তার উচ্চতা, দেহ বাকি অংশ নেয় এবং এর নিচে স্ক্রল করে। এটি একটি টুলবারের উপরে একটি প্যানেলের ব্যবস্থা।'
  wrap:
    title: 'একটি মেঝের নিচে'
    description: 'একটি মেঝে দেওয়া হলে, নমনীয় জোন একটি পূর্ণ লাইন দাবি করে এবং আকার দেওয়া কলামটি এর উপরে চলে যায় পরিবর্তে উভয়কে কিছু না করে চাপা দেওয়া। জানালাটি সংকীর্ণ করুন এটি ভাঁজ দেখতে।'
split:
  body: 'এটি সেই দিক যা আকার দেওয়া কলামটি ছেড়ে দেয়।'
scrollable:
  item: আইটেম
  line: লাইন
vertical:
  action: 'তৈরি করুন'
wrap:
  body: 'মেঝের নিচে এই জোনটি দেওয়া হয়েছে, এটি একটি নিজের লাইন নেয়।'
