~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Çalışma Alanı'
page_icon: 'ph:bold/sidebar-simple'
intro: 'Bu sayfa örnektir: okuduğunuz içerik, sayfanın ortasında yan yana yer alan üç bölgeden birindedir.'
section:
  gap:
    title: 'Boşluk ayırıcıdır'
    description: 'İki bölge arasında hiçbir şey çizilmez. Onları ayıran, aralarındaki boşluktur; sayfa bu boşluğun üzerinden gösterir - menünün ve başlığın durduğu aynı zemin. Her bölge kendi zeminine sahiptir, bu da her zaman bir gövdenin sahip olduğu zemindir.'
  each:
    title: 'Her biri kendi başına'
    description: 'İki sütun kendilerine verilen genişliği korur ve ortadaki kalan alanı alır. Üçünden birini kaydırdığınızda, diğer ikisi yerinde kalır: bir bölge kendi taşmasını tutar, sayfa hiçbirini tutmaz.'
    more: 'Bir bölge komşularından habersizdir. Soldaki gezgin, kendi içinde bir bölümdür - kalan bir çubuk, altında kaydırılan bir ağaç - ve sayfanın başka bir yerinde aynı şekle sahip olur.'
  size:
    title: 'Birini boyutlandırma'
    description: 'Soldaki bölge bir `zone-resizer` taşır: yanında boşluğu dolduran bir tutamak, hiçbir şey çizmez - imleç hareket ettiğini söyler. Sürükleyin, veya ona odaklanıp ok tuşlarını kullanın; çift tıklama, bölgeye sayfanın verdiği genişliği geri kazandırır.'
    more: 'Bir tutamak, bir boyutu olan bir bölgeyi boyutlandırır - genişlik verilen, kalan alanı almayan - ve yanındaki esnek olan farkı emmektedir. Genişlik, bölgenin adı altında hatırlanır, bu yüzden sayfa ile birlikte geri döner, burada üç düzenin hepsinde çünkü aynı bölge hareket etmektedir.'
editor:
  state: Kaydedildi
inspector:
  title: Ayrıntılar
  field:
    path:
      key: Yol
    size:
      key: Boyut
    changed:
      key: Değiştirildi
      value: '3 dakika önce'
