~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ダッシュボード
page_icon: 'ph:bold/squares-four'
mode:
  reopen: APIパネルを再オープン
  gap: 隙間あり
  flush: フラッシュ
state:
  success: 正常
  warning: 劣化
  error: 失敗
  running: 排出中
tile:
  traffic:
    title: トラフィック
    figure: '12.4k req/min'
    description: スプリット内のスプリット：壁は行の垂直スプリットで、それぞれの行は独自のスプリットです。この行の下の端をドラッグして高さを増やすか、このタイルの隣の端をドラッグして幅を広げてください。
  latency:
    title: 'レイテンシ p95'
    figure: '184 ms'
    description: '各タイルはフロアに名前を付けます、`zone--min-*`：その下ではタイルは圧縮されず、フレームが代わりにスクロールします — 横にも縦にも。'
  errors:
    title: エラー
    figure: '2.1 %'
    description: サイズ変更されたゾーンは、スプリットの軸に沿って残されたサイズを保持し、元に戻ります；ハンドルをダブルクリックすると、元のスプリットに戻ります。
  queue:
    title: キュー
    figure: '318 ジョブ'
    description: '`zone--split--flush`は隙間を1ピクセルに狭め、壁の基盤がタイル間の境界線を引きます。壁には1つのクラスで十分で、行はそれを継承します。'
  deploys:
    title: デプロイメント
    figure: 今日は7件
    description: 'それがなければ、同じ壁がタイル間のスペースを保持し、ページの基盤が表示されます — 上のバーで切り替えます。右にスクロールすると、一度見た後にのみロードされるパネルがあります。'
