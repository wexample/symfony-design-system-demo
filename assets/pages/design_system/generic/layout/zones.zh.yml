~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 区域
page_icon: 'ph:bold/columns'
intro: 每个探索者、编辑器和详细视图构建的双窗格工作区。一个区域没有自己的宽度和高度：它所处的分割决定了它的大小，每一侧独立滚动。两个区域是页面上放置的两个对象，而不是一个被切成两半的面板——区分它们的是它们之间的空间，而`zone--panel`是它们各自立足的基础。
section:
  split:
    title: 分割
    description: 一列大小，另一列占据剩余部分。大小由一个步骤决定，这是区域自己的——它不继承任何嵌套在其中的东西。
  scrollable:
    title: 每一侧独立滚动
    description: 可滚动区域是承载溢出的部分，而不是页面。滚动这两个中的一个，另一个保持原位，这就是这种形状的全部原因。
  vertical:
    title: 一个不滚动的头部
    description: 垂直分割：狭窄区域的高度是它所承载内容的高度，主体占用其余部分并在其下滚动。这是一个顶部有工具栏的面板的排列。
  wrap:
    title: 在地板下
    description: 给定一个地板，灵活区域占据整行，大小列则在其上方移动，而不是被挤压到无。缩小窗口以查看它的折叠。
split:
  body: 这一侧接受大小列留下的任何内容。
scrollable:
  item: 项目
  line: 行
vertical:
  action: 创建
wrap:
  body: 在这个区域给定的地板下，它占据自己的一行。
