~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: โซน
page_icon: 'ph:bold/columns'
intro: 'พื้นที่ทำงานที่มีสองพาเนลซึ่งทุกการสำรวจ การแก้ไข และมุมมองรายละเอียดถูกสร้างขึ้น โซนไม่มีความกว้างและความสูงของตัวเอง: การแบ่งที่มันนั่งอยู่คือสิ่งที่กำหนดขนาดของมัน และแต่ละด้านเลื่อนแยกกัน สองโซนคือวัตถุสองชิ้นที่วางอยู่บนหน้า ไม่ใช่แผงที่ถูกตัดครึ่ง — สิ่งที่บอกความแตกต่างของพวกมันคือพื้นที่ระหว่างกัน และ `zone--panel` คือพื้นฐานที่แต่ละอันยืนอยู่'
section:
  split:
    title: การแบ่ง
    description: 'หนึ่งคอลัมน์มีขนาดและอีกคอลัมน์หนึ่งจะใช้สิ่งที่เหลือ ขนาดจะถูกกำหนดโดยขั้นตอน และมันคือขนาดของโซนเอง — มันไม่ได้สืบทอดจากสิ่งที่อยู่ภายในมัน'
  scrollable:
    title: แต่ละด้านเลื่อนแยกกัน
    description: 'โซนที่เลื่อนเลื่อนได้คือสิ่งที่ถือการล้น ไม่ใช่หน้า เลื่อนหนึ่งในสองนี้และอีกด้านจะอยู่ที่เดิม ซึ่งเป็นเหตุผลทั้งหมดของรูปทรงนี้'
  vertical:
    title: หัวข้อที่ไม่เลื่อน
    description: 'การแบ่งที่ถูกเปลี่ยนเป็นแนวตั้ง: โซนแคบคือความสูงของสิ่งที่มันถือ ร่างกายจะใช้ที่เหลือและเลื่อนอยู่ใต้โซนนี้ นี่คือการจัดเรียงของแผงที่มีแถบเครื่องมืออยู่ด้านบน'
  wrap:
    title: ด้านล่างพื้น
    description: 'เมื่อมีพื้น โซนที่ยืดหยุ่นจะใช้เส้นเต็มและคอลัมน์ที่มีขนาดจะเคลื่อนที่อยู่เหนือมันแทนที่จะถูกบีบให้เล็กจนไม่มีอะไร ให้ลดขนาดหน้าต่างเพื่อดูมันพับ'
split:
  body: ด้านนี้รับสิ่งที่คอลัมน์ที่มีขนาดทิ้งไว้
scrollable:
  item: รายการ
  line: บรรทัด
vertical:
  action: สร้าง
wrap:
  body: 'ด้านล่างพื้นที่โซนนี้ได้รับ มันจะใช้เส้นของตัวเอง'
