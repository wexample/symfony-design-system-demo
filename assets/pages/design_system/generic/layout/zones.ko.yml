~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 영역
page_icon: 'ph:bold/columns'
intro: '모든 탐색기, 편집기 및 세부 정보 뷰가 구축된 두 개의 창으로 이루어진 작업 공간입니다. 영역은 자체적인 너비와 높이를 가지지 않으며, 그 위치한 분할이 크기를 결정하고 각 측면은 독립적으로 스크롤됩니다. 두 개의 영역은 페이지에 놓인 두 개의 객체이며, 반으로 나누어진 하나의 패널이 아닙니다. 그들을 구별하는 것은 그들 사이의 공간이며, `zone--panel`은 각자가 서 있는 기반입니다.'
section:
  split:
    title: 분할
    description: '하나는 크기가 정해진 열이고, 다른 하나는 남은 공간을 차지합니다. 크기는 단계에 의해 정해지며, 이는 영역 자체의 것입니다 — 내부에 중첩된 어떤 것도 이를 상속받지 않습니다.'
  scrollable:
    title: '각 측면은 독립적으로 스크롤됩니다'
    description: '스크롤 가능한 영역은 넘침을 보유하는 것이며, 페이지가 아닙니다. 이 두 개 중 하나를 스크롤하면 다른 하나는 있는 자리에 그대로 있으며, 이것이 형태의 전부 이유입니다.'
  vertical:
    title: '스크롤되지 않는 헤더'
    description: '수직으로 변환된 분할: 좁은 영역은 그 안에 담고 있는 것의 높이이며, 본체는 나머지를 차지하고 그 아래에서 스크롤됩니다. 이는 상단에 도구 모음이 있는 패널의 배열입니다.'
  wrap:
    title: '바닥 아래'
    description: '바닥이 주어지면, 유연한 영역은 전체 줄을 차지하고 크기가 정해진 열은 두 개가 압축되어 사라지지 않고 그 위로 이동합니다. 창을 좁혀서 접히는 모습을 확인하세요.'
split:
  body: '이 측면은 크기가 정해진 열이 남긴 것을 차지합니다.'
scrollable:
  item: 항목
  line: 줄
vertical:
  action: 생성
wrap:
  body: '이 영역에 주어진 바닥 아래에서, 자신의 줄을 차지합니다.'
