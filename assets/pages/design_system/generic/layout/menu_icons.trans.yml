en:
  page_title: "Icon menu"
  title: "The menu as its icons alone"
  body: "A page says menu_left_format: 'icons'. The menu draws its icons alone, as thick as the bar of tools and drawn as it is: the page being read in the application's colour, as an open tool is. Each entry's words come as a tooltip and stay for whoever reads the page aloud. The header offers nothing to open: the menu is always there, on every window. The application's mark stands at its head, from page_menu_logo_icon when the layout gives one, its whole logo otherwise."

ar:
  page_title: "قائمة الأيقونات"
  title: "القائمة بأيقوناتها فقط"
  body: "تحدد الصفحة menu_left_format: 'icons'. ترسم القائمة أيقوناتها فقط، بسماكة شريط الأدوات وعلى هيئته: الصفحة المقروءة بلون التطبيق، كأداة مفتوحة. تظهر كلمات كل عنصر كتلميح وتبقى لقارئ الشاشة. لا شيء في الترويسة لفتحه. في الأعلى علامة التطبيق من page_menu_logo_icon، وإلا شعاره كاملًا."

bn:
  page_title: "আইকন মেনু"
  title: "শুধু আইকনের মেনু"
  body: "পেজ menu_left_format: 'icons' বলে। মেনু শুধু আইকন আঁকে, টুলবারের সমান পুরু ও একইভাবে: পড়া পেজটি অ্যাপের রঙে, খোলা টুলের মতো। প্রতিটি এন্ট্রির শব্দ টুলটিপে আসে এবং স্ক্রিন রিডারের জন্য থাকে। হেডারে খোলার কিছু নেই। ওপরে অ্যাপের চিহ্ন page_menu_logo_icon থেকে, না থাকলে পুরো লোগো।"

de:
  page_title: "Symbolmenü"
  title: "Das Menü nur als Symbole"
  body: "Eine Seite setzt menu_left_format: 'icons'. Das Menü zeigt nur seine Symbole, so breit wie die Werkzeugleiste und wie sie gezeichnet: die gelesene Seite in der Farbe der Anwendung, wie ein geöffnetes Werkzeug. Die Worte jedes Eintrags erscheinen als Tooltip und bleiben für Screenreader. Der Header bietet nichts zum Öffnen: das Menü ist immer da. Oben steht das Zeichen der Anwendung, aus page_menu_logo_icon, sonst ihr ganzes Logo."

es:
  page_title: "Menú de iconos"
  title: "El menú solo con iconos"
  body: "Una página indica menu_left_format: 'icons'. El menú dibuja solo sus iconos, tan ancho como la barra de herramientas y dibujado como ella: la página leída en el color de la aplicación, como una herramienta abierta. Las palabras de cada entrada aparecen como tooltip y quedan para quien lee la página en voz alta. El encabezado no ofrece nada que abrir. Arriba, la marca de la aplicación, de page_menu_logo_icon, o su logo completo."

fa:
  page_title: "منوی آیکونی"
  title: "منو فقط با آیکون‌ها"
  body: "صفحه menu_left_format: 'icons' را تعیین می‌کند. منو فقط آیکون‌هایش را، هم‌ضخامت نوار ابزار و مانند آن، رسم می‌کند: صفحهٔ در حال خواندن به رنگ برنامه، مانند ابزاری باز. واژه‌های هر مورد به‌صورت راهنما می‌آیند و برای صفحه‌خوان می‌مانند. سربرگ چیزی برای باز کردن ندارد. در بالا نشان برنامه از page_menu_logo_icon، وگرنه لوگوی کامل."

fi:
  page_title: "Kuvakevalikko"
  title: "Valikko pelkkinä kuvakkeina"
  body: "Sivu asettaa menu_left_format: 'icons'. Valikko piirtää vain kuvakkeensa, työkalupalkin paksuisena ja samoin piirrettynä: luettava sivu sovelluksen värissä, kuten avoin työkalu. Kunkin kohdan sanat tulevat työkaluvihjeenä ja jäävät ruudunlukijoille. Otsakkeessa ei ole avattavaa. Ylhäällä sovelluksen merkki page_menu_logo_icon-lohkosta, muuten koko logo."

fr:
  page_title: "Menu en icônes"
  title: "Le menu réduit à ses icônes"
  body: "Une page indique menu_left_format: 'icons'. Le menu ne dessine que ses icônes, aussi épais que la barre d'outils et dessiné comme elle : la page lue dans la couleur de l'application, comme un outil ouvert. Les mots de chaque entrée viennent en infobulle et restent pour qui lit la page à voix haute. Le header n'a rien à ouvrir : le menu est toujours là, sur toutes les fenêtres. La marque de l'application se tient en tête, depuis page_menu_logo_icon quand le layout en donne une, son logo complet sinon."

he:
  page_title: "תפריט סמלים"
  title: "התפריט בסמלים בלבד"
  body: "דף קובע menu_left_format: 'icons'. התפריט מצייר רק את הסמלים, בעובי סרגל הכלים ובאותו עיצוב: הדף הנקרא בצבע היישום, כמו כלי פתוח. מילות כל פריט מופיעות כתיאור צף ונשארות לקוראי מסך. בכותרת אין מה לפתוח. למעלה סמל היישום מ־page_menu_logo_icon, ואחרת הלוגו המלא."

hi:
  page_title: "आइकन मेनू"
  title: "केवल आइकनों वाला मेनू"
  body: "पेज menu_left_format: 'icons' बताता है। मेनू केवल अपने आइकन, टूलबार जितनी मोटाई और उसी ढंग से बनाता है: पढ़ा जा रहा पेज ऐप के रंग में, खुले टूल की तरह। हर प्रविष्टि के शब्द टूलटिप में आते हैं और स्क्रीन रीडर के लिए बने रहते हैं। हेडर में खोलने को कुछ नहीं। ऊपर ऐप का चिह्न page_menu_logo_icon से, नहीं तो पूरा लोगो।"

id:
  page_title: "Menu ikon"
  title: "Menu hanya berupa ikon"
  body: "Sebuah halaman menyatakan menu_left_format: 'icons'. Menu hanya menggambar ikonnya, setebal bilah alat dan digambar seperti itu: halaman yang dibaca dalam warna aplikasi, seperti alat yang terbuka. Kata setiap entri muncul sebagai tooltip dan tetap ada untuk pembaca layar. Header tidak menawarkan apa pun untuk dibuka. Di atas, tanda aplikasi dari page_menu_logo_icon, atau logo lengkapnya."

it:
  page_title: "Menu a icone"
  title: "Il menu solo con le icone"
  body: "Una pagina indica menu_left_format: 'icons'. Il menu disegna solo le sue icone, spesso quanto la barra degli strumenti e disegnato come lei: la pagina letta nel colore dell'applicazione, come uno strumento aperto. Le parole di ogni voce arrivano come tooltip e restano per chi legge la pagina ad alta voce. L'header non offre nulla da aprire. In cima, il marchio dell'applicazione, da page_menu_logo_icon, o il logo intero."

ja:
  page_title: "アイコンメニュー"
  title: "アイコンだけのメニュー"
  body: "ページで menu_left_format: 'icons' を指定します。メニューはアイコンだけを、ツールバーと同じ太さ・同じ描き方で表示し、表示中のページは開いたツールと同じくアプリの色になります。各項目の言葉はツールチップとして表示され、読み上げにも残ります。ヘッダーに開くものはありません。上部にはアプリのマークを page_menu_logo_icon から、なければロゴ全体を表示します。"

ko:
  page_title: "아이콘 메뉴"
  title: "아이콘만 있는 메뉴"
  body: "페이지에서 menu_left_format: 'icons'를 지정합니다. 메뉴는 아이콘만 도구 막대와 같은 두께와 모양으로 그리며, 보고 있는 페이지는 열린 도구처럼 앱의 색으로 표시됩니다. 각 항목의 글자는 툴팁으로 나타나고 화면 낭독기를 위해 남습니다. 헤더에는 열 것이 없습니다. 맨 위에는 page_menu_logo_icon의 앱 마크, 없으면 전체 로고가 놓입니다."

nl:
  page_title: "Pictogrammenu"
  title: "Het menu als pictogrammen"
  body: "Een pagina zegt menu_left_format: 'icons'. Het menu tekent alleen zijn pictogrammen, zo breed als de gereedschapsbalk en zoals die getekend: de gelezen pagina in de kleur van de applicatie, zoals een open gereedschap. De woorden van elk item komen als tooltip en blijven voor wie de pagina voorleest. De header biedt niets om te openen. Bovenaan het merk van de applicatie, uit page_menu_logo_icon, anders het hele logo."

pl:
  page_title: "Menu ikon"
  title: "Menu z samymi ikonami"
  body: "Strona ustawia menu_left_format: 'icons'. Menu rysuje tylko ikony, grube jak pasek narzędzi i tak samo rysowane: czytana strona w kolorze aplikacji, jak otwarte narzędzie. Słowa każdej pozycji pojawiają się jako podpowiedź i zostają dla czytników ekranu. Nagłówek nie ma nic do otwarcia. Na górze znak aplikacji, z page_menu_logo_icon, a jeśli go brak — całe logo."

ru:
  page_title: "Меню иконок"
  title: "Меню только из иконок"
  body: "Страница задаёт menu_left_format: 'icons'. Меню рисует только иконки, толщиной с панель инструментов и так же оформленные: читаемая страница в цвете приложения, как открытый инструмент. Слова каждого пункта появляются подсказкой и остаются для экранных дикторов. В шапке нечего открывать. Наверху знак приложения из page_menu_logo_icon, иначе полный логотип."

th:
  page_title: "เมนูไอคอน"
  title: "เมนูที่มีแต่ไอคอน"
  body: "หน้าเว็บกำหนด menu_left_format: 'icons' เมนูจะวาดเฉพาะไอคอน หนาเท่าแถบเครื่องมือและวาดแบบเดียวกัน หน้าที่กำลังอ่านเป็นสีของแอป เหมือนเครื่องมือที่เปิดอยู่ คำของแต่ละรายการแสดงเป็นทูลทิปและยังอยู่สำหรับโปรแกรมอ่านหน้าจอ ส่วนหัวไม่มีอะไรให้เปิด ด้านบนคือเครื่องหมายของแอปจาก page_menu_logo_icon หรือโลโก้เต็มถ้าไม่มี"

tr:
  page_title: "Simge menüsü"
  title: "Yalnızca simgelerden menü"
  body: "Bir sayfa menu_left_format: 'icons' der. Menü yalnızca simgelerini çizer, araç çubuğu kalınlığında ve onun gibi: okunan sayfa uygulamanın renginde, açık bir araç gibi. Her girdinin sözcükleri ipucu olarak gelir ve ekran okuyucular için kalır. Başlıkta açılacak bir şey yoktur. Üstte uygulamanın işareti, page_menu_logo_icon'dan, yoksa tam logo."

ur:
  page_title: "آئیکن مینو"
  title: "صرف آئیکنز والا مینو"
  body: "صفحہ menu_left_format: 'icons' بتاتا ہے۔ مینو صرف اپنے آئیکنز، ٹول بار جتنی موٹائی اور اسی انداز میں بناتا ہے: پڑھا جانے والا صفحہ ایپ کے رنگ میں، کھلے ٹول کی طرح۔ ہر اندراج کے الفاظ ٹول ٹِپ میں آتے ہیں اور اسکرین ریڈر کے لیے رہتے ہیں۔ ہیڈر میں کھولنے کو کچھ نہیں۔ اوپر ایپ کا نشان page_menu_logo_icon سے، ورنہ مکمل لوگو۔"

vi:
  page_title: "Menu biểu tượng"
  title: "Menu chỉ gồm biểu tượng"
  body: "Một trang khai báo menu_left_format: 'icons'. Menu chỉ vẽ các biểu tượng, dày bằng thanh công cụ và được vẽ như nó: trang đang đọc mang màu của ứng dụng, như một công cụ đang mở. Chữ của mỗi mục hiện thành chú thích và vẫn còn cho trình đọc màn hình. Phần đầu trang không có gì để mở. Trên cùng là dấu hiệu của ứng dụng, từ page_menu_logo_icon, hoặc logo đầy đủ."

zh:
  page_title: "图标菜单"
  title: "只显示图标的菜单"
  body: "页面设置 menu_left_format: 'icons'。菜单只绘制图标，宽度和样式与工具栏相同：正在阅读的页面使用应用的颜色，如同打开的工具。每个条目的文字以提示显示，并保留给屏幕阅读器。页眉中没有可打开的内容。顶部是应用标志，来自 page_menu_logo_icon，否则为完整标志。"

pt_BR:
  page_title: "Menu de ícones"
  title: "O menu apenas com os ícones"
  body: "Uma página diz menu_left_format: 'icons'. O menu desenha apenas os ícones, da espessura da barra de ferramentas e desenhado como ela: a página lida na cor da aplicação, como uma ferramenta aberta. As palavras de cada entrada aparecem como dica e ficam para leitores de tela. O cabeçalho não tem nada para abrir. No topo, a marca da aplicação, de page_menu_logo_icon, ou o logo inteiro."
