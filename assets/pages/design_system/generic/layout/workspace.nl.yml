~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Werkruimte
page_icon: 'ph:bold/sidebar-simple'
intro: "Deze pagina is het voorbeeld: wat je leest staat in het midden van drie regio's, naast elkaar in de body van de pagina."
section:
  gap:
    title: 'De kloof is de scheiding'
    description: "Er is niets getekend tussen twee regio's. Wat ze van elkaar onderscheidt is de ruimte die ze tussen zich laten, waardoor de pagina laat zien — dezelfde grond waarop het menu en de header staan. Elke regio heeft zijn eigen, dat is de grond die een body altijd had."
  each:
    title: 'Iedereen op zijn eigen'
    description: 'De twee kolommen behouden de breedte die ze hebben gekregen en het midden neemt wat overblijft. Scroll één van de drie en de andere twee blijven staan waar ze zijn: een regio houdt zijn eigen overflow, en de pagina houdt er geen.'
    more: 'Een regio weet niets van zijn buren. De verkenner aan de linkerkant is een splitsing op zich — een balk die blijft, een boom die eronder scrollt — en het zou dezelfde vorm hebben waar dan ook op de pagina.'
  size:
    title: 'Een van hen vergroten'
    description: 'De regio aan de linkerkant heeft een `zone-resizer`: een handvat dat de ruimte ernaast opvult, wat niets tekent — de cursor zegt dat het beweegt. Sleep het, of geef het de focus en gebruik de pijlen; een dubbelklik geeft de regio de breedte terug die de pagina gaf.'
    more: 'Een handvat vergroot een regio die een grootte heeft — eentje die een breedte heeft gekregen in plaats van wat overblijft te nemen — en de flexibele ernaast absorbeert het verschil. De breedte wordt onthouden onder de naam van de regio, zodat het terugkomt met de pagina, hier op alle drie de indelingen aangezien het dezelfde regio is die beweegt.'
editor:
  state: Opgeslagen
inspector:
  title: Details
  field:
    path:
      key: Pad
    size:
      key: Grootte
    changed:
      key: Gewijzigd
      value: '3 minuten geleden'
