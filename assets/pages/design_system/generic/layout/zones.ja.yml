~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ゾーン
page_icon: 'ph:bold/columns'
intro: 'すべてのエクスプローラー、エディター、詳細ビューが構築される二分割の作業スペースです。ゾーン自体には幅も高さもありません：それが置かれている分割によってサイズが決まり、各側面は独自にスクロールします。二つのゾーンはページ上に置かれた二つのオブジェクトであり、一つのパネルを半分に切ったものではありません — それらを区別するのは、その間のスペースであり、`zone--panel` はそれぞれが立つ基盤です。'
section:
  split:
    title: 分割
    description: '一方はサイズが設定され、もう一方は残りのスペースを占有します。サイズはステップによって決まり、それはゾーン自身のものです — 内部にネストされたものからは継承されません。'
  scrollable:
    title: 各側面は独自にスクロールします
    description: スクロール可能なゾーンは、オーバーフローを保持するものであり、ページではありません。これらの二つのうちの一つをスクロールすると、もう一方はそのままの位置に留まります。これが形状の全ての理由です。
  vertical:
    title: スクロールしないヘッダー
    description: 垂直に分割された状態：狭いゾーンは保持するものの高さに等しく、ボディは残りを占有し、その下でスクロールします。これはツールバーが上にあるパネルの配置です。
  wrap:
    title: 床の下
    description: 床が与えられると、柔軟なゾーンは完全な行を主張し、サイズが設定されたカラムは両方が押しつぶされるのではなく、その上に移動します。ウィンドウを狭くすると折りたたむ様子が見えます。
split:
  body: この側はサイズが設定されたカラムが残したものを取ります。
scrollable:
  item: アイテム
  line: 行
vertical:
  action: 作成
wrap:
  body: 与えられた床の下で、このゾーンは自分自身の行を占有します。
