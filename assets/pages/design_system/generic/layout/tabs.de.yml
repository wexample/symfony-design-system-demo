~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Tabs
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'Tabs in Vue'
    description: 'Die Twig-Leiste ist eine Reihe von Links und die Adresse zeigt an, welcher geöffnet ist. Die Vue-Leiste meldet nur, dass eine Registerkarte angefordert wurde, daher hält etwas darum die Antwort — hier eine Demokomponente.'
  breadcrumb:
    vue_description: 'Der Vue-Zwilling nimmt seine Elemente bereits gelöst: Der Server hält die Routentabelle, also beantwortet er sie, und was kreuzt, ist die Antwort.'
    title: Breadcrumb
    description: 'Zeigt den Standort des Benutzers innerhalb der Hierarchie an. Verwenden Sie den Breadcrumb-Teil — übergeben Sie Elemente mit Route und Bezeichnung; das letzte Element wird immer als aktuell gerendert.'
  tabs:
    title: Tabs
  default:
    normal:
      title: 'Einfache Tabs'
    full:
      title: 'Einfache Tabs (volle Breite)'
    half:
      title: 'Einfache Tabs (halbe Breite)'
  counts:
    title: 'Tabs mit Zählung'
    description: 'Wie viele von dem, was die Registerkarte enthält, am Ende der Bezeichnung. Es ist eine Pille und sonst nichts — übergeben Sie `count` neben der Bezeichnung und die Registerkarte platziert es. Ein Element ohne den Schlüssel zeigt nichts an, so bleibt eine Registerkarte ohne etwas zu zählen still.'
  icons:
    normal:
      title: 'Tabs mit Icons'
    full:
      title: 'Tabs mit Icons (volle Breite)'
    half:
      title: 'Tabs mit Icons (halbe Breite)'
breadcrumb:
  example:
    vue: 'In Vue'
    two_levels: 'Zwei Ebenen'
    three_levels: 'Drei Ebenen'
  item:
    home: Startseite
    layout: Layout
    section: Blöcke
    current: Navigation
tab:
  one: Übersicht
  two: Aktivität
  three: Einstellungen
vue:
  panel:
    one: 'Das erste Panel. Nichts wurde abgerufen und keine Adresse hat sich geändert — die Leiste hat ausgesendet, der Halter hat gewechselt.'
    two: 'Das zweite Panel.'
    three: 'Das dritte Panel.'
