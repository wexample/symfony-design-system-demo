~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Blocs
page_icon: 'ph:bold/squares-four'
tone:
  body: 'le sol reste celui du bloc, seule la bordure avant porte la couleur.'
section:
  tone:
    title: 'Un bloc portant un ton'
    description: "La couleur d'un état — ou d'une catégorie — sous forme de barre sur la bordure avant, et rien d'autre : la même barre qu'un message porte, sans le sol teinté, de sorte qu'une liste de ceux-ci se lit comme une liste et non comme une alarme. Tout bloc peut l'adopter, une barre se tenant sur un bloc inclus."
  default:
    title: 'Blocs de base'
  advanced:
    title: 'Blocs avancés'
  aside:
    title: 'Colonne fixe à côté'
    description: "Une colonne étroite dimensionnée sur l'échelle --size, à côté d'un corps qui absorbe la largeur restante."
  card:
    title: Cartes
  link:
    title: 'Un bloc qui est un lien'
    description: "Toute la carte est le lien — pour un choix fait en sélectionnant une carte parmi plusieurs : un plan, une branche, un modèle. Cela se lit comme du texte, pas comme une action atténuée ; sous le pointeur, son sol prend une nuance et son bord se renforce, et le clavier le trouve par l'anneau de focus que chaque contrôle porte."
  figure:
    title: Figures
    description: 'Une seule valeur ou icône surdimensionnée, centrée. Utilisé pour les compteurs de tableau de bord et les tuiles de statut — ajoutez block--square pour garder la tuile carrée quelle que soit sa largeur.'
  stacks:
    title: Empilements
  stack_horizontal:
    title: Horizontal
    description: 'Colonnes égales, pleine largeur, se replie en cas de débordement.'
  stack_vertical:
    title: Vertical
    description: 'Lignes empilées, pleine largeur, espacement uniforme.'
  stack_split:
    title: Démembré
    description: 'Le premier enfant grandit, le dernier enfant reste fixe — utilisé pour les lignes de lead + action.'
  stack_nested:
    title: Imbriqué
    description: 'Empilement horizontal contenant des empilements verticaux — grille de tableau de bord typique.'
stack:
  item:
    one: Un
    two: Deux
    three: Trois
    four: Quatre
    lead: "Décrivez l'action dans ce texte de lead."
    action: Action
block:
  title: 'Titre du bloc'
  no_padding: 'Bloc sans padding (utilisant block--body).'
  one:
    title: 'Bloc principal'
    description: 'Un bloc avec un titre et un texte de corps.'
  two:
    title: 'Bloc secondaire'
    description: "Un autre bloc pour démontrer l'espacement."
  three:
    title: 'Bloc tertiaire'
    description: 'Un troisième bloc dans la rangée.'
  four:
    title: 'Bloc quaternaire'
    description: 'Un quatrième bloc pour la démonstration de mise en page.'
  advanced:
    title: 'Projection de pipeline'
    status: Prêt
    description: 'Ce bloc combine des emplacements de titre et du contenu dans une seule structure réutilisable.'
    details: 'Des opérateurs peuvent être ajoutés sans quitter le contexte actuel.'
  zones:
    main:
      title: 'Zone principale'
      description: 'Le contenu principal peut croître naturellement avec un espacement standard.'
    aside:
      title: 'Zone à côté'
      description: 'Cette zone latérale utilise un fond clair pour mettre en valeur le contenu complémentaire.'
  zones_three:
    title: 'Mise en page à trois zones'
    status: Brouillon
    left:
      title: 'Panneau gauche'
      description: 'La navigation secondaire ou les métadonnées peuvent vivre ici.'
    main:
      title: 'Contenu principal'
      description: 'Les informations principales restent centrées pour la lisibilité.'
    right:
      title: 'Panneau droit'
      description: 'Les actions contextuelles et les aperçus peuvent être regroupés de ce côté.'
    footer:
      meta: 'Mis à jour il y a 2 minutes'
      action: 'Ouvrir les détails'
figure:
  projections: Projections
  uptime: 'Temps de disponibilité'
  status: 'En direct'
  framed:
    title: Débit
    label: 'Événements par seconde'
tab:
  one: Aperçu
  two: Activité
  three: Paramètres
button:
  create: 'Créer une projection'
  refresh: 'Rafraîchir les données'
  export: Exporter
action:
  add_projection: 'Ajouter une projection'
link:
  starter:
    title: Démarreur
    description: 'Une personne, les essentiels, rien à payer.'
  team:
    title: Équipe
    description: 'Quelques personnes travaillant sur les mêmes choses.'
  company:
    title: Entreprise
    description: "Chaque équipe, avec les contrôles qu'une organisation demande."
