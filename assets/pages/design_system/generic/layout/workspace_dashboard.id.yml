~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Dasbor
page_icon: 'ph:bold/squares-four'
mode:
  reopen: 'Buka kembali panel API'
  gap: 'Dengan celah'
  flush: Flush
state:
  success: Nominal
  warning: Degradasi
  error: Gagal
  running: 'Sedang mengalir'
tile:
  traffic:
    title: 'Lalu lintas'
    figure: '12.4k req/menit'
    description: 'Pemisahan di dalam pemisahan: dinding adalah pemisahan vertikal dari baris, setiap baris adalah pemisahan tersendiri. Seret tepi di bawah baris ini untuk memberinya tinggi lebih, atau yang di samping ubin ini untuk lebar lebih.'
  latency:
    title: 'Latensi p95'
    figure: '184 ms'
    description: 'Setiap ubin menamai lantai, `zone--min-*`: di bawahnya ubin tidak diperas, bingkai menggulir sebagai gantinya — ke samping serta ke bawah.'
  errors:
    title: Kesalahan
    figure: '2.1 %'
    description: 'Setelah diubah ukuran, suatu zona mempertahankan ukuran yang ditinggalkan di sepanjang sumbu pemisahnya, dan kembali dengan ukuran itu; klik ganda pada pegangan mengembalikannya ke pemisahan.'
  queue:
    title: Antrian
    figure: '318 pekerjaan'
    description: '`zone--split--flush` mempersempit celah menjadi satu piksel, tanah dinding menggambar garis antara ubin. Satu kelas di dinding sudah cukup, baris mewarisinya.'
  deploys:
    title: Penerapan
    figure: '7 hari ini'
    description: 'Tanpa itu dinding yang sama mempertahankan ruang antara ubin-ubin, melalui mana tanah halaman ditampilkan — beralih di bilah di atas. Gulir ke kanan untuk panel yang dimuat hanya setelah terlihat.'
