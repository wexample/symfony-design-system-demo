~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: كتل
page_icon: 'ph:bold/squares-four'
tone:
  body: 'الأرض تبقى خاصة بالكتلة، فقط الحافة الأمامية تحمل اللون.'
section:
  tone:
    title: 'كتلة تحمل نغمة'
    description: 'لون الحالة — أو الفئة — كخط في الحافة الأمامية، ولا شيء آخر: نفس الخط الذي ترتديه الرسالة، دون الأرض الملونة، بحيث تقرأ قائمة منها كقائمة وليس كإنذار. أي كتلة تأخذها، بما في ذلك الخط الذي يقف على كتلة.'
  default:
    title: 'كتل أساسية'
  advanced:
    title: 'كتل متقدمة'
  aside:
    title: 'عمود جانبي ثابت'
    description: 'عمود ضيق مقاس على مقياس --size، بجانب جسم يمتص العرض المتبقي.'
  card:
    title: بطاقات
  link:
    title: 'كتلة هي رابط'
    description: 'البطاقة بأكملها هي الرابط — لاختيار تم عن طريق اختيار بطاقة واحدة من عدة: خطة، فرع، نموذج. تقرأ كنص، وليس كإجراء مموه؛ تحت المؤشر تأخذ أرضيتها تدرجًا وتشتد حافتها، ويجدها لوحة المفاتيح بواسطة حلقة التركيز التي يرتديها كل تحكم.'
  figure:
    title: أرقام
    description: 'قيمة أو أيقونة واحدة كبيرة، في المنتصف. تستخدم لعدادات لوحة التحكم وبلاطات الحالة — أضف block--square للحفاظ على البلاط مربعًا بغض النظر عن عرضه.'
  stacks:
    title: تكديس
  stack_horizontal:
    title: أفقي
    description: 'أعمدة متساوية، بعرض كامل، تلتف عند تجاوز الحد.'
  stack_vertical:
    title: عمودي
    description: 'صفوف مكدسة، بعرض كامل، بفجوة متساوية.'
  stack_split:
    title: منقسم
    description: 'ينمو العنصر الأول، ويبقى العنصر الأخير ثابتًا — يستخدم لصفوف القيادة + الإجراءات.'
  stack_nested:
    title: متداخل
    description: 'تكديس أفقي يحتوي على تكديس عمودي — شبكة لوحة التحكم النموذجية.'
