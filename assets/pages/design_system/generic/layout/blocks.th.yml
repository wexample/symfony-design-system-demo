~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: บล็อก
page_icon: 'ph:bold/squares-four'
tone:
  body: 'พื้นดินยังคงเป็นของบล็อก อยู่แค่ขอบด้านหน้าเท่านั้นที่มีสีสัน'
section:
  tone:
    title: บล็อกที่มีโทนสี
    description: 'สีของสถานะ — หรือของหมวดหมู่ — จะอยู่ในแถบที่ขอบด้านหน้า และไม่มีอะไรอื่น: แถบเดียวกันที่ข้อความสวมใส่ โดยไม่มีพื้นสีที่มีสีอ่อน ดังนั้นรายการนี้จึงอ่านได้เป็นรายการ ไม่ใช่เป็นการเตือนภัย บล็อกใด ๆ ก็สามารถใช้ได้ รวมถึงแถบที่ตั้งอยู่บนบล็อกด้วย'
  default:
    title: บล็อกพื้นฐาน
  advanced:
    title: บล็อกขั้นสูง
  aside:
    title: คอลัมน์ข้างที่ตายตัว
    description: 'คอลัมน์แคบที่มีขนาดตามมาตรฐาน --size ข้าง ๆ เนื้อหาที่ดูดซับความกว้างที่เหลืออยู่'
  card:
    title: การ์ด
  link:
    title: บล็อกที่เป็นลิงก์
    description: 'การ์ดทั้งหมดคือการเชื่อมโยง — สำหรับการเลือกที่ทำโดยการเลือกการ์ดหนึ่งใบจากหลายใบ: แผน, สาขา, แม่แบบ อ่านได้เหมือนข้อความ ไม่ใช่การกระทำที่เงียบสงบ; ใต้ตัวชี้ พื้นของมันจะมีเฉดสี และขอบก็จะแข็งขึ้น และแป้นพิมพ์จะค้นหามันโดยวงแหวนโฟกัสที่ควบคุมทุกตัวใส่'
  figure:
    title: รูปภาพ
    description: 'ค่าหรือไอคอนขนาดใหญ่เพียงค่าเดียว อยู่กลาง ใช้สำหรับตัวนับในแดชบอร์ดและแผ่นสถานะ — เพิ่ม block--square เพื่อให้แผ่นมีรูปสี่เหลี่ยมจัตุรัสไม่ว่าจะมีความกว้างเท่าใด'
  stacks:
    title: สแต็ค
  stack_horizontal:
    title: แนวนอน
    description: 'คอลัมน์ที่เท่ากัน กว้างเต็มที่ ห่อหุ้มเมื่อเกิน'
  stack_vertical:
    title: แนวตั้ง
    description: 'แถวที่ซ้อนกัน กว้างเต็มที่ ช่องว่างสม่ำเสมอ'
  stack_split:
    title: แบ่ง
    description: 'เด็กคนแรกเติบโต เด็กคนสุดท้ายคงที่ — ใช้สำหรับแถวหัวหน้า + การกระทำ'
  stack_nested:
    title: ซ้อนกัน
    description: 'สแต็คแนวนอนที่มีสแต็คแนวตั้ง — ตะแกรงแดชบอร์ดทั่วไป'
stack:
  item:
    one: หนึ่ง
    two: สอง
    three: สาม
    four: สี่
    lead: อธิบายการกระทำในข้อความหัวข้อนี้
    action: การกระทำ
block:
  title: ชื่อบล็อก
  no_padding: 'บล็อกที่ไม่มีการเว้นระยะ (ใช้ block--body)'
  one:
    title: บล็อกหลัก
    description: บล็อกที่มีชื่อและข้อความเนื้อหา
  two:
    title: บล็อกรอง
    description: บล็อกอีกหนึ่งเพื่อแสดงให้เห็นถึงการจัดระยะ
  three:
    title: บล็อกที่สาม
    description: บล็อกที่สามในแถว
  four:
    title: บล็อกที่สี่
    description: บล็อกที่สี่สำหรับการสาธิตการจัดรูปแบบ
  advanced:
    title: การคาดการณ์ทางท่อ
    status: พร้อมใช้งาน
    description: บล็อกนี้รวมช่องชื่อและเนื้อหาในโครงสร้างที่สามารถนำกลับมาใช้ใหม่ได้ในที่เดียว
    details: ผู้ปฏิบัติงานสามารถเพิ่มได้โดยไม่ต้องออกจากบริบทปัจจุบัน
  zones:
    main:
      title: โซนหลัก
      description: เนื้อหาหลักสามารถเติบโตตามธรรมชาติด้วยการจัดระยะมาตรฐาน
    aside:
      title: โซนข้าง
      description: โซนข้างนี้ใช้พื้นหลังสีอ่อนเพื่อเน้นเนื้อหาที่เสริม
  zones_three:
    title: รูปแบบสามโซน
    status: ร่าง
    left:
      title: แผงด้านซ้าย
      description: การนำทางรองหรือข้อมูลเมตาอาจอยู่ที่นี่
    main:
      title: เนื้อหาหลัก
      description: ข้อมูลหลักจะอยู่กลางเพื่อความอ่านง่าย
    right:
      title: แผงด้านขวา
      description: การกระทำและข้อมูลเชิงบริบทสามารถจัดกลุ่มในด้านนี้ได้
    footer:
      meta: 'อัปเดตเมื่อ 2 นาทีที่แล้ว'
      action: เปิดรายละเอียด
figure:
  projections: การคาดการณ์
  uptime: เวลาทำงาน
  status: สด
  framed:
    title: การส่งผ่าน
    label: เหตุการณ์ต่อวินาที
tab:
  one: ภาพรวม
  two: กิจกรรม
  three: การตั้งค่า
button:
  create: สร้างการคาดการณ์
  refresh: รีเฟรชข้อมูล
  export: ส่งออก
action:
  add_projection: เพิ่มการคาดการณ์
link:
  starter:
    title: เริ่มต้น
    description: 'หนึ่งคน, สิ่งจำเป็น, ไม่มีค่าใช้จ่าย'
  team:
    title: ทีม
    description: คนไม่กี่คนทำงานในสิ่งเดียวกัน
  company:
    title: บริษัท
    description: 'ทุกทีม พร้อมด้วยการควบคุมที่องค์กรต้องการ'
