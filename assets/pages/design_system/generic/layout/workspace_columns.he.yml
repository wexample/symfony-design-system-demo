~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'חמש עמודות'
page_icon: 'ph:bold/arrows-horizontal'
intro: 'חמש אזורים בשורה רחבים יותר מהמסך, נקראים על ידי גלילה לצדדים. הניווט בצד שמאל אינו אחד מהם — הוא אזור של הדף, והוא נשאר במקומו.'
section:
  scroll:
    title: 'השורה גוללת, הדף לא'
    description: '`zone--split--scroll` שם את העודף על השורה: העמודות שומרות על הרוחב שהן קובעות והחלוקה גוללת מתחתן. כל אחת עדיין מחזיקה את העודף האנכי שלה, כך שעמודה ארוכה גוללת במקום שהיא נמצאת.'
  width:
    title: 'כל עמודה קובעת את הרוחב שלה'
    description: 'שום דבר לא לוקח את מה שנשאר כאן, מכיוון שאין: השורה ארוכה יותר מהדף בכוונה. אזור שאינו קובע גודל חוזר לעמודה רחבה מספיק כדי להכיל משהו, והעמודות הללו קובעות את רוחבן — 24rem כל אחת, חמישה מהם.'
  fold:
    title: 'קיפול אזור'
    description: 'כל עמודה כאן היא `zone-collapsible`. כשהיא מקופלת, היא לא נעלמת: היא שומרת על מקומה בשורה ועל הקרקע שלה, והבר שלה מתהפך על צדדיו — כך שהכפתור שקיפל אותה הוא הכפתור שמפתח אותה, ושום דבר מחוץ לא צריך לדעת שהיא קיימת.'
    more: 'אזור עם שם נזכר: המצב נכתב למצב ה-ui תחת שמו ונקרא חזרה כשמגישים את הדף, כך שהוא מגיע מקופל במקום לקפל מול עיניך. העמודה השלישית נפתחת מקופלת, והאחרונה מוכללת על ידי vue — אותו רכיב, אותם מחלקות, אותו מפתח.'
column:
  first: 'קרא לי'
  second: 'רשימת המתנה'
  third: בתהליך
  fourth: סקירה
  fifth: הושלם
card:
  second: כרטיס
  third: כרטיס
  fourth: כרטיס
  fifth: כרטיס
  body: 'מה שעומדת עמודה לא עניין השורה: היא גוללת בעצמה, מתחת לבר שנשאר.'
