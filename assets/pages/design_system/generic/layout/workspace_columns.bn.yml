~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'পাঁচটি কলাম'
page_icon: 'ph:bold/arrows-horizontal'
intro: 'পাঁচটি অঞ্চল পর্দার চেয়ে চওড়া, পাশে স্ক্রল করে পড়া হয়। বামের নেভিগেশন এর মধ্যে নয় — এটি পৃষ্ঠার একটি অঞ্চল, এবং এটি নিজের জায়গায় থাকে।'
section:
  scroll:
    title: 'সারি স্ক্রল হয়, পৃষ্ঠা নয়'
    description: '`zone--split--scroll` সারির উপর ওভারফ্লো রাখে: কলামগুলি তাদের নামকৃত প্রস্থ ধরে রাখে এবং বিভাজন তাদের নিচে স্ক্রল করে। প্রতিটি এখনও তার নিজস্ব উল্লম্ব ওভারফ্লো ধারণ করে, তাই একটি দীর্ঘ কলাম যেখানে দাঁড়িয়ে তা স্ক্রল করে।'
  width:
    title: 'প্রতিটি কলাম তার প্রস্থ বলে'
    description: 'এখানে কিছু নেই যা বাকি নেয়, যেহেতু কিছু নেই: সারিটি উদ্দেশ্যমূলকভাবে পৃষ্ঠার চেয়ে লম্বা। একটি অঞ্চল যা কোনো আকার উল্লেখ করে না, সেটি এমন একটি কলামে ফিরে আসে যা কিছু ধারণ করার জন্য যথেষ্ট চওড়া, এবং এগুলো তাদের নামকরণ করে — প্রতিটি ২৪ রেম, পাঁচটি।'
  fold:
    title: 'একটি অঞ্চলের ভাঁজ'
    description: 'এখানে প্রতিটি কলাম একটি `zone-collapsible`। ভাঁজ করা হলে, এটি চলে যায় না: এটি সারিতে এবং তার স্থানে থাকে, এবং এর বার পাশে ঘোরে — তাই যে বোতামটি এটি ভাঁজ করেছে, সেটিই এটি খুলে, এবং বাইরে কিছু জানার প্রয়োজন নেই যে এটি বিদ্যমান।'
    more: 'নামকৃত হলে, একটি অঞ্চল মনে রাখা হয়: স্থিতি তার নামের অধীনে ui স্থিতে লেখা হয় এবং পৃষ্ঠা পরিবেশন করার সময় আবার পড়া হয়, তাই এটি আপনার চোখের সামনে ভাঁজ হওয়ার পরিবর্তে ভাঁজ করা অবস্থায় আসে। তৃতীয় কলামটি ভাঁজ হয়ে খোলে, এবং শেষটি একটি ভিউ দ্বারা রেন্ডার করা হয় — একই কম্পোনেন্ট, একই ক্লাস, একই চাবি।'
column:
  first: 'আমাকে পড়ুন'
  second: ব্যাকলগ
  third: চলমান
  fourth: পর্যালোচনা
  fifth: সম্পন্ন
