~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: พื้นที่ทำงาน
page_icon: 'ph:bold/sidebar-simple'
intro: 'หน้านี้เป็นตัวอย่าง: สิ่งที่คุณกำลังอ่านอยู่ตรงกลางของสามพื้นที่ ที่อยู่ข้างกันในเนื้อหาของหน้า.'
section:
  gap:
    title: ช่องว่างคือการแบ่งแยก
    description: 'ไม่มีอะไรถูกวาดระหว่างสองพื้นที่ สิ่งที่บอกความแตกต่างคือพื้นที่ที่พวกเขาทิ้งไว้ระหว่างกัน ซึ่งหน้าจะแสดง — พื้นที่เดียวกันที่เมนูและส่วนหัวอยู่บนพื้นนั้น ทุกพื้นที่มีพื้นของมันเอง ซึ่งเป็นพื้นที่ร่างกายเคยมีเสมอ.'
  each:
    title: แต่ละอันแยกกัน
    description: 'สองคอลัมน์จะรักษาความกว้างที่กำหนดไว้และกลางจะรับสิ่งที่เหลือ เลื่อนหนึ่งในสามและอีกสองจะอยู่ที่เดิม: พื้นที่จะถือการโอเวอร์โฟลว์ของมันเอง และหน้าไม่ถืออะไรเลย.'
    more: 'พื้นที่ไม่รู้จักเพื่อนบ้านของมัน นักสำรวจทางซ้ายคือการแบ่งแยกของมันเอง — แถบที่คงอยู่, ต้นไม้ที่เลื่อนอยู่ใต้ — และจะมีรูปร่างเดียวกันที่ส่วนอื่นของหน้า.'
  size:
    title: ปรับขนาดหนึ่งในนั้น
    description: 'พื้นที่ทางซ้ายมี `zone-resizer`: ที่จับที่เติมช่องว่างข้างๆ ซึ่งไม่วาดอะไร — ตัวชี้จะบอกว่ามันเคลื่อนไหว ลากมัน หรือให้โฟกัสและใช้ลูกศร; คลิกสองครั้งจะทำให้พื้นที่กลับมามีความกว้างที่หน้ามอบให้.'
    more: 'ที่จับปรับขนาดพื้นที่ที่มีขนาด — ขนาดที่กำหนดไว้แทนการรับสิ่งที่เหลือ — และข้างๆ ที่ปรับได้จะดูดซับความแตกต่าง ความกว้างจะถูกจดจำภายใต้ชื่อของพื้นที่ ดังนั้นมันจะกลับมาพร้อมกับหน้า, ที่นี่ในรูปแบบทั้งสามเพราะมันคือพื้นที่เดียวกันที่เคลื่อนที่.'
