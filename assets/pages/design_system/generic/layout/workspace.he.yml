~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'מרחב עבודה'
page_icon: 'ph:bold/sidebar-simple'
intro: 'דף זה הוא הדוגמה: מה שאתה קורא נמצא באמצע שלושה אזורים, מונחים זה לצד זה בגוף הדף.'
section:
  gap:
    title: 'המרווח הוא המפריד'
    description: 'אין דבר שנמשך בין שני אזורים. מה שמפריד ביניהם הוא המקום שהם משאירים ביניהם, דרכו הדף מציג — אותה קרקע שעליה עומדים התפריט והכותרת. כל אזור נושא את שלו, שהיא הקרקע שתמיד הייתה לגוף.'
  each:
    title: 'כל אחד בפני עצמו'
    description: 'שתי העמודות שומרות על הרוחב שניתן להן והאמצעי לוקח את מה שנשאר. גלול אחד משלושה והאחרים נשארים במקום: אזור מחזיק את ההצפה שלו, והדף לא מחזיק אף אחת.'
    more: 'אזור אינו יודע כלום על שכניו. החוקר בצד שמאל הוא חלוקה משלו — סרגל שנשאר, עץ שגולל מתחתיו — וזה יהיה אותו צורה בכל מקום אחר בדף.'
  size:
    title: 'גודל אחד מהם'
    description: 'האזור בצד שמאל נושא `zone-resizer`: ידית שממלאת את המרווח לצידה, שאינה מושכת דבר — הסמן אומר שזה זז. גרור אותו, או תן לו את הפוקוס והשתמש בחצים; לחיצה כפולה מחזירה לאזור את הרוחב שהדף נתן לו.'
    more: 'ידית מסדרת אזור שיש לו גודל — אחד שניתן רוחב במקום לקחת את מה שנשאר — והגמיש לצידו סופג את ההבדל. הרוחב נזכר תחת שם האזור, כך שהוא חוזר עם הדף, כאן בכל שלושת העיצובים מכיוון שזה אותו אזור זז.'
