~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: زون‌ها
page_icon: 'ph:bold/columns'
intro: 'فضای کاری دو صفحه‌ای که هر اکتشاف‌گر، ویرایش‌گر و نمای جزئیات بر اساس آن ساخته شده است. یک زون هیچ عرض و ارتفاعی به خودی خود ندارد: شکاف موجود در آن است که اندازه‌اش را تعیین می‌کند و هر طرف به‌طور مستقل اسکرول می‌شود. دو زون دو شیء هستند که روی صفحه قرار دارند، نه یک پنل که به دو نیم تقسیم شده — چیزی که آن‌ها را از هم متمایز می‌کند، فضایی است که بین آن‌ها وجود دارد و `zone--panel` زمینی است که هر یک بر روی آن ایستاده است.'
section:
  split:
    title: 'یک تقسیم'
    description: 'یک ستون اندازه‌گیری شده، دیگری آنچه را که باقی مانده است می‌گیرد. اندازه با یک مرحله داده می‌شود و این اندازه خود زون است — از هیچ چیزی که درون آن باشد، به ارث نمی‌رسد.'
  scrollable:
    title: 'هر طرف به‌طور مستقل اسکرول می‌شود'
    description: 'یک زون قابل اسکرول چیزی است که Overflow را نگه می‌دارد، نه صفحه. یکی از این دو را اسکرول کنید و دیگری در جایی که است باقی می‌ماند، که دلیل اصلی شکل آن است.'
  vertical:
    title: 'یک هدر که اسکرول نمی‌شود'
    description: 'یک تقسیم عمودی: یک زون باریک به ارتفاع آنچه که نگه می‌دارد، و بدنه باقی‌مانده را می‌گیرد و زیر آن اسکرول می‌شود. این ترتیب یک پنل با یک نوار ابزار در بالای آن است.'
  wrap:
    title: 'زیر یک کف'
    description: 'با توجه به یک کف، زون انعطاف‌پذیر یک خط کامل را تصاحب می‌کند و ستون اندازه‌گیری شده به جای اینکه هر دو به هیچ تبدیل شوند، بالای آن حرکت می‌کند. پنجره را باریک کنید تا ببینید که چگونه جمع می‌شود.'
split:
  body: 'این طرف هر آنچه را که ستون اندازه‌گیری شده باقی می‌گذارد، می‌گیرد.'
scrollable:
  item: آیتم
  line: خط
vertical:
  action: ایجاد
wrap:
  body: 'زیر کف این زون، خطی از خود را می‌گیرد.'
