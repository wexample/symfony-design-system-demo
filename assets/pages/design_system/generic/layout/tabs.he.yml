  counts:
    title: 'כרטיסיות עם ספירה'
    description: 'כמה מתוך מה שהכרטיסיה מחזיקה, בסוף התווית. זו כמוסה ולא יותר — העבר `count` לצד התווית והכרטיסיה תמקם אותה. פריט ללא מפתח לא מראה כלום, שזה איך שכרטיסיה ללא מה לספור נשארת שקטה.'
