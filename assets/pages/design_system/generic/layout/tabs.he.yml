section:
  vue:
    title: 'כרטיסיות ב-vue'
    description: 'סרגל הטווינג הוא שורת קישורים והכתובת אומרת איזו אחת פתוחה. סרגל ה-vue רק מדווח על כך שביקשו כרטיסיה, אז משהו שסביבה מחזיק את התשובה — כאן, רכיב הדגמה.'
  breadcrumb:
    vue_description: 'התאום של ה-vue לוקח את הפריטים שלו כבר מפורטים: השרת מחזיק את טבלת המסלולים, אז הוא עונה עליה, ומה שעובר זה התשובה.'
    title: 'נתיב ניווט'
    description: 'מציג את מיקום המשתמש בתוך ההיררכיה. השתמש בחלק מהנתיב — העבר פריטים עם מסלול ותווית; הפריט האחרון תמיד מוצג ככעת.'
