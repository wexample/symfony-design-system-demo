~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Strefy
page_icon: 'ph:bold/columns'
intro: 'Dwupanelowe środowisko, na którym opiera się każdy widok eksploratora, edytora i szczegółów. Strefa nie ma własnej szerokości ani wysokości: to podział, w którym się znajduje, nadaje jej rozmiar, a każda strona przewija się osobno. Dwie strefy to dwa obiekty ułożone na stronie, a nie jeden panel przecięty na pół — tym, co je odróżnia, jest przestrzeń między nimi, a `zone--panel` to podstawa, na której każda z nich stoi.'
section:
  split:
    title: Podział
    description: 'Jedna kolumna o danym rozmiarze, druga zajmująca to, co zostało. Rozmiar jest określony przez krok i jest to rozmiar samej strefy — nie jest dziedziczony przez nic, co jest w niej zagnieżdżone.'
  scrollable:
    title: 'Każda strona przewija się osobno'
    description: 'Przewijalna strefa to ta, która przechowuje nadmiar, a nie strona. Przewiń jedną z tych dwóch, a druga zostaje na swoim miejscu, co jest głównym powodem tego kształtu.'
  vertical:
    title: 'Nagłówek, który się nie przewija'
    description: 'Podział w orientacji pionowej: wąska strefa ma wysokość tego, co zawiera, a ciało zajmuje resztę i przewija się pod nią. To układ panelu z paskiem narzędzi na górze.'
  wrap:
    title: 'Poniżej podłogi'
    description: 'Majac podłogę, elastyczna strefa zajmuje pełną linię, a kolumna o danym rozmiarze przesuwa się nad nią, zamiast obie być ściśnięte do zera. Zmniejsz okno, aby zobaczyć, jak się składa.'
split:
  body: 'Ta strona bierze to, co zostawia kolumna o danym rozmiarze.'
scrollable:
  item: Element
  line: Linia
vertical:
  action: Utwórz
wrap:
  body: 'Poniżej podłogi, którą ma ta strefa, zajmuje własną linię.'
