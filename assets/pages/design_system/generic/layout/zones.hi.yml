~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: क्षेत्र
page_icon: 'ph:bold/columns'
intro: 'दो-पैन वाला कार्यक्षेत्र जिस पर हर अन्वेषक, संपादक और विवरण दृश्य बनाया गया है। एक क्षेत्र की अपनी कोई चौड़ाई और ऊँचाई नहीं होती: जिस विभाजन में यह बैठता है वही इसे आकार देता है, और प्रत्येक पक्ष अकेले स्क्रॉल करता है। दो क्षेत्र दो वस्तुएँ हैं जो पृष्ठ पर रखी गई हैं, न कि एक पैनल जो आधा कट गया है — जो उन्हें अलग करता है वह उनके बीच का स्थान है, और `zone--panel` वह आधार है जिस पर प्रत्येक खड़ा है।'
section:
  split:
    title: 'एक विभाजन'
    description: 'एक स्तंभ आकार का, दूसरा जो कुछ बचता है उसे लेता है। आकार एक कदम द्वारा दिया जाता है, और यह क्षेत्र का अपना है — यह इसके भीतर किसी भी निहित चीज़ द्वारा विरासत में नहीं लिया जाता।'
  scrollable:
    title: 'प्रत्येक पक्ष अकेले स्क्रॉल करता है'
    description: 'एक स्क्रॉल करने योग्य क्षेत्र वह है जो ओवरफ्लो को धारण करता है, न कि पृष्ठ। इनमें से एक को स्क्रॉल करें और दूसरा वहीं रहता है, जो आकार का पूरा कारण है।'
  vertical:
    title: 'एक शीर्षक जो स्क्रॉल नहीं करता'
    description: 'एक विभाजन जो ऊर्ध्वाधर हो गया है: एक संकीर्ण क्षेत्र उस ऊँचाई का होता है जो इसे धारण करता है, शरीर बाकी लेता है और इसके नीचे स्क्रॉल करता है। यह एक पैनल की व्यवस्था है जिसमें ऊपर एक टूलबार होता है।'
  wrap:
    title: 'एक फर्श के नीचे'
    description: 'एक फर्श दिए जाने पर, लचीला क्षेत्र एक पूर्ण रेखा का दावा करता है और आकारित स्तंभ इसके ऊपर चलता है बजाय इसके कि दोनों को कुछ भी नहीं होने के लिए निचोड़ दिया जाए। इसे मोड़ते हुए देखने के लिए विंडो को संकीर्ण करें।'
split:
  body: 'यह पक्ष उस आकारित स्तंभ द्वारा छोड़ी गई किसी भी चीज़ को लेता है।'
scrollable:
  item: आइटम
  line: लाइन
vertical:
  action: बनाएँ
wrap:
  body: 'फर्श के नीचे दिए गए इस क्षेत्र के लिए, यह अपनी एक रेखा लेता है।'
