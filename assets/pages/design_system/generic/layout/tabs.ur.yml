section:
  vue:
    title: 'Vue میں ٹیب'
    description: 'ٹویگ بار لنکس کی ایک قطار ہے اور ایڈریس یہ بتاتا ہے کہ کون سا کھلا ہے۔ Vue بار صرف یہ رپورٹ کرتی ہے کہ ایک ٹیپ کی درخواست کی گئی تھی، لہذا اس کے ارد گرد کچھ جواب رکھتا ہے — یہاں، ایک ڈیمو کمپوننٹ ہے۔'
  breadcrumb:
    vue_description: 'Vue ٹوئن اپنے آئٹمز پہلے ہی حل کر لیتا ہے: سرور راستہ ٹیبل رکھتا ہے، لہذا یہ جواب دیتا ہے، اور جو چیز پار کرتی ہے وہ جواب ہے۔'
    title: 'برڈ کرمب'
    description: 'یہ صارف کی درجہ بندی میں موجودگی کو ظاہر کرتا ہے۔ برڈ کرمب جزو استعمال کریں — راستہ اور لیبل کے ساتھ آئٹمز پاس کریں؛ آخری آئٹم ہمیشہ موجودہ کے طور پر دکھایا جاتا ہے۔'
