~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 탭
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'Vue의 탭'
    description: '트위그 바는 링크의 행이며, 주소는 어떤 링크가 열려 있는지를 나타냅니다. Vue 바는 탭이 요청되었다고만 보고하므로, 그 주위에 답이 있는 것입니다 — 여기서는 데모 컴포넌트입니다.'
  breadcrumb:
    vue_description: 'Vue 쌍은 이미 해결된 항목을 가져옵니다: 서버는 경로 테이블을 보유하므로 응답하고, 교차하는 것은 답입니다.'
    title: 브레드크럼
    description: '계층 내에서 사용자의 위치를 보여줍니다. 브레드크럼 부분을 사용하세요 — 경로와 레이블이 있는 항목을 전달하세요; 마지막 항목은 항상 현재로 렌더링됩니다.'
  tabs:
    title: 탭
  default:
    normal:
      title: '기본 탭'
    full:
      title: '기본 탭 (전체 너비)'
    half:
      title: '기본 탭 (절반 너비 구역)'
  counts:
    title: '카운트가 있는 탭'
    description: '탭이 보유하고 있는 항목의 수를 레이블 끝에 표시합니다. 이것은 알약이며 그 외에는 없습니다 — 레이블 옆에 `count`를 전달하면 탭이 그것을 배치합니다. 키가 없는 항목은 아무것도 표시하지 않으며, 이는 카운트할 것이 없는 탭이 조용하게 유지되는 방식입니다.'
  icons:
    normal:
      title: '아이콘이 있는 탭'
    full:
      title: '아이콘이 있는 탭 (전체 너비)'
    half:
      title: '아이콘이 있는 탭 (절반 너비 구역)'
breadcrumb:
  example:
    vue: Vue에서
    two_levels: '두 단계'
    three_levels: '세 단계'
  item:
    home: 홈
    layout: 레이아웃
    section: 블록
    current: 탐색
tab:
  one: 개요
  two: 활동
  three: 설정
vue:
  panel:
    one: '첫 번째 패널. 아무것도 가져오지 않았고 주소가 변경되지 않았습니다 — 바가 방출되었고, 홀더가 바뀌었습니다.'
    two: '두 번째 패널입니다.'
    three: '세 번째 패널입니다.'
