~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: '작업 공간'
page_icon: 'ph:bold/sidebar-simple'
intro: '이 페이지는 예시입니다: 당신이 읽고 있는 내용은 페이지의 본문에 나란히 배치된 세 개의 영역의 중앙에 위치하고 있습니다.'
section:
  gap:
    title: '간격은 구분선입니다'
    description: '두 영역 사이에 아무것도 그려지지 않습니다. 그들을 구분짓는 것은 그들 사이에 남기는 여백입니다. 이 여백을 통해 페이지는 메뉴와 헤더가 위치한 동일한 바닥을 보여줍니다. 각 영역은 항상 있었던 그 바닥을 가지고 있습니다.'
  each:
    title: '각각 독립적으로'
    description: '두 개의 열은 주어진 너비를 유지하고 가운데 열은 남은 공간을 차지합니다. 세 개 중 하나를 스크롤하면 나머지 두 개는 제자리에서 유지됩니다: 각 영역은 자체 오버플로우를 가지고 있으며 페이지는 어떤 것도 가지지 않습니다.'
    more: '하나의 영역은 이웃에 대해 아무것도 알지 못합니다. 왼쪽의 탐색기는 그 자체의 분할입니다 — 고정된 바와 그 아래로 스크롤되는 트리 — 그리고 페이지의 다른 곳에서도 같은 형태일 것입니다.'
  size:
    title: '하나의 크기 조정하기'
    description: '왼쪽 영역은 `zone-resizer`를 가지고 있습니다: 옆의 간격을 채우는 핸들이며, 아무것도 그리지 않습니다 — 커서는 움직인다고 말합니다. 드래그하거나 포커스를 주고 화살표를 사용하세요; 더블 클릭하면 페이지가 준 너비를 다시 영역에 돌려줍니다.'
    more: '핸들은 크기가 있는 영역을 크기 조정합니다 — 주어진 너비를 가지며 남은 것을 가져가는 것이 아닙니다 — 옆의 유연한 영역은 차이를 흡수합니다. 너비는 영역의 이름 아래에 기억되므로 페이지와 함께 돌아오며, 세 가지 레이아웃 모두에서 동일한 영역이 이동하기 때문에 여기에서 돌아옵니다.'
editor:
  state: 저장됨
inspector:
  title: 세부정보
  field:
    path:
      key: 경로
    size:
      key: 크기
    changed:
      key: 변경됨
      value: '3분 전'
