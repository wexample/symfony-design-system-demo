~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Välilehdet
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'Välilehdet vue:ssa'
    description: 'Twig-palkki on linkkien rivi, ja osoite kertoo, mikä niistä on auki. Vue-palkki ilmoittaa vain, että välilehteä on pyydetty, joten sen ympärillä oleva sisältö sisältää vastauksen — tässä, demo-komponentti.'
  breadcrumb:
    vue_description: 'Vue-kaksos ottaa esineensä jo ratkaistuna: palvelin pitää reittitaulua, joten se vastaa siihen, ja se, mikä ylittää, on vastaus.'
    title: Breadcrumb
    description: 'Näyttää käyttäjän sijainnin hierarkiassa. Käytä breadcrumb-osaa — siirrä esineet reitin ja labelin kanssa; viimeinen esine näytetään aina nykyisenä.'
  tabs:
    title: Välilehdet
  default:
    normal:
      title: Perusvälilehdet
    full:
      title: 'Perusvälilehdet (koko leveys)'
    half:
      title: 'Perusvälilehdet (puoliväli)'
  counts:
    title: 'Välilehdet laskurilla'
    description: 'Kuinka monta mitä tahansa välilehti sisältää, labelin lopussa. Se on pilleri eikä mitään muuta — siirrä `count` labelin viereen ja välilehti sijoittaa sen. Esine ilman avainta ei näytä mitään, joten tyhjällä laskurilla oleva välilehti pysyy hiljaa.'
  icons:
    normal:
      title: 'Välilehdet kuvakkeilla'
    full:
      title: 'Välilehdet kuvakkeilla (koko leveys)'
    half:
      title: 'Välilehdet kuvakkeilla (puoliväli)'
