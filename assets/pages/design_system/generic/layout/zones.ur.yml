~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: زونز
page_icon: 'ph:bold/columns'
intro: 'دو پین والا ورک اسپیس جس پر ہر ایک ایکسپلورر، ایڈیٹر اور تفصیل کا منظر بنایا گیا ہے۔ ایک زون کی اپنی کوئی چوڑائی اور اونچائی نہیں ہوتی: یہ جس تقسیم میں واقع ہے، وہی اس کا سائز طے کرتی ہے، اور ہر طرف اکیلا ہی سکرول ہوتا ہے۔ دو زونز دو اشیاء ہیں جو صفحے پر رکھی گئی ہیں، نہ کہ ایک پینل جو آدھا کٹا ہو — ان کو الگ کرنے والی چیز ان کے درمیان کا خلا ہے، اور `zone--panel` وہ زمین ہے جس پر ہر ایک کھڑا ہے۔'
section:
  split:
    title: 'ایک تقسیم'
    description: 'ایک کالم کا سائز، دوسرا باقی چیز لے رہا ہے۔ سائز ایک قدم سے دیا گیا ہے، اور یہ زون کا اپنا ہے — یہ اس کے اندر موجود کسی بھی چیز سے وراثت میں نہیں ملتا۔'
  scrollable:
    title: 'ہر طرف اکیلا سکرول ہوتا ہے'
    description: 'ایک سکرول ایبل زون وہ ہے جو اوور فلو کو سنبھالتا ہے، نہ کہ صفحہ۔ ان دونوں میں سے ایک کو سکرول کریں اور دوسرا اپنی جگہ پر رہے گا، جو کہ شکل کی پوری وجہ ہے۔'
  vertical:
    title: 'ایک ہیڈر جو سکرول نہیں ہوتا'
    description: 'ایک عمودی تقسیم: ایک پتلا زون وہ اونچائی ہے جو وہ رکھتا ہے، جسم باقی لیتا ہے اور اس کے نیچے سکرول ہوتا ہے۔ یہ ایک پینل کا انتظام ہے جس پر اوپر ایک ٹول بار ہوتا ہے۔'
  wrap:
    title: 'ایک فرش کے نیچے'
    description: 'ایک فرش دی گئی ہو تو، لچکدار زون ایک مکمل لائن کا دعوی کرتا ہے اور سائز والا کالم اس کے اوپر منتقل ہوتا ہے بجائے اس کے کہ دونوں کو کچھ بھی نہیں چھوڑا جائے۔ ونڈو کو تنگ کریں تاکہ یہ فولڈ ہوتا ہوا دیکھ سکیں۔'
split:
  body: 'یہ طرف وہ کچھ لیتی ہے جو سائز والا کالم چھوڑتا ہے۔'
scrollable:
  item: آئٹم
  line: لائن
vertical:
  action: 'تخلیق کریں'
wrap:
  body: 'فرش کے نیچے اس زون کو دی گئی، یہ اپنی ایک لائن لیتا ہے۔'
