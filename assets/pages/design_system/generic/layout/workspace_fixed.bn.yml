~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'স্থির প্রস্থ'
page_icon: 'ph:bold/arrows-in-line-horizontal'
intro: 'একই তিনটি অঞ্চল, কিন্তু আপনি যে অঞ্চলে আছেন সেটির একটি প্রস্থ নির্ধারণ করা হয়েছে, পরিবর্তে এটি একটি গ্রহণ করছে — এবং যেই প্রস্থ কেউ চায় না তা একটি খালি অঞ্চলে চলে যায়।'
section:
  sized:
    title: 'একটি অঞ্চলের প্রস্থ নির্ধারণ'
    description: '`zone--narrow` সাইজের ধাপ সহ: অঞ্চলটি ওই প্রস্থের এবং সেটি ওই প্রস্থে থাকে, জানালার যে কোনো জায়গা থাকা সত্ত্বেও। এটি কীভাবে একটি লেখাকে পাঠযোগ্য রাখা হয় — একটি কলাম যা স্ক্রীনের সাথে বেড়ে যায় সেটি আর একটি কলাম থাকে না।'
  slack:
    title: 'ফাঁকার উদ্দেশ্য কি'
    description: 'শেষ অঞ্চলটি কিছু ধারণ করে না, এবং তবুও সেটি তার স্থান ধরে রাখে: খালি মানে অনুপস্থিত নয়, এবং একটি অপেক্ষমাণ প্যান একটি প্যানের মতো পড়ে, একটি গর্তের মতো নয়। এটি তাদের প্রস্থটি নেয় যা সাইজযুক্তগুলি প্রত্যাখ্যান করে।'
    more: 'একটি বিভাজন অবশিষ্ট অংশটি যাদের প্রয়োজন তাদের কাছে দেয়। কিছু না চাওয়ার কারণে, সাইজযুক্ত অঞ্চলগুলি প্রসারিত বা প্রান্তে ঠেলানো হত; এর মাধ্যমে, তারা তাদের প্রস্থ বজায় রাখে এবং পৃষ্ঠা বাকি রাখে।'
work:
  size: 32rem
