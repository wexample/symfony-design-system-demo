fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: بلوک‌ها
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'زمین متعلق به بلوک است، تنها لبه پیشرو رنگ را حمل می‌کند.'
  section:
    corner_actions:
      title: 'عملیات در گوشه'
      description: '`has-corner-actions` بر روی یک فریم — یک لید، یک بلوک، یک کد بلوک، یک پیام — و اقدامات آیکون آن در `corner-actions` درون آن: در گوشه بالایی انتهای آن، در حالی که فریم به آن اشاره شده یا کلیدها را نگه داشته است، همیشه بر روی صفحه‌ای بدون نشانگر (`corner-actions--always` برای نمایش دائمی). یک فریم که متن جاری را در خود دارد، یک ستون را برای آنها خالی نگه می‌دارد.'
    tone:
      title: 'یک بلوک با یک رنگ'
      description: 'رنگ یک حالت — یا یک دسته — به عنوان نوار در لبه پیشرو، و هیچ چیز دیگر: همان ناری که یک پیام به دوش می‌کشد، بدون زمین رنگی، بنابراین فهرستی از آن‌ها به عنوان یک فهرست خوانده می‌شود و نه به عنوان یک هشدار. هر بلوکی این را می‌گیرد، ناری که بر روی یک بلوک ایستاده است شامل می‌شود.'
    default:
      title: 'بلوک‌های پایه'
    advanced:
      title: 'بلوک‌های پیشرفته'
    aside:
      title: 'ستون کناری ثابت'
      description: 'ستون باریکی بر اساس مقیاس --size، در کنار بدنه‌ای که عرض باقی‌مانده را جذب می‌کند.'
    card:
      title: کارت‌ها
    mark:
      title: 'یک علامت در گوشه'
      description: '`block--mark` یک آیکون کوچک را در گوشه بالایی ابتدای یک بلوک قرار می‌دهد: چه چیزی است — نوع یک کارت در یک دیاگرام، نوع یک سند —، در کنار آنچه می‌گوید، نه یک عنوان.'
    link:
      title: 'بلوک به عنوان یک لینک'
      description: 'کل کارت لینک است — برای انتخابی که با انتخاب یک کارت از چندین کارت انجام می‌شود: یک طرح، یک شاخه، یک الگو. این به عنوان متن خوانده می‌شود، نه به عنوان یک عمل محو؛ زیر نشانگر زمینش نوانس می‌گیرد و لبه‌اش محکم می‌شود، و کیبورد آن را با حلقه تمرکز که هر کنترل دارد پیدا می‌کند.'
    figure:
      title: شکل‌ها
