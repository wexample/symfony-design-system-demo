fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Blocs
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'le sol reste celui du bloc, seule la bordure avant porte la couleur.'
  section:
    corner_actions:
      title: 'Actions dans un coin'
      description: "`has-corner-actions` sur un cadre — un lead, un bloc, un bloc de code, un message — et ses actions d'icône dans un `corner-actions` à l'intérieur : dans le coin supérieur à sa fin, affiché lorsque le cadre est pointé ou maintient le clavier, toujours sur un écran sans pointeur (`corner-actions--always` pour les afficher de manière permanente). Un cadre contenant du texte en cours garde une colonne libre pour eux."
    tone:
      title: 'Un bloc portant un ton'
      description: "La couleur d'un état — ou d'une catégorie — sous forme de barre sur la bordure avant, et rien d'autre : la même barre qu'un message porte, sans le sol teinté, de sorte qu'une liste de ceux-ci se lit comme une liste et non comme une alarme. Tout bloc peut l'adopter, une barre se tenant sur un bloc inclus."
    default:
      title: 'Blocs de base'
    advanced:
      title: 'Blocs avancés'
    aside:
      title: 'Colonne latérale fixe'
      description: "Une colonne étroite dimensionnée sur l'échelle --size, à côté d'un corps qui absorbe la largeur restante."
    card:
      title: Cartes
    mark:
      title: 'Une marque dans le coin'
      description: "`block--mark` pose une petite icône dans le coin supérieur du début d'un bloc : ce qu'il est — le type d'une carte posée dans un schéma, la nature d'un document —, à côté de ce qu'il dit, pas un titre."
    link:
      title: 'Un bloc qui est un lien'
      description: "Toute la carte est le lien — pour un choix fait en sélectionnant une carte parmi plusieurs : un plan, une branche, un modèle. Cela se lit comme du texte, pas comme une action atténuée ; sous le pointeur, son sol prend une nuance et son bord se renforce, et le clavier le trouve par l'anneau de focus que chaque contrôle porte."
    figure:
      title: Figures
      description: 'Une seule valeur ou icône surdimensionnée, centrée. Utilisé pour les compteurs de tableau de bord et les tuiles de statut — ajoutez block--square pour garder la tuile carrée quelle que soit sa largeur.'
    key_figures:
      title: 'Chiffres clés'
      description: "Le chiffre lu comme le chiffre clé d'un tableau de bord : `block--figure--start` le place depuis le début de la ligne, l'étiquette au-dessus, la valeur avec son unité reculé (`block--figure-unit`), et une ligne en dessous disant de quoi il est composé (`block--figure-sub`). `block--tone-cat-<name>` dessine la barre de la catégorie le long du bord ; un `a.block--link` ouvre la vue du chiffre. Dans une `grid`, la ligne s'étend sur plusieurs lignes à mesure que la pièce se rétrécit."
    stacks:
      title: Empilements
    stack_horizontal:
      title: Horizontal
      description: 'Colonnes égales, pleine largeur, se replie en cas de débordement.'
    stack_vertical:
      title: Vertical
      description: 'Lignes empilées, pleine largeur, espacement uniforme.'
    stack_split:
      title: 'Scindé'
      description: 'Le premier enfant grandit, le dernier enfant reste fixe — utilisé pour les lignes de lead + action.'
    stack_nested:
      title: Imbriqué
      description: 'Empilement horizontal contenant des empilements verticaux — grille de tableau de bord typique.'
  stack:
