hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ब्लॉक
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'ज़मीन ब्लॉक की अपनी है, केवल अग्रणी किनारा रंग ले जाता है।'
  section:
    tone:
      title: 'एक टोन ले जाने वाला ब्लॉक'
      description: 'एक राज्य का रंग — या एक श्रेणी का — अग्रणी किनारे पर एक बार के रूप में, और कुछ नहीं: वही बार एक संदेश पहनता है, बिना रंगीन ज़मीन के, ताकि उनकी सूची एक सूची के रूप में पढ़ी जाए और अलार्म के रूप में नहीं। कोई भी ब्लॉक इसे ले सकता है, एक बार जो एक ब्लॉक पर खड़ा है।'
    default:
      title: 'बुनियादी ब्लॉक'
    advanced:
      title: 'उन्नत ब्लॉक'
    aside:
      title: 'फिक्स्ड साइड कॉलम'
      description: 'एक संकीर्ण कॉलम जो --size स्केल पर माप लिया गया है, एक शरीर के बगल में जो शेष चौड़ाई को अवशोषित करता है।'
    card:
      title: कार्ड
    link:
      title: 'एक लिंक होने वाला ब्लॉक'
      description: 'पूरा कार्ड लिंक है — एक विकल्प के लिए जो कई कार्ड में से एक को चुनने से बनाया गया है: एक योजना, एक शाखा, एक टेम्पलेट। यह पाठ के रूप में पढ़ता है, मौन क्रिया के रूप में नहीं; पॉइंटर के तहत इसकी ज़मीन एक बारीकी लेती है और इसका किनारा मजबूत हो जाता है, और कीबोर्ड इसे हर नियंत्रण द्वारा पहचाने जाने वाले फोकस रिंग से ढूंढता है।'
    figure:
      title: आकृतियाँ
      description: 'एक एकल ओवरसाइज़्ड मान या आइकन, केंद्रित। डैशबोर्ड काउंटर और स्थिति टाइल के लिए उपयोग किया जाता है — टाइल को चौकोर रखने के लिए block--square जोड़ें चाहे इसकी चौड़ाई कोई भी हो।'
    stacks:
      title: स्टैक
    stack_horizontal:
      title: क्षैतिज
      description: 'समान कॉलम, पूर्ण चौड़ाई, ओवरफ्लो पर लपेटता है।'
    stack_vertical:
      title: ऊर्ध्वाधर
      description: 'स्टैक्ड पंक्तियाँ, पूर्ण चौड़ाई, समान गैप।'
    stack_split:
      title: विभाजित
      description: 'पहला बच्चा बढ़ता है, अंतिम बच्चा स्थिर रहता है — लीड + क्रिया पंक्तियों के लिए उपयोग किया जाता है।'
    stack_nested:
      title: 'जुड़ा हुआ'
      description: 'क्षैतिज स्टैक जिसमें ऊर्ध्वाधर स्टैक होते हैं — सामान्य डैशबोर्ड ग्रिड।'
  stack:
    item:
      one: एक
      two: दो
      three: तीन
      four: चार
      lead: 'इस लीड टेक्स्ट में क्रिया का वर्णन करें।'
      action: क्रिया
  block:
    title: 'ब्लॉक शीर्षक'
    no_padding: 'पैडिंग के बिना ब्लॉक (block--body का उपयोग करते हुए)।'
    one:
      title: 'प्राथमिक ब्लॉक'
      description: 'एक ब्लॉक जिसमें शीर्षक और शरीर का पाठ हो।'
    two:
      title: 'द्वितीयक ब्लॉक'
      description: 'स्पेसिंग प्रदर्शित करने के लिए एक और ब्लॉक।'
    three:
      title: 'तृतीयक ब्लॉक'
      description: 'पंक्ति में एक तीसरा ब्लॉक।'
    four:
      title: 'चतुर्थक ब्लॉक'
      description: 'लेआउट डेमो के लिए एक चौथा ब्लॉक।'
    advanced:
      title: 'पाइपलाइन प्रक्षिप्ति'
      status: तैयार
      description: 'यह ब्लॉक शीर्षक स्लॉट और सामग्री को एकल पुन: प्रयोज्य संरचना में संयोजित करता है।'
      details: 'ऑपरेटर बिना वर्तमान संदर्भ छोड़े जोड़े जा सकते हैं।'
    zones:
      main:
        title: 'मुख्य क्षेत्र'
        description: 'मुख्य सामग्री प्राकृतिक रूप से मानक स्पेसिंग के साथ बढ़ सकती है।'
      aside:
        title: 'साइड क्षेत्र'
        description: 'यह साइड क्षेत्र हल्के पृष्ठभूमि का उपयोग करता है ताकि पूरक सामग्री को उजागर किया जा सके।'
    zones_three:
      title: 'तीन-क्षेत्र लेआउट'
      status: ड्राफ्ट
      left:
        title: 'बाईं पैनल'
        description: 'माध्यमिक नेविगेशन या मेटाडेटा यहां रह सकता है।'
      main:
        title: 'मुख्य सामग्री'
        description: 'प्राथमिक जानकारी पठनीयता के लिए केंद्रित रहती है।'
      right:
        title: 'दाईं पैनल'
        description: 'संदर्भ कार्य और अंतर्दृष्टियाँ इस पक्ष पर समूहित की जा सकती हैं।'
      footer:
        meta: '2 मिनट पहले अपडेट किया गया'
        action: 'विवरण खोलें'
  figure:
    projections: प्रक्षिप्तियाँ
    uptime: अपटाइम
    status: सीधा
    framed:
      title: थ्रूपुट
      label: 'प्रति सेकंड घटनाएँ'
  tab:
    one: अवलोकन
    two: गतिविधि
    three: सेटिंग्स
  button:
    create: 'प्रक्षिप्ति बनाएँ'
    refresh: 'डेटा ताज़ा करें'
    export: 'निर्यात करें'
  action:
    add_projection: 'प्रक्षिप्ति जोड़ें'
  link:
    starter:
      title: स्टार्टर
      description: 'एक व्यक्ति, आवश्यकताएँ, कुछ भी भुगतान करने की आवश्यकता नहीं।'
    team:
      title: टीम
      description: 'कुछ लोग एक ही चीज़ों पर काम कर रहे हैं।'
    company:
      title: कंपनी
      description: 'हर टीम, जिनके पास एक संगठन के लिए आवश्यक नियंत्रण हैं।'

