nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Blokken
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'de grond blijft van het blok zelf, alleen de voorrand draagt de kleur.'
  section:
    corner_actions:
      title: 'Acties in een hoek'
      description: '`has-corner-actions` op een frame — een lead, een blok, een codeblok, een bericht — en zijn pictogramacties in een `corner-actions` erin: in de bovenste hoek aan het einde, getoond terwijl het frame wordt aangewezen of de toetsenbord vasthoudt, altijd op een scherm zonder aanwijzer (`corner-actions--always` om ze permanent te tonen). Een frame met lopende tekst houdt een kolom vrij voor hen.'
    tone:
      title: 'Een blok met een toon'
      description: 'De kleur van een staat — of van een categorie — als een balk aan de voorrand, en verder niets: dezelfde balk die een bericht draagt, zonder de gekleurde achtergrond, zodat een lijst van hen als een lijst leest en niet als een alarm. Elk blok kan het dragen, inclusief een balk die op een blok staat.'
    default:
      title: Basisblokken
    advanced:
      title: 'Geavanceerde blokken'
    aside:
      title: 'Vaste zijkolom'
      description: 'Een smalle kolom van de --grootte schaal, naast een lichaam dat de resterende breedte opneemt.'
    card:
      title: Kaarten
    mark:
      title: 'Een markering in de hoek'
      description: '`block--mark` plaatst een klein pictogram in de bovenste hoek aan het begin van een blok: wat het is — het type van een kaart gelegd in een diagram, het soort document —, naast wat het zegt, geen titel.'
    link:
      title: 'Een blok dat een link is'
      description: 'De hele kaart is de link — voor een keuze gemaakt door één kaart uit meerdere te kiezen: een plan, een tak, een sjabloon. Het leest als tekst, niet als een gedempte actie; onder de aanwijzer krijgt de achtergrond een nuance en verstevigt de rand, en het toetsenbord vindt het door de focusring die elke controle heeft.'
    figure:
      title: Cijfers
      description: 'Een enkele vergrote waarde of icoon, gecentreerd. Gebruikt voor dashboard tellers en status tegels — voeg block--square toe om de tegel vierkant te houden, ongeacht de breedte.'
    key_figures:
      title: Kerncijfers
      description: 'Het cijfer gelezen als een kerncijfer van een dashboard: `block--figure--start` legt het vanaf het begin van de regel, het label erboven, de waarde met zijn eenheid naar achteren gezet (`block--figure-unit`), en een regel eronder die zegt waar het uit bestaat (`block--figure-sub`). `block--tone-cat-<name>` tekent de balk van de categorie langs de rand; een `a.block--link` opent het zicht op het cijfer. In een `grid` gaat de rij naar meerdere regels naarmate de ruimte smaller wordt.'
    stacks:
      title: Stapels
    stack_horizontal:
      title: Horizontaal
      description: 'Gelijke kolommen, volledige breedte, wikkelt bij overloop.'
    stack_vertical:
      title: Verticaal
      description: 'Gestapelde rijen, volledige breedte, uniforme ruimte.'
    stack_split:
      title: Gesplitst
      description: 'Eerste kind groeit, laatste kind blijft vast — gebruikt voor lead + actie rijen.'
    stack_nested:
