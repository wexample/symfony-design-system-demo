en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Blocks
  page_icon: ph:bold/squares-four

  tone:
    body: the ground stays the block's own, only the leading edge carries the colour.

  section:
    corner_actions:
      title: Actions in a corner
      description: "`has-corner-actions` on a frame — a lead, a block, a code block, a message — and its icon actions in a `corner-actions` inside it: in the top corner at its end, shown while the frame is pointed at or holds the keyboard, always on a screen without a pointer (`corner-actions--always` to show them for good). A frame holding running text keeps a column free for them."
    tone:
      title: A block carrying a tone
      description: "The colour of a state — or of a category — as a bar down the leading edge, and nothing else: the same bar a message wears, without the tinted ground, so a list of them reads as a list and not as an alarm. Any block takes it, a bar standing on a block included."
    default:
      title: Basic blocks
    advanced:
      title: Advanced blocks
    aside:
      title: Fixed aside column
      description: A narrow column sized on the --size scale, next to a body that absorbs the remaining width.
    card:
      title: Cards
    link:
      title: A block that is a link
      description: "The whole card is the link — for a choice made by picking one card among several: a plan, a branch, a template. It reads as text, not as a muted action; under the pointer its ground takes a nuance and its edge firms up, and the keyboard finds it by the focus ring every control wears."
    figure:
      title: Figures
      description: A single oversized value or icon, centered. Used for dashboard counters and status tiles — add block--square to keep the tile square whatever its width.
    stacks:
      title: Stacks
    stack_horizontal:
      title: Horizontal
      description: Equal columns, full width, wraps on overflow.
    stack_vertical:
      title: Vertical
      description: Stacked rows, full width, uniform gap.
    stack_split:
      title: Split
      description: First child grows, last child stays fixed — used for lead + action rows.
    stack_nested:
      title: Nested
      description: Horizontal stack containing vertical stacks — typical dashboard grid.

  stack:
    item:
      one: One
      two: Two
      three: Three
      four: Four
      lead: Describe the action in this lead text.
      action: Action

  block:
    title: Block title
    no_padding: Block without padding (using block--body).
    one:
      title: Primary block
      description: A block with a title and body text.
    two:
      title: Secondary block
      description: Another block to demonstrate spacing.
    three:
      title: Tertiary block
      description: A third block in the row.
    four:
      title: Quaternary block
      description: A fourth block for the layout demo.
    advanced:
      title: Pipeline projection
      status: Ready
      description: This block combines title slots and content in a single reusable structure.
      details: Operators can be added without leaving the current context.
    zones:
      main:
        title: Main zone
        description: Main content can grow naturally with standard spacing.
      aside:
        title: Aside zone
        description: This side zone uses a light background to highlight complementary content.
    zones_three:
      title: Three-zone layout
      status: Draft
      left:
        title: Left panel
        description: Secondary navigation or metadata can live here.
      main:
        title: Main content
        description: Primary information stays centered for readability.
      right:
        title: Right panel
        description: Contextual actions and insights can be grouped on this side.
      footer:
        meta: Updated 2 minutes ago
        action: Open details

  figure:
    projections: Projections
    uptime: Uptime
    status: Live
    framed:
      title: Throughput
      label: Events per second

  tab:
    one: Overview
    two: Activity
    three: Settings

  button:
    create: Create projection
    refresh: Refresh data
    export: Export

  action:
    add_projection: Add projection

  link:
    starter:
      title: Starter
      description: One person, the essentials, nothing to pay.
    team:
      title: Team
      description: A few people working on the same things.
    company:
      title: Company
      description: Every team, with the controls an organisation asks for.

  corner_actions:
    lead: This lead can be copied with the button in its corner.
    block: A block with two actions in its corner, out of the way until it is pointed at.
    edit: Edit
    open: Open whole

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: كتل
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'الأرض تبقى خاصة بالكتلة، فقط الحافة الأمامية تحمل اللون.'
  section:
    tone:
      title: 'كتلة تحمل نغمة'
      description: 'لون الحالة — أو الفئة — كخط في الحافة الأمامية، ولا شيء آخر: نفس الخط الذي ترتديه الرسالة، دون الأرض الملونة، بحيث تقرأ قائمة منها كقائمة وليس كإنذار. أي كتلة تأخذها، بما في ذلك الخط الذي يقف على كتلة.'
    default:
      title: 'كتل أساسية'
    advanced:
      title: 'كتل متقدمة'
    aside:
      title: 'عمود جانبي ثابت'
      description: 'عمود ضيق مقاس على مقياس --size، بجانب جسم يمتص العرض المتبقي.'
    card:
      title: بطاقات
    link:
      title: 'كتلة هي رابط'
      description: 'البطاقة بأكملها هي الرابط — لاختيار تم عن طريق اختيار بطاقة واحدة من عدة: خطة، فرع، نموذج. تقرأ كنص، وليس كإجراء مموه؛ تحت المؤشر تأخذ أرضيتها تدرجًا وتشتد حافتها، ويجدها لوحة المفاتيح بواسطة حلقة التركيز التي يرتديها كل تحكم.'
    figure:
      title: أرقام
      description: 'قيمة أو أيقونة واحدة كبيرة، في المنتصف. تستخدم لعدادات لوحة التحكم وبلاطات الحالة — أضف block--square للحفاظ على البلاط مربعًا بغض النظر عن عرضه.'
    stacks:
      title: تكديس
    stack_horizontal:
      title: أفقي
      description: 'أعمدة متساوية، بعرض كامل، تلتف عند تجاوز الحد.'
    stack_vertical:
      title: عمودي
      description: 'صفوف مكدسة، بعرض كامل، بفجوة متساوية.'
    stack_split:
      title: منقسم
      description: 'ينمو العنصر الأول، ويبقى العنصر الأخير ثابتًا — يستخدم لصفوف القيادة + الإجراءات.'
    stack_nested:
      title: متداخل
      description: 'تكديس أفقي يحتوي على تكديس عمودي — شبكة لوحة التحكم النموذجية.'
  stack:
    item:
      one: واحد
      two: اثنان
      three: ثلاثة
      four: أربعة
      lead: 'صف الإجراء في نص هذا العنوان.'
      action: إجراء
  block:
    title: 'عنوان الكتلة'
    no_padding: 'كتلة بدون حشوة (تستخدم block--body).'
    one:
      title: 'الكتلة الرئيسية'
      description: 'كتلة بعنوان ونص جسم.'
    two:
      title: 'الكتلة الثانوية'
      description: 'كتلة أخرى لتوضيح المسافة.'
    three:
      title: 'الكتلة الثالثة'
      description: 'كتلة ثالثة في الصف.'
    four:
      title: 'الكتلة الرابعة'
      description: 'كتلة رابعة لعرض التخطيط.'
    advanced:
      title: 'عرض خط الأنابيب'
      status: جاهز
      description: 'تجمع هذه الكتلة بين فتحات العناوين والمحتوى في هيكل قابل لإعادة الاستخدام.'
      details: 'يمكن إضافة المشغلين دون مغادرة السياق الحالي.'
    zones:
      main:
        title: 'المنطقة الرئيسية'
        description: 'يمكن أن ينمو المحتوى الرئيسي بشكل طبيعي مع تباعد قياسي.'
      aside:
        title: 'منطقة جانبية'
        description: 'تستخدم هذه المنطقة الجانبية خلفية فاتحة لتسليط الضوء على المحتوى التكميلي.'
    zones_three:
      title: 'تخطيط ثلاث مناطق'
      status: مسودة
      left:
        title: 'اللوحة اليسرى'
        description: 'يمكن أن تعيش هنا الملاحة الثانوية أو البيانات الوصفية.'
      main:
        title: 'المحتوى الرئيسي'
        description: 'تظل المعلومات الأساسية مركزة لسهولة القراءة.'
      right:
        title: 'اللوحة اليمنى'
        description: 'يمكن تجميع الإجراءات والأفكار السياقية على هذا الجانب.'
      footer:
        meta: 'تم التحديث منذ دقيقتين'
        action: 'فتح التفاصيل'
  figure:
    projections: التوقعات
    uptime: 'مدة التشغيل'
    status: مباشر
    framed:
      title: 'معدل الإنتاجية'
      label: 'الأحداث في الثانية'
  tab:
    one: 'نظرة عامة'
    two: نشاط
    three: الإعدادات
  button:
    create: 'إنشاء توقع'
    refresh: 'تحديث البيانات'
    export: تصدير
  action:
    add_projection: 'إضافة توقع'
  link:
    starter:
      title: المبتدئ
      description: 'شخص واحد، الأساسيات، لا شيء للدفع.'
    team:
      title: الفريق
      description: 'بعض الأشخاص يعملون على نفس الأمور.'
    company:
      title: الشركة
      description: 'كل فريق، مع الضوابط التي تطلبها المؤسسة.'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ব্লক
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'মাটিটি ব্লকের নিজস্ব, শুধুমাত্র নেতৃত্বকারী প্রান্তটি রঙ ধারণ করে।'
  section:
    tone:
      title: 'একটি টোন ধারণকারী ব্লক'
      description: 'একটি অবস্থার — অথবা একটি শ্রেণীর — রঙ একটি বার হিসেবে নেতৃত্বকারী প্রান্তে, এবং কিছুই নয়: একই বার একটি বার্তা ধারণ করে, রঙহীন মাটির ছাড়া, তাই তাদের একটি তালিকা হিসেবে পড়া হয় এবং সতর্কতা হিসেবে নয়। যে কোনো ব্লক এটি গ্রহণ করে, একটি ব্লক দাঁড়িয়ে থাকা একটি বার অন্তর্ভুক্ত।'
    default:
      title: 'মূল ব্লক'
    advanced:
      title: 'উন্নত ব্লক'
    aside:
      title: 'স্থির পাশের কলাম'
      description: 'একটি সংকীর্ণ কলাম --সাইজ স্কেলে মাপা, একটি দেহের পাশে যা বাকি প্রস্থ শোষণ করে।'
    card:
      title: কার্ড
    link:
      title: 'একটি ব্লক যা একটি লিঙ্ক'
      description: 'পুরো কার্ডটি লিঙ্ক — একাধিক কার্ডের মধ্যে একটি বেছে নিয়ে একটি পছন্দের জন্য: একটি পরিকল্পনা, একটি শাখা, একটি টেমপ্লেট। এটি পাঠ্য হিসেবে পড়া হয়, একটি ম্লান ক্রিয়ার মতো নয়; পয়েন্টারের নিচে এর মাটি একটি সূক্ষ্মতা নেয় এবং এর প্রান্ত দৃঢ় হয়, এবং কীবোর্ড এটিকে ফোকাস রিং দ্বারা খুঁজে পায় যা প্রতিটি নিয়ন্ত্রণ ধারণ করে।'
    figure:
      title: ফিগার
      description: 'একটি একক বড় মান বা আইকন, কেন্দ্রীভূত। ড্যাশবোর্ড কাউন্টার এবং স্ট্যাটাস টাইলের জন্য ব্যবহৃত হয় — টাইলটিকে স্কোয়ার রাখতে block--square যোগ করুন যেকোনো প্রস্থে।'
    stacks:
      title: স্ট্যাক
    stack_horizontal:
      title: অনুভূমিক
      description: 'সমান কলাম, পূর্ণ প্রস্থ, ওভারফ্লোতে মোড়ানো।'
    stack_vertical:
      title: উল্লম্ব
      description: 'স্ট্যাক করা সারি, পূর্ণ প্রস্থ, সমান ফাঁক।'
    stack_split:
      title: বিচ্ছেদ
      description: 'প্রথম সন্তান বৃদ্ধি পায়, শেষ সন্তান স্থির থাকে — নেতৃত্ব + ক্রিয়ার সারির জন্য ব্যবহৃত।'
    stack_nested:
      title: নেস্টেড
      description: 'অনুভূমিক স্ট্যাক যা উল্লম্ব স্ট্যাক ধারণ করে — সাধারণ ড্যাশবোর্ড গ্রিড।'
  stack:
    item:
      one: একটি
      two: দুটি
      three: তিনটি
      four: চারটি
      lead: 'এই লিড টেক্সটে ক্রিয়াটি বর্ণনা করুন।'
      action: ক্রিয়া
  block:
    title: 'ব্লক শিরোনাম'
    no_padding: 'প্যাডিং ছাড়া ব্লক (block--body ব্যবহার করে)।'
    one:
      title: 'প্রাথমিক ব্লক'
      description: 'একটি শিরোনাম এবং দেহের টেক্সট সহ একটি ব্লক।'
    two:
      title: 'দ্বিতীয় ব্লক'
      description: 'স্পেসিং প্রদর্শনের জন্য আরেকটি ব্লক।'
    three:
      title: 'তৃতীয় ব্লক'
      description: 'সারিতে একটি তৃতীয় ব্লক।'
    four:
      title: 'চতুর্থ ব্লক'
      description: 'লেআউট প্রদর্শনের জন্য একটি চতুর্থ ব্লক।'
    advanced:
      title: 'পাইপলাইন প্রকল্প'
      status: প্রস্তুত
      description: 'এই ব্লকটি একটি একক পুনরায় ব্যবহারযোগ্য কাঠামোতে শিরোনাম স্লট এবং বিষয়বস্তু একত্রিত করে।'
      details: 'অপারেটরগুলো বর্তমান প্রসঙ্গ ছাড়াই যোগ করা যেতে পারে।'
    zones:
      main:
        title: 'মুখ্য অঞ্চল'
        description: 'মুখ্য বিষয়বস্তু স্বাভাবিকভাবে মানক স্পেসিং সহ বৃদ্ধি পেতে পারে।'
      aside:
        title: 'পাশের অঞ্চল'
        description: 'এই পাশের অঞ্চলটি সম্পূরক বিষয়বস্তু হাইলাইট করতে একটি হালকা পটভূমি ব্যবহার করে।'
    zones_three:
      title: 'তিন-জোন লেআউট'
      status: ড্রাফট
      left:
        title: 'বাম প্যানেল'
        description: 'গৌণ নেভিগেশন বা মেটাডেটা এখানে থাকতে পারে।'
      main:
        title: 'মুখ্য বিষয়বস্তু'
        description: 'প্রাথমিক তথ্য পাঠযোগ্যতার জন্য কেন্দ্রীভূত থাকে।'
      right:
        title: 'ডান প্যানেল'
        description: 'প্রেক্ষাপটের ক্রিয়া এবং অন্তর্দৃষ্টি এই পাশে গ্রুপ করা যেতে পারে।'
      footer:
        meta: '২ মিনিট আগে আপডেট হয়েছে'
        action: 'বিস্তারিত খুলুন'
  figure:
    projections: প্রকল্প
    uptime: আপটাইম
    status: লাইভ
    framed:
      title: থ্রুপুট
      label: 'প্রতি সেকেন্ডে ইভেন্ট'
  tab:
    one: সারসংক্ষেপ
    two: ক্রিয়াকলাপ
    three: সেটিংস
  button:
    create: 'প্রকল্প তৈরি করুন'
    refresh: 'তথ্য রিফ্রেশ করুন'
    export: 'রপ্তানি করুন'
  action:
    add_projection: 'প্রকল্প যোগ করুন'
  link:
    starter:
      title: স্টার্টার
      description: 'একজন ব্যক্তি, মৌলিক বিষয়, কোনো অর্থ প্রদান নেই।'
    team:
      title: দল
      description: 'একই বিষয়গুলোর উপর কয়েকজন কাজ করছে।'
    company:
      title: কোম্পানি
      description: 'প্রতিটি দল, সংগঠনের জন্য প্রয়োজনীয় নিয়ন্ত্রণ সহ।'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Blöcke
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'Der Boden gehört zum Block, nur die Vorderkante trägt die Farbe.'
  section:
    tone:
      title: 'Ein Block mit einem Ton'
      description: 'Die Farbe eines Zustands — oder einer Kategorie — als Leiste an der Vorderkante, und nichts anderes: dieselbe Leiste, die eine Nachricht trägt, ohne den gefärbten Hintergrund, damit eine Liste von ihnen als Liste und nicht als Alarm gelesen wird. Jeder Block kann es tragen, auch eine Leiste, die auf einem Block steht.'
    default:
      title: Basisblöcke
    advanced:
      title: 'Erweiterte Blöcke'
    aside:
      title: 'Feststehende Seitenleiste'
      description: 'Eine schmale Spalte, die nach der --Größenskala dimensioniert ist, neben einem Hauptinhalt, der die verbleibende Breite aufnimmt.'
    card:
      title: Karten
    link:
      title: 'Ein Block, der ein Link ist'
      description: 'Die gesamte Karte ist der Link — für eine Auswahl, die durch das Auswählen einer Karte aus mehreren getroffen wird: ein Plan, ein Zweig, eine Vorlage. Es wird als Text gelesen, nicht als eine gedämpfte Aktion; unter dem Zeiger nimmt der Hintergrund einen Farbton an und die Kante wird fester, und die Tastatur findet es durch den Fokusring, den jede Steuerung trägt.'
    figure:
      title: Zahlen
