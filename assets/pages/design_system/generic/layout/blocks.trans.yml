tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Bloklar
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'Zemin bloğun kendine ait kalır, yalnızca ön kenar renk taşır.'
  section:
    corner_actions:
      title: 'Köşedeki işlemler'
      description: "`has-corner-actions` bir çerçevede — bir başlık, bir blok, bir kod bloğu, bir mesaj — ve içindeki `corner-actions`'da simgeleri: çerçevenin sonunda üst köşede, çerçeveye işaret edilirken veya klavye tutarken gösterilir, her zaman işaretçi olmayan bir ekranda (`corner-actions--always` ile sürekli gösterilir). Çalışan metni tutan bir çerçeve, bunlar için bir sütunu boş bırakır."
