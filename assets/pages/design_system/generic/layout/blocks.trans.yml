ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: بلوک
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'زمین بلاک کی اپنی ہوتی ہے، صرف آگے کی کنارہ رنگ لے کر چلتا ہے۔'
  section:
    corner_actions:
      title: 'کونے میں کارروائیاں'
      description: '`has-corner-actions` ایک فریم پر — ایک لیڈ، ایک بلاک، ایک کوڈ بلاک، ایک پیغام — اور اس کے آئیکن کی کارروائیاں ایک `corner-actions` میں: اوپر کے کونے میں اس کے آخر پر، جب فریم کی طرف اشارہ کیا جائے یا کی بورڈ پکڑا جائے تو ظاہر ہوتا ہے، ہمیشہ ایک اسکرین پر بغیر پوائنٹر کے (`corner-actions--always` انہیں مستقل دکھانے کے لئے)۔ ایک فریم جو چلتی ہوئی تحریر کو رکھتا ہے ان کے لئے ایک کالم خالی رکھتا ہے۔'
    tone:
      title: 'ایک ٹون والا بلاک'
      description: 'ایک ریاست کا رنگ — یا ایک زمرہ — جو آگے کی کنارہ پر ایک بار کے طور پر ہوتا ہے، اور کچھ نہیں: وہی بار جسے ایک پیغام پہنتا ہے، بغیر رنگین زمین کے، تاکہ ان کی فہرست ایک فہرست کی طرح پڑھی جائے نہ کہ ایک الارم کی طرح۔ کوئی بھی بلاک اسے لیتا ہے، ایک بار جو کہ ایک بلاک پر کھڑا ہوتا ہے۔'
    default:
      title: 'بنیادی بلاک'
    advanced:
      title: 'ایڈوانس بلاک'
    aside:
      title: 'فکسڈ سائیڈ کالم'
      description: 'ایک تنگ کالم جو --size سکیل پر سائز کیا گیا ہے، ایک جسم کے ساتھ جو باقی چوڑائی کو جذب کرتا ہے۔'
    card:
      title: کارڈ
    mark:
      title: 'کونے میں ایک نشان'
      description: '`block--mark` ایک بلاک کے شروع میں اوپر کے کونے میں ایک چھوٹا آئیکن رکھتا ہے: یہ کیا ہے — ایک ڈایاگرام میں رکھی گئی کارڈ کی قسم، ایک دستاویز کی نوعیت —، جو یہ کہتا ہے اس کے ساتھ، کوئی عنوان نہیں۔'
    link:
      title: 'ایک بلاک جو لنک ہے'
      description: 'پورا کارڈ لنک ہے — ایک انتخاب کے لیے جو کئی کارڈز میں سے ایک کارڈ منتخب کرنے سے ہوتا ہے: ایک منصوبہ، ایک شاخ، ایک ٹیمپلیٹ۔ یہ متن کی طرح پڑھتا ہے، نہ کہ ایک مدھم عمل کی طرح؛ پوائنٹر کے نیچے اس کی زمین ایک نکتہ لے لیتی ہے اور اس کا کنارہ مضبوط ہو جاتا ہے، اور کی بورڈ ہر کنٹرول پر موجود توجہ کی انگوٹی سے اسے تلاش کرتا ہے۔'
    figure:
      title: شکلیں
      description: 'ایک واحد بڑا قیمت یا آئیکن، درمیان میں۔ ڈیش بورڈ کاؤنٹرز اور اسٹیٹس ٹائلز کے لیے استعمال ہوتا ہے — بلاک--سکوائر شامل کریں تاکہ ٹائل سکوائر رہے چاہے اس کی چوڑائی کچھ بھی ہو۔'
    key_figures:
      title: 'اہم اعداد و شمار'
      description: 'اعداد و شمار جو ڈیش بورڈ کے اہم اعداد و شمار کے طور پر پڑھی جاتی ہیں: `block--figure--start` اسے لائن کے آغاز سے رکھتا ہے، لیبل اوپر، قیمت اپنے یونٹ کے ساتھ پیچھے سیٹ کی جاتی ہے (`block--figure-unit`)، اور اس کے نیچے ایک لائن ہوتی ہے جو بتاتی ہے کہ یہ کس چیز سے بنی ہے (`block--figure-sub`)۔ `block--tone-cat-<name>` زمرے کی بار کو کنارے کے نیچے کھینچتا ہے؛ ایک `a.block--link` اعداد و شمار کا منظر کھولتا ہے۔ ایک `grid` میں، صف کئی لائنوں میں چلی جاتی ہے جب کمرہ تنگ ہوتا ہے۔'
    stacks:
      title: اسٹیکس
    stack_horizontal:
      title: افقی
      description: 'برابر کالم، مکمل چوڑائی، اوور فلو پر لپیٹتا ہے۔'
    stack_vertical:
      title: عمودی
      description: 'اسٹیکڈ قطاریں، مکمل چوڑائی، یکساں خلا۔'
    stack_split:
      title: تقسیم
      description: 'پہلا بچہ بڑھتا ہے، آخری بچہ مقرر رہتا ہے — لیڈ + عمل کی قطاروں کے لیے استعمال ہوتا ہے۔'
    stack_nested:
      title: گھوںسلا
      description: 'افقی اسٹیک جو عمودی اسٹیکوں پر مشتمل ہے — عام ڈیش بورڈ گرڈ۔'
  stack:
    item:
      one: ایک
      two: دو
      three: تین
      four: چار
      lead: 'اس لیڈ متن میں عمل کی وضاحت کریں۔'
      action: عمل
  block:
    title: 'بلاک کا عنوان'
    no_padding: 'بغیر پیڈنگ کا بلاک (block--body کا استعمال کرتے ہوئے)۔'
    one:
      title: 'پرائمری بلاک'
      description: 'ایک بلاک جس میں عنوان اور جسم کا متن ہے۔'
    two:
      title: 'سیکنڈری بلاک'
      description: 'ایک اور بلاک جو جگہ کی نمائش کے لیے ہے۔'
    three:
