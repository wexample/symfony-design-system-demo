zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 区块
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 地面保持区块自身，只有前缘带有颜色。
  section:
    corner_actions:
      title: 角落中的操作
      description: '在框架上使用`has-corner-actions` — 一个引导框、一个块、一段代码块或一条消息 — 以及它的图标操作在其中的`corner-actions`：在框架的末尾的顶部角落，指向该框架或持有键盘时显示，在没有指针的屏幕上始终可见（使用`corner-actions--always`始终显示）。一个包含运行文本的框架保持一列空白以供它们使用。'
    tone:
      title: 带有色调的区块
      description: 一种状态或类别的颜色——作为前缘下的条形，除此之外没有其他：这个条形与信息所携带的相同，没有着色的地面，因此它们的列表看起来像一个列表而不是警报。任何区块都可以采用它，包括一个站在区块上的条形。
    default:
      title: 基础区块
    advanced:
      title: 高级区块
    aside:
      title: 固定旁边列
      description: 一个根据--size比例尺大小的窄列，旁边是吸收剩余宽度的主体。
    card:
      title: 卡片
    mark:
      title: 角落的标记
      description: '`block--mark`在块的开始处的顶部角落放置一个小图标：它是什么 — 在图表中放置的卡片类型，文件的种类 —，在它所说内容的旁边，而不是标题。'
    link:
      title: 作为链接的区块
      description: 整个卡片都是链接——通过从多个卡片中选择一张卡片进行选择：一个计划，一个分支，一个模板。它看起来像文本，而不是静音的动作；在指针下，它的地面带有细微的色调，边缘变得坚固，键盘通过每个控件佩戴的焦点环找到它。
    figure:
      title: 数字
      description: 一个居中的超大值或图标。用于仪表板计数器和状态图块——添加block--square以在宽度变化时保持图块为正方形。
    key_figures:
      title: 关键指标
      description: 作为仪表板的关键指标读取的数字：`block--figure--start`从行的开始处放置，标签在上方，值与其单位向后设置（`block--figure-unit`），下面有一行说明它由什么组成（`block--figure-sub`）。`block--tone-cat-<name>`沿边缘绘制类别的条；一个`a.block--link`打开该指标的视图。在`grid`中，行在空间缩小时变为多行。
    stacks:
      title: 堆叠
    stack_horizontal:
      title: 水平
      description: 相等的列，满宽度，溢出时换行。
    stack_vertical:
      title: 垂直
      description: 堆叠的行，满宽度，均匀间隙。
    stack_split:
      title: 拆分
      description: 第一个子项增长，最后一个子项保持固定——用于引导+动作行。
    stack_nested:
      title: 嵌套
      description: 包含垂直堆叠的水平堆叠——典型的仪表板网格。
  stack:
    item:
      one: 一
      two: 二
      three: 三
      four: 四
      lead: 在此引导文本中描述操作。
      action: 操作
  block:
    title: 区块标题
    no_padding: 无填充的区块（使用block--body）。
    one:
      title: 主要区块
      description: 一个带有标题和主体文本的区块。
    two:
      title: 次要区块
      description: 另一个区块以展示间距。
    three:
      title: 第三区块
      description: 行中的第三个区块。
    four:
      title: 第四区块
      description: 用于布局演示的第四个区块。
    advanced:
      title: 管道投影
      status: 准备就绪
      description: 此区块将标题插槽和内容结合在一个可重用的结构中。
      details: 可以在不离开当前上下文的情况下添加操作符。
    zones:
      main:
        title: 主区域
        description: 主内容可以自然地随着标准间距增长。
      aside:
        title: 旁边区域
        description: 此侧区域使用浅色背景突出补充内容。
    zones_three:
      title: 三区域布局
      status: 草稿
      left:
        title: 左侧面板
        description: 次要导航或元数据可以在此显示。
      main:
        title: 主内容
        description: 主要信息保持居中以便于阅读。
      right:
        title: 右侧面板
        description: 上下文操作和见解可以在此侧进行分组。
      footer:
        meta: 更新于2分钟前
        action: 打开详细信息
  figure:
    projections: 投影
    uptime: 正常运行时间
    status: 在线
    framed:
      title: 吞吐量
      label: 每秒事件
  key_figure:
    relaunch:
      label: 重新启动
      sub: '123 件 · 4 组'
    load:
      label: 加载
      sub: '3 组超过 85 %'
    woven:
      label: 本周编织
      sub: '41 个订单'
    late:
      label: 延迟订单
      sub: '下周有 2 个风险'
  tab:
    one: 概览
    two: 活动
    three: 设置
  button:
    create: 创建投影
    refresh: 刷新数据
    export: 导出
  action:
    add_projection: 添加投影
  link:
    starter:
      title: 入门
      description: 一个人，基本要素，无需支付。
    team:
      title: 团队
      description: 几个人在同一事项上工作。
    company:
      title: 公司
      description: 每个团队，拥有组织所需的控件。
  corner_actions:
    lead: 此引导可通过其角落的按钮复制。
    block: 一个在角落有两个操作的块，直到被指向之前都不显眼。
    edit: 编辑
    open: 打开全部
