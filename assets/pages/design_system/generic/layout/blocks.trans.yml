pt_BR:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Blocos
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'o chão permanece pertencente ao bloco, apenas a borda da frente carrega a cor.'
  section:
    corner_actions:
      title: 'Ações no canto'
      description: '`has-corner-actions` em um quadro — um lead, um bloco, um bloco de código, uma mensagem — e suas ações de ícone em um `corner-actions` dentro dele: no canto superior no seu final, mostrado enquanto o quadro está apontado ou mantém o teclado, sempre em uma tela sem ponteiro (`corner-actions--always` para mostrá-los para sempre). Um quadro com texto corrido mantém uma coluna livre para eles.'
    tone:
      title: 'Um bloco que carrega um tom'
      description: 'A cor de um estado — ou de uma categoria — como uma barra ao longo da borda da frente, e nada mais: a mesma barra que uma mensagem usa, sem o fundo colorido, para que uma lista delas seja lida como uma lista e não como um alerta. Qualquer bloco pode usá-la, uma barra em cima de um bloco incluído.'
    default:
      title: 'Blocos básicos'
    advanced:
      title: 'Blocos avançados'
    aside:
      title: 'Coluna fixa ao lado'
      description: 'Uma coluna estreita dimensionada na escala --size, ao lado de um corpo que absorve a largura restante.'
    card:
      title: Cartões
    mark:
      title: 'Uma marca no canto'
      description: '`block--mark` coloca um pequeno ícone no canto superior no início de um bloco: o que é — o tipo de um cartão colocado em um diagrama, o tipo de um documento —, ao lado do que diz, não um título.'
    link:
      title: 'Um bloco que é um link'
      description: 'Todo o cartão é o link — para uma escolha feita ao selecionar um cartão entre vários: um plano, um ramo, um modelo. Ele é lido como texto, não como uma ação sutil; sob o ponteiro, seu fundo ganha uma nuance e sua borda se torna firme, e o teclado o encontra pelo anel de foco que todo controle possui.'
    figure:
      title: Figuras
      description: 'Um único valor ou ícone grande, centralizado. Usado para contadores de painel e azulejos de status — adicione block--square para manter o azulejo quadrado, independentemente de sua largura.'
    key_figures:
      title: 'Figuras principais'
      description: 'A figura lida como uma figura-chave do painel: `block--figure--start` a coloca a partir do início da linha, o rótulo acima, o valor com sua unidade recuada (`block--figure-unit`), e uma linha abaixo dizendo do que é feita (`block--figure-sub`). `block--tone-cat-<name>` desenha a barra da categoria ao longo da borda; um `a.block--link` abre a visualização da figura. Em uma `grid`, a linha vai para várias linhas à medida que o espaço se estreita.'
