vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Khối
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'mặt đất vẫn là của khối, chỉ có cạnh dẫn mới mang màu sắc.'
  section:
    corner_actions:
      title: 'Các hành động ở góc'
      description: '`has-corner-actions` trên một khung — một lead, một block, một khối mã, một tin nhắn — và các hành động biểu tượng của nó trong một `corner-actions` bên trong: ở góc trên cùng tại cuối, hiển thị khi khung đang được chỉ vào hoặc giữ bàn phím, luôn hiển thị trên màn hình không có con trỏ (`corner-actions--always` để hiển thị chúng mãi mãi). Một khung chứa văn bản đang chạy giữ một cột trống cho chúng.'
    tone:
      title: 'Một khối mang tông màu'
      description: 'Màu sắc của một trạng thái — hoặc của một thể loại — như một thanh dọc theo cạnh dẫn, và không gì khác: cùng một thanh mà một thông điệp mặc, không có nền được tô màu, để danh sách của chúng được đọc như một danh sách chứ không phải như một cảnh báo. Bất kỳ khối nào cũng có thể nhận nó, bao gồm cả một thanh đứng trên một khối.'
    default:
      title: 'Khối cơ bản'
    advanced:
      title: 'Khối nâng cao'
    aside:
      title: 'Cột bên cố định'
      description: 'Một cột hẹp được định cỡ theo thang --size, bên cạnh một thân hấp thụ chiều rộng còn lại.'
    card:
      title: Thẻ
    mark:
      title: 'Một dấu hiệu ở góc'
      description: '`block--mark` đặt một biểu tượng nhỏ ở góc trên cùng tại đầu một block: đó là gì — loại thẻ được đặt trong một sơ đồ, loại tài liệu —, bên cạnh những gì nó nói, không phải tiêu đề.'
    link:
      title: 'Một khối là liên kết'
      description: 'Toàn bộ thẻ là liên kết — cho một lựa chọn được thực hiện bằng cách chọn một thẻ trong số nhiều thẻ: một kế hoạch, một nhánh, một mẫu. Nó được đọc như văn bản, không phải như một hành động mờ nhạt; dưới con trỏ, nền của nó mang một sắc thái và cạnh của nó cứng lại, và bàn phím tìm thấy nó qua vòng tiêu điểm mà mỗi điều khiển đều mang.'
    figure:
      title: 'Hình ảnh'
      description: 'Một giá trị hoặc biểu tượng lớn duy nhất, được căn giữa. Sử dụng cho các bộ đếm trên bảng điều khiển và các ô trạng thái — thêm block--square để giữ ô vuông bất kể chiều rộng của nó.'
    key_figures:
      title: 'Các chỉ số chính'
