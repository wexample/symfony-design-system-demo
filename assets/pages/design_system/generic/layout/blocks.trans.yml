es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Bloques
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'el suelo es propio del bloque, solo el borde delantero lleva el color.'
  section:
    corner_actions:
      title: 'Acciones en una esquina'
      description: '`has-corner-actions` en un marco — un lead, un bloque, un bloque de código, un mensaje — y sus acciones de íconos en un `corner-actions` dentro de él: en la esquina superior al final, mostradas mientras el marco está apuntado o tiene el teclado, siempre en una pantalla sin puntero (`corner-actions--always` para mostrarlas de forma permanente). Un marco que contiene texto en ejecución mantiene una columna libre para ellas.'
    tone:
      title: 'Un bloque que lleva un tono'
      description: 'El color de un estado — o de una categoría — como una barra en el borde delantero, y nada más: la misma barra que lleva un mensaje, sin el suelo tintado, para que una lista de ellos se lea como una lista y no como una alarma. Cualquier bloque lo acepta, incluida una barra que se sostiene en un bloque.'
    default:
      title: 'Bloques básicos'
    advanced:
      title: 'Bloques avanzados'
    aside:
      title: 'Columna fija al lado'
      description: 'Una columna estrecha dimensionada en la escala --size, al lado de un cuerpo que absorbe el ancho restante.'
    card:
      title: Tarjetas
    mark:
      title: 'Una marca en la esquina'
      description: '`block--mark` coloca un pequeño ícono en la esquina superior al inicio de un bloque: lo que es — el tipo de una tarjeta colocada en un diagrama, el tipo de un documento —, al lado de lo que dice, no un título.'
    link:
      title: 'Un bloque que es un enlace'
      description: 'Toda la tarjeta es el enlace — para una elección hecha al seleccionar una tarjeta entre varias: un plan, una rama, una plantilla. Se lee como texto, no como una acción atenuada; bajo el puntero su suelo toma un matiz y su borde se endurece, y el teclado lo encuentra por el anillo de enfoque que cada control lleva.'
    figure:
      title: Figuras
      description: 'Un único valor o ícono sobredimensionado, centrado. Usado para contadores de panel y mosaicos de estado — añade block--square para mantener el mosaico cuadrado sin importar su ancho.'
    key_figures:
      title: 'Figuras clave'
      description: 'La figura leída como figura clave de un tablero: `block--figure--start` la coloca desde el inicio de la línea, la etiqueta arriba, el valor con su unidad retrocedido (`block--figure-unit`), y una línea debajo que dice de qué está hecha (`block--figure-sub`). `block--tone-cat-<name>` dibuja la barra de la categoría a lo largo del borde; un `a.block--link` abre la vista de la figura. En una `grid`, la fila se extiende a varias líneas a medida que el espacio se reduce.'
    stacks:
      title: Pilotes
    stack_horizontal:
      title: Horizontal
      description: 'Columnas iguales, ancho completo, se envuelven al desbordarse.'
    stack_vertical:
      title: Vertical
      description: 'Filas apiladas, ancho completo, separación uniforme.'
    stack_split:
      title: Dividido
      description: 'El primer hijo crece, el último hijo permanece fijo — utilizado para filas de lead + acción.'
    stack_nested:
      title: Anidado
      description: 'Pila horizontal que contiene pilas verticales — cuadrícula de panel típica.'
  stack:
