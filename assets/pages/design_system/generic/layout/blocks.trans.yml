fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: بلوک‌ها
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'زمین متعلق به بلوک است، تنها لبه پیشرو رنگ را حمل می‌کند.'
  section:
    tone:
      title: 'یک بلوک با یک رنگ'
      description: 'رنگ یک حالت — یا یک دسته — به عنوان نوار در لبه پیشرو، و هیچ چیز دیگر: همان ناری که یک پیام به دوش می‌کشد، بدون زمین رنگی، بنابراین فهرستی از آن‌ها به عنوان یک فهرست خوانده می‌شود و نه به عنوان یک هشدار. هر بلوکی این را می‌گیرد، ناری که بر روی یک بلوک ایستاده است شامل می‌شود.'
