ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 블록
  page_icon: 'ph:bold/squares-four'
  tone:
    body: '바닥은 블록의 것이지만, 앞쪽 가장자리만 색상을 가집니다.'
  section:
    corner_actions:
      title: '코너의 작업'
      description: '프레임에 있는 `has-corner-actions` — 리드, 블록, 코드 블록, 메시지 — 및 그 안의 `corner-actions`에 있는 아이콘 작업: 프레임의 끝 위쪽 코너에 있으며, 프레임이 가리키고 있거나 키보드를 잡고 있을 때 표시되며, 포인터가 없는 화면에서 항상 표시됨(`corner-actions--always`로 항상 표시). 실행 중인 텍스트를 포함한 프레임은 이를 위해 열을 비워둡니다.'
    tone:
      title: '톤이 있는 블록'
      description: '상태 또는 카테고리의 색상이 앞쪽 가장자리 아래 바 형태로 표시되며, 그 외에는 아무것도 없습니다: 메시지가 착용하는 동일한 바로, 색이 없는 바닥 없이, 그래서 목록이 경고가 아닌 목록으로 읽힙니다. 모든 블록이 이를 수용하며, 블록 위에 서 있는 바도 포함됩니다.'
    default:
      title: '기본 블록'
    advanced:
      title: '고급 블록'
    aside:
      title: '고정된 사이드 열'
      description: '남은 너비를 흡수하는 본체 옆에 --size 스케일에 맞춰 조정된 좁은 열입니다.'
    card:
      title: 카드
    mark:
      title: '코너의 마크'
      description: '`block--mark`는 블록의 시작 부분에 위쪽 코너에 작은 아이콘을 배치합니다: 그것이 무엇인지 — 다이어그램에 배치된 카드의 유형, 문서의 종류 —, 그것이 말하는 것 옆에, 제목이 아닙니다.'
    link:
      title: '링크인 블록'
      description: '전체 카드가 링크입니다 — 여러 카드 중 하나를 선택하여 만든 선택을 위한 것입니다: 계획, 분기, 템플릿. 텍스트처럼 읽히며, 소음 없는 행동으로 읽히지 않습니다; 포인터 아래에서 바닥이 미세한 변화를 주고 가장자리가 단단해지며, 키보드는 모든 컨트롤이 착용하는 포커스 링으로 이를 찾습니다.'
    figure:
      title: 피겨
      description: '중앙에 배치된 하나의 과도하게 큰 값이나 아이콘입니다. 대시보드 카운터와 상태 타일에 사용되며 — 블록--사각형을 추가하여 너비에 관계없이 타일이 정사각형으로 유지됩니다.'
    key_figures:
      title: '주요 수치'
      description: '대시보드의 주요 수치로 읽히는 수치: `block--figure--start`는 줄의 시작에서 그것을 배치하고, 레이블을 위에, 값과 그 단위를 뒤로 설정합니다(`block--figure-unit`), 그리고 그것이 무엇으로 이루어져 있는지 말하는 줄이 그 아래에 있습니다(`block--figure-sub`). `block--tone-cat-<name>`는 가장자리를 따라 카테고리의 막대를 그립니다; `a.block--link`는 수치의 뷰를 엽니다. `grid`에서 행은 공간이 좁아질수록 여러 줄로 갑니다.'
    stacks:
      title: 스택
    stack_horizontal:
      title: 수평
      description: '같은 너비의 열, 전체 너비, 오버플로우 시 래핑됩니다.'
    stack_vertical:
      title: 수직
      description: '쌓인 행, 전체 너비, 균일한 간격.'
    stack_split:
      title: 분할
      description: '첫 번째 자식이 성장하고, 마지막 자식이 고정됩니다 — 주도 + 행동 행에 사용됩니다.'
    stack_nested:
      title: 중첩
      description: '수직 스택을 포함하는 수평 스택 — 전형적인 대시보드 격자입니다.'
  stack:
    item:
      one: 하나
      two: 둘
