    four:
      title: 'کواٹرنیری بلاک'
      description: 'لے آؤٹ ڈیمو کے لیے چوتھا بلاک۔'
    advanced:
      title: 'پائپ لائن پروجیکشن'
      status: تیار
      description: 'یہ بلاک عنوان کے سلاٹس اور مواد کو ایک ہی دوبارہ استعمال کے قابل ڈھانچے میں ملا دیتا ہے۔'
      details: 'آپریٹرز کو موجودہ سیاق و سباق چھوڑے بغیر شامل کیا جا سکتا ہے۔'
    zones:
      main:
        title: 'اہم زون'
        description: 'اہم مواد قدرتی طور پر معیاری اسپیسنگ کے ساتھ بڑھ سکتا ہے۔'
      aside:
        title: 'سائیڈ زون'
        description: 'یہ سائیڈ زون ہلکے پس منظر کا استعمال کرتا ہے تاکہ معاون مواد کو اجاگر کیا جا سکے۔'
    zones_three:
      title: 'تین زون لے آؤٹ'
      status: خاکہ
      left:
        title: 'بائیں پینل'
        description: 'ثانوی نیویگیشن یا میٹا ڈیٹا یہاں رہ سکتا ہے۔'
      main:
