id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Blok
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'tanah tetap milik blok, hanya tepi depan yang membawa warna.'
  section:
    corner_actions:
      title: 'Tindakan di sudut'
      description: '`has-corner-actions` pada sebuah bingkai — sebuah lead, sebuah blok, sebuah blok kode, sebuah pesan — dan tindakan ikonnya di dalam `corner-actions`: di sudut atas di akhir, ditampilkan saat bingkai diarahkan atau memegang keyboard, selalu di layar tanpa pointer (`corner-actions--always` untuk menampilkannya secara permanen). Sebuah bingkai yang memuat teks yang berjalan menjaga satu kolom kosong untuk mereka.'
    tone:
      title: 'Sebuah blok yang membawa nada'
      description: 'Warna dari sebuah keadaan — atau dari sebuah kategori — sebagai batang di tepi depan, dan tidak ada yang lain: batang yang sama yang dikenakan pesan, tanpa tanah yang berwarna, sehingga daftar tersebut terbaca sebagai daftar dan bukan sebagai alarm. Setiap blok bisa menggunakannya, batang yang berdiri di atas blok juga termasuk.'
    default:
      title: 'Blok dasar'
    advanced:
      title: 'Blok lanjutan'
    aside:
      title: 'Kolom samping tetap'
      description: 'Sebuah kolom sempit yang disesuaikan dengan skala --size, di samping tubuh yang menyerap sisa lebar.'
    card:
      title: Kartu
    mark:
      title: 'Sebuah tanda di sudut'
      description: '`block--mark` meletakkan ikon kecil di sudut atas pada awal sebuah blok: apa itu — jenis kartu yang diletakkan dalam diagram, jenis dokumen —, di samping apa yang dikatakannya, bukan judul.'
    link:
      title: 'Sebuah blok yang merupakan tautan'
      description: 'Seluruh kartu adalah tautan — untuk pilihan yang dibuat dengan memilih satu kartu di antara beberapa: sebuah rencana, sebuah cabang, sebuah template. Ini terbaca sebagai teks, bukan sebagai tindakan yang dibisukan; di bawah penunjuk, tanahnya mengambil nuansa dan tepinya menguat, dan keyboard menemukannya melalui cincin fokus yang dikenakan setiap kontrol.'
    figure:
      title: Angka
      description: 'Sebuah nilai atau ikon besar, terpusat. Digunakan untuk penghitung dasbor dan ubin status — tambahkan block--square untuk menjaga ubin tetap persegi terlepas dari lebarnya.'
    key_figures:
      title: 'Angka kunci'
      description: 'Angka yang dibaca sebagai angka kunci dashboard: `block--figure--start` meletakkannya dari awal garis, label di atas, nilai dengan satuan yang ditetapkan kembali (`block--figure-unit`), dan sebuah garis di bawahnya yang mengatakan apa yang menyusunnya (`block--figure-sub`). `block--tone-cat-<name>` menggambar batang kategori di tepi; sebuah `a.block--link` membuka tampilan angka. Di dalam `grid`, barisnya bisa menjadi beberapa baris saat ruang menyempit.'
    stacks:
      title: Tumpukan
    stack_horizontal:
      title: Horizontal
      description: 'Kolom yang sama, lebar penuh, membungkus saat meluap.'
    stack_vertical:
