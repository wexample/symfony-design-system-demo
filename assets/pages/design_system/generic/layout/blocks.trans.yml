th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: บล็อก
  page_icon: 'ph:bold/squares-four'
  tone:
    body: 'พื้นดินยังคงเป็นของบล็อก อยู่แค่ขอบด้านหน้าเท่านั้นที่มีสีสัน'
  section:
    corner_actions:
      title: การดำเนินการในมุม
      description: '`has-corner-actions` บนกรอบ — หัวเรื่อง, บล็อก, บล็อกโค้ด, ข้อความ — และการดำเนินการไอคอนใน `corner-actions` ข้างใน: ในมุมบนที่ท้าย, แสดงเมื่อกรอบถูกชี้หรือถือแป้นพิมพ์, เสมอในหน้าจอที่ไม่มีตัวชี้ (`corner-actions--always` เพื่อแสดงตลอดเวลา). กรอบที่ถือข้อความที่กำลังทำงานจะเว้นพื้นที่ในคอลัมน์ให้กับพวกเขา.'
    tone:
      title: บล็อกที่มีโทนสี
      description: 'สีของสถานะ — หรือของหมวดหมู่ — จะอยู่ในแถบที่ขอบด้านหน้า และไม่มีอะไรอื่น: แถบเดียวกันที่ข้อความสวมใส่ โดยไม่มีพื้นสีที่มีสีอ่อน ดังนั้นรายการนี้จึงอ่านได้เป็นรายการ ไม่ใช่เป็นการเตือนภัย บล็อกใด ๆ ก็สามารถใช้ได้ รวมถึงแถบที่ตั้งอยู่บนบล็อกด้วย'
    default:
      title: บล็อกพื้นฐาน
    advanced:
      title: บล็อกขั้นสูง
    aside:
      title: คอลัมน์ข้างที่ตายตัว
      description: 'คอลัมน์แคบที่มีขนาดตามมาตรฐาน --size ข้าง ๆ เนื้อหาที่ดูดซับความกว้างที่เหลืออยู่'
    card:
      title: การ์ด
    mark:
      title: เครื่องหมายในมุม
      description: '`block--mark` วางไอคอนเล็ก ๆ ในมุมบนที่จุดเริ่มต้นของบล็อก: มันคืออะไร — ประเภทของการ์ดที่วางในแผนภาพ, ประเภทของเอกสาร —, ข้างสิ่งที่มันกล่าว, ไม่ใช่ชื่อเรื่อง.'
    link:
      title: บล็อกที่เป็นลิงก์
      description: 'การ์ดทั้งหมดคือการเชื่อมโยง — สำหรับการเลือกที่ทำโดยการเลือกการ์ดหนึ่งใบจากหลายใบ: แผน, สาขา, แม่แบบ อ่านได้เหมือนข้อความ ไม่ใช่การกระทำที่เงียบสงบ; ใต้ตัวชี้ พื้นของมันจะมีเฉดสี และขอบก็จะแข็งขึ้น และแป้นพิมพ์จะค้นหามันโดยวงแหวนโฟกัสที่ควบคุมทุกตัวใส่'
    figure:
      title: รูปภาพ
      description: 'ค่าหรือไอคอนขนาดใหญ่เพียงค่าเดียว อยู่กลาง ใช้สำหรับตัวนับในแดชบอร์ดและแผ่นสถานะ — เพิ่ม block--square เพื่อให้แผ่นมีรูปสี่เหลี่ยมจัตุรัสไม่ว่าจะมีความกว้างเท่าใด'
    key_figures:
      title: ตัวเลขสำคัญ
      description: 'ตัวเลขที่อ่านได้ว่าเป็นตัวเลขสำคัญของแดชบอร์ด: `block--figure--start` วางมันจากจุดเริ่มต้นของบรรทัด, ป้ายด้านบน, ค่าพร้อมหน่วยที่ตั้งกลับ (`block--figure-unit`), และบรรทัดด้านล่างบอกว่าสิ่งนั้นทำมาจากอะไร (`block--figure-sub`). `block--tone-cat-<name>` วาดแถบประเภทลงขอบ; `a.block--link` เปิดมุมมองของตัวเลข. ใน `grid`, แถวจะขยายไปหลายบรรทัดเมื่อห้องแคบลง.'
    stacks:
      title: สแต็ค
    stack_horizontal:
      title: แนวนอน
      description: 'คอลัมน์ที่เท่ากัน กว้างเต็มที่ ห่อหุ้มเมื่อเกิน'
    stack_vertical:
      title: แนวตั้ง
      description: 'แถวที่ซ้อนกัน กว้างเต็มที่ ช่องว่างสม่ำเสมอ'
    stack_split:
      title: แบ่ง
      description: 'เด็กคนแรกเติบโต เด็กคนสุดท้ายคงที่ — ใช้สำหรับแถวหัวหน้า + การกระทำ'
    stack_nested:
      title: ซ้อนกัน
      description: 'สแต็คแนวนอนที่มีสแต็คแนวตั้ง — ตะแกรงแดชบอร์ดทั่วไป'
  stack:
    item:
      one: หนึ่ง
      two: สอง
      three: สาม
      four: สี่
      lead: อธิบายการกระทำในข้อความหัวข้อนี้
