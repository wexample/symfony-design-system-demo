      title: 'بلوک‌های پایه'
    advanced:
      title: 'بلوک‌های پیشرفته'
    aside:
      title: 'ستون کناری ثابت'
      description: 'ستون باریکی بر اساس مقیاس --size، در کنار بدنه‌ای که عرض باقی‌مانده را جذب می‌کند.'
    card:
      title: کارت‌ها
    link:
      title: 'بلوک به عنوان یک لینک'
      description: 'کل کارت لینک است — برای انتخابی که با انتخاب یک کارت از چندین کارت انجام می‌شود: یک طرح، یک شاخه، یک الگو. این به عنوان متن خوانده می‌شود، نه به عنوان یک عمل محو؛ زیر نشانگر زمینش نوانس می‌گیرد و لبه‌اش محکم می‌شود، و کیبورد آن را با حلقه تمرکز که هر کنترل دارد پیدا می‌کند.'
