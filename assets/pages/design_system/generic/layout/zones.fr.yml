~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Zones
page_icon: 'ph:bold/columns'
intro: "L'espace de travail à deux volets sur lequel chaque explorateur, éditeur et vue détaillée est construit. Une zone n'a pas de largeur ni de hauteur propre : c'est la division dans laquelle elle se trouve qui la dimensionne, et chaque côté défile indépendamment. Deux zones sont deux objets posés sur la page, pas un panneau coupé en deux — ce qui les distingue, c'est l'espace entre elles, et `zone--panel` est le sol sur lequel chacune se tient."
section:
  split:
    title: 'Une division'
    description: "Une colonne de taille, l'autre prenant ce qui reste. La taille est donnée par un pas, et c'est celle de la zone — elle n'est pas héritée de quoi que ce soit de nesté à l'intérieur."
  scrollable:
    title: 'Chaque côté défile indépendamment'
    description: "Une zone défilante est ce qui contient le débordement, pas la page. Défilez l'une de ces deux zones et l'autre reste là où elle est, ce qui est toute la raison de cette forme."
  vertical:
    title: 'Un en-tête qui ne défile pas'
    description: "Une division tournée verticalement : une zone étroite est de la hauteur de ce qu'elle contient, le corps prend le reste et défile en dessous. C'est l'arrangement d'un panneau avec une barre d'outils en haut."
  wrap:
    title: 'Sous un sol'
    description: "Étant donné un sol, la zone flexible s'approprie une ligne complète et la colonne dimensionnée se déplace au-dessus au lieu d'être toutes deux compressées à rien. Réduisez la fenêtre pour voir comment cela se replie."
split:
  body: 'Ce côté prend tout ce que laisse la colonne dimensionnée.'
scrollable:
  item: Élément
  line: Ligne
vertical:
  action: Créer
wrap:
  body: 'Sous le sol qui est donné à cette zone, elle prend une ligne qui lui est propre.'
