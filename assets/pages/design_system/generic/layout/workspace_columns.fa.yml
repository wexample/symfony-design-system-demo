~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'پنج ستون'
page_icon: 'ph:bold/arrows-horizontal'
intro: 'پنج منطقه در یک ردیف که عریض‌تر از صفحه است و با اسکرول افقی خوانده می‌شود. ناوبری در سمت چپ یکی از آن‌ها نیست — این یک منطقه از صفحه است و در جای خود باقی می‌ماند.'
section:
  scroll:
    title: 'ردیف اسکرول می‌شود، صفحه نمی‌شود'
    description: '`zone--split--scroll` اضافه بار را بر روی ردیف قرار می‌دهد: ستون‌ها عرضی را که نام می‌برند حفظ می‌کنند و اسکرول تقسیم زیر آن‌ها می‌شود. هر یک هنوز overflow عمودی خود را دارد، بنابراین یک ستون بلند در جایی که ایستاده اسکرول می‌شود.'
  width:
    title: 'هر ستون عرض خود را نام می‌برد'
    description: 'هیچ چیزی آنچه را که اینجا باقی مانده نمی‌گیرد، چون هیچ‌چیزی وجود ندارد: ردیف به عمد از صفحه طولانی‌تر است. یک منطقه که هیچ اندازه‌ای نام نمی‌برد به یک ستونی که به اندازه کافی برای نگه‌داشتن چیزی عریض باشد، بازمی‌گردد و این‌ها عرض خود را نام می‌برند — هر کدام ۲۴rem، پنج تا از آن‌ها.'
  fold:
    title: 'تا کردن یک منطقه'
    description: 'هر ستون در اینجا یک `zone-collapsible` است. وقتی که تا می‌شود، نمی‌رود: در ردیف خود و زمین خود جای خود را حفظ می‌کند و نوار آن به پهلو می‌چرخد — بنابراین دکمه‌ای که آن را تا کرده، دکمه‌ای است که آن را باز می‌کند و هیچ‌چیزی خارج از آن نباید بداند که وجود دارد.'
    more: 'نام‌گذاری شده، یک منطقه به یاد می‌ماند: حالت تحت نام خود به وضعیت رابط کاربری نوشته می‌شود و هنگام ارائه صفحه دوباره خوانده می‌شود، بنابراین به جای اینکه در برابر چشمان شما تا شود، به صورت تا شده می‌رسد. ستون سوم به صورت تا شده باز می‌شود و آخرین ستون توسط یک vue رندر می‌شود — همان کامپوننت، همان کلاس‌ها، همان کلید.'
column:
  first: 'خواندن من'
  second: 'لیست کارها'
  third: 'در حال انجام'
  fourth: بررسی
  fifth: 'انجام شده'
card:
