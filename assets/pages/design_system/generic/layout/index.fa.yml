~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: چیدمان
page_icon: 'ph:bold/layout'
intro: 'چگونه یک صفحه تقسیم می‌شود. این شکل‌ها نواحی را به جای محتوا می‌گیرند: آن‌ها می‌گویند چیزها کجا قرار دارند و هیچ چیز از آنچه در آنجا ایستاده‌اند نمی‌دانند.'
page:
  zones:
    title: زون‌ها
    description: 'فضای کاری دو قسمتی: یک تقسیم، یک ستون اندازه‌دار، یک بدنه قابل اسکرول. هر کاوشگر، ویرایشگر و نمای جزئی در یک برنامه بر اساس این ساخته شده است.'
  workspace:
    title: 'فضای کاری'
    description: 'صفحات ساخته شده از نواحی که در کنار هم قرار گرفته‌اند، که فقط با فضای بین آن‌ها از هم متمایز می‌شوند. سه چیدمان، که با درختی که در هر یک از آن‌ها ایستاده است جابجا می‌شوند.'
  blocks:
    title: بلوک‌ها
    description: 'سطحی که یک گروه از چیزها بر روی آن نشسته‌اند، با یا بدون پد، با انواع کارت و شکل آن.'
  toolbar:
    title: 'نوار ابزار'
    description: 'یک خط از اقدامات بالای یا زیر آنچه بر روی آن عمل می‌کند، در چگالی‌های جادار و فشرده.'
  tabs:
    title: برگه‌ها
    description: 'یک صفحه که یکی از چندین چهره را نشان می‌دهد، با پنل‌هایی که انتخاب را دنبال می‌کنند.'
  doc:
    title: 'چیدمان سند'
    description: 'الگوی مستندات دو ستونی — نثر در یک سمت، کد در سمت دیگر — که هنگامی که جا نیست به یک ستون جمع می‌شود.'
