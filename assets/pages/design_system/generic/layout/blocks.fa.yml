    status: آماده
    description: 'این بلوک اسلات‌های عنوان و محتوا را در یک ساختار قابل استفاده مجدد ترکیب می‌کند.'
    details: 'عملگرها می‌توانند بدون ترک کردن زمینه فعلی اضافه شوند.'
  zones:
