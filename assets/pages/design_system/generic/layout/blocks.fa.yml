    main:
      title: 'محتوای اصلی'
      description: 'اطلاعات اصلی برای خوانایی در مرکز باقی می‌ماند.'
    right:
      title: 'پنل راست'
      description: 'عملیات و بینش‌های مربوطه می‌توانند در این سمت گروه‌بندی شوند.'
    footer:
