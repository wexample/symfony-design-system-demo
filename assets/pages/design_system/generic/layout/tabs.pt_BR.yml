~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Guias
page_icon: 'ph:bold/signpost'
section:
  vue:
    title: 'Guias em vue'
    description: 'A barra de guias é uma linha de links e o endereço mostra qual está aberta. A barra vue apenas informa que uma guia foi solicitada, então algo ao redor contém a resposta — aqui, um componente de demonstração.'
  breadcrumb:
    vue_description: 'O par de guias vue pega seus itens já resolvidos: o servidor mantém a tabela de rotas, então responde a ela, e o que cruza é a resposta.'
    title: Navegação
    description: 'Mostra a localização do usuário dentro da hierarquia. Use o parcial de navegação — passe itens com rota e rótulo; o último item é sempre renderizado como atual.'
  tabs:
    title: Guias
  default:
    normal:
      title: 'Guias básicas'
    full:
      title: 'Guias básicas (largura total)'
    half:
      title: 'Guias básicas (meia largura)'
  counts:
    title: 'Guias com contagem'
    description: 'Quantos itens a guia contém, ao final do rótulo. É uma pílula e nada mais — passe `count` ao lado do rótulo e a guia o colocará. Um item sem a chave não mostra nada, que é como uma guia sem nada para contar permanece em silêncio.'
  icons:
    normal:
      title: 'Guias com ícones'
    full:
      title: 'Guias com ícones (largura total)'
    half:
      title: 'Guias com ícones (meia largura)'
breadcrumb:
  example:
    vue: 'Em vue'
    two_levels: 'Dois níveis'
    three_levels: 'Três níveis'
  item:
    home: Início
    layout: Layout
    section: Blocos
    current: Navegação
tab:
  one: 'Visão geral'
  two: Atividade
  three: Configurações
vue:
  panel:
    one: 'O primeiro painel. Nada foi buscado e nenhum endereço mudou — a barra emitiu, o portador trocou.'
    two: 'O segundo painel.'
    three: 'O terceiro painel.'
