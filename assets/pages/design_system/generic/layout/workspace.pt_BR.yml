~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Espaço de Trabalho'
page_icon: 'ph:bold/sidebar-simple'
intro: 'Esta página é o exemplo: o que você está lendo está no meio de três regiões, dispostas lado a lado no corpo da página.'
section:
  gap:
    title: 'A lacuna é o separador'
    description: 'Nada é desenhado entre duas regiões. O que as diferencia é o espaço que deixam entre si, pelo qual a página mostra — o mesmo terreno em que o menu e o cabeçalho estão. Cada região carrega o seu próprio, que é o terreno que um corpo sempre teve.'
  each:
    title: 'Cada um por si'
    description: 'As duas colunas mantêm a largura que lhes é dada e o meio ocupa o que sobra. Role uma das três e as outras duas permanecem onde estão: uma região mantém seu próprio overflow, e a página não mantém nenhum.'
    more: 'Uma região não sabe nada sobre suas vizinhas. O explorador à esquerda é uma divisão própria — uma barra que permanece, uma árvore que rola sob ela — e teria a mesma forma em qualquer outro lugar da página.'
  size:
    title: 'Dimensionando uma delas'
    description: 'A região à esquerda possui um `zone-resizer`: uma alça que preenche a lacuna ao lado, que não desenha nada — o cursor indica que se move. Arraste-a, ou dê foco e use as setas; um clique duplo devolve à região a largura que a página lhe deu.'
    more: 'Uma alça dimensiona uma região que tem um tamanho — uma que recebe uma largura em vez de ocupar o que sobra — e a flexível ao lado absorve a diferença. A largura é lembrada sob o nome da região, então volta com a página, aqui em todos os três layouts, já que é a mesma região se movendo.'
editor:
  state: Salvo
inspector:
  title: Detalhes
  field:
    path:
      key: Caminho
    size:
      key: Tamanho
    changed:
      key: Alterado
      value: 'há 3 minutos'
