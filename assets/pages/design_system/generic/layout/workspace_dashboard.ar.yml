    title: نشر
    figure: '7 اليوم'
    description: 'بدونها، يحتفظ نفس الحائط بالغرفة بين بلاطاته، من خلالها يظهر الرسم الأرضي للصفحة - التبديل في الشريط أعلاه. قم بالتمرير لليمين لفتح لوحة محملة فقط عندما تُرى.'
