~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Blok
page_icon: 'ph:bold/squares-four'
tone:
  body: 'tanah tetap milik blok, hanya tepi depan yang membawa warna.'
section:
  tone:
    title: 'Sebuah blok yang membawa nada'
    description: 'Warna dari sebuah keadaan — atau dari sebuah kategori — sebagai batang di tepi depan, dan tidak ada yang lain: batang yang sama yang dikenakan pesan, tanpa tanah yang berwarna, sehingga daftar tersebut terbaca sebagai daftar dan bukan sebagai alarm. Setiap blok bisa menggunakannya, batang yang berdiri di atas blok juga termasuk.'
  default:
    title: 'Blok dasar'
  advanced:
    title: 'Blok lanjutan'
  aside:
    title: 'Kolom samping tetap'
    description: 'Sebuah kolom sempit yang disesuaikan dengan skala --size, di samping tubuh yang menyerap sisa lebar.'
  card:
    title: Kartu
  link:
    title: 'Sebuah blok yang merupakan tautan'
    description: 'Seluruh kartu adalah tautan — untuk pilihan yang dibuat dengan memilih satu kartu di antara beberapa: sebuah rencana, sebuah cabang, sebuah template. Ini terbaca sebagai teks, bukan sebagai tindakan yang dibisukan; di bawah penunjuk, tanahnya mengambil nuansa dan tepinya menguat, dan keyboard menemukannya melalui cincin fokus yang dikenakan setiap kontrol.'
  figure:
    title: Angka
    description: 'Sebuah nilai atau ikon besar, terpusat. Digunakan untuk penghitung dasbor dan ubin status — tambahkan block--square untuk menjaga ubin tetap persegi terlepas dari lebarnya.'
  stacks:
    title: Tumpukan
  stack_horizontal:
    title: Horizontal
    description: 'Kolom yang sama, lebar penuh, membungkus saat meluap.'
  stack_vertical:
    title: Vertikal
    description: 'Baris bertumpuk, lebar penuh, jarak seragam.'
  stack_split:
    title: Terpisah
    description: 'Anak pertama tumbuh, anak terakhir tetap tetap — digunakan untuk baris utama + tindakan.'
  stack_nested:
    title: Bersemi
    description: 'Tumpukan horizontal yang berisi tumpukan vertikal — grid dasbor yang khas.'
stack:
  item:
    one: Satu
    two: Dua
    three: Tiga
    four: Empat
    lead: 'Jelaskan tindakan dalam teks utama ini.'
    action: Tindakan
