    description: 'Blok ini menggabungkan slot judul dan konten dalam satu struktur yang dapat digunakan kembali.'
    details: 'Operator dapat ditambahkan tanpa meninggalkan konteks saat ini.'
  zones:
    main:
      title: 'Zona utama'
      description: 'Konten utama dapat tumbuh secara alami dengan jarak standar.'
    aside:
      title: 'Zona samping'
