~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Panel sterowania'
page_icon: 'ph:bold/squares-four'
mode:
  reopen: 'Otwórz ponownie panel API'
  gap: 'Z lukami'
  flush: Opróżnij
state:
  success: Nominalny
  warning: Degradacja
  error: Błąd
  running: Opróżnianie
tile:
  traffic:
    title: Ruch
    figure: '12.4k req/min'
    description: 'Podziały wewnątrz podziału: ściana to pionowy podział wierszy, każdy wiersz to osobny podział. Przeciągnij krawędź pod tym wierszem, aby zwiększyć jego wysokość, lub tę obok tego kafla, aby zwiększyć szerokość.'
  latency:
    title: 'Opóźnienie p95'
    figure: '184 ms'
    description: 'Każdy kafel oznacza piętro, `zone--min-*`: poniżej niego kafel nie jest ściśnięty, zamiast tego ramka przewija się — zarówno na boki, jak i w dół.'
  errors:
    title: Błędy
    figure: '2.1 %'
    description: 'Po zmianie rozmiaru strefa zachowuje rozmiar, na którym została pozostawiona wzdłuż osi swojego podziału, a następnie wraca do niego; podwójne kliknięcie na uchwycie przywraca ją do podziału.'
  queue:
    title: Kolejka
    figure: '318 zadań'
    description: '`zone--split--flush` zwęża lukę do piksela, ziemia ściany rysuje linię między kaflami. Jedna klasa na ścianie jest wystarczająca, wiersze dziedziczą ją.'
  deploys:
    title: Wdrożenia
    figure: '7 dzisiaj'
    description: 'Bez tego sama ściana utrzymuje przestrzeń między swoimi kaflami, przez którą widoczna jest ziemia strony — przełącz w pasku powyżej. Przewiń w prawo, aby zobaczyć panel załadowany tylko po jego zobaczeniu.'
