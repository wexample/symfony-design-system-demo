~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'फिक्स्ड चौड़ाई'
page_icon: 'ph:bold/arrows-in-line-horizontal'
intro: 'यही तीन क्षेत्र हैं, लेकिन जिस क्षेत्र को आप पढ़ रहे हैं उसे एक चौड़ाई दी गई है बजाय इसके कि वह खुद एक ले। और जिसे कोई नहीं चाहता, वह एक क्षेत्र को जाता है जिसमें कुछ नहीं है।'
section:
  sized:
    title: 'एक क्षेत्र को इसकी चौड़ाई दी गई'
    description: '`zone--narrow` एक आकार कदम के साथ: क्षेत्र इतनी चौड़ी है और इतनी चौड़ी रहती है, चाहे खिड़की में कितना भी स्थान हो। यह इस तरह से है कि एक पाठ पढ़ने योग्य बना रहता है - एक कॉलम जो स्क्रीन के साथ बढ़ता है, वह एक नहीं रह जाता।'
  slack:
    title: 'स्लैक का क्या काम है'
    description: 'अंतिम क्षेत्र में कुछ नहीं है, और फिर भी यह अपनी जगह बनाए रखता है: खाली होना अनुपस्थित नहीं है, और एक पैन जो इंतज़ार कर रहा है, वह एक पैन के रूप में दिखता है न कि एक छिद्र के रूप में। यह उस चौड़ाई को लेने के लिए है जिसे आकार वाले अस्वीकार करते हैं।'
    more: 'एक विभाजन बचा हुआ हिस्सा उस किसी को देता है जो इसके लिए पूछता है। जब कुछ नहीं मांगता, तो आकार वाले क्षेत्र खींचे या किनारों तक धकेले जाते; इसके साथ, वे अपनी चौड़ाई बनाए रखते हैं और पृष्ठ बाकी रखता है।'
work:
  size: 32rem
