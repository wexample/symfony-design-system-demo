~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Vijf kolommen'
page_icon: 'ph:bold/arrows-horizontal'
intro: "Vijf regio's in een rij die breder zijn dan het scherm, te lezen door zijwaarts te scrollen. De navigatie aan de linkerkant is daar niet één van — het is een regio van de pagina, en het blijft op zijn plaats."
section:
  scroll:
    title: 'De rij scrollt, de pagina niet'
    description: '`zone--split--scroll` plaatst de overflow op de rij: de kolommen behouden de breedte die ze benoemen en de split scrollt eronder. Elke kolom heeft nog steeds zijn eigen verticale overflow, dus een lange kolom scrollt waar hij staat.'
  width:
    title: 'Elke kolom benoemt zijn breedte'
    description: 'Er is hier niets dat de resterende ruimte in beslag neemt, aangezien die er niet is: de rij is opzettelijk langer dan de pagina. Een regio die geen grootte benoemt, valt terug op een kolom die breed genoeg is om iets te bevatten, en deze benoemen hun breedte — elk 24rem, vijf in totaal.'
  fold:
    title: 'Een regio opvouwen'
    description: 'Elke kolom hier is een `zone-collapsible`. Opgevouwen gaat hij niet weg: hij behoudt zijn plaats in de rij en zijn grond, en zijn balk draait op zijn zij — dus de knop die hem opvouwde, is de knop die hem opent, en niets buiten hoeft te weten dat hij bestaat.'
    more: 'Benoemd, wordt een regio onthouden: de staat wordt geschreven naar de ui-status onder zijn naam en weer gelezen wanneer de pagina wordt geladen, zodat hij opgevouwen arriveert in plaats van onder uw ogen op te vouwen. De derde kolom opent opgevouwen, en de laatste wordt weergegeven door een vue — dezelfde component, dezelfde klassen, dezelfde sleutel.'
column:
  first: 'Lees mij'
  second: Backlog
  third: 'In uitvoering'
  fourth: Review
  fifth: Klaar
card:
  second: Ticket
  third: Ticket
  fourth: Ticket
  fifth: Ticket
  body: 'Wat een kolom bevat, is niet de zorg van de rij: het scrollt zelfstandig, onder een balk die blijft.'
