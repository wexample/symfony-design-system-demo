  absent: 'Не найдено в этом формате, и декларация не указывает почему — решение еще не принято'
  todo: 'Хотелось бы в этом формате, но пока отсутствует'
  shared: 'Также имеется у %bundles%. Это не ошибка — загрузчик различает их по псевдониму — но стоит знать, является ли это одним переотрисованным элементом или двумя, которые разделяют имя.'
format:
  style:
    title: Стиль
    description: 'Стилевой файл, загружаемый загрузчиком, когда компонент на странице.'
  template:
    title: Шаблон
    description: 'Рендерер сервера, нарисованный с помощью twig.'
  vue:
    title: Vue
    description: 'Клиентский двойник, отображаемый в браузере из тех же опций.'
  script:
    title: Скрипт
    description: 'Поведение, связанное с разметкой, как только она попадает в документ.'
  schema:
    title: Схема
    description: 'Контракт: что принимает компонент, с типами и значениями по умолчанию. Каждый другой рендерер можно проверить по сравнению с ним.'
  ai:
    title: ИИ
    description: 'Что агенту сообщается о компоненте: схема, как его использовать, инструменты, которые действуют на него.'
  react:
    title: React
    description: 'Рендерер для React.'
  flutter:
    title: Flutter
    description: 'Рендерер для Flutter, написанный на dart по схеме. Разметка не переносится; контракт и токены — да.'
section:
  matrix:
    title: 'Элемент по формату'
    description: 'Одна строка на компонент, один столбец на рендерер. Компонент — это каталог под `components/`, содержащий каждый способ его отображения — `spinner/spinner.scss`, `spinner.html.twig`, `spinner.vue`, `spinner.ts` — так что ничего здесь не нужно согласовывать по имени четырех каталогов. Ячейка подсчитывает файлы, стоящие за ней — наведите курсор на одну, чтобы увидеть их. Каждый заявленный элемент читается на одном уровне — строка, найденная в одном формате, может быть пробелом или примитивом, которому ничего больше не требуется, и разбираться с этим — работа, для которой предназначена эта таблица, а не то, что она уже знает. Четыре состояния, различаемых по тому, чей ход следующий: проверка, элемент на месте; предупреждение, его хотят и он отсутствует; зачеркнутый круг, он не нужен намеренно; пустое место, никто еще не вынес решения. Наведите курсор на предупреждение или круг, чтобы узнать, что говорит декларация.'
  sources:
    title: 'Откуда они берутся'
    description: 'Комплект находится в таблице, потому что он так сказал — реализовав `DesignSystemElementsBundleInterface`, таким образом комплект сообщает загрузчику о своих фронтальных путях. Каждый записывает `data/elements.json` внутри своих активов, опубликованных с ними, так что сборка, сторона узла, другой язык или агент работают с одними и теми же файлами; эта страница — только их объединение.'
  abstract:
    title: Абстрактный
    description: 'Пять основ под `components/_abstract/`, которые никогда не рисуют — они только расширяются. `_abstract/vue` — это три пустых блока twig, которые заполняют тридцать один шаблон; `_abstract/form-field` — это то, на чем построены двенадцать вводов. Они находятся вне матрицы по той же причине, что и формы: они не доставляются никому, так что спрашивать у них схему или двойник для react — это задавать вопрос, на который они не могут ответить. Нижнее подчеркивание говорит об этом еще до того, как кто-то откроет каталог. Что показано, это то, что каждый уже приносит тому, кто его расширяет.'
  shapes:
    title: Формы
    description: 'Форма — это стиль без рендерера: вы пишете разметку, ставите на нее класс и `@use` стилевой файл из своего. `.stack`, `.grid`, `.block`, `.cluster`. Они перечислены здесь, а не в таблице выше, потому что таблица рендереров не имеет столбца, чтобы предложить что-то, что не имеет рендерера — и их отсутствие в ней объясняет, почему все ее предупреждения означают работу, а не плохо заданный вопрос. Линия проводится файлами, а не вкусом: форма — это точно один `.scss`, и ничто не рендерит ее, так что в день, когда она получает `.html.twig`, она переходит в `components/` и присоединяется к матрице. Этот переход — единственное продвижение, которое существует. То, что каждый говорит о себе, читается с заголовка его собственного стилевого файла, так что нет второго места, откуда ему можно было бы отклониться.'
  coverage:
    title: 'Что это упускает'
    description: 'Каталоги `assets/`, которые сканирование не проходит, перечисленные с диска, а не из памяти. Миксины, утилиты и токены не являются элементами и никогда не могут быть строками здесь; макеты и общие скрипты являются таковыми и еще не охвачены.'
