~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 재고
page_icon: 'ph:bold/list-checks'
intro: '번들이 제공하는 모든 요소와 제공되는 형식. 이 표는 누구나 유지하는 목록이 아니라 각 번들이 발행하는 레지스트리로, 선언에서 컴파일되고 구성 요소의 점검과 비교됩니다. 여기에는 무엇이 있는지 — 무엇이 있어야 하는지는 포함되지 않으며, 이는 어떤 스캔으로도 해결할 수 없는 질문이고, 요소들이 스스로 선언해야 하는 것입니다.'
problems:
  title: '선언과 자산이 불일치합니다'
  body: '이 페이지는 개발 중 자산에서 컴파일되었기 때문에 `%command%`이 작성하기를 거부하는 내용을 볼 수 있습니다. 아래 각 항목은 요소의 이름을 나타내며, 표는 여전히 그와 같습니다.'
missing:
  title: '레지스트리가 누락되었습니다'
  body: '%bundles%이 요소를 보유한다고 등록했지만 디스크에 레지스트리가 없어 아래 표에서 행이 없습니다. `%command%`을 실행하고 결과를 커밋하세요.'
summary:
  label: '계산된 항목'
  count: '몇 개'
  elements: '발견된 요소'
  todo: '해야 할 형식'
  undecided: '아직 결정되지 않은 사항'
  shapes: 형태
  abstracts: '추상 기초'
column:
  element: 요소
  shape: 형태
  description: 용도
cell:
  absent: '이 형식에서 찾을 수 없으며 선언에서 이유를 밝히지 않았습니다 — 아직 결정되지 않은 사항입니다.'
  todo: '이 형식에서 원하는 것이지만 아직 없습니다.'
  shared: '%bundles%에 의해 또한 보유됩니다. 결함이 아닙니다 — 로더가 별칭으로 구분합니다 — 그러나 하나의 요소가 다시 그려졌는지 아니면 이름을 공유하는 두 개인지 아는 것이 중요합니다.'
format:
  style:
    title: 스타일
    description: '구성 요소가 페이지에 있을 때 로더에 의해 로드되는 스타일 시트입니다.'
  template:
    title: 템플릿
    description: 'twig에 의해 그려지는 서버 렌더러입니다.'
  vue:
    title: Vue
    description: '브라우저에서 동일한 옵션으로 그려지는 클라이언트 쌍입니다.'
  script:
    title: 스크립트
    description: '문서에 삽입된 후 마크업에 바인딩된 동작입니다.'
  schema:
    title: 스키마
    description: '계약: 구성 요소가 수용하는 것, 유형 및 기본값. 다른 모든 렌더러는 이에 대해 확인할 수 있습니다.'
  ai:
    title: AI
    description: '구성 요소에 대해 에이전트에게 전달된 내용: 스키마, 사용 방법, 이에 대해 작동하는 도구들입니다.'
  react:
    title: React
    description: '리액트 렌더러입니다.'
  flutter:
    title: Flutter
    description: '스키마에 대해 다트로 작성된 플러터 렌더러입니다. 마크업은 전달되지 않으며 계약과 토큰만 전달됩니다.'
section:
  matrix:
    title: '형식별 요소'
    description: '각 구성 요소당 하나의 행, 각 렌더러당 하나의 열. 구성 요소는 `components/` 아래의 디렉토리로, 그릴 수 있는 모든 방법을 보유합니다 — `spinner/spinner.scss`, `spinner.html.twig`, `spinner.vue`, `spinner.ts` — 그래서 여기서는 네 개의 디렉토리를 이름으로 조정할 필요가 없습니다. 셀은 그 뒤에 있는 파일을 계산합니다 — 하나 위에 마우스를 올리면 파일을 볼 수 있습니다. 모든 선언된 요소는 동일한 수준에서 읽히며 — 단일 형식에서 발견된 행은 간격이거나 다른 것을 원하지 않는 원시일 수 있으며, 이를 정리하는 것이 이 표의 작업입니다. 네 가지 상태는 다음 차례가 누구인지에 따라 구분됩니다: 확인, 요소가 존재함; 경고, 필요하지만 누락됨; 취소된 원, 고의적으로 생략됨; 빈칸, 아무도 아직 결정하지 않음. 경고 또는 원에 마우스를 올리면 선언이 무엇을 말하는지 볼 수 있습니다.'
  sources:
    title: '이것들이 어디서 왔는지'
    description: '번들은 그렇게 말했기 때문에 표에 있습니다 — `DesignSystemElementsBundleInterface`를 구현함으로써, 번들이 로더에게 자신의 전면 경로에 대해 알리는 방법입니다. 각 번들은 자신의 자산 내에 `data/elements.json`을 작성하며, 이를 함께 게시하여 빌드, 노드 측, 다른 언어 또는 에이전트가 동일한 파일에서 작업할 수 있도록 합니다. 이 페이지는 그들의 합집합일 뿐입니다.'
  abstract:
    title: 추상
    description: '`components/_abstract/` 아래의 다섯 가지 기초로, 그 누구도 그리지 않습니다 — 단지 확장될 뿐입니다. `_abstract/vue`는 삼 개의 빈 twig 블록으로, 서른하나 개의 템플릿이 채워집니다; `_abstract/form-field`는 열두 개의 입력이 구축되는 기반입니다. 그들은 형태와 마찬가지로 매트릭스에서 제외되며, 아무에게도 제공되지 않기 때문에 스키마나 리액트 쌍에 대해 요청하는 것은 그들이 대답할 방법이 없는 질문을 하는 것입니다. 밑줄은 아무도 디렉토리를 열기 전에 그렇게 말합니다. 보여지는 것은 누구나 확장하는 각자가 이미 제공하는 것입니다.'
  shapes:
    title: 형태
    description: '형태는 렌더러가 없는 스타일입니다: 마크업을 작성하고, 클래스 를 추가하고, 자신의 스타일 시트에서 스타일 시트를 `@use`합니다. `.stack`, `.grid`, `.block`, `.cluster`. 여기 나열되어 있고 위의 표에는 없는 이유는 렌더러의 표에 제공할 수 있는 열이 없기 때문입니다 — 그리고 그들의 부재가 경고가 모두 작업을 의미하게 만드는 이유입니다. 선은 파일에 의해 그려지며, 취향에 의해 그려지는 것이 아닙니다: 형태는 정확히 하나의 `.scss`이고, 아무것도 렌더링하지 않으므로, 언젠가 `.html.twig`를 갖게 되면 `components/`로 이동하여 매트릭스에 합류합니다. 그 이동이 유일한 승진입니다. 각자가 자신에 대해 말하는 것은 자신의 스타일 시트의 머리에서 읽히므로, 다른 곳에서 drift할 수 있는 두 번째 장소는 없습니다.'
  coverage:
    title: '이것이 빠뜨리는 것'
    description: '스캔이 거치지 않는 `assets/`의 디렉토리, 메모리가 아닌 디스크에서 나열됩니다. 믹스인, 유틸리티 및 토큰은 요소가 아니며 여기에 행이 될 수 없습니다; 레이아웃 및 공유 스크립트는 요소이며 아직 다루어지지 않았습니다.'
