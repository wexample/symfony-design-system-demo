~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Passaggi
page_icon: 'ph:bold/steps'
intro: 'Dove si trova un lettore in una sequenza — un tunnel, un modulo in più parti. I passaggi già percorsi sono evidenziati e possono essere rivisitati quando vengono forniti un indirizzo; quello attuale risalta; quelli futuri aspettano, in modo discreto.'
section:
  labelled:
    title: 'Numerati e nominati'
    description: 'Il caso comune: un numero per contare, una parola per sapere cosa chiede. I due passaggi già percorsi si collegano indietro.'
  numbers:
    title: 'Solo numeri'
    description: 'Dove i passaggi non hanno nomi degni di essere letti, o la larghezza non ha spazio per essi.'
  words:
    title: 'Solo parole'
    description: "Senza i numeri, quando l'ordine è ovvio dalle parole."
  ends:
    title: 'Primo e ultimo'
    description: 'Niente percorso ancora, poi tutto percorso tranne il passaggio attuale.'
  unknown:
    title: 'Passaggi non ancora decisi'
    description: "Dove i sentieri si dividono, ciò che ci aspetta dipende da una risposta non ancora data. Il passaggio che lo rappresenta non ha numero e non muove gli altri: l'ultimo passaggio qui è il terzo, non il quarto."
  compact:
    title: 'Compatto e punti'
    description: "Per l'intestazione di un modulo o di un pannello, dove c'è poco spazio: compatto mantiene i numeri e nomina solo il passaggio attuale; i punti disegnano un punto per passaggio e non nominano nulla sullo schermo, i nomi rimangono per chi legge la pagina ad alta voce. Proprio sotto l'intestazione di un modulo o di un pannello, un passaggio occupa il posto della barra di caricamento."
  toolbar:
    title: 'In una barra degli strumenti'
    description: 'Disposta in una barra sopra una pagina, occupa lo spazio che la barra le offre.'
  vue:
    title: 'In vue'
    description: 'Lo stesso passaggio in un albero vue. Passaggi senza un indirizzo possono diventare pulsanti: una sequenza mantenuta dalla pagina si muove sul `select` che emette piuttosto che su un nuovo indirizzo.'
step:
  account: Account
  address: Indirizzo
  payment: Pagamento
  confirm: Conferma
  choice: 'Il tuo piano'
