~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Adımlar
page_icon: 'ph:bold/steps'
intro: 'Bir okuyucunun bir dizideki yeri — bir tünel, birkaç bölümden oluşan bir form. Arkadaki adımlar belirgin bir şekilde çizilmiş ve bir adres verildiğinde geri dönülebilir; yapılan adım öne çıkıyor; öndekiler ise bekliyor, dikkati dağıtmadan.'
section:
  labelled:
    title: 'Numaralandırılmış ve adlandırılmış'
    description: 'Ortak durum: saymak için bir numara, neyi sorduğunu bilmek için bir kelime. İki adım zaten yüründü ve geri bağlanıyor.'
  numbers:
    title: 'Sadece sayılar'
    description: 'Adların okunmaya değer olmadığı ya da genişliğin onlara yer açmadığı yer.'
  words:
    title: 'Sadece kelimeler'
    description: 'Sayılar olmadan, sıranın kelimelerden belli olduğu durum.'
  ends:
    title: 'İlk ve son'
    description: 'Henüz hiçbir adım atılmadı, sonra her şey yüründü ama yapılan adım hariç.'
  unknown:
    title: 'Henüz karar verilmemiş adımlar'
    description: 'Yolların ayrıldığı yer, ileriye ne olacağı henüz verilmemiş bir cevaba bağlı. Bunun için olan adım bir numara almaz ve diğerlerini hareket ettirmez: burada son adım üçüncüdür, dördüncü değil.'
  compact:
    title: 'Kompakt ve noktalar'
    description: 'Bir modal veya panelin başlığı için, az yer olduğunda: kompakt, sayıları korur ve sadece yapılan adın adını alır; noktalar her adım için bir nokta çizer ve ekranda hiçbir isim göstermez, isimler sayfayı yüksek sesle okuyan için kalır. Bir modal veya panelin başlığının hemen altında, bir adım yükleme çubuğunun yerini alır.'
  toolbar:
    title: 'Bir araç çubuğunda'
    description: 'Bir sayfanın üstünde bir çubukta yer alır, çubuğun verdiği yeri alır.'
  vue:
    title: 'Vue içinde'
    description: 'Bir vue ağacındaki aynı adım. Adres içermeyen adımlar buton haline getirilebilir: sayfa tarafından tutulan bir dizi, yaydığı `seç` ile ilerler, yeni bir adrese değil.'
step:
  account: Hesap
  address: Adres
  payment: Ödeme
  confirm: Onay
  choice: Planınız
