hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: मेनू
  page_icon: 'ph:bold/list'
  section:
    split:
      title: 'स्प्लिट बटन'
      description: "एक बटन जो एक काम करता है और अन्य विकल्प प्रदान करता है: इसका मुख्य हिस्सा कार्रवाई करता है, जबकि अंत में लगा कैरेट — और केवल कैरेट — मेनू खोलता है। `button_menu` को एक `action` दिया गया है — `{ href }`, या `{ type: 'submit' }` एक फॉर्म में; vue वाला `action` को उत्सर्जित करता है।"
    vue:
      title: व्यू
      description: 'लिंक पंक्ति और विभाजक vue आंशिकों के रूप में। उन पंक्तियों के विपरीत जो एक मार्ग पढ़ती हैं, ये दोनों अपने आइकन और लेबल को विकल्प के रूप में लेती हैं, इसलिए सर्वर की कोई चीज़ गायब नहीं है।'
    menu:
      title: 'मेनू बटन'
    counts:
      title: गणनाएँ
      description: 'जो भी आइटम के अंत में जाता है, उसकी संख्या। यह एक गोली है और कुछ नहीं — लेबल के पास `गणना` डालें, एक ड्रॉपडाउन आइटम या एक वर्टिकल मेनू आइटम में, और आइटम इसे रखता है। एक कुंजी के बिना आइटम कुछ नहीं दिखाता।'
    separators:
      title: विभाजक
      description: 'एक विभाजक अन्य आइटम की तरह एक आइटम है, इसके पास एक और कुंजी है: एक नग्न रेखा दो आइटमों के समूहों को अलग करती है जो एक-दूसरे से संबंधित नहीं होते, और वही रेखा एक शब्द देने पर आगे जो कुछ है उसका शीर्षक बन जाती है। स्टैक के दोनों किनारे एक ही घोषणा पढ़ते हैं — यहाँ तीसरा मेनू vue है।'
    kinds:
      title: 'एक आइटम क्या हो सकता है'
      description: 'चार प्रकार एक पंक्ति साझा करते हैं: एक शब्द और एक लक्ष्य एक लिंक है, एक शब्द और एक स्थिति एक टॉगल है, एक शब्द और बच्चे एक शाखा है, और एक नग्न रेखा एक विभाजक है। कुछ भी अपने प्रकार की घोषणा नहीं करता — यह आइटम में जो होता है उससे निकलता है। एक टॉगल अपने मार्क पर अपने अग्रणी स्लॉट को खर्च करता है, इसलिए उनमें से एक कॉलम अपने शब्दों को संरेखित रखता है, और पैनल इसके नीचे खुला रहता है: फ़िल्टर का एक मेनू मुट्ठी भर में पढ़ा जाता है, एक बार में नहीं।'
  menu:
