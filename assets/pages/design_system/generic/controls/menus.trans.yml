th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: เมนู
  page_icon: 'ph:bold/list'
  section:
    split:
      title: ปุ่มแยก
      description: "ปุ่มที่ทำหนึ่งสิ่งและเสนอสิ่งอื่น: ตัวปุ่มทำการกระทำ ขอบที่ติดอยู่ที่ปลายของมัน — และเฉพาะขอบเท่านั้น — จะเปิดเมนู `button_menu` ที่มี `action` — `{ href }` หรือ `{ type: 'submit' }` ในฟอร์ม; เวอร์ชัน vue จะส่งออก `action`."
    vue:
      title: Vue
      description: 'แถวลิงก์และตัวแบ่งในรูปแบบ Vue โดยไม่เหมือนกับแถวที่อ่านเส้นทาง สองตัวนี้จะใช้ไอคอนและป้ายกำกับเป็นตัวเลือก ดังนั้นไม่มีอะไรที่ขาดหายไปจากเซิร์ฟเวอร์'
    menu:
      title: ปุ่มเมนู
    counts:
      title: จำนวน
      description: 'จำนวนของสิ่งที่ไอเท็มชี้ไปที่ปลายสุดของแถว เป็นเพียงยาที่ไม่มีอย่างอื่น — ส่ง `count` ข้างป้ายกำกับ ในรายการดรอปดาวน์หรือในรายการเมนูแนวตั้ง และไอเท็มจะวางมัน ไอเท็มที่ไม่มีคีย์จะไม่แสดงอะไรเลย'
    separators:
      title: ตัวแบ่ง
      description: 'ตัวแบ่งคือไอเท็มที่เหมือนกับไอเท็มอื่นๆ โดยมีคีย์เพิ่มเติม: แถวเปล่าจะแยกสองกลุ่มของไอเท็มที่ไม่มีความเกี่ยวข้องกัน และแถวเดียวกันถ้าให้คำจะกลายเป็นหัวข้อของสิ่งที่ตามมา ทั้งสองด้านของสแต็คอ่านคำประกาศเดียวกัน — เมนูที่สามที่นี่คือเมนู Vue'
    kinds:
      title: ประเภทของไอเท็ม
      description: 'สี่ประเภทแบ่งปันแถวเดียว: คำและเป้าหมายคือลิงก์ คำและสถานะคือการสลับ คำและเด็กคือสาขา และแถวเปล่าคือตัวแบ่ง ไม่มีอะไรประกาศประเภทของมัน — มันตามมาจากสิ่งที่ไอเท็มมีอยู่ การสลับใช้ช่องนำของมันกับเครื่องหมายของมัน ดังนั้นคอลัมน์ของมันจึงรักษาคำให้ตรงกัน และแผงจะเปิดอยู่ใต้: เมนูฟิลเตอร์จะอ่านเป็นกลุ่ม ไม่ใช่ทีละรายการ'
  menu:
