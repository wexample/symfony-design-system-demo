      description: "Un pulsante che fa una cosa e offre le altre: il suo corpo esegue l'azione, il cursore attaccato alla sua estremità — e solo il cursore — apre il menu. `button_menu` dato un `action` — `{ href }`, o `{ type: 'submit' }` in un modulo; il vue emette `action`."
    vue:
      title: Vue
      description: "La riga dei link e il separatore come partials vue. A differenza delle righe che leggono una rotta, questi due prendono la loro icona e l'etichetta come opzioni, quindi nulla del server è mancante."
    menu:
      title: 'Pulsanti del menu'
    counts:
      title: Conteggi
      description: "Quanti di qualsiasi cosa porta l'elemento, all'estremità della riga. È una pillola e null'altro — passa `count` accanto all'etichetta, in un elemento a discesa o in un elemento del menu verticale, e l'elemento lo colloca. Un elemento senza la chiave non mostra nulla."
    separators:
      title: Separatori
      description: "Un separatore è un elemento come gli altri, con una chiave in più: una linea semplice separa due gruppi di elementi che non hanno nulla a che fare l'uno con l'altro, e la stessa linea data una parola diventa il titolo di ciò che segue. Entrambi i lati dello stack leggono la stessa dichiarazione — il terzo menu qui è quello vue."
    kinds:
      title: 'Cosa può essere un elemento'
      description: "Quattro tipi condividono una riga: una parola e un obiettivo è un link, una parola e uno stato è un toggle, una parola e figli è un ramo, e una linea semplice è un separatore. Niente dichiara il suo tipo — deriva da ciò che l'elemento porta. Un toggle spende il suo slot principale sul suo marchio, quindi una colonna di essi mantiene le sue parole allineate, e il pannello rimane aperto sotto di esso: un menu di filtri è letto a manciate, non uno alla volta."
