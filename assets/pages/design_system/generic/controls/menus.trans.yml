      description: "Painike, joka tekee yhden asian ja tarjoaa muita: sen runko suorittaa toiminnon, nuoli, joka on kiinnitetty sen päähän — ja vain nuoli — avaa valikon. `button_menu` annettuna `action` — `{ href }`, tai `{ type: 'submit' }` lomakkeessa; vue-versio lähettää `action`."
    vue:
      title: Vue
      description: 'Linkkirivi ja erotin vue-osina. Toisin kuin reitit, jotka lukevat reittiä, nämä kaksi ottavat ikonin ja etiketin vaihtoehtoina, joten serveriltä ei jää mitään puuttumaan.'
    menu:
