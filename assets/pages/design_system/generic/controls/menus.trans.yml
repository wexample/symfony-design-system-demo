      description: "Bir şeyi yapan ve diğerlerini sunan bir düğme: gövdesi eylemi gerçekleştirir, ucuna takılı olan ok — ve sadece ok — menüyü açar. `button_menu` bir `action` — `{ href }` veya bir formda `{ type: 'submit' }` verir; vue'daki biri `action` yayar."
    vue:
      title: Vue
      description: 'Bağlantı satırı ve ayırıcı, vue parçaları olarak. Bir rotayı okuyan satırlardan farklı olarak, bu ikisi simgesini ve etiketini seçenek olarak alır, bu nedenle sunucudan hiçbir şey eksik değildir.'
