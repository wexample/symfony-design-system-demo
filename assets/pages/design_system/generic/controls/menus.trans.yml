      description: 'Baris tautan dan pemisah sebagai bagian vue. Berbeda dengan baris yang membaca rute, kedua ini mengambil ikon dan label sebagai opsi, jadi tidak ada yang hilang dari server.'
    menu:
      title: 'Tombol menu'
    counts:
