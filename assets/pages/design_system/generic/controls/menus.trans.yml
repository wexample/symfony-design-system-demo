ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Меню
  page_icon: 'ph:bold/list'
  section:
    split:
      title: 'Разделенные кнопки'
      description: "Кнопка, которая выполняет одно действие и предлагает другие: ее основная часть выполняет действие, а стрелка, прикрепленная к ее концу — и только стрелка — открывает меню. `button_menu` принимает `action` — `{ href }`, или `{ type: 'submit' }` в форме; vue-версия генерирует `action`."
    vue:
      title: Vue
      description: 'Строка ссылок и разделитель как части vue. В отличие от строк, которые читают маршрут, эти две принимают свои иконки и метки в качестве опций, так что ничего с сервера не пропущено.'
    menu:
      title: 'Кнопки меню'
    counts:
      title: Количество
      description: 'Сколько чего-либо ведет к элементу, в самом конце строки. Это просто счетчик — передайте `count` рядом с меткой, в элементе выпадающего списка или вертикальном элементе меню, и элемент разместит его. Элемент без ключа ничего не показывает.'
    separators:
      title: Разделители
      description: 'Разделитель — это элемент, как и остальные, с одним дополнительным ключом: простая линия разделяет два ряда элементов, которые не имеют ничего общего, и если той же линии дать слово, она станет заголовком того, что следует. Оба конца стека читают одно и то же объявление — третье меню здесь является vue.'
    kinds:
      title: 'Что может быть элементом'
      description: 'Четыре вида делят один ряд: слово и цель — это ссылка, слово и состояние — это переключатель, слово и дочерние элементы — это ветка, а простая линия — это разделитель. Ничто не объявляет своего рода — это следует из того, что несет элемент. Переключатель тратит свое ведущее место на свой знак, так что колонка из них сохраняет свои слова выровненными, и панель остается открытой под ней: меню фильтров читается по нескольку, а не по одному за раз.'
