en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Menus
  page_icon: ph:bold/list

  section:
    press:
      title: Pressed, pointed at, pressed by an agent
      description: "A press is answered where it landed: a wave spreads from the point touched, on buttons and menu entries — a mobile habit, and a desktop one too. `data-ripple=\"off\"` on the element keeps it still. An agent pointing the reader at something outlines it (`is-assisted`); an agent pressing it sends the wave from its middle, in the accent, outlined while it spreads, so the reader sees who touched."
    split:
      title: Split buttons
      description: "A button that does one thing and offers the others: its body does the action, the caret stuck to its end — and only the caret — opens the menu. `button_menu` given an `action` — `{ href }`, or `{ type: 'submit' }` in a form; the vue one emits `action`."
    vue:
      title: Vue
      description: "The link row and the separator as vue partials. Unlike the rows that read a route, these two take their icon and label as options, so nothing of the server is missing."
    menu:
      title: Menu buttons
    counts:
      title: Counts
      description: "How many of whatever the item leads to, at the far end of the line. It is a pill and nothing else — pass `count` beside the label, in a dropdown item or a vertical menu item, and the item places it. An item without the key shows nothing."
    separators:
      title: Separators
      description: "A separator is an item like the others, with one key more: a bare line parts two runs of items that have nothing to do with each other, and the same line given a word becomes the heading of what follows. Both sides of the stack read the same declaration — the third menu here is the vue one."

    kinds:
      title: What an item can be
      description: "Four kinds share one row: a word and a target is a link, a word and a state is a toggle, a word and children is a branch, and a bare line is a separator. Nothing declares its kind — it follows from what the item carries. A toggle spends its leading slot on its mark, so a column of them keeps its words aligned, and the panel stays open under it: a menu of filters is read by the handful, not one at a time."

  menu:
    press:
      ripple: Answers a press
      still: Stays still
      assisted: Pointed at by an agent
      agent: Pressed by an agent
      trigger: Press it as an agent would
    primary: Menu button
    save: Save
    save_vue: Save, in vue
    publish: Publish
    filters: Filters
    filters_vue: Filters, in vue
    counted: With counts
    counted_vue: With counts, in vue
    grouped: Grouped items
    grouped_vue: Grouped, in vue
    group:
      danger: Danger zone
      show: Show
    more: More actions
    invert: Invert menu
    options:
      top_left: Top left
      top_right: Top right
    item:
      report: Report
      draft: Save as draft
      copy: Save a copy
      schedule: Schedule
      inbox: Inbox
      alerts: Alerts
      settings: Settings
      logout: Log out
      long: With a quite, quite, quite, quite long title
      stats: Statistics
      profile: Profile
      delete: Delete account
      done: Done
      running: Running
      failed: Failed
      sort: Sort by
      sort_name: Name
      sort_date: Last change
      docs: Documentation

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: القوائم
  page_icon: 'ph:bold/list'
  section:
    split:
      title: 'أزرار مفصولة'
      description: "زر يقوم بفعل واحد ويقدم الخيارات الأخرى: جسده يقوم بالإجراء، والسهم الملتصق بنهايته — وفقط السهم — يفتح القائمة. `button_menu` يتم إعطاؤه `action` — `{ href }`، أو `{ type: 'submit' }` في نموذج؛ الـ vue يقوم بإصدار `action`."
    vue:
      title: فيو
      description: 'صف الارتباط والفاصل كأجزاء فيو. على عكس الصفوف التي تقرأ مسارًا، تأخذ هذان الخياران أيقونتهما ووسمها كخيارات، لذا لا ينقص شيء من الخادم.'
    menu:
      title: 'أزرار القائمة'
    counts:
      title: العدادات
      description: 'كم عدد ما يقود إليه العنصر، في أقصى نهاية الخط. إنها حبة وليس شيء آخر - مرر `count` بجانب الوسم، في عنصر منسدلة أو عنصر قائمة عمودية، ويضع العنصر ذلك. العنصر بدون المفتاح لا يظهر شيئًا.'
    separators:
      title: الفواصل
      description: 'الفاصل هو عنصر مثل الآخرين، مع مفتاح واحد إضافي: خط عار يفصل بين مجموعتين من العناصر التي لا علاقة لها ببعضها البعض، ويصبح نفس الخط مع إعطاء كلمة عنوان ما يلي. تقرأ كلا جانبي المكدس نفس البيان - القائمة الثالثة هنا هي قائمة فيو.'
    kinds:
      title: 'ما يمكن أن يكون عليه العنصر'
      description: 'أربعة أنواع تتشارك في صف واحد: كلمة وهدف هي رابط، كلمة وحالة هي تبديل، كلمة وأطفال هي فرع، وخط عار هو فاصل. لا يعلن أي شيء عن نوعه - يتبع مما يحمله العنصر. ينفق التبديل مكانه الرائد على علامته، لذا يبقى عمود منها كلماتها متراصة، وتظل اللوحة مفتوحة تحتها: تقرأ قائمة الفلاتر باليد، وليس واحدة في كل مرة.'
