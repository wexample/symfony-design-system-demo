es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Menús
  page_icon: 'ph:bold/list'
  section:
    split:
      title: 'Botones divididos'
      description: "Un botón que realiza una acción y ofrece otras opciones: su cuerpo ejecuta la acción, la flecha en su extremo — y solo la flecha — abre el menú. `button_menu` dado un `action` — `{ href }`, o `{ type: 'submit' }` en un formulario; el de vue emite `action`."
    vue:
      title: Vue
      description: 'La fila de enlaces y el separador como parciales de vue. A diferencia de las filas que leen una ruta, estos dos toman su ícono y etiqueta como opciones, por lo que no falta nada del servidor.'
    menu:
      title: 'Botones de menú'
    counts:
      title: Contadores
      description: 'Cuántos de lo que sea que el elemento conduce, al final de la línea. Es una pastilla y nada más: pasa `count` junto a la etiqueta, en un elemento desplegable o un elemento de menú vertical, y el elemento lo coloca. Un elemento sin la clave no muestra nada.'
    separators:
      title: Separadores
      description: 'Un separador es un elemento como los demás, con una clave más: una línea simple separa dos grupos de elementos que no tienen nada que ver entre sí, y la misma línea dada una palabra se convierte en el encabezado de lo que sigue. Ambos lados de la pila leen la misma declaración: el tercer menú aquí es el de vue.'
    kinds:
      title: 'Lo que un elemento puede ser'
      description: 'Cuatro tipos comparten una fila: una palabra y un destino es un enlace, una palabra y un estado es un interruptor, una palabra y niños es una rama, y una línea simple es un separador. Nada declara su tipo: se deduce de lo que lleva el elemento. Un interruptor gasta su espacio principal en su marca, por lo que una columna de ellos mantiene sus palabras alineadas, y el panel permanece abierto debajo de él: un menú de filtros se lee por la cantidad, no uno a la vez.'
