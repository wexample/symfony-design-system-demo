en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: "Choices"
  page_icon: ph:bold/list-checks

  intro: "One choice among options shown whole, each with a line saying more of it: read before one is taken, where a select would fold them away. The one chosen is ticked."
  section:
    server:
      title: "Rendered by the server"
      description: "A press chooses; the list says which with choice-list:change. An option may be out of reach."
    filter:
      title: "Many options"
      description: "Past filter_from options, a field narrows them by their words."
    vue:
      title: "Vue"
      description: "The same list as a component, bound with v-model."
  chosen: "Chosen: %value%"
  option:
    table:
      label: "Table"
      description: "Rows and columns, sorted as you like."
    board:
      label: "Board"
      description: "Cards in columns, one per status."
    calendar:
      label: "Calendar"
      description: "Each item on its date."
    timeline:
      label: "Timeline"
      description: "One line per item, in order."
    map:
      label: "Map"
      description: "Needs a location on each item."
    gallery:
      label: "Gallery"
    chart:
      label: "Chart"
    report:
      label: "Report"

ar:
