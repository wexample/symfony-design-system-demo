bn:
  page_title: "পছন্দ"
  intro: "সম্পূর্ণ দেখানো বিকল্পগুলোর মধ্যে একটি বেছে নেওয়া, প্রতিটির সঙ্গে ব্যাখ্যার একটি লাইন: বেছে নেওয়ার আগে পড়া যায়, যেখানে select সেগুলো ভাঁজ করে রাখত। বেছে নেওয়াটি চিহ্নিত।"
  section:
    server:
      title: "সার্ভারে রেন্ডার করা"
      description: "একটি ক্লিক বেছে নেয়; তালিকা choice-list:change দিয়ে জানায়। কোনো বিকল্প অনুপলব্ধ হতে পারে।"
    filter:
      title: "অনেক বিকল্প"
      description: "filter_from টি বিকল্পের পর একটি ঘর শব্দ দিয়ে সেগুলো ছাঁকে।"
    vue:
      title: "Vue"
      description: "একই তালিকা কম্পোনেন্ট হিসেবে, v-model দিয়ে যুক্ত।"
  chosen: "বেছে নেওয়া: %value%"
