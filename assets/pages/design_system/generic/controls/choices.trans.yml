      title: "Vue"
      description: "القائمة نفسها كمكوّن، مربوطة بـ v-model."
  chosen: "المختار: %value%"
  option:
    table:
      label: "جدول"
      description: "صفوف وأعمدة، مرتبة كما تشاء."
    board:
      label: "لوحة"
      description: "بطاقات في أعمدة، عمود لكل حالة."
    calendar:
      label: "تقويم"
      description: "كل عنصر في تاريخه."
    timeline:
      label: "خط زمني"
      description: "سطر لكل عنصر، بالترتيب."
    map:
