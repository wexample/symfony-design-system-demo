    table:
      label: "সারণি"
      description: "সারি ও কলাম, ইচ্ছেমতো সাজানো।"
    board:
      label: "বোর্ড"
      description: "কলামে কার্ড, প্রতিটি অবস্থার জন্য একটি।"
    calendar:
      label: "ক্যালেন্ডার"
      description: "প্রতিটি আইটেম তার তারিখে।"
    timeline:
      label: "টাইমলাইন"
      description: "প্রতি আইটেমে একটি লাইন, ক্রমানুসারে।"
    map:
      label: "মানচিত্র"
      description: "প্রতিটি আইটেমে একটি অবস্থান দরকার।"
