  page_title: "گزینه‌ها"
  intro: "یک انتخاب میان گزینه‌هایی که کامل نمایش داده می‌شوند، هر کدام با یک خط توضیح: پیش از انتخاب خوانده می‌شوند، جایی که select آن‌ها را جمع می‌کرد. گزینهٔ انتخاب‌شده تیک خورده است."
