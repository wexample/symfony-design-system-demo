~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Steppers
page_icon: 'ph:bold/steps'
intro: 'Di mana pembaca berada dalam urutan — sebuah terowongan, sebuah formulir yang terdiri dari beberapa bagian. Langkah-langkah di belakang digambar dengan jelas dan dapat kembali ketika mereka diberi alamat; yang sedang dilakukan menonjol; yang di depan menunggu, dengan tenang.'
section:
  labelled:
    title: 'Diberi nomor dan nama'
    description: 'Kasus umum: sebuah nomor untuk dihitung, sebuah kata untuk mengetahui apa yang diminta. Dua langkah yang sudah dilalui terhubung kembali.'
  numbers:
    title: 'Hanya angka'
    description: 'Di mana langkah-langkah tidak memiliki nama yang layak dibaca, atau lebar tidak ada ruang untuk mereka.'
  words:
    title: 'Hanya kata'
    description: 'Tanpa angka, ketika urutannya jelas dari kata-kata.'
  ends:
    title: 'Pertama dan terakhir'
    description: 'Belum ada yang dilalui, kemudian semuanya sudah dilalui kecuali langkah yang sedang dilakukan.'
  unknown:
    title: 'Langkah yang belum ditentukan'
    description: 'Di mana jalur bercabang, apa yang ada di depan tergantung pada jawaban yang belum diberikan. Langkah yang mewakili tidak memiliki nomor dan tidak memindahkan yang lain: langkah terakhir di sini adalah yang ketiga, bukan yang keempat.'
  compact:
    title: 'Kompak, dan titik'
    description: 'Untuk header modal atau panel, di mana ada sedikit ruang: kompak mempertahankan angka dan nama langkah yang sedang dilakukan saja; titik menggambar satu titik per langkah dan tidak menampilkan nama di layar, nama tetap untuk siapa pun yang membaca halaman dengan suara keras. Tepat di bawah header modal atau panel, steppers mengambil tempat bilah pemuatan.'
  toolbar:
    title: 'Dalam bilah alat'
    description: 'Ditempatkan di bilah di atas halaman, itu mengambil ruang yang diberikan oleh bilah tersebut.'
  vue:
    title: 'Dalam vue'
    description: 'Stepper yang sama dalam pohon vue. Langkah tanpa alamat dapat dibuat tombol: urutan yang dipegang oleh halaman bergerak pada `select` yang dipancarkannya daripada pada alamat baru.'
step:
  account: Akun
  address: Alamat
  payment: Pembayaran
  confirm: Konfirmasi
  choice: 'Rencana Anda'
