~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: মেনু
page_icon: 'ph:bold/list'
section:
  vue:
    title: ভিউ
    description: 'লিঙ্ক রো এবং সেপারেটর ভিউ পার্সিয়াল হিসেবে। যেভাবে রো গুলো একটি রুট পড়ে, এই দুটি তাদের আইকন এবং লেবেল অপশন হিসেবে নেয়, তাই সার্ভারের কিছুই মিস হয় না।'
  menu:
    title: 'মেনু বোতাম'
  counts:
    title: গণনা
    description: 'যা কিছু আইটেমের দিকে নিয়ে যায় তার সংখ্যা, লাইনের শেষ প্রান্তে। এটি একটি পিল এবং কিছুই নয় — লেবেলের পাশে `count` পাস করুন, একটি ড্রপডাউন আইটেম বা একটি উল্লম্ব মেনু আইটেমে, এবং আইটেমটি এটি স্থাপন করে। কী ছাড়া একটি আইটেম কিছুই দেখায় না।'
  separators:
    title: সেপারেটর
    description: 'একটি সেপারেটর অন্যদের মতো একটি আইটেম, এক কীগুলির সাথে: একটি খালি লাইন দুটি আইটেমের চালনা আলাদা করে যাদের মধ্যে কিছু নেই, এবং একই লাইন একটি শব্দ দিলে পরবর্তী বিষয়ের শিরোনাম হয়ে যায়। স্ট্যাকের উভয় পাশে একই ঘোষণাটি পড়ে — এখানে তৃতীয় মেনুটি ভিউ মেনু।'
  kinds:
    title: 'একটি আইটেম কি হতে পারে'
    description: 'চার ধরনের একটি সারিতে ভাগ করা হয়: একটি শব্দ এবং একটি লক্ষ্য একটি লিঙ্ক, একটি শব্দ এবং একটি রাষ্ট্র একটি টগল, একটি শব্দ এবং সন্তান একটি শাখা, এবং একটি খালি লাইন একটি সেপারেটর। কিছুই তার ধরনের ঘোষণা করে না — এটি আইটেমের বহন করা থেকে অনুসরণ করে। একটি টগল তার মার্কের জন্য তার লিডিং স্লট ব্যয় করে, তাই তাদের একটি কলাম তাদের শব্দগুলোকে সমান্তরাল রাখে, এবং প্যানেলটি তার নিচে খোলা থাকে: একটি ফিল্টার মেনু হাতের বোতল দ্বারা পড়া হয়, একসাথে নয়।'
