~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ستيبيرز
page_icon: 'ph:bold/steps'
intro: 'أين يقف القارئ في تسلسل - نفق، شكل في عدة أجزاء. الخطوات الخلفية مرسومة بشكل واضح ويمكن العودة إليها عندما يتم إعطاؤها عنوانًا؛ الخطوة التي يتم القيام بها بارزة؛ تلك التي في الأمام تنتظر، بشكل متحفظ.'
section:
  labelled:
    title: 'مرقمة ومسمّاة'
    description: 'الحالة الشائعة: رقم للعد، كلمة لمعرفة ما تطلبه. الخطوتان اللتان تم السير بهما تربطان إلى الوراء.'
  numbers:
    title: 'أرقام فقط'
    description: 'حيث لا توجد أسماء تستحق القراءة، أو العرض ليس لديه مساحة لها.'
  words:
    title: 'كلمات فقط'
    description: 'بدون الأرقام، عندما يكون الترتيب واضحًا من الكلمات.'
  ends:
    title: 'الأولى والأخيرة'
    description: 'لم يتم السير في شيء بعد، ثم كل شيء سار ما عدا الخطوة التي يتم القيام بها.'
  unknown:
    title: 'خطوات لم تتقرر بعد'
    description: 'حيث تتفرع الطرق، ما يكمن في الأمام يعتمد على إجابة لم تُعطَ بعد. الخطوة التي تمثلها لا تأخذ رقمًا ولا تحرك أيًا من الآخرين: آخر خطوة هنا هي الثالثة، وليست الرابعة.'
  compact:
    title: 'مضغوط، ونقاط'
    description: 'لعنوان نافذة أو لوحة، حيث لا توجد مساحة كبيرة: المضغوط يحتفظ بالأرقام ويسمّي الخطوة التي يتم القيام بها فقط؛ النقاط ترسم نقطة واحدة لكل خطوة ولا تسمي أيًا منها على الشاشة، الأسماء تبقى لمن يقرأ الصفحة بصوت عالٍ. مباشرة تحت عنوان نافذة أو لوحة، تأخذ الخطوات مكان شريط التحميل.'
  toolbar:
    title: 'في شريط أدوات'
    description: 'موضوع في شريط فوق الصفحة، يأخذ المساحة التي يمنحها الشريط.'
  vue:
    title: 'في فيو'
    description: 'نفس الخطوات في شجرة فيو. الخطوات بدون عنوان يمكن أن تكون أزرارًا: تسلسل محتفظ به من قبل الصفحة يتحرك على `select` الذي يخرجه بدلاً من عنوان جديد.'
step:
  account: الحساب
  address: العنوان
  payment: الدفع
  confirm: التأكيد
  choice: خطتك
