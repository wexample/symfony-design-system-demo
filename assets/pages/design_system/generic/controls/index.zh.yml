~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 控制
page_icon: 'ph:bold/cursor-click'
intro: 读者通过什么行动。每个动作都采取行动而不是值——表单字段取值，并位于下一个部分。
page:
  buttons:
    title: 按钮
    description: 执行某个操作的按钮，包括其变体、状态和密度，以及打开其他地方的链接和目标。
  menus:
    title: 菜单
    description: 一个打开选择列表的按钮，放置在窗口的边缘，处于twig和vue中。
  steppers:
    title: 步骤指示器
    description: 读者在步骤序列中的位置，后面的步骤可以返回。
section:
  compound:
    title: 综合
    description: 在三种上下文中提供相同的控制集：一个带衬垫的块，一个工具栏和一个紧凑的工具栏。三者之间控制的内容没有变化——区域决定了它们有多少空间。
button:
  primary: 主要按钮
select:
  option_one: 选项一
  option_two: 选项二
  option_three: 选项三
menu:
  primary: 菜单按钮
  item:
    report: 报告
    settings: 设置
    logout: 登出
    long: 标题非常非常非常非常长
switch:
  label_right: 启用功能
link:
  external: 外部链接
