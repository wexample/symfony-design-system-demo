~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 단계
page_icon: 'ph:bold/steps'
intro: '독자가 순서에서 어디에 있는지 — 터널, 여러 부분으로 나뉜 양식. 뒤의 단계는 단단히 그려져 주소가 주어지면 돌아갈 수 있다; 현재 진행 중인 단계는 두드러지며; 앞의 단계는 조용히 기다린다.'
section:
  labelled:
    title: '번호 매기기 및 이름 붙이기'
    description: '일반적인 경우: 세는 숫자, 요구하는 내용을 아는 단어. 이미 진행된 두 단계는 연결된다.'
  numbers:
    title: 숫자만
    description: '단계에 읽을 가치가 있는 이름이 없거나, 너비가 이를 수용할 공간이 없는 경우.'
  words:
    title: 단어만
    description: '숫자가 없고, 단어에서 순서가 명확할 때.'
  ends:
    title: '첫 단계와 마지막 단계'
    description: '아직 걷지 않은 단계, 그러고 나서 진행 중인 단계를 제외한 모든 단계가 걷혀졌다.'
  unknown:
    title: '아직 결정되지 않은 단계'
    description: '길이 나뉘는 곳, 앞으로 나아갈 것이 주어지지 않은 답변에 따라 달라진다. 그 단계는 번호가 없고 다른 단계도 이동시키지 않는다: 여기서 마지막 단계는 세 번째 단계이고, 네 번째 단계가 아니다.'
  compact:
    title: '간결함과 점들'
    description: '모달 또는 패널의 헤더에, 공간이 적은 경우: 간결함은 번호를 유지하고 현재 진행 중인 단계의 이름만 표시한다; 점은 각 단계에 대해 점 하나를 그리고 화면에는 이름을 표시하지 않으며, 이름은 페이지를 소리 내어 읽는 사람을 위해 남겨둔다. 모달 또는 패널의 헤더 바로 아래에, 단계 표시기가 로딩 바의 자리를 차지한다.'
  toolbar:
    title: 툴바에서
    description: '페이지 위쪽의 바에 배치되어, 바가 주는 공간을 차지한다.'
  vue:
    title: 뷰에서
    description: '같은 단계 표시기가 뷰 트리에 있다. 주소가 없는 단계는 버튼으로 만들 수 있다: 페이지가 발행하는 `select`를 통해 순서가 진행된다.'
step:
  account: 계정
  address: 주소
  payment: 결제
  confirm: 확인
  choice: '당신의 계획'
