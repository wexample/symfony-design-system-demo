~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: القوائم
page_icon: 'ph:bold/list'
section:
  vue:
    title: فيو
    description: 'صف الارتباط والفاصل كأجزاء فيو. على عكس الصفوف التي تقرأ مسارًا، تأخذ هذان الخياران أيقونتهما ووسمها كخيارات، لذا لا ينقص شيء من الخادم.'
  menu:
    title: 'أزرار القائمة'
  counts:
    title: العدادات
    description: 'كم عدد ما يقود إليه العنصر، في أقصى نهاية الخط. إنها حبة وليس شيء آخر - مرر `count` بجانب الوسم، في عنصر منسدلة أو عنصر قائمة عمودية، ويضع العنصر ذلك. العنصر بدون المفتاح لا يظهر شيئًا.'
  separators:
    title: الفواصل
    description: 'الفاصل هو عنصر مثل الآخرين، مع مفتاح واحد إضافي: خط عار يفصل بين مجموعتين من العناصر التي لا علاقة لها ببعضها البعض، ويصبح نفس الخط مع إعطاء كلمة عنوان ما يلي. تقرأ كلا جانبي المكدس نفس البيان - القائمة الثالثة هنا هي قائمة فيو.'
  kinds:
    title: 'ما يمكن أن يكون عليه العنصر'
    description: 'أربعة أنواع تتشارك في صف واحد: كلمة وهدف هي رابط، كلمة وحالة هي تبديل، كلمة وأطفال هي فرع، وخط عار هو فاصل. لا يعلن أي شيء عن نوعه - يتبع مما يحمله العنصر. ينفق التبديل مكانه الرائد على علامته، لذا يبقى عمود منها كلماتها متراصة، وتظل اللوحة مفتوحة تحتها: تقرأ قائمة الفلاتر باليد، وليس واحدة في كل مرة.'
