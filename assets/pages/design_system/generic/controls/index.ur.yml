~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: کنٹرول
page_icon: 'ph:bold/cursor-click'
intro: 'وہ سب کچھ جو ایک قاری عمل میں لاتا ہے۔ ان میں سے ہر ایک ایک عمل انجام دیتا ہے نہ کہ ایک قیمت — ایک فارم فیلڈ قیمت لیتا ہے، اور اگلے حصے میں رہتا ہے۔'
page:
  buttons:
    title: بٹن
    description: 'وہ جو کچھ کرتا ہے، اس کی مختلف حالتیں، اس کے حالات اور اس کی کثافتیں، ساتھ ہی وہ لنک اور ہدف جو کہیں اور کھلتا ہے۔'
  menus:
    title: میونوز
    description: 'ایک بٹن جو انتخاب کی فہرست کھولتا ہے، کھڑکی کے کناروں کے خلاف خود کو رکھتا ہے، شاخ اور نمائش میں۔'
  steppers:
    title: اسٹیپرز
    description: 'جہاں ایک قاری مراحل کی ترتیب میں کھڑا ہوتا ہے، پیچھے جانے کے لیے پچھلے مراحل کے ساتھ۔'
section:
  compound:
    title: 'سب کچھ ملا کر'
    description: 'تین سیاق و سباق میں کنٹرولز کا ایک ہی سیٹ: ایک پیڈڈ بلاک، ایک ٹول بار، اور ایک کمپیکٹ ٹول بار۔ تینوں کے درمیان کنٹرولز کے بارے میں کچھ بھی تبدیل نہیں ہوتا — علاقہ ہی انہیں یہ بتاتا ہے کہ ان کے پاس کتنا کمرہ ہے۔'
