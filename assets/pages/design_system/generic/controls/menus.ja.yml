~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: メニュー
page_icon: 'ph:bold/list'
section:
  vue:
    title: Vue
    description: リンク行とセパレーターはvueのパーシャルです。ルートを読み込む行とは異なり、これらの2つはアイコンとラベルをオプションとして取得するため、サーバーの情報は失われません。
  menu:
    title: メニューボタン
  counts:
    title: カウント
    description: 'アイテムが導く先の数です。行の端に表示されます。それはピルであり、それ以外の何物でもありません — ラベルの横に`count`を渡すと、ドロップダウンアイテムまたは縦メニューアイテムでアイテムが配置されます。キーのないアイテムは何も表示しません。'
  separators:
    title: セパレーター
    description: 'セパレーターは他のアイテムと同様のアイテムで、1つのキーが追加されています：単純なラインは、互いに関係のない2つのアイテムのグループを分けますが、同じラインに単語を与えると、次に続くものの見出しになります。スタックの両側は同じ宣言を読みます — ここにある3番目のメニューはvueのものです。'
  kinds:
    title: アイテムの種類
    description: '4つの種類が1行を共有します：単語とターゲットはリンク、単語と状態はトグル、単語と子要素はブランチ、裸のラインはセパレーターです。何もその種類を明示することはありません — それはアイテムが持つものから導かれます。トグルはその印にリーディングスロットを使うため、それらの列は単語を揃えたままにし、パネルはその下で開いたままになります：フィルターのメニューは一度に一つではなく、一握りで読むことができます。'
