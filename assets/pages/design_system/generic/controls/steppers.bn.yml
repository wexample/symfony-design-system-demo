~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: স্টেপার
page_icon: 'ph:bold/steps'
intro: 'একটি পাঠক একটি সিকোয়েন্সে কোথায় দাঁড়িয়ে আছে — একটি টানেল, একাধিক অংশের একটি ফর্ম। পিছনের স্টেপগুলো দৃঢ়ভাবে আঁকা হয় এবং যখন সেগুলোকে একটি ঠিকানা দেওয়া হয় তখন ফিরে যাওয়া যেতে পারে; যা করা হচ্ছে তা আলাদা; এগিয়ে থাকা সেগুলো অপেক্ষা করছে, অযথা।'
section:
  labelled:
    title: 'নম্বরযুক্ত এবং নামকৃত'
    description: 'সাধারণ ক্ষেত্রে: গণনা করার জন্য একটি সংখ্যা, যা জানতে একটি শব্দ। ইতিমধ্যেই হাঁটা দুইটি স্টেপ পিছনে লিঙ্ক করে।'
  numbers:
    title: 'শুধুমাত্র সংখ্যা'
    description: 'যেখানে স্টেপগুলোর পড়ার মতো নাম নেই, অথবা প্রস্থে তাদের জন্য কোনো জায়গা নেই।'
  words:
    title: 'শুধুমাত্র শব্দ'
    description: 'সংখ্যাগুলি ছাড়া, যখন শব্দগুলির থেকে অর্ডারটি স্পষ্ট।'
  ends:
    title: 'প্রথম এবং শেষ'
    description: 'এখনও কিছু হাঁটা হয়নি, তারপর সবকিছু হাঁটা হয়েছে কিন্তু যা করা হচ্ছে তা।'
  unknown:
    title: 'এখনও সিদ্ধান্ত নেওয়া স্টেপগুলি'
    description: 'যেখানে পথগুলি আলাদা হয়, সামনে যা আছে তা একটি উত্তর না দেওয়ার উপর নির্ভর করে। যা এই জন্য দাঁড়িয়ে আছে তা কোনো সংখ্যা নেয় না এবং অন্যগুলোর মধ্যে কোনোটি সরায় না: এখানে সর্বশেষ স্টেপটি তৃতীয়, চতুর্থ নয়।'
  compact:
    title: 'সংক্ষিপ্ত, এবং বিন্দু'
    description: 'একটি মডাল বা প্যানেলের শিরোনামের জন্য, যেখানে জায়গা কম: সংক্ষিপ্ত সংখ্যা এবং শুধু যে স্টেপটি করা হচ্ছে তা নাম রাখে; বিন্দুগুলি প্রতি স্টেপের জন্য একটি বিন্দু আঁকে এবং স্ক্রীনে কিছু নাম রাখে না, নামগুলি যে কেউ পৃষ্ঠা জোরে পড়ে তার জন্য থাকে। একটি মডাল বা প্যানেলের শিরোনামের ঠিক নিচে, একটি স্টেপার লোডিং বারের জায়গা নেয়।'
  toolbar:
    title: 'একটি টুলবারে'
    description: 'একটি পৃষ্ঠার উপরে একটি বারে স্থাপন করা হয়, এটি বারের প্রদত্ত জায়গা নেয়।'
  vue:
    title: ভিউতে
    description: 'একটি ভিউ গাছের মধ্যে একই স্টেপার। ঠিকানা ছাড়া স্টেপগুলো বোতাম বানানো যেতে পারে: একটি সিকোয়েন্স যা পৃষ্ঠায় ধরে রাখা হয় তা একটি `select` এর উপর চলে যা এটি নির্গত করে, নতুন ঠিকানার উপর নয়।'
step:
  account: অ্যাকাউন্ট
  address: ঠিকানা
  payment: পেমেন্ট
  confirm: নিশ্চিতকরণ
  choice: 'আপনার পরিকল্পনা'
