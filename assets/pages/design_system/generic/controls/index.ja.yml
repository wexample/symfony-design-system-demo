~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: コントロール
page_icon: 'ph:bold/cursor-click'
intro: 'リーダーが行動するためのものです。これらの各コントロールは値ではなくアクションを実行します — フォームフィールドは値を受け取り、次のセクションに存在します。'
page:
  buttons:
    title: ボタン
    description: 何かを実行するためのもので、さまざまなバリエーション、状態、密度を持ち、他の場所で開くリンクとターゲットがあります。
  menus:
    title: メニュー
    description: 選択肢のリストを開くボタンで、ウィンドウの端に配置され、twigとvueに対応しています。
  steppers:
    title: ステッパー
    description: リーダーがステップのシーケンスの中でどこにいるかを示し、後ろに戻るためのステップがあります。
section:
  compound:
    title: すべてを一緒に
    description: 3つのコンテキストでの同じコントロールのセット：パディング付きのブロック、ツールバー、およびコンパクトツールバー。3つの間でコントロールに関することは変わらず、領域がどれだけのスペースを持っているかを示します。
button:
  primary: プライマリボタン
select:
  option_one: オプション1
  option_two: オプション2
  option_three: オプション3
menu:
  primary: メニューボタン
  item:
    report: レポート
    settings: 設定
    logout: ログアウト
    long: かなり、かなり、かなり、かなり長いタイトルのもの
switch:
  label_right: 機能を有効にする
link:
  external: 外部リンク
