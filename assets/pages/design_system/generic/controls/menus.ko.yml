~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 메뉴
page_icon: 'ph:bold/list'
section:
  vue:
    title: Vue
    description: '링크 행과 구분선은 vue 부분입니다. 경로를 읽는 행과는 달리, 이 두 개는 아이콘과 레이블을 옵션으로 받으므로 서버의 어떤 것도 누락되지 않습니다.'
  menu:
    title: '메뉴 버튼'
  counts:
    title: 카운트
    description: '항목이 연결되는 수치, 줄 끝에 위치합니다. 이것은 알약과 같으며 그 외에는 아무것도 아닙니다 — 드롭다운 항목이나 수직 메뉴 항목에서 레이블 옆에 `count`를 전달하면, 항목이 그것을 배치합니다. 키가 없는 항목은 아무것도 표시하지 않습니다.'
  separators:
    title: 구분선
    description: '구분선은 다른 항목들과 마찬가지로 하나의 키가 더 있는 항목입니다: 빈 줄은 서로 관계 없는 두 항목 그룹을 나누며, 같은 줄에 단어가 주어지면 그 뒤의 내용의 제목이 됩니다. 스택 양쪽은 같은 선언을 읽습니다 — 여기의 세 번째 메뉴는 vue 것입니다.'
  kinds:
    title: '항목의 종류'
    description: '네 가지 종류가 하나의 행을 공유합니다: 단어와 대상은 링크, 단어와 상태는 토글, 단어와 자식은 분기, 그리고 빈 줄은 구분선입니다. 자신의 종류를 선언하는 것은 없습니다 — 그것은 항목이 담고 있는 것에서 유래합니다. 토글은 그 표시를 위한 선행 슬롯을 사용하므로, 그들의 열은 단어가 정렬되어 있으며, 패널은 그 아래에 열려 있습니다: 필터 메뉴는 한 번에 하나가 아니라 한 줌으로 읽힙니다.'
