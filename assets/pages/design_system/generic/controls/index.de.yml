select:
  option_one: 'Option eins'
  option_two: 'Option zwei'
  option_three: 'Option drei'
menu:
  primary: Menüschaltfläche
  item:
    report: Bericht
    settings: Einstellungen
    logout: Abmelden
    long: 'Mit einem ziemlich, ziemlich, ziemlich, ziemlich langen Titel'
