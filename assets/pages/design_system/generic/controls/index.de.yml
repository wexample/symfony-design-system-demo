~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Steuerelemente
page_icon: 'ph:bold/cursor-click'
intro: 'Was ein Leser durchführt. Jedes dieser Elemente führt eine Aktion aus, anstatt einen Wert zu haben — ein Formularfeld nimmt den Wert auf und befindet sich im nächsten Abschnitt.'
page:
  buttons:
    title: Schaltflächen
    description: 'Diejenige, die etwas bewirkt, in ihren Varianten, Zuständen und Dichten, plus der Link und das Ziel, die woanders geöffnet werden.'
  menus:
    title: Menüs
    description: 'Eine Schaltfläche, die eine Liste von Auswahlmöglichkeiten öffnet und sich an den Rändern des Fensters positioniert, sowohl in Twig als auch in Vue.'
  steppers:
    title: Schritte
    description: 'Wo ein Leser sich in einer Abfolge von Schritten befindet, mit den vorherigen, zu denen man zurückkehren kann.'
section:
  compound:
    title: 'Alles zusammen'
    description: 'Das gleiche Set von Steuerelementen in drei Kontexten: einem gepolsterten Block, einer Werkzeugleiste und einer kompakten Werkzeugleiste. Nichts an den Steuerelementen ändert sich zwischen den drei — die Region sagt ihnen, wie viel Platz sie haben.'
button:
