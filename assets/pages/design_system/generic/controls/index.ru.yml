~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Элементы управления'
page_icon: 'ph:bold/cursor-click'
intro: 'То, через что взаимодействует читатель. Каждый из этих элементов выполняет действие, а не принимает значение — поле формы принимает значение и находится в следующем разделе.'
page:
  buttons:
    title: Кнопки
    description: 'Та, которая что-то делает, в своих вариантах, состояниях и плотностях, плюс ссылка и цель, которые открываются в другом месте.'
  menus:
    title: Меню
    description: 'Кнопка, которая открывает список вариантов, располагаясь по краям окна, в twig и в vue.'
  steppers:
    title: 'Пошаговые элементы'
    description: 'Где читатель находится в последовательности шагов, с предыдущими шагами, к которым можно вернуться.'
section:
  compound:
    title: 'Все вместе'
    description: 'Один и тот же набор элементов управления в трех контекстах: с отступом, в панели инструментов и в компактной панели инструментов. Ничего в элементах управления не меняется между тремя — регион показывает, сколько у них места.'
button:
  primary: 'Основная кнопка'
select:
  option_one: 'Вариант один'
  option_two: 'Вариант два'
  option_three: 'Вариант три'
menu:
  primary: 'Кнопка меню'
  item:
    report: Отчет
    settings: Настройки
    logout: Выйти
    long: 'С довольно, довольно, довольно, довольно длинным заголовком'
switch:
  label_right: 'Включить функцию'
link:
  external: 'Внешняя ссылка'
