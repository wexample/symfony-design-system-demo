~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: مینوز
page_icon: 'ph:bold/list'
section:
  vue:
    title: ویو
    description: 'لنک رو اور سیپریٹر ویو کے جزو کے طور پر۔ ان رووں کے برعکس جو راستے کو پڑھتے ہیں، یہ دونوں اپنے آئیکن اور لیبل کو آپشن کے طور پر لیتے ہیں، اس لیے سرور کا کچھ بھی غائب نہیں ہوتا۔'
  menu:
    title: 'مینو بٹن'
  counts:
    title: گنتی
    description: 'یہاں تک کہ اشیاء کی تعداد جو لائن کے آخری سرے پر جاتی ہیں۔ یہ ایک گولی ہے اور کچھ نہیں — لیبل کے ساتھ `count` پاس کریں، ایک ڈراپ ڈاؤن آئٹم یا عمودی مینو آئٹم میں، اور آئٹم اسے رکھ دیتا ہے۔ ایک آئٹم بغیر کلید کے کچھ نہیں دکھاتا۔'
  separators:
    title: سیپریٹر
    description: 'ایک سیپریٹر دوسرے آئٹمز کی طرح ایک آئٹم ہے، ایک کلید زیادہ کے ساتھ: ایک خالی لائن دو ایسے آئٹمز کو جدا کرتی ہے جن کا آپس میں کوئی تعلق نہیں ہے، اور اگر اسی لائن کو ایک لفظ دیا جائے تو یہ اس کے بعد آنے والی چیز کا عنوان بن جاتا ہے۔ اسٹیک کے دونوں طرف ایک ہی اعلان پڑھا جاتا ہے — یہاں تیسرا مینو ویو والا ہے۔'
  kinds:
    title: 'ایک آئٹم کیا ہو سکتا ہے'
    description: 'چار اقسام ایک صف میں شریک ہیں: ایک لفظ اور ایک ٹارگٹ ایک لنک ہے، ایک لفظ اور ایک حالت ایک ٹوگل ہے، ایک لفظ اور بچے ایک شاخ ہے، اور ایک خالی لائن ایک سیپریٹر ہے۔ کچھ بھی اپنی قسم کا اعلان نہیں کرتا — یہ اس چیز سے ظاہر ہوتا ہے جو آئٹم کے پاس ہے۔ ایک ٹوگل اپنے نشان پر اپنا ابتدائی سلاٹ خرچ کرتا ہے، لہذا ان کا ایک کالم اپنے الفاظ کو متوازن رکھتا ہے، اور اس کے نیچے پینل کھلا رہتا ہے: فلٹرز کا ایک مینو ہاتھوں سے پڑھا جاتا ہے، ایک وقت میں نہیں۔'
