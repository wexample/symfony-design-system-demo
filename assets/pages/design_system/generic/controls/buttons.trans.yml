en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Buttons
  page_icon: ph:bold/cursor-click
  bare:
    item_one: A menu from a marker
    item_two: Settings
    label: A button that is only its word

  section:
    bare:
      title: Bare buttons
      description: "button--bare: anything made a button — a marker, an image — keeping its own look. Nothing drawn around it; it still opens, takes the focus and the keys. Tab to it: only the focus ring says it is a button."
    buttons:
      title: Default buttons
    button_states:
      title: Button states
    link:
      title: Button links
    vue:
      title: Vue
      description: "The same button and the same link as vue partials, taking the same icon and label, for a page that builds its controls while it runs."

  button:
    primary: Primary button
    success: Success button
    danger: Danger button
    invert: Invert button
    state:
      default: Default
      loading: Loading
      disabled: Disabled
      assisted: Assisted

  link:
    more: Learn more
    external: External link

