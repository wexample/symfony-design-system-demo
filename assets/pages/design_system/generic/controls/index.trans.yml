en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Controls
  page_icon: ph:bold/cursor-click

  intro: "What a reader acts through. Each of these takes an action rather than a value — a form field takes the value, and lives in the next section."

  page:
    buttons:
      title: Buttons
      description: "The one that does something, in its variants, its states and its densities, plus the link and the target that open elsewhere."
    menus:
      title: Menus
      description: "A button that opens a list of choices, placing itself against the edges of the window, in twig and in vue."
    steppers:
      title: Steppers
      description: "Where a reader stands in a sequence of steps, with the ones behind to go back to."

  section:
    compound:
      title: Everything together
      description: "The same set of controls in three contexts: a padded block, a toolbar, and a compact toolbar. Nothing about the controls changes between the three — the region is what tells them how much room they have."

  button:
    primary: Primary button

  select:
    option_one: Option one
    option_two: Option two
    option_three: Option three

  menu:
    primary: Menu button
    item:
      report: Report
      settings: Settings
      logout: Log out
      long: With a quite, quite, quite, quite long title

  switch:
    label_right: Enable feature

  link:
    external: External link

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: التحكمات
  page_icon: 'ph:bold/cursor-click'
  intro: 'ما يقوم به القارئ من خلاله. كل واحد من هذه العناصر يقوم بإجراء بدلاً من قيمة - حقل النموذج يأخذ القيمة، ويعيش في القسم التالي.'
  page:
    buttons:
      title: الأزرار
      description: 'الذي يقوم بشيء ما، في أشكاله المختلفة، وحالاته وكثافته، بالإضافة إلى الرابط والهدف الذي يفتح في مكان آخر.'
    menus:
      title: القوائم
      description: 'زر يفتح قائمة من الخيارات، يضع نفسه ضد حواف النافذة، في twig و vue.'
    steppers:
      title: خطوات
      description: 'أين يقف القارئ في تسلسل من الخطوات، مع الخيارات السابقة للعودة.'
  section:
    compound:
      title: 'كل شيء معاً'
      description: 'نفس مجموعة التحكمات في ثلاثة سياقات: كتلة مبطنة، شريط أدوات، وشريط أدوات مدمج. لا شيء عن التحكمات يتغير بين الثلاثة - المنطقة هي ما تخبرهم بمدى المساحة المتاحة لهم.'
  button:
    primary: 'زر رئيسي'
  select:
    option_one: 'الخيار الأول'
    option_two: 'الخيار الثاني'
    option_three: 'الخيار الثالث'
  menu:
    primary: 'زر القائمة'
    item:
      report: تقرير
      settings: الإعدادات
      logout: 'تسجيل الخروج'
      long: 'بعنوان طويل، طويل، طويل، طويل جداً'
  switch:
    label_right: 'تفعيل الميزة'
  link:
    external: 'رابط خارجي'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: নিয়ন্ত্রণ
  page_icon: 'ph:bold/cursor-click'
  intro: 'যা একজন পাঠক দ্বারা কার্যকর হয়। এগুলোর প্রতিটির একটি কার্যকলাপ আছে, মান নয় — একটি ফর্ম ফিল্ড মান গ্রহণ করে এবং পরবর্তী বিভাগে অবস্থান করে।'
  page:
    buttons:
      title: বোতামগুলি
      description: 'যেটি কিছু করে, এর ভেরিয়েন্ট, অবস্থান এবং ঘনত্ব সহ, পাশাপাশি লিঙ্ক এবং লক্ষ্য যা অন্যত্র খোলে।'
    menus:
      title: মেনু
      description: 'একটি বোতাম যা একটি পছন্দের তালিকা খুলে, জানালার প্রান্তের বিরুদ্ধে অবস্থান করে, টুইগ এবং ভিউতে।'
    steppers:
      title: স্টেপারস
      description: 'যেখানে একজন পাঠক পদক্ষেপের একটি সিকোয়েন্সে অবস্থান করছে, পিছনের পদক্ষেপে ফিরে যাওয়ার জন্য।'
  section:
    compound:
      title: 'সবকিছু একত্রে'
      description: 'তিনটি প্রসঙ্গে একই সেটের নিয়ন্ত্রণ: একটি প্যাডেড ব্লক, একটি টুলবার, এবং একটি সংক্ষিপ্ত টুলবার। তিনটির মধ্যে নিয়ন্ত্রণগুলোর কিছুই পরিবর্তিত হয় না — অঞ্চলই তাদের কতটা স্থান আছে তা জানায়।'
  button:
    primary: 'প্রাথমিক বোতাম'
  select:
    option_one: 'অপশন এক'
    option_two: 'অপশন দুই'
    option_three: 'অপশন তিন'
  menu:
    primary: 'মেনু বোতাম'
    item:
      report: রিপোর্ট
      settings: সেটিংস
      logout: 'লগ আউট'
      long: 'একটি বেশ, বেশ, বেশ, বেশ দীর্ঘ শিরোনাম সহ'
  switch:
    label_right: 'ফিচার সক্ষম করুন'
  link:
    external: 'বাহ্যিক লিঙ্ক'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Steuerelemente
  page_icon: 'ph:bold/cursor-click'
  intro: 'Was ein Leser durchführt. Jedes dieser Elemente führt eine Aktion aus, anstatt einen Wert zu haben — ein Formularfeld nimmt den Wert auf und befindet sich im nächsten Abschnitt.'
  page:
    buttons:
      title: Schaltflächen
      description: 'Diejenige, die etwas bewirkt, in ihren Varianten, Zuständen und Dichten, plus der Link und das Ziel, die woanders geöffnet werden.'
    menus:
      title: Menüs
      description: 'Eine Schaltfläche, die eine Liste von Auswahlmöglichkeiten öffnet und sich an den Rändern des Fensters positioniert, sowohl in Twig als auch in Vue.'
    steppers:
      title: Schritte
      description: 'Wo ein Leser sich in einer Abfolge von Schritten befindet, mit den vorherigen, zu denen man zurückkehren kann.'
  section:
    compound:
      title: 'Alles zusammen'
      description: 'Das gleiche Set von Steuerelementen in drei Kontexten: einem gepolsterten Block, einer Werkzeugleiste und einer kompakten Werkzeugleiste. Nichts an den Steuerelementen ändert sich zwischen den drei — die Region sagt ihnen, wie viel Platz sie haben.'
  button:
    primary: 'Primäre Schaltfläche'
  select:
    option_one: 'Option eins'
    option_two: 'Option zwei'
    option_three: 'Option drei'
  menu:
    primary: Menüschaltfläche
    item:
      report: Bericht
      settings: Einstellungen
      logout: Abmelden
      long: 'Mit einem ziemlich, ziemlich, ziemlich, ziemlich langen Titel'
  switch:
    label_right: 'Funktion aktivieren'
  link:
    external: 'Externer Link'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Controles
  page_icon: 'ph:bold/cursor-click'
  intro: 'Lo que un lector actúa a través de. Cada uno de estos toma una acción en lugar de un valor: un campo de formulario toma el valor y vive en la siguiente sección.'
  page:
    buttons:
      title: Botones
      description: 'El que hace algo, en sus variantes, sus estados y sus densidades, además del enlace y el objetivo que se abren en otro lugar.'
    menus:
      title: Menús
      description: 'Un botón que abre una lista de opciones, colocándose contra los bordes de la ventana, en twig y en vue.'
    steppers:
      title: Pasos
      description: 'Dónde se encuentra un lector en una secuencia de pasos, con los que están detrás para volver.'
  section:
    compound:
      title: 'Todo junto'
      description: 'El mismo conjunto de controles en tres contextos: un bloque acolchado, una barra de herramientas y una barra de herramientas compacta. Nada sobre los controles cambia entre los tres: la región es lo que les dice cuánto espacio tienen.'
  button:
    primary: 'Botón primario'
  select:
    option_one: 'Opción uno'
    option_two: 'Opción dos'
    option_three: 'Opción tres'
  menu:
    primary: 'Botón de menú'
    item:
      report: Informe
      settings: Configuraciones
      logout: 'Cerrar sesión'
      long: 'Con un título bastante, bastante, bastante, bastante largo'
  switch:
    label_right: 'Habilitar característica'
  link:
    external: 'Enlace externo'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: کنترل‌ها
  page_icon: 'ph:bold/cursor-click'
  intro: 'عملی که یک خواننده از طریق آن انجام می‌دهد. هر یک از اینها عملی را انجام می‌دهد نه یک مقدار — یک فیلد فرم مقدار را می‌گیرد و در بخش بعدی زندگی می‌کند.'
  page:
    buttons:
      title: دکمه‌ها
      description: 'آن چیزی که عملی را انجام می‌دهد، در انواع، حالت‌ها و چگالی‌هایش، به علاوه پیوند و مقصدی که در جای دیگر باز می‌شود.'
    menus:
      title: منوها
      description: 'یک دکمه که فهرستی از گزینه‌ها را باز می‌کند، خود را در برابر لبه‌های پنجره قرار می‌دهد، در شاخه و در نما.'
    steppers:
      title: پله‌ها
      description: 'جایی که یک خواننده در یک توالی از مراحل قرار دارد، با گزینه‌هایی برای بازگشت به مراحل قبلی.'
  section:
    compound:
      title: 'همه چیز با هم'
      description: 'مجموعه یکسانی از کنترل‌ها در سه زمینه: یک بلوک با حاشیه، یک نوار ابزار و یک نوار ابزار فشرده. هیچ چیزی در مورد کنترل‌ها بین این سه تغییر نمی‌کند — منطقه است که به آنها می‌گوید چقدر فضا دارند.'
  button:
    primary: 'دکمه اصلی'
  select:
    option_one: 'گزینه اول'
    option_two: 'گزینه دوم'
    option_three: 'گزینه سوم'
  menu:
    primary: 'دکمه منو'
    item:
      report: گزارش
      settings: تنظیمات
      logout: خروج
      long: 'با عنوانی بسیار، بسیار، بسیار، بسیار طولانی'
  switch:
    label_right: 'فعال‌سازی ویژگی'
  link:
    external: 'پیوند خارجی'

fi:
