    menus:
      title: Valikot
      description: 'Painike, joka avaa valintalistauksen, asettuu ikkunan reunoille, oksassa ja näkymässä.'
    steppers:
      title: Askeleet
      description: 'Missä lukija seisoo askeleiden järjestyksessä, taakse jääneet askeleet voi palata.'
  section:
    compound:
      title: 'Kaikki yhdessä'
      description: 'Sama ohjaustyökalujen setti kolmessa kontekstissa: pehmustettu lohko, työkalupalkki ja kompakti työkalupalkki. Ohjausvälineet eivät muutu kolmen välillä — alue kertoo niille, kuinka paljon tilaa niillä on.'
  button:
