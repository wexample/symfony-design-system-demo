      logout: Déconnexion
      long: 'Avec un titre assez, assez, assez, assez long'
  switch:
    label_right: 'Activer la fonction'
  link:
    external: 'Lien externe'

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: בקרות
  page_icon: 'ph:bold/cursor-click'
  intro: 'מה שהקורא פועל דרכו. כל אחד מאלה מבצע פעולה במקום ערך — שדה טופס מקבל את הערך, וחי בחלק הבא.'
  page:
    buttons:
      title: כפתורים
      description: 'זה שעושה משהו, בגרסאותיו, במצבים ובצפיפויות שלו, בנוסף לקישור ולמטרה שנפתחים במקום אחר.'
    menus:
      title: תפריטים
      description: 'כפתור שפותח רשימת בחירות, ממקם את עצמו כנגד קצות החלון, בגבעול ובתצוגה.'
    steppers:
      title: שלבים
      description: 'איפה שמעמדו של הקורא ברצף של צעדים, עם הצעדים מאחור כדי לחזור אליהם.'
  section:
    compound:
      title: 'הכול יחד'
      description: 'אותה קבוצת בקרות בשלושה הקשרים: בלוק מרופד, סרגל כלים, וסרגל כלים קומפקטי. שום דבר לגבי הבקרות לא משתנה בין השלושה — האזור הוא מה שאומר להם כמה מקום יש להם.'
  button:
    primary: 'כפתור ראשי'
  select:
    option_one: 'אפשרות אחת'
    option_two: 'אפשרות שתיים'
    option_three: 'אפשרות שלוש'
  menu:
    primary: 'כפתור תפריט'
    item:
      report: דוח
      settings: הגדרות
      logout: התנתק
      long: 'עם כותרת ארוכה מאוד מאוד מאוד מאוד'
  switch:
    label_right: 'הפעל תכונה'
  link:
    external: 'קישור חיצוני'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: नियंत्रण
  page_icon: 'ph:bold/cursor-click'
  intro: 'जो पाठक के माध्यम से कार्य करता है। इनमें से प्रत्येक एक क्रिया करता है न कि एक मान — एक फ़ॉर्म फ़ील्ड मान लेता है, और अगले अनुभाग में रहता है।'
  page:
    buttons:
      title: बटन
      description: 'वह जो कुछ करता है, इसके विभिन्न रूपों, इसकी अवस्थाओं और इसकी घनत्वों में, साथ ही लिंक और लक्ष्य जो कहीं और खुलते हैं।'
    menus:
      title: मेन्यू
      description: 'एक बटन जो विकल्पों की सूची खोलता है, खिड़की के किनारों के खिलाफ खुद को रखता है, टहनी और दृश्य में।'
    steppers:
      title: स्टेपर
      description: 'जहां पाठक कदमों के अनुक्रम में खड़ा होता है, पीछे वाले को वापस जाने के लिए।'
  section:
    compound:
      title: 'सब कुछ एक साथ'
      description: 'तीन संदर्भों में नियंत्रणों का वही सेट: एक पैडेड ब्लॉक, एक टूलबार, और एक कॉम्पैक्ट टूलबार। तीनों के बीच नियंत्रणों के बारे में कुछ भी नहीं बदलता है — क्षेत्र ही उन्हें बताता है कि उनके पास कितना स्थान है।'
  button:
    primary: 'प्राथमिक बटन'
  select:
    option_one: 'विकल्प एक'
    option_two: 'विकल्प दो'
    option_three: 'विकल्प तीन'
  menu:
    primary: 'मेन्यू बटन'
    item:
      report: रिपोर्ट
      settings: सेटिंग्स
      logout: 'लॉग आउट'
      long: 'काफी, काफी, काफी, काफी लंबे शीर्षक के साथ'
  switch:
    label_right: 'विशेषता सक्षम करें'
  link:
    external: 'बाहरी लिंक'

