~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: स्टेपर्स
page_icon: 'ph:bold/steps'
intro: 'जहाँ एक पाठक एक अनुक्रम में खड़ा होता है - एक सुरंग, कई भागों में एक रूप। पीछे के कदम ठोस रूप से खींचे जाते हैं और जब उन्हें एक पता दिया जाता है तो उन पर वापस जाया जा सकता है; जो कदम किया जा रहा है वह बाहर खड़ा होता है; आगे वाले, विवेकपूर्ण तरीके से, प्रतीक्षा करते हैं।'
section:
  labelled:
    title: 'संख्याबद्ध और नामित'
    description: 'सामान्य मामला: गिनती करने के लिए एक संख्या, एक शब्द जो बताता है कि यह क्या पूछता है। पहले से चलाए गए दो कदम पीछे की ओर लिंक करते हैं।'
  numbers:
    title: 'सिर्फ संख्याएँ'
    description: 'जहाँ कदमों के कोई नाम पढ़ने लायक नहीं हैं, या चौड़ाई में उनके लिए कोई जगह नहीं है।'
  words:
    title: 'सिर्फ शब्द'
    description: 'बिना संख्याओं के, जब शब्दों से क्रम स्पष्ट होता है।'
  ends:
    title: 'पहला और आखिरी'
    description: 'कुछ नहीं चला गया, फिर सब कुछ चला गया लेकिन किया जा रहा कदम।'
  unknown:
    title: 'कदम अभी तय नहीं हुए'
    description: 'जहाँ रास्ते अलग होते हैं, जो आगे है वह एक उत्तर पर निर्भर करता है जो अभी नहीं दिया गया है। इसके लिए खड़ा कदम कोई संख्या नहीं लेता और अन्य में से कोई भी नहीं बढ़ाता: यहाँ अंतिम कदम तीसरा है, चौथा नहीं।'
  compact:
    title: 'संक्षिप्त, और बिंदु'
    description: 'एक मोडल या पैनल के शीर्षक के लिए, जहाँ बहुत कम जगह है: संक्षिप्त कदमों की संख्याएँ और केवल किया जा रहा कदम का नाम रखता है; बिंदु प्रत्येक कदम के लिए एक बिंदु बनाते हैं और स्क्रीन पर कोई नाम नहीं रखते, नाम उन लोगों के लिए रहते हैं जो पृष्ठ को जोर से पढ़ते हैं। एक मोडल या पैनल के शीर्षक के ठीक नीचे, एक स्टेपर लोडिंग बार के स्थान पर लेता है।'
  toolbar:
    title: 'एक टूलबार में'
    description: 'एक पृष्ठ के ऊपर एक बार में रखा गया, यह बार द्वारा दी गई जगह लेता है।'
  vue:
    title: 'व्यू में'
    description: 'एक vue ट्री में वही स्टेपर। बिना पते के कदम बटन बनाए जा सकते हैं: एक अनुक्रम जो पृष्ठ द्वारा धारण किया जाता है, वह `select` पर आगे बढ़ता है जो यह निकालता है न कि एक नए पते पर।'
step:
  account: खाता
  address: पता
  payment: भुगतान
  confirm: पुष्टि
  choice: 'आपकी योजना'
