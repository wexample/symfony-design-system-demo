~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: תפריטים
page_icon: 'ph:bold/list'
section:
  vue:
    title: Vue
    description: 'שורת הקישור והמפריד כחלקים של Vue. בניגוד לשורות שקוראות נתיב, השתיים הללו לוקחות את האיקון ואת התווית כאופציות, כך שאין שום דבר מהשרת חסר.'
  menu:
    title: 'כפתורי תפריט'
  counts:
    title: ספירות
    description: 'כמה מהפריט מוביל אליו, בקצה השורה. זהו פינה ולא יותר — העבר `count` לצד התווית, בפריט בתפריט נפתח או בפריט בתפריט אנכי, והפריט מציב אותו. פריט ללא המפתח לא מציג כלום.'
  separators:
    title: מפרידים
    description: 'מפריד הוא פריט כמו אחרים, עם מפתח אחד נוסף: קו ריק מפריד בין שתי רצפות של פריטים שאין להם קשר זה לזה, והקו הזה עם מילה הופך לכותרת של מה שבא אחריו. שני הצדדים של הערימה קוראים את אותה הצהרה — התפריט השלישי כאן הוא זה של Vue.'
  kinds:
    title: 'מה פריט יכול להיות'
    description: 'ארבעה סוגים משתפים שורה אחת: מילה ומטרה זה קישור, מילה ומצב זה מתג, מילה וילדים זו ענף, וקו ריק הוא מפריד. שום דבר לא מכריז על סוגו — זה נובע ממה שהפריט נושא. מתג מוציא את המקום המוביל שלו על הסימן שלו, כך שעמודה שלהם שומרת על המילים מיושרות, ולוח הבקרה נשאר פתוח מתחתיו: תפריט של מסננים נקרא בקבוצה, לא אחד אחד.'
