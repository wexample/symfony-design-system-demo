~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: منوها
page_icon: 'ph:bold/list'
section:
  vue:
    title: ویو
    description: 'ردیف لینک و جداکننده به عنوان بخش‌های ویو. بر خلاف ردیف‌هایی که یک مسیر را می‌خوانند، این دو گزینه‌های آیکون و برچسب خود را به عنوان گزینه می‌گیرند، بنابراین هیچ چیزی از سرور کم نمی‌شود.'
  menu:
    title: 'دکمه‌های منو'
  counts:
    title: شمارش‌ها
    description: 'چند تا از هر چیزی که مورد مورد نظر در انتهای خط می‌رود. این یک قسمت است و چیز دیگری نیست — `count` را در کنار برچسب، در یک مورد کشویی یا مورد عمودی منو قرار دهید و مورد آن را قرار می‌دهد. یک مورد بدون کلید هیچ چیزی نشان نمی‌دهد.'
  separators:
    title: جداکننده‌ها
    description: 'یک جداکننده یک مورد مانند بقیه است، با یک کلید بیشتر: یک خط خالی دو دسته از موارد را که ارتباطی با هم ندارند جدا می‌کند و همان خط اگر یک کلمه داشته باشد، عنوان آنچه که دنبال می‌آید می‌شود. هر دو طرف این دسته همان اعلام را می‌خوانند — منوی سوم اینجا، منوی ویو است.'
  kinds:
    title: 'یک مورد چه نوعی می‌تواند باشد'
    description: 'چهار نوع یک ردیف را به اشتراک می‌گذارند: یک کلمه و یک هدف یک لینک است، یک کلمه و یک وضعیت یک تغییر حالت است، یک کلمه و فرزندان یک شاخه است، و یک خط خالی یک جداکننده است. هیچ‌کس نوع خود را اعلام نمی‌کند — این از آنچه که مورد حمل می‌کند تبعیت می‌کند. یک تغییر حالت جایگاه پیشرو خود را بر روی علامت خود صرف می‌کند، بنابراین یک ستون از آن‌ها کلماتش را هم‌راستا نگه می‌دارد و پنل زیر آن باز می‌ماند: یک منوی فیلترها به صورت دسته‌ای خوانده می‌شود، نه یکی یکی.'
