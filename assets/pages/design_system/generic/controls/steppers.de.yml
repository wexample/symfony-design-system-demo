~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Steppers
page_icon: 'ph:bold/steps'
intro: 'Wo sich ein Leser in einer Abfolge befindet – ein Tunnel, ein mehrteiliges Formular. Die Schritte, die bereits gegangen sind, sind fest und können zurückgegangen werden, wenn sie eine Adresse erhalten; der aktuelle Schritt hebt sich ab; die kommenden warten diskret.'
section:
  labelled:
    title: 'Nummeriert und benannt'
    description: 'Der häufigste Fall: eine Nummer zum Zählen, ein Wort, um zu wissen, was es fragt. Die beiden bereits zurückgelegten Schritte sind verbunden.'
  numbers:
    title: 'Nur Zahlen'
    description: 'Wenn die Schritte keine lesenswerten Namen haben oder der Platz keinen Raum dafür bietet.'
  words:
    title: 'Nur Wörter'
    description: 'Ohne die Zahlen, wenn die Reihenfolge aus den Wörtern offensichtlich ist.'
  ends:
    title: 'Erster und letzter'
    description: 'Noch nichts gegangen, dann alles gegangen außer dem aktuellen Schritt.'
  unknown:
    title: 'Schritte noch nicht entschieden'
    description: 'Wo sich die Wege trennen, was vor einem liegt, hängt von einer noch nicht gegebenen Antwort ab. Der Schritt, der dafür steht, hat keine Nummer und bewegt keinen der anderen: der letzte Schritt hier ist der dritte, nicht der vierte.'
  compact:
    title: 'Kompakt und Punkte'
    description: 'Für die Überschrift eines Modals oder Panels, wo wenig Platz ist: kompakt behält die Zahlen und benennt nur den aktuellen Schritt; Punkte zeigen einen Punkt pro Schritt und benennen keinen auf dem Bildschirm, die Namen bleiben für diejenigen, die die Seite laut vorlesen. Direkt unter der Überschrift eines Modals oder Panels nimmt ein Stepper den Platz der Ladeleiste ein.'
  toolbar:
    title: 'In einer Toolbar'
    description: 'In einer Leiste oben auf einer Seite angeordnet, nimmt es den Raum ein, den die Leiste bietet.'
  vue:
    title: 'In vue'
    description: 'Der gleiche Stepper in einem vue-Baum. Schritte ohne Adresse können Buttons werden: eine Sequenz, die von der Seite gehalten wird, bewegt sich auf das `select`, das es ausgibt, anstatt auf eine neue Adresse.'
step:
  account: Konto
  address: Adresse
  payment: Zahlung
  confirm: Bestätigung
  choice: 'Ihr Plan'
