~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: اسٹیپرز
page_icon: 'ph:bold/steps'
intro: 'جہاں ایک قاری ایک تسلسل میں کھڑا ہوتا ہے — ایک سرنگ، کئی حصوں میں ایک فارم۔ پیچھے کے مراحل ٹھوس کھینچے گئے ہیں اور جب انہیں ایک پتہ دیا جاتا ہے تو ان کی طرف واپس جا سکتے ہیں؛ جو مرحلہ جاری ہے وہ نمایاں ہے؛ آگے والے انتظار کرتے ہیں، مؤدب۔'
section:
  labelled:
    title: 'نمبرڈ اور نامزد'
    description: 'عام صورت: گنتی کے لیے ایک نمبر، جاننے کے لیے ایک لفظ کہ یہ کیا مانگتا ہے۔ پہلے سے چلنے والے دو مراحل کو پیچھے جوڑا جاتا ہے۔'
  numbers:
    title: 'صرف نمبر'
    description: 'جہاں مراحل کے نام پڑھنے کے قابل نہیں ہیں، یا چوڑائی میں ان کے لیے کوئی جگہ نہیں ہے۔'
  words:
    title: 'صرف الفاظ'
    description: 'بغیر نمبروں کے، جب ترتیب الفاظ سے واضح ہو۔'
  ends:
    title: 'پہلا اور آخری'
    description: 'ابھی کچھ نہیں چلایا، پھر سب کچھ چلا سوائے جاری مرحلے کے۔'
  unknown:
    title: 'ابھی طے نہ ہونے والے مراحل'
    description: 'جہاں راستے الگ ہوتے ہیں، آگے کیا ہے اس کا انحصار ایک جواب پر ہے جو ابھی دیا نہیں گیا۔ جو مرحلہ اس کے لیے کھڑا ہے اس کا کوئی نمبر نہیں ہوتا اور یہ دوسرے مراحل کو نہیں ہلاتا: یہاں آخری مرحلہ تیسرا ہے، چوتھا نہیں۔'
  compact:
    title: 'کمپیکٹ، اور نقطے'
    description: 'ایک موڈل یا پینل کے ہیڈر کے لیے، جہاں جگہ کم ہے: کمپیکٹ صرف جاری مرحلے کے نمبر اور نام رکھتا ہے؛ نقطے ہر مرحلے کے لیے ایک نقطہ کھینچتے ہیں اور اسکرین پر کوئی نام نہیں ہوتا، نام ان لوگوں کے لیے رہتے ہیں جو صفحے کو بلند آواز میں پڑھتے ہیں۔ موڈل یا پینل کے ہیڈر کے عین نیچے، ایک اسٹیپر لوڈنگ بار کی جگہ لیتا ہے۔'
  toolbar:
    title: 'ایک ٹول بار میں'
    description: 'ایک صفحے کے اوپر ایک بار میں رکھا گیا، یہ بار کی فراہم کردہ جگہ لیتا ہے۔'
  vue:
    title: 'ویو میں'
    description: 'ویو درخت میں وہی اسٹیپر۔ بغیر پتے کے مراحل کو بٹن بنایا جا سکتا ہے: ایک تسلسل جو صفحے کی طرف سے جاری رکھا جاتا ہے وہ اس پر `select` کے ذریعے منتقل ہوتا ہے جو یہ خارج کرتا ہے نہ کہ نئے پتے پر۔'
