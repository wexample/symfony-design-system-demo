~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Menus
page_icon: 'ph:bold/list'
section:
  vue:
    title: Vue
    description: 'Dòng liên kết và dấu phân cách như các phần của vue. Khác với các dòng đọc một tuyến đường, hai cái này nhận biểu tượng và nhãn là tùy chọn, vì vậy không có gì từ máy chủ bị thiếu.'
  menu:
    title: 'Nút menu'
  counts:
    title: 'Số lượng'
    description: 'Bao nhiêu thứ mà mục dẫn đến, ở cuối dòng. Nó là một viên thuốc và không gì khác — truyền `count` bên cạnh nhãn, trong một mục dropdown hoặc một mục menu dọc, và mục đó sẽ đặt nó. Một mục không có khóa sẽ không hiển thị gì.'
  separators:
    title: 'Dấu phân cách'
    description: 'Một dấu phân cách là một mục giống như những mục khác, với một khóa thêm: một dòng trần chia hai chuỗi mục không liên quan đến nhau, và cùng một dòng được đặt một từ trở thành tiêu đề của những gì theo sau. Cả hai bên của ngăn xếp đều đọc cùng một tuyên bố — menu thứ ba ở đây là của vue.'
  kinds:
    title: 'Một mục có thể là gì'
    description: 'Bốn loại chia sẻ một dòng: một từ và một mục tiêu là một liên kết, một từ và một trạng thái là một công tắc, một từ và các mục con là một nhánh, và một dòng trần là một dấu phân cách. Không có gì tuyên bố loại của nó — nó theo từ những gì mục mang. Một công tắc dành vị trí dẫn đầu của nó cho dấu hiệu của nó, vì vậy một cột của chúng giữ các từ của nó thẳng hàng, và bảng điều khiển vẫn mở ở dưới: một menu lọc được đọc theo nhóm, không phải từng cái một.'
