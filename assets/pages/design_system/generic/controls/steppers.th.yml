~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: สเต็ปเปอร์
page_icon: 'ph:bold/steps'
intro: 'สถานะของผู้อ่านในลำดับ — อุโมงค์, ฟอร์มที่แบ่งเป็นส่วน ๆ ขั้นตอนที่ผ่านมาถูกทำให้ชัดเจนและสามารถย้อนกลับไปได้เมื่อมีที่อยู่; ขั้นตอนที่กำลังทำจะเด่นออกมา; ขั้นตอนที่รออยู่ข้างหน้าจะคอยอย่างระมัดระวัง.'
section:
  labelled:
    title: มีหมายเลขและชื่อ
    description: 'กรณีทั่วไป: หมายเลขสำหรับนับ, คำเพื่อรู้ว่ามันต้องการอะไร. สองขั้นตอนที่ผ่านมาจะเชื่อมโยงกัน.'
  numbers:
    title: เฉพาะหมายเลข
    description: 'เมื่อขั้นตอนไม่มีชื่อที่คุ้มค่าที่จะอ่าน, หรือความกว้างไม่มีที่ว่างสำหรับมัน.'
  words:
    title: เฉพาะคำ
    description: 'ไม่มีหมายเลข, เมื่อการจัดเรียงชัดเจนจากคำ.'
  ends:
    title: ขั้นตอนแรกและสุดท้าย
    description: 'ยังไม่มีการเดิน, จากนั้นทุกอย่างถูกเดินแล้วแต่ขั้นตอนที่กำลังทำ.'
  unknown:
    title: ขั้นตอนที่ยังไม่ได้ตัดสินใจ
    description: 'เมื่อเส้นทางแยกออก, สิ่งที่อยู่ข้างหน้าขึ้นอยู่กับคำตอบที่ยังไม่ได้ให้. ขั้นตอนที่แทนที่มันไม่มีหมายเลขและไม่เคลื่อนที่ขั้นตอนอื่น ๆ: ขั้นตอนสุดท้ายที่นี่คือขั้นตอนที่สาม ไม่ใช่ขั้นตอนที่สี่.'
  compact:
    title: 'กะทัดรัด และจุด'
    description: 'สำหรับหัวเรื่องของโมดัลหรือแผง, เมื่อมีที่น้อย: กะทัดรัดจะรักษาหมายเลขและชื่อของขั้นตอนที่กำลังทำเท่านั้น; จุดจะวาดจุดหนึ่งต่อหนึ่งขั้นตอนและไม่แสดงชื่อบนหน้าจอ, ชื่อจะอยู่สำหรับผู้ที่อ่านหน้าดังกล่าวออกเสียง. ตรงใต้หัวเรื่องของโมดัลหรือแผง, สเต็ปเปอร์จะเข้ามาแทนที่แถบโหลด.'
  toolbar:
    title: ในแถบเครื่องมือ
    description: 'วางในแถบด้านบนของหน้า, มันจะใช้พื้นที่ที่แถบให้.'
  vue:
    title: ในวิว
    description: 'สเต็ปเปอร์เดียวกันในต้นไม้วิว. ขั้นตอนที่ไม่มีที่อยู่สามารถทำเป็นปุ่ม: ลำดับที่ถือโดยหน้าเคลื่อนที่ไปที่ `select` ที่มันออกแทนที่จะไปที่ที่อยู่ใหม่.'
step:
  account: บัญชี
  address: ที่อยู่
  payment: การชำระเงิน
  confirm: การยืนยัน
  choice: แผนของคุณ
