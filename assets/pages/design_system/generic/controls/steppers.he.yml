~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: שלבים
page_icon: 'ph:bold/steps'
intro: 'מקום שבו הקורא נמצא בסדרה — מנהרה, טופס בכמה חלקים. השלבים מאחור מצויירים בבירור וניתן לחזור אליהם כאשר הם מקבלים כתובת; השלב הנוכחי בולט; אלו שלפני מחכים, בדיסקרטיות.'
section:
  labelled:
    title: 'מספור ושמות'
    description: 'המקרה הכללי: מספר לספור בו, מילה לדעת מה הוא שואל. שני השלבים שכבר נעשו מחוברים חזרה.'
  numbers:
    title: 'מספרים בלבד'
    description: 'כאשר לשלבים אין שמות שראויים לקריאה, או שהרוחב אינו מאפשר להם.'
  words:
    title: 'מילים בלבד'
    description: 'ללא המספרים, כאשר הסדר ברור מהמילים.'
  ends:
    title: 'ראשון ואחרון'
    description: 'עדיין לא נעשה כלום, אז הכל נעשה חוץ מהשלב הנוכחי.'
  unknown:
    title: 'שלבים שלא הוחלטו עדיין'
    description: 'כאשר הדרכים נפרדות, מה שממתין תלוי בתשובה שלא ניתנה עדיין. השלב המייצג אותו אינו לוקח מספר ואינו זז אף אחד מהאחרים: השלב האחרון כאן הוא השלישי, לא הרביעי.'
  compact:
    title: 'קומפקטי, ונקודות'
    description: 'לכותרת של מודל או פאנל, כאשר יש מעט מקום: קומפקטי שומר על המספרים ומסביר את השלב הנוכחי בלבד; נקודות מציירות נקודה אחת לכל שלב ואינן מציינות אף שם על המסך, השמות נשארים למי שקורא את הדף בקול. ממש מתחת לכותרת של מודל או פאנל, שלב לוקח את מקום שורת הטעינה.'
  toolbar:
    title: 'בסרגל כלים'
    description: 'מוצב בסרגל מעל לדף, הוא תופס את המקום שהסרגל נותן לו.'
  vue:
    title: ב-vue
    description: 'אותו שלב ב-tree של vue. שלבים ללא כתובת יכולים להפוך לכפתורים: רצף שנשמר על ידי הדף ממשיך על ה`select` שהוא פולט ולא על כתובת חדשה.'
step:
  account: חשבונך
  address: כתובת
  payment: תשלום
  confirm: אישור
  choice: 'התוכנית שלך'
