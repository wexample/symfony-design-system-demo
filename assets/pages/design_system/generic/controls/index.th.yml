~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: การควบคุม
page_icon: 'ph:bold/cursor-click'
intro: 'สิ่งที่ผู้อ่านทำผ่านการกระทำแต่ละอย่าง ซึ่งแต่ละอย่างจะทำการกระทำแทนที่จะเป็นค่า — ฟิลด์แบบฟอร์มจะมีค่าอยู่ และอยู่ในส่วนถัดไป.'
page:
  buttons:
    title: ปุ่ม
    description: 'ปุ่มที่ทำบางสิ่ง โดยมีหลายรูปแบบ สถานะ และความหนา รวมถึงลิงก์และเป้าหมายที่เปิดในที่อื่น.'
  menus:
    title: เมนู
    description: 'ปุ่มที่เปิดรายการตัวเลือก โดยวางตัวอยู่ตามขอบของหน้าต่าง ในรูปแบบและมุมมองต่างๆ.'
  steppers:
    title: สเต็ปเปอร์
    description: 'ตำแหน่งของผู้อ่านในลำดับขั้นตอน โดยมีขั้นตอนที่ถอยหลังได้.'
section:
  compound:
    title: ทุกอย่างรวมกัน
    description: 'ชุดควบคุมเดียวกันในสามบริบท: บล็อกที่มีขอบนุ่ม, แถบเครื่องมือ, และแถบเครื่องมือขนาดกะทัดรัด ไม่มีอะไรเกี่ยวกับการควบคุมที่เปลี่ยนแปลงระหว่างทั้งสาม — พื้นที่คือสิ่งบอกว่ามีพื้นที่มากน้อยเพียงใด.'
button:
  primary: ปุ่มหลัก
select:
  option_one: ตัวเลือกหนึ่ง
  option_two: ตัวเลือกสอง
  option_three: ตัวเลือกสาม
menu:
  primary: ปุ่มเมนู
  item:
    report: รายงาน
    settings: การตั้งค่า
    logout: ออกจากระบบ
    long: ด้วยชื่อที่ยาวมากๆ
switch:
  label_right: เปิดใช้งานฟีเจอร์
link:
  external: ลิงก์ภายนอก
