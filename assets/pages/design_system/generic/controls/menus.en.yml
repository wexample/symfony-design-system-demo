~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

page_title: Menus
page_icon: ph:bold/list

section:
  menu:
    title: Menu buttons
  counts:
    title: Counts
    description: "How many of whatever the item leads to, at the far end of the line. It is a pill and nothing else — pass `count` beside the label, in a dropdown item or a vertical menu item, and the item places it. An item without the key shows nothing."
  separators:
    title: Separators
    description: "A separator is an item like the others, with one key more: a bare line parts two runs of items that have nothing to do with each other, and the same line given a word becomes the heading of what follows. Both sides of the stack read the same declaration — the third menu here is the vue one."

