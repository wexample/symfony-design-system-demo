~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: پله‌ها
page_icon: 'ph:bold/steps'
intro: 'مکانی که خواننده در یک توالی قرار دارد — یک تونل، یک فرم در چندین قسمت. مراحل قبلی به‌طور واضح ترسیم شده‌اند و می‌توان به آن‌ها بازگشت؛ مرحله در حال انجام مشخص است؛ مراحل پیش رو منتظرند، به‌طور نامحسوس.'
section:
  labelled:
    title: 'شماره‌گذاری و نام‌گذاری شده'
    description: 'مورد رایج: یک شماره برای شمارش، یک کلمه برای دانستن اینکه چه چیزی خواسته می‌شود. دو مرحله‌ای که قبلاً پیموده شده‌اند به هم پیوسته‌اند.'
  numbers:
    title: 'فقط شماره‌ها'
    description: 'جایی که مراحل نام‌هایی برای خواندن ندارند، یا عرض جایی برای آن‌ها ندارد.'
  words:
    title: 'فقط کلمات'
    description: 'بدون شماره‌ها، زمانی که ترتیب از کلمات واضح است.'
  ends:
    title: 'اولین و آخرین'
    description: 'هیچ چیزی هنوز پیموده نشده است، سپس همه چیز پیموده شده به جز مرحله در حال انجام.'
  unknown:
    title: 'مراحل هنوز تصمیم‌گیری نشده'
    description: 'جایی که مسیرها جدا می‌شوند، آنچه در پیش است بستگی به پاسخی دارد که هنوز داده نشده است. مرحله‌ای که نمایندگی آن را می‌کند شماره‌ای ندارد و هیچ‌یک از دیگران را حرکت نمی‌دهد: آخرین مرحله در اینجا سومین است، نه چهارمین.'
  compact:
    title: 'فشرده و نقاط'
    description: 'برای هدر یک مدال یا پنل، جایی که فضای کمی وجود دارد: فشرده شماره‌ها و نام مرحله در حال انجام را حفظ می‌کند؛ نقاط یک نقطه برای هر مرحله می‌کشد و نامی روی صفحه نمی‌گذارد، نام‌ها برای هر کسی که صفحه را بلند می‌خواند باقی می‌ماند. درست زیر هدر یک مدال یا پنل، یک پله‌بر به جای نوار بارگذاری قرار می‌گیرد.'
  toolbar:
    title: 'در نوار ابزار'
    description: 'در یک نوار بالای صفحه قرار گرفته است و فضای نوار را اشغال می‌کند.'
  vue:
    title: 'در vue'
    description: 'همان پله‌بر در یک درخت vue. مراحل بدون نشانی می‌توانند دکمه‌هایی شوند: یک توالی که توسط صفحه نگه‌داشته می‌شود، بر روی `select` که صادر می‌کند حرکت می‌کند نه بر روی نشانی جدید.'
step:
  account: حساب
  address: نشانی
  payment: پرداخت
  confirm: تأیید
  choice: 'طرح شما'
