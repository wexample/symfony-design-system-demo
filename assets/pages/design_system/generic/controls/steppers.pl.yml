~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Kroki
page_icon: 'ph:bold/steps'
intro: 'Gdzie czytelnik znajduje się w sekwencji — tunel, formularz w kilku częściach. Kroki za nim są rysowane solidnie i można do nich wrócić, gdy mają przypisany adres; krok, który jest w trakcie, wyróżnia się; te, które są przed, czekają, dyskretnie.'
section:
  labelled:
    title: 'Numerowane i nazwane'
    description: 'Typowy przypadek: numer do liczenia, słowo, które mówi, o co pyta. Dwa kroki już przebyte łączą się z powrotem.'
  numbers:
    title: 'Numery same'
    description: 'Gdzie kroki nie mają nazw wartowych do przeczytania, lub szerokość nie ma miejsca na nie.'
  words:
    title: 'Słowa same'
    description: 'Bez numerów, gdy kolejność jest oczywista z kontekstu słów.'
  ends:
    title: 'Pierwszy i ostatni'
    description: 'Nic jeszcze nie przebyte, a potem wszystko przebyte oprócz kroku, który jest w trakcie.'
  unknown:
    title: 'Kroki jeszcze nie podjęte'
    description: 'Gdzie ścieżki się rozdzielają, co leży przed zależy od odpowiedzi, która jeszcze nie została podana. Krok odpowiadający temu nie ma numeru i nie przesuwa innych: ostatni krok tutaj to trzeci, a nie czwarty.'
  compact:
    title: 'Kompaktowe i kropki'
    description: 'Dla nagłówka modala lub panelu, gdzie jest mało miejsca: kompaktowe zachowuje numery i nazwę tylko dla kroku, który jest w trakcie; kropki rysują jedną kropkę na krok i nie nazwają żadnego na ekranie, nazwy pozostając dla tych, którzy czytają stronę na głos. Tuż pod nagłówkiem modala lub panelu, steper zajmuje miejsce paska ładowania.'
  toolbar:
    title: 'W pasku narzędzi'
    description: 'Umieszczony w pasku nad stroną, zajmuje miejsce, które mu daje pasek.'
  vue:
    title: 'W vue'
    description: 'Ten sam steper w drzewie vue. Kroki bez adresu mogą stać się przyciskami: sekwencja trzymana przez stronę przechodzi na `select`, które emituje, zamiast na nowy adres.'
step:
  account: Konto
  address: Adres
  payment: Płatność
  confirm: Potwierdzenie
  choice: 'Twój plan'
