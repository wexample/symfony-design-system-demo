~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Menu
page_icon: 'ph:bold/list'
section:
  vue:
    title: Vue
    description: 'Baris tautan dan pemisah sebagai bagian vue. Berbeda dengan baris yang membaca rute, kedua ini mengambil ikon dan label sebagai opsi, jadi tidak ada yang hilang dari server.'
  menu:
    title: 'Tombol menu'
  counts:
    title: Jumlah
    description: 'Berapa banyak item yang dituju, di ujung garis. Ini adalah pil dan tidak lebih — lewati `count` di samping label, dalam item dropdown atau item menu vertikal, dan item tersebut akan menempatkannya. Item tanpa kunci tidak menunjukkan apa-apa.'
  separators:
    title: Pemisah
    description: 'Sebuah pemisah adalah item seperti yang lain, dengan satu kunci tambahan: sebuah garis kosong memisahkan dua rangkaian item yang tidak ada hubungannya, dan garis yang sama jika diberi kata menjadi judul dari apa yang mengikuti. Kedua sisi tumpukan membaca deklarasi yang sama — menu ketiga di sini adalah yang vue.'
  kinds:
    title: 'Apa itu item'
    description: 'Empat jenis berbagi satu baris: sebuah kata dan target adalah tautan, sebuah kata dan status adalah toggle, sebuah kata dan anak adalah cabang, dan garis kosong adalah pemisah. Tidak ada yang mendeklarasikan jenisnya — itu mengikuti dari apa yang dibawa item. Sebuah toggle menghabiskan slot utama untuk tanda-nya, jadi kolom dari mereka menjaga kata-katanya tetap sejajar, dan panel tetap terbuka di bawahnya: menu filter dibaca dalam jumlah banyak, bukan satu per satu.'
