~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 컨트롤
page_icon: 'ph:bold/cursor-click'
intro: '독자가 수행하는 행동입니다. 이들은 값이 아닌 동작을 취합니다 — 양식 필드는 값을 취하고 다음 섹션에 존재합니다.'
page:
  buttons:
    title: 버튼
    description: '무언가를 수행하는 버튼, 그 변형, 상태 및 밀도, 그리고 다른 곳에서 열리는 링크와 타겟이 포함됩니다.'
  menus:
    title: 메뉴
    description: '선택 목록을 여는 버튼, 창의 가장자리에 위치하며, twig 및 vue에서 사용됩니다.'
  steppers:
    title: 스텝퍼
    description: '독자가 단계의 순서에서 어디에 위치하는지, 뒤로 돌아갈 수 있는 단계와 함께 표시됩니다.'
section:
  compound:
    title: '모든 것을 함께'
    description: '세 가지 맥락에서 동일한 컨트롤 세트: 패딩 블록, 툴바 및 컴팩트 툴바. 세 가지 사이에서 컨트롤에 대한 내용은 변하지 않으며, 지역이 그들이 얼마나 많은 공간을 가질 수 있는지를 알려줍니다.'
