~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Bước đi'
page_icon: 'ph:bold/steps'
intro: 'Vị trí của người đọc trong một chuỗi - một đường hầm, một biểu mẫu có nhiều phần. Các bước phía sau được vẽ rõ ràng và có thể quay lại khi được chỉ định địa chỉ; bước đang thực hiện nổi bật; những bước phía trước chờ đợi, một cách kín đáo.'
section:
  labelled:
    title: 'Đánh số và có tên'
    description: 'Trường hợp phổ biến: một số để đếm, một từ để biết yêu cầu. Hai bước đã đi liên kết lại với nhau.'
  numbers:
    title: 'Chỉ số'
    description: 'Nơi mà các bước không có tên đáng đọc, hoặc chiều rộng không có chỗ cho chúng.'
  words:
    title: 'Chỉ từ'
    description: 'Không có số, khi thứ tự rõ ràng từ các từ.'
  ends:
    title: 'Đầu và cuối'
    description: 'Chưa có bước nào được thực hiện, sau đó mọi thứ đã được thực hiện trừ bước đang thực hiện.'
  unknown:
    title: 'Các bước chưa được quyết định'
    description: 'Nơi các con đường phân tách, những gì nằm phía trước tùy thuộc vào một câu trả lời chưa được đưa ra. Bước đại diện cho nó không có số và không di chuyển bất kỳ bước nào khác: bước cuối cùng ở đây là bước thứ ba, không phải bước thứ tư.'
  compact:
    title: 'Gọn gàng và dấu chấm'
    description: 'Dành cho tiêu đề của một modal hoặc một panel, nơi có ít không gian: gọn gàng giữ lại số và tên của bước đang thực hiện; dấu chấm vẽ một dấu chấm cho mỗi bước và không đặt tên nào trên màn hình, tên sẽ dành cho những ai đọc trang to.'
  toolbar:
    title: 'Trong thanh công cụ'
    description: 'Được đặt trong một thanh ở trên cùng của trang, nó chiếm chỗ mà thanh cho phép.'
  vue:
    title: 'Trong vue'
    description: 'Cùng một bước đi trong cây vue. Các bước không có địa chỉ có thể trở thành nút bấm: một chuỗi được giữ bởi trang di chuyển trên `select` mà nó phát ra thay vì trên một địa chỉ mới.'
step:
  account: 'Tài khoản'
  address: 'Địa chỉ'
  payment: 'Thanh toán'
  confirm: 'Xác nhận'
  choice: 'Kế hoạch của bạn'
