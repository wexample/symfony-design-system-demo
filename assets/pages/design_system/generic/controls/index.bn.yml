~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: নিয়ন্ত্রণ
page_icon: 'ph:bold/cursor-click'
intro: 'যা একজন পাঠক দ্বারা কার্যকর হয়। এগুলোর প্রতিটির একটি কার্যকলাপ আছে, মান নয় — একটি ফর্ম ফিল্ড মান গ্রহণ করে এবং পরবর্তী বিভাগে অবস্থান করে।'
page:
  buttons:
    title: বোতামগুলি
    description: 'যেটি কিছু করে, এর ভেরিয়েন্ট, অবস্থান এবং ঘনত্ব সহ, পাশাপাশি লিঙ্ক এবং লক্ষ্য যা অন্যত্র খোলে।'
  menus:
    title: মেনু
    description: 'একটি বোতাম যা একটি পছন্দের তালিকা খুলে, জানালার প্রান্তের বিরুদ্ধে অবস্থান করে, টুইগ এবং ভিউতে।'
  steppers:
    title: স্টেপারস
    description: 'যেখানে একজন পাঠক পদক্ষেপের একটি সিকোয়েন্সে অবস্থান করছে, পিছনের পদক্ষেপে ফিরে যাওয়ার জন্য।'
section:
  compound:
    title: 'সবকিছু একত্রে'
    description: 'তিনটি প্রসঙ্গে একই সেটের নিয়ন্ত্রণ: একটি প্যাডেড ব্লক, একটি টুলবার, এবং একটি সংক্ষিপ্ত টুলবার। তিনটির মধ্যে নিয়ন্ত্রণগুলোর কিছুই পরিবর্তিত হয় না — অঞ্চলই তাদের কতটা স্থান আছে তা জানায়।'
button:
  primary: 'প্রাথমিক বোতাম'
select:
  option_one: 'অপশন এক'
  option_two: 'অপশন দুই'
  option_three: 'অপশন তিন'
menu:
  primary: 'মেনু বোতাম'
  item:
    report: রিপোর্ট
    settings: সেটিংস
    logout: 'লগ আউট'
    long: 'একটি বেশ, বেশ, বেশ, বেশ দীর্ঘ শিরোনাম সহ'
switch:
  label_right: 'ফিচার সক্ষম করুন'
link:
