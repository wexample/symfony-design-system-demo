~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 菜单
page_icon: 'ph:bold/list'
section:
  vue:
    title: Vue
    description: '链接行和分隔符作为 vue 部件。与读取路线的行不同，这两个将其图标和标签作为选项，因此服务器的内容不会缺失。'
  menu:
    title: 菜单按钮
  counts:
    title: 计数
    description: '项所指向的内容数量，在行的另一端。它是一个药丸，别无其他 - 在下拉项或垂直菜单项中在标签旁边传递 `count`，该项将其放置。没有键的项不显示任何内容。'
  separators:
    title: 分隔符
    description: '分隔符是像其他项一样的项，多了一个关键：一条光秃秃的线分隔两个没有任何联系的项目系列，而同一条线加上一个词就变成了后续内容的标题。堆栈两侧都读取相同的声明 - 这里的第三个菜单是 vue 的。'
  kinds:
    title: 项的类型
    description: '四种类型共享一行：一个词和一个目标是链接，一个词和一个状态是切换，一个词和子项是分支，而一条光秃秃的线是分隔符。没有任何事物声明其类型 - 它从项所承载的内容中推断出来。切换花费其前导位置在其标记上，因此它们的列保持其词对齐，面板在其下方保持打开：过滤器菜单是以一把为单位读取的，而不是一次一个。'
