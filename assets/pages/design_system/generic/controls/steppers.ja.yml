~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ステッパー
page_icon: 'ph:bold/steps'
intro: '読者がシーケンスの中でどこにいるか — トンネル、複数の部分からなるフォーム。後ろのステップはしっかりと描かれており、アドレスが与えられたときに戻ることができます；現在進行中のステップは際立っています；前方のステップは控えめに待機しています。'
section:
  labelled:
    title: 番号付きと名前付き
    description: 一般的なケース：数を数えるための番号、何を求めているのかを知るための単語。既に歩いた2つのステップは戻ることができます。
  numbers:
    title: 数字のみ
    description: ステップに読む価値のある名前がない場合、または幅にそれらを収める余地がない場合。
  words:
    title: 単語のみ
    description: 数字がない場合、単語から順序が明らかなとき。
  ends:
    title: 最初と最後
    description: まだ歩いていない何も、次にすべてが歩かれたが、現在進行中のステップは除外される。
  unknown:
    title: まだ決まっていないステップ
    description: 道が分かれるところで、前に何があるかはまだ与えられていない答えに依存しています。それを示すステップは番号を持たず、他のステップを動かすことはありません：ここでの最後のステップは3番目であり、4番目ではありません。
  compact:
    title: コンパクト、そしてドット
    description: モーダルやパネルのヘッダー用、スペースが少ない場合：コンパクトは数字を保持し、現在進行中のステップの名前のみを表示します；ドットは各ステップに1つのドットを描き、画面上に名前は表示されず、名前はページを声に出して読む人のために保持されます。モーダルやパネルのヘッダーのすぐ下に、ステッパーはローディングバーの代わりを務めます。
  toolbar:
    title: ツールバー内
    description: ページの上部に配置され、バーが与えるスペースを取ります。
  vue:
    title: Vue内
    description: 'Vueツリー内の同じステッパー。アドレスのないステップはボタンにすることができ、ページによって保持されるシーケンスは新しいアドレスではなく、発信される `select` によって進みます。'
step:
  account: アカウント
  address: 住所
  payment: 支払い
  confirm: 確認
  choice: あなたのプラン
