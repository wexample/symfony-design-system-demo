  absent: 'Tidak ditemukan dalam format ini, dan deklarasi tidak menjelaskan mengapa — keputusan belum dibuat'
  todo: 'Diharapkan dalam format ini dan belum ada di sana'
  shared: 'Juga dimiliki oleh %bundles%. Bukan kesalahan — pemuat membedakan mereka dengan alias — tetapi penting untuk mengetahui apakah ini satu elemen yang digambar ulang atau dua yang berbagi nama.'
format:
  style:
    title: Gaya
    description: 'Gaya yang dimuat oleh pemuat ketika komponen ada di halaman.'
  template:
    title: Template
    description: 'Renderer server, digambar oleh twig.'
  vue:
    title: Vue
    description: 'Kembar klien, digambar di browser dari opsi yang sama.'
  script:
    title: Script
    description: 'Perilaku, terikat pada markup setelah ada di dokumen.'
  schema:
    title: Skema
    description: 'Kontrak: apa yang diambil komponen, dengan tipe dan default. Setiap renderer lainnya dapat diperiksa terhadapnya.'
  ai:
    title: AI
    description: 'Apa yang diberitahukan kepada agen tentang komponen: skema, cara menggunakannya, alat yang berfungsi padanya.'
  react:
    title: React
    description: 'Renderer react.'
  flutter:
    title: Flutter
    description: 'Renderer flutter, ditulis dalam dart berdasarkan skema. Markup tidak dibawa; kontrak dan token dibawa.'
section:
  matrix:
    title: 'Elemen berdasarkan format'
    description: 'Satu baris per komponen, satu kolom per renderer. Sebuah komponen adalah direktori di bawah `components/` yang memuat setiap cara ia dapat digambar — `spinner/spinner.scss`, `spinner.html.twig`, `spinner.vue`, `spinner.ts` — sehingga tidak ada yang perlu mencocokkan empat direktori dengan nama lagi. Sebuah sel menghitung file di belakangnya — arahkan mouse ke salah satu untuk melihatnya. Setiap elemen yang dideklarasikan dibaca pada tingkat yang sama — sebuah baris yang ditemukan dalam satu format mungkin merupakan celah atau primitif yang tidak menginginkan yang lain, dan mengurutkan itu adalah pekerjaan yang ditujukan oleh tabel ini daripada sesuatu yang sudah diketahui. Empat status, dibedakan oleh siapa yang bergerak selanjutnya: sebuah cek, elemen ada di sana; sebuah peringatan, itu diinginkan dan hilang; sebuah lingkaran yang dicoret, itu tanpa sengaja; sebuah kosong, belum ada yang memutuskan. Arahkan mouse ke peringatan atau lingkaran untuk apa yang dikatakan deklarasi.'
  sources:
    title: 'Dari mana ini berasal'
    description: 'Sebuah bundel ada di tabel karena menyatakannya — dengan mengimplementasikan `DesignSystemElementsBundleInterface`, cara bundel memberi tahu pemuat tentang jalur depannya. Setiap satu menulis `data/elements.json` di dalam asetnya sendiri, diterbitkan bersamanya, sehingga build, sisi node, bahasa lain atau agen semua bekerja dari file yang sama; halaman ini hanya merupakan persatuan mereka.'
  abstract:
    title: Abstrak
    description: 'Lima basis di bawah `components/_abstract/`, yang tidak pernah digambar — mereka hanya diperluas. `_abstract/vue` adalah tiga blok twig kosong yang diisi oleh tiga puluh satu template; `_abstract/form-field` adalah apa yang dibangun oleh dua belas input. Mereka berada di luar matriks karena alasan yang sama seperti bentuk: mereka tidak dikirimkan kepada siapa pun, jadi meminta mereka untuk skema atau kembar react adalah meminta pertanyaan yang tidak dapat mereka jawab. Garis bawah mengatakan hal yang sama sebelum siapa pun membuka direktori. Apa yang ditampilkan adalah apa yang masing-masing sudah bawa kepada siapa pun yang memperluasnya.'
  shapes:
    title: Bentuk
    description: 'Sebuah bentuk adalah gaya tanpa renderer: Anda menulis markup, menaruh kelas di atasnya, dan `@use` stylesheet dari milik Anda sendiri. `.stack`, `.grid`, `.block`, `.cluster`. Mereka terdaftar di sini dan tidak di tabel di atas karena tabel renderer tidak memiliki kolom untuk menawarkan sesuatu yang tidak memiliki — dan ketidakadaan mereka dari situ adalah mengapa semua peringatan berarti pekerjaan daripada pertanyaan yang diajukan dengan buruk. Garis ditarik oleh file, bukan oleh selera: sebuah bentuk adalah tepat satu `.scss` dan tidak ada yang merendernya, jadi ketika satu mendapatkan `.html.twig` itu pindah ke `components/` dan bergabung dengan matriks. Pindah itu adalah satu-satunya promosi yang ada. Apa yang masing-masing katakan tentang dirinya dibaca dari kepala stylesheet-nya sendiri, jadi tidak ada tempat kedua untuk mengalir darinya.'
  coverage:
    title: 'Apa yang ini tidak mencakup'
    description: 'Direktori `assets/` yang tidak dilalui oleh pemindaian, terdaftar dari disk daripada dari memori. Mixins, utilitas, dan token bukan elemen dan mungkin tidak pernah menjadi baris di sini; tata letak dan skrip bersama adalah, dan belum dicakup.'
