~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

page_title: Inventory
page_icon: ph:bold/list-checks

intro: "Every element the bundle ships, and the formats it is delivered in. The table is not a list anyone maintains: it is the registry the design system ships, generated by a walk of `assets/` and of its twig extensions. It answers what is there — never what should be, which is a question no scan can settle and which the elements will have to declare for themselves."

missing:
  title: A registry is missing
  body: "%bundles% signed up as holding elements but has no registry on disk, so its rows are absent from the table below. Run `%command%` and commit the result."

summary:
  elements: Elements found
  lonely: In a single format
  complete: In every format

column:
  element: Element

cell:
  absent: "Not found in this format, and the declaration does not say why — a decision not yet made"
  shared: "Also held by %bundles%. Not a fault — the loader tells them apart by alias — but worth knowing whether it is one element redrawn or two that share a name."


format:
  shape:
    title: Shape
    description: "A css class expecting markup it does not itself produce."
  partial:
    title: Partial
    description: "A twig include drawing that markup, taking its variables from the caller."
  twig_function:
    title: Function
    description: "A php function drawing it, with named options and defaults."
  component:
    title: Component
    description: "The loader's triad — template, script, stylesheet — bound at runtime, and the only format that can carry behaviour."
  vue:
    title: Vue
    description: "The client-side twin, drawn in the browser from the same options."

section:
  matrix:
    title: Element by format
    description: "An element is one row wherever the formats agree on its name: `partials/spinner.html.twig`, `vue/partials/spinner.vue` and `css/shapes/_spinner.scss` are the same spinner. A cell counts the files behind it — hover one to see them. Every declared element reads at the same level — a row found in a single format may be a gap or a primitive that wants nothing else, and sorting that out is work this table is for rather than something it already knows. A dash is a format the element's declaration says nothing about; a struck circle is one it does without on purpose — hover it for the reason. Telling the two apart is what the declarations are for."
  sources:
    title: Where these come from
    description: "A bundle is in the table because it said so — by implementing `DesignSystemElementsBundleInterface`, the way a bundle tells the loader about its front paths. Each writes `data/elements.json` inside its own assets, published with them, so the build, the node side, another language or an agent all work from the same files; this page is only their union."
  coverage:
    title: What this leaves out
    description: "Directories of `assets/` the scan does not walk, listed from disk rather than from memory. Mixins, utilities and tokens are not elements and may never be rows here; layouts and shared scripts are, and are not covered yet."
