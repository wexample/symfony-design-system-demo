  shared: 'Ayrıca %bundles% tarafından tutuluyor. Bir hata değil — yükleyici bunları takma adla ayırt eder — ama bir öğenin yeniden çizildiğini mi yoksa aynı adı paylaşan iki öğe mi olduğunu bilmekte fayda var.'
