~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Tanggal
page_icon: 'ph:bold/clock'
intro: 'Sebuah kosakata nama format, dipahami secara identik oleh Twig, oleh JavaScript biasa dan oleh Vue. Server mencetak sebuah <time> yang membawa momen dan format yang diminta; browser mengambilnya dan menulis ulang seiring bertambahnya usia, sehingga halaman yang ditinggalkan terbuka tidak pernah berbohong tentang berapa lama sesuatu terjadi.'
section:
  formats:
    title: 'Format yang dinamai'
    description: 'Format absolut adalah gaya tanggal dan waktu ICU, jadi urutan bidang dan pemisah tergantung pada lokal pembaca daripada pada templat.'
  relative:
    title: Relatif
    description: 'Jarak dihitung dalam unit terbesar yang masih bermakna — menit hingga satu jam, jam hingga satu hari, kemudian hari, minggu, bulan, dan tahun. Setiap ungkapan berasal dari kunci terjemahan.'
  auto:
    title: Otomatis
    description: 'Default. Menghitung mundur saat tanggal masih baru, dan beralih ke tanggal kalender setelah seminggu, di mana "27 minggu yang lalu" tidak lagi membantu siapa pun.'
  live:
    title: 'Selalu terbarui'
    description: 'Sebuah timer tunggal melayani setiap tanggal di halaman, dengan ritme yang layak untuk unit yang ditampilkan — beberapa detik untuk "baru saja sekarang", satu jam untuk "3 bulan yang lalu". Tinggalkan halaman ini terbuka dan saksikan.'
  plain:
    title: 'Hanya teks'
    description: 'Filter mengembalikan string tanpa markup, untuk atribut judul atau ekspor. Nama format yang tidak dikenalnya dianggap sebagai pola ICU mentah, yang merupakan cara keluar ketika format yang dinamai tidak memiliki bentuk yang Anda butuhkan.'
offset:
  now: 'Beberapa saat yang lalu'
  minutes: 'Lima menit'
  hours: 'Tiga jam'
  days: 'Dua hari'
  months: 'Empat bulan'
  years: 'Tiga tahun'
  future: 'Dalam dua jam'
live:
  server: 'Dirender oleh Twig, diperbarui oleh layanan depan:'
  vue: 'Dirender oleh Vue:'
plain:
  filter: "| date_format('date_long')"
  pattern: '| date_format("EEEE d MMMM, ''minggu'' w")'
