~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Graph-Protokoll
page_icon: 'ph:bold/git-fork'
intro: 'Elemente in einer Abfolge, neueste zuerst, dargestellt auf farbigen Bahnen: wo eine Linie sich teilt, wo zwei wieder zusammenkommen. Jedes Element zeigt seine Eltern; die Bahnen folgen. Was eine Zeile neben dem Graphen zeigt, ist frei – ein Titel, Referenzen als Kapseln, wer, wann, ein kurzer Name – so ist eine Git-Historie eine von vielen möglichen Anwendungen.'
section:
  history:
    title: 'Eine Historie'
    description: 'Ein Feature-Branch, der zurückgeführt wurde, ein anderer offen gelassen, ein Tag auf einem Release. Jede Bahn behält ihre Farbe von ihrem Anfang bis zu ihrem Ende.'
  other:
    title: 'Etwas anderes als Git'
    description: 'Die Versionen eines Dokuments, eine davon zuvor seitlich überprüft, bevor sie in die nächste eingefügt wird. Die Komponente weiß nichts über Commits.'
  vue:
    title: 'In Vue'
    description: 'Die gleiche Historie in einem Vue-Baum, die Bahnen erneut dargestellt, wenn die Elemente am Kopf eintreffen.'
  git:
    title: 'Die Historie dieser Anwendung'
    description: "Aus dem Repository gelesen durch symfony-coding's git_graph_items(), über den gemeinsamen Leser, der Git nie im Weg steht."
