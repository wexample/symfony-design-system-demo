    text: 'উদাহরণ পরিবেশ কপি করুন এবং ডাটাবেসের ঠিকানা পূরণ করুন।'
  migrate:
    title: 'ডাটাবেস তৈরি করুন'
    text: 'মাইগ্রেশন চালান; এটি হচ্ছে বর্তমান পদক্ষেপ।'
  deploy:
