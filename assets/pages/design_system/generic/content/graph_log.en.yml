~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

page_title: Graph log
page_icon: ph:bold/git-fork

intro: "Items in a line of descent, newest first, drawn on coloured lanes: where a line forks, where two meet again. Each item says its parents; the lanes follow. What a row shows beside the graph is free — a title, refs as capsules, who, when, a short name — so a git history is one use among others."

section:
  history:
    title: A history
    description: "A feature branch merged back, another left open, a tag on a release. Each lane keeps its colour from where it starts to where it ends."
  other:
    title: Something else than git
    description: "The versions of a document, one of them reviewed on the side before being merged into the next. The component knows nothing about commits."
  vue:
    title: In vue
    description: "The same history in a vue tree, the lanes drawn again as items come in at the head."
  git:
    title: This application's history
    description: "Read from the repository by symfony-coding's git_graph_items(), through the shared reader that never gets in git's way."

history:
  merge_search: Merge the search branch
  search_filters: Add filters to the search
  fix_header: Fix the header on small screens
  try_theme: Try a darker theme
  search_index: Index the documents
  release: Release 2.1.0
  search_start: Start the search
  initial: First commit

versions:
  v4: Version 4, with the review applied
  current: current
  review: Reviewer's changes
  review_ref: review
  v3: Version 3
  v2: Version 2
  v1: Version 1
