~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Zaman Çizelgesi'
page_icon: 'ph:bold/list-numbers'
intro: 'Birbirinin altında olan şeyler, her biri bir işaretçi ile, bir çizgi ile bağlanmış: bir prosedürün adımları, bir tarihin olayları, bir koşunun aşamaları. Her biri özgür — bir metin satırı, bir tablo, bir form — ve çizgi, hepsinin boyunca, bir sonraki işaretçiye kadar uzanır.'
section:
  steps:
    title: 'Sıralı Adımlar'
    description: 'Numaralandırılmış, adımcının bildiği üç durumla: arkadaki adımlar katı çizilmiş, yapılan adım öne çıkıyor, öndeki adımlar bekliyor.'
  free:
    title: 'Bir başlık altında her şey'
    description: 'Her öğe ihtiyacı olan her şeyi barındırır — özellikler, bir mesaj, düğmeler. Bir simge noktayı değiştirir ve bir ton, işaretçiyi, bir işaretçi veya bir blok gibi renklendirir.'
  history:
    title: 'Bir tarihçe'
    description: 'Takip edilecek bir sıra yok, sadece olaylar: noktalar, her başlığın altında bir tarih ve bir şeyler anlatan bir kategori rengi.'
  unknown:
    title: 'Henüz kararlaştırılmamış adımlar'
    description: 'Adımcıda olduğu gibi: henüz verilmemiş bir cevaba bağlı olan bir adım numara almaz ve diğerlerini hareket ettirmez.'
  hand:
    title: 'Elle yazılmış'
    description: 'Bileşen, bir listeden şekli yazmanın bir yoludur. Sayfada yazılan aynı sınıflar, içinde her şeyle birlikte aynı zaman çizelgesini verir.'
  vue:
    title: 'Vue içinde'
    description: "Aynı zaman çizelgesi bir vue ağacında. Dalın markup olarak aldığı şey, orada bir scoped slot'tur, böylece bir bileşen bir öğenin başlığının altında durabilir."
