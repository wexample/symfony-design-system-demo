article:
  toc:
    label: 'اس مضمون میں'
  title: 'ڈیزائن ٹوکنز کو سمجھنا'
  intro: 'ڈیزائن ٹوکنز ایک پروڈکٹ میں بصری فیصلوں کے لیے سچائی کا واحد ذریعہ ہیں۔ وہ رنگ، فاصلے، نوع ٹائپ، اور حرکت کو نامزد متغیرات میں کوڈ کرتے ہیں جو اجزاء استعمال کرتے ہیں۔'
  section_one:
    title: 'ٹوکن کیوں اہم ہیں'
    body_one: 'بغیر ٹوکن کے، بنیادی برانڈ رنگ میں تبدیلی کے لیے سینکڑوں فائلوں میں تلاش کرنا ضروری ہے۔ ٹوکن کے ساتھ، ایک متغیر کی تازہ کاری ہر جگہ پھیل جاتی ہے — بٹن سے لے کر الرٹس تک نیویگیشن بار تک۔'
    body_two: 'ٹوکن ڈیزائن کے اوزار اور کوڈ کے درمیان خلا کو بھی پل کرتے ہیں۔ ایک ڈیزائنر Figma میں ایک رنگ کو <strong>surface-brand</strong> نام دیتا ہے؛ ایک ڈویلپر CSS میں <code>var(--surface-brand)</code> کا استعمال کرتا ہے۔ وہ ایک ہی زبان بولتے ہیں۔'
  section_two:
    title: 'عملی مثالیں'
    body: 'ایک ایسا جزو تصور کریں جس کو ایک پس منظر، بارڈر، اور متن کی ضرورت ہو۔ سخت کوڈنگ کے بجائے <code>#1a56db</code>، <code>#e1effe</code>، اور <code>#1e429f</code>، جزو <code>--color-primary</code>، <code>--surface-primary-subtle</code>، اور <code>--text-primary-strong</code> کا حوالہ دیتا ہے۔ جب برانڈ ترقی کرتا ہے تو پیلیٹ تبدیل ہوتی ہے — جزو نہیں۔'
  list_title: 'ٹوکن کی اقسام'
  list:
    - 'رنگ — برانڈ، معنوی، اور نیوٹرل پیلیٹ'
    - 'فاصلہ — 2px سے 64px تک ایک مستقل پیمانہ'
    - 'نوع ٹائپ — فونٹ کے سائز، وزن، اور لائن کی اونچائیاں'
    - 'ریڈیس — تیز کونوں سے مکمل طور پر گول'
    - 'سایہ — گہرائی اور درجہ بندی کے لیے بلندی کی سطح'
    - 'حرکت — ایزنگ کرو اور دورانیے کے مراحل'
  quote: 'انٹرنیٹ پر ملنے والے زیادہ تر اقتباسات شاید ایک AI نے تیار کیے ہوں گے۔'
  quote_author: 'البرٹ آئن سٹائن'
  cta: 'مکمل ٹوکن ریفرنس پڑھیں'
media:
  alt: 'متن کے ساتھ پلےس ہولڈر تصویر'
  caption: 'تصویر جو لے آؤٹ کے ایک تہائی حصے پر قابض ہے۔'
  body_one: 'تصویر اور متن کو ایک ساتھ رکھنے کے لیے content--media کا استعمال کریں۔ تصویر چوڑائی کا ایک تہائی لیتی ہے، متن دو تہائی۔'
  body_two: 'یہ لے آؤٹ پل اقتباسات، تصویری تعریفات، یا کسی بھی مختصر ادبی بلاک کے لیے موزوں ہے جہاں تصویر متن کی حمایت کرتی ہے بغیر اس پر غالب ہوئے۔'
dropcap:
  paragraph_one: 'لورم ایپسوم ڈولر سٹ امیٹ، کانسیٹیکٹر ایڈپیسٹنگ ایلیٹ۔ سیڈ ڈو ایئوسمد تیمپور انسیڈڈٹ ات لیبر ایٹ اور ڈولور میگنا الیکوا۔ ات انیم ایڈ منیم ویینیم، کوئس نوسٹرڈ ایڈ ایکسرسائزشن یللمکو لیبرس نیسی ات ایلی کوئپ اییکس ای کاموڈو کنسیقٹ۔'
  paragraph_two: 'ڈوئس آؤتے آئریور ڈولر ان ریپریہنڈریٹ ان وولیپٹیٹ ویلیٹ ایسے سلیوم ڈولور ایو فگیت نولا پیریٹور۔ ایکسپٹور سنت اوکیوکیٹ کیوپڈات نون پرویڈینٹ، سنٹ ان کُلپہ کیو آفیسیئل ڈیسرٹ مولا انیم آئیڈ ایست لیبوریوم۔'
