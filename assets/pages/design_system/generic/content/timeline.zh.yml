~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 时间线
page_icon: 'ph:bold/list-numbers'
intro: 一项接一项，每个都有标记，通过一条线连接：程序的步骤，历史的事件，运行的阶段。每个项目包含的内容是自由的——一行文本，一个表格，一个表单——并且这条线贯穿其中，连接到下一个标记。
section:
  steps:
    title: 按顺序的步骤
    description: 编号，包含步进器所知的三种状态：已经完成的步骤用实线表示，正在进行的步骤突出显示，未来的步骤在等待。
  free:
    title: 标题下的任何内容
    description: 每个项目包含其所需的内容——属性、消息、按钮。一个图标替代了点，色调为标记上色，像为标记或块上色一样。
  history:
    title: 历史
    description: 没有顺序可循，只有事件：点，每个标题下有一个日期，以及一个类别颜色来说明某些内容。
  unknown:
    title: 尚未决定的步骤
    description: 就像在步进器上一样：一个依赖于尚未给出的答案的步骤没有编号，并且不影响其他步骤。
  hand:
    title: 手写
    description: 该组件只是从列表中书写形状的一种方式。页面上书写的相同类会产生相同的时间线，包含其中的任何内容。
  vue:
    title: 在vue中
    description: 在vue树中的相同时间线。枝条作为标记的内容是一个范围插槽，因此组件可以位于项目的标题下。
install:
  clone:
    title: 获取源代码
    text: 克隆仓库并安装其依赖项。
  configure:
    title: 配置
    text: 复制示例环境并填写数据库地址。
  migrate:
    title: 创建数据库
    text: 运行迁移；这是正在进行的步骤。
  deploy:
    title: 部署
    text: 构建资产并发布版本。
order:
  placed:
    title: 订单已下
    meta: '3月14日，09:41'
  paid:
    title: 付款已收到
    meta: '3月14日，09:42'
  shipped:
    title: 已发货
    meta: '3月15日，16:05'
  next:
    title: 交付
  delay:
    title: 延迟
    text: 承运人宣布再多一天。
  field:
    reference: 参考
    amount: 金额
    method: 支付方式
    card: 卡号末尾4242
  action:
    track: 追踪包裹
    cancel: 取消
history:
  release:
    title: 版本2.0发布
    meta: 9月2日
  review:
    title: 团队审核
    meta: 8月28日
  draft:
    title: 初稿
    meta: 8月12日
branch:
  choose: 选择一个计划
  depends: 依赖于该计划
hand:
  one: 一个普通的点
  two: 一个图标代替点
  two_text: 页面中书写的任何标记。
