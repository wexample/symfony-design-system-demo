  captioned:
    label: 'มีคำบรรยาย — ห่อหุ้มใน figure พร้อม figcaption.'
    alt: 'ภาพตัวอย่าง — มีคำบรรยาย'
    caption: 'ฟิกเจอร์พร้อม figcaption — ใช้เพื่อให้เครดิตแหล่งที่มาหรือเพิ่มบริบทให้กับเนื้อหาทางภาพ.'
article:
  toc:
    label: ในบทความนี้
  title: ความเข้าใจเกี่ยวกับโทเคนการออกแบบ
  intro: 'โทเคนการออกแบบเป็นแหล่งข้อมูลเดียวที่เชื่อถือได้สำหรับการตัดสินใจทางภาพทั้งหมดในผลิตภัณฑ์ พวกเขาเข้ารหัสสี การเว้นระยะ ไทโปกราฟี และการเคลื่อนไหวในตัวแปรที่มีชื่อซึ่งองค์ประกอบต่างๆ ใช้.'
  section_one:
    title: ทำไมโทเคนถึงสำคัญ
    body_one: 'หากไม่มีโทเคน การเปลี่ยนแปลงสีแบรนด์หลักจะต้องค้นหาผ่านไฟล์หลายร้อยไฟล์ แต่เมื่อมีโทเคน การอัปเดตตัวแปรครั้งเดียวจะส่งผลไปทุกที่ — ตั้งแต่ปุ่มไปจนถึงการแจ้งเตือนถึงแถบการนำทาง.'
    body_two: 'โทเคนยังเชื่อมช่องว่างระหว่างเครื่องมือออกแบบและโค้ด นักออกแบบตั้งชื่อสี <strong>surface-brand</strong> ใน Figma; นักพัฒนาจะใช้ <code>var(--surface-brand)</code> ใน CSS พวกเขาพูดภาษาเดียวกัน.'
  section_two:
    title: ตัวอย่างเชิงปฏิบัติ
    body: 'พิจารณาองค์ประกอบที่ต้องการพื้นหลัง ขอบ และข้อความ แทนที่จะเข้ารหัส <code>#1a56db</code>, <code>#e1effe</code>, และ <code>#1e429f</code> แบบตายตัว องค์ประกอบจะอ้างอิง <code>--color-primary</code>, <code>--surface-primary-subtle</code>, และ <code>--text-primary-strong</code>. เมื่อแบรนด์พัฒนาขึ้น พาเลตต์จะเปลี่ยน — องค์ประกอบจะไม่เปลี่ยน.'
  list_title: หมวดหมู่โทเคน
  list:
    - 'สี — แบรนด์ สีเชิงความหมาย และสีที่เป็นกลาง'
    - 'การเว้นระยะ — สเกลที่สม่ำเสมอจาก 2px ถึง 64px'
    - 'ไทโปกราฟี — ขนาดตัวอักษร น้ำหนัก และความสูงของบรรทัด'
    - 'รัศมี — จากมุมแหลมจนถึงมุมมนเต็มที่'
    - 'เงา — ระดับการยกระดับเพื่อความลึกและลำดับชั้น'
    - 'การเคลื่อนไหว — เส้นโค้งการผ่อนคลายและระยะเวลา'
  quote: 'คำพูดส่วนใหญ่ที่พบในอินเทอร์เน็ตอาจถูกสร้างโดย AI.'
  quote_author: 'อัลเบิร์ต ไอน์สไตน์'
  cta: อ่านเอกสารอ้างอิงโทเคนทั้งหมด
media:
  alt: ภาพตัวอย่างข้างข้อความ
  caption: ภาพที่ใช้พื้นที่หนึ่งในสามของเลย์เอาต์.
  body_one: 'ใช้ content--media เพื่อวางภาพและข้อความเคียงข้างกัน ภาพจะใช้ความกว้างหนึ่งในสาม ข้อความสองในสาม.'
  body_two: 'เลย์เอาต์นี้เหมาะสำหรับคำอ้างที่ดึงดูด คำจำกัดความที่มีภาพประกอบ หรือบล็อกบรรณาธิการสั้น ๆ ที่ภาพช่วยเสริมข้อความโดยไม่ครอบงำมัน.'
