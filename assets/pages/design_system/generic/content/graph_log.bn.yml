~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'গ্রাফ লগ'
page_icon: 'ph:bold/git-fork'
intro: 'একটি বংশগতি লাইনে আইটেম, নতুন থেকে পুরোনো, রঙিন লেনে অঙ্কিত: যেখানে একটি রেখা বিভক্ত হয়, যেখানে দুটি আবার মিলিত হয়। প্রতিটি আইটেম তার পিতামাতা বলে; লেনগুলি অনুসরণ করে। গ্রাফের পাশে একটি সারি যা দেখায় তা মুক্ত — একটি শিরোনাম, ক্যাপসুলের মতো রেফারেন্স, কে, কখন, একটি সংক্ষিপ্ত নাম — তাই একটি গিট ইতিহাস অন্যান্য ব্যবহারের মধ্যে একটি।'
section:
  history:
    title: 'একটি ইতিহাস'
    description: 'একটি ফিচার শাখা পুনরায় মিশ্রিত হয়েছে, আরেকটি খোলা রাখা হয়েছে, একটি রিলিজে একটি ট্যাগ। প্রতিটি লেন তার শুরু থেকে শেষ পর্যন্ত রঙ ধরে রাখে।'
  other:
    title: 'গিটের বাইরে কিছু'
    description: 'একটি ডকুমেন্টের সংস্করণ, তাদের মধ্যে একটি পাশের দিকে পর্যালোচনা করা হয়েছে এর পরবর্তী সংস্করণে মিশ্রিত হওয়ার আগে। উপাদান কমিট সম্পর্কে কিছু জানে না।'
  vue:
    title: ভিউতে
    description: 'একটি ভিউ গাছের মধ্যে একই ইতিহাস, যখন আইটেমগুলি মাথায় আসে তখন লেনগুলি আবার অঙ্কিত হয়।'
  git:
    title: 'এই অ্যাপ্লিকেশনের ইতিহাস'
    description: 'সংশ্লিষ্ট পাঠক দ্বারা পড়া হয়েছে যা গিটের পথে কখনো বাধা দেয় না, symfony-coding এর git_graph_items() মাধ্যমে।'
