~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Консоль
page_icon: 'ph:bold/terminal-window'
intro: 'Что напечатала оболочка, читается на странице: команды после их приглашения, их вывод под ними, а цвета терминала читаются как палитра, в любой из схем. Она читает; она не принимает команды.'
section:
  session:
    title: Сессия
    description: 'Строки четырех типов — команда, вывод, ошибка, информация — или простые строки. escape-коды, которые программа написала для своего терминала, сохраняются как цвет и вес; остальная информация, которую получает терминал, отбрасывается.'
  vue:
    title: 'В vue'
    description: 'Те же строки, нарисованные двойником vue, здесь с собственным приглашением.'
  live:
    title: 'Строки по мере их поступления'
    description: 'Учитывая тему живых обновлений, консоль vue добавляет то, что несет каждое сообщение — строку, линию или пакет строк — и следует за концом, если читатель не прокрутил вверх. Здесь кнопка выполняет роль темы, через тот же вызов добавления сообщения.'
