~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

page_title: Content
page_icon: ph:bold/article

intro: "Words, pictures and values, and the rhythm between them. What these pages have in common is that they format something a person reads, rather than arranging regions or listing records."

page:
  composition:
    title: Composition
    description: "A page of prose as it should read: articles, images with text around them, drop caps, meta bars."
  media:
    title: Media
    description: "Images and embeds held to a shape: aspect ratios, overlays, and the placeholder that stands in while nothing has loaded."
  dates:
    title: Dates
    description: "One vocabulary of formats understood identically by Twig and by the browser, and dates that keep themselves true as the page is left open."
  console:
    title: Console
    description: "What a shell printed, read back in the page, and lines added as they come."
  timeline:
    title: Timeline
    description: "Steps or events one under the other on markers joined by a line, each holding whatever it needs."
