  page_title: Dates
  page_icon: 'ph:bold/clock'
  intro: "Un vocabulaire de noms de formats, compris de manière identique par Twig, par JavaScript pur et par Vue. Le serveur imprime un <time> portant l'instant et le format demandé ; le navigateur le récupère et le réécrit au fur et à mesure qu'il vieillit, de sorte qu'une page laissée ouverte ne mente jamais sur le temps écoulé depuis qu'un événement s'est produit."
  section:
    formats:
      title: 'Formats nommés'
      description: "Les formats absolus sont des styles de date et d'heure ICU, donc l'ordre des champs et les séparateurs appartiennent à la locale du lecteur plutôt qu'au modèle."
    relative:
      title: Relatif
      description: "La distance est comptée dans la plus grande unité qui a encore un sens — minutes jusqu'à une heure, heures jusqu'à un jour, puis jours, semaines, mois et années. Chaque formulation provient d'une clé de traduction."
    auto:
      title: Automatique
      description: 'La valeur par défaut. Compte à rebours tant que la date est récente, et revient à une date calendaire après une semaine, où "il y a 27 semaines" cesse d''aider qui que ce soit.'
    live:
