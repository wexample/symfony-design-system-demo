hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: तारीखें
  page_icon: 'ph:bold/घड़ी'
  intro: 'फॉर्मेट नामों का एक शब्दावली, जिसे Twig, सामान्य JavaScript और Vue द्वारा समान रूप से समझा जाता है। सर्वर एक <time> प्रिंट करता है जो उस क्षण और फॉर्मेट को दर्शाता है जिसके लिए इसे पूछा गया था; ब्राउज़र इसे उठाता है और जैसे-जैसे यह पुराना होता है, इसे फिर से लिखता है, इसलिए एक खुला पृष्ठ कभी यह नहीं कहता कि कुछ कितनी देर पहले हुआ।'
  section:
    formats:
      title: 'नामित फॉर्मेट'
      description: 'पूर्ण फॉर्मेट ICU तिथि और समय शैलियों हैं, इसलिए फ़ील्ड का क्रम और विभाजक पाठक की स्थानीयता से संबंधित होते हैं न कि टेम्पलेट से।'
