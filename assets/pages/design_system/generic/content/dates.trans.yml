  page_icon: 'ph:bold/clock'
  intro: 'Sebuah kosakata nama format, dipahami secara identik oleh Twig, oleh JavaScript biasa dan oleh Vue. Server mencetak sebuah <time> yang membawa momen dan format yang diminta; browser mengambilnya dan menulis ulang seiring bertambahnya usia, sehingga halaman yang ditinggalkan terbuka tidak pernah berbohong tentang berapa lama sesuatu terjadi.'
  section:
    formats:
      title: 'Format yang dinamai'
