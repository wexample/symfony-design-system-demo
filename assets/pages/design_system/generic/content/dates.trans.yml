    auto:
      title: स्वचालित
      description: 'डिफ़ॉल्ट। जब तिथि हाल की होती है तो पीछे की ओर गिनता है, और एक सप्ताह के बाद कैलेंडर तिथि पर वापस चला जाता है, जहाँ "27 सप्ताह पहले" किसी की मदद नहीं करता।'
    live:
