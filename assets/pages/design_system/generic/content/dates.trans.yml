      description: 'Un seul minuteur sert chaque date sur la page, au rythme que l''unité affichée mérite — quelques secondes pour "juste maintenant", une heure pour "il y a 3 mois". Laissez cette page ouverte et regardez.'
    plain:
      title: 'Texte uniquement'
      description: "Le filtre renvoie une chaîne sans balisage, pour un attribut de titre ou une exportation. Un nom de format qu'il ne connaît pas est pris comme un motif ICU brut, ce qui est la solution lorsque les formats nommés n'ont pas la forme dont vous avez besoin."
