en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Dates
  page_icon: ph:bold/clock

  intro: "One vocabulary of format names, understood identically by Twig, by plain JavaScript and by Vue. The server prints a <time> carrying the instant and the format it was asked for; the browser picks it up and rewrites it as it ages, so a page left open never lies about how long ago something happened."

  section:
    formats:
      title: Named formats
      description: Absolute formats are ICU date and time styles, so the field order and the separators belong to the reader's locale rather than to the template.
    relative:
      title: Relative
      description: The distance is counted in the largest unit that still says something — minutes up to an hour, hours up to a day, then days, weeks, months and years. Every wording comes from a translation key.
    auto:
      title: Auto
      description: The default. Counts backwards while the date is recent, and falls back to a calendar date past a week, where "27 weeks ago" stops helping anyone.
    live:
      title: Kept up to date
      description: A single timer serves every date on the page, at the cadence the displayed unit deserves — a few seconds for "just now", an hour for "3 months ago". Leave this page open and watch.
    plain:
      title: Text only
      description: The filter returns a string with no markup, for a title attribute or an export. A format name it does not know is taken as a raw ICU pattern, which is the way out when the named formats do not have the shape you need.

  offset:
    now: A moment ago
    minutes: Five minutes
    hours: Three hours
    days: Two days
    months: Four months
    years: Three years
    future: In two hours

  live:
    server: Rendered by Twig, refreshed by the front service:
    vue: Rendered by Vue:

  plain:
    filter: "| date_format('date_long')"
    pattern: "| date_format(\"EEEE d MMMM, 'week' w\")"

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: التواريخ
  page_icon: 'ph:bold/clock'
  intro: 'مفردات لأسماء التنسيقات، مفهومة بشكل متطابق من قبل Twig وJavaScript العادية وVue. يقوم الخادم بطباعة <time> يحمل اللحظة والتنسيق المطلوب؛ يلتقطه المتصفح ويعيد كتابته مع تقدم الوقت، لذا فإن الصفحة التي تظل مفتوحة لا تكذب أبداً حول مدة حدوث شيء ما.'
  section:
    formats:
      title: 'التنسيقات المسماة'
      description: 'التنسيقات المطلقة هي أنماط التاريخ والوقت من ICU، لذا فإن ترتيب الحقول والفواصل تنتمي إلى لغة القارئ بدلاً من القالب.'
    relative:
      title: نسبي
      description: 'تُحسب المسافة بأكبر وحدة لا تزال تعبر عن شيء — الدقائق حتى ساعة، الساعات حتى يوم، ثم الأيام، والأسابيع، والأشهر، والسنوات. تأتي كل عبارة من مفتاح ترجمة.'
    auto:
      title: تلقائي
      description: 'الإعداد الافتراضي. يعد تنازلياً بينما يكون التاريخ حديثًا، ويتراجع إلى تاريخ تقويمي بعد أسبوع، حيث "منذ 27 أسبوعًا" لا تفيد أي شخص.'
    live:
      title: محدثة
      description: 'يخدم مؤقت واحد كل تاريخ على الصفحة، بالوتيرة التي تستحقها الوحدة المعروضة — بضع ثوانٍ لـ"الآن"، وساعة لـ"منذ 3 أشهر". اترك هذه الصفحة مفتوحة وشاهد.'
    plain:
      title: 'نص فقط'
      description: 'تُرجع الفلتر سلسلة نصية بلا تنسيق، لخاصية العنوان أو للتصدير. يتم أخذ اسم تنسيق لا يعرفه كنمط ICU خام، وهو طريق للخروج عندما لا تمتلك التنسيقات المسماة الشكل الذي تحتاجه.'
  offset:
    now: 'منذ لحظة'
    minutes: 'خمس دقائق'
    hours: 'ثلاث ساعات'
    days: يومان
    months: 'أربعة أشهر'
    years: 'ثلاث سنوات'
    future: 'في غضون ساعتين'
  live:
    server: 'مقدم بواسطة Twig، مُحدث بواسطة الخدمة الأمامية:'
    vue: 'مقدم بواسطة Vue:'
  plain:
    filter: "| date_format('date_long')"
    pattern: '| date_format("EEEE d MMMM, ''week'' w")'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: তারিখ
  page_icon: 'ph:bold/clock'
  intro: 'ফরম্যাট নামের একটি শব্দভাণ্ডার, যা Twig, সাধারণ JavaScript এবং Vue দ্বারা একইভাবে বোঝা যায়। সার্ভার একটি <time> মুদ্রণ করে যা মুহূর্ত এবং যে ফরম্যাটের জন্য এটি জিজ্ঞাসা করা হয় সেটি বহন করে; ব্রাউজার এটি গ্রহণ করে এবং এটি পুরনো হলে পুনরায় লেখে, তাই একটি পৃষ্ঠা খোলা রেখে কখনোই কিছু ঘটার সময় সম্পর্কে মিথ্যা বলে না।'
  section:
    formats:
      title: 'নামকৃত ফরম্যাট'
      description: 'অবশ্যই ফরম্যাটগুলি ICU তারিখ এবং সময় শৈলী, তাই ক্ষেত্রের অর্ডার এবং বিভাজকগুলির স্থানীয়তার উপর ভিত্তি করে, টেম্পলেটের পরিবর্তে।'
    relative:
      title: আপেক্ষিক
      description: 'দূরত্ব সবচেয়ে বড় একক দ্বারা গণনা করা হয় যা এখনও কিছু বলে — মিনিট এক ঘণ্টা পর্যন্ত, ঘণ্টা এক দিন পর্যন্ত, তারপর দিন, সপ্তাহ, মাস এবং বছর। প্রতিটি শব্দ একটি অনুবাদ কী থেকে এসেছে।'
    auto:
      title: স্বয়ংক্রিয়
      description: 'ডিফল্ট। তারিখটি সাম্প্রতিক থাকলে পিছনে গণনা করে, এবং এক সপ্তাহের পরে একটি ক্যালেন্ডার তারিখে ফিরে আসে, যেখানে "27 সপ্তাহ আগে" কারো জন্য সাহায্য করা বন্ধ করে।'
    live:
      title: 'আপডেট রাখা'
      description: 'একটি একক টাইমার পৃষ্ঠায় প্রতিটি তারিখের জন্য কাজ করে, প্রদর্শিত এককের প্রাপ্যতার মধ্যে — "এখনই" জন্য কয়েক সেকেন্ড, "৩ মাস আগে" জন্য এক ঘণ্টা। এই পৃষ্ঠা খোলা রেখে দেখুন।'
    plain:
      title: 'শুধুমাত্র টেক্সট'
      description: 'ফিল্টারটি কোন মার্কআপ ছাড়া একটি স্ট্রিং ফেরত দেয়, একটি শিরোনাম বৈশিষ্ট্য বা একটি রপ্তানির জন্য। একটি ফরম্যাট নাম এটি জানে না তা একটি কাঁচা ICU প্যাটার্ন হিসেবে গ্রহণ করা হয়, যা নামকৃত ফরম্যাটগুলি আপনার প্রয়োজনীয় আকার না হলে বেরিয়ে আসার উপায়।'
  offset:
    now: 'এক মিনিট আগে'
    minutes: 'পাঁচ মিনিট'
    hours: 'তিন ঘণ্টা'
    days: 'দুই দিন'
    months: 'চার মাস'
    years: 'তিন বছর'
    future: 'দুটি ঘণ্টা পর'
  live:
    server: 'Twig দ্বারা রেন্ডার করা, সামনের পরিষেবা দ্বারা রিফ্রেশ করা:'
    vue: 'Vue দ্বারা রেন্ডার করা:'
  plain:
    filter: "| date_format('date_long')"
    pattern: '| date_format("EEEE d MMMM, ''সপ্তাহ'' w")'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Daten
  page_icon: 'ph:bold/clock'
  intro: 'Ein Vokabular von Formatnamen, das von Twig, von einfachem JavaScript und von Vue identisch verstanden wird. Der Server gibt ein <time> aus, das den Zeitpunkt und das angeforderte Format trägt; der Browser nimmt es auf und schreibt es um, während es älter wird, sodass eine offene Seite nie lügt, wie lange etwas her ist.'
  section:
    formats:
      title: 'Benannte Formate'
      description: 'Absolute Formate sind ICU-Daten- und Zeitstile, sodass die Feldreihenfolge und die Trennzeichen zur Sprache des Lesers gehören und nicht zur Vorlage.'
    relative:
      title: Relativ
      description: 'Die Distanz wird in der größten Einheit gezählt, die noch etwas aussagt – Minuten bis zu einer Stunde, Stunden bis zu einem Tag, dann Tage, Wochen, Monate und Jahre. Jede Formulierung stammt aus einem Übersetzungsschlüssel.'
    auto:
      title: Automatisch
      description: 'Der Standard. Zählt rückwärts, solange das Datum aktuell ist, und wechselt nach einer Woche zu einem Kalenderdatum, wo "vor 27 Wochen" niemandem mehr hilft.'
    live:
      title: 'Immer aktuell'
      description: 'Ein einzelner Timer bedient jedes Datum auf der Seite, in dem Rhythmus, den die angezeigte Einheit verdient – ein paar Sekunden für "gerade jetzt", eine Stunde für "vor 3 Monaten". Lassen Sie diese Seite offen und beobachten Sie.'
    plain:
      title: 'Nur Text'
      description: 'Der Filter gibt einen String ohne Markup zurück, für ein Titelattribut oder einen Export. Ein Formatnamen, den er nicht kennt, wird als rohes ICU-Muster genommen, was der Ausweg ist, wenn die benannten Formate nicht die Form haben, die Sie benötigen.'
  offset:
    now: 'Vor einem Moment'
    minutes: 'Fünf Minuten'
    hours: 'Drei Stunden'
    days: 'Zwei Tage'
    months: 'Vier Monate'
    years: 'Drei Jahre'
    future: 'In zwei Stunden'
  live:
    server: 'Gerendert von Twig, aktualisiert durch den Front-Service:'
    vue: 'Gerendert von Vue:'
  plain:
    filter: "| date_format('date_long')"
    pattern: '| date_format("EEEE d MMMM, ''Woche'' w")'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Fechas
  page_icon: 'ph:bold/clock'
  intro: 'Un vocabulario de nombres de formato, entendido de manera idéntica por Twig, por JavaScript puro y por Vue. El servidor imprime un <time> que lleva el instante y el formato que se le pidió; el navegador lo recoge y lo reescribe a medida que envejece, así que una página dejada abierta nunca miente sobre cuánto tiempo ha pasado desde que ocurrió algo.'
  section:
    formats:
      title: 'Formatos nombrados'
      description: 'Los formatos absolutos son estilos de fecha y hora de ICU, por lo que el orden de los campos y los separadores pertenecen a la localidad del lector en lugar de al template.'
    relative:
      title: Relativo
      description: 'La distancia se cuenta en la unidad más grande que aún dice algo: minutos hasta una hora, horas hasta un día, luego días, semanas, meses y años. Cada redacción proviene de una clave de traducción.'
    auto:
      title: Automático
      description: 'El predeterminado. Cuenta hacia atrás mientras la fecha es reciente y retrocede a una fecha del calendario después de una semana, donde "hace 27 semanas" deja de ayudar a alguien.'
    live:
      title: Actualizado
      description: 'Un solo temporizador sirve para cada fecha en la página, a la cadencia que la unidad mostrada merece: unos pocos segundos para "justo ahora", una hora para "hace 3 meses". Deja esta página abierta y observa.'
    plain:
      title: 'Solo texto'
      description: 'El filtro devuelve una cadena sin marcado, para un atributo de título o una exportación. Un nombre de formato que no conoce se toma como un patrón ICU en crudo, que es la salida cuando los formatos nombrados no tienen la forma que necesitas.'
  offset:
    now: 'Hace un momento'
    minutes: 'Cinco minutos'
    hours: 'Tres horas'
    days: 'Dos días'
    months: 'Cuatro meses'
    years: 'Tres años'
    future: 'En dos horas'
  live:
    server: 'Renderizado por Twig, actualizado por el servicio frontal:'
    vue: 'Renderizado por Vue:'
  plain:
    filter: "| date_format('date_long')"
    pattern: '| date_format("EEEE d MMMM, ''semana'' w")'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: تاریخ‌ها
  page_icon: 'ph:bold/clock'
  intro: 'یک واژگان از نام‌های فرمت که به طور مشابه توسط Twig، جاوا اسکریپت ساده و Vue درک می‌شود. سرور یک <time> را چاپ می‌کند که لحظه و فرمت درخواست شده را حمل می‌کند؛ مرورگر آن را دریافت کرده و با گذشت زمان بازنویسی می‌کند، بنابراین یک صفحه باز شده هرگز درباره زمان وقوع یک رویداد دروغ نمی‌گوید.'
  section:
    formats:
      title: 'فرمت‌های نام‌دار'
      description: 'فرمت‌های مطلق، سبک‌های تاریخ و زمان ICU هستند، بنابراین ترتیب فیلدها و جداکننده‌ها به محلی که خواننده در آن قرار دارد تعلق دارد نه به الگو.'
    relative:
      title: نسبی
      description: 'فاصله در بزرگ‌ترین واحدی شمرده می‌شود که هنوز معنی دارد — دقیقه‌ها تا یک ساعت، ساعت‌ها تا یک روز، سپس روزها، هفته‌ها، ماه‌ها و سال‌ها. هر واژه‌ای از یک کلید ترجمه می‌آید.'
    auto:
      title: خودکار
      description: 'پیش‌فرض. در حالی که تاریخ جدید است به عقب شماری می‌کند و بعد از یک هفته به یک تاریخ تقویمی باز می‌گردد، جایی که "27 هفته پیش" دیگر به کسی کمکی نمی‌کند.'
    live:
      title: 'به‌روز نگه‌داری شده'
      description: 'یک تایمر واحد برای هر تاریخ در صفحه خدمت می‌کند، با ریتمی که واحد نمایش داده شده شایسته آن است — چند ثانیه برای "همین حالا"، یک ساعت برای "3 ماه پیش". این صفحه را باز بگذارید و تماشا کنید.'
    plain:
      title: 'فقط متن'
      description: 'فیلتر یک رشته بدون نشانه‌گذاری برمی‌گرداند، برای یک ویژگی عنوان یا یک خروجی. نام فرمت که نمی‌شناسد به عنوان یک الگوی خام ICU گرفته می‌شود، که این راه‌حل زمانی است که فرمت‌های نام‌دار شکلی که نیاز دارید را ندارند.'
  offset:
    now: 'لحظه‌ای پیش'
    minutes: 'پنج دقیقه'
    hours: 'سه ساعت'
    days: 'دو روز'
    months: 'چهار ماه'
    years: 'سه سال'
    future: 'در دو ساعت'
  live:
    server: 'توسط Twig رندر شده، توسط سرویس جلو به‌روز شده:'
    vue: 'توسط Vue رندر شده:'
  plain:
    filter: "| date_format('date_long')"
    pattern: '| date_format("EEEE d MMMM, ''week'' w")'

