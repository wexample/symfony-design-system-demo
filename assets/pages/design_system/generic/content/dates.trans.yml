    pattern: '| date_format("EEEE d MMMM, ''semana'' w")'

ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Даты
  page_icon: 'ph:bold/clock'
  intro: 'Один словарь форматов названий, понятный одинаково как для Twig, так и для чистого JavaScript и Vue. Сервер выводит <time>, указывая момент времени и формат, который был запрошен; браузер подбирает его и обновляет по мере старения, так что открытая страница никогда не врет о том, сколько времени прошло с момента события.'
  section:
    formats:
      title: 'Названные форматы'
      description: 'Абсолютные форматы — это стили даты и времени ICU, поэтому порядок полей и разделители зависят от локали читателя, а не от шаблона.'
    relative:
      title: Относительные
      description: 'Расстояние считается в самой крупной единице, которая все еще имеет значение — минуты до часа, часы до дня, затем дни, недели, месяцы и годы. Каждая формулировка берется из ключа перевода.'
    auto:
      title: Авто
      description: 'По умолчанию. Считает назад, пока дата свежая, и переходит на календарную дату после недели, когда "27 недель назад" перестает иметь смысл.'
    live:
      title: Актуально
      description: 'Один таймер обслуживает каждую дату на странице с частотой, соответствующей отображаемой единице — несколько секунд для "только что", час для "3 месяца назад". Оставьте эту страницу открытой и смотрите.'
    plain:
      title: 'Только текст'
      description: 'Фильтр возвращает строку без разметки, для атрибута title или экспорта. Незнакомое название формата принимается за сырой шаблон ICU, что является выходом, когда названные форматы не имеют нужного вам вида.'
  offset:
