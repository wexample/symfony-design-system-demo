~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: المحتوى
page_icon: 'ph:bold/article'
intro: 'كلمات وصور وقيم، والإيقاع بينها. ما تشترك فيه هذه الصفحات هو أنها تنظم شيئًا يقرأه الشخص، بدلاً من ترتيب المناطق أو سرد السجلات.'
page:
  composition:
    title: التكوين
    description: 'صفحة من النثر كما ينبغي أن تُقرأ: مقالات، صور مع نص حولها، أحرف بارزة، أشرطة ميتا.'
  media:
    title: الوسائط
    description: 'صور ومواد مضمنة محجوزة لشكل معين: نسب العرض إلى الارتفاع، تراكبات، والعنصر النائب الذي يظهر أثناء تحميل المحتوى.'
  dates:
    title: التواريخ
    description: 'مفردات من التنسيقات المفهومة بشكل متطابق من قبل Twig والمتصفح، وتواريخ تبقي نفسها صحيحة طالما أن الصفحة مفتوحة.'
  graph_log:
    title: 'سجل الرسم البياني'
    description: 'عناصر على مسارات ملونة مع تفرعاتها واندماجاتها: تاريخ git، أو أي شيء يتفرع.'
  console:
    title: 'وحدة التحكم'
    description: 'ما طبعته وحدة التحكم، يُقرأ مرة أخرى في الصفحة، والأسطر المضافة مع ظهورها.'
  timeline:
    title: 'الجدول الزمني'
    description: 'خطوات أو أحداث واحدة تحت الأخرى على علامات مرتبطة بخط، كل منها يحمل ما يحتاجه.'
