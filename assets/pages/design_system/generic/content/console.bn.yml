~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: কনসোল
page_icon: 'ph:bold/terminal-window'
intro: 'একটি শেলের দ্বারা মুদ্রিত যা পৃষ্ঠায় পড়া হয়: তাদের প্রম্পটের পরে কমান্ডগুলি, তাদের আউটপুট তাদের নীচে, এবং টার্মিনালের রঙগুলি প্যালেটের মতো পড়া হয়, যে কোনও স্কিমে। এটি পড়ে; এটি কমান্ড নেয় না।'
section:
  session:
    title: 'একটি সেশন'
    description: 'চার প্রকারের লাইন — কমান্ড, আউটপুট, ত্রুটি, তথ্য — বা সাধারণ স্ট্রিং। একটি প্রোগ্রাম তার টার্মিনালের জন্য যে পাল Escape কোডগুলি লিখেছিল সেগুলি রঙ এবং ওজন হিসাবে রাখা হয়; টার্মিনালকে যা বলা হয় তার বাকি অংশ বাদ দেওয়া হয়।'
  vue:
    title: ভিউতে
    description: 'একই লাইন, ভিউ টুইন দ্বারা অঙ্কিত, এখানে তার নিজস্ব একটি প্রম্পট সহ।'
  live:
    title: 'লাইনগুলি আসার সাথে সাথে'
    description: 'একটি সরাসরি আপডেট বিষয় দেওয়া হলে, ভিউ কনসোল প্রতিটি বার্তার সাথে যা আছে তা যোগ করে — একটি স্ট্রিং, একটি লাইন, বা লাইনের একটি ব্যাচ — এবং শেষ পর্যন্ত অনুসরণ করে যতক্ষণ না পাঠক উপরে স্ক্রল করেনি। এখানে একটি বোতাম বিষয়ের অংশ পালন করে, একই অ্যাপেন্ডের মাধ্যমে একটি বার্তা ডাকে।'
