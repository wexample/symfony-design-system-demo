article:
  toc:
    label: 'في هذا المقال'
  title: 'فهم رموز التصميم'
  intro: 'رموز التصميم هي المصدر الوحيد للحقيقة للقرارات البصرية عبر المنتج. إنها ترمز إلى اللون، والمسافات، والطباعة، والحركة في متغيرات مسماة تستهلكها المكونات.'
  section_one:
    title: 'لماذا تهم الرموز'
    body_one: 'بدون الرموز، يتطلب تغيير لون العلامة التجارية الأساسية البحث في مئات الملفات. مع الرموز، يتم تحديث متغير واحد في كل مكان - من الأزرار إلى التنبيهات إلى أشرطة التنقل.'
    body_two: 'تربط الرموز أيضًا الفجوة بين أدوات التصميم والكود. يسمي المصمم لونًا <strong>surface-brand</strong> في Figma؛ يستخدم المطور <code>var(--surface-brand)</code> في CSS. يتحدثون نفس اللغة.'
  section_two:
    title: 'أمثلة عملية'
    body: 'افترض مكونًا يحتاج إلى خلفية وحدود ونص. بدلاً من ترميز <code>#1a56db</code> و<code>#e1effe</code> و<code>#1e429f</code>، يشير المكون إلى <code>--color-primary</code> و<code>--surface-primary-subtle</code> و<code>--text-primary-strong</code>. عندما تتطور العلامة التجارية، تتغير اللوحة - المكون لا يتغير.'
  list_title: 'فئات الرموز'
  list:
    - 'اللون - لوحات العلامة التجارية، الدلالية، والحيادية'
    - 'المسافات - مقياس متسق من 2px إلى 64px'
    - 'الطباعة - أحجام الخطوط، والأوزان، وارتفاعات الأسطر'
    - 'نصف القطر - من الزوايا الحادة إلى الدائرية بالكامل'
    - 'الظل - مستويات الارتفاع للعمق والتسلسل الهرمي'
    - 'الحركة - منحنيات التخفيف وخطوات المدة'
  quote: 'أغلب الاقتباسات الموجودة على الإنترنت ربما تم إنشاؤها بواسطة ذكاء اصطناعي.'
  quote_author: 'ألبرت أينشتاين'
  cta: 'اقرأ مرجع الرموز الكامل'
media:
  alt: 'صورة افتراضية بجانب النص'
  caption: 'صورة تشغل ثلث التخطيط.'
  body_one: 'استخدم content--media لوضع صورة ونص جنبًا إلى جنب. تأخذ الصورة ثلث العرض، والنص ثلثين.'
  body_two: 'هذا التخطيط يناسب الاقتباسات الجذابة، والتعريفات المرسومة، أو أي كتلة تحريرية قصيرة حيث تعزز الصورة النص دون أن تهيمن عليه.'
dropcap:
  paragraph_one: 'لوريم إيبسوم دولور سيت أميت، كونسيكتيتور أديبيسكيينغ إليت. سيد دو إيوسمد تيمبور إنسيديدونت يوت لابوري إت دولوري ماغنا أليكوين. أوت إنياد مينيوم فينيام، كويز نوستريد إكسرسيتيشن أولامكو لابوريس نيسي يوت أليكيب إكس إيا كومودو كونسيكوات.'
  paragraph_two: 'دويس أويت إيرور دولور إن ريبريهندير إن فولوبتي فيليت إيس سيلوم دولور يور فاجيت نولا باريتور. إكسسبيتيور سينت أوكاسيكات كويبيدات نون بروفيدنت، سونت إن كولبا كوي أوفيسيا ديسيرت موليتي أنيم إيد إستي لابوروم.'
