~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Ngày tháng'
page_icon: 'ph:bold/clock'
intro: 'Một từ vựng về tên định dạng, được hiểu giống nhau bởi Twig, JavaScript thuần và Vue. Máy chủ in ra một <time> mang theo thời điểm và định dạng mà nó được yêu cầu; trình duyệt nhận và viết lại khi nó cũ đi, vì vậy một trang để mở sẽ không bao giờ nói dối về thời gian đã trôi qua kể từ khi một điều gì đó xảy ra.'
section:
  formats:
    title: 'Định dạng tên'
    description: 'Các định dạng tuyệt đối là kiểu ngày và giờ ICU, vì vậy thứ tự trường và các dấu phân cách thuộc về ngôn ngữ địa phương của người đọc hơn là của mẫu.'
  relative:
    title: 'Tương đối'
    description: 'Khoảng cách được tính bằng đơn vị lớn nhất vẫn có ý nghĩa — phút cho đến một giờ, giờ cho đến một ngày, sau đó là ngày, tuần, tháng và năm. Mỗi cách diễn đạt đều đến từ một khóa dịch.'
  auto:
    title: 'Tự động'
    description: 'Mặc định. Đếm ngược khi ngày tháng còn gần đây, và quay lại một ngày lịch sau một tuần, nơi mà "27 tuần trước" không còn giúp ai nữa.'
  live:
    title: 'Cập nhật thường xuyên'
    description: 'Một bộ đếm thời gian duy nhất phục vụ cho mọi ngày tháng trên trang, theo nhịp độ mà đơn vị được hiển thị xứng đáng — vài giây cho "vừa mới đây", một giờ cho "3 tháng trước". Hãy để trang này mở và quan sát.'
  plain:
    title: 'Chỉ văn bản'
    description: 'Bộ lọc trả về một chuỗi không có định dạng, cho thuộc tính tiêu đề hoặc xuất khẩu. Một tên định dạng mà nó không biết được coi là một mẫu ICU thô, đó là cách thoát khi các định dạng tên không có hình dạng bạn cần.'
offset:
  now: 'Vừa mới đây'
  minutes: 'Năm phút'
  hours: 'Ba giờ'
  days: 'Hai ngày'
  months: 'Bốn tháng'
  years: 'Ba năm'
  future: 'Trong hai giờ'
live:
  server: 'Được tạo ra bởi Twig, làm mới bởi dịch vụ phía trước:'
  vue: 'Được tạo ra bởi Vue:'
plain:
  filter: "| date_format('date_long')"
  pattern: '| date_format("EEEE d MMMM, ''tuần'' w")'
