~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Kaaviopäiväkirja
page_icon: 'ph:bold/git-fork'
intro: 'Alasuhteessa olevat kohteet, uusimmat ensin, piirretty värillisille kaistoille: missä viiva haarautuu, missä kaksi tapaavat jälleen. Jokainen kohde kertoo vanhemmistaan; kaistat seuraavat. Rivin vieressä kaavion kanssa on vapaata — otsikko, viitteet kapseleina, kuka, milloin, lyhyt nimi — joten git-historia on yksi käyttötapa muiden joukossa.'
section:
  history:
    title: Historia
    description: 'Ominaisuushaara yhdistetty takaisin, toinen jätetty auki, tagi julkaisulle. Jokainen kaista säilyttää värinsä alusta loppuun.'
  other:
    title: 'Jotakin muuta kuin git'
    description: 'Dokumentin versiot, yksi niistä tarkastettu sivussa ennen yhdistämistä seuraavaan. Komponentti ei tiedä commit-eista.'
  vue:
    title: 'Vue:ssa'
    description: 'Sama historia vue-puussa, kaistat piirretty jälleen, kun kohteet tulevat päähän.'
  git:
    title: 'Tämän sovelluksen historia'
    description: 'Luetaan repositoriosta symfony-codingin git_graph_items():n kautta, yhteisen lukijan avulla, joka ei koskaan häiritse git:iä.'
