~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Console
page_icon: 'ph:bold/terminal-window'
intro: "Ce qu'un shell a imprimé, à lire sur la page : les commandes après leur invite, leurs sorties en dessous, et les couleurs du terminal lues comme celles de la palette, dans l'un ou l'autre schéma. Cela lit; cela ne prend pas de commandes."
section:
  session:
    title: 'Une session'
    description: "Lignes de quatre types — commande, sortie, erreur, info — ou chaînes simples. Les codes d'échappement qu'un programme a écrits pour son terminal sont conservés en couleur et en poids; le reste de ce qu'un terminal se voit dire est abandonné."
  vue:
    title: 'Dans vue'
    description: 'Les mêmes lignes, dessinées par le jumeau vue, ici avec une invite qui lui est propre.'
  live:
    title: 'Lignes au fur et à mesure'
    description: "Étant donné un sujet de mises à jour en direct, la console vue ajoute ce que chaque message contient — une chaîne, une ligne, ou un lot de lignes — et suit la fin à moins que le lecteur ne soit remonté. Ici un bouton joue le rôle du sujet, à travers le même ajout qu'un message appelle."
