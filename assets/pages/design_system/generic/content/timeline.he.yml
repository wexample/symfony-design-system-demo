~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'ציר זמן'
page_icon: 'ph:bold/list-numbers'
intro: 'דברים זה מתחת לזה, כל אחד על סמן, מחוברים בקו: שלבי הליך, אירועים בהיסטוריה, שלבי ריצה. מה שכל אחד מחזיק הוא חופשי - שורת טקסט, טבלה, טופס - והקו רץ לאורך כל זה, עד לסמן הבא.'
section:
  steps:
    title: 'שלבים בסדר'
    description: 'מסודרים במספרים, עם שלוש המדינות שהסופר מכיר: השלבים מאחור מצוירים מוצקים, זה שנעשה בולט, אלו שלפנינו מחכים.'
  free:
    title: 'כל דבר תחת כותרת'
    description: 'כל פריט מחזיק מה שהוא צריך - תכונות, הודעה, כפתורים. אייקון מחליף את הנקודה, וטון צבעוני את הסמן כמו שהוא צבעוני סמן או בלוק.'
  history:
    title: היסטוריה
    description: 'אין סדר לעקוב אחריו, רק אירועים: נקודות, תאריך מתחת לכל כותרת, וצבע קטגוריה היכן שזה אומר משהו.'
  unknown:
    title: 'שלבים שלא נקבעו עדיין'
    description: 'כמו על הסופר: שלב שתלוי בתשובה שלא ניתנה עדיין אין לו מספר ואינו מזיז את האחרים.'
  hand:
    title: 'נכתב ביד'
    description: 'המרכיב הוא רק אמצעי לכתיבת הצורה מרשימה. אותן הקטגוריות שנכתבו בדף נותנות את אותה ציר זמן, עם כל מה שיש בו.'
  vue:
    title: ב-vue
    description: 'אותו ציר זמן בעץ vue. מה שהענף לוקח כסימון הוא שקע ממוקד שם, כך שמרכיב יכול לעמוד מתחת לכותרת של פריט.'
