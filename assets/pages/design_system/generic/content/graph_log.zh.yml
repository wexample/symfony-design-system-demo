~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 图形日志
page_icon: 'ph:bold/git-fork'
intro: '后代的一系列项目，最新的在前，以彩色通道绘制：分叉的地方，再次相遇的地方。每个项目都显示其父级；通道随之而动。图表旁边显示的内容是免费的——一个标题，像胶囊一样的引用，谁，何时，一个简短的名称——因此，git 历史是在其他用途中之一。'
section:
  history:
    title: 历史
    description: 一个功能分支合并回去，另一个保持开放，一个发布的标签。每条通道保持其从开始到结束的颜色。
  other:
    title: '除了 git 以外的其他'
    description: 文档的版本，其中一个在合并到下一个之前在旁边进行审查。组件对提交一无所知。
  vue:
    title: '在 vue 中'
    description: '在 vue 树中的相同历史，通道在项目进入顶部时再次绘制。'
  git:
    title: 该应用程序的历史
    description: '通过 symfony-coding 的 git_graph_items() 从仓库读取，通过不会干扰 git 的共享读取器。'
history:
  merge_search: 合并搜索分支
  search_filters: 向搜索添加过滤器
  fix_header: 在小屏幕上修复标题
  try_theme: 尝试更暗的主题
  search_index: 索引文档
  release: '发布 2.1.0'
  search_start: 开始搜索
  initial: 第一次提交
versions:
  v4: '版本 4，已应用审查'
  current: 当前
  review: 审查者的更改
  review_ref: 审查
  v3: '版本 3'
  v2: '版本 2'
  v1: '版本 1'
