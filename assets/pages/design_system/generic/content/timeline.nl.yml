~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Tijdlijn
page_icon: 'ph:bold/list-numbers'
intro: 'Dingen onder elkaar, elk op een marker, verbonden door een lijn: de stappen van een procedure, de gebeurtenissen van een geschiedenis, de fasen van een uitvoering. Wat elk bevat is vrij — een regel tekst, een tabel, een formulier — en de lijn loopt naar beneden tot de volgende marker.'
section:
  steps:
    title: 'Stappen in volgorde'
    description: 'Genummerd, met de drie staten die de stapper kent: de stappen achter zijn solide getekend, de stap die wordt uitgevoerd springt eruit, degenen die voor liggen wachten.'
  free:
    title: 'Iets onder een titel'
    description: 'Elk item bevat wat het nodig heeft — eigenschappen, een bericht, knoppen. Een pictogram vervangt de stip, en een toon kleurt de marker zoals het een marker of een blok kleurt.'
  history:
    title: 'Een geschiedenis'
    description: 'Geen volgorde om te volgen, alleen gebeurtenissen: stippen, een datum onder elke titel, en een categorie kleur waar het iets vertelt.'
  unknown:
    title: 'Stappen nog niet besloten'
    description: 'Zoals op de stapper: een stap die afhankelijk is van een nog niet gegeven antwoord krijgt geen nummer en verplaatst geen van de anderen.'
  hand:
    title: 'Met de hand geschreven'
    description: 'De component is slechts een manier om de vorm uit een lijst te schrijven. Dezelfde klassen geschreven op de pagina geven dezelfde tijdlijn, met alles erin.'
  vue:
    title: 'In vue'
    description: 'Dezelfde tijdlijn in een vue-boom. Wat de tak als markup neemt is daar een scoped slot, zodat een component onder de titel van een item kan staan.'
install:
  clone:
    title: 'Haal de bronnen op'
    text: 'Clone de repository en installeer de afhankelijkheden.'
  configure:
    title: Configureren
    text: 'Kopieer de voorbeeldomgeving en vul het databankadres in.'
  migrate:
