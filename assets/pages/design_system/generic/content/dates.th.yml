~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: วันที่
page_icon: 'ph:bold/clock'
intro: 'คำศัพท์ที่เกี่ยวกับรูปแบบวันที่ ซึ่งเข้าใจได้เหมือนกันทั้งใน Twig, JavaScript ปกติ และ Vue. เซิร์ฟเวอร์พิมพ์ <time> ที่บรรจุช่วงเวลาและรูปแบบที่ถูกขอ; เว็บเบราว์เซอร์จะรับมันและเขียนใหม่เมื่อเวลาผ่านไป ดังนั้นหน้าเว็บที่เปิดอยู่จะไม่โกหกว่าเหตุการณ์เกิดขึ้นนานแค่ไหน'
section:
  formats:
    title: รูปแบบที่ตั้งชื่อ
    description: 'รูปแบบแบบสัมบูรณ์คือรูปแบบวันที่และเวลาของ ICU ดังนั้นลำดับของฟิลด์และตัวคั่นจะขึ้นอยู่กับภูมิภาคของผู้อ่านมากกว่าที่จะเป็นของเทมเพลต'
  relative:
    title: สัมพันธ์
    description: 'ระยะทางจะถูกนับในหน่วยที่ใหญ่ที่สุดที่ยังมีความหมาย — นาทีจนถึงชั่วโมง, ชั่วโมงจนถึงวัน, จากนั้นวัน, สัปดาห์, เดือน และปี. คำที่ใช้มาจากคีย์การแปล'
  auto:
    title: อัตโนมัติ
    description: 'ค่าเริ่มต้น. นับย้อนหลังในขณะที่วันที่ยังใกล้เคียง และจะเปลี่ยนเป็นวันที่ตามปฏิทินหลังจากผ่านไปหนึ่งสัปดาห์ ซึ่ง "27 สัปดาห์ที่แล้ว" จะไม่ช่วยใครเลย'
  live:
    title: อัปเดตข้อมูล
    description: 'นาฬิกาเพียงตัวเดียวให้บริการทุกวันที่อยู่บนหน้าเว็บ โดยมีจังหวะที่หน่วยที่แสดงสมควรได้รับ — ไม่กี่วินาทีสำหรับ "เมื่อสักครู่", หนึ่งชั่วโมงสำหรับ "3 เดือนที่แล้ว". เปิดหน้านี้และดู'
  plain:
    title: เฉพาะข้อความ
    description: 'ตัวกรองจะส่งคืนสตริงที่ไม่มีการจัดรูปแบบ สำหรับแอตทริบิวต์ชื่อหรือการส่งออก. ชื่อรูปแบบที่ไม่รู้จักจะถูกนำไปใช้เป็น ICU pattern แบบดิบ ซึ่งเป็นทางออกเมื่อรูปแบบที่ตั้งชื่อไม่มีลักษณะที่คุณต้องการ'
offset:
  now: เมื่อสักครู่
  minutes: ห้านาที
  hours: สามชั่วโมง
  days: สองวัน
  months: สี่เดือน
  years: สามปี
  future: ในอีกสองชั่วโมง
live:
  server: 'เรนเดอร์โดย Twig, อัปเดตโดยบริการด้านหน้า:'
  vue: 'เรนเดอร์โดย Vue:'
plain:
  filter: "| date_format('date_long')"
  pattern: '| date_format("EEEE d MMMM, ''week'' w")'
