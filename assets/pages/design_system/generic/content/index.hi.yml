~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: सामग्री
page_icon: 'ph:bold/article'
intro: 'शब्द, चित्र और मूल्य, और उनके बीच का ताल। इन पृष्ठों में जो समानता है, वह यह है कि ये उस चीज़ को स्वरूपित करते हैं जिसे एक व्यक्ति पढ़ता है, बजाय इसके कि क्षेत्रों को व्यवस्थित करें या रिकॉर्ड को सूचीबद्ध करें।'
page:
  composition:
    title: संरचना
    description: 'एक गद्य का पृष्ठ जैसा कि इसे पढ़ा जाना चाहिए: लेख, उनके चारों ओर पाठ के साथ चित्र, ड्रॉप कैप, मेटा बार।'
  media:
    title: मीडिया
    description: 'आकृतियों में रखे गए चित्र और एम्बेड: पहलू अनुपात, ओवरले, और वह प्लेसहोल्डर जो तब खड़ा होता है जब कुछ लोड नहीं हुआ है।'
  dates:
    title: तारीखें
    description: 'फॉर्मेट्स की एक शब्दावली जिसे Twig और ब्राउज़र दोनों द्वारा समान रूप से समझा जाता है, और तारीखें जो खुद को सच्चा रखती हैं जब पृष्ठ खुला रहता है।'
  graph_log:
    title: 'ग्राफ लॉग'
    description: 'रंगीन लेन पर आइटम उनके फोर्क्स और मर्जेस के साथ: एक गिट इतिहास, या कुछ भी जो शाखा बनाता है।'
  console:
    title: कंसोल
    description: 'जो एक शेल ने प्रिंट किया, वह पृष्ठ में वापस पढ़ा गया, और जब भी लाइनें आती हैं तो जोड़ी जाती हैं।'
  timeline:
    title: कालक्रम
    description: 'चरण या घटनाएँ एक के नीचे एक मार्करों पर एक लाइन से जुड़ी हुई, प्रत्येक अपने लिए आवश्यक चीज़ धारण करती है।'
