  meta_bar:
    title: 'मेटा बार'
    stack_note: 'एक दूसरा बार अलग श्रेणी के मेटाडेटा को समूहित करने के लिए नीचे ढेर हो सकता है — यहाँ, वर्गीकरण और विश्लेषण।'
    action_link_note: 'इंटरैक्टिव आइटम के लिए ऐक्शन-लिंक का उपयोग करें जो बार में मिश्रित होना चाहिए — कोई पृष्ठभूमि नहीं, कोई छाया नहीं, म्यूट रंग।'
image:
  intro: 'content_image() फ़ंक्शन डिफ़ॉल्ट रूप से loading="lazy" के साथ एक img को रेंडर करता है, और जब एक कैप्शन प्रदान किया जाता है तो इसे एक figure तत्व में लपेटता है।'
  simple:
