    alt: 'प्लेसहोल्डर छवि — कोई कैप्शन नहीं'
  captioned:
    label: 'कैप्शन के साथ — figcaption के साथ एक figure में लिपटा हुआ।'
    alt: 'प्लेसहोल्डर छवि — कैप्शन के साथ'
    caption: 'एक figure जिसमें figcaption है — इसका उपयोग स्रोतों को श्रेय देने या दृश्य सामग्री के लिए संदर्भ जोड़ने हेतु करें।'
article:
  toc:
    label: 'इस लेख में'
  title: 'डिज़ाइन टोकन को समझना'
  intro: 'डिज़ाइन टोकन एक उत्पाद के लिए दृश्य निर्णयों का एकल सत्य स्रोत होते हैं। वे रंग, स्पेसिंग, टाइपोग्राफी और गति को नामित परिवर्तनीयों में कोडित करते हैं जो घटक उपभोग करते हैं।'
  section_one:
    title: 'टोकन क्यों महत्वपूर्ण हैं'
    body_one: 'बिना टोकन के, प्राथमिक ब्रांड रंग में बदलाव के लिए सैकड़ों फ़ाइलों में खोजने की आवश्यकता होती है। टोकन के साथ, एक परिवर्तनीय अपडेट हर जगह फैलता है — बटन से लेकर अलर्ट और नेविगेशन बार तक।'
    body_two: 'टोकन डिज़ाइन उपकरणों और कोड के बीच की खाई को भी पाटते हैं। एक डिज़ाइनर Figma में एक रंग को <strong>surface-brand</strong> नाम देता है; एक डेवलपर CSS में <code>var(--surface-brand)</code> का उपयोग करता है। वे एक ही भाषा बोलते हैं।'
  section_two:
    title: 'व्यावहारिक उदाहरण'
    body: 'एक घटक पर विचार करें जिसे एक पृष्ठभूमि, एक सीमा और पाठ की आवश्यकता होती है। <code>#1a56db</code>, <code>#e1effe</code>, और <code>#1e429f</code> को हार्डकोड करने के बजाय, घटक <code>--color-primary</code>, <code>--surface-primary-subtle</code>, और <code>--text-primary-strong</code> का संदर्भ देता है। जब ब्रांड विकसित होता है, तो पैलेट बदलता है — घटक नहीं।'
  list_title: 'टोकन श्रेणियाँ'
  list:
    - 'रंग — ब्रांड, अर्थपूर्ण, और तटस्थ पैलेट'
    - 'स्पेसिंग — 2px से 64px तक एक सुसंगत पैमाना'
    - 'टाइपोग्राफी — फ़ॉन्ट आकार, वजन, और पंक्ति ऊँचाई'
    - 'रेडियस — तीखे कोनों से पूर्ण गोल तक'
    - 'छाया — गहराई और पदानुक्रम के लिए ऊँचाई स्तर'
    - 'गति — कमी वक्र और अवधि चरण'
  quote: 'इंटरनेट पर पाए गए अधिकांश उद्धरण शायद एक AI द्वारा उत्पन्न किए गए थे।'
  quote_author: 'अल्बर्ट आइंस्टीन'
  cta: 'पूर्ण टोकन संदर्भ पढ़ें'
media:
  alt: 'पाठ के साथ प्लेसहोल्डर छवि'
  caption: 'चित्र जो लेआउट का एक तिहाई占 करता है।'
  body_one: 'content--media का उपयोग करें ताकि एक चित्र और पाठ को बगल में रखा जा सके। चित्र चौड़ाई का एक तिहाई लेता है, पाठ दो तिहाई।'
  body_two: 'यह लेआउट खींचे गए उद्धरणों, चित्रित परिभाषाओं, या किसी भी छोटे संपादकीय ब्लॉक के लिए उपयुक्त है जहां चित्र पाठ को समर्थन करता है बिना इसे प्रमुख बनाए।'
