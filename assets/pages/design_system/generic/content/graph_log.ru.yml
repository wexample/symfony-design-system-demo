~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Журнал графа'
page_icon: 'ph:bold/git-fork'
intro: 'Элементы в линии наследования, начиная с новейших, отображаются на цветных дорожках: где линия разветвляется, где две снова встречаются. Каждый элемент указывает своих родителей; дорожки следуют за ними. То, что показывает ряд рядом с графом, свободно — заголовок, ссылки в виде капсул, кто, когда, короткое имя — так что история git является одним из способов использования.'
section:
  history:
    title: История
    description: 'Функциональная ветка, объединенная обратно, другая оставлена открытой, тег на релизе. Каждая дорожка сохраняет свой цвет от начала до конца.'
  other:
    title: 'Что-то кроме git'
    description: 'Версии документа, одна из которых была рассмотрена сбоку перед объединением в следующую. Компонент ничего не знает о коммитах.'
  vue:
    title: 'В vue'
    description: 'Та же история в дереве vue, дорожки снова отображаются по мере поступления элементов в начало.'
  git:
    title: 'История этого приложения'
    description: 'Читается из репозитория с помощью git_graph_items() от symfony-coding, через общий ридер, который никогда не мешает git.'
