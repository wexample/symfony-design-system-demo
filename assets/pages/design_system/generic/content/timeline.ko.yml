~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 타임라인
page_icon: 'ph:bold/list-numbers'
intro: '서로 아래에 있는 것들, 각기 마커에 표시되어 선으로 연결됨: 절차의 단계, 역사적 사건, 실행의 단계. 각 항목이 담고 있는 것은 자유롭습니다 — 텍스트 한 줄, 표, 양식 — 그리고 그 선은 전체를 따라 이어져 다음 마커로 갑니다.'
section:
  steps:
    title: '단계 순서'
    description: '번호가 매겨져 있으며 스텝퍼가 아는 세 가지 상태가 있습니다: 뒤의 단계는 실선으로 그려지고, 현재 진행 중인 단계는 두드러지며, 앞의 단계는 대기합니다.'
  free:
    title: '제목 아래의 모든 것'
    description: '각 항목은 필요한 것을 담고 있습니다 — 속성, 메시지, 버튼. 아이콘이 점을 대신하고, 톤이 마커의 색을 결정합니다.'
  history:
    title: 역사
    description: '따를 순서가 없는 사건들: 점들, 각 제목 아래의 날짜, 그리고 어떤 내용을 전달하는 카테고리 색상.'
  unknown:
    title: '아직 결정되지 않은 단계'
    description: '스텝퍼와 마찬가지로: 아직 주어지지 않은 답변에 따라 달라지는 단계는 번호가 없고 다른 단계에 영향을 미치지 않습니다.'
  hand:
    title: '손으로 작성됨'
    description: '이 컴포넌트는 목록에서 형태를 작성하는 방법일 뿐입니다. 페이지에 작성된 동일한 클래스는 동일한 타임라인을 만들어내며, 그 안에 무엇이든 담을 수 있습니다.'
  vue:
    title: 뷰에서
    description: '뷰 트리에서 동일한 타임라인. 가지가 마크업으로 취하는 것은 그곳에서 스코프 슬롯이 되므로, 컴포넌트는 항목의 제목 아래에 서 있을 수 있습니다.'
install:
  clone:
    title: '소스 가져오기'
    text: '저장소를 복제하고 의존성을 설치하세요.'
  configure:
    title: 구성하기
    text: '예제 환경을 복사하고 데이터베이스 주소를 입력하세요.'
  migrate:
    title: '데이터베이스 생성'
    text: '마이그레이션을 실행하세요; 이것이 진행 중인 단계입니다.'
  deploy:
    title: 배포하기
    text: '자산을 빌드하고 릴리스를 게시하세요.'
