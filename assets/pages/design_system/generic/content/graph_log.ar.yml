~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'سجل الرسم البياني'
page_icon: 'ph:bold/git-fork'
intro: 'عناصر في خط النسب، الأحدث أولاً، مرسومة على مسارات ملونة: حيث يتفرع خط، حيث يلتقي اثنان مرة أخرى. كل عنصر يذكر والديه؛ المسارات تتبع. ما يظهر بجانب الرسم البياني مجاني - عنوان، مراجع ككبسولات، من، متى، اسم قصير - لذا فhistoria git هي واحدة من الاستخدامات بين أخرى.'
section:
  history:
    title: تاريخ
    description: 'فرع مميز تم دمجه مرة أخرى، وآخر ترك مفتوحًا، علامة على إصدار. كل مسار يحتفظ بلونه من حيث يبدأ إلى حيث ينتهي.'
  other:
    title: 'شيء آخر غير git'
    description: 'إصدارات مستند، تم مراجعة أحدها على الجانب قبل دمجه في التالي. المكون لا يعرف شيئًا عن الالتزامات.'
  vue:
    title: 'في vue'
    description: 'نفس التاريخ في شجرة vue، المسارات مرسومة مرة أخرى مع دخول العناصر في المقدمة.'
  git:
    title: 'تاريخ هذا التطبيق'
    description: "يُقرأ من المستودع بواسطة symfony-coding's git_graph_items()، من خلال القارئ المشترك الذي لا يتداخل مع git."
