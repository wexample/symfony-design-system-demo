  alt: 'Immagine segnaposto accanto al testo'
  caption: 'Immagine che occupa un terzo del layout.'
  body_one: "Usa content--media per posizionare un'immagine e del testo affiancati. L'immagine prende un terzo della larghezza, il testo due terzi."
  body_two: "Questo layout si adatta a citazioni selettive, definizioni illustrate o a qualsiasi breve blocco editoriale in cui l'immagine rinforza il testo senza dominarlo."
