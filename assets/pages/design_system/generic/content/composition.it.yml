article:
  toc:
    label: 'In questo articolo'
  title: 'Comprendere i token di design'
  intro: 'I token di design sono la singola fonte di verità per le decisioni visive in un prodotto. Codificano colore, spaziatura, tipografia e movimento in variabili nominate che i componenti utilizzano.'
  section_one:
    title: 'Perché i token sono importanti'
    body_one: 'Senza token, una modifica al colore principale del brand richiede di cercare in centinaia di file. Con i token, un aggiornamento di variabile si propaga ovunque — dai pulsanti agli avvisi alle barre di navigazione.'
    body_two: 'I token colmano anche il divario tra strumenti di design e codice. Un designer nomina un colore <strong>surface-brand</strong> in Figma; un sviluppatore utilizza <code>var(--surface-brand)</code> in CSS. Parlano la stessa lingua.'
  section_two:
    title: 'Esempi pratici'
    body: 'Considera un componente che ha bisogno di uno sfondo, un bordo e testo. Invece di codificare staticamente <code>#1a56db</code>, <code>#e1effe</code>, e <code>#1e429f</code>, il componente fa riferimento a <code>--color-primary</code>, <code>--surface-primary-subtle</code>, e <code>--text-primary-strong</code>. Quando il brand evolve, la palette cambia — il componente no.'
  list_title: 'Categorie di token'
  list:
    - 'Colore — palette di brand, semantiche e neutre'
    - 'Spaziatura — una scala consistente da 2px a 64px'
    - 'Tipografia — dimensioni dei font, pesi e altezze di linea'
    - 'Raggio — dagli angoli netti a quelli completamente arrotondati'
    - 'Ombra — livelli di elevazione per profondità e gerarchia'
    - 'Movimento — curve di easing e passi di durata'
  quote: "La maggior parte delle citazioni trovate su Internet sono probabilmente generate da un'IA."
  quote_author: 'Albert Einstein'
  cta: 'Leggi il riferimento completo ai token'
