~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Chronologie
page_icon: 'ph:bold/list-numbers'
intro: "Des éléments les uns sous les autres, chacun sur un marqueur, reliés par une ligne : les étapes d'une procédure, les événements d'une histoire, les phases d'un parcours. Ce que chaque élément contient est libre — une ligne de texte, un tableau, un formulaire — et la ligne s'étend sur l'ensemble, jusqu'au prochain marqueur."
section:
  steps:
    title: "Étapes dans l'ordre"
    description: 'Numérotées, avec les trois états que connaît le sélecteur : les étapes derrière sont dessinées en solide, celle en cours se distingue, celles à venir attendent.'
  free:
    title: 'Tout sous un titre'
    description: 'Chaque élément contient ce dont il a besoin — propriétés, message, boutons. Une icône remplace le point, et une tonalité colore le marqueur comme elle colore un marqueur ou un bloc.'
  history:
    title: 'Une histoire'
    description: 'Aucun ordre à suivre, seulement des événements : des points, une date sous chaque titre, et une couleur de catégorie où elle raconte quelque chose.'
  unknown:
    title: 'Étapes pas encore décidées'
    description: "Comme sur le sélecteur : une étape qui dépend d'une réponse pas encore donnée ne prend aucun numéro et ne déplace aucune des autres."
  hand:
    title: 'Écrit à la main'
    description: "Le composant est seulement un moyen d'écrire la forme à partir d'une liste. Les mêmes classes écrites sur la page donnent la même chronologie, avec tout ce qui s'y trouve."
  vue:
    title: 'Dans vue'
    description: "La même chronologie dans un arbre vue. Ce que la branche prend comme balisage est un slot scoped là, donc un composant peut se tenir sous le titre d'un élément."
install:
  clone:
    title: 'Obtenir les sources'
    text: 'Clonez le dépôt et installez ses dépendances.'
  configure:
    title: Configurer
    text: "Copiez l'environnement exemple et remplissez l'adresse de la base de données."
  migrate:
    title: 'Créer la base de données'
    text: "Exécutez les migrations ; c'est l'étape en cours."
  deploy:
    title: Déployer
    text: 'Construisez les actifs et publiez la version.'
