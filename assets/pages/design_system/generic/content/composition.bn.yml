article:
  toc:
    label: 'এই প্রবন্ধে'
  title: 'ডিজাইন টোকেন বোঝা'
  intro: 'ডিজাইন টোকেনগুলি একটি পণ্যের ভিজ্যুয়াল সিদ্ধান্তগুলির জন্য একক সত্যের উৎস। তারা রঙ, ফাঁকা, টাইপোগ্রাফি এবং মোশনকে নামকৃত ভেরিয়েবলে এনকোড করে যা উপাদানগুলি গ্রহণ করে।'
  section_one:
    title: 'কেন টোকেন গুরুত্বপূর্ণ'
    body_one: 'টোকেন ছাড়া, প্রাথমিক ব্র্যান্ড রঙ পরিবর্তন করতে শত শত ফাইলের মধ্যে অনুসন্ধান করতে হয়। টোকেনের সাথে, একটি ভেরিয়েবল আপডেট সব জায়গায় ছড়িয়ে পড়ে — বোতাম থেকে সতর্কতা পর্যন্ত নেভিগেশন বারগুলি।'
    body_two: 'টোকেনগুলি ডিজাইন টুল এবং কোডের মধ্যে ব্যবধানও সেতুবন্ধন করে। একটি ডিজাইনার Figma-তে একটি রঙ নামকরণ করে <strong>surface-brand</strong>; একটি ডেভেলপার CSS-তে <code>var(--surface-brand)</code> ব্যবহার করে। তারা একই ভাষায় কথা বলে।'
  section_two:
    title: 'প্রায়োগিক উদাহরণ'
    body: 'একটি উপাদান মনে করুন যা একটি ব্যাকগ্রাউন্ড, একটি সীমানা এবং টেক্সট প্রয়োজন। <code>#1a56db</code>, <code>#e1effe</code>, এবং <code>#1e429f</code> হার্ডকোড করার পরিবর্তে, উপাদানটি <code>--color-primary</code>, <code>--surface-primary-subtle</code>, এবং <code>--text-primary-strong</code> উল্লেখ করে। যখন ব্র্যান্ড বিকাশ হয়, তখন প্যালেট পরিবর্তিত হয় — উপাদানটি নয়।'
  list_title: 'টোকেনের শ্রেণী'
  list:
    - 'রঙ — ব্র্যান্ড, সেমান্তিক, এবং নিরপেক্ষ প্যালেট'
    - 'ফাঁকা — 2px থেকে 64px পর্যন্ত একটি সঙ্গতিপূর্ণ স্কেল'
    - 'টাইপোগ্রাফি — ফন্ট সাইজ, ওজন, এবং লাইন উচ্চতা'
    - 'রেডিয়াস — তীক্ষ্ণ কোণ থেকে সম্পূর্ণ গোলাকার'
    - 'ছায়া — গভীরতা এবং হায়ারার্কির জন্য উত্থান স্তর'
    - 'মোশন — easing curves এবং সময়কাল পদক্ষেপ'
  quote: 'ইন্টারনেটে পাওয়া বেশিরভাগ উদ্ধৃতি সম্ভবত একটি AI দ্বারা তৈরি হয়েছে।'
  quote_author: 'আলবার্ট আইনস্টাইন'
  cta: 'পূর্ণ টোকেন রেফারেন্স পড়ুন'
media:
  alt: 'টেক্সটের সাথে প্লেসহোল্ডার ছবি'
  caption: 'ছবি লেআউটের এক তৃতীয়াংশ জুড়ে।'
  body_one: 'ছবি এবং টেক্সটকে একসাথে রাখতে content--media ব্যবহার করুন। ছবিটি প্রস্থের এক তৃতীয়াংশ নেয়, টেক্সট দুই তৃতীয়াংশ।'
  body_two: 'এই লেআউটটি পুল উদ্ধৃতি, চিত্রিত সংজ্ঞা, বা যে কোনও সংক্ষিপ্ত সম্পাদনার ব্লক যেখানে ছবিটি কপি শক্তিশালী করে কিন্তু এটি কর্তৃত্ব করে না।'
