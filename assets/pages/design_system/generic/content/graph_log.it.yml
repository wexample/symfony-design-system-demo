~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Registro grafico'
page_icon: 'ph:bold/git-fork'
intro: 'Elementi in una linea di discendenza, i più recenti per primi, disegnati su corsie colorate: dove una linea si biforca, dove due si incontrano di nuovo. Ogni elemento indica i suoi genitori; le corsie seguono. Ciò che una riga mostra accanto al grafico è libero — un titolo, riferimenti come capsule, chi, quando, un nome breve — quindi una cronologia git è un utilizzo tra gli altri.'
section:
  history:
    title: 'Una storia'
    description: 'Un ramo feature fuso indietro, un altro lasciato aperto, un tag su un rilascio. Ogni corsia mantiene il suo colore da dove inizia a dove finisce.'
  other:
    title: "Qualcos'altro oltre git"
    description: 'Le versioni di un documento, una di esse esaminata di lato prima di essere fusa nella successiva. Il componente non sa nulla sui commit.'
  vue:
    title: 'In vue'
    description: "La stessa storia in un albero vue, le corsie disegnate di nuovo man mano che gli elementi arrivano all'inizio."
  git:
    title: 'La cronologia di questa applicazione'
    description: 'Lettura dal repository tramite git_graph_items() di symfony-coding, attraverso il lettore condiviso che non interferisce mai con git.'
