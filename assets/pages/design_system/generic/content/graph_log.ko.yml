~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: '그래프 로그'
page_icon: 'ph:bold/git-fork'
intro: '각 항목은 조상의 정보를 제공하며, 색깔 있는 선 위에 그려집니다: 선이 갈라지는 지점, 다시 만나는 지점. 그래프 옆에 표시되는 내용은 자유롭게 설정할 수 있습니다 — 제목, 캡슐 형태의 참조, 누가, 언제, 짧은 이름 — 그래서 git 기록은 그 외에도 여러 용도로 사용됩니다.'
section:
  history:
    title: 기록
    description: '기능 브랜치가 병합되고, 또 다른 브랜치는 열려 있으며, 릴리스에 태그가 붙습니다. 각 선은 시작 지점부터 끝 지점까지의 색상을 유지합니다.'
  other:
    title: 'git 외의 다른 것'
    description: '문서의 버전, 그 중 하나는 다음 버전으로 병합되기 전에 측면에서 검토됩니다. 구성 요소는 커밋에 대해 아무것도 알지 못합니다.'
  vue:
    title: Vue에서
    description: 'Vue 트리에서 동일한 기록, 항목이 헤드에 들어올 때 다시 그려진 선들.'
  git:
    title: '이 애플리케이션의 기록'
    description: 'symfony-coding의 git_graph_items()를 통해 저장소에서 읽어들입니다. 공유 리더는 git의 방해가 되지 않습니다.'
