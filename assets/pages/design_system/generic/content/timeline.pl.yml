~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Oś czasu'
page_icon: 'ph:bold/list-numbers'
intro: 'Rzeczy jedna pod drugą, każda na znaczniku, połączone linią: kroki procedury, wydarzenia historii, etapy biegu. Co każdy z nich zawiera jest dowolne — linia tekstu, tabela, formularz — a linia przebiega przez całość, do następnego znacznika.'
section:
  steps:
    title: 'Kroki w kolejności'
    description: 'Numerowane, z trzema stanami, które zna wskaźnik: kroki z tyłu są rysowane na stałe, ten, który jest w trakcie, wyróżnia się, a te z przodu czekają.'
  free:
    title: 'Cokolwiek pod tytułem'
    description: 'Każdy element zawiera to, co potrzebuje — właściwości, wiadomość, przyciski. Ikona zastępuje kropkę, a ton koloruje znacznik tak, jak koloruje znacznik lub blok.'
  history:
    title: Historia
    description: 'Bez porządku do naśladowania, tylko wydarzenia: kropki, data pod każdym tytułem i kolor kategorii, gdzie coś się mówi.'
  unknown:
    title: 'Kroki jeszcze nie ustalone'
    description: 'Jak na wskaźniku: krok, który zależy od odpowiedzi, która jeszcze nie została podana, nie ma numeru i nie przesuwa innych.'
  hand:
    title: 'Napisane ręcznie'
    description: 'Komponent to tylko sposób na zapisanie kształtu z listy. Te same klasy zapisane na stronie dają tę samą oś czasu, z czymkolwiek w niej.'
  vue:
    title: 'W vue'
    description: 'Ta sama oś czasu w drzewie vue. To, co gałązka traktuje jako znacznik, jest tam zakreślonym slotem, więc komponent może stać pod tytułem elementu.'
