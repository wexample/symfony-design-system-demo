~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: บันทึกกราฟ
page_icon: 'ph:bold/git-fork'
intro: 'รายการในสายการสืบทอด เริ่มจากรายการใหม่สุด วาดบนเลนสี: ที่ไหนที่สายแยก, ที่ไหนที่สองสายมาบรรจบกันอีกครั้ง แต่ละรายการบอกถึงพ่อแม่ของมัน; เลนก็ตามไป. สิ่งที่แสดงข้างกราฟเป็นอิสระ — หัวข้อ, อ้างอิงเป็นแคปซูล, ใคร, เมื่อไหร่, ชื่อสั้น — ดังนั้นประวัติ git จึงเป็นการใช้งานหนึ่งในหลายๆ อย่าง.'
section:
  history:
    title: ประวัติ
    description: 'ฟีเจอร์แบรนช์ที่รวมกลับ, อีกอันที่เปิดอยู่, แท็กบนการปล่อย. แต่ละเลนจะรักษาสีจากจุดเริ่มต้นจนถึงจุดสิ้นสุด.'
  other:
    title: 'สิ่งอื่นที่ไม่ใช่ git'
    description: 'เวอร์ชันของเอกสาร, หนึ่งในนั้นได้รับการตรวจสอบด้านข้างก่อนที่จะรวมเข้าสู่เวอร์ชันถัดไป. ส่วนประกอบไม่รู้เรื่องการคอมมิต.'
  vue:
    title: 'ใน vue'
    description: 'ประวัติเดียวกันในต้นไม้ vue, เลนถูกวาดอีกครั้งเมื่อรายการเข้ามาที่หัว.'
  git:
    title: ประวัติของแอปพลิเคชันนี้
    description: 'อ่านจากที่เก็บโดยฟังก์ชัน git_graph_items() ของ symfony-coding, ผ่านผู้อ่านที่แชร์ซึ่งไม่รบกวน git.'
