~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'יומן גרפים'
page_icon: 'ph:bold/git-fork'
intro: 'פריטים בשורת ירושה, החדש ביותר ראשון, מצוירים על מסלולים צבעוניים: היכן שקו מתפצל, היכן ששניים נפגשים שוב. כל פריט מציין את ההורים שלו; המסלולים עוקבים. מה ש-row מציג לצד הגרף הוא חופשי — כותרת, הפניות כמו קפסולות, מי, מתי, שם קצר — כך שהיסטוריית git היא אחת השימושים בין אחרים.'
section:
  history:
    title: היסטוריה
    description: 'ענף תכונה שהתמזג חזרה, אחר שנשאר פתוח, תווית על שחרור. כל מסלול שומר על הצבע שלו מהיכן שהוא מתחיל ועד היכן שהוא נגמר.'
  other:
    title: 'משהו אחר מאשר git'
    description: 'הגרסאות של מסמך, אחת מהן נבדקה בצד לפני שהתמזגה ל следующая. הרכיב לא יודע דבר על מחויבויות.'
  vue:
    title: ב-vue
    description: 'אותה היסטוריה בעץ vue, המסלולים מצוירים שוב כאשר פריטים נכנסים בראש.'
  git:
    title: 'ההיסטוריה של האפליקציה הזו'
    description: "נקרא מהמאגר על ידי symfony-coding's git_graph_items(), דרך הקורא המשותף שמעולם לא מפריע ל-git."
