article:
  toc:
    label: 'Tässä artikkelissa'
  title: 'Ymmärrys design-tokenista'
  intro: 'Design-tokenit ovat visuaalisten päätösten ainoa totuuslähde tuotteessa. Ne koodaa värit, väliin, typografian ja liikkeen nimettyihin muuttujiin, joita komponentit käyttävät.'
  section_one:
    title: 'Miksi tokenit ovat tärkeitä'
    body_one: 'Ilman tokeneita ensisijaisen brändivärin muuttaminen vaatii satojen tiedostojen läpi käymistä. Tokenien avulla yhden muuttujan päivitys leviää kaikkialle — painikkeista hälytyksiin ja navigointipalkkeihin.'
    body_two: 'Tokenit myös ylittävät kuilun suunnittelutyökalujen ja koodin välillä. Suunnittelija nimeää värin <strong>surface-brand</strong> Figma:ssä; kehittäjä käyttää <code>var(--surface-brand)</code> CSS:ssä. He puhuvat samaa kieltä.'
  section_two:
    title: 'Käytännön esimerkit'
    body: 'Kuvittele komponentti, joka tarvitsee taustan, reunan ja tekstiä. Sen sijaan, että kovakoodaisit <code>#1a56db</code>, <code>#e1effe</code> ja <code>#1e429f</code>, komponentti viittaa <code>--color-primary</code>, <code>--surface-primary-subtle</code> ja <code>--text-primary-strong</code>. Kun brändi kehittyy, väripaletti muuttuu — komponentti ei muutu.'
  list_title: Token-kategoriat
  list:
    - 'Väri — brändi-, semanttiset ja neutraalit paletit'
    - 'Väli — johdonmukainen skaala 2px:stä 64px:iin'
    - 'Typografia — fonttikoot, painot ja riviväli'
    - 'Säde — terävistä kulmista täysin pyöreisiin'
    - 'Varjo — korkeus- ja hierarkiatasot'
    - 'Liike — helpotuskäyrät ja keston vaiheet'
  quote: 'Useimmat Internetistä löytyneistä lainauksista on todennäköisesti luonut tekoäly.'
  quote_author: 'Albert Einstein'
  cta: 'Lue koko token-viite'
media:
  alt: 'Paikkakuva tekstin rinnalla'
  caption: 'Kuva, joka vie kolmanneksen asettelusta.'
  body_one: 'Käytä content--mediaa asettaaksesi kuvan ja tekstin vierekkäin. Kuva vie kolmanneksen leveydestä, teksti kaksi kolmannesta.'
  body_two: 'Tämä asettelu sopii lainauksille, havainnollistaville määritelmän esimerkeille tai mihin tahansa lyhyeen toimitukselliseen lohkoon, jossa kuva vahvistaa tekstiä ilman, että se dominoi sitä.'
