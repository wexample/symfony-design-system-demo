en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Console
  page_icon: ph:bold/terminal-window

  intro: "What a shell printed, read back in the page: commands after their prompt, their output under them, and the terminal's colours read as the palette's, in either scheme. It reads; it does not take commands."

  section:
    session:
      title: A session
      description: "Lines of four kinds — command, output, error, info — or plain strings. The escape codes a program wrote for its terminal are kept as colour and weight; the rest of what a terminal is told is dropped."
    vue:
      title: In vue
      description: "The same lines, drawn by the vue twin, here with a prompt of its own."
    live:
      title: Lines as they come
      description: "Given a live updates topic, the vue console adds what each message carries — a string, a line, or a batch of lines — and follows the end unless the reader has scrolled up. Here a button plays the part of the topic, through the same append a message calls."

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'وحدة التحكم'
  page_icon: 'ph:bold/terminal-window'
  intro: 'ما طبعته الصدفة، اقرأه مرة أخرى في الصفحة: الأوامر بعد موجهها، ناتجها تحتها، وألوان الوحدة تُقرأ كلوحة الألوان، في أي نظام. تقرأ؛ لا تأخذ الأوامر.'
  section:
    session:
      title: جلسة
      description: 'خطوط من أربعة أنواع - أمر، ناتج، خطأ، معلومات - أو سلاسل بسيطة. تُحتفظ رموز الهروب التي كتبها برنامج لوحدته كألوان ووزن؛ بقية ما يُقال للوحدة يتم تجاهله.'
    vue:
      title: 'في vue'
      description: 'نفس الخطوط، مرسومة بواسطة التوأم vue، هنا مع موجه خاص به.'
    live:
      title: 'الخطوط كما تأتي'
      description: 'مع موضوع تحديثات حية، تضيف وحدة التحكم vue ما يحمله كل رسالة - سلسلة، خط، أو دفعة من الخطوط - وتتابع النهاية ما لم يكن القارئ قد قام بالتمرير لأعلى. هنا يلعب زر جزء الموضوع، من خلال نفس إضافة الرسالة.'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: কনসোল
  page_icon: 'ph:bold/terminal-window'
  intro: 'একটি শেলের দ্বারা মুদ্রিত যা পৃষ্ঠায় পড়া হয়: তাদের প্রম্পটের পরে কমান্ডগুলি, তাদের আউটপুট তাদের নীচে, এবং টার্মিনালের রঙগুলি প্যালেটের মতো পড়া হয়, যে কোনও স্কিমে। এটি পড়ে; এটি কমান্ড নেয় না।'
  section:
    session:
      title: 'একটি সেশন'
      description: 'চার প্রকারের লাইন — কমান্ড, আউটপুট, ত্রুটি, তথ্য — বা সাধারণ স্ট্রিং। একটি প্রোগ্রাম তার টার্মিনালের জন্য যে পাল Escape কোডগুলি লিখেছিল সেগুলি রঙ এবং ওজন হিসাবে রাখা হয়; টার্মিনালকে যা বলা হয় তার বাকি অংশ বাদ দেওয়া হয়।'
    vue:
      title: ভিউতে
      description: 'একই লাইন, ভিউ টুইন দ্বারা অঙ্কিত, এখানে তার নিজস্ব একটি প্রম্পট সহ।'
    live:
      title: 'লাইনগুলি আসার সাথে সাথে'
      description: 'একটি সরাসরি আপডেট বিষয় দেওয়া হলে, ভিউ কনসোল প্রতিটি বার্তার সাথে যা আছে তা যোগ করে — একটি স্ট্রিং, একটি লাইন, বা লাইনের একটি ব্যাচ — এবং শেষ পর্যন্ত অনুসরণ করে যতক্ষণ না পাঠক উপরে স্ক্রল করেনি। এখানে একটি বোতাম বিষয়ের অংশ পালন করে, একই অ্যাপেন্ডের মাধ্যমে একটি বার্তা ডাকে।'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Konsole
  page_icon: 'ph:bold/terminal-window'
  intro: 'Was eine Shell ausgegeben hat, wird auf der Seite zurückgelesen: Befehle nach ihrem Prompt, ihre Ausgaben darunter, und die Farben des Terminals werden wie die Palette in beiden Schemen gelesen. Es liest; es nimmt keine Befehle entgegen.'
  section:
    session:
      title: 'Eine Sitzung'
      description: 'Zeilen von vier Arten — Befehl, Ausgabe, Fehler, Info — oder einfache Strings. Die Escape-Codes, die ein Programm für sein Terminal geschrieben hat, werden als Farbe und Gewicht beibehalten; der Rest dessen, was einem Terminal mitgeteilt wird, wird verworfen.'
    vue:
      title: 'In vue'
      description: 'Die gleichen Zeilen, gezeichnet vom vue-Zwilling, hier mit einem eigenen Prompt.'
    live:
      title: 'Zeilen, wie sie kommen'
      description: 'Für ein Thema mit Live-Updates fügt die vue-Konsole hinzu, was jede Nachricht trägt — einen String, eine Zeile oder eine Gruppe von Zeilen — und folgt dem Ende, es sei denn, der Leser hat nach oben gescrollt. Hier spielt ein Button die Rolle des Themas, durch das gleiche Anhängen, das eine Nachricht aufruft.'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Consola
  page_icon: 'ph:bold/ventana-terminal'
  intro: 'Lo que una terminal imprimió, leído de nuevo en la página: comandos después de su aviso, su salida debajo de ellos, y los colores de la terminal leídos como la paleta, en cualquier esquema. Lee; no toma comandos.'
  section:
    session:
      title: 'Una sesión'
      description: 'Líneas de cuatro tipos — comando, salida, error, información — o cadenas simples. Los códigos de escape que un programa escribió para su terminal se mantienen como color y peso; el resto de lo que se le dice a una terminal se descarta.'
    vue:
      title: 'En vue'
      description: 'Las mismas líneas, dibujadas por el gemelo vue, aquí con un aviso propio.'
    live:
      title: 'Líneas a medida que llegan'
      description: 'Dado un tema de actualizaciones en vivo, la consola vue agrega lo que cada mensaje lleva — una cadena, una línea, o un lote de líneas — y sigue el final a menos que el lector se haya desplazado hacia arriba. Aquí un botón juega el papel del tema, a través del mismo apéndice que llama a un mensaje.'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: کنسول
  page_icon: 'ph:bold/terminal-window'
  intro: 'آنچه یک شل چاپ کرده است، در صفحه بخوانید: دستورات بعد از نشانه‌گذاری آنها، خروجی آنها در زیرشان و رنگ‌های ترمینال به عنوان پالت، در هر دو طرح. این می‌خواند؛ دستورات را نمی‌گیرد.'
  section:
    session:
      title: 'یک جلسه'
      description: 'خطوط چهار نوع — دستور، خروجی، خطا، اطلاعات — یا رشته‌های ساده. کدهای فرار که یک برنامه برای ترمینال خود نوشته است به عنوان رنگ و وزن نگهداری می‌شوند؛ بقیه آنچه به ترمینال گفته می‌شود، حذف می‌شود.'
    vue:
      title: 'در vue'
      description: 'همین خطوط، که توسط جفت vue ترسیم شده‌اند، اینجا با نشانه‌گذاری خاص خود.'
    live:
      title: 'خطوط به محض ورود'
      description: 'با موضوع به‌روزرسانی زنده، کنسول vue آنچه هر پیام حمل می‌کند — یک رشته، یک خط، یا یک دسته خط — را اضافه کرده و پایان را دنبال می‌کند مگر اینکه خواننده به بالا اسکرول کرده باشد. اینجا یک دکمه نقش موضوع را ایفا می‌کند، از طریق همان الحاق که یک پیام فراخوانی می‌کند.'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Konsoli
  page_icon: 'ph:bold/terminal-window'
  intro: 'Mitä shell tulosti, luetaan takaisin sivulta: komennot niiden kehotteen jälkeen, niiden tuloste niiden alla, ja terminaalin värit luetaan paletin väreinä, kummassakin järjestelmässä. Se lukee; se ei ota komentoja.'
  section:
    session:
      title: Istunto
      description: 'Neljäntyyppisiä rivejä — komento, tuloste, virhe, tieto — tai pelkkiä merkkijonoja. Ohjelman kirjoittamat pakotuskoodit terminaalille säilytetään värinä ja paksuutena; muu, mitä terminaalille sanotaan, hylätään.'
    vue:
      title: 'Vue:ssa'
      description: 'Samat rivit, piirrettyinä vue-kaksosena, täällä omalla kehotteellaan.'
    live:
      title: 'Rivit saapuvat'
      description: 'Kun on aktiivisten päivitysten aihe, vue-konsoli lisää mitä jokainen viesti tuo — merkkijonon, rivin tai joukon rivejä — ja seuraa loppua, ellei lukija ole vierittänyt ylös. Tässä painike toimii aiheen osana, saman lisäyksen kautta, jota viesti kutsuu.'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Console
  page_icon: 'ph:bold/terminal-window'
  intro: "Ce qu'un shell a imprimé, à lire sur la page : les commandes après leur invite, leurs sorties en dessous, et les couleurs du terminal lues comme celles de la palette, dans l'un ou l'autre schéma. Cela lit; cela ne prend pas de commandes."
  section:
    session:
      title: 'Une session'
      description: "Lignes de quatre types — commande, sortie, erreur, info — ou chaînes simples. Les codes d'échappement qu'un programme a écrits pour son terminal sont conservés en couleur et en poids; le reste de ce qu'un terminal se voit dire est abandonné."
    vue:
      title: 'Dans vue'
      description: 'Les mêmes lignes, dessinées par le jumeau vue, ici avec une invite qui lui est propre.'
    live:
      title: 'Lignes au fur et à mesure'
      description: "Étant donné un sujet de mises à jour en direct, la console vue ajoute ce que chaque message contient — une chaîne, une ligne, ou un lot de lignes — et suit la fin à moins que le lecteur ne soit remonté. Ici un bouton joue le rôle du sujet, à travers le même ajout qu'un message appelle."

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: קונסולה
  page_icon: 'ph:bold/terminal-window'
  intro: 'מה שה-shell הדפיס, קרא חזרה בדף: פקודות אחרי ההנחיה שלהן, הפלט שלהן מתחתן, וצבעי הטרמינל נקראים כמו הפלטה, בשני הסכמות. זה קורא; זה לא מקבל פקודות.'
  section:
    session:
      title: מפגש
      description: 'שורות בארבעה סוגים — פקודה, פלט, שגיאה, מידע — או מחרוזות פשוטות. קודי הבריחה שתוכנית כתבה לטרמינל שלה נשמרים כצבע ומשקל; שאר מה שנאמר לטרמינל נופל.'
    vue:
      title: ב-vue
      description: 'אותן שורות, נמשכות על ידי התאום של vue, כאן עם הנחיה משלה.'
    live:
      title: 'שורות כפי שהן מגיעות'
      description: 'בהינתן נושא עדכונים חיים, קונסולת ה-vue מוסיפה מה שכל הודעה נושאת — מחרוזת, שורה, או אוסף של שורות — ועוקבת אחרי הסוף אלא אם הקורא גלל למעלה. כאן כפתור משחק את תפקיד הנושא, דרך הוספה של הודעה.'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: कंसोल
  page_icon: 'ph:bold/terminal-window'
  intro: 'जो एक शेल ने प्रिंट किया, उसे पृष्ठ में वापस पढ़ें: उनके प्रॉम्प्ट के बाद कमांड, उनके नीचे उनका आउटपुट, और टर्मिनल के रंग पैलेट के रूप में, किसी भी योजना में। यह पढ़ता है; यह कमांड नहीं लेता।'
  section:
    session:
      title: 'एक सत्र'
      description: 'चार प्रकार की पंक्तियाँ — कमांड, आउटपुट, त्रुटि, जानकारी — या सामान्य स्ट्रिंग। एक प्रोग्राम ने अपने टर्मिनल के लिए जो एस्केप कोड लिखे हैं, उन्हें रंग और वजन के रूप में रखा जाता है; बाकी जो टर्मिनल को बताया जाता है उसे छोड़ दिया जाता है।'
    vue:
      title: 'व्यू में'
      description: 'समान पंक्तियाँ, vue जुड़वां द्वारा खींची गईं, यहाँ अपने प्रॉम्प्ट के साथ।'
    live:
      title: 'जैसे वे आते हैं'
      description: 'एक लाइव अपडेट विषय दिया गया, vue कंसोल प्रत्येक संदेश में जो कुछ भी है — एक स्ट्रिंग, एक पंक्ति, या कई पंक्तियों का एक बैच — जोड़ता है और अंत का पालन करता है जब तक पाठक ऊपर स्क्रॉल नहीं करता। यहाँ एक बटन विषय की भूमिका निभाता है, उसी संलग्न के माध्यम से जिसे एक संदेश कॉल करता है।'

id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Konsol
  page_icon: 'ph:bold/terminal-window'
  intro: 'Apa yang dicetak oleh shell, dibaca kembali di halaman: perintah setelah prompt mereka, output mereka di bawahnya, dan warna terminal dibaca seperti palet, dalam skema apa pun. Ini membaca; tidak mengambil perintah.'
  section:
    session:
      title: Sesi
      description: 'Baris dari empat jenis — perintah, output, kesalahan, informasi — atau string biasa. Kode escape yang ditulis program untuk terminalnya disimpan sebagai warna dan ketebalan; sisanya dari apa yang diberitahu kepada terminal diabaikan.'
    vue:
      title: 'Dalam vue'
      description: 'Baris yang sama, digambar oleh kembar vue, di sini dengan promptnya sendiri.'
    live:
      title: 'Baris saat mereka datang'
      description: 'Diberikan topik pembaruan langsung, konsol vue menambahkan apa yang dibawa setiap pesan — sebuah string, sebuah baris, atau sekumpulan baris — dan mengikuti akhir kecuali pembaca telah menggulir ke atas. Di sini sebuah tombol berperan sebagai topik, melalui penambahan pesan yang sama.'

it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Console
  page_icon: 'ph:bold/terminal-window'
  intro: 'Ciò che una shell ha stampato, leggi di nuovo nella pagina: comandi dopo il loro prompt, il loro output sotto di essi, e i colori del terminale letti come la palette, in entrambi gli schemi. Legge; non esegue comandi.'
  section:
    session:
      title: 'Una sessione'
      description: 'Righe di quattro tipi — comando, output, errore, informazione — o stringhe semplici. I codici di escape che un programma ha scritto per il suo terminale sono mantenuti come colore e peso; il resto di ciò che viene detto a un terminale viene scartato.'
    vue:
      title: 'In vue'
      description: 'Le stesse righe, disegnate dal gemello vue, qui con un prompt proprio.'
    live:
      title: 'Righe man mano che arrivano'
      description: "Data un argomento di aggiornamenti in tempo reale, la console vue aggiunge ciò che ogni messaggio porta — una stringa, una riga, o un lotto di righe — e segue la fine a meno che il lettore non sia scorrere verso l'alto. Qui un pulsante svolge il ruolo dell'argomento, attraverso lo stesso append che chiama un messaggio."

ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: コンソール
  page_icon: 'ph:bold/terminal-window'
  intro: シェルが出力した内容を、ページで読み返します。プロンプトの後にコマンドがあり、その下に出力があり、ターミナルの色はパレットの色として、いずれかのスキームで読み取られます。これは読み取り専用で、コマンドを受け付けません。
  section:
    session:
      title: セッション
      description: コマンド、出力、エラー、情報の4種類の行、またはプレーンな文字列。プログラムがターミナルのために書いたエスケープコードは、色と太さとして保持され、ターミナルに指示された他の情報は捨てられます。
    vue:
      title: Vueで
      description: 同じ行が、Vueのツインによって描かれ、ここでは独自のプロンプトがあります。
    live:
      title: 受信した行
      description: ライブ更新トピックが与えられると、Vueコンソールは各メッセージが持つ内容—文字列、行、または行のバッチ—を追加し、読者がスクロールアップしていない限り、最後まで追従します。ここでボタンがトピックの役割を果たし、同じアペンドでメッセージを呼び出します。

ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 콘솔
  page_icon: 'ph:bold/terminal-window'
  intro: '셸이 출력한 내용을 읽어보면: 프롬프트 뒤에 있는 명령어와 그 아래에 있는 출력물, 터미널의 색상이 팔레트처럼 표시됩니다. 읽는 기능만 있고, 명령을 수행하지는 않습니다.'
  section:
    session:
      title: 세션
      description: '네 가지 종류의 줄 — 명령, 출력, 오류, 정보 — 또는 일반 문자열. 프로그램이 터미널을 위해 작성한 이스케이프 코드는 색상과 두께로 유지되며, 터미널에 전달된 나머지 내용은 버려집니다.'
    vue:
      title: 뷰에서
      description: '같은 줄이 뷰 쌍둥이에 의해 그려지며, 여기에는 자체 프롬프트가 있습니다.'
    live:
      title: '메시지가 도착하는 대로'
      description: '실시간 업데이트 주제가 주어지면, 뷰 콘솔은 각 메시지가 전달하는 내용을 추가합니다 — 문자열, 한 줄 또는 여러 줄 — 그리고 독자가 위로 스크롤하지 않는 한 끝을 따릅니다. 여기에서 버튼은 주제의 역할을 하며, 동일한 방식으로 메시지를 추가하는 호출을 통해 작동합니다.'

nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Console
  page_icon: 'ph:bold/terminal-window'
  intro: "Wat een shell heeft afgedrukt, wordt teruggelezen op de pagina: commando's na hun prompt, hun uitvoer eronder, en de kleuren van de terminal gelezen als die van het palet, in beide schema's. Het leest; het neemt geen commando's aan."
  section:
    session:
      title: 'Een sessie'
      description: 'Regels van vier soorten — commando, uitvoer, fout, info — of gewone strings. De escape-codes die een programma voor zijn terminal schreef, worden behouden als kleur en gewicht; de rest van wat een terminal wordt verteld, wordt genegeerd.'
    vue:
      title: 'In vue'
      description: 'Dezelfde regels, getekend door de vue-tweeling, hier met een eigen prompt.'
    live:
      title: 'Regels zoals ze komen'
      description: 'Gegeven een onderwerp voor live-updates, voegt de vue-console toe wat elk bericht meebrengt — een string, een regel, of een batch regels — en volgt het einde tenzij de lezer omhoog heeft gescrold. Hier speelt een knop de rol van het onderwerp, via dezelfde toevoeging die een bericht oproept.'

pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Konsola
  page_icon: 'ph:bold/terminal-window'
  intro: 'Co wypisała powłoka, przeczytaj z powrotem na stronie: polecenia po ich znaku zachęty, ich wyniki pod nimi, a kolory terminala odczytywane jak paleta, w dowolnym schemacie. Odczytuje; nie wykonuje poleceń.'
  section:
    session:
      title: Sesja
      description: 'Linie czterech rodzajów — polecenie, wynik, błąd, informacja — lub zwykłe ciągi. Kody ucieczki, które program napisał dla swojego terminala, są zachowywane jako kolor i grubość; reszta, co terminalowi się mówi, jest pomijana.'
    vue:
      title: 'W vue'
      description: 'Te same linie, rysowane przez bliźniaka vue, tutaj z własnym znakiem zachęty.'
    live:
      title: 'Linie, jak przychodzą'
      description: 'Mając temat aktualizacji na żywo, konsola vue dodaje to, co niesie każda wiadomość — ciąg, linia lub partia linii — i śledzi koniec, chyba że czytelnik przewinął w górę. Tutaj przycisk odgrywa rolę tematu, poprzez to samo dodawanie, które wywołuje wiadomość.'

pt_BR:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Console
  page_icon: 'ph:bold/terminal-window'
  intro: 'O que um shell imprimiu, lido de volta na página: comandos após seu prompt, sua saída abaixo deles, e as cores do terminal lidas como as da paleta, em qualquer esquema. Ele lê; não aceita comandos.'
  section:
    session:
      title: 'Uma sessão'
      description: 'Linhas de quatro tipos — comando, saída, erro, informação — ou strings simples. Os códigos de escape que um programa escreveu para seu terminal são mantidos como cor e peso; o restante do que um terminal é informado é descartado.'
    vue:
      title: 'Em vue'
      description: 'As mesmas linhas, desenhadas pelo gêmeo vue, aqui com um prompt próprio.'
    live:
      title: 'Linhas à medida que vêm'
      description: 'Dado um tópico de atualizações ao vivo, o console vue adiciona o que cada mensagem carrega — uma string, uma linha ou um lote de linhas — e segue até o final, a menos que o leitor tenha rolado para cima. Aqui, um botão desempenha o papel do tópico, através da mesma adição que uma mensagem chama.'

ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Консоль
  page_icon: 'ph:bold/terminal-window'
  intro: 'Что напечатала оболочка, читается на странице: команды после их приглашения, их вывод под ними, а цвета терминала читаются как палитра, в любой из схем. Она читает; она не принимает команды.'
  section:
    session:
      title: Сессия
      description: 'Строки четырех типов — команда, вывод, ошибка, информация — или простые строки. escape-коды, которые программа написала для своего терминала, сохраняются как цвет и вес; остальная информация, которую получает терминал, отбрасывается.'
    vue:
      title: 'В vue'
      description: 'Те же строки, нарисованные двойником vue, здесь с собственным приглашением.'
    live:
      title: 'Строки по мере их поступления'
      description: 'Учитывая тему живых обновлений, консоль vue добавляет то, что несет каждое сообщение — строку, линию или пакет строк — и следует за концом, если читатель не прокрутил вверх. Здесь кнопка выполняет роль темы, через тот же вызов добавления сообщения.'

th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: คอนโซล
  page_icon: 'ph:bold/terminal-window'
  intro: 'สิ่งที่เชลล์พิมพ์ออกมา จะถูกอ่านกลับในหน้า: คำสั่งหลังจากสัญลักษณ์ prompt ของมัน, ผลลัพธ์อยู่ใต้คำสั่งนั้น และสีของเทอร์มินัลจะถูกอ่านตามพาเลตต์ในแบบใดแบบหนึ่ง มันอ่านได้; ไม่รับคำสั่ง.'
  section:
    session:
      title: เซสชัน
      description: 'บรรทัดสี่ประเภท — คำสั่ง, ผลลัพธ์, ข้อผิดพลาด, ข้อมูล — หรือสตริงธรรมดา รหัสหลบหนีที่โปรแกรมเขียนไว้สำหรับเทอร์มินัลจะถูกเก็บไว้เป็นสีและน้ำหนัก; สิ่งที่เหลือที่เทอร์มินัลถูกบอกจะถูกละทิ้ง.'
    vue:
      title: 'ใน vue'
      description: 'บรรทัดเดียวกัน, วาดโดยฝาแฝด vue ที่นี่มีสัญลักษณ์ prompt ของตัวเอง.'
    live:
      title: บรรทัดตามที่มาถึง
      description: 'เมื่อมีหัวข้ออัปเดตสด, คอนโซล vue จะเพิ่มสิ่งที่แต่ละข้อความนำมา — สตริง, บรรทัด, หรือกลุ่มบรรทัด — และติดตามจนจบเว้นแต่ผู้อ่านจะเลื่อนขึ้น ที่นี่ปุ่มทำหน้าที่เป็นหัวข้อ, ผ่านการเพิ่มข้อความเดียวกันที่เรียก.'

tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Konsol
  page_icon: 'ph:bold/terminal-window'
  intro: "Bir shell'in yazdığı, sayfada geri okunan: komutlar istemlerinin ardından, çıktıları altında ve terminalin renkleri paletin renkleri olarak, her iki şemada da. Okur; komut almaz."
  section:
    session:
      title: 'Bir oturum'
      description: 'Dört türden satır — komut, çıktı, hata, bilgi — veya düz metinler. Bir programın terminali için yazdığı kaçış kodları, renk ve ağırlık olarak korunur; terminale söylenen diğer her şey atılır.'
    vue:
      title: 'Vue içinde'
      description: 'Aynı satırlar, vue ikizinin çizdiği, burada kendi istemiyle birlikte.'
    live:
      title: 'Gelen satırlar'
      description: 'Canlı güncellemeler konusuyla birlikte, vue konsolu her mesajın taşıdığı şeyi — bir dize, bir satır veya bir grup satır — ekler ve okuyucu yukarı kaydırmadıkça sonunu takip eder. Burada bir buton, aynı eklemenin bir parçası olarak konuyu temsil eder.'

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: کنسول
  page_icon: 'ph:bold/terminal-window'
  intro: 'جو کچھ ایک شیل نے پرنٹ کیا، وہ صفحے پر واپس پڑھیں: کمانڈز اپنے پرامپٹ کے بعد، ان کا آؤٹ پٹ ان کے نیچے، اور ٹرمینل کے رنگوں کو پیلیٹ کے رنگوں کے طور پر پڑھا جاتا ہے، چاہے کسی بھی اسکیم میں۔ یہ پڑھتا ہے؛ یہ کمانڈز نہیں لیتا۔'
  section:
    session:
      title: 'ایک سیشن'
      description: 'چار اقسام کی لائنیں — کمانڈ، آؤٹ پٹ، غلطی، معلومات — یا سادہ سٹرنگز۔ ایک پروگرام کے ذریعہ اس کے ٹرمینل کے لئے لکھی گئی ای سکپ کوڈز رنگ اور وزن کے طور پر رکھی جاتی ہیں؛ جو کچھ بھی ایک ٹرمینل کو بتایا جاتا ہے وہ چھوڑ دیا جاتا ہے۔'
    vue:
      title: 'ویو میں'
      description: 'یہی لائنیں، ویو جڑواں کے ذریعہ کھینچی گئی، یہاں اپنے پرامپٹ کے ساتھ۔'
    live:
      title: 'لائنیں جیسے ہی آتی ہیں'
      description: 'ایک زندہ اپ ڈیٹس موضوع کو دیا گیا، ویو کنسول ہر پیغام کے ساتھ جو کچھ بھی ہوتا ہے — ایک سٹرنگ، ایک لائن، یا لائنوں کا ایک بیچ — کو شامل کرتا ہے اور آخر تک پیروی کرتا ہے جب تک کہ قاری اوپر کی طرف نہ سکرول کرے۔ یہاں ایک بٹن موضوع کا کردار ادا کرتا ہے، اسی طرح ایک پیغام کو کال کرتے ہوئے۔'

vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Bảng điều khiển'
  page_icon: 'ph:bold/terminal-window'
  intro: 'Những gì mà shell in ra, đọc lại trên trang: các lệnh sau dấu nhắc, đầu ra bên dưới chúng, và màu sắc của terminal được đọc như bảng màu, trong bất kỳ sơ đồ nào. Nó chỉ đọc; không thực hiện lệnh.'
  section:
    session:
      title: 'Một phiên'
      description: 'Các dòng thuộc bốn loại — lệnh, đầu ra, lỗi, thông tin — hoặc chuỗi đơn giản. Các mã thoát mà một chương trình viết cho terminal của nó được giữ lại dưới dạng màu sắc và độ đậm; phần còn lại của những gì một terminal được thông báo sẽ bị bỏ qua.'
    vue:
      title: 'Trong vue'
      description: 'Các dòng giống nhau, được vẽ bởi bản sao vue, ở đây với một dấu nhắc riêng.'
    live:
      title: 'Các dòng đến khi chúng xuất hiện'
      description: 'Khi có một chủ đề cập nhật trực tiếp, bảng điều khiển vue sẽ thêm những gì mỗi thông điệp mang lại — một chuỗi, một dòng, hoặc một nhóm dòng — và theo dõi đến cuối trừ khi người đọc đã cuộn lên. Ở đây một nút đóng vai trò như chủ đề, thông qua cùng một cách thêm mà một thông điệp gọi.'

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 控制台
  page_icon: 'ph:bold/terminal-window'
  intro: Shell打印的内容在页面中回读：命令在提示符后面，它们的输出在其下方，终端的颜色按调色板呈现，无论是哪种方案。它读取；它不接受命令。
  section:
    session:
      title: 会话
      description: 四种类型的行——命令、输出、错误、信息——或普通字符串。程序为其终端编写的转义码以颜色和粗细的形式保留；终端被告知的其他内容则被丢弃。
    vue:
      title: 在vue中
      description: 相同的行，由vue双胞胎绘制，这里有自己提示符。
    live:
      title: 实时更新的行
      description: 给定一个实时更新的话题，vue控制台添加每条消息所携带的内容——一个字符串、一行或一批行——并跟随结尾，除非读者向上滚动。这里一个按钮充当话题，通过相同的附加消息调用。
