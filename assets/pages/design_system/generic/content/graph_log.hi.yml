~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'ग्राफ लॉग'
page_icon: 'ph:bold/git-fork'
intro: 'विरासत की एक पंक्ति में आइटम, नवीनतम पहले, रंगीन लेनों पर खींचे गए: जहां एक रेखा विभाजित होती है, जहां दो फिर से मिलते हैं। प्रत्येक आइटम अपने माता-पिता को बताता है; लेनें उनका पालन करती हैं। ग्राफ के बगल में जो एक पंक्ति दिखाती है, वह मुक्त है - एक शीर्षक, कैप्सूल के रूप में संदर्भ, कौन, कब, एक छोटा नाम - इसलिए एक गिट इतिहास अन्य उपयोगों में से एक है।'
section:
  history:
    title: 'एक इतिहास'
    description: 'एक फीचर ब्रांच जो वापस मर्ज की गई, एक अन्य खुली छोड़ दी गई, एक रिलीज पर एक टैग। प्रत्येक लेन अपनी शुरुआत से लेकर अंत तक अपने रंग को बनाए रखती है।'
  other:
    title: 'गिट के अलावा कुछ और'
    description: 'एक दस्तावेज़ के संस्करण, उनमें से एक को अगले में मर्ज किए जाने से पहले किनारे पर समीक्षा की गई। घटक कमिट्स के बारे में कुछ नहीं जानता।'
  vue:
    title: 'व्यू में'
    description: 'व्यू ट्री में वही इतिहास, लेनें फिर से खींची जाती हैं जैसे-जैसे आइटम सिर में आते हैं।'
  git:
    title: 'इस एप्लिकेशन का इतिहास'
    description: 'symfony-coding के git_graph_items() द्वारा रिपॉजिटरी से पढ़ा गया, साझा पाठक के माध्यम से जो गिट के रास्ते में कभी नहीं आता।'
history:
