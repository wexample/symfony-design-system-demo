~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 날짜
page_icon: 'ph:bold/clock'
intro: 'Twig, 일반 JavaScript 및 Vue에서 동일하게 이해되는 형식 이름의 어휘입니다. 서버는 요청된 즉시와 형식을 담은 <time>을 출력하고, 브라우저는 이를 수집하여 시간이 지남에 따라 다시 작성하므로, 열린 페이지는 무언가가 얼마나 오래 전에 발생했는지를 거짓으로 말하지 않습니다.'
section:
  formats:
    title: '명명된 형식'
    description: '절대 형식은 ICU 날짜 및 시간 스타일이므로, 필드 순서와 구분 기호는 템플릿이 아닌 독자의 로케일에 속합니다.'
  relative:
    title: 상대적
    description: '거리는 여전히 의미를 갖는 가장 큰 단위로 계산됩니다 — 분은 한 시간까지, 시간은 하루까지, 그 다음은 일, 주, 월, 연도입니다. 모든 문구는 번역 키에서 나옵니다.'
  auto:
    title: 자동
    description: '기본값입니다. 날짜가 최근일 때는 과거로 계산하고, 일주일이 지나면 달력 날짜로 돌아가며, "27주 전"은 더 이상 도움이 되지 않습니다.'
  live:
    title: '실시간 업데이트'
    description: '단일 타이머가 페이지의 모든 날짜에 서비스를 제공하며, 표시되는 단위에 맞는 주기로 작동합니다 — "방금"은 몇 초, "3개월 전"은 한 시간입니다. 이 페이지를 열어 두고 지켜보세요.'
  plain:
    title: 텍스트만
    description: '필터는 제목 속성이나 내보내기를 위한 마크업 없는 문자열을 반환합니다. 알지 못하는 형식 이름은 원시 ICU 패턴으로 처리되며, 이는 명명된 형식이 필요로 하는 형태가 아닐 때의 해결책입니다.'
offset:
  now: '방금 전'
  minutes: '5분 전'
  hours: '3시간 전'
  days: '2일 전'
  months: '4개월 전'
  years: '3년 전'
  future: '2시간 후'
live:
  server: 'Twig에 의해 렌더링되고, 프론트 서비스에 의해 새로 고쳐짐:'
  vue: 'Vue에 의해 렌더링됨:'
plain:
  filter: "| date_format('date_long')"
  pattern: '| date_format("EEEE d MMMM, ''주'' w")'
