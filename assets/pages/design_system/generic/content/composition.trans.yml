      title: 'Barre méta'
      stack_note: "Une seconde barre peut s'empiler en dessous pour regrouper une catégorie différente de métadonnées — ici, taxonomie et analytique."
      action_link_note: "Utilisez le lien d'action pour les éléments interactifs qui devraient se fondre dans la barre — pas de fond, pas d'ombre, couleur atténuée."
  image:
    intro: 'La fonction content_image() rend une image avec loading="lazy" par défaut, et l''enveloppe dans un élément figure lorsqu''une légende est fournie.'
    simple:
      label: 'Sans légende — une image simple, pleine largeur.'
      alt: 'Image de remplacement — sans légende'
    captioned:
      label: 'Avec légende — enveloppée dans une figure avec une figcaption.'
      alt: 'Image de remplacement — avec légende'
