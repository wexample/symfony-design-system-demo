en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Composition
  page_icon: ph:bold/layout

  section:
    vue:
      title: Vue
      description: "The picture and the code block as vue partials, taking the same options."
    prose:
      title: Prose article
    image:
      title: Images
    media:
      title: Media with text
    dropcap:
      title: Drop cap
    meta_bar:
      title: Meta bar
      stack_note: "A second bar can stack below to group a different category of metadata — here, taxonomy and analytics."
      action_link_note: "Use action-link for interactive items that should blend into the bar — no background, no shadow, muted color."

  image:
    intro: "The content_image() function renders an img with loading=\"lazy\" by default, and wraps it in a figure element when a caption is provided."
    simple:
      label: "Without caption — a plain img, full-width."
      alt: "Placeholder image — no caption"
    captioned:
      label: "With caption — wrapped in a figure with a figcaption."
      alt: "Placeholder image — with caption"
      caption: "A figure with a figcaption — use it to credit sources or add context to visual content."

  article:
    toc:
      label: "In this article"
    title: "Understanding design tokens"
    intro: "Design tokens are the single source of truth for visual decisions across a product. They encode color, spacing, typography, and motion into named variables that components consume."
    section_one:
      title: "Why tokens matter"
      body_one: "Without tokens, a change to the primary brand color requires hunting through hundreds of files. With tokens, one variable update propagates everywhere — from buttons to alerts to navigation bars."
      body_two: "Tokens also bridge the gap between design tools and code. A designer names a color <strong>surface-brand</strong> in Figma; a developer uses <code>var(--surface-brand)</code> in CSS. They speak the same language."
    section_two:
      title: "Practical examples"
      body: "Consider a component that needs a background, a border, and text. Instead of hardcoding <code>#1a56db</code>, <code>#e1effe</code>, and <code>#1e429f</code>, the component references <code>--color-primary</code>, <code>--surface-primary-subtle</code>, and <code>--text-primary-strong</code>. When the brand evolves, the palette changes — the component does not."
    list_title: "Token categories"
    list:
      - "Color — brand, semantic, and neutral palettes"
      - "Spacing — a consistent scale from 2px to 64px"
      - "Typography — font sizes, weights, and line heights"
      - "Radius — from sharp corners to fully rounded"
      - "Shadow — elevation levels for depth and hierarchy"
      - "Motion — easing curves and duration steps"
    quote: "Most of the quotes found on the Internet were probably generated by an AI."
    quote_author: "Albert Einstein"
    cta: "Read the full token reference"

  media:
    alt: "Placeholder image alongside text"
    caption: "Image occupying one third of the layout."
    body_one: "Use content--media to place an image and text side by side. The image takes one third of the width, the text two thirds."
    body_two: "This layout suits pull quotes, illustrated definitions, or any short editorial block where the image reinforces the copy without dominating it."

  dropcap:
    paragraph_one: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat."
    paragraph_two: "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."

  meta:
    author: "Alice Martin"
    date: "July 18, 2026"
    read_time: "4 min read"
    likes: "142 likes"
    category: "UX Design"
    tag: "In progress"
    views: "3 847 views"

  action:
    share: Share

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: تركيب
  page_icon: 'ph:bold/layout'
  section:
    vue:
      title: فيو
      description: 'الصورة وكتلة الكود كجزء من فيو، تأخذ نفس الخيارات.'
    prose:
      title: 'مقال نثري'
    image:
      title: صور
    media:
      title: 'وسائط مع نص'
    dropcap:
      title: 'حرف كبير'
    meta_bar:
      title: 'شريط بيانات'
      stack_note: 'يمكن أن يتجمع شريط ثانٍ أسفل لتجميع فئة مختلفة من البيانات الوصفية - هنا، التصنيف والتحليلات.'
      action_link_note: 'استخدم رابط العمل للعناصر التفاعلية التي يجب أن تندمج في الشريط - بدون خلفية، بدون ظل، لون م muted.'
  image:
    intro: 'تقوم دالة content_image() بعرض صورة مع loading="lazy" بشكل افتراضي، وتغلفها في عنصر figure عند توفر تعليق.'
    simple:
      label: 'بدون تعليق - صورة عادية، بعرض كامل.'
      alt: 'صورة افتراضية - بلا تعليق'
    captioned:
      label: 'مع تعليق - مغلفة في عنصر figure مع figcaption.'
      alt: 'صورة افتراضية - مع تعليق'
      caption: 'شكل مع figcaption - استخدمه لإعطاء الفضل للمصادر أو إضافة سياق للمحتوى المرئي.'
  article:
    toc:
      label: 'في هذا المقال'
    title: 'فهم رموز التصميم'
    intro: 'رموز التصميم هي المصدر الوحيد للحقيقة للقرارات البصرية عبر المنتج. إنها ترمز إلى اللون، والمسافات، والطباعة، والحركة في متغيرات مسماة تستهلكها المكونات.'
    section_one:
      title: 'لماذا تهم الرموز'
      body_one: 'بدون الرموز، يتطلب تغيير لون العلامة التجارية الأساسية البحث في مئات الملفات. مع الرموز، يتم تحديث متغير واحد في كل مكان - من الأزرار إلى التنبيهات إلى أشرطة التنقل.'
      body_two: 'تربط الرموز أيضًا الفجوة بين أدوات التصميم والكود. يسمي المصمم لونًا <strong>surface-brand</strong> في Figma؛ يستخدم المطور <code>var(--surface-brand)</code> في CSS. يتحدثون نفس اللغة.'
    section_two:
      title: 'أمثلة عملية'
      body: 'افترض مكونًا يحتاج إلى خلفية وحدود ونص. بدلاً من ترميز <code>#1a56db</code> و<code>#e1effe</code> و<code>#1e429f</code>، يشير المكون إلى <code>--color-primary</code> و<code>--surface-primary-subtle</code> و<code>--text-primary-strong</code>. عندما تتطور العلامة التجارية، تتغير اللوحة - المكون لا يتغير.'
    list_title: 'فئات الرموز'
    list:
      - 'اللون - لوحات العلامة التجارية، الدلالية، والحيادية'
      - 'المسافات - مقياس متسق من 2px إلى 64px'
      - 'الطباعة - أحجام الخطوط، والأوزان، وارتفاعات الأسطر'
      - 'نصف القطر - من الزوايا الحادة إلى الدائرية بالكامل'
      - 'الظل - مستويات الارتفاع للعمق والتسلسل الهرمي'
      - 'الحركة - منحنيات التخفيف وخطوات المدة'
    quote: 'أغلب الاقتباسات الموجودة على الإنترنت ربما تم إنشاؤها بواسطة ذكاء اصطناعي.'
    quote_author: 'ألبرت أينشتاين'
    cta: 'اقرأ مرجع الرموز الكامل'
  media:
    alt: 'صورة افتراضية بجانب النص'
    caption: 'صورة تشغل ثلث التخطيط.'
    body_one: 'استخدم content--media لوضع صورة ونص جنبًا إلى جنب. تأخذ الصورة ثلث العرض، والنص ثلثين.'
    body_two: 'هذا التخطيط يناسب الاقتباسات الجذابة، والتعريفات المرسومة، أو أي كتلة تحريرية قصيرة حيث تعزز الصورة النص دون أن تهيمن عليه.'
  dropcap:
    paragraph_one: 'لوريم إيبسوم دولور سيت أميت، كونسيكتيتور أديبيسكيينغ إليت. سيد دو إيوسمد تيمبور إنسيديدونت يوت لابوري إت دولوري ماغنا أليكوين. أوت إنياد مينيوم فينيام، كويز نوستريد إكسرسيتيشن أولامكو لابوريس نيسي يوت أليكيب إكس إيا كومودو كونسيكوات.'
    paragraph_two: 'دويس أويت إيرور دولور إن ريبريهندير إن فولوبتي فيليت إيس سيلوم دولور يور فاجيت نولا باريتور. إكسسبيتيور سينت أوكاسيكات كويبيدات نون بروفيدنت، سونت إن كولبا كوي أوفيسيا ديسيرت موليتي أنيم إيد إستي لابوروم.'
  meta:
    author: 'أليس مارتن'
    date: '18 يوليو، 2026'
    read_time: '4 دقائق قراءة'
    likes: '142 إعجاب'
    category: 'تصميم تجربة المستخدم'
    tag: 'قيد التقدم'
    views: '3 847 مشاهدة'
  action:
    share: شارك

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: সংকলন
  page_icon: 'ph:bold/layout'
  section:
    vue:
      title: ভিউ
      description: 'ছবি এবং কোড ব্লক ভিউ পার্সিয়াল হিসাবে, একই অপশন নিয়ে।'
    prose:
      title: প্রবন্ধ
    image:
      title: ছবি
    media:
      title: 'টেক্সট সহ মিডিয়া'
    dropcap:
      title: 'ড্রপ ক্যাপ'
    meta_bar:
      title: 'মেটা বার'
      stack_note: 'একটি দ্বিতীয় বার নিচে স্তূপাকৃত করা যেতে পারে একটি ভিন্ন মেটাডেটার শ্রেণী গোষ্ঠীভুক্ত করতে — এখানে, শ্রেণীবিভাগ এবং বিশ্লেষণ।'
      action_link_note: 'ইন্টারেক্টিভ আইটেমগুলির জন্য অ্যাকশন-লিংক ব্যবহার করুন যা বারটিতে মিশে যেতে হবে — কোন ব্যাকগ্রাউন্ড নেই, কোন ছায়া নেই, ম্লান রঙ।'
  image:
    intro: 'content_image() ফাংশন ডিফল্টভাবে loading="lazy" সহ একটি img তৈরি করে এবং একটি ক্যাপশন দেওয়া হলে এটি একটি figure উপাদানে মোড়ানো হয়।'
    simple:
      label: 'ক্যাপশন ছাড়া — একটি সাধারণ img, সম্পূর্ণ প্রস্থের।'
      alt: 'প্লেসহোল্ডার ছবি — কোন ক্যাপশন নেই'
    captioned:
      label: 'ক্যাপশন সহ — একটি figure এ মোড়ানো যা একটি figcaption নিয়ে।'
      alt: 'প্লেসহোল্ডার ছবি — ক্যাপশন সহ'
      caption: 'একটি figure একটি figcaption সহ — এটি উৎসের ক্রেডিট দিতে বা ভিজ্যুয়াল কন্টেন্টে প্রেক্ষাপট যুক্ত করতে ব্যবহার করুন।'
  article:
    toc:
      label: 'এই প্রবন্ধে'
    title: 'ডিজাইন টোকেন বোঝা'
    intro: 'ডিজাইন টোকেনগুলি একটি পণ্যের ভিজ্যুয়াল সিদ্ধান্তগুলির জন্য একক সত্যের উৎস। তারা রঙ, ফাঁকা, টাইপোগ্রাফি এবং মোশনকে নামকৃত ভেরিয়েবলে এনকোড করে যা উপাদানগুলি গ্রহণ করে।'
    section_one:
      title: 'কেন টোকেন গুরুত্বপূর্ণ'
      body_one: 'টোকেন ছাড়া, প্রাথমিক ব্র্যান্ড রঙ পরিবর্তন করতে শত শত ফাইলের মধ্যে অনুসন্ধান করতে হয়। টোকেনের সাথে, একটি ভেরিয়েবল আপডেট সব জায়গায় ছড়িয়ে পড়ে — বোতাম থেকে সতর্কতা পর্যন্ত নেভিগেশন বারগুলি।'
      body_two: 'টোকেনগুলি ডিজাইন টুল এবং কোডের মধ্যে ব্যবধানও সেতুবন্ধন করে। একটি ডিজাইনার Figma-তে একটি রঙ নামকরণ করে <strong>surface-brand</strong>; একটি ডেভেলপার CSS-তে <code>var(--surface-brand)</code> ব্যবহার করে। তারা একই ভাষায় কথা বলে।'
    section_two:
      title: 'প্রায়োগিক উদাহরণ'
      body: 'একটি উপাদান মনে করুন যা একটি ব্যাকগ্রাউন্ড, একটি সীমানা এবং টেক্সট প্রয়োজন। <code>#1a56db</code>, <code>#e1effe</code>, এবং <code>#1e429f</code> হার্ডকোড করার পরিবর্তে, উপাদানটি <code>--color-primary</code>, <code>--surface-primary-subtle</code>, এবং <code>--text-primary-strong</code> উল্লেখ করে। যখন ব্র্যান্ড বিকাশ হয়, তখন প্যালেট পরিবর্তিত হয় — উপাদানটি নয়।'
    list_title: 'টোকেনের শ্রেণী'
    list:
      - 'রঙ — ব্র্যান্ড, সেমান্তিক, এবং নিরপেক্ষ প্যালেট'
      - 'ফাঁকা — 2px থেকে 64px পর্যন্ত একটি সঙ্গতিপূর্ণ স্কেল'
      - 'টাইপোগ্রাফি — ফন্ট সাইজ, ওজন, এবং লাইন উচ্চতা'
      - 'রেডিয়াস — তীক্ষ্ণ কোণ থেকে সম্পূর্ণ গোলাকার'
      - 'ছায়া — গভীরতা এবং হায়ারার্কির জন্য উত্থান স্তর'
      - 'মোশন — easing curves এবং সময়কাল পদক্ষেপ'
    quote: 'ইন্টারনেটে পাওয়া বেশিরভাগ উদ্ধৃতি সম্ভবত একটি AI দ্বারা তৈরি হয়েছে।'
    quote_author: 'আলবার্ট আইনস্টাইন'
    cta: 'পূর্ণ টোকেন রেফারেন্স পড়ুন'
  media:
    alt: 'টেক্সটের সাথে প্লেসহোল্ডার ছবি'
    caption: 'ছবি লেআউটের এক তৃতীয়াংশ জুড়ে।'
    body_one: 'ছবি এবং টেক্সটকে একসাথে রাখতে content--media ব্যবহার করুন। ছবিটি প্রস্থের এক তৃতীয়াংশ নেয়, টেক্সট দুই তৃতীয়াংশ।'
    body_two: 'এই লেআউটটি পুল উদ্ধৃতি, চিত্রিত সংজ্ঞা, বা যে কোনও সংক্ষিপ্ত সম্পাদনার ব্লক যেখানে ছবিটি কপি শক্তিশালী করে কিন্তু এটি কর্তৃত্ব করে না।'
  dropcap:
    paragraph_one: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.'
    paragraph_two: 'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.'
  meta:
    author: 'অ্যালিস মার্টিন'
    date: 'জুলাই ১৮, ২০২৬'
    read_time: '৪ মিনিটের পড়া'
    likes: '১৪২ লাইক'
    category: 'UX ডিজাইন'
