  article:
    toc:
      label: '이 기사에서'
    title: '디자인 토큰 이해하기'
    intro: '디자인 토큰은 제품 전반의 시각적 결정에 대한 유일한 진실의 원천입니다. 색상, 간격, 타이포그래피 및 모션을 명명된 변수로 인코딩하여 구성 요소가 사용합니다.'
    section_one:
      title: '토큰의 중요성'
      body_one: '토큰이 없으면 기본 브랜드 색상을 변경하려면 수백 개의 파일을 뒤져야 합니다. 토큰이 있으면 하나의 변수 업데이트가 버튼, 알림, 탐색 바 등 모든 곳에 전파됩니다.'
      body_two: '토큰은 디자인 도구와 코드 간의 간극을 메우기도 합니다. 디자이너는 Figma에서 색상을 <strong>surface-brand</strong>로 이름 붙이고, 개발자는 CSS에서 <code>var(--surface-brand)</code>를 사용합니다. 그들은 같은 언어로 소통합니다.'
    section_two:
      title: '실용적인 예시'
      body: '배경, 테두리 및 텍스트가 필요한 구성 요소를 고려해 보세요. <code>#1a56db</code>, <code>#e1effe</code>, <code>#1e429f</code>를 하드코딩하는 대신, 구성 요소는 <code>--color-primary</code>, <code>--surface-primary-subtle</code>, <code>--text-primary-strong</code>를 참조합니다. 브랜드가 발전함에 따라 팔레트가 변경되지만 구성 요소는 변하지 않습니다.'
    list_title: '토큰 카테고리'
    list:
      - '색상 — 브랜드, 의미, 중립 팔레트'
      - '간격 — 2px에서 64px까지 일관된 스케일'
      - '타이포그래피 — 글꼴 크기, 두께 및 줄 높이'
      - '반경 — 날카로운 모서리에서 완전히 둥근 모서리까지'
      - '그림자 — 깊이와 계층을 위한 고도 수준'
      - '모션 — 완화 곡선 및 지속 시간 단계'
    quote: '인터넷에서 발견된 대부분의 인용구는 아마도 AI에 의해 생성되었을 것입니다.'
    quote_author: '알베르트 아인슈타인'
    cta: '전체 토큰 참조 읽기'
  media:
    alt: '텍스트 옆의 플레이스홀더 이미지'
