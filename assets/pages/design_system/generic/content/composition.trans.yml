  article:
    toc:
      label: 'Dans cet article'
    title: 'Comprendre les jetons de design'
    intro: "Les jetons de design sont la seule source de vérité pour les décisions visuelles dans un produit. Ils codifient la couleur, l'espacement, la typographie et le mouvement en variables nommées que les composants consomment."
    section_one:
      title: 'Pourquoi les jetons sont importants'
      body_one: 'Sans jetons, un changement de la couleur de marque principale nécessite de fouiller dans des centaines de fichiers. Avec des jetons, une mise à jour de variable se propage partout — des boutons aux alertes en passant par les barres de navigation.'
      body_two: 'Les jetons comblent également le fossé entre les outils de conception et le code. Un designer nomme une couleur <strong>surface-brand</strong> dans Figma ; un développeur utilise <code>var(--surface-brand)</code> dans CSS. Ils parlent le même langage.'
    section_two:
      title: 'Exemples pratiques'
      body: "Considérez un composant qui a besoin d'un fond, d'une bordure et de texte. Au lieu de coder en dur <code>#1a56db</code>, <code>#e1effe</code>, et <code>#1e429f</code>, le composant fait référence à <code>--color-primary</code>, <code>--surface-primary-subtle</code>, et <code>--text-primary-strong</code>. Lorsque la marque évolue, la palette change — le composant ne change pas."
    list_title: 'Catégories de jetons'
    list:
      - 'Couleur — palettes de marque, sémantiques et neutres'
      - 'Espacement — une échelle cohérente de 2 px à 64 px'
      - 'Typographie — tailles de police, poids, et hauteurs de ligne'
      - 'Rayon — des coins aigus aux coins entièrement arrondis'
      - "Ombre — niveaux d'élévation pour la profondeur et la hiérarchie"
      - "Mouvement — courbes d'adoucissement et étapes de durée"
    quote: 'La plupart des citations trouvées sur Internet ont probablement été générées par une IA.'
    quote_author: 'Albert Einstein'
    cta: 'Lire la référence complète des jetons'
  media:
    alt: 'Image de remplacement à côté du texte'
    caption: 'Image occupant un tiers de la mise en page.'
    body_one: "Utilisez content--media pour placer une image et du texte côte à côte. L'image prend un tiers de la largeur, le texte deux tiers."
    body_two: "Cette mise en page convient aux citations, définitions illustrées, ou tout bloc éditorial court où l'image renforce le texte sans le dominer."
  dropcap:
    paragraph_one: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.'
