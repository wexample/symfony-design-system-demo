id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Komposisi
  page_icon: 'ph:bold/layout'
  section:
    vue:
      title: Vue
      description: 'Gambar dan blok kode sebagai bagian vue, mengambil opsi yang sama.'
    prose:
      title: 'Artikel prosa'
    image:
      title: Gambar
    media:
      title: 'Media dengan teks'
    dropcap:
      title: 'Drop cap'
    meta_bar:
      title: 'Meta bar'
      stack_note: 'Bar kedua dapat ditumpuk di bawah untuk mengelompokkan kategori metadata yang berbeda — di sini, taksonomi dan analitik.'
      action_link_note: 'Gunakan action-link untuk item interaktif yang harus menyatu ke dalam bar — tanpa latar belakang, tanpa bayangan, warna lembut.'
  image:
    intro: 'Fungsi content_image() merender img dengan loading="lazy" secara default, dan membungkusnya dalam elemen figure ketika caption diberikan.'
    simple:
      label: 'Tanpa caption — img biasa, lebar penuh.'
      alt: 'Gambar placeholder — tanpa caption'
    captioned:
      label: 'Dengan caption — dibungkus dalam figure dengan figcaption.'
      alt: 'Gambar placeholder — dengan caption'
      caption: 'Sebuah figure dengan figcaption — gunakan ini untuk memberi kredit kepada sumber atau menambah konteks pada konten visual.'
  article:
    toc:
      label: 'Dalam artikel ini'
    title: 'Memahami token desain'
    intro: 'Token desain adalah sumber kebenaran tunggal untuk keputusan visual di seluruh produk. Mereka mengkodekan warna, jarak, tipografi, dan gerakan ke dalam variabel bernama yang digunakan oleh komponen.'
    section_one:
      title: 'Mengapa token itu penting'
      body_one: 'Tanpa token, perubahan pada warna merek utama memerlukan pencarian melalui ratusan file. Dengan token, satu pembaruan variabel menyebar ke mana-mana — dari tombol hingga peringatan hingga bilah navigasi.'
      body_two: 'Token juga menjembatani kesenjangan antara alat desain dan kode. Seorang desainer menamai warna <strong>surface-brand</strong> di Figma; seorang pengembang menggunakan <code>var(--surface-brand)</code> di CSS. Mereka berbicara dalam bahasa yang sama.'
    section_two:
      title: 'Contoh praktis'
      body: 'Pertimbangkan komponen yang membutuhkan latar belakang, batas, dan teks. Alih-alih mengkodekan <code>#1a56db</code>, <code>#e1effe</code>, dan <code>#1e429f</code>, komponen merujuk pada <code>--color-primary</code>, <code>--surface-primary-subtle</code>, dan <code>--text-primary-strong</code>. Ketika merek berkembang, palet berubah — komponen tidak.'
    list_title: 'Kategori token'
    list:
      - 'Warna — palet merek, semantik, dan netral'
      - 'Jarak — skala konsisten dari 2px hingga 64px'
      - 'Tipografi — ukuran font, berat, dan tinggi garis'
      - 'Radius — dari sudut tajam hingga sepenuhnya bulat'
      - 'Bayangan — tingkat elevasi untuk kedalaman dan hierarki'
      - 'Gerakan — kurva easing dan langkah durasi'
    quote: 'Sebagian besar kutipan yang ditemukan di Internet mungkin dihasilkan oleh AI.'
    quote_author: 'Albert Einstein'
    cta: 'Baca referensi token lengkap'
  media:
    alt: 'Gambar placeholder di samping teks'
    caption: 'Gambar yang mengisi sepertiga dari tata letak.'
    body_one: 'Gunakan content--media untuk menempatkan gambar dan teks berdampingan. Gambar mengambil sepertiga lebar, teks dua pertiga.'
    body_two: 'Tata letak ini cocok untuk kutipan menarik, definisi yang diilustrasikan, atau blok editorial pendek di mana gambar memperkuat salinan tanpa mendominasi.'
  dropcap:
    paragraph_one: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.'
    paragraph_two: 'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.'
  meta:
    author: 'Alice Martin'
    date: '18 Juli 2026'
    read_time: '4 menit dibaca'
    likes: '142 suka'
    category: 'Desain UX'
    tag: 'Sedang dalam proses'
    views: '3 847 tampilan'
  action:
    share: Bagikan

it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Composizione
  page_icon: 'ph:bold/layout'
  section:
    vue:
      title: Vue
      description: "L'immagine e il blocco di codice come parziali vue, con le stesse opzioni."
    prose:
      title: 'Articolo di prosa'
    image:
      title: Immagini
    media:
      title: 'Media con testo'
    dropcap:
      title: 'Iniziale in maiuscolo'
    meta_bar:
      title: 'Barra meta'
      stack_note: 'Una seconda barra può sovrapporsi per raggruppare una categoria diversa di metadati — qui, tassonomia e analisi.'
      action_link_note: 'Usa il link di azione per elementi interattivi che dovrebbero integrarsi nella barra — senza sfondo, senza ombra, colore tenue.'
  image:
    intro: 'La funzione content_image() genera un img con loading="lazy" per impostazione predefinita, e lo racchiude in un elemento figure quando è fornita una didascalia.'
    simple:
      label: "Senza didascalia — un'immagine semplice, a larghezza intera."
      alt: 'Immagine segnaposto — senza didascalia'
    captioned:
      label: 'Con didascalia — racchiusa in una figura con una figcaption.'
      alt: 'Immagine segnaposto — con didascalia'
      caption: 'Una figura con una figcaption — usala per accreditare le fonti o aggiungere contesto ai contenuti visivi.'
  article:
    toc:
      label: 'In questo articolo'
    title: 'Comprendere i token di design'
    intro: 'I token di design sono la singola fonte di verità per le decisioni visive in un prodotto. Codificano colore, spaziatura, tipografia e movimento in variabili nominate che i componenti utilizzano.'
    section_one:
      title: 'Perché i token sono importanti'
      body_one: 'Senza token, una modifica al colore principale del brand richiede di cercare in centinaia di file. Con i token, un aggiornamento di variabile si propaga ovunque — dai pulsanti agli avvisi alle barre di navigazione.'
      body_two: 'I token colmano anche il divario tra strumenti di design e codice. Un designer nomina un colore <strong>surface-brand</strong> in Figma; un sviluppatore utilizza <code>var(--surface-brand)</code> in CSS. Parlano la stessa lingua.'
    section_two:
      title: 'Esempi pratici'
      body: 'Considera un componente che ha bisogno di uno sfondo, un bordo e testo. Invece di codificare staticamente <code>#1a56db</code>, <code>#e1effe</code>, e <code>#1e429f</code>, il componente fa riferimento a <code>--color-primary</code>, <code>--surface-primary-subtle</code>, e <code>--text-primary-strong</code>. Quando il brand evolve, la palette cambia — il componente no.'
    list_title: 'Categorie di token'
    list:
      - 'Colore — palette di brand, semantiche e neutre'
      - 'Spaziatura — una scala consistente da 2px a 64px'
      - 'Tipografia — dimensioni dei font, pesi e altezze di linea'
      - 'Raggio — dagli angoli netti a quelli completamente arrotondati'
      - 'Ombra — livelli di elevazione per profondità e gerarchia'
      - 'Movimento — curve di easing e passi di durata'
    quote: "La maggior parte delle citazioni trovate su Internet sono probabilmente generate da un'IA."
    quote_author: 'Albert Einstein'
    cta: 'Leggi il riferimento completo ai token'
  media:
