  page_title: קומפוזיציה
  page_icon: 'ph:bold/layout'
  section:
    vue:
      title: Vue
      description: 'התמונה וחבילת הקוד כפרטי Vue, עם אותן אפשרויות.'
    prose:
      title: 'מאמר פרוזה'
    image:
      title: תמונות
    media:
      title: 'מדיה עם טקסט'
    dropcap:
      title: 'אות גדולה'
    meta_bar:
      title: 'שורת מטה'
      stack_note: 'שורה שנייה יכולה להיערם מתחת כדי לקבץ קטגוריה שונה של מטה-דאטה — כאן, טקסונומיה ואנליטיקה.'
      action_link_note: 'השתמש בקישור-פעולה עבור פריטים אינטראקטיביים שצריכים להשתלב בשורה — ללא רקע, ללא צל, צבע מעומעם.'
  image:
    intro: 'הפונקציה content_image() מציגה img עם loading="lazy" כברירת מחדל, ומסוגרת אותו בתוך אלמנט figure כאשר מסופק כותר.'
    simple:
      label: 'ללא כותר — img פשוט, ברוחב מלא.'
      alt: 'תמונת placeholder — ללא כותרת'
    captioned:
      label: 'עם כותר — מסודר בתוך figure עם figcaption.'
      alt: 'תמונת placeholder — עם כותרת'
      caption: 'Figure עם figcaption — השתמש בזה כדי לציין מקורות או להוסיף הקשר לתוכן חזותי.'
  article:
    toc:
      label: 'במאמר זה'
    title: 'הבנת טוקנים בעיצוב'
    intro: 'טוקנים בעיצוב הם מקור האמת היחיד עבור החלטות חזותיות ברחבי המוצר. הם מקודדים צבע, ריווח, טיפוגרפיה ותנועה למשתנים עם שמות שצריכים רכיבים.'
    section_one:
      title: 'למה טוקנים חשובים'
      body_one: 'בלי טוקנים, שינוי בצבע המותג הראשי מחייב חיפוש מאות קבצים. עם טוקנים, עדכון משתנה אחד מתפשט לכל מקום — מכפתורים לאזהרות ועד לשורות ניווט.'
      body_two: 'טוקנים גם גשרו את הפער בין כלי עיצוב לקוד. מעצב נותן צבע בשם <strong>surface-brand</strong> ב-Figma; מפתח משתמש ב-<code>var(--surface-brand)</code> ב-CSS. הם מדברים את אותה השפה.'
    section_two:
      title: 'דוגמאות מעשיות'
      body: 'שקול רכיב שצריך רקע, גבול וטקסט. במקום לקודד קשות <code>#1a56db</code>, <code>#e1effe</code>, ו-<code>#1e429f</code>, הרכיב מפנה ל-<code>--color-primary</code>, <code>--surface-primary-subtle</code>, ו-<code>--text-primary-strong</code>. כשהמותג מתפתח, הפלטה משתנה — הרכיב לא משתנה.'
    list_title: 'קטגוריות טוקנים'
    list:
      - 'צבע — פלטות מותג, סמנטיות ונטרליות'
      - 'ריווח — סקלה קבועה מ-2px עד 64px'
      - 'טיפוגרפיה — גדלי גופן, משקלים וגבהים של שורות'
      - 'רדיוס — מפינות חדות ועד מעוגלות לחלוטין'
      - 'צל — רמות Elevation לעומק והיררכיה'
      - 'תנועה — עקומות ריכוך וצעדים של משך'
    quote: 'רוב הציטוטים שנמצאו באינטרנט כנראה נוצרו על ידי AI.'
    quote_author: 'אלברט איינשטין'
    cta: 'קרא את המדריך המלא לטוקנים'
  media:
    alt: 'תמונת placeholder לצד טקסט'
    caption: 'תמונה תופסת שליש מהפריסה.'
    body_one: 'השתמש ב-content--media כדי למקם תמונה וטקסט זה לצד זה. התמונה תופסת שליש מהרחב, הטקסט שני שלישים.'
    body_two: 'פריסה זו מתאימה לציטוטים בולטים, הגדרות מאוירות, או כל בלוק עיתונאי קצר שבו התמונה מחזקת את העתק מבלי לשלוט בו.'
  dropcap:
    paragraph_one: 'לורם איפסום דולור סיט אמט, קונסקטטור אדיפיסינג אליט. סד דוא איווק דיפורמט אינצידידונט אוט לאבור ואת דולור מגנליק. אוט אנימ אד מינימ וניאם, קוויס נוסטרוד אקסרציטציה אולמקו לאבוריס ניסי אוט אליקיפ אקס איא קומודו קונסקט.'
    paragraph_two: "דואיס אוט אירור דולור אין רפרהנדירט אין וולפטאט ולט אסה צ'ילום דולור אוו פוג'אט נולה פירטור. אקספטור סינט אוקיאקט קופידאט נון פרודנט, סונט אין קופלה קוי אופישיה דסרונט מוליט אנימ איד אסס לברום."
  meta:
    author: 'אליס מרטין'
    date: '18 ביולי 2026'
    read_time: '4 דקות קריאה'
    likes: '142 לייקים'
    category: 'עיצוב UX'
    tag: בעבודה
    views: '3,847 צפיות'
  action:
    share: שתף

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: संरचना
  page_icon: 'ph:bold/layout'
  section:
    vue:
      title: व्यू
      description: 'चित्र और कोड ब्लॉक को vue भागों के रूप में, समान विकल्प लेते हुए।'
    prose:
      title: 'प्रोसे लेख'
    image:
      title: छवियाँ
    media:
      title: 'पाठ के साथ मीडिया'
    dropcap:
      title: 'ड्रॉप कैप'
    meta_bar:
      title: 'मेटा बार'
      stack_note: 'एक दूसरा बार अलग श्रेणी के मेटाडेटा को समूहित करने के लिए नीचे ढेर हो सकता है — यहाँ, वर्गीकरण और विश्लेषण।'
      action_link_note: 'इंटरैक्टिव आइटम के लिए ऐक्शन-लिंक का उपयोग करें जो बार में मिश्रित होना चाहिए — कोई पृष्ठभूमि नहीं, कोई छाया नहीं, म्यूट रंग।'
  image:
    intro: 'content_image() फ़ंक्शन डिफ़ॉल्ट रूप से loading="lazy" के साथ एक img को रेंडर करता है, और जब एक कैप्शन प्रदान किया जाता है तो इसे एक figure तत्व में लपेटता है।'
    simple:
      label: 'बिना कैप्शन के — एक साधारण img, पूर्ण चौड़ाई।'
      alt: 'प्लेसहोल्डर छवि — कोई कैप्शन नहीं'
    captioned:
      label: 'कैप्शन के साथ — figcaption के साथ एक figure में लिपटा हुआ।'
      alt: 'प्लेसहोल्डर छवि — कैप्शन के साथ'
      caption: 'एक figure जिसमें figcaption है — इसका उपयोग स्रोतों को श्रेय देने या दृश्य सामग्री के लिए संदर्भ जोड़ने हेतु करें।'
  article:
    toc:
      label: 'इस लेख में'
    title: 'डिज़ाइन टोकन को समझना'
    intro: 'डिज़ाइन टोकन एक उत्पाद के लिए दृश्य निर्णयों का एकल सत्य स्रोत होते हैं। वे रंग, स्पेसिंग, टाइपोग्राफी और गति को नामित परिवर्तनीयों में कोडित करते हैं जो घटक उपभोग करते हैं।'
    section_one:
      title: 'टोकन क्यों महत्वपूर्ण हैं'
      body_one: 'बिना टोकन के, प्राथमिक ब्रांड रंग में बदलाव के लिए सैकड़ों फ़ाइलों में खोजने की आवश्यकता होती है। टोकन के साथ, एक परिवर्तनीय अपडेट हर जगह फैलता है — बटन से लेकर अलर्ट और नेविगेशन बार तक।'
      body_two: 'टोकन डिज़ाइन उपकरणों और कोड के बीच की खाई को भी पाटते हैं। एक डिज़ाइनर Figma में एक रंग को <strong>surface-brand</strong> नाम देता है; एक डेवलपर CSS में <code>var(--surface-brand)</code> का उपयोग करता है। वे एक ही भाषा बोलते हैं।'
    section_two:
      title: 'व्यावहारिक उदाहरण'
      body: 'एक घटक पर विचार करें जिसे एक पृष्ठभूमि, एक सीमा और पाठ की आवश्यकता होती है। <code>#1a56db</code>, <code>#e1effe</code>, और <code>#1e429f</code> को हार्डकोड करने के बजाय, घटक <code>--color-primary</code>, <code>--surface-primary-subtle</code>, और <code>--text-primary-strong</code> का संदर्भ देता है। जब ब्रांड विकसित होता है, तो पैलेट बदलता है — घटक नहीं।'
    list_title: 'टोकन श्रेणियाँ'
    list:
      - 'रंग — ब्रांड, अर्थपूर्ण, और तटस्थ पैलेट'
      - 'स्पेसिंग — 2px से 64px तक एक सुसंगत पैमाना'
      - 'टाइपोग्राफी — फ़ॉन्ट आकार, वजन, और पंक्ति ऊँचाई'
      - 'रेडियस — तीखे कोनों से पूर्ण गोल तक'
      - 'छाया — गहराई और पदानुक्रम के लिए ऊँचाई स्तर'
      - 'गति — कमी वक्र और अवधि चरण'
    quote: 'इंटरनेट पर पाए गए अधिकांश उद्धरण शायद एक AI द्वारा उत्पन्न किए गए थे।'
    quote_author: 'अल्बर्ट आइंस्टीन'
    cta: 'पूर्ण टोकन संदर्भ पढ़ें'
  media:
    alt: 'पाठ के साथ प्लेसहोल्डर छवि'
    caption: 'चित्र जो लेआउट का एक तिहाई占 करता है।'
    body_one: 'content--media का उपयोग करें ताकि एक चित्र और पाठ को बगल में रखा जा सके। चित्र चौड़ाई का एक तिहाई लेता है, पाठ दो तिहाई।'
    body_two: 'यह लेआउट खींचे गए उद्धरणों, चित्रित परिभाषाओं, या किसी भी छोटे संपादकीय ब्लॉक के लिए उपयुक्त है जहां चित्र पाठ को समर्थन करता है बिना इसे प्रमुख बनाए।'
  dropcap:
    paragraph_one: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.'
    paragraph_two: 'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.'
  meta:
    author: 'एलिस मार्टिन'
    date: '18 जुलाई, 2026'
    read_time: '4 मिनट पढ़ें'
