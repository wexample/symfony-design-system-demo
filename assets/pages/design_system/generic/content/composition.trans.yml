      stack_note: 'Een tweede balk kan eronder gestapeld worden om een andere categorie metadata te groeperen — hier, taxonomie en analytics.'
      action_link_note: 'Gebruik action-link voor interactieve items die in de balk moeten opgaan — geen achtergrond, geen schaduw, gedempte kleur.'
  image:
    intro: 'De content_image() functie renderen een img met loading="lazy" standaard, en wikkelt het in een figure-element wanneer een bijschrift wordt gegeven.'
    simple:
