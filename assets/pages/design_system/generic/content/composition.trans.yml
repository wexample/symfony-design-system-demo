pt_BR:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Composição
  page_icon: 'ph:bold/layout'
  section:
    vue:
      title: Vue
      description: 'A imagem e o bloco de código como parciais vue, utilizando as mesmas opções.'
    prose:
      title: 'Artigo em prosa'
    image:
      title: Imagens
    media:
      title: 'Mídia com texto'
    dropcap:
      title: 'Inicial em destaque'
    meta_bar:
      title: 'Barra de metadados'
      stack_note: 'Uma segunda barra pode ser empilhada abaixo para agrupar uma categoria diferente de metadados — aqui, taxonomia e análises.'
      action_link_note: 'Use action-link para itens interativos que devem se misturar à barra — sem fundo, sem sombra, cor suave.'
  image:
    intro: 'A função content_image() renderiza uma img com loading="lazy" por padrão, e a envolve em um elemento figure quando uma legenda é fornecida.'
    simple:
      label: 'Sem legenda — uma img simples, em largura total.'
      alt: 'Imagem de exemplo — sem legenda'
    captioned:
      label: 'Com legenda — envolvida em um figure com um figcaption.'
      alt: 'Imagem de exemplo — com legenda'
      caption: 'Um figure com um figcaption — use para creditar fontes ou adicionar contexto ao conteúdo visual.'
  article:
    toc:
      label: 'Neste artigo'
    title: 'Entendendo os tokens de design'
    intro: 'Os tokens de design são a única fonte de verdade para decisões visuais em um produto. Eles codificam cor, espaçamento, tipografia e movimento em variáveis nomeadas que os componentes utilizam.'
    section_one:
      title: 'Por que os tokens são importantes'
      body_one: 'Sem tokens, uma mudança na cor primária da marca exige procurar em centenas de arquivos. Com tokens, uma atualização de variável se propaga em todos os lugares — de botões a alertas a barras de navegação.'
      body_two: 'Os tokens também preenchem a lacuna entre ferramentas de design e código. Um designer nomeia uma cor <strong>surface-brand</strong> no Figma; um desenvolvedor usa <code>var(--surface-brand)</code> no CSS. Eles falam a mesma língua.'
    section_two:
      title: 'Exemplos práticos'
      body: 'Considere um componente que precisa de um fundo, uma borda e texto. Em vez de codificar <code>#1a56db</code>, <code>#e1effe</code>, e <code>#1e429f</code>, o componente referencia <code>--color-primary</code>, <code>--surface-primary-subtle</code>, e <code>--text-primary-strong</code>. Quando a marca evolui, a paleta muda — o componente não.'
    list_title: 'Categorias de tokens'
    list:
      - 'Cor — paletas de marca, semântica e neutra'
      - 'Espaçamento — uma escala consistente de 2px a 64px'
      - 'Tipografia — tamanhos de fonte, pesos e alturas de linha'
      - 'Raio — de cantos agudos a totalmente arredondados'
      - 'Sombra — níveis de elevação para profundidade e hierarquia'
      - 'Movimento — curvas de suavização e etapas de duração'
    quote: 'A maioria das citações encontradas na Internet foram provavelmente geradas por uma IA.'
    quote_author: 'Albert Einstein'
    cta: 'Leia a referência completa de tokens'
  media:
    alt: 'Imagem de exemplo ao lado do texto'
    caption: 'Imagem ocupando um terço do layout.'
    body_one: 'Use content--media para colocar uma imagem e texto lado a lado. A imagem ocupa um terço da largura, o texto dois terços.'
    body_two: 'Esse layout é adequado para citações em destaque, definições ilustradas ou qualquer bloco editorial curto onde a imagem reforça o texto sem dominá-lo.'
  dropcap:
    paragraph_one: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.'
    paragraph_two: 'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.'
  meta:
    author: 'Alice Martin'
    date: '18 de julho de 2026'
    read_time: '4 min de leitura'
    likes: '142 curtidas'
    category: 'Design UX'
    tag: 'Em andamento'
    views: '3 847 visualizações'
  action:
    share: Compartilhar

ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Композиция
  page_icon: 'ph:bold/layout'
  section:
    vue:
      title: Vue
      description: 'Изображение и кодовый блок как частичные компоненты Vue, принимающие одни и те же параметры.'
    prose:
      title: 'Статья в прозе'
    image:
      title: Изображения
    media:
      title: 'Медиа с текстом'
    dropcap:
      title: 'Первый заглавный символ'
    meta_bar:
      title: Метабара
      stack_note: 'Вторую панель можно разместить ниже для группировки другой категории метаданных — здесь, таксономия и аналитика.'
      action_link_note: 'Используйте action-link для интерактивных элементов, которые должны сливаться с панелью — без фона, без теней, приглушенный цвет.'
  image:
    intro: 'Функция content_image() отображает img с loading="lazy" по умолчанию и оборачивает его в элемент figure, когда предоставляется подпись.'
    simple:
      label: 'Без подписи — простой img, на всю ширину.'
      alt: 'Заполнитель изображения — без подписи'
    captioned:
      label: 'С подписью — обернут в figure с figcaption.'
      alt: 'Заполнитель изображения — с подписью'
      caption: 'Фигура с figcaption — используйте её для указания источников или добавления контекста к визуальному контенту.'
  article:
    toc:
      label: 'В этой статье'
    title: 'Понимание токенов дизайна'
    intro: 'Токены дизайна являются единственным источником правды для визуальных решений в продукте. Они кодируют цвет, отступы, типографику и анимацию в именованные переменные, которые потребляют компоненты.'
    section_one:
      title: 'Почему токены важны'
      body_one: 'Без токенов изменение основного брендового цвета требует поиска по сотням файлов. С токенами одно обновление переменной распространяется везде — от кнопок до уведомлений и навигационных панелей.'
      body_two: 'Токены также связывают инструменты дизайна и код. Дизайнер называет цвет <strong>surface-brand</strong> в Figma; разработчик использует <code>var(--surface-brand)</code> в CSS. Они говорят на одном языке.'
    section_two:
      title: 'Практические примеры'
      body: 'Рассмотрим компонент, которому нужен фон, граница и текст. Вместо того чтобы жестко закодировать <code>#1a56db</code>, <code>#e1effe</code> и <code>#1e429f</code>, компонент ссылается на <code>--color-primary</code>, <code>--surface-primary-subtle</code> и <code>--text-primary-strong</code>. Когда бренд развивается, палитра меняется — компонент остается прежним.'
    list_title: 'Категории токенов'
    list:
      - 'Цвет — брендовые, семантические и нейтральные палитры'
      - 'Отступы — единая шкала от 2px до 64px'
      - 'Типографика — размеры шрифтов, начертания и высота строк'
      - 'Радиус — от острых углов до полностью закругленных'
      - 'Тень — уровниElevation для глубины и иерархии'
      - 'Движение — кривые сглаживания и шаги продолжительности'
    quote: 'Большинство цитат, найденных в Интернете, вероятно, были сгенерированы ИИ.'
    quote_author: 'Альберт Эйнштейн'
    cta: 'Читать полный справочник по токенам'
  media:
    alt: 'Заполнитель изображения рядом с текстом'
    caption: 'Изображение, занимающее одну треть макета.'
    body_one: 'Используйте content--media, чтобы разместить изображение и текст рядом. Изображение занимает одну треть ширины, текст — две трети.'
    body_two: 'Этот макет подходит для выноски, иллюстрированных определений или любого короткого редакционного блока, где изображение усиливает текст, не доминируя над ним.'
  dropcap:
    paragraph_one: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.'
    paragraph_two: 'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.'
  meta:
    author: 'Элис Мартин'
    date: '18 июля 2026'
    read_time: '4 минуты чтения'
    likes: '142 лайка'
    category: UX-дизайн
    tag: 'В процессе'
    views: '3 847 просмотров'
  action:
    share: Поделиться

th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: การประกอบ
  page_icon: 'ph:bold/layout'
  section:
    vue:
      title: Vue
      description: 'รูปภาพและโค้ดบล็อกในรูปแบบ vue ที่ใช้ตัวเลือกเดียวกัน.'
    prose:
      title: บทความเชิงบรรยาย
    image:
      title: ภาพ
    media:
      title: สื่อพร้อมข้อความ
    dropcap:
      title: ตัวอักษรนำหน้า
    meta_bar:
      title: แถบเมต้า
      stack_note: 'แถบที่สองสามารถซ้อนอยู่ด้านล่างเพื่อจัดกลุ่มเมตาดาต้าที่แตกต่างกัน — ที่นี่คือหมวดหมู่และการวิเคราะห์.'
      action_link_note: 'ใช้ลิงก์การกระทำสำหรับรายการเชิงโต้ตอบที่ควรเข้ากันกับแถบ — ไม่มีพื้นหลัง ไม่มีเงา สีที่ไม่สดใส.'
  image:
    intro: 'ฟังก์ชัน content_image() จะเรนเดอร์ img พร้อม loading="lazy" โดยค่าเริ่มต้น และห่อหุ้มในองค์ประกอบ figure เมื่อมีคำบรรยายที่ให้มา.'
    simple:
      label: 'ไม่มีคำบรรยาย — img ธรรมดาเต็มความกว้าง.'
      alt: 'ภาพตัวอย่าง — ไม่มีคำบรรยาย'
    captioned:
      label: 'มีคำบรรยาย — ห่อหุ้มใน figure พร้อม figcaption.'
      alt: 'ภาพตัวอย่าง — มีคำบรรยาย'
      caption: 'ฟิกเจอร์พร้อม figcaption — ใช้เพื่อให้เครดิตแหล่งที่มาหรือเพิ่มบริบทให้กับเนื้อหาทางภาพ.'
  article:
    toc:
      label: ในบทความนี้
    title: ความเข้าใจเกี่ยวกับโทเคนการออกแบบ
    intro: 'โทเคนการออกแบบเป็นแหล่งข้อมูลเดียวที่เชื่อถือได้สำหรับการตัดสินใจทางภาพทั้งหมดในผลิตภัณฑ์ พวกเขาเข้ารหัสสี การเว้นระยะ ไทโปกราฟี และการเคลื่อนไหวในตัวแปรที่มีชื่อซึ่งองค์ประกอบต่างๆ ใช้.'
    section_one:
      title: ทำไมโทเคนถึงสำคัญ
      body_one: 'หากไม่มีโทเคน การเปลี่ยนแปลงสีแบรนด์หลักจะต้องค้นหาผ่านไฟล์หลายร้อยไฟล์ แต่เมื่อมีโทเคน การอัปเดตตัวแปรครั้งเดียวจะส่งผลไปทุกที่ — ตั้งแต่ปุ่มไปจนถึงการแจ้งเตือนถึงแถบการนำทาง.'
      body_two: 'โทเคนยังเชื่อมช่องว่างระหว่างเครื่องมือออกแบบและโค้ด นักออกแบบตั้งชื่อสี <strong>surface-brand</strong> ใน Figma; นักพัฒนาจะใช้ <code>var(--surface-brand)</code> ใน CSS พวกเขาพูดภาษาเดียวกัน.'
    section_two:
      title: ตัวอย่างเชิงปฏิบัติ
      body: 'พิจารณาองค์ประกอบที่ต้องการพื้นหลัง ขอบ และข้อความ แทนที่จะเข้ารหัส <code>#1a56db</code>, <code>#e1effe</code>, และ <code>#1e429f</code> แบบตายตัว องค์ประกอบจะอ้างอิง <code>--color-primary</code>, <code>--surface-primary-subtle</code>, และ <code>--text-primary-strong</code>. เมื่อแบรนด์พัฒนาขึ้น พาเลตต์จะเปลี่ยน — องค์ประกอบจะไม่เปลี่ยน.'
    list_title: หมวดหมู่โทเคน
    list:
      - 'สี — แบรนด์ สีเชิงความหมาย และสีที่เป็นกลาง'
      - 'การเว้นระยะ — สเกลที่สม่ำเสมอจาก 2px ถึง 64px'
      - 'ไทโปกราฟี — ขนาดตัวอักษร น้ำหนัก และความสูงของบรรทัด'
      - 'รัศมี — จากมุมแหลมจนถึงมุมมนเต็มที่'
      - 'เงา — ระดับการยกระดับเพื่อความลึกและลำดับชั้น'
      - 'การเคลื่อนไหว — เส้นโค้งการผ่อนคลายและระยะเวลา'
    quote: 'คำพูดส่วนใหญ่ที่พบในอินเทอร์เน็ตอาจถูกสร้างโดย AI.'
    quote_author: 'อัลเบิร์ต ไอน์สไตน์'
    cta: อ่านเอกสารอ้างอิงโทเคนทั้งหมด
  media:
    alt: ภาพตัวอย่างข้างข้อความ
    caption: ภาพที่ใช้พื้นที่หนึ่งในสามของเลย์เอาต์.
    body_one: 'ใช้ content--media เพื่อวางภาพและข้อความเคียงข้างกัน ภาพจะใช้ความกว้างหนึ่งในสาม ข้อความสองในสาม.'
    body_two: 'เลย์เอาต์นี้เหมาะสำหรับคำอ้างที่ดึงดูด คำจำกัดความที่มีภาพประกอบ หรือบล็อกบรรณาธิการสั้น ๆ ที่ภาพช่วยเสริมข้อความโดยไม่ครอบงำมัน.'
  dropcap:
    paragraph_one: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.'
    paragraph_two: 'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.'
  meta:
