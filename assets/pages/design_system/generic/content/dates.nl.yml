~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Data
page_icon: 'ph:bold/clock'
intro: 'Een vocabulaire van formaten die identiek worden begrepen door Twig, door gewone JavaScript en door Vue. De server print een <time> met het moment en het format dat gevraagd is; de browser pakt het op en herschrijft het naarmate het veroudert, zodat een geopende pagina nooit liegt over hoe lang geleden iets gebeurde.'
section:
  formats:
    title: 'Genoemde formaten'
    description: 'Absolute formaten zijn ICU datum- en tijdstijlen, dus de volgorde van velden en de scheidingstekens behoren tot de locale van de lezer in plaats van tot de template.'
  relative:
    title: Relatief
    description: 'De afstand wordt geteld in de grootste eenheid die nog iets zegt — minuten tot een uur, uren tot een dag, daarna dagen, weken, maanden en jaren. Elke formulering komt uit een vertalingssleutel.'
  auto:
    title: Automatisch
    description: 'De standaard. Telt achteruit terwijl de datum recent is, en valt terug op een kalenderdatum na een week, waar "27 weken geleden" niemand meer helpt.'
  live:
    title: 'Altijd up-to-date'
    description: 'Een enkele timer dient elke datum op de pagina, met de cadans die de weergegeven eenheid verdient — een paar seconden voor "net nu", een uur voor "3 maanden geleden". Laat deze pagina open en kijk.'
  plain:
    title: 'Alleen tekst'
    description: 'De filter retourneert een string zonder opmaak, voor een titelattribuut of een export. Een formatnaam die het niet kent, wordt genomen als een ruwe ICU-patroon, wat de uitweg is wanneer de genoemde formaten niet de vorm hebben die je nodig hebt.'
offset:
  now: 'Een moment geleden'
  minutes: 'Vijf minuten'
  hours: 'Drie uur'
  days: 'Twee dagen'
  months: 'Vier maanden'
  years: 'Drie jaar'
  future: 'Over twee uur'
live:
  server: 'Gerenderd door Twig, ververst door de frontservice:'
  vue: 'Gerenderd door Vue:'
plain:
  filter: "| date_format('date_long')"
  pattern: '| date_format("EEEE d MMMM, ''week'' w")'
