~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Dòng thời gian'
page_icon: 'ph:bold/list-numbers'
intro: 'Những điều nằm dưới nhau, mỗi điều trên một dấu mốc, nối với nhau bằng một đường thẳng: các bước của một quy trình, các sự kiện trong lịch sử, các giai đoạn của một lần chạy. Nội dung của mỗi điều là tự do — một dòng văn bản, một bảng, một mẫu — và đường thẳng chạy xuống toàn bộ nó, đến dấu mốc tiếp theo.'
section:
  steps:
    title: 'Các bước theo thứ tự'
    description: 'Được đánh số, với ba trạng thái mà bộ điều chỉnh biết: các bước phía sau được vẽ đậm, bước đang thực hiện nổi bật, những bước phía trước chờ đợi.'
  free:
    title: 'Bất kỳ điều gì dưới một tiêu đề'
    description: 'Mỗi mục chứa bất cứ điều gì nó cần — thuộc tính, một thông điệp, nút bấm. Một biểu tượng thay thế cho dấu chấm, và một tông màu tô màu cho dấu mốc giống như nó tô màu cho một dấu mốc hoặc một khối.'
  history:
    title: 'Một lịch sử'
    description: 'Không có thứ tự để theo dõi, chỉ có các sự kiện: các dấu chấm, một ngày dưới mỗi tiêu đề, và một màu danh mục nơi nó kể điều gì đó.'
  unknown:
    title: 'Các bước chưa quyết định'
    description: 'Giống như trên bộ điều chỉnh: một bước phụ thuộc vào một câu trả lời chưa được đưa ra không có số và không làm dịch chuyển bất kỳ bước nào khác.'
  hand:
    title: 'Viết bằng tay'
    description: 'Thành phần chỉ là một cách để viết hình dạng từ một danh sách. Các lớp giống nhau được viết trong trang sẽ tạo ra cùng một dòng thời gian, với bất kỳ điều gì trong đó.'
  vue:
    title: 'Trong vue'
    description: 'Cùng một dòng thời gian trong một cây vue. Những gì nhánh lấy làm đánh dấu là một slot có phạm vi ở đó, vì vậy một thành phần có thể đứng dưới tiêu đề của một mục.'
install:
  clone:
    title: 'Lấy nguồn'
    text: 'Nhân bản kho lưu trữ và cài đặt các phụ thuộc của nó.'
  configure:
    title: 'Cấu hình'
    text: 'Sao chép môi trường mẫu và điền địa chỉ cơ sở dữ liệu.'
  migrate:
    title: 'Tạo cơ sở dữ liệu'
    text: 'Chạy các di chuyển; đây là bước đang tiến hành.'
  deploy:
    title: 'Triển khai'
    text: 'Xây dựng tài sản và công bố bản phát hành.'
