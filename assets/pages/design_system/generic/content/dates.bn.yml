~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: তারিখ
page_icon: 'ph:bold/clock'
intro: 'ফরম্যাট নামের একটি শব্দভাণ্ডার, যা Twig, সাধারণ JavaScript এবং Vue দ্বারা একইভাবে বোঝা যায়। সার্ভার একটি <time> মুদ্রণ করে যা মুহূর্ত এবং যে ফরম্যাটের জন্য এটি জিজ্ঞাসা করা হয় সেটি বহন করে; ব্রাউজার এটি গ্রহণ করে এবং এটি পুরনো হলে পুনরায় লেখে, তাই একটি পৃষ্ঠা খোলা রেখে কখনোই কিছু ঘটার সময় সম্পর্কে মিথ্যা বলে না।'
section:
  formats:
    title: 'নামকৃত ফরম্যাট'
    description: 'অবশ্যই ফরম্যাটগুলি ICU তারিখ এবং সময় শৈলী, তাই ক্ষেত্রের অর্ডার এবং বিভাজকগুলির স্থানীয়তার উপর ভিত্তি করে, টেম্পলেটের পরিবর্তে।'
  relative:
    title: আপেক্ষিক
    description: 'দূরত্ব সবচেয়ে বড় একক দ্বারা গণনা করা হয় যা এখনও কিছু বলে — মিনিট এক ঘণ্টা পর্যন্ত, ঘণ্টা এক দিন পর্যন্ত, তারপর দিন, সপ্তাহ, মাস এবং বছর। প্রতিটি শব্দ একটি অনুবাদ কী থেকে এসেছে।'
  auto:
    title: স্বয়ংক্রিয়
    description: 'ডিফল্ট। তারিখটি সাম্প্রতিক থাকলে পিছনে গণনা করে, এবং এক সপ্তাহের পরে একটি ক্যালেন্ডার তারিখে ফিরে আসে, যেখানে "27 সপ্তাহ আগে" কারো জন্য সাহায্য করা বন্ধ করে।'
  live:
    title: 'আপডেট রাখা'
    description: 'একটি একক টাইমার পৃষ্ঠায় প্রতিটি তারিখের জন্য কাজ করে, প্রদর্শিত এককের প্রাপ্যতার মধ্যে — "এখনই" জন্য কয়েক সেকেন্ড, "৩ মাস আগে" জন্য এক ঘণ্টা। এই পৃষ্ঠা খোলা রেখে দেখুন।'
  plain:
    title: 'শুধুমাত্র টেক্সট'
    description: 'ফিল্টারটি কোন মার্কআপ ছাড়া একটি স্ট্রিং ফেরত দেয়, একটি শিরোনাম বৈশিষ্ট্য বা একটি রপ্তানির জন্য। একটি ফরম্যাট নাম এটি জানে না তা একটি কাঁচা ICU প্যাটার্ন হিসেবে গ্রহণ করা হয়, যা নামকৃত ফরম্যাটগুলি আপনার প্রয়োজনীয় আকার না হলে বেরিয়ে আসার উপায়।'
offset:
  now: 'এক মিনিট আগে'
  minutes: 'পাঁচ মিনিট'
  hours: 'তিন ঘণ্টা'
  days: 'দুই দিন'
  months: 'চার মাস'
  years: 'তিন বছর'
  future: 'দুটি ঘণ্টা পর'
live:
  server: 'Twig দ্বারা রেন্ডার করা, সামনের পরিষেবা দ্বারা রিফ্রেশ করা:'
  vue: 'Vue দ্বারা রেন্ডার করা:'
plain:
  filter: "| date_format('date_long')"
  pattern: '| date_format("EEEE d MMMM, ''সপ্তাহ'' w")'
