~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Konsola
page_icon: 'ph:bold/terminal-window'
intro: 'Co wypisała powłoka, przeczytaj z powrotem na stronie: polecenia po ich znaku zachęty, ich wyniki pod nimi, a kolory terminala odczytywane jak paleta, w dowolnym schemacie. Odczytuje; nie wykonuje poleceń.'
section:
  session:
    title: Sesja
    description: 'Linie czterech rodzajów — polecenie, wynik, błąd, informacja — lub zwykłe ciągi. Kody ucieczki, które program napisał dla swojego terminala, są zachowywane jako kolor i grubość; reszta, co terminalowi się mówi, jest pomijana.'
  vue:
    title: 'W vue'
    description: 'Te same linie, rysowane przez bliźniaka vue, tutaj z własnym znakiem zachęty.'
  live:
    title: 'Linie, jak przychodzą'
    description: 'Mając temat aktualizacji na żywo, konsola vue dodaje to, co niesie każda wiadomość — ciąg, linia lub partia linii — i śledzi koniec, chyba że czytelnik przewinął w górę. Tutaj przycisk odgrywa rolę tematu, poprzez to samo dodawanie, które wywołuje wiadomość.'
