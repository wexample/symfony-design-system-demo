article:
  toc:
    label: 'En este artículo'
  title: 'Entendiendo los tokens de diseño'
  intro: 'Los tokens de diseño son la única fuente de verdad para decisiones visuales a través de un producto. Codifican color, espaciado, tipografía y movimiento en variables nombradas que los componentes consumen.'
  section_one:
    title: 'Por qué importan los tokens'
    body_one: 'Sin tokens, un cambio en el color de la marca principal requiere buscar en cientos de archivos. Con tokens, una actualización de variable se propaga en todas partes — desde botones hasta alertas y barras de navegación.'
    body_two: 'Los tokens también cierran la brecha entre las herramientas de diseño y el código. Un diseñador nombra un color <strong>surface-brand</strong> en Figma; un desarrollador usa <code>var(--surface-brand)</code> en CSS. Hablan el mismo idioma.'
  section_two:
    title: 'Ejemplos prácticos'
    body: 'Considera un componente que necesita un fondo, un borde y texto. En lugar de codificar <code>#1a56db</code>, <code>#e1effe</code>, y <code>#1e429f</code>, el componente hace referencia a <code>--color-primary</code>, <code>--surface-primary-subtle</code>, y <code>--text-primary-strong</code>. Cuando la marca evoluciona, la paleta cambia — el componente no.'
  list_title: 'Categorías de tokens'
  list:
    - 'Color — paletas de marca, semántica y neutra'
    - 'Espaciado — una escala consistente de 2px a 64px'
    - 'Tipografía — tamaños de fuente, pesos y alturas de línea'
    - 'Radio — de esquinas afiladas a completamente redondeadas'
    - 'Sombra — niveles de elevación para profundidad y jerarquía'
    - 'Movimiento — curvas de suavizado y pasos de duración'
  quote: 'La mayoría de las citas encontradas en Internet fueron probablemente generadas por una IA.'
  quote_author: 'Albert Einstein'
  cta: 'Lee la referencia completa de tokens'
media:
  alt: 'Imagen de marcador de posición junto al texto'
  caption: 'Imagen ocupando un tercio del diseño.'
  body_one: 'Usa content--media para colocar una imagen y texto uno al lado del otro. La imagen ocupa un tercio del ancho, el texto dos tercios.'
  body_two: 'Este diseño es adecuado para citas destacadas, definiciones ilustradas, o cualquier bloque editorial corto donde la imagen refuerza el texto sin dominarlo.'
