en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Timeline
  page_icon: ph:bold/list-numbers

  intro: "Things one under the other, each on a marker, joined by a line: the steps of a procedure, the events of a history, the stages of a run. What each holds is free — a line of text, a table, a form — and the line runs down the whole of it, to the next marker."

  section:
    steps:
      title: Steps in order
      description: "Numbered, with the three states the stepper knows: the steps behind are drawn solid, the one being done stands out, those ahead wait."
    free:
      title: Anything under a title
      description: "Each item holds whatever it needs — properties, a message, buttons. An icon replaces the dot, and a tone colours the marker the way it colours a marker or a block."
    history:
      title: A history
      description: "No order to follow, only events: dots, a date under each title, and a category colour where it tells something."
    unknown:
      title: Steps not decided yet
      description: "As on the stepper: a step that depends on an answer not given yet takes no number and moves none of the others."
    hand:
      title: Written by hand
      description: "The component is only a way of writing the shape from a list. The same classes written in the page give the same timeline, with anything in it."
    vue:
      title: In vue
      description: "The same timeline in a vue tree. What the twig takes as markup is a scoped slot there, so a component can stand under an item's title."

  install:
    clone:
      title: Get the sources
      text: Clone the repository and install its dependencies.
    configure:
      title: Configure
      text: Copy the example environment and fill in the database address.
    migrate:
      title: Create the database
      text: Run the migrations; this is the step in progress.
    deploy:
      title: Deploy
      text: Build the assets and publish the release.

  order:
    placed:
      title: Order placed
      meta: 14 March, 09:41
    paid:
      title: Payment received
      meta: 14 March, 09:42
    shipped:
      title: Shipped
      meta: 15 March, 16:05
    next:
      title: Delivery
    delay:
      title: Running late
      text: The carrier announces one more day.
    field:
      reference: Reference
      amount: Amount
      method: Payment
      card: Card ending 4242
    action:
      track: Track the parcel
      cancel: Cancel

  history:
    release:
      title: Version 2.0 released
      meta: 2 September
    review:
      title: Reviewed by the team
      meta: 28 August
    draft:
      title: First draft
      meta: 12 August

  branch:
    choose: Choose a plan
    depends: Depends on the plan

  hand:
    one: A plain dot
    two: An icon in place of the dot
    two_text: Any markup, written in the page.

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'الجدول الزمني'
  page_icon: 'ph:bold/list-numbers'
  intro: 'أشياء واحدة تحت الأخرى، كل منها على علامة، مرتبطة بخط: خطوات إجراء، أحداث تاريخ، مراحل تشغيل. ما يحمله كل منها حر - سطر من النص، جدول، نموذج - والخط يمتد عبر كامل ذلك، إلى العلامة التالية.'
  section:
    steps:
      title: 'خطوات مرتبة'
      description: 'مرقمة، مع الحالات الثلاث التي يعرفها جهاز الخطوات: خطوات الخلف مرسومة بشكل صلب، والتي تُنجز تبرز، وتلك التي تنتظر.'
    free:
      title: 'أي شيء تحت عنوان'
      description: 'كل عنصر يحمل ما يحتاجه - خصائص، رسالة، أزرار. أيقونة تحل محل النقطة، ونغمة تلون العلامة كما تلون علامة أو كتلة.'
    history:
      title: تاريخ
      description: 'لا ترتيب للمتابعة، فقط أحداث: نقاط، تاريخ تحت كل عنوان، ولون فئة حيث يخبر بشيء.'
    unknown:
      title: 'خطوات لم تُحدد بعد'
      description: 'كما في جهاز الخطوات: خطوة تعتمد على إجابة لم تُعطَ بعد لا تأخذ رقمًا ولا تحرك أيًا من الخطوات الأخرى.'
    hand:
      title: 'مكتوب يدويًا'
      description: 'المكون هو فقط وسيلة لكتابة الشكل من قائمة. نفس الفئات المكتوبة في الصفحة تعطي نفس الجدول الزمني، مع أي شيء في داخله.'
    vue:
      title: 'في vue'
      description: 'نفس الجدول الزمني في شجرة vue. ما تأخذه الفرع كعلامات هو فتحة مخصصة هناك، لذا يمكن أن يقف مكون تحت عنوان عنصر.'
  install:
    clone:
      title: 'احصل على المصادر'
      text: 'استنساخ المستودع وتثبيت الاعتماديات الخاصة به.'
    configure:
      title: تهيئة
      text: 'انسخ البيئة النموذجية واملأ عنوان قاعدة البيانات.'
    migrate:
      title: 'إنشاء قاعدة البيانات'
      text: 'قم بتشغيل الهجرات؛ هذه هي الخطوة قيد التقدم.'
    deploy:
      title: نشر
      text: 'قم ببناء الأصول ونشر الإصدار.'
  order:
    placed:
      title: 'تم تقديم الطلب'
      meta: '14 مارس، 09:41'
    paid:
      title: 'تم استلام الدفع'
      meta: '14 مارس، 09:42'
    shipped:
      title: 'تم الشحن'
      meta: '15 مارس، 16:05'
    next:
      title: التسليم
    delay:
      title: 'تأخير في التسليم'
      text: 'المُرسل يُعلن عن يوم آخر.'
    field:
      reference: المرجع
      amount: المبلغ
      method: 'طريقة الدفع'
      card: 'بطاقة تنتهي بـ 4242'
    action:
      track: 'تتبع الطرد'
      cancel: إلغاء
  history:
    release:
      title: 'الإصدار 2.0 تم إصداره'
      meta: '2 سبتمبر'
    review:
      title: 'تمت مراجعته من قبل الفريق'
      meta: '28 أغسطس'
    draft:
      title: 'المسودة الأولى'
      meta: '12 أغسطس'
  branch:
    choose: 'اختر خطة'
