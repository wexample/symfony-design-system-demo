th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ไทม์ไลน์
  page_icon: 'ph:bold/list-numbers'
  intro: 'สิ่งต่าง ๆ ที่เรียงกันอยู่ โดยแต่ละอันมีเครื่องหมายเชื่อมโยงด้วยเส้น: ขั้นตอนของกระบวนการ, เหตุการณ์ในประวัติศาสตร์, ระยะต่าง ๆ ของการดำเนินการ สิ่งที่แต่ละอันถือไว้เป็นอิสระ — แถวของข้อความ, ตาราง, ฟอร์ม — และเส้นจะวิ่งลงไปตลอดทั้งอัน จนถึงเครื่องหมายถัดไป'
  section:
    steps:
      title: ขั้นตอนตามลำดับ
      description: 'มีหมายเลข พร้อมกับสามสถานะที่ตัวขั้นตอนรู้จัก: ขั้นตอนที่ผ่านมาถูกวาดให้ชัดเจน, ขั้นตอนที่กำลังทำโดดเด่น, ขั้นตอนที่รออยู่จะรอ'
    free:
      title: อะไรก็ได้ใต้ชื่อเรื่อง
      description: 'แต่ละรายการถืออะไรก็ตามที่มันต้องการ — คุณสมบัติ, ข้อความ, ปุ่ม. ไอคอนจะมาแทนที่จุด และโทนสีจะทำให้เครื่องหมายมีสีสันเหมือนกับที่มันทำกับเครื่องหมายหรือบล็อก'
    history:
      title: ประวัติศาสตร์
      description: 'ไม่มีลำดับที่จะติดตาม มีแต่เหตุการณ์: จุด, วันที่อยู่ใต้ชื่อเรื่องแต่ละอัน, และสีหมวดหมู่ที่บอกอะไรบางอย่าง'
    unknown:
      title: ขั้นตอนที่ยังไม่ได้ตัดสินใจ
      description: 'เหมือนกับในตัวขั้นตอน: ขั้นตอนที่ขึ้นอยู่กับคำตอบที่ยังไม่ได้ให้ จะไม่มีหมายเลขและไม่เคลื่อนย้ายขั้นตอนอื่น ๆ'
    hand:
