      text: 'মাইগ্রেশন চালান; এটি হচ্ছে বর্তমান পদক্ষেপ।'
    deploy:
      title: 'ডেপ্লয় করুন'
      text: 'অ্যাসেট তৈরি করুন এবং রিলিজ প্রকাশ করুন।'
  order:
