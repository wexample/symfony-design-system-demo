fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'خط زمان'
  page_icon: 'ph:bold/list-numbers'
  intro: 'چیزها یکی زیر دیگری، هر کدام روی یک نشانگر، به وسیله یک خط متصل شده‌اند: مراحل یک فرآیند، رویدادهای یک تاریخ، مراحل یک اجرا. هر چیزی که در آن قرار دارد آزاد است — یک خط متن، یک جدول، یک فرم — و خط در تمام آن جاری است، به نشانگر بعدی.'
  section:
    steps:
      title: 'مراحل به ترتیب'
      description: 'شماره‌گذاری شده، با سه وضعیتی که مرحله‌نما می‌شناسد: مراحل قبلی به صورت محکم کشیده شده‌اند، مرحله در حال انجام متمایز است، و مراحل آینده منتظر هستند.'
    free:
      title: 'هر چیزی زیر یک عنوان'
      description: 'هر مورد هر آنچه نیاز دارد را در خود دارد — ویژگی‌ها، یک پیام، دکمه‌ها. یک آیکون نقطه را جایگزین می‌کند، و یک لحن نشانگر را به رنگی که نشانگر یا بلوکی را رنگ‌آمیزی می‌کند، رنگ می‌دهد.'
    history:
      title: تاریخ
      description: 'هیچ ترتیبی برای پیگیری وجود ندارد، فقط رویدادها: نقاط، یک تاریخ زیر هر عنوان، و رنگ یک دسته که چیزی را بیان می‌کند.'
    unknown:
      title: 'مراحل هنوز تصمیم‌گیری نشده'
      description: 'همانند مرحله‌نما: مرحله‌ای که به یک پاسخ که هنوز داده نشده وابسته است شماره‌ای ندارد و هیچ یک از دیگر مراحل را حرکت نمی‌دهد.'
    hand:
