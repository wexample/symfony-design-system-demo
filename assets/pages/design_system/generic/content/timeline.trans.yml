    two_text: 'أي علامة، مكتوبة في الصفحة.'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: টাইমলাইন
  page_icon: 'ph:bold/list-numbers'
  intro: 'একটির নিচে একটি বস্তু, প্রতিটি একটি মার্কারে, একটি লাইনে যুক্ত: একটি প্রক্রিয়ার পদক্ষেপ, একটি ইতিহাসের ঘটনা, একটি চলার পর্যায়। প্রতিটি যা ধারণ করে তা মুক্ত — একটি টেক্সটের লাইন, একটি টেবিল, একটি ফর্ম — এবং লাইনটি পুরো জায়গা জুড়ে চলে, পরবর্তী মার্কারের দিকে।'
  section:
    steps:
      title: 'ক্রমে পদক্ষেপ'
      description: 'সংখ্যায়িত, তিনটি অবস্থায় যা স্টেপার জানে: পিছনের পদক্ষেপগুলি দৃঢ়ভাবে আঁকা হয়, চলমান পদক্ষেপটি আলাদা করে দাঁড়ায়, সামনে অপেক্ষমাণগুলি।'
    free:
      title: 'একটি শিরোনামের নিচে কিছুই'
      description: 'প্রতিটি আইটেম যা প্রয়োজন তা ধারণ করে — বৈশিষ্ট্য, একটি বার্তা, বোতাম। একটি আইকন বিন্দুর জায়গা নেয়, এবং একটি সুর মার্কারকে রঙিন করে যেমন একটি মার্কার বা ব্লককে রঙিন করে।'
    history:
      title: 'একটি ইতিহাস'
      description: 'অনুসরণ করার জন্য কোন ক্রম নেই, শুধুমাত্র ঘটনা: বিন্দুগুলি, প্রতিটি শিরোনামের নিচে একটি তারিখ, এবং একটি বিভাগ রঙ যেখানে এটি কিছু বলে।'
    unknown:
      title: 'এখনও সিদ্ধান্ত হয়নি পদক্ষেপ'
      description: 'স্টেপারের মতো: একটি পদক্ষেপ যা এখনও দেওয়া হয়নি এমন একটি উত্তর উপর নির্ভর করে, এর কোন সংখ্যা নেই এবং অন্যদের কোন গতিশীলতা নেই।'
    hand:
      title: 'হাতে লেখা'
      description: 'উপাদানটি শুধুমাত্র একটি তালিকা থেকে আকার লেখার একটি উপায়। একই ক্লাস পৃষ্ঠায় লেখা একই টাইমলাইন দেয়, এতে কিছুই থাকে।'
    vue:
      title: ভিউতে
      description: 'একটি ভিউ গাছের মধ্যে একই টাইমলাইন। যা শাখা মার্কআপ হিসাবে গ্রহণ করে তা সেখানে একটি স্কোপড স্লট, তাই একটি উপাদান একটি আইটেমের শিরোনামের অধীনে দাঁড়াতে পারে।'
  install:
    clone:
      title: 'সোর্স পান'
      text: 'রিপোজিটরি ক্লোন করুন এবং এর নির্ভরতা ইনস্টল করুন।'
    configure:
      title: 'কনফিগার করুন'
      text: 'উদাহরণ পরিবেশ কপি করুন এবং ডাটাবেসের ঠিকানা পূরণ করুন।'
    migrate:
