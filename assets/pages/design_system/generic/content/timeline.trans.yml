      description: 'ส่วนประกอบนี้เป็นเพียงวิธีการเขียนรูปแบบจากรายการ คลาสเดียวกันที่เขียนในหน้า จะให้ไทม์ไลน์เดียวกัน โดยมีอะไรก็ตามในนั้น'
    vue:
