ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: タイムライン
  page_icon: 'ph:bold/list-numbers'
  intro: '1つの下に1つ、マーカーで結ばれたもの：手順のステップ、歴史の出来事、実行の段階。それぞれが保持するものは自由 — テキストの行、表、フォーム — そしてその行はそれ全体を下に走り、次のマーカーへと繋がります。'
  section:
    steps:
      title: 順番にステップ
      description: 番号付きで、ステッパーが知っている3つの状態：後ろのステップはしっかり描かれ、現在進行中のものが目立ち、前のものは待っています。
    free:
      title: タイトルの下に何でも
      description: '各アイテムは必要なものを保持します — プロパティ、メッセージ、ボタン。アイコンが点を置き換え、トーンがマーカーを色付けします。'
    history:
      title: 歴史
      description: 従うべき順序はなく、ただ出来事がある：点、各タイトルの下に日付、何かを伝えるカテゴリの色。
    unknown:
      title: まだ決まっていないステップ
      description: ステッパーと同様：まだ与えられていない回答に依存するステップは番号を持たず、他のものを動かしません。
    hand:
      title: 手書き
