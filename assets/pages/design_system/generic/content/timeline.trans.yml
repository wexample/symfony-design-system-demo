  intro: 'Coisas uma embaixo da outra, cada uma em um marcador, unidas por uma linha: os passos de um procedimento, os eventos de uma história, as etapas de uma corrida. O que cada uma contém é livre — uma linha de texto, uma tabela, um formulário — e a linha desce por toda ela, até o próximo marcador.'
  section:
    steps:
      title: 'Passos em ordem'
      description: 'Numerados, com os três estados que o passo conhece: os passos atrás são desenhados sólidos, o que está sendo feito se destaca, os que estão à frente aguardam.'
    free:
      title: 'Qualquer coisa sob um título'
      description: 'Cada item contém o que precisa — propriedades, uma mensagem, botões. Um ícone substitui o ponto, e um tom colore o marcador da mesma forma que colore um marcador ou um bloco.'
    history:
      title: 'Uma história'
      description: 'Sem ordem a seguir, apenas eventos: pontos, uma data sob cada título, e uma cor de categoria onde se conta algo.'
    unknown:
      title: 'Passos ainda não decididos'
      description: 'Como no passo: um passo que depende de uma resposta ainda não dada não recebe número e não move os outros.'
    hand:
