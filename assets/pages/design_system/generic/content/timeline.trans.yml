es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Línea de tiempo'
  page_icon: 'ph:bold/list-numbers'
  intro: 'Cosas una debajo de la otra, cada una en un marcador, unidas por una línea: los pasos de un procedimiento, los eventos de una historia, las etapas de una carrera. Lo que cada una contiene es libre: una línea de texto, una tabla, un formulario, y la línea corre a lo largo de toda ella, hasta el siguiente marcador.'
  section:
    steps:
      title: 'Pasos en orden'
      description: 'Numerados, con los tres estados que el escalador conoce: los pasos detrás están dibujados sólidos, el que se está realizando destaca, los que están adelante esperan.'
    free:
      title: 'Cualquier cosa bajo un título'
      description: 'Cada ítem contiene lo que necesita: propiedades, un mensaje, botones. Un ícono reemplaza el punto, y un tono colorea el marcador como colorea un marcador o un bloque.'
    history:
      title: 'Una historia'
      description: 'Sin orden que seguir, solo eventos: puntos, una fecha bajo cada título, y un color de categoría donde se dice algo.'
    unknown:
      title: 'Pasos no decididos aún'
      description: 'Como en el escalador: un paso que depende de una respuesta no dada aún no toma número y no mueve a los demás.'
    hand:
      title: 'Escrito a mano'
      description: 'El componente es solo una forma de escribir la forma de una lista. Las mismas clases escritas en la página dan la misma línea de tiempo, con cualquier cosa en ella.'
    vue:
      title: 'En vue'
      description: 'La misma línea de tiempo en un árbol vue. Lo que la ramita toma como marcado es un slot con alcance allí, así que un componente puede estar bajo el título de un ítem.'
  install:
    clone:
      title: 'Obtener las fuentes'
      text: 'Clona el repositorio e instala sus dependencias.'
    configure:
      title: Configurar
      text: 'Copia el entorno de ejemplo y completa la dirección de la base de datos.'
    migrate:
