      title: 'שלבים בסדר'
      description: 'מסודרים במספרים, עם שלוש המדינות שהסופר מכיר: השלבים מאחור מצוירים מוצקים, זה שנעשה בולט, אלו שלפנינו מחכים.'
    free:
      title: 'כל דבר תחת כותרת'
      description: 'כל פריט מחזיק מה שהוא צריך - תכונות, הודעה, כפתורים. אייקון מחליף את הנקודה, וטון צבעוני את הסמן כמו שהוא צבעוני סמן או בלוק.'
    history:
