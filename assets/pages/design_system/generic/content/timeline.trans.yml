hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: समयरेखा
  page_icon: 'ph:bold/list-numbers'
  intro: 'एक के नीचे एक चीजें, प्रत्येक एक मार्कर पर, एक रेखा द्वारा जुड़ी हुई: एक प्रक्रिया के कदम, एक इतिहास की घटनाएँ, एक दौड़ के चरण। जो कुछ भी इसमें है वह स्वतंत्र है - एक टेक्स्ट की पंक्ति, एक तालिका, एक फॉर्म - और रेखा इसके पूरे भाग में चलती है, अगले मार्कर तक।'
  section:
    steps:
      title: 'क्रम में कदम'
      description: 'संख्याबद्ध, तीन राज्यों के साथ जो स्टेपर जानता है: पीछे के कदम ठोस रूप से खींचे जाते हैं, जो कदम चल रहा है वह खड़ा होता है, आगे के कदम इंतजार करते हैं।'
    free:
      title: 'किसी शीर्षक के तहत कुछ भी'
      description: 'प्रत्येक आइटम में जो भी आवश्यकता है वह होता है - गुण, एक संदेश, बटन। एक आइकन बिंदु को प्रतिस्थापित करता है, और एक टोन मार्कर को रंग देता है जैसे वह एक मार्कर या एक ब्लॉक को रंगता है।'
    history:
      title: 'एक इतिहास'
      description: 'अनुसरण करने के लिए कोई क्रम नहीं, केवल घटनाएँ: बिंदु, प्रत्येक शीर्षक के तहत एक तारीख, और एक श्रेणी का रंग जहां यह कुछ बताता है।'
    unknown:
      title: 'अभी तय नहीं हुए कदम'
      description: 'जैसे स्टेपर पर: एक कदम जो अभी तक दिए गए उत्तर पर निर्भर करता है, उसे कोई संख्या नहीं मिलती और वह अन्य कदमों को नहीं बढ़ाता।'
    hand:
      title: 'हाथ से लिखा गया'
      description: 'यह घटक केवल एक सूची से आकार लिखने का एक तरीका है। एक ही कक्षाएँ पृष्ठ में लिखी गईं वही समयरेखा देती हैं, जिसमें कुछ भी होता है।'
    vue:
      title: 'व्यू में'
      description: 'एक vue ट्री में वही समयरेखा। जो टहनी मार्कअप के रूप में लेती है, वह वहाँ एक स्कोप्ड स्लॉट है, इसलिए एक घटक किसी आइटम के शीर्षक के तहत खड़ा हो सकता है।'
  install:
