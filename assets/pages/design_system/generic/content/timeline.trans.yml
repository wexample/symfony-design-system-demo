  page_icon: 'ph:bold/list-numbers'
  intro: 'דברים זה מתחת לזה, כל אחד על סמן, מחוברים בקו: שלבי הליך, אירועים בהיסטוריה, שלבי ריצה. מה שכל אחד מחזיק הוא חופשי - שורת טקסט, טבלה, טופס - והקו רץ לאורך כל זה, עד לסמן הבא.'
  section:
