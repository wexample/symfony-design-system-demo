      title: 'অর্ডার দেওয়া হয়েছে'
      meta: '১৪ মার্চ, ০৯:৪১'
    paid:
      title: 'পেমেন্ট গ্রহণ হয়েছে'
      meta: '১৪ মার্চ, ০৯:৪২'
    shipped:
      title: 'শিপ করা হয়েছে'
      meta: '১৫ মার্চ, ১৬:০৫'
    next:
      title: ডেলিভারি
    delay:
      title: 'দেরিতে চলছে'
      text: 'ক্যারিয়ার একটি দিন বেশি ঘোষণা করে।'
