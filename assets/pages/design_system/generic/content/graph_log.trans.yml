ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'گراف لاگ'
  page_icon: 'ph:bold/git-fork'
  intro: 'نسخے کی ایک لائن میں، جدید ترین پہلے، رنگین راستوں پر کھینچے گئے: جہاں ایک لائن تقسیم ہوتی ہے، جہاں دو دوبارہ ملتے ہیں۔ ہر نسخہ اپنے والدین کو بتاتا ہے؛ راستے ان کی پیروی کرتے ہیں۔ گراف کے ساتھ ایک قطار میں جو دکھایا جاتا ہے وہ آزاد ہے — ایک عنوان، حوالہ جات کیپسول کے طور پر، کون، کب، ایک مختصر نام — لہذا ایک گٹ تاریخ ایک استعمال ہے دیگر کے درمیان۔'
  section:
    history:
      title: تاریخ
      description: 'ایک فیچر برانچ کو دوبارہ ضم کیا گیا، دوسرا کھلا چھوڑا گیا، ایک ریلیز پر ٹیگ۔ ہر راستہ اپنے رنگ کو وہاں سے رکھتا ہے جہاں سے وہ شروع ہوتا ہے جہاں تک وہ ختم ہوتا ہے۔'
    other:
      title: 'گٹ سے کچھ اور'
      description: 'ایک دستاویز کے ورژنز، ان میں سے ایک کو اگلے میں ضم ہونے سے پہلے ایک طرف جانچا گیا۔ کمپوننٹ کمٹ کے بارے میں کچھ نہیں جانتا۔'
    vue:
      title: 'ویو میں'
      description: 'ویو کے درخت میں وہی تاریخ، راستے دوبارہ کھینچے گئے جیسے ہی اشیاء سر میں آتی ہیں۔'
