en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Graph log
  page_icon: ph:bold/git-fork

  intro: "Items in a line of descent, newest first, drawn on coloured lanes: where a line forks, where two meet again. Each item says its parents; the lanes follow. What a row shows beside the graph is free — a title, refs as capsules, who, when, a short name — so a git history is one use among others."

  section:
    history:
      title: A history
      description: "A feature branch merged back, another left open, a tag on a release. Each lane keeps its colour from where it starts to where it ends."
    other:
      title: Something else than git
      description: "The versions of a document, one of them reviewed on the side before being merged into the next. The component knows nothing about commits."
    vue:
      title: In vue
      description: "The same history in a vue tree, the lanes drawn again as items come in at the head."
    git:
      title: This application's history
      description: "Read from the repository by symfony-coding's git_graph_items(), through the shared reader that never gets in git's way."

  history:
    merge_search: Merge the search branch
    search_filters: Add filters to the search
    fix_header: Fix the header on small screens
    try_theme: Try a darker theme
    search_index: Index the documents
    release: Release 2.1.0
    search_start: Start the search
    initial: First commit

  versions:
    v4: Version 4, with the review applied
    current: current
    review: Reviewer's changes
    review_ref: review
    v3: Version 3
    v2: Version 2
    v1: Version 1

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'سجل الرسم البياني'
  page_icon: 'ph:bold/git-fork'
  intro: 'عناصر في خط النسب، الأحدث أولاً، مرسومة على مسارات ملونة: حيث يتفرع خط، حيث يلتقي اثنان مرة أخرى. كل عنصر يذكر والديه؛ المسارات تتبع. ما يظهر بجانب الرسم البياني مجاني - عنوان، مراجع ككبسولات، من، متى، اسم قصير - لذا فhistoria git هي واحدة من الاستخدامات بين أخرى.'
  section:
    history:
      title: تاريخ
      description: 'فرع مميز تم دمجه مرة أخرى، وآخر ترك مفتوحًا، علامة على إصدار. كل مسار يحتفظ بلونه من حيث يبدأ إلى حيث ينتهي.'
    other:
      title: 'شيء آخر غير git'
      description: 'إصدارات مستند، تم مراجعة أحدها على الجانب قبل دمجه في التالي. المكون لا يعرف شيئًا عن الالتزامات.'
    vue:
      title: 'في vue'
      description: 'نفس التاريخ في شجرة vue، المسارات مرسومة مرة أخرى مع دخول العناصر في المقدمة.'
    git:
      title: 'تاريخ هذا التطبيق'
      description: "يُقرأ من المستودع بواسطة symfony-coding's git_graph_items()، من خلال القارئ المشترك الذي لا يتداخل مع git."
  history:
    merge_search: 'دمج فرع البحث'
    search_filters: 'إضافة فلاتر إلى البحث'
    fix_header: 'إصلاح الرأس على الشاشات الصغيرة'
    try_theme: 'جرب سمة أغمق'
    search_index: 'فهرسة المستندات'
    release: 'إصدار 2.1.0'
    search_start: 'بدء البحث'
    initial: 'أول التزام'
  versions:
    v4: 'الإصدار 4، مع المراجعة المطبقة'
    current: الحالي
    review: 'تغييرات المراجع'
    review_ref: مراجعة
    v3: 'الإصدار 3'
    v2: 'الإصدار 2'
    v1: 'الإصدار 1'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'গ্রাফ লগ'
  page_icon: 'ph:bold/git-fork'
  intro: 'একটি বংশগতি লাইনে আইটেম, নতুন থেকে পুরোনো, রঙিন লেনে অঙ্কিত: যেখানে একটি রেখা বিভক্ত হয়, যেখানে দুটি আবার মিলিত হয়। প্রতিটি আইটেম তার পিতামাতা বলে; লেনগুলি অনুসরণ করে। গ্রাফের পাশে একটি সারি যা দেখায় তা মুক্ত — একটি শিরোনাম, ক্যাপসুলের মতো রেফারেন্স, কে, কখন, একটি সংক্ষিপ্ত নাম — তাই একটি গিট ইতিহাস অন্যান্য ব্যবহারের মধ্যে একটি।'
  section:
    history:
      title: 'একটি ইতিহাস'
      description: 'একটি ফিচার শাখা পুনরায় মিশ্রিত হয়েছে, আরেকটি খোলা রাখা হয়েছে, একটি রিলিজে একটি ট্যাগ। প্রতিটি লেন তার শুরু থেকে শেষ পর্যন্ত রঙ ধরে রাখে।'
    other:
      title: 'গিটের বাইরে কিছু'
      description: 'একটি ডকুমেন্টের সংস্করণ, তাদের মধ্যে একটি পাশের দিকে পর্যালোচনা করা হয়েছে এর পরবর্তী সংস্করণে মিশ্রিত হওয়ার আগে। উপাদান কমিট সম্পর্কে কিছু জানে না।'
    vue:
      title: ভিউতে
      description: 'একটি ভিউ গাছের মধ্যে একই ইতিহাস, যখন আইটেমগুলি মাথায় আসে তখন লেনগুলি আবার অঙ্কিত হয়।'
    git:
      title: 'এই অ্যাপ্লিকেশনের ইতিহাস'
      description: 'সংশ্লিষ্ট পাঠক দ্বারা পড়া হয়েছে যা গিটের পথে কখনো বাধা দেয় না, symfony-coding এর git_graph_items() মাধ্যমে।'
  history:
