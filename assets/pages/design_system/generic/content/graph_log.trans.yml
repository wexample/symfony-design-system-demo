fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'گراف لاگ'
  page_icon: 'ph:bold/git-fork'
  intro: 'مواردی در یک خط نسل، جدیدترین اول، بر روی لاین‌های رنگی ترسیم شده‌اند: جایی که یک خط تقسیم می‌شود، جایی که دو خط دوباره به هم می‌رسند. هر مورد والدین خود را نشان می‌دهد؛ لاین‌ها از آن پیروی می‌کنند. آنچه در کنار گراف نشان داده می‌شود رایگان است — یک عنوان، مراجع به‌صورت کپسول، چه کسی، کی، یک نام کوتاه — بنابراین تاریخچه گیت یکی از استفاده‌ها در بین دیگران است.'
  section:
    history:
      title: تاریخچه
      description: 'یک شاخه ویژگی که به عقب ادغام شده، دیگری که باز مانده، یک برچسب بر روی یک انتشار. هر لاین رنگ خود را از جایی که شروع می‌شود تا جایی که تمام می‌شود حفظ می‌کند.'
    other:
      title: 'چیزی غیر از گیت'
      description: 'نسخه‌های یک سند، یکی از آن‌ها در کنار قبل از ادغام به بعد بررسی شده است. مؤلفه هیچ اطلاعی از کامیت‌ها ندارد.'
    vue:
      title: 'در vue'
      description: 'همان تاریخچه در یک درخت vue، لاین‌ها دوباره به عنوان مواردی که در سر وارد می‌شوند ترسیم شده‌اند.'
    git:
      title: 'تاریخچه این برنامه'
      description: 'از مخزن توسط git_graph_items() symfony-coding خوانده شده، از طریق خواننده مشترکی که هرگز در کار گیت دخالت نمی‌کند.'
