  intro: 'Elementos en una línea de descendencia, el más nuevo primero, dibujados en carriles de colores: donde una línea se bifurca, donde dos se encuentran de nuevo. Cada elemento indica sus padres; los carriles los siguen. Lo que una fila muestra al lado del gráfico es libre: un título, referencias como cápsulas, quién, cuándo, un nombre corto; así que el historial de git es un uso entre otros.'
  section:
