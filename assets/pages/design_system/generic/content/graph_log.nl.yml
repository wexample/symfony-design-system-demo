~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Grafieklog
page_icon: 'ph:bold/git-fork'
intro: 'Items in een afstamming, de nieuwste eerst, getekend op gekleurde banen: waar een lijn zich splitst, waar twee weer samenkomen. Elk item geeft zijn ouders aan; de banen volgen. Wat een rij naast de grafiek toont is vrij — een titel, refs als capsules, wie, wanneer, een korte naam — dus een git geschiedenis is een van de toepassingen onder anderen.'
section:
  history:
    title: 'Een geschiedenis'
    description: 'Een feature branch samengevoegd, een andere open gelaten, een tag op een release. Elke baan behoudt zijn kleur van waar hij begint tot waar hij eindigt.'
  other:
    title: 'Iets anders dan git'
    description: 'De versies van een document, waarvan er een aan de zijkant is beoordeeld voordat deze in de volgende werd samengevoegd. De component weet niets van commits.'
  vue:
    title: 'In vue'
    description: 'Dezelfde geschiedenis in een vue-boom, de banen opnieuw getekend als items binnenkomen aan de kop.'
  git:
    title: 'De geschiedenis van deze applicatie'
    description: "Gelezen uit de repository door symfony-coding's git_graph_items(), via de gedeelde lezer die nooit in de weg van git komt."
