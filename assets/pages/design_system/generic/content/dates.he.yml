~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: תאריכים
page_icon: 'ph:bold/clock'
intro: 'אוצר מילים של שמות פורמטים, המובן באופן זהה על ידי Twig, על ידי JavaScript רגיל ועל ידי Vue. השרת מדפיס <time> הנושא את הרגע ואת הפורמט שביקשו; הדפדפן תופס אותו ומחדש אותו ככל שהוא מתיישן, כך שדף שנשאר פתוח לעולם לא משקר לגבי כמה זמן עבר מאז שקרה משהו.'
section:
  formats:
    title: 'פורמטים שמיים'
    description: 'פורמטים מוחלטים הם סגנונות תאריך ושעה של ICU, ולכן סדר השדות והמפרידים שייכים לאזור השפה של הקורא ולא לתבנית.'
  relative:
    title: יחסי
    description: 'המרחק נמדד ביחידה הגדולה ביותר שא仍 אומרת משהו — דקות עד שעה, שעות עד יום, ואז ימים, שבועות, חודשים ושנים. כל ניסוח מגיע ממפתח תרגום.'
  auto:
    title: אוטומטי
    description: 'הברירת מחדל. סופר אחורה בזמן שהתאריך עדכני, ונופל לתאריך לוח לאחר שבוע, שבו "לפני 27 שבועות" מפסיק לעזור לאף אחד.'
  live:
    title: 'מתעדכן בזמן אמת'
    description: 'טיימר אחד משרת כל תאריך בדף, בקצב שהיחידה המוצגת ראויה לו — מספר שניות ל"עכשיו", שעה ל"לפני 3 חודשים". השאר את הדף הזה פתוח וצפה.'
  plain:
    title: 'רק טקסט'
    description: 'הפילטר מחזיר מחרוזת ללא סמלים, לשימוש בתכונה של כותרת או לייצוא. שם פורמט שהוא לא מכיר נלקח כפטטר גולמי של ICU, שזה הפתרון כשפורמטים שמיים אין להם את הצורה שאתה צריך.'
offset:
  now: 'רגע לפני'
  minutes: 'חמש דקות'
  hours: 'שלוש שעות'
  days: יומיים
  months: 'ארבעה חודשים'
  years: 'שלוש שנים'
  future: 'בעוד שעתיים'
live:
  server: 'מוצג על ידי Twig, מתעדכן על ידי השירות הקדמי:'
  vue: 'מוצג על ידי Vue:'
plain:
  filter: "| date_format('date_long')"
  pattern: '| date_format("EEEE d MMMM, ''שבוע'' w")'
