article:
  toc:
    label: 'Bu makalede'
  title: 'Tasarım tokenlarını anlama'
  intro: 'Tasarım tokenları, bir ürün üzerindeki görsel kararlar için tek gerçek kaynakdır. Renk, boşluk, tipografi ve hareketi adlandırılmış değişkenlere kodlayarak bileşenlerin tüketmesini sağlar.'
  section_one:
    title: 'Tokenlar neden önemlidir'
    body_one: 'Tokenlar olmadan, birincil marka renginde bir değişiklik yapmak yüzlerce dosyada avlanmayı gerektirir. Tokenlar ile, bir değişken güncellemesi her yere yayılır — butonlardan uyarılara, navigasyon çubuklarına kadar.'
    body_two: "Tokenlar ayrıca tasarım araçları ile kod arasındaki boşluğu kapatır. Bir tasarımcı Figma'da bir rengi <strong>surface-brand</strong> olarak adlandırır; bir geliştirici CSS'de <code>var(--surface-brand)</code> kullanır. Aynı dili konuşuyorlar."
  section_two:
    title: 'Pratik örnekler'
    body: 'Arka plana, bir kenarlığa ve metne ihtiyaç duyan bir bileşeni düşünün. <code>#1a56db</code>, <code>#e1effe</code> ve <code>#1e429f</code> gibi sabit kodlama yerine, bileşen <code>--color-primary</code>, <code>--surface-primary-subtle</code> ve <code>--text-primary-strong</code> referansını kullanır. Marka geliştiğinde, palet değişir — bileşen değişmez.'
  list_title: 'Token kategorileri'
  list:
    - 'Renk — marka, anlamsal ve nötr paletler'
    - "Boşluk — 2px'den 64px'e kadar tutarlı bir ölçek"
    - 'Tipografi — yazı tipi boyutları, ağırlıkları ve satır yükseklikleri'
    - 'Kenar yarıçapı — keskin köşelerden tamamen yuvarlaklara'
    - 'Gölge — derinlik ve hiyerarşi için yükseklik seviyeleri'
    - 'Hareket — yumuşatma eğrileri ve süre adımları'
  quote: 'İnternette bulunan alıntıların çoğu muhtemelen bir yapay zeka tarafından oluşturulmuştur.'
  quote_author: 'Albert Einstein'
  cta: 'Tam token referansını okuyun'
media:
  alt: 'Metinle birlikte yer tutucu görsel'
  caption: 'Düzenin üçte birini kaplayan görsel.'
  body_one: 'Bir resmi ve metni yan yana yerleştirmek için content--media kullanın. Görsel genişliğin üçte birini, metin ise iki üçte birini alır.'
  body_two: 'Bu düzen, alıntılar, illüstrasyonlu tanımlar veya resmin metni domine etmeden desteklediği herhangi bir kısa editoryal blok için uygundur.'
