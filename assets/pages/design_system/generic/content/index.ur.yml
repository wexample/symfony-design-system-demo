~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: مواد
page_icon: 'ph:bold/article'
intro: 'الفاظ، تصاویر اور اقدار، اور ان کے درمیان کا تال۔ ان صفحات کی مشترک خصوصیت یہ ہے کہ یہ کسی شخص کی پڑھائی کے لیے کچھ ترتیب دیتے ہیں، نہ کہ علاقوں کو ترتیب دیتے ہیں یا ریکارڈ کی فہرست بناتے ہیں۔'
page:
  composition:
    title: ترکیب
    description: 'نثر کا ایک صفحہ جیسا کہ اسے پڑھنا چاہیے: مضامین، ان کے ارد گرد متن کے ساتھ تصاویر، ڈراپ کیپس، میٹا بارز۔'
  media:
    title: میڈیا
    description: 'تصاویر اور ایمبیڈز کو ایک شکل میں رکھا گیا: پہلو کے تناسب، اوورلے، اور وہ جگہ دار جو اس وقت کھڑی ہوتی ہے جب کچھ لوڈ نہ ہو۔'
  dates:
    title: تاریخیں
    description: 'ایک ایسا الفاظ کا ذخیرہ جو ٹوئگ اور براؤزر دونوں کے ذریعہ ایک جیسا سمجھا جاتا ہے، اور تاریخیں جو خود کو سچ رکھتی ہیں جب صفحہ کھلا رہتا ہے۔'
  graph_log:
    title: 'گراف لاگ'
    description: 'رنگین راستوں پر اشیاء ان کی شاخوں اور ملنے کے ساتھ: ایک git تاریخ، یا کچھ بھی جو شاخ بناتا ہے۔'
  console:
    title: کنسول
    description: 'جو کچھ ایک شیل نے پرنٹ کیا، صفحے میں دوبارہ پڑھا گیا، اور لائنیں جیسے ہی آتی ہیں شامل کی جاتی ہیں۔'
  timeline:
    title: 'ٹائم لائن'
    description: 'ایک کے نیچے ایک قدم یا واقعات نشانوں پر ایک لائن کے ساتھ جڑے ہوئے، ہر ایک اپنی ضرورت کے مطابق جو بھی رکھتا ہے۔'
