    frame:
      title: Bingkai
      description: 'Sebuah gambar dalam bingkainya, dari server dengan media() atau sebagai komponen vue media: sebuah tautan saat mengarah ke suatu tempat, sebuah keterangan di bagian bawahnya, dan efek bersinar saat memuat atau ketika tidak ada.'
    wall:
