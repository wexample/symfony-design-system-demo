    shapes:
      title: Forme
    overlay:
      title: Sovrapposizione
    aspect_ratio:
      title: "Rapporto d'aspetto"
    document:
      title: 'Documento incorporato'
      description: 'Un iframe riempie la sua casella, quindi la casella determina la dimensione: un modificatore di rapporto, o media--fill per prendere qualsiasi altezza fornita dal genitore.'
    frame:
      title: Cornice
      description: "Un'immagine nella sua cornice, dal server con media() o come componente vue media: un link quando porta da qualche parte, una didascalia sopra il suo piede, e un bagliore mentre si carica o quando non ce n'è."
