  page_icon: 'ph:bold/image'
  section:
    vue:
      title: व्यू
      description: 'व्यू आंशिक के समान फ्रेम, एक दस्तावेज़ के लिए जिसका पता केवल पृष्ठ के चलने पर जाना जाता है।'
    shapes:
      title: आकृतियाँ
    overlay:
      title: ओवरले
    aspect_ratio:
      title: 'आस्पेक्ट रेशियो'
    document:
      title: 'एम्बेडेड दस्तावेज़'
      description: 'एक आईफ्रेम अपने बॉक्स को भरता है, इसलिए बॉक्स आकार लेता है: एक अनुपात संशोधक, या मीडिया--फिल जो माता-पिता द्वारा दिए गए किसी भी ऊँचाई को लेता है।'
    frame:
      title: फ्रेम
      description: 'एक तस्वीर अपने फ्रेम में, सर्वर से media() के साथ या मीडिया व्यू घटक के रूप में: एक लिंक जब यह कहीं ले जाती है, उसके पैर पर एक कैप्शन, और जब यह लोड हो रहा हो या जब कुछ न हो तो एक चमक।'
    wall:
      title: 'मोज़ेक'
      description: 'हर ऊँचाई की तस्वीरें बगैर किसी खाली जगह के एक साथ पैक की गई हैं, प्रत्येक अपनी अनुपात के अनुसार ऊँची, कॉलम कमरे की क्षमता के अनुसार: wall() इसे सर्वर से खींचता है, आकार css/shapes/wall है।'
    wall_vue:
      title: 'एक संग्रह की दीवार'
      description: 'वही दीवार जो संस्थाओं के संग्रह के रूप में है, एक समय में एक पृष्ठ api से पढ़ी जाती है जब इसे स्क्रॉल किया जाता है: अगला पृष्ठ दीवार के पैर तक पहुँचने से पहले आता है।'
    crop:
      title: क्रॉप
      description: 'किस भाग की छवि को रखना है, छवि पर चुना गया: क्षेत्र चलता है, एक कोना इसे आकार देता है, तीर इसे स्थानांतरित करते हैं और Shift के साथ आकार देते हैं। यह छवि के अपने पिक्सेल में कहा जाता है - जो सर्वर द्वारा काटा गया है - और crop() इसे यहाँ काटता है जब कट भेजा जाता है। एक अनुपात इसे पकड़ता है (1 एक पोर्ट्रेट के लिए, गोल दिखाया गया), या यह स्वतंत्र है, जैसे एक हस्ताक्षर की आवश्यकता होती है।'
  document:
    title: 'प्लेसहोल्डर दस्तावेज़'
  wall:
    caption: 'उसके पैर पर एक कैप्शन'

id:
