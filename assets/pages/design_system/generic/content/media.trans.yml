ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 미디어
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: 뷰
      description: '페이지가 실행될 때 주소가 알려지는 문서에 대한 vue 부분과 동일한 프레임입니다.'
    shapes:
      title: 도형
    overlay:
      title: 오버레이
    aspect_ratio:
      title: 종횡비
    document:
      title: '임베디드 문서'
      description: 'iframe은 자신의 박스를 채우므로 박스가 크기를 가집니다: 비율 수정자 또는 부모가 제공하는 높이를 가져오는 미디어--채우기입니다.'
    frame:
      title: 프레임
      description: '서버에서 media()를 통해 또는 미디어 Vue 컴포넌트로 가져온 프레임에 있는 사진: 링크가 있을 경우 해당 링크로 이동하고, 하단에 캡션이 있으며, 로딩 중이거나 이미지가 없을 때 빛나는 효과가 있습니다.'
    wall:
      title: '모자이크'
      description: '구멍 없이 나란히 배치된 다양한 높이의 사진들, 각 사진은 비율에 맞게 높이가 조정되며, 방의 크기에 맞춰 열이 배치됩니다: wall()은 서버에서 가져오고, 모양은 css/shapes/wall입니다.'
    wall_vue:
      title: '컬렉션의 벽'
      description: '엔터티의 컬렉션으로서의 동일한 벽, 스크롤할 때마다 API에서 한 페이지씩 읽어옵니다: 다음 페이지는 벽의 하단에 도달하기 전에 표시됩니다.'
    crop:
      title: 자르기
      description: '이미지에서 유지할 부분, 이미지 위에서 선택됩니다: 영역이 이동하고, 코너로 크기가 조정되며, 화살표로 이동하고 Shift와 함께 크기를 조정합니다. 이는 이미지의 픽셀로 표시됩니다 — 서버가 잘라내는 부분 — 그리고 crop()은 잘라낸 부분이 전송될 때 여기를 잘라냅니다. 비율이 유지됩니다 (인물 사진의 경우 1, 둥글게 표시됨), 아니면 서명처럼 자유롭게 조정됩니다.'
  document:
    title: '플레이스홀더 문서'
  wall:
    caption: '하단에 캡션'

nl:
