    shapes:
      title: 図形
    overlay:
      title: オーバーレイ
    aspect_ratio:
      title: アスペクト比
    document:
      title: 埋め込みドキュメント
      description: iframeは自分のボックスを満たすため、ボックスがサイズを持ちます：比率修正子、または親が与える高さを取得するためのmedia--fill。
    frame:
      title: フレーム
      description: 'サーバーからのmedia()やmedia vueコンポーネントとしてのフレーム内の画像：どこかにリンクする場合はリンク、足元にキャプション、読み込んでいる間や何もないときに光る。'
    wall:
      title: 'モザイク'
      description: 隙間なく横に並んだ様々な高さの画像、それぞれはその比率に従った高さを持ち、部屋が許す限りの列：wall()がサーバーから描画し、形状はcss/shapes/wall。
