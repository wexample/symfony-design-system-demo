en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Media
  page_icon: ph:bold/image

  section:
    vue:
      title: Vue
      description: "The same frame as a vue partial, for a document whose address is only known once the page runs."
    shapes:
      title: Shapes
    overlay:
      title: Overlay
    aspect_ratio:
      title: Aspect Ratio
    document:
      title: Embedded document
      description: "An iframe fills its box, so the box carries the size: a ratio modifier, or media--fill to take whatever height the parent gives."
    frame:
      title: Frame
      description: "A picture in its frame, from the server with media() or as the media vue component: a link when it leads somewhere, a caption over its foot, and a glow while it loads or when there is none."
    wall:
      title: Wall
      description: "Pictures of every height packed side by side with no holes, each as tall as its ratio says, the columns as many as the room takes: wall() draws it from the server, the shape is css/shapes/wall."
    wall_vue:
      title: Wall of a collection
      description: "The same wall as a collection of entities, read from the api a page at a time as it is scrolled: the next page comes before the foot of the wall is reached."
    crop:
      title: Crop
      description: "What part of an image to keep, chosen over the image: the area moves, a corner sizes it, the arrows move it and with Shift size it. It is said in the image's own pixels — what a server crops by — and crop() cuts it here when the cut is sent instead. A ratio holds it (1 for a portrait, shown round), or it is free, as a signature needs."

  document:
    title: Placeholder document

  wall:
    caption: A caption over its foot

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'وسائل الإعلام'
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: فيو
      description: 'نفس الإطار كجزء من فيو، لوثيقة عنوانها معروف فقط عند تشغيل الصفحة.'
    shapes:
      title: أشكال
    overlay:
      title: تراكب
    aspect_ratio:
      title: 'نسبة العرض إلى الارتفاع'
    document:
      title: 'وثيقة مضمّنة'
      description: 'تملأ iframe صندوقها، لذا يحمل الصندوق الحجم: معدل تعديل النسبة، أو وسائط--تملأ لتأخذ أي ارتفاع يمنحه الوالد.'
    frame:
      title: إطار
      description: 'صورة في إطارها، من الخادم باستخدام media() أو كمكون media vue: رابط عندما يؤدي إلى مكان ما، وعنوان أسفل الصورة، وتوهج أثناء التحميل أو عندما لا يوجد شيء.'
    wall:
      title: 'فسيفساء'
      description: 'صور بكل ارتفاعات متراصة جنبًا إلى جنب بلا فراغات، كل منها بارتفاع يتناسب مع نسبته، والأعمدة بقدر ما يتسع له المكان: wall() يرسمها من الخادم، الشكل هو css/shapes/wall.'
    wall_vue:
      title: 'جدار مجموعة'
      description: 'نفس الجدار كمجموعة من الكيانات، تُقرأ من واجهة برمجة التطبيقات صفحة واحدة في كل مرة أثناء التمرير: الصفحة التالية تأتي قبل الوصول إلى أسفل الجدار.'
    crop:
      title: قص
      description: 'أي جزء من الصورة يجب الاحتفاظ به، مُختار فوق الصورة: المنطقة تتحرك، وزاوية تعيد تشكيلها، والأسهم تحركها ومع Shift تعيد تشكيلها. يُقال ذلك ببكسلات الصورة نفسها - ما يقطعه الخادم - و crop() تقطعها هنا عندما يتم إرسال القطع بدلاً من ذلك. نسبة تحملها (1 للعرض، تظهر بشكل دائري)، أو إنها حرة، كما تحتاج التوقيع.'
  document:
    title: 'وثيقة نموذجية'
  wall:
    caption: 'عنوان أسفل الصورة'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: মিডিয়া
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: ভিউ
      description: 'একটি ভিউ পার্টিয়ালের মতো একই ফ্রেম, একটি নথির জন্য যার ঠিকানা পৃষ্ঠা চলার সময়ই জানা যায়।'
    shapes:
      title: আকৃতি
    overlay:
      title: ওভারলে
    aspect_ratio:
      title: 'আকৃতির অনুপাত'
    document:
      title: 'এম্বেডেড নথি'
      description: 'একটি আইফ্রেম তার বাক্স পূর্ণ করে, তাই বাক্সটি আকার বহন করে: একটি অনুপাত সংশোধক, অথবা মিডিয়া--যা কিছু উচ্চতা প্যারেন্ট দেয় তা গ্রহণ করতে।'
    frame:
      title: ফ্রেম
      description: 'সার্ভার থেকে media() বা মিডিয়া ভিউ কম্পোনেন্টের মাধ্যমে একটি ফ্রেমে একটি ছবি: এটি কোথাও নিয়ে গেলে একটি লিঙ্ক, এর পায়ের উপরে একটি ক্যাপশন এবং এটি লোড হওয়ার সময় বা কিছু না থাকলে একটি ঝলক।'
    wall:
      title: 'মোজাইক'
      description: 'প্রতি উচ্চতার ছবি একসাথে কোনো ফাঁক ছাড়াই রাখা হয়েছে, প্রতিটি তার অনুপাত অনুযায়ী উচ্চ, কOLUMN সংখ্যা ঘরের আকার অনুযায়ী: wall() এটি সার্ভার থেকে আঁকে, আকারটি css/shapes/wall।'
    wall_vue:
      title: 'একটি সংগ্রহের দেয়াল'
      description: 'একটি সত্তার সংগ্রহের মতো একই দেয়াল, API থেকে এক সময়ে একটি পৃষ্ঠা পড়া হয় যখন এটি স্ক্রোল করা হয়: পরবর্তী পৃষ্ঠা দেয়ালের পায়ের কাছে পৌঁছানোর আগে আসে।'
    crop:
      title: কাটা
      description: 'একটি ছবির কোন অংশ রাখা হবে, ছবির উপর নির্বাচন করা: এলাকা স্থানান্তরিত হয়, একটি কোণ এটিকে আকার দেয়, তীরগুলি এটি সরিয়ে নেয় এবং Shift দিয়ে আকার দেয়। এটি ছবির নিজস্ব পিক্সেলে বলা হয় — সার্ভার যা কেটে দেয় — এবং crop() এটি এখানে কেটে দেয় যখন কাটা পাঠানো হয়। একটি অনুপাত এটি ধরে (একটি পোর্ট্রেটের জন্য 1, বৃত্তাকার দেখানো হয়), অথবা এটি মুক্ত, যেমন একটি স্বাক্ষরের প্রয়োজন।'
  document:
    title: 'প্লেসহোল্ডার নথি'
  wall:
    caption: 'এর পায়ের উপরে একটি ক্যাপশন'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Medien
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: Vue
      description: 'Der gleiche Rahmen wie ein Vue-Partial, für ein Dokument, dessen Adresse erst bekannt ist, wenn die Seite geladen wird.'
    shapes:
      title: Formen
    overlay:
      title: Überlagerung
    aspect_ratio:
      title: Seitenverhältnis
    document:
      title: 'Eingebettetes Dokument'
      description: 'Ein iframe füllt seinen Bereich, daher bestimmt der Bereich die Größe: ein Verhältnis-Modifikator oder media--fill, um die Höhe zu übernehmen, die der Elternteil vorgibt.'
    frame:
      title: Rahmen
      description: 'Ein Bild in seinem Rahmen, vom Server mit media() oder als das Media Vue-Komponente: ein Link, wenn es irgendwohin führt, eine Beschriftung über seinem Fuß und ein Leuchten während des Ladens oder wenn es keines gibt.'
    wall:
      title: 'Mosaik'
      description: 'Bilder jeder Höhe, nebeneinander gepackt, ohne Lücken, jedes so hoch wie es das Verhältnis sagt, die Spalten so viele wie der Raum zulässt: wall() zieht es vom Server, die Form ist css/shapes/wall.'
    wall_vue:
      title: 'Wand einer Sammlung'
      description: 'Die gleiche Wand wie eine Sammlung von Entitäten, die über die API seitenweise gelesen wird, während sie gescrollt wird: die nächste Seite kommt, bevor der Fuß der Wand erreicht ist.'
    crop:
      title: Zuschneiden
      description: 'Welchen Teil eines Bildes beibehalten werden soll, über das Bild gewählt: der Bereich bewegt sich, eine Ecke ändert die Größe, die Pfeile bewegen es und mit Shift wird die Größe geändert. Es wird in den eigenen Pixeln des Bildes angegeben — wonach ein Server zuschneidet — und crop() schneidet es hier, wenn der Schnitt stattdessen gesendet wird. Ein Verhältnis hält es (1 für ein Porträt, rund dargestellt), oder es ist frei, wie es eine Unterschrift benötigt.'
  document:
    title: Platzhalter-Dokument
  wall:
    caption: 'Eine Beschriftung über seinem Fuß'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Medios
  page_icon: 'ph:bold/imagen'
  section:
    vue:
      title: Vue
      description: 'El mismo marco que un parcial de vue, para un documento cuyo dirección solo se conoce una vez que la página se ejecuta.'
    shapes:
      title: Formas
    overlay:
      title: Superposición
    aspect_ratio:
      title: 'Relación de aspecto'
    document:
      title: 'Documento incrustado'
      description: 'Un iframe llena su caja, por lo que la caja tiene el tamaño: un modificador de relación, o media--fill para tomar la altura que el padre proporciona.'
    frame:
      title: Marco
      description: 'Una imagen en su marco, desde el servidor con media() o como el componente vue de medios: un enlace cuando lleva a algún lugar, un pie de foto en su base, y un resplandor mientras se carga o cuando no hay ninguno.'
    wall:
      title: 'Mosaico'
      description: 'Imágenes de todas las alturas empaquetadas lado a lado sin huecos, cada una tan alta como lo indica su proporción, las columnas tantas como el espacio lo permita: wall() lo dibuja desde el servidor, la forma es css/shapes/wall.'
    wall_vue:
      title: 'Pared de una colección'
      description: 'La misma pared que una colección de entidades, leída desde la api una página a la vez a medida que se desplaza: la próxima página aparece antes de que se alcance el pie de la pared.'
    crop:
      title: Recortar
      description: 'Qué parte de una imagen conservar, elegida sobre la imagen: el área se mueve, una esquina la dimensiona, las flechas la mueven y con Shift la dimensionan. Se expresa en los propios píxeles de la imagen — lo que un servidor recorta — y crop() lo corta aquí cuando el corte se envía en su lugar. Una proporción lo mantiene (1 para un retrato, mostrado redondeado), o es libre, como necesita una firma.'
  document:
    title: 'Documento de marcador de posición'
  wall:
    caption: 'Un pie de foto en su base'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: رسانه
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: ویو
      description: 'فریم مشابهی به عنوان یک بخش ویو، برای یک سند که آدرس آن تنها زمانی که صفحه اجرا می‌شود شناخته می‌شود.'
    shapes:
      title: اشکال
    overlay:
      title: پوشش
    aspect_ratio:
      title: 'نسبت ابعاد'
    document:
      title: 'سند جاسازی شده'
      description: 'یک iframe فضای خود را پر می‌کند، بنابراین فضای آن اندازه را به همراه دارد: یک اصلاح کننده نسبت یا رسانه--پر برای دریافت هر ارتفاعی که والد می‌دهد.'
    frame:
      title: قاب
      description: 'تصویری در قاب خود، از سرور با media() یا به عنوان کامپوننت vue رسانه: یک لینک وقتی که به جایی هدایت می‌کند، یک زیرنویس در پایین آن، و در حین بارگذاری یا زمانی که چیزی وجود ندارد، درخشش.'
    wall:
      title: 'موزاییک'
      description: 'تصاویر با ارتفاع‌های مختلف که کنار هم بدون فاصله چیده شده‌اند، هرکدام به اندازه نسبت خود بلند هستند، ستون‌ها به اندازه فضای اتاق: wall() آن را از سرور می‌کشد، شکل آن css/shapes/wall است.'
    wall_vue:
      title: 'دیوار یک مجموعه'
      description: 'همان دیوار به عنوان یک مجموعه از موجودیت‌ها، که از api به صورت صفحه به صفحه خوانده می‌شود در حین اسکرول: صفحه بعدی قبل از رسیدن به پایین دیوار می‌آید.'
    crop:
      title: برش
      description: 'کدام قسمت از یک تصویر نگه‌داشته شود، انتخاب شده بر روی تصویر: ناحیه حرکت می‌کند، یک گوشه آن را اندازه می‌گیرد، فلش‌ها آن را جابه‌جا می‌کنند و با Shift اندازه آن را تغییر می‌دهند. این در پیکسل‌های خود تصویر گفته می‌شود — آنچه که یک سرور برش می‌دهد — و crop() آن را اینجا برش می‌زند وقتی که برش ارسال می‌شود. یک نسبت آن را نگه می‌دارد (1 برای پرتره، به صورت گرد نمایش داده می‌شود)، یا آزاد است، همان‌طور که یک امضا نیاز دارد.'
  document:
    title: 'سند جایگزین'
  wall:
    caption: 'زیرنویسی در پایین آن'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Media
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: Vue
      description: 'Sama kehys kuin vue-osassa, asiakirjalle, jonka osoite tiedetään vain sivun suorittaessa.'
    shapes:
      title: Muodot
    overlay:
      title: Peitto
    aspect_ratio:
      title: Kuvasuhde
    document:
      title: 'Upotettu asiakirja'
      description: 'Iframe täyttää laatikkonsa, joten laatikko määrittää koon: suhteen muokkaaja tai media--fill ottaakseen minkä tahansa korkeuden, jonka vanhempi antaa.'
    frame:
      title: Kehys
      description: 'Kuva kehyksessään, palvelimelta media() tai media vue -komponenttina: linkki kun se vie johonkin, kuvateksti jalassa, ja hehku ladattaessa tai kun kuvaa ei ole.'
    wall:
      title: 'Mosaiikki'
      description: 'Kuvia eri korkeuksilla pakattuna vierekkäin ilman aukkoja, jokainen niin korkea kuin sen suhde sanoo, sarakkeita niin monta kuin huone sallii: wall() piirtää sen palvelimelta, muoto on css/shapes/wall.'
    wall_vue:
      title: 'Kokoelman seinä'
      description: 'Sama seinä kokoelmana entiteettejä, luetaan api:sta sivu kerrallaan kun sitä vieritetään: seuraava sivu tulee ennen kuin seinän jalka saavutetaan.'
    crop:
      title: Rajaa
      description: 'Mikä osa kuvasta pidetään, valitaan kuvan päältä: alue liikkuu, kulma muuttaa kokoa, nuolet liikuttavat sitä ja Shift muuttaa kokoa. Se kerrotaan kuvan omissa pikseleissä — mitä palvelin rajaa — ja crop() leikkaa sen täältä kun leikkaus lähetetään sen sijaan. Suhde pitää sitä (1 muotokuvaksi, näytetään pyöreänä), tai se on vapaa, kuten allekirjoitus tarvitsee.'
  document:
    title: 'Paikkamerkki asiakirja'
  wall:
    caption: 'Kuvateksti jalassa'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Médias'
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: Vue
      description: "Le même cadre qu'un fragment vue, pour un document dont l'adresse n'est connue qu'une fois la page exécutée."
    shapes:
      title: Formes
    overlay:
      title: Superposition
    aspect_ratio:
      title: 'Proportions'
    document:
      title: 'Document intégré'
      description: 'Un iframe remplit sa boîte, donc la boîte porte la taille : un modificateur de ratio, ou media--fill pour prendre la hauteur que le parent donne.'
    frame:
      title: Cadre
      description: "Une image dans son cadre, rendue par le serveur avec media() ou par le composant vue media : un lien quand elle mène quelque part, une légende sur son pied, et une lueur pendant qu'elle charge ou quand il n'y en a pas."
    wall:
      title: 'Mosaïque'
      description: "Des images de toutes hauteurs serrées côte à côte sans trou, chacune aussi haute que son ratio le dit, autant de colonnes que la place en prend : wall() le rend côté serveur, la forme est css/shapes/wall."
    wall_vue:
      title: 'Mosaïque d''une collection'
      description: "Le même mur pour une collection d'entités, lue dans l'api une page à la fois au fil du défilement : la page suivante arrive avant que le pied du mur soit atteint."
    crop:
      title: Recadrage
      description: "Quelle partie d'une image garder, choisie sur l'image : la zone se déplace, un coin la redimensionne, les flèches la déplacent et avec Maj la redimensionnent. Elle est donnée en pixels de l'image — ce par quoi un serveur recadre — et crop() la découpe ici quand c'est la découpe qui est envoyée. Un ratio la tient (1 pour un portrait, affiché rond), ou elle est libre, comme pour une signature."
  document:
    title: 'Document de remplacement'
  wall:
    caption: 'Une légende sur son pied'

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: מדיה
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: Vue
      description: 'אותו מסגרת כמו חלק של Vue, עבור מסמך שהכתובת שלו ידועה רק כאשר הדף רץ.'
    shapes:
      title: צורות
    overlay:
      title: למעלה
    aspect_ratio:
      title: 'יחס גובה-רוחב'
    document:
      title: 'מסמך משולב'
      description: 'iframe ממלא את הקופסה שלו, כך שהקופסה נושאת את הגודל: שינוי יחס, או מדיה--מלא כדי לקחת כל גובה שההורה נותן.'
    frame:
      title: מסגרת
      description: 'תמונה בתוך מסגרת, מהשרת עם media() או כקומפוננטת vue למדיה: קישור כשזה מוביל למקום כלשהו, כיתוב מעל הרגל שלה, וזוהר בזמן שהיא נטענת או כשאין אף אחת.'
    wall:
      title: 'פסיפס'
      description: 'תמונות בכל גובה ארוזות זו לצד זו בלי חורים, כל אחת בגובה שהיחס שלה אומר, העמודות רבות כמו שהחדר מכיל: wall() מצייר את זה מהשרת, הצורה היא css/shapes/wall.'
    wall_vue:
      title: 'קיר של אוסף'
      description: 'אותו קיר כמו אוסף של ישויות, נקרא מה-api עמוד אחד בכל פעם כשזה גולל: העמוד הבא מגיע לפני שהרגל של הקיר מושגת.'
    crop:
      title: גזירה
      description: 'איזה חלק מתמונה לשמור, נבחר מעל התמונה: האזור זז, פינה משנה את גודלו, החצים זזים ועימם משנה את הגודל. זה נאמר בפיקסלים של התמונה עצמה — מה ששרת גוזר על פי — ו-crop() גוזר את זה כאן כשחתך נשלח במקום. יחס מחזיק את זה (1 לפורטרט, מוצג עגול), או שזה חופשי, כפי שחתימה דורשת.'
