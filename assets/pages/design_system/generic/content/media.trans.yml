    shapes:
      title: Фигуры
    overlay:
      title: Накладка
    aspect_ratio:
      title: 'Соотношение сторон'
    document:
      title: 'Встроенный документ'
      description: 'Iframe заполняет свою область, поэтому область определяет размер: модификатор соотношения, или media--fill для того, чтобы занять любую высоту, которую дает родитель.'
    frame:
      title: Рамка
      description: 'Картина в рамке, с сервера с media() или как компонент media vue: ссылка, когда она куда-то ведет, подпись внизу и свечение во время загрузки или когда изображения нет.'
    wall:
      title: 'Мозаика'
      description: 'Картины разной высоты, упакованные рядом без пробелов, каждая такой высоты, какой требует её соотношение, количество колонн зависит от размера комнаты: wall() рисует её с сервера, форма — css/shapes/wall.'
    wall_vue:
      title: 'Стена коллекции'
      description: 'Та же стена, что и коллекция сущностей, считываемая из api по одной странице за раз при прокрутке: следующая страница появляется до того, как будет достигнут конец стены.'
    crop:
      title: Обрезка
      description: 'Какую часть изображения сохранить, выбирая её на изображении: область перемещается, угол изменяет размер, стрелки перемещают её, а с Shift — изменяют размер. Это определяется собственными пикселями изображения — по которым сервер обрезает — и crop() обрезает её здесь, когда обрезка отправляется. Соотношение удерживает её (1 для портрета, отображается круглым), или оно свободно, как требуется для подписи.'
  document:
    title: Документ-заполнитель
  wall:
    caption: 'Подпись внизу'

th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: สื่อ
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: Vue
      description: 'กรอบเดียวกันกับส่วน vue สำหรับเอกสารที่ที่อยู่จะถูกทราบเมื่อหน้าเว็บทำงานแล้วเท่านั้น.'
    shapes:
      title: รูปทรง
    overlay:
      title: Overlay
    aspect_ratio:
      title: อัตราส่วนภาพ
    document:
      title: เอกสารฝัง
      description: 'iframe จะเติมเต็มกล่องของมัน ดังนั้นกล่องจึงมีขนาด: ตัวปรับอัตราส่วน หรือสื่อ--เติมเต็มเพื่อรับความสูงที่พ่อแม่กำหนดให้.'
    frame:
      title: กรอบ
      description: 'ภาพในกรอบของมัน จากเซิร์ฟเวอร์ด้วย media() หรือในฐานะคอมโพเนนต์ media vue: ลิงก์เมื่อมันนำไปที่ใดที่หนึ่ง, คำบรรยายเหนือฐาน, และแสงระยิบระยับขณะโหลดหรือเมื่อไม่มีภาพ.'
    wall:
      title: 'โมเสก'
      description: 'ภาพทุกขนาดที่เรียงข้างกันไม่มีช่องว่าง, แต่ละภาพสูงตามอัตราส่วนที่บอก, จำนวนคอลัมน์มีตามที่ห้องรองรับ: wall() วาดมันจากเซิร์ฟเวอร์, รูปทรงเป็น css/shapes/wall.'
    wall_vue:
      title: ผนังของคอลเลกชัน
      description: 'ผนังเดียวกันกับคอลเลกชันของเอนทิตี, อ่านจาก api หน้าละหนึ่งครั้งขณะที่เลื่อน: หน้าถัดไปจะมาถึงก่อนที่จะถึงฐานของผนัง.'
    crop:
      title: ตัด
      description: 'ส่วนใดของภาพที่จะเก็บไว้, เลือกจากภาพ: พื้นที่เคลื่อนที่, มุมขนาดมัน, ลูกศรเคลื่อนที่และขนาดมันด้วย Shift. มันถูกกล่าวในพิกเซลของภาพเอง — สิ่งที่เซิร์ฟเวอร์ตัด — และ crop() ตัดมันที่นี่เมื่อการตัดถูกส่งแทน. อัตราส่วนถือมัน (1 สำหรับภาพบุคคล, แสดงเป็นวงกลม), หรือมันเป็นอิสระ, ตามที่ลายเซ็นต้องการ.'
  document:
    title: เอกสารตัวอย่าง
  wall:
    caption: คำบรรยายเหนือฐาน

tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Medya
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: Vue
      description: 'Sayfa çalıştığında adresi ancak bilinen bir belge için vue parçasıyla aynı çerçeve.'
    shapes:
      title: Şekiller
    overlay:
      title: Katman
    aspect_ratio:
      title: 'Görüntü Oranı'
    document:
      title: 'Gömülü belge'
      description: 'Bir iframe kutusunu doldurur, bu nedenle kutu boyutu taşır: bir oran değiştiricisi veya ana belgenin verdiği yüksekliği almak için medya--doldur.'
    frame:
      title: Çerçeve
      description: 'Sunucudan media() ile veya medya vue bileşeni olarak çerçevesindeki bir resim: bir yere giden bir bağlantı, altına bir başlık ve yüklenirken veya hiç yokken bir parıltı.'
    wall:
      title: 'Mozaik'
      description: "Her yüksekliğe sahip resimler, yan yana ve boşluk olmadan paketlenmiş, her biri oranına göre yüksek, odanın alabileceği kadar sütun: wall() bunu sunucudan çizer, şekil css/shapes/wall'dır."
    wall_vue:
      title: 'Bir koleksiyonun duvarı'
      description: "Bir varlık koleksiyonu olarak aynı duvar, api'den bir sayfa olarak okunur, kaydırıldıkça: bir sonraki sayfa duvarın altına ulaşmadan gelir."
    crop:
      title: Kırp
      description: 'Bir görüntünün hangi kısmının korunacağını seçme: alan hareket eder, bir köşe boyutlandırır, oklar hareket ettirir ve Shift ile boyutlandırır. Sunucunun kırptığı görüntünün kendi pikselleriyle ifade edilir — crop() burada kesim gönderildiğinde keser. Bir oran onu tutar (portre için 1, yuvarlak gösterilir) veya serbesttir, bir imza gibi gerekir.'
  document:
    title: 'Yer Tutucu belge'
  wall:
    caption: 'Altında bir başlık'

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: میڈیا
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: ویو
      description: 'اسی فریم میں ایک ویو پارشل کے طور پر، ایک دستاویز کے لیے جس کا پتہ صرف اس وقت معلوم ہوتا ہے جب صفحہ چلتا ہے۔'
    shapes:
      title: اشکال
    overlay:
      title: اوورلے
    aspect_ratio:
      title: 'تناسبِ ابعاد'
    document:
      title: 'مربوط دستاویز'
      description: 'ایک iframe اپنے باکس کو بھر دیتا ہے، اس لیے باکس کا سائز ہوتا ہے: ایک تناسب میں تبدیلی کرنے والا، یا میڈیا--بھرنے کے لیے جو بھی اونچائی والدین فراہم کرے۔'
    frame:
      title: فریم
      description: 'ایک تصویر اپنے فریم میں، سرور سے media() کے ذریعے یا میڈیا vue کمپوننٹ کے طور پر: ایک لنک جب یہ کسی جگہ کی طرف جاتا ہے، اس کے نیچے ایک عنوان، اور جب یہ لوڈ ہو رہا ہو یا جب کوئی نہ ہو تو ایک چمک۔'
    wall:
      title: 'موزیک'
      description: 'ہر اونچائی کی تصاویر ایک دوسرے کے ساتھ بغیر کسی جگہ کے، ہر ایک اپنی تناسب کے مطابق اونچی، کالمز جتنے کمرے میں ہوں: wall() اسے سرور سے کھینچتا ہے، شکل css/shapes/wall ہے۔'
    wall_vue:
      title: 'اجتماع کی دیوار'
      description: 'وہی دیوار جو ہستیوں کے اجتماع کے طور پر ہے، api سے ایک وقت میں ایک صفحہ پڑھا جاتا ہے جوں ہی یہ سکرول ہوتا ہے: اگلا صفحہ دیوار کے پاؤں تک پہنچنے سے پہلے آتا ہے۔'
    crop:
      title: کٹائی
      description: 'تصویر کا کون سا حصہ رکھنا ہے، تصویر پر منتخب کیا جاتا ہے: علاقہ حرکت کرتا ہے، ایک کونا اسے سائز دیتا ہے، تیر اسے حرکت دیتے ہیں اور Shift کے ساتھ سائز دیتے ہیں۔ یہ تصویر کے اپنے پکسلز میں کہا جاتا ہے — جس پر سرور کٹائی کرتا ہے — اور crop() اسے یہاں کٹ دیتا ہے جب کٹ بھیجا جاتا ہے۔ ایک تناسب اسے پکڑتا ہے (پورٹریٹ کے لیے 1، جو گول دکھایا جاتا ہے)، یا یہ آزاد ہے، جیسا کہ ایک دستخط کی ضرورت ہوتی ہے۔'
  document:
    title: 'پلےس ہولڈر دستاویز'
  wall:
    caption: 'اس کے نیچے ایک عنوان'

vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Phương tiện'
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: Vue
      description: 'Khung giống như một phần vue, cho một tài liệu mà địa chỉ chỉ được biết khi trang chạy.'
    shapes:
      title: 'Hình dạng'
    overlay:
      title: 'Lớp phủ'
    aspect_ratio:
      title: 'Tỉ lệ khung hình'
    document:
      title: 'Tài liệu nhúng'
      description: 'Một iframe lấp đầy hộp của nó, vì vậy hộp mang kích thước: một bộ điều chỉnh tỉ lệ, hoặc phương tiện--lấp đầy để lấy bất kỳ chiều cao nào mà cha cung cấp.'
    frame:
      title: Khung
      description: 'Một bức tranh trong khung của nó, từ máy chủ với media() hoặc dưới dạng thành phần vue media: một liên kết khi nó dẫn đến đâu đó, một chú thích ở dưới chân, và một ánh sáng trong khi nó tải hoặc khi không có gì.'
    wall:
      title: 'Lưới ảnh'
      description: 'Những bức tranh có chiều cao khác nhau được xếp cạnh nhau không có khoảng trống, mỗi bức tranh cao như tỉ lệ của nó, số cột nhiều như không gian có: wall() vẽ nó từ máy chủ, hình dạng là css/shapes/wall.'
    wall_vue:
      title: 'Tường của một bộ sưu tập'
      description: 'Tường giống như một bộ sưu tập các thực thể, đọc từ api một trang tại một thời điểm khi nó được cuộn: trang tiếp theo xuất hiện trước khi đạt đến chân của bức tường.'
    crop:
      title: Cắt
      description: 'Phần nào của hình ảnh cần giữ lại, được chọn trên hình ảnh: khu vực di chuyển, một góc điều chỉnh kích thước, các mũi tên di chuyển nó và với Shift điều chỉnh kích thước. Nó được nói bằng chính pixel của hình ảnh — những gì máy chủ cắt theo — và crop() cắt nó ở đây khi việc cắt được gửi thay thế. Một tỉ lệ giữ nó (1 cho chân dung, hiển thị hình tròn), hoặc nó là tự do, như một chữ ký cần.'
  document:
    title: 'Tài liệu mẫu'
  wall:
    caption: 'Một chú thích ở dưới chân'

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 媒体
  page_icon: 'ph:bold/image'
  section:
    vue:
      title: 视图
      description: 与vue局部相同的框架，文档的地址只有在页面运行时才知道。
    shapes:
      title: 形状
    overlay:
      title: 覆盖层
    aspect_ratio:
      title: 宽高比
    document:
      title: 嵌入文档
      description: iframe填充其框，因此框承载大小：一个比例修饰符，或媒体--填充以获取父级提供的任何高度。
    frame:
      title: 框架
      description: '一幅装在框架里的图片，从服务器获取 media() 或作为媒体 Vue 组件：当它链接到某个地方时，显示链接，脚下有说明，加载时或没有内容时有光晕效果。'
    wall:
      title: '图片墙'
      description: '每张高度不同的图片并排紧凑地排列，没有空隙，每张图片的高度与其比例一致，列数根据房间的大小而定：wall() 从服务器绘制，形状为 css/shapes/wall。'
    wall_vue:
      title: 集合的墙壁
      description: '与实体集合相同的墙壁，按页从 API 读取，随着滚动逐页加载：下一页在到达墙底之前就会出现。'
    crop:
      title: 裁剪
      description: '选择保留图像的哪一部分：区域可以移动，角落可以调整大小，箭头可以移动并在按住 Shift 时调整大小。这是用图像自身的像素表示的——服务器根据这些像素进行裁剪——而 crop() 在切割操作发送时会在此处裁剪。一个比例来保持它（竖图为 1，显示为圆形），或者是自由的，就像签名一样。'
  document:
    title: 占位符文档
  wall:
    caption: 脚下的说明
