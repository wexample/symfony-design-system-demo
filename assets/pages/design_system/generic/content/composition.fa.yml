article:
  toc:
    label: 'در این مقاله'
  title: 'درک توکن‌های طراحی'
  intro: 'توکن‌های طراحی منبع حقیقی واحد برای تصمیمات بصری در سراسر یک محصول هستند. آن‌ها رنگ، فاصله، تایپوگرافی و حرکت را به متغیرهای نام‌گذاری شده‌ای که اجزا از آن‌ها استفاده می‌کنند، رمزگذاری می‌کنند.'
  section_one:
    title: 'چرا توکن‌ها اهمیت دارند'
    body_one: 'بدون توکن‌ها، تغییر رنگ اصلی برند نیاز به جستجو در صدها فایل دارد. با توکن‌ها، یک به‌روزرسانی متغیر در همه جا منتشر می‌شود — از دکمه‌ها تا هشدارها تا نوارهای ناوبری.'
    body_two: 'توکن‌ها همچنین شکاف بین ابزارهای طراحی و کد را پر می‌کنند. یک طراح رنگ <strong>surface-brand</strong> را در Figma نام‌گذاری می‌کند؛ یک توسعه‌دهنده از <code>var(--surface-brand)</code> در CSS استفاده می‌کند. آن‌ها به یک زبان صحبت می‌کنند.'
  section_two:
    title: 'مثال‌های عملی'
    body: 'به یک جزئیات فکر کنید که به یک پس‌زمینه، یک حاشیه و متن نیاز دارد. به جای کد زدن <code>#1a56db</code>، <code>#e1effe</code> و <code>#1e429f</code>، جزئیات به <code>--color-primary</code>، <code>--surface-primary-subtle</code> و <code>--text-primary-strong</code> اشاره می‌کند. وقتی برند تغییر می‌کند، پالت تغییر می‌کند — جزئیات تغییر نمی‌کند.'
  list_title: 'دسته‌بندی‌های توکن'
  list:
    - 'رنگ — پالت‌های برند، معنایی و خنثی'
    - 'فاصله — یک مقیاس منسجم از ۲px تا ۶۴px'
    - 'تایپوگرافی — اندازه‌های فونت، وزن‌ها و ارتفاع خط'
    - 'شعاع — از گوشه‌های تیز تا کاملاً گرد'
    - 'سایه — سطوح ارتفاع برای عمق و سلسله مراتب'
    - 'حرکت — منحنی‌های تسهیل و مراحل مدت'
  quote: 'بیشتر نقل‌قول‌های موجود در اینترنت احتمالاً توسط یک هوش مصنوعی تولید شده‌اند.'
  quote_author: 'آلبرت انیشتین'
  cta: 'مرجع کامل توکن را بخوانید'
media:
  alt: 'تصویر موقت در کنار متن'
  caption: 'تصویر occupying یک سوم از طرح.'
  body_one: 'از content--media برای قرار دادن تصویر و متن کنار هم استفاده کنید. تصویر یک سوم عرض را می‌گیرد، متن دو سوم را.'
  body_two: 'این طرح برای نقل‌قول‌های انتخابی، تعاریف مصور، یا هر بلوک ویرایشی کوتاه که تصویر آن را تقویت می‌کند مناسب است بدون اینکه غالب شود.'
dropcap:
  paragraph_one: 'لورم ایپسوم دولور سیت آمت، کنسکتتور آدیپیسینگ الیت. سد دو ایوسمد تمپور ایندیدیدنت اوت لابوره و دولوره ماگنا الیکوا. اوت انیم اد مینیم ونیام، کویس ناسترود اکسرسیتیشن اولامکو لابوریس نیسی اوت علیکیپ اکس ای کامودو کونسیکوآت.'
  paragraph_two: 'دویس آوت ایریوره دولور در رپریهندیت در وولپتات ولت اسه سیلوم دولوره او یوت فاجیت نولا پاریاتور. اکسپتور سینت اوککات کوپیداتات نون پرویدنت، سانت در کلمبا کوی اوفیشا دسرنت موولیت انیم ایست لابوروم.'
