~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: تاریخیں
page_icon: 'ph:bold/clock'
intro: 'فارمیٹ ناموں کا ایک لغت، جسے Twig، سادہ JavaScript اور Vue کے ذریعے یکساں سمجھا جاتا ہے۔ سرور ایک <time> پرنٹ کرتا ہے جو لمحہ اور وہ فارمیٹ ہے جس کی درخواست کی گئی تھی؛ براؤزر اسے اٹھاتا ہے اور جیسے جیسے وقت گزرتا ہے اسے دوبارہ لکھتا ہے، اس طرح کھلا چھوڑا گیا صفحہ کبھی یہ نہیں بتاتا کہ کچھ کب ہوا۔'
section:
  formats:
    title: 'نامی فارمیٹس'
    description: 'مکمل فارمیٹس ICU تاریخ اور وقت کے انداز ہیں، لہذا فیلڈ کا ترتیب اور جداکار قارئین کے مقامی زبان سے متعلق ہے نہ کہ ٹیمپلیٹ سے۔'
  relative:
    title: مناسب
    description: 'فاصلے کو سب سے بڑی اکائی میں شمار کیا جاتا ہے جو اب بھی کچھ بتاتی ہے — منٹ سے ایک گھنٹے تک، گھنٹے سے ایک دن تک، پھر دن، ہفتے، مہینے اور سال۔ ہر الفاظ ایک ترجمہ کی کلید سے آتا ہے۔'
  auto:
    title: خودکار
    description: 'ڈیفالٹ۔ جب تاریخ حالیہ ہو تو پیچھے کی طرف شمار کرتا ہے، اور ایک ہفتے کے بعد کیلنڈر کی تاریخ پر واپس آتا ہے، جہاں "27 ہفتے پہلے" کسی کی مدد نہیں کرتا۔'
  live:
    title: 'تازہ ترین'
    description: 'ایک ہی ٹائمر صفحے پر ہر تاریخ کے لیے کام کرتا ہے، جس رفتار سے دکھائی جانے والی اکائی کی ضرورت ہوتی ہے — "ابھی" کے لیے چند سیکنڈ، "3 مہینے پہلے" کے لیے ایک گھنٹہ۔ اس صفحے کو کھلا چھوڑیں اور دیکھیں۔'
  plain:
    title: 'صرف متن'
    description: 'فلٹر بغیر کسی مارک اپ کے ایک سٹرنگ واپس کرتا ہے، عنوان کی خصوصیت یا برآمد کے لیے۔ ایک فارمیٹ نام جسے یہ نہیں جانتا، اسے ایک خام ICU پیٹرن کے طور پر لیا جاتا ہے، جو اس راستے کی طرف ہے جب نامی فارمیٹس آپ کی ضرورت کے مطابق شکل نہیں رکھتے۔'
offset:
  now: 'کچھ لمحے پہلے'
  minutes: 'پانچ منٹ'
  hours: 'تین گھنٹے'
  days: 'دو دن'
  months: 'چار مہینے'
  years: 'تین سال'
  future: 'دو گھنٹوں میں'
live:
  server: 'Twig کے ذریعے رینڈر کیا گیا، فرنٹ سروس کے ذریعہ تازہ دم کیا گیا:'
  vue: 'Vue کے ذریعے رینڈر کیا گیا:'
plain:
  filter: "| date_format('date_long')"
  pattern: '| date_format("EEEE d MMMM, ''ہفتہ'' w")'
