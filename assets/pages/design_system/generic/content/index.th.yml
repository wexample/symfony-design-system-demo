~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: เนื้อหา
page_icon: 'ph:bold/article'
intro: 'คำ, รูปภาพ และค่า รวมถึงจังหวะระหว่างพวกมัน หน้าที่เหล่านี้มีสิ่งที่เหมือนกันคือการจัดรูปแบบสิ่งที่บุคคลอ่าน แทนที่จะจัดเรียงพื้นที่หรือรายการบันทึก.'
page:
  composition:
    title: การเรียบเรียง
    description: 'หน้าเรียงความที่ควรอ่าน: บทความ, รูปภาพที่มีข้อความล้อมรอบ, ตัวอักษรเริ่มต้น, แถบเมตา.'
  media:
    title: สื่อ
    description: 'รูปภาพและการฝังที่ถูกจัดให้อยู่ในรูปแบบ: อัตราส่วนภาพ, การทับซ้อน, และที่ว่างที่ยืนอยู่ในขณะที่ยังไม่มีการโหลด.'
  dates:
    title: วันที่
    description: 'คำศัพท์หนึ่งชุดของรูปแบบที่เข้าใจในลักษณะเดียวกันโดย Twig และเบราว์เซอร์ และวันที่ที่ยังคงความถูกต้องเมื่อหน้าเปิดอยู่.'
  graph_log:
    title: บันทึกกราฟ
    description: 'รายการบนเลนสีที่มีการแยกและรวม: ประวัติ git หรือสิ่งใดก็ตามที่แตกแขนง.'
  console:
    title: คอนโซล
    description: 'สิ่งที่เชลล์พิมพ์ออกมา อ่านกลับในหน้า และบรรทัดที่เพิ่มเข้ามาเมื่อมันออกมา.'
  timeline:
    title: ไทม์ไลน์
    description: ขั้นตอนหรือเหตุการณ์หนึ่งใต้กันบนเครื่องหมายที่เชื่อมต่อด้วยเส้นแต่ละอันถือสิ่งที่มันต้องการ.
