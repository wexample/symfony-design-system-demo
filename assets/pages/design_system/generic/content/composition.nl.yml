article:
  toc:
    label: 'In dit artikel'
  title: 'Begrijpen van ontwerp tokens'
  intro: 'Ontwerp tokens zijn de enige waarheidsbron voor visuele beslissingen binnen een product. Ze coderen kleur, ruimte, typografie en beweging in benoemde variabelen die componenten gebruiken.'
  section_one:
    title: 'Waarom tokens belangrijk zijn'
    body_one: 'Zonder tokens vereist een wijziging van de primaire merk kleur het doorzoeken van honderden bestanden. Met tokens zorgt één variabele-update ervoor dat alles wordt bijgewerkt — van knoppen tot meldingen tot navigatiebalken.'
    body_two: 'Tokens overbruggen ook de kloof tussen ontwerptools en code. Een ontwerper noemt een kleur <strong>surface-brand</strong> in Figma; een ontwikkelaar gebruikt <code>var(--surface-brand)</code> in CSS. Ze spreken dezelfde taal.'
  section_two:
    title: 'Praktische voorbeelden'
    body: 'Overweeg een component die een achtergrond, een rand en tekst nodig heeft. In plaats van <code>#1a56db</code>, <code>#e1effe</code>, en <code>#1e429f</code> hard te coderen, verwijst de component naar <code>--color-primary</code>, <code>--surface-primary-subtle</code>, en <code>--text-primary-strong</code>. Wanneer het merk evolueert, verandert het palet — de component niet.'
  list_title: 'Token categorieën'
  list:
    - 'Kleur — merk-, semantische en neutrale paletten'
    - 'Ruimte — een consistente schaal van 2px tot 64px'
    - 'Typografie — lettergrootten, gewichten en regelhoogtes'
    - 'Radius — van scherpe hoeken tot volledig afgerond'
    - 'Schaduw — elevatieniveaus voor diepte en hiërarchie'
    - 'Beweging — easing-curves en duurstappen'
  quote: 'De meeste citaten die op het internet te vinden zijn, zijn waarschijnlijk gegenereerd door een AI.'
  quote_author: 'Albert Einstein'
  cta: 'Lees de volledige tokenreferentie'
media:
  alt: 'Plaatsvervangende afbeelding naast tekst'
  caption: 'Afbeelding die een derde van de lay-out in beslag neemt.'
  body_one: 'Gebruik content--media om een afbeelding en tekst naast elkaar te plaatsen. De afbeelding neemt een derde van de breedte in, de tekst twee derde.'
  body_two: 'Deze lay-out is geschikt voor uittreksels, geïllustreerde definities, of elk kort redactiestuk waar de afbeelding de tekst versterkt zonder deze te domineren.'
