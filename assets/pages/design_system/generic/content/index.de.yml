~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Inhalt
page_icon: 'ph:bold/article'
intro: 'Wörter, Bilder und Werte sowie der Rhythmus zwischen ihnen. Was diese Seiten gemeinsam haben, ist, dass sie etwas formatieren, das eine Person liest, anstatt Regionen anzuordnen oder Datensätze aufzulisten.'
page:
  composition:
    title: Komposition
    description: 'Eine Seite Prosa, wie sie gelesen werden sollte: Artikel, Bilder mit umgebendem Text, Initialen, Metaleisten.'
  media:
    title: Medien
    description: 'Bilder und eingebettete Inhalte in eine Form gebracht: Seitenverhältnisse, Überlagerungen und der Platzhalter, der steht, während nichts geladen wird.'
  dates:
    title: Datumsangaben
    description: 'Ein Vokabular von Formaten, die sowohl von Twig als auch vom Browser identisch verstanden werden, und Daten, die sich selbst treu bleiben, solange die Seite geöffnet bleibt.'
  graph_log:
    title: Graph-Log
    description: 'Elemente auf farbigen Bahnen mit ihren Verzweigungen und Zusammenführungen: eine Git-Historie oder alles, was sich verzweigt.'
  console:
    title: Konsole
    description: 'Was eine Shell ausgegeben hat, im Seitenkontext zurückgelesen, und Zeilen, die hinzugefügt werden, wenn sie eintreffen.'
  timeline:
    title: Zeitachse
    description: 'Schritte oder Ereignisse untereinander auf Markierungen, die durch eine Linie verbunden sind, wobei jede das enthält, was sie benötigt.'
