~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Zeitleiste
page_icon: 'ph:bold/list-numbers'
intro: 'Dinge, die übereinander stehen, jeweils auf einem Marker, verbunden durch eine Linie: die Schritte eines Verfahrens, die Ereignisse einer Geschichte, die Phasen eines Ablaufs. Was jeder enthält, ist frei — eine Textzeile, eine Tabelle, ein Formular — und die Linie zieht sich über das Ganze bis zum nächsten Marker.'
section:
  steps:
    title: 'Schritte in Reihenfolge'
    description: 'Nummeriert, mit den drei Zuständen, die der Stepper kennt: die Schritte dahinter sind solid gezeichnet, der aktuelle sticht hervor, die nächsten warten.'
  free:
    title: 'Alles unter einem Titel'
    description: 'Jedes Element enthält, was es braucht — Eigenschaften, eine Nachricht, Schaltflächen. Ein Icon ersetzt den Punkt, und ein Farbton färbt den Marker so, wie er einen Marker oder einen Block färbt.'
  history:
    title: 'Eine Geschichte'
    description: 'Kein bestimmter Ablauf, nur Ereignisse: Punkte, ein Datum unter jedem Titel und eine Farbgebung der Kategorie, die etwas erzählt.'
  unknown:
    title: 'Schritte noch nicht entschieden'
    description: 'Wie beim Stepper: ein Schritt, der von einer noch nicht gegebenen Antwort abhängt, erhält keine Nummer und bewegt keine der anderen.'
  hand:
    title: Handgeschrieben
    description: 'Die Komponente ist nur eine Möglichkeit, die Form aus einer Liste zu schreiben. Die gleichen Klassen, die auf der Seite geschrieben sind, ergeben die gleiche Zeitleiste, mit allem, was darin ist.'
  vue:
    title: 'In Vue'
    description: 'Die gleiche Zeitleiste in einem Vue-Baum. Was der Zweig als Markup nimmt, ist dort ein Scoped Slot, sodass eine Komponente unter dem Titel eines Elements stehen kann.'
install:
  clone:
    title: 'Quellen abrufen'
    text: 'Klonen Sie das Repository und installieren Sie dessen Abhängigkeiten.'
  configure:
