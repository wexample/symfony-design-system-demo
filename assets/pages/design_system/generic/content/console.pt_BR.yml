~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Console
page_icon: 'ph:bold/terminal-window'
intro: 'O que um shell imprimiu, lido de volta na página: comandos após seu prompt, sua saída abaixo deles, e as cores do terminal lidas como as da paleta, em qualquer esquema. Ele lê; não aceita comandos.'
section:
  session:
    title: 'Uma sessão'
    description: 'Linhas de quatro tipos — comando, saída, erro, informação — ou strings simples. Os códigos de escape que um programa escreveu para seu terminal são mantidos como cor e peso; o restante do que um terminal é informado é descartado.'
  vue:
    title: 'Em vue'
    description: 'As mesmas linhas, desenhadas pelo gêmeo vue, aqui com um prompt próprio.'
  live:
    title: 'Linhas à medida que vêm'
    description: 'Dado um tópico de atualizações ao vivo, o console vue adiciona o que cada mensagem carrega — uma string, uma linha ou um lote de linhas — e segue até o final, a menos que o leitor tenha rolado para cima. Aqui, um botão desempenha o papel do tópico, através da mesma adição que uma mensagem chama.'
