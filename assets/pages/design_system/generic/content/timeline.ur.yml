~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'ٹائم لائن'
page_icon: 'ph:bold/list-numbers'
intro: 'چیزیں ایک کے نیچے ایک، ہر ایک ایک نشان پر، ایک لائن کے ذریعے جڑی ہوئی: ایک طریقہ کار کے مراحل، تاریخ کے واقعات، ایک دوڑ کے مراحل۔ ہر ایک میں جو بھی ہے وہ آزاد ہے — ایک ٹیکسٹ کی لائن، ایک جدول، ایک فارم — اور لائن اسکے پورے حصے میں چلتی ہے، اگلے نشان تک۔'
section:
  steps:
    title: 'ترتیب میں مراحل'
    description: 'نمبر دار، تین حالتوں کے ساتھ جن سے سٹیپر واقف ہے: پیچھے کے مراحل ٹھوس طور پر کھینچے گئے ہیں، جو مرحلہ ہورہا ہے وہ نمایاں ہے، آگے والے انتظار کر رہے ہیں۔'
  free:
    title: 'عنوان کے نیچے کچھ بھی'
    description: 'ہر آئٹم میں جو بھی ضرورت ہو سکتی ہے — خصوصیات، ایک پیغام، بٹن۔ ایک آئیکن نقطے کی جگہ لے لیتا ہے، اور ایک لہجہ نشان کو اسی طرح رنگین کرتا ہے جیسے وہ کسی نشان یا بلاک کو رنگین کرتا ہے۔'
  history:
    title: 'ایک تاریخ'
    description: 'پیروی کرنے کے لیے کوئی ترتیب نہیں، صرف واقعات: نقطے، ہر عنوان کے نیچے ایک تاریخ، اور ایک زمرہ کا رنگ جہاں یہ کچھ بتاتا ہے۔'
  unknown:
    title: 'ابھی طے نہ ہونے والے مراحل'
    description: 'جیسا کہ سٹیپر پر: ایک ایسا مرحلہ جو ابھی تک دیئے گئے جواب پر منحصر ہے، اس کا کوئی نمبر نہیں ہوتا اور باقیوں میں سے کسی کو بھی حرکت نہیں دیتا۔'
  hand:
    title: 'ہاتھ سے لکھا ہوا'
    description: 'یہ جزو صرف ایک فہرست سے شکل لکھنے کا ایک طریقہ ہے۔ صفحے میں لکھی گئی وہی کلاسز اسی ٹائم لائن کو دیتی ہیں، جس میں کچھ بھی ہو سکتا ہے۔'
  vue:
    title: 'ویو میں'
    description: 'ویو کے درخت میں وہی ٹائم لائن۔ جو شاخ مارک اپ کے طور پر لیتی ہے وہ وہاں ایک اسکوپڈ سلاٹ ہے، تاکہ ایک جزو کسی آئٹم کے عنوان کے نیچے کھڑا ہو سکے۔'
install:
  clone:
    title: 'ذرائع حاصل کریں'
    text: 'ریپوزٹری کلون کریں اور اس کی انحصاریوں کو انسٹال کریں۔'
  configure:
    title: 'کنفیگر کریں'
    text: 'مثالی ماحول کی کاپی کریں اور ڈیٹا بیس کا پتہ بھر دیں۔'
  migrate:
