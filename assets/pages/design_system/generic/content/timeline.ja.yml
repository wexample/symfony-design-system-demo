~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: タイムライン
page_icon: 'ph:bold/list-numbers'
intro: '1つの下に1つ、マーカーで結ばれたもの：手順のステップ、歴史の出来事、実行の段階。それぞれが保持するものは自由 — テキストの行、表、フォーム — そしてその行はそれ全体を下に走り、次のマーカーへと繋がります。'
section:
  steps:
    title: 順番にステップ
    description: 番号付きで、ステッパーが知っている3つの状態：後ろのステップはしっかり描かれ、現在進行中のものが目立ち、前のものは待っています。
  free:
    title: タイトルの下に何でも
    description: '各アイテムは必要なものを保持します — プロパティ、メッセージ、ボタン。アイコンが点を置き換え、トーンがマーカーを色付けします。'
  history:
    title: 歴史
    description: 従うべき順序はなく、ただ出来事がある：点、各タイトルの下に日付、何かを伝えるカテゴリの色。
  unknown:
    title: まだ決まっていないステップ
    description: ステッパーと同様：まだ与えられていない回答に依存するステップは番号を持たず、他のものを動かしません。
  hand:
    title: 手書き
    description: このコンポーネントはリストから形を描く方法に過ぎません。ページに書かれた同じクラスが同じタイムラインを作り、その中に何かを持ちます。
  vue:
    title: Vueで
    description: Vueツリー内の同じタイムライン。小枝がマークアップとして取るものはスコープ付きスロットであり、コンポーネントがアイテムのタイトルの下に立つことができます。
install:
  clone:
    title: ソースを取得
    text: リポジトリをクローンし、その依存関係をインストールします。
  configure:
    title: 設定
    text: 例の環境をコピーし、データベースのアドレスを記入します。
  migrate:
    title: データベースを作成
    text: マイグレーションを実行します；これが進行中のステップです。
  deploy:
    title: デプロイ
    text: アセットをビルドし、リリースを公開します。
order:
  placed:
