~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Aikajana
page_icon: 'ph:bold/list-numbers'
intro: 'Asiat toistensa alla, jokainen merkkipaalu, yhdistetty viivalla: prosessin vaiheet, historian tapahtumat, juoksun vaiheet. Jokainen voi sisältää mitä tahansa — tekstirivin, taulukon, lomakkeen — ja viiva kulkee koko sen matkalta seuraavalle merkkipaulalle.'
section:
  steps:
    title: 'Vaiheet järjestyksessä'
    description: 'Numeroitu, kolmea tilaa käyttäen, jotka stepperi tuntee: taakse jääneet vaiheet ovat vahvoja, meneillään oleva erottuu, edessä odottavat.'
  free:
    title: 'Mitä tahansa otsikon alla'
    description: 'Jokainen kohde sisältää tarvitsemansa — ominaisuudet, viestin, painikkeet. Ikoni korvasi pisteen, ja sävy värittää merkkipaaluja kuten se värittää merkkipaaluja tai lohkoja.'
  history:
    title: Historia
    description: 'Ei järjestystä, vain tapahtumat: pisteet, päivämäärä jokaisen otsikon alla, ja kategorian väri, joka kertoo jotain.'
  unknown:
    title: 'Vaiheet ei ole vielä päätetty'
    description: 'Kuten stepparissa: vaihe, joka riippuu vielä antamattomasta vastauksesta, ei saa numeroa eikä liikuta muita.'
  hand:
    title: 'Käsin kirjoitettu'
    description: 'Komponentti on vain tapa kirjoittaa muoto listasta. Samat luokat, jotka on kirjoitettu sivulle, antavat saman aikajanan, mitä tahansa siinä.'
  vue:
    title: 'Vue:ssa'
    description: 'Sama aikajana vue-puussa. Se, mitä oksa ottaa merkkausmateriaalina, on siellä rajattu slot, joten komponentti voi seistä kohteen otsikon alla.'
