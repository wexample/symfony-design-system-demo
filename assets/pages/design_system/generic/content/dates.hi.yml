~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: तारीखें
page_icon: 'ph:bold/घड़ी'
intro: 'फॉर्मेट नामों का एक शब्दावली, जिसे Twig, सामान्य JavaScript और Vue द्वारा समान रूप से समझा जाता है। सर्वर एक <time> प्रिंट करता है जो उस क्षण और फॉर्मेट को दर्शाता है जिसके लिए इसे पूछा गया था; ब्राउज़र इसे उठाता है और जैसे-जैसे यह पुराना होता है, इसे फिर से लिखता है, इसलिए एक खुला पृष्ठ कभी यह नहीं कहता कि कुछ कितनी देर पहले हुआ।'
section:
  formats:
    title: 'नामित फॉर्मेट'
    description: 'पूर्ण फॉर्मेट ICU तिथि और समय शैलियों हैं, इसलिए फ़ील्ड का क्रम और विभाजक पाठक की स्थानीयता से संबंधित होते हैं न कि टेम्पलेट से।'
  relative:
    title: सापेक्ष
    description: 'दूरी सबसे बड़ी इकाई में गिनी जाती है जो अभी भी कुछ कहती है - मिनट एक घंटे तक, घंटे एक दिन तक, फिर दिन, सप्ताह, महीने और वर्ष। हर शब्दावली एक अनुवाद कुंजी से आती है।'
  auto:
    title: स्वचालित
    description: 'डिफ़ॉल्ट। जब तिथि हाल की होती है तो पीछे की ओर गिनता है, और एक सप्ताह के बाद कैलेंडर तिथि पर वापस चला जाता है, जहाँ "27 सप्ताह पहले" किसी की मदद नहीं करता।'
  live:
    title: 'अपडेट रखा गया'
    description: 'एकल टाइमर पृष्ठ पर हर तिथि के लिए काम करता है, जिस गति से प्रदर्शित इकाई की आवश्यकता होती है - "अभी" के लिए कुछ सेकंड, "3 महीने पहले" के लिए एक घंटा। इस पृष्ठ को खुला छोड़ें और देखें।'
  plain:
    title: 'केवल पाठ'
    description: 'फिल्टर बिना किसी मार्कअप के एक स्ट्रिंग लौटाता है, एक शीर्षक विशेषता या एक निर्यात के लिए। एक फॉर्मेट नाम जिसे वह नहीं जानता उसे एक कच्चे ICU पैटर्न के रूप में लिया जाता है, जो तब है जब नामित फॉर्मेट में वह आकार नहीं होता जो आपको चाहिए।'
offset:
  now: 'कुछ समय पहले'
  minutes: 'पाँच मिनट'
  hours: 'तीन घंटे'
  days: 'दो दिन'
  months: 'चार महीने'
  years: 'तीन वर्ष'
  future: 'दो घंटों में'
live:
  server: 'Twig द्वारा रेंडर किया गया, फ्रंट सेवा द्वारा ताज़ा किया गया:'
  vue: 'Vue द्वारा रेंडर किया गया:'
plain:
  filter: "| date_format('date_long')"
  pattern: '| date_format("EEEE d MMMM, ''week'' w")'
