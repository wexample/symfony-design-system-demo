~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: محتوا
page_icon: 'ph:bold/article'
intro: 'کلمات، تصاویر و ارزش‌ها، و ریتم بین آن‌ها. چیزی که این صفحات مشترک دارند این است که چیزی را که یک فرد می‌خواند قالب‌بندی می‌کنند، نه اینکه مناطق را مرتب کنند یا رکوردها را لیست کنند.'
page:
  composition:
    title: ترکیب
    description: 'صفحه‌ای از نثر که باید به این شکل خوانده شود: مقالات، تصاویری با متن در اطراف آن‌ها، حروف بزرگ ابتدایی، نوارهای متا.'
  media:
    title: رسانه
    description: 'تصاویر و محتوای گنجانده شده که به شکل خاصی نگه‌داشته شده‌اند: نسبت‌های ابعاد، پوشش‌ها و جایگزینی که در حین بارگذاری نشدن چیزی وجود دارد.'
  dates:
    title: تاریخ‌ها
    description: 'یک واژگان از فرمت‌ها که به طور یکسان توسط Twig و مرورگر درک می‌شود و تاریخ‌هایی که خود را درست نگه می‌دارند در حالی که صفحه باز است.'
  graph_log:
    title: 'گزارش گراف'
    description: 'مواردی در خطوط رنگی با انشعاب‌ها و ادغام‌هایشان: تاریخچه git، یا هر چیزی که شاخه می‌شود.'
  console:
    title: کنسول
    description: 'آنچه یک شل چاپ کرده، در صفحه خوانده می‌شود و خطوطی که به محض ورود اضافه می‌شوند.'
  timeline:
    title: 'خط زمانی'
    description: 'مراحل یا رویدادها یکی زیر دیگری بر روی نشانگرهایی که با یک خط متصل شده‌اند، هر کدام چیزی را که نیاز دارد در خود نگه می‌دارد.'
