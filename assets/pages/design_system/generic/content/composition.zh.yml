article:
  toc:
    label: 在这篇文章中
  title: 理解设计令牌
  intro: 设计令牌是产品视觉决策的单一真实来源。它们将颜色、间距、排版和运动编码为组件使用的命名变量。
  section_one:
    title: 为什么令牌很重要
    body_one: 没有令牌的情况下，更改主要品牌颜色需要在数百个文件中查找。使用令牌时，一个变量的更新会在各处传播——从按钮到警报，再到导航栏。
    body_two: 令牌还弥合了设计工具与代码之间的差距。设计师在Figma中将颜色命名为<strong>surface-brand</strong>；开发人员在CSS中使用<code>var(--surface-brand)</code>。他们说的是同一种语言。
  section_two:
    title: 实际示例
    body: '考虑一个需要背景、边框和文本的组件。与其硬编码<code>#1a56db</code>、<code>#e1effe</code>和<code>#1e429f</code>，不如让组件引用<code>--color-primary</code>、<code>--surface-primary-subtle</code>和<code>--text-primary-strong</code>。当品牌发展时，调色板会变化——组件不会。'
  list_title: 令牌类别
  list:
    - 颜色——品牌、语义和中性色调
    - 间距——从2px到64px的一致比例
    - 排版——字体大小、粗细和行高
    - 半径——从锐角到完全圆角
    - 阴影——深度和层次的提升级别
    - 运动——缓动曲线和持续时间步骤
  quote: 互联网上大多数的引用可能都是由AI生成的。
  quote_author: 阿尔伯特·爱因斯坦
  cta: 阅读全文令牌参考
media:
  alt: 与文本并排的占位图像
  caption: 图像占据布局的三分之一。
  body_one: 使用content--media将图像和文本并排放置。图像占据宽度的三分之一，文本占据三分之二。
  body_two: 这种布局适合引用、插图定义或任何短小的编辑块，其中图像强化了文本而不主导文本。
