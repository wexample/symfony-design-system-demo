~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Хронология
page_icon: 'ph:bold/list-numbers'
intro: 'Вещи расположены одна под другой, каждая на маркере, соединенные линией: шаги процедуры, события истории, этапы выполнения. Каждая из них может содержать что угодно — строку текста, таблицу, форму — и линия проходит по всему этому, к следующему маркеру.'
section:
  steps:
    title: 'Шаги по порядку'
    description: 'Нумерованные, с тремя состояниями, которые знает шагомер: предыдущие шаги отображаются сплошной линией, текущий выделен, а будущие ждут.'
  free:
    title: 'Что угодно под заголовком'
    description: 'Каждый элемент содержит всё, что ему нужно — свойства, сообщение, кнопки. Иконка заменяет точку, а тон окрашивает маркер так же, как он окрашивает маркер или блок.'
  history:
    title: История
    description: 'Нет порядка следования, только события: точки, дата под каждым заголовком и цвет категории, который что-то говорит.'
  unknown:
    title: 'Шаги ещё не определены'
    description: 'Как в шагомере: шаг, который зависит от ответа, который еще не дан, не имеет номера и не сдвигает другие.'
  hand:
    title: 'Написано от руки'
    description: 'Компонент — это всего лишь способ записать форму из списка. Те же классы, написанные на странице, создают ту же хронологию, с чем угодно внутри.'
  vue:
    title: 'В vue'
    description: 'Та же хронология в дереве vue. То, что ветка принимает как разметку, является областью слота, так что компонент может находиться под заголовком элемента.'
install:
  clone:
    title: 'Получить источники'
    text: 'Клонируйте репозиторий и установите его зависимости.'
  configure:
    title: Настроить
    text: 'Скопируйте пример окружения и заполните адрес базы данных.'
  migrate:
    title: 'Создать базу данных'
    text: 'Запустите миграции; это шаг в процессе.'
  deploy:
    title: Развернуть
    text: 'Соберите активы и опубликуйте релиз.'
