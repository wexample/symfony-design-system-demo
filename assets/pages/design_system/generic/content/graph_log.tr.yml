~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Grafik günlüğü'
page_icon: 'ph:bold/git-fork'
intro: 'Bir soy hattındaki öğeler, en yenisi önce, renkli yollar üzerinde çizilmiş: bir hattın ayrıldığı yer, iki hattın tekrar birleştiği yer. Her öğe ebeveynlerini belirtir; yollar onları takip eder. Grafiğin yanındaki bir satır boş — bir başlık, kapsüller olarak referanslar, kim, ne zaman, kısa bir isim — böylece bir git geçmişi diğer kullanımlar arasında bir kullanım olarak vardır.'
section:
  history:
    title: 'Bir geçmiş'
    description: 'Bir özellik dalı geri birleştirildi, diğeri açık bırakıldı, bir sürüm üzerinde etiket. Her yol, başladığı yerden sona kadar rengini korur.'
  other:
    title: "Git'ten başka bir şey"
    description: "Bir belgenin versiyonları, bunlardan biri birleştirilmeden önce kenarda incelenmiştir. Bileşen, commit'ler hakkında hiçbir şey bilmez."
  vue:
    title: "Vue'da"
    description: 'Aynı geçmişin bir vue ağacında, yollar yeniden çizilmiş olarak öğeler başa geldiğinde.'
  git:
    title: 'Bu uygulamanın geçmişi'
    description: "Symfony-coding'in git_graph_items() fonksiyonu aracılığıyla depodan okunur, git'in yoluna asla girmeyen paylaşılan okuyucu üzerinden."
