article:
  toc:
    label: 'במאמר זה'
  title: 'הבנת טוקנים בעיצוב'
  intro: 'טוקנים בעיצוב הם מקור האמת היחיד עבור החלטות חזותיות ברחבי המוצר. הם מקודדים צבע, ריווח, טיפוגרפיה ותנועה למשתנים עם שמות שצריכים רכיבים.'
  section_one:
    title: 'למה טוקנים חשובים'
    body_one: 'בלי טוקנים, שינוי בצבע המותג הראשי מחייב חיפוש מאות קבצים. עם טוקנים, עדכון משתנה אחד מתפשט לכל מקום — מכפתורים לאזהרות ועד לשורות ניווט.'
    body_two: 'טוקנים גם גשרו את הפער בין כלי עיצוב לקוד. מעצב נותן צבע בשם <strong>surface-brand</strong> ב-Figma; מפתח משתמש ב-<code>var(--surface-brand)</code> ב-CSS. הם מדברים את אותה השפה.'
  section_two:
    title: 'דוגמאות מעשיות'
    body: 'שקול רכיב שצריך רקע, גבול וטקסט. במקום לקודד קשות <code>#1a56db</code>, <code>#e1effe</code>, ו-<code>#1e429f</code>, הרכיב מפנה ל-<code>--color-primary</code>, <code>--surface-primary-subtle</code>, ו-<code>--text-primary-strong</code>. כשהמותג מתפתח, הפלטה משתנה — הרכיב לא משתנה.'
  list_title: 'קטגוריות טוקנים'
  list:
    - 'צבע — פלטות מותג, סמנטיות ונטרליות'
    - 'ריווח — סקלה קבועה מ-2px עד 64px'
    - 'טיפוגרפיה — גדלי גופן, משקלים וגבהים של שורות'
    - 'רדיוס — מפינות חדות ועד מעוגלות לחלוטין'
    - 'צל — רמות Elevation לעומק והיררכיה'
    - 'תנועה — עקומות ריכוך וצעדים של משך'
  quote: 'רוב הציטוטים שנמצאו באינטרנט כנראה נוצרו על ידי AI.'
  quote_author: 'אלברט איינשטין'
  cta: 'קרא את המדריך המלא לטוקנים'
media:
  alt: 'תמונת placeholder לצד טקסט'
  caption: 'תמונה תופסת שליש מהפריסה.'
  body_one: 'השתמש ב-content--media כדי למקם תמונה וטקסט זה לצד זה. התמונה תופסת שליש מהרחב, הטקסט שני שלישים.'
  body_two: 'פריסה זו מתאימה לציטוטים בולטים, הגדרות מאוירות, או כל בלוק עיתונאי קצר שבו התמונה מחזקת את העתק מבלי לשלוט בו.'
dropcap:
  paragraph_one: 'לורם איפסום דולור סיט אמט, קונסקטטור אדיפיסינג אליט. סד דוא איווק דיפורמט אינצידידונט אוט לאבור ואת דולור מגנליק. אוט אנימ אד מינימ וניאם, קוויס נוסטרוד אקסרציטציה אולמקו לאבוריס ניסי אוט אליקיפ אקס איא קומודו קונסקט.'
  paragraph_two: "דואיס אוט אירור דולור אין רפרהנדירט אין וולפטאט ולט אסה צ'ילום דולור אוו פוג'אט נולה פירטור. אקספטור סינט אוקיאקט קופידאט נון פרודנט, סונט אין קופלה קוי אופישיה דסרונט מוליט אנימ איד אסס לברום."
