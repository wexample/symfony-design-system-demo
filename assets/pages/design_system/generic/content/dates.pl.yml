~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Daty
page_icon: 'ph:bold/clock'
intro: 'Jedno słownictwo nazw formatów, rozumiane identycznie przez Twig, czysty JavaScript oraz Vue. Serwer drukuje <time> zawierający moment oraz format, o który proszono; przeglądarka przechwytuje to i przekształca w miarę upływu czasu, więc strona pozostawiona otwarta nigdy nie kłamie o tym, jak dawno coś się wydarzyło.'
section:
  formats:
    title: 'Nazwane formaty'
    description: 'Formaty absolutne to style daty i czasu ICU, więc kolejność pól i separatory należą do lokalizacji użytkownika, a nie do szablonu.'
  relative:
    title: Relatywne
    description: 'Odległość jest liczona w największej jednostce, która wciąż ma znaczenie — minuty do godziny, godziny do dnia, a potem dni, tygodnie, miesiące i lata. Każde sformułowanie pochodzi z klucza tłumaczenia.'
  auto:
    title: Automatyczne
    description: 'Domyślnie. Liczy wstecz, gdy data jest niedawna, i przechodzi na datę kalendarzową po tygodniu, gdzie "27 tygodni temu" przestaje być pomocne.'
  live:
    title: 'Na bieżąco'
    description: 'Jeden timer obsługuje każdą datę na stronie, w rytmie, który zasługuje na wyświetlaną jednostkę — kilka sekund dla "właśnie teraz", godzinę dla "3 miesiące temu". Pozostaw tę stronę otwartą i obserwuj.'
  plain:
    title: 'Tylko tekst'
    description: 'Filtr zwraca ciąg bez znaczników, do atrybutu tytułu lub eksportu. Nazwa formatu, której nie zna, traktowana jest jako surowy wzór ICU, co jest rozwiązaniem, gdy nazwanie formaty nie mają potrzebnego kształtu.'
offset:
  now: 'Chwilę temu'
  minutes: 'Pięć minut'
  hours: 'Trzy godziny'
  days: 'Dwa dni'
  months: 'Cztery miesiące'
  years: 'Trzy lata'
  future: 'Za dwie godziny'
live:
  server: 'Renderowane przez Twig, odświeżane przez usługę frontową:'
  vue: 'Renderowane przez Vue:'
plain:
  filter: "| date_format('date_long')"
  pattern: '| date_format("EEEE d MMMM, ''tydzień'' w")'
