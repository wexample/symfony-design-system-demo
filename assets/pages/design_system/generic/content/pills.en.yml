~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

page_title: Pills and tags
page_icon: ph:bold/tag

intro: "The small capsule that labels something, and the six colours it can be filed under. A pill ranges: it says which drawer a thing belongs in, or how many there are. It never says whether that is good news — that is a state, and states have a capsule of their own."

section:
  inline:
    title: Inline labels
    description: "A word set apart in the middle of a sentence: a version, a phase, a category. Neutral by default, because a label that arrives coloured has already made a claim about what it labels."
  palette:
    title: The six families
    description: "Six colours that tell things apart without ranking them. They carry no meaning — nothing says the third is better than the fifth — which is exactly what makes them usable for a taxonomy, where meaning would be a lie."
  counting:
    title: Counting
    description: "The other job of the pill: how many of something there is, at the end of a menu item or a tab. A count does not judge, so it stays neutral — and it is the same object as the label above, not a second one."
  against:
    title: Beside a state
    description: "The distinction the whole section rests on. On the left a pill: twelve of something, no claim. On the right a filled status: twelve of something that went well. Same figure, and the colour is the whole difference — which is why a count in a pipeline column is a status, and a count beside a menu item is a pill."

example:
  sentence:
    released: "Version 2.4 is"
    deprecated: "This API is"

pill:
  neutral: Neutral
  released: Released
  deprecated: Deprecated
  tag: Tag

item:
  inbox: Inbox
  alerts: Alerts
  all: All
  mine: Mine
