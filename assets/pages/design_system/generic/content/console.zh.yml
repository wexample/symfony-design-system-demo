~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 控制台
page_icon: 'ph:bold/terminal-window'
intro: Shell打印的内容在页面中回读：命令在提示符后面，它们的输出在其下方，终端的颜色按调色板呈现，无论是哪种方案。它读取；它不接受命令。
section:
  session:
    title: 会话
    description: 四种类型的行——命令、输出、错误、信息——或普通字符串。程序为其终端编写的转义码以颜色和粗细的形式保留；终端被告知的其他内容则被丢弃。
  vue:
    title: 在vue中
    description: 相同的行，由vue双胞胎绘制，这里有自己提示符。
  live:
    title: 实时更新的行
    description: 给定一个实时更新的话题，vue控制台添加每条消息所携带的内容——一个字符串、一行或一批行——并跟随结尾，除非读者向上滚动。这里一个按钮充当话题，通过相同的附加消息调用。
