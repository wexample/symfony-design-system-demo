  page_icon: 'ph:bold/sparkle'
  intro: 'אפקטים על מילים, עבור דף שמדבר בקול רם — דף נחיתה, גיבור. הם מגיעים מ-symfony-design-system-effects, ונשארים עדיין עבור מי שביקש פחות תנועה.'
  section:
    hero:
      title: גיבור
      description: 'מילים שעברו עם טוש, נצבעות אחת אחרי השנייה ברגע שהן מופיעות; מילה שמתהפכת כמו מכונת מזל לפני שהיא מתייצבת על הבאה בתור. קרא בקול, המילה המתהפכת היא הרשימה שלה, פעם אחת.'
    tones:
      title: גוונים
      description: 'העט לוקח את הצבעים מהפלטת קטגוריות.'
  hero:
    before: 'הרשת שמביאה לך פתרונות אינטרנט'
    tailored: 'מותאם אישית'
    and: וגם
    lasting: 'בנויה להחזיק מעמד'
    network: 'Wexample, הרשת של פרילנסרים שהם'
