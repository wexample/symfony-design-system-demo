  intro: 'الفاظ پر اثرات، ایک صفحے کے لیے جو بلند آواز میں بولتا ہے — ایک لینڈنگ، ایک ہیرو۔ یہ symfony-design-system-effects سے آتے ہیں، اور وہ ان لوگوں کے لیے خاموش رہتے ہیں جنہوں نے کم حرکت کی درخواست کی۔'
  section:
    hero:
      title: 'ایک ہیرو'
      description: 'الفاظ جن پر ایک محسوس کرنے والا قلم گزرتا ہے، ایک کے بعد ایک جب وہ نظر آتے ہیں؛ ایک لفظ جو سلاٹ مشین کی طرح گھومتا ہے اس سے پہلے کہ وہ اگلے پر بٹھ جائے۔ بلند آواز میں پڑھیں، گھومتا ہوا لفظ اس کی فہرست ہے، ایک بار۔'
    tones:
      title: آوازیں
      description: 'قلم زمرہ جاتی پیلیٹ کے رنگ لیتا ہے۔'
