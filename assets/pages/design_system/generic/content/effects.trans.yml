fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'افکت ها'
  page_icon: 'ph:bold/sparkle'
  intro: 'افکت ها روی کلمات، برای صفحه‌ای که صدایش بلند است — یک لندینگ، یک قهرمان. آن‌ها از symfony-design-system-effects می‌آیند و برای هر کسی که خواهان حرکات کمتر است، ساکن باقی می‌مانند.'
  section:
    hero:
      title: 'یک قهرمان'
      description: 'کلماتی که یک خودکار احساس‌انگیز بر روی آن‌ها می‌کشد، یکی پس از دیگری زمانی که به نمایش در می‌آیند؛ کلمه‌ای که مانند یک دستگاه اسلات می‌چرخد قبل از اینکه روی بعدی ثابت شود. با صدای بلند خوانده می‌شود، کلمه چرخان لیست آن است، یک بار.'
    tones:
      title: تن‌ها
      description: 'خودکار رنگ‌های پالت دسته‌بندی را به خود می‌گیرد.'
  hero:
    before: 'شبکه‌ای که راه‌حل‌های وب را به شما ارائه می‌دهد'
    tailored: سفارشی
    and: و
    lasting: 'ساخته شده برای ماندگاری'
