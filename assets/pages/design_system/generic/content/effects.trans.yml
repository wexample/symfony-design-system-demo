  section:
    hero:
      title: 히어로
      description: '한 번에 하나씩 나타나는 단어들, 느끼는 펜으로 그려지며, 슬롯 머신처럼 굴러 다음 단어로 고정됩니다. 소리 내어 읽으면, 굴러가는 단어는 그 목록입니다, 한 번.'
    tones:
