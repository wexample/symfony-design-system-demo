~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Date
page_icon: 'ph:bold/clock'
intro: "Un vocabolario di nomi di formato, compreso in modo identico da Twig, da JavaScript semplice e da Vue. Il server stampa un <time> che riporta l'istante e il formato richiesto; il browser lo raccoglie e lo riscrive man mano che invecchia, quindi una pagina lasciata aperta non mente mai su quanto tempo fa sia accaduto qualcosa."
section:
  formats:
    title: 'Formati nominati'
    description: "I formati assoluti sono stili di data e ora ICU, quindi l'ordine dei campi e i separatori appartengono alla localizzazione del lettore piuttosto che al template."
  relative:
    title: Relativo
    description: "La distanza è calcolata nella più grande unità che ha ancora un significato — minuti fino a un'ora, ore fino a un giorno, poi giorni, settimane, mesi e anni. Ogni formulazione proviene da una chiave di traduzione."
  auto:
    title: Automatico
    description: 'Il predefinito. Conta a ritroso mentre la data è recente, e torna a una data del calendario dopo una settimana, dove "27 settimane fa" smette di essere utile.'
  live:
    title: 'Aggiornato in tempo reale'
    description: 'Un singolo timer serve ogni data sulla pagina, con la cadenza che l''unità mostrata merita — alcuni secondi per "appena ora", un''ora per "3 mesi fa". Lascia questa pagina aperta e osserva.'
  plain:
    title: 'Solo testo'
    description: "Il filtro restituisce una stringa senza markup, per un attributo title o un'esportazione. Un nome di formato che non conosce viene trattato come un modello ICU grezzo, che è la soluzione quando i formati nominati non hanno la forma di cui hai bisogno."
offset:
  now: 'Un momento fa'
  minutes: 'Cinque minuti'
  hours: 'Tre ore'
  days: 'Due giorni'
  months: 'Quattro mesi'
  years: 'Tre anni'
  future: 'Tra due ore'
live:
  server: 'Renderizzato da Twig, aggiornato dal servizio frontale:'
  vue: 'Renderizzato da Vue:'
plain:
  filter: "| date_format('date_long')"
  pattern: '| date_format("EEEE d MMMM, ''settimana'' w")'
