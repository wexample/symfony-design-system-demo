page_title: 'Hàng tồn kho'
page_icon: 'ph:bold/list-checks'
intro: 'Mỗi phần tử mà gói hàng gửi đi, và các định dạng mà nó được giao. Bảng này không phải là một danh sách ai đó duy trì: nó là sổ đăng ký mà mỗi gói hàng gửi đi, được biên soạn từ các khai báo của nó và được kiểm tra với các thành phần của nó. Nó trả lời những gì có — không bao giờ là những gì nên có, điều này là một câu hỏi mà không có quét nào có thể giải quyết và các phần tử sẽ phải tự khai báo cho chính mình.'
problems:
  title: 'Một khai báo và các tài sản không khớp'
  body: 'Hiển thị ở đây vì trang này được biên soạn từ các tài sản trong quá trình phát triển, vì vậy nó thấy những gì `%command%` sẽ từ chối viết. Mỗi điểm bên dưới nêu tên phần tử; bảng được vẽ như nhau.'
missing:
  title: 'Một sổ đăng ký bị thiếu'
  body: '%bundles% đã đăng ký là chứa các phần tử nhưng không có sổ đăng ký trên đĩa, vì vậy các hàng của nó không có trong bảng bên dưới. Chạy `%command%` và cam kết kết quả.'
