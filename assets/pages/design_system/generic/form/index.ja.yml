~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: フォーム
page_icon: 'ph:bold/textbox'
intro: 送信時の動作と、戻ってきたときに表示される内容を持つフィールドのセット。フィールド自体はコントロールにあり、これらのページが追加するのはラウンドトリップです。
page:
  inputs:
    title: 入力フィールド
    description: システムが提供するすべてのフィールドと、エージェントがそれを引き継ぎ、入力して返すことを許可する契約。
  basic:
    title: 基本フォーム
    description: シンプルなケース：サーバーによってレンダリングされ、ブラウザから送信され、ページで応答されるフォーム。
  rendered:
    title: 高度なフォーム
    description: フォームコンポーネントによって構築されたフォームで、送信動作と戻ってくる際の状態を持っています。
  ajax:
    title: Ajaxフォーム
    description: ページを離れずに応答するフォームと、戻ってきた内容に対する処理。
  vue:
    title: Vueフォーム
    description: コンポーネントから駆動される同じフォームで、フィールドはマークアップではなく状態です。
