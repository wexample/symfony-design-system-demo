~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Formulaires
page_icon: 'ph:bold/textbox'
intro: "Un ensemble de champs, ce qu'il fait lorsqu'il est envoyé et ce qu'il dit lorsqu'il revient. Les champs eux-mêmes se trouvent dans les Contrôles ; ce que ces pages ajoutent, c'est le trajet aller-retour."
page:
  inputs:
    title: Entrées
    description: 'Chaque champ que le système fournit et le contrat qui permet à un agent de le prendre, de le remplir et de le rendre.'
  basic:
    title: 'Formulaires de base'
    description: 'Le cas simple : un formulaire rendu par le serveur, envoyé par le navigateur, répondu par une page.'
  rendered:
    title: 'Formulaires avancés'
    description: "Formulaires construits par le composant de formulaire, avec leurs comportements de soumission et l'état dans lequel ils reviennent."
  ajax:
    title: 'Formulaires Ajax'
    description: "Un formulaire qui répond sans quitter la page, et ce qu'il fait avec ce qui revient."
  vue:
    title: 'Formulaires Vue'
    description: 'Les mêmes formulaires pilotés par un composant, où les champs sont des états plutôt que du balisage.'
