  textarea: 地址
  email: 电子邮件
  url: 网站
  password: 密码
  code: 验证码
  number: 年龄
  date: 出生日期
  time: 首选时间
  datetime: 预约
  select: 国家
  radio: 联系方式
  switch: 给我发送新闻简报
  file: 身份文件
  emoji: 心情
  button: 一个按钮
  submit: 提交
