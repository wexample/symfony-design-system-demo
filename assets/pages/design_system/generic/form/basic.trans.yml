en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Forms
  page_icon: ph:bold/rows

  section:
    default:
      title: Basic form
    columns:
      title: Columns and zones
      description: "`form--columns` on a section lays its fields side by side: as many columns as the room holds, three at most (`form--columns-2` for two), one on a phone. `form--span` on a field gives it the whole line. `form--zones` on the form sets its sections side by side when the room allows, parted by space alone; `form--zones--framed` gives each a ground and an edge, for a form standing on the page rather than in a card."
      identity: Identity
      settings: Settings
    block:
      title: Block forms
    assisted:
      title: Assisted

  field:
    title:
      label: Title
      placeholder: Enter a title
    message:
      label: Message
      placeholder: Write a short message
    date:
      label: Date
    datetime:
      label: Date & time
    time:
      label: Time
    file:
      label: File
    email:
      label: Email
    number:
      label: Number
    url:
      label: URL

  action:
    submit: Submit
    secondary: Secondary action
    raw_submit: Raw submit
    link: Simple link

