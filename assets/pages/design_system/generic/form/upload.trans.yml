en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Upload
  page_icon: ph:bold/upload-simple

  intro: "Files dropped on a zone or picked with its button are sent in pieces to the directory the page signed for — any kind, any size —, and followed in the uploads window docked at the foot of the screen, which can be folded or closed while they go."
  section:
    zone:
      title: A drop zone
      description: "`upload_dropzone(directory)`: drop files here, or pick them. The address is signed for this one directory; the browser cannot send anything elsewhere."
    compact:
      title: On one line
      description: "`compact: true`, where a page has little room: the words, then the button."
    restricted:
      title: Kinds and size
      description: "`accept` — extensions or MIME types, as the HTML attribute reads them — and `max_size`, in bytes, are signed into the address with the directory. The picker shows only the kinds accepted; the server refuses the rest, a file too large on its first piece, a kind told by its content once whole, and the uploads window says why. Here: spreadsheets and images, 2 MB at most."
      hint: Spreadsheets or images, 2 MB at most
    received:
      title: Received
      empty: Nothing yet. Reload the page once a file is sent.

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Télécharger
  page_icon: 'ph:bold/upload-simple'
  intro: "Les fichiers déposés dans une zone ou sélectionnés avec son bouton sont envoyés par morceaux vers le répertoire pour lequel la page est signée — de tout type, de toute taille —, et suivis dans la fenêtre des téléchargements ancrée en bas de l'écran, qui peut être repliée ou fermée pendant le processus."
  section:
    zone:
      title: 'Une zone de dépôt'
      description: "`upload_dropzone(directory)`: déposez des fichiers ici, ou sélectionnez-les. L'adresse est signée pour ce répertoire unique ; le navigateur ne peut rien envoyer ailleurs."
    compact:
      title: 'Sur une ligne'
      description: '`compact: true`, lorsque la page a peu de place : les mots, puis le bouton.'
    restricted:
      title: 'Types et taille'
      description: "`accept` — extensions ou types MIME, tels que les lit l'attribut HTML — et `max_size`, en octets, sont signés dans l'adresse avec le répertoire. Le sélecteur n'affiche que les types acceptés ; le serveur refuse le reste, un fichier trop volumineux dès son premier morceau, un type identifié par son contenu une fois entier, et la fenêtre des téléchargements explique pourquoi. Ici : tableurs et images, 2 Mo maximum."
      hint: 'Tableurs ou images, 2 Mo maximum'
    received:
      title: Reçu
      empty: "Rien pour le moment. Rechargez la page une fois qu'un fichier est envoyé."

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 上传
  page_icon: 'ph:bold/upload-simple'
  intro: 拖放到区域或通过按钮选择的文件将被分段发送到页面签名的目录——任何类型，任何大小——并在固定在屏幕底部的上传窗口中跟踪，可以在上传过程中折叠或关闭。
  section:
    zone:
      title: 拖放区域
      description: '`upload_dropzone(directory)`：在这里拖放文件，或选择它们。地址仅为此一个目录签名；浏览器无法将文件发送到其他地方。'
    compact:
      title: 单行显示
      description: '`compact: true`，当页面空间有限时：文字，然后是按钮。'
    restricted:
      title: 类型和大小
      description: '`accept` — 扩展名或 MIME 类型，如 HTML 属性所述 — 和 `max_size`（以字节为单位）都已签名到目录的地址中。选择器只显示被接受的类型；服务器拒绝其他类型，文件在其第一部分时过大，内容完整后根据类型判断，上传窗口会说明原因。这里：电子表格和图像，最大 2 MB。'
      hint: '电子表格或图像，最大 2 MB'
    received:
      title: 已接收
      empty: 尚无内容。发送文件后请重新加载页面。

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: تحميل
  page_icon: 'ph:bold/upload-simple'
  intro: 'الملفات التي يتم إسقاطها في المنطقة أو اختيارها من خلال زرها تُرسل على شكل قطع إلى الدليل الذي تم توقيعه في الصفحة — أي نوع، أي حجم —، وتتابع في نافذة التحميلات المثبتة في أسفل الشاشة، والتي يمكن طيها أو إغلاقها أثناء التحميل.'
  section:
    zone:
      title: 'منطقة إسقاط'
      description: '`upload_dropzone(directory)`: اسقط الملفات هنا، أو اخترها. العنوان موقع لهذا الدليل فقط؛ المتصفح لا يمكنه إرسال أي شيء في مكان آخر.'
    compact:
      title: 'في سطر واحد'
      description: '`compact: true`، حيث تكون المساحة في الصفحة ضيقة: الكلمات، ثم الزر.'
    restricted:
      title: 'الأنواع والحجم'
      description: '`accept` — الامتدادات أو أنواع MIME، كما تقرأها خاصية HTML — و `max_size`، بالبايت، موضوعة في العنوان مع الدليل. يظهر المُختار فقط الأنواع المقبولة؛ السيرفر يرفض الباقي، ملف كبير جداً في قطعته الأولى، نوع يتم تحديده بمحتواه بمجرد أن يكون كاملاً، وتقول نافذة التحميلات السبب. هنا: جداول البيانات والصور، 2 ميغابايت كحد أقصى.'
      hint: 'جداول البيانات أو الصور، 2 ميغابايت كحد أقصى'
    received:
      title: 'تم الاستلام'
      empty: 'لا شيء بعد. قم بإعادة تحميل الصفحة بمجرد إرسال ملف.'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'अपलोड करें'
  page_icon: 'ph:bold/upload-simple'
  intro: 'जिन फ़ाइलों को ज़ोन पर गिराया गया है या उसके बटन के साथ चुना गया है, उन्हें उस निर्देशिका में टुकड़ों में भेजा जाता है जिसके लिए पृष्ठ हस्ताक्षरित है — कोई भी प्रकार, कोई भी आकार —, और उन्हें स्क्रीन के नीचे लगे अपलोड विंडो में देखा जा सकता है, जिसे बंद या मोड़ा जा सकता है।'
  section:
    zone:
      title: 'एक ड्रॉप ज़ोन'
      description: '`upload_dropzone(directory)`: फ़ाइलें यहाँ गिराएँ, या उन्हें चुनें। पता इस एक निर्देशिका के लिए हस्ताक्षरित है; ब्राउज़र कुछ और नहीं भेज सकता।'
    compact:
      title: 'एक पंक्ति में'
      description: '`compact: true`, जहाँ पृष्ठ पर थोड़ी जगह होती है: शब्द, फिर बटन।'
    restricted:
      title: 'प्रकार और आकार'
      description: '`accept` — एक्सटेंशन या MIME प्रकार, जैसे कि HTML विशेषता उनमें पढ़ती है — और `max_size`, बाइट्स में, पते में निर्देशिका के साथ हस्ताक्षरित होते हैं। पिकर केवल स्वीकृत प्रकार दिखाता है; सर्वर बाकी को अस्वीकृत करता है, पहले टुकड़े में फ़ाइल बहुत बड़ी, एक प्रकार जो उसके सामग्री द्वारा पूरे होने पर बताया गया है, और अपलोड विंडो बताती है कि क्यों। यहाँ: स्प्रेडशीट और चित्र, अधिकतम 2 MB।'
      hint: 'स्प्रेडशीट या चित्र, अधिकतम 2 MB'
    received:
      title: 'प्राप्त हुआ'
      empty: 'अभी तक कुछ नहीं। एक फ़ाइल भेजने के बाद पृष्ठ को फिर से लोड करें।'

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: העלאה
  page_icon: 'ph:bold/upload-simple'
  intro: 'קבצים שנופלים באזור או נבחרים עם הכפתור נשלחים לחתיכות לספריה שהדף חתם עליה — כל סוג, כל גודל —, ומעקב אחריהם מתבצע בחלון ההעלאות הממוקם בתחתית המסך, שניתן לקפל או לסגור בזמן ההעלאה.'
  section:
    zone:
      title: 'אזור נפילה'
      description: '`upload_dropzone(directory)`: הנח קבצים כאן, או בחר אותם. הכתובת חתומה עבור ספריה זו בלבד; הדפדפן אינו יכול לשלוח שום דבר לשום מקום אחר.'
    compact:
      title: 'בשורה אחת'
      description: '`compact: true`, כאשר לדף יש מעט מקום: המילים, ואז הכפתור.'
    restricted:
      title: 'סוגים וגודל'
      description: '`accept` — סיומות או סוגי MIME, כפי שהמאפיין HTML קורא להם — ו- `max_size`, בבתים, חתומים בכתובת עם הספריה. הבוחר מראה רק את הסוגים המתקבלים; השרת מסרב לשאר, קובץ גדול מדי בחתיכה הראשונה שלו, סוג שנאמר על ידי התוכן שלו כשהוא שלם, וחלון ההעלאות אומר למה. כאן: גיליונות אלקטרוניים ודימויים, 2 MB לכל היותר.'
      hint: 'גיליונות אלקטרוניים או דימויים, 2 MB לכל היותר'
    received:
      title: התקבל
      empty: 'אין עדיין כלום. טען מחדש את הדף לאחר ששלחת קובץ.'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: بارگذاری
  page_icon: 'ph:bold/upload-simple'
  intro: 'فایل‌هایی که روی ناحیه رها شده‌اند یا با دکمه آن انتخاب شده‌اند، به صورت تکه‌ای به دایرکتوری که صفحه برای آن امضا شده ارسال می‌شوند — هر نوع، هر اندازه — و در پنجره بارگذاری که در پایین صفحه قرار دارد دنبال می‌شوند، که می‌تواند در حین بارگذاری جمع یا بسته شود.'
  section:
    zone:
      title: 'ناحیه رها کردن'
      description: '`upload_dropzone(directory)`: فایل‌ها را اینجا رها کنید یا انتخاب کنید. آدرس برای این دایرکتوری امضا شده است؛ مرورگر نمی‌تواند چیزی به جای دیگری ارسال کند.'
    compact:
      title: 'در یک خط'
      description: '`compact: true`، زمانی که صفحه فضای کمی دارد: کلمات، سپس دکمه.'
    restricted:
      title: 'انواع و اندازه'
      description: '`accept` — پسوندها یا نوع‌های MIME، همان‌طور که ویژگی HTML آن‌ها را می‌خواند — و `max_size`، در بایت، به آدرس با دایرکتوری امضا شده‌اند. انتخاب‌کننده فقط انواع پذیرفته شده را نشان می‌دهد؛ سرور بقیه را رد می‌کند، فایلی که در تکه اول خیلی بزرگ است، نوعی که با محتوای آن مشخص می‌شود، و پنجره بارگذاری دلیل را می‌گوید. در اینجا: صفحه‌گسترده‌ها و تصاویر، حداکثر ۲ مگابایت.'
      hint: 'صفحه‌گسترده‌ها یا تصاویر، حداکثر ۲ مگابایت'
    received:
      title: 'دریافت شده'
      empty: 'هنوز هیچ چیزی نیست. پس از ارسال یک فایل، صفحه را دوباره بارگذاری کنید.'

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'اپ لوڈ کریں'
  page_icon: 'ph:bold/upload-simple'
  intro: 'زون پر گرائے گئے فائلیں یا بٹن کے ذریعے منتخب کردہ فائلیں اس ڈائرکٹری میں ٹکڑوں میں بھیجی جاتی ہیں جس کے لیے یہ صفحہ سائن کیا گیا ہے — کسی بھی قسم کی، کسی بھی سائز کی —، اور انہیں اس اپ لوڈز ونڈو میں دکھایا جاتا ہے جو اسکرین کے نیچے جڑی ہوتی ہے، جسے بند یا چھوٹا کیا جا سکتا ہے جبکہ وہ جاری رہتی ہیں۔'
  section:
    zone:
      title: 'ڈراپ زون'
      description: '`upload_dropzone(directory)`: فائلیں یہاں چھوڑیں، یا انہیں منتخب کریں۔ یہ پتہ صرف اسی ایک ڈائرکٹری کے لیے سائن کیا گیا ہے؛ براؤزر کچھ اور بھیج نہیں سکتا۔'
    compact:
      title: 'ایک لائن میں'
      description: '`compact: true`، جہاں صفحہ پر تھوڑی جگہ ہو: الفاظ، پھر بٹن۔'
    restricted:
      title: 'اقسام اور سائز'
      description: '`accept` — توسیعات یا MIME اقسام، جیسے کہ HTML کی خصوصیت میں پڑھا گیا ہے — اور `max_size`، بائٹس میں، پتہ میں ڈائرکٹری کے ساتھ سائن کیے جاتے ہیں۔ پکر صرف قبول شدہ اقسام دکھاتا ہے؛ سرور باقی کو مسترد کرتا ہے، پہلی ٹکڑی میں ایک فائل بہت بڑی، ایک قسم جو اس کے مواد کے ذریعے ایک بار مکمل ہونے پر بتائی گئی، اور اپ لوڈز ونڈو بتاتی ہے کیوں۔ یہاں: اسپریڈشیٹس اور تصاویر، زیادہ سے زیادہ 2 MB۔'
      hint: 'اسپریڈشیٹس یا تصاویر، زیادہ سے زیادہ 2 MB'
    received:
      title: 'موصول ہوا'
      empty: 'ابھی کچھ نہیں۔ جب کوئی فائل بھیجی جائے تو صفحہ کو دوبارہ لوڈ کریں.'

ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: アップロード
  page_icon: 'ph:bold/upload-simple'
  intro: 'ゾーンにドロップされたファイルまたはボタンで選択されたファイルは、ページが署名したディレクトリに分割して送信されます — どんな種類でも、どんなサイズでも — そして、画面の下部にドッキングされたアップロードウィンドウで追跡されます。このウィンドウは、送信中に折りたたむことも閉じることもできます。'
  section:
    zone:
      title: ドロップゾーン
      description: '`upload_dropzone(directory)`：ここにファイルをドロップするか、選択してください。このアドレスはこの1つのディレクトリに署名されています。ブラウザは他の場所に送信することはできません。'
    compact:
      title: 1行表示
      description: '`compact: true`、スペースが限られているページで：単語の後にボタン。'
    restricted:
      title: 種類とサイズ
      description: '`accept` — 拡張子またはMIMEタイプ、HTML属性が読み取るもの — および `max_size`（バイト単位）は、ディレクトリとともにアドレスに署名されています。ピッカーは受け入れられる種類のみを表示し、サーバーは残りを拒否します。ファイルが最初の部分で大きすぎる場合や、全体が揃ったときにその内容によって種類が決まる場合、アップロードウィンドウが理由を表示します。ここでは：スプレッドシートと画像、最大2MB。'
      hint: スプレッドシートまたは画像、最大2MB
    received:
      title: 受信済み
      empty: まだ何もありません。ファイルが送信されたら、ページを再読み込みしてください。

ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 업로드
  page_icon: 'ph:bold/upload-simple'
  intro: '드래그하여 영역에 놓거나 버튼으로 선택한 파일은 페이지가 서명한 디렉토리로 조각조각 전송됩니다 — 모든 종류, 모든 크기 — , 그리고 화면 하단에 고정된 업로드 창에서 진행 상황을 확인할 수 있으며, 파일 전송 중에도 창을 접거나 닫을 수 있습니다.'
  section:
    zone:
      title: '드롭 존'
      description: '`upload_dropzone(directory)`: 여기서 파일을 드롭하거나 선택하세요. 주소는 이 디렉토리에 서명되어 있으며, 브라우저는 다른 곳으로 전송할 수 없습니다.'
    compact:
      title: '한 줄에'
      description: '`compact: true`, 공간이 적은 페이지에서: 단어와 버튼이 이어집니다.'
    restricted:
      title: '종류와 크기'
      description: '`accept` — 확장자 또는 MIME 타입, HTML 속성이 읽는 대로 — 및 `max_size`(바이트 단위)는 디렉토리와 함께 주소에 서명됩니다. 선택기는 허용된 종류만 표시하며; 서버는 나머지를 거부하고, 첫 조각에서 너무 큰 파일이나 내용에 따라 전체적으로 알려진 종류는 업로드 창에서 사유를 설명합니다. 여기: 스프레드시트와 이미지, 최대 2MB입니다.'
      hint: '스프레드시트 또는 이미지, 최대 2MB'
    received:
      title: '받은 파일'
      empty: '아직 아무것도 없습니다. 파일이 전송되면 페이지를 새로 고치세요.'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: আপলোড
  page_icon: 'ph:bold/upload-simple'
  intro: 'একটি অঞ্চলে ফাইল ফেলা অথবা এর বোতাম দিয়ে বাছাই করা হলে সেগুলি পৃষ্ঠায় স্বাক্ষরিত ডিরেক্টরিতে টুকরো টুকরো করে পাঠানো হয় — যেকোন ধরনের, যেকোন মাপের — এবং এগুলি স্ক্রিনের নীচে ডকড আপলোড উইন্ডোতে অনুসরণ করা হয়, যা যেতে যেতে ভাঁজ করা বা বন্ধ করা যেতে পারে।'
  section:
    zone:
      title: 'একটি ড্রপ অঞ্চল'
