~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Mã
page_icon: 'ph:bold/code'
intro: 'Một trường chứa mã, được tô màu theo ngữ pháp của nó. Nó đi kèm với symfony-coding và không phải với hệ thống thiết kế, mà chỉ mượn từ đó: khung của nó là của một trường, màu sắc của nó là các mã token của bảng màu, dòng hiện tại và lựa chọn của nó là những sắc thái của bảng màu - vì vậy nó theo ánh sáng và bóng tối như mọi thứ xung quanh nó.'
section:
  server:
    title: 'Trường máy chủ'
    description: 'Một textarea thực sự, được phủ lên bởi trình soạn thảo khi trang được chạy. Textarea vẫn là trường - được gửi cùng với biểu mẫu, được nói chuyện bởi ngăn xếp biểu mẫu - vì vậy biểu mẫu hoạt động giống nhau với hoặc không có nó. Chọn qua nhiều dòng, dòng con trỏ nằm trong số đó: lựa chọn vẫn có thể nhìn thấy.'
  vue:
    title: 'Trường Vue'
    description: 'Cùng một trình soạn thảo giữ một mô hình: v-model khi vào và ra, ngôn ngữ là một thuộc tính có thể thay đổi trong khi trường đang mở.'
