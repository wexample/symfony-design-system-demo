ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'ان پٹ'
  page_icon: 'ph:bold/textbox'
  intro: 'ہر وہ فیلڈ جو سسٹم کے ساتھ آتا ہے، ایک صفحے پر۔ ان کی شکل کے علاوہ ایک معاہدہ ہے: ہر ایک کو کسی اور کے حوالے کیا جا سکتا ہے جو اسے بھرے گا اور واپس دے گا۔'
  section:
    assisted:
      title: مدد
      description: 'ایک فیلڈ کو ایک ایجنٹ یا کسی بھی چیز کے ذریعے لیا جا سکتا ہے جو جانتا ہے کہ کیا لکھنا ہے۔ جب یہ تھامے ہوئے ہے تو یہ ایسا کہتا ہے، کی بورڈ اور پوائنٹر کا جواب دینا بند کر دیتا ہے، اور اس کی قیمت اس طرح ظاہر ہوتی ہے جس طرح فیلڈ فیصلہ کرتا ہے: ایک لفظ کے لئے واضح، ایک آپشن کے لئے منتخب، ایک سوئچ کے لئے ٹک کیا ہوا۔ مدد کی نوعیت عارضی ہے؛ ایک مدد کی گئی فیلڈ وہ ہوتی ہے جسے کوئی استعمال نہیں کر سکتا۔'
    fields:
      title: فیلڈز
      description: 'ہر ایک کا ایک، ایک بار۔ اوپر پلے دبائیں اور انہیں باری باری بھرا جائے گا، اسی کالز کے ذریعے جو ایک ایجنٹ کرے گا — جو یہ جاننے کا واحد طریقہ ہے کہ معاہدہ ان سب کے لئے برقرار ہے۔'
    actions:
      title: 'فارم میں بٹن'
      description: 'ایک بٹن ایک عمل انجام دیتا ہے نہ کہ ایک قیمت، لہذا اس میں لکھنے کے لیے کچھ نہیں ہے۔'
    code:
      title: 'سیلز میں ایک کوڈ'
      description: 'سیلز کے نیچے ایک حقیقی فیلڈ، تاکہ سرور ایک قیمت پڑھے اور براؤزر وہی رکھے جو وہ پہلے سے کرتا ہے: ایک پیسٹ کیا ہوا کوڈ مکمل طور پر آتا ہے، ایک فون اسے موصول کردہ کوڈ پیش کرتا ہے، بیک اسپیس واپس جاتا ہے۔ بھرنے پر، یہ اپنے آپ اپنا فارم بھیجتا ہے — اس صفحے پر بند کر دیا گیا، جسے بھیجنے کی کوئی جگہ نہیں ہے۔'
    select:
      title: 'خود ہی منتخب کریں'
      description: 'دو حسب ضرورت منتخب کریں جو ایک فارم گروپ کے باہر ہیں، جیسے کہ ایک ٹول بار یا فلٹر بار انہیں رکھتا ہے۔'
    switch:
      title: 'خود ہی سوئچ کریں'
      description: 'دونوں طرف لیبل، اندر گلیف، اور چیک شدہ حالت۔'
    switch_tone:
      title: 'ایک لہجے کے ساتھ سوئچ، اور ایک جو پوچھتا ہے'
      description: "ایک بار آن ہونے پر، ایک سوئچ کسی حالت یا زمرے کا رنگ لے سکتا ہے نہ کہ لنک کا۔ ایک جو کسی چیز پر سوئچ کرتا ہے جس کے نتائج ہوتے ہیں 'خبردار' لیتا ہے، اور پہلے پوچھتا ہے: انکار پر، یہ بند رہتا ہے۔ بند کرنا کبھی بھی سوال نہیں ہوتا۔ کسی بھی طرح یہ 'سوئچ:تبدیل' کو صفحے پر کہتا ہے۔"
    switch_vue:
      title: 'ویو میں سوئچ'
      description: 'ویو درخت کے اندر وہی سوئچ، جہاں چیک شدہ حالت ریاست ہے اور یہ کوئی ڈیٹا ایٹریبیوٹ نہیں ہے جو اسکرپٹ پلٹتا ہے۔'
  assisted:
    hint: 'ایک ایجنٹ نیچے کے فیلڈز کو ایک کے بعد ایک بھرے گا۔'
    play: چلائیں
    reset: 'ری سیٹ کریں'
  field:
