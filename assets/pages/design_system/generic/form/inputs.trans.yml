    vue: 'أربعة أرقام، في vue'
  switch:
    tone:
      success: 'تم المزامنة'
      mint: 'تم وضع علامة'
      risky: 'نشر عند الحفظ'
    confirm:
      title: 'نشر عند الحفظ؟'
