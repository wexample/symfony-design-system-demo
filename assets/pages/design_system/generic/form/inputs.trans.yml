      title: 'آیا می‌خواهید منتشر کنید؟'
      message: 'هر ذخیره به طور همزمان منتشر خواهد شد، بدون بازنگری در بین آنها.'
      accept: 'روشن کردن'
    label_right: 'فعال کردن ویژگی'
    label_left: 'برچسب در سمت چپ'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Syötteet
  page_icon: 'ph:bold/textbox'
  intro: 'Jokainen kenttä, jonka järjestelmä toimittaa, yhdellä sivulla. Yhteistä niiden muodon lisäksi on sopimus: jokainen voidaan luovuttaa jollekulle muulle kuin lukijalle, joka täyttää sen ja palauttaa sen.'
  section:
    assisted:
      title: Apu
      description: 'Kenttä voidaan ottaa haltuun - agentin, tai minkä tahansa, joka tietää mitä kirjoittaa. Kun se on hallinnassa, se ilmoittaa siitä, eikä vastaa näppäimistölle tai osoittimelle, ja arvo näkyy niin kuin kenttä päättää: kirjoitettuna sanana, valittuna vaihtoehtona, tai rastitettuna kytkimenä. Apua on luonteeltaan tilapäistä; avustettu kenttä on kenttä, jota kukaan ei voi käyttää.'
    fields:
      title: Kentät
      description: 'Yksi kustakin, kerran. Paina Toista ylhäällä ja ne täytetään vuorotellen, samalla tavalla kuin agentti toimisi - mikä on ainoa tapa tietää, että sopimus pitää kaikissa niissä.'
    actions:
      title: 'Napit lomakkeessa'
      description: 'Nappi suorittaa toiminnon, ei arvoa, joten agentille ei ole mitään kirjoitettavaa siihen.'
    code:
      title: 'Koodi, soluissa'
      description: 'Yksi todellinen kenttä solujen alla, joten palvelin lukee yhden arvon ja selain pitää sen, mitä se jo tekee: liitetty koodi saapuu kokonaisena, puhelin tarjoaa vastaanottamansa koodin, backspace palaa taaksepäin. Täytettynä se lähettää lomakkeensa itsenäisesti - pois päältä tällä sivulla, jossa ei ole minne lähettää sitä.'
    select:
      title: 'Valinta, omillaan'
      description: 'Kaksi mukautettua valintaa lomakejoukon ulkopuolella, kuten työkalupalkki tai suodatinpalkki asettaa ne.'
    switch:
      title: 'Kytkin, omillaan'
      description: 'Tunnisteet kummallakin puolella, symbolit sisällä, ja valittu tila.'
    switch_tone:
      title: 'Kytkin sävyllä, ja yksi, joka kysyy'
      description: 'Kun kytkin on päällä, se voi ottaa tilan tai kategorian värin sen sijaan, että linkin väri olisi. Yksi, joka kytkee jotakin päälle, jolla on seurauksia, ottaa `varoituksen` ja kysyy ensin: kieltäytyminen, se pysyy pois päältä. Pois kytkemistä ei koskaan kyseenalaisteta. Joka tapauksessa se ilmoittaa `kytkin:muutos` sivulle.'
    switch_vue:
      title: 'Kytkin, vue:ssa'
      description: 'Sama kytkin vue-puussa, jossa valittu tila on tila eikä datan attribuutti, jota skripti vaihtaa.'
  assisted:
    hint: 'Agentti täyttää alla olevat kentät, yksi kerrallaan.'
