es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Entradas
  page_icon: 'ph:bold/textbox'
  intro: 'Cada campo que el sistema envía, en una página. Lo que tienen en común más allá de su forma es un contrato: cada uno puede ser entregado a algo que no es la persona que lee, que lo llena y lo devuelve.'
  section:
    assisted:
      title: Asistencia
      description: 'Un campo puede ser tomado — por un agente, por cualquier cosa que sepa qué escribir. Mientras esté ocupado, lo dice, deja de responder al teclado y al puntero, y el valor aparece como el campo decide: escrito para una palabra, elegido para una opción, marcado para un interruptor. La asistencia es temporal por naturaleza; un campo dejado asistido es un campo que nadie puede usar.'
    fields:
      title: Campos
      description: 'Uno de cada uno, una vez. Presiona Reproducir arriba y se llenan uno tras otro, por las mismas llamadas que haría un agente — que es la única forma de saber que el contrato se mantiene para todos ellos.'
    scale:
      title: 'Segmentos y escalas'
      description: '`segmented: true` dibuja un grupo de opciones como una franja de segmentos, para una elección entre algunas opciones cortas: los mismos botones de opción, movidos por las flechas, enviando el mismo valor. `range-input` toma un valor a lo largo de una escala — `min`, `max`, `step` — y lo muestra junto a su etiqueta mientras se desplaza, en la configuración regional de la página y con los decimales que su paso requiere; `suffix` es una palabra después de él, que nunca se envía. El gemelo de vue emite en cada paso, por lo que una página puede recalcular a medida que se mueve el pulgar.'
    stepper:
      title: 'Un paso a la vez'
      description: 'stepper: true, un botón a cada lado de un número — una cantidad. Avanza según el paso del campo y se detiene en su mínimo y máximo, su botón descansando ahí; desde symfony-forms, los límites provienen de la restricción de rango del campo.'
    addon:
      title: 'Una unidad junto al valor'
      description: 'Una palabra fija — una unidad, una moneda — dibujada en el marco del campo, antes o después del valor. Los lectores de pantalla la leen junto con el campo; no es parte del valor, no puede ser enfocada, y nada de ella se envía. La apariencia congelada se mantiene con ella.'
    frozen:
      title: 'Congelado y mostrado'
      description: 'Un campo congelado mantiene un valor que alguien puede leer y no cambiar: establecido, no no disponible. Mantiene el contraste de un campo editable y sigue siendo enfocable y seleccionable — solo lo que invita a escribir se muestra: un marco discontínuo sobre ningún fondo propio, sin cursor de texto, sin selector. Un valor de visualización no es un campo en absoluto: una etiqueta y lo que dice el registro, en la línea de un campo para que los dos se lean como un solo bloque, un guion cuando no hay nada. Los campos de vue toman `readonly` de la misma manera; una selección, botones de opción, un interruptor, un archivo, un código o un emoji, que HTML no puede hacer de solo lectura, muestran su valor en un campo de solo lectura que no tiene nombre.'
    actions:
      title: 'Botones en un formulario'
      description: 'Un botón toma una acción en lugar de un valor, así que no hay nada que un agente pueda escribir en él.'
    code:
      title: 'Un código, en celdas'
      description: 'Un campo real bajo las celdas, así el servidor lee un valor y el navegador mantiene lo que ya hace: un código pegado aterriza completo, un teléfono ofrece el código que recibió, retroceder regresa. Lleno, envía su formulario por sí mismo — desactivado en esta página, que no tiene a dónde enviarlo.'
    select:
      title: 'Seleccionar, por sí solo'
      description: 'Los dos selects personalizados fuera de un grupo de formulario, como una barra de herramientas o una barra de filtro los coloca.'
    switch:
      title: 'Interruptor, por sí solo'
      description: 'Etiquetas a cada lado, glifos dentro, y el estado marcado.'
    switch_tone:
      title: 'Un interruptor con un tono, y uno que pregunta'
      description: 'Una vez activado, un interruptor puede tomar el color de un estado o de una categoría en lugar del del enlace. Uno que activa algo con consecuencias toma `advertencia`, y pregunta antes: si se rechaza, permanece apagado. Apagar nunca se cuestiona. De cualquier manera, dice `switch:change` a la página.'
    switch_vue:
      title: 'Interruptor, en vue'
      description: 'El mismo interruptor dentro de un árbol vue, donde el estado marcado es estado y no un atributo de datos que un script cambia.'
  scale:
    window: Ventana
