hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: इनपुट्स
  page_icon: 'ph:bold/textbox'
  intro: 'प्रणाली द्वारा भेजे गए प्रत्येक क्षेत्र को एक पृष्ठ पर। उनके आकार के अलावा जो सामान्य है, वह एक अनुबंध है: प्रत्येक को किसी ऐसी चीज़ में सौंपा जा सकता है जो पढ़ने वाला व्यक्ति नहीं है, जो इसे भरता है और इसे वापस देता है।'
  section:
    assisted:
      title: सहायता
      description: 'एक क्षेत्र पर कब्जा किया जा सकता है - एक एजेंट द्वारा, किसी भी चीज़ द्वारा जो जानती है कि क्या लिखना है। जब इसे पकड़ा जाता है तो यह ऐसा बताता है, कीबोर्ड और पॉइंटर का जवाब देना बंद कर देता है, और मूल्य उस तरीके से दिखता है जिसे क्षेत्र तय करता है: एक शब्द के लिए लिखा हुआ, एक विकल्प के लिए चुना हुआ, एक स्विच के लिए टिक किया हुआ। सहायता स्वाभाविक रूप से अस्थायी है; एक क्षेत्र जो सहायक है, वह एक ऐसा क्षेत्र है जिसका कोई उपयोग नहीं कर सकता।'
    fields:
      title: क्षेत्र
      description: 'एक में से एक, एक बार। ऊपर प्ले दबाएं और इन्हें बारी-बारी से भरा जाएगा, उसी कॉल द्वारा जो एक एजेंट करेगा - जो यह जानने का एकमात्र तरीका है कि अनुबंध सभी के लिए लागू है।'
    scale:
      title: 'सेगमेंट और स्केल'
      description: '`segmented: true` एक रेडियो समूह को सेगमेंट की पट्टी के रूप में दिखाता है, कुछ छोटे विकल्पों में से एक चयन के लिए: वही रेडियो, जिन्हें तीरों द्वारा स्थानांतरित किया जाता है, वही मान भेजते हैं। `range-input` एक स्केल के साथ एक मान लेता है — `min`, `max`, `step` — और जैसे-जैसे यह आगे बढ़ता है, इसके लेबल के बगल में इसे पृष्ठ की स्थानीय भाषा में और उसके कदम के अनुसार दशमलव के साथ बताता है; `suffix` इसके बाद एक शब्द है, जिसे कभी भी जमा नहीं किया जाता। vue ट्विन हर कदम पर उत्सर्जित होता है, इसलिए एक पृष्ठ थंब के चलते फिर से गणना कर सकता है।'
    stepper:
      title: 'एक बार में एक कदम'
      description: 'stepper: true, संख्या के प्रत्येक ओर एक बटन — एक मात्रा। यह क्षेत्र के कदम द्वारा कदम बढ़ाता है और अपने न्यूनतम और अधिकतम पर रुकता है, इसका बटन वहीं आराम करता है; symfony-forms से, सीमाएँ क्षेत्र की रेंज बाधा से आती हैं।'
    addon:
      title: 'मान के बगल में एक इकाई'
      description: 'एक निश्चित शब्द — एक इकाई, एक मुद्रा — क्षेत्र के फ्रेम में, मान के पहले या बाद में दिखाया गया है। स्क्रीन रीडर इसे क्षेत्र के साथ पढ़ते हैं; यह मान का हिस्सा नहीं है, इसे फोकस नहीं किया जा सकता, और इसका कुछ भी जमा नहीं किया जाता। जमी हुई दृष्टि इसके साथ बनी रहती है।'
    frozen:
      title: 'जमा हुआ, और दिखाया गया'
      description: 'एक जमा हुआ क्षेत्र एक मान रखता है जिसे कोई पढ़ सकता है और नहीं बदल सकता: निश्चित, न कि अनुपलब्ध। यह एक संपादनीय क्षेत्र का कंट्रास्ट बनाए रखता है और फोकस और चयन योग्य बना रहता है — केवल वही जो लेखन को आमंत्रित करता है: एक बिना ग्राउंड के डैश फ्रेम, कोई टेक्स्ट कर्सर नहीं, कोई पिकर नहीं। एक प्रदर्शन मान वास्तव में एक क्षेत्र नहीं है: एक लेबल और जो रिकॉर्ड कहता है, एक क्षेत्र की रेखा पर ताकि दोनों एक ब्लॉक के रूप में पढ़े जाएं, जब कुछ नहीं हो तो एक डैश। vue क्षेत्र `readonly` को उसी तरह लेता है; एक चयन, रेडियो, एक स्विच, एक फ़ाइल, एक कोड या एक इमोजी, जिसे HTML readonly नहीं बना सकता, अपना मान readonly क्षेत्र में दिखाते हैं जो कोई नाम नहीं रखता।'
    actions:
      title: 'फॉर्म में बटन'
      description: 'एक बटन एक क्रिया लेता है न कि एक मूल्य, इसलिए इसमें लिखने के लिए एजेंट के लिए कुछ नहीं है।'
    code:
      title: 'एक कोड, कोशिकाओं में'
      description: 'कोशिकाओं के नीचे एक असली क्षेत्र, ताकि सर्वर एक मूल्य पढ़ सके और ब्राउज़र वही रख सके जो वह पहले से करता है: एक चिपकाया गया कोड पूरा आता है, एक फोन वह कोड प्रदान करता है जो उसे मिला, बैकस्पेस वापस जाता है। भरा हुआ, यह अपने आप अपना फॉर्म भेजता है - इस पृष्ठ पर बंद किया गया, जिसका कहीं भेजने के लिए नहीं है।'
    select:
      title: 'स्वचालित चयन'
      description: 'फॉर्म समूह के बाहर दो कस्टम चयन, जैसे एक टूलबार या एक फ़िल्टर बार उन्हें रखता है।'
    switch:
      title: 'स्विच, अपने आप'
      description: 'दोनों ओर लेबल, अंदर चित्र, और चेक किया गया स्थिति।'
    switch_tone:
      title: 'एक टोन के साथ स्विच, और एक जो पूछता है'
      description: 'एक बार चालू होने पर, एक स्विच एक स्थिति या श्रेणी के रंग को ले सकता है न कि लिंक के। एक जो कुछ ऐसे स्विच करता है जिसके परिणाम होते हैं वह `चेतावनी` लेता है और पहले पूछता है: अस्वीकृत होने पर, यह बंद रहता है। बंद करना कभी नहीं पूछा जाता। किसी भी तरह यह पृष्ठ को `स्विच: परिवर्तन` कहता है।'
