he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'שדות קלט'
  page_icon: 'ph:bold/textbox'
  intro: 'כל שדה שהמערכת מספקת, בדף אחד. מה שיש להם במשותף מעבר לצורתם הוא הסכם: כל אחד מהם יכול להיות מועבר למשהו שאינו האדם הקורא, שממלא אותו ומחזיר אותו.'
  section:
    assisted:
      title: עזרה
      description: 'שדה יכול להיות נתפס — על ידי סוכן, על ידי כל דבר שיודע מה לכתוב. בזמן שהוא מוחזק הוא אומר כך, מפסיק להגיב למקלדת ולסמן, והערך מופיע כפי שהשדה מחליט: מאויית למילה, נבחר לאופציה, מסומן למתג. עזרה היא זמנית מטבעה; שדה שנותר בעזרה הוא שדה שאף אחד לא יכול להשתמש בו.'
    fields:
      title: שדות
      description: 'אחד מכל סוג, פעם אחת. לחץ על נגן למעלה והם יתמלאו בתור, על ידי אותן קריאות שסוכן היה עושה — שזהו הדרך היחידה לדעת שההסכם מחזיק עבור כולם.'
    scale:
      title: 'קטעים ושקלים'
      description: '`segmented: true` מצייר קבוצה רדיאלית כפס של קטעים, לבחירה אחת מתוך כמה קצרות: אותם רדיאו, מוזזים על ידי החיצים, שולחים את אותה ערך. `range-input` לוקח ערך לאורך סקאלה — `min`, `max`, `step` — ואומר אותו ליד התווית שלו כשהוא זז, בשפת הדף ובעם העשרוניות שהשלב שלו מבקש; `suffix` הוא מילה אחריו, שמעולם לא נשלחת. התאום של vue פולט בכל שלב, כך שדף יכול לחשב מחדש כשהאצבע זזה.'
    stepper:
      title: 'שלב אחד בכל פעם'
      description: 'stepper: true, כפתור בכל צד של מספר — כמות. זה מתקדם לפי הצעד של השדה ועוצר במינימום ובמקסימום שלו, הכפתור שלו נשאר שם; מהפורמים של symfony, הגבולות מגיעים מהגבלת טווח של השדה.'
    addon:
      title: 'יחידה ליד הערך'
      description: 'מילה קבועה — יחידה, מטבע — מצויירת במסגרת השדה, לפני או אחרי הערך. קוראי המסך קוראים אותה עם השדה; היא אינה חלק מהערך, לא ניתן למקד בה, ושום דבר ממנה לא נשלח. המראה הקפוא נשאר איתה.'
    frozen:
      title: 'קפוא, ומוצג'
      description: "שדה קפוא מחזיק ערך שמישהו יכול לקרוא ולא לשנות: קבוע, לא לא זמין. הוא שומר על הניגוד של שדה שניתן לעריכה ונשאר ניתן למיקוד ולבחירה — רק מה שמעודד כתיבה הולך: מסגרת מקווקווית ללא בסיס משלה, ללא סמן טקסט, ללא בורר. ערך תצוגה אינו שדה בכלל: תווית ומה שהרשומה אומרת, על קו של שדה כך ששניהם נקראים כבלוק אחד, מקף כשאין כלום. השדות של vue לוקחים `readonly` באותו אופן; בורר, רדיאו, מתג, קובץ, קוד או אימוג'י, ש-html לא יכול להפוך ל-readonly, מראים את ערכם בשדה readonly שאין לו שם."
    actions:
      title: 'כפתורים בטופס'
      description: 'כפתור לוקח פעולה ולא ערך, כך שאין מה שכתוב בו על ידי סוכן.'
    code:
      title: 'קוד, בתאים'
      description: 'שדה ממשי מתחת לתאים, כך שהשרת קורא ערך אחד והדפדפן שומר מה שהוא כבר עושה: קוד שמודבק נוחת שלם, טלפון מציע את הקוד שהוא קיבל, מקש חזרה חוזר אחורה. ממולא, הוא שולח את הטופס שלו בעצמו — כבוי בדף הזה, שאין לו לאן לשלוח אותו.'
    select:
      title: 'בחר, בעצמו'
      description: 'שני בחירות מותאמות מחוץ לקבוצת טופס, כפי שטור Toolbar או טור מסנן מציבים אותם.'
    switch:
      title: 'מתג, בעצמו'
      description: 'תיוגים משני הצדדים, סמלים בפנים, ומצב מסומן.'
    switch_tone:
      title: 'מתג עם גוון, ואחד ששואל'
      description: 'ברגע שהוא מופעל, מתג יכול לקחת את צבעו של מצב או של קטגוריה ולא של הקישור. מתג שמדליק משהו עם השלכות לוקח `אזהרה`, ושואל קודם: אם מסרבים, הוא נשאר כבוי. כיבוי לא נשאל אף פעם. כך או כך הוא אומר `switch:change` לדף.'
    switch_vue:
      title: 'מתג, ב-vue'
      description: 'אותו מתג בתוך עץ vue, שבו מצב המסומן הוא מצב ולא מאפיין נתונים שסקריפט משנה.'
