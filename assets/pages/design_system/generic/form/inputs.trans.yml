    code: 'Doğrulama kodu'
    number: Yaş
    date: 'Doğum tarihi'
    time: 'Tercih edilen zaman'
    datetime: Randevu
    select: Ülke
    radio: 'İletişim yöntemi'
    switch: 'Bülteni al'
    file: 'Kimlik belgesi'
    emoji: 'Ruh hali'
    button: 'Bir buton'
    submit: Gönder
  placeholder:
