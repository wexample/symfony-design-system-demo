ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'ان پٹ'
  page_icon: 'ph:bold/textbox'
  intro: 'ہر وہ فیلڈ جو سسٹم کے ساتھ آتا ہے، ایک صفحے پر۔ ان کی شکل کے علاوہ ایک معاہدہ ہے: ہر ایک کو کسی اور کے حوالے کیا جا سکتا ہے جو اسے بھرے گا اور واپس دے گا۔'
  section:
    assisted:
      title: مدد
      description: 'ایک فیلڈ کو ایک ایجنٹ یا کسی بھی چیز کے ذریعے لیا جا سکتا ہے جو جانتا ہے کہ کیا لکھنا ہے۔ جب یہ تھامے ہوئے ہے تو یہ ایسا کہتا ہے، کی بورڈ اور پوائنٹر کا جواب دینا بند کر دیتا ہے، اور اس کی قیمت اس طرح ظاہر ہوتی ہے جس طرح فیلڈ فیصلہ کرتا ہے: ایک لفظ کے لئے واضح، ایک آپشن کے لئے منتخب، ایک سوئچ کے لئے ٹک کیا ہوا۔ مدد کی نوعیت عارضی ہے؛ ایک مدد کی گئی فیلڈ وہ ہوتی ہے جسے کوئی استعمال نہیں کر سکتا۔'
    fields:
      title: فیلڈز
      description: 'ہر ایک کا ایک، ایک بار۔ اوپر پلے دبائیں اور انہیں باری باری بھرا جائے گا، اسی کالز کے ذریعے جو ایک ایجنٹ کرے گا — جو یہ جاننے کا واحد طریقہ ہے کہ معاہدہ ان سب کے لئے برقرار ہے۔'
    scale:
      title: 'سگمنٹ اور اسکیل'
      description: '`segmented: true` ایک ریڈیو گروپ کو ایک سیگمنٹس کی پٹی کی طرح بناتا ہے، چند چھوٹے انتخاب میں سے ایک کے لئے: یہی ریڈیوز، جو تیر کے ذریعے آگے بڑھتے ہیں، ایک ہی قیمت بھیجتے ہیں۔ `range-input` ایک اسکیل کے ساتھ ایک قیمت لیتا ہے — `min`, `max`, `step` — اور جب وہ حرکت کرتا ہے تو اس کی لیبل کے ساتھ اس کی قیمت بتاتا ہے، صفحے کی لوکیل میں اور اس کے قدم کی ضرورت کے مطابق اعشاریوں کے ساتھ؛ `suffix` ایک لفظ ہے جو اس کے بعد آتا ہے، کبھی بھی جمع نہیں ہوتا۔ Vue کا ٹوئن ہر قدم پر خارج کرتا ہے، اس لئے ایک صفحہ دوبارہ حساب کر سکتا ہے جب تھمب حرکت کرتا ہے۔'
    stepper:
      title: 'ایک قدم میں'
      description: 'stepper: true، ایک عدد کے ہر طرف ایک بٹن — ایک مقدار۔ یہ فیلڈ کے قدم سے قدم بڑھاتا ہے اور اس کے من اور زیادہ پر رکتا ہے، اس کا بٹن وہاں رہتا ہے؛ symfony-forms سے، حدود فیلڈ کے رینج کی پابندی سے آتی ہیں۔'
    addon:
      title: 'قدر کے ساتھ ایک یونٹ'
      description: 'ایک مقررہ لفظ — ایک یونٹ، ایک کرنسی — جو فیلڈ کے فریم میں، قیمت سے پہلے یا بعد میں دکھایا جاتا ہے۔ اسکرین ریڈرز اسے فیلڈ کے ساتھ پڑھتے ہیں؛ یہ قیمت کا حصہ نہیں ہے، اس پر توجہ نہیں دی جا سکتی، اور اس کا کچھ بھی جمع نہیں ہوتا۔ منجمد نظر اسی کے ساتھ رہتا ہے۔'
    frozen:
      title: 'منجمد، اور دکھایا گیا'
      description: 'ایک منجمد فیلڈ ایک قیمت رکھتا ہے جسے کوئی پڑھ سکتا ہے اور تبدیل نہیں کر سکتا: طے شدہ، غیر دستیاب نہیں۔ یہ ایک ایڈیٹیبل فیلڈ کا تضاد برقرار رکھتا ہے اور توجہ دینے کے قابل اور منتخب رہتا ہے — صرف وہی چیزیں جو لکھنے کی دعوت دیتی ہیں جاتی ہیں: ایک ڈیشڈ فریم بغیر کسی زمین کے، کوئی ٹیکسٹ کرسر، کوئی چننے والا نہیں۔ ایک ڈسپلے قیمت بالکل بھی ایک فیلڈ نہیں ہے: ایک لیبل اور جو ریکارڈ کہتا ہے، ایک فیلڈ کی لائن پر تاکہ دونوں کو ایک بلاک کے طور پر پڑھا جا سکے، جب کچھ نہ ہو تو ایک ڈیش۔ Vue کے فیلڈز `readonly` کو اسی طرح لیتے ہیں؛ ایک منتخب، ریڈیوز، ایک سوئچ، ایک فائل، ایک کوڈ یا ایک ایموجی، جسے HTML ریڈ اونلی نہیں بنا سکتا، اپنی قیمت کو ایک ریڈ اونلی فیلڈ میں دکھاتے ہیں جس کا کوئی نام نہیں ہوتا۔'
    actions:
      title: 'فارم میں بٹن'
      description: 'ایک بٹن ایک عمل انجام دیتا ہے نہ کہ ایک قیمت، لہذا اس میں لکھنے کے لیے کچھ نہیں ہے۔'
    code:
      title: 'سیلز میں ایک کوڈ'
      description: 'سیلز کے نیچے ایک حقیقی فیلڈ، تاکہ سرور ایک قیمت پڑھے اور براؤزر وہی رکھے جو وہ پہلے سے کرتا ہے: ایک پیسٹ کیا ہوا کوڈ مکمل طور پر آتا ہے، ایک فون اسے موصول کردہ کوڈ پیش کرتا ہے، بیک اسپیس واپس جاتا ہے۔ بھرنے پر، یہ اپنے آپ اپنا فارم بھیجتا ہے — اس صفحے پر بند کر دیا گیا، جسے بھیجنے کی کوئی جگہ نہیں ہے۔'
    select:
      title: 'خود ہی منتخب کریں'
      description: 'دو حسب ضرورت منتخب کریں جو ایک فارم گروپ کے باہر ہیں، جیسے کہ ایک ٹول بار یا فلٹر بار انہیں رکھتا ہے۔'
    switch:
      title: 'خود ہی سوئچ کریں'
      description: 'دونوں طرف لیبل، اندر گلیف، اور چیک شدہ حالت۔'
    switch_tone:
      title: 'ایک لہجے کے ساتھ سوئچ، اور ایک جو پوچھتا ہے'
      description: "ایک بار آن ہونے پر، ایک سوئچ کسی حالت یا زمرے کا رنگ لے سکتا ہے نہ کہ لنک کا۔ ایک جو کسی چیز پر سوئچ کرتا ہے جس کے نتائج ہوتے ہیں 'خبردار' لیتا ہے، اور پہلے پوچھتا ہے: انکار پر، یہ بند رہتا ہے۔ بند کرنا کبھی بھی سوال نہیں ہوتا۔ کسی بھی طرح یہ 'سوئچ:تبدیل' کو صفحے پر کہتا ہے۔"
    switch_vue:
