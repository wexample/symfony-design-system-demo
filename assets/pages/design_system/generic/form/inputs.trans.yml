th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ข้อมูลนำเข้า
  page_icon: 'ph:bold/textbox'
  intro: 'ทุกฟิลด์ที่ระบบจัดส่งมา อยู่ในหน้าเดียว สิ่งที่พวกเขามีร่วมกันนอกเหนือจากรูปร่างคือสัญญา: แต่ละฟิลด์สามารถถูกส่งให้กับสิ่งที่ไม่ใช่คนอ่าน ซึ่งจะกรอกข้อมูลและส่งกลับมา'
  section:
    assisted:
      title: ความช่วยเหลือ
      description: 'ฟิลด์สามารถถูกควบคุม — โดยตัวแทน หรือโดยสิ่งใดก็ตามที่รู้ว่าจะเขียนอะไร ขณะที่มันถูกควบคุม มันจะบอกเช่นนั้น หยุดตอบสนองต่อคีย์บอร์ดและตัวชี้ และค่าจะแสดงตามที่ฟิลด์กำหนด: เขียนออกมาสำหรับคำ ตัวเลือกที่เลือก หรือทำเครื่องหมายสำหรับการสลับ ความช่วยเหลือเป็นสิ่งชั่วคราวตามธรรมชาติ; ฟิลด์ที่ถูกช่วยเหลือจะเป็นฟิลด์ที่ไม่มีใครใช้ได้'
    fields:
      title: ฟิลด์
      description: 'หนึ่งรายการต่อหนึ่งครั้ง กดเล่นด้านบนและพวกมันจะถูกกรอกทีละรายการ โดยการเรียกเดียวกันที่ตัวแทนจะทำ — ซึ่งเป็นวิธีเดียวที่จะรู้ว่าสัญญายังคงอยู่สำหรับทุกฟิลด์'
    scale:
      title: ส่วนแบ่งและมาตราส่วน
      description: '`segmented: true` แสดงกลุ่มวิทยุเป็นแถบของส่วนแบ่ง สำหรับการเลือกหนึ่งในหลายตัวเลือกสั้น ๆ: วิทยุเดียวกัน เคลื่อนที่ตามลูกศร ส่งค่าเดียวกัน `range-input` รับค่าตามมาตราส่วน — `min`, `max`, `step` — และแสดงข้างป้ายของมันในภาษาของหน้าเว็บและด้วยทศนิยมตามที่ขั้นตอนต้องการ; `suffix` คือคำหลังจากนั้น ไม่ถูกส่งไป ใน vue twin จะส่งออกในทุกขั้นตอน ดังนั้นหน้าเว็บสามารถคำนวณใหม่ได้เมื่อเคลื่อนที่ตาม'
    stepper:
      title: ทีละขั้นตอน
      description: 'stepper: true, ปุ่มด้านแต่ละข้างของตัวเลข — จำนวน. มันจะเพิ่มขึ้นตามขั้นตอนของฟิลด์และหยุดที่ค่าต่ำสุดและสูงสุด ปุ่มของมันจะอยู่ที่นั่น; จาก symfony-forms ขอบเขตมาจากข้อจำกัดของฟิลด์ Range.'
    addon:
      title: หน่วยข้างค่า
      description: 'คำที่คงที่ — หน่วยเงิน — แสดงในกรอบของฟิลด์ ก่อนหรือหลังค่า. โปรแกรมอ่านหน้าจอจะอ่านมันพร้อมกับฟิลด์; มันไม่ใช่ส่วนหนึ่งของค่า ไม่สามารถเน้นได้ และไม่มีอะไรเกี่ยวกับมันถูกส่งไป ค่าแบบคงที่ยังคงอยู่ด้วยมัน.'
    frozen:
      title: 'คงที่ และแสดง'
      description: 'ฟิลด์คงที่เก็บค่าที่ใครบางคนสามารถอ่านได้และไม่เปลี่ยนแปลง: ตั้งค่าแล้ว ไม่สามารถใช้ไม่ได้. มันรักษาความแตกต่างของฟิลด์ที่แก้ไขได้และยังคงสามารถเน้นได้และเลือกได้ — เพียงแค่สิ่งที่เชิญชวนให้เขียนไป: กรอบที่มีเส้นประเหนือไม่มีพื้นของมันเอง ไม่มีเคอร์เซอร์ข้อความ ไม่มีตัวเลือก. ค่าแสดงไม่ใช่ฟิลด์เลย: ป้ายและสิ่งที่บันทึกพูดบนเส้นของฟิลด์ เพื่อให้ทั้งสองอ่านเป็นบล็อกเดียว มีเส้นประเมื่อไม่มีอะไร. ฟิลด์ vue ใช้ `readonly` ในลักษณะเดียวกัน; การเลือก วิทยุ สวิตช์ ไฟล์ รหัส หรืออีโมจิ ซึ่ง HTML ไม่สามารถทำให้ readonly แสดงค่าในฟิลด์ readonly ที่ไม่มีชื่อ.'
    actions:
      title: ปุ่มในแบบฟอร์ม
      description: 'ปุ่มทำการกระทำมากกว่าค่าหนึ่ง ดังนั้นจึงไม่มีอะไรให้ตัวแทนเขียนเข้าไป'
    code:
      title: รหัสในเซลล์
      description: 'ฟิลด์จริงหนึ่งฟิลด์อยู่ใต้เซลล์ ดังนั้นเซิร์ฟเวอร์อ่านค่าหนึ่งค่าและเบราว์เซอร์เก็บสิ่งที่มันทำอยู่แล้ว: รหัสที่วางจะลงไปทั้งหมด โทรศัพท์เสนอรหัสที่มันได้รับ แป้นกลับจะกลับไป ฟิลด์ที่กรอกแล้วจะส่งแบบฟอร์มด้วยตัวเอง — ปิดใช้งานในหน้านี้ ซึ่งไม่มีที่ส่งไป'
    select:
      title: 'เลือก, ด้วยตัวเอง'
      description: 'สองตัวเลือกที่กำหนดเองนอกกลุ่มแบบฟอร์ม เหมือนแถบเครื่องมือหรือแถบกรองวางพวกมัน'
    switch:
      title: 'สลับ, ด้วยตัวเอง'
      description: 'ป้ายกำกับที่อยู่ทั้งสองด้าน สัญลักษณ์ข้างใน และสถานะที่ถูกเลือก'
    switch_tone:
      title: 'สลับพร้อมโทนเสียง และหนึ่งที่ถาม'
      description: 'เมื่อเปิดแล้ว สลับสามารถมีสีของสถานะหรือหมวดหมู่แทนที่จะเป็นของลิงก์ หนึ่งที่สลับในสิ่งที่มีผลกระทบจะใช้ `warning` และถามก่อน: หากปฏิเสธ มันจะยังคงปิด สลับปิดไม่เคยถูกตั้งคำถาม ไม่ว่าจะด้วยวิธีใดมันจะบอก `switch:change` ไปยังหน้า'
    switch_vue:
      title: 'สลับ, ใน vue'
      description: 'สลับเดียวกันภายในต้นไม้ vue ซึ่งสถานะที่ถูกเลือกเป็นสถานะและไม่ใช่คุณสมบัติข้อมูลที่สคริปต์พลิก'
