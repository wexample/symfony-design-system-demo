pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Pola wejściowe'
  page_icon: 'ph:bold/textbox'
  intro: 'Każde pole, które system dostarcza, na jednej stronie. To, co je łączy oprócz kształtu, to umowa: każde z nich może być przekazane czemuś, co nie jest osobą czytającą, które je wypełnia i oddaje.'
  section:
    assisted:
      title: Wsparcie
      description: 'Pole może być przejęte — przez agenta, przez cokolwiek, co wie, co wpisać. Gdy jest zajęte, informuje o tym, przestaje odpowiadać na klawiaturę i wskaźnik, a wartość pojawia się tak, jak postanowiło pole: rozpisana dla słowa, wybrana dla opcji, zaznaczona dla przełącznika. Wsparcie jest z definicji tymczasowe; pole pozostawione z wsparciem to pole, z którego nikt nie może skorzystać.'
    fields:
      title: Pola
      description: 'Jedno z każdego, raz. Naciśnij Odtwórz powyżej, a będą wypełniane po kolei, przez te same wywołania, które wykonałby agent — co jest jedynym sposobem, aby upewnić się, że umowa obowiązuje dla wszystkich.'
    scale:
      title: 'Segmenty i skale'
      description: '`segmented: true` rysuje grupę przycisków radiowych jako pasek segmentów, do jednego wyboru spośród kilku krótkich: te same radiowe, przesuwane przez strzałki, wysyłające tę samą wartość. `range-input` przyjmuje wartość wzdłuż skali — `min`, `max`, `step` — i wyświetla ją obok etykiety w lokalizacji strony oraz z dziesiętnymi, jakie wymaga jego krok; `suffix` to słowo po nim, nigdy nie wysyłane. Podwójna vue emituje na każdym kroku, więc strona może przeliczać, gdy suwak się porusza.'
    stepper:
      title: 'Jedno kroki na raz'
      description: 'stepper: true, przycisk po każdej stronie liczby — ilości. Krok po kroku według kroku pola i zatrzymuje się na jego minimum i maksimum, przycisk spoczywa tam; z symfony-forms, granice pochodzą z ograniczenia zakresu pola.'
    addon:
      title: 'Jednostka obok wartości'
      description: 'Stałe słowo — jednostka, waluta — rysowane w ramce pola, przed lub po wartości. Czytniki ekranu odczytują to razem z polem; nie jest częścią wartości, nie można go skupić, i nic z tego nie jest wysyłane. Zamrożony wygląd trzyma się z nim.'
    frozen:
      title: 'Zamrożony i pokazany'
      description: 'Zamrożone pole trzyma wartość, którą ktoś może przeczytać i nie zmieniać: ustalone, nie niedostępne. Zachowuje kontrast edytowalnego pola i pozostaje możliwe do skupienia i zaznaczenia — tylko to, co zaprasza do pisania, przechodzi: przerywana ramka nad brakiem własnego tła, bez kursora tekstowego, bez wyboru. Wartość wyświetlana nie jest polem w ogóle: etykietą i tym, co mówi rekord, na linii pola, tak aby obie były odczytywane jako jeden blok, myślnik, gdy nie ma nic. Pola vue przyjmują `readonly` w ten sam sposób; wybór, radiowe, przełącznik, plik, kod lub emoji, które HTML nie może uczynić readonly, pokazują swoją wartość w polu readonly, które nie ma nazwy.'
    actions:
      title: 'Przyciski w formularzu'
      description: 'Przycisk podejmuje działanie, a nie wartość, więc nie ma nic do zapisania przez agenta.'
    code:
      title: 'Kod, w komórkach'
