pt_BR:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Entradas
  page_icon: 'ph:bold/textbox'
  intro: 'Todos os campos que o sistema oferece, em uma página. O que eles têm em comum além da forma é um contrato: cada um pode ser entregue a algo que não é a pessoa que lê, que o preenche e o devolve.'
  section:
    assisted:
      title: Assistência
      description: 'Um campo pode ser tomado — por um agente, por qualquer coisa que saiba o que escrever. Enquanto estiver ocupado, ele avisa, para de responder ao teclado e ao ponteiro, e o valor aparece da forma que o campo decidir: escrito por uma palavra, escolhido por uma opção, marcado por uma chave. A assistência é temporária por natureza; um campo assistido é um campo que ninguém pode usar.'
    fields:
      title: Campos
      description: 'Um de cada, uma vez. Pressione Play acima e eles serão preenchidos por turno, pelas mesmas chamadas que um agente faria — que é a única maneira de saber que o contrato se aplica a todos eles.'
    scale:
      title: 'Segmentos e escalas'
      description: '`segmented: true` desenha um grupo de rádio como uma faixa de segmentos, para uma escolha entre algumas opções curtas: os mesmos rádios, movidos pelas setas, enviando o mesmo valor. `range-input` pega um valor ao longo de uma escala — `min`, `max`, `step` — e o diz ao lado de seu rótulo enquanto se move, no local da página e com as casas decimais que seu passo pede; `suffix` é uma palavra depois disso, nunca submetida. O twin vue emite a cada passo, assim uma página pode recalcular conforme o controle deslizante se move.'
    stepper:
      title: 'Um passo de cada vez'
      description: 'stepper: true, um botão de cada lado de um número — uma quantidade. Ele avança de acordo com o passo do campo e para em seu min e max, seu botão repousando lá; das symfony-forms, os limites vêm da restrição de Intervalo do campo.'
    addon:
      title: 'Uma unidade ao lado do valor'
      description: 'Uma palavra fixa — uma unidade, uma moeda — desenhada na moldura do campo, antes ou depois do valor. Leitores de tela leem isso junto com o campo; não faz parte do valor, não pode ser focado e nada disso é submetido. A aparência congelada se mantém com isso.'
    frozen:
      title: 'Congelado, e mostrado'
      description: 'Um campo congelado mantém um valor que alguém pode ler e não mudar: fixado, não indisponível. Ele mantém o contraste de um campo editável e permanece focável e selecionável — apenas o que convida a escrever vai: uma moldura tracejada sobre nenhum fundo próprio, sem cursor de texto, sem seletor. Um valor de exibição não é um campo: um rótulo e o que o registro diz, na linha de um campo para que os dois sejam lidos como um bloco, um traço quando não há nada. Os campos vue adotam `readonly` da mesma forma; um select, rádios, um switch, um arquivo, um código ou um emoji, que o HTML não pode tornar readonly, mostram seu valor em um campo readonly que não possui nome.'
    actions:
      title: 'Botões em um formulário'
      description: 'Um botão executa uma ação em vez de um valor, então não há nada para um agente escrever nele.'
    code:
      title: 'Um código, em células'
      description: 'Um campo real sob as células, para que o servidor leia um valor e o navegador mantenha o que já faz: um código colado chega inteiro, um telefone oferece o código que recebeu, backspace volta. Preenchido, ele envia seu formulário por conta própria — desligado nesta página, que não tem para onde enviá-lo.'
    select:
      title: 'Selecionar, por conta própria'
      description: 'Os dois selects personalizados fora de um grupo de formulário, como uma barra de ferramentas ou uma barra de filtro os coloca.'
    switch:
      title: 'Alternar, por conta própria'
      description: 'Rótulos de cada lado, ícones dentro, e o estado marcado.'
    switch_tone:
      title: 'Um switch com um tom, e um que pergunta'
      description: 'Uma vez ligado, um switch pode assumir a cor de um estado ou de uma categoria em vez da cor do link. Um que ativa algo com consequências usa `warning`, e pergunta antes: se recusado, ele permanece desligado. Desligar nunca é questionado. De qualquer forma, ele diz `switch:change` para a página.'
    switch_vue:
      title: 'Switch, em vue'
      description: 'O mesmo switch dentro de uma árvore vue, onde o estado marcado é estado e não um atributo de dado que um script altera.'
  scale:
    window: Janela
    window_3: '3 meses'
    window_6: '6 meses'
    window_12: '12 meses'
    coverage: 'Coeficiente de cobertura'
    buffer: Buffer
    weeks: semanas
