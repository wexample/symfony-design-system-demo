it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Input
  page_icon: 'ph:bold/textbox'
  intro: "Ogni campo fornito dal sistema, su un'unica pagina. Ciò che hanno in comune oltre alla loro forma è un contratto: ciascuno può essere gestito da qualcosa che non è la persona che legge, che lo compila e lo restituisce."
  section:
    assisted:
      title: Assistenza
      description: "Un campo può essere preso in carico — da un agente, da qualsiasi cosa sappia cosa scrivere. Mentre è in carico, lo indica, smette di rispondere alla tastiera e al puntatore, e il valore appare come decide il campo: scritto per una parola, scelto per un'opzione, selezionato per un interruttore. L'assistenza è temporanea per natura; un campo assistito è un campo che nessuno può usare."
    fields:
      title: Campi
      description: "Uno di ciascuno, una sola volta. Premi Play sopra e verranno compilati a turno, con le stesse chiamate che farebbe un agente — che è l'unico modo per sapere che il contratto è valido per tutti."
    actions:
      title: 'Pulsanti in un modulo'
      description: "Un pulsante esegue un'azione piuttosto che un valore, quindi non c'è nulla da scrivere al suo interno da parte di un agente."
    code:
      title: 'Un codice, nelle celle'
      description: 'Un vero campo sotto le celle, così il server legge un valore e il browser mantiene ciò che già fa: un codice incollato arriva intero, un telefono offre il codice ricevuto, il tasto backspace torna indietro. Compilato, invia il suo modulo autonomamente — disattivato in questa pagina, che non ha dove inviarlo.'
    select:
      title: 'Seleziona, da solo'
      description: 'I due selettori personalizzati al di fuori di un gruppo di moduli, come una barra degli strumenti o una barra dei filtri li colloca.'
    switch:
      title: 'Interruttore, da solo'
      description: "Etichette su entrambi i lati, glifi all'interno, e lo stato selezionato."
    switch_tone:
      title: 'Un interruttore con un tono, e uno che chiede'
      description: 'Una volta attivato, un interruttore può assumere il colore di uno stato o di una categoria piuttosto che quello del link. Uno che attiva qualcosa con conseguenze prende `warning`, e chiede prima: rifiutato, rimane spento. Disattivare non viene mai messo in discussione. In entrambi i casi dice `switch:change` alla pagina.'
    switch_vue:
      title: 'Interruttore, in vue'
      description: "Lo stesso interruttore all'interno di un albero vue, dove lo stato selezionato è stato e non un attributo dati che uno script cambia."
  assisted:
    hint: "Un agente compila i campi qui sotto, uno dopo l'altro."
