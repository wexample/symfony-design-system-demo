en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Inputs
  page_icon: ph:bold/textbox

  intro: "Every field the system ships, on one page. What they have in common beyond their shape is a contract: each one can be handed over to something that is not the person reading, which fills it and gives it back."

  section:
    assisted:
      title: Assistance
      description: "A field can be taken over — by an agent, by anything that knows what to write. While it is held it says so, stops answering to the keyboard and the pointer, and the value appears the way the field decides: spelled out for a word, chosen for an option, ticked for a switch. Assistance is temporary by nature; a field left assisted is a field nobody can use."
    fields:
      title: Fields
      description: "One of each, once. Press Play above and they are filled in turn, by the same calls an agent would make — which is the only way to know the contract holds for all of them."
    frozen:
      title: Frozen, and shown
      description: "A frozen field holds a value someone may read and not change: settled, not unavailable. It keeps the contrast of an editable field and stays focusable and selectable — only what invites writing goes: a dashed frame over no ground of its own, no text cursor, no picker. A display value is not a field at all: a label and what the record says, on the line of a field so the two read as one block, a dash when there is nothing. The vue fields take `readonly` the same way; a select, radios, a switch, a file, a code or an emoji, which HTML cannot make readonly, show their value in a readonly field that holds no name."
    actions:
      title: Buttons in a form
      description: "A button takes an action rather than a value, so there is nothing for an agent to write into it."
    code:
      title: A code, in cells
      description: "One real field under the cells, so the server reads one value and the browser keeps what it already does: a pasted code lands whole, a phone offers the code it received, backspace goes back. Filled, it sends its form on its own — turned off on this page, which has nowhere to send it."
    select:
      title: Select, on its own
      description: "The two custom selects outside a form group, as a toolbar or a filter bar places them."
    switch:
      title: Switch, on its own
      description: "Labels on either side, glyphs inside, and the checked state."
    switch_tone:
      title: A switch with a tone, and one that asks
      description: "Once on, a switch can take the colour of a state or of a category rather than the link's. One that switches on something with consequences takes `warning`, and asks before: refused, it stays off. Switching off is never questioned. Either way it says `switch:change` to the page."
    switch_vue:
      title: Switch, in vue
      description: "The same switch inside a vue tree, where the checked state is state and not a data attribute a script flips."

  frozen:
    editable: Full name, editable
    created: Created on
    reviewer: Reviewed by
    switch_on: Active
    switch_off: Deactivated
    vue: In vue

  assisted:
    hint: An agent fills the fields below, one after the other.
    play: Play
    reset: Reset

  field:
    text: Full name
    textarea: Address
    email: E-mail
    url: Website
    password: Password
    code: Verification code
    number: Age
    date: Date of birth
    time: Preferred time
    datetime: Appointment
    select: Country
    radio: Contact by
    switch: Send me the newsletter
    file: Identity document
    emoji: Mood
    button: A button
    submit: Submit

  placeholder:
    text: Maya Lindqvist
    textarea: Street, postcode, city
    email: maya@example.com
    url: https://example.com

  choice:
    one: Sweden
    two: Portugal
    three: Japan

  code:
    numeric: Six digits, as sent by e-mail
    backup: A backup code, letters and digits
    vue: Four digits, in vue

  switch:
    tone:
      success: Synced
      mint: Tagged
      risky: Publish on save
    confirm:
      title: Publish on save?
      message: Every save will be published at once, with no review in between.
      accept: Turn on
    label_right: Enable feature
    label_left: Label on the left

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: الإدخالات
  page_icon: 'ph:bold/textbox'
  intro: 'كل حقل يقدمه النظام، في صفحة واحدة. ما يشتركون فيه بخلاف شكلهم هو عقد: يمكن تسليم كل واحد منهم لشيء ليس الشخص الذي يقرأ، والذي يملأه ويعيده.'
  section:
    assisted:
      title: المساعدة
      description: 'يمكن أن يتم الاستيلاء على حقل - بواسطة وكيل، أو بواسطة أي شيء يعرف ماذا يكتب. بينما يتم الاحتفاظ به، فإنه يقول ذلك، ويتوقف عن الرد على لوحة المفاتيح والفأرة، وتظهر القيمة بالطريقة التي يقررها الحقل: مكتوبة لكلمة، مختارة لخيار، محددة لتبديل. المساعدة مؤقتة بطبيعتها؛ الحقل المتروك للمساعدة هو حقل لا يمكن لأحد استخدامه.'
    fields:
      title: الحقول
      description: 'واحد من كل، مرة واحدة. اضغط على تشغيل أعلاه وسيتم ملؤها بالتناوب، بواسطة نفس المكالمات التي سيقوم بها وكيل - وهي الطريقة الوحيدة لمعرفة أن العقد قائم لجميعها.'
    actions:
      title: 'الأزرار في نموذج'
      description: 'زر يتخذ إجراءً بدلاً من قيمة، لذا لا يوجد شيء لوكيل ليكتبه فيه.'
    code:
      title: 'رمز، في خلايا'
      description: 'حقل حقيقي واحد تحت الخلايا، بحيث يقرأ الخادم قيمة واحدة ويحتفظ المتصفح بما يفعله بالفعل: يتم لصق الرمز بالكامل، ويقدم الهاتف الرمز الذي تلقاه، والعودة تعود إلى الوراء. عند ملئه، يرسل نموذجها بمفردها - معطلة في هذه الصفحة، التي ليس لديها مكان لإرسالها.'
    select:
      title: 'اختيار، بمفرده'
      description: 'الاختيارين المخصصين خارج مجموعة نموذج، كما تضعها شريط أدوات أو شريط فلتر.'
    switch:
      title: 'تبديل، بمفرده'
      description: 'تسميات على كلا الجانبين، رموز داخلية، وحالة محددة.'
    switch_tone:
      title: 'تبديل بنغمة، وآخر يسأل'
      description: 'بمجرد تشغيله، يمكن أن يأخذ التبديل لون حالة أو فئة بدلاً من رابط. واحد يقوم بالتبديل على شيء له عواقب يأخذ `تحذير`، ويسأل قبل ذلك: إذا تم الرفض، فإنه يبقى متوقفًا. لا يتم تساؤل عن التبديل إلى وضع الإيقاف. في كلتا الحالتين، يقول `تبديل: تغيير` للصفحة.'
    switch_vue:
      title: 'تبديل، في vue'
      description: 'نفس التبديل داخل شجرة vue، حيث تكون الحالة المحددة هي الحالة وليست خاصية بيانات يقوم البرنامج بتبديلها.'
  assisted:
    hint: 'وكيل يملأ الحقول أدناه، واحدًا تلو الآخر.'
    play: تشغيل
    reset: 'إعادة تعيين'
  field:
    text: 'الاسم الكامل'
    textarea: العنوان
    email: 'البريد الإلكتروني'
    url: 'الموقع الإلكتروني'
    password: 'كلمة المرور'
    code: 'رمز التحقق'
    number: العمر
    date: 'تاريخ الميلاد'
    time: 'الوقت المفضل'
    datetime: الموعد
    select: الدولة
    radio: 'التواصل عبر'
    switch: 'أرسل لي النشرة الإخبارية'
    file: 'وثيقة الهوية'
    emoji: المزاج
    button: زر
    submit: إرسال
  placeholder:
    text: 'مايا ليندكفيست'
    textarea: 'الشارع، الرمز البريدي، المدينة'
    email: maya@example.com
    url: 'https://example.com'
  choice:
    one: السويد
    two: البرتغال
    three: اليابان
  code:
    numeric: 'ستة أرقام، كما تم إرسالها عبر البريد الإلكتروني'
    backup: 'رمز احتياطي، حروف وأرقام'
    vue: 'أربعة أرقام، في vue'
  switch:
    tone:
      success: 'تم المزامنة'
      mint: 'تم وضع علامة'
      risky: 'نشر عند الحفظ'
    confirm:
      title: 'نشر عند الحفظ؟'
      message: 'سيتم نشر كل حفظ دفعة واحدة، دون مراجعة بينهما.'
      accept: تشغيل
    label_right: 'تمكين الميزة'
    label_left: 'التسمية على اليسار'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ইনপুটস
  page_icon: 'ph:bold/textbox'
  intro: 'সিস্টেমের প্রতিটি ক্ষেত্র এক পৃষ্ঠায়। তাদের আকারের বাইরে যা সাধারণ তা হল একটি চুক্তি: প্রতিটি এমন কিছুতে হস্তান্তর করা যেতে পারে যা পাঠক নয়, যা এটি পূর্ণ করে এবং ফেরত দেয়।'
  section:
    assisted:
      title: সহায়তা
      description: 'একটি ক্ষেত্র দখল করা যেতে পারে - একটি এজেন্ট দ্বারা, এমন কিছু দ্বারা যা জানে কী লিখতে হবে। যখন এটি ধরা হয় তখন এটি তাই বলে, কীবোর্ড এবং পয়েন্টারের প্রতি উত্তর দেওয়া বন্ধ করে, এবং মানটি ক্ষেত্রটি যেভাবে সিদ্ধান্ত নেয় সেভাবে প্রদর্শিত হয়: একটি শব্দের জন্য বানানে, একটি বিকল্পের জন্য নির্বাচিত, একটি টগলে জন্য টিক দেওয়া। সহায়তা প্রকৃতিতে অস্থায়ী; একটি সহায়ক অবস্থায় রাখা ক্ষেত্র হল একটি ক্ষেত্র যা কেউ ব্যবহার করতে পারে না।'
    fields:
      title: ক্ষেত্র
      description: 'প্রত্যেকটি, একবার। উপরে প্লে চাপুন এবং তারা পালাক্রমে পূর্ণ হয়, একই কলগুলির দ্বারা যা একটি এজেন্ট করবে - যা তাদের সকলের জন্য চুক্তি বজায় রাখার একমাত্র উপায়।'
    actions:
      title: 'ফর্মে বোতাম'
      description: 'একটি বোতাম একটি মানের পরিবর্তে একটি কর্ম নেয়, তাই এটি লিখতে কোনও কিছু নেই।'
    code:
      title: 'একটি কোড, সেলগুলির মধ্যে'
      description: 'সেলগুলির নিচে একটি বাস্তব ক্ষেত্র, তাই সার্ভার একটি মান পড়ে এবং ব্রাউজার যা ইতিমধ্যেই করে তা ধরে রাখে: একটি পেস্ট করা কোড পুরোপুরি পড়ে, একটি ফোন কোডটি প্রদান করে যা এটি পেয়েছে, ব্যাকস্পেস ফেরত যায়। পূর্ণ হলে, এটি নিজেই তার ফর্ম পাঠায় - এই পৃষ্ঠায় বন্ধ, যার কোনও জায়গা নেই এটি পাঠানোর।'
    select:
      title: 'নির্বাচন, একা'
      description: 'একটি ফর্ম গ্রুপের বাইরের দুটি কাস্টম নির্বাচন, যেমন একটি টুলবার বা একটি ফিল্টার বার তাদের স্থাপন করে।'
    switch:
      title: 'টগল, একা'
      description: 'দুই পাশে লেবেল, ভিতরে প্রতীক, এবং চেকড অবস্থা।'
    switch_tone:
      title: 'একটি টোন সহ টগল, এবং একটি যা জিজ্ঞাসা করে'
      description: 'একবার চালু হলে, একটি টগল একটি অবস্থার বা একটি ক্যাটাগরির রঙ নিতে পারে লিঙ্কের পরিবর্তে। একটি টগল যা কিছু নিয়ে পরিবর্তন করে যার পরিণতি রয়েছে তা `warning` নেয়, এবং আগে জিজ্ঞাসা করে: প্রত্যাখ্যাত হলে, এটি বন্ধ থাকে। বন্ধ করা কখনও প্রশ্ন করা হয় না। যে কোনওভাবে এটি পৃষ্ঠায় `switch:change` বলে।'
    switch_vue:
      title: 'টগল, ভিউতে'
      description: 'একটি ভিউ গাছের ভিতরে একই টগল, যেখানে চেকড অবস্থা রাষ্ট্র এবং নয় একটি ডেটা অ্যাট্রিবিউট যা একটি স্ক্রিপ্ট পরিবর্তন করে।'
  assisted:
    hint: 'একজন এজেন্ট নীচের ক্ষেত্রগুলিকে পূরণ করে, একটির পর এক।'
    play: প্লে
    reset: রিসেট
  field:
    text: 'পূর্ণ নাম'
    textarea: ঠিকানা
    email: ই-মেইল
    url: ওয়েবসাইট
    password: পাসওয়ার্ড
    code: 'যাচাইকরণ কোড'
    number: বয়স
    date: 'জন্ম তারিখ'
    time: 'পছন্দের সময়'
    datetime: 'নিয়মিত সময়'
    select: দেশ
    radio: 'যোগাযোগের দ্বারা'
    switch: 'আমাকে নিউজলেটার পাঠান'
    file: পরিচয়পত্র
    emoji: মুড
    button: 'একটি বোতাম'
    submit: 'জমা দিন'
  placeholder:
    text: 'মায়া লিন্ডকভিস্ট'
    textarea: 'রাস্তা, ডাক কোড, শহর'
    email: maya@example.com
    url: 'https://example.com'
  choice:
    one: সুইডেন
    two: পর্তুগাল
    three: জাপান
  code:
    numeric: 'ছয়টি সংখ্যা, ই-মেইলে পাঠানো হয়েছে'
    backup: 'একটি ব্যাকআপ কোড, অক্ষর এবং সংখ্যা'
    vue: 'চারটি সংখ্যা, ভিউতে'
  switch:
    tone:
      success: 'সিঙ্ক করা হয়েছে'
      mint: 'ট্যাগ করা হয়েছে'
      risky: 'সংরক্ষণে প্রকাশ করুন'
    confirm:
      title: 'সংরক্ষণে প্রকাশ করতে চান?'
      message: 'প্রত্যেকটি সংরক্ষণ একবারে প্রকাশিত হবে, মধ্যবর্তী পর্যালোচনা ছাড়াই।'
      accept: 'চালু করুন'
    label_right: 'ফিচার সক্ষম করুন'
    label_left: 'বামে লেবেল'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Eingaben
  page_icon: 'ph:bold/textbox'
  intro: 'Jedes Feld, das das System bereitstellt, auf einer Seite. Was sie über ihre Form hinaus gemeinsam haben, ist ein Vertrag: Jedes kann einem anderen übergeben werden, der nicht die Person ist, die liest, der es ausfüllt und zurückgibt.'
  section:
    assisted:
      title: Unterstützung
      description: 'Ein Feld kann übernommen werden — von einem Agenten, von allem, was weiß, was es schreiben soll. Während es gehalten wird, zeigt es das an, hört auf, auf die Tastatur und den Zeiger zu reagieren, und der Wert erscheint so, wie das Feld entscheidet: ausgeschrieben für ein Wort, gewählt für eine Option, angekreuzt für einen Schalter. Unterstützung ist von Natur aus vorübergehend; ein unterstütztes Feld ist ein Feld, das niemand nutzen kann.'
    fields:
      title: Felder
      description: 'Eines von jedem, einmal. Drücke oben auf Wiedergabe, und sie werden nacheinander ausgefüllt, durch die gleichen Aufrufe, die ein Agent machen würde — was der einzige Weg ist, um zu wissen, dass der Vertrag für alle gilt.'
    actions:
      title: 'Tasten in einem Formular'
      description: 'Eine Taste führt eine Aktion aus, anstatt einen Wert, sodass es nichts gibt, was ein Agent hineinschreiben könnte.'
    code:
      title: 'Ein Code, in Zellen'
      description: 'Ein echtes Feld unter den Zellen, sodass der Server einen Wert liest und der Browser das behält, was er bereits tut: ein eingefügter Code landet vollständig, ein Telefon bietet den empfangenen Code an, die Rücktaste geht zurück. Ausgefüllt sendet es sein Formular von selbst — auf dieser Seite deaktiviert, die keinen Ort hat, um es zu senden.'
    select:
      title: 'Auswahl, für sich allein'
      description: 'Die beiden benutzerdefinierten Auswahlen außerhalb einer Formulargruppe, wie eine Symbolleiste oder eine Filterleiste sie platziert.'
    switch:
      title: 'Schalter, für sich allein'
      description: 'Beschriftungen auf beiden Seiten, Glyphen innen und der aktivierte Zustand.'
    switch_tone:
      title: 'Ein Schalter mit einem Ton und einer, die fragt'
      description: 'Einmal aktiviert, kann ein Schalter die Farbe eines Zustands oder einer Kategorie annehmen, anstatt die des Links. Einer, der etwas mit Konsequenzen aktiviert, nimmt `warnung` und fragt vorher: abgelehnt, bleibt er aus. Das Ausschalten wird nie in Frage gestellt. In jedem Fall sagt es `switch:change` zur Seite.'
    switch_vue:
      title: 'Schalter, in Vue'
      description: 'Der gleiche Schalter innerhalb eines Vue-Baums, wo der aktivierte Zustand ein Zustand und kein Datenattribut ist, das ein Skript umschaltet.'
  assisted:
    hint: 'Ein Agent füllt die Felder unten, eins nach dem anderen, aus.'
    play: Wiedergabe
    reset: Zurücksetzen
  field:
    text: 'Vollständiger Name'
    textarea: Adresse
    email: E-Mail
    url: Website
    password: Passwort
    code: Bestätigungscode
    number: Alter
    date: Geburtsdatum
    time: 'Bevorzugte Zeit'
    datetime: Termin
    select: Land
    radio: 'Kontakt über'
    switch: 'Senden Sie mir den Newsletter'
    file: Identitätsdokument
    emoji: Stimmung
    button: 'Eine Taste'
    submit: Absenden
  placeholder:
    text: 'Maya Lindqvist'
    textarea: 'Straße, Postleitzahl, Stadt'
    email: maya@example.com
    url: 'https://example.com'
  choice:
    one: Schweden
    two: Portugal
    three: Japan
  code:
    numeric: 'Sechs Ziffern, wie per E-Mail gesendet'
    backup: 'Ein Backup-Code, Buchstaben und Ziffern'
