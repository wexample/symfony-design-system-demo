fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ورودها
  page_icon: 'ph:bold/textbox'
  intro: 'هر فیلدی که سیستم ارائه می‌دهد، در یک صفحه. آنچه که آنها را فراتر از شکلشان به هم مرتبط می‌کند، یک قرارداد است: هر کدام می‌تواند به چیزی غیر از شخص خواننده واگذار شود که آن را پر کرده و دوباره برمی‌گرداند.'
  section:
    assisted:
      title: کمک
      description: 'یک فیلد می‌تواند توسط یک عامل، یا هر چیزی که می‌داند چه چیزی بنویسد، تصرف شود. در حالی که در دست است، این موضوع را می‌گوید، به کیبورد و نشانگر پاسخ نمی‌دهد و مقدار به شکلی که فیلد تعیین می‌کند نمایش داده می‌شود: برای یک کلمه نوشته شده، برای یک گزینه انتخاب شده، برای یک سوئیچ علامت‌گذاری شده. کمک به طور طبیعی موقتی است؛ فیلدی که به کمک گذاشته شده، فیلدی است که هیچ‌کس نمی‌تواند از آن استفاده کند.'
    fields:
      title: فیلدها
      description: 'یکی از هرکدام، یکبار. دکمه پخش را در بالا فشار دهید و آنها نوبت به نوبت پر می‌شوند، با همان فراخوان‌هایی که یک عامل انجام می‌دهد — که تنها راه برای دانستن این است که قرارداد برای همه آنها برقرار است.'
    actions:
      title: 'دکمه‌ها در یک فرم'
      description: 'یک دکمه یک عمل را انجام می‌دهد نه یک مقدار، بنابراین چیزی برای نوشتن یک عامل در آن وجود ندارد.'
    code:
      title: 'یک کد، در سلول‌ها'
      description: 'یک فیلد واقعی زیر سلول‌ها، بنابراین سرور یک مقدار را می‌خواند و مرورگر آنچه را که قبلاً انجام می‌دهد حفظ می‌کند: یک کد چسبیده به طور کامل می‌نشیند، یک تلفن کدی را که دریافت کرده است ارائه می‌دهد، کلید backspace به عقب می‌رود. وقتی پر شد، فرم خود را به تنهایی ارسال می‌کند — که در این صفحه خاموش است و جایی برای ارسال آن ندارد.'
    select:
      title: 'انتخاب، به تنهایی'
      description: 'دو انتخاب سفارشی خارج از گروه فرم، همانطور که یک نوار ابزار یا نوار فیلتر آنها را قرار می‌دهد.'
    switch:
      title: 'سوئیچ، به تنهایی'
      description: 'برچسب‌هایی در دو طرف، نمادهایی درون، و وضعیت تیک‌خورده.'
    switch_tone:
      title: 'یک سوئیچ با حالت، و یکی که سؤال می‌کند'
      description: 'یک بار که روشن شد، یک سوئیچ می‌تواند رنگ یک وضعیت یا یک دسته‌بندی را به جای لینک بگیرد. یکی که چیزی با عواقب را روشن می‌کند، `warning` می‌گیرد و قبل از آن سؤال می‌کند: در صورت رد شدن، خاموش می‌ماند. خاموش کردن هرگز سؤال نمی‌شود. در هر صورت، به صفحه می‌گوید `switch:change`.'
    switch_vue:
      title: 'سوئیچ، در vue'
      description: 'همان سوئیچ در درخت vue، جایی که وضعیت تیک‌خورده وضعیت است و نه یک ویژگی داده‌ای که یک اسکریپت آن را تغییر می‌دهد.'
  assisted:
    hint: 'یک عامل فیلدهای زیر را یکی پس از دیگری پر می‌کند.'
    play: پخش
    reset: بازنشانی
  field:
    text: 'نام کامل'
