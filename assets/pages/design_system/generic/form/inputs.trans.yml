fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Entrées
  page_icon: 'ph:bold/textbox'
  intro: "Chaque champ que le système expédie, sur une page. Ce qu'ils ont en commun au-delà de leur forme est un contrat : chacun peut être remis à quelque chose qui n'est pas la personne qui lit, qui le remplit et le rend."
  section:
    assisted:
      title: Assistance
      description: "Un champ peut être pris en charge — par un agent, par tout ce qui sait quoi écrire. Pendant qu'il est tenu, il le dit, cesse de répondre au clavier et au pointeur, et la valeur apparaît comme le champ le décide : épelée pour un mot, choisie pour une option, cochée pour un interrupteur. L'assistance est temporaire par nature ; un champ laissé assisté est un champ que personne ne peut utiliser."
    fields:
      title: Champs
      description: "Un de chaque, une fois. Appuyez sur Play ci-dessus et ils sont remplis à tour de rôle, par les mêmes appels qu'un agent ferait — ce qui est le seul moyen de savoir que le contrat tient pour tous."
    scale:
      title: 'Segments et échelles'
      description: "`segmented: true` dessine un groupe de boutons radio sous forme de bande de segments, pour un choix parmi quelques options courtes : les mêmes boutons radio, déplacés par les flèches, envoyant la même valeur. `range-input` prend une valeur le long d'une échelle — `min`, `max`, `step` — et l'affiche à côté de son étiquette au fur et à mesure de son déplacement, selon la locale de la page et avec les décimales requises par son pas ; `suffix` est un mot après, jamais soumis. Le jumeau vue émet à chaque étape, permettant à la page de recalculer au fur et à mesure que le curseur se déplace."
    stepper:
      title: 'Un pas à la fois'
      description: "stepper: true, un bouton de chaque côté d'un nombre — une quantité. Il avance par le pas du champ et s'arrête à son min et max, son bouton se reposant là ; provenant de symfony-forms, les limites viennent de la contrainte Range du champ."
    addon:
      title: 'Une unité à côté de la valeur'
      description: "Un mot fixe — une unité, une devise — affiché dans le cadre du champ, avant ou après la valeur. Les lecteurs d'écran le lisent avec le champ ; ce n'est pas partie intégrante de la valeur, ne peut pas être sélectionné, et rien de cela n'est soumis. L'apparence figée reste avec lui."
    frozen:
      title: 'Figé, et affiché'
      description: "Un champ figé contient une valeur que quelqu'un peut lire sans changer : établie, mais pas indisponible. Il conserve le contraste d'un champ modifiable et reste focalisable et sélectionnable — seul ce qui invite à écrire est présent : un cadre en pointillé sans fond propre, pas de curseur de texte, pas de sélecteur. Une valeur d'affichage n'est pas un champ du tout : une étiquette et ce que l'enregistrement indique, sur la ligne d'un champ pour que les deux soient perçus comme un bloc, un tiret lorsqu'il n'y a rien. Les champs vue prennent `readonly` de la même manière ; un sélecteur, des boutons radio, un interrupteur, un fichier, un code ou un emoji, que HTML ne peut pas rendre en lecture seule, affichent leur valeur dans un champ en lecture seule qui n'a pas de nom."
    actions:
      title: 'Boutons dans un formulaire'
      description: "Un bouton prend une action plutôt qu'une valeur, donc il n'y a rien à écrire pour un agent."
    code:
      title: 'Un code, dans des cellules'
      description: "Un vrai champ sous les cellules, donc le serveur lit une valeur et le navigateur garde ce qu'il fait déjà : un code collé atterrit entier, un téléphone offre le code qu'il a reçu, la touche de retour supprime. Rempli, il envoie son formulaire tout seul — désactivé sur cette page, qui n'a nulle part où l'envoyer."
    select:
      title: 'Sélectionner, par lui-même'
      description: "Les deux sélections personnalisées en dehors d'un groupe de formulaires, comme une barre d'outils ou une barre de filtre les place."
    switch:
      title: 'Interrupteur, par lui-même'
      description: "Étiquettes de chaque côté, glyphes à l'intérieur, et l'état coché."
    switch_tone:
