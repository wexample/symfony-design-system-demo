nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Invoeren
  page_icon: 'ph:bold/textbox'
  intro: 'Elk veld dat het systeem levert, op één pagina. Wat ze gemeen hebben, naast hun vorm, is een contract: elk kan worden overgedragen aan iets dat niet de persoon is die leest, dat het invult en het teruggeeft.'
  section:
    assisted:
      title: Hulp
      description: 'Een veld kan worden overgenomen — door een agent, door alles wat weet wat in te vullen. Terwijl het vastgehouden wordt, geeft het dat aan, stopt met reageren op het toetsenbord en de muis, en de waarde verschijnt zoals het veld beslist: voluit geschreven voor een woord, gekozen voor een optie, aangevinkt voor een schakelaar. Hulp is van tijdelijke aard; een veld dat assistentie heeft, is een veld dat niemand kan gebruiken.'
    fields:
      title: Velden
      description: 'Één van elk, eenmaal. Druk boven op Afspelen en ze worden om de beurt ingevuld, door dezelfde oproepen die een agent zou doen — wat de enige manier is om te weten dat het contract voor hen allemaal geldt.'
    actions:
      title: 'Knoppen in een formulier'
      description: 'Een knop voert een actie uit in plaats van een waarde, dus er is niets voor een agent om in te vullen.'
    code:
      title: 'Een code, in cellen'
      description: 'Één echt veld onder de cellen, zodat de server één waarde leest en de browser doet wat het al doet: een geplakte code landt als geheel, een telefoon biedt de code die hij heeft ontvangen, backspace gaat terug. Wanneer gevuld, verstuurt het zelf zijn formulier — uitgeschakeld op deze pagina, die nergens naartoe kan sturen.'
    select:
      title: 'Selecteren, op zichzelf'
      description: 'De twee aangepaste selecties buiten een formuliergroep, zoals een werkbalk of een filterbalk ze plaatst.'
    switch:
      title: 'Schakelaar, op zichzelf'
      description: 'Labels aan beide zijden, symbolen binnenin, en de aangevinkte staat.'
    switch_tone:
      title: 'Een schakelaar met een toon, en een die vraagt'
      description: 'Eenmaal ingeschakeld kan een schakelaar de kleur van een staat of van een categorie aannemen in plaats van die van de link. Een die iets met gevolgen inschakelt, krijgt `waarschuwing`, en vraagt vooraf: geweigerd, blijft het uit. Uitzetten wordt nooit in twijfel getrokken. Hoe dan ook zegt het `schakelaar:wissel` naar de pagina.'
    switch_vue:
      title: 'Schakelaar, in vue'
      description: 'Dezelfde schakelaar binnen een vue-boom, waar de aangevinkte staat staat is en niet een gegevensattribuut dat een script omdraait.'
  assisted:
    hint: 'Een agent vult de velden hieronder, één voor één.'
    play: Afspelen
    reset: Resetten
  field:
    text: 'Volledige naam'
    textarea: Adres
    email: E-mailadres
    url: Website
    password: Wachtwoord
    code: Verificatiecode
    number: Leeftijd
    date: Geboortedatum
    time: 'Voorkeurs tijd'
    datetime: Afspraak
    select: Land
    radio: 'Contact via'
    switch: 'Stuur me de nieuwsbrief'
    file: Identiteitsdocument
    emoji: Sfeer
    button: 'Een knop'
    submit: Verzenden
  placeholder:
    text: 'Maya Lindqvist'
    textarea: 'Straat, postcode, stad'
    email: maya@example.com
    url: 'https://example.com'
  choice:
    one: Zweden
    two: Portugal
    three: Japan
  code:
    numeric: 'Zes cijfers, zoals verzonden per e-mail'
    backup: 'Een back-upcode, letters en cijfers'
    vue: 'Vier cijfers, in vue'
  switch:
    tone:
      success: Gesynchroniseerd
      mint: Getagd
      risky: 'Publiceer bij opslaan'
    confirm:
      title: 'Publiceren bij opslaan?'
      message: 'Elke opslaan zal tegelijk worden gepubliceerd, zonder tussentijdse beoordeling.'
      accept: Inschakelen
    label_right: 'Functie inschakelen'
    label_left: 'Label aan de linkerkant'

pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Pola wejściowe'
  page_icon: 'ph:bold/textbox'
  intro: 'Każde pole, które system dostarcza, na jednej stronie. To, co je łączy oprócz kształtu, to umowa: każde z nich może być przekazane czemuś, co nie jest osobą czytającą, które je wypełnia i oddaje.'
  section:
    assisted:
      title: Wsparcie
      description: 'Pole może być przejęte — przez agenta, przez cokolwiek, co wie, co wpisać. Gdy jest zajęte, informuje o tym, przestaje odpowiadać na klawiaturę i wskaźnik, a wartość pojawia się tak, jak postanowiło pole: rozpisana dla słowa, wybrana dla opcji, zaznaczona dla przełącznika. Wsparcie jest z definicji tymczasowe; pole pozostawione z wsparciem to pole, z którego nikt nie może skorzystać.'
    fields:
      title: Pola
      description: 'Jedno z każdego, raz. Naciśnij Odtwórz powyżej, a będą wypełniane po kolei, przez te same wywołania, które wykonałby agent — co jest jedynym sposobem, aby upewnić się, że umowa obowiązuje dla wszystkich.'
    actions:
      title: 'Przyciski w formularzu'
      description: 'Przycisk podejmuje działanie, a nie wartość, więc nie ma nic do zapisania przez agenta.'
    code:
      title: 'Kod, w komórkach'
      description: 'Jedno prawdziwe pole pod komórkami, więc serwer odczytuje jedną wartość, a przeglądarka utrzymuje to, co już robi: wklejony kod ląduje w całości, telefon oferuje kod, który otrzymał, a klawisz backspace cofa. Wypełnione, wysyła swój formularz samodzielnie — wyłączone na tej stronie, która nie ma dokąd go wysłać.'
    select:
      title: 'Wybór, samodzielnie'
      description: 'Dwa niestandardowe wybory poza grupą formularzy, tak jak narzędzie lub pasek filtrów je umieszcza.'
    switch:
      title: 'Przełącznik, samodzielnie'
      description: 'Etykiety po obu stronach, symbole w środku i zaznaczony stan.'
    switch_tone:
      title: 'Przełącznik z tonem, i taki, który pyta'
      description: 'Gdy jest włączony, przełącznik może przyjąć kolor stanu lub kategorii zamiast koloru linku. Taki, który przełącza coś z konsekwencjami, przyjmuje `ostrzeżenie` i pyta wcześniej: odrzucony, pozostaje wyłączony. Wyłączenie nigdy nie jest kwestionowane. W każdym przypadku informuje stronę o `switch:change`.'
    switch_vue:
      title: 'Przełącznik, w vue'
      description: 'Ten sam przełącznik wewnątrz drzewa vue, gdzie zaznaczony stan jest stanem, a nie atrybutem danych, który skrypt przełącza.'
  assisted:
    hint: 'Agent wypełnia pola poniżej, jedno po drugim.'
    play: Odtwórz
    reset: Zresetuj
  field:
    text: 'Pełne imię i nazwisko'
