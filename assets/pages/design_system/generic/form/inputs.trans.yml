ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 入力
  page_icon: 'ph:bold/textbox'
  intro: システムが提供するすべてのフィールドが1ページに集まっています。それらの形状を超えて共通する点は契約です：各フィールドは、読む人以外の何かに渡され、内容が入力されて戻されることができます。
  section:
    assisted:
      title: 支援
      description: フィールドはエージェントや書く内容を知っている何かに引き継がれます。その間は、キーボードやポインターへの応答を停止し、フィールドが決定した形で値が表示されます：単語のために書かれ、オプションのために選ばれ、スイッチのためにチェックされます。支援は本質的に一時的です；支援されたフィールドは誰も使えないフィールドです。
    fields:
      title: フィールド
      description: 'それぞれ1つずつ。上のプレイを押すと、エージェントが行うのと同じ呼び出しで順に入力されます — これがすべてのフィールドに契約が成立していることを知る唯一の方法です。'
    scale:
      title: セグメントとスケール
      description: '`segmented: true` はラジオグループをセグメントのストリップとして描画し、いくつかの短い選択肢の中から1つを選びます。同じラジオが矢印によって移動し、同じ値を送信します。`range-input` はスケールに沿った値を取得し — `min`、`max`、`step` — 移動する際にそのラベルの横に表示し、ページのロケールとそのステップが要求する小数点で表示します。`suffix` は値の後に付く単語で、送信されることはありません。vueのツインは、サムが動くたびに発信します。'
    stepper:
      title: 一度に1ステップ
      description: 'stepper: true、数値の両側にボタン — 量。フィールドのステップで進み、最小値と最大値で停止し、ボタンはそこに留まります。symfony-formsからは、境界はフィールドの範囲制約から来ます。'
    addon:
      title: 値の横に単位
      description: '固定された単語 — 単位、通貨 — がフィールドの枠に描かれ、値の前または後に表示されます。スクリーンリーダーはフィールドと一緒にそれを読みますが、値の一部ではなく、フォーカスもできず、何も送信されません。凍結された外観がそれに伴います。'
    frozen:
      title: 凍結され、表示される
      description: '凍結されたフィールドは誰かが読み取ることができ、変更できない値を保持します：確定されており、利用不可ではありません。編集可能なフィールドのコントラストを保ち、フォーカス可能で選択可能です — 書き込みを誘うものだけが表示されます：自分の背景がないダッシュのフレーム、テキストカーソルなし、ピッカーなし。表示値はフィールドではなく、ラベルとレコードの内容がフィールドの行に表示され、2つが1つのブロックとして読み取られます。何もないときはダッシュが表示されます。vueフィールドは`readonly`を同じように扱います。選択、ラジオ、スイッチ、ファイル、コード、またはHTMLで読み取り専用にできない絵文字は、名前を持たない読み取り専用フィールドにその値を表示します。'
    actions:
      title: フォーム内のボタン
      description: ボタンは値ではなくアクションを取るため、エージェントが書き込むものはありません。
    code:
      title: セル内のコード
      description: 'セルの下に実際のフィールドがあり、サーバーは1つの値を読み取り、ブラウザは既に行っていることを保持します：貼り付けたコードがそのまま入る、電話は受け取ったコードを提供する、バックスペースは戻る役割を果たします。フィールドが入力されると、自動的にフォームを送信します — このページではオフになっており、送信先はありません。'
    select:
      title: 独自の選択
      description: フォームグループ外の2つのカスタムセレクト、ツールバーやフィルターバーがそれらを配置します。
    switch:
      title: 独自のスイッチ
      description: 両側のラベル、内部のグリフ、チェックされた状態。
    switch_tone:
      title: トーンのあるスイッチと、尋ねるスイッチ
      description: '一度オンになると、スイッチはリンクの色ではなく状態やカテゴリの色を取ることができます。結果を伴う何かを切り替えるスイッチは`warning`を取り、事前に尋ねます：拒否された場合、オフのままです。オフにすることは決して質問されません。いずれの場合も、`switch:change`をページに伝えます。'
    switch_vue:
      title: Vue内のスイッチ
      description: チェックされた状態が状態であり、スクリプトが切り替えるデータ属性ではないVueツリー内の同じスイッチ。
  scale:
    window: ウィンドウ
    window_3: 3ヶ月
    window_6: 6ヶ月
    window_12: 12ヶ月
    coverage: カバレッジ係数
    buffer: バッファ
    weeks: 週間
  stepper:
    quantity: 数量
    guests: ゲスト
    nights: 夜
    people: 人
