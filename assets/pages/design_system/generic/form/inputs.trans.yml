zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 输入
  page_icon: 'ph:bold/textbox'
  intro: 系统提供的每个字段，集中在一页上。它们除了形状之外的共同点是一个契约：每个字段都可以交给不阅读的人来填写并返回。
  section:
    assisted:
      title: 辅助
      description: 一个字段可以被接管——由代理人或者任何知道该写什么的东西。在被接管时，它会这样显示，停止响应键盘和指针，值以字段决定的方式出现：为一个单词拼写，为一个选项选择，为一个开关勾选。辅助本质上是临时的；一个被辅助的字段是一个没人能使用的字段。
    fields:
      title: 字段
      description: 每个字段各一个。点击上方的播放，它们会轮流被填充，由代理人会做的相同调用——这是唯一知道契约对所有字段都有效的方法。
    scale:
      title: 分段与比例
      description: '`segmented: true` 将单选按钮组绘制为一条分段条，用于在几个短选项中选择一个：相同的单选按钮，通过箭头移动，发送相同的值。`range-input` 沿着比例取值 — `min`、`max`、`step` — 并在移动时在其标签旁显示，以页面的本地化形式和步长所要求的小数；`suffix` 是其后面的一个词，从不提交。vue 组件在每个步骤上发射，因此页面可以在滑块移动时重新计算。'
    stepper:
      title: 一步一步来
      description: 'stepper: true，在数字的每一侧有一个按钮 — 一个数量。它按字段的步长递增，并在其最小值和最大值处停止，按钮在那停留；来自 symfony-forms，边界来自字段的范围约束。'
    addon:
      title: 值旁的单位
      description: '一个固定的词 — 一个单位，一个货币 — 在字段的框架中绘制，位于值的前面或后面。屏幕阅读器与字段一起读取它；它不是值的一部分，无法聚焦，也不会提交。这个固定的外观保持不变。'
    frozen:
      title: 冻结并显示
      description: '一个冻结的字段保持一个值，供某人读取而不更改：已确定，但并非不可用。它保持可编辑字段的对比，并且仍然可以聚焦和选择 — 只有邀请写作的部分才会出现：一个虚线框，没有自己的底色，没有文本光标，没有选择器。显示值根本不是一个字段：一个标签和记录所说的内容，在字段的行上，使两者看起来像一个块，当没有内容时则是一个破折号。vue 字段以相同的方式使用 `readonly`；一个选择框、单选按钮、开关、文件、代码或表情符号，HTML 无法使其只读，会在一个不包含名称的只读字段中显示其值。'
    actions:
      title: 表单中的按钮
      description: 按钮执行一个动作而不是一个值，因此代理人无法写入其中。
    code:
      title: 单元格中的代码
      description: 单元格下方有一个真实字段，因此服务器读取一个值而浏览器保持它已有的功能：粘贴的代码完整到达，手机提供它收到的代码，退格键返回。填充后，它会自动发送其表单——在这个页面上关闭，因为没有地方可以发送。
    select:
      title: 自选
      description: 两个自定义选择在表单组外，像工具栏或过滤器栏一样放置。
    switch:
      title: 自开关
      description: 两侧有标签，内部有图标，以及选中状态。
    switch_tone:
      title: 带色调的开关，以及一个询问的开关
