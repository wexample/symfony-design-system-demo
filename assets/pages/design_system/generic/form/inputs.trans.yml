hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: इनपुट्स
  page_icon: 'ph:bold/textbox'
  intro: 'प्रणाली द्वारा भेजे गए प्रत्येक क्षेत्र को एक पृष्ठ पर। उनके आकार के अलावा जो सामान्य है, वह एक अनुबंध है: प्रत्येक को किसी ऐसी चीज़ में सौंपा जा सकता है जो पढ़ने वाला व्यक्ति नहीं है, जो इसे भरता है और इसे वापस देता है।'
  section:
    assisted:
      title: सहायता
      description: 'एक क्षेत्र पर कब्जा किया जा सकता है - एक एजेंट द्वारा, किसी भी चीज़ द्वारा जो जानती है कि क्या लिखना है। जब इसे पकड़ा जाता है तो यह ऐसा बताता है, कीबोर्ड और पॉइंटर का जवाब देना बंद कर देता है, और मूल्य उस तरीके से दिखता है जिसे क्षेत्र तय करता है: एक शब्द के लिए लिखा हुआ, एक विकल्प के लिए चुना हुआ, एक स्विच के लिए टिक किया हुआ। सहायता स्वाभाविक रूप से अस्थायी है; एक क्षेत्र जो सहायक है, वह एक ऐसा क्षेत्र है जिसका कोई उपयोग नहीं कर सकता।'
    fields:
      title: क्षेत्र
      description: 'एक में से एक, एक बार। ऊपर प्ले दबाएं और इन्हें बारी-बारी से भरा जाएगा, उसी कॉल द्वारा जो एक एजेंट करेगा - जो यह जानने का एकमात्र तरीका है कि अनुबंध सभी के लिए लागू है।'
    actions:
      title: 'फॉर्म में बटन'
      description: 'एक बटन एक क्रिया लेता है न कि एक मूल्य, इसलिए इसमें लिखने के लिए एजेंट के लिए कुछ नहीं है।'
    code:
      title: 'एक कोड, कोशिकाओं में'
      description: 'कोशिकाओं के नीचे एक असली क्षेत्र, ताकि सर्वर एक मूल्य पढ़ सके और ब्राउज़र वही रख सके जो वह पहले से करता है: एक चिपकाया गया कोड पूरा आता है, एक फोन वह कोड प्रदान करता है जो उसे मिला, बैकस्पेस वापस जाता है। भरा हुआ, यह अपने आप अपना फॉर्म भेजता है - इस पृष्ठ पर बंद किया गया, जिसका कहीं भेजने के लिए नहीं है।'
    select:
      title: 'स्वचालित चयन'
      description: 'फॉर्म समूह के बाहर दो कस्टम चयन, जैसे एक टूलबार या एक फ़िल्टर बार उन्हें रखता है।'
    switch:
      title: 'स्विच, अपने आप'
      description: 'दोनों ओर लेबल, अंदर चित्र, और चेक किया गया स्थिति।'
    switch_tone:
      title: 'एक टोन के साथ स्विच, और एक जो पूछता है'
      description: 'एक बार चालू होने पर, एक स्विच एक स्थिति या श्रेणी के रंग को ले सकता है न कि लिंक के। एक जो कुछ ऐसे स्विच करता है जिसके परिणाम होते हैं वह `चेतावनी` लेता है और पहले पूछता है: अस्वीकृत होने पर, यह बंद रहता है। बंद करना कभी नहीं पूछा जाता। किसी भी तरह यह पृष्ठ को `स्विच: परिवर्तन` कहता है।'
    switch_vue:
      title: 'स्विच, व्यू में'
      description: 'व्यू ट्री के अंदर वही स्विच, जहाँ चेक की गई स्थिति राज्य है और न कि एक डेटा एट्रिब्यूट जिसे एक स्क्रिप्ट पलटती है।'
  assisted:
    hint: 'एक एजेंट नीचे दिए गए क्षेत्रों को एक के बाद एक भरता है।'
