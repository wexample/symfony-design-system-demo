it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Input
  page_icon: 'ph:bold/textbox'
  intro: "Ogni campo fornito dal sistema, su un'unica pagina. Ciò che hanno in comune oltre alla loro forma è un contratto: ciascuno può essere gestito da qualcosa che non è la persona che legge, che lo compila e lo restituisce."
  section:
    assisted:
      title: Assistenza
      description: "Un campo può essere preso in carico — da un agente, da qualsiasi cosa sappia cosa scrivere. Mentre è in carico, lo indica, smette di rispondere alla tastiera e al puntatore, e il valore appare come decide il campo: scritto per una parola, scelto per un'opzione, selezionato per un interruttore. L'assistenza è temporanea per natura; un campo assistito è un campo che nessuno può usare."
    fields:
      title: Campi
      description: "Uno di ciascuno, una sola volta. Premi Play sopra e verranno compilati a turno, con le stesse chiamate che farebbe un agente — che è l'unico modo per sapere che il contratto è valido per tutti."
    scale:
      title: 'Segmenti e scale'
      description: '`segmented: true` disegna un gruppo di opzioni come una striscia di segmenti, per una scelta tra alcune brevi: gli stessi pulsanti di opzione, spostati dalle frecce, inviano lo stesso valore. `range-input` prende un valore lungo una scala — `min`, `max`, `step` — e lo mostra accanto alla sua etichetta mentre si muove, nella lingua della pagina e con i decimali richiesti dal suo passo; `suffix` è una parola dopo di esso, mai inviata. Il gemello vue emette a ogni passo, così una pagina può ricalcolare mentre il cursore si muove.'
    stepper:
      title: 'Un passo alla volta'
      description: 'stepper: true, un pulsante su ciascun lato di un numero — una quantità. Fa un passo secondo il passo del campo e si ferma ai suoi min e max, con il pulsante che si ferma lì; da symfony-forms, i limiti provengono dal vincolo Range del campo.'
    addon:
      title: "Un'unità accanto al valore"
      description: "Una parola fissa — un'unità, una valuta — disegnata nel riquadro del campo, prima o dopo il valore. I lettori di schermo la leggono insieme al campo; non fa parte del valore, non può essere focalizzata e nulla di essa viene inviato. L'aspetto congelato rimane con essa."
    frozen:
      title: 'Congelato e mostrato'
      description: "Un campo congelato contiene un valore che qualcuno può leggere e non cambiare: stabilito, non non disponibile. Mantiene il contrasto di un campo modificabile e rimane focalizzabile e selezionabile — solo ciò che invita a scrivere va: un riquadro tratteggiato su nessun terreno proprio, nessun cursore di testo, nessun selettore. Un valore di visualizzazione non è affatto un campo: un'etichetta e ciò che dice il record, sulla linea di un campo così i due si leggono come un unico blocco, un trattino quando non c'è nulla. I campi vue prendono `readonly` allo stesso modo; un selettore, pulsanti di opzione, un interruttore, un file, un codice o un'emoji, che l'HTML non può rendere readonly, mostrano il loro valore in un campo readonly che non ha nome."
    actions:
      title: 'Pulsanti in un modulo'
      description: "Un pulsante esegue un'azione piuttosto che un valore, quindi non c'è nulla da scrivere al suo interno da parte di un agente."
    code:
      title: 'Un codice, nelle celle'
      description: 'Un vero campo sotto le celle, così il server legge un valore e il browser mantiene ciò che già fa: un codice incollato arriva intero, un telefono offre il codice ricevuto, il tasto backspace torna indietro. Compilato, invia il suo modulo autonomamente — disattivato in questa pagina, che non ha dove inviarlo.'
    select:
      title: 'Seleziona, da solo'
      description: 'I due selettori personalizzati al di fuori di un gruppo di moduli, come una barra degli strumenti o una barra dei filtri li colloca.'
    switch:
      title: 'Interruttore, da solo'
      description: "Etichette su entrambi i lati, glifi all'interno, e lo stato selezionato."
    switch_tone:
      title: 'Un interruttore con un tono, e uno che chiede'
      description: 'Una volta attivato, un interruttore può assumere il colore di uno stato o di una categoria piuttosto che quello del link. Uno che attiva qualcosa con conseguenze prende `warning`, e chiede prima: rifiutato, rimane spento. Disattivare non viene mai messo in discussione. In entrambi i casi dice `switch:change` alla pagina.'
    switch_vue:
      title: 'Interruttore, in vue'
      description: "Lo stesso interruttore all'interno di un albero vue, dove lo stato selezionato è stato e non un attributo dati che uno script cambia."
  scale:
    window: Finestra
    window_3: '3 mesi'
    window_6: '6 mesi'
    window_12: '12 mesi'
    coverage: 'Coefficiente di copertura'
