vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Nhập liệu'
  page_icon: 'ph:bold/textbox'
  intro: 'Mỗi trường mà hệ thống cung cấp, trên một trang. Điều mà chúng có điểm chung ngoài hình dạng của chúng là một hợp đồng: mỗi trường có thể được giao cho một thứ không phải là người đọc, cái mà sẽ điền và trả lại nó.'
  section:
    assisted:
      title: 'Hỗ trợ'
      description: 'Một trường có thể được tiếp quản — bởi một đại lý, bởi bất cứ thứ gì biết viết gì. Khi nó được giữ, nó nói như vậy, ngừng phản hồi với bàn phím và con trỏ, và giá trị xuất hiện theo cách mà trường quyết định: viết ra cho một từ, chọn cho một tùy chọn, đánh dấu cho một công tắc. Hỗ trợ là tạm thời theo bản chất; một trường được hỗ trợ là một trường không ai có thể sử dụng.'
    fields:
      title: 'Các trường'
      description: 'Một trường cho mỗi loại, một lần. Nhấn Phát ở trên và chúng sẽ được điền lần lượt, bởi cùng một cuộc gọi mà một đại lý sẽ thực hiện — đó là cách duy nhất để biết hợp đồng có hiệu lực cho tất cả chúng.'
    scale:
      title: 'Các phân đoạn và thang đo'
      description: '`segmented: true` vẽ một nhóm radio dưới dạng một dải các phân đoạn, cho một lựa chọn trong số một vài lựa chọn ngắn: các radio giống nhau, được di chuyển bởi các mũi tên, gửi cùng một giá trị. `range-input` nhận một giá trị theo thang đo — `min`, `max`, `step` — và hiển thị nó bên cạnh nhãn của nó khi di chuyển, theo ngôn ngữ của trang và với các chữ số thập phân mà bước di chuyển yêu cầu; `suffix` là một từ đứng sau, không bao giờ được gửi đi. Cặp vue phát ra tín hiệu ở mỗi bước, vì vậy một trang có thể tính toán lại khi thanh trượt di chuyển.'
    stepper:
      title: 'Một bước tại một thời điểm'
      description: 'stepper: true, một nút ở mỗi bên của một số — một số lượng. Nó bước theo bước của trường và dừng lại ở min và max của nó, nút của nó giữ ở đó; từ symfony-forms, các giới hạn đến từ ràng buộc Range của trường.'
    addon:
      title: 'Một đơn vị bên cạnh giá trị'
      description: 'Một từ cố định — một đơn vị, một loại tiền tệ — được vẽ trong khung của trường, trước hoặc sau giá trị. Các trình đọc màn hình sẽ đọc nó cùng với trường; nó không phải là một phần của giá trị, không thể được tập trung và không có gì trong đó được gửi đi. Hình thức giữ nguyên của nó.'
    frozen:
      title: 'Đóng băng, và hiển thị'
      description: 'Một trường đóng băng giữ một giá trị mà ai đó có thể đọc và không thay đổi: đã được xác định, không phải không khả dụng. Nó giữ sự tương phản của một trường có thể chỉnh sửa và vẫn có thể được tập trung và chọn — chỉ những gì mời gọi viết mới đi vào: một khung gạch chéo không có nền riêng, không có con trỏ văn bản, không có bộ chọn. Một giá trị hiển thị không phải là một trường: một nhãn và những gì bản ghi nói, trên dòng của một trường để hai cái đọc như một khối, một dấu gạch ngang khi không có gì. Các trường vue nhận `readonly` theo cùng một cách; một chọn, radio, công tắc, một tệp, một mã hoặc một emoji, mà HTML không thể làm readonly, hiển thị giá trị của chúng trong một trường readonly không giữ tên.'
    actions:
      title: 'Nút trong một mẫu'
      description: 'Một nút thực hiện một hành động thay vì một giá trị, vì vậy không có gì cho một đại lý viết vào nó.'
    code:
      title: 'Một mã, trong ô'
      description: 'Một trường thực sự dưới các ô, vì vậy máy chủ đọc một giá trị và trình duyệt giữ những gì nó đã làm: một mã dán sẽ đến nguyên vẹn, một điện thoại cung cấp mã mà nó nhận được, phím xóa sẽ trở về. Đã được điền, nó tự gửi mẫu của mình — tắt trên trang này, nơi không có chỗ nào để gửi nó.'
    select:
      title: 'Chọn, tự nó'
      description: 'Hai lựa chọn tùy chỉnh bên ngoài một nhóm mẫu, như một thanh công cụ hoặc một thanh lọc đặt chúng.'
    switch:
      title: 'Công tắc, tự nó'
      description: 'Nhãn ở hai bên, biểu tượng bên trong, và trạng thái đã chọn.'
    switch_tone:
      title: 'Một công tắc có tông màu, và một cái hỏi'
      description: 'Khi được bật, một công tắc có thể mang màu sắc của một trạng thái hoặc của một loại thay vì của liên kết. Một công tắc kích hoạt một cái gì đó có hậu quả mang `cảnh báo`, và hỏi trước: nếu bị từ chối, nó sẽ giữ tắt. Việc tắt không bao giờ bị chất vấn. Dù sao đi nữa, nó nói `switch:change` với trang.'
    switch_vue:
      title: 'Công tắc, trong vue'
      description: 'Công tắc giống nhau bên trong một cây vue, nơi trạng thái đã chọn là trạng thái và không phải là một thuộc tính dữ liệu mà một kịch bản lật lại.'
