ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 입력
  page_icon: 'ph:bold/textbox'
  intro: '시스템에서 제공하는 모든 필드를 한 페이지에 모았습니다. 형태를 넘어 그들의 공통점은 계약입니다: 각 필드는 읽고 있는 사람이 아닌 다른 것에 넘겨줄 수 있으며, 그것이 채워지고 다시 반환됩니다.'
  section:
    assisted:
      title: 지원
      description: '필드는 에이전트나 작성할 내용을 아는 어떤 것에 의해 인수될 수 있습니다. 인수되고 있는 동안에는 그렇게 표시되며, 키보드와 포인터에 대한 응답을 중단하고, 필드가 결정한 대로 값이 표시됩니다: 단어의 경우 철자, 옵션의 경우 선택, 스위치의 경우 체크 표시. 지원은 본질적으로 일시적입니다; 지원이 남아 있는 필드는 아무도 사용할 수 없는 필드입니다.'
    fields:
      title: 필드
      description: '각각 하나씩, 한 번. 위의 재생 버튼을 눌러주시면 에이전트가 호출할 때와 같은 방식으로 차례로 채워집니다 — 이는 모든 필드에 대해 계약이 유지되는지 확인하는 유일한 방법입니다.'
    scale:
      title: '세그먼트 및 스케일'
      description: '`segmented: true`는 여러 짧은 선택지 중 하나의 선택을 위해 세그먼트의 스트립으로 라디오 그룹을 그립니다: 화살표에 의해 이동되는 동일한 라디오로 동일한 값을 전송합니다. `range-input`은 스케일에 따라 값을 취합니다 — `min`, `max`, `step` — 그리고 이동함에 따라 레이블 옆에 페이지의 로케일 및 스텝이 요구하는 소수점으로 표시됩니다; `suffix`는 그 뒤에 오는 단어로, 제출되지 않습니다. vue 쌍은 매 스텝마다 방출되므로, 엄지 손가락이 움직일 때 페이지가 재계산될 수 있습니다.'
    stepper:
      title: '한 번에 한 단계씩'
      description: 'stepper: true, 숫자 양쪽에 버튼이 있는 — 수량. 필드의 스텝에 따라 단계적으로 움직이며 최소 및 최대에서 멈추고, 버튼은 그곳에 머무릅니다; symfony-forms에서 경계는 필드의 범위 제약에서 옵니다.'
    addon:
      title: '값 옆에 단위'
      description: '고정된 단어 — 단위, 통화 — 값 앞이나 뒤에 필드의 프레임에 그려집니다. 스크린 리더는 필드와 함께 읽습니다; 이는 값의 일부가 아니며, 포커스할 수 없고 제출되지 않습니다. 고정된 모습이 함께 유지됩니다.'
    frozen:
      title: '고정되어 표시됨'
      description: '고정 필드는 누군가가 읽을 수 있지만 변경할 수 없는 값을 유지합니다: 정착된 것이지 사용 불가능한 것이 아닙니다. 편집 가능한 필드의 대비를 유지하며 포커스 가능하고 선택할 수 있습니다 — 작성 초대를 하는 것만 이동합니다: 자신의 땅이 없는 대시 프레임, 텍스트 커서 없음, 선택기 없음. 표시 값은 전혀 필드가 아닙니다: 레이블과 레코드가 말하는 내용이 필드의 라인에 있어 두 개가 하나의 블록으로 읽히며, 아무것도 없을 때 대시가 있습니다. vue 필드는 `readonly`를 동일한 방식으로 취합니다; 선택, 라디오, 스위치, 파일, 코드 또는 HTML이 readonly로 만들 수 없는 이모지가 그 이름 없이 값이 표시된 readonly 필드에서 값을 보여줍니다.'
    actions:
      title: '양식의 버튼'
      description: '버튼은 값을 입력하기보다는 행동을 취하므로, 에이전트가 이를 작성할 내용이 없습니다.'
    code:
      title: '셀 안의 코드'
      description: '셀 아래에 실제 필드 하나가 있어 서버는 하나의 값을 읽고 브라우저는 이미 하던 대로 유지합니다: 붙여넣기된 코드는 그대로 들어오고, 전화기는 받은 코드를 제공합니다, 백스페이스는 뒤로 갑니다. 채워지면 스스로 양식을 보냅니다 — 이 페이지에서는 꺼져 있어 전송할 곳이 없습니다.'
    select:
      title: '자체 선택'
      description: '양식 그룹 외부에 있는 두 개의 사용자 정의 선택으로, 도구 모음이나 필터 바에 배치됩니다.'
    switch:
      title: '자체 스위치'
      description: '양쪽에 레이블, 내부에 아이콘, 체크된 상태입니다.'
    switch_tone:
      title: '톤이 있는 스위치와 요청하는 스위치'
      description: "한 번 켜지면, 스위치는 링크의 색상 대신 상태나 카테고리의 색상을 가질 수 있습니다. 결과가 있는 무언가를 전환하는 것은 '경고'를 사용하며, 전에 요청합니다: 거부되면 꺼진 상태를 유지합니다. 꺼지는 것은 결코 질문받지 않습니다. 어느 쪽이든 페이지에 '스위치:변경'이라고 표시됩니다."
    switch_vue:
      title: '뷰 내의 스위치'
      description: '체크된 상태가 상태이고 스크립트가 전환하는 데이터 속성이 아닌 뷰 트리 내의 동일한 스위치입니다.'
  scale:
    window: 창
    window_3: 3개월
    window_6: 6개월
    window_12: 12개월
    coverage: '커버리지 계수'
    buffer: 버퍼
    weeks: 주
  stepper:
    quantity: 수량
    guests: 손님
    nights: 밤
    people: 사람
  addon:
    weight: 무게
    price: 가격
