    backup: 'Un código de respaldo, letras y dígitos'
    vue: 'Cuatro dígitos, en vue'
  switch:
    tone:
      success: Sincronizado
      mint: Etiquetado
      risky: 'Publicar al guardar'
    confirm:
      title: '¿Publicar al guardar?'
