~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ফরম
page_icon: 'ph:bold/textbox'
intro: 'একটি ক্ষেত্রের সেট, এটি পাঠানো হলে কী করে এবং এটি ফিরে আসলে কী বলে। ক্ষেত্রগুলো নিয়ন্ত্রণে আছে; এই পৃষ্ঠাগুলো যা যোগ করে তা হল রাউন্ড ট্রিপ।'
page:
  inputs:
    title: ইনপুট
    description: 'প্রতিটি ক্ষেত্র যা সিস্টেম সরবরাহ করে, এবং একটি প্রতিনিধিকে একটি গ্রহণ করতে, পূরণ করতে এবং ফিরিয়ে দিতে দেওয়া চুক্তি।'
  basic:
    title: 'মৌলিক ফরম'
    description: 'সাধারণ কেস: একটি ফরম যা সার্ভার দ্বারা রেন্ডার করা হয়, ব্রাউজার দ্বারা পাঠানো হয়, একটি পৃষ্ঠার মাধ্যমে উত্তর দেওয়া হয়।'
  rendered:
    title: 'উন্নত ফরম'
    description: 'ফরম কম্পোনেন্ট দ্বারা নির্মিত, যার সাবমিট আচরণ এবং এটি যে অবস্থায় ফিরে আসে।'
  ajax:
    title: 'এজাক্স ফরম'
    description: 'একটি ফরম যা পৃষ্ঠা ছাড়াই উত্তর দেয়, এবং এটি ফিরে আসা নিয়ে কী করে।'
  vue:
    title: 'ভিউ ফরম'
    description: 'একই ফরম একটি কম্পোনেন্ট দ্বারা চালিত, যেখানে ক্ষেত্রগুলো মার্কআপের পরিবর্তে অবস্থান।'
