en:
  page_title: Answered by a page
  back: Back to forms
  help: "Issues a code shown once, by the page answering the submission. Opened in a modal, the answer stays in the modal; on its own page, it is that page."
  issued:
    title: Code issued
    body: Shown this once — no payload, redirect or session carried it.

fr:
  page_title: Réponse en page
  back: Retour aux formulaires
  help: "Émet un code affiché une seule fois, par la page qui répond à l'envoi. Ouverte dans une modale, la réponse reste dans la modale ; seule, c'est cette page."
  issued:
    title: Code émis
    body: Affiché cette seule fois — ni réponse JSON, ni redirection, ni session ne l'a transporté.

zh:
  page_title: 页面已回答
  back: 返回表单
  help: 由页面回答提交时显示的代码仅显示一次。打开在模态框中，答案保持在模态框内；在独立页面上，它就是该页面。
  issued:
    title: 已发出的代码
    body: 仅显示一次——没有负载、重定向或会话携带它。

ar:
  page_title: 'تم الرد بواسطة صفحة'
  back: 'الرجوع إلى النماذج'
  help: 'يصدر رمز يظهر مرة واحدة، بواسطة الصفحة التي تجيب على الإرسال. عند فتحه في نافذة منبثقة، تبقى الإجابة في النافذة؛ على صفحته الخاصة، تكون تلك الصفحة.'
  issued:
    title: 'الرمز المصدَر'
    body: 'يظهر هذا مرة واحدة - لا يوجد حمولة، إعادة توجيه أو جلسة تحملها.'
