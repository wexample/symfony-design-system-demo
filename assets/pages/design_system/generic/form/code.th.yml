~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: โค้ด
page_icon: 'ph:bold/code'
intro: 'ฟิลด์ที่เก็บโค้ดซึ่งมีสีตามไวยากรณ์ มันถูกจัดส่งพร้อมกับ symfony-coding และไม่ใช่กับระบบการออกแบบ ซึ่งมันยืมมาจาก: กรอบมันคือฟิลด์ สีของมันคือโทเค็นโค้ดของสคีม์ บรรทัดปัจจุบันและการเลือกของมันคือความแตกต่างของสคีม์ — ดังนั้นมันจึงตามแสงและความมืดเช่นเดียวกับทุกสิ่งรอบข้าง.'
section:
  server:
    title: ฟิลด์เซิร์ฟเวอร์
    description: 'พื้นที่ข้อความจริง ที่ถูกวางทับโดยตัวแก้ไขเมื่อหน้าเว็บทำงาน พื้นที่ข้อความยังคงเป็นฟิลด์ — ถูกโพสต์พร้อมกับฟอร์ม สื่อสารกับสแตกฟอร์ม — ดังนั้นฟอร์มจึงทำงานได้เหมือนกันไม่ว่าจะมีหรือไม่มีมัน เลือกข้ามหลายบรรทัด โดยมีเส้นที่เคอร์เซอร์อยู่ในนั้น: การเลือกยังคงมองเห็นได้.'
  vue:
    title: 'ฟิลด์ Vue'
    description: 'ตัวแก้ไขเดียวกันที่ถือโมเดล: v-model ในระหว่างการเข้าและออก ภาษาเป็น prop ที่สามารถเปลี่ยนแปลงได้ในขณะที่ฟิลด์เปิดอยู่.'
