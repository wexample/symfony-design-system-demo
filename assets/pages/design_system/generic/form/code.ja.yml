~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: コード
page_icon: 'ph:bold/code'
intro: '文法によって色付けされたコードを保持するフィールドです。これはsymfony-codingと共に提供され、デザインシステムからは借用されているだけです：その枠はフィールドのもので、色はスキームのコードトークン、現在の行と選択はスキームのニュアンスを示します — そのため、周囲のすべてと同様に明るい面と暗い面に従います。'
section:
  server:
    title: サーバーフィールド
    description: 'ページが実行されるとエディターによって重ねられる本物のテキストエリアです。テキストエリアはフィールドのままであり、フォームと共に送信され、フォームスタックからも話しかけられます — そのため、フォームはそれがあってもなくても同じように機能します。複数の行を選択し、その中のカーソル行を選びます：選択は可視のままです。'
  vue:
    title: Vueフィールド
    description: モデルを保持する同じエディター：出入りする際のv-model、フィールドが開いている間に変更可能なプロップとしての言語です。
