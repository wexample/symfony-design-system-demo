~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Код
page_icon: 'ph:bold/code'
intro: 'Поле для кода, раскрашенное в соответствии с его грамматикой. Оно идет в комплекте с symfony-coding и не связано с дизайн-системой, из которой лишь заимствует: его рамка соответствует полю, его цвета — это токены кода схемы, текущая строка и выделение — это нюансы схемы, — поэтому оно следует за светлой и темной темой, как все вокруг.'
section:
  server:
    title: 'Поле сервера'
    description: 'Настоящее текстовое поле, поверх которого накладывается редактор, как только страница загружается. Текстовое поле остается полем — отправляется с формой, с ним взаимодействует стек форм — так что форма работает одинаково с ним или без него. Выделяйте несколько строк, курсорная строка среди них: выделение остается видимым.'
  vue:
    title: 'Поле Vue'
    description: 'Тот же редактор, который держит модель: v-model на входе и выходе, язык — это пропс, который может изменяться, пока поле открыто.'
