~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: फॉर्म
page_icon: 'ph:bold/textbox'
intro: 'एक सेट फ़ील्ड का, जब इसे भेजा जाता है, तो यह क्या करता है, और जब यह वापस आता है तो यह क्या कहता है। फ़ील्ड स्वयं Controls में हैं; जो ये पृष्ठ जोड़ते हैं वह राउंड ट्रिप है।'
page:
  inputs:
    title: इनपुट
    description: 'प्रत्येक फ़ील्ड जो सिस्टम वितरित करता है, और वह अनुबंध जो एक एजेंट को इसे लेने, भरने और वापस देने की अनुमति देता है।'
  basic:
    title: 'मूल फॉर्म'
    description: 'सादा मामला: एक फॉर्म जो सर्वर द्वारा प्रस्तुत किया गया, ब्राउज़र द्वारा भेजा गया, और एक पृष्ठ द्वारा उत्तर दिया गया।'
  rendered:
    title: 'उन्नत फॉर्म'
    description: 'फॉर्म घटक द्वारा बनाए गए फॉर्म, उनके सबमिट व्यवहार और जिस स्थिति में वे वापस आते हैं।'
  ajax:
    title: 'एजक्स फॉर्म'
    description: 'एक फॉर्म जो बिना पृष्ठ छोड़े उत्तर देता है, और जो इसके साथ वापस आता है उसके साथ क्या करता है।'
  vue:
    title: 'व्यू फॉर्म'
    description: 'वही फॉर्म जो एक घटक से संचालित होते हैं, जहाँ फ़ील्ड स्थिति होती है न कि मार्कअप।'
