~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Entradas
page_icon: 'ph:bold/textbox'
intro: 'Todos os campos que o sistema oferece, em uma página. O que eles têm em comum além da forma é um contrato: cada um pode ser entregue a algo que não é a pessoa que lê, que o preenche e o devolve.'
section:
  assisted:
    title: Assistência
    description: 'Um campo pode ser tomado — por um agente, por qualquer coisa que saiba o que escrever. Enquanto estiver ocupado, ele avisa, para de responder ao teclado e ao ponteiro, e o valor aparece da forma que o campo decidir: escrito por uma palavra, escolhido por uma opção, marcado por uma chave. A assistência é temporária por natureza; um campo assistido é um campo que ninguém pode usar.'
  fields:
    title: Campos
    description: 'Um de cada, uma vez. Pressione Play acima e eles serão preenchidos por turno, pelas mesmas chamadas que um agente faria — que é a única maneira de saber que o contrato se aplica a todos eles.'
  actions:
    title: 'Botões em um formulário'
    description: 'Um botão executa uma ação em vez de um valor, então não há nada para um agente escrever nele.'
  code:
    title: 'Um código, em células'
    description: 'Um campo real sob as células, para que o servidor leia um valor e o navegador mantenha o que já faz: um código colado chega inteiro, um telefone oferece o código que recebeu, backspace volta. Preenchido, ele envia seu formulário por conta própria — desligado nesta página, que não tem para onde enviá-lo.'
  select:
    title: 'Selecionar, por conta própria'
    description: 'Os dois selects personalizados fora de um grupo de formulário, como uma barra de ferramentas ou uma barra de filtro os coloca.'
  switch:
    title: 'Alternar, por conta própria'
    description: 'Rótulos de cada lado, ícones dentro, e o estado marcado.'
  switch_tone:
    title: 'Um switch com um tom, e um que pergunta'
    description: 'Uma vez ligado, um switch pode assumir a cor de um estado ou de uma categoria em vez da cor do link. Um que ativa algo com consequências usa `warning`, e pergunta antes: se recusado, ele permanece desligado. Desligar nunca é questionado. De qualquer forma, ele diz `switch:change` para a página.'
  switch_vue:
    title: 'Switch, em vue'
    description: 'O mesmo switch dentro de uma árvore vue, onde o estado marcado é estado e não um atributo de dado que um script altera.'
