~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 입력
page_icon: 'ph:bold/textbox'
intro: '시스템에서 제공하는 모든 필드를 한 페이지에 모았습니다. 형태를 넘어 그들의 공통점은 계약입니다: 각 필드는 읽고 있는 사람이 아닌 다른 것에 넘겨줄 수 있으며, 그것이 채워지고 다시 반환됩니다.'
section:
  assisted:
    title: 지원
    description: '필드는 에이전트나 작성할 내용을 아는 어떤 것에 의해 인수될 수 있습니다. 인수되고 있는 동안에는 그렇게 표시되며, 키보드와 포인터에 대한 응답을 중단하고, 필드가 결정한 대로 값이 표시됩니다: 단어의 경우 철자, 옵션의 경우 선택, 스위치의 경우 체크 표시. 지원은 본질적으로 일시적입니다; 지원이 남아 있는 필드는 아무도 사용할 수 없는 필드입니다.'
  fields:
    title: 필드
    description: '각각 하나씩, 한 번. 위의 재생 버튼을 눌러주시면 에이전트가 호출할 때와 같은 방식으로 차례로 채워집니다 — 이는 모든 필드에 대해 계약이 유지되는지 확인하는 유일한 방법입니다.'
  actions:
    title: '양식의 버튼'
    description: '버튼은 값을 입력하기보다는 행동을 취하므로, 에이전트가 이를 작성할 내용이 없습니다.'
  code:
    title: '셀 안의 코드'
    description: '셀 아래에 실제 필드 하나가 있어 서버는 하나의 값을 읽고 브라우저는 이미 하던 대로 유지합니다: 붙여넣기된 코드는 그대로 들어오고, 전화기는 받은 코드를 제공합니다, 백스페이스는 뒤로 갑니다. 채워지면 스스로 양식을 보냅니다 — 이 페이지에서는 꺼져 있어 전송할 곳이 없습니다.'
  select:
    title: '자체 선택'
    description: '양식 그룹 외부에 있는 두 개의 사용자 정의 선택으로, 도구 모음이나 필터 바에 배치됩니다.'
  switch:
    title: '자체 스위치'
    description: '양쪽에 레이블, 내부에 아이콘, 체크된 상태입니다.'
  switch_tone:
    title: '톤이 있는 스위치와 요청하는 스위치'
    description: "한 번 켜지면, 스위치는 링크의 색상 대신 상태나 카테고리의 색상을 가질 수 있습니다. 결과가 있는 무언가를 전환하는 것은 '경고'를 사용하며, 전에 요청합니다: 거부되면 꺼진 상태를 유지합니다. 꺼지는 것은 결코 질문받지 않습니다. 어느 쪽이든 페이지에 '스위치:변경'이라고 표시됩니다."
  switch_vue:
    title: '뷰 내의 스위치'
    description: '체크된 상태가 상태이고 스크립트가 전환하는 데이터 속성이 아닌 뷰 트리 내의 동일한 스위치입니다.'
assisted:
  hint: '에이전트가 아래 필드를 하나씩 채웁니다.'
  play: 재생
  reset: 초기화
