~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: แบบฟอร์ม
page_icon: 'ph:bold/textbox'
intro: 'ชุดของฟิลด์ ที่ทำงานอย่างไรเมื่อถูกส่ง และสิ่งที่มันบอกเมื่อกลับมา ฟิลด์เองอยู่ใน Controls; สิ่งที่หน้าเหล่านี้เพิ่มคือการเดินทางไปกลับ.'
page:
  inputs:
    title: ข้อมูลนำเข้า
    description: 'ฟิลด์ทุกตัวที่ระบบจัดส่ง และสัญญาที่ให้ตัวแทนสามารถรับฟิลด์หนึ่ง เติมข้อมูลและส่งกลับมาได้.'
  basic:
    title: แบบฟอร์มพื้นฐาน
    description: 'กรณีทั่วไป: แบบฟอร์มที่เรนเดอร์โดยเซิร์ฟเวอร์ ส่งโดยเบราว์เซอร์ ตอบกลับโดยหน้า.'
  rendered:
    title: แบบฟอร์มขั้นสูง
    description: 'แบบฟอร์มที่สร้างโดยส่วนประกอบแบบฟอร์ม พร้อมพฤติกรรมการส่งและสถานะที่กลับมา.'
  ajax:
    title: 'แบบฟอร์ม Ajax'
    description: 'แบบฟอร์มที่ตอบกลับโดยไม่ต้องออกจากหน้า และสิ่งที่มันทำกับข้อมูลที่กลับมา.'
  vue:
    title: 'แบบฟอร์ม Vue'
    description: 'แบบฟอร์มเดียวกันที่ขับเคลื่อนจากส่วนประกอบ ที่ฟิลด์เป็นสถานะแทนที่จะเป็นมาร์กอัป.'
