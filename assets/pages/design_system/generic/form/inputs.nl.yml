~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Invoeren
page_icon: 'ph:bold/textbox'
intro: 'Elk veld dat het systeem levert, op één pagina. Wat ze gemeen hebben, naast hun vorm, is een contract: elk kan worden overgedragen aan iets dat niet de persoon is die leest, dat het invult en het teruggeeft.'
section:
  assisted:
    title: Hulp
    description: 'Een veld kan worden overgenomen — door een agent, door alles wat weet wat in te vullen. Terwijl het vastgehouden wordt, geeft het dat aan, stopt met reageren op het toetsenbord en de muis, en de waarde verschijnt zoals het veld beslist: voluit geschreven voor een woord, gekozen voor een optie, aangevinkt voor een schakelaar. Hulp is van tijdelijke aard; een veld dat assistentie heeft, is een veld dat niemand kan gebruiken.'
  fields:
    title: Velden
    description: 'Één van elk, eenmaal. Druk boven op Afspelen en ze worden om de beurt ingevuld, door dezelfde oproepen die een agent zou doen — wat de enige manier is om te weten dat het contract voor hen allemaal geldt.'
  actions:
    title: 'Knoppen in een formulier'
    description: 'Een knop voert een actie uit in plaats van een waarde, dus er is niets voor een agent om in te vullen.'
  code:
    title: 'Een code, in cellen'
    description: 'Één echt veld onder de cellen, zodat de server één waarde leest en de browser doet wat het al doet: een geplakte code landt als geheel, een telefoon biedt de code die hij heeft ontvangen, backspace gaat terug. Wanneer gevuld, verstuurt het zelf zijn formulier — uitgeschakeld op deze pagina, die nergens naartoe kan sturen.'
  select:
    title: 'Selecteren, op zichzelf'
    description: 'De twee aangepaste selecties buiten een formuliergroep, zoals een werkbalk of een filterbalk ze plaatst.'
  switch:
    title: 'Schakelaar, op zichzelf'
    description: 'Labels aan beide zijden, symbolen binnenin, en de aangevinkte staat.'
  switch_tone:
    title: 'Een schakelaar met een toon, en een die vraagt'
    description: 'Eenmaal ingeschakeld kan een schakelaar de kleur van een staat of van een categorie aannemen in plaats van die van de link. Een die iets met gevolgen inschakelt, krijgt `waarschuwing`, en vraagt vooraf: geweigerd, blijft het uit. Uitzetten wordt nooit in twijfel getrokken. Hoe dan ook zegt het `schakelaar:wissel` naar de pagina.'
  switch_vue:
    title: 'Schakelaar, in vue'
    description: 'Dezelfde schakelaar binnen een vue-boom, waar de aangevinkte staat staat is en niet een gegevensattribuut dat een script omdraait.'
