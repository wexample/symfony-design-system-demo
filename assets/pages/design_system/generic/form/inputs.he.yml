~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'שדות קלט'
page_icon: 'ph:bold/textbox'
intro: 'כל שדה שהמערכת מספקת, בדף אחד. מה שיש להם במשותף מעבר לצורתם הוא הסכם: כל אחד מהם יכול להיות מועבר למשהו שאינו האדם הקורא, שממלא אותו ומחזיר אותו.'
section:
  assisted:
    title: עזרה
    description: 'שדה יכול להיות נתפס — על ידי סוכן, על ידי כל דבר שיודע מה לכתוב. בזמן שהוא מוחזק הוא אומר כך, מפסיק להגיב למקלדת ולסמן, והערך מופיע כפי שהשדה מחליט: מאויית למילה, נבחר לאופציה, מסומן למתג. עזרה היא זמנית מטבעה; שדה שנותר בעזרה הוא שדה שאף אחד לא יכול להשתמש בו.'
  fields:
    title: שדות
    description: 'אחד מכל סוג, פעם אחת. לחץ על נגן למעלה והם יתמלאו בתור, על ידי אותן קריאות שסוכן היה עושה — שזהו הדרך היחידה לדעת שההסכם מחזיק עבור כולם.'
  actions:
    title: 'כפתורים בטופס'
    description: 'כפתור לוקח פעולה ולא ערך, כך שאין מה שכתוב בו על ידי סוכן.'
  code:
    title: 'קוד, בתאים'
    description: 'שדה ממשי מתחת לתאים, כך שהשרת קורא ערך אחד והדפדפן שומר מה שהוא כבר עושה: קוד שמודבק נוחת שלם, טלפון מציע את הקוד שהוא קיבל, מקש חזרה חוזר אחורה. ממולא, הוא שולח את הטופס שלו בעצמו — כבוי בדף הזה, שאין לו לאן לשלוח אותו.'
  select:
    title: 'בחר, בעצמו'
    description: 'שני בחירות מותאמות מחוץ לקבוצת טופס, כפי שטור Toolbar או טור מסנן מציבים אותם.'
  switch:
    title: 'מתג, בעצמו'
    description: 'תיוגים משני הצדדים, סמלים בפנים, ומצב מסומן.'
  switch_tone:
    title: 'מתג עם גוון, ואחד ששואל'
    description: 'ברגע שהוא מופעל, מתג יכול לקחת את צבעו של מצב או של קטגוריה ולא של הקישור. מתג שמדליק משהו עם השלכות לוקח `אזהרה`, ושואל קודם: אם מסרבים, הוא נשאר כבוי. כיבוי לא נשאל אף פעם. כך או כך הוא אומר `switch:change` לדף.'
  switch_vue:
    title: 'מתג, ב-vue'
    description: 'אותו מתג בתוך עץ vue, שבו מצב המסומן הוא מצב ולא מאפיין נתונים שסקריפט משנה.'
assisted:
  hint: 'סוכן ממלא את השדות למטה, אחד אחרי השני.'
  play: נגן
  reset: איפוס
