~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: فارمز
page_icon: 'ph:bold/textbox'
intro: 'فیلڈز کا ایک سیٹ، جب یہ بھیجا جاتا ہے تو یہ کیا کرتا ہے، اور جب یہ واپس آتا ہے تو یہ کیا کہتا ہے۔ فیلڈز خود Controls میں ہیں؛ ان صفحات کا جو اضافہ ہے وہ راؤنڈ ٹرپ ہے۔'
page:
  inputs:
    title: 'ان پٹس'
    description: 'ہر وہ فیلڈ جو سسٹم فراہم کرتا ہے، اور وہ معاہدہ جو ایک ایجنٹ کو اسے سنبھالنے، بھرنے اور واپس کرنے کی اجازت دیتا ہے۔'
  basic:
    title: 'بنیادی فارم'
    description: 'سادہ صورت: ایک فارم جو سرور کے ذریعہ پیش کیا جاتا ہے، براؤزر کے ذریعہ بھیجا جاتا ہے، اور ایک صفحے کے ذریعہ جواب دیا جاتا ہے۔'
  rendered:
    title: 'ایڈوانسڈ فارم'
    description: 'فارمز جو فارم کمپوننٹ کے ذریعہ بنائے گئے ہیں، ان کی جمع کرانے کی خصوصیات اور وہ حالت جس میں یہ واپس آتے ہیں۔'
  ajax:
    title: 'ایجیکس فارم'
    description: 'ایک فارم جو بغیر صفحہ چھوڑے جواب دیتا ہے، اور یہ واپس آنے والی چیز کے ساتھ کیا کرتا ہے۔'
  vue:
    title: 'ویو فارم'
    description: 'وہی فارم جو ایک کمپوننٹ سے چلائے جاتے ہیں، جہاں فیلڈز حالت ہوتی ہیں نہ کہ مارک اپ۔'
