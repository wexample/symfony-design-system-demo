~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: النماذج
page_icon: 'ph:bold/textbox'
intro: 'مجموعة من الحقول، ماذا تفعل عندما يتم إرسالها، وماذا تقول عندما تعود. الحقول نفسها موجودة في عناصر التحكم؛ ما تضيفه هذه الصفحات هو الرحلة الكاملة.'
page:
  inputs:
    title: المدخلات
    description: 'كل حقل يتم شحنه من قبل النظام، والعقد الذي يسمح لوكيل بتولي واحد، ملؤه وإعادته.'
  basic:
    title: 'النماذج الأساسية'
    description: 'الحالة العادية: نموذج يتم تصنيعه بواسطة الخادم، يتم إرساله بواسطة المتصفح، ويتم الرد عليه بصفحة.'
  rendered:
    title: 'النماذج المتقدمة'
    description: 'نماذج مبنية بواسطة مكون النموذج، مع سلوكيات إرسالها والحالة التي تعود بها.'
  ajax:
    title: 'نماذج أجاكس'
    description: 'نموذج يرد دون مغادرة الصفحة، وما يفعله بما يعود.'
  vue:
    title: 'نماذج فيو'
    description: 'نفس النماذج المدفوعة من مكون، حيث تكون الحقول حالة بدلاً من تعليمات برمجية.'
