en:
  page_title: Organization
  help: "Reached from the invoice, the fields it is waiting for are pointed at, and saving goes back to it."

fr:
  page_title: Organisation
  help: "Atteint depuis la facture, les champs qu'elle attend sont signalés, et l'enregistrement y ramène."

zh:
  page_title: 组织
  help: 从发票中访问，正在等待的字段已被指向，保存后返回到该页面。

ar:
  page_title: المنظمة
  help: 'تم الوصول إليها من الفاتورة، الحقول التي تنتظرها محددة، والضغط على حفظ يعود إليها.'

hi:
  page_title: संस्थान
  help: 'इनवॉइस से पहुँचा, जिन फ़ील्ड्स की यह प्रतीक्षा कर रहा है, उन पर इशारा किया गया है, और सहेजने पर वापस लौटता है।'

he:
  page_title: ארגון
  help: 'הגעת מהחשבונית, השדות שהיא מחכה להם מסומנים, ושמירה מחזירה אותך אליה.'

fa:
  page_title: سازمان
  help: 'از طریق فاکتور دسترسی پیدا شده، فیلدهایی که منتظر آن‌هاست مشخص شده‌اند و ذخیره‌سازی به آن باز می‌گردد.'

ur:
  page_title: تنظیم
  help: 'انویس سے پہنچا، وہ فیلڈز جن کا انتظار ہے ان کی نشاندہی کی گئی ہے، اور محفوظ کرنے پر واپس اس پر جاتا ہے۔'

ja:
  page_title: 組織
  help: 請求書からアクセスされ、待機しているフィールドが示され、保存するとそこに戻ります。

ko:
  page_title: 조직
  help: '청구서에서 접근할 수 있으며, 대기 중인 필드가 표시되고 저장하면 다시 돌아갑니다.'

bn:
  page_title: সংগঠন
  help: 'চালান থেকে পৌঁছানো হয়েছে, এটি যে ক্ষেত্রগুলোর জন্য অপেক্ষা করছে সেগুলো নির্দেশিত হয়েছে, এবং সংরক্ষণ ফিরে সেখানেই যাবে।'

th:
  page_title: องค์กร
  help: 'เข้าถึงจากใบแจ้งหนี้ ฟิลด์ที่ต้องการอยู่ที่นี่ และการบันทึกจะกลับไปที่นี่.'

de:
  page_title: Organisation
  help: 'Erreicht von der Rechnung, die Felder, auf die gewartet wird, sind markiert, und das Speichern führt zurück zu ihr.'

fi:
  page_title: Organisaatio
  help: 'Laskusta saavutettuna odotettavat kentät on merkitty, ja tallentaminen palaa takaisin siihen.'

ru:
  page_title: Организация
  help: 'Получено из счета, отмечены поля, которые ожидаются, и сохранение возвращает обратно к нему.'

pl:
  page_title: Organizacja
  help: 'Dostępne z faktury, wskazane są pola, na które czeka, a zapisanie przenosi z powrotem do niej.'

es:
  page_title: Organización
  help: 'Alcanzado desde la factura, se señalan los campos que está esperando, y guardar regresa a ella.'

it:
  page_title: Organizzazione
  help: 'Raggiunto dalla fattura, i campi che sta aspettando sono evidenziati e il salvataggio torna a questo.'

pt_BR:
  page_title: Organização
  help: 'Acessado a partir da fatura, os campos que está aguardando estão indicados, e salvar retorna para ele.'

tr:
  page_title: Örgüt
  help: 'Fatura üzerinden erişildi, beklediği alanlar işaretlendi ve kaydetme işlemi ona geri döner.'

vi:
  page_title: 'Tổ chức'
  help: 'Được truy cập từ hóa đơn, các trường mà nó đang chờ được chỉ ra, và việc lưu sẽ quay lại với nó.'

id:
  page_title: Organisasi
  help: 'Diakses dari faktur, kolom yang ditunggu ditunjukkan, dan menyimpan akan kembali ke situ.'

nl:
  page_title: Organisatie
  help: 'Bereikt vanaf de factuur, de velden waar het op wacht zijn aangeduid, en opslaan gaat er weer naartoe.'
