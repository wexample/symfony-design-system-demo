~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Вводы
page_icon: 'ph:bold/textbox'
intro: 'Каждое поле, которое предоставляет система, на одной странице. Общее между ними, помимо формы, это контракт: каждое из них может быть передано чему-то, что не является читающим, что заполняет его и возвращает.'
section:
  assisted:
    title: Помощь
    description: 'Поле может быть занято — агентом, чем угодно, что знает, что писать. Пока оно занято, оно об этом сообщает, перестает реагировать на клавиатуру и указатель, а значение отображается так, как решает поле: написано для слова, выбрано для опции, отмечено для переключателя. Помощь по своей природе временная; поле, оставленное под контролем, — это поле, которым никто не может пользоваться.'
  fields:
    title: Поля
    description: 'Одно из каждого, один раз. Нажмите «Играть» выше, и они будут заполняться по очереди, теми же вызовами, которые сделал бы агент — это единственный способ узнать, что контракт соблюдается для всех из них.'
  actions:
    title: 'Кнопки в форме'
    description: 'Кнопка выполняет действие, а не принимает значение, поэтому агенту нечего в неё вписывать.'
  code:
    title: 'Код в ячейках'
    description: 'Одно реальное поле под ячейками, так что сервер считывает одно значение, а браузер сохраняет то, что он уже делает: вставленный код попадает целиком, телефон предлагает код, который он получил, клавиша Backspace возвращает назад. Заполненное, оно отправляет свою форму само — отключено на этой странице, у которой нет места, куда его отправить.'
  select:
    title: 'Выбор, самостоятельно'
    description: 'Два пользовательских выбора вне группы формы, как панель инструментов или фильтр.'
  switch:
    title: 'Переключатель, самостоятельно'
    description: 'Метки по обе стороны, значки внутри и состояние выбора.'
  switch_tone:
    title: 'Переключатель с тоном и тот, что спрашивает'
    description: 'Включенный переключатель может принимать цвет состояния или категории, а не цвет ссылки. Тот, что включает что-то с последствиями, принимает `warning` и спрашивает перед этим: отказано — остаётся выключенным. Выключение никогда не ставится под вопрос. В любом случае он сообщает `switch:change` на страницу.'
  switch_vue:
    title: 'Переключатель, во vue'
    description: 'Тот же переключатель внутри дерева vue, где состояние выбора является состоянием, а не атрибутом данных, который меняет скрипт.'
assisted:
