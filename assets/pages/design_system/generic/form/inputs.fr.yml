~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Entrées
page_icon: 'ph:bold/textbox'
intro: "Chaque champ que le système expédie, sur une page. Ce qu'ils ont en commun au-delà de leur forme est un contrat : chacun peut être remis à quelque chose qui n'est pas la personne qui lit, qui le remplit et le rend."
section:
  assisted:
    title: Assistance
    description: "Un champ peut être pris en charge — par un agent, par tout ce qui sait quoi écrire. Pendant qu'il est tenu, il le dit, cesse de répondre au clavier et au pointeur, et la valeur apparaît comme le champ le décide : épelée pour un mot, choisie pour une option, cochée pour un interrupteur. L'assistance est temporaire par nature ; un champ laissé assisté est un champ que personne ne peut utiliser."
  fields:
    title: Champs
    description: "Un de chaque, une fois. Appuyez sur Play ci-dessus et ils sont remplis à tour de rôle, par les mêmes appels qu'un agent ferait — ce qui est le seul moyen de savoir que le contrat tient pour tous."
  actions:
    title: 'Boutons dans un formulaire'
    description: "Un bouton prend une action plutôt qu'une valeur, donc il n'y a rien à écrire pour un agent."
  code:
    title: 'Un code, dans des cellules'
    description: "Un vrai champ sous les cellules, donc le serveur lit une valeur et le navigateur garde ce qu'il fait déjà : un code collé atterrit entier, un téléphone offre le code qu'il a reçu, la touche de retour supprime. Rempli, il envoie son formulaire tout seul — désactivé sur cette page, qui n'a nulle part où l'envoyer."
  select:
    title: 'Sélectionner, par lui-même'
    description: "Les deux sélections personnalisées en dehors d'un groupe de formulaires, comme une barre d'outils ou une barre de filtre les place."
  switch:
    title: 'Interrupteur, par lui-même'
    description: "Étiquettes de chaque côté, glyphes à l'intérieur, et l'état coché."
  switch_tone:
    title: 'Un interrupteur avec un ton, et un qui demande'
    description: "Une fois activé, un interrupteur peut prendre la couleur d'un état ou d'une catégorie plutôt que celle du lien. Un qui active quelque chose avec des conséquences prend `warning`, et demande avant : refusé, il reste désactivé. Éteindre n'est jamais questionné. Dans tous les cas, il dit `switch:change` à la page."
  switch_vue:
    title: 'Interrupteur, dans vue'
    description: "Le même interrupteur à l'intérieur d'un arbre vue, où l'état coché est l'état et non un attribut de données qu'un script inverse."
