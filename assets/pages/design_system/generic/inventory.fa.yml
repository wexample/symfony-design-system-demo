intro: 'هر عنصری که بسته ارسال می‌کند و فرمت‌های تحویل آن. این جدول لیستی نیست که کسی نگهداری کند: این ثبت‌نامی است که هر بسته ارسال می‌کند، که از اعلامیه‌های آن جمع‌آوری شده و با اجزای آن بررسی می‌شود. این پاسخ می‌دهد که چه چیزی وجود دارد — هرگز چه چیزی باید باشد، که سؤالی است که هیچ اسکنری نمی‌تواند حل کند و اجزا باید خودشان اعلام کنند.'
