section:
  matrix:
    title: 'عنصر بر اساس فرمت'
    description: 'یک ردیف برای هر مؤلفه، یک ستون برای هر رندر کننده. یک مؤلفه دایرکتوری زیر `components/` است که هر روش ممکن برای ترسیم آن را در بر دارد — `spinner/spinner.scss`، `spinner.html.twig`، `spinner.vue`، `spinner.ts` — بنابراین هیچ چیز نیازی به تطبیق چهار دایرکتوری بر اساس نام ندارد. یک سلول تعداد فایل‌های پشت آن را شمرده — بر روی یکی بایستید تا آنها را ببینید. هر عنصر اعلام شده در همان سطح خوانده می‌شود — یک ردیف که در یک فرمت پیدا می‌شود ممکن است یک شکاف یا یک عنصر ابتدایی باشد که هیچ چیز دیگری نمی‌خواهد و حل کردن آن کار این جدول است نه چیزی که قبلاً می‌داند. چهار حالت، که با توجه به اینکه نوبت کدام است متمایز می‌شوند: یک بررسی، عنصر وجود دارد؛ یک هشدار، خواسته شده و غایب است؛ یک دایره ضربدر، عمداً بدون آن انجام می‌شود؛ یک خالی، هیچ‌کس هنوز حکمی صادر نکرده است. بر روی یک هشدار یا دایره بایستید تا ببینید اعلامیه چه می‌گوید.'
  sources:
    title: 'اینها از کجا آمده‌اند'
    description: 'یک بسته در جدول است زیرا این را اعلام کرده است — با پیاده‌سازی `DesignSystemElementsBundleInterface`، روشی که یک بسته به بارگذار درباره مسیرهای جلو خود می‌گوید. هر کدام `data/elements.json` را درون دارایی‌های خود می‌نویسد، که با آنها منتشر می‌شود، بنابراین ساخت، سمت نود، یک زبان دیگر یا یک عامل همه از همان فایل‌ها کار می‌کنند؛ این صفحه فقط اتحادی از آنهاست.'
  abstract:
    title: انتزاعی
    description: 'پنج پایه زیر `components/_abstract/`، که هیچ‌گاه کشیده نمی‌شوند — آنها فقط گسترش می‌یابند. `_abstract/vue` سه بلوک خالی twig است که سی و یک الگو آن را پر می‌کند؛ `_abstract/form-field` اساسی است که دوازده ورودی بر اساس آن ساخته می‌شود. آنها از ماتریس خارج هستند به دلیلی که شکل‌ها نیز خارج هستند: آنها به کسی تحویل داده نمی‌شوند، بنابراین درخواست یک طرح‌واره یا دوقلوی React از آنها سؤالی است که هیچ راهی برای پاسخ به آن ندارند. خط زیر می‌گوید قبل از اینکه کسی دایرکتوری را باز کند. آنچه نشان داده می‌شود آن چیزی است که هر یک از آنها قبلاً به هر کسی که آن را گسترش می‌دهد می‌آورد.'
  shapes:
    title: شکل‌ها
    description: 'یک شکل یک سبک بدون رندر کننده است: شما نشانه‌گذاری را می‌نویسید، کلاس را بر روی آن قرار می‌دهید و شیوه‌نامه را از خودتان `@use` می‌کنید. `.stack`، `.grid`، `.block`، `.cluster`. آنها در اینجا فهرست شده‌اند و در جدول بالا نیستند زیرا جدولی از رندرکننده‌ها ستونی برای ارائه چیزی که رندر کننده‌ای ندارد ندارد — و نبود آنها در آن دلیل است که تمام هشدارهای آن به معنای کار است نه سؤالی که به بدی پرسیده شده است. خط توسط فایل‌ها کشیده می‌شود، نه بر اساس سلیقه: یک شکل دقیقاً یک `.scss` است و هیچ چیز آن را رندر نمی‌کند، بنابراین روزی که یک `.html.twig` به دست می‌آورد به `components/` منتقل می‌شود و به ماتریس ملحق می‌شود. آن حرکت تنها ارتقاء‌ای است که وجود دارد. آنچه هر یک درباره خود می‌گوید از سرآغاز شیوه‌نامه‌اش خوانده می‌شود، بنابراین هیچ مکان دومی برای دور شدن از آن وجود ندارد.'
  coverage:
    title: 'آنچه این جا را خالی می‌گذارد'
    description: 'دایرکتوری‌های `assets/` که اسکن به آنها نمی‌رود، از دیسک فهرست شده‌اند نه از حافظه. میکسین‌ها، ابزارها و توکن‌ها عناصر نیستند و ممکن است هرگز ردیف‌هایی در اینجا نباشند؛ لایه‌ها و اسکریپت‌های مشترک هستند و هنوز پوشش داده نشده‌اند.'
