~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Inventario
page_icon: 'ph:bold/list-checks'
intro: 'Cada elemento que el paquete envía y los formatos en los que se entrega. La tabla no es una lista que alguien mantenga: es el registro que cada paquete envía, compilado a partir de sus declaraciones y verificado contra un recorrido de sus componentes. Responde a lo que hay — nunca a lo que debería haber, que es una pregunta que ningún escáner puede resolver y que los elementos tendrán que declarar por sí mismos.'
problems:
  title: 'Una declaración y los activos no coinciden'
  body: 'Se muestra aquí porque esta página se compila a partir de los activos mientras se desarrolla, por lo que ve lo que `%command%` se negaría a escribir. Cada punto a continuación nombra el elemento; la tabla se dibuja de todos modos.'
missing:
  title: 'Falta un registro'
  body: '%bundles% se inscribió como poseedor de elementos pero no tiene un registro en el disco, por lo que sus filas están ausentes de la tabla a continuación. Ejecuta `%command%` y compromete el resultado.'
summary:
  label: 'Lo que se cuenta'
  count: Cuántos
  elements: 'Elementos encontrados'
  todo: 'Formatos pendientes'
  undecided: 'Decisiones aún no tomadas'
  shapes: Formas
  abstracts: 'Bases abstractas'
column:
  element: Elemento
  shape: Forma
  description: 'Para qué sirve'
cell:
  absent: 'No encontrado en este formato, y la declaración no dice por qué — una decisión aún no tomada'
  todo: 'Deseado en este formato y aún no está allí'
  shared: 'También poseído por %bundles%. No es un error — el cargador los distingue por alias — pero vale la pena saber si es un elemento redibujado o dos que comparten un nombre.'
format:
  style:
    title: Estilo
    description: 'La hoja de estilos, cargada por el cargador cuando el componente está en la página.'
  template:
    title: Plantilla
    description: 'El renderizador del servidor, dibujado por twig.'
  vue:
    title: Vue
    description: 'El gemelo del cliente, dibujado en el navegador desde las mismas opciones.'
  script:
    title: Script
    description: 'El comportamiento, vinculado al marcado una vez que está en el documento.'
  schema:
    title: Esquema
    description: 'El contrato: lo que el componente recibe, con tipos y valores por defecto. Cada otro renderizador se puede verificar contra él.'
  ai:
    title: IA
    description: 'Lo que se le dice a un agente sobre el componente: el esquema, cómo usarlo, las herramientas que actúan sobre él.'
  react:
    title: React
    description: 'El renderizador de react.'
  flutter:
    title: Flutter
    description: 'El renderizador de flutter, escrito en dart contra el esquema. El marcado no se traslada; el contrato y los tokens sí.'
section:
  matrix:
    title: 'Elemento por formato'
    description: 'Una fila por componente, una columna por renderizador. Un componente es un directorio bajo `components/` que contiene cada forma en la que puede ser dibujado — `spinner/spinner.scss`, `spinner.html.twig`, `spinner.vue`, `spinner.ts` — así que nada aquí tiene que reconciliar cuatro directorios por nombre ya. Una celda cuenta los archivos detrás de ella — pasa el ratón por encima de uno para verlos. Cada elemento declarado se lee al mismo nivel — una fila encontrada en un único formato puede ser un hueco o un primitivo que no quiere nada más, y resolver eso es el trabajo para lo que esta tabla es, en lugar de algo que ya sabe. Cuatro estados, diferenciados por de quién es el siguiente movimiento: un chequeo, el elemento está allí; una advertencia, se desea y está ausente; un círculo tachado, se prescinde intencionadamente; un espacio en blanco, nadie ha decidido aún. Pasa el ratón sobre una advertencia o un círculo para ver lo que dice la declaración.'
  sources:
    title: 'De dónde vienen estos'
    description: 'Un paquete está en la tabla porque así lo dijo — al implementar `DesignSystemElementsBundleInterface`, la forma en que un paquete le dice al cargador sobre sus rutas frontales. Cada uno escribe `data/elements.json` dentro de sus propios activos, publicados con ellos, para que la construcción, el lado de nodo, otro idioma o un agente trabajen a partir de los mismos archivos; esta página es solo su unión.'
  abstract:
    title: Abstracto
    description: 'Las cinco bases bajo `components/_abstract/`, que nunca se dibujan — solo se extienden. `_abstract/vue` son tres bloques twig vacíos que treinta y una plantillas llenan; `_abstract/form-field` es sobre lo que se construyen doce entradas. Están fuera de la matriz por la razón que tienen las formas: no se entregan a nadie, por lo que pedirles un esquema o un gemelo de react es hacer una pregunta que no tienen forma de responder. El guion bajo dice tanto antes de que alguien abra el directorio. Lo que se muestra es lo que cada uno ya aporta a quien lo extiende.'
  shapes:
    title: Formas
    description: 'Una forma es un estilo sin renderizador: escribes el marcado, pones la clase en él y `@use` la hoja de estilos desde la tuya. `.stack`, `.grid`, `.block`, `.cluster`. Se enumeran aquí y no en la tabla anterior porque una tabla de renderizadores no tiene columna para ofrecer algo que no tiene — y su ausencia de ella es por eso que todas sus advertencias significan trabajo en lugar de una pregunta mal formulada. La línea la marcan los archivos, no el gusto: una forma es exactamente un `.scss` y nada lo renderiza, así que el día que uno gane un `.html.twig` se mueve a `components/` y se une a la matriz. Ese movimiento es la única promoción que hay. Lo que cada uno dice sobre sí mismo se lee en la cabecera de su propia hoja de estilos, por lo que no hay un segundo lugar del que pueda driftar.'
  coverage:
    title: 'Lo que esto omite'
    description: 'Directorios de `assets/` que el escaneo no recorre, listados desde el disco en lugar de desde la memoria. Los mixins, utilidades y tokens no son elementos y pueden no ser filas aquí; los layouts y scripts compartidos sí lo son, y aún no están cubiertos.'
