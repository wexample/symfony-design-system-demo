section:
  matrix:
    title: 'רכיב לפי פורמט'
    description: 'שורה אחת לכל רכיב, עמודה אחת לכל מנפיק. רכיב הוא תיקיה תחת `components/` המחזיקה בכל דרך שהיא יכולה להיות מצויירת — `spinner/spinner.scss`, `spinner.html.twig`, `spinner.vue`, `spinner.ts` — כך שאין צורך ליישב כאן ארבע תיקיות לפי שם יותר. תא סופר את הקבצים מאחוריו — ריחף אחד כדי לראותם. כל רכיב שהוצהר נקרא באותו רמה — שורה שנמצאת בפורמט אחד עשויה להיות רווח או פרימיטיבי שלא רוצה דבר נוסף, וסידור זה הוא העבודה שהטבלה הזו מיועדת לה ולא משהו שהיא כבר יודעת. ארבע מדינות, נבדלות לפי מי התור הבא: בדיקה, הרכיב נמצא שם; אזהרה, הוא רצוי וחסר; מעגל מוחק, הוא עושה בלי בכוונה; ריק, אף אחד לא קבע עדיין. ריחף אזהרה או מעגל כדי לראות מה אומרת ההצהרה.'
  sources:
    title: 'מאיפה זה מגיע'
    description: 'חבילה נמצאת בטבלה כי היא אמרה כך — על ידי מימוש `DesignSystemElementsBundleInterface`, הדרך שבה חבילה אומרת לטעון על מסלולי הקצה שלה. כל אחת כותבת `data/elements.json` בתוך הנכסים שלה, שפורסמו עימן, כך שהבנייה, צד הנוד, שפה אחרת או סוכן כולם עובדים מאותה קבצים; דף זה הוא רק האיחוד שלהם.'
  abstract:
    title: אבסטרקט
    description: 'חמש הבסיסים תחת `components/_abstract/`, שמהם אף אחד לא מצייר — הם רק מורחבים. `_abstract/vue` הוא שלושה בלוקים ריקים של twig שמלאים על ידי שלושים ואחת תבניות; `_abstract/form-field` הוא מה שעליו נבנים שנים עשר קלטים. הם מחוץ למטריצה מהסיבה שהצורות הם: הם לא נמסרים לאף אחד, כך שבקשתם לסקימה או תאום react היא שאלה שאין להם דרך לענות עליה. הקו התחתון אומר את זה לפני שמישהו פותח את התיקיה. מה שמוצג הוא מה שכל אחד כבר מביא למי שמרחיב אותו.'
  shapes:
    title: צורות
    description: 'צורה היא סגנון בלי מנפיק: אתה כותב את המרק-up, שם את הכיתה עליה, ו`@use` את גיליון הסגנונות שלך. `.stack`, `.grid`, `.block`, `.cluster`. הם רשומים כאן ולא בטבלה למעלה כי טבלה של מנפיקים אין לה עמודה להציע משהו שאין לו — והיעדרם משם הוא הסיבה לכך שכל האזהרות שלה משמעותן עבודה ולא שאלה שהושאלה בצורה גרועה. הקו נמשך על ידי הקבצים, לא על ידי טעם: צורה היא בדיוק אחת `.scss` ולא שום דבר מצייר אותה, כך שביום שבו רוכשים `.html.twig` היא עוברת ל`components/` ומצטרפת למטריצה. המעבר הזה הוא היחיד שיש. מה שכל אחד אומר על עצמו נקרא מראש גיליון הסגנונות שלו, כך שאין מקום שני שבו הוא יכול לנדוד.'
  coverage:
    title: 'מה שזה משאיר בחוץ'
    description: 'תיקיות של `assets/` שהסריקה לא עוברת, רשומות מהדיסק ולא מהזיכרון. מיקסינים, כלים וטוקנים אינם רכיבים ואולי לעולם לא יהיו שורות כאן; פריסות וסקריפטים משותפים הם, ועדיין לא מכוסים.'
