~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Väli
page_icon: 'ph:bold/ruler'
intro: 'Kaksi skaalaa ja yksi sääntö. Muoto ei koskaan kirjoita pituutta: se vie askeleen, mikä pitää kaksi komponenttia, jotka on kirjoitettu vuoden välein, kahden pikselin rytmissä.'
section:
  space:
    title: Väliaskelmat
    description: 'Yhdeksän askelta, hiusviivasta sivun marginaaliin. Tyhjät tilat, väli ja marginaalit kaikki tulevat täältä — arvo kahden askeleen välillä on arvo, jota ei ole päätetty.'
  size:
    title: Koot
    description: 'Leveydet ja korkeudet, jotka alueelle annetaan: sarakkeet, paneelit, lukemismitat. Suurempi kuin väliaskelma ja käytetään samaan tarkoitukseen.'
  density:
    title: Tiheys
    description: 'Tiiviyden kuuluu alueelle, ei widgetille. Tiiviiksi julistettu palkki tekee siitä pitämänsä tiiviin myös, koska sen kantavat tokenit perivät — mikään alempi komponentti ei saa tietoa siitä, missä se seisoo.'
density:
  roomy: 'Työkalupalkki omassa tiheydessään ja sen pitämät painikkeet'
  compact: 'Sama työkalupalkki julistettuna tiiviiksi — mitään ei sanottu painikkeista'
  marker: 'Alue julistettuna tiiviiksi ilman omaa muotoaan'
  action: Luo
  other: Päivitä
