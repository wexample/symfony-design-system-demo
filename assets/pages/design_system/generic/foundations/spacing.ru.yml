~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Пространство
page_icon: 'ph:bold/ruler'
intro: 'Две шкалы и одно правило. Форма никогда не указывает длину: она проходит шаг, что и позволяет двум компонентам, написанным с разницей в год, не расходиться на два пикселя.'
section:
  space:
    title: 'Шаги расстояния'
    description: 'Девять шагов, от тонкой линии до поля страницы. Отступы, промежутки и поля все происходят отсюда — значение между двумя шагами это значение, которое еще не было определено.'
  size:
    title: Размеры
    description: 'Ширины и высоты, задаваемые региону: колонка, панель, размер чтения. Больше, чем шаг расстояния и используется по той же причине.'
  density:
    title: Плотность
    description: 'Компактность принадлежит региону, а не виджету. Панель, объявленная компактной, делает то, что она содержит, компактным тоже, потому что токены, которые ее несут, наследуют — ни одному компоненту ниже не сообщается, где он находится.'
density:
  roomy: 'Панель инструментов с собственной плотностью и кнопками, которые она содержит'
  compact: 'Та же панель инструментов, объявленная компактной — ничего не было сказано о кнопках'
  marker: 'Регион, объявленный компактным, не будучи формой сам по себе'
  action: Создать
  other: Обновить
