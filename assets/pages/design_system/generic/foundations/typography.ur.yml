~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'طراحی حروف'
page_icon: 'ph:bold/text-aa'
intro: 'اسکیل ایک کثافت کا فیصلہ ہے اور چہرے ایک فونٹ کا: یہ صفحہ دکھاتا ہے کہ شکل کیسے پڑھی جاتی ہے، نہ کہ اس کی آج کی قیمت کیا ہے۔ ڈیبگ پینل میں فونٹس محور تبدیل کریں اور نیچے سب کچھ دوسرے چہرے میں مقرر کیا گیا ہے بغیر کسی اصول کی تبدیلی کے۔'
section:
  families:
    title: خاندان
    description: 'تین، کیونکہ یہی ایک صفحہ کی تفریق ہے: یہ کس میں لکھا گیا ہے، یہ کس میں عنوان دیا گیا ہے، اور یہ کیا ہے کہ پڑھنے کا مطلب ہے نہ کہ کہا جائے۔ ایک مجموعہ تینوں کو ایک ہی چہرہ دے سکتا ہے — نظام والا ایسا ہی کرتا ہے۔'
  weights:
    title: وزن
    description: 'جس قدر وہ اصرار کرتے ہیں اس سے نامزد، کبھی نمبر سے نہیں۔ ایک چہرہ جس کا 500 موجود نہیں ہے، اسے اس پر نقش کرتا ہے جو اس کے پاس ہے، اور وہ شکلیں جو ایک درمیانی کی درخواست کرتی ہیں وہ درمیانی کی درخواست کرتی رہتی ہیں۔'
  typography:
    title: 'حروف کی پیمائش'
title:
  h1:
    title: 'ڈیزائن سسٹم — عظیم انٹرفیس کے لئے بنیادی عناصر'
    description: 'ہر صفحہ پر ایک بار استعمال ہوتا ہے۔ بنیادی سیاق و سباق مرتب کرتا ہے۔ ایک مختصر ابتدائی پیراگراف کے ساتھ مل کر۔'
  h2:
    title: 'طراحی حروف ہیرارکی اور تال قائم کرتی ہے'
    description: 'سیکشن کی سطح کا عنوان۔ متعلقہ مواد کو گروپ کرتا ہے۔ عموماً جسمانی متن یا ذیلی سیکشنز کے بعد ہوتا ہے۔'
  h3:
    title: 'خالی جگہ اور تناسب پڑھنے کی قابلیت کو شکل دیتے ہیں'
    description: 'ذیلی سیکشن کا عنوان۔ ایک سیکشن کے اندر ایک مرکوز موضوع متعارف کرتا ہے۔'
  h4:
    title: 'رنگ اور تضاد آنکھ کی رہنمائی کرتے ہیں'
    description: 'کارڈ کے عنوانات، سائیڈبار کے سیکشنز، یا چھوٹے گروپنگز کے لئے استعمال ہوتا ہے۔'
  h5:
    title: 'انٹرایکٹو حالتیں واضح ہونی چاہئیں'
    description: 'لیبلز، میٹا ڈیٹا ہیڈرز، چھوٹے گروپنگز۔ جسمانی متن سے ہلکے لیکن ممتاز۔'
  h6:
    title: 'رسائی ایک خصوصیت ہے، بعد میں آنے والا خیال نہیں'
    description: 'سب سے چھوٹا عنوانی سطح۔ احتیاط سے استعمال کریں — حاشیہ، قانونی بلاکس، یا ضمنی لیبلز کے لئے۔'
sample: 'چست بھورا لومڑی سست کتے پر چھلانگ لگاتی ہے — 0123456789'
