~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: بنیادها
page_icon: 'ph:bold/diamonds-four'
intro: 'چیزی که بقیه از آن خرج می‌شود. هیچ‌یک از این صفحات یک جزء نیستند: آن‌ها مقیاس‌ها هستند — رنگ، فاصله، نوع و پوستی که آن‌ها را جذب می‌کند — که هر بخش دیگری بدون اینکه هرگز آن‌ها را نشان دهد، می‌خواند.'
page:
  colors:
    title: رنگ‌ها
    description: 'سطوحی که یک صفحه از آن‌ها انباشته می‌شود، سطوح معکوس که مرزها و متن‌های کمرنگ با آن‌ها کشیده می‌شوند، و پنج خانواده معنایی. هر دو وجه تم، در کنار هم.'
  spacing:
    title: فاصله
    description: 'نه مرحله فاصله، اندازه‌ها، و الگوی چگالی — اینکه یک منطقه چگونه خود را فشرده اعلام می‌کند و این چه تاثیری بر روی هر چیزی که در آن نگه داشته می‌شود دارد.'
  typography:
    title: تایپوگرافی
    description: 'مقیاس نوع و وزن‌ها، سپس همان مقیاس در کار در یک صفحه نثر.'
  skin:
    title: پوست
    description: 'چگونه چیزها با رنگ و چگالی یکسان کشیده می‌شوند: شعاع‌ها، سایه‌ها، مرزها و جداکننده‌ها. محور واحد تم که یک شخصیت دارد.'
