~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Khoảng cách'
page_icon: 'ph:bold/ruler'
intro: 'Hai thang đo và một quy tắc. Một hình dạng không bao giờ viết ra độ dài: nó trải qua một bước, điều này giữ cho hai thành phần viết cách nhau một năm không bị lệch khỏi nhịp điệu hai pixel.'
section:
  space:
    title: 'Các bước khoảng cách'
    description: 'Chín bước, từ một đường mảnh đến lề trang. Đệm, khoảng trống và lề đều bắt nguồn từ đây — một giá trị giữa hai bước là một giá trị chưa được quyết định.'
  size:
    title: 'Kích thước'
    description: 'Độ rộng và chiều cao mà một khu vực được chỉ định: một cột, một bảng, một phép đo đọc. Lớn hơn một bước khoảng cách và được sử dụng vì cùng lý do.'
  density:
    title: 'Mật độ'
    description: 'Sự chặt chẽ thuộc về một khu vực chứ không phải một widget. Một thanh công cụ được tuyên bố là chặt chẽ sẽ làm cho những gì nó giữ cũng trở nên chặt chẽ, bởi vì các token mang nó thừa kế — không có thành phần nào bên dưới được cho biết vị trí của nó.'
density:
  roomy: 'Một thanh công cụ với mật độ riêng của nó, và các nút mà nó giữ'
  compact: 'Cùng một thanh công cụ được tuyên bố là chặt chẽ — không có gì được nói về các nút'
  marker: 'Một khu vực được tuyên bố là chặt chẽ mà không trở thành một hình dạng riêng của nó'
  action: Tạo
  other: 'Làm mới'
