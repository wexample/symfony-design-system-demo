~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 간격
page_icon: 'ph:bold/ruler'
intro: '두 개의 척도와 하나의 규칙. 형태는 길이를 기록하지 않으며, 두 구성 요소가 1년 간격으로 기록될 때 두 픽셀이 리듬을 벗어나지 않도록 한 단계가 필요합니다.'
section:
  space:
    title: '간격 단계'
    description: '헤어라인부터 페이지 여백까지 아홉 단계. 패딩, 간격 및 여백 모두 여기에서 비롯됩니다 — 두 단계 사이의 값은 결정되지 않은 값입니다.'
  size:
    title: 크기
    description: '영역에 주어진 너비와 높이: 열, 패널, 읽기 기준. 간격 단계보다 크며 동일한 이유로 사용됩니다.'
  density:
    title: 밀도
    description: '콤팩트함은 위젯이 아닌 영역에 속합니다. 콤팩트하게 선언된 바는 그 안에 있는 것도 콤팩트하게 만드는데, 그를 지탱하는 토큰이 상속되기 때문입니다 — 아래의 어떤 구성 요소도 자신의 위치를 알지 못합니다.'
density:
  roomy: '자신의 밀도를 가진 툴바와 그 안에 있는 버튼들'
  compact: '콤팩트하게 선언된 동일한 툴바 — 버튼에 대해선 언급되지 않았습니다'
  marker: '자신의 형태 없이 콤팩트하게 선언된 영역'
  action: 생성
  other: '새로 고침'
