intro: 'एक ही नमूने दो बार, बाएं से दाएं और दाएं से बाएं। यहां दाएं से बाएं दिशा के लिए कुछ भी नहीं लिखा गया है: हर स्टाइलशीट एक पंक्ति के शुरू और अंत की बात करती है, इसलिए एक ब्लॉक जिसे `dir="rtl"` दिया गया है - या एक अरबी पृष्ठ - अपने आप में परिलक्षित होता है। तीर दूसरी दिशा में इशारा करते हैं, एक स्विच का नॉब दूसरी दिशा में चलता है, एक मेनू अंत की ओर खुलता है, और एक ईमेल या एक पथ बाएं से दाएं पढ़ता रहता है।'
