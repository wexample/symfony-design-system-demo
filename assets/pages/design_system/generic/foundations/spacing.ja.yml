~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 間隔
page_icon: 'ph:bold/ruler'
intro: 二つのスケールと一つのルール。形は長さを書かず、ステップを費やします。これにより、二つのコンポーネントが一年離れていても、二ピクセルのリズムのずれが生じることはありません。
section:
  space:
    title: 間隔のステップ
    description: 'ヘアラインからページのマージンまでの九つのステップ。パディング、ギャップ、マージンはすべてここから生まれます — 二つのステップの間の値は、未決定の値です。'
  size:
    title: サイズ
    description: 地域に与えられる幅と高さ：カラム、パネル、読み取りの基準。間隔のステップより大きく、同じ理由で使用されます。
  density:
    title: 密度
    description: 'コンパクトさは地域に属し、ウィジェットには属しません。コンパクトと宣言されたバーは、その中に持つものもコンパクトにします。なぜなら、それを持つトークンが継承するからです — 下のコンポーネントには、その位置が指示されません。'
density:
  roomy: 自分の密度を持つツールバーと、その中にあるボタン
  compact: 'コンパクトと宣言された同じツールバー — ボタンについては何も言われていません'
  marker: 自身の形を持たずにコンパクトと宣言された地域
  action: 作成
  other: 更新
