~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ผิว
page_icon: 'ph:bold/paint-brush'
intro: 'วิธีการวาดภาพ เมื่อสีและความหนาแน่นถูกกำหนดแล้ว: มุม, ความลึก, เส้นต่างๆ โทเค็นเหล่านี้เป็นแกน `ผิว` ของธีม — ผิวเริ่มต้นคือสิ่งที่หน้านี้แสดง และผิวอื่นคือไฟล์อื่นที่ตั้งค่าในชื่อเดียวกัน โดยไม่มีอะไรเปลี่ยนแปลงด้านล่าง'
section:
  radius:
    title: รัศมี
    description: 'ไม่มี, แล้วสี่ขั้นตอนแต่ละสองเท่าของขั้นตอนด้านล่าง, จากนั้นก็เป็นรูปไข่ ระยะห่างสองขั้นตอนคือระยะทางเดียวกันไม่ว่าจะอยู่ที่ไหนบนมาตราส่วน ซึ่งทำให้มันอ่านได้ ขั้นตอนแรกแทบจะไม่มีอยู่จริงโดยตั้งใจ: มันคือสิ่งที่ผิวเรียบต้องการเมื่อมุมที่แท้จริงอ่านว่าไม่สมบูรณ์ อะไรก็ตามที่กลมกว่าขั้นตอนสุดท้ายคือรูปทรงที่ต้องการเป็นวงกลมและบอกเอง — วงกลมไม่ใช่การตัดสินใจเกี่ยวกับผิว'
  role:
    title: บทบาทของรัศมี
    description: 'รูปทรงไม่เคยอ่านมาตราส่วนด้านบน: มันอ่านบทบาทที่มันเล่น และผิวบอกว่าบทบาทนั้นได้รับขั้นตอนไหน — ไม่เคยบอกว่าขั้นตอนนั้นมีค่าเท่าไหร่ ซึ่งจะทำให้มาตราส่วนมีความหมายสองอย่างในครั้งเดียว สิ่งที่ถือบางอย่างคือกล่อง ไม่ว่าจะถือข้อความ, เนื้อหาหรือข้อความ; สิ่งที่แยกสองภูมิภาคของหน้าไม่ใช่ทั้งสองอย่าง และไม่กลมเลย สลับผิวเป็น `นุ่ม` และดูว่าชิ้นส่วนควบคุมแยกตัวออกจากส่วนที่เหลืออย่างไร: รูปไข่เหมาะกับสิ่งที่สูงหนึ่งบรรทัดและไม่เหมาะกับช่องข้อความ'
  shadow:
    title: เงา
    description: 'ความลึกสี่ระดับ ตั้งแต่การยกเล็กน้อยไปจนถึงแผงลอย ผิวที่ต้องการโลกเรียบจะตั้งค่าทั้งสี่เป็นไม่มีและพื้นผิวที่ยกขึ้นทุกพื้นผิวจะตามมา'
  border:
    title: ขอบ
    description: 'เส้นเอง — ความกว้างและสไตล์ของมัน สีของมันไม่ได้อยู่ที่นี่: มันเป็นของชุดสี ซึ่งเป็นสิ่งที่ทำให้ผิวสามารถลบเส้นได้โดยไม่ต้องรู้ว่าสีจะเป็นอย่างไร'
  separator:
    title: ตัวแบ่งและภูมิภาค
    description: 'เส้นสองเส้นที่บอกสิ่งต่างๆ แยกแยะระหว่างสองแถวของสิ่งเดียวกัน และระหว่างสองภูมิภาคของหน้า รูปร่างมากกว่ายี่สิบอ่านตัวแรก ซึ่งเป็นเหตุผลว่าทำไมมันจึงเป็นโทเค็นและไม่ใช่กฎ'
separator:
  row: แถวหนึ่งในบรรทัดอื่น
  region: 'ภูมิภาคของหน้า, มีขอบดังกล่าว'
role:
  control: 'สูงหนึ่งบรรทัด และถูกกด'
  box: ถือบางอย่าง
  media: ภาพถ่ายและรูปภาพ
  pill: สิ่งที่อ่านว่าเป็นแคปซูล
