~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: फाउंडेशन्स
page_icon: 'ph:bold/diamonds-four'
intro: 'यह वह सब कुछ है जिससे बाकी सब खर्च होता है। इन पन्नों पर कुछ भी एक घटक नहीं है: ये वे पैमाने हैं - रंग, स्थान, प्रकार, और वह त्वचा जो उन्हें आकर्षित करती है - जो हर दूसरे सेक्शन बिना दिखाए पढ़ता है।'
page:
  colors:
    title: रंग
    description: 'सतहें जिनसे एक पृष्ठ बना होता है, उलट स्तर की सीमाएँ और म्यूटेड टेक्स्ट के साथ बनाए जाते हैं, और पांच अर्थपूर्ण परिवार। थीम के दोनों चेहरे, एक साथ।'
  spacing:
    title: स्पेसिंग
    description: 'नौ स्पेसिंग स्टेप्स, आकार, और घनत्व पैटर्न - कैसे एक क्षेत्र अपने आप को कॉम्पैक्ट घोषित करता है और यह उसके भीतर जो कुछ भी है उसे क्या करता है।'
  typography:
    title: टाइपोग्राफी
    description: 'टाइप स्केल और वजन, फिर उसी स्केल का काम एक प्रोज़ पृष्ठ में।'
  skin:
    title: त्वचा
    description: 'कैसे चीजें खींची जाती हैं, समान रंग और घनत्व पर: रेडियाई, छायाएँ, सीमाएँ और विभाजक। थीम का वह एक अक्ष जो एक चरित्र रखता है।'
