~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: التباعد
page_icon: 'ph:bold/ruler'
intro: 'مقياسين وقاعدة واحدة. الشكل لا يكتب طولًا: إنه يقضي خطوة، وهذا ما يمنع عنصرين مكتوبين على بعد عام من أن يكونا خارج النغمة بمقدار بكسل.'
section:
  space:
    title: 'خطوات التباعد'
    description: 'تسع خطوات، من خط رفيع إلى هامش الصفحة. يأتي التباعد، الفجوات والهامش من هنا — القيمة بين خطوتين هي قيمة لم يتم تحديدها بعد.'
  size:
    title: الأحجام
    description: 'العرض والارتفاع المخصصان لمنطقة: عمود، لوحة، مقياس قراءة. أكبر من خطوة التباعد وتستخدم لنفس السبب.'
  density:
    title: الكثافة
    description: 'الانضغاط ينتمي إلى منطقة وليس إلى أداة. شريط مُعلن عنه على أنه مدمج يجعل ما يحتويه مضغوطًا أيضًا، لأن الرموز التي تحملها ترث - لا يُقال لأي عنصر أدنى مكانه.'
density:
  roomy: 'شريط أدوات بكثافته الخاصة، والأزرار التي يحتويها'
  compact: 'نفس شريط الأدوات مُعلنًا عنه كمضغوط - لم يُقال شيء عن الأزرار'
  marker: 'منطقة مُعلن عنها كمضغوطة دون أن تكون شكلًا خاصًا بها'
  action: إنشاء
  other: تحديث
