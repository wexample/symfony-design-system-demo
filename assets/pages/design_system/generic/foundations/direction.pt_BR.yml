intro: 'Os mesmos exemplos duas vezes, da esquerda para a direita e da direita para a esquerda. Nada aqui está escrito para o lado direito para o esquerdo: cada folha de estilo fala do início e do fim de uma linha, então um bloco dado `dir="rtl"` — ou uma página em árabe — se espelha por conta própria. As setas apontam para o outro lado, o botão de um interruptor se move na outra direção, um menu se abre em direção ao fim, e um e-mail ou um caminho continua lendo da esquerda para a direita.'
