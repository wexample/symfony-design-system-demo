intro: 'אותם דוגמאות פעמיים, משמאל לימין ומימין לשמאל. שום דבר כאן לא נכתב עבור הצד מימין לשמאל: כל גיליון סגנון מדבר על התחלה וסוף של שורה, כך שחסימת טקסט עם `dir="rtl"` — או דף בערבית — משקפת את עצמה. חיצים מצביעים בכיוון ההפוך, ידית של מתג נעה בכיוון ההפוך, תפריט נפתח לכיוון הסוף, ודוא"ל או נתיב ממשיכים להיקרא משמאל לימין.'
