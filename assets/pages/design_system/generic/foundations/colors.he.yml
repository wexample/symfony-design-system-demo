~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: צבעים
page_icon: 'ph:bold/palette'
intro: 'שום רכיב לא נותן שם לצבע. הם נותנים שם לתפקיד — משטח, גבול, מצב — והנושא קובע איך התפקיד הזה נראה בכל אחד מהפנים שלו. החלף את התוכנית מהכותרת וצפה בכל דוגמית למטה זזה מבלי שאף אחת תוגדר מחדש.'
section:
  surfaces:
    title: משטחים
    description: 'סולם גובה מעל הדף. הפנים הבהירים מסדרים אותם לפי בהירות, הפנים הכהים לפי כמה כל אחד מהם מורם מהרקע — ולכן רכיב מבקש רמה ולא אפור.'
  invert:
    title: 'הפוך רמות'
    description: 'עשרים שלבים של צבע הטקסט מונחים על הרקע, ומקור כמעט כל גבול, טקסט מעומעם ומצב ריחוף במערכת. רמה 1 כמעט ולא קיימת, רמה 20 היא הטקסט עצמו.'
  semantic:
    title: 'משפחות סמנטיות'
    description: 'חמש משפחות, נקראות מהדף לטקסט דרך הצבע: רמה 1 היא הצבע שמעט צובע את הדף, 17 הוא הצבע השלם, 32 הוא הצבע שמעט צובע את הטקסט. מתחת לאמצע יש קרקע; מעליו יש דיו, שמאירים על הפנים הכהות ומעמיקים על הבהירות. רכיב בוחר רמה ולא הקסה, מה שמאפשר לאותה הודעה להיקרא נכון על שתי הפנים.'
  categories:
    title: 'פלטת קטגוריות'
    description: 'שלושה עשר צבעים שאינם אומרים דבר מלבד "לא זה שלידו": הסדרה של תרשים, הקטעים של הפצה, השלבים של זרימת עבודה. נקראים, לא ממוספרים — אפליקציה בוחרת `cat-mint` כי זה נראה כמו מנטה. כל אחד מגיע עם גרסה בהירה וגרסה כהה, קבועות על שתי הפנים כמו המילוי; הדיו שנכתב על מילוי מתכהה היכן שהצבע בהיר. איזו קטגוריה היא איזה צבע היא בחירת האפליקציה, ולא של מערכת העיצוב.'
  text:
    title: טקסט
    description: 'שלושה רמות תשומת לב. מה נקרא, מה מqualifies את זה, ומה רק נמצא שם כדי להימצא כאשר מחפשים.'
  borders:
    title: גבולות
    description: 'ארבע משקלים, נבדלים על פי מה שהם מפרידים: שתי דברים בתוך אזור אחד, שני אזורים של דף, או שדה ממה שמאחוריו.'
surface:
  page: 'הדף עצמו, ומה שמופיע בין האזורים'
  shell: 'תפריט, כותרת, כותרת תחתונה'
  zone: 'הקרקע שעליה עומד אזור של דף'
  one: 'קלטים ושדות'
  two: 'כפתורים, סרגלי כלים'
  three: 'בלוקים, כרטיסים, מודלים'
text:
  default: 'מה שנקרא'
  muted: 'תוויות, מטא, כותרות משנה'
  subtle: 'מפרידים ומצבים ריקים'
