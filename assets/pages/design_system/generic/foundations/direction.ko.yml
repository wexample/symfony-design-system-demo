intro: '같은 샘플을 두 번, 왼쪽에서 오른쪽과 오른쪽에서 왼쪽으로. 여기 오른쪽에서 왼쪽으로 쓰여진 것은 없습니다: 모든 스타일시트는 줄의 시작과 끝에 대해 이야기하므로 `dir="rtl"`이 주어진 블록 — 또는 아랍어 페이지 — 는 스스로 거울처럼 반사됩니다. 화살표는 반대 방향을 가리키고, 스위치의 노브는 반대 방향으로 이동하며, 메뉴는 끝 쪽으로 열리고, 이메일이나 경로는 왼쪽에서 오른쪽으로 계속 읽힙니다.'
