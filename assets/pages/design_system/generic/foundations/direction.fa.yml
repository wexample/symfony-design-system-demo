intro: 'نمونه‌های یکسان به صورت دو بار، از چپ به راست و از راست به چپ. هیچ چیزی در اینجا برای سمت راست به چپ نوشته نشده است: هر استایل‌ شیت به شروع و پایان یک خط اشاره دارد، بنابراین یک بلوک با `dir="rtl"` — یا یک صفحه به زبان عربی — به طور خودکار آینه‌ای است. پیکان‌ها به سمت دیگر اشاره می‌کنند، دسته یک سوئیچ به سمت دیگر حرکت می‌کند، منویی به سمت پایان باز می‌شود و یک ایمیل یا یک مسیر به صورت چپ به راست ادامه می‌یابد.'
