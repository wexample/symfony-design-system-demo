en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Skin
  page_icon: ph:bold/paint-brush

  intro: "How things are drawn, once colour and density are settled: the corners, the depth, the lines. These tokens are the `skin` axis of the theme — the default skin is what this page shows, and another skin is another file setting the same names, with nothing to change below."

  section:
    radius:
      title: Radii
      description: "None, then four steps each twice the one below, then a pill. Two steps apart is the same distance wherever you stand on the scale, which is what makes it readable. The first step is barely there on purpose: it is what a flat skin wants when a true right angle reads as unfinished. Anything rounder than the last step is a shape that wants to be a circle and says so itself — a circle is not a skin decision."
    role:
      title: Radius roles
      description: "A shape never reads the scale above: it reads the role it plays, and the skin says which step that role gets — never what a step is worth, which would make the scale mean two things at once. What holds something is a box, whether it holds text, content or a message; what separates two regions of a page is neither, and rounds nothing. Switch the skin to `soft` and watch a control part ways with the rest: a capsule is right for something one line high and absurd for a textarea."
    shadow:
      title: Shadows
      description: "Four depths, from a hairline lift to a floating panel. A skin that wants a flat world sets all four to none and every raised surface follows."
    border:
      title: Borders
      description: "The line itself — its width and its style. Its colour is not here: that belongs to the colour scheme, which is what lets a skin remove a line without knowing what colour it would have had."
    separator:
      title: Separators and regions
      description: "The two lines that tell things apart: between two rows of one thing, and between two regions of a page. Twenty-odd shapes read the first one, which is why it is a token and not a rule."

  separator:
    row: a row among others
    region: a region of the page, bordered as such

  role:
    control: one line high, and pressed
    box: holds something
    media: pictures and figures
    pill: what is read as a capsule

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: الواجهة
  page_icon: 'ph:bold/paint-brush'
  intro: 'كيف يتم رسم الأشياء، بمجرد أن يتم تحديد اللون والكثافة: الزوايا، العمق، الخطوط. هذه الرموز هي محور `الواجهة` للثيم - الواجهة الافتراضية هي ما تعرضه هذه الصفحة، وواجهة أخرى هي ملف آخر يحدد نفس الأسماء، دون أي شيء يتغير أدناه.'
  section:
    radius:
      title: 'نصف القطر'
      description: 'لا شيء، ثم أربع خطوات كل منها ضعف الخطوة التي تليها، ثم شكل دائري. الخطوتان المتباعدتان تبقيان بنفس المسافة أينما كنت على المقياس، وهو ما يجعلها قابلة للقراءة. الخطوة الأولى بالكاد موجودة عن عمد: إنها ما تريده واجهة مسطحة عندما تقرأ الزاوية القائمة الحقيقية على أنها غير مكتملة. أي شيء أكثر استدارة من الخطوة الأخيرة هو شكل يريد أن يكون دائرة ويقول ذلك بنفسه - الدائرة ليست قرار واجهة.'
    role:
      title: 'أدوار نصف القطر'
      description: 'الشكل لا يقرأ المقياس أعلاه: إنه يقرأ الدور الذي يلعبه، والواجهة تقول أي خطوة يحصل عليها هذا الدور - وليس ما تستحقه خطوة، مما يجعل المقياس يعني شيئان في آن واحد. ما holds شيء هو صندوق، سواء كان يحتفظ بنص أو محتوى أو رسالة؛ وما يفصل بين منطقتين من صفحة ليس أي منهما، ولا يدور أي شيء. قم بتغيير الواجهة إلى `ناعمة` وانظر كيف ينفصل عنصر تحكم عن البقية: الكبسولة مناسبة لشيء بارتفاع سطر واحد وسخيفة لمنطقة نص.'
    shadow:
      title: الظلال
      description: 'أربعة أعماق، من رفع رفيع إلى لوحة عائمة. واجهة تريد عالماً مسطحاً تضبط الأربعة جميعها إلى لا شيء ويتبع كل سطح مرتفع ذلك.'
    border:
      title: الحدود
      description: 'الخط نفسه - عرضه وأسلوبه. لونه ليس هنا: يعود إلى نظام الألوان، وهو ما يسمح لواجهة بإزالة خط دون معرفة ما سيكون لونه.'
    separator:
      title: 'الفواصل والمناطق'
      description: 'الخطان اللذان يميزان الأشياء: بين صفين من شيء واحد، وبين منطقتين من صفحة. عشرون شكلاً تقريباً تقرأ الأول، وهذا هو السبب في أنها رمز وليس قاعدة.'
  separator:
    row: 'صف بين آخرين'
    region: 'منطقة من الصفحة، محددة على هذا النحو'
  role:
    control: 'ارتفاع سطر واحد، وضغطت'
    box: 'تحتفظ بشيء'
    media: 'صور وأشكال'
    pill: 'ما يُقرأ ككبسولة'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: স্কিন
  page_icon: 'ph:bold/paint-brush'
  intro: 'কিভাবে জিনিসগুলো আঁকা হয়, একবার রঙ এবং ঘনত্ব স্থির হলে: কোণগুলো, গভীরতা, রেখাগুলো। এই টোকেনগুলো হল থিমের `স্কিন` অক্ষ — ডিফল্ট স্কিন হল যা এই পৃষ্ঠা দেখায়, এবং অন্য একটি স্কিন হল অন্য একটি ফাইল যা একই নাম সেট করে, নিচে পরিবর্তনের কিছু নেই।'
  section:
    radius:
      title: ব্যাসার্ধ
      description: 'কিছুই নেই, তারপর চারটি ধাপ প্রতিটি নিচেরটির দ্বিগুণ, তারপর একটি পিল। দুটি ধাপের মধ্যে দূরত্ব স্কেলে আপনি যেখানে দাঁড়ান সেখানে একই, যা এটিকে পড়ার যোগ্য করে। প্রথম ধাপটি উদ্দেশ্যমূলকভাবে এখানে নেই: এটি হল একটি সমতল স্কিনের চাহিদা যখন একটি সঠিক কোণ অসম্পূর্ণ হিসেবে পড়ে। শেষ ধাপের চেয়ে গোলাকার কিছু গঠন একটি বৃত্ত হওয়ার ইচ্ছা প্রকাশ করে এবং নিজেই তা বলে — একটি বৃত্ত একটি স্কিন সিদ্ধান্ত নয়।'
    role:
      title: 'ব্যাসার্ধের ভূমিকা'
      description: 'একটি গঠন কখনোই উপরের স্কেল পড়ে না: এটি তার ভূমিকা পড়ে, এবং স্কিন বলে যে সেই ভূমিকা কোন ধাপ পায় — কখনোই একটি ধাপের মূল্য নয়, যা স্কেলকে একসাথে দুটি অর্থ দেয়। যা কিছু ধারণ করে তা একটি বাক্স, এটি পাঠ্য, বিষয়বস্তু বা একটি বার্তা ধারণ করে; একটি পৃষ্ঠার দুটি অঞ্চলের মধ্যে যা আলাদা করে তা নয়, এবং কিছুই গোল করে না। স্কিনটি `সফট` এ পরিবর্তন করুন এবং একটি নিয়ন্ত্রণের অংশটি বাকি অংশ থেকে আলাদা হতে দেখুন: একটি ক্যাপসুল এমন কিছু জন্য সঠিক যা একটি লাইন উচ্চ এবং একটি টেক্সট এরিয়ার জন্য অযৌক্তিক।'
    shadow:
      title: ছায়া
      description: 'চারটি গভীরতা, একটি চুলের রেখা উঁচু থেকে একটি ভাসমান প্যানেল। একটি স্কিন যা একটি সমতল বিশ্ব চায় সব চারটি মান শূন্য করে এবং প্রতিটি উঁচু পৃষ্ঠ অনুসরণ করে।'
    border:
      title: সীমান্ত
      description: 'রেখাটি নিজেই — এর প্রস্থ এবং এর শৈলী। এর রঙ এখানে নেই: এটি রঙের স্কিমের অন্তর্গত, যা একটি স্কিনকে একটি রেখা অপসারণ করতে দেয় জানার প্রয়োজন ছাড়াই এটি কোন রঙের হবে।'
    separator:
      title: 'বিভাজক এবং অঞ্চল'
      description: 'দুটি রেখা যা জিনিসগুলো আলাদা করে: একটি জিনিসের দুটি সারির মধ্যে, এবং একটি পৃষ্ঠার দুটি অঞ্চলের মধ্যে। বিশাল আকারের প্রায় বিশাল আকার প্রথমটিকে পড়ে, যা এটি একটি টোকেন এবং একটি নিয়ম নয়।'
  separator:
    row: 'অন্যান্যগুলোর মধ্যে একটি সারি'
    region: 'একটি অঞ্চলের পৃষ্ঠা, এইভাবে সীমানা দেওয়া'
  role:
    control: 'এক লাইন উচ্চ, এবং চাপা'
    box: 'কিছু ধারণ করে'
    media: 'ছবি এবং চিত্র'
    pill: 'যা একটি ক্যাপসুল হিসেবে পড়া হয়'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Skin
  page_icon: 'ph:bold/paint-brush'
  intro: 'Wie Dinge gezeichnet werden, nachdem Farbe und Dichte festgelegt sind: die Ecken, die Tiefe, die Linien. Diese Tokens sind die `Skin`-Achse des Themas — die Standard-Skin ist das, was diese Seite zeigt, und eine andere Skin ist eine andere Datei, die dieselben Namen festlegt, ohne dass darunter etwas geändert werden muss.'
  section:
    radius:
      title: Radien
      description: 'Kein Radius, dann vier Schritte, jeweils doppelt so groß wie der darunter, dann eine Pille. Zwei Schritte Abstand sind immer die gleiche Distanz, egal wo man auf der Skala steht, was sie lesbar macht. Der erste Schritt ist absichtlich kaum wahrnehmbar: er ist das, was eine flache Skin will, wenn ein echter rechter Winkel unvollendet wirkt. Alles, was runder ist als der letzte Schritt, ist eine Form, die ein Kreis sein möchte und das selbst sagt — ein Kreis ist keine Entscheidung der Skin.'
    role:
      title: Radiusrollen
      description: 'Eine Form liest nie die Skala oben: sie liest die Rolle, die sie spielt, und die Skin sagt, welcher Schritt dieser Rolle zugeteilt wird — niemals, was ein Schritt wert ist, was die Skala zwei Bedeutungen auf einmal geben würde. Was etwas hält, ist eine Box, egal ob sie Text, Inhalt oder eine Nachricht hält; was zwei Bereiche einer Seite trennt, ist weder das eine noch das andere und rundet nichts. Wechsle die Skin zu `soft` und beobachte, wie ein Steuerelement sich vom Rest trennt: eine Kapsel ist passend für etwas, das eine Zeile hoch ist, und absurd für ein Textfeld.'
    shadow:
      title: Schatten
      description: 'Vier Tiefen, von einem feinen Lift bis zu einem schwebenden Panel. Eine Skin, die eine flache Welt will, setzt alle vier auf null, und jede erhöhte Fläche folgt.'
    border:
      title: Ränder
      description: 'Die Linie selbst — ihre Breite und ihr Stil. Ihre Farbe ist hier nicht enthalten: die gehört zum Farbschema, das es einer Skin ermöglicht, eine Linie zu entfernen, ohne zu wissen, welche Farbe sie gehabt hätte.'
    separator:
      title: 'Trennlinien und Regionen'
      description: 'Die zwei Linien, die Dinge voneinander unterscheiden: zwischen zwei Reihen einer Sache und zwischen zwei Regionen einer Seite. Zwanzig Formen lesen die erste, weshalb sie ein Token und keine Regel ist.'
  separator:
    row: 'eine Reihe unter anderen'
    region: 'eine Region der Seite, entsprechend begrenzt'
  role:
    control: 'eine Zeile hoch, und gedrückt'
    box: 'hält etwas'
    media: 'Bilder und Figuren'
    pill: 'was als Kapsel gelesen wird'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Piel
  page_icon: 'ph:bold/paint-brush'
  intro: 'Cómo se dibujan las cosas, una vez que se establece el color y la densidad: las esquinas, la profundidad, las líneas. Estos tokens son el eje de `piel` del tema: la piel predeterminada es lo que muestra esta página, y otra piel es otro archivo que establece los mismos nombres, sin nada que cambiar a continuación.'
  section:
    radius:
      title: Radios
      description: 'Ninguno, luego cuatro pasos cada uno el doble del anterior, luego una píldora. Dos pasos de distancia es la misma distancia dondequiera que estés en la escala, lo que lo hace legible. El primer paso apenas está presente a propósito: es lo que una piel plana desea cuando un verdadero ángulo recto se lee como incompleto. Cualquier cosa más redonda que el último paso es una forma que quiere ser un círculo y lo dice por sí misma: un círculo no es una decisión de piel.'
    role:
      title: 'Roles de radio'
      description: 'Una forma nunca lee la escala anterior: lee el rol que desempeña, y la piel dice qué paso recibe ese rol: nunca cuánto vale un paso, lo que haría que la escala significara dos cosas a la vez. Lo que sostiene algo es una caja, ya sea que contenga texto, contenido o un mensaje; lo que separa dos regiones de una página no es ninguno de los dos, y no redondea nada. Cambia la piel a `suave` y observa cómo un control se separa del resto: una cápsula es adecuada para algo de una línea de alto y absurda para un área de texto.'
    shadow:
      title: Sombras
      description: 'Cuatro profundidades, desde un levantamiento delgado hasta un panel flotante. Una piel que desea un mundo plano establece las cuatro en ninguna y cada superficie elevada sigue eso.'
    border:
      title: Bordes
      description: 'La línea misma: su ancho y su estilo. Su color no está aquí: eso pertenece al esquema de color, que es lo que permite que una piel elimine una línea sin saber qué color habría tenido.'
    separator:
      title: 'Separadores y regiones'
      description: 'Las dos líneas que distinguen las cosas: entre dos filas de una cosa y entre dos regiones de una página. Veinte formas aproximadamente leen la primera, razón por la cual es un token y no una regla.'
  separator:
    row: 'una fila entre otras'
    region: 'una región de la página, delimitada como tal'
  role:
    control: 'una línea de alto, y presionada'
    box: 'sostiene algo'
    media: 'imágenes y figuras'
    pill: 'lo que se lee como una cápsula'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: پوسته
  page_icon: 'ph:bold/paint-brush'
  intro: 'چگونگی طراحی اشیا، پس از تعیین رنگ و چگالی: گوشه‌ها، عمق، خطوط. این توکن‌ها محور `پوسته` تم هستند — پوسته پیش‌فرض چیزی است که این صفحه نشان می‌دهد و یک پوسته دیگر، فایل دیگری است که نام‌های مشابهی را تنظیم می‌کند، بدون هیچ تغییری در زیر.'
  section:
    radius:
      title: شعاع‌ها
      description: 'هیچ، سپس چهار مرحله که هر کدام دو برابر مرحله قبلی هستند، سپس یک قرص. فاصله دو مرحله برابر است هرجا که روی مقیاس بایستید، که این باعث می‌شود خوانا باشد. مرحله اول عملاً وجود ندارد به عمد: این چیزی است که یک پوسته صاف می‌خواهد زمانی که یک زاویه راست واقعی ناتمام به نظر می‌رسد. هر چیزی گردتر از آخرین مرحله شکلی است که می‌خواهد دایره باشد و خود را چنین معرفی می‌کند — یک دایره تصمیم پوسته نیست.'
    role:
      title: 'نقش‌های شعاع'
      description: 'یک شکل هرگز مقیاس بالای خود را نمی‌خواند: آن نقش را می‌خواند که ایفا می‌کند و پوسته می‌گوید که آن نقش چه مرحله‌ای می‌گیرد — هرگز ارزش یک مرحله را نمی‌گوید، که باعث می‌شود مقیاس همزمان به دو معنا اشاره کند. چیزی که چیزی را نگه می‌دارد یک جعبه است، چه متن، محتوا یا پیام را نگه دارد؛ چیزی که دو منطقه صفحه را جدا می‌کند نه این است و نه آن، و چیزی را گرد نمی‌کند. پوسته را به `نرم` تغییر دهید و ببینید یک کنترل چگونه از بقیه جدا می‌شود: یک کپسول برای چیزی که یک خط ارتفاع دارد مناسب است و برای یک textarea مضحک است.'
    shadow:
      title: سایه‌ها
      description: 'چهار عمق، از یک خط باریک تا یک پنل معلق. یک پوسته که دنیای صاف می‌خواهد، همه چهار را به هیچ تنظیم می‌کند و هر سطح بالارفته پیروی می‌کند.'
    border:
      title: مرزها
      description: 'خط خود — عرض و سبک آن. رنگ آن اینجا نیست: آن به طرح رنگ مربوط می‌شود، که به پوسته اجازه می‌دهد خطی را بدون دانستن اینکه رنگ آن چه خواهد بود حذف کند.'
    separator:
      title: 'تفکیک‌کننده‌ها و مناطق'
      description: 'دو خط که چیزها را از هم جدا می‌کنند: بین دو ردیف از یک چیز و بین دو منطقه از یک صفحه. بیست و چند شکل اولین را می‌خوانند، که به همین دلیل یک توکن است و نه یک قانون.'
  separator:
    row: 'یک ردیف در میان دیگران'
    region: 'یک منطقه از صفحه، به همین صورت محصور شده'
  role:
    control: 'یک خط ارتفاع، و فشرده'
    box: 'چیزی را نگه می‌دارد'
    media: 'تصاویر و اشکال'
    pill: 'چیزی که به عنوان یک کپسول خوانده می‌شود'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Ulkoasu
  page_icon: 'ph:bold/paint-brush'
  intro: 'Miten asiat piirtyvät, kun väri ja tiheys on asetettu: kulmat, syvyys, viivat. Nämä symbolit ovat teeman `ulkoasu`-akseli — oletusarvoinen ulkoasu on se, mitä tämä sivu näyttää, ja toinen ulkoasu on toinen tiedosto, joka asettaa samat nimet, ilman muutoksia alla.'
  section:
    radius:
      title: 'Säteen säteet'
      description: 'Ei mitään, sitten neljä askelta, jokainen kaksinkertainen edelliseen verrattuna, sitten pilleri. Kaksi askelta eristyksissä on sama etäisyys, missä tahansa olet asteikolla, mikä tekee siitä luettavan. Ensimmäinen askel on tarkoituksella melkein olematon: se on mitä tasainen ulkoasu haluaa, kun todellinen suorakulma näyttää keskeneräiseltä. Mikä tahansa pyöreämpi kuin viimeinen askel on muoto, joka haluaa olla ympyrä ja sanoo sen itse — ympyrä ei ole ulkoasupäätös.'
    role:
      title: 'Säteen roolit'
      description: 'Muoto ei koskaan lue ylhäällä olevaa asteikkoa: se lukee sen roolin, jota se esittää, ja ulkoasu sanoo, minkä askeleen tuo rooli saa — ei koskaan mitä askel on arvoltaan, mikä tekisi asteikosta kaksiselitteisen. Jotain pitävää on laatikko, olipa se sitten tekstiä, sisältöä tai viesti; mitä erottaa kaksi aluetta sivulla ei ole kumpikaan, eikä se pyöristä mitään. Vaihda ulkoasu `pehmeäksi` ja katso, kuinka ohjaus irtoaa muusta: kapseli on oikea yhdelle riville korkeudeltaan ja absurdein tekstialueelle.'
    shadow:
      title: Varjot
      description: 'Neljä syvyyttä, hiusviivasta kelluvaan paneeliin. Ulkoasu, joka haluaa tasaisen maailman, asettaa kaikki neljä nollaksi ja jokainen kohotettu pinta seuraa tätä.'
    border:
      title: Reunat
      description: 'Viiva itsessään — sen leveys ja tyyli. Sen väri ei ole täällä: se kuuluu väriteemaan, joka mahdollistaa ulkoasun poistaa viivan tietämättä, mitä väriä sillä olisi ollut.'
    separator:
      title: 'Erottimet ja alueet'
      description: 'Kaksi viivaa, jotka kertovat asiat erilleen: kahden yhden asian rivin välillä ja kahden alueen välillä sivulla. Kaksikymmentä-odd muotoa lukee ensimmäisen, mikä on syy siihen, että se on symboli eikä sääntö.'
  separator:
    row: 'rivi muiden joukossa'
    region: 'sivun alue, rajattu sellaiseksi'
  role:
    control: 'yksi rivi korkea ja painettu'
    box: 'pitää jotain'
    media: 'kuvat ja hahmot'
    pill: 'mikä luetaan kapselina'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Peau
  page_icon: 'ph:bold/paint-brush'
  intro: "Comment les choses sont dessinées, une fois la couleur et la densité établies : les coins, la profondeur, les lignes. Ces jetons sont l'axe de la `peau` du thème — la peau par défaut est ce que cette page montre, et une autre peau est un autre fichier définissant les mêmes noms, sans rien à changer ci-dessous."
  section:
    radius:
      title: Rayons
      description: "Aucun, puis quatre étapes chacune deux fois celle d'en dessous, puis une pilule. Deux étapes d'écart représentent la même distance peu importe où vous vous trouvez sur l'échelle, ce qui la rend lisible. La première étape est à peine là exprès : c'est ce qu'une peau plate désire quand un vrai angle droit se lit comme inachevé. Tout ce qui est plus rond que la dernière étape est une forme qui veut être un cercle et le dit elle-même — un cercle n'est pas une décision de peau."
    role:
      title: 'Rôles de rayon'
      description: "Une forme ne lit jamais l'échelle ci-dessus : elle lit le rôle qu'elle joue, et la peau indique quelle étape ce rôle obtient — jamais ce qu'une étape vaut, ce qui ferait que l'échelle signifie deux choses en même temps. Ce qui tient quelque chose est une boîte, qu'elle contienne du texte, du contenu ou un message ; ce qui sépare deux régions d'une page n'est ni l'un ni l'autre, et ne rond rien. Changez la peau en `doux` et regardez un contrôle se séparer du reste : une capsule est adéquate pour quelque chose d'une ligne de haut et absurde pour une zone de texte."
    shadow:
      title: Ombres
      description: "Quatre profondeurs, d'un soulèvement de cheveux à un panneau flottant. Une peau qui désire un monde plat définit les quatre à aucun et chaque surface surélevée suit."
    border:
      title: Bordures
      description: "La ligne elle-même — sa largeur et son style. Sa couleur n'est pas ici : cela appartient au schéma de couleurs, qui permet à une peau de retirer une ligne sans savoir quelle couleur elle aurait eue."
    separator:
      title: 'Séparateurs et régions'
      description: "Les deux lignes qui distinguent les choses : entre deux rangées d'une chose, et entre deux régions d'une page. Une vingtaine de formes lisent la première, ce qui est pourquoi c'est un jeton et non une règle."
  separator:
    row: "une rangée parmi d'autres"
    region: 'une région de la page, délimitée comme telle'
  role:
    control: 'une ligne de haut, et pressée'
    box: 'tient quelque chose'
    media: 'images et figures'
    pill: 'ce qui est lu comme une capsule'

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: עור
  page_icon: 'ph:bold/paint-brush'
  intro: 'איך הדברים נראים, לאחר שהצבע והצפיפות נקבעו: הפינות, העומק, הקווים. הטוקנים הללו הם ציר ה`עור` של הנושא — העור ברירת המחדל הוא מה שהעמוד הזה מציג, ועור אחר הוא קובץ אחר שמגדיר את אותם שמות, בלי לשנות כלום למטה.'
  section:
    radius:
      title: רדיוסים
      description: 'אין, ואז ארבעה שלבים כל אחד כפול מהשלב שלמטה, ואז גלולה. שני שלבים בנפרד הם אותו מרחק בכל מקום שבו אתה עומד על הסקלה, וזה מה שעושה אותו קריא. השלב הראשון כמעט ולא מורגש בכוונה: זה מה שעור שטוח רוצה כאשר זווית נכונה באמת נראית לא גמורה. כל דבר עגול יותר מהשלב האחרון הוא צורה שרוצה להיות מעגל ואומר את זה בעצמה — מעגל הוא לא החלטת עור.'
    role:
      title: 'תפקידי רדיוס'
      description: 'צורה לעולם לא קוראת את הסקלה למעלה: היא קוראת את התפקיד שהיא ממלאה, ועור אומר איזה שלב התפקיד הזה מקבל — אף פעם לא מה שווה שלב, מה שהיה גורם לסקלה משמעות לשני דברים בו זמנית. מה שמחזיק משהו הוא תיבה, בין אם היא מחזיקה טקסט, תוכן או הודעה; מה שמפריד בין שני אזורים של עמוד הוא לא זה ולא זה, ולא מעגל שום דבר. החלף את העור ל`רך` וצפה בחלק בקרה נפרד מהשאר: קפסולה מתאימה למשהו בגובה שורה אחת ומגוחכת עבור textarea.'
    shadow:
      title: צללים
      description: 'ארבעה עומקים, מהגבהה דקה ועד פאנל צף. עור שרוצה עולם שטוח קובע את ארבעתם לא ולא כל משטח מוגבה עוקב אחרי זה.'
    border:
      title: גבולות
      description: 'הקו עצמו — רוחבו וסגנונו. הצבע שלו לא כאן: זה שייך לסכמת הצבעים, שהיא מה שמאפשר לעור להסיר קו מבלי לדעת באיזה צבע הוא היה.'
    separator:
      title: 'מפרידים ואזורים'
      description: 'שני הקווים שמפרידים דברים: בין שתי שורות של דבר אחד, ובין שני אזורים של עמוד. כעשרים צורות קוראות את הראשון, ולכן הוא טוקן ולא כלל.'
  separator:
    row: 'שורה בין אחרות'
    region: 'אזור של העמוד, מגודר כך'
  role:
    control: 'גובה שורה אחת, ודחוס'
    box: 'מחזיק משהו'
    media: 'תמונות ודמויות'
    pill: 'מה שנקרא כקפסולה'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: त्वचा
  page_icon: 'ph:bold/paint-brush'
  intro: 'जब रंग और घनत्व तय हो जाते हैं, तब चीजें कैसे चित्रित की जाती हैं: कोने, गहराई, रेखाएँ। ये टोकन विषय के `त्वचा` अक्ष हैं - डिफ़ॉल्ट त्वचा वही है जो यह पृष्ठ दिखाता है, और दूसरी त्वचा एक और फ़ाइल है जो वही नाम सेट करती है, नीचे कुछ भी बदलने के बिना।'
  section:
    radius:
      title: त्रिज्याएँ
      description: 'कोई नहीं, फिर चार कदम प्रत्येक दो बार नीचे वाले के बराबर, फिर एक गोल आकार। दो कदम अलग होने पर यह स्केल पर कहीं भी एक समान दूरी है, जो इसे पढ़ने योग्य बनाता है। पहला कदम जानबूझकर बहुत कम है: यह वही है जो एक सपाट त्वचा चाहती है जब एक सही कोण अधूरा पढ़ा जाता है। अंतिम कदम से अधिक गोल कोई भी आकार एक गोलाकार बनना चाहता है और स्वयं कहता है - एक गोलाकार त्वचा का निर्णय नहीं है।'
    role:
      title: 'त्रिज्या भूमिकाएँ'
      description: 'एक आकार कभी भी ऊपर के स्केल को नहीं पढ़ता: यह उस भूमिका को पढ़ता है जो यह निभाता है, और त्वचा बताती है कि वह भूमिका कौन सा कदम प्राप्त करती है - कभी भी यह नहीं बताती कि एक कदम की क्या कीमत है, जो स्केल को एक साथ दो चीजें मतलब बनाती। जो कुछ भी पकड़े हुए है वह एक बॉक्स है, चाहे वह टेक्स्ट, सामग्री या संदेश को पकड़े; जो एक पृष्ठ के दो क्षेत्रों को अलग करता है वह न तो है, और न ही कुछ गोल करता है। त्वचा को `मुलायम` पर स्विच करें और देखें कि एक नियंत्रण बाकी से कैसे अलग होता है: एक कैप्सूल कुछ एक लाइन ऊँचा है और एक टेक्स्टएरिया के लिए बेतुका है।'
    shadow:
      title: छायाएँ
      description: 'चार गहराइयाँ, एक बाल रेखा उठाने से लेकर एक तैरती पैनल तक। एक त्वचा जो एक सपाट दुनिया चाहती है, सभी चार को कोई नहीं सेट करती है और हर उठी हुई सतह उसका पालन करती है।'
    border:
      title: सीमाएँ
      description: 'रेखा स्वयं - इसकी चौड़ाई और इसकी शैली। इसका रंग यहाँ नहीं है: वह रंग योजना से संबंधित है, जो एक त्वचा को बिना यह जाने कि इसका रंग क्या होगा, एक रेखा हटाने की अनुमति देती है।'
    separator:
      title: 'सेपरेटर और क्षेत्र'
      description: 'दो रेखाएँ जो चीजों को अलग करती हैं: एक चीज की दो पंक्तियों के बीच, और एक पृष्ठ के दो क्षेत्रों के बीच। बीस-odd आकार पहले को पढ़ते हैं, यही कारण है कि यह एक टोकन है और कोई नियम नहीं।'
  separator:
    row: 'अन्य के बीच एक पंक्ति'
    region: 'पृष्ठ का एक क्षेत्र, इस प्रकार की सीमा में'
  role:
    control: 'एक लाइन ऊँचा, और दबाया हुआ'
    box: 'कुछ पकड़े हुए'
    media: 'तस्वीरें और आंकड़े'
    pill: 'जो कैप्सूल के रूप में पढ़ा जाता है'

id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Kulit
  page_icon: 'ph:bold/paint-brush'
  intro: 'Bagaimana sesuatu digambar, setelah warna dan kepadatan ditentukan: sudut, kedalaman, garis. Token ini adalah sumbu `kulit` dari tema — kulit default adalah yang ditampilkan halaman ini, dan kulit lainnya adalah file lain yang mengatur nama-nama yang sama, tanpa ada yang perlu diubah di bawah.'
  section:
    radius:
      title: Jari-jari
      description: 'Tidak ada, lalu empat langkah masing-masing dua kali yang di bawah, lalu sebuah pil. Dua langkah terpisah adalah jarak yang sama di mana pun Anda berdiri di skala, itulah yang membuatnya dapat dibaca. Langkah pertama hampir tidak ada dengan sengaja: itu adalah apa yang diinginkan kulit datar ketika sudut yang sejati terbaca tidak selesai. Apa pun yang lebih bulat dari langkah terakhir adalah bentuk yang ingin menjadi lingkaran dan mengatakannya sendiri — sebuah lingkaran bukanlah keputusan kulit.'
    role:
      title: 'Peran jari-jari'
      description: 'Sebuah bentuk tidak pernah membaca skala di atas: ia membaca peran yang dimainkannya, dan kulit mengatakan langkah mana yang didapat peran itu — tidak pernah apa nilai sebuah langkah, yang akan membuat skala berarti dua hal sekaligus. Apa yang menahan sesuatu adalah sebuah kotak, apakah itu menahan teks, konten, atau pesan; apa yang memisahkan dua area di halaman bukanlah keduanya, dan tidak membulatkan apa pun. Ganti kulit menjadi `lembut` dan saksikan sebuah kontrol terpisah dari yang lainnya: sebuah kapsul tepat untuk sesuatu setinggi satu baris dan tidak masuk akal untuk textarea.'
    shadow:
      title: Bayangan
      description: 'Empat kedalaman, dari angkat garis rambut hingga panel mengapung. Sebuah kulit yang ingin dunia datar mengatur keempatnya menjadi tidak ada dan setiap permukaan yang terangkat mengikuti.'
    border:
      title: Batas
      description: 'Garis itu sendiri — lebar dan gaya. Warnanya tidak ada di sini: itu milik skema warna, yang memungkinkan sebuah kulit menghapus garis tanpa mengetahui warna apa yang seharusnya dimiliki.'
    separator:
      title: 'Pemisah dan area'
      description: 'Dua garis yang membedakan hal-hal: antara dua baris satu hal, dan antara dua area di halaman. Dua puluh bentuk lebih membaca yang pertama, itulah sebabnya ini adalah token dan bukan aturan.'
  separator:
    row: 'sebuah baris di antara yang lainnya'
    region: 'sebuah area halaman, dibatasi sebagai demikian'
  role:
    control: 'setinggi satu baris, dan tertekan'
    box: 'menahan sesuatu'
    media: 'gambar dan figura'
    pill: 'apa yang dibaca sebagai kapsul'

it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Aspetto
  page_icon: 'ph:bold/paint-brush'
  intro: "Come vengono disegnati gli elementi, una volta stabiliti colore e densità: gli angoli, la profondità, le linee. Questi token sono l'asse `skin` del tema — l'aspetto predefinito è ciò che questa pagina mostra, e un altro aspetto è un altro file che imposta gli stessi nomi, senza nulla da cambiare qui sotto."
  section:
    radius:
      title: Raggi
      description: "Nessuno, poi quattro passi ciascuno il doppio di quello sottostante, poi una pillola. Due passi di distanza è la stessa distanza ovunque tu sia sulla scala, ed è ciò che lo rende leggibile. Il primo passo è appena presente di proposito: è ciò che un aspetto piatto desidera quando un vero angolo retto appare incompleto. Qualsiasi cosa più rotonda dell'ultimo passo è una forma che desidera essere un cerchio e lo dichiara essa stessa — un cerchio non è una decisione dell'aspetto."
    role:
      title: 'Ruoli dei raggi'
      description: "Una forma non legge la scala sopra: legge il ruolo che svolge, e l'aspetto indica quale passo riceve quel ruolo — mai quanto vale un passo, il che renderebbe la scala significativa in due modi contemporaneamente. Ciò che contiene qualcosa è una scatola, sia che contenga testo, contenuto o un messaggio; ciò che separa due regioni di una pagina non è né l'uno né l'altro, e non arrotonda nulla. Cambia l'aspetto in `soft` e guarda un controllo staccarsi dal resto: una capsula è giusta per qualcosa alto una linea e assurda per un'area di testo."
    shadow:
      title: Ombre
      description: 'Quattro profondità, da un sollevamento sottile a un pannello flottante. Un aspetto che desidera un mondo piatto imposta tutti e quattro a nessuno e ogni superficie sollevata segue.'
    border:
      title: Bordi
      description: 'La linea stessa — la sua larghezza e il suo stile. Il suo colore non è qui: appartiene allo schema dei colori, che è ciò che consente a un aspetto di rimuovere una linea senza sapere di che colore sarebbe stata.'
    separator:
      title: 'Separatori e regioni'
      description: 'Le due linee che distinguono le cose: tra due righe di una cosa, e tra due regioni di una pagina. Ventidue forme leggono la prima, ed è per questo che è un token e non una regola.'
  separator:
    row: 'una riga tra le altre'
    region: 'una regione della pagina, delimitata come tale'
  role:
    control: 'alta una linea, e premuta'
    box: 'contiene qualcosa'
    media: 'immagini e figure'
    pill: 'quello che viene letto come una capsula'

ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: スキン
  page_icon: 'ph:bold/paint-brush'
  intro: '色と密度が決まった後に描かれるもの：角、深さ、線。これらのトークンはテーマの `スキン` 軸であり、デフォルトのスキンがこのページに表示され、別のスキンは同じ名前を設定する別のファイルで、以下に変更するものはありません。'
  section:
    radius:
      title: 半径
      description: 'なし、次にそれぞれ下の倍の4つのステップ、最後にピル。2ステップの間隔は、スケール上のどこにいても同じ距離で、これが読みやすさを生み出します。最初のステップは故意にほとんど存在しません：それは、真の直角が未完成に見えるときに平らなスキンが望むものです。最後のステップよりも丸い形は、円であることを望み、自らそう言います — 円はスキンの決定ではありません。'
    role:
      title: 半径の役割
      description: '形は上のスケールを読みません：それは自らが果たす役割を読み、スキンがその役割がどのステップを受けるかを示します — ステップの価値を示すことは決してなく、それはスケールが同時に二つの意味を持つことになってしまいます。何かを保持するのはボックスであり、それがテキスト、コンテンツ、またはメッセージを保持しているかどうかに関わらず、ページの二つの領域を分けるものはどちらでもなく、何も丸めません。スキンを `ソフト` に切り替えると、コントロールが他の部分と分かれるのを見ることができます：カプセルは1行の高さのものに適しており、テキストエリアには不適当です。'
    shadow:
      title: 影
      description: 四つの深さ、髪の毛のように持ち上げられたものから浮遊パネルまで。平らな世界を望むスキンはすべての深さをなしに設定し、すべての持ち上げられた面はそれに従います。
    border:
      title: 境界線
      description: '線自体 — 幅とスタイル。色はここにはありません：それはカラースキームに属し、スキンが色を知らずに線を取り除くことを可能にします。'
    separator:
      title: セパレーターと領域
      description: 物事を区別する二つの線：一つのものの二つの行の間、そしてページの二つの領域の間。約20の形が最初のものを読み取ります。これがトークンであり、ルールではない理由です。
  separator:
    row: 他の行の中の1行
    region: そのように境界のあるページの領域
  role:
    control: 1行の高さで、押されている
    box: 何かを保持する
    media: 画像や図
    pill: カプセルとして読まれるもの

ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 피부
  page_icon: 'ph:bold/paint-brush'
  intro: '색상과 밀도가 결정된 후 그려지는 방식: 모서리, 깊이, 선. 이 토큰들은 테마의 `피부` 축입니다 — 기본 피부가 이 페이지에 표시되며, 다른 피부는 같은 이름을 설정하는 다른 파일로, 아래에서 변경할 것이 없습니다.'
  section:
    radius:
      title: 반경
      description: '없음, 그 다음 두 번씩 네 단계, 그리고 알약. 두 단계 간격은 스케일 어디에 서 있든 같은 거리로, 이것이 읽기 쉽게 만듭니다. 첫 번째 단계는 일부러 거의 보이지 않게 설정됩니다: 이는 평면 피부가 원각이 미완성으로 읽힐 때 원하는 것입니다. 마지막 단계보다 더 둥근 것은 스스로 원형이 되고 싶어 하는 형태입니다 — 원형은 피부 결정이 아닙니다.'
    role:
      title: '반경 역할'
      description: '형태는 위의 스케일을 읽지 않습니다: 자신이 수행하는 역할을 읽고, 피부는 그 역할이 어떤 단계를 얻는지를 말합니다 — 단계의 가치는 결코 읽지 않으며, 이는 스케일이 동시에 두 가지 의미를 갖게 만들 것입니다. 무언가를 담고 있는 것은 상자이며, 텍스트, 콘텐츠 또는 메시지를 담고 있습니다; 페이지의 두 영역을 구분하는 것은 그 어느 것도 아니며, 아무것도 둥글게 만들지 않습니다. 피부를 `부드럽게` 전환하면 컨트롤이 나머지와 분리되는 것을 볼 수 있습니다: 캡슐은 한 줄 높이에 적합하고 텍스트 영역에는 어색합니다.'
    shadow:
      title: 그림자
      description: '네 가지 깊이, 머리카락처럼 얇은 것에서 떠 있는 패널까지. 평면 세계를 원하는 피부는 모두 네 개를 없음으로 설정하며, 모든 상승 표면이 따릅니다.'
    border:
      title: 테두리
      description: '선 자체 — 너비와 스타일. 색상은 여기 없습니다: 이는 색상 구성에 속하며, 이는 피부가 어떤 색상으로 가질지를 알지 못한 채 선을 제거할 수 있게 해줍니다.'
    separator:
      title: '구분선과 영역'
      description: '사물을 구분하는 두 선: 한 가지의 두 행 사이와 페이지의 두 영역 사이. 스무 개 정도의 형태가 첫 번째 것을 읽으며, 이것이 토큰이고 규칙이 아닌 이유입니다.'
  separator:
    row: '다른 행 중 하나'
    region: '그렇게 경계가 설정된 페이지의 영역'
  role:
    control: '한 줄 높고, 눌림'
    box: '무언가를 담고 있음'
    media: '사진과 도형'
    pill: '캡슐로 읽히는 것'

nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Huid
  page_icon: 'ph:bold/paint-brush'
  intro: 'Hoe dingen worden getekend, eenmaal kleur en dichtheid zijn vastgesteld: de hoeken, de diepte, de lijnen. Deze tokens zijn de `huid` as van het thema — de standaard huid is wat deze pagina toont, en een andere huid is een ander bestand dat dezelfde namen instelt, met niets om hieronder te veranderen.'
  section:
    radius:
      title: Stralen
      description: 'Geen, dan vier stappen elk twee keer de vorige, dan een pil. Twee stappen uit elkaar is dezelfde afstand waar je ook staat op de schaal, wat het leesbaar maakt. De eerste stap is opzettelijk nauwelijks aanwezig: het is wat een platte huid wil wanneer een echte rechte hoek als onafgemaakt leest. Iets ronder dan de laatste stap is een vorm die een cirkel wil zijn en dat zelf aangeeft — een cirkel is geen beslissing van de huid.'
    role:
      title: Radiusrollen
      description: 'Een vorm leest nooit de schaal hierboven: het leest de rol die het speelt, en de huid zegt welke stap die rol krijgt — nooit wat een stap waard is, wat de schaal twee betekenissen tegelijk zou geven. Wat iets vasthoudt is een doos, of het nu tekst, inhoud of een bericht vasthoudt; wat twee gebieden van een pagina scheidt is geen van beiden, en rondt niets af. Wissel de huid naar `zacht` en kijk hoe een controle zich scheidt van de rest: een capsule is geschikt voor iets dat één regel hoog is en absurd voor een textarea.'
    shadow:
      title: Schaduwen
      description: 'Vier dieptes, van een haarlijnlift tot een zwevend paneel. Een huid die een platte wereld wil, stelt alle vier in op niets en elk verhoogd oppervlak volgt dat.'
    border:
      title: Randen
      description: 'De lijn zelf — de breedte en de stijl. De kleur is hier niet: die behoort tot het kleurenpalet, wat een huid in staat stelt om een lijn te verwijderen zonder te weten welke kleur het zou hebben gehad.'
    separator:
      title: 'Scheidingstekens en gebieden'
      description: 'De twee lijnen die dingen van elkaar scheiden: tussen twee rijen van één ding, en tussen twee gebieden van een pagina. Twintig vormen lezen de eerste, wat het een token en geen regel maakt.'
  separator:
    row: 'een rij tussen anderen'
    region: 'een gebied van de pagina, als zodanig omrand'
  role:
    control: 'één regel hoog, en ingedrukt'
    box: 'houdt iets vast'
    media: 'afbeeldingen en figuren'
    pill: 'wat wordt gelezen als een capsule'

pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Skórka
  page_icon: 'ph:bold/paint-brush'
  intro: 'Jak rzeczy są rysowane, gdy kolor i gęstość są ustalone: rogi, głębokość, linie. Te tokeny to oś `skórki` motywu — domyślna skórka to to, co pokazuje ta strona, a inna skórka to inny plik ustawiający te same nazwy, bez niczego do zmiany poniżej.'
  section:
    radius:
      title: Promienie
      description: 'Brak, a potem cztery kroki, każdy dwa razy większy od poprzedniego, a następnie kapsuła. Dwa kroki oddalone od siebie to ta sama odległość, niezależnie od tego, gdzie stoisz na skali, co czyni ją czytelną. Pierwszy krok jest celowo ledwo zauważalny: to to, czego chce płaska skórka, gdy prawdziwy kąt prosty wydaje się nieukończony. Cokolwiek bardziej okrągłego niż ostatni krok to kształt, który chce być kołem i sam to mówi — koło to nie decyzja skórki.'
    role:
      title: 'Role promienia'
      description: 'Kształt nigdy nie interpretuje skali powyżej: odczytuje rolę, jaką odgrywa, a skórka mówi, który krok ta rola dostaje — nigdy, ile warta jest dana skala, co sprawiłoby, że skala miałaby dwa znaczenia jednocześnie. To, co trzyma coś, to pudełko, niezależnie od tego, czy trzyma tekst, treść czy wiadomość; to, co oddziela dwa obszary strony, nie jest ani jednym, ani drugim i niczego nie zaokrągla. Zmień skórkę na `miękką` i zobacz, jak element sterujący oddziela się od reszty: kapsuła jest odpowiednia dla czegoś jednego wiersza wysokości, a absurdalna dla pola tekstowego.'
    shadow:
      title: Cienie
      description: 'Cztery głębokości, od linii włosa do unoszącego się panelu. Skórka, która chce płaskiego świata, ustawia wszystkie cztery na zero, a każda podniesiona powierzchnia podąża za tym.'
    border:
      title: Krawędzie
      description: 'Linia sama w sobie — jej szerokość i styl. Jej kolor nie jest tutaj: należy do schematu kolorów, który pozwala skórce usunąć linię, nie wiedząc, jakiego koloru by miała.'
    separator:
      title: 'Separatory i obszary'
      description: 'Dwie linie, które rozdzielają rzeczy: między dwoma rzędami jednej rzeczy, a między dwoma obszarami strony. Około dwudziestu kształtów odczytuje pierwszą z nich, co jest powodem, dla którego jest to token, a nie zasada.'
  separator:
    row: 'rzęd wśród innych'
    region: 'obszar strony, ograniczony w ten sposób'
  role:
    control: 'jeden wiersz wysokości, i wciśnięty'
    box: 'trzyma coś'
    media: 'zdjęcia i figury'
    pill: 'to, co jest postrzegane jako kapsuła'

pt_BR:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Aparência
  page_icon: 'ph:bold/paint-brush'
  intro: 'Como as coisas são desenhadas, uma vez que a cor e a densidade estão definidas: os cantos, a profundidade, as linhas. Esses tokens são o eixo `aparência` do tema — a aparência padrão é o que esta página mostra, e outra aparência é outro arquivo configurando os mesmos nomes, sem nada a mudar abaixo.'
  section:
    radius:
      title: Raízes
      description: 'Nenhuma, depois quatro etapas cada uma o dobro da anterior, depois uma cápsula. Duas etapas de distância é a mesma distância, onde quer que você esteja na escala, o que a torna legível. A primeira etapa é quase imperceptível de propósito: é o que uma aparência plana deseja quando um verdadeiro ângulo reto parece inacabado. Qualquer coisa mais arredondada que a última etapa é uma forma que quer ser um círculo e assim se manifesta — um círculo não é uma decisão de aparência.'
    role:
      title: 'Funções do raio'
      description: 'Uma forma nunca lê a escala acima: ela lê a função que desempenha, e a aparência diz qual etapa essa função recebe — nunca o valor de uma etapa, o que faria a escala significar duas coisas ao mesmo tempo. O que sustenta algo é uma caixa, seja ela texto, conteúdo ou uma mensagem; o que separa duas regiões de uma página não é nada, e não arredonda nada. Mude a aparência para `suave` e veja um controle se separar do resto: uma cápsula é adequada para algo com uma linha de altura e absurda para uma área de texto.'
    shadow:
      title: Sombras
      description: 'Quatro profundidades, de um leve contorno a um painel flutuante. Uma aparência que deseja um mundo plano define todas as quatro como nenhuma e cada superfície elevada segue isso.'
    border:
      title: Bordas
      description: 'A linha em si — sua largura e estilo. Sua cor não está aqui: isso pertence à paleta de cores, que é o que permite que uma aparência remova uma linha sem saber qual cor ela teria.'
    separator:
      title: 'Separadores e regiões'
      description: 'As duas linhas que diferenciam as coisas: entre duas linhas de uma coisa e entre duas regiões de uma página. Vinte e tantas formas leem a primeira, razão pela qual é um token e não uma regra.'
  separator:
    row: 'uma linha entre outras'
    region: 'uma região da página, limitada como tal'
  role:
    control: 'uma linha de altura, e pressionada'
    box: 'sustenta algo'
    media: 'imagens e figuras'
    pill: 'o que é lido como uma cápsula'

ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Скин
  page_icon: 'ph:bold/paint-brush'
  intro: 'Как рисуются вещи, когда определены цвет и плотность: углы, глубина, линии. Эти токены являются осью `скина` темы — стандартный скин это то, что показано на этой странице, а другой скин — это другой файл с теми же именами, с которым ничего не нужно менять ниже.'
  section:
    radius:
      title: Радиусы
      description: 'Никаких, затем четыре шага, каждый в два раза больше предыдущего, затем капсула. Два шага разницы — это одно и то же расстояние, независимо от того, где вы на шкале, что делает ее читаемой. Первый шаг почти незаметен специально: он нужен плоскому скину, когда настоящий прямой угол выглядит незавершенным. Всё, что более круглое, чем последний шаг, — это форма, которая хочет быть кругом и сама это говорит — круг не является решением по скину.'
    role:
      title: 'Роли радиуса'
      description: 'Форма никогда не считывает шкалу выше: она считывает роль, которую играет, и скин говорит, какой шаг получает эта роль — никогда не то, сколько стоит шаг, что сделало бы шкалу значимой сразу для двух вещей. То, что удерживает что-то, — это коробка, независимо от того, удерживает ли она текст, контент или сообщение; то, что разделяет две области страницы, не является ни тем, ни другим, и ничего не округляет. Переключите скин на `мягкий` и посмотрите, как элемент управления отделяется от остального: капсула подходит для чего-то высотой в одну линию и абсурдна для текстового поля.'
    shadow:
      title: Тени
      description: 'Четыре глубины, от тончайшего подъема до плавающей панели. Скин, который хочет плоский мир, устанавливает все четыре на ноль, и каждая приподнятая поверхность следует этому.'
    border:
      title: Границы
      description: 'Линия сама по себе — ее ширина и стиль. Ее цвет здесь не указан: он принадлежит цветовой схеме, что позволяет скину убрать линию, не зная, какого цвета она была бы.'
    separator:
      title: 'Разделители и регионы'
      description: 'Две линии, которые отделяют вещи друг от друга: между двумя рядами одной вещи и между двумя регионами страницы. Двадцать с лишним форм считывают первую, и именно поэтому это токен, а не правило.'
  separator:
    row: 'ряд среди других'
    region: 'регион страницы, ограниченный как таковой'
  role:
    control: 'высотой в одну линию, и нажатый'
    box: 'удерживает что-то'
    media: 'изображения и фигуры'
    pill: 'то, что читается как капсула'

th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ผิว
  page_icon: 'ph:bold/paint-brush'
  intro: 'วิธีการวาดภาพ เมื่อสีและความหนาแน่นถูกกำหนดแล้ว: มุม, ความลึก, เส้นต่างๆ โทเค็นเหล่านี้เป็นแกน `ผิว` ของธีม — ผิวเริ่มต้นคือสิ่งที่หน้านี้แสดง และผิวอื่นคือไฟล์อื่นที่ตั้งค่าในชื่อเดียวกัน โดยไม่มีอะไรเปลี่ยนแปลงด้านล่าง'
  section:
    radius:
      title: รัศมี
      description: 'ไม่มี, แล้วสี่ขั้นตอนแต่ละสองเท่าของขั้นตอนด้านล่าง, จากนั้นก็เป็นรูปไข่ ระยะห่างสองขั้นตอนคือระยะทางเดียวกันไม่ว่าจะอยู่ที่ไหนบนมาตราส่วน ซึ่งทำให้มันอ่านได้ ขั้นตอนแรกแทบจะไม่มีอยู่จริงโดยตั้งใจ: มันคือสิ่งที่ผิวเรียบต้องการเมื่อมุมที่แท้จริงอ่านว่าไม่สมบูรณ์ อะไรก็ตามที่กลมกว่าขั้นตอนสุดท้ายคือรูปทรงที่ต้องการเป็นวงกลมและบอกเอง — วงกลมไม่ใช่การตัดสินใจเกี่ยวกับผิว'
    role:
      title: บทบาทของรัศมี
      description: 'รูปทรงไม่เคยอ่านมาตราส่วนด้านบน: มันอ่านบทบาทที่มันเล่น และผิวบอกว่าบทบาทนั้นได้รับขั้นตอนไหน — ไม่เคยบอกว่าขั้นตอนนั้นมีค่าเท่าไหร่ ซึ่งจะทำให้มาตราส่วนมีความหมายสองอย่างในครั้งเดียว สิ่งที่ถือบางอย่างคือกล่อง ไม่ว่าจะถือข้อความ, เนื้อหาหรือข้อความ; สิ่งที่แยกสองภูมิภาคของหน้าไม่ใช่ทั้งสองอย่าง และไม่กลมเลย สลับผิวเป็น `นุ่ม` และดูว่าชิ้นส่วนควบคุมแยกตัวออกจากส่วนที่เหลืออย่างไร: รูปไข่เหมาะกับสิ่งที่สูงหนึ่งบรรทัดและไม่เหมาะกับช่องข้อความ'
    shadow:
      title: เงา
      description: 'ความลึกสี่ระดับ ตั้งแต่การยกเล็กน้อยไปจนถึงแผงลอย ผิวที่ต้องการโลกเรียบจะตั้งค่าทั้งสี่เป็นไม่มีและพื้นผิวที่ยกขึ้นทุกพื้นผิวจะตามมา'
    border:
      title: ขอบ
      description: 'เส้นเอง — ความกว้างและสไตล์ของมัน สีของมันไม่ได้อยู่ที่นี่: มันเป็นของชุดสี ซึ่งเป็นสิ่งที่ทำให้ผิวสามารถลบเส้นได้โดยไม่ต้องรู้ว่าสีจะเป็นอย่างไร'
    separator:
      title: ตัวแบ่งและภูมิภาค
      description: 'เส้นสองเส้นที่บอกสิ่งต่างๆ แยกแยะระหว่างสองแถวของสิ่งเดียวกัน และระหว่างสองภูมิภาคของหน้า รูปร่างมากกว่ายี่สิบอ่านตัวแรก ซึ่งเป็นเหตุผลว่าทำไมมันจึงเป็นโทเค็นและไม่ใช่กฎ'
  separator:
    row: แถวหนึ่งในบรรทัดอื่น
    region: 'ภูมิภาคของหน้า, มีขอบดังกล่าว'
  role:
    control: 'สูงหนึ่งบรรทัด และถูกกด'
    box: ถือบางอย่าง
    media: ภาพถ่ายและรูปภาพ
    pill: สิ่งที่อ่านว่าเป็นแคปซูล

tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Görünüm
  page_icon: 'ph:bold/paint-brush'
  intro: 'Nesnelerin nasıl çizildiği, renk ve yoğunluk belirlendikten sonra: köşeler, derinlik, çizgiler. Bu belirteçler, temanın `görünüm` eksenidir — varsayılan görünüm, bu sayfanın gösterdiği şeydir ve başka bir görünüm, aynı isimleri ayarlayan başka bir dosyadır, aşağıda değişmesi gereken bir şey yoktur.'
  section:
    radius:
      title: Yarıçaplar
      description: 'Hiçbiri yok, sonra her biri bir altının iki katı olan dört adım, sonra bir hap. İki adım arası, ölçek üzerinde nerede durursanız durun aynı mesafedir, bu da okunabilirliği sağlar. İlk adım kasıtlı olarak neredeyse yoktur: bu, düz bir görünümün istediği şeydir; gerçek bir dik açı bitmemiş gibi görünür. Son adımın daha yuvarlak olanı, bir daire olmak isteyen bir şekildir ve bunu kendisi söyler — bir daire, bir görünüm kararı değildir.'
    role:
      title: 'Yarıçap rolleri'
      description: 'Bir şekil, yukarıdaki ölçeği okumaz: oynadığı rolü okur ve görünüm, o rolün hangi adımı alacağını belirtir — asla bir adımın ne kadar değerinde olduğunu değil, bu da ölçeğin aynı anda iki anlam taşımasına neden olur. Bir şeyi tutan bir kutudur; ister metin, içerik ya da mesaj tutuyor olsun; bir sayfanın iki bölgesini ayıran ne de odur, ne de hiçbir şeyi yuvarlatır. Görünümü `yumuşak` olarak değiştirin ve bir kontrol parçasının geri kalanından ayrıldığını görün: bir kapsül, bir satır yüksekliğindeki bir şey için uygundur ve bir metin alanı için absürt.'
    shadow:
      title: Gölgeler
      description: 'Bir saç teli kalınlığında kaldırmadan, bir yüzer panele kadar dört derinlik. Düz bir dünya isteyen bir görünüm, hepsini sıfıra ayarlar ve her yükseltilmiş yüzey buna uyar.'
    border:
      title: Sınırlar
      description: 'Çizgi kendisi — kalınlığı ve tarzı. Rengi burada yoktur: bu, renk şemasına aittir; bu da bir görünümün, ne renginin olacağını bilmeden bir çizgiyi kaldırmasına olanak tanır.'
    separator:
      title: 'Ayrıcılar ve bölgeler'
      description: 'Şeyleri ayıran iki çizgi: bir şeyin iki sırası arasında ve bir sayfanın iki bölgesi arasında. Yirmi kadar şekil ilkini okur, bu yüzden bu bir belirteçtir ve bir kural değildir.'
  separator:
    row: 'diğerleri arasında bir sıra'
    region: 'böyle sınırlı bir sayfa bölgesi'
  role:
    control: 'bir satır yüksekliğinde ve basılmış'
    box: 'bir şeyi tutar'
    media: 'resimler ve figürler'
    pill: 'kapsül olarak okunan şey'

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: اسکن
  page_icon: 'ph:bold/paint-brush'
  intro: 'چیزیں کس طرح کھینچی جاتی ہیں، جب رنگ اور کثافت طے ہو چکی ہوتی ہے: کونے، گہرائی، لائنیں۔ یہ ٹوکن تھیم کا `اسکن` محور ہیں — ڈیفالٹ اسکن وہ ہے جو یہ صفحہ دکھاتا ہے، اور دوسرا اسکن ایک اور فائل ہے جو ایک ہی ناموں کو ترتیب دیتی ہے، نیچے کچھ تبدیل کرنے کی ضرورت نہیں۔'
  section:
    radius:
      title: شعاعیں
      description: 'کوئی نہیں، پھر ہر ایک کے نیچے والے کا دوگنا چار مراحل، پھر ایک کیپسول۔ دو مراحل کے درمیان کا فاصلہ اسکیل پر جہاں بھی آپ کھڑے ہوں ایک ہی ہے، یہی اسے قابل پڑھنے بناتا ہے۔ پہلا مرحلہ جان بوجھ کر کمزور ہے: یہ وہی ہے جو ایک پھلا اسکن چاہتا ہے جب ایک حقیقی صحیح زاویہ نامکمل پڑھے۔ آخری مرحلے سے زیادہ گول کچھ بھی ایک ایسی شکل ہے جو ایک دائرہ بننا چاہتا ہے اور خود ہی یہ کہتا ہے — ایک دائرہ اسکن کا فیصلہ نہیں ہے۔'
    role:
      title: 'شعاع کے کردار'
      description: 'ایک شکل کبھی بھی اوپر کی اسکیل کو نہیں پڑھتی: یہ اس کردار کو پڑھتی ہے جو یہ ادا کرتی ہے، اور اسکن بتاتی ہے کہ اس کردار کو کون سا مرحلہ ملتا ہے — کبھی یہ نہیں کہ ایک مرحلے کی قیمت کیا ہے، جو کہ اسکیل کو ایک ساتھ دو معنی دیتا۔ جو کچھ بھی پکڑتا ہے وہ ایک باکس ہے، چاہے وہ متن، مواد یا ایک پیغام ہو؛ جو دو علاقوں کو صفحے میں الگ کرتا ہے وہ نہ تو ہے، اور نہ ہی کچھ گول کرتا ہے۔ اسکن کو `نرم` پر سوئچ کریں اور ایک کنٹرول کو باقی سے الگ ہوتے دیکھیں: ایک کیپسول کسی چیز کے لیے صحیح ہے جو ایک لائن اونچی ہے اور ایک ٹیکسٹ ایریا کے لیے بے وقوف ہے۔'
    shadow:
      title: سائے
      description: 'چار گہرائیاں، ایک ہیر لائن لفٹ سے ایک تیرتے پینل تک۔ ایک اسکن جو ایک پھلی دنیا چاہتی ہے، تمام چار کو کچھ نہیں پر سیٹ کرتی ہے اور ہر اٹھائی ہوئی سطح اس کی پیروی کرتی ہے۔'
    border:
      title: بارڈر
      description: 'لائن خود — اس کی چوڑائی اور اس کا انداز۔ اس کا رنگ یہاں نہیں ہے: یہ رنگ سکیم کا حصہ ہے، جو ایک اسکن کو ایک لائن ہٹانے کی اجازت دیتی ہے بغیر یہ جانے کہ یہ کس رنگ کی ہوتی۔'
    separator:
      title: 'الگ کرنے والے اور علاقے'
      description: 'دو لائنیں جو چیزوں کو الگ کرتی ہیں: ایک چیز کی دو قطاروں کے درمیان، اور صفحے کے دو علاقوں کے درمیان۔ بیس کے قریب شکلیں پہلی کو پڑھتی ہیں، یہی وجہ ہے کہ یہ ایک ٹوکن ہے اور کوئی قاعدہ نہیں۔'
  separator:
    row: 'دوسری قطاروں میں ایک قطار'
    region: 'صفحے کا ایک علاقہ، اسی طرح کی سرحد کے ساتھ'
  role:
    control: 'ایک لائن اونچی، اور دبائی گئی'
    box: 'کچھ پکڑتا ہے'
    media: 'تصاویر اور اعداد و شمار'
    pill: 'جو کیپسول کے طور پر پڑھا جاتا ہے'

vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Giao diện'
  page_icon: 'ph:bold/paint-brush'
  intro: 'Cách mọi thứ được vẽ ra, khi màu sắc và độ dày đã được xác định: các góc cạnh, độ sâu, các đường nét. Những mã này là trục `giao diện` của chủ đề — giao diện mặc định là những gì trang này hiển thị, và một giao diện khác là một tệp khác thiết lập cùng tên, với không có gì thay đổi bên dưới.'
  section:
    radius:
      title: 'Bán kính'
      description: 'Không có, sau đó bốn bước mỗi bước gấp đôi bước bên dưới, sau đó là một hình viên thuốc. Hai bước cách nhau là khoảng cách giống nhau bất kể bạn đứng ở đâu trên thang đo, đó là lý do làm cho nó dễ đọc. Bước đầu tiên hầu như không có một cách cố ý: đó là điều mà một giao diện phẳng muốn khi một góc vuông thực sự đọc như chưa hoàn thành. Bất kỳ hình tròn nào hơn bước cuối cùng đều là một hình dạng muốn trở thành một hình tròn và tự nói như vậy — một hình tròn không phải là quyết định của giao diện.'
    role:
      title: 'Vai trò bán kính'
      description: 'Một hình dạng không bao giờ đọc thang đo ở trên: nó đọc vai trò mà nó đảm nhận, và giao diện cho biết bước nào vai trò đó nhận được — không bao giờ là giá trị của một bước, điều đó sẽ khiến thang đo có hai nghĩa cùng lúc. Điều giữ một cái gì đó lại là một hộp, cho dù nó giữ văn bản, nội dung hay một thông điệp; điều gì tách biệt hai vùng của một trang thì không phải, và không làm tròn gì cả. Chuyển giao diện sang `mềm mại` và xem một phần điều khiển tách rời khỏi phần còn lại: một viên nang là đúng cho cái gì đó cao một dòng và vô lý cho một ô văn bản.'
    shadow:
      title: 'Đổ bóng'
      description: 'Bốn độ sâu, từ một đường kẻ mảnh đến một bảng nổi. Một giao diện muốn một thế giới phẳng đặt cả bốn thành không và mọi bề mặt được nâng lên đều theo đó.'
    border:
      title: 'Đường viền'
      description: 'Đường kẻ chính nó — độ rộng và kiểu dáng của nó. Màu sắc của nó không có ở đây: điều đó thuộc về bảng màu, điều này cho phép một giao diện loại bỏ một đường mà không biết nó sẽ có màu gì.'
    separator:
      title: 'Các dấu phân cách và vùng'
      description: 'Hai đường kẻ phân biệt mọi thứ: giữa hai hàng của một thứ, và giữa hai vùng của một trang. Hai mươi hình dạng đọc đường đầu tiên, đó là lý do tại sao nó là một mã chứ không phải một quy tắc.'
  separator:
    row: 'một hàng trong số khác'
    region: 'một vùng của trang, được viền như vậy'
  role:
    control: 'cao một dòng, và được nhấn'
    box: 'giữ một cái gì đó'
    media: 'hình ảnh và số liệu'
    pill: 'được đọc như một viên nang'

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 皮肤
  page_icon: 'ph:bold/paint-brush'
  intro: '一旦颜色和密度确定，事物是如何绘制的：角落、深度、线条。这些标记是主题的 `皮肤` 轴 - 默认皮肤就是这个页面所展示的，另一个皮肤是另一个文件设置相同的名称，下面没有更改。'
  section:
    radius:
      title: 半径
      description: '无，然后四个步骤，每个是下面一个的两倍，然后是一个药丸。两个步骤之间的距离在比例尺上的任何位置都是相同的，这使得它可读。第一个步骤故意几乎不存在：这是一个平坦皮肤所希望的，当一个真正的直角看起来像未完成的。任何比最后一步更圆的形状都想成为一个圆，并且自己如此表述 - 圆不是一个皮肤决策。'
    role:
      title: 半径角色
      description: '一个形状从不读取上面的比例尺：它读取它所扮演的角色，皮肤说这个角色得到哪个步骤 - 从不说一个步骤的价值，这会使比例尺同时意味着两件事。容纳某物的是一个框，无论它容纳文本、内容还是消息；分隔页面的两个区域的是两者都不是，并且不圆。将皮肤切换到 `软`，观察一个控制部分与其余部分分开：一个胶囊适合一个一行高的东西，对于一个文本区域则显得荒谬。'
    shadow:
      title: 阴影
      description: 四个深度，从发丝提升到浮动面板。一个想要平坦世界的皮肤将所有四个设置为无，每个抬高的表面都跟随。
    border:
      title: 边框
      description: '线本身 - 宽度和样式。它的颜色不在这里：那属于颜色方案，颜色方案让皮肤在不知道它本应是什么颜色的情况下去除一条线。'
    separator:
      title: 分隔符和区域
      description: 告诉事物区分的两条线：在同一事物的两行之间，以及在页面的两个区域之间。二十多个形状读取第一个，这就是为什么它是一个标记而不是规则。
  separator:
    row: 一行中的一行
    region: 页面的一个区域，如此加以边界
  role:
    control: 一行高，并被压缩
    box: 容纳某物
    media: 图片和图形
    pill: 被视为胶囊的东西
