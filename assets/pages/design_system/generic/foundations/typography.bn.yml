~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: টাইপোগ্রাফি
page_icon: 'ph:bold/text-aa'
intro: 'স্কেল একটি ঘনত্ব সিদ্ধান্ত এবং ফেইসগুলো একটি ফন্ট সিদ্ধান্ত: এই পৃষ্ঠা দেখায় যে একটি আকার কীভাবে পড়া হয়, আজ এটি কীভাবে মূল্যায়িত হয় তা নয়। ডিবাগ প্যানেলে ফন্ট অক্ষটি পরিবর্তন করুন এবং নিচের সবকিছু অন্য একটি ফেইসে সেট করা হয়েছে, কোন নিয়ম পরিবর্তন না করে।'
section:
  families:
    title: পরিবার
    description: 'তিনটি, কারণ একটি পৃষ্ঠা যা আলাদা করে: এটি কীভাবে লেখা হয়েছে, এটি কীভাবে শিরোনাম দেওয়া হয়েছে, এবং যা টাইপ করা হয়েছে তা পড়া হবে তা বোঝানো। একটি সেট তিনটির জন্য একই ফেইস দিতে পারে - সিস্টেমটি তাই করে।'
  weights:
    title: ওজন
    description: 'এগুলি কতটা জোরালোভাবে বোঝানো হয়েছে তার নাম, কখনও সংখ্যা দ্বারা নয়। একটি ফেইস যার 500 নেই, এটি যা আছে তার উপর মানচিত্র তৈরি করে, এবং আকারগুলি যা মধ্যমের জন্য অনুরোধ করে তা মধ্যমের জন্য অনুরোধ করতে থাকে।'
  typography:
    title: 'টাইপ স্কেল'
title:
  h1:
    title: 'ডিজাইন সিস্টেম — দুর্দান্ত ইন্টারফেসের জন্য নির্মাণ ব্লক'
    description: 'প্রতি পৃষ্ঠায় একবার ব্যবহার করা হয়। প্রাথমিক প্রসঙ্গ সেট করে। একটি সংক্ষিপ্ত নেতৃত্ব প্যারাগ্রাফের সাথে যুক্ত।'
  h2:
    title: 'টাইপোগ্রাফি শ্রেণীবিভাগ এবং ছন্দ প্রতিষ্ঠা করে'
    description: 'সেকশন-স্তরের শিরোনাম। সম্পর্কিত কন্টেন্ট গ্রুপ করে। সাধারণত শরীরের পাঠ্য বা উপ-সেকশনের পরে আসে।'
  h3:
    title: 'স্থান এবং অনুপাত পাঠযোগ্যতা তৈরি করে'
    description: 'উপ-সেকশন শিরোনাম। একটি সেকশনের মধ্যে একটি কেন্দ্রীয় বিষয় পরিচয় করিয়ে দেয়।'
  h4:
    title: 'রঙ এবং বৈসাদৃশ্য চোখকে গাইড করে'
    description: 'কার্ড শিরোনাম, সাইডবার সেকশন, অথবা ছোট গ্রুপিংয়ের জন্য ব্যবহৃত হয়।'
  h5:
    title: 'ইন্টারঅ্যাকটিভ অবস্থাগুলি স্পষ্ট হতে হবে'
    description: 'লেবেল, মেটাডেটা হেডার, ছোট গ্রুপিং। সূক্ষ্ম কিন্তু শরীরের পাঠ্য থেকে আলাদা।'
  h6:
    title: 'প্রবেশযোগ্যতা একটি বৈশিষ্ট্য, পরবর্তী চিন্তা নয়'
    description: 'সর্বনিম্ন শিরোনাম স্তর। সংরক্ষণশীলভাবে ব্যবহার করুন - ফুটনোট, আইনগত ব্লক, অথবা সহায়ক লেবেলের জন্য।'
sample: 'দ্রুত বাদামী শিয়াল অলস কুকুরের উপর ঝাঁপ দেয় — 0123456789'
