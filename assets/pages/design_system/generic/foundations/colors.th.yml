~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: สี
page_icon: 'ph:bold/palette'
intro: 'ไม่มีชื่อของส่วนประกอบใดที่เป็นสี มันมีชื่อเรียกบทบาท — พื้นผิว, ขอบ, สถานะ — และธีมเป็นผู้กำหนดว่าสิ่งนั้นจะมีลักษณะอย่างไรในแต่ละด้าน เปลี่ยนแผนจากส่วนหัวและดูทุกตัวอย่างด้านล่างเคลื่อนที่โดยที่ไม่มีอันใดถูกกำหนดใหม่เลย'
section:
  surfaces:
    title: พื้นผิว
    description: 'บันไดยกระดับเหนือหน้าเพจ ด้านที่มีแสงจะจัดเรียงตามความสว่าง ด้านที่มืดจะจัดเรียงตามระดับที่ยกขึ้นจากพื้นหลัง — นั่นคือเหตุผลที่ว่าทำไมส่วนประกอบจึงถามถึงระดับและไม่เคยถามถึงสีเทา'
  invert:
    title: กลับระดับ
    description: 'ยี่สิบระดับของสีข้อความที่วางทับพื้นหลัง และเป็นแหล่งที่มาของเกือบทุกขอบ, ข้อความที่ลดเสียงและสถานะเมื่อชี้ไปที่ในระบบ ระดับ 1 แทบไม่เห็นเลย ระดับ 20 คือข้อความเอง'
  semantic:
    title: ครอบครัวเชิงความหมาย
    description: 'ห้าครอบครัว อ่านจากหน้าเพจไปยังข้อความผ่านสี: ระดับ 1 คือสีที่แทบไม่ทำให้หน้าเพจมีสี, ระดับ 17 คือสีที่เต็มรูปแบบ, ระดับ 32 คือสีที่แทบไม่ทำให้ข้อความมีสี ด้านล่างกลางคือพื้นฐาน; ด้านบนคือหมึกซึ่งจะสว่างขึ้นในด้านที่มืดและเข้มขึ้นในด้านที่สว่าง ส่วนประกอบเลือกระดับและไม่ใช่ค่าเฮกซ์ ซึ่งทำให้ข้อความเดียวกันอ่านได้อย่างถูกต้องในทั้งสองด้าน'
  categories:
    title: พาเลตสีประเภท
    description: 'สิบสามสีที่ไม่มีความหมายใดนอกจาก "ไม่ใช่สีที่อยู่ข้างๆ": ชุดของแผนภูมิ, ส่วนของการกระจาย, ระยะของ workflow ตั้งชื่อ ไม่ใช่หมายเลข — แอปเลือก `cat-mint` เพราะมันดูเหมือนมินต์ แต่ละตัวมาพร้อมกับตัวแปรที่สว่างและมืด ซึ่งถูกตั้งอยู่ในทั้งสองด้านเหมือนกับการเติม; หมึกที่เขียนบนการเติมจะมืดลงในที่ที่สีสว่าง ซึ่งหมวดหมู่คือสีไหนเป็นการเลือกของแอป ไม่ใช่ระบบการออกแบบ'
  text:
    title: ข้อความ
    description: 'สามระดับของความสนใจ สิ่งที่กำลังอ่าน, สิ่งที่ทำให้มันมีคุณสมบัติ และสิ่งที่มีอยู่เพียงเมื่อค้นหา'
  borders:
    title: ขอบ
    description: 'สี่น้ำหนัก แยกออกจากกันโดยสิ่งที่มันแยก: สองสิ่งภายในภูมิภาคหนึ่ง, สองภูมิภาคของหน้าเพจ, หรือฟิลด์จากสิ่งที่อยู่เบื้องหลัง'
surface:
  page: 'หน้าเพจเอง และสิ่งที่แสดงระหว่างโซน'
  shell: 'เมนู, ส่วนหัว, ส่วนท้าย'
  zone: พื้นดินที่ภูมิภาคของหน้าเพจตั้งอยู่
  one: ข้อมูลนำเข้าและฟิลด์
  two: 'ปุ่ม, แถบเครื่องมือ'
  three: 'บล็อก, การ์ด, โมดัล'
text:
  default: สิ่งที่กำลังอ่าน
  muted: 'ป้ายชื่อ, ข้อมูลเมตา, ซับไตเติล'
  subtle: ตัวแยกและสถานะว่าง
