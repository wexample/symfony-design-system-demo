intro: 'Cùng một mẫu hai lần, từ trái sang phải và từ phải sang trái. Không có gì ở đây được viết cho phía phải sang trái: mỗi bảng kiểu đều nói về đầu và cuối của một dòng, vì vậy một khối được `dir="rtl"` — hoặc một trang bằng tiếng Ả Rập — tự động phản chiếu. Mũi tên chỉ theo hướng ngược lại, núm của một công tắc di chuyển theo hướng khác, một menu mở về phía cuối, và một email hoặc một đường dẫn tiếp tục đọc từ trái sang phải.'
