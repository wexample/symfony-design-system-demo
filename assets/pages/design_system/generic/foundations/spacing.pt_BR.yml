~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Espaçamento
page_icon: 'ph:bold/ruler'
intro: 'Duas escalas e uma regra. Uma forma nunca escreve um comprimento: ela ocupa um espaço, que é o que mantém dois componentes escritos a um ano de distância de estarem dois pixels fora de ritmo.'
section:
  space:
    title: 'Passos de espaçamento'
    description: 'Nove passos, de uma linha fina a uma margem de página. Espaçamento, lacunas e margens vêm de aqui — um valor entre dois passos é um valor que não foi decidido.'
  size:
    title: Tamanhos
    description: 'As larguras e alturas que uma região recebe: uma coluna, um painel, uma medida de leitura. Maior que um passo de espaçamento e usado pela mesma razão.'
  density:
    title: Densidade
    description: 'A compactação pertence a uma região e não a um widget. Uma barra declarada compacta torna o que ela contém compacto também, porque os tokens que a transportam herdam — nenhum componente abaixo é informado sobre sua posição.'
density:
  roomy: 'Uma barra de ferramentas em sua própria densidade, e os botões que ela contém'
  compact: 'A mesma barra de ferramentas declarada compacta — nada foi dito sobre os botões'
  marker: 'Uma região declarada compacta sem ser uma forma própria'
  action: Criar
  other: Atualizar
