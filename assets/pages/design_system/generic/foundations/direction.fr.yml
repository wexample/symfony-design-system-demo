page_title: Direction
page_icon: 'ph:bold/arrows-left-right'
intro: "Les mêmes échantillons deux fois, de gauche à droite et de droite à gauche. Rien ici n'est écrit pour le côté de droite à gauche : chaque feuille de style parle du début et de la fin d'une ligne, donc un bloc donné `dir=\"rtl\"` — ou une page en arabe — se réfléchit de lui-même. Les flèches pointent dans l'autre sens, le bouton d'un interrupteur se déplace dans l'autre sens, un menu s'ouvre vers la fin, et un e-mail ou un chemin continue de se lire de gauche à droite."
