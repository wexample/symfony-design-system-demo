~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Spaziatura
page_icon: 'ph:bold/ruler'
intro: 'Due scale e una regola. Una forma non scrive mai una lunghezza: consuma un passo, che è ciò che impedisce a due componenti scritti a un anno di distanza di essere due pixel fuori ritmo.'
section:
  space:
    title: 'Passi di spaziatura'
    description: 'Nove passi, da una linea sottile a un margine di pagina. Padding, spazi e margini derivano tutti da qui: un valore tra due passi è un valore che non è stato deciso.'
  size:
    title: Dimensioni
    description: 'Le larghezze e le altezze assegnate a una regione: una colonna, un pannello, una misura di lettura. Più grande di un passo di spaziatura e usato per lo stesso motivo.'
  density:
    title: Densità
    description: "La compattezza appartiene a una regione e non a un widget. Una barra dichiarata compatta rende ciò che contiene compatto anch'esso, perché i token che la trasportano ereditano — nessun componente sottostante viene informato su dove si trova."
density:
  roomy: 'Una barra degli strumenti alla propria densità, e i pulsanti che contiene'
  compact: 'La stessa barra degli strumenti dichiarata compatta — non si è detto nulla sui pulsanti'
  marker: 'Una regione dichiarata compatta senza essere una forma di per sé'
  action: Crea
  other: Aggiorna
