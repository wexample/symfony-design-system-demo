~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Spatiëring
page_icon: 'ph:bold/ruler'
intro: 'Twee schalen en één regel. Een vorm schrijft nooit een lengte: het neemt een stap, wat ervoor zorgt dat twee componenten die een jaar uit elkaar staan, niet twee pixels uit de maat zijn.'
section:
  space:
    title: Ruimtestappen
    description: 'Negen stappen, van een haarlijn tot een paginamarge. Opvulling, openingen en marges komen hier vandaan — een waarde tussen twee stappen is een waarde die nog niet is vastgesteld.'
  size:
    title: Maten
    description: 'De breedtes en hoogtes die aan een gebied zijn gegeven: een kolom, een paneel, een leesmaat. Groter dan een ruimtestap en gebruikt om dezelfde reden.'
  density:
    title: Dichtheid
    description: 'Compactheid behoort tot een gebied en niet tot een widget. Een balk die als compact is verklaard, maakt wat het bevat ook compact, omdat de tokens die het dragen, erven — geen component eronder wordt verteld waar het staat.'
density:
  roomy: 'Een toolbar op zijn eigen dichtheid, en de knoppen die het bevat'
  compact: 'Dezelfde toolbar als compact verklaard — er is niets gezegd over de knoppen'
  marker: 'Een gebied dat als compact is verklaard zonder een eigen vorm te zijn'
  action: Aanmaken
  other: Vernieuwen
