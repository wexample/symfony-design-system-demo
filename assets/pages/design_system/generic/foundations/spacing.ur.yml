~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: فاصلہ
page_icon: 'ph:bold/ruler'
intro: 'دو پیمانے اور ایک قاعدہ۔ ایک شکل کبھی بھی لمبائی نہیں لکھتی: یہ ایک قدم صرف کرتی ہے، جو دو اجزاء کو ایک سال کے فاصلے پر لکھے جانے سے بچاتا ہے اور انہیں دو پکسلز کے تال سے باہر نہیں ہونے دیتا۔'
section:
  space:
    title: 'فاصلہ کے مراحل'
    description: 'نو مراحل، ایک بال کی طرح سے لے کر صفحے کے کنارے تک۔ پیڈنگ، خلا اور مارجن سب یہاں سے آتے ہیں — دو مراحل کے درمیان کی قیمت ایک قیمت ہے جو طے نہیں کی گئی۔'
  size:
    title: سائز
    description: 'ایک علاقے کو دی جانے والی چوڑائیاں اور اونچائیاں: ایک کالم، ایک پینل، ایک پڑھنے کا پیمانہ۔ ایک فاصلہ کے مرحلے سے بڑی اور اسی وجہ سے استعمال کی جاتی ہے۔'
  density:
    title: کثافت
    description: 'کمپیکٹنس ایک علاقے سے تعلق رکھتی ہے اور کسی ویجیٹ سے نہیں۔ ایک بار جو کمپیکٹ قرار دی گئی ہے وہ اس میں موجود چیزوں کو بھی کمپیکٹ بناتی ہے، کیونکہ اسے لے جانے والے ٹوکن وراثت میں ملتے ہیں — نیچے کوئی بھی جزو یہ نہیں بتایا جاتا کہ وہ کہاں کھڑا ہے۔'
density:
  roomy: 'ایک ٹول بار اپنی کثافت پر، اور اس میں موجود بٹن'
  compact: 'اسی ٹول بار کو کمپیکٹ قرار دیا گیا — بٹنوں کے بارے میں کچھ نہیں کہا گیا'
  marker: 'ایک علاقہ جو کمپیکٹ قرار دیا گیا بغیر اپنی شکل کے ہونے کے'
  action: بنائیں
  other: 'تازہ کریں'
