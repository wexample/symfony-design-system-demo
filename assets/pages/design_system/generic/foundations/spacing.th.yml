~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ระยะห่าง
page_icon: 'ph:bold/ruler'
intro: 'สองมาตราส่วนและกฎหนึ่งข้อ รูปร่างไม่เคยกำหนดความยาว: มันใช้ช่วงหนึ่ง ซึ่งเป็นสิ่งที่ทำให้สองส่วนที่เขียนห่างกันหนึ่งปีไม่ออกจากจังหวะกันสองพิกเซล'
section:
  space:
    title: ขั้นตอนการเว้นระยะ
    description: 'เก้าขั้นตอน ตั้งแต่เส้นผมจนถึงขอบหน้ากระดาษ การเว้นระยะ, ช่องว่าง และขอบทั้งหมดมาจากที่นี่ — ค่าระหว่างสองขั้นตอนคือค่าที่ยังไม่ได้ตัดสินใจ'
  size:
    title: ขนาด
    description: 'ความกว้างและความสูงที่กำหนดให้กับพื้นที่: คอลัมน์, แผง, ขนาดการอ่าน ขนาดใหญ่กว่าขั้นตอนการเว้นระยะและใช้เพื่อเหตุผลเดียวกัน'
  density:
    title: ความหนาแน่น
    description: 'ความกระชับเป็นของพื้นที่และไม่ใช่ของวิดเจ็ต แถบที่ประกาศว่ากระชับทำให้สิ่งที่มันถืออยู่มีความกระชับด้วยเช่นกัน เนื่องจากโทเค็นที่ถือมันสืบทอดมา — ไม่มีส่วนประกอบใดที่อยู่ด้านล่างบอกว่ามันอยู่ที่ไหน'
density:
  roomy: 'แถบเครื่องมือที่มีความหนาแน่นของตัวเอง และปุ่มที่มันถืออยู่'
  compact: 'แถบเครื่องมือเดียวกันที่ประกาศว่ากระชับ — ไม่มีการพูดถึงปุ่ม'
  marker: พื้นที่ที่ประกาศว่ากระชับโดยไม่มีรูปร่างของตัวเอง
  action: สร้าง
  other: รีเฟรช
