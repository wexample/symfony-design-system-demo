~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Basisprincipes
page_icon: 'ph:bold/diamonds-four'
intro: "Waar alles wat anders is, op gebaseerd is. Niets op deze pagina's is een component: het zijn de schalen — kleur, spatiëring, type en de huid die ze verbindt — die elke andere sectie leest zonder ze ooit te tonen."
page:
  colors:
    title: Kleuren
    description: 'De oppervlakken waaruit een pagina is opgebouwd, de omgekeerde niveaus waarlangs randen en gedempte tekst worden getekend, en de vijf semantische families. Beide gezichten van het thema, naast elkaar.'
  spacing:
    title: Spatiëring
    description: 'De negen spatiëringsstappen, de maten en het dichtheidspatroon — hoe een gebied zichzelf compact verklaart en wat dat doet met alles wat het vasthoudt.'
  typography:
    title: Typografie
    description: 'De lettertype-schaal en de gewichten, en vervolgens dezelfde schaal die werkt in een pagina met proza.'
  skin:
    title: Huid
    description: 'Hoe dingen worden getekend, met gelijke kleur en dichtheid: de stralen, de schaduwen, de randen en de scheiders. De enige as van het thema die een karakter heeft.'
