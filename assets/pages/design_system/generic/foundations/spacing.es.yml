~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Espaciado
page_icon: 'ph:bold/ruler'
intro: 'Dos escalas y una regla. Una forma nunca escribe una longitud: da un paso, que es lo que evita que dos componentes escritos a un año de distancia estén a dos píxeles de desincronización.'
section:
  space:
    title: 'Pasos de espaciado'
    description: 'Nueve pasos, desde una línea delgada hasta un margen de página. El relleno, los espacios y los márgenes provienen de aquí: un valor entre dos pasos es un valor que no ha sido decidido.'
  size:
    title: Tamaños
    description: 'Los anchos y alturas que se le dan a una región: una columna, un panel, una medida de lectura. Más grandes que un paso de espaciado y utilizados por la misma razón.'
  density:
    title: Densidad
    description: 'La compacidad pertenece a una región y no a un widget. Una barra declarada compacta hace que lo que sostiene también sea compacto, porque los tokens que la transportan heredan: ningún componente debajo se le dice dónde se encuentra.'
density:
  roomy: 'Una barra de herramientas en su propia densidad, y los botones que sostiene'
  compact: 'La misma barra de herramientas declarada compacta — no se dijo nada sobre los botones'
  marker: 'Una región declarada compacta sin ser una forma propia'
  action: Crear
  other: Actualizar
