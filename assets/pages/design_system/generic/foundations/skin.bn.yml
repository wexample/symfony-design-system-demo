~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: স্কিন
page_icon: 'ph:bold/paint-brush'
intro: 'কিভাবে জিনিসগুলো আঁকা হয়, একবার রঙ এবং ঘনত্ব স্থির হলে: কোণগুলো, গভীরতা, রেখাগুলো। এই টোকেনগুলো হল থিমের `স্কিন` অক্ষ — ডিফল্ট স্কিন হল যা এই পৃষ্ঠা দেখায়, এবং অন্য একটি স্কিন হল অন্য একটি ফাইল যা একই নাম সেট করে, নিচে পরিবর্তনের কিছু নেই।'
section:
  radius:
    title: ব্যাসার্ধ
    description: 'কিছুই নেই, তারপর চারটি ধাপ প্রতিটি নিচেরটির দ্বিগুণ, তারপর একটি পিল। দুটি ধাপের মধ্যে দূরত্ব স্কেলে আপনি যেখানে দাঁড়ান সেখানে একই, যা এটিকে পড়ার যোগ্য করে। প্রথম ধাপটি উদ্দেশ্যমূলকভাবে এখানে নেই: এটি হল একটি সমতল স্কিনের চাহিদা যখন একটি সঠিক কোণ অসম্পূর্ণ হিসেবে পড়ে। শেষ ধাপের চেয়ে গোলাকার কিছু গঠন একটি বৃত্ত হওয়ার ইচ্ছা প্রকাশ করে এবং নিজেই তা বলে — একটি বৃত্ত একটি স্কিন সিদ্ধান্ত নয়।'
  role:
    title: 'ব্যাসার্ধের ভূমিকা'
    description: 'একটি গঠন কখনোই উপরের স্কেল পড়ে না: এটি তার ভূমিকা পড়ে, এবং স্কিন বলে যে সেই ভূমিকা কোন ধাপ পায় — কখনোই একটি ধাপের মূল্য নয়, যা স্কেলকে একসাথে দুটি অর্থ দেয়। যা কিছু ধারণ করে তা একটি বাক্স, এটি পাঠ্য, বিষয়বস্তু বা একটি বার্তা ধারণ করে; একটি পৃষ্ঠার দুটি অঞ্চলের মধ্যে যা আলাদা করে তা নয়, এবং কিছুই গোল করে না। স্কিনটি `সফট` এ পরিবর্তন করুন এবং একটি নিয়ন্ত্রণের অংশটি বাকি অংশ থেকে আলাদা হতে দেখুন: একটি ক্যাপসুল এমন কিছু জন্য সঠিক যা একটি লাইন উচ্চ এবং একটি টেক্সট এরিয়ার জন্য অযৌক্তিক।'
  shadow:
    title: ছায়া
    description: 'চারটি গভীরতা, একটি চুলের রেখা উঁচু থেকে একটি ভাসমান প্যানেল। একটি স্কিন যা একটি সমতল বিশ্ব চায় সব চারটি মান শূন্য করে এবং প্রতিটি উঁচু পৃষ্ঠ অনুসরণ করে।'
  border:
    title: সীমান্ত
    description: 'রেখাটি নিজেই — এর প্রস্থ এবং এর শৈলী। এর রঙ এখানে নেই: এটি রঙের স্কিমের অন্তর্গত, যা একটি স্কিনকে একটি রেখা অপসারণ করতে দেয় জানার প্রয়োজন ছাড়াই এটি কোন রঙের হবে।'
  separator:
    title: 'বিভাজক এবং অঞ্চল'
    description: 'দুটি রেখা যা জিনিসগুলো আলাদা করে: একটি জিনিসের দুটি সারির মধ্যে, এবং একটি পৃষ্ঠার দুটি অঞ্চলের মধ্যে। বিশাল আকারের প্রায় বিশাল আকার প্রথমটিকে পড়ে, যা এটি একটি টোকেন এবং একটি নিয়ম নয়।'
separator:
  row: 'অন্যান্যগুলোর মধ্যে একটি সারি'
  region: 'একটি অঞ্চলের পৃষ্ঠা, এইভাবে সীমানা দেওয়া'
