intro: 'Одни и те же примеры дважды, слева направо и справа налево. Ничего не написано для стороны справа налево: каждая таблица стилей говорит о начале и конце строки, поэтому блок с `dir="rtl"` — или страница на арабском — зеркалит сама себя. Стрелки указывают в другую сторону, ручка переключателя движется в другую сторону, меню открывается к концу, а электронное письмо или путь продолжают читаться слева направо.'
