en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Foundations
  document_title: "Colours, spacing and typography — Design system"
  page_description: "The foundations of a design system: the colour, spacing and type scales and the skin every component is drawn from, in light and dark, shown live."
  page_icon: ph:bold/diamonds-four

  lead: >
    A design system is the shared set of rules and pieces an interface is built
    from: colours, spacing, type, buttons, forms, tables, each defined once and
    used everywhere, so that every page looks and behaves the same.

  intro: "What everything else is spent from. Nothing on these pages is a component: they are the scales — colour, spacing, type, and the skin that draws them — that every other section reads without ever showing them."

  page:
    colors:
      title: Colours
      description: "The surfaces a page is stacked from, the invert levels borders and muted text are drawn with, and the five semantic families. Both faces of the theme, side by side."
    spacing:
      title: Spacing
      description: "The nine spacing steps, the sizes, and the density pattern — how a region declares itself compact and what that does to everything it holds."
    typography:
      title: Typography
      description: "The type scale and the weights, then the same scale at work in a page of prose."
    skin:
      title: Skin
      description: "How things are drawn, at equal colour and density: the radii, the shadows, the borders and the separators. The one axis of the theme that has a character."

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: الأساسيات
  document_title: 'الألوان والمسافات والطباعة — نظام التصميم'
  page_description: 'أسس نظام التصميم: مقاييس الألوان والمسافات والخطوط والمظهر الذي تُرسم منه كل المكونات، بالوضعين الفاتح والداكن، معروضة مباشرة.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    نظام التصميم هو مجموعة القواعد والعناصر المشتركة التي يُبنى منها الواجهة: الألوان، المسافات، الخطوط، الأزرار، النماذج، الجداول، كل منها يتم تعريفه مرة واحدة ويُستخدم في كل مكان، بحيث تبدو كل صفحة وتتصرف بنفس الطريقة.
  intro: 'ما تُصرف منه كل الأشياء الأخرى. لا يوجد شيء في هذه الصفحات هو مكون: إنهم الموازين — اللون، والمسافات، والنوع، والجلد الذي يجذبهم — الذي تقرأه كل قسم آخر دون أن تظهرهم أبدا.'
  page:
    colors:
      title: الألوان
      description: 'الأسطح التي تتكون منها الصفحة، مستويات العكس التي تُرسم بها الحدود والنصوص المخففة، والخمس عائلات الدلالية. كلا جانبي السمة، جنبًا إلى جنب.'
    spacing:
      title: المسافات
      description: 'خطوات المسافة التسع، الأحجام، ونمط الكثافة — كيف تعلن منطقة ما عن نفسها بشكل مضغوط وما يفعله ذلك بكل ما تحتويه.'
    typography:
      title: الطباعة
      description: 'مقياس النوع والأوزان، ثم نفس المقياس في العمل في صفحة من النثر.'
    skin:
      title: 'المظهر'
      description: 'كيف تُرسم الأشياء، بلون وكثافة متساويين: الأنصاف، الظلال، الحدود والفواصل. المحور الوحيد للسمة الذي له شخصية.'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ভিত্তি
  document_title: 'রঙ, ফাঁক এবং টাইপোগ্রাফি — ডিজাইন সিস্টেম'
  page_description: 'একটি ডিজাইন সিস্টেমের ভিত্তি: রঙ, স্পেসিং ও টাইপোগ্রাফির স্কেল এবং সেই স্কিন যা থেকে প্রতিটি কম্পোনেন্ট তৈরি, লাইট ও ডার্ক উভয় মোডে, সরাসরি।'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    একটি ডিজাইন সিস্টেম হল শেয়ার করা নিয়ম এবং উপাদানের সেট যার উপর একটি ইন্টারফেস নির্মিত হয়: রং, ফাঁক, টাইপ, বোতাম, ফর্ম, টেবিল, প্রতিটি একবার সংজ্ঞায়িত হয় এবং সর্বত্র ব্যবহার করা হয়, যাতে প্রতিটি পৃষ্ঠা একইভাবে দেখতে এবং আচরণ করতে পারে।
  intro: 'যা সবকিছুর খরচ থেকে আসে। এই পৃষ্ঠাগুলোর মধ্যে কিছুই একটি উপাদান নয়: তারা হল স্কেল — রঙ, ফাঁকা স্থান, টাইপ, এবং ত্বক যা তাদের আকর্ষণ করে — যা প্রতিটি অন্যান্য বিভাগ পড়ে কিন্তু কখনো দেখায় না।'
  page:
    colors:
      title: রঙ
      description: 'যা থেকে একটি পৃষ্ঠা স্তূপাকার হয়, বিপরীত স্তরের সীমানা এবং মিউটেড টেক্সট আঁকা হয়, এবং পাঁচটি অর্থনৈতিক পরিবার। থিমের উভয় দিক, পাশাপাশি।'
    spacing:
      title: 'ফাঁকা স্থান'
      description: 'নয়টি ফাঁকা স্থান পদক্ষেপ, আকার এবং ঘনত্বের প্যাটার্ন — কিভাবে একটি এলাকা নিজেকে সংকীর্ণ ঘোষণা করে এবং এটি যা কিছু ধারণ করে তার ওপর কী প্রভাব ফেলে।'
    typography:
      title: টাইপোগ্রাফি
      description: 'টাইপ স্কেল এবং ওজন, তারপর একই স্কেল একটি প্রবন্ধের পাতায় কাজ করে।'
    skin:
      title: 'স্কিন'
      description: 'কিভাবে বিষয়গুলো আঁকা হয়, সমান রঙ এবং ঘনত্বে: রেডিয়াস, ছায়া, সীমানা এবং আলাদা করার উপাদান। থিমের একমাত্র অক্ষ যেটির একটি চরিত্র আছে।'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Grundlagen
  document_title: 'Farben, Abstände und Typografie — Designsystem'
  page_description: 'Die Grundlagen eines Designsystems: die Farb-, Abstands- und Schriftskalen und der Skin, aus denen jede Komponente gezeichnet wird, hell und dunkel, live.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    Ein Designsystem ist der gemeinsame Satz von Regeln und Elementen, aus denen eine Benutzeroberfläche aufgebaut ist: Farben, Abstände, Schriftarten, Schaltflächen, Formulare, Tabellen, die einmal definiert und überall verwendet werden, damit jede Seite gleich aussieht und sich gleich verhält.
  intro: 'Woraus alles andere besteht. Nichts auf diesen Seiten ist ein Element: Sie sind die Maßstäbe — Farbe, Abstände, Typografie und die Haut, die sie verbindet — die jede andere Sektion liest, ohne sie jemals zu zeigen.'
  page:
    colors:
      title: Farben
      description: 'Die Flächen, aus denen eine Seite aufgebaut ist, die invertierten Ebenen, mit denen Ränder und gedämpfter Text gezeichnet werden, und die fünf semantischen Familien. Beide Seiten des Themas, nebeneinander.'
    spacing:
      title: Abstände
      description: 'Die neun Abstandsintervalle, die Größen und das Dichte-Muster — wie sich ein Bereich kompakt erklärt und was das mit allem macht, was er enthält.'
    typography:
      title: Typografie
      description: 'Die Schriftgröße und die Gewichtungen, dann die gleiche Skala in einem Prosa-Text.'
    skin:
      title: 'Skin'
      description: 'Wie Dinge gezeichnet werden, bei gleicher Farbe und Dichte: die Radien, die Schatten, die Ränder und die Trennlinien. Die eine Achse des Themas, die Charakter hat.'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Fundamentos
  document_title: 'Colores, espaciado y tipografía — Sistema de diseño'
  page_description: 'Los fundamentos de un sistema de diseño: las escalas de color, espaciado y tipografía y la apariencia de la que parte cada componente, en claro y oscuro, en vivo.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    Un sistema de diseño es el conjunto compartido de reglas y elementos a partir de los cuales se construye una interfaz: colores, espaciado, tipografía, botones, formularios, tablas, cada uno definido una vez y utilizado en todas partes, para que cada página se vea y se comporte de la misma manera.
  intro: 'De lo que se gasta todo lo demás. Nada en estas páginas es un componente: son las escalas —color, espaciado, tipo y la piel que los atrae— que cada otra sección lee sin mostrarlas nunca.'
  page:
    colors:
      title: Colores
      description: 'Las superficies de las que se apila una página, los niveles invertidos de los bordes y el texto atenuado se dibujan con, y las cinco familias semánticas. Ambas caras del tema, lado a lado.'
    spacing:
      title: Espaciado
      description: 'Los nueve pasos de espaciado, los tamaños y el patrón de densidad —cómo una región se declara compacta y lo que eso hace a todo lo que contiene.'
    typography:
      title: Tipografía
      description: 'La escala tipográfica y los pesos, luego la misma escala en acción en una página de prosa.'
    skin:
      title: 'Apariencia'
      description: 'Cómo se dibujan las cosas, con igual color y densidad: los radios, las sombras, los bordes y los separadores. El único eje del tema que tiene un carácter.'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: بنیادها
  document_title: 'رنگ‌ها، فاصله‌ها و تایپوگرافی — سیستم طراحی'
  page_description: 'پایه‌های یک سیستم طراحی: مقیاس‌های رنگ، فاصله‌گذاری و تایپوگرافی و پوسته‌ای که هر کامپوننت از آن ساخته می‌شود، در حالت روشن و تیره، به‌صورت زنده.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    یک سیستم طراحی مجموعه‌ای از قواعد و اجزای مشترک است که یک رابط کاربری از آن ساخته می‌شود: رنگ‌ها، فاصله‌ها، نوع نوشته، دکمه‌ها، فرم‌ها، جداول، که هر کدام یک بار تعریف شده و در همه جا استفاده می‌شوند، به طوری که هر صفحه به یک شکل به نظر برسد و رفتار کند.
  intro: 'چیزی که بقیه از آن خرج می‌شود. هیچ‌یک از این صفحات یک جزء نیستند: آن‌ها مقیاس‌ها هستند — رنگ، فاصله، نوع و پوستی که آن‌ها را جذب می‌کند — که هر بخش دیگری بدون اینکه هرگز آن‌ها را نشان دهد، می‌خواند.'
  page:
    colors:
      title: رنگ‌ها
      description: 'سطوحی که یک صفحه از آن‌ها انباشته می‌شود، سطوح معکوس که مرزها و متن‌های کمرنگ با آن‌ها کشیده می‌شوند، و پنج خانواده معنایی. هر دو وجه تم، در کنار هم.'
    spacing:
      title: فاصله
      description: 'نه مرحله فاصله، اندازه‌ها، و الگوی چگالی — اینکه یک منطقه چگونه خود را فشرده اعلام می‌کند و این چه تاثیری بر روی هر چیزی که در آن نگه داشته می‌شود دارد.'
    typography:
      title: تایپوگرافی
      description: 'مقیاس نوع و وزن‌ها، سپس همان مقیاس در کار در یک صفحه نثر.'
    skin:
      title: 'پوسته'
      description: 'چگونه چیزها با رنگ و چگالی یکسان کشیده می‌شوند: شعاع‌ها، سایه‌ها، مرزها و جداکننده‌ها. محور واحد تم که یک شخصیت دارد.'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Perustat
  document_title: 'Värit, väli ja typografia — Suunnittelujärjestelmä'
  page_description: 'Design systemin perusta: väri-, väli- ja typografiaskaalat sekä skin, joista jokainen komponentti piirretään, vaaleana ja tummana, livenä.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    Suunnittelujärjestelmä on jaettu sääntöjen ja osien kokonaisuus, josta käyttöliittymä rakennetaan: värit, väli, tyyppi, painikkeet, lomakkeet, taulukot, jokainen määritelty kerran ja käytetty kaikkialla, jotta jokainen sivu näyttää ja käyttäytyy samalla tavalla.
  intro: 'Mistä kaikki muu koostuu. Mikään näistä sivuista ei ole komponentti: ne ovat mittakaavat — väri, etäisyys, tyyppi ja iho, joka yhdistää ne — joita jokainen muu osio lukee koskaan näyttämättä niitä.'
  page:
    colors:
      title: Värit
      description: 'Pinnat, joista sivu on koottu, käänteiset tasot, rajat ja vaimennetut tekstit, sekä viisi semanttista perhettä. Teeman molemmat puolet, vierekkäin.'
    spacing:
      title: Etäisyys
      description: 'Yhdeksän etäisyysaskelta, koot ja tiheysmalli — kuinka alue ilmoittaa itsensä kompaktiksi ja mitä se tekee kaikelle, mitä se pitää sisällään.'
    typography:
      title: Typografia
      description: 'Kirjasinkoko ja painot, sitten sama skaala toiminnassa proosatekstissä.'
    skin:
      title: 'Ulkoasu'
      description: 'Kuinka asiat piirtyvät, saman värin ja tiheyden mukaan: säteet, varjot, reunat ja erotinviivat. Teeman yksi akseli, jolla on luonteenpiirteitä.'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Fondations
  document_title: 'Couleurs, espacement et typographie — Design system'
  page_description: "Les fondations d'un design system : les échelles de couleurs, d'espacement et de typographie, et le skin dont chaque composant est tiré, en clair et en sombre, en direct."
  page_icon: 'ph:bold/diamonds-four'
  lead: "Un design system est l'ensemble commun de règles et d'éléments à partir desquels une interface est construite : couleurs, espacements, typographie, boutons, formulaires, tableaux, chacun défini une fois et utilisé partout, de sorte que chaque page ait le même aspect et le même comportement.\n"
  intro: "Ce dont tout le reste est dépensé. Rien sur ces pages n'est un composant : ce sont les échelles — couleur, espacement, type, et la peau qui les attire — que chaque autre section lit sans jamais les montrer."
  page:
    colors:
      title: Couleurs
      description: 'Les surfaces à partir desquelles une page est empilée, les niveaux inversés des bordures et du texte atténué sont dessinés, et les cinq familles sémantiques. Les deux faces du thème, côte à côte.'
    spacing:
      title: Espacement
      description: "Les neuf étapes d'espacement, les tailles, et le motif de densité — comment une région se déclare compacte et ce que cela fait à tout ce qu'elle contient."
    typography:
      title: Typographie
      description: "L'échelle de type et les poids, puis la même échelle à l'œuvre dans une page de prose."
    skin:
      title: 'Habillage'
      description: "Comment les choses sont dessinées, à couleur et densité égales : les rayons, les ombres, les bordures et les séparateurs. L'unique axe du thème qui a un caractère."

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: יסודות
  document_title: 'צבעים, רווחים וטיפוגרפיה — מערכת עיצוב'
  page_description: 'יסודות של מערכת עיצוב: סקאלות הצבע, הריווח והטיפוגרפיה והמראה שמהם נבנה כל רכיב, בבהיר ובכהה, בהצגה חיה.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    מערכת עיצוב היא קבוצת כללים וחלקים משותפת שממנה בונים ממשק: צבעים, רווחים, טיפוגרפיה, כפתורים, טפסים, טבלאות, כל אחד מהם מוגדר פעם אחת ומשמש בכל מקום, כך שכל עמוד נראה ומתנהג אותו דבר.
  intro: 'מה שממנו נבלות כל השאר. שום דבר בדפים האלה אינו רכיב: הם הסקאלה — צבע, רווח, סוג, והעור שמושך אותם — שכל חלק אחר קורא בלי להציג אותם.'
  page:
    colors:
      title: צבעים
      description: 'המשטחים שעליהם דף stacked, רמות ההיפוך שמסמנים גבולות וטקסט מעומעם, וחמש המשפחות הסמנטיות. שני הצדדים של התמה, זה לצד זה.'
    spacing:
      title: רווחים
      description: 'תשעת שלבי הרווח, הגדלים, ודפוס הצפיפות — כיצד אזור מצהיר על עצמו כקומפקטי ומה זה עושה לכל מה שהוא מחזיק.'
    typography:
      title: טיפוגרפיה
      description: 'סקאלת הסוגים והמשקלים, אז אותה סקאלה פועלת בדף של פרוזה.'
    skin:
      title: 'ערכת עיצוב'
      description: 'כיצד הדברים מצויירים, בצבע ובצפיפות שווים: הרדיוסים, הצללים, הגבולות והמפרידים. הציר היחיד של התמה שיש לו אופי.'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: फाउंडेशन्स
  document_title: 'रंग, स्पेसिंग और टाइपोग्राफी — डिज़ाइन सिस्टम'
  page_description: 'डिज़ाइन सिस्टम की नींव: रंग, स्पेसिंग और टाइपोग्राफ़ी के पैमाने और वह स्किन जिससे हर कंपोनेंट बनता है, लाइट और डार्क दोनों में, लाइव।'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    एक डिज़ाइन सिस्टम नियमों और तत्वों का साझा सेट है, जिसके आधार पर एक इंटरफ़ेस बनाया जाता है: रंग, स्पेसिंग, टाइप, बटन, फॉर्म, टेबल, प्रत्येक को एक बार परिभाषित किया जाता है और हर जगह इस्तेमाल किया जाता है, ताकि हर पृष्ठ एक जैसा दिखे और व्यवहार करे।
  intro: 'यह वह सब कुछ है जिससे बाकी सब खर्च होता है। इन पन्नों पर कुछ भी एक घटक नहीं है: ये वे पैमाने हैं - रंग, स्थान, प्रकार, और वह त्वचा जो उन्हें आकर्षित करती है - जो हर दूसरे सेक्शन बिना दिखाए पढ़ता है।'
  page:
    colors:
      title: रंग
      description: 'सतहें जिनसे एक पृष्ठ बना होता है, उलट स्तर की सीमाएँ और म्यूटेड टेक्स्ट के साथ बनाए जाते हैं, और पांच अर्थपूर्ण परिवार। थीम के दोनों चेहरे, एक साथ।'
    spacing:
      title: स्पेसिंग
      description: 'नौ स्पेसिंग स्टेप्स, आकार, और घनत्व पैटर्न - कैसे एक क्षेत्र अपने आप को कॉम्पैक्ट घोषित करता है और यह उसके भीतर जो कुछ भी है उसे क्या करता है।'
    typography:
      title: टाइपोग्राफी
      description: 'टाइप स्केल और वजन, फिर उसी स्केल का काम एक प्रोज़ पृष्ठ में।'
    skin:
      title: 'स्किन'
      description: 'कैसे चीजें खींची जाती हैं, समान रंग और घनत्व पर: रेडियाई, छायाएँ, सीमाएँ और विभाजक। थीम का वह एक अक्ष जो एक चरित्र रखता है।'

id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Fondasi
  document_title: 'Warna, jarak, dan tipografi — Sistem desain'
  page_description: 'Fondasi sebuah design system: skala warna, jarak, dan tipografi serta skin yang menjadi dasar setiap komponen, dalam mode terang dan gelap, secara langsung.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    Sistem desain adalah seperangkat aturan dan elemen yang digunakan untuk membangun antarmuka: warna, jarak, tipe, tombol, formulir, tabel, yang masing-masing didefinisikan sekali dan digunakan di mana-mana, sehingga setiap halaman terlihat dan berfungsi dengan cara yang sama.
  intro: 'Apa yang menjadi dasar semua lainnya. Tidak ada yang ada di halaman ini merupakan komponen: mereka adalah skala — warna, jarak, tipe, dan kulit yang menggambarkannya — yang dibaca oleh setiap bagian lain tanpa pernah menampilkannya.'
  page:
    colors:
      title: Warna
      description: 'Permukaan dari mana halaman disusun, tingkat invers, batas dan teks yang redup digambar, serta lima keluarga semantik. Kedua sisi tema, berdampingan.'
    spacing:
      title: Jarak
      description: 'Sembilan langkah jarak, ukuran, dan pola kepadatan — bagaimana suatu area menyatakan dirinya kompak dan apa dampaknya terhadap segala yang dipegangnya.'
    typography:
      title: Tipografi
      description: 'Skala tipe dan bobot, lalu skala yang sama bekerja dalam halaman prosa.'
    skin:
      title: 'Tampilan'
      description: 'Bagaimana hal-hal digambar, dengan warna dan kepadatan yang sama: jari-jari, bayangan, batas, dan pemisah. Satu sumbu tema yang memiliki karakter.'

it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Fondamenti
  document_title: 'Colori, spaziature e tipografia — Sistema di design'
  page_description: 'Le fondamenta di un design system: le scale di colore, spaziatura e tipografia e la skin da cui nasce ogni componente, in chiaro e scuro, dal vivo.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    Un sistema di design è il insieme condiviso di regole e componenti da cui è costruita un'interfaccia: colori, spaziatura, tipografia, pulsanti, moduli, tabelle, ognuno definito una sola volta e utilizzato ovunque, in modo che ogni pagina appaia e si comporti allo stesso modo.
  intro: 'Da cui è speso tutto il resto. Nulla in queste pagine è un componente: sono le scale — colore, spaziatura, tipografia e la pelle che li unisce — che ogni altra sezione legge senza mai mostrarle.'
  page:
    colors:
      title: Colori
      description: 'Le superfici da cui è composta una pagina, i livelli di inversione, i bordi e il testo attenuato sono tracciati, e le cinque famiglie semantiche. Entrambi i volti del tema, affiancati.'
    spacing:
      title: Spaziatura
      description: 'I nove passaggi di spaziatura, le dimensioni e il modello di densità — come una regione si dichiara compatta e cosa questo comporta per tutto ciò che contiene.'
    typography:
      title: Tipografia
      description: 'La scala dei caratteri e i pesi, poi la stessa scala applicata in una pagina di prosa.'
    skin:
      title: 'Aspetto'
      description: "Come vengono tracciate le cose, con colore e densità uguali: i raggi, le ombre, i bordi e i separatori. L'unico asse del tema che ha un carattere."

ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 基本
  document_title: 'カラー、スペーシング、タイポグラフィ — デザインシステム'
  page_description: デザインシステムの基礎：すべてのコンポーネントの元となる色・余白・タイポグラフィのスケールとスキンを、ライトとダークの両方で実際に表示。
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    デザインシステムとは、インターフェースが構築されるための共有されたルールと要素のセットです：色、スペーシング、フォント、ボタン、フォーム、テーブルなど、各要素は一度定義され、どこでも使用されるため、すべてのページが同じように見え、同じように動作します。
  intro: 'すべての要素の基盤。これらのページにあるものはコンポーネントではなく、すべてのセクションがそれを表示することなく読み取るスケール — 色、間隔、タイプ、そしてそれらを引き寄せるスキンです。'
  page:
    colors:
      title: 色
      description: 'ページが積み重なっている表面、反転レベルの境界線や muted テキストが描かれるもので、5つの意味論的ファミリーがあります。テーマの両面が並んでいます。'
    spacing:
      title: 間隔
      description: '9つの間隔ステップ、サイズ、密度パターン — どのように領域がコンパクトであることを宣言し、それが保持するすべてのものに何をもたらすか。'
    typography:
      title: タイポグラフィ
      description: タイポグラフィスケールとウェイト、そしてそのスケールがプローズのページでどのように機能するか。
    skin:
      title: スキン
      description: 物事がどのように描かれるか、同じ色と密度で：半径、影、境界線、セパレーター。テーマの中でキャラクターを持つ唯一の軸です。

ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 기초
  document_title: '색상, 간격 및 타이포그래피 — 디자인 시스템'
  page_description: '디자인 시스템의 기초: 모든 컴포넌트가 바탕으로 삼는 색상, 간격, 타이포그래피 스케일과 스킨을 라이트와 다크 모드에서 실시간으로.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    디자인 시스템은 인터페이스가 구축되는 공유된 규칙과 구성 요소의 집합입니다: 색상, 간격, 글꼴, 버튼, 양식, 테이블 등, 각 요소는 한 번 정의되고 어디에서나 사용되어 모든 페이지가 동일하게 보이고 작동하도록 합니다.
  intro: '모든 것이 여기에 기반합니다. 이 페이지의 내용은 구성 요소가 아니라 모든 다른 섹션이 보이지 않게 읽는 색상, 간격, 타이포그래피 및 이들을 끌어들이는 외관입니다.'
  page:
    colors:
      title: 색상
      description: '페이지가 쌓여 있는 표면, 반전 수준의 경계와 muted 텍스트가 그려지는 방식, 그리고 다섯 가지 의미적 가족. 테마의 양면이 나란히 있습니다.'
    spacing:
      title: 간격
      description: '아홉 개의 간격 단계, 크기, 그리고 밀도 패턴 — 한 영역이 스스로를 컴팩트하게 선언하는 방법과 그것이 담고 있는 모든 것에 미치는 영향입니다.'
    typography:
      title: 타이포그래피
      description: '타입 스케일과 무게, 그리고 같은 스케일이 프로즈 페이지에서 작용하는 방식입니다.'
    skin:
      title: '스킨'
      description: '사물들이 동일한 색상과 밀도로 그려지는 방식: 반지름, 그림자, 경계 및 구분선. 테마의 특성을 가진 유일한 축입니다.'

nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Basisprincipes
  document_title: 'Kleuren, ruimte en typografie — Ontwerp systeem'
  page_description: 'De fundamenten van een designsysteem: de schalen voor kleur, witruimte en typografie en de skin waaruit elk component wordt getekend, licht en donker, live.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    Een ontwerpsysteem is de gedeelde set regels en elementen waaruit een interface is opgebouwd: kleuren, ruimtes, typografie, knoppen, formulieren, tabellen, elk één keer gedefinieerd en overal gebruikt, zodat elke pagina er hetzelfde uitziet en zich hetzelfde gedraagt.
  intro: "Waar alles wat anders is, op gebaseerd is. Niets op deze pagina's is een component: het zijn de schalen — kleur, spatiëring, type en de huid die ze verbindt — die elke andere sectie leest zonder ze ooit te tonen."
  page:
    colors:
      title: Kleuren
      description: 'De oppervlakken waaruit een pagina is opgebouwd, de omgekeerde niveaus waarlangs randen en gedempte tekst worden getekend, en de vijf semantische families. Beide gezichten van het thema, naast elkaar.'
    spacing:
      title: Spatiëring
      description: 'De negen spatiëringsstappen, de maten en het dichtheidspatroon — hoe een gebied zichzelf compact verklaart en wat dat doet met alles wat het vasthoudt.'
    typography:
      title: Typografie
      description: 'De lettertype-schaal en de gewichten, en vervolgens dezelfde schaal die werkt in een pagina met proza.'
    skin:
      title: 'Skin'
      description: 'Hoe dingen worden getekend, met gelijke kleur en dichtheid: de stralen, de schaduwen, de randen en de scheiders. De enige as van het thema die een karakter heeft.'

pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Fundamenty
  document_title: 'Kolory, odstępy i typografia — System projektowy'
  page_description: 'Fundamenty design systemu: skale kolorów, odstępów i typografii oraz skórka, z których rysowany jest każdy komponent, w trybie jasnym i ciemnym, na żywo.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    System projektowania to wspólny zestaw zasad i elementów, z których zbudowany jest interfejs: kolory, odstępy, czcionki, przyciski, formularze, tabele, każdy zdefiniowany raz i używany wszędzie, aby każda strona wyglądała i działała tak samo.
  intro: 'Z czego wszystko inne jest wydawane. Nic na tych stronach nie jest komponentem: to są skale — kolor, odstępy, typografia i skóra, która je przyciąga — które każda inna sekcja odczytuje, nigdy ich nie pokazując.'
  page:
    colors:
      title: Kolory
      description: 'Powierzchnie, z których zbudowana jest strona, poziomy inwersji, granice i stonowany tekst, a także pięć rodzin semantycznych. Obie strony motywu, obok siebie.'
    spacing:
      title: Odstępy
      description: 'Dziewięć kroków odstępów, rozmiary i wzór gęstości — jak obszar ogłasza się kompaktowym i co to robi z wszystkim, co zawiera.'
    typography:
      title: Typografia
      description: 'Skala typograficzna i wagi, a następnie ta sama skala w pracy na stronie prozy.'
    skin:
      title: 'Skórka'
      description: 'Jak rzeczy są rysowane, w równym kolorze i gęstości: promienie, cienie, granice i separatory. Jedna oś motywu, która ma charakter.'

pt_BR:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Fundamentos
  document_title: 'Cores, espaçamentos e tipografia — Sistema de design'
  page_description: 'Os fundamentos de um design system: as escalas de cor, espaçamento e tipografia e a aparência de que cada componente parte, no claro e no escuro, ao vivo.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    Um sistema de design é o conjunto compartilhado de regras e elementos do qual uma interface é construída: cores, espaçamento, tipografia, botões, formulários, tabelas, cada um definido uma vez e usado em toda parte, para que cada página tenha a mesma aparência e comportamento.
  intro: 'O que tudo mais é gasto. Nada nestas páginas é um componente: elas são as escalas — cor, espaçamento, tipografia e a aparência que as conecta — que cada outra seção lê sem nunca mostrá-las.'
  page:
    colors:
      title: Cores
      description: 'As superfícies de que uma página é composta, os níveis de inversão, as bordas e o texto suavizado são desenhados, e as cinco famílias semânticas. Ambos os lados do tema, lado a lado.'
    spacing:
      title: Espaçamento
      description: 'Os nove passos de espaçamento, os tamanhos e o padrão de densidade — como uma região se declara compacta e o que isso faz com tudo que abriga.'
    typography:
      title: Tipografia
      description: 'A escala de tipografia e os pesos, depois a mesma escala em ação em uma página de prosa.'
    skin:
      title: Aparência
      description: 'Como as coisas são desenhadas, com igual cor e densidade: os raios, as sombras, as bordas e os separadores. O único eixo do tema que tem um caráter.'

ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Основы
  document_title: 'Цвета, отступы и типографика — Дизайн-система'
  page_description: 'Основа дизайн-системы: шкалы цвета, отступов и типографики и скин, из которых строится каждый компонент, в светлой и тёмной теме, вживую.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    Система дизайна — это общий набор правил и элементов, из которых построен интерфейс: цвета, отступы, шрифты, кнопки, формы, таблицы, каждый из которых определяется один раз и используется повсеместно, чтобы каждая страница выглядела и работала одинаково.
  intro: 'Из чего всё остальное строится. Ничто на этих страницах не является компонентом: это шкалы — цвет, интервал, шрифт и оболочка, которая их соединяет — которые считываются каждым другим разделом, не показывая себя.'
  page:
    colors:
      title: Цвета
      description: 'Поверхности, из которых состоит страница, уровни инверсии, с помощью которых рисуются границы и приглушённый текст, а также пять семантических семейств. Обе стороны темы, рядом друг с другом.'
    spacing:
      title: Интервалы
      description: 'Девять шагов интервалов, размеры и плотностный шаблон — как область заявляет о своей компактности и что это делает со всем, что она содержит.'
    typography:
      title: Типографика
      description: 'Шкала шрифтов и их веса, а затем та же шкала в работе на странице с прозой.'
    skin:
      title: 'Скин'
      description: 'Как вещи рисуются, с одинаковым цветом и плотностью: радиусы, тени, границы и разделители. Ось темы, которая имеет характер.'

th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: พื้นฐาน
  document_title: 'สี การเว้นระยะ และตัวอักษร — ระบบการออกแบบ'
  page_description: 'รากฐานของดีไซน์ซิสเต็ม: สเกลสี ระยะห่าง และตัวอักษร รวมถึงสกินที่ทุกคอมโพเนนต์ใช้ ทั้งโหมดสว่างและมืด แสดงแบบสด'
  page_icon: 'ph:bold/diamonds-four'
  lead: 'ระบบการออกแบบคือชุดกฎและชิ้นส่วนที่ใช้ร่วมกันซึ่งอินเทอร์เฟซถูกสร้างขึ้นจาก: สี, การเว้นระยะ, ตัวอักษร, ปุ่ม, แบบฟอร์ม, ตาราง, ซึ่งแต่ละรายการถูกกำหนดไว้เพียงครั้งเดียวและใช้ในทุกที่ เพื่อให้ทุกหน้าดูเหมือนและทำงานเหมือนกัน.'
  intro: 'สิ่งที่ทุกอย่างอื่นใช้จ่ายจาก ที่นี่ไม่มีอะไรเป็นส่วนประกอบ: มันคือมาตราส่วน — สี, การเว้นระยะ, ตัวอักษร, และพื้นผิวที่ดึงดูดพวกเขา — ที่แต่ละส่วนอื่นอ่านโดยไม่เคยแสดงพวกเขา'
  page:
    colors:
      title: สี
      description: 'พื้นผิวที่หน้าหนึ่งสร้างจาก ระดับการกลับด้านที่ขอบและข้อความที่จางลงถูกสร้างขึ้น และห้าครอบครัวเชิงความหมาย ทั้งสองด้านของธีมอยู่เคียงข้างกัน'
    spacing:
      title: การเว้นระยะ
      description: 'เก้าอันดับการเว้นระยะ ขนาด และรูปแบบความหนา — ว่าพื้นที่หนึ่งประกาศตัวเองให้แน่นและสิ่งนั้นมีผลต่อทุกอย่างที่มันถืออยู่'
    typography:
      title: การพิมพ์
      description: 'มาตราส่วนตัวอักษรและน้ำหนัก จากนั้นมาตราส่วนเดียวกันที่ทำงานในหน้าของข้อความ'
    skin:
      title: 'สกิน'
      description: 'วิธีที่สิ่งต่างๆ ถูกวาดด้วยสีและความหนาเท่ากัน: รัศมี, เงา, ขอบ และตัวแบ่ง มิติเดียวของธีมที่มีเอกลักษณ์'

tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Temeller
  document_title: 'Renkler, boşluklar ve tipografi — Tasarım sistemi'
  page_description: 'Bir tasarım sisteminin temelleri: her bileşenin çizildiği renk, boşluk ve tipografi ölçekleri ile görünüm, açık ve koyu temada, canlı olarak.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    Bir tasarım sistemi, bir arayüzün inşa edildiği paylaşılan kurallar ve bileşenler setidir: renkler, boşluk, yazı tipi, butonlar, formlar, tablolar, her biri bir kez tanımlanır ve her yerde kullanılır, böylece her sayfa aynı görünür ve aynı şekilde davranır.
  intro: 'Diğer her şeyin harcandığı temel. Bu sayfalardaki hiçbir şey bir bileşen değil: her bir bölümün asla göstermeden okuduğu ölçekler - renk, boşluk, yazı tipi ve onları çizen arka plan.'
  page:
    colors:
      title: Renkler
      description: 'Bir sayfanın üst üste bindiği yüzeyler, ters düzeylerdeki kenarların ve soluk metinlerin çizildiği yerler ve beş anlam ailesi. Temanın her iki yüzü, yan yana.'
    spacing:
      title: Boşluk
      description: 'Dokuz boşluk adımı, boyutlar ve yoğunluk deseni - bir bölgenin kendisini nasıl sıkı bir şekilde tanıttığı ve bu durumun içinde barındırdığı her şeye etkisi.'
    typography:
      title: 'Yazı Tipi'
      description: 'Yazı ölçeği ve ağırlıkları, ardından aynı ölçeğin bir düz yazı sayfasında nasıl çalıştığı.'
    skin:
      title: 'Görünüm'
      description: 'Nesnelerin nasıl çizildiği, eşit renk ve yoğunlukta: yarıçaplar, gölgeler, kenar boşlukları ve ayırıcılar. Temanın bir karaktere sahip olan tek ekseni.'

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: بنیاد
  document_title: 'رنگ، فاصلہ اور نوع ٹائپ — ڈیزائن سسٹم'
  page_description: 'ڈیزائن سسٹم کی بنیادیں: رنگ، فاصلے اور ٹائپوگرافی کے پیمانے اور وہ اسکن جس سے ہر جزو بنتا ہے، لائٹ اور ڈارک دونوں میں، براہِ راست۔'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    ایک ڈیزائن سسٹم وہ مشترکہ قواعد اور اجزاء ہیں جن سے ایک انٹرفیس بنایا جاتا ہے: رنگ، فاصلہ، قسم، بٹن، فارم، جدول، ہر ایک کو ایک بار متعین کیا جاتا ہے اور ہر جگہ استعمال کیا جاتا ہے، تاکہ ہر صفحہ ایک جیسا نظر آئے اور برتاؤ کرے۔
  intro: 'یہ وہ چیز ہے جس سے باقی سب کچھ خرچ ہوتا ہے۔ ان صفحات پر کچھ بھی ایک جزو نہیں ہے: یہ تراز ہیں — رنگ، جگہ، نوع، اور وہ جلد جو انہیں کھینچتی ہے — کہ ہر دوسرا سیکشن انہیں بغیر دکھائے پڑھتا ہے۔'
  page:
    colors:
      title: رنگ
      description: 'وہ سطحیں جن پر ایک صف stacked ہوتی ہے، الٹ سطحوں کی سرحدیں اور مدھم متن کے ساتھ کھینچی جاتی ہیں، اور پانچ معنوی خاندان۔ تھیم کے دونوں پہلو، پہلو بہ پہلو۔'
    spacing:
      title: جگہ
      description: 'نو جگہ کے مراحل، سائز، اور کثافت کا پیٹرن — یہ کہ ایک علاقہ خود کو کس طرح کمپیکٹ قرار دیتا ہے اور اس کے اندر موجود ہر چیز پر اس کا کیا اثر ہوتا ہے۔'
    typography:
      title: 'نوع ٹائپ'
      description: 'قسم کی پیمائش اور وزن، پھر وہی پیمائش ایک نثر کے صفحے میں کام کرتی ہے۔'
    skin:
      title: 'اسکن'
      description: 'چیزیں کس طرح کھینچی جاتی ہیں، برابر رنگ اور کثافت پر: شعاعیں، سائے، سرحدیں اور علیحدگی کرنے والے۔ تھیم کا وہ ایک محور جو ایک کردار رکھتا ہے۔'

vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Nền tảng'
  document_title: 'Màu sắc, khoảng cách và kiểu chữ — Hệ thống thiết kế'
  page_description: 'Nền tảng của một design system: các thang màu, khoảng cách, kiểu chữ và skin mà mọi thành phần dựa vào, ở chế độ sáng và tối, trực tiếp.'
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    Hệ thống thiết kế là bộ quy tắc và thành phần chung mà giao diện được xây dựng từ: màu sắc, khoảng cách, kiểu chữ, nút bấm, biểu mẫu, bảng, mỗi thứ được định nghĩa một lần và sử dụng ở mọi nơi, để mỗi trang đều trông giống nhau và hoạt động giống nhau.
  intro: 'Những gì mọi thứ khác được chi tiêu từ đó. Không có gì trên các trang này là một thành phần: chúng là các tỷ lệ — màu sắc, khoảng cách, kiểu chữ, và lớp mà chúng vẽ ra — mà mọi phần khác đọc mà không bao giờ hiển thị chúng.'
  page:
    colors:
      title: 'Màu sắc'
      description: 'Các bề mặt mà một trang được xếp chồng lên, các mức độ đảo ngược mà các viền và văn bản mờ được vẽ, và năm gia đình ngữ nghĩa. Cả hai mặt của chủ đề, bên cạnh nhau.'
    spacing:
      title: 'Khoảng cách'
      description: 'Chín bước khoảng cách, kích thước, và mẫu độ dày — cách mà một vùng tuyên bố bản thân là gọn gàng và điều đó ảnh hưởng đến mọi thứ mà nó chứa.'
    typography:
      title: 'Kiểu chữ'
      description: 'Thang kiểu chữ và các trọng số, sau đó là cùng một thang đang hoạt động trong một trang văn bản.'
    skin:
      title: 'Giao diện'
      description: 'Cách mà mọi thứ được vẽ, với màu sắc và độ dày bằng nhau: bán kính, bóng, viền và các dấu phân cách. Trục duy nhất của chủ đề có một đặc điểm.'

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 基础
  document_title: '颜色、间距和排版 — 设计系统'
  page_description: 设计系统的基础：所有组件共用的色彩、间距和字体比例以及皮肤，在浅色与深色模式下实时展示。
  page_icon: 'ph:bold/diamonds-four'
  lead: |
    设计系统是一组共享的规则和构件，界面是由这些构件构建而成的：颜色、间距、字体、按钮、表单、表格，每个构件只定义一次并在各处使用，以使每一页看起来和行为一致。
  intro: 一切其他的支出来源。这里的页面没有组件：它们是每个部分所阅读的比例——颜色、间距、字体，以及将它们连接在一起的外观——而这些部分从未展示它们。
  page:
    colors:
      title: 颜色
      description: 页面堆叠的表面，反转水平边框和柔和文本的绘制，以及五个语义家族。主题的两个面，肩并肩。
    spacing:
      title: 间距
      description: 九个间距步骤，大小和密度模式——一个区域如何声明自己紧凑，以及这对它所包含的所有内容的影响。
    typography:
      title: 排版
      description: 字体比例和字重，以及同样的比例在一段散文中的运用。
    skin:
      title: '皮肤'
      description: 事物的绘制方式，以相同的颜色和密度：半径、阴影、边框和分隔符。主题中具有个性的唯一轴线。
