~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: स्पेसिंग
page_icon: 'ph:bold/ruler'
intro: 'दो पैमाने और एक नियम। एक आकृति कभी भी लंबाई नहीं लिखती: यह एक कदम बिताती है, जो दो घटकों को एक वर्ष के अंतर से लिखे जाने से दो पिक्सल के लय से बाहर रखने का काम करती है।'
section:
  space:
    title: 'स्पेसिंग स्टेप्स'
    description: 'नौ कदम, एक बाल रेखा से लेकर एक पृष्ठ मार्जिन तक। पैडिंग, गैप और मार्जिन सभी यहां से आते हैं - दो कदमों के बीच का मान एक ऐसा मान है जो तय नहीं किया गया है।'
  size:
    title: आकार
    description: 'एक क्षेत्र को दिए गए चौड़ाई और ऊंचाई: एक कॉलम, एक पैनल, एक पढ़ने का माप। स्पेसिंग स्टेप से बड़ा और उसी कारण से उपयोग किया जाता है।'
  density:
    title: घनत्व
    description: 'संक्षिप्तता एक क्षेत्र से संबंधित है और किसी विजेट से नहीं। एक बार जो संक्षिप्त घोषित किया गया है, वह जो इसे पकड़े हुए है उसे भी संक्षिप्त बनाता है, क्योंकि इसे ले जाने वाले टोकन विरासत में मिलते हैं - नीचे कोई घटक नहीं बताया गया है कि यह कहां खड़ा है।'
density:
  roomy: 'एक टूलबार अपनी ही घनत्व पर, और जो बटन इसे पकड़ते हैं'
  compact: 'वही टूलबार संक्षिप्त घोषित किया गया - बटन के बारे में कुछ नहीं कहा गया'
  marker: 'एक क्षेत्र जिसे संक्षिप्त घोषित किया गया है बिना अपनी आकृति के'
  action: बनाएं
  other: रीफ्रेश
