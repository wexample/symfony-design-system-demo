~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Peau
page_icon: 'ph:bold/paint-brush'
intro: "Comment les choses sont dessinées, une fois la couleur et la densité établies : les coins, la profondeur, les lignes. Ces jetons sont l'axe de la `peau` du thème — la peau par défaut est ce que cette page montre, et une autre peau est un autre fichier définissant les mêmes noms, sans rien à changer ci-dessous."
section:
  radius:
    title: Rayons
    description: "Aucun, puis quatre étapes chacune deux fois celle d'en dessous, puis une pilule. Deux étapes d'écart représentent la même distance peu importe où vous vous trouvez sur l'échelle, ce qui la rend lisible. La première étape est à peine là exprès : c'est ce qu'une peau plate désire quand un vrai angle droit se lit comme inachevé. Tout ce qui est plus rond que la dernière étape est une forme qui veut être un cercle et le dit elle-même — un cercle n'est pas une décision de peau."
  role:
    title: 'Rôles de rayon'
    description: "Une forme ne lit jamais l'échelle ci-dessus : elle lit le rôle qu'elle joue, et la peau indique quelle étape ce rôle obtient — jamais ce qu'une étape vaut, ce qui ferait que l'échelle signifie deux choses en même temps. Ce qui tient quelque chose est une boîte, qu'elle contienne du texte, du contenu ou un message ; ce qui sépare deux régions d'une page n'est ni l'un ni l'autre, et ne rond rien. Changez la peau en `doux` et regardez un contrôle se séparer du reste : une capsule est adéquate pour quelque chose d'une ligne de haut et absurde pour une zone de texte."
  shadow:
    title: Ombres
    description: "Quatre profondeurs, d'un soulèvement de cheveux à un panneau flottant. Une peau qui désire un monde plat définit les quatre à aucun et chaque surface surélevée suit."
  border:
    title: Bordures
    description: "La ligne elle-même — sa largeur et son style. Sa couleur n'est pas ici : cela appartient au schéma de couleurs, qui permet à une peau de retirer une ligne sans savoir quelle couleur elle aurait eue."
  separator:
    title: 'Séparateurs et régions'
    description: "Les deux lignes qui distinguent les choses : entre deux rangées d'une chose, et entre deux régions d'une page. Une vingtaine de formes lisent la première, ce qui est pourquoi c'est un jeton et non une règle."
separator:
  row: "une rangée parmi d'autres"
  region: 'une région de la page, délimitée comme telle'
role:
  control: 'une ligne de haut, et pressée'
  box: 'tient quelque chose'
  media: 'images et figures'
  pill: 'ce qui est lu comme une capsule'
