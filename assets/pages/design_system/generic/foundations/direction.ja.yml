intro: '同じサンプルが2回、左から右、右から左に表示されます。右から左の側に書かれたものは何もありません：すべてのスタイルシートは行の始まりと終わりについて語っているので、`dir="rtl"`が指定されたブロック — またはアラビア語のページ — は自動的に反転します。矢印は逆向きに指し、スイッチのノブは逆に移動し、メニューは終わりの方に開き、メールやパスは左から右に読み続けます。'
