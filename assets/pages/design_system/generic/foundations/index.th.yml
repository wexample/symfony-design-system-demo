~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: พื้นฐาน
page_icon: 'ph:bold/diamonds-four'
intro: 'สิ่งที่ทุกอย่างอื่นใช้จ่ายจาก ที่นี่ไม่มีอะไรเป็นส่วนประกอบ: มันคือมาตราส่วน — สี, การเว้นระยะ, ตัวอักษร, และพื้นผิวที่ดึงดูดพวกเขา — ที่แต่ละส่วนอื่นอ่านโดยไม่เคยแสดงพวกเขา'
page:
  colors:
    title: สี
    description: 'พื้นผิวที่หน้าหนึ่งสร้างจาก ระดับการกลับด้านที่ขอบและข้อความที่จางลงถูกสร้างขึ้น และห้าครอบครัวเชิงความหมาย ทั้งสองด้านของธีมอยู่เคียงข้างกัน'
  spacing:
    title: การเว้นระยะ
    description: 'เก้าอันดับการเว้นระยะ ขนาด และรูปแบบความหนา — ว่าพื้นที่หนึ่งประกาศตัวเองให้แน่นและสิ่งนั้นมีผลต่อทุกอย่างที่มันถืออยู่'
  typography:
    title: การพิมพ์
    description: 'มาตราส่วนตัวอักษรและน้ำหนัก จากนั้นมาตราส่วนเดียวกันที่ทำงานในหน้าของข้อความ'
  skin:
    title: พื้นผิว
    description: 'วิธีที่สิ่งต่างๆ ถูกวาดด้วยสีและความหนาเท่ากัน: รัศมี, เงา, ขอบ และตัวแบ่ง มิติเดียวของธีมที่มีเอกลักษณ์'
