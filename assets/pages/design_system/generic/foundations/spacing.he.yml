page_title: ריווח
page_icon: 'ph:bold/ruler'
intro: 'שתי סקאלות וכלל אחד. צורה אף פעם לא כותבת אורך: היא משקיעה צעד, שהוא מה ששומר על כך ששני רכיבים כתובים שנה אחת זה מזה לא יהיו שני פיקסלים מחוץ לקצב.'
section:
  space:
    title: 'צעדי ריווח'
    description: 'תשעה צעדים, מקו דק ועד שולי עמוד. ריפוד, רווחים ושולים כולם מגיעים מכאן — ערך בין שני צעדים הוא ערך שלא הוחלט עליו.'
  size:
    title: גדלים
    description: 'הרחבים והגובה שניתן לאזור: עמודה, פאנל, מדידת קריאה. גדול יותר מצעד ריווח ונעשה בו שימוש מאותה סיבה.'
  density:
    title: צפיפות
    description: 'קומפקטיות שייכת לאזור ולא לרכיב. סרגל המוצהר כקומפקטי עושה את מה שהוא מחזיק קומפקטי גם כן, כי הטוקנים שנושאים אותו יורשים — אף רכיב מתחת לא אומר לו היכן הוא נמצא.'
density:
