intro: 'ایک ہی نمونے دو بار، بائیں سے دائیں اور دائیں سے بائیں۔ یہاں کچھ بھی دائیں سے بائیں جانب نہیں لکھا گیا: ہر اسٹائل شیٹ لائن کے شروع اور آخر کی بات کرتی ہے، لہذا ایک بلاک جو `dir="rtl"` دیا گیا ہے — یا عربی میں ایک صفحہ — خود ہی عکس بند ہوتا ہے۔ تیروں کا رخ دوسری طرف ہوتا ہے، سوئچ کا نوب دوسری طرف چلتا ہے، ایک مینو آخر کی جانب کھلتا ہے، اور ایک ای میل یا ایک راستہ بائیں سے دائیں پڑھتا رہتا ہے۔'
