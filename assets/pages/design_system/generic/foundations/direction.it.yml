intro: "Gli stessi campioni due volte, da sinistra a destra e da destra a sinistra. Nulla qui è scritto per il lato da destra a sinistra: ogni foglio di stile parla dell'inizio e della fine di una riga, quindi un blocco dato `dir=\"rtl\"` — o una pagina in arabo — si riflette da solo. Le frecce puntano dall'altra parte, la manopola di un interruttore si muove dall'altra parte, un menu si apre verso la fine, e un'email o un percorso continua a leggere da sinistra a destra."
