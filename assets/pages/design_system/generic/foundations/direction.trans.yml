    next: Next
    menu: Menu

  menu:
    report: Report
    settings: Settings

  control:
    notifications: Notifications
    digest: Weekly digest
    upload: Upload

  field:
    owner: Owner
    email: Email
    site: Site
    amount: Amount

  text:
    lead: A lead paragraph carries its rule on the side the line starts from.
    mixed: "Values keep their own direction inside a sentence — ask layla.haddad@example.test, run"
    marker: Delivered
    link: Documentation

