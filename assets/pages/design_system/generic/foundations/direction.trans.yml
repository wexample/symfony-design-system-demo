  page_title: নির্দেশনা
  page_icon: 'ph:bold/arrows-left-right'
  intro: 'একই নমুনা দুটি, বাম থেকে ডানে এবং ডান থেকে বামে। এখানে ডান থেকে বাম দিকের জন্য কিছুই লেখা হয়নি: প্রতিটি স্টাইলশীট একটি লাইনের শুরু এবং শেষ সম্পর্কে কথা বলে, তাই একটি ব্লককে `dir="rtl"` দেওয়া হলে - বা আরবিতে একটি পৃষ্ঠা - এটি স্বতন্ত্রভাবে প্রতিফলিত হয়। তীরগুলো বিপরীত দিকে নির্দেশ করে, একটি সুইচের নব্বরটি অন্যদিকে চলে, একটি মেনু শেষের দিকে খুলে, এবং একটি ইমেল বা একটি পথ বাম থেকে ডানে পড়তে থাকে।'
