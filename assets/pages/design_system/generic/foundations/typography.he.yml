~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: טיפוגרפיה
page_icon: 'ph:bold/text-aa'
intro: 'הסקלה היא החלטת צפיפות והפנים הן החלטת גופנים: דף זה מראה כיצד צורה נקראת, לא מה ערכה היום. החלף את ציר הגופנים בלוח הביקורת וכל מה שמתחת מוגדר בפנים אחרות ללא שינוי כלל.'
section:
  families:
    title: משפחות
    description: 'שלוש, כי זה מה שדף מבדל: במה כתוב, במה מתואר, ומה מתכוון להיות נקרא כמו שנכתב ולא כמו שנאמר. סט יכול לתת את אותה פנים לשלושתם — זה שעושה זאת במערכת.'
  weights:
    title: משקלים
    description: 'נקראים לפי כמה הם מתעקשים, לא לפי מספר. פנים ש-500 שלה לא קיים ממפה את זה למה שיש לה, והצורות שמבקשות בינוני ממשיכות לבקש בינוני.'
  typography:
    title: 'סקאלת סוגים'
title:
  h1:
    title: 'מערכת עיצוב — בלוקים לבניית ממשקים מעולים'
    description: 'משמש פעם אחת לכל דף. קובע את ההקשר הראשי. משולב עם פסקה קצרה כמובילה.'
  h2:
    title: 'טיפוגרפיה קובעת היררכיה וקצב'
    description: 'כותרת ברמת פרק. קבוצות תוכן קשור. בדרך כלל לאחריה טקסט גוף או תתי פרקים.'
  h3:
    title: 'ריווח ופרופורציה מעצבים קריאות'
    description: 'כותרת תת-פרק. מציגה נושא ממוקד בתוך פרק.'
  h4:
    title: 'צבע וניגודיות מדריכים את העין'
    description: 'משמשת לכותרות כרטיסים, חלקי צד או קבוצות קטנות.'
  h5:
    title: 'מצבים אינטראקטיביים צריכים להיות ברורים'
    description: 'תיוגים, כותרות מטא-נתונים, קבוצות קטנות. עדין אך נבדל מטקסט גוף.'
  h6:
    title: 'נגישות היא תכונה, לא מחשבה מאוחרת'
    description: 'רמת הכותרת הקטנה ביותר. השתמש בזהירות — להערות שוליים, בלוקים משפטיים, או תוויות עזר.'
sample: 'השועל החום המהיר קופץ מעל הכלב העצלן — 0123456789'
