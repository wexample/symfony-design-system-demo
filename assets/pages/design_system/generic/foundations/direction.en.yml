intro: "The same samples twice, left to right and right to left. Nothing here is written for the right-to-left side: every stylesheet speaks of the start and the end of a line, so a block given `dir=\"rtl\"` — or a page in Arabic — mirrors on its own. Arrows point the other way, the knob of a switch travels the other way, a menu opens toward the end, and an email or a path keeps reading left to right."

