~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Espacement
page_icon: 'ph:bold/règle'
intro: "Deux échelles et une règle. Une forme n'écrit jamais une longueur : elle dépense un pas, ce qui empêche deux composants écrits à un an d'intervalle d'être décalés de deux pixels."
section:
  space:
    title: "Étapes d'espacement"
    description: "Neuf étapes, d'une ligne fine à une marge de page. Les espacements, les interstices et les marges proviennent tous d'ici — une valeur entre deux étapes est une valeur qui n'a pas été décidée."
  size:
    title: Tailles
    description: "Les largeurs et hauteurs qu'une région reçoit : une colonne, un panneau, une mesure de lecture. Plus grande qu'une étape d'espacement et utilisée pour la même raison."
  density:
    title: Densité
    description: "La compacité appartient à une région et non à un widget. Une barre déclarée compacte rend ce qu'elle contient compact aussi, car les éléments qui la portent héritent — aucun composant en dessous n'est informé de sa position."
density:
  roomy: "Une barre d'outils à sa propre densité, et les boutons qu'elle contient"
  compact: "La même barre d'outils déclarée compacte — rien n'a été dit sur les boutons"
  marker: 'Une région déclarée compacte sans être une forme à part entière'
  action: Créer
  other: Rafraîchir
