en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Colours
  page_icon: ph:bold/palette

  intro: "No component names a colour. Colour lives in the palette, as scales of twelve tones given for the light face and the dark one; the colour scheme picks which face the page reads; a component reads a role — a surface, a border, a text — which is one place on a scale. The skin never says a colour. Switch the scheme from the header and every swatch below moves without a single one being redefined."

  section:
    scales:
      title: Scales
      description: "A palette is a neutral, an accent — the brand — and the four states, each a scale of twelve tones, laid out the way Radix Themes and Material 3 lay a colour out. A place on a scale means the same on every scale and on both faces: what the numbers below are for. An application brings its palette by giving its accent; every scale follows."
    surfaces:
      title: Surfaces
      description: "The grounds, from the region outward — each one a place on the neutral scale. The light face of the dashboard orders them by lightness up to white, the dark face by how far each one is lifted off the ground."
    text:
      title: Text
      description: "Three levels of attention — neutral 12, 11 and 9: what is being read, what qualifies it, and what is only there to be found when looked for."
    borders:
      title: Borders
      description: "Four weights, told apart by what they separate — neutral 5 to 8: two things inside one region, a field from what is behind it, two regions of a page, and the ring of what has the focus."
    categories:
      title: Categories
      description: "Thirteen colours that mean nothing but \"not the one beside it\": the series of a chart, the segments of a distribution, the stages of a workflow. Named, not numbered — an app picks `cat-mint` because it looks like mint — and each a scale like the others, so a category is worn the way a state is: its ground at 3, its ink at 11, filled at 9."

  step:
    1: the ground of a work region
    2: the ground of the page, around and between regions
    3: a field's ground; the faint ground a state sits on
    4: a raised control; a hovered ground
    5: a card, a block — and its discreet border
    6: a border
    7: a border between two regions
    8: a strong border, a focus ring
    9: the colour whole, filling what it marks
    10: the same, hovered
    11: the colour as ink, readable on the grounds
    12: strong ink — for the neutral, the text itself

  surface:
    zone: The ground a region of a page stands on
    page: The page itself, and what shows between the zones
    shell: Menu, header, footer
    one: Inputs and fields
    two: Buttons, toolbars
    three: Blocks, cards, modals
    invert: A control standing out by taking the text's colour

  text:
    default: What is being read
    muted: Labels, meta, subtitles
    subtle: Separators and empty states

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: الألوان
  page_icon: 'ph:bold/palette'
  intro: 'لا تحتوي أسماء المكونات على لون. اللون موجود في اللوحة، كدرجات من اثني عشر نغمة مُعطاة للوجه الفاتح والوجه الداكن؛ مخطط الألوان يختار أي وجه تقرأه الصفحة؛ يقرأ المكون دورًا - سطحًا، حدًا، نصًا - وهو مكان واحد على المقياس. الجلد لا يذكر لونًا أبدًا. قم بتغيير المخطط من الرأس وكل عينة أدناه تتحرك دون أن يتم إعادة تعريف أي واحدة منها.'
  section:
    scales:
      title: المقاييس
      description: 'اللوحة هي محايدة، لهجة مميزة - العلامة التجارية - والحالات الأربع، كل منها مقياس من اثني عشر نغمة، مرتبة بالطريقة التي تعرض بها Radix Themes وMaterial 3 اللون. مكان على مقياس يعني الشيء نفسه على كل مقياس وعلى كلا الوجهين: ما هي الأرقام أدناه. يجلب التطبيق لوحته من خلال إعطاء لهجته؛ كل مقياس يتبع.'
    surfaces:
      title: الأسطح
      description: 'الأراضي، من المنطقة إلى الخارج - كل واحدة مكان على المقياس المحايد. الوجه الفاتح من لوحة التحكم يرتبها بحسب الفتحة حتى الأبيض، والوجه الداكن بحسب مدى ارتفاع كل واحدة عن الأرض.'
    text:
      title: النص
      description: 'ثلاث مستويات من الانتباه - محايد 12، 11 و9: ما يتم قراءته، ما يؤهله، وما هو موجود فقط ليتم العثور عليه عند البحث عنه.'
    borders:
      title: الحدود
      description: 'أربعة أوزان، تُميز بما تفصل بينه - محايد 5 إلى 8: شيئين داخل منطقة واحدة، حقل مما خلفه، منطقتين من صفحة، وحلقة ما يحمل التركيز.'
    categories:
      title: الفئات
      description: 'ثلاثة عشر لونًا لا تعني شيئًا سوى "ليس الذي بجانبه": سلسلة من مخطط، قطع من توزيع، مراحل من سير العمل. مُسماة، لا مُرقمة - يختار التطبيق `cat-mint` لأنه يشبه النعناع - وكلها مقياس مثل الآخرين، لذا تُرتدى الفئة بالطريقة التي تُرتدى بها الحالة: أرضيتها عند 3، حبرها عند 11، ممتلئة عند 9.'
  step:
    1: 'أرضية منطقة العمل'
    2: 'أرضية الصفحة، حول وبين المناطق'
    3: 'أرضية حقل؛ الأرض الخفيفة التي تجلس عليها حالة'
    4: 'تحكم مرتفع؛ أرضية مُعلقة'
    5: 'بطاقة، كتلة - وحدودها المميزة'
    6: حد
    7: 'حد بين منطقتين'
    8: 'حد قوي، حلقة تركيز'
    9: 'اللون بالكامل، يملأ ما يحدده'
    10: 'نفس الشيء، مُعلق'
    11: 'اللون كحبر، يمكن قراءته على الأرضيات'
    12: 'حبر قوي - للمحايد، النص نفسه'
  surface:
    zone: 'الأرض التي تقف عليها منطقة من الصفحة'
    page: 'الصفحة نفسها، وما يظهر بين المناطق'
    shell: 'القائمة، الرأس، التذييل'
    one: 'المدخلات والحقول'
    two: 'الأزرار، أشرطة الأدوات'
    three: 'الكتل، البطاقات، النوافذ المنبثقة'
    invert: 'تحكم يبرز بأخذ لون النص'
  text:
    default: 'ما يُقرأ'
    muted: 'التسميات، الميتا، العناوين الفرعية'
    subtle: 'الفواصل والحالات الفارغة'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: রঙ
  page_icon: 'ph:bold/palette'
  intro: 'কোনো উপাদান একটি রঙের নাম দেয় না। রঙ প্যালেটে থাকে, উজ্জ্বল এবং গা dark ় দুটি মুখের জন্য দেওয়া বারো স্বরের স্কেল হিসাবে; রঙের স্কিম পৃষ্ঠা পড়ার জন্য কোন মুখটি বেছে নেয়; একটি উপাদান একটি ভূমিকা পড়ে — একটি পৃষ্ঠ, একটি সীমানা, একটি টেক্সট — যা একটি স্কেলে একটি স্থান। ত্বক কখনো একটি রঙ বলে না। হেডার থেকে স্কিমটি পরিবর্তন করুন এবং নিচের প্রতিটি সোয়াচ একটি একক পুনঃসংজ্ঞায়িত না করে চলে যায়।'
  section:
    scales:
      title: স্কেল
      description: 'একটি প্যালেট একটি নিরপেক্ষ, একটি অ্যাকসেন্ট — ব্র্যান্ড — এবং চারটি অবস্থার জন্য, প্রত্যেকটি বারো স্বরের একটি স্কেল, যেভাবে রাডিক্স থিম এবং ম্যাটেরিয়াল ৩ একটি রঙকে সাজায়। একটি স্কেলে একটি স্থানের মানে প্রতিটি স্কেলে এবং উভয় মুখে একই: নিচের সংখ্যাগুলোর জন্য কি। একটি অ্যাপ তার অ্যাকসেন্ট দিয়ে তার প্যালেট আনে; প্রতিটি স্কেল অনুসরণ করে।'
    surfaces:
      title: পৃষ্ঠ
      description: 'মাঠগুলি, অঞ্চল থেকে বাইরে — প্রতিটি একটি নিরপেক্ষ স্কেলে একটি স্থান। ড্যাশবোর্ডের উজ্জ্বল মুখ সেগুলোকে সাদা পর্যন্ত উজ্জ্বলতার দ্বারা সাজায়, গা dark ় মুখ প্রতিটি কতটা মাটির উপর উঁচু।'
    text:
      title: টেক্সট
      description: 'মনে রাখার তিনটি স্তর — নিরপেক্ষ ১২, ১১ এবং ৯: যা পড়া হচ্ছে, যা এটিকে যোগ্য করে, এবং যা শুধুমাত্র খোঁজার সময় পাওয়া যায়।'
    borders:
      title: সীমানা
      description: 'চারটি ওজন, যা তারা পৃথক করে তা দ্বারা বলা হয় — নিরপেক্ষ ৫ থেকে ৮: একটি অঞ্চলের ভিতরে দুটি জিনিস, যা তার পিছনে থেকে একটি ক্ষেত্র, একটি পৃষ্ঠের দুটি অঞ্চল, এবং যা ফোকাসে রয়েছে তার রিং।'
    categories:
      title: ক্যাটাগরিজ
      description: 'তেরটি রঙ যা কিছুই বোঝায় না কিন্তু "এটি পাশে নেই": একটি চার্টের সিরিজ, একটি বিতরণের অংশ, একটি ওয়ার্কফ্লোর পর্যায়। নামযুক্ত, সংখ্যা নয় — একটি অ্যাপ `cat-mint` বেছে নেয় কারণ এটি মেন্থলের মতো দেখায় — এবং প্রতিটি অন্যদের মতো একটি স্কেল, তাই একটি ক্যাটাগরি সেইভাবে পরা হয় যেমন একটি রাষ্ট্র হয়: এর ভিত্তি ৩, এর কালি ১১, পূর্ণ ৯।'
  step:
    1: 'একটি কাজের অঞ্চলের ভিত্তি'
    2: 'পৃষ্ঠা ভিত্তি, অঞ্চলগুলোর চারপাশে এবং মধ্যে'
    3: 'একটি ক্ষেত্রের ভিত্তি; একটি রাষ্ট্র যে ফিকে ভিত্তিতে বসে আছে'
    4: 'একটি উঁচু নিয়ন্ত্রণ; একটি হোভ করা ভিত্তি'
    5: 'একটি কার্ড, একটি ব্লক — এবং এর সূক্ষ্ম সীমানা'
    6: 'একটি সীমানা'
    7: 'দুটি অঞ্চলের মধ্যে একটি সীমানা'
    8: 'একটি শক্তিশালী সীমানা, একটি ফোকাস রিং'
    9: 'রঙের পুরো, যা এটি চিহ্নিত করে পূর্ণ করে'
    10: 'একই, হোভ করা'
    11: 'রঙ কালি হিসাবে, ভিত্তিগুলোর উপর পড়ার যোগ্য'
    12: 'শক্তিশালী কালি — নিরপেক্ষের জন্য, টেক্সট নিজেই'
  surface:
    zone: 'একটি পৃষ্ঠের অঞ্চলের উপর যে ভূমি'
    page: 'পৃষ্ঠ নিজেই, এবং যা অঞ্চলগুলির মধ্যে দেখায়'
    shell: 'মেনু, হেডার, ফুটার'
    one: 'ইনপুট এবং ক্ষেত্র'
    two: 'বাটন, টুলবার'
    three: 'ব্লক, কার্ড, মডাল'
    invert: 'একটি নিয়ন্ত্রণ যা টেক্সটের রঙ নিয়ে দাঁড়িয়ে আছে'
  text:
    default: 'কি পড়া হচ্ছে'
    muted: 'লেবেল, মেটা, সাবটাইটেল'
    subtle: 'সেপারেটর এবং খালি অবস্থাগুলি'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Farben
  page_icon: 'ph:bold/palette'
  intro: 'Keine Komponenten benennen eine Farbe. Die Farbe lebt in der Palette, als Skalen von zwölf Tönen, die für die helle und die dunkle Seite angegeben sind; das Farbschema wählt aus, welche Seite die Seite liest; eine Komponente hat eine Rolle — eine Fläche, einen Rand, einen Text — die einen Platz auf einer Skala darstellt. Die Haut sagt niemals eine Farbe. Wechselt das Schema im Header, bewegt sich jede Farbprobe darunter, ohne dass eine einzige neu definiert wird.'
  section:
    scales:
      title: Skalen
      description: 'Eine Palette ist neutral, ein Akzent — die Marke — und die vier Zustände, jeder eine Skala von zwölf Tönen, angeordnet wie Radix Themes und Material 3 eine Farbe anordnen. Ein Platz auf einer Skala bedeutet dasselbe auf jeder Skala und auf beiden Seiten: wofür die Zahlen unten stehen. Eine Anwendung bringt ihre Palette, indem sie ihren Akzent angibt; jede Skala folgt.'
    surfaces:
      title: Flächen
      description: 'Die Böden, von der Region nach außen — jede ein Platz auf der neutralen Skala. Die helle Seite des Dashboards ordnet sie nach Helligkeit bis hin zu Weiß, die dunkle Seite danach, wie weit jede vom Boden angehoben ist.'
    text:
      title: Text
      description: 'Drei Ebenen der Aufmerksamkeit — neutral 12, 11 und 9: was gelesen wird, was es qualifiziert, und was nur dann gefunden wird, wenn danach gesucht wird.'
    borders:
      title: Ränder
      description: 'Vier Gewichte, unterschieden durch das, was sie trennen — neutral 5 bis 8: zwei Dinge innerhalb einer Region, ein Feld von dem, was dahinter ist, zwei Regionen einer Seite und der Ring dessen, was den Fokus hat.'
    categories:
      title: Kategorien
      description: 'Dreizehn Farben, die nichts anderes bedeuten als "nicht die nebenan": die Reihe eines Diagramms, die Segmente einer Verteilung, die Phasen eines Workflows. Benannt, nicht nummeriert — eine App wählt `cat-mint`, weil es wie Minze aussieht — und jede eine Skala wie die anderen, so wird eine Kategorie so getragen, wie ein Zustand: ihr Boden bei 3, ihre Tinte bei 11, gefüllt bei 9.'
  step:
    1: 'der Boden eines Arbeitsbereichs'
    2: 'der Boden der Seite, um und zwischen den Regionen'
    3: 'der Boden eines Feldes; der schwache Boden, auf dem ein Zustand sitzt'
    4: 'eine angehobene Steuerung; ein schwebender Boden'
    5: 'eine Karte, ein Block — und ihr diskreter Rand'
    6: 'ein Rand'
    7: 'ein Rand zwischen zwei Regionen'
    8: 'ein starker Rand, ein Fokusring'
    9: 'das gesamte Farbige, das das markiert, was es kennzeichnet'
    10: 'das gleiche, schwebend'
    11: 'die Farbe als Tinte, lesbar auf den Böden'
    12: 'starke Tinte — für das Neutrale, den Text selbst'
  surface:
    zone: 'Der Boden, auf dem eine Region einer Seite steht'
    page: 'Die Seite selbst und das, was zwischen den Zonen angezeigt wird'
    shell: 'Menü, Kopfzeile, Fußzeile'
    one: 'Eingaben und Felder'
    two: 'Schaltflächen, Werkzeugleisten'
    three: 'Blöcke, Karten, Modals'
    invert: 'Eine Steuerung, die durch die Farbe des Textes hervorsticht'
  text:
    default: 'Was gelesen wird'
    muted: 'Labels, Metadaten, Untertitel'
    subtle: 'Trenner und leere Zustände'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Colores
  page_icon: 'ph:bold/palette'
  intro: 'Ningún componente nombra un color. El color vive en la paleta, como escalas de doce tonos dados para el fondo claro y el oscuro; el esquema de color elige qué cara lee la página; un componente lee un rol — una superficie, un borde, un texto — que es un lugar en una escala. La piel nunca dice un color. Cambia el esquema desde el encabezado y cada muestra abajo se mueve sin que ninguna sea redefinida.'
  section:
    scales:
      title: Escalas
      description: 'Una paleta es un neutro, un acento — la marca — y los cuatro estados, cada uno una escala de doce tonos, dispuestos de la manera en que Radix Themes y Material 3 disponen un color. Un lugar en una escala significa lo mismo en cada escala y en ambas caras: para qué sirven los números abajo. Una aplicación trae su paleta al dar su acento; cada escala sigue.'
    surfaces:
      title: Superficies
      description: 'Los fondos, desde la región hacia afuera — cada uno un lugar en la escala neutra. La cara clara del tablero los ordena por claridad hasta el blanco, la cara oscura por cuán lejos cada uno se eleva del suelo.'
    text:
      title: Texto
      description: 'Tres niveles de atención — neutro 12, 11 y 9: lo que se está leyendo, lo que lo califica, y lo que solo está ahí para ser encontrado cuando se busca.'
    borders:
      title: Bordes
      description: 'Cuatro grosores, diferenciados por lo que separan — neutro 5 a 8: dos cosas dentro de una región, un campo de lo que está detrás de él, dos regiones de una página, y el anillo de lo que tiene el foco.'
    categories:
      title: Categorías
      description: 'Trece colores que no significan nada más que "no el que está al lado": la serie de un gráfico, los segmentos de una distribución, las etapas de un flujo de trabajo. Nombrados, no numerados — una app elige `cat-mint` porque se parece a la menta — y cada uno una escala como los demás, así que una categoría se usa como un estado: su fondo en 3, su tinta en 11, relleno en 9.'
  step:
    1: 'el fondo de una región de trabajo'
    2: 'el fondo de la página, alrededor y entre regiones'
    3: 'el fondo de un campo; el fondo tenue sobre el que se sienta un estado'
    4: 'un control elevado; un fondo al que se pasa el ratón'
    5: 'una tarjeta, un bloque — y su borde discreto'
    6: 'un borde'
    7: 'un borde entre dos regiones'
    8: 'un borde fuerte, un anillo de enfoque'
    9: 'el color entero, llenando lo que marca'
    10: 'lo mismo, al pasar el ratón'
    11: 'el color como tinta, legible sobre los fondos'
    12: 'tinta fuerte — para el neutro, el texto mismo'
  surface:
    zone: 'El terreno sobre el cual se sostiene una región de la página'
    page: 'La página misma, y lo que muestra entre las zonas'
    shell: 'Menú, encabezado, pie de página'
    one: 'Entradas y campos'
    two: 'Botones, barras de herramientas'
    three: 'Bloques, tarjetas, modales'
    invert: 'Un control que se destaca al tomar el color del texto'
  text:
    default: 'Lo que se está leyendo'
    muted: 'Etiquetas, meta, subtítulos'
    subtle: 'Separadores y estados vacíos'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: رنگ‌ها
  page_icon: 'ph:bold/palette'
  intro: 'هیچ نام مؤلفه‌ای رنگی ندارد. رنگ در پالت وجود دارد، به‌عنوان مقیاس‌های دوازده‌تایی که برای چهره روشن و تیره ارائه شده‌اند؛ طرح رنگی مشخص می‌کند که صفحه چگونه خوانده می‌شود؛ یک مؤلفه نقشی می‌خواند — یک سطح، یک حاشیه، یک متن — که در یک مکان روی یک مقیاس قرار دارد. پوست هرگز رنگی را نمی‌گوید. طرح را از هدر تغییر دهید و هر رنگ زیر بدون اینکه هیچ‌کدام دوباره تعریف شوند، جابه‌جا می‌شود.'
  section:
    scales:
      title: مقیاس‌ها
      description: 'یک پالت یک خنثی، یک تأکید — برند — و چهار حالت، هرکدام یک مقیاس از دوازده رنگ، به‌گونه‌ای که موضوعات رادیکس و متریال ۳ رنگ‌ها را مرتب می‌کنند. یک مکان روی یک مقیاس در هر مقیاس و در هر دو چهره به یک معناست: عددهای زیر برای چه هستند. یک اپلیکیشن با ارائه تأکیدش پالت خود را می‌آورد؛ هر مقیاس دنبال می‌شود.'
    surfaces:
      title: سطوح
      description: 'زمین‌ها، از ناحیه به بیرون — هرکدام یک مکان روی مقیاس خنثی. چهره روشن داشبورد آنها را بر اساس روشنایی تا سفید مرتب می‌کند، چهره تیره بر اساس اینکه هرکدام چقدر از زمین فاصله دارند.'
    text:
      title: متن
      description: 'سه سطح توجه — خنثی ۱۲، ۱۱ و ۹: چه چیزی خوانده می‌شود، چه چیزی آن را واجد شرایط می‌کند، و چه چیزی فقط زمانی پیدا می‌شود که به دنبالش بگردید.'
    borders:
      title: حاشیه‌ها
      description: 'چهار وزن، که با چیزی که جدا می‌کنند تمایز ایجاد می‌شود — خنثی ۵ تا ۸: دو چیز در یک ناحیه، یک میدان از آنچه پشت آن است، دو ناحیه از یک صفحه، و حلقه‌ای که فوکوس دارد.'
    categories:
      title: دسته‌بندی‌ها
      description: 'سیزده رنگ که هیچ معنایی جز "نه آن یکی که در کنار آن است" ندارند: سری یک نمودار، بخش‌های یک توزیع، مراحل یک گردش کار. نام‌گذاری شده، نه شماره‌گذاری شده — یک اپلیکیشن `cat-mint` را انتخاب می‌کند زیرا شبیه نعنا است — و هرکدام مقیاسی مانند دیگران دارند، بنابراین یک دسته به‌گونه‌ای پوشیده می‌شود که یک حالت است: زمینه‌اش در ۳، جوهرش در ۱۱، پر شده در ۹.'
  step:
    1: 'زمین یک ناحیه کاری'
    2: 'زمین صفحه، دور و بین ناحیه‌ها'
    3: 'زمین یک میدان؛ زمین ضعیفی که یک حالت روی آن نشسته است'
    4: 'کنترلی که به‌طور برجسته‌ای ایستاده؛ یک زمین معلق'
    5: 'یک کارت، یک بلوک — و حاشیه‌ای که به‌طور نامحسوس است'
    6: 'یک حاشیه'
    7: 'یک حاشیه بین دو ناحیه'
    8: 'یک حاشیه قوی، حلقه فوکوس'
    9: 'رنگ کل، پرکننده آنچه را که علامت‌گذاری می‌کند'
    10: 'همان، معلق'
    11: 'رنگ به‌عنوان جوهر، قابل خواندن بر روی زمین‌ها'
    12: 'جوهر قوی — برای خنثی، خود متن'
  surface:
    zone: 'زمینی که یک منطقه از صفحه بر روی آن قرار دارد'
    page: 'صفحه خود و آنچه بین مناطق نمایش داده می‌شود'
    shell: 'منو، هدر، فوتر'
    one: 'ورودی‌ها و فیلدها'
    two: 'دکمه‌ها، نوار ابزارها'
    three: 'بلوک‌ها، کارت‌ها، مدال‌ها'
    invert: 'یک کنترل که با به‌کارگیری رنگ متن، خود را متمایز می‌کند'
  text:
    default: 'آنچه که خوانده می‌شود'
    muted: 'برچسب‌ها، متا، زیرنویس‌ها'
    subtle: 'جداکننده‌ها و حالت‌های خالی'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Värit
  page_icon: 'ph:bold/palette'
  intro: 'Yksikään komponentti ei nimeä väriä. Väri elää paletissa, jossa on kaksitoista sävyä vaalealle ja tummalle pinnalle; väriteema valitsee, kummasta puolesta sivu luetaan; komponentti lukee roolin — pinta, reuna, teksti — joka on yksi paikka asteikolla. Ihon väriä ei koskaan sanota. Vaihda teema yläosasta ja jokainen näyte alapuolella liikkuu ilman, että yhtäkään määritellään uudelleen.'
  section:
    scales:
      title: Asteikot
      description: 'Paletti on neutraali, aksentti — brändi — ja neljä tilaa, jokainen kaksitoista sävyä sisältävä asteikko, aseteltuna kuten Radix-teemat ja Material 3 asettelevat värejä. Paikka asteikolla tarkoittaa samaa joka asteikolla ja molemmilla puolilla: mitä numerot alla tarkoittavat. Sovellus tuo palettinsa antamalla aksenttinsa; jokainen asteikko seuraa.'
    surfaces:
      title: Pinnat
      description: 'Pinnat, alueelta ulospäin — jokainen paikka neutraalilla asteikolla. Hallintapaneelin vaalea puoli järjestää ne vaaleuden mukaan valkoiseen asti, tumma puoli sen mukaan, kuinka korkealla kukin on maasta.'
    text:
      title: Teksti
      description: 'Kolme huomiotason — neutraali 12, 11 ja 9: mitä luetaan, mikä sitä määrittää, ja mikä on vain löydettävissä, kun sitä etsitään.'
    borders:
      title: Reunat
      description: 'Neljä painoarvoa, erotettuna siitä, mitä ne erottavat — neutraali 5–8: kaksi asiaa yhdessä alueessa, kenttä siitä, mikä on sen takana, kaksi aluetta sivulla ja keskittymisen kehys.'
    categories:
      title: Kategoriat
      description: 'Kolmetoista väriä, jotka tarkoittavat vain "ei se, joka on vieressä": kaavion sarja, jakautumisen segmentit, työnkulun vaiheet. Nimetty, ei numeroitu — sovellus valitsee `cat-mint` koska se näyttää mintulta — ja jokainen asteikko kuin muut, joten kategoriaa käytetään kuten tilaa: sen pohja 3:lla, sen muste 11:llä, täytetty 9:llä.'
  step:
    1: 'työalueen pohja'
    2: 'sivun pohja, alueiden ympärillä ja niiden välissä'
    3: 'kentän pohja; vaalea pohja, jota tila istuu päällä'
    4: 'kohotettu ohjaus; leijuva pohja'
    5: 'kortti, lohko — ja sen huomaamaton reuna'
    6: reuna
    7: 'reuna kahden alueen välillä'
    8: 'vahva reuna, keskittymisen kehys'
    9: 'kokonaisväri, täyttäen sen, mitä se merkitsee'
    10: 'sama, leijuvana'
    11: 'väri musteena, luettavissa pinnoilla'
    12: 'vahva muste — neutraalille, itse teksti'
  surface:
    zone: 'Alusta, jolla alue sijaitsee'
    page: 'Sivu itse ja se, mikä näkyy alueiden välillä'
    shell: 'Valikko, yläosa, alaosa'
    one: 'Syötteet ja kentät'
    two: 'Painikkeet, työkalupalkit'
    three: 'Loitsut, kortit, modaalit'
    invert: 'Ohjaus, joka erottuu ottamalla tekstin värin'
  text:
    default: 'Mitä luetaan'
    muted: 'Otsikot, meta, alaotsikot'
    subtle: 'Erottaijat ja tyhjät tilat'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Couleurs
  page_icon: 'ph:bold/palette'
  intro: "Aucun nom de composant n'indique une couleur. La couleur réside dans la palette, sous forme d'échelles de douze teintes données pour le ton clair et le ton foncé ; le schéma de couleur choisit quel ton la page lit ; un composant remplit un rôle — une surface, une bordure, un texte — qui est un emplacement sur une échelle. La peau ne dit jamais une couleur. Changez le schéma depuis l'en-tête et chaque échantillon ci-dessous se déplace sans qu'aucun ne soit redéfini."
  section:
    scales:
      title: Échelles
      description: 'Une palette est un neutre, un accent — la marque — et les quatre états, chacun une échelle de douze teintes, disposées comme Radix Themes et Material 3 le font pour une couleur. Un emplacement sur une échelle signifie la même chose sur chaque échelle et sur les deux faces : à quoi servent les nombres ci-dessous. Une application apporte sa palette en donnant son accent ; chaque échelle suit.'
    surfaces:
      title: Surfaces
      description: "Les fonds, de la région vers l'extérieur — chacun un emplacement sur l'échelle neutre. La face claire du tableau de bord les ordonne par légèreté jusqu'au blanc, la face foncée par la distance à laquelle chacun est élevé du sol."
    text:
      title: Texte
      description: "Trois niveaux d'attention — neutre 12, 11 et 9 : ce qui est lu, ce qui le qualifie, et ce qui n'est là que pour être trouvé lorsqu'on le cherche."
    borders:
      title: Bordures
      description: "Quatre poids, distingués par ce qu'ils séparent — neutre 5 à 8 : deux choses à l'intérieur d'une région, un champ de ce qui est derrière, deux régions d'une page, et l'anneau de ce qui a le focus."
    categories:
      title: Catégories
      description: "Treize couleurs qui ne signifient rien d'autre que \"pas celui à côté\" : la série d'un graphique, les segments d'une distribution, les étapes d'un flux de travail. Nommées, pas numérotées — une application choisit `cat-mint` parce que cela ressemble à de la menthe — et chacune une échelle comme les autres, donc une catégorie est portée de la manière dont un état l'est : son fond à 3, son encre à 11, rempli à 9."
  step:
    1: "le fond d'une région de travail"
    2: 'le fond de la page, autour et entre les régions'
    3: "le fond d'un champ ; le fond léger sur lequel un état repose"
    4: 'un contrôle surélevé ; un fond survolé'
    5: 'une carte, un bloc — et sa bordure discrète'
    6: 'une bordure'
    7: 'une bordure entre deux régions'
    8: 'une bordure forte, un anneau de focus'
    9: "la couleur entière, remplissant ce qu'elle marque"
    10: 'la même chose, survolée'
    11: 'la couleur comme encre, lisible sur les fonds'
    12: 'encre forte — pour le neutre, le texte lui-même'
  surface:
    zone: "Le sol sur lequel une région d'une page se tient"
    page: 'La page elle-même, et ce qui montre entre les zones'
    shell: 'Menu, en-tête, pied de page'
    one: 'Champs de saisie'
    two: "Boutons, barres d'outils"
    three: 'Blocs, cartes, modales'
    invert: 'Un contrôle qui se distingue en prenant la couleur du texte'
  text:
    default: 'Ce qui est lu'
    muted: 'Étiquettes, méta, sous-titres'
    subtle: 'Séparateurs et états vides'

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: צבעים
  page_icon: 'ph:bold/palette'
  intro: 'אין שמות לרכיבים צבע. הצבע נמצא בפלטה, כסולמות של שניים עשר גוונים הניתנים לפנים בהירות ולפנים כהות; סכמת הצבעים בוחרת איזו פנים הממשק קורא; רכיב קורא תפקיד — משטח, גבול, טקסט — שהוא מקום אחד על סולם. העור לעולם אינו אומר צבע. החלף את הסכמה מהכותרת וכל דוגמה למטה זזה מבלי שאף אחת תוגדר מחדש.'
  section:
    scales:
      title: סולמות
      description: 'פלטה היא נייטרלית, הדגשה — המותג — וארבעה מצבים, כל אחד סולם של שניים עשר גוונים, מסודרים כמו שסכמות Radix וחומר 3 מסדרים צבע. מקום על סולם פירושו אותו דבר בכל סולם ובשני הפנים: מה המספרים למטה מיועדים. אפליקציה מביאה את הפלטה שלה על ידי מתן ההדגשה שלה; כל סולם עוקב.'
    surfaces:
      title: משטחים
      description: 'הקרקע, מהאזור החוצה — כל אחד מקום על הסולם הנייטרלי. הפנים הבהירה של הלוח מסדרת אותם לפי בהירות עד ללבן, הפנים כהה לפי כמה כל אחד מורם מהקרקע.'
    text:
      title: טקסט
      description: 'שלושה רמות תשומת לב — נייטרלית 12, 11 ו-9: מה נקרא, מה מקנה אותו, ומה נמצא רק כאשר מחפשים אותו.'
    borders:
      title: גבולות
      description: 'ארבע משקלים, נבדלים על ידי מה שהם מפרידים — נייטרלי 5 עד 8: שני דברים בתוך אזור אחד, שדה ממה שמאחוריו, שני אזורים של עמוד, והטבעת של מה שיש לו את הפוקוס.'
    categories:
      title: קטגוריות
      description: 'שלושה עשר צבעים שאינם משמעותיים אלא "לא זה שלצידו": הסדרה של גרף, הקטעים של הפצה, השלבים של זרימת עבודה. שמות, לא מספרים — אפליקציה בוחרת `cat-mint` כי זה נראה כמו מנטה — וכל אחד סולם כמו האחרים, כך שקטגוריה נלבשת כמו מצב: הקרקע שלה ב-3, הדיו שלה ב-11, מלאה ב-9.'
  step:
    1: 'הקרקע של אזור עבודה'
    2: 'הקרקע של העמוד, מסביב ובין אזורים'
    3: 'הקרקע של שדה; הקרקע העדינה שעליה יושב מצב'
    4: 'בקר מורם; קרקע מרחפת'
    5: 'כרטיס, בלוק — וגדר דיסקרטית שלו'
    6: גבול
    7: 'גבול בין שני אזורים'
    8: 'גבול חזק, טבעת פוקוס'
    9: 'הצבע כולו, ממלא את מה שהוא מסמן'
    10: 'אותו דבר, מרחף'
    11: 'הצבע כדיו, קריא על הקרקעות'
    12: 'דיו חזק — עבור הנייטרלי, הטקסט עצמו'
  surface:
    zone: 'הקרקע שעליה עומד אזור של דף'
    page: 'הדף עצמו, ומה שמופיע בין האזורים'
    shell: 'תפריט, כותרת, כותרת תחתונה'
    one: 'קלטים ושדות'
    two: 'כפתורים, סרגלי כלים'
    three: 'בלוקים, כרטיסים, מודלים'
    invert: 'בקר הבולט על ידי לקיחת צבע הטקסט'
  text:
    default: 'מה שנקרא'
    muted: 'תוויות, מטא, כותרות משנה'
    subtle: 'מפרידים ומצבים ריקים'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: रंग
  page_icon: 'ph:bold/palette'
  intro: 'कोई घटक रंग का नाम नहीं रखता। रंग पैलेट में रहता है, जो हल्के चेहरे और गहरे चेहरे के लिए दिए गए बारह टोन के पैमानों के रूप में है; रंग योजना यह तय करती है कि पृष्ठ कौन सा चेहरा पढ़ता है; एक घटक एक भूमिका पढ़ता है — एक सतह, एक सीमा, एक पाठ — जो एक पैमाने पर एक स्थान है। त्वचा कभी भी रंग नहीं बताती। शीर्षक से योजना बदलें और नीचे हर स्वैच बिना किसी को फिर से परिभाषित किए हुए चले जाते हैं।'
  section:
    scales:
      title: स्केल्स
      description: 'एक पैलेट एक तटस्थ, एक एक्सेंट — ब्रांड — है और चार स्थितियाँ, प्रत्येक बारह टोन के स्केल का एक सेट, जिस तरह से Radix Themes और Material 3 एक रंग को व्यवस्थित करते हैं। एक स्केल पर एक स्थान हर स्केल पर और दोनों चेहरों पर समान होता है: नीचे दिए गए नंबर किसके लिए हैं। एक एप्लिकेशन अपने एक्सेंट को देकर अपना पैलेट लाता है; हर स्केल इसका पालन करता है।'
    surfaces:
      title: सतहें
      description: 'भूमियाँ, क्षेत्र से बाहर — प्रत्येक एक तटस्थ स्केल पर एक स्थान। डैशबोर्ड का हल्का चेहरा उन्हें हल्केपन के अनुसार सफेद तक क्रमबद्ध करता है, गहरा चेहरा यह तय करता है कि प्रत्येक कितनी दूर जमीन से उठी हुई है।'
    text:
      title: पाठ
      description: 'ध्यान के तीन स्तर — तटस्थ 12, 11 और 9: क्या पढ़ा जा रहा है, क्या इसे योग्य बनाता है, और क्या केवल तब पाया जाता है जब इसे खोजा जाता है।'
    borders:
      title: सीमाएं
      description: 'चार वजन, जो यह बताता है कि वे क्या अलग करते हैं — तटस्थ 5 से 8: एक क्षेत्र के भीतर दो चीजें, जो इसके पीछे है उससे एक क्षेत्र, एक पृष्ठ के दो क्षेत्र, और जिस पर ध्यान केंद्रित किया गया है उसका अंगूठी।'
    categories:
      title: श्रेणियाँ
      description: 'तेरह रंग जो केवल "इसके बगल वाला नहीं" का मतलब रखते हैं: एक चार्ट की श्रृंखला, एक वितरण के खंड, एक कार्य प्रवाह के चरण। नामित, संख्या नहीं — एक ऐप `cat-mint` चुनता है क्योंकि यह पुदीने जैसा दिखता है — और प्रत्येक अन्य की तरह एक स्केल है, इसलिए एक श्रेणी उसी तरीके से पहनी जाती है जैसे एक स्थिति: इसका आधार 3 पर, उसका स्याही 11 पर, भरा हुआ 9 पर।'
  step:
    1: 'एक कार्य क्षेत्र का आधार'
