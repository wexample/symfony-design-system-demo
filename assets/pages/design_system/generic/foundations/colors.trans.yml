id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Warna
  page_icon: 'ph:bold/palette'
  intro: 'Tidak ada nama komponen yang menunjukkan warna. Warna ada di palet, sebagai skala dua belas nada yang diberikan untuk wajah terang dan gelap; skema warna memilih wajah mana yang dibaca halaman; sebuah komponen membaca peran — permukaan, batas, teks — yang merupakan satu tempat pada skala. Kulit tidak pernah menyebutkan warna. Ubah skema dari header dan setiap swatch di bawahnya bergerak tanpa satu pun yang didefinisikan ulang.'
  section:
    scales:
      title: Skala
      description: 'Sebuah palet adalah netral, aksen — merek — dan empat keadaan, masing-masing skala dua belas nada, disusun seperti Radix Themes dan Material 3 menyusun warna. Sebuah tempat pada skala berarti sama di setiap skala dan di kedua wajah: apa yang dimaksud dengan angka di bawahnya. Sebuah aplikasi membawa paletnya dengan memberikan aksennya; setiap skala mengikuti.'
    surfaces:
      title: Permukaan
      description: 'Dasar, dari wilayah ke luar — masing-masing adalah tempat pada skala netral. Wajah terang dari dasbor mengurutkannya berdasarkan kecerahan hingga putih, wajah gelap berdasarkan seberapa tinggi masing-masing diangkat dari tanah.'
    text:
      title: Teks
      description: 'Tiga tingkat perhatian — netral 12, 11 dan 9: apa yang sedang dibaca, apa yang memenuhi syarat, dan apa yang hanya ada untuk ditemukan ketika dicari.'
    borders:
      title: Batas
      description: 'Empat bobot, dibedakan oleh apa yang mereka pisahkan — netral 5 hingga 8: dua hal di dalam satu wilayah, sebuah bidang dari apa yang ada di belakangnya, dua wilayah pada halaman, dan cincin dari apa yang memiliki fokus.'
    categories:
      title: Kategori
      description: 'Tiga belas warna yang tidak berarti apa-apa kecuali "bukan yang di sampingnya": rangkaian dari sebuah grafik, segmen dari distribusi, tahap dari alur kerja. Dinamai, bukan dinomori — sebuah aplikasi memilih `cat-mint` karena terlihat seperti mint — dan masing-masing adalah skala seperti yang lainnya, sehingga sebuah kategori dikenakan seperti sebuah keadaan: dasarnya di 3, tintanya di 11, diisi di 9.'
  step:
    1: 'dasar dari wilayah kerja'
    2: 'dasar dari halaman, di sekitar dan antara wilayah'
    3: 'dasar sebuah bidang; dasar samar yang dijadikan tempat sebuah keadaan'
    4: 'kontrol yang terangkat; dasar yang dihover'
    5: 'sebuah kartu, sebuah blok — dan batasnya yang halus'
    6: 'sebuah batas'
    7: 'batas antara dua wilayah'
    8: 'batas yang kuat, cincin fokus'
    9: 'warna keseluruhan, mengisi apa yang ditandainya'
    10: 'sama, dihover'
    11: 'warna sebagai tinta, terbaca di dasar'
    12: 'tinta kuat — untuk netral, teks itu sendiri'
  surface:
    zone: 'Latar tempat sebuah wilayah halaman berdiri'
    page: 'Halaman itu sendiri, dan apa yang muncul di antara zona-zona'
    shell: 'Menu, header, footer'
    one: 'Input dan bidang'
    two: 'Tombol, toolbar'
    three: 'Blok, kartu, modal'
    invert: 'Sebuah kontrol yang menonjol dengan mengambil warna teks'
  text:
    default: 'Apa yang sedang dibaca'
    muted: 'Label, meta, subtitle'
    subtle: 'Pemisah dan keadaan kosong'

it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Colori
  page_icon: 'ph:bold/palette'
  intro: "Nessun componente nomina un colore. Il colore vive nella palette, come scale di dodici tonalità date per la faccia chiara e quella scura; lo schema dei colori sceglie quale faccia legge la pagina; un componente legge un ruolo — una superficie, un bordo, un testo — che è un posto su una scala. La pelle non dice mai un colore. Cambia lo schema dall'intestazione e ogni campione sottostante si sposta senza che nessuno venga ridefinito."
  section:
    scales:
      title: Scale
      description: "Una palette è un neutro, un accento — il marchio — e i quattro stati, ognuno una scala di dodici tonalità, disposti come Radix Themes e Material 3 dispongono un colore. Un posto su una scala significa lo stesso su ogni scala e su entrambe le facce: a cosa servono i numeri qui sotto. Un'app porta la sua palette dando il suo accento; ogni scala segue."
    surfaces:
      title: Superfici
      description: "I terreni, dalla regione verso l'esterno — ognuno un posto sulla scala neutra. La faccia chiara della dashboard li ordina per luminosità fino al bianco, la faccia scura in base a quanto ognuno è sollevato da terra."
    text:
      title: Testo
      description: 'Tre livelli di attenzione — neutro 12, 11 e 9: ciò che viene letto, ciò che lo qualifica e ciò che è presente solo se cercato.'
    borders:
      title: Bordi
      description: "Quattro pesi, distinti da ciò che separano — neutro 5 a 8: due cose dentro una regione, un campo da ciò che è dietro di esso, due regioni di una pagina e l'anello di ciò che ha il focus."
    categories:
      title: Categorie
      description: 'Tredici colori che non significano nulla se non "non quello accanto": la serie di un grafico, i segmenti di una distribuzione, le fasi di un flusso di lavoro. Nominati, non numerati — un''app sceglie `cat-mint` perché assomiglia alla menta — e ognuno una scala come gli altri, quindi una categoria è indossata come uno stato: il suo terreno a 3, il suo inchiostro a 11, riempito a 9.'
  step:
    1: 'il terreno di una regione di lavoro'
    2: 'il terreno della pagina, intorno e tra le regioni'
    3: 'il terreno di un campo; il terreno tenue su cui si trova uno stato'
    4: 'un controllo sollevato; un terreno sovrapposto'
    5: 'una scheda, un blocco — e il suo bordo discreto'
    6: 'un bordo'
    7: 'un bordo tra due regioni'
    8: 'un bordo forte, un anello di messa a fuoco'
    9: 'il colore intero, riempiendo ciò che segna'
    10: 'lo stesso, sovrapposto'
    11: 'il colore come inchiostro, leggibile sui terreni'
    12: 'inchiostro forte — per il neutro, il testo stesso'
  surface:
    zone: 'Il terreno su cui si trova una regione di una pagina'
    page: 'La pagina stessa e ciò che si mostra tra le zone'
    shell: 'Menu, intestazione, piè di pagina'
    one: 'Input e campi'
    two: 'Pulsanti, barre degli strumenti'
    three: 'Blocchi, schede, modali'
    invert: 'Un controllo che si distingue prendendo il colore del testo'
  text:
    default: 'Ciò che viene letto'
    muted: 'Etichette, meta, sottotitoli'
    subtle: 'Separatori e stati vuoti'

ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: カラー
  page_icon: 'ph:bold/palette'
  intro: 'コンポーネント名は色を指定しません。色はパレットの中に存在し、明るい面と暗い面のために与えられた12色のスケールとして存在します。カラースキームはページがどの面を読み取るかを決定します。コンポーネントは役割を読み取ります — サーフェス、ボーダー、テキスト — それはスケール上の1つの場所です。スキンは決して色を言いません。ヘッダーからスキームを切り替えると、下のスウォッチが再定義されることなく全て移動します。'
  section:
    scales:
      title: スケール
      description: 'パレットはニュートラル、アクセント — ブランド — であり、4つの状態はそれぞれ12色のスケールで、Radix ThemesとMaterial 3が色を配置する方法でレイアウトされています。スケール上の場所は、すべてのスケールと両方の面で同じ意味を持ちます：下の数字が何のためかです。アプリケーションはそのアクセントを与えることでパレットを持ち込みます；すべてのスケールがそれに従います。'
    surfaces:
      title: サーフェス
      description: 'グラウンドは、領域の外側から — 各自がニュートラルスケール上の場所です。ダッシュボードの明るい面は、それらを白までの明るさで順序付け、暗い面は各自が地面からどれだけ持ち上げられているかによって順序付けます。'
    text:
      title: テキスト
      description: '注意の3つのレベル — ニュートラル12、11、9：何が読まれているか、それを定義するもの、そして探すときにのみ見つかるもの。'
    borders:
      title: ボーダー
      description: '4つの重さ、分けるもので区別されます — ニュートラル5から8：1つの領域の中の2つのもの、背後のものからのフィールド、ページの2つの領域、そして焦点を持つもののリング。'
    categories:
      title: カテゴリー
      description: '隣接するものとは何の意味もない13色：チャートの系列、分布のセグメント、ワークフローの段階。名付けられ、番号付けされず — アプリが`cat-mint`を選ぶのは、それがミントのように見えるからです — そしてそれぞれが他のものと同じようにスケールを持ち、カテゴリーは状態のように着用されます：その地面は3、インクは11、満たされるのは9です。'
  step:
    1: 作業領域の地面
    2: ページの地面、領域の周りや間に
    3: フィールドの地面；状態が座っている淡い地面
    4: 持ち上げられたコントロール；ホバーされた地面
    5: 'カード、ブロック — そしてその控えめなボーダー'
    6: ボーダー
    7: 2つの領域の間のボーダー
    8: 強いボーダー、焦点リング
    9: 色全体、それが示すものを満たす
    10: 同じ、ホバーされた
    11: 地面の上で読み取れるインクとしての色
    12: '強いインク — ニュートラル、テキスト自体のために'
  surface:
    zone: ページの領域が立つ地面
    page: ページ自体とゾーン間に表示されるもの
    shell: メニュー、ヘッダー、フッター
    one: 入力とフィールド
    two: ボタン、ツールバー
    three: ブロック、カード、モーダル
    invert: テキストの色を取り入れることで際立つコントロール
  text:
    default: 読まれているもの
    muted: ラベル、メタ、サブタイトル
    subtle: 区切り線と空の状態

ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 색상
  page_icon: 'ph:bold/palette'
  intro: '구성 요소는 색상을 명시하지 않습니다. 색상은 팔레트에 존재하며, 밝은 색조와 어두운 색조에 대해 제공된 12개의 톤의 스케일로 표현됩니다. 색상 구성은 페이지가 읽히는 면을 선택하고, 구성 요소는 역할을 읽습니다 — 표면, 경계, 텍스트 — 이는 스케일의 한 위치입니다. 스킨은 결코 색상을 명시하지 않습니다. 헤더에서 구성 을 전환하면 아래의 모든 색상 견본이 재정의되지 않고 이동합니다.'
  section:
    scales:
      title: 스케일
      description: '팔레트는 중립, 강조 — 브랜드 — 그리고 네 가지 상태, 각각 12톤의 스케일로, Radix Themes와 Material 3가 색상을 배치하는 방식으로 배열됩니다. 스케일에서의 위치는 모든 스케일과 두 면에서 동일한 의미를 갖습니다: 아래 숫자의 용도입니다. 애플리케이션은 강조를 제공함으로써 자신의 팔레트를 가져옵니다; 모든 스케일이 따릅니다.'
    surfaces:
      title: 표면
      description: '영역에서 바깥쪽으로의 바닥 — 각각 중립 스케일에서의 위치입니다. 대시보드의 밝은 면은 흰색까지의 밝기로 정렬하고, 어두운 면은 각각 얼마나 바닥에서 들어올려졌는지를 기준으로 정렬합니다.'
    text:
      title: 텍스트
      description: '세 가지 주의 수준 — 중립 12, 11 및 9: 읽히는 것, 그것을 자격을 부여하는 것, 그리고 찾아야만 발견할 수 있는 것입니다.'
    borders:
      title: 테두리
      description: '네 가지 두께, 그들이 구분하는 것에 따라 구별됩니다 — 중립 5에서 8: 하나의 영역 안의 두 가지, 그것 뒤에 있는 것과의 필드, 페이지의 두 영역, 그리고 초점이 있는 것의 링입니다.'
    categories:
      title: 카테고리
      description: '서로 옆에 있는 것과는 아무 의미가 없는 13가지 색상: 차트의 시리즈, 분포의 세그먼트, 워크플로우의 단계. 이름이 붙여졌고, 번호가 매겨지지 않았습니다 — 앱은 민트처럼 보이기 때문에 `cat-mint`를 선택합니다 — 그리고 각 카테고리는 다른 것들과 같은 스케일로, 따라서 카테고리는 상태가 착용되는 방식으로 착용됩니다: 그 바닥은 3, 잉크는 11, 채워진 것은 9입니다.'
  step:
    1: '작업 영역의 바닥'
    2: '영역 주위와 사이의 페이지의 바닥'
    3: '필드의 바닥; 상태가 놓여 있는 희미한 바닥'
    4: '올려진 컨트롤; 호버된 바닥'
    5: '카드, 블록 — 그리고 그 독립적인 경계'
    6: 경계
    7: '두 영역 사이의 경계'
    8: '강한 경계, 초점 링'
    9: '색상 전체, 그것이 표시하는 것을 채우는'
    10: '같은 것, 호버된'
    11: '바닥에서 읽을 수 있는 잉크로서의 색상'
    12: '강한 잉크 — 중립을 위한, 텍스트 자체'
  surface:
    zone: '페이지의 한 지역이 위치한 바닥'
    page: '페이지 자체와 구역 사이에 표시되는 것'
    shell: '메뉴, 헤더, 바닥글'
    one: '입력 및 필드'
    two: '버튼, 도구 모음'
    three: '블록, 카드, 모달'
    invert: '텍스트의 색상을 사용하여 두드러지는 컨트롤'
  text:
    default: '읽고 있는 내용'
    muted: '레이블, 메타, 자막'
    subtle: '구분선과 빈 상태'

nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Kleuren
  page_icon: 'ph:bold/palette'
  intro: 'Geen enkele component noemt een kleur. Kleur leeft in het palet, als schalen van twaalf tinten gegeven voor de lichte en de donkere variant; het kleurenpalet kiest welke kant de pagina leest; een component leest een rol — een oppervlak, een rand, een tekst — wat een plek op een schaal is. De huid zegt nooit een kleur. Wissel het schema vanuit de kop en elke kleurstaal hieronder beweegt zonder dat er ook maar één opnieuw gedefinieerd wordt.'
  section:
    scales:
      title: Schalen
      description: 'Een palet is een neutraal, een accent — het merk — en de vier toestanden, elk een schaal van twaalf tinten, uitgestald zoals Radix Themes en Material 3 een kleur uitstallen. Een plek op een schaal betekent hetzelfde op elke schaal en op beide zijden: waarvoor de nummers hieronder zijn. Een applicatie brengt zijn palet door zijn accent te geven; elke schaal volgt.'
    surfaces:
      title: Oppervlakken
      description: 'De gronden, van de regio naar buiten — elk een plek op de neutrale schaal. De lichte kant van het dashboard ordent ze op basis van lichtheid tot wit, de donkere kant op basis van hoe ver elk ervan van de grond is geheven.'
    text:
      title: Tekst
      description: 'Drie niveaus van aandacht — neutraal 12, 11 en 9: wat wordt gelezen, wat het kwalificeert, en wat alleen te vinden is wanneer ernaar gekeken wordt.'
    borders:
      title: Randen
      description: "Vier gewichten, onderscheiden door wat ze scheiden — neutraal 5 tot 8: twee dingen binnen één regio, een veld van wat erachter ligt, twee regio's van een pagina, en de rand van wat de focus heeft."
    categories:
      title: Categorieën
      description: 'Dertien kleuren die niets betekenen behalve "niet de kleur ernaast": de reeks van een diagram, de segmenten van een distributie, de fasen van een workflow. Genoemd, niet genummerd — een app kiest `cat-mint` omdat het eruitziet als munt — en elk een schaal zoals de anderen, zodat een categorie gedragen wordt zoals een staat is: zijn grond op 3, zijn inkt op 11, gevuld op 9.'
  step:
    1: 'de grond van een werkgebied'
    2: "de grond van de pagina, rondom en tussen regio's"
    3: 'de grond van een veld; de vage grond waar een staat op zit'
    4: 'een verhoogde bediening; een zwevende grond'
    5: 'een kaart, een blok — en zijn discrete rand'
    6: 'een rand'
    7: "een rand tussen twee regio's"
    8: 'een sterke rand, een focusring'
    9: 'de kleur geheel, vul wat het markeert'
    10: 'dezelfde, zwevend'
    11: 'de kleur als inkt, leesbaar op de gronden'
    12: 'sterke inkt — voor de neutrale, de tekst zelf'
  surface:
    zone: 'De grond waarop een gebied van een pagina staat'
    page: 'De pagina zelf, en wat tussen de zones zichtbaar is'
    shell: 'Menu, kop, voettekst'
    one: 'Invoervelden en velden'
    two: 'Knoppen, werkbalken'
    three: 'Blokken, kaarten, modals'
    invert: 'Een bediening die opvalt door de kleur van de tekst te nemen'
  text:
    default: 'Wat gelezen wordt'
    muted: 'Labels, meta, ondertitels'
    subtle: 'Scheidingstekens en lege toestanden'

pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Kolory
  page_icon: 'ph:bold/palette'
  intro: 'Żaden komponent nie nazywa koloru. Kolor żyje w palecie, jako skale dwunastu odcieni, które są przypisane do jasnej i ciemnej twarzy; schemat kolorów wybiera, którą stronę czyta strona; komponent odczytuje rolę — powierzchnię, obramowanie, tekst — które są jednym miejscem na skali. Skórka nigdy nie mówi koloru. Zmień schemat z nagłówka, a każdy wzornik poniżej przesuwa się, nie definiując ani jednego z nich.'
  section:
    scales:
      title: Skale
      description: 'Paleta to neutralny, akcent — marka — i cztery stany, każdy to skala dwunastu odcieni, ułożona tak, jak Radix Themes i Material 3 układają kolor. Miejsce na skali oznacza to samo na każdej skali i obu twarzach: do czego służą liczby poniżej. Aplikacja przynosi swoją paletę, nadając swój akcent; każda skala podąża za tym.'
    surfaces:
      title: Powierzchnie
      description: 'Podłoża, od regionu na zewnątrz — każde z nich to miejsce na neutralnej skali. Jasna twarz pulpitu porządkuje je według jasności do bieli, ciemna według tego, jak daleko każde z nich jest uniesione nad ziemią.'
    text:
      title: Tekst
      description: 'Trzy poziomy uwagi — neutralny 12, 11 i 9: co jest czytane, co to kwalifikuje, a co jest tylko tam, aby zostać znalezionym, gdy się go szuka.'
    borders:
      title: Krawędzie
      description: 'Cztery grubości, odróżniane przez to, co oddzielają — neutralny 5 do 8: dwie rzeczy w jednym regionie, pole od tego, co jest za nim, dwa regiony strony i obręcz tego, co ma fokus.'
    categories:
      title: Kategorie
      description: 'Trzynaście kolorów, które nie znaczą nic poza "nie tym obok": seria wykresu, segmenty rozkładu, etapy przepływu pracy. Nazwane, nie ponumerowane — aplikacja wybiera `cat-mint`, ponieważ wygląda jak mięta — i każdy z nich jest skalą jak inne, więc kategoria jest noszona tak, jak stan: jej podłoże na 3, jej tusz na 11, wypełnione na 9.'
  step:
    1: 'podłoże regionu roboczego'
    2: 'podłoże strony, wokół i pomiędzy regionami'
    3: 'podłoże pola; słabe podłoże, na którym siedzi stan'
    4: 'podniesiona kontrola; podłoże najeżone'
    5: 'karta, blok — i jego dyskretne obramowanie'
    6: obramowanie
    7: 'obramowanie między dwoma regionami'
    8: 'mocne obramowanie, obręcz fokusa'
    9: 'kolor całkowity, wypełniający to, co oznacza'
    10: 'to samo, najeżone'
    11: 'kolor jako tusz, czytelny na podłożach'
    12: 'mocny tusz — dla neutralnego, sam tekst'
  surface:
    zone: 'Tło, na którym stoi region strony'
    page: 'Strona sama w sobie i to, co pokazuje się między strefami'
    shell: 'Menu, nagłówek, stopka'
    one: 'Elementy wejściowe i pola'
    two: 'Przyciski, paski narzędzi'
    three: 'Bloki, karty, modale'
    invert: 'Kontrola wyróżniająca się przez przyjęcie koloru tekstu'
  text:
    default: 'Co jest czytane'
    muted: 'Etykiety, meta, napisy'
    subtle: 'Separatory i puste stany'

pt_BR:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Cores
  page_icon: 'ph:bold/palette'
  intro: 'Nenhum componente nomeia uma cor. A cor vive na paleta, como escalas de doze tons dados para o fundo claro e o escuro; o esquema de cores escolhe qual fundo a página lê; um componente lê um papel — uma superfície, uma borda, um texto — que é um lugar em uma escala. A pele nunca diz uma cor. Mude o esquema a partir do cabeçalho e cada amostra abaixo se move sem que nenhuma delas seja redefinida.'
  section:
    scales:
      title: Escalas
      description: 'Uma paleta é um neutro, um acento — a marca — e os quatro estados, cada um uma escala de doze tons, dispostos da forma como Radix Themes e Material 3 dispõem uma cor. Um lugar em uma escala significa o mesmo em todas as escalas e em ambos os fundos: para que servem os números abaixo. Um aplicativo traz sua paleta ao dar seu acento; cada escala segue.'
    surfaces:
      title: Superfícies
      description: 'Os fundos, da região para fora — cada um um lugar na escala neutra. O fundo claro do painel os ordena por claridade até o branco, o fundo escuro pela distância que cada um é elevado do chão.'
    text:
      title: Texto
      description: 'Três níveis de atenção — neutro 12, 11 e 9: o que está sendo lido, o que o qualifica e o que está apenas lá para ser encontrado quando procurado.'
    borders:
      title: Bordas
      description: 'Quatro pesos, diferenciados pelo que separaram — neutro 5 a 8: duas coisas dentro de uma região, um campo do que está atrás dele, duas regiões de uma página e a borda do que tem o foco.'
    categories:
      title: Categorias
      description: 'Treze cores que não significam nada além de "não a que está ao lado": a série de um gráfico, os segmentos de uma distribuição, as etapas de um fluxo de trabalho. Nomeadas, não numeradas — um app escolhe `cat-mint` porque parece com hortelã — e cada uma uma escala como as outras, então uma categoria é usada da mesma forma que um estado é: seu fundo em 3, sua tinta em 11, preenchido em 9.'
  step:
    1: 'o fundo de uma região de trabalho'
    2: 'o fundo da página, ao redor e entre regiões'
    3: 'o fundo de um campo; o fundo sutil em que um estado se assenta'
    4: 'um controle elevado; um fundo sobrevoado'
    5: 'um cartão, um bloco — e sua borda discreta'
    6: 'uma borda'
    7: 'uma borda entre duas regiões'
    8: 'uma borda forte, um anel de foco'
    9: 'o todo da cor, preenchendo o que marca'
    10: 'o mesmo, sobrevoado'
    11: 'a cor como tinta, legível nos fundos'
    12: 'tinta forte — para o neutro, o texto em si'
  surface:
    zone: 'O fundo em que uma região de uma página se apoia'
    page: 'A própria página, e o que aparece entre as zonas'
    shell: 'Menu, cabeçalho, rodapé'
    one: 'Entradas e campos'
    two: 'Botões, barras de ferramentas'
    three: 'Blocos, cartões, modais'
    invert: 'Um controle se destacando ao adotar a cor do texto'
  text:
    default: 'O que está sendo lido'
    muted: 'Rótulos, meta, subtítulos'
    subtle: 'Separadores e estados vazios'

ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Цвета
  page_icon: 'ph:bold/palette'
  intro: 'Названия компонентов не указывают на цвет. Цвет живет в палитре, как шкалы из двенадцати тонов для светлого и темного фонов; цветовая схема определяет, каким образом читается страница; компонент выполняет роль — поверхность, граница, текст — что является одним местом на шкале. Кожа никогда не говорит о цвете. Переключите схему из заголовка, и каждый образец ниже переместится, не определяя ни один из них заново.'
  section:
    scales:
      title: Шкалы
      description: 'Палитра — это нейтральный, акцентный цвет — бренд — и четыре состояния, каждое из которых является шкалой из двенадцати тонов, расположенной так, как это делает Radix Themes и Material 3. Место на шкале означает одно и то же на каждой шкале и на обеих сторонах: для чего нужны приведенные ниже числа. Приложение приносит свою палитру, задавая свой акцент; каждая шкала следует за этим.'
    surfaces:
      title: Поверхности
      description: 'Основания, от области наружу — каждое из них является местом на нейтральной шкале. Светлая сторона панели упорядочивает их по светлоте до белого, темная сторона — по тому, насколько высоко каждое из них приподнято над землей.'
    text:
      title: Текст
      description: 'Три уровня внимания — нейтраль 12, 11 и 9: что читается, что это квалифицирует, и что присутствует только для поиска.'
    borders:
      title: Границы
      description: 'Четыре веса, различающиеся тем, что они разделяют — нейтраль 5 до 8: две вещи внутри одной области, поле от того, что за ним, две области страницы и кольцо того, что имеет фокус.'
    categories:
      title: Категории
      description: 'Тринадцать цветов, которые ничего не значат, кроме "не тот, что рядом": серия графика, сегменты распределения, этапы рабочего процесса. Названы, а не пронумерованы — приложение выбирает `cat-mint`, потому что он выглядит как мята — и каждая является шкалой, как и другие, так что категория носится так же, как состояние: ее основание на 3, ее чернила на 11, заполненные на 9.'
  step:
    1: 'основание рабочей области'
    2: 'основание страницы, вокруг и между регионами'
    3: 'основание поля; слабое основание, на котором сидит состояние'
    4: 'поднятый элемент управления; наведенное основание'
    5: 'карточка, блок — и его сдержанная граница'
    6: граница
    7: 'граница между двумя регионами'
    8: 'сильная граница, кольцо фокуса'
    9: 'цвет в целом, заполняя то, что он обозначает'
    10: 'то же самое, наведенное'
    11: 'цвет как чернила, читаемые на основаниях'
    12: 'сильные чернила — для нейтрального, самого текста'
  surface:
    zone: 'Земля, на которой стоит область страницы'
    page: 'Сама страница и то, что находится между зонами'
    shell: 'Меню, заголовок, нижний колонтитул'
    one: 'Вводы и поля'
    two: 'Кнопки, панели инструментов'
    three: 'Блоки, карточки, модальные окна'
    invert: 'Элемент управления выделяется, принимая цвет текста'
  text:
    default: 'Что читается'
    muted: 'Ярлыки, метаданные, подзаголовки'
    subtle: 'Разделители и пустые состояния'

th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: สี
  page_icon: 'ph:bold/palette'
  intro: 'ไม่มีชื่อของส่วนประกอบใดระบุสี สีอยู่ในพาเลตต์ เป็นสเกลของสิบสองโทนที่กำหนดสำหรับหน้าสว่างและหน้ามืด; แผนสีจะเลือกหน้าที่จะอ่านหน้า; ส่วนประกอบอ่านบทบาท — พื้นผิว ขอบ ข้อความ — ซึ่งเป็นตำแหน่งหนึ่งบนสเกล ผิวหนังไม่เคยบอกสี เปลี่ยนแผนจากส่วนหัวแล้วตัวอย่างทุกอันด้านล่างจะเคลื่อนที่โดยไม่มีอันใดที่ถูกกำหนดใหม่'
  section:
    scales:
      title: สเกล
      description: 'พาเลตต์คือกลางและเน้น — แบรนด์ — และสี่สถานะ แต่ละอันเป็นสเกลของสิบสองโทน ที่จัดเรียงเหมือนที่ Radix Themes และ Material 3 จัดสีไว้ ตำแหน่งบนสเกลหมายถึงสิ่งเดียวกันในทุกสเกลและทั้งสองหน้า: สิ่งที่ตัวเลขด้านล่างหมายถึง แอปพลิเคชันนำพาเลตต์ของมันโดยการให้เน้น; ทุกสเกลจะตาม'
    surfaces:
      title: พื้นผิว
      description: 'พื้นดิน จากภูมิภาคไปข้างนอก — แต่ละอันเป็นตำแหน่งบนสเกลกลาง หน้าสว่างของแดชบอร์ดจัดเรียงพวกมันตามความสว่างจนถึงสีขาว หน้าคมจัดเรียงตามระยะที่แต่ละอันยกขึ้นจากพื้น'
    text:
      title: ข้อความ
      description: 'ระดับความสนใจสามระดับ — กลาง 12, 11 และ 9: สิ่งที่ถูกอ่าน สิ่งที่มีคุณสมบัติ และสิ่งที่มีอยู่เพียงเมื่อมองหา'
    borders:
      title: ขอบ
      description: 'น้ำหนักสี่แบบ บอกความแตกต่างจากสิ่งที่มันแยก — กลาง 5 ถึง 8: สองสิ่งภายในภูมิภาคหนึ่ง ฟิลด์จากสิ่งที่อยู่ข้างหลังมัน สองภูมิภาคของหน้า และวงแหวนของสิ่งที่มีจุดสนใจ'
    categories:
      title: หมวดหมู่
      description: 'สีสิบสามสีที่ไม่มีความหมายอื่นนอกจาก "ไม่ใช่สีที่อยู่ข้างๆ": ชุดของแผนภูมิ ส่วนของการกระจาย ขั้นตอนของการทำงาน แอปจะเลือก `cat-mint` เพราะมันดูเหมือนมินต์ — และแต่ละอันเป็นสเกลเหมือนคนอื่นๆ ดังนั้นหมวดหมู่จะสวมใส่เหมือนสถานะ: พื้นที่ของมันที่ 3 หมึกของมันที่ 11 และเต็มที่ 9'
  step:
    1: พื้นของพื้นที่ทำงาน
    2: 'พื้นของหน้า รอบๆ และระหว่างภูมิภาค'
    3: 'พื้นของฟิลด์; พื้นอ่อนที่สถานะนั่งอยู่'
    4: 'การควบคุมที่ยกขึ้น; พื้นที่ที่ถูกชี้'
    5: 'การ์ด บล็อก — และขอบที่ละเอียดอ่อน'
    6: ขอบ
    7: ขอบระหว่างสองภูมิภาค
    8: 'ขอบที่แข็งแรง วงแวนที่มีจุดสนใจ'
    9: 'สีทั้งอัน เติมเต็มสิ่งที่มันทำเครื่องหมาย'
    10: 'เหมือนเดิม ที่ถูกชี้'
    11: 'สีในฐานะหมึก อ่านได้บนพื้น'
    12: 'หมึกที่แข็งแรง — สำหรับกลาง ข้อความเอง'
  surface:
    zone: พื้นดินที่ภูมิภาคของหน้าเพจตั้งอยู่
    page: 'หน้าเพจเอง และสิ่งที่แสดงระหว่างโซน'
    shell: 'เมนู, ส่วนหัว, ส่วนท้าย'
    one: ข้อมูลนำเข้าและฟิลด์
    two: 'ปุ่ม, แถบเครื่องมือ'
    three: 'บล็อก, การ์ด, โมดัล'
    invert: การควบคุมที่โดดเด่นโดยการใช้สีของข้อความ
  text:
    default: สิ่งที่กำลังอ่าน
    muted: 'ป้ายชื่อ, ข้อมูลเมตา, ซับไตเติล'
    subtle: ตัวแยกและสถานะว่าง

tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Renkler
  page_icon: 'ph:bold/palette'
  intro: 'Hiçbir bileşen bir renk adı vermez. Renk paletinde bulunur; açık ve koyu yüz için verilen on iki ton ölçeği olarak; renk şeması, sayfanın hangi yüzü okuyacağını seçer; bir bileşen bir rol okur — bir yüzey, bir kenar, bir metin — bu ölçek üzerinde bir yerdir. Cilt asla bir renk söylemez. Şemayı başlıktan değiştirin ve aşağıdaki her örnek, yeniden tanımlanmadan hareket eder.'
  section:
    scales:
      title: Ölçekler
      description: "Bir palet, nötr, bir vurgu — marka — ve her biri on iki tonun ölçeği olan dört durum, Radix Temaları ve Material 3'ün bir rengi düzenleme şekline göre yerleştirilmiştir. Bir ölçek üzerindeki bir yer, her ölçek ve her iki yüz için de aynıdır: aşağıdaki numaraların ne için olduğu. Bir uygulama, vurgusunu vererek paletini getirir; her ölçek bunu takip eder."
    surfaces:
      title: Yüzeyler
      description: 'Alanlar, bölgeden dışarıya — her biri nötr ölçeğinde bir yer. Gösterge panelinin açık yüzü, bunları beyaza kadar açık olma durumuna göre sıralar, koyu yüz ise her birinin yerden ne kadar yüksekte olduğunu gösterir.'
    text:
      title: Metin
      description: 'Üç dikkat seviyesi — nötr 12, 11 ve 9: okunan, onu nitelendiren ve yalnızca bakıldığında bulunan şey.'
    borders:
      title: Kenarlar
      description: "Ayrım yaptıkları şeylerle ayırt edilen dört ağırlık — nötr 5'ten 8'e: bir bölge içindeki iki şey, arkasındakinden bir alan, bir sayfanın iki bölgesi ve odaklanan şeyin halkası."
    categories:
      title: Kategoriler
      description: 'Yanındaki "değil" anlamına gelen on üç renk: bir grafiğin serisi, bir dağılımın segmentleri, bir iş akışının aşamaları. İsimlendirilmiş, numaralandırılmamış — bir uygulama `cat-mint` seçer çünkü nane gibi görünür — ve her biri diğerleri gibi bir ölçek, bu nedenle bir kategori, bir durum gibi giyilir: zemini 3, mürekkebi 11, dolu 9.'
  step:
    1: 'bir çalışma bölgesinin zemin'
    2: 'sayfanın zemin, bölgeler etrafında ve arasında'
    3: 'bir alanın zemini; bir durumun oturduğu hafif zemin'
    4: 'yükseltilmiş bir kontrol; üzerine gelmiş bir zemin'
    5: 'bir kart, bir blok — ve onun belirgin kenarı'
    6: 'bir kenar'
    7: 'iki bölge arasındaki bir kenar'
    8: 'güçlü bir kenar, odak halkası'
    9: 'rengin bütünlüğü, işaretlediği şeyi doldurur'
    10: 'aynısı, üzerine gelmiş'
    11: 'renk mürekkep olarak, zeminler üzerinde okunabilir'
    12: 'güçlü mürekkep — nötr için, metnin kendisi'
  surface:
    zone: 'Bir sayfa bölgesinin üzerinde durduğu zemin'
    page: 'Sayfanın kendisi ve bölgeler arasındaki gösterim'
    shell: 'Menü, başlık, alt bilgi'
    one: 'Girişler ve alanlar'
    two: 'Düğmeler, araç çubukları'
    three: 'Bloklar, kartlar, modallar'
    invert: 'Metnin rengini alarak öne çıkan bir kontrol'
  text:
    default: 'Okunan metin'
    muted: 'Etiketler, meta, alt başlıklar'
    subtle: 'Ayrıcılar ve boş durumlar'

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: رنگ
  page_icon: 'ph:bold/palette'
  intro: 'کوئی جزو رنگ کا نام نہیں دیتا۔ رنگ پیلیٹ میں رہتا ہے، بارہ سر tones کی پیمائش کے طور پر دی گئی روشنی کے چہرے اور تاریک چہرے کے لیے؛ رنگ سکیم یہ طے کرتی ہے کہ صفحہ کس چہرے سے پڑھتا ہے؛ ایک جزو ایک کردار پڑھتا ہے — ایک سطح، ایک سرحد، ایک متن — جو ایک پیمانے پر ایک مقام ہے۔ جلد کبھی رنگ نہیں بتاتی۔ ہیڈر سے سکیم سوئچ کریں اور نیچے ہر رنگ کا نمونہ بغیر ایک بھی دوبارہ تعریف کیے منتقل ہوتا ہے۔'
  section:
    scales:
      title: پیمائشیں
      description: 'ایک پیلیٹ ایک نیوٹرل، ایک ایکسنٹ — برانڈ — ہے اور چار حالتیں، ہر ایک بارہ سر tones کی پیمائش، اس طرح ترتیب دی گئی ہیں جیسے Radix Themes اور Material 3 رنگ ترتیب دیتے ہیں۔ پیمانے پر ایک جگہ ہر پیمانے پر اور دونوں چہروں پر ایک ہی معنی رکھتی ہے: نیچے دیے گئے نمبروں کا کیا استعمال ہے۔ ایک ایپ اپنی پیلیٹ کو اپنے ایکسنٹ دے کر لاتی ہے؛ ہر پیمائش اس کی پیروی کرتی ہے۔'
    surfaces:
      title: سطوح
      description: 'زمینیں، علاقہ سے باہر — ہر ایک نیوٹرل پیمانے پر ایک جگہ ہے۔ ڈیش بورڈ کا روشنی کا چہرہ انہیں روشنی کی بنیاد پر سفید تک ترتیب دیتا ہے، تاریک چہرہ یہ دیکھتا ہے کہ ہر ایک زمین سے کتنی دور ہے۔'
    text:
      title: متن
      description: 'توجہ کی تین سطحیں — نیوٹرل 12، 11 اور 9: کیا پڑھا جا رہا ہے، کیا اسے اہل کرتا ہے، اور کیا صرف تلاش کرنے پر ملتا ہے۔'
    borders:
      title: سرحدیں
      description: 'چار وزن، جو ان کو علیحدہ کرنے والی چیزوں سے ممتاز ہیں — نیوٹرل 5 سے 8: ایک علاقے کے اندر دو چیزیں، اس کے پیچھے سے ایک میدان، صفحے کے دو علاقے، اور وہ حلقہ جو توجہ میں ہے۔'
    categories:
      title: زمرے
      description: 'تیرہ رنگ جو صرف "اس کے ساتھ نہیں" کا مطلب رکھتے ہیں: ایک چارٹ کی سیریز، تقسیم کے حصے، ورک فلو کے مراحل۔ نامزد، نمبر نہیں — ایک ایپ `cat-mint` کو منتخب کرتی ہے کیونکہ یہ پودینے کی طرح نظر آتا ہے — اور ہر ایک دوسری طرح کی پیمائش کی مانند ہے، لہذا ایک زمرہ اسی طرح پہنا جاتا ہے جیسے ایک حالت: اس کی زمین 3 پر، اس کا سیاہی 11 پر، بھری ہوئی 9 پر۔'
  step:
    1: 'ایک کام کے علاقے کی زمین'
    2: 'صفحے کی زمین، علاقوں کے ارد گرد اور درمیان'
    3: 'ایک میدان کی زمین؛ ایک حالت جس پر ہلکی زمین ہے'
    4: 'ایک اونچا کنٹرول؛ ایک ہوا میں زمین'
    5: 'ایک کارڈ، ایک بلاک — اور اس کی مخصوص سرحد'
    6: 'ایک سرحد'
    7: 'دو علاقوں کے درمیان ایک سرحد'
    8: 'ایک مضبوط سرحد، توجہ کی انگوٹی'
    9: 'رنگ کا پورا، جو اسے نشان زد کرتا ہے بھرنا'
    10: 'وہی، ہوا میں'
    11: 'رنگ سیاہی کے طور پر، زمینوں پر پڑھنے کے قابل'
    12: 'مضبوط سیاہی — نیوٹرل کے لیے، خود متن'
  surface:
    zone: 'ایک صفحے کے علاقے کا زمین'
    page: 'صفحہ خود، اور جو زونز کے درمیان نظر آتا ہے'
    shell: 'مینیو، ہیڈر، فوٹر'
    one: 'ان پٹ اور فیلڈز'
    two: 'بٹن، ٹول بار'
    three: 'بلاک، کارڈز، موڈلز'
    invert: 'ایک کنٹرول جو متن کے رنگ کو لے کر نمایاں ہوتا ہے'
  text:
    default: 'کیا پڑھا جا رہا ہے'
    muted: 'لیبل، میٹا، ذیلی عنوانات'
    subtle: 'فاصلہ دار اور خالی حالتیں'

vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Màu sắc'
  page_icon: 'ph:bold/palette'
  intro: 'Không có thành phần nào chỉ định màu sắc. Màu sắc sống trong bảng màu, như các thang âm của mười hai tông được cung cấp cho mặt sáng và mặt tối; bảng màu sẽ chọn mặt nào mà trang đọc; một thành phần đọc một vai trò — một bề mặt, một đường viền, một văn bản — mà là một vị trí trên một thang. Da không bao giờ nói về màu sắc. Thay đổi bảng màu từ tiêu đề và mọi mẫu bên dưới đều di chuyển mà không cần định nghĩa lại một cái nào.'
  section:
    scales:
      title: 'Thang âm'
      description: 'Một bảng màu là một màu trung tính, một màu nổi bật — thương hiệu — và bốn trạng thái, mỗi trạng thái là một thang âm của mười hai tông, được sắp xếp theo cách mà Radix Themes và Material 3 trình bày màu sắc. Một vị trí trên một thang có nghĩa giống nhau trên mọi thang và trên cả hai mặt: những gì mà các số bên dưới chỉ đến. Một ứng dụng mang bảng màu của nó bằng cách cung cấp màu nổi bật; mọi thang đều theo sau.'
    surfaces:
      title: 'Bề mặt'
      description: 'Các nền tảng, từ khu vực ra ngoài — mỗi cái là một vị trí trên thang trung tính. Mặt sáng của bảng điều khiển sắp xếp chúng theo độ sáng cho đến màu trắng, mặt tối theo mức độ mà mỗi cái được nâng lên khỏi mặt đất.'
    text:
      title: 'Văn bản'
      description: 'Ba mức độ chú ý — trung tính 12, 11 và 9: những gì đang được đọc, những gì đủ điều kiện cho nó, và những gì chỉ xuất hiện khi được tìm kiếm.'
    borders:
      title: 'Đường viền'
      description: 'Bốn trọng lượng, phân biệt bởi những gì chúng tách biệt — trung tính 5 đến 8: hai thứ bên trong một khu vực, một trường từ những gì ở phía sau nó, hai khu vực của một trang, và vòng tròn của những gì có sự tập trung.'
    categories:
      title: 'Danh mục'
      description: 'Mười ba màu sắc chỉ có nghĩa là "không phải cái bên cạnh": chuỗi của một biểu đồ, các phân đoạn của một phân phối, các giai đoạn của một quy trình công việc. Được đặt tên, không được đánh số — một ứng dụng chọn `cat-mint` vì nó trông giống như bạc hà — và mỗi cái là một thang giống như những cái khác, vì vậy một danh mục được thể hiện như một trạng thái: nền của nó ở 3, mực của nó ở 11, được lấp đầy ở 9.'
  step:
    1: 'nền của khu vực làm việc'
    2: 'nền của trang, xung quanh và giữa các khu vực'
    3: 'nền của một trường; nền mờ mà một trạng thái ngồi trên đó'
    4: 'một điều khiển được nâng lên; một nền khi di chuột qua'
    5: 'một thẻ, một khối — và đường viền riêng của nó'
    6: 'một đường viền'
    7: 'một đường viền giữa hai khu vực'
    8: 'một đường viền mạnh, một vòng tập trung'
    9: 'màu sắc tổng thể, lấp đầy những gì nó đánh dấu'
    10: 'cái tương tự, khi di chuột qua'
    11: 'màu sắc như mực, có thể đọc được trên các nền'
    12: 'mực đậm — cho màu trung tính, chính văn bản'
  surface:
    zone: 'Nền mà một khu vực của trang đứng trên'
    page: 'Trang chính nó, và những gì hiển thị giữa các vùng'
    shell: 'Menu, tiêu đề, chân trang'
    one: 'Các trường nhập liệu'
    two: 'Nút, thanh công cụ'
    three: 'Khối, thẻ, hộp thoại'
    invert: 'Một điều khiển nổi bật bằng cách lấy màu sắc của văn bản'
  text:
    default: 'Những gì đang được đọc'
    muted: 'Nhãn, meta, phụ đề'
    subtle: 'Các dấu phân cách và trạng thái trống'

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 颜色
  page_icon: 'ph:bold/palette'
  intro: 没有组件名称颜色。颜色存在于调色板中，以给定的浅色和深色的十二种色调的比例；配色方案选择页面的阅读面；组件读取一个角色——一个表面、一个边框、一个文本——这在一个比例上的一个位置。皮肤从不显示颜色。从标题切换方案，下面的每个色板都会移动，而没有一个被重新定义。
  section:
    scales:
      title: 比例
      description: '调色板是中性色和强调色——品牌——以及四种状态，每种状态都是十二种色调的比例，按照 Radix Themes 和 Material 3 的颜色布局。比例上的一个位置在每个比例和两个面上都是相同的：下面的数字就是它的意义。应用程序通过提供其强调色来带来其调色板；每个比例都遵循。'
    surfaces:
      title: 表面
      description: 区域外的基础——每一个都是中性比例上的一个位置。仪表盘的浅色面按亮度排序，直到白色，深色面则根据每个基础离地面的高度排序。
    text:
      title: 文本
      description: '三种关注级别——中性 12、11 和 9：正在阅读的内容、对其的修饰，以及仅在寻找时才会被发现的内容。'
    borders:
      title: 边框
      description: '四种重量，通过它们所分隔的内容区分——中性 5 到 8：一个区域内的两个事物、一个场地与其背后的内容、页面的两个区域，以及聚焦的环。'
    categories:
      title: 类别
      description: '十三种颜色，意味着除了‘旁边的那个’什么也不是：图表的系列、分布的段、工作流的阶段。命名，而不是编号——应用程序选择 `cat-mint` 是因为它看起来像薄荷——每个都是与其他相似的比例，因此类别的表现就像状态一样：其基础在 3，其墨水在 11，填充在 9。'
  step:
    1: 工作区域的基础
    2: 页面的基础，区域之间和周围
    3: 一个场地的基础；状态所处的微弱基础
    4: 一个提升的控制；一个悬停的基础
    5: 一张卡片，一个块——及其细微的边框
    6: 一个边框
    7: 两个区域之间的边框
    8: 一个强边框，一个聚焦环
    9: 整个颜色，填充其标记的内容
    10: 同样的，悬停
    11: 作为墨水的颜色，可在基础上读取
    12: 强墨水——用于中性，文本本身
  surface:
    zone: 页面区域所站立的基础
    page: 页面本身，以及区域之间显示的内容
    shell: 菜单、标题、页脚
    one: 输入和字段
    two: 按钮、工具栏
    three: 区块、卡片、模态
    invert: 一个通过采用文本颜色而突出的控制
  text:
    default: 正在阅读的内容
    muted: 标签、元数据、副标题
    subtle: 分隔符和空状态
