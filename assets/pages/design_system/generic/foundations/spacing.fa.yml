~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: فاصله
page_icon: 'ph:bold/ruler'
intro: 'دو مقیاس و یک قاعده. یک شکل هرگز یک طول را نمی‌نویسد: بلکه یک گام را طی می‌کند، که باعث می‌شود دو مؤلفه‌ای که یک سال فاصله دارند، دو پیکسل از ریتم خارج نشوند.'
section:
  space:
    title: 'گام‌های فاصله'
    description: 'نه گام، از یک خط باریک تا حاشیه صفحه. فضای خالی، فاصله‌ها و حاشیه‌ها همه از اینجا می‌آیند — یک مقدار بین دو گام، مقداری است که هنوز تصمیم‌گیری نشده است.'
  size:
    title: اندازه‌ها
    description: 'عرض‌ها و ارتفاع‌هایی که به یک منطقه داده می‌شود: یک ستون، یک پنل، یک اندازه‌گیری خواندن. بزرگتر از یک گام فاصله و برای همان دلیل استفاده می‌شود.'
  density:
    title: چگالی
    description: 'فشردگی متعلق به یک منطقه است و نه به یک ویجت. یک نوار که فشرده اعلام شده، آنچه را که در خود دارد نیز فشرده می‌کند، زیرا توکن‌هایی که آن را حمل می‌کنند، ارث می‌برند — هیچ مؤلفه‌ای در زیر گفته نمی‌شود که کجا قرار دارد.'
density:
  roomy: 'یک نوار ابزار با چگالی خود و دکمه‌هایی که در آن دارد'
  compact: 'همان نوار ابزار که فشرده اعلام شده — هیچ چیزی درباره دکمه‌ها گفته نشده است'
  marker: 'یک منطقه که فشرده اعلام شده بدون اینکه شکل خود را داشته باشد'
  action: ایجاد
  other: به‌روزرسانی
