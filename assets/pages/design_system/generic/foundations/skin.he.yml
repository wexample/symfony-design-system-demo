~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: עור
page_icon: 'ph:bold/paint-brush'
intro: 'איך הדברים נראים, לאחר שהצבע והצפיפות נקבעו: הפינות, העומק, הקווים. הטוקנים הללו הם ציר ה`עור` של הנושא — העור ברירת המחדל הוא מה שהעמוד הזה מציג, ועור אחר הוא קובץ אחר שמגדיר את אותם שמות, בלי לשנות כלום למטה.'
section:
  radius:
    title: רדיוסים
    description: 'אין, ואז ארבעה שלבים כל אחד כפול מהשלב שלמטה, ואז גלולה. שני שלבים בנפרד הם אותו מרחק בכל מקום שבו אתה עומד על הסקלה, וזה מה שעושה אותו קריא. השלב הראשון כמעט ולא מורגש בכוונה: זה מה שעור שטוח רוצה כאשר זווית נכונה באמת נראית לא גמורה. כל דבר עגול יותר מהשלב האחרון הוא צורה שרוצה להיות מעגל ואומר את זה בעצמה — מעגל הוא לא החלטת עור.'
  role:
    title: 'תפקידי רדיוס'
    description: 'צורה לעולם לא קוראת את הסקלה למעלה: היא קוראת את התפקיד שהיא ממלאה, ועור אומר איזה שלב התפקיד הזה מקבל — אף פעם לא מה שווה שלב, מה שהיה גורם לסקלה משמעות לשני דברים בו זמנית. מה שמחזיק משהו הוא תיבה, בין אם היא מחזיקה טקסט, תוכן או הודעה; מה שמפריד בין שני אזורים של עמוד הוא לא זה ולא זה, ולא מעגל שום דבר. החלף את העור ל`רך` וצפה בחלק בקרה נפרד מהשאר: קפסולה מתאימה למשהו בגובה שורה אחת ומגוחכת עבור textarea.'
  shadow:
    title: צללים
    description: 'ארבעה עומקים, מהגבהה דקה ועד פאנל צף. עור שרוצה עולם שטוח קובע את ארבעתם לא ולא כל משטח מוגבה עוקב אחרי זה.'
  border:
    title: גבולות
    description: 'הקו עצמו — רוחבו וסגנונו. הצבע שלו לא כאן: זה שייך לסכמת הצבעים, שהיא מה שמאפשר לעור להסיר קו מבלי לדעת באיזה צבע הוא היה.'
  separator:
    title: 'מפרידים ואזורים'
    description: 'שני הקווים שמפרידים דברים: בין שתי שורות של דבר אחד, ובין שני אזורים של עמוד. כעשרים צורות קוראות את הראשון, ולכן הוא טוקן ולא כלל.'
separator:
  row: 'שורה בין אחרות'
  region: 'אזור של העמוד, מגודר כך'
role:
  control: 'גובה שורה אחת, ודחוס'
  box: 'מחזיק משהו'
  media: 'תמונות ודמויות'
  pill: 'מה שנקרא כקפסולה'
