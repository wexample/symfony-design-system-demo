en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Tree
  page_icon: ph:bold/tree-structure

  section:
    default:
      title: File explorer
      description: "Nesting is the whole structure: an item opens when it carries open, and its depth is what indents the row while the highlight still spans the full width."
    vue:
      title: Vue
      description: "Same markup, same shape, but the folders open and close: the chevron is what folds a node, and a click anywhere else on the row selects the item and sends it up as a select event."
    vue_workspace:
      title: Vue, in a workspace
      description: "The explorer as an app ships it: the vue tree in the scrollable zone of a split, holding more rows than the zone is tall and longer names than it is wide. The zone scrolls on both axes and the horizontal bar stays at its floor, whatever the last row is."
    plain:
      title: Without icons
      description: "The shape knows nothing about files — an item with no icon and no link renders as plain text."

  explorer:
    scope:
      project: Project
      packages: Packages
      scratches: Scratches
      changed: Changed Files
    option:
      filters: Filters
      sort: Sort by name
      hidden: Show hidden files
    action:
      new: New file
      locate: Select opened file
      collapse: Collapse all
    body: "The tree carries no width and no height of its own: the zone beside it is an ordinary one, and each side scrolls alone."

  plain:
    root: Root
    child: First child
    sibling: Second child

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: شجرة
  page_icon: 'ph:bold/هيكل-الشجرة'
  section:
    default:
      title: 'مستعرض الملفات'
      description: 'التعشيش هو الهيكل الكامل: عنصر يفتح عندما يحمل مفتوحًا، وعمقه هو ما يحدد مسافة السطر بينما لا يزال التمييز يمتد عبر العرض الكامل.'
    vue:
      title: فيو
      description: 'نفس الشيفرة، نفس الشكل، لكن المجلدات تفتح وتغلق: السهم هو ما يطوي عقدة، ونقرة في أي مكان آخر على السطر تحدد العنصر وترسله كحدث اختيار.'
    vue_workspace:
      title: 'فيو، في مساحة عمل'
      description: 'يتم شحن المستعرض كتطبيق: شجرة الفيو في المنطقة القابلة للتمرير في تقسيم، تحمل المزيد من الصفوف مما تكون عليه المنطقة ارتفاعًا وأسماء أطول مما هي عرضًا. المنطقة تمرر على كلا المحورين ويظل الشريط الأفقي عند أرضيته، بغض النظر عن آخر صف.'
    plain:
      title: 'بدون أيقونات'
      description: 'الشكل لا يعرف شيئًا عن الملفات - عنصر بدون أيقونة وبدون رابط يظهر كنص عادي.'
  explorer:
    scope:
      project: مشروع
      packages: حزم
      scratches: خربشات
      changed: 'ملفات متغيرة'
    option:
      filters: مرشحات
      sort: 'ترتيب حسب الاسم'
      hidden: 'عرض الملفات المخفية'
    action:
      new: 'ملف جديد'
      locate: 'تحديد الملف المفتوح'
      collapse: 'طي الكل'
    body: 'الشجرة لا تحمل عرضًا ولا ارتفاعًا خاصين بها: المنطقة بجانبها هي منطقة عادية، وكل جانب يمرر بمفرده.'
  plain:
    root: الجذر
    child: 'الطفل الأول'
    sibling: 'الطفل الثاني'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: গাছ
  page_icon: 'ph:bold/tree-structure'
  section:
    default:
      title: 'ফাইল এক্সপ্লোরার'
      description: 'নেস্টিং পুরো কাঠামো: একটি আইটেম খোলার সময় খোলে, এবং এর গভীরতা সারিকে ইনডেন্ট করে যতক্ষণ হাইলাইট পুরো প্রস্থ জুড়ে থাকে।'
    vue:
      title: ভিউ
      description: 'একই মার্কআপ, একই আকার, কিন্তু ফোল্ডারগুলো খোলে এবং বন্ধ হয়: শেভ্রন একটি নোডকে ভাঁজ করে, এবং সারির অন্য কোথাও ক্লিক করলে আইটেমটি নির্বাচন হয় এবং একটি নির্বাচন ইভেন্ট হিসেবে উপরে পাঠানো হয়।'
    vue_workspace:
      title: 'ভিউ, একটি কর্মক্ষেত্রে'
      description: 'একটি অ্যাপ হিসেবে এক্সপ্লোরার এটি প্রেরণ করে: স্ক্রলযোগ্য জোনে ভিউ গাছ, যেখানে অঞ্চলের উচ্চতা থেকে বেশি সারি এবং প্রস্থ থেকে বড় নাম রয়েছে। অঞ্চলটি উভয় অক্ষে স্ক্রল করে এবং অনুভূমিক বারটি তার তলায় থাকে, শেষ সারি যাই হোক না কেন।'
    plain:
      title: 'আইকন ছাড়া'
      description: 'আকারটি ফাইল সম্পর্কে কিছু জানে না — একটি আইকন এবং কোন লিঙ্ক ছাড়া একটি আইটেম সাধারণ টেক্সট হিসেবে প্রদর্শিত হয়।'
  explorer:
    scope:
      project: প্রকল্প
      packages: প্যাকেজসমূহ
      scratches: স্ক্র্যাচ
      changed: 'পরিবর্তিত ফাইল'
    option:
      filters: ফিল্টার
      sort: 'নামের দ্বারা সাজান'
      hidden: 'গোপন ফাইলগুলি দেখান'
    action:
      new: 'নতুন ফাইল'
      locate: 'খোলা ফাইল নির্বাচন করুন'
      collapse: 'সবগুলো সংকুচিত করুন'
    body: 'গাছটির নিজস্ব কোন প্রস্থ এবং উচ্চতা নেই: এর পাশে অঞ্চলটি একটি সাধারণ অঞ্চল, এবং প্রতিটি পাশ এককভাবে স্ক্রল করে।'
  plain:
    root: মূল
    child: 'প্রথম শিশু'
    sibling: 'দ্বিতীয় শিশু'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Baum
  page_icon: 'ph:bold/tree-structure'
  section:
    default:
      title: Dateiexplorer
      description: 'Die Verschachtelung ist die gesamte Struktur: Ein Element öffnet sich, wenn es geöffnet ist, und seine Tiefe ist es, die die Zeile einrückt, während die Hervorhebung weiterhin die gesamte Breite einnimmt.'
    vue:
      title: Vue
      description: 'Gleiche Markup, gleiche Form, aber die Ordner öffnen und schließen sich: Das Chevron ist das, was einen Knoten faltet, und ein Klick irgendwo sonst in der Zeile wählt das Element aus und sendet es als Auswahlereignis nach oben.'
    vue_workspace:
      title: 'Vue, in einem Arbeitsbereich'
      description: 'Der Explorer als App wird so geliefert: der vue Baum im scrollbaren Bereich eines Splits, der mehr Zeilen hält, als der Bereich hoch ist, und längere Namen als er breit ist. Der Bereich scrollt in beide Achsen und die horizontale Leiste bleibt am Boden, egal wo die letzte Zeile ist.'
    plain:
      title: 'Ohne Icons'
      description: 'Die Form kennt nichts über Dateien — ein Element ohne Icon und ohne Link wird als Klartext angezeigt.'
  explorer:
    scope:
      project: Projekt
      packages: Pakete
      scratches: Notizen
      changed: 'Geänderte Dateien'
    option:
      filters: Filter
      sort: 'Nach Name sortieren'
      hidden: 'Versteckte Dateien anzeigen'
    action:
      new: 'Neue Datei'
      locate: 'Öffnete Datei auswählen'
      collapse: 'Alle einklappen'
    body: 'Der Baum hat keine eigene Breite und Höhe: Der Bereich neben ihm ist ein gewöhnlicher, und jede Seite scrollt für sich allein.'
  plain:
    root: Wurzel
    child: 'Erstes Kind'
    sibling: 'Zweites Kind'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Árbol
  page_icon: 'ph:bold/estructura-de-arbol'
  section:
    default:
      title: 'Explorador de archivos'
      description: 'La anidación es toda la estructura: un ítem se abre cuando lleva abierto, y su profundidad es lo que sangra la fila mientras el resaltado aún abarca todo el ancho.'
    vue:
      title: Vue
      description: 'El mismo marcado, la misma forma, pero las carpetas se abren y cierran: el chevron es lo que pliega un nodo, y un clic en cualquier otro lugar de la fila selecciona el ítem y lo envía como un evento de selección.'
    vue_workspace:
      title: 'Vue, en un espacio de trabajo'
      description: 'El explorador como una app se envía así: el árbol de vue en la zona desplazable de un dividido, manteniendo más filas de las que la zona es alta y nombres más largos de lo que es ancho. La zona se desplaza en ambos ejes y la barra horizontal permanece en su suelo, sea cual sea la última fila.'
    plain:
      title: 'Sin íconos'
      description: 'La forma no sabe nada sobre archivos: un ítem sin ícono y sin enlace se renderiza como texto plano.'
  explorer:
    scope:
      project: Proyecto
      packages: Paquetes
      scratches: Borradores
      changed: 'Archivos cambiados'
    option:
      filters: Filtros
      sort: 'Ordenar por nombre'
      hidden: 'Mostrar archivos ocultos'
    action:
      new: 'Nuevo archivo'
      locate: 'Seleccionar archivo abierto'
      collapse: 'Colapsar todo'
    body: 'El árbol no tiene ancho ni alto propio: la zona a su lado es una ordinaria, y cada lado se desplaza por separado.'
  plain:
    root: Raíz
    child: 'Primer hijo'
    sibling: 'Segundo hijo'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: درخت
  page_icon: 'ph:bold/tree-structure'
  section:
    default:
      title: 'مدیر فایل'
      description: 'تودرتویی کل ساختار است: یک آیتم زمانی باز می‌شود که باز باشد و عمق آن ردیف را تو رفتگی می‌دهد در حالی که هایلایت هنوز عرض کامل را پوشش می‌دهد.'
    vue:
      title: Vue
      description: 'همان نشانه‌گذاری، همان شکل، اما پوشه‌ها باز و بسته می‌شوند: فلش است که یک گره را تا می‌کند و کلیک در هر نقطه دیگری از ردیف، آیتم را انتخاب کرده و آن را به عنوان یک رویداد انتخابی ارسال می‌کند.'
    vue_workspace:
      title: 'Vue، در یک فضای کاری'
      description: 'مدیر به عنوان یک اپلیکیشن ارائه می‌شود: درخت vue در منطقه قابل اسکرول یک تقسیم، که ردیف‌های بیشتری از ارتفاع منطقه دارد و نام‌های طولانی‌تری از عرض آن. این منطقه در هر دو محور اسکرول می‌شود و نوار افقی در کف خود باقی می‌ماند، هرچه آخرین ردیف باشد.'
    plain:
      title: 'بدون آیکون'
      description: 'شکل هیچ اطلاعاتی درباره فایل‌ها ندارد — یک آیتم بدون آیکون و بدون لینک به عنوان متن ساده نمایش داده می‌شود.'
  explorer:
    scope:
      project: پروژه
      packages: بسته‌ها
      scratches: یادداشت‌ها
      changed: 'فایل‌های تغییر یافته'
    option:
      filters: فیلترها
      sort: 'مرتب‌سازی بر اساس نام'
      hidden: 'نمایش فایل‌های مخفی'
    action:
      new: 'فایل جدید'
      locate: 'انتخاب فایل باز شده'
      collapse: 'بستن همه'
    body: 'درخت هیچ عرض و ارتفاعی به خودی خود ندارد: منطقه کناری آن یک منطقه عادی است و هر طرف به تنهایی اسکرول می‌شود.'
  plain:
    root: ریشه
    child: 'فرزند اول'
    sibling: 'فرزند دوم'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Puu
  page_icon: 'ph:bold/tree-structure'
  section:
    default:
      title: Tiedostonhallinta
      description: 'Pesiminen on koko rakenne: kohde avautuu, kun se on auki, ja sen syvyys on se, mikä siirtää riviä vasemmalle, samalla kun korostus kattaa koko leveyden.'
    vue:
      title: Vue
      description: 'Sama merkintä, sama muoto, mutta kansiot avautuvat ja sulkeutuvat: nuoli on se, joka taittaa solmua, ja napsautus mihin tahansa muuhun kohtaan rivillä valitsee kohteen ja lähettää sen valintatapahtumana.'
    vue_workspace:
      title: 'Vue, työtilassa'
      description: 'Tutkija sovelluksena on sellainen: vue-puu vieritettävässä vyöhykkeessä jakautumisen sisällä, pitäen enemmän rivejä kuin vyöhyke on korkea ja pidempiä nimiä kuin se on leveä. Vyöhyke vierittää molemmissa akselissa ja vaakasuora palkki pysyy pohjassa, riippumatta siitä, mikä viimeinen rivi on.'
    plain:
      title: 'Ilman kuvakkeita'
      description: 'Muoto ei tiedä mitään tiedostoista — kohde ilman kuvaketta ja linkkiä näkyy tavallisena tekstinä.'
  explorer:
    scope:
      project: Projektit
      packages: Paketteja
      scratches: Luonnokset
      changed: 'Muutetut tiedostot'
    option:
      filters: Suodattimet
      sort: 'Järjestä nimen mukaan'
      hidden: 'Näytä piilotetut tiedostot'
    action:
      new: 'Uusi tiedosto'
      locate: 'Valitse avoin tiedosto'
      collapse: 'Kollapsoi kaikki'
    body: 'Puu ei omaa leveyttä eikä korkeutta: sen vieressä oleva vyöhyke on tavallinen, ja kumpikin puoli vierittää itsenäisesti.'
  plain:
    root: Juuri
    child: 'Ensimmäinen lapsi'
    sibling: 'Toinen lapsi'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Arbre
  page_icon: 'ph:bold/tree-structure'
  section:
    default:
      title: 'Explorateur de fichiers'
      description: "L'imbrication est toute la structure : un élément s'ouvre lorsqu'il est ouvert, et sa profondeur est ce qui indent le rang tandis que le surlignage s'étend toujours sur toute la largeur."
    vue:
      title: Vue
      description: "Même balisage, même forme, mais les dossiers s'ouvrent et se ferment : le chevron est ce qui plie un nœud, et un clic n'importe où sur le rang sélectionne l'élément et l'envoie comme un événement de sélection."
    vue_workspace:
      title: 'Vue, dans un espace de travail'
      description: "L'explorateur en tant qu'application l'expédie : l'arbre vue dans la zone défilable d'un split, contenant plus de rangées que la zone n'est haute et des noms plus longs qu'elle n'est large. La zone défile sur les deux axes et la barre horizontale reste à son niveau, peu importe quelle est la dernière rangée."
    plain:
      title: 'Sans icônes'
      description: "La forme ne connaît rien des fichiers — un élément sans icône et sans lien s'affiche comme du texte brut."
  explorer:
    scope:
      project: Projet
      packages: Paquets
      scratches: Griffonnages
      changed: 'Fichiers modifiés'
    option:
      filters: Filtres
      sort: 'Trier par nom'
      hidden: 'Afficher les fichiers cachés'
    action:
      new: 'Nouveau fichier'
      locate: 'Sélectionner le fichier ouvert'
      collapse: 'Réduire tout'
    body: "L'arbre ne possède ni largeur ni hauteur propres : la zone à côté est ordinaire, et chaque côté défile seul."
  plain:
    root: Racine
    child: 'Premier enfant'
    sibling: 'Deuxième enfant'

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: עץ
  page_icon: 'ph:bold/tree-structure'
  section:
    default:
      title: 'מנהל קבצים'
      description: 'ההשראה היא כל המבנה: פריט נפתח כשיש לו פתיחה, ועומקו הוא מה שמעבה את השורה בעוד שההדגשה עדיין נפרסת על כל רוחב.'
    vue:
      title: Vue
      description: 'אותה תבנית, אותה צורה, אבל התיקיות נפתחות וסוגרות: החץ הוא מה שמקפל צומת, ולחיצה בכל מקום אחר בשורה בוחרת את הפריט ושולחת אותו כאירוע בחירה.'
    vue_workspace:
      title: 'Vue, בתוך חלל עבודה'
      description: 'המנהל כאפליקציה מגיע כך: עץ הוּה בשטח הגלילה של חלון מחולק, מחזיק יותר שורות מגובה האזור ושמות ארוכים יותר מרוחבו. האזור גולל בשני הצירים והסרגל האופקי נשאר בתחתיתו, לא משנה מהי השורה האחרונה.'
    plain:
      title: 'ללא אייקונים'
      description: 'הצורה אינה יודעת דבר על קבצים — פריט ללא אייקון וללא קישור מוצג כטקסט פשוט.'
  explorer:
    scope:
      project: פרויקט
      packages: חבילות
      scratches: שרטוטים
      changed: 'קבצים שהשתנו'
    option:
      filters: מסננים
      sort: 'מיין לפי שם'
      hidden: 'הצג קבצים מוסתרים'
    action:
      new: 'קובץ חדש'
      locate: 'בחר קובץ פתוח'
      collapse: 'מזער הכל'
    body: 'העץ אינו נושא רוחב או גובה משלו: האזור לידו הוא אזור רגיל, וכל צד גולל בפני עצמו.'
  plain:
    root: שורש
    child: 'ילד ראשון'
    sibling: 'ילד שני'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: पेड़
  page_icon: 'ph:bold/tree-structure'
  section:
    default:
      title: 'फ़ाइल अन्वेषक'
      description: 'नैस्टिंग पूरी संरचना है: एक आइटम तब खुलता है जब यह खुला होता है, और इसकी गहराई वह होती है जो पंक्ति को इंडेंट करती है जबकि हाइलाइट अभी भी पूरी चौड़ाई को फैला हुआ है।'
    vue:
      title: व्यू
      description: 'एक समान मार्कअप, एक समान आकार, लेकिन फ़ोल्डर खुलते और बंद होते हैं: चिवर एक नोड को मोड़ता है, और पंक्ति पर कहीं और क्लिक करने से आइटम का चयन होता है और इसे चयन घटना के रूप में भेजा जाता है।'
    vue_workspace:
      title: 'व्यू, एक कार्यक्षेत्र में'
