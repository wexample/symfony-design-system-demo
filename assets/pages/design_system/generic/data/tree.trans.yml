      description: 'Cùng một đánh dấu, cùng một hình dạng, nhưng các thư mục mở và đóng: biểu tượng mũi tên là thứ gập một nút, và một cú nhấp chuột ở bất kỳ đâu trên hàng sẽ chọn mục và gửi nó lên như một sự kiện chọn.'
    vue_workspace:
      title: 'Vue, trong một không gian làm việc'
