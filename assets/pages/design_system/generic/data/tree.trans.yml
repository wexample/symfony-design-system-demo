      description: 'ایک جیسا مارک اپ، ایک جیسا شکل، لیکن فولڈرز کھلتے اور بند ہوتے ہیں: چیورون وہی ہے جو نوڈ کو فولڈ کرتا ہے، اور قطار میں کہیں بھی کلک کرنے سے آئٹم منتخب ہوتا ہے اور اسے منتخب ایونٹ کے طور پر اوپر بھیجتا ہے۔'
    vue_workspace:
      title: 'ویو، ورک اسپیس میں'
