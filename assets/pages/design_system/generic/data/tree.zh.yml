~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 树
page_icon: 'ph:bold/tree-structure'
section:
  default:
    title: 文件浏览器
    description: 嵌套是整个结构：一个项目在打开时会展开，其深度决定了行的缩进，而高亮仍然跨越整个宽度。
  vue:
    title: Vue
    description: 相同的标记，相同的形状，但文件夹可以打开和关闭：箭头是折叠节点的标志，行上其他地方的点击选择该项目并作为选择事件发送。
  vue_workspace:
    title: 在工作区中的Vue
    description: 浏览器作为应用程序提供：可滚动区域中的vue树，包含的行数比区域的高度多，名称比宽度长。该区域在两个轴上滚动，水平条保持在其底部，无论最后一行是什么。
  plain:
    title: 没有图标
    description: 形状对文件一无所知——没有图标和链接的项目呈现为纯文本。
explorer:
  scope:
    project: 项目
    packages: 软件包
    scratches: 草稿
    changed: 已更改的文件
  option:
    filters: 过滤器
    sort: 按名称排序
    hidden: 显示隐藏文件
  action:
    new: 新文件
    locate: 选择已打开的文件
    collapse: 全部折叠
  body: 树本身没有宽度和高度：旁边的区域是普通区域，每一侧单独滚动。
plain:
  root: 根
  child: 第一个子项
  sibling: 第二个子项
