~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Bilah
page_icon: 'ph:bold/rows'
intro: 'Sebuah bilah menyebutkan satu hal dalam satu baris: apa itu, apa namanya, apa yang memenuhi syaratnya, dan apa yang berada di ujung jauh. Ini adalah bentuk, bukan ikatan — sebuah entitas mencapainya melalui templatenya sendiri, tetapi hasil pencarian yang merupakan file, aplikasi, atau pengaturan menggunakan markup yang sama.'
finding:
  fix: Perbaiki
  date: 'Tentukan tanggal'
  error:
    title: 'Bagian wajib “Tujuan” hilang'
    subtitle: 01-PROSES/PR-004-kontrol-dokumen.md
  warning:
    title: 'Tanggal tinjauan sudah lewat'
    subtitle: '01-PROSES/PR-004-kontrol-dokumen.md:4'
  info:
    title: 'Kolom pemilik dibiarkan kosong'
    subtitle: 'Tidak menghalangi untuk draf, diperlukan sebelum tinjauan'
section:
  findings:
    title: Temuan
    description: 'Apa yang dilaporkan oleh analisis, satu bilah masing-masing: temuan sebagai judul, di mana itu sebagai subtitle, dan apa yang dapat dilakukan tentangnya di slot akhir — tidak ada di sana ketika tidak ada yang dapat dilakukan di sini. Tingkat keparahan adalah nada blok, yang juga diambil oleh avatar di bagian atas.'
  alone:
    title: 'Bilah itu sendiri'
    description: 'Semuanya kecuali judul adalah opsional. Slot utama mengambil ikon, atau markup apa pun ketika avatar nyata diperlukan; slot akhir mengambil tanggal, tag, atau baris tombol. Diberikan sebuah tautan, seluruh lebar menjadi target dan judul mempertahankan warna tempat ia berada.'
  search:
    title: 'Daftar hasil'
    description: 'Daftar membawa bingkai, kolom pencarian dan pemisah; setiap baris membawa sebuah bilah. Tidak ada di sini yang merupakan entitas — itu adalah intinya: baris yang sama melayani orang, dokumen, aplikasi, dan preferensi.'
  surfaces:
    title: 'Satu permukaan masing-masing'
    description: 'Pembacaan lain dari daftar — tidak ada latar belakang yang dibagikan dan tidak ada garis, setiap bilah berdiri di bloknya sendiri dengan ruang di sekelilingnya. Tidak ada yang baru untuk ditata, bilah hanya mengambil kelas blok, dan diberikan sebuah tautan seluruh kartu menjadi target.'
  divided:
    title: 'Daftar kosong'
    description: 'Ketika bingkai sudah ada, tumpukan vertikal dengan pemisah sudah cukup — tidak ada bentuknya sendiri, hanya garis antara dua baris.'
  vue:
    title: 'Daftar mereka, dalam Vue'
    description: 'Baris yang sama dibaca dari titik akhir daripada ditulis: daftar memuat halaman, pagination, dan keadaan kosong, dan setiap entitas mengatakan apa yang harus dibaca di dalamnya — sebuah judul, apa yang memenuhi syaratnya, sebuah ikon, ke mana ia mengarah, sebuah tanggal di ujung jauh. Pembacaan di atas adalah variannya, `dibagi` lalu `permukaan`.'
  keeping_up:
    title: 'Dan tetap diperbarui'
    description: 'Daftar bilah adalah koleksi seperti lainnya, jadi tiga cara sebuah koleksi mendengar bahwa dunia telah bergerak maju terbuka untuknya: acara aplikasi, sumber langsung, polling. Yang ini mendengarkan sebuah acara — bunyikan dan lihat baris kembali. Lihat Menjaga agar tetap diperbarui untuk ketiganya berdampingan.'
