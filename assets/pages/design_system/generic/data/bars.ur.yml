section:
  findings:
    title: نتائج
    description: 'ایک تجزیے کی رپورٹ، ایک بار ہر ایک: نتیجہ عنوان کے طور پر، یہ کہاں ہے ذیلی عنوان کے طور پر، اور اس کے بارے میں کیا کیا جا سکتا ہے پچھلے حصے میں — جب کچھ نہیں کیا جا سکتا تو وہاں کچھ نہیں۔ شدت بلاک کا لہجہ ہے، جو سر کی اوپر موجود اوتار بھی لیتا ہے۔'
  alone:
    title: 'بار خود'
    description: 'عنوان کے علاوہ سب کچھ اختیاری ہے۔ ابتدائی جگہ ایک آئیکن لے سکتی ہے، یا جب ایک حقیقی اوتار کی ضرورت ہو تو کوئی بھی مارک اپ؛ پچھلا حصہ ایک تاریخ، ایک ٹیگ، بٹنوں کی ایک صف لے سکتا ہے۔ دی گئی لنک کے ساتھ، پوری چوڑائی ہدف بن جاتی ہے اور عنوان وہاں بیٹھنے کے رنگ کو برقرار رکھتا ہے۔'
  search:
    title: 'نتائج کی فہرست'
    description: 'فہرست فریم، تلاش کا میدان اور علیحدگی لاتی ہے؛ ہر صف ایک بار لاتی ہے۔ یہاں کچھ بھی ایک وجود نہیں ہے — یہی نقطہ ہے: وہی صف ایک شخص، ایک دستاویز، ایک ایپ اور ایک پسند کے لیے کام کرتی ہے۔'
  surfaces:
    title: 'ہر ایک کے لیے ایک سطح'
    description: 'فہرست کی ایک اور پڑھائی — کوئی مشترکہ پس منظر اور کوئی لائن نہیں، ہر بار اپنے بلاک پر کھڑی ہوتی ہے جس کے ارد گرد جگہ ہوتی ہے۔ کچھ نیا اسٹائل کرنے کی ضرورت نہیں، بار صرف بلاک کلاسز لیتی ہے، اور دی گئی لنک کے ساتھ پوری کارڈ ہدف بن جاتی ہے۔'
  divided:
    title: 'ایک خالی فہرست'
    description: 'جب فریم پہلے سے موجود ہو، ایک عمودی اسٹیک ڈیوائیڈرز کے ساتھ کافی ہے — اپنی شکل نہیں، صرف دو صفوں کے درمیان ایک لائن۔'
  vue:
    title: 'ان کی فہرست، Vue میں'
    description: 'وہی صفیں ایک اینڈپوائنٹ سے پڑھی جاتی ہیں نہ کہ لکھیں: فہرست صفحہ، صفحہ بندی اور خالی حالت رکھتی ہے، اور ہر وجود کہتا ہے کہ اس پر کیا پڑھا جائے — ایک عنوان، جو اسے اہلیت دیتا ہے، ایک آئیکن، کہاں لے جاتا ہے، ایک تاریخ دور کے سرے پر۔ اوپر کی پڑھائیاں اس کے متغیرات ہیں، `divided` پھر `surfaces`۔'
  keeping_up:
    title: 'اور تازہ ترین رکھا گیا'
    description: 'ایک بار کی فہرست کسی اور کی طرح ایک مجموعہ ہے، تو اس دنیا کے آگے بڑھنے کی تین طریقے اس کے لیے کھلے ہیں: ایک ایپ ایونٹ، ایک زندہ ماخذ، پولنگ۔ یہ ایک ایونٹ کو سنتا ہے — اسے بجائیں اور صفیں واپس آتی ہیں۔ تینوں کو ایک ساتھ دیکھنے کے لیے Keeping up دیکھیں۔'
