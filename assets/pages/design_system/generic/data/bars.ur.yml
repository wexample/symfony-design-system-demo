page_title: بارز
page_icon: 'ph:bold/rows'
intro: 'ایک بار ایک چیز کا نام ایک سطر میں رکھتا ہے: یہ کیا ہے، اسے کیا کہا جاتا ہے، یہ کیا چیز کی اہلیت رکھتا ہے، اور اس کے دور کے سرے پر کیا ہے۔ یہ ایک شکل ہے، نہ کہ ایک پابندی — ایک وجود اپنی خود کی ٹیمپلیٹ کے ذریعے اس تک پہنچتا ہے، لیکن ایک تلاش کا نتیجہ جو کہ ایک فائل، ایک ایپ یا ایک سیٹنگ ہے وہ اسی مارک اپ کو استعمال کرتا ہے۔'
