~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Propriedades
page_icon: 'ph:bold/list-dashes'
intro: 'Pares de chave / valor apresentados como uma lista de definições. As linhas são subgrids da lista, assim as chaves permanecem alinhadas em uma única coluna enquanto cada linha continua sendo uma caixa real que pode ter um separador.'
section:
  default:
    title: Padrão
    description: 'A coluna de chaves se dimensiona com base no rótulo mais longo. Substitua --properties-key-width para fixá-la.'
  bordered:
    title: Borda
    description: 'Um separador entre as linhas, para registros densos dentro de um corpo de bloco.'
    block_title: 'Detalhes da conexão'
  split:
    title: Dividido
    description: 'Valores empurrados para a borda direita — totais, saldos, qualquer coisa lida como uma coluna de números.'
  compact:
    title: Compacto
    description: 'Linhas mais apertadas quando a lista é secundária ao restante do bloco.'
  stacked:
    title: Empilhado
    description: 'Chave acima do valor, para colunas estreitas onde duas colunas ficariam mal distribuídas.'
    aside: 'O corpo mantém a largura restante enquanto a coluna ao lado permanece fixa.'
  columns:
    title: Colunas
    description: 'Uma dúzia de pares curtos lidos mal em uma coluna alta: o olho cruza a largura da página entre uma chave e seu valor, e os separadores acabam unindo cada par. Dispostos em colunas — quantas a largura permitir, até uma em um celular — um par se torna um pequeno bloco de duas linhas que não precisa de uma regra ao seu redor. Um valor que nenhuma coluna pode conter ocupa toda a largura com `full`.'
  vue:
    title: Vue
    description: 'A mesma lista como um partial vue, recebendo os modificadores como props: um registro construído enquanto a página é executada é lido como um renderizado com ela.'
