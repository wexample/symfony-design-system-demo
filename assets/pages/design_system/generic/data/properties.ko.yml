~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 속성
page_icon: 'ph:bold/list-dashes'
intro: '키/값 쌍이 정의 목록으로 렌더링됩니다. 행은 목록의 하위 그리드로, 키는 한 열에 정렬되고 각 행은 구분자를 가질 수 있는 실제 박스가 됩니다.'
section:
  default:
    title: 기본값
    description: '키 열은 가장 긴 레이블에 맞춰 크기가 조정됩니다. --properties-key-width를 재정의하여 고정할 수 있습니다.'
  bordered:
    title: 테두리
    description: '블록 본문 내에서 밀집된 레코드를 위한 행 사이의 구분자입니다.'
    block_title: '연결 세부정보'
  split:
    title: 분할
    description: '오른쪽 가장자리로 밀려나는 값 - 합계, 잔액, 숫자 열로 읽히는 모든 것.'
  compact:
    title: 간결한
    description: '목록이 블록의 나머지 부분에 비해 보조적일 때 더 조밀한 행입니다.'
  stacked:
    title: '겹쳐 쌓기'
    description: '좁은 열에서 두 열이 잘못 감싸지 않도록 키가 값 위에 위치합니다.'
    aside: '본문은 남은 너비를 유지하는 반면, 옆 열은 고정됩니다.'
  columns:
    title: 열
    description: '한 긴 열에서 읽기 어려운 열 짧은 쌍이 12개 있습니다: 눈은 키와 값 사이의 페이지 너비를 가로지르며, 구분자가 각 쌍을 함께 유지합니다. 열로 배치하면 - 너비가 허용하는 만큼, 휴대폰에서는 하나까지 - 쌍은 주변에 규칙이 필요 없는 두 줄의 작은 블록이 됩니다. 어떤 열도 수용할 수 없는 값은 `full`로 전체 너비를 차지합니다.'
  vue:
    title: Vue
    description: '수정자를 props로 받아들이는 vue 부분으로 동일한 목록: 페이지가 실행되는 동안 생성된 레코드는 그것과 함께 렌더링된 것처럼 읽힙니다.'
