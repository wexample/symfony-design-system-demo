~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Чат
page_icon: 'ph:bold/chats-circle'
chat:
  title: 'Пример чата'
vue:
  title: Vue
  description: |
    Та же нить и тот же композитор, созданные компонентом чата. Он содержит коллекцию сущностей и ничего не знает о том, что они собой представляют: автор, текст и дата считываются через проекции, которые переопределяет подкласс, а отправленное сообщение передается через репозиторий, как любое другое создание. Ответ записывается, как только запрос завершен, поэтому он не может вернуться в ответ на сообщение: он достигает страницы через живую подписку, которую эта нить имеет в своей комнате.
description:
  body: |
    Эта площадка для чата используется для проверки ритма сообщений, интервалов и вертикальной плотности перед окончательным стилизацией интерфейса. Держите этот блок намеренно многословным, чтобы макет имел достаточную высоту для имитации реалистичного потока разговора, включая средние и длинные строки, поведение переноса и естественные паузы при чтении нескольких предложений. Цель состоит в том, чтобы предоставить стабильную визуальную основу, которой могут следовать будущие компоненты чата, чтобы измерения оставались последовательными при замене этого текста реальными сообщениями пользователей и помощников.
composer:
  placeholder: 'Напишите сообщение...'
  submit_label: 'Отправить сообщение'
  action_plus_label: 'Добавить контент'
  action_smiley_label: 'Вставить эмодзи'
  multiline_value: |
    Это более длинный черновик чата, используемый для предварительного просмотра многострочного состояния. Он переносится на несколько строк, так что визуальная разница с полем на одну строку очевидна.
messages:
  user_1: |
    Можешь подвести итоги по задачам с синхронизации вчера и оставить только решения, которые мы можем выполнить на этой неделе?
  user_2: |
    Также сделай вывод коротким, потому что это будет скопировано в боковую панель менеджера.
  assistant_1: |
    Конечно. Я могу предоставить краткий обзор с приоритетами, ответственными и следующими контрольными точками.
  assistant_2: |
    Я оставлю только подтвержденные решения и уберу нерешенные вопросы, которые еще требуют изучения.
  assistant_3: |
    Предложенная структура: 1. Непосредственные действия. 2. Зависимости. 3. Риски, которые нужно отслеживать.
  assistant_4: |
    После подтверждения эта структура может стать шаблоном по умолчанию для меню чата в менеджере.
