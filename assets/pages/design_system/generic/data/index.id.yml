~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Data
page_icon: 'ph:bold/list-bullets'
intro: 'Bentuk-bentuk yang mengambil sebuah koleksi dan menampilkannya. Yang membedakan adalah seberapa banyak dari setiap catatan yang dapat dilihat pembaca, dan apa yang dapat mereka lakukan setelah melihatnya.'
page:
  files:
    title: Berkas
    description: 'Sebuah penjelajah berkas selebar halaman, yang diisi oleh pemuat, dan satu folder yang ditarik oleh server.'
  tables:
    title: Tabel
    description: 'Baris dan kolom, dirender oleh server atau dipaginasi oleh browser, dengan sel bertipe — tautan, tindakan, ikon, dan tanggal yang terus dihitung.'
  live:
    title: 'Mengikuti perkembangan'
    description: 'Tiga cara sebuah koleksi mendengar bahwa apa yang ditampilkannya telah berubah — sebuah acara aplikasi, sumber langsung, atau polling — dan apa fungsi masing-masing.'
  lists:
    title: Daftar
    description: 'Sebuah daftar yang dicari dan difilter dari header-nya sendiri, untuk sekumpulan yang dibrowse pembaca daripada dipindai.'
  properties:
    title: Properti
    description: 'Kunci dan nilai, untuk satu catatan daripada banyak — panel detail dari suatu hal yang sudah dipilih.'
  bars:
    title: Bar
    description: 'Satu catatan yang disebut dalam satu baris: sebuah ikon, sebuah judul, apa yang memenuhi syaratnya. Baris hasil pencarian, anggota, atau berkas yang dirender.'
  tree:
    title: Pohon
    description: 'Sebuah koleksi yang catatannya saling berisi satu sama lain, dimuat satu level pada satu waktu, di panel yang disediakan oleh penjelajah.'
  chat:
    title: Obrolan
    description: 'Sebuah koleksi yang dibaca dari belakang dan ditambahkan dari bawah, secara langsung, dengan pembuat yang berkembang saat ditulis.'
