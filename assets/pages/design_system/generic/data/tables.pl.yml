~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Tabele
page_icon: 'ph:bold/table'
section:
  wide:
    title: 'Szerszy niż pokój'
    description: 'Tabela, której kolumny wymagają więcej miejsca niż ma strona, jest rysowana na szerokość, jakiej potrzebuje, w ramce, która przewija się w poziomie — reszta strony pozostaje w miejscu. Tabela przyklejona rezygnuje z tego: nagłówek przylegający do strony i ramka przewijająca się samodzielnie nie mogą istnieć razem.'
  default:
    title: 'Prosta tabela'
  actions:
    title: 'Tabela z akcjami'
  links:
    title: 'Komórki z linkami i ikonami'
  loading:
    title: 'Stan ładowania'
  empty:
    title: 'Stan pusty'
  alignment:
    title: 'Wyrównanie kolumn'
  markdown:
    title: 'Z markdown'
    description: 'Tabela napisana w markdown i przetworzona przez `markdown_ds`: kolumny, ich wyrównanie oraz formatowanie każdej komórki są odczytywane z dokumentu, a tabela jest rysowana tutaj jak każda inna. `markdown` zachowuje prosty `<table>`, dla wszystkiego, co nie jest stroną — e-mailem, kanałem.'
  groups:
    title: 'Grupuj wiersze'
    description: 'Wiersz zawierający tylko grupę nie jest wierszem: to linia między dwoma ich seriami, z nadanym słowem. Rozciąga się na całą tabelę i nazywa to, co następuje — to samo, co separator menu.'
  status:
    title: 'Komórki statusu'
    description: 'Stan to okrąg, nigdy kolor wybrany przez kogoś: komórka przyjmuje nazwę typu, lub typ z liczbą i tytułem, i rysuje ikonę statusu, jaką rysuje reszta systemu. Nic do stylizacji na stronie.'
  sticky:
    title: 'Przyklejony nagłówek'
    description: 'Długa tabela jest odczytywana kolumna po kolumnie tak samo jak wiersz po wierszu. Przy `sticky` nagłówek pozostaje w widoku, podczas gdy wiersze przewijają się pod nim; strona z czymś przypiętym na górze mówi, jak daleko w `--table-sticky-top`.'
  striped:
    title: 'Wiersze w paski, podświetlane pod wskaźnikiem'
  selection:
    title: 'Wiersze, które można zaznaczyć'
    description: 'Pole przy głowie każdego wiersza, jedno w nagłówku dla wszystkich, oraz akcje powyżej: przesyłają zaznaczone wiersze do ich własnego adresu i pozostają poza zasięgiem, gdy nic nie jest zaznaczone.'
  files:
    title: 'Pliki, suma, akcja na każdym wierszu'
    description: 'Ścieżki odczytywane po ich nazwach, foldery przed nimi są odcinane od początku. Pasek kończy się na liczbie wierszy, a akcja oznaczona jako `wszystko` działa bez zaznaczenia — obejmuje każdy wiersz i prowadzi pasek, gdy jest to oczekiwane.'
  filters:
    title: Filtry
    description: 'Pasek filtrów na głowie tabeli, jedno dyskretne menu dla każdego, mówiące, na co się zwęża, gdy to robi. Na serwerze żyją w zapytaniu strony — każda opcja to link — a kontroler zwęża wiersze na ich podstawie; w vue są to wartości przekazywane stronie dla jej API, lub stosowane przez tabelę do już posiadanych wierszy. Każda opcja to pole — okrągłe dla wyboru jednego — kolorowane według tonu, gdy ma taki, statusu lub kategorii.'
  selection_select:
    title: 'Akcje w wyborze'
    description: 'Ten sam pasek, gdy jest wystarczająco dużo akcji, by go zapełnić: jedna jest wybierana, a następnie stosowana.'
  vue:
    title: 'Tabela jednostek Vue'
  vue_selection:
    title: 'Tabela Vue z zaznaczeniem'
    description: 'Ten sam kontrakt po stronie klienta: zaznaczone klucze wracają przez v-model:selected, każda akcja jest emitowana jako bulk-action, a jedna z adresem jest przesyłana, jak serwerowa tabela to przesyła. Te nie mają żadnej, więc linia poniżej mówi, co by zostało zrobione. Trzy wiersze na stronę, suma na końcu paska, oraz Archiwizuj wszystko nie wymagające zaznaczenia.'
  vue_compact:
    title: 'Paginacja bez sumy'
    description: 'Gdy API nie zwraca sumy, pager wraca do poprzedniego/następnego.'
  vue_dates:
    title: 'Formatery dat Vue'
