~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Chat
page_icon: 'ph:bold/chats-circle'
chat:
  title: Chat-Beispiel
vue:
  title: Vue
  description: |
    Der gleiche Thread und der gleiche Composer, erstellt durch die Entity-Chat-Komponente. Es enthält eine Sammlung von Entitäten und weiß nicht, was sie sind: der Autor, der Text und das Datum werden durch Projektionen gelesen, die eine Unterklasse überschreibt, und eine gesendete Nachricht wird wie jede andere Erstellung über das Repository versendet. Die Antwort wird geschrieben, sobald die Anfrage beendet ist, sodass sie nicht in der Antwort auf die Nachricht zurückkommen kann: sie erreicht die Seite über das Live-Abonnement, das dieser Thread in seinem Raum hält.
description:
  body: |
    Dieser Chat-Spielplatz wird verwendet, um den Nachrichtenrhythmus, den Abstand und die vertikale Dichte vor der endgültigen UI- Gestaltung zu validieren. Halten Sie diesen Block absichtlich ausführlich, damit das Layout genug Höhe hat, um den realistischen Gesprächsfluss zu simulieren, einschließlich mittellanger und langer Zeilen, Umbruchverhalten und natürlicher Lesepausen über mehrere Sätze. Das Ziel ist es, eine stabile visuelle Basis zu bieten, der zukünftige Chat-Komponenten folgen können, sodass die Messungen konsistent bleiben, wenn dieser Text durch echte Benutzer- und Assistentennachrichten ersetzt wird.
composer:
  placeholder: 'Nachricht schreiben...'
  submit_label: 'Nachricht senden'
  action_plus_label: 'Inhalt hinzufügen'
  action_smiley_label: 'Emoji einfügen'
  multiline_value: |
    Dies ist ein längerer Chat-Entwurf, der verwendet wird, um den mehrzeiligen Zustand vorzuschauen. Er erstreckt sich über mehrere Zeilen, sodass der visuelle Unterschied zum einzeiligen Feld deutlich wird.
messages:
  user_1: |
    Kannst du die Aktionspunkte aus dem Sync von gestern zusammenfassen und nur die Entscheidungen behalten, die wir diese Woche umsetzen können?
  user_2: |
    Halte die Ausgabe auch kurz, da dies in die Sidebar des Managers kopiert wird.
  assistant_1: |
    Klar. Ich kann eine prägnante Zusammenfassung mit Prioritäten, Verantwortlichen und nächsten Punkten bereitstellen.
  assistant_2: |
    Ich werde nur validierte Entscheidungen behalten und offene Fragen entfernen, die noch geklärt werden müssen.
  assistant_3: |
    Vorgeschlagene Struktur: 1. Sofortige Maßnahmen. 2. Abhängigkeiten. 3. Risiken, die überwacht werden müssen.
  assistant_4: |
    Sobald validiert, kann diese Struktur zur Standardvorlage für das Chat-Menü im Manager werden.
