~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: دردشة
page_icon: 'ph:bold/chats-circle'
chat:
  title: 'مثال دردشة'
vue:
  title: فيو
  description: |
    نفس السلسلة ونفس المؤلف، مستمدة من مكون دردشة الكيان. يحتفظ بمجموعة من الكيانات ولا يعرف شيئًا عن ماهيتها: المؤلف، النص والتاريخ تُقرأ من خلال الإسقاطات التي تعيد كتابتها فئة فرعية، والرسالة المقدمة تخرج من خلال المستودع مثل أي إنشاء آخر. يتم كتابة الإجابة بمجرد انتهاء الطلب، لذا لا يمكن أن تعود في الرد على الرسالة: تصل إلى الصفحة من خلال الاشتراك المباشر الذي تحتفظ به هذه السلسلة في غرفتها.
description:
  body: |
    تستخدم ساحة الدردشة هذه للتحقق من إيقاع الرسائل، والتباعد، والكثافة الرأسية قبل تنسيق واجهة المستخدم النهائي. حافظ على هذا المقطع طويلاً عن قصد حتى يكون للتصميم ارتفاع كافٍ لمحاكاة تدفق المحادثة الواقعية، بما في ذلك الأسطر المتوسطة والطويلة، وسلوك التفاف النص، ووقفات القراءة الطبيعية عبر جمل متعددة. الهدف هو توفير قاعدة مرئية ثابتة يمكن أن تتبعها مكونات الدردشة المستقبلية، بحيث تظل القياسات متسقة عند استبدال هذا النص برسائل المستخدمين والمساعدين الحقيقية.
composer:
  placeholder: 'اكتب رسالة...'
  submit_label: 'أرسل رسالة'
  action_plus_label: 'أضف محتوى'
  action_smiley_label: 'أدخل رمز تعبيري'
  multiline_value: |
    هذا مسودة دردشة أطول تُستخدم لمعاينة حالة الأسطر المتعددة. تتداخل عبر أسطر متعددة لذا فإن الفرق المرئي مع حقل السطر الواحد واضح.
messages:
  user_1: |
    هل يمكنك تلخيص العناصر الإجرائية من اجتماع الأمس والاحتفاظ فقط بالقرارات التي يمكننا تنفيذها هذا الأسبوع؟
  user_2: |
    احتفظ أيضًا بالمخرجات قصيرة لأن هذا سيتم نسخه إلى شريط الجانبي للمدير.
  assistant_1: |
    بالتأكيد. يمكنني تقديم ملخص موجز مع الأولويات، والمالكين، ونقاط التحقق التالية.
  assistant_2: |
    سأحتفظ فقط بالقرارات المصدقة وأزيل الأسئلة المفتوحة التي لا تزال بحاجة إلى اكتشاف.
  assistant_3: |
    الهيكل المقترح: 1. الإجراءات الفورية. 2. الاعتمادات. 3. المخاطر التي يجب مراقبتها.
  assistant_4: |
    بمجرد التحقق منه، يمكن أن يصبح هذا الهيكل القالب الافتراضي لقائمة الدردشة في المدير.
