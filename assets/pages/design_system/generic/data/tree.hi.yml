~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: पेड़
page_icon: 'ph:bold/tree-structure'
section:
  default:
    title: 'फ़ाइल अन्वेषक'
    description: 'नैस्टिंग पूरी संरचना है: एक आइटम तब खुलता है जब यह खुला होता है, और इसकी गहराई वह होती है जो पंक्ति को इंडेंट करती है जबकि हाइलाइट अभी भी पूरी चौड़ाई को फैला हुआ है।'
  vue:
    title: व्यू
    description: 'एक समान मार्कअप, एक समान आकार, लेकिन फ़ोल्डर खुलते और बंद होते हैं: चिवर एक नोड को मोड़ता है, और पंक्ति पर कहीं और क्लिक करने से आइटम का चयन होता है और इसे चयन घटना के रूप में भेजा जाता है।'
  vue_workspace:
    title: 'व्यू, एक कार्यक्षेत्र में'
    description: 'अन्वेषक एक ऐप के रूप में इसे शिप करता है: स्क्रॉल करने योग्य क्षेत्र में vue पेड़, जो क्षेत्र की ऊँचाई से अधिक पंक्तियाँ और चौड़ाई से अधिक लंबे नाम रखता है। क्षेत्र दोनों अक्षों पर स्क्रॉल करता है और क्षैतिज बार अपनी स्थिति पर रहता है, चाहे अंतिम पंक्ति कुछ भी हो।'
  plain:
    title: 'बिना आइकनों के'
    description: 'आकार फ़ाइलों के बारे में कुछ नहीं जानता — कोई आइकन और कोई लिंक के बिना आइटम सामान्य पाठ के रूप में प्रदर्शित होता है।'
explorer:
  scope:
    project: परियोजना
    packages: पैकेज
    scratches: स्क्रैच
    changed: 'बदले हुए फ़ाइलें'
  option:
