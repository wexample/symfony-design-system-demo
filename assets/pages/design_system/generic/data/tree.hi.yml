  action:
    new: 'नई फ़ाइल'
    locate: 'खुली फ़ाइल का चयन करें'
    collapse: 'सभी को संकुचित करें'
  body: 'पेड़ की अपनी कोई चौड़ाई और ऊँचाई नहीं होती: इसके बगल का क्षेत्र एक सामान्य क्षेत्र है, और प्रत्येक तरफ स्वतंत्र रूप से स्क्रॉल होता है।'
