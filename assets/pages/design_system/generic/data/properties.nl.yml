~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Eigenschappen
page_icon: 'ph:bold/list-dashes'
intro: 'Sleutel / waarde-paren weergegeven als een definitielijst. Rijen zijn subraster van de lijst, zodat sleutels in één kolom uitgelijnd blijven terwijl elke rij een echte box blijft die een scheiding kan bevatten.'
section:
  default:
    title: Standaard
    description: 'De sleutelkolom past zich aan de langste label aan. Overschrijf --properties-key-width om deze vast te pinnen.'
  bordered:
    title: 'Met rand'
    description: 'Een scheiding tussen rijen, voor dichte records binnen een bloklichaam.'
    block_title: Verbindingsdetails
  split:
    title: Gesplitst
    description: 'Waarden naar de rechterrand gedrukt — totalen, saldi, alles wat als een kolom met cijfers wordt gelezen.'
  compact:
    title: Compact
    description: 'Strakkere rijen wanneer de lijst secundair is aan de rest van het blok.'
  stacked:
    title: Gestapeld
    description: 'Sleutel boven waarde, voor smalle kolommen waar twee kolommen slecht zouden omwikkelen.'
    aside: 'De hoofdinhoud behoudt de resterende breedte terwijl de zijkolom vast blijft.'
  columns:
    title: Kolommen
    description: 'Een dozijn korte paren leest slecht in één hoge kolom: het oog kruist de breedte van de pagina tussen een sleutel en zijn waarde, en de scheidingen houden elk paar samen. Uitgelegd in kolommen — zoveel als de breedte toelaat, tot één op een telefoon — wordt een paar een klein blok van twee regels dat geen regel eromheen nodig heeft. Een waarde die geen kolom kan bevatten neemt de hele breedte met `full`.'
  vue:
    title: Vue
    description: 'Dezelfde lijst als een vue-deel, die de modifiers als props neemt: een record dat wordt opgebouwd terwijl de pagina draait leest als een dat ermee is weergegeven.'
