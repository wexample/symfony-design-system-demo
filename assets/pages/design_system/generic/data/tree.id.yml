~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Pohon
page_icon: 'ph:bold/tree-structure'
section:
  default:
    title: 'Penjelajah berkas'
    description: 'Penyusunan adalah keseluruhan struktur: sebuah item terbuka saat dibawa terbuka, dan kedalamannya adalah yang mengindent baris sementara sorotan tetap mencakup seluruh lebar.'
  vue:
    title: Vue
    description: 'Markup yang sama, bentuk yang sama, tetapi folder terbuka dan tertutup: chevron adalah yang melipat sebuah node, dan klik di tempat lain pada baris memilih item dan mengirimnya sebagai peristiwa pemilihan.'
  vue_workspace:
    title: 'Vue, dalam ruang kerja'
    description: 'Penjelajah sebagai aplikasi mengirimnya: pohon vue di zona yang dapat digulir dari pembagian, memegang lebih banyak baris daripada zona yang tinggi dan nama yang lebih panjang daripada lebar. Zona menggulir di kedua sumbu dan batang horizontal tetap di lantainya, apapun baris terakhirnya.'
  plain:
    title: 'Tanpa ikon'
    description: 'Bentuk tidak mengetahui apa pun tentang berkas — sebuah item tanpa ikon dan tanpa tautan ditampilkan sebagai teks biasa.'
explorer:
  scope:
    project: Proyek
    packages: Paket
    scratches: Goresan
    changed: 'Berkas yang Diubah'
  option:
    filters: Filter
    sort: 'Urutkan berdasarkan nama'
    hidden: 'Tampilkan berkas tersembunyi'
  action:
    new: 'Berkas baru'
    locate: 'Pilih berkas yang dibuka'
    collapse: 'Liput semua'
  body: 'Pohon tidak memiliki lebar dan tinggi sendiri: zona di sampingnya adalah zona biasa, dan setiap sisi menggulir sendiri.'
plain:
