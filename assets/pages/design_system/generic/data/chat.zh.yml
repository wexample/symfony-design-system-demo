~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 聊天
page_icon: 'ph:bold/chats-circle'
chat:
  title: 聊天示例
vue:
  title: Vue
  description: |
    相同的线程和相同的创作，都是由实体聊天组件绘制的。它持有一个实体集合，并不知道它们是什么：作者、文本和日期通过子类覆盖的投影读取，提交的消息通过存储库像其他任何创建一样发送。答案在请求结束后写出，因此不能在消息的响应中返回：它通过这个线程在其房间中持有的实时订阅到达页面。
description:
  body: |
    这个聊天游乐场用于验证消息节奏、间距和垂直密度，以便在最终的UI样式之前进行测试。故意让这个块冗长，以便布局有足够的高度来模拟真实的对话流，包括中长句、换行行为和自然的阅读暂停。目标是提供一个稳定的视觉基线，未来的聊天组件可以遵循，因此在用真实用户和助手消息替换此文本时，测量保持一致。
composer:
  placeholder: 写消息...
  submit_label: 发送消息
  action_plus_label: 添加内容
  action_smiley_label: 插入表情符号
  multiline_value: |
    这是一个较长的聊天草稿，用于预览多行状态。它跨越多行，以便与单行字段的视觉差异显而易见。
messages:
  user_1: |
    你能总结一下昨天同步会议的行动项目，并只保留我们本周可以执行的决策吗？
  user_2: |
    另外，保持输出简短，因为这将被复制到经理侧边栏中。
  assistant_1: |
    当然。我可以提供一个简明的摘要，包括优先级、负责人和下一个检查点。
  assistant_2: |
    我只会保留已验证的决策，并删除仍需发现的开放问题。
  assistant_3: |
    建议的结构：1. 立即行动。2. 依赖关系。3. 需要监控的风险。
  assistant_4: |
    一旦验证，这个结构可以成为经理聊天菜单的默认模板。
