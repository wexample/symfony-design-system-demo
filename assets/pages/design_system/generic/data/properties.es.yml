~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Propiedades
page_icon: 'ph:bold/list-dashes'
intro: 'Pares clave / valor renderizados como una lista de definiciones. Las filas son subgrillas de la lista, por lo que las claves permanecen alineadas en una sola columna mientras que cada fila sigue siendo una caja real que puede llevar un separador.'
section:
  default:
    title: Predeterminado
    description: 'La columna de clave se ajusta al label más largo. Sobrescribe --properties-key-width para fijarlo.'
  bordered:
    title: 'Con borde'
    description: 'Un separador entre filas, para registros densos dentro de un cuerpo de bloque.'
    block_title: 'Detalles de conexión'
  split:
    title: Dividido
    description: 'Valores empujados al borde derecho — totales, balances, cualquier cosa leída como una columna de cifras.'
  compact:
    title: Compacto
    description: 'Filas más ajustadas cuando la lista es secundaria al resto del bloque.'
  stacked:
    title: Apilado
    description: 'Clave encima del valor, para columnas estrechas donde dos columnas se envolverían mal.'
    aside: 'El cuerpo mantiene el ancho restante mientras que la columna lateral permanece fija.'
  columns:
    title: Columnas
    description: 'Una docena de pares cortos se leen mal en una columna alta: el ojo cruza el ancho de la página entre una clave y su valor, y los separadores terminan manteniendo cada par unido. Dispuestos en columnas — tantas como lo permite el ancho, hasta una en un teléfono — un par se convierte en un pequeño bloque de dos líneas que no necesita regla a su alrededor. Un valor que ninguna columna puede contener toma todo el ancho con `full`.'
  vue:
    title: Vue
    description: 'La misma lista como un parcial de vue, tomando los modificadores como props: un registro construido mientras se ejecuta la página se lee como uno renderizado con ella.'
