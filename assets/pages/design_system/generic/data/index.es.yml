~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Datos
page_icon: 'ph:bold/list-bullets'
intro: 'Formas que toman una colección y la representan. Lo que las distingue es cuánto de cada registro puede ver el lector y qué puede hacer con ello una vez que lo ve.'
page:
  files:
    title: Archivos
    description: 'Un explorador de archivos del ancho de una página, alimentado por un cargador, y una carpeta dibujada por el servidor.'
  tables:
    title: Tablas
    description: 'Filas y columnas, renderizadas por el servidor o paginadas por el navegador, con celdas tipadas: enlaces, acciones, íconos y fechas que siguen contando.'
  live:
    title: 'Manteniéndose al día'
    description: 'Las tres formas en que una colección escucha que lo que muestra ha cambiado: un evento de la app, una fuente en vivo o sondeo, y para qué sirve cada uno.'
  lists:
    title: Listas
    description: 'Una lista que se busca y filtra desde su propio encabezado, para un conjunto que el lector navega en lugar de escanear.'
  properties:
    title: Propiedades
    description: 'Clave y valor, para un registro en lugar de muchos: el panel de detalles de una cosa ya elegida.'
  bars:
    title: Barras
    description: 'Un registro nombrado en una sola línea: un ícono, un título, lo que lo califica. La fila que se representa como un resultado de búsqueda, un miembro o un archivo.'
  tree:
    title: Árbol
    description: 'Una colección cuyos registros contienen entre sí, cargados un nivel a la vez, en el panel que un explorador envía.'
  chat:
    title: Chat
    description: 'Una colección leída al revés y añadida desde abajo, en vivo, con un compositor que crece a medida que se escribe en él.'
