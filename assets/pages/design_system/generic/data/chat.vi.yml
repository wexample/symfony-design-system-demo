~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Trò chuyện'
page_icon: 'ph:bold/chats-circle'
chat:
  title: 'Ví dụ trò chuyện'
vue:
  title: Vue
  description: |
    Luồng và trình soạn thảo giống nhau, được tạo ra bởi thành phần trò chuyện của thực thể. Nó giữ một tập hợp các thực thể và không biết chúng là gì: tác giả, văn bản và ngày được đọc thông qua các phép chiếu mà một lớp con ghi đè, và một tin nhắn đã gửi sẽ được gửi qua kho như bất kỳ sự tạo nào khác. Câu trả lời được viết khi yêu cầu kết thúc, vì vậy nó không thể quay lại trong phản hồi cho tin nhắn: nó đến trang thông qua việc đăng ký trực tiếp mà luồng này giữ trong phòng của nó.
description:
  body: |
    Khu vực trò chuyện này được sử dụng để xác thực nhịp độ tin nhắn, khoảng cách và độ dày theo chiều dọc trước khi định dạng giao diện người dùng cuối cùng. Giữ cho khối này cố ý dài dòng để bố cục có đủ chiều cao để mô phỏng dòng chảy cuộc trò chuyện thực tế, bao gồm các dòng trung bình và dài, hành vi gói và các khoảng dừng đọc tự nhiên qua nhiều câu. Mục tiêu là cung cấp một cơ sở hình ảnh ổn định mà các thành phần trò chuyện trong tương lai có thể theo dõi, để các phép đo vẫn nhất quán khi thay thế văn bản này bằng tin nhắn của người dùng và trợ lý thực tế.
composer:
  placeholder: 'Viết một tin nhắn...'
  submit_label: 'Gửi tin nhắn'
  action_plus_label: 'Thêm nội dung'
  action_smiley_label: 'Chèn emoji'
  multiline_value: |
    Đây là một bản nháp trò chuyện dài hơn được sử dụng để xem trước trạng thái nhiều dòng. Nó bọc qua nhiều dòng để sự khác biệt về hình ảnh với trường một dòng trở nên rõ ràng.
messages:
  user_1: |
    Bạn có thể tóm tắt các mục hành động từ cuộc họp đồng bộ ngày hôm qua và chỉ giữ lại những quyết định mà chúng ta có thể thực hiện trong tuần này không?
  user_2: |
    Cũng giữ cho đầu ra ngắn gọn vì điều này sẽ được sao chép vào thanh bên của quản lý.
  assistant_1: |
    Chắc chắn rồi. Tôi có thể cung cấp một tóm tắt ngắn gọn với các ưu tiên, chủ sở hữu và các điểm kiểm tra tiếp theo.
  assistant_2: |
    Tôi sẽ chỉ giữ lại các quyết định đã được xác thực và loại bỏ các câu hỏi mở vẫn cần khám phá.
  assistant_3: |
    Cấu trúc đề xuất: 1. Hành động ngay lập tức. 2. Phụ thuộc. 3. Rủi ro cần theo dõi.
  assistant_4: |
    Khi đã được xác thực, cấu trúc này có thể trở thành mẫu mặc định cho menu trò chuyện trong quản lý.
