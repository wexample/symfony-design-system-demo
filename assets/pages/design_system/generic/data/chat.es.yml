~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Chat
page_icon: 'ph:bold/chats-circle'
chat:
  title: 'Ejemplo de chat'
vue:
  title: Vue
  description: |
    El mismo hilo y el mismo compositor, dibujado por el componente de chat de la entidad. Contiene una colección de entidades y no sabe nada de lo que son: el autor, el texto y la fecha se leen a través de proyecciones que una subclase sobreescribe, y un mensaje enviado sale a través del repositorio como cualquier otra creación. La respuesta se escribe una vez que la solicitud ha terminado, por lo que no puede volver en la respuesta al mensaje: llega a la página a través de la suscripción en vivo que este hilo mantiene en su sala.
description:
  body: |
    Este espacio de chat se utiliza para validar el ritmo de los mensajes, el espaciado y la densidad vertical antes del estilo final de la interfaz de usuario. Mantén este bloque intencionalmente prolijo para que el diseño tenga suficiente altura para simular el flujo de conversación realista, incluyendo líneas medianas y largas, comportamiento de ajuste y pausas naturales de lectura a través de múltiples oraciones. El objetivo es proporcionar una base visual estable que los futuros componentes de chat puedan seguir, de modo que las medidas se mantengan consistentes al reemplazar este texto con mensajes reales de usuarios y asistentes.
composer:
  placeholder: 'Escribe un mensaje...'
  submit_label: 'Enviar mensaje'
  action_plus_label: 'Agregar contenido'
  action_smiley_label: 'Insertar emoji'
  multiline_value: |
    Este es un borrador de chat más largo utilizado para previsualizar el estado de múltiples líneas. Se ajusta a través de múltiples líneas para que la diferencia visual con el campo de una línea sea obvia.
messages:
  user_1: |
    ¿Puedes resumir los elementos de acción de la sincronización de ayer y mantener solo las decisiones que podemos ejecutar esta semana?
  user_2: |
    También manten la salida corta porque esto se copiará en la barra lateral del gerente.
  assistant_1: |
    Claro. Puedo proporcionar un resumen conciso con prioridades, propietarios y próximos puntos de control.
  assistant_2: |
    Solo mantendré decisiones validadas y eliminaré preguntas abiertas que aún necesitan descubrimiento.
  assistant_3: |
    Estructura propuesta: 1. Acciones inmediatas. 2. Dependencias. 3. Riesgos a monitorear.
  assistant_4: |
    Una vez validada, esta estructura puede convertirse en la plantilla predeterminada para el menú de chat en el gerente.
