section:
  findings:
    title: یافته‌ها
    description: 'آنچه یک تجزیه و تحلیل گزارش می‌دهد، یک نوار برای هر مورد: یافته به عنوان عنوان، مکان آن به عنوان زیرعنوان، و اقداماتی که می‌توان در مورد آن انجام داد در بخش پایانی — اگر چیزی در اینجا وجود نداشته باشد، هیچ کاری نمی‌توان انجام داد. شدت، لحن بلوک است که آواتار در سر نیز آن را می‌گیرد.'
  alone:
    title: 'خود نوار'
    description: 'همه چیز به جز عنوان اختیاری است. بخش پیشرو یک آیکون یا هر نشانه‌گذاری دیگری را می‌گیرد زمانی که یک آواتار واقعی لازم است؛ بخش پایانی یک تاریخ، یک برچسب، یک ردیف از دکمه‌ها را می‌گیرد. اگر یک لینک وجود داشته باشد، کل عرض هدف می‌شود و عنوان رنگ جایی که قرار دارد را حفظ می‌کند.'
  search:
    title: 'فهرستی از نتایج'
    description: 'فهرست قاب، فیلد جستجو و جداکننده‌ها را به ارمغان می‌آورد؛ هر ردیف یک نوار می‌آورد. هیچ‌یک از اینجا یک موجودیت نیست — این نکته است: همان ردیف به یک شخص، یک سند، یک برنامه و یک ترجیح خدمت می‌کند.'
  surfaces:
    title: 'هر کدام یک سطح'
    description: 'خواندن دیگر یک فهرست — بدون پس‌زمینه مشترک و بدون خط، هر نوار روی بلوک خود ایستاده با فضا دور آن. هیچ چیز جدیدی برای استایل وجود ندارد، نوار به سادگی کلاس‌های بلوک را می‌گیرد و اگر یک لینک وجود داشته باشد، کل کارت هدف می‌شود.'
  divided:
    title: 'یک فهرست خالی'
    description: 'وقتی قاب قبلاً وجود دارد، یک پشته عمودی با جداکننده‌ها کافی است — هیچ شکلی از خود ندارد، فقط یک خط بین دو ردیف.'
  vue:
    title: 'فهرستی از آن‌ها، در Vue'
    description: 'همان ردیف‌ها از یک نقطه پایانی خوانده می‌شوند نه اینکه نوشته شوند: فهرست صفحه، صفحه‌بندی و حالت خالی را نگه می‌دارد، و هر موجودیتی می‌گوید چه چیزی باید روی آن خوانده شود — یک عنوان، چه چیزی آن را واجد شرایط می‌کند، یک آیکون، کجا می‌رود، یک تاریخ در انتهای دور. خوانش‌های بالا وارون‌های آن هستند، `divided` سپس `surfaces`.'
  keeping_up:
    title: 'و به روز نگه داشته شده است'
    description: 'یک فهرست نوار یک مجموعه مانند هر مجموعه دیگری است، بنابراین سه راهی که یک مجموعه می‌فهمد که دنیا پیش رفته است برای آن باز است: یک رویداد برنامه، یک منبع زنده، نظارت. این یکی به یک رویداد گوش می‌دهد — آن را صدا بزنید و ببینید ردیف‌ها برمی‌گردند. به Keeping up برای سه مورد آن‌ها در کنار هم مراجعه کنید.'
