page_title: نوارها
page_icon: 'ph:bold/rows'
intro: 'یک نوار یک چیز را در یک خط واحد نام می‌برد: اینکه چیست، چه نام دارد، چه چیزی آن را واجد شرایط می‌کند و چه چیزی در انتهای دور قرار دارد. این یک شکل است، نه یک پیوند — یک موجودیت از طریق الگوی خود به آن می‌رسد، اما یک نتیجه جستجو که یک فایل، یک برنامه یا یک تنظیم است از همان نشانه‌گذاری استفاده می‌کند.'
