~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: แชท
page_icon: 'ph:bold/chats-circle'
chat:
  title: ตัวอย่างแชท
vue:
  title: วิว
  description: |
    เธรดเดียวกันและคอมโพเนนต์เดียวกัน ถูกสร้างโดยคอมโพเนนต์แชทของเอนทิตี มันเก็บคอลเลกชันของเอนทิตีและไม่รู้ว่าเป็นอะไร: ผู้เขียน, ข้อความ และวันที่ถูกอ่านผ่านการฉายที่ซับคลาสทำการเขียนทับ และข้อความที่ส่งไปจะถูกส่งออกผ่านที่เก็บเหมือนกับการสร้างอื่น ๆ คำตอบถูกเขียนเมื่อคำขอเสร็จสิ้น ดังนั้นมันจึงไม่สามารถกลับมาในคำตอบของข้อความ: มันจะไปถึงหน้าเพจผ่านการสมัครสมาชิกสดที่เธรดนี้ถืออยู่ในห้องของมัน.
description:
  body: |
    สแปนนี้ใช้เพื่อทดสอบจังหวะการส่งข้อความ, การเว้นระยะ และความหนาแน่นแนวตั้งก่อนการจัดแต่ง UI สุดท้าย ให้บล็อกนี้มีความยาวมากตั้งใจเพื่อให้เลย์เอาต์มีความสูงพอที่จะจำลองการสนทนาที่เหมือนจริง รวมถึงบรรทัดที่กลางและยาว, พฤติกรรมการห่อ และการหยุดอ่านตามธรรมชาติในหลายประโยค เป้าหมายคือการให้พื้นฐานภาพที่เสถียรซึ่งคอมโพเนนต์แชทในอนาคตสามารถติดตามได้ ดังนั้นการวัดจึงยังคงสอดคล้องเมื่อแทนที่ข้อความนี้ด้วยข้อความจริงจากผู้ใช้และผู้ช่วย.
composer:
  placeholder: เขียนข้อความ...
  submit_label: ส่งข้อความ
  action_plus_label: เพิ่มเนื้อหา
  action_smiley_label: แทรกอิโมจิ
  multiline_value: |
    นี่คือร่างแชทยาวที่ใช้เพื่อดูตัวอย่างสถานะหลายบรรทัด มันห่อไปหลายบรรทัดเพื่อให้ความแตกต่างทางภาพกับฟิลด์บรรทัดเดียวชัดเจน.
messages:
  user_1: |
    ช่วยสรุปประเด็นการดำเนินการจากการประชุมเมื่อวานนี้และเก็บเฉพาะการตัดสินใจที่เราสามารถดำเนินการในสัปดาห์นี้ได้ไหม?
  user_2: |
    ยังให้ผลลัพธ์สั้นเพราะสิ่งนี้จะถูกคัดลอกไปยังแถบด้านข้างของผู้จัดการ.
  assistant_1: |
    แน่นอน ฉันสามารถให้สรุปอย่างกระชับพร้อมลำดับความสำคัญ, เจ้าของ, และจุดตรวจถัดไป.
  assistant_2: |
    ฉันจะเก็บเฉพาะการตัดสินใจที่ได้รับการตรวจสอบและลบคำถามที่ยังต้องการการค้นพบ.
  assistant_3: |
    โครงสร้างที่เสนอ: 1. การดำเนินการทันที. 2. การพึ่งพา. 3. ความเสี่ยงที่ต้องตรวจสอบ.
  assistant_4: 'เมื่อได้รับการตรวจสอบแล้ว โครงสร้างนี้สามารถกลายเป็นเทมเพลตเริ่มต้นสำหรับเมนูแชทในผู้จัดการได้.'
