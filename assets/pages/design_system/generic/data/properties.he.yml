~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: מאפיינים
page_icon: 'ph:bold/list-dashes'
intro: 'זוגות מפתח / ערך מוצגים כרשימת הגדרות. השורות הן תתי-רשימות של הרשימה, כך שהמפתחות נשארים מיושרים בעמודה אחת בזמן שכל שורה נשארת תיבה אמיתית שיכולה להכיל מפריד.'
section:
  default:
    title: 'ברירת מחדל'
    description: 'עמודת המפתח מתאימה את עצמה על פי התווית הארוכה ביותר. ניתן לעקוף את --properties-key-width כדי לקבע אותה.'
  bordered:
    title: 'עם גבול'
    description: 'מפריד בין שורות, עבור רשומות צפופות בתוך גוף בלוק.'
    block_title: 'פרטי חיבור'
  split:
    title: מפוצל
    description: 'ערכים נדחפים לקצה הימני — סכומים, יתרות, כל דבר שנקרא כעמודת מספרים.'
  compact:
    title: קומפקטי
    description: 'שורות צפופות יותר כאשר הרשימה משנית לשאר הבלוק.'
  stacked:
    title: ערום
    description: 'מפתח מעל ערך, עבור עמודות צרות שבהן שתי עמודות ייגמרו רע.'
    aside: 'הגוף שומר על רוחב שארית בזמן שעמודת הצד נשארת קבועה.'
  columns:
    title: עמודות
    description: 'עשרה זוגות קצרים נקראים רע בעמודה אחת גבוהה: העין חוצה את רוחב הדף בין מפתח לערכו, והמפרידים בסופו של דבר מחזיקים כל זוג יחד. כאשר הם מסודרים בעמודות — כמה שרוחב מאפשר, עד לאחת בטלפון — זוג הופך לחסימת מידע קטנה של שתי שורות שאינה זקוקה לכללים סביבה. ערך שלא יכולה להחזיק עמודה לוקח את כל הרוחב עם `full`.'
  vue:
    title: Vue
    description: 'אותה רשימה כחלק Vue, לוקחת את המודיפיקטורים כפרמטרים: רשומה שנבנית בזמן שהדף פועל נקראת כמו אחת שהוצגה עם זה.'
