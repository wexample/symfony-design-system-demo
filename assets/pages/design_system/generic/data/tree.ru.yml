~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Дерево
page_icon: 'ph:bold/tree-structure'
section:
  default:
    title: 'Диспетчер файлов'
    description: 'Вложенность — это вся структура: элемент открывается, когда он развернут, а его глубина определяет отступ строки, в то время как выделение все еще охватывает всю ширину.'
  vue:
    title: Vue
    description: 'Одинаковая разметка, одинаковая форма, но папки открываются и закрываются: стрелка сворачивает узел, а клик в любом другом месте строки выбирает элемент и отправляет его как событие выбора.'
  vue_workspace:
    title: 'Vue в рабочей области'
    description: 'Диспетчер как приложение доставляется с ним: дерево vue в прокручиваемой зоне сплита, удерживающее больше строк, чем зона высокая, и более длинные названия, чем она широкая. Зона прокручивается по обеим осям, а горизонтальная полоса остается на своем уровне, независимо от того, какая последняя строка.'
  plain:
    title: 'Без иконок'
    description: 'Форма ничего не знает о файлах — элемент без иконки и ссылки отображается как простой текст.'
explorer:
  scope:
    project: Проект
    packages: Пакеты
    scratches: Черновики
    changed: 'Измененные файлы'
  option:
    filters: Фильтры
    sort: 'Сортировать по имени'
    hidden: 'Показать скрытые файлы'
  action:
    new: 'Новый файл'
    locate: 'Выбрать открытый файл'
    collapse: 'Свернуть все'
  body: 'Дерево не имеет собственной ширины и высоты: зона рядом с ним является обычной, и каждая сторона прокручивается отдельно.'
plain:
  root: Корень
  child: 'Первый дочерний элемент'
  sibling: 'Второй дочерний элемент'
