page_title: ברים
page_icon: 'ph:bold/rows'
intro: 'בר מפרט דבר אחד בשורה אחת: מהו, מה שמו, מה מגדיר אותו ומה שייך בקצה הרחוק. זו צורה, ולא חיבור — ישות מגיעה אליו דרך התבנית שלה, אך תוצאת חיפוש שהיא קובץ, אפליקציה או הגדרה משתמשת באותו סימון בדיוק.'
finding:
  fix: תיקון
  date: 'לציין תאריך'
  error:
    title: 'חסר סעיף חובה “מטרה”'
    subtitle: 01-PROCESSES/PR-004-document-control.md
  warning:
    title: 'תאריך הסקירה עבר'
    subtitle: '01-PROCESSES/PR-004-document-control.md:4'
  info:
    title: 'שדה בעלים הושאר ריק'
    subtitle: 'לא חוסם טיוטה, נדרש לפני סקירה'
section:
  findings:
    title: ממצאים
    description: 'מה שדוח ניתוח מדווח, בר אחד לכל: הממצא בכותרת, היכן הוא בכותרת המשנה, ומה ניתן לעשות עליו בסלוט הסופי — כלום שם כאשר אין מה לעשות כאן. החומרה היא הטון של הבלוק, אשר גם הדמות בראש לוקחת.'
  alone:
    title: 'הבר עצמו'
    description: 'הכול מלבד הכותרת הוא אופציונלי. הסלוט הראשי לוקח אייקון, או כל סימון כאשר דמות אמיתית נדרשת; הסלוט הסופי לוקח תאריך, תג, שורת כפתורים. כאשר יש קישור, כל הרוחב הופך ליעד והכותרת שומרת על הצבע של המקום בו היא נמצאת.'
  search:
    title: 'רשימת תוצאות'
    description: 'הרשימה מביאה את המסגרת, את שדה החיפוש ואת המפרידים; כל שורה מביאה בר. שום דבר כאן אינו ישות — זו הנקודה: אותה שורה משרתת אדם, מסמך, אפליקציה והעדפה.'
  surfaces:
    title: 'משטח אחד לכל'
    description: 'הקריאה האחרת של רשימה — ללא רקע משותף וללא קו, כל בר עומד על הבלוק שלו עם מקום סביבו. שום דבר חדש לעצב, הבר פשוט לוקח את מחלקות הבלוק, ואם יש קישור כל הכרטיס הופך ליעד.'
  divided:
    title: 'רשימה פשוטה'
    description: 'כאשר המסגרת כבר שם, ערימה אנכית עם מחיצות מספיקה — אין צורה משלה, רק קו בין שתי שורות.'
  vue:
    title: 'רשימה של כאלה, ב-Vue'
    description: 'אותן שורות נקראות מנקודת קצה ולא נכתבות: הרשימה מחזיקה את העמוד, את ההדר ודState ריק, וכל ישות אומרת מה לקרוא עליה — כותרת, מה מגדיר אותה, אייקון, לאן היא מובילה, תאריך בקצה הרחוק. הקריאות למעלה הן הגרסאות שלה, `divided` ואז `surfaces`.'
  keeping_up:
    title: 'ושומרת על עדכניות'
    description: 'רשימת ברים היא אוסף כמו כל אוסף אחר, כך שהשלוש דרכים שבהן אוסף שומע שהעולם התקדם פתוחות בפניו: אירוע אפליקציה, מקור חי, חיפוש. זה שומע לאירוע — התקשר וצפה בשורות חוזרות. ראה שמירה על עדכניות לשלושתם זה לצד זה.'
