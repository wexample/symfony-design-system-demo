~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: چت
page_icon: 'ph:bold/chats-circle'
chat:
  title: 'نمونه چت'
vue:
  title: ویو
  description: |
    این کامپوننت چت، همان رشته و همان سازنده را ترسیم می‌کند. این کامپوننت مجموعه‌ای از موجودیت‌ها را در خود دارد و از آنچه هستند هیچ نمی‌داند: نویسنده، متن و تاریخ از طریق پروجکشن‌ها که یک زیرکلاس آن را نادیده می‌گیرد خوانده می‌شوند و پیامی که ارسال می‌شود مانند هر ایجاد دیگری از طریق مخزن خارج می‌شود. پاسخ پس از اتمام درخواست نوشته می‌شود، بنابراین نمی‌تواند در پاسخ به پیام برگردد: این پاسخ از طریق اشتراک زنده‌ای که این رشته در اتاق خود دارد به صفحه می‌رسد.
description:
  body: |
    این زمین بازی چت برای اعتبارسنجی ریتم پیام‌ها، فاصله‌گذاری و چگالی عمودی قبل از طراحی نهایی رابط کاربری استفاده می‌شود. این بخش را عمداً پرحرف نگه دارید تا طرح اندازه کافی ارتفاع داشته باشد تا جریان مکالمه واقعی را شبیه‌سازی کند، از جمله خطوط متوسط و بلند، رفتار پیچیده و مکث‌های طبیعی در خواندن میان چندین جمله. هدف این است که یک پایه بصری پایدار ارائه شود که اجزای چت آینده بتوانند از آن پیروی کنند، بنابراین اندازه‌گیری‌ها هنگام جایگزینی این متن با پیام‌های واقعی کاربر و دستیار ثابت باقی می‌مانند.
composer:
  placeholder: 'پیام خود را بنویسید...'
  submit_label: 'ارسال پیام'
  action_plus_label: 'افزودن محتوا'
  action_smiley_label: 'وارد کردن ایموجی'
  multiline_value: |
    این یک پیش‌نویس چت طولانی‌تر است که برای پیش‌نمایش حالت چندخطی استفاده می‌شود. این متن در چندین خط پیچیده می‌شود تا تفاوت بصری با فیلد یک‌خطی واضح باشد.
messages:
  user_1: |
    می‌توانید موارد اقدام را از همگام‌سازی دیروز خلاصه کنید و فقط تصمیماتی که می‌توانیم این هفته اجرا کنیم را نگه دارید؟
  user_2: |
    همچنین خروجی را کوتاه نگه دارید زیرا این متن در نوار کناری مدیر کپی خواهد شد.
  assistant_1: |
    البته. می‌توانم یک خلاصه مختصر با اولویت‌ها، صاحبان و نقاط عطف بعدی ارائه دهم.
  assistant_2: |
    فقط تصمیمات تایید شده را نگه می‌دارم و سوالات باز که هنوز نیاز به کشف دارند را حذف می‌کنم.
  assistant_3: |
    ساختار پیشنهادی: 1. اقدامات فوری. 2. وابستگی‌ها. 3. ریسک‌هایی که باید نظارت شوند.
  assistant_4: |
    پس از تایید، این ساختار می‌تواند به عنوان الگوی پیش‌فرض برای منوی چت در مدیر تبدیل شود.
