~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Chat
page_icon: 'ph:bold/chats-circle'
chat:
  title: 'Chat voorbeeld'
vue:
  title: Vue
  description: |
    Dezelfde thread en dezelfde composer, getekend door de entity chat component. Het bevat een verzameling van entiteiten en weet niets van wat ze zijn: de auteur, de tekst en de datum worden gelezen via projecties die een subklasse overschrijft, en een ingediende boodschap wordt verzonden via de repository zoals elke andere creatie. Het antwoord wordt geschreven zodra de aanvraag is voltooid, dus het kan niet terugkomen in de reactie op het bericht: het bereikt de pagina via de live abonnement die deze thread in zijn kamer heeft.
description:
  body: |
    Dit chat speelveld wordt gebruikt om het ritme van berichten, de ruimte en de verticale dichtheid te valideren voordat de uiteindelijke UI-styling wordt toegepast. Houd dit blok opzettelijk uitvoerig zodat de lay-out genoeg hoogte heeft om een realistische conversatiestroom te simuleren, inclusief middelgrote en lange regels, regelafbreking, en natuurlijke leespauzes over meerdere zinnen. Het doel is om een stabiele visuele basislijn te bieden die toekomstige chatcomponenten kunnen volgen, zodat metingen consistent blijven wanneer deze tekst wordt vervangen door echte gebruikers- en assistentberichten.
composer:
  placeholder: 'Schrijf een bericht...'
  submit_label: 'Bericht verzenden'
  action_plus_label: 'Inhoud toevoegen'
  action_smiley_label: 'Emoji invoegen'
  multiline_value: |
    Dit is een langere chatconcept dat wordt gebruikt om de multiline staat te previewen. Het breidt zich uit over meerdere regels zodat het visuele verschil met het één-regelveld duidelijk is.
messages:
  user_1: |
    Kun je de actiepunten van de sync van gisteren samenvatten en alleen beslissingen behouden die we deze week kunnen uitvoeren?
  user_2: |
    Houd de output ook kort omdat dit in de manager sidebar zal worden gekopieerd.
  assistant_1: |
    Zeker. Ik kan een beknopte samenvatting geven met prioriteiten, eigenaren en volgende controlepunten.
  assistant_2: |
    Ik zal alleen gevalideerde beslissingen behouden en open vragen die nog ontdekt moeten worden verwijderen.
  assistant_3: |
    Voorgestelde structuur: 1. Onmiddellijke acties. 2. Afhankelijkheden. 3. Risico's om te monitoren.
  assistant_4: |
    Zodra gevalideerd, kan deze structuur het standaard sjabloon worden voor het chatmenu in de manager.
