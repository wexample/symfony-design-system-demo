~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: קבצים
page_icon: 'ph:bold/folder-open'
intro: 'חוקר קבצים ברוחב של עמוד. הוא לא יודע מאיפה מגיעים הקבצים: הוא מבקש את תוכן התיקייה ומחזיר ישויות קובץ — אותו לودر כמו עץ — כך שדיסק, אינדקס, ארכיון או API קוראים באותו אופן.'
root: קבצים
section:
  vue:
    title: החוקר
    description: 'תיקיות בצד, תוכן התיקייה כרשימה מסודרת לפי כל עמודה או כרשת; חזור, קדימה ועלה; מסנן; בחירה עם העכבר — ctrl, shift — ועם המקלדת — חצים, Enter, Backspace, ctrl+A, Escape; יותר מתבקש כשיש בתיקייה יותר מעמוד אחד. לחיצה כפולה נכנסת לתיקייה ומעבירה קובץ לעמוד. התצוגה והסדר נזכרים.'
  twig:
    title: 'נוצר על ידי השרת'
    description: 'תיקייה אחת, כרשימה או כרשת, כל פריט קישור: תיקייה לאותו עמוד שנפתח עליו — כאן דרך ?folder= — קובץ לכל מקום שהעמוד שולח אותו.'
