~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: درخت
page_icon: 'ph:bold/tree-structure'
section:
  default:
    title: 'مدیر فایل'
    description: 'تودرتویی کل ساختار است: یک آیتم زمانی باز می‌شود که باز باشد و عمق آن ردیف را تو رفتگی می‌دهد در حالی که هایلایت هنوز عرض کامل را پوشش می‌دهد.'
  vue:
    title: Vue
    description: 'همان نشانه‌گذاری، همان شکل، اما پوشه‌ها باز و بسته می‌شوند: فلش است که یک گره را تا می‌کند و کلیک در هر نقطه دیگری از ردیف، آیتم را انتخاب کرده و آن را به عنوان یک رویداد انتخابی ارسال می‌کند.'
  vue_workspace:
    title: 'Vue، در یک فضای کاری'
    description: 'مدیر به عنوان یک اپلیکیشن ارائه می‌شود: درخت vue در منطقه قابل اسکرول یک تقسیم، که ردیف‌های بیشتری از ارتفاع منطقه دارد و نام‌های طولانی‌تری از عرض آن. این منطقه در هر دو محور اسکرول می‌شود و نوار افقی در کف خود باقی می‌ماند، هرچه آخرین ردیف باشد.'
  plain:
    title: 'بدون آیکون'
    description: 'شکل هیچ اطلاعاتی درباره فایل‌ها ندارد — یک آیتم بدون آیکون و بدون لینک به عنوان متن ساده نمایش داده می‌شود.'
