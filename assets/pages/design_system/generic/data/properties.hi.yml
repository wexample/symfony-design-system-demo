~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: गुण
page_icon: 'ph:bold/list-dashes'
intro: 'कुंजी / मान जो परिभाषा सूची के रूप में प्रदर्शित होते हैं। पंक्तियाँ सूची के उपग्रिड हैं, इसलिए कुंजियाँ एकल स्तंभ में संरेखित रहती हैं जबकि प्रत्येक पंक्ति एक वास्तविक बॉक्स बनी रहती है जो एक separator ले जा सकती है।'
section:
  default:
    title: डिफ़ॉल्ट
    description: 'कुंजी स्तंभ अपने सबसे लंबे लेबल के अनुसार आकार लेता है। इसे स्थिर करने के लिए --properties-key-width को ओवरराइड करें।'
  bordered:
    title: सीमाबद्ध
    description: 'एक ब्लॉक बॉडी के अंदर घनी रिकॉर्ड के लिए पंक्तियों के बीच एक separator।'
    block_title: 'संयोग विवरण'
  split:
    title: विभाजित
    description: 'मान दाहिनी ओर धकेले जाते हैं - कुल, संतुलन, कोई भी जो आंकड़ों के स्तंभ के रूप में पढ़ा जाता है।'
  compact:
    title: संक्षिप्त
    description: 'जब सूची बाकी ब्लॉक के लिए द्वितीयक होती है, तो पंक्तियाँ तंग होती हैं।'
  stacked:
    title: स्टैक्ड
    description: 'कुंजी मान के ऊपर, संकीर्ण स्तंभों के लिए जहाँ दो स्तंभ बुरी तरह लपेटेंगे।'
    aside: 'शरीर शेष चौड़ाई बनाए रखता है जबकि साइड स्तंभ स्थिर रहता है।'
  columns:
    title: स्तंभ
    description: 'एक लंबा स्तंभ में बुरी तरह पढ़ी गई दर्जन भर छोटे जोड़े: आँख एक कुंजी और उसके मान के बीच पृष्ठ की चौड़ाई को पार करती है, और separators अंततः प्रत्येक जोड़े को एक साथ पकड़ लेते हैं। स्तंभों में बिछाए गए - जितने चौड़ाई अनुमति देती है, एक फोन पर एक तक - एक जोड़ा दो लाइनों का एक छोटा ब्लॉक बन जाता है जिसे इसके चारों ओर किसी नियम की आवश्यकता नहीं होती। कोई मान जो कोई स्तंभ नहीं पकड़ सकता है, `full` के साथ पूरी चौड़ाई ले लेता है।'
  vue:
    title: Vue
    description: 'उसी सूची को एक vue भाग के रूप में, जो modifiers को props के रूप में लेता है: एक रिकॉर्ड जो पृष्ठ चलते समय बनाया जाता है, ऐसा पढ़ता है जैसे इसे इसके साथ प्रस्तुत किया गया था।'
