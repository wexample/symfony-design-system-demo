~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ڈیٹا
page_icon: 'ph:bold/list-bullets'
intro: 'شکلیں جو ایک مجموعے کو لے کر اسے پیش کرتی ہیں۔ ان میں فرق یہ ہے کہ قارئین کو ہر ریکارڈ میں سے کتنا نظر آتا ہے، اور جب وہ اسے دیکھتے ہیں تو وہ اس کے ساتھ کیا کر سکتے ہیں۔'
page:
  files:
    title: فائلیں
    description: 'ایک فائل ایکسپلورر جو صفحے کی چوڑائی میں ہے، ایک لوڈر سے چلایا جاتا ہے، اور ایک فولڈر سرور کی طرف سے بنایا گیا ہے۔'
  tables:
    title: ٹیبلز
    description: 'قطاریں اور کالم، سرور کے ذریعے پیش کردہ یا براؤزر کے ذریعہ صفحات میں تقسیم، ٹائپ کردہ سیلز کے ساتھ - لنکس، کارروائیاں، آئکن اور تاریخیں جو گنتی میں رہتی ہیں۔'
  live:
    title: 'اپ ڈیٹ رہنا'
    description: 'تین طریقے جن سے ایک مجموعہ جانتا ہے کہ جو وہ دکھاتا ہے وہ تبدیل ہو گیا ہے - ایک ایپ ایونٹ، ایک لائیو سورس، یا پولنگ - اور ہر ایک کا مقصد کیا ہے۔'
  lists:
    title: فہرستیں
    description: 'ایک فہرست جو اپنی ہی ہیڈنگ سے تلاش کی جاتی ہے اور فلٹر کی جاتی ہے، ایک سیٹ کے لئے جسے قارئین براؤز کرتے ہیں نہ کہ اسکین کرتے ہیں۔'
  properties:
    title: خصوصیات
    description: 'چابی اور قیمت، ایک ریکارڈ کے لئے نہ کہ کئی کے لئے - ایک چیز کے تفصیلات کا پینل جو پہلے ہی منتخب کی گئی ہے۔'
  bars:
    title: بارز
    description: 'ایک ریکارڈ جس کا نام ایک ہی لائن میں ہے: ایک آئکن، ایک عنوان، جو اسے اہل بناتا ہے۔ جس قطار میں ایک تلاش کا نتیجہ، ایک رکن یا ایک فائل پیش کی جاتی ہے۔'
  tree:
    title: درخت
    description: 'ایک مجموعہ جس کے ریکارڈ ایک دوسرے میں موجود ہوتے ہیں، ایک وقت میں ایک لیول لوڈ ہوتے ہیں، اس پینل میں جو ایک ایکسپلورر بھیجتا ہے۔'
  chat:
    title: چیٹ
    description: 'ایک مجموعہ جو پیچھے کی طرف پڑھا جاتا ہے اور نیچے سے شامل کیا جاتا ہے، لائیو، ایک کمپوزر کے ساتھ جو لکھنے کے ساتھ بڑھتا ہے۔'
