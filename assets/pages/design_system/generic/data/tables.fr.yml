~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Tables
page_icon: 'ph:bold/table'
section:
  wide:
    title: 'Plus large que la pièce'
    description: "Une table dont les colonnes nécessitent plus d'espace que la page n'en possède est dessinée à la largeur dont elle a besoin, dans un cadre qui défile latéralement — la page autour ne bouge pas. Une table fixe abandonne cela : un en-tête collé à la page et un cadre qui défile de lui-même ne peuvent pas être réunis."
  default:
    title: 'Table simple'
  actions:
    title: 'Table avec actions'
  links:
    title: 'Cellules avec lien et icône'
  loading:
    title: 'État de chargement'
  empty:
    title: 'État vide'
  alignment:
    title: 'Alignement des colonnes'
  markdown:
    title: 'Depuis markdown'
    description: "Une table écrite en markdown et passée par `markdown_ds` : les colonnes, leur alignement et le balisage de chaque cellule sont lus à partir du document, et la table est dessinée ici comme n'importe quelle autre. `markdown` conserve le simple `<table>`, pour tout ce qui n'est pas une page — un mail, un fil."
  groups:
    title: 'Groupes de lignes'
    description: "Une ligne portant uniquement un groupe n'est pas une ligne : c'est la ligne entre deux séries, donnée par un mot. Elle s'étend sur la table et nomme ce qui suit — la même lecture qu'un séparateur de menu."
  status:
    title: "Cellules d'état"
    description: "Un état est un cercle, jamais une couleur choisie par quelqu'un : la cellule prend un nom de type, ou un type avec un compte et un titre, et dessine l'icône de statut que le reste du système dessine. Rien à styliser dans la page."
  sticky:
    title: 'En-tête fixe'
    description: "Une longue table est lue colonne par colonne autant que ligne par ligne. Avec `sticky`, l'en-tête reste visible pendant que les lignes défilent en dessous ; une page avec quelque chose de fixé en haut indique combien de distance en `--table-sticky-top`."
  striped:
    title: 'Lignes rayées, éclairées sous le pointeur'
  selection:
    title: 'Lignes pouvant être cochées'
    description: "Une case en tête de chaque ligne, une dans l'en-tête pour toutes, et les actions au-dessus : elles envoient les lignes cochées à leur propre adresse, et restent hors de portée tant que rien n'est coché."
  files:
    title: 'Fichiers, un total, une action sur chaque ligne'
    description: "Chemins lus par leur nom, les dossiers avant étant coupés de leur début. La barre se termine sur combien de lignes il y a, et une action marquée `all` fonctionne sans rien coché — elle prend chaque ligne, et mène la barre quand c'est celle attendue."
  filters:
    title: Filtres
    description: "Une barre de filtres en tête de la table, un menu discret chacun, indiquant ce qu'il réduit une fois activé. Sur le serveur, ils vivent dans la requête de la page — chaque option est un lien — et le contrôleur réduit les lignes à partir de cela ; dans vue, elles sont une valeur remise à la page pour son API, ou appliquées par la table aux lignes qu'elle a déjà. Chaque option est une case — ronde pour un choix unique — colorée par son ton lorsqu'elle en a un, un état ou une catégorie."
  selection_select:
    title: 'Actions dans une sélection'
    description: "La même barre quand il y a assez d'actions pour l'encombrer : une est choisie, puis appliquée."
  vue:
    title: "Table d'entités Vue"
  vue_selection:
    title: 'Table Vue avec sélection'
    description: "Le même contrat côté client : les clés cochées reviennent par v-model:selected, chaque action est émise comme action de masse, et une avec une adresse est postée comme la table du serveur le poste. Celles-ci n'en ont aucune, donc la ligne ci-dessous indique ce qui aurait été fait. Trois lignes par page, le total à la fin de la barre, et Archiver tout nécessitant aucune coche."
  vue_compact:
    title: 'Pagination sans total'
    description: "Lorsque l'API ne renvoie pas de total, le pager revient à précédent/suivant."
  vue_dates:
    title: 'Formateurs de date Vue'
