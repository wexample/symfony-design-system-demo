~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Özellikler
page_icon: 'ph:bold/list-dashes'
intro: 'Anahtar / değer çiftleri tanım listesi olarak görüntülenir. Satırlar listenin alt ızgaralarıdır, bu nedenle anahtarlar tek bir sütunda hizalanırken her satır gerçek bir kutu olarak kalır ve bir ayırıcı taşıyabilir.'
section:
  default:
    title: Varsayılan
    description: "Anahtar sütunu en uzun etikete göre boyutlandırılır. Bunu sabitlemek için --properties-key-width'i geçersiz kılın."
  bordered:
    title: Kenarlıklı
    description: 'Bir blok gövdesi içinde yoğun kayıtlar için satırlar arasında bir ayırıcı.'
    block_title: 'Bağlantı detayları'
  split:
    title: Böl
    description: 'Değerler sağ kenara itilmiştir — toplamlar, bakiyeler, sayılar sütunu olarak okunan her şey.'
  compact:
    title: Kompakt
    description: 'Liste, bloğun geri kalanına göre ikincil olduğunda daha sıkı satırlar.'
  stacked:
    title: 'Üst Üste'
    description: 'Anahtar değerin üstünde, iki sütunun kötü saracağı dar sütunlar için.'
    aside: 'Gövde kalan genişliği korurken yan sütun sabit kalır.'
  columns:
    title: Sütunlar
    description: 'Bir uzun sütunda kötü okunan bir düzine kısa çift: göz, bir anahtar ile değeri arasında sayfanın genişliğini geçer ve ayırıcılar her çifti bir arada tutar. Sütunlar halinde yerleştirildiğinde — genişliğin izin verdiği kadar, telefonda bir tane kadar — bir çift, etrafında herhangi bir kural olmadan iki satırlık küçük bir blok haline gelir. Hiçbir sütunun tutamayacağı bir değer, `full` ile tüm genişliği kaplar.'
  vue:
    title: Vue
    description: 'Modifikatörleri prop olarak alan bir vue parçası olarak aynı liste: sayfa çalışırken oluşturulan bir kayıt, onunla render edilmiş gibi görünür.'
