~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: الحانات
page_icon: 'ph:bold/rows'
intro: 'الحانة تسمي شيئًا واحدًا في سطر واحد: ما هو، ما يسمى، ما يؤهله، وما ينتمي إلى الطرف البعيد. إنها شكل، وليست ارتباطًا - كيان يصل إليها من خلال قالب خاص به، لكن نتيجة البحث التي هي ملف أو تطبيق أو إعداد تستخدم نفس العلامة.'
finding:
  fix: إصلاح
  date: 'حدد تاريخًا'
  error:
    title: 'قسم إلزامي مفقود "الهدف"'
    subtitle: 01-PROCESSES/PR-004-document-control.md
  warning:
    title: 'تاريخ المراجعة في الماضي'
    subtitle: '01-PROCESSES/PR-004-document-control.md:4'
  info:
    title: 'حقل المالك ترك فارغًا'
    subtitle: 'لا يمنع من المسودة، مطلوب قبل المراجعة'
section:
  findings:
    title: النتائج
    description: 'ما تقاريره التحليل، حانة واحدة لكل منها: النتيجة كعنوان، مكانها كعنوان فرعي، وما يمكن القيام به حيال ذلك في الخانة النهائية - لا شيء هنا عندما لا يمكن القيام بشيء هنا. الخطورة هي نغمة الكتلة، التي يأخذها avatar في الرأس أيضًا.'
  alone:
    title: 'الحانة نفسها'
    description: 'كل شيء عدا العنوان اختياري. تأخذ الخانة الرائدة أيقونة، أو أي علامة عندما تكون الصورة الرمزية الحقيقية مطلوبة؛ تأخذ الخانة النهائية تاريخًا، أو علامة، أو صف من الأزرار. عند إعطاء رابط، يصبح العرض الكامل الهدف ويحتفظ العنوان بلون المكان الذي يجلس فيه.'
  search:
    title: 'قائمة النتائج'
    description: 'تجلب القائمة الإطار، حقل البحث والفواصل؛ كل صف يجلب حانة. لا شيء هنا هو كيان - هذه هي النقطة: نفس الصف يخدم شخصًا، مستندًا، تطبيقًا وتفضيلًا.'
  surfaces:
    title: 'سطح واحد لكل'
    description: 'القراءة الأخرى لقائمة - لا خلفية مشتركة ولا خط، كل حانة تقف على كتلتها الخاصة مع مساحة حولها. لا شيء جديد لتصميمه، تأخذ الحانة ببساطة فئات الكتلة، وعند إعطاء رابط، تصبح البطاقة بأكملها الهدف.'
  divided:
    title: 'قائمة بسيطة'
    description: 'عندما يكون الإطار موجودًا بالفعل، فإن كومة رأسية مع فواصل تكفي - لا شكل خاص بها، مجرد خط بين صفين.'
  vue:
    title: 'قائمة منها، في Vue'
    description: 'نفس الصفوف تقرأ من نقطة نهاية بدلاً من كتابتها: تحتفظ القائمة بالصفحة، والترقيم، والحالة الفارغة، وكل كيان يقول ماذا يقرأ عليه - عنوان، ما يؤهله، أيقونة، إلى أين يقود، تاريخ في الطرف البعيد. القراءات أعلاه هي متغيراتها، "مقسمة" ثم "أسطح".'
  keeping_up:
    title: 'وتم تحديثه'
    description: 'قائمة الحانات هي مجموعة مثل أي مجموعة أخرى، لذا فإن الطرق الثلاثة التي تسمع بها مجموعة أن العالم قد تقدم مفتوحة لها: حدث تطبيق، مصدر مباشر، استقصاء. هذه تستمع إلى حدث - رنها وراقب الصفوف تعود. انظر "مواكبة" للثلاثة منهم جنبًا إلى جنب.'
