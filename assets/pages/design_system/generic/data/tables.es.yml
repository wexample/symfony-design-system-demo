~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Tablas
page_icon: 'ph:bold/table'
section:
  wide:
    title: 'Más ancho que la habitación'
    description: 'Una tabla cuyas columnas piden más de lo que la página tiene se dibuja con el ancho que necesita, en un marco que se desplaza horizontalmente — la página a su alrededor no se mueve. Una tabla pegajosa renuncia a esto: un encabezado que se adhiere a la página y un marco que se desplaza por sí solo no se pueden tener juntos.'
  default:
    title: 'Tabla simple'
  actions:
    title: 'Tabla con acciones'
  links:
    title: 'Celdas de enlace e ícono'
  loading:
    title: 'Estado de carga'
  empty:
    title: 'Estado vacío'
  alignment:
    title: 'Alineación de columnas'
  markdown:
    title: 'Desde markdown'
    description: 'Una tabla escrita en markdown y pasada por `markdown_ds`: las columnas, su alineación y el marcado de cada celda se leen del documento, y la tabla se dibuja aquí como cualquier otra. `markdown` mantiene el simple `<table>`, para lo que no es una página — un correo, un feed.'
  groups:
    title: 'Agrupar filas'
    description: 'Una fila que lleva solo un grupo no es una fila: es la línea entre dos series de ellas, dado una palabra. Se extiende por la tabla y nombra lo que sigue — la misma lectura que un separador de menú.'
  status:
    title: 'Celdas de estado'
    description: 'Un estado es un círculo, nunca un color que alguien eligió: la celda toma un nombre de tipo, o un tipo con un recuento y un título, y dibuja el ícono de estado que el resto del sistema dibuja. Nada para estilizar en la página.'
  sticky:
    title: 'Encabezado pegajoso'
    description: 'Una tabla larga se lee columna por columna tanto como fila por fila. Con `sticky`, el encabezado permanece a la vista mientras las filas se desplazan por debajo; una página con algo propio fijado en la parte superior indica cuán abajo en `--table-sticky-top`.'
  striped:
    title: 'Filas a rayas, iluminadas bajo el puntero'
  selection:
    title: 'Filas que pueden ser marcadas'
    description: 'Una casilla en la cabeza de cada fila, una en el encabezado para todas, y las acciones arriba: publican las filas marcadas a su propia dirección, y se mantienen fuera de alcance mientras nada esté marcado.'
  files:
    title: 'Archivos, un total, una acción en cada fila'
    description: 'Rutas leídas por su nombre, las carpetas antes se cortan desde su inicio. La barra termina en cuántas filas hay, y una acción marcada como `todo` funciona con nada marcado — toma cada fila y guía la barra cuando es la esperada.'
  filters:
    title: Filtros
    description: 'Una barra de filtros en la cabeza de la tabla, un menú discreto cada uno, diciendo a qué se reduce una vez que lo hace. En el servidor viven en la consulta de la página — cada opción es un enlace — y el controlador reduce las filas a partir de ello; en vue son un valor entregado a la página para su api, o aplicados por la tabla a las filas que ya tiene. Cada opción es una caja — redonda para una elección de uno — coloreada por su tono cuando tiene uno, un estado o una categoría.'
  selection_select:
    title: 'Acciones en una selección'
    description: 'La misma barra cuando hay suficientes acciones para abarrotarla: se elige una, luego se aplica.'
  vue:
    title: 'Tabla de entidad Vue'
  vue_selection:
    title: 'Tabla Vue con selección'
    description: 'El mismo contrato en el cliente: las claves marcadas regresan a través de v-model:selected, cada acción se emite como acción masiva, y una con una dirección se publica como la tabla del servidor la publica. Estas no tienen ninguna, por lo que la línea de abajo dice lo que se habría hecho. Tres filas por página, el total al final de la barra, y Archivar todo sin necesidad de nada marcado.'
  vue_compact:
    title: 'Paginación sin un total'
    description: 'Cuando la API no devuelve un total, el paginador recurre a anterior/siguiente.'
  vue_dates:
    title: 'Formateadores de fecha Vue'
