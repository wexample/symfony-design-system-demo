~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: プロパティ
page_icon: 'ph:bold/list-dashes'
intro: キーと値のペアが定義リストとして表示されます。行はリストのサブグリッドであり、キーは単一の列に整列し、各行はセパレーターを持つ実際のボックスとして保持されます。
section:
  default:
    title: デフォルト
    description: キー列は最も長いラベルに合わせてサイズを調整します。--properties-key-widthをオーバーライドして固定できます。
  bordered:
    title: ボーダー付き
    description: ブロックボディ内の密なレコードのための行間のセパレーター。
    block_title: 接続の詳細
  split:
    title: 分割
    description: '右端に押し出された値 — 合計、残高、数字の列として読み取られるもの。'
  compact:
    title: コンパクト
    description: リストがブロックの他の部分に対して二次的な場合、行をタイトにします。
  stacked:
    title: スタック
    description: 狭い列のために、値の上にキーを配置し、2つの列がうまくラップされないようにします。
    aside: ボディは残りの幅を保持し、サイド列は固定されます。
  columns:
    title: 列
    description: 短いペアが1つの高い列では読みづらく、目はキーとその値の間でページの幅を横切ります。セパレーターは各ペアを一緒に保持します。列にレイアウトされると、幅が許す限り、携帯電話では1つにまで、ペアは2行の小さなブロックとなり、その周りにルールは必要ありません。どの列も保持できない値は、`full`で全幅を取ります。
  vue:
    title: Vue
    description: 同じリストがvueパーシャルとして、修飾子をプロップとして受け取ります。ページが実行される間に構築されたレコードは、それと一緒にレンダリングされたもののように読み取られます。
