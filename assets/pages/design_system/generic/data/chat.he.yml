~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: שיחה
page_icon: 'ph:bold/chats-circle'
chat:
  title: 'דוגמת שיחה'
vue:
  title: Vue
  description: |
    אותו חוט ואותו יוצר, נDraw על ידי רכיב השיחה של הישות. הוא מחזיק אוסף של ישויות ואינו יודע מה הן: המחבר, הטקסט והתאריך נקראים דרך projections שאחת התתי-מחלקות מחליפה, והודעה שהוגשה יוצאת דרך המאגר כמו כל יצירה אחרת. התשובה נכתבת ברגע שהבקשה מסתיימת, כך שהיא לא יכולה לחזור בתגובה להודעה: היא מגיעה לדף דרך המנוי החי שהחוט הזה מחזיק בחדר שלו.
description:
  body: |
    גן המשחקים של השיחה הזה משמש לאימות קצב ההודעות, רווחים וצפיפות אנכית לפני עיצוב הממשק הסופי. שמור על בלוק זה מכוון להיות מפורט בכוונה כך שהפריסה תהיה בגובה מספיק כדי לדמות זרימת שיחה ריאליסטית, כולל שורות בינוניות וארוכות, התנהגות עטיפה ופסקי קריאה טבעיים על פני מספר משפטים. המטרה היא לספק בסיס חזותי יציב שהרכיבי שיחה העתידיים יכולים לעקוב אחריו, כך שהמדידות יישארו עקביות כאשר מחליפים טקסט זה עם הודעות אמיתיות של משתמש ועוזר.
composer:
  placeholder: 'כתוב הודעה...'
  submit_label: 'שלח הודעה'
  action_plus_label: 'הוסף תוכן'
  action_smiley_label: "הכנס אימוג'י"
  multiline_value: |
    זהו טיוטת שיחה ארוכה יותר המשמשת להציג את מצב השורות המרובות. היא עטופה על פני מספר שורות כך שההבדל החזותי עם השדה של שורה אחת ברור.
messages:
  user_1: |
    האם תוכל לסכם את הפריטים לפעולה מהסינכרון של אתמול ולשמור רק את ההחלטות שאנחנו יכולים לבצע השבוע?
  user_2: |
    שמור גם על התוצאה קצרה כי זה יועתק לסרגל הצד של המנהל.
  assistant_1: |
    בטח. אני יכול לספק סיכום תמציתי עם עדיפויות, בעלי תפקידים ונקודות ציון הבאות.
  assistant_2: |
    אני אשמור רק על החלטות מאומתות ואסיר שאלות פתוחות שעדיין צריכות גילוי.
  assistant_3: |
    מבנה מוצע: 1. פעולות מיידיות. 2. תלותים. 3. סיכונים שיש לעקוב אחריהם.
  assistant_4: |
    ברגע שהמבנה מאושר, הוא יכול להפוך לתבנית ברירת המחדל עבור תפריט השיחה במנהל.
