~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: तालिकाएँ
page_icon: 'ph:bold/table'
section:
  wide:
    title: 'कक्ष से बड़ा'
    description: 'एक तालिका जिसकी स्तंभों को पृष्ठ से अधिक चौड़ाई की आवश्यकता है, उसे आवश्यक चौड़ाई पर खींचा जाता है, एक फ्रेम में जो साइडवेज स्क्रॉल करता है - इसके चारों ओर का पृष्ठ नहीं हिलता। एक चिपचिपी तालिका इसे छोड़ देती है: एक शीर्षक जो पृष्ठ पर चिपका रहता है और एक फ्रेम जो अपने आप स्क्रॉल करता है, एक साथ नहीं हो सकता।'
  default:
    title: 'सरल तालिका'
  actions:
    title: 'कार्रवाई के साथ तालिका'
  links:
    title: 'लिंक और आइकन सेल'
  loading:
    title: 'लोडिंग स्थिति'
  empty:
    title: 'खाली स्थिति'
  alignment:
    title: 'स्तंभ संरेखण'
  markdown:
    title: 'मार्कडाउन से'
    description: 'मार्कडाउन में लिखी गई एक तालिका और `markdown_ds` से गुजरती है: स्तंभ, उनकी संरेखण और प्रत्येक सेल का मार्कअप दस्तावेज़ से पढ़ा जाता है, और तालिका को यहाँ किसी अन्य की तरह खींचा जाता है। `markdown` साधारण `<table>` को रखता है, जो कुछ भी पृष्ठ नहीं है - एक मेल, एक फीड।'
  groups:
    title: 'पंक्तियाँ समूहित करें'
    description: 'एक पंक्ति जो केवल एक समूह को ले जाती है, वह एक पंक्ति नहीं है: यह उनके दो सेटों के बीच की रेखा है, एक शब्द दिया गया। यह तालिका को फैलाती है और जो इसके बाद आता है उसका नाम देती है - एक मेन्यू सेपरेटर के समान पढ़ाई।'
  status:
    title: 'स्थिति सेल'
    description: 'एक स्थिति एक वृत्त है, कभी भी किसी द्वारा चुना गया रंग नहीं: सेल एक प्रकार का नाम लेता है, या एक प्रकार जिसमें एक गणना और एक शीर्षक होता है, और स्थिति आइकन को खींचता है जो सिस्टम के बाकी हिस्सों द्वारा खींचा जाता है। पृष्ठ में स्टाइल करने के लिए कुछ नहीं।'
  sticky:
    title: 'चिपचिपा शीर्षक'
    description: 'एक लंबी तालिका को स्तंभ द्वारा स्तंभ और पंक्ति द्वारा पंक्ति पढ़ा जाता है। `sticky` के साथ, शीर्षक दृश्य में रहता है जबकि पंक्तियाँ इसके नीचे स्क्रॉल होती हैं; एक पृष्ठ जिसमें शीर्ष पर किसी की अपनी चीज़ चिपकी होती है, यह बताता है कि `--table-sticky-top` में कितना नीचे है।'
  striped:
    title: 'धारीदार पंक्तियाँ, पॉइंटर के नीचे जलती हैं'
  selection:
    title: 'पंक्तियाँ जिन्हें टिक किया जा सकता है'
    description: 'प्रत्येक पंक्ति के सिर पर एक बॉक्स, सभी के लिए एक शीर्षक में, और ऊपर कार्रवाई: वे टिक की गई पंक्तियों को उनके अपने पते पर भेजते हैं, और जब कुछ नहीं टिक होता है तो पहुँच से बाहर रहते हैं।'
  files:
    title: 'फाइलें, एक कुल, हर पंक्ति पर एक क्रिया'
    description: 'उनके नाम से पढ़े गए पथ, उसके पहले के फ़ोल्डर को उनकी शुरुआत से काट दिया गया। बार इस पर समाप्त होता है कि कितनी पंक्तियाँ हैं, और एक क्रिया जो `all` के रूप में चिह्नित होती है, कुछ टिक किए बिना काम करती है - यह हर पंक्ति को लेती है, और जब यह अपेक्षित होता है तो बार को आगे बढ़ाती है।'
  filters:
    title: फिल्टर
    description: 'तालिका के शीर्ष पर एक फिल्टर बार, प्रत्येक के लिए एक विवेकपूर्ण मेन्यू, कहता है कि एक बार यह क्या संकीर्ण करता है। सर्वर पर वे पृष्ठ के प्रश्न में रहते हैं - प्रत्येक विकल्प एक लिंक है - और नियंत्रक पंक्तियों को उससे संकीर्ण करता है; vue में वे एक मान होते हैं जो पृष्ठ को उसके एपीआई के लिए दिया जाता है, या तालिका द्वारा पहले से ही उसकी पंक्तियों पर लागू किया जाता है। प्रत्येक विकल्प एक बॉक्स है - एक के लिए गोल - जब इसका कोई स्वर होता है, एक स्थिति या एक श्रेणी द्वारा रंगीन।'
  selection_select:
    title: 'चयन में क्रियाएँ'
    description: 'जब वहाँ पर्याप्त क्रियाएँ होती हैं कि उसे भीड़ दें: एक चुनी जाती है, फिर लागू होती है।'
  vue:
    title: 'Vue एंटिटी तालिका'
  vue_selection:
    title: 'चयन के साथ Vue तालिका'
    description: 'क्लाइंट पर वही अनुबंध: टिक की गई कुंजी v-model:selected के माध्यम से वापस आती हैं, प्रत्येक क्रिया को बल्क-एक्शन के रूप में उत्सर्जित किया जाता है, और एक पता के साथ एक को सर्वर तालिका के रूप में पोस्ट किया जाता है। इनमें से कोई नहीं है, इसलिए नीचे की पंक्ति बताती है कि क्या किया गया होता। प्रति पृष्ठ तीन पंक्तियाँ, बार के अंत में कुल, और Archive सभी को कुछ भी टिक किए बिना आवश्यकता होती है।'
  vue_compact:
    title: 'कुल के बिना पृष्ठांकन'
    description: 'जब एपीआई कुल नहीं लौटाता है, तो पेजर पिछले/अगले पर वापस जाता है।'
  vue_dates:
    title: 'Vue तिथि स्वरूपक'
