~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Czat
page_icon: 'ph:bold/chats-circle'
chat:
  title: 'Przykład czatu'
vue:
  title: Widok
  description: |
    Ten sam wątek i ten sam edytor, zbudowane przez komponent czatu. Przechowuje zbiór encji i nic nie wie o tym, czym one są: autor, tekst i data są odczytywane przez projekcje, które nadpisuje podklasa, a przesłana wiadomość wychodzi przez repozytorium jak każda inna kreacja. Odpowiedź jest zapisywana, gdy prośba się kończy, więc nie może wrócić w odpowiedzi na wiadomość: dociera na stronę przez na żywo subskrypcję, którą ten wątek ma w swoim pomieszczeniu.
description:
  body: |
    Ten plac zabaw czatu jest używany do walidacji rytmu wiadomości, odstępów i gęstości pionowej przed finalnym stylowaniem interfejsu użytkownika. Zachowaj ten blok celowo obszerny, aby układ miał wystarczającą wysokość do symulacji realistycznego przepływu rozmowy, w tym średnich i długich linii, zachowań zawijania i naturalnych przerw w czytaniu w wielu zdaniach. Celem jest zapewnienie stabilnej podstawy wizualnej, którą przyszłe komponenty czatu mogą naśladować, aby pomiary pozostały spójne podczas zastępowania tego tekstu rzeczywistymi wiadomościami użytkownika i asystenta.
composer:
  placeholder: 'Napisz wiadomość...'
  submit_label: 'Wyślij wiadomość'
  action_plus_label: 'Dodaj treść'
  action_smiley_label: 'Wstaw emoji'
  multiline_value: |
    To jest dłuższy szkic czatu używany do podglądu stanu wieloliniowego. Zawija się w wielu liniach, więc wizualna różnica z polem jednoliniowym jest oczywista.
messages:
  user_1: |
    Czy możesz podsumować punkty do działania z wczorajszego spotkania i zachować tylko decyzje, które możemy zrealizować w tym tygodniu?
  user_2: |
    Zachowaj również krótki wynik, ponieważ to zostanie skopiowane do panelu menedżera.
  assistant_1: |
    Pewnie. Mogę dostarczyć zwięzłe podsumowanie z priorytetami, właścicielami i następnych punktami kontrolnymi.
  assistant_2: |
    Zachowam tylko zatwierdzone decyzje i usunę otwarte pytania, które wciąż wymagają odkrycia.
  assistant_3: |
    Proponowana struktura: 1. Działania natychmiastowe. 2. Zależności. 3. Ryzyka do monitorowania.
  assistant_4: |
    Po zatwierdzeniu, ta struktura może stać się domyślnym szablonem dla menu czatu w menedżerze.
