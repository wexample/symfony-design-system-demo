~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: להתעדכן
page_icon: 'ph:bold/broadcast'
intro: 'אוסף נקרא פעם אחת כשהוא מופיע, ואז העולם ממשיך. אלו שלוש הדרכים שבהן הוא שומע על כך — הן לא חלופות לבחור ביניהן פעם ולתמיד, אלא מה שהסיטואציה של האוסף מציעה. אותה טבלה מקבלת כל אחת מהן, או כמה, ואין דבר שמתחת יודע איזו מהן צלצלה.'
section:
  events:
    title: 'אירוע של אפליקציה'
    description: 'לשינוי שהדף הזה גרם לעצמו: כפתור שפעל, טופס שחזר. מי שמצלצל לא יודע דבר על הטבלה, והטבלה לא יודעת דבר על מי שצלצל — הם חולקים שם וזה הכל. לא עולה דבר ולא צריך שרת.'
  live:
    title: 'מקור חי'
    description: 'כאשר לשרת יש נושא לפרסם עליו, האוסף מקשיב לישות שהוא האוסף שלה — תהליך עבור הריצות שלו, מפגש עבור ההודעות שלו — ולא לכל שורה משלו. שורה שלא קיימת עדיין אין לה נושא, והשורה שמופיעה היא בדיוק זו שהקורא מחכה לה. הדמו אין לו שרת לפרסם בשבילו, כך שהכפתור משמיע את ההודעה.'
  polling:
    title: שאילתות
    description: 'כאשר אין נושא, או כאשר טיול הלוך ושוב מדי פעם זול יותר משירות מנוי פתוח. זה קורא כל שלושה שניות, ועוצר בזמן שהטאב ברקע — דף שאף אחד לא מסתכל עליו הוא דף שאף אחד לא צריך לקרוא לו.'
  none:
    title: 'שום דבר בכלל'
    description: 'הברירת מחדל. אוסף נקרא פעם אחת ונשאר כפי שהיה, שהיא התשובה הנכונה בכל פעם מה שהוא מציג לא משתנה מאחורי הגב של הקורא.'
  shape:
    title: 'כל צורה שהיא לובשת'
    description: "אף אחד מזה לא שייך לטבלה. שלוש הדרכים האלו משמשות רשימה של ברים, שיחת צ'אט, כל דבר שקורא אוסף — מה שומר על אוסף אמיתי ומה שהוא נראה הם שתי החלטות נפרדות. זהו רשימת ברים, שאילתה."
