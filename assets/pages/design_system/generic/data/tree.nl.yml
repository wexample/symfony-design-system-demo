~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Boom
page_icon: 'ph:bold/tree-structure'
section:
  default:
    title: Bestandsverkenner
    description: 'Nesting is de hele structuur: een item opent wanneer het open is, en de diepte bepaalt hoe de rij wordt ingesprongen terwijl de markering de volledige breedte beslaat.'
  vue:
    title: Vue
    description: 'Zelfde opmaak, zelfde vorm, maar de mappen openen en sluiten: de chevron vouwt een knooppunt, en een klik ergens anders op de rij selecteert het item en stuurt het als een selecteer gebeurtenis.'
  vue_workspace:
    title: 'Vue, in een werkruimte'
    description: 'De verkenner als een app wordt geleverd: de vue-boom in de scrollbare zone van een splitsing, met meer rijen dan de zone hoog is en langere namen dan de zone breed is. De zone scrollt op beide assen en de horizontale balk blijft op zijn vloer, ongeacht wat de laatste rij is.'
  plain:
    title: 'Zonder pictogrammen'
    description: 'De vorm weet niets van bestanden — een item zonder pictogram en zonder link wordt weergegeven als platte tekst.'
explorer:
  scope:
    project: Project
    packages: Pakketten
    scratches: Notities
    changed: 'Gewijzigde bestanden'
  option:
    filters: Filters
    sort: 'Sorteren op naam'
    hidden: 'Toon verborgen bestanden'
  action:
    new: 'Nieuw bestand'
    locate: 'Selecteer geopend bestand'
    collapse: 'Alles inklappen'
  body: 'De boom heeft geen eigen breedte en hoogte: de zone ernaast is een gewone, en elke kant scrollt apart.'
plain:
  root: Root
  child: 'Eerste kind'
  sibling: 'Tweede kind'
