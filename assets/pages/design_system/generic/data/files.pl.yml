~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Pliki
page_icon: 'ph:bold/folder-open'
intro: 'Eksplorator plików o szerokości strony. Nie wie, skąd pochodzą pliki: prosi o zawartość folderu i pobiera jednostki plików — tak samo, jak drzewo — więc dysk, indeks, archiwum czy API są traktowane jednakowo.'
root: Pliki
section:
  vue:
    title: Eksplorator
    description: 'Foldery po bokach, zawartość folderu jako lista posortowana według dowolnej kolumny lub w formie siatki; wstecz, naprzód i w górę; filtr; zaznaczanie myszą — ctrl, shift — i klawiaturą — strzałki, Enter, Backspace, ctrl+A, Escape; więcej opcji, gdy folder zawiera więcej niż jedną stronę. Podwójne kliknięcie wchodzi do folderu i przekazuje plik na stronę. Widok i kolejność są zapamiętywane.'
  twig:
    title: 'Rysowane przez serwer'
    description: 'Jeden folder, w formie listy lub siatki, każdy element to link: folder do tej samej strony otwartej na nim — tutaj przez ?folder= — plik do miejsca, do którego strona go wyśle.'
