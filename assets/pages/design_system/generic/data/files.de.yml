~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Dateien
page_icon: 'ph:bold/folder-open'
intro: 'Ein Dateiexplorer in der Breite einer Seite. Er weiß nichts darüber, woher die Dateien kommen: Er fragt nach dem Inhalt eines Ordners und nimmt Dateiobjekte zurück - genau wie ein Baum - sodass eine Festplatte, ein Index, ein Archiv oder eine API alle gleich gelesen werden.'
root: Dateien
section:
  vue:
    title: 'Der Explorer'
    description: 'Ordner an der Seite, der Inhalt des Ordners als Liste, sortiert nach einer beliebigen Spalte oder als Raster; zurück, vorwärts und nach oben; ein Filter; Auswahl mit der Maus — ctrl, shift — und der Tastatur — Pfeile, Enter, Rücktaste, ctrl+A, Escape; mehr wird angefordert, wenn ein Ordner mehr als eine Seite enthält. Doppelklick öffnet einen Ordner und übergibt eine Datei an die Seite. Die Ansicht und die Reihenfolge werden gespeichert.'
  twig:
    title: 'Vom Server erstellt'
    description: 'Ein Ordner, als Liste oder Raster, jedes Element ein Link: ein Ordner zur gleichen Seite, die darauf geöffnet wird — hier über ?folder= — eine Datei wohin auch immer die Seite sie sendet.'
