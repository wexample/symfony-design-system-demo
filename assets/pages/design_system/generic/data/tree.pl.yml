~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Drzewo
page_icon: 'ph:bold/tree-structure'
section:
  default:
    title: 'Eksplorator plików'
    description: 'Zagnieżdżenie to cała struktura: element otwiera się, gdy jest otwarty, a jego głębokość to to, co wcięcie wiersza, podczas gdy podświetlenie nadal rozciąga się na całą szerokość.'
  vue:
    title: Vue
    description: 'Ta sama struktura, ten sam kształt, ale foldery się otwierają i zamykają: chevron to to, co składa węzeł, a kliknięcie gdzie indziej w wierszu wybiera element i przesyła go jako zdarzenie wyboru.'
  vue_workspace:
    title: 'Vue w przestrzeni roboczej'
    description: 'Eksplorator jako aplikacja dostarcza to: drzewo vue w przewijanej strefie podziału, zawierające więcej wierszy niż strefa jest wysoka i dłuższe nazwy niż jest szeroka. Strefa przewija się w obu osiach, a poziomy pasek pozostaje na swoim dnie, niezależnie od tego, jaka jest ostatnia linia.'
  plain:
    title: 'Bez ikon'
    description: 'Kształt nic nie wie o plikach — element bez ikony i bez linku renderuje się jako zwykły tekst.'
explorer:
  scope:
    project: Projekt
    packages: Pakiety
    scratches: Notatki
    changed: 'Zmienione pliki'
  option:
    filters: Filtry
    sort: 'Sortuj według nazwy'
    hidden: 'Pokaż ukryte pliki'
  action:
    new: 'Nowy plik'
    locate: 'Wybierz otwarty plik'
    collapse: 'Zwiń wszystko'
  body: 'Drzewo nie ma własnej szerokości ani wysokości: strefa obok niego jest zwykła, a każda strona przewija się osobno.'
plain:
  root: Root
  child: 'Pierwsze dziecko'
  sibling: 'Drugie dziecko'
