~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ファイル
page_icon: 'ph:bold/folder-open'
intro: 'ページ幅のファイルエクスプローラーです。ファイルの出所については何も知りません：フォルダーの内容を要求し、ファイルエンティティを取得します — ツリーが受け取るのと同じローダーです — したがって、ディスク、インデックス、アーカイブ、またはAPIはすべて同様に読み取ります。'
root: ファイル
section:
  vue:
    title: エクスプローラー
    description: 'サイドにフォルダー、フォルダーの内容は任意の列でソートされたリストまたはグリッドとして表示されます；戻る、進む、上へ；フィルター；マウスによる選択 — ctrl、shift — とキーボード — 矢印、Enter、Backspace、ctrl+A、Escape；フォルダーがページを超える場合にはさらに要求されます。ダブルクリックでフォルダーに入り、ファイルをページに渡します。ビューと順序は記憶されます。'
  twig:
    title: サーバーによって描画された
    description: '1つのフォルダーがリストまたはグリッドとして表示され、各アイテムはリンクです：同じページに開かれたフォルダー — ここでは ?folder= を通じて — ファイルはページが送信する場所です。'
