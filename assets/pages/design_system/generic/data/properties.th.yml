~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: คุณสมบัติ
page_icon: 'ph:bold/list-dashes'
intro: 'คู่คีย์/ค่า ที่แสดงเป็นรายการคำจำกัดความ แถวเป็นซับกริดของรายการ ดังนั้นคีย์จึงเรียงอยู่ในคอลัมน์เดียว ขณะที่แต่ละแถวยังคงเป็นกล่องจริงที่สามารถมีตัวคั่นได้'
section:
  default:
    title: ค่าเริ่มต้น
    description: 'คอลัมน์คีย์ปรับขนาดตามป้ายชื่อที่ยาวที่สุด สามารถเขียนทับ --properties-key-width เพื่อกำหนดขนาดได้'
  bordered:
    title: มีขอบ
    description: 'ตัวคั่นระหว่างแถว สำหรับบันทึกที่หนาแน่นภายในบล็อก'
    block_title: รายละเอียดการเชื่อมต่อ
  split:
    title: แยก
    description: 'ค่าที่ถูกผลักไปยังขอบขวา — ยอดรวม, ยอดคงเหลือ, ทุกอย่างที่อ่านเป็นคอลัมน์ของตัวเลข'
  compact:
    title: กระชับ
    description: แถวที่แน่นขึ้นเมื่อรายการเป็นสิ่งรองจากบล็อกอื่น
  stacked:
    title: ซ้อนกัน
    description: คีย์อยู่ด้านบนค่าหมายถึงคอลัมน์แคบที่สองคอลัมน์จะซ้อนกันได้ไม่ดี
    aside: เนื้อหายังคงความกว้างที่เหลืออยู่ในขณะที่คอลัมน์ข้างเคียงยังคงอยู่ในตำแหน่งที่แน่นอน
  columns:
    title: คอลัมน์
    description: 'คู่สั้นสิบคู่จะอ่านได้ไม่ดีในคอลัมน์สูงหนึ่งคอลัมน์: ตาจะข้ามความกว้างของหน้าไประหว่างคีย์และค่าของมัน และตัวคั่นจะทำให้แต่ละคู่ยึดติดกัน เมื่อจัดเรียงในคอลัมน์ — จำนวนเท่าที่กว้างอนุญาต ตั้งแต่หนึ่งบนโทรศัพท์ — คู่จะกลายเป็นบล็อกเล็กๆ ของสองบรรทัดที่ไม่ต้องการกฎรอบมัน ค่าที่ไม่มีคอลัมน์ใดสามารถถือไว้จะใช้ความกว้างทั้งหมดด้วย `full`'
  vue:
    title: Vue
    description: 'รายการเดียวกันในรูปแบบ vue ที่ใช้ตัวแก้ไขเป็น props: บันทึกที่สร้างขึ้นขณะหน้าเว็บทำงานจะอ่านได้เหมือนหนึ่งที่แสดงด้วยมัน'
