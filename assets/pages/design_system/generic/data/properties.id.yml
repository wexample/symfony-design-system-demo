~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Properti
page_icon: 'ph:bold/list-dashes'
intro: 'Pasangan kunci / nilai ditampilkan sebagai daftar definisi. Baris adalah subgrid dari daftar, sehingga kunci tetap teratur dalam satu kolom sementara setiap baris tetap sebagai kotak nyata yang dapat membawa pemisah.'
section:
  default:
    title: Standar
    description: 'Kolom kunci menyesuaikan diri pada label terpanjang. Ganti --properties-key-width untuk menetapkannya.'
  bordered:
    title: Bersisi
    description: 'Sebuah pemisah antara baris, untuk catatan padat di dalam tubuh blok.'
    block_title: 'Detail koneksi'
  split:
    title: Terpisah
    description: 'Nilai yang dipindahkan ke tepi kanan — total, saldo, apa pun yang dibaca sebagai kolom angka.'
  compact:
    title: Kompak
    description: 'Baris lebih rapat ketika daftar menjadi sekunder terhadap sisa blok.'
  stacked:
    title: Tumpuk
    description: 'Kunci di atas nilai, untuk kolom sempit di mana dua kolom akan terlipat dengan buruk.'
    aside: 'Badan mempertahankan lebar yang tersisa sementara kolom samping tetap tetap.'
  columns:
    title: Kolom
    description: 'Seperempat pasangan pendek dibaca dengan buruk dalam satu kolom tinggi: mata melintasi lebar halaman antara kunci dan nilainya, dan pemisah akhirnya mengikat setiap pasangan bersama. Disusun dalam kolom — sebanyak yang diizinkan lebar, hingga satu di ponsel — pasangan menjadi blok kecil yang terdiri dari dua baris yang tidak memerlukan aturan di sekitarnya. Nilai yang tidak bisa ditampung kolom mana pun mengambil seluruh lebar dengan `full`.'
  vue:
    title: Vue
    description: 'Daftar yang sama sebagai bagian vue, mengambil modifikasi sebagai props: catatan yang dibangun saat halaman berjalan terbaca seperti yang dirender dengannya.'
