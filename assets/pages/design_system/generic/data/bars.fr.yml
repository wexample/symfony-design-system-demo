~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Bars
page_icon: 'ph:bold/rows'
intro: "Une barre nomme une chose en une seule ligne : ce que c'est, comment cela s'appelle, ce qui la qualifie, et ce qui appartient à l'extrémité. C'est une forme, pas un lien — une entité y arrive par son propre modèle, mais un résultat de recherche qui est un fichier, une application ou un paramètre utilise le même balisage."
finding:
  fix: Corriger
  date: 'Fixer une date'
  error:
    title: 'Section obligatoire manquante “Objet”'
    subtitle: 01-PROCESSES/PR-004-document-control.md
  warning:
    title: 'La date de révision est dans le passé'
    subtitle: '01-PROCESSES/PR-004-document-control.md:4'
  info:
    title: 'Champ propriétaire laissé vide'
    subtitle: 'Pas bloquant pour un brouillon, requis avant la révision'
section:
  findings:
    title: Constats
    description: "Ce qu'un rapport d'analyse indique, une barre chacun : le constat comme titre, où il se trouve comme sous-titre, et ce qui peut y être fait dans l'emplacement de fin — rien là quand rien ne peut être fait ici. La gravité est le ton du bloc, que l'avatar en tête prend aussi."
  alone:
    title: 'La barre elle-même'
    description: "Tout sauf le titre est optionnel. L'emplacement principal prend une icône, ou tout balisage lorsque un véritable avatar est nécessaire ; l'emplacement de fin prend une date, une étiquette, une rangée de boutons. Donné un lien, toute la largeur devient la cible et le titre conserve la couleur de l'endroit où il se trouve."
  search:
    title: 'Une liste de résultats'
    description: "La liste apporte le cadre, le champ de recherche et les séparateurs ; chaque ligne apporte une barre. Rien ici n'est une entité — c'est le but : la même ligne sert une personne, un document, une application et une préférence."
  surfaces:
    title: 'Une surface chacune'
    description: "L'autre lecture d'une liste — pas de fond partagé et pas de ligne, chaque barre se tenant sur son propre bloc avec de la place autour. Rien de nouveau à styliser, la barre prend simplement les classes de bloc, et donné un lien, toute la carte devient la cible."
  divided:
    title: 'Une liste simple'
    description: 'Lorsque le cadre est déjà là, une pile verticale avec des diviseurs suffit — pas de forme propre, juste une ligne entre deux lignes.'
  vue:
    title: "Une liste d'eux, en Vue"
    description: "Les mêmes lignes lues d'un point de terminaison plutôt que écrites : la liste contient la page, la pagination et l'état vide, et chaque entité indique quoi lire dessus — un titre, ce qui la qualifie, une icône, où elle mène, une date à l'extrémité. Les lectures ci-dessus sont ses variantes, `divided` puis `surfaces`."
  keeping_up:
    title: 'Et mise à jour'
    description: "Une liste de barres est une collection comme une autre, donc les trois manières dont une collection entend que le monde a avancé lui sont ouvertes : un événement d'application, une source en direct, un sondage. Celle-ci écoute un événement — sonnez-le et regardez les lignes revenir. Voir Mise à jour pour les trois d'entre eux côte à côte."
