page_title: बार्स
page_icon: 'ph:bold/rows'
intro: 'एक बार एक ही पंक्ति में एक चीज़ का नाम लेता है: यह क्या है, इसे क्या कहा जाता है, क्या इसे योग्य बनाता है, और क्या सबसे दूर है। यह एक आकार है, बंधन नहीं — एक इकाई इसे अपने स्वयं के टेम्पलेट के माध्यम से पहुँचती है, लेकिन एक खोज परिणाम जो एक फ़ाइल, एक ऐप या एक सेटिंग है, वही मार्कअप का उपयोग करता है।'
