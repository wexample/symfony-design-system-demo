section:
  findings:
    title: खोजें
    description: 'एक विश्लेषण जो रिपोर्ट करता है, एक बार प्रत्येक: खोज शीर्षक के रूप में, यह कहां है उपशीर्षक के रूप में, और इसके बारे में क्या किया जा सकता है पीछे के स्लॉट में — जब यहां कुछ नहीं किया जा सकता है तो कुछ नहीं है। गंभीरता ब्लॉक का स्वर है, जिसे शीर्ष पर अवतार भी लेता है।'
  alone:
    title: 'बार स्वयं'
    description: 'शीर्षक के अलावा सब कुछ वैकल्पिक है। अग्रणी स्लॉट एक आइकन लेता है, या किसी वास्तविक अवतार की आवश्यकता होने पर कोई मार्कअप; पीछे के स्लॉट में एक तारीख, एक टैग, बटन की एक पंक्ति होती है। एक लिंक दिए जाने पर, पूरी चौड़ाई लक्ष्य बन जाती है और शीर्षक उस रंग को बनाए रखता है जहां यह बैठता है।'
  search:
    title: 'परिणामों की सूची'
    description: 'सूची ढांचे, खोज फ़ील्ड और विभाजकों को लाती है; प्रत्येक पंक्ति एक बार लाती है। यहाँ कुछ भी एक इकाई नहीं है — यही बात है: वही पंक्ति एक व्यक्ति, एक दस्तावेज़, एक आवेदन और एक प्राथमिकता के लिए काम करती है।'
  surfaces:
    title: 'एक सतह प्रत्येक'
    description: 'एक सूची का दूसरा पढ़ना — कोई साझा पृष्ठभूमि नहीं और कोई रेखा नहीं, प्रत्येक बार अपने स्वयं के ब्लॉक पर खड़ा है और इसके चारों ओर जगह है। स्टाइल करने के लिए कुछ नया नहीं है, बार बस ब्लॉक वर्ग लेता है, और एक लिंक दिए जाने पर पूरा कार्ड लक्ष्य बन जाता है।'
  divided:
    title: 'एक नंग सूची'
    description: 'जब ढांचा पहले से ही मौजूद है, तो डिवाइडर्स के साथ एक लंबवत स्टैक काफी है — इसका अपना कोई आकार नहीं, बस दो पंक्तियों के बीच एक रेखा।'
  vue:
    title: 'उनकी एक सूची, Vue में'
    description: 'वही पंक्तियाँ एक एंडपॉइंट से पढ़ी जाती हैं न कि लिखी जाती हैं: सूची पृष्ठ, पृष्ठकरण और खाली स्थिति को बनाए रखती है, और प्रत्येक इकाई यह बताती है कि इसे उस पर क्या पढ़ना है — एक शीर्षक, इसे योग्य बनाने वाला, एक आइकन, यह कहाँ ले जाता है, एक तारीख सबसे दूर है। ऊपर की पढ़ाई इसके रूपांतरण हैं, `divided` फिर `surfaces`।'
  keeping_up:
    title: 'और अद्यतित रखा गया'
    description: 'एक बार सूची एक संग्रह है जैसे कोई अन्य, इसलिए तीन तरीके जिनसे एक संग्रह सुनता है कि दुनिया आगे बढ़ गई है, उसके लिए खुले हैं: एक ऐप इवेंट, एक लाइव स्रोत, पॉलिंग। यह एक इवेंट को सुनता है — इसे बजाएं और पंक्तियाँ वापस आती हैं। देखिए Keeping up तीनों को एक साथ।'
