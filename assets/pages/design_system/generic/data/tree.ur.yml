    title: 'فائل ایکسپلورر'
    description: 'نیسٹنگ پوری ساخت ہے: ایک آئٹم اس وقت کھلتا ہے جب یہ کھلا ہوتا ہے، اور اس کی گہرائی وہی ہے جو قطار کو انڈینٹ کرتی ہے جبکہ ہائی لائٹ اب بھی پوری چوڑائی میں پھیلا ہوا ہے۔'
