section:
  default:
    title: ตัวจัดการไฟล์
    description: 'การซ้อนคือโครงสร้างทั้งหมด: รายการจะเปิดเมื่อมันมีการเปิดอยู่ และความลึกของมันคือสิ่งที่ทำให้แถวเลื่อนลง ในขณะที่การเน้นยังคงขยายเต็มความกว้าง.'
  vue:
    title: Vue
    description: 'Markup เดียวกัน รูปร่างเดียวกัน แต่โฟลเดอร์เปิดและปิด: Chevron คือสิ่งที่พับโหนด และการคลิกที่ใดก็ได้ในแถวจะเลือกรายการและส่งขึ้นเป็นเหตุการณ์ที่เลือก.'
  vue_workspace:
    title: 'Vue ในพื้นที่ทำงาน'
    description: 'ตัวจัดการในแอป: ต้นไม้ Vue ในโซนที่เลื่อนในแบบแบ่งหน้าจอ ซึ่งมีแถวมากกว่าสูงของโซนและชื่อที่ยาวกว่าความกว้างของโซน โซนเลื่อนในทั้งสองแกนและแถบแนวนอนจะอยู่ที่พื้น ไม่ว่าจะเป็นแถวสุดท้ายคืออะไร.'
