~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Свойства
page_icon: 'ph:bold/list-dashes'
intro: 'Пары ключ/значение отображаются в виде списка определений. Строки являются подсетками списка, поэтому ключи остаются выровненными в одном столбце, в то время как каждая строка остается реальным блоком, который может содержать разделитель.'
section:
  default:
    title: 'По умолчанию'
    description: 'Столбец ключей подстраивается под самый длинный ярлык. Переопределите --properties-key-width, чтобы зафиксировать его.'
  bordered:
    title: 'С рамкой'
    description: 'Разделитель между строками для плотных записей внутри блока.'
    block_title: 'Детали соединения'
  split:
    title: Разделённый
    description: 'Значения сдвинуты к правому краю — итоги, остатки, все, что читается как столбец чисел.'
  compact:
    title: Компактный
    description: 'Плотные строки, когда список вторичен по отношению к остальной части блока.'
  stacked:
    title: 'В стопку'
    description: 'Ключ выше значения, для узких столбцов, где два столбца плохо обернутся.'
    aside: 'Тело сохраняет оставшуюся ширину, в то время как боковой столбец остается фиксированным.'
  columns:
    title: Столбцы
    description: 'Дюжина коротких пар плохо читается в одном высоком столбце: глаз пересекает ширину страницы между ключом и его значением, и разделители в итоге удерживают каждую пару вместе. Расположенные в столбцах — столько, сколько позволяет ширина, вплоть до одного на телефоне — пара становится небольшим блоком из двух строк, которому не требуется рамка вокруг. Значение, которое не может удержать ни один столбец, занимает всю ширину с `full`.'
  vue:
    title: Vue
    description: 'Тот же список как частичный vue, принимающий модификаторы в качестве свойств: запись, созданная во время работы страницы, читается как одна, отрисованная с ней.'
