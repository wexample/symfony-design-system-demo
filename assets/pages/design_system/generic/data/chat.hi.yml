~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: चैट
page_icon: 'ph:bold/chats-circle'
chat:
  title: 'चैट उदाहरण'
vue:
  title: व्यू
  description: |
    एक ही धागा और एक ही लेखक, एंटिटी चैट घटक द्वारा चित्रित। यह एंटिटीज़ का एक संग्रह रखता है और नहीं जानता कि वे क्या हैं: लेखक, पाठ और तिथि को प्रक्षिप्तियों के माध्यम से पढ़ा जाता है जो एक उपवर्ग ओवरराइड करता है, और एक प्रस्तुत संदेश किसी अन्य निर्माण की तरह रिपॉजिटरी के माध्यम से बाहर जाता है। उत्तर तब लिखा जाता है जब अनुरोध समाप्त हो जाता है, इसलिए यह संदेश के उत्तर में वापस नहीं आ सकता: यह इस धागे के कमरे में लाइव सब्सक्रिप्शन के माध्यम से पृष्ठ तक पहुँचता है।
description:
  body: |
    यह चैट प्लेग्राउंड संदेश की ताल, रिक्ति और ऊर्ध्वाधर घनत्व को अंतिम UI स्टाइलिंग से पहले मान्य करने के लिए उपयोग किया जाता है। इस ब्लॉक को जानबूझकर विस्तृत रखें ताकि लेआउट में पर्याप्त ऊंचाई हो ताकि वास्तविक बातचीत के प्रवाह का अनुकरण किया जा सके, जिसमें मध्यम और लंबे पंक्तियाँ, लपेटने का व्यवहार, और कई वाक्यों के बीच प्राकृतिक पढ़ने के ठहराव शामिल हैं। लक्ष्य यह है कि भविष्य के चैट घटक एक स्थिर दृश्य आधार रेखा का पालन कर सकें, ताकि वास्तविक उपयोगकर्ता और सहायक संदेशों के साथ इस पाठ को बदलते समय माप समान रहें।
composer:
  placeholder: 'एक संदेश लिखें...'
  submit_label: 'संदेश भेजें'
  action_plus_label: 'सामग्री जोड़ें'
  action_smiley_label: 'इमोजी डालें'
  multiline_value: |
    यह एक लंबा चैट ड्राफ्ट है जिसका उपयोग मल्टीलाइन स्थिति का पूर्वावलोकन करने के लिए किया जाता है। यह कई पंक्तियों में लपेटता है ताकि एक-पंक्ति क्षेत्र के साथ दृश्य अंतर स्पष्ट हो।
messages:
  user_1: |
    क्या आप कल की समन्वय बैठक के कार्यों का सारांश दे सकते हैं और केवल उन निर्णयों को रखें जिन्हें हम इस सप्ताह लागू कर सकते हैं?
  user_2: |
    आउटपुट को भी संक्षिप्त रखें क्योंकि इसे प्रबंधक साइडबार में कॉपी किया जाएगा।
  assistant_1: |
    बिलकुल। मैं प्राथमिकताओं, मालिकों और अगले चेकपॉइंट्स के साथ एक संक्षिप्त सारांश प्रदान कर सकता हूँ।
  assistant_2: |
    मैं केवल मान्य निर्णयों को रखूंगा और खुली प्रश्नों को हटा दूंगा जिन्हें अभी खोजने की आवश्यकता है।
  assistant_3: |
    प्रस्तावित संरचना: 1. तात्कालिक कार्य। 2. निर्भरताएँ। 3. निगरानी करने के लिए जोखिम।
  assistant_4: |
    एक बार मान्य होने के बाद, यह संरचना प्रबंधक में चैट मेनू के लिए डिफ़ॉल्ट टेम्पलेट बन सकती है।
