~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 進行中
page_icon: 'ph:bold/broadcast'
intro: 'コレクションは表示されたときに一度読まれ、その後は世界が進んでいきます。これがコレクションがそれについて聞く三つの方法です — これは選択肢ではなく、コレクションの状況が提供するものです。同じテーブルはそれらのいずれか、または複数を受け入れ、下のどれもどの方法が鳴ったかを知りません。'
section:
  events:
    title: アプリイベント
    description: 'このページが自ら引き起こした変化: 行動したボタン、戻ってきたフォーム。鳴らした者はテーブルのことを何も知らず、テーブルは誰が鳴らしたかを知りません — 彼らは名前を共有しているだけです。コストはかからず、サーバーも必要ありません。'
  live:
    title: ライブソース
    description: 'サーバーに公開するトピックがある場合、コレクションはそのコレクションのエンティティを聴きます — ランのためのプロセス、メッセージのためのセッション — そして自分自身の行には決して耳を傾けません。まだ存在しない行にはトピックがなく、表示される行は正に読者が待っているものです。デモにはそれを公開するサーバーがないため、ボタンがメッセージを再生します。'
  polling:
    title: ポーリング
    description: 'トピックがない場合、または時々往復する方がオープンなサブスクリプションを保持するよりも安価な場合。このポーリングは3秒ごとに読み取り、タブがバックグラウンドにある間は停止します — 誰も見ていないページは、誰も読む必要のないページです。'
  none:
    title: 全く何もない
    description: デフォルト。コレクションは一度読み取り、そのままの状態を保ちます。これは、表示される内容が読者の背後で変わらない場合の正しい答えです。
  shape:
    title: どんな形でも
    description: 'これらはテーブルに属しません。同じ三つの方法がバーのリスト、チャットスレッド、コレクションを読む何でもに役立ちます — コレクションが真実であることとその見た目は二つの別々の決定です。これはバーリストで、ポーリングです。'
