~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: डेटा
page_icon: 'ph:bold/list-bullets'
intro: 'आकार जो एक संग्रह को लेता है और इसे प्रस्तुत करता है। जो उन्हें अलग करता है वह यह है कि पाठक को प्रत्येक रिकॉर्ड का कितना हिस्सा देखने को मिलता है, और वे इसे देखने के बाद इसके साथ क्या कर सकते हैं।'
page:
  files:
    title: फाइलें
    description: 'एक फाइल एक्सप्लोरर जो एक पृष्ठ की चौड़ाई का है, एक लोडर द्वारा फीड किया गया है, और एक फ़ोल्डर जिसे सर्वर द्वारा चित्रित किया गया है।'
  tables:
    title: तालिकाएं
    description: 'पंक्तियाँ और कॉलम, सर्वर द्वारा प्रस्तुत या ब्राउज़र द्वारा पृष्ठबद्ध, प्रकारित सेल के साथ - लिंक, क्रियाएँ, आइकन और तारीखें जो गिनती बनाए रखती हैं।'
  live:
    title: 'अपडेट रहना'
    description: 'तीन तरीके जिनसे एक संग्रह सुनता है कि जो यह दिखाता है वह बदल गया है - एक ऐप इवेंट, एक लाइव स्रोत, या पोलिंग - और प्रत्येक का क्या उपयोग है।'
  lists:
    title: सूचियाँ
    description: 'एक सूची जिसे अपने स्वयं के हेडर से खोजा और फ़िल्टर किया गया है, जिसे एक सेट के लिए ब्राउज़ किया जाता है न कि स्कैन किया जाता है।'
  properties:
    title: गुण
    description: 'एक रिकॉर्ड के लिए कुंजी और मान, न कि कई के लिए - पहले से चुने गए एक चीज़ का विवरण पैनल।'
  bars:
    title: बार्स
    description: 'एक पंक्ति में नामित एक रिकॉर्ड: एक आइकन, एक शीर्षक, जो इसे योग्य बनाता है। खोज परिणाम, एक सदस्य या एक फ़ाइल के रूप में प्रदर्शित की गई पंक्ति।'
  tree:
    title: पेड़
    description: 'एक संग्रह जिसके रिकॉर्ड एक-दूसरे को शामिल करते हैं, एक बार में एक स्तर लोड किया जाता है, उस पैनल में जिसे एक एक्सप्लोरर शिप करता है।'
  chat:
    title: चैट
    description: 'एक संग्रह जिसे पीछे से पढ़ा जाता है और नीचे से जोड़ा जाता है, लाइव, एक कंपोजर के साथ जो लिखे जाने पर बढ़ता है।'
