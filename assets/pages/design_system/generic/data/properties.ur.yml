~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: خصوصیات
page_icon: 'ph:bold/list-dashes'
intro: 'کی-ویلیو جوڑے کو ایک تعریف کی فہرست کے طور پر پیش کیا جاتا ہے۔ قطاریں فہرست کے ذیلی گرڈز ہیں، لہذا چابیاں ایک ہی کالم میں سیدھی رہتی ہیں جبکہ ہر قطار ایک حقیقی باکس رہتی ہے جو ایک جداکار کو لے جا سکتی ہے۔'
section:
  default:
    title: ڈیفالٹ
    description: 'چابی کا کالم سب سے طویل لیبل کے مطابق اپنی جگہ بناتا ہے۔ --properties-key-width کو اووررائیڈ کریں تاکہ اسے مقرر کیا جا سکے۔'
  bordered:
    title: 'بارڈرز کے ساتھ'
    description: 'قطاروں کے درمیان ایک جداکار، بلاک باڈی کے اندر کثیف ریکارڈز کے لیے۔'
    block_title: 'کنکشن کی تفصیلات'
  split:
    title: تقسیم
    description: 'دائیں کنارے کی طرف دھکیلے گئے اقدار — کل، بیلنس، کچھ بھی جو اعداد کے کالم کے طور پر پڑھا جائے۔'
  compact:
    title: کمپیکٹ
    description: 'جب فہرست بلاک کے باقی حصے کے مقابلے میں ثانوی ہو تو زیادہ قریب کی قطاریں۔'
  stacked:
    title: ڈھیر
    description: 'چابی قیمت سے اوپر، تنگ کالمز کے لیے جہاں دو کالم خراب طریقے سے لپٹے ہوں گے۔'
    aside: 'باڈی باقی چوڑائی کو برقرار رکھتا ہے جبکہ سائیڈ کالم مقرر رہتا ہے۔'
  columns:
    title: کالم
    description: 'ایک لمبے کالم میں بارہ چھوٹے جوڑے پڑھنا مشکل ہے: آنکھ چابی اور اس کی قیمت کے درمیان صفحے کی چوڑائی کو عبور کرتی ہے، اور جداکار ہر جوڑے کو اکٹھا رکھنے کا کام کرتے ہیں۔ کالمز میں ترتیب دیے گئے — جتنے چوڑائی کی اجازت ہو، فون پر ایک تک — ایک جوڑا دو لائنوں کا ایک چھوٹا بلاک بن جاتا ہے جس کے ارد گرد کوئی قاعدہ کی ضرورت نہیں۔ ایک قیمت جو کوئی کالم نہیں رکھ سکتا پوری چوڑائی `full` کے ساتھ لے لیتی ہے۔'
  vue:
    title: ویو
    description: 'اسی فہرست کو ایک ویو جزو کے طور پر پیش کیا جاتا ہے، جو موڈیفائرز کو پروپس کے طور پر لیتا ہے: ایک ریکارڈ جو صفحے کے چلنے کے دوران بنایا گیا ہے وہ ایسا لگتا ہے جیسے اس کے ساتھ پیش کیا گیا ہو۔'
