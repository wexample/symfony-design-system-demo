~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Dados
page_icon: 'ph:bold/list-bullets'
intro: 'Formas que pegam uma coleção e a exibem. O que as diferencia é quanto de cada registro o leitor consegue ver e o que pode fazer com isso uma vez que vê.'
page:
  files:
    title: Arquivos
    description: 'Um explorador de arquivos com a largura de uma página, alimentado por um carregador, e uma pasta desenhada pelo servidor.'
  tables:
    title: Tabelas
    description: 'Linhas e colunas, renderizadas pelo servidor ou paginadas pelo navegador, com células tipadas — links, ações, ícones e datas que continuam a contar.'
  live:
    title: Acompanhando
    description: 'As três maneiras que uma coleção percebe que o que exibe mudou — um evento do aplicativo, uma fonte ao vivo ou polling — e para que serve cada uma.'
  lists:
    title: Listas
    description: 'Uma lista que é pesquisada e filtrada a partir de seu próprio cabeçalho, para um conjunto que o leitor navega em vez de escanear.'
  properties:
    title: Propriedades
    description: 'Chave e valor, para um registro em vez de muitos — o painel de detalhes de uma coisa já escolhida.'
  bars:
    title: Barras
    description: 'Um registro nomeado em uma única linha: um ícone, um título, o que o qualifica. A linha que um resultado de busca, um membro ou um arquivo é renderizado como.'
  tree:
    title: Árvore
    description: 'Uma coleção cujos registros contêm uns aos outros, carregados um nível de cada vez, no painel que um explorador fornece.'
  chat:
    title: Chat
    description: 'Uma coleção lida de trás para frente e adicionada de baixo para cima, ao vivo, com um compositor que cresce à medida que é escrito.'
