~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Данные
page_icon: 'ph:bold/list-bullets'
intro: 'Форматы, которые принимают коллекцию и отображают ее. Чем они отличаются, так это тем, сколько записей читатель может увидеть и что он может с ними сделать после просмотра.'
page:
  files:
    title: Файлы
    description: 'Диспетчер файлов шириной в страницу, загружаемый с помощью загрузчика и с одной папкой, нарисованной сервером.'
  tables:
    title: Таблицы
    description: 'Строки и столбцы, отрисованные сервером или разбитые на страницы браузером, с типизированными ячейками — ссылками, действиями, иконками и датами, которые продолжают отсчет.'
  live:
    title: 'Поддержание актуальности'
    description: 'Три способа, которыми коллекция узнает, что ее содержимое изменилось — событие приложения, живой источник или опрос — и для чего каждый из них предназначен.'
  lists:
    title: Списки
    description: 'Список, который ищется и фильтруется по своему заголовку, для набора, который читатель просматривает, а не сканирует.'
  properties:
    title: Свойства
    description: 'Ключ и значение, для одной записи, а не многих — панель деталей уже выбранного объекта.'
  bars:
    title: Панели
    description: 'Одна запись, представленная в одной строке: иконка, заголовок, что ее характеризует. Строка, в которой отображается результат поиска, участник или файл.'
  tree:
    title: Дерево
    description: 'Коллекция, записи которой содержат друг друга, загружаемая по одному уровню за раз, в панели, которую поставляет исследователь.'
  chat:
    title: Чат
    description: 'Коллекция, читаемая в обратном порядке и дополняемая снизу, в реальном времени, с композером, который растет по мере написания.'
