~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: チャット
page_icon: 'ph:bold/chats-circle'
chat:
  title: チャットの例
vue:
  title: Vue
  description: |
    同じスレッドと同じ作成者が、エンティティチャットコンポーネントによって描画されます。エンティティのコレクションを保持し、それらが何であるかは何も知りません：著者、テキスト、日付は、サブクラスがオーバーライドするプロジェクションを通じて読み取られ、送信されたメッセージは他の作成物と同様にリポジトリを介して送信されます。リクエストが終了すると回答が書き込まれるため、メッセージへの応答として戻ることはできません：このスレッドが部屋で保持しているライブサブスクリプションを通じてページに到達します。
description:
  body: |
    このチャットプレイグラウンドは、最終的なUIスタイリングの前にメッセージのリズム、間隔、および縦の密度を検証するために使用されます。レイアウトが現実的な会話の流れをシミュレートするのに十分な高さを持つように、このブロックを意図的に冗長にしてください。中程度や長い行、折り返し動作、複数の文にわたる自然な読みのポーズを含めることが重要です。目標は、将来のチャットコンポーネントが従うことができる安定したビジュアルベースラインを提供することであり、このテキストを実際のユーザーおよびアシスタントのメッセージと置き換えたときに測定が一貫していることを確保することです。
composer:
  placeholder: メッセージを入力...
  submit_label: メッセージを送信
  action_plus_label: コンテンツを追加
  action_smiley_label: 絵文字を挿入
  multiline_value: |
    これはマルチライン状態をプレビューするために使用される長めのチャットドラフトです。複数行にわたって折り返されるため、1行フィールドとの視覚的な違いが明らかになります。
messages:
  user_1: |
    昨日の同期からのアクションアイテムを要約して、今週実行可能な決定だけを残してもらえますか？
  user_2: |
    また、出力は短く保ってください。これはマネージャーのサイドバーにコピーされます。
  assistant_1: |
    もちろんです。優先順位、責任者、次のチェックポイントを含む簡潔な要約を提供できます。
  assistant_2: |
    検証済みの決定のみを保持し、まだ発見が必要な未解決の質問は削除します。
  assistant_3: |
    提案された構造：1. 即時アクション。2. 依存関係。3. 監視するリスク。
  assistant_4: |
    検証が完了したら、この構造はマネージャーのチャットメニューのデフォルトテンプレートとして使用できます。
