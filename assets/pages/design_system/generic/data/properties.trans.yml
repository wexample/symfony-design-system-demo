bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: সম্পত্তি
  page_icon: 'ph:bold/list-dashes'
  intro: 'কী / মান জোড়া একটি সংজ্ঞা তালিকা হিসাবে প্রদর্শিত হয়। সারিগুলি তালিকার উপ-গ্রিড, তাই কী একটি কলামে সজ্জিত থাকে এবং প্রতিটি সারি একটি বাস্তব বাক্স থাকে যা একটি বিভাজক ধারণ করতে পারে।'
  section:
    default:
      title: ডিফল্ট
      description: 'কী কলামটি সবচেয়ে দীর্ঘ লেবেলের উপর ভিত্তি করে আকারে নিজেকে তৈরি করে। এটিকে নির্দিষ্ট করতে --properties-key-width অতিক্রম করুন।'
    bordered:
      title: সীমানাযুক্ত
      description: 'একটি ব্লক বডির মধ্যে ঘন রেকর্ডের জন্য সারির মধ্যে একটি বিভাজক।'
      block_title: 'সংযোগের বিস্তারিত'
    split:
      title: বিভক্ত
      description: 'দাঁড়িয়ে থাকা মানগুলি ডান প্রান্তে — মোট, ভারসাম্য, যা কিছু সংখ্যার একটি কলাম হিসাবে পড়া হয়।'
    compact:
      title: সংকুচিত
      description: 'যখন তালিকা ব্লকের বাকি অংশের তুলনায় দ্বিতীয়ক, তখন ঘন সারি।'
    stacked:
      title: গাদা
      description: 'মূল্যর উপরে কী, সংকীর্ণ কলামের জন্য যেখানে দুটি কলাম খারাপভাবে মোড়ানো হবে।'
      aside: 'শরীর অবশিষ্ট প্রস্থ ধরে রাখে যখন পাশের কলাম স্থির থাকে।'
    columns:
      title: কলাম
      description: "একটি লম্বা কলামে একটি ডজন সংক্ষিপ্ত জোড়া পড়া খারাপ: চোখটি কী এবং তার মানের মধ্যে পৃষ্ঠার প্রস্থ অতিক্রম করে এবং বিভাজকগুলি প্রতিটি জোড়াকে একসাথে ধরে রাখে। কলামগুলিতে সাজানো — যতটা প্রস্থ অনুমতি দেয়, একটি ফোনে একটিতে — একটি জোড়া দু'লাইনের একটি ছোট ব্লকে পরিণত হয় যার চারপাশে কোনও নিয়মের প্রয়োজন হয় না। কোনও কলাম ধারণ করতে না পারা একটি মান `full` দিয়ে পুরো প্রস্থ নেয়।"
    vue:
      title: ভিউ
      description: 'একটি ভিউ অংশ হিসাবে একই তালিকা, প্রপস হিসাবে মডিফায়ারগুলি নিয়ে: পৃষ্ঠা চলাকালীন নির্মিত একটি রেকর্ড এটি সহ তৈরি হওয়ার মতো পড়ে।'
  field:
