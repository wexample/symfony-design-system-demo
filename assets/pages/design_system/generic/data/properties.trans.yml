      description: 'जब सूची बाकी ब्लॉक के लिए द्वितीयक होती है, तो पंक्तियाँ तंग होती हैं।'
    stacked:
      title: स्टैक्ड
      description: 'कुंजी मान के ऊपर, संकीर्ण स्तंभों के लिए जहाँ दो स्तंभ बुरी तरह लपेटेंगे।'
      aside: 'शरीर शेष चौड़ाई बनाए रखता है जबकि साइड स्तंभ स्थिर रहता है।'
