en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Properties
  page_icon: ph:bold/list-dashes

  intro: "Key / value pairs rendered as a definition list. Rows are subgrids of the list, so keys stay aligned in a single column while each row remains a real box that can carry a separator."

  section:
    default:
      title: Default
      description: The key column sizes itself on the longest label. Override --properties-key-width to pin it.
    bordered:
      title: Bordered
      description: A separator between rows, for dense records inside a block body.
      block_title: Connection details
    split:
      title: Split
      description: Values pushed to the right edge — totals, balances, anything read as a column of figures.
    compact:
      title: Compact
      description: Tighter rows when the list is secondary to the rest of the block.
    stacked:
      title: Stacked
      description: Key above value, for narrow columns where two columns would wrap badly.
      aside: The body keeps the remaining width while the aside column stays fixed.
    columns:
      title: Columns
      description: "A dozen short pairs read badly in one tall column: the eye crosses the width of the page between a key and its value, and the separators end up holding each pair together. Laid out in columns — as many as the width allows, down to one on a phone — a pair becomes a small block of two lines that needs no rule around it. A value no column can hold takes the whole width with `full`."
    vue:
      title: Vue
      description: "The same list as a vue partial, taking the modifiers as props: a record built while the page runs reads like one rendered with it."

  field:
    name:
      key: Name
      value: Pipeline projection
    identifier:
      key: Identifier
      value: prj_8f21c4a7
    description:
      key: Description
      value: Aggregates incoming events and exposes them as a queryable projection.
    status:
      key: Status
      value: Ready
    owner:
      key: Owner
      value: Platform team
    created:
      key: Created
      value: March 14, 2026
    region:
      key: Region
      value: eu-west-1
    runtime:
      key: Runtime
      value: PHP 8.3
    version:
      key: Version
      value: 1.4.2
    reviewed:
      key: Reviewed on
      value: null
    path:
      key: File
      value: config/packages/prod/deploy/eu-west-1/service.yaml

  amount:
    subtotal:
      key: Subtotal
      value: 1,240.00 €
    tax:
      key: Tax
      value: 248.00 €
    total:
      key: Total
      value: 1,488.00 €

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: الخصائص
  page_icon: 'ph:bold/list-dashes'
  intro: 'أزواج المفتاح / القيمة تم عرضها كقائمة تعريف. الصفوف هي شبكات فرعية للقائمة، لذا تبقى المفاتيح متراصة في عمود واحد بينما يظل كل صف صندوقًا حقيقيًا يمكن أن يحمل فاصلًا.'
  section:
    default:
      title: افتراضي
      description: 'يحدد عمود المفتاح حجمه بناءً على أطول تسمية. تجاوز --properties-key-width لتثبيته.'
    bordered:
      title: محدد
      description: 'فاصل بين الصفوف، من أجل سجلات كثيفة داخل جسم كتلة.'
      block_title: 'تفاصيل الاتصال'
    split:
      title: مقسم
      description: 'القيم تدفع إلى الحافة اليمنى — الإجماليات، الأرصدة، أي شيء يُقرأ كعمود من الأرقام.'
    compact:
      title: مضغوط
      description: 'صفوف أكثر تماسكًا عندما تكون القائمة ثانوية لبقية الكتلة.'
    stacked:
      title: مكدس
      description: 'المفتاح فوق القيمة، لعمود ضيق حيث سيلتف عمودين بشكل سيئ.'
      aside: 'يحافظ الجسم على العرض المتبقي بينما يبقى عمود الجانب ثابتًا.'
    columns:
      title: أعمدة
      description: 'عشرات الأزواج القصيرة تُقرأ بشكل سيئ في عمود طويل واحد: العين تعبر عرض الصفحة بين مفتاح وقيمته، وينتهي الأمر بالفواصل بحمل كل زوج معًا. عند توزيعها في أعمدة — بقدر ما يسمح العرض، وصولاً إلى واحد على الهاتف — يصبح الزوج كتلة صغيرة من سطرين لا تحتاج إلى قاعدة حولها. قيمة لا يمكن لأي عمود استيعابها تأخذ العرض الكامل مع `full`.'
    vue:
      title: فيو
      description: 'نفس القائمة كجزء vue، تأخذ المعدلات كخصائص: سجل تم بناؤه أثناء تشغيل الصفحة يقرأ كواحد تم عرضه معها.'
