  page_icon: 'ph:bold/list-dashes'
  intro: 'Schlüssel-/Wert-Paare, die als Definitionsliste dargestellt werden. Zeilen sind Untergitter der Liste, sodass die Schlüssel in einer einzelnen Spalte ausgerichtet bleiben, während jede Zeile ein echtes Feld bleibt, das einen Separator tragen kann.'
  section:
    default:
      title: Standard
      description: 'Die Schlüsselspalte passt sich an das längste Label an. Überschreiben Sie --properties-key-width, um es festzulegen.'
    bordered:
      title: 'Mit Rand'
      description: 'Ein Separator zwischen den Zeilen für kompakte Datensätze innerhalb eines Blockkörpers.'
      block_title: Verbindungsdetails
    split:
      title: Geteilt
      description: 'Werte werden an den rechten Rand geschoben — Summen, Salden, alles, was als Spalte von Zahlen gelesen wird.'
    compact:
      title: Kompakt
      description: 'Engere Zeilen, wenn die Liste sekundär zum Rest des Blocks ist.'
    stacked:
      title: Gestapelt
      description: 'Schlüssel über Wert, für schmale Spalten, in denen zwei Spalten schlecht umbrechen würden.'
      aside: 'Der Körper behält die verbleibende Breite, während die Seitenleiste fix bleibt.'
    columns:
      title: Spalten
      description: 'Dutzende kurze Paare lesen sich schlecht in einer hohen Spalte: das Auge überquert die Breite der Seite zwischen einem Schlüssel und seinem Wert, und die Separatoren halten jedes Paar zusammen. In Spalten angeordnet — so viele wie die Breite zulässt, bis zu einer auf einem Telefon — wird ein Paar zu einem kleinen Block aus zwei Zeilen, der keinen Rahmen benötigt. Ein Wert, den keine Spalte halten kann, nimmt die gesamte Breite mit `full` ein.'
    vue:
      title: Vue
      description: 'Die gleiche Liste als Vue-Teil, der die Modifikatoren als Props übernimmt: ein Eintrag, der erstellt wird, während die Seite läuft, liest sich wie einer, der mit ihr gerendert wird.'
