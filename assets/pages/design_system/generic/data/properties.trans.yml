      description: 'एक लंबा स्तंभ में बुरी तरह पढ़ी गई दर्जन भर छोटे जोड़े: आँख एक कुंजी और उसके मान के बीच पृष्ठ की चौड़ाई को पार करती है, और separators अंततः प्रत्येक जोड़े को एक साथ पकड़ लेते हैं। स्तंभों में बिछाए गए - जितने चौड़ाई अनुमति देती है, एक फोन पर एक तक - एक जोड़ा दो लाइनों का एक छोटा ब्लॉक बन जाता है जिसे इसके चारों ओर किसी नियम की आवश्यकता नहीं होती। कोई मान जो कोई स्तंभ नहीं पकड़ सकता है, `full` के साथ पूरी चौड़ाई ले लेता है।'
