fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: خصوصیات
  page_icon: 'ph:bold/list-dashes'
  intro: 'جفت‌های کلید/مقدار به صورت یک لیست تعریفی نمایش داده می‌شوند. ردیف‌ها زیرمجموعه‌های لیست هستند، بنابراین کلیدها در یک ستون منظم باقی می‌مانند در حالی که هر ردیف یک جعبه واقعی است که می‌تواند جداکننده‌ای را حمل کند.'
  section:
    default:
      title: پیش‌فرض
      description: 'ستون کلید به طولانی‌ترین برچسب خود را تنظیم می‌کند. می‌توانید --properties-key-width را برای ثابت نگه‌داشتن آن تغییر دهید.'
    bordered:
      title: 'با حاشیه'
      description: 'یک جداکننده بین ردیف‌ها، برای رکوردهای متراکم در داخل یک بدنه بلوک.'
      block_title: 'جزئیات اتصال'
    split:
      title: 'تقسیم شده'
      description: 'مقادیر به لبه راست فشار داده می‌شوند — مجموع‌ها، ترازها، هر چیزی که به عنوان یک ستون اعداد خوانده می‌شود.'
    compact:
      title: فشرده
      description: 'ردیف‌های فشرده‌تر وقتی که لیست در اولویت کمتری نسبت به بقیه بلوک قرار دارد.'
    stacked:
      title: 'چیده شده'
      description: 'کلید بالای مقدار، برای ستون‌های باریک که در آن دو ستون به‌خوبی پیچیده نمی‌شوند.'
      aside: 'بدنه عرض باقی‌مانده را حفظ می‌کند در حالی که ستون کنار ثابت می‌ماند.'
    columns:
      title: ستون‌ها
      description: 'یک دوجین جفت کوتاه در یک ستون بلند به‌خوبی خوانده نمی‌شود: چشم عرض صفحه را بین یک کلید و مقدارش طی می‌کند و جداکننده‌ها در نهایت هر جفت را کنار هم نگه می‌دارند. در ستون‌ها چیده شده - به تعداد عرض اجازه می‌دهد، تا یک در یک تلفن - یک جفت به یک بلوک کوچک دو خطی تبدیل می‌شود که به هیچ قاعده‌ای در اطرافش نیاز ندارد. یک مقداری که هیچ ستونی نمی‌تواند آن را نگه دارد، با `full` تمام عرض را می‌گیرد.'
    vue:
      title: Vue
      description: 'همان لیست به عنوان یک بخش vue، که تغییرات را به عنوان props می‌گیرد: یک رکورد که در حین اجرای صفحه ساخته می‌شود، مانند یکی است که با آن رندر می‌شود.'
  field:
    name:
      key: نام
      value: 'پیش‌بینی خط لوله'
    identifier:
      key: شناسه
      value: prj_8f21c4a7
    description:
      key: توضیحات
      value: 'رویدادهای ورودی را تجمیع می‌کند و آنها را به عنوان یک پیش‌بینی قابل پرسش ارائه می‌دهد.'
    status:
      key: وضعیت
      value: آماده
