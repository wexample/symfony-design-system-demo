~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 채팅
page_icon: 'ph:bold/chats-circle'
chat:
  title: '채팅 예시'
vue:
  title: Vue
  description: |
    같은 스레드와 같은 작성자를 가진 엔터티 채팅 컴포넌트로 그려집니다. 이는 엔터티 컬렉션을 보유하며 그들이 무엇인지에 대해 아무것도 알지 못합니다: 작성자, 텍스트 및 날짜는 서브클래스가 오버라이드한 프로젝션을 통해 읽혀지며, 제출된 메시지는 다른 생성물처럼 레포지토리를 통해 나갑니다. 응답은 요청이 끝난 후 작성되므로 메시지에 대한 응답으로 돌아올 수 없습니다: 이 스레드는 방에서 유지되는 실시간 구독을 통해 페이지에 도달합니다.
description:
  body: |
    이 채팅 놀이터는 최종 UI 스타일링 전에 메시지 리듬, 간격 및 수직 밀도를 검증하는 데 사용됩니다. 이 블록은 의도적으로 장황하게 유지하여 레이아웃이 현실적인 대화 흐름을 시뮬레이션할 수 있는 충분한 높이를 가지도록 합니다. 중간 및 긴 문장, 줄 바꿈 동작, 여러 문장 간의 자연스러운 읽기 일시 중지를 포함합니다. 목표는 향후 채팅 컴포넌트가 따를 수 있는 안정적인 시각적 기준선을 제공하는 것이므로, 이 텍스트를 실제 사용자 및 어시스턴트 메시지로 교체할 때 측정값이 일관되게 유지됩니다.
composer:
  placeholder: '메시지를 작성하세요...'
  submit_label: '메시지 전송'
  action_plus_label: '내용 추가'
  action_smiley_label: '이모지 삽입'
  multiline_value: |
    이것은 멀티라인 상태를 미리보기 위해 사용되는 긴 채팅 초안입니다. 여러 줄에 걸쳐 감싸여 있어 한 줄 필드와의 시각적 차이가 뚜렷합니다.
messages:
  user_1: |
    어제 동기화에서 실행할 수 있는 결정만 남기고 실행 항목을 요약해줄 수 있나요?
  user_2: |
    매니저 사이드바에 복사될 것이므로 출력은 짧게 유지해주세요.
  assistant_1: |
    물론입니다. 우선순위, 소유자 및 다음 체크포인트를 포함한 간결한 요약을 제공할 수 있습니다.
  assistant_2: |
    검증된 결정만 유지하고 여전히 발견이 필요한 열린 질문은 제거하겠습니다.
  assistant_3: |
    제안된 구조: 1. 즉각적인 행동. 2. 의존성. 3. 모니터링할 위험.
  assistant_4: |
    검증된 후, 이 구조는 매니저의 채팅 메뉴에 대한 기본 템플릿이 될 수 있습니다.
