~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Barre
page_icon: 'ph:bold/rows'
intro: "Una barra nomina una cosa in un'unica riga: cos'è, come si chiama, cosa la qualifica e cosa appartiene all'estremità opposta. È una forma, non un vincolo — un'entità la raggiunge attraverso il proprio modello, ma un risultato di ricerca che è un file, un'app o un'impostazione utilizza esattamente lo stesso markup."
finding:
  fix: Correggi
  date: 'Imposta una data'
  error:
    title: 'Sezione obbligatoria “Scopo” mancante'
    subtitle: 01-PROCESSES/PR-004-document-control.md
  warning:
    title: 'La data di revisione è nel passato'
    subtitle: '01-PROCESSES/PR-004-document-control.md:4'
  info:
    title: 'Campo proprietario lasciato vuoto'
    subtitle: 'Non blocca per una bozza, richiesto prima della revisione'
section:
  findings:
    title: Osservazioni
    description: "Ciò che riporta un'analisi, una barra ciascuna: l'osservazione come titolo, dove si trova come sottotitolo e cosa si può fare al riguardo nello slot finale — nulla qui quando non si può fare nulla. La gravità è il tono del blocco, che l'avatar in testa prende anch'esso."
  alone:
    title: 'La barra stessa'
    description: "Tutto tranne il titolo è facoltativo. Lo slot principale prende un'icona, o qualsiasi markup quando è necessario un vero avatar; lo slot finale prende una data, un tag, una fila di pulsanti. Dato un link, l'intera larghezza diventa il target e il titolo mantiene il colore del posto in cui si trova."
  search:
    title: 'Un elenco di risultati'
    description: "L'elenco porta il telaio, il campo di ricerca e i separatori; ogni riga porta una barra. Nulla qui è un'entità — questo è il punto: la stessa riga serve una persona, un documento, un'applicazione e una preferenza."
  surfaces:
    title: 'Una superficie ciascuna'
    description: "L'altra lettura di un elenco — nessuno sfondo condiviso e nessuna linea, ogni barra sta sul proprio blocco con spazio attorno. Nulla di nuovo da stilizzare, la barra prende semplicemente le classi del blocco, e dato un link l'intera scheda diventa il target."
  divided:
    title: 'Un elenco semplice'
    description: 'Quando il telaio è già presente, una pila verticale con divisori è sufficiente — nessuna forma propria, solo una linea tra due righe.'
  vue:
    title: 'Un elenco di essi, in Vue'
    description: "Le stesse righe lette da un endpoint piuttosto che scritte: l'elenco contiene la pagina, la paginazione e lo stato vuoto, e ogni entità dice cosa leggere su di essa — un titolo, cosa la qualifica, un'icona, dove porta, una data all'estremità opposta. Le letture sopra sono le sue varianti, `divided` poi `surfaces`."
  keeping_up:
    title: 'E mantenuto aggiornato'
    description: "Un elenco di barre è una collezione come qualsiasi altra, quindi i tre modi in cui una collezione percepisce che il mondo è andato avanti sono aperti a essa: un evento dell'app, una fonte live, polling. Questo ascolta un evento — chiamalo e guarda le righe tornare. Vedi Mantenere aggiornato per i tre affiancati."
