~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ไฟล์
page_icon: 'ph:bold/folder-open'
intro: 'โปรแกรมจัดการไฟล์ที่มีความกว้างของหน้า มันไม่รู้ว่ารูปแบบไฟล์มาจากไหน: มันขอเนื้อหาของโฟลเดอร์และนำเอนทิตีไฟล์กลับ — โหลดเดิมที่ต้นไม้ใช้ — ดังนั้นดิสก์, ดัชนี, สถิติ หรือ API ทั้งหมดจึงอ่านได้เหมือนกัน'
root: ไฟล์
section:
  vue:
    title: โปรแกรมสำรวจ
    description: 'โฟลเดอร์อยู่ข้างๆ, เนื้อหาของโฟลเดอร์เรียงเป็นรายการตามคอลัมน์ใดๆ หรือในรูปแบบกริด; ถอยหลัง, ข้างหน้าและขึ้น; ตัวกรอง; การเลือกด้วยเมาส์ — ctrl, shift — และแป้นพิมพ์ — ลูกศร, Enter, Backspace, ctrl+A, Escape; ขอเพิ่มเติมเมื่อโฟลเดอร์มีมากกว่าหนึ่งหน้า การดับเบิลคลิกเข้าไปในโฟลเดอร์และส่งไฟล์ไปยังหน้า การมองเห็นและลำดับจะถูกจดจำ'
  twig:
    title: วาดโดยเซิร์ฟเวอร์
    description: 'โฟลเดอร์หนึ่งโฟลเดอร์, ในรูปแบบรายการหรือกริด, แต่ละรายการเป็นลิงค์: โฟลเดอร์ไปยังหน้าเดียวกันที่เปิดอยู่ — ที่นี่ผ่าน ?folder= — ไฟล์ไปยังที่ที่หน้าส่งมันไป.'
