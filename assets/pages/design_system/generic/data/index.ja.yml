~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: データ
page_icon: 'ph:bold/list-bullets'
intro: コレクションを取り込み、表示する形状。それらを区別するのは、読者が各レコードのどれだけを見ることができるか、そしてそれを見た後に何ができるかです。
page:
  files:
    title: ファイル
    description: ページの幅を持つファイルエクスプローラーで、ローダーによって供給され、サーバーによって描画された1つのフォルダー。
  tables:
    title: テーブル
    description: 行と列、サーバーで描画されたものまたはブラウザによってページ分けされたもので、リンク、アクション、アイコン、日付がカウントされ続ける型付けされたセル。
  live:
    title: リアルタイム更新
    description: 'コレクションが表示している内容が変更されたことを聞く3つの方法 — アプリイベント、ライブソース、またはポーリング — それぞれの目的。'
  lists:
    title: リスト
    description: 自分のヘッダーから検索およびフィルタリングされるリストで、読者がスキャンするのではなく、ブラウズするためのセット。
  properties:
    title: プロパティ
    description: '1つのレコードに対するキーと値 — すでに選択されたものの詳細パネル。'
  bars:
    title: バー
    description: '1行で名前が付けられた1つのレコード: アイコン、タイトル、それを特定するもの。検索結果、メンバー、またはファイルが描画される行。'
  tree:
    title: ツリー
    description: レコードが互いに含まれるコレクションで、1レベルずつ読み込まれ、エクスプローラーが出荷するパネルで表示されます。
  chat:
    title: チャット
    description: 逆順で読み取り、下から追加されるコレクションで、書かれていくにつれて成長する作曲者を持っています。
