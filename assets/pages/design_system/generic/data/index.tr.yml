~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Veri
page_icon: 'ph:bold/list-bullets'
intro: 'Bir koleksiyonu alan ve onu görüntüleyen şekiller. Onları ayıran şey, okuyucunun her kayıttan ne kadarını görebileceği ve gördükten sonra bununla ne yapabileceğidir.'
page:
  files:
    title: Dosyalar
    description: 'Bir yükleyici tarafından beslenen ve sunucu tarafından oluşturulan bir klasör ile sayfa genişliğinde bir dosya gezgini.'
  tables:
    title: Tablolar
    description: 'Satırlar ve sütunlar, sunucu tarafından oluşturulan veya tarayıcı tarafından sayfalara ayrılan, bağlantılar, eylemler, simgeler ve sürekli sayılan tarihler içeren yazılı hücrelerle.'
  live:
    title: 'Güncel kalmak'
    description: 'Bir koleksiyonun gösterdiği şeyin değiştiğini duyduğu üç yol — bir uygulama olayı, bir canlı kaynak veya anket — ve her birinin ne için olduğu.'
  lists:
    title: Listeler
    description: 'Kendi başlığından arama ve filtreleme yapılan bir liste, okuyucunun taradığı değil, göz gezdirdiği bir set için.'
  properties:
    title: Özellikler
    description: 'Bir kayıt için anahtar ve değer, çoklu kayıtlar yerine — zaten seçilmiş bir şeyin detay paneli.'
  bars:
    title: Çubuklar
    description: 'Tek bir satırda adlandırılan bir kayıt: bir simge, bir başlık, onu nitelendiren şey. Bir arama sonucunun, bir üyenin veya bir dosyanın oluşturulduğu satır.'
  tree:
    title: Ağaç
    description: 'Kayıtlarının birbirini içerdiği bir koleksiyon, bir seferde bir seviye yüklenir, bir gezginin sunduğu panelde.'
  chat:
    title: Sohbet
    description: 'Aşağıdan eklenen ve ters yönde okunan bir koleksiyon, yazıldıkça büyüyen bir bileşimci ile.'
