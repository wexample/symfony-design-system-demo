    edited:
      title: "Einzeln bearbeitet"
      body: "Eine geordnete Liste, deren Einträge an Ort und Stelle bearbeitet werden (block-list): jede Zeile über ihrem Formular eingeklappt, nach oben und unten verschoben, nach einer Rückfrage entfernt, weitere darunter hinzugefügt. Die Liste ändert selbst nichts: Ihr Aufrufer beantwortet jede Anfrage — hier ein Array, in einer App eine API."
  search:
    placeholder: 'Liste filtern...'
  header:
    filter: Filter
  item:
    marked:
      read: "Konfiguration gelesen"
      opened: "Verbindung geöffnet"
      skipped: "Zwei Dateien übersprungen"
      refused: "Zahlung abgelehnt"
      night: "Läuft in der Nachtschicht"
    postgres:
      title: PostgreSQL
      body: 'Verwaltete SQL-Verbindung für transaktionale Workloads'
    s3:
      title: 'Amazon S3'
      body: 'Objektspeicher-Connector für Importe und Exporte'
    webhook:
      title: Webhook
      body: 'Ereignisse aus externen Systemen auslösen und empfangen'
    redis:
      title: Redis
      body: 'In-Memory-Cache und Pub/Sub-Nachrichtenübertragung'
    mongo:
      title: MongoDB
      body: 'Dokumentenablage für flexible Schema-Workloads'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Listas
  page_icon: 'ph:bold/list-bullets'
  section:
    marked:
      title: "Líneas con marca"
      body: "item_list(items): una línea por elemento, precedida de su marca — un icono del sistema de diseño, un emoji, un carácter —, un tono que colorea la marca, o la línea entera con toned: line."
    default:
      title: Predeterminado
    empty:
      title: 'Estado vacío'
    period:
      title: 'Por período'
      body: 'Un año o un mes a la vez: el anterior, el siguiente, hoy. Se mantiene en la dirección — recargar, el período permanece —, y se detuvo hace dos años aquí. Lo que dice es lo que una lista o un gráfico le pide al servidor.'
    edited:
      title: "Editados uno a uno"
      body: "Una lista ordenada cuyos elementos se editan en su sitio (block-list): cada línea plegada sobre su formulario, subida y bajada, quitada tras una pregunta, otros añadidos debajo. La lista no cambia nada por sí misma: quien la llama responde a cada petición — aquí un array, en una app una api."
  search:
    placeholder: 'Filtrar la lista...'
  header:
    filter: Filtrar
  item:
    marked:
      read: "Configuración leída"
      opened: "Conexión abierta"
