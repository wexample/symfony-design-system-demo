  page_title: Listas
  page_icon: 'ph:bold/list-bullets'
  section:
    default:
      title: Padrão
    empty:
      title: 'Estado vazio'
    period:
      title: 'Por período'
      body: 'Um ano ou um mês por vez: o anterior, o seguinte, hoje. Mantido no endereço — recarregar, o período permanece —, e parado dois anos atrás aqui. O que ele diz é o que uma lista ou um gráfico pede ao servidor.'
  search:
    placeholder: 'Filtrar a lista...'
  header:
    filter: Filtrar
  item:
    postgres:
      title: PostgreSQL
      body: 'Conexão SQL gerenciada para cargas de trabalho transacionais'
    s3:
      title: 'Amazon S3'
      body: 'Conector de armazenamento de objetos para importações e exportações'
    webhook:
      title: Webhook
      body: 'Acionar e receber eventos de sistemas externos'
    redis:
      title: Redis
      body: 'Cache em memória e mensagens pub/sub'
    mongo:
      title: MongoDB
      body: 'Armazenamento de documentos para cargas de trabalho com esquema flexível'

ru:
