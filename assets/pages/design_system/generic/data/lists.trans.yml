en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Lists
  page_icon: ph:bold/list-bullets

  section:
    marked:
      title: "Lines with a mark"
      body: "item_list(items): one line per item, led by its mark — an icon of the design system, an emoji, a character —, a tone colouring the mark, or the whole line with toned: line."
    default:
      title: Default
    empty:
      title: Empty state
    period:
      title: By period
      body: "A year or a month at a time: the one before, the one after, today. Kept in the address — reload, the period stays —, and stopped two years back here. What it tells is what a list or a chart asks the server for."
    edited:
      title: "Edited one by one"
      body: "An ordered list whose items are edited in place (block-list): each line folded on its form, moved up and down, removed after a question, more added under it. The list changes nothing itself: its caller answers each request — here an array, an api in an app."

  search:
    placeholder: Filter the list...

  header:
    filter: Filter

  item:
    marked:
      read: "Configuration read"
      opened: "Connection opened"
      skipped: "Two files skipped"
      refused: "Payment refused"
      night: "Running on the night shift"
    postgres:
      title: PostgreSQL
      body: Managed SQL connection for transactional workloads
    s3:
      title: Amazon S3
      body: Object storage connector for imports and exports
    webhook:
      title: Webhook
      body: Trigger and receive events from external systems
    redis:
      title: Redis
      body: In-memory cache and pub/sub messaging
    mongo:
      title: MongoDB
      body: Document store for flexible schema workloads

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: القوائم
  page_icon: 'ph:bold/list-bullets'
  section:
    marked:
      title: "أسطر بعلامة"
      body: "item_list(items): سطر لكل عنصر، تسبقه علامته — أيقونة من نظام التصميم أو رمز تعبيري أو حرف —، ونبرة تلوّن العلامة، أو السطر كله مع toned: line."
    default:
      title: افتراضي
    empty:
      title: 'حالة فارغة'
    period:
      title: 'حسب الفترة'
      body: 'سنة أو شهر في وقت واحد: السابقة، التالية، اليوم. محفوظة في العنوان - عند إعادة التحميل، تبقى الفترة -، وتوقفت منذ عامين هنا. ما تخبره هو ما تطلبه القائمة أو الرسم البياني من الخادم.'
    edited:
      title: "تُحرَّر واحدًا تلو الآخر"
      body: "قائمة مرتبة تُحرَّر عناصرها في مكانها (block-list): كل سطر مطوي على نموذجه، يُنقل لأعلى ولأسفل، ويُحذف بعد سؤال، ويُضاف غيره تحته. القائمة لا تغيّر شيئًا بنفسها: يجيب مستدعيها عن كل طلب — هنا مصفوفة، وفي تطبيق واجهة برمجية."
  search:
    placeholder: 'تصفية القائمة...'
  header:
    filter: تصفية
  item:
    marked:
      read: "تمت قراءة الإعدادات"
      opened: "تم فتح الاتصال"
      skipped: "تم تخطي ملفين"
      refused: "تم رفض الدفع"
      night: "يعمل في المناوبة الليلية"
    postgres:
      title: PostgreSQL
      body: 'اتصال SQL مُدار لأعباء العمل المعاملاتية'
    s3:
      title: 'Amazon S3'
      body: 'موصل تخزين الكائنات للاستيراد والتصدير'
    webhook:
      title: Webhook
      body: 'تشغيل واستقبال الأحداث من الأنظمة الخارجية'
    redis:
      title: Redis
      body: 'ذاكرة مؤقتة في الذاكرة ورسائل نشر/اشتراك'
    mongo:
      title: MongoDB
      body: 'متجر مستندات لأعباء العمل ذات المخطط المرن'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: তালিকা
  page_icon: 'ph:bold/list-bullets'
  section:
    marked:
      title: "চিহ্নসহ লাইন"
      body: "item_list(items): প্রতিটি আইটেমের একটি লাইন, তার চিহ্ন দিয়ে শুরু — ডিজাইন সিস্টেমের আইকন, ইমোজি বা একটি অক্ষর —, টোন চিহ্নকে রাঙায়, বা toned: line দিয়ে পুরো লাইনকে।"
    default:
      title: ডিফল্ট
    empty:
      title: 'খালি অবস্থা'
    period:
      title: 'সময় অনুযায়ী'
      body: 'একসাথে একটি বছর বা একটি মাস: পূর্ববর্তী, পরবর্তী, আজ। ঠিকানায় সংরক্ষিত — পুনরায় লোড করলে, সময় থাকবে —, এবং এখানে দুই বছর আগেই থেমে গেছে। এটি যা বলে তা হলো একটি তালিকা বা একটি চার্ট সার্ভারের কাছে কী অনুরোধ করছে।'
    edited:
      title: "একে একে সম্পাদিত"
      body: "একটি ক্রমযুক্ত তালিকা যার উপাদানগুলি জায়গায় সম্পাদিত হয় (block-list): প্রতিটি লাইন তার ফর্মে ভাঁজ করা, উপরে-নিচে সরানো, প্রশ্নের পরে সরানো, নিচে আরও যোগ করা। তালিকা নিজে কিছু বদলায় না: প্রতিটি অনুরোধের উত্তর দেয় তার আহ্বানকারী — এখানে একটি অ্যারে, অ্যাপে একটি api।"
  search:
    placeholder: 'তালিকা ফিল্টার করুন...'
  header:
    filter: ফিল্টার
  item:
    marked:
      read: "কনফিগারেশন পড়া হয়েছে"
      opened: "সংযোগ খোলা হয়েছে"
      skipped: "দুটি ফাইল বাদ দেওয়া হয়েছে"
      refused: "পেমেন্ট প্রত্যাখ্যাত"
      night: "রাতের শিফটে চলছে"
    postgres:
      title: PostgreSQL
      body: 'লেনদেনের কাজের জন্য পরিচালিত SQL সংযোগ'
    s3:
      title: 'আমাজন S3'
      body: 'আমদানি ও রপ্তানির জন্য অবজেক্ট স্টোরেজ সংযোগকারী'
    webhook:
      title: ওয়েবহুক
      body: 'বাহ্যিক সিস্টেম থেকে ইভেন্ট ট্রিগার এবং গ্রহণ করুন'
    redis:
      title: Redis
      body: 'মেমরি-ভিত্তিক ক্যাশে এবং পাব/সাব মেসেজিং'
    mongo:
      title: MongoDB
      body: 'নমনীয় স্কিমা কাজের জন্য ডকুমেন্ট স্টোর'

de:
