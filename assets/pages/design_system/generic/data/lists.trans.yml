      refused: "Pago rechazado"
      night: "En el turno de noche"
    postgres:
      title: PostgreSQL
      body: 'Conexión SQL administrada para cargas de trabajo transaccionales'
    s3:
      title: 'Amazon S3'
      body: 'Conector de almacenamiento de objetos para importaciones y exportaciones'
    webhook:
      title: Webhook
      body: 'Activar y recibir eventos de sistemas externos'
    redis:
      title: Redis
      body: 'Caché en memoria y mensajería pub/sub'
    mongo:
      title: MongoDB
      body: 'Almacén de documentos para cargas de trabajo con esquemas flexibles'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: فهرست‌ها
  page_icon: 'ph:bold/list-bullets'
  section:
    marked:
      title: "سطرهای نشان‌دار"
      body: "item_list(items): برای هر مورد یک سطر، با نشانش در آغاز — نمادی از سیستم طراحی، یک ایموجی، یک نویسه —، رنگی که نشان را رنگ می‌کند، یا کل سطر را با toned: line."
    default:
      title: پیش‌فرض
    empty:
      title: 'وضعیت خالی'
    period:
      title: 'براساس بازه'
      body: 'یک سال یا یک ماه در یک زمان: قبلی، بعدی، امروز. در آدرس نگهداری می‌شود — بارگذاری مجدد، بازه حفظ می‌شود — و دو سال پیش متوقف شده است. آنچه که نشان می‌دهد همان چیزی است که یک لیست یا نمودار از سرور درخواست می‌کند.'
    edited:
      title: "یکی‌یکی ویرایش‌شده"
      body: "فهرستی مرتب که موارد آن در جای خود ویرایش می‌شوند (block-list): هر سطر روی فرمش تا شده، بالا و پایین می‌رود، پس از یک پرسش حذف می‌شود و موارد بیشتری زیرش افزوده می‌شوند. فهرست خودش چیزی را تغییر نمی‌دهد: فراخواننده‌اش به هر درخواست پاسخ می‌دهد — اینجا یک آرایه، در یک برنامه یک api."
  search:
    placeholder: 'فهرست را فیلتر کنید...'
  header:
    filter: فیلتر
  item:
    marked:
      read: "پیکربندی خوانده شد"
      opened: "اتصال باز شد"
      skipped: "دو فایل نادیده گرفته شد"
      refused: "پرداخت رد شد"
      night: "در شیفت شب در حال اجرا"
    postgres:
      title: PostgreSQL
      body: 'اتصال SQL مدیریت شده برای بارهای کاری تراکنشی'
    s3:
      title: 'Amazon S3'
      body: 'اتصال ذخیره‌سازی شی برای واردات و صادرات'
    webhook:
      title: Webhook
      body: 'فعال‌سازی و دریافت رویدادها از سیستم‌های خارجی'
    redis:
      title: Redis
      body: 'کش در حافظه و پیام‌رسانی pub/sub'
    mongo:
      title: MongoDB
      body: 'ذخیره‌سازی اسناد برای بارهای کاری با ساختار انعطاف‌پذیر'

