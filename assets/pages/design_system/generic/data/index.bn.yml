~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ডেটা
page_icon: 'ph:bold/list-bullets'
intro: 'আকৃতিগুলি একটি সংগ্রহ গ্রহণ করে এবং এটি উপস্থাপন করে। যা তাদের আলাদা করে তা হল পাঠক কতটা রেকর্ড দেখতে পায় এবং তারা একবার দেখার পরে তার সাথে কি করতে পারে।'
page:
  files:
    title: ফাইল
    description: 'একটি ফাইল এক্সপ্লোরার যা একটি পৃষ্ঠার প্রস্থের সমান, একটি লোডার দ্বারা পরিচালিত এবং একটি ফোল্ডার যা সার্ভার দ্বারা তৈরি করা হয়েছে।'
  tables:
    title: তালিকা
    description: 'সারিবদ্ধ এবং কলাম, সার্ভার দ্বারা তৈরি বা ব্রাউজার দ্বারা পৃষ্ঠা বিভক্ত, টাইপ করা সেল সহ — লিঙ্ক, ক্রিয়া, আইকন এবং তারিখ যা গণনা করতে থাকে।'
  live:
    title: 'আপডেট থাকুন'
    description: 'একটি সংগ্রহ তিনভাবে জানে যে এটি যা দেখাচ্ছে তা পরিবর্তিত হয়েছে — একটি অ্যাপ ইভেন্ট, একটি লাইভ সোর্স, বা পোলিং — এবং প্রতিটি কি জন্য।'
  lists:
    title: তালিকা
    description: 'একটি তালিকা যা তার নিজস্ব শিরোনাম থেকে অনুসন্ধান এবং ফিল্টার করা হয়, একটি সেট যা একজন পাঠক ব্রাউজ করে পরিবর্তে স্ক্যান করে।'
  properties:
    title: গুণাবলী
    description: 'একটি রেকর্ডের জন্য কী এবং মান — একটি ইতিমধ্যে নির্বাচিত বিষয়ের বিস্তারিত প্যানেল।'
  bars:
    title: বার
    description: 'একটি একক লাইনে একটি রেকর্ডের নাম: একটি আইকন, একটি শিরোনাম, যা এটি যোগ্য করে। সার্চ ফলাফল, সদস্য বা একটি ফাইল হিসাবে একটি সারি উপস্থাপন করা হয়।'
  tree:
    title: গাছ
    description: 'একটি সংগ্রহ যার রেকর্ডগুলি একে অপরকে ধারণ করে, এক পর্যায়ে লোড করা হয়, একটি প্যানেলে একটি এক্সপ্লোরার যা পাঠানো হয়।'
  chat:
    title: চ্যাট
    description: 'একটি সংগ্রহ যা পেছনের দিকে পড়া হয় এবং নিচ থেকে যোগ করা হয়, লাইভ, একটি কম্পোজার যা লেখার সাথে বাড়ে।'
