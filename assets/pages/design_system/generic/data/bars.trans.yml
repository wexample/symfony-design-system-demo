ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Панели
  page_icon: 'ph:bold/rows'
  intro: 'Панель обозначает одну вещь в одной строке: что это, как это называется, что его квалифицирует и что находится на дальнем конце. Это форма, а не привязка — сущность достигает ее через свой собственный шаблон, но результат поиска, который является файлом, приложением или настройкой, использует ту же разметку.'
  finding:
    fix: Исправить
    date: 'Установить дату'
    error:
      title: 'Отсутствует обязательный раздел «Цель»'
      subtitle: 01-PROCESSES/PR-004-document-control.md
    warning:
      title: 'Дата проверки в прошлом'
      subtitle: '01-PROCESSES/PR-004-document-control.md:4'
    info:
      title: 'Поле владельца оставлено пустым'
      subtitle: 'Не блокирует черновик, требуется перед проверкой'
  section:
    findings:
      title: Выводы
      description: 'Что сообщает анализ, по одной панели: вывод в качестве заголовка, его местоположение в качестве подзаголовка и что можно с этим сделать в завершающем слоте — ничего нет, когда ничего нельзя сделать. Степень серьезности — это тон блока, который также принимает аватар в начале.'
    alone:
      title: 'Сама панель'
      description: 'Все, кроме заголовка, является необязательным. Ведущий слот принимает значок или любую разметку, когда нужен реальный аватар; завершающий слот принимает дату, тег, ряд кнопок. Учитывая ссылку, вся ширина становится целью, а заголовок сохраняет цвет, в котором он находится.'
    search:
      title: 'Список результатов'
      description: 'Список приносит рамку, поле поиска и разделители; каждая строка представляет собой панель. Ничто здесь не является сущностью — в этом и дело: одна и та же строка обслуживает человека, документ, приложение и предпочтение.'
    surfaces:
      title: 'По одной поверхности'
      description: 'Другой взгляд на список — без общего фона и без линии, каждая панель стоит на своем блоке с пространством вокруг. Ничего нового в оформлении, панель просто принимает классы блока, и учитывая ссылку, вся карточка становится целью.'
    divided:
      title: 'Простой список'
      description: 'Когда рамка уже есть, вертикальный стек с разделителями достаточно — без формы, просто линия между двумя строками.'
    vue:
      title: 'Список из них, в Vue'
      description: 'Те же строки читаются из конечной точки, а не записываются: список содержит страницу, пагинацию и пустое состояние, и каждая сущность говорит, что читать на ней — заголовок, что квалифицирует ее, значок, куда она ведет, дата на дальнем конце. Чтения выше — это ее варианты, `разделенный`, затем `поверхности`.'
    keeping_up:
      title: 'И поддерживается в актуальном состоянии'
      description: 'Список панелей — это коллекция, как и любая другая, поэтому три способа, которыми коллекция слышит о том, что мир продолжает движение, открыты для нее: событие приложения, живой источник, опрос. Этот слушает событие — позвоните и смотрите, как строки возвращаются. См. Актуальное состояние для трех из них бок о бок.'
  sample:
    minimal:
      title: 'Заголовок сам по себе'
    icon:
      title: 'С ведущим значком'
    subtitle:
      title: 'Мая Линдквист'
      subtitle: maya@example.com
    trailing:
      title: 'Квартальные отчеты'
      subtitle: '14 документов'
