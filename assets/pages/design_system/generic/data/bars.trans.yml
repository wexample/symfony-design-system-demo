tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Çubuklar
  page_icon: 'ph:bold/rows'
  intro: 'Bir çubuk, bir şeyi tek bir satırda adlandırır: ne olduğunu, nasıl adlandırıldığını, neyin nitelik kazandırdığını ve en uçta neyin yer aldığını. Bu bir biçimdir, bir bağlayıcı değil — bir varlık kendi şablonuyla ona ulaşır, ancak bir dosya, uygulama veya ayar olan bir arama sonucu aynı işaretlemeyi kullanır.'
  finding:
    fix: Düzelt
    date: 'Bir tarih belirle'
    error:
      title: 'Zorunlu bölüm “Amaç” eksik'
      subtitle: 01-PROCESSES/PR-004-document-control.md
    warning:
      title: 'Gözden geçirme tarihi geçmişte'
      subtitle: '01-PROCESSES/PR-004-document-control.md:4'
    info:
      title: 'Sahip alanı boş bırakılmış'
      subtitle: 'Taslak için engelleyici değil, inceleme öncesi gerekli'
  section:
    findings:
      title: Bulgular
      description: 'Bir analizin raporladıkları, her bir çubukta: bulgu başlık olarak, nerede olduğu alt başlık olarak ve buraya yapılabilecekler son slotta — burada hiçbir şey yapılamıyorsa orada da bir şey yok. Ciddiyet, bloğun tonu olup, baştaki avatar bunu da alır.'
    alone:
      title: 'Çubuğun kendisi'
      description: 'Başlık dışındaki her şey isteğe bağlıdır. Önde bir simge veya gerçek bir avatar gerektiğinde herhangi bir işaretleme alır; arkada bir tarih, bir etiket, butonlar dizisi alır. Bir bağlantı verilirse, tüm genişlik hedef olur ve başlık, bulunduğu yerin rengini korur.'
    search:
      title: 'Sonuçlar listesi'
      description: 'Liste çerçeveyi, arama alanını ve ayırıcıları getirir; her satır bir çubuk getirir. Burada hiçbir şey bir varlık değildir — mesele budur: aynı satır bir kişiye, bir belgeye, bir uygulamaya ve bir tercihe hizmet eder.'
    surfaces:
      title: 'Her biri bir yüzey'
      description: 'Bir listenin diğer okunması — ortak bir arka plana ve çizgiye sahip olmadan, her çubuk kendi bloğunda durur ve etrafında boşluk vardır. Stil için yeni bir şey yok, çubuk basitçe blok sınıflarını alır ve bir bağlantı verilirse, tüm kart hedef haline gelir.'
    divided:
      title: 'Sade bir liste'
      description: 'Çerçeve zaten varsa, bölücülerle dikey bir yığın yeterlidir — kendi şekli yoktur, sadece iki satır arasında bir çizgi vardır.'
    vue:
      title: "Vue'de bir listesi"
      description: 'Aynı satırlar bir uç noktadan okunur, dışarı yazılmak yerine: liste sayfayı, sayfalama ve boş durumu tutar, her varlık üzerinde ne okunacağını belirtir — bir başlık, neyin nitelik kazandırdığı, bir simge, nereye gideceği, en uçta bir tarih. Yukarıdaki okumalar bunun varyantlarıdır, `bölünmüş` ardından `yüzeyler` gelir.'
    keeping_up:
      title: 'Ve güncel tutulur'
      description: "Bir çubuk listesi, diğerleri gibi bir koleksiyondur, bu yüzden bir koleksiyonun dünyanın ilerlediğini duyabileceği üç yol ona da açıktır: bir uygulama olayı, bir canlı kaynak, anket. Bu, bir olayı dinler — çal ve satırların geri geldiğini izle. Yan yana üçü için Güncel Tutma'ya bak."
