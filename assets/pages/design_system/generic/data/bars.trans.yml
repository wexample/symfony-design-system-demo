en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Bars
  page_icon: ph:bold/rows

  intro: "A bar names one thing in a single line: what it is, what it is called, what qualifies it, and what belongs at the far end. It is a shape, not a binding — an entity reaches it through its own template, but a search result that is a file, an app or a setting uses the very same markup."

  finding:
    fix: Fix
    date: Set a date
    error:
      title: Missing mandatory section “Purpose”
      subtitle: 01-PROCESSES/PR-004-document-control.md
    warning:
      title: Review date is in the past
      subtitle: 01-PROCESSES/PR-004-document-control.md:4
    info:
      title: Owner field left empty
      subtitle: Not blocking for a draft, required before review

  section:
    findings:
      title: Findings
      description: "What an analysis reports, one bar each: the finding as the title, where it is as the subtitle, and what can be done about it in the trailing slot — nothing there when nothing can be done here. The severity is the block's tone, which the avatar at the head takes too."
    alone:
      title: The bar itself
      description: Everything but the title is optional. The leading slot takes an icon, or any markup when a real avatar is needed; the trailing slot takes a date, a tag, a row of buttons. Given a link, the whole width becomes the target and the title keeps the colour of where it sits.
    search:
      title: A list of results
      description: "The list brings the frame, the search field and the separators; each row brings a bar. Nothing here is an entity — that is the point: the same row serves a person, a document, an application and a preference."
    surfaces:
      title: One surface each
      description: The other reading of a list — no shared background and no line, each bar standing on its own block with room around it. Nothing new to style, the bar simply takes the block classes, and given a link the whole card becomes the target.
    divided:
      title: A bare list
      description: When the frame is already there, a vertical stack with dividers is enough — no shape of its own, just a line between two rows.
    vue:
      title: A list of them, in Vue
      description: "The same rows read from an endpoint rather than written out: the list holds the page, the pagination and the empty state, and each entity says what to read on it — a title, what qualifies it, an icon, where it leads, a date at the far end. The readings above are its variants, `divided` then `surfaces`."
    keeping_up:
      title: And kept up to date
      description: "A bar list is a collection like any other, so the three ways a collection hears that the world moved on are open to it: an app event, a live source, polling. This one listens to an event — ring it and watch the rows come back. See Keeping up for the three of them side by side."

  sample:
    minimal:
      title: A title on its own
    icon:
      title: With a leading icon
    subtitle:
      title: Maya Lindqvist
      subtitle: maya@example.com
    trailing:
      title: Quarterly reports
      subtitle: 14 documents
    link:
      title: A bar that is a link
      subtitle: The whole width is the target

  search:
    placeholder: Search everything
    value: report
    filter: Filter

  result:
    user:
      title: Maya Lindqvist
      subtitle: Person · Product team
    file:
      title: Quarterly report Q3.pdf
      subtitle: Document · 2.4 MB
    app:
      title: Reporting
      subtitle: Application · Installed
    setting:
      title: Report retention
      subtitle: Setting · Storage

  member:
    maya:
      title: Maya Lindqvist
      subtitle: Owner
    sam:
      title: Sam Okonkwo
      subtitle: Editor
    robot:
      title: Nightly import
      subtitle: Service account

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: الحانات
  page_icon: 'ph:bold/rows'
  intro: 'الحانة تسمي شيئًا واحدًا في سطر واحد: ما هو، ما يسمى، ما يؤهله، وما ينتمي إلى الطرف البعيد. إنها شكل، وليست ارتباطًا - كيان يصل إليها من خلال قالب خاص به، لكن نتيجة البحث التي هي ملف أو تطبيق أو إعداد تستخدم نفس العلامة.'
  finding:
    fix: إصلاح
    date: 'حدد تاريخًا'
    error:
      title: 'قسم إلزامي مفقود "الهدف"'
      subtitle: 01-PROCESSES/PR-004-document-control.md
    warning:
      title: 'تاريخ المراجعة في الماضي'
      subtitle: '01-PROCESSES/PR-004-document-control.md:4'
    info:
      title: 'حقل المالك ترك فارغًا'
      subtitle: 'لا يمنع من المسودة، مطلوب قبل المراجعة'
  section:
    findings:
      title: النتائج
      description: 'ما تقاريره التحليل، حانة واحدة لكل منها: النتيجة كعنوان، مكانها كعنوان فرعي، وما يمكن القيام به حيال ذلك في الخانة النهائية - لا شيء هنا عندما لا يمكن القيام بشيء هنا. الخطورة هي نغمة الكتلة، التي يأخذها avatar في الرأس أيضًا.'
    alone:
      title: 'الحانة نفسها'
      description: 'كل شيء عدا العنوان اختياري. تأخذ الخانة الرائدة أيقونة، أو أي علامة عندما تكون الصورة الرمزية الحقيقية مطلوبة؛ تأخذ الخانة النهائية تاريخًا، أو علامة، أو صف من الأزرار. عند إعطاء رابط، يصبح العرض الكامل الهدف ويحتفظ العنوان بلون المكان الذي يجلس فيه.'
    search:
      title: 'قائمة النتائج'
      description: 'تجلب القائمة الإطار، حقل البحث والفواصل؛ كل صف يجلب حانة. لا شيء هنا هو كيان - هذه هي النقطة: نفس الصف يخدم شخصًا، مستندًا، تطبيقًا وتفضيلًا.'
    surfaces:
      title: 'سطح واحد لكل'
      description: 'القراءة الأخرى لقائمة - لا خلفية مشتركة ولا خط، كل حانة تقف على كتلتها الخاصة مع مساحة حولها. لا شيء جديد لتصميمه، تأخذ الحانة ببساطة فئات الكتلة، وعند إعطاء رابط، تصبح البطاقة بأكملها الهدف.'
    divided:
      title: 'قائمة بسيطة'
      description: 'عندما يكون الإطار موجودًا بالفعل، فإن كومة رأسية مع فواصل تكفي - لا شكل خاص بها، مجرد خط بين صفين.'
    vue:
      title: 'قائمة منها، في Vue'
      description: 'نفس الصفوف تقرأ من نقطة نهاية بدلاً من كتابتها: تحتفظ القائمة بالصفحة، والترقيم، والحالة الفارغة، وكل كيان يقول ماذا يقرأ عليه - عنوان، ما يؤهله، أيقونة، إلى أين يقود، تاريخ في الطرف البعيد. القراءات أعلاه هي متغيراتها، "مقسمة" ثم "أسطح".'
    keeping_up:
      title: 'وتم تحديثه'
      description: 'قائمة الحانات هي مجموعة مثل أي مجموعة أخرى، لذا فإن الطرق الثلاثة التي تسمع بها مجموعة أن العالم قد تقدم مفتوحة لها: حدث تطبيق، مصدر مباشر، استقصاء. هذه تستمع إلى حدث - رنها وراقب الصفوف تعود. انظر "مواكبة" للثلاثة منهم جنبًا إلى جنب.'
  sample:
    minimal:
      title: 'عنوان بمفرده'
    icon:
      title: 'مع أيقونة رائدة'
    subtitle:
      title: 'مايا ليندكفست'
      subtitle: maya@example.com
    trailing:
      title: 'تقارير ربع سنوية'
      subtitle: '14 مستندًا'
    link:
      title: 'حانة هي رابط'
      subtitle: 'العرض الكامل هو الهدف'
  search:
    placeholder: 'ابحث عن كل شيء'
    value: تقرير
    filter: تصفية
  result:
    user:
      title: 'مايا ليندكفست'
      subtitle: 'شخص · فريق المنتج'
    file:
      title: 'تقرير ربع سنوي Q3.pdf'
      subtitle: 'مستند · 2.4 ميجابايت'
    app:
      title: الإبلاغ
      subtitle: 'تطبيق · مثبت'
    setting:
      title: 'الاحتفاظ بالتقارير'
      subtitle: 'إعداد · تخزين'
  member:
    maya:
      title: 'مايا ليندكفست'
      subtitle: مالك
    sam:
      title: 'سام أوكونكوا'
      subtitle: محرر
    robot:
      title: 'استيراد ليلي'
      subtitle: 'حساب خدمة'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: বার
  page_icon: 'ph:bold/rows'
  intro: 'একটি বার এক লাইনে একটি জিনিসের নাম দেয়: এটি কী, এটি কী নামে ডাকা হয়, এটি কীভাবে যোগ্য হয় এবং এটি কোথায় শেষ হয়। এটি একটি আকার, একটি বাঁধন নয় — একটি সত্তা এটি তার নিজস্ব টেমপ্লেটের মাধ্যমে পৌঁছে, তবে একটি অনুসন্ধান ফলাফল যা একটি ফাইল, একটি অ্যাপ বা একটি সেটিং তা একই মার্কআপ ব্যবহার করে।'
  finding:
    fix: 'সংশোধন করুন'
    date: 'একটি তারিখ নির্ধারণ করুন'
    error:
      title: 'অবশ্যই প্রয়োজনীয় বিভাগ “উদ্দেশ্য” অনুপস্থিত'
      subtitle: 01-PROCESSES/PR-004-document-control.md
    warning:
      title: 'পর্যালোচনা তারিখ অতীতে'
      subtitle: '01-PROCESSES/PR-004-document-control.md:4'
    info:
      title: 'মালিক ক্ষেত্র খালি রেখে দেওয়া হয়েছে'
      subtitle: 'ড্রাফ্টের জন্য বাধা নয়, পর্যালোচনার আগে প্রয়োজন'
  section:
    findings:
      title: অনুসন্ধান
      description: 'একটি বিশ্লেষণের রিপোর্ট যা একটি বার প্রতিটি: খুঁজে পাওয়া শিরোনাম হিসেবে, এটি কোথায় আছে সাবশিরোনাম হিসেবে, এবং এটি সম্পর্কে কি করা যেতে পারে শেষ স্থানে — এখানে কিছুই না যখন এখানে কিছু করা যায় না। গুরুত্ব ব্লকের সুর, যা মাথায় অবতারও নেয়।'
    alone:
      title: 'বারটি নিজেই'
      description: 'শিরোনাম ছাড়া সবকিছু ঐচ্ছিক। শীর্ষস্থান একটি আইকন নেয়, অথবা যখন একটি বাস্তব অবতার প্রয়োজন হয় তখন কোনো মার্কআপ; শেষ স্থানে একটি তারিখ, একটি ট্যাগ, একটি বোতামের সারি থাকে। একটি লিঙ্ক দেওয়া হলে, পুরো প্রস্থ লক্ষ্য হয়ে যায় এবং শিরোনাম যেখানে বসে তার রঙ ধরে রাখে।'
    search:
      title: 'ফলাফলের একটি তালিকা'
      description: 'তালিকাটি ফ্রেম, অনুসন্ধান ক্ষেত্র এবং বিভাজক নিয়ে আসে; প্রতিটি সারি একটি বার নিয়ে আসে। এখানে কিছুই একটি সত্তা নয় — সেটাই মূল বিষয়: একই সারি একটি ব্যক্তি, একটি দলিল, একটি অ্যাপ এবং একটি পছন্দের জন্য কাজ করে।'
    surfaces:
      title: 'প্রতিটি একটি পৃষ্ঠ'
      description: 'একটি তালিকার অন্য একটি পাঠ — কোন শেয়ার করা পটভূমি এবং কোন লাইন নেই, প্রতিটি বার নিজ নিজ ব্লকে দাঁড়িয়ে আছে তার চারপাশে কিছু জায়গা নিয়ে। স্টাইল করার জন্য কিছু নতুন নেই, বারটি কেবল ব্লক ক্লাস গ্রহণ করে, এবং একটি লিঙ্ক দেওয়া হলে পুরো কার্ড লক্ষ্য হয়ে যায়।'
    divided:
      title: 'একটি খালি তালিকা'
      description: 'যখন ফ্রেম ইতিমধ্যেই সেখানে থাকে, একটি বিভাজকসহ উল্লম্ব স্তূপ যথেষ্ট — এটি নিজস্ব কোনো আকার নয়, কেবল দুটি সারির মধ্যে একটি লাইন।'
    vue:
      title: 'একটি তালিকা, Vue-তে'
      description: 'একই সারিগুলি একটি এন্ডপয়েন্ট থেকে পড়া হয় বরং লেখা হয়: তালিকাটি পৃষ্ঠা, পৃষ্ঠা পরিবর্তন এবং খালি অবস্থান ধারণ করে, এবং প্রতিটি সত্তা বলে যে এতে কি পড়তে হবে — একটি শিরোনাম, এটি কীভাবে যোগ্য, একটি আইকন, এটি কোথায় নিয়ে যায়, একটি তারিখ শেষ প্রান্তে। উপরের পাঠ্যগুলি এর ভেরিয়েন্ট, `divided` তারপর `surfaces`।'
    keeping_up:
      title: 'এবং আপ টু ডেট রাখা'
      description: 'একটি বার তালিকা অন্যান্য যেকোনো সংগ্রহের মতো একটি সংগ্রহ, তাই পৃথিবী এগিয়ে যাওয়ার তিনটি উপায় এটি শুনতে পারে: একটি অ্যাপ ইভেন্ট, একটি লাইভ সোর্স, পোলিং। এটি একটি ইভেন্ট শুনছে — এটি রিং করুন এবং সারিগুলি ফিরে আসতে দেখুন। তাদের তিনটি পাশে একটি সাথে দেখুন Keeping up।'
  sample:
    minimal:
      title: 'একটি শিরোনাম একা'
    icon:
      title: 'একটি শীর্ষ আইকন সহ'
    subtitle:
      title: 'মায়া লিন্ডকভিস্ট'
      subtitle: maya@example.com
    trailing:
      title: 'ত্রৈমাসিক রিপোর্ট'
      subtitle: '১৪টি ডকুমেন্ট'
    link:
      title: 'একটি লিঙ্ক হিসাবে একটি বার'
      subtitle: 'পুরো প্রস্থ লক্ষ্য'
  search:
    placeholder: 'সবকিছু অনুসন্ধান করুন'
    value: রিপোর্ট
    filter: ফিল্টার
  result:
    user:
      title: 'মায়া লিন্ডকভিস্ট'
      subtitle: 'ব্যক্তি · পণ্য দল'
    file:
      title: 'ত্রৈমাসিক রিপোর্ট Q3.pdf'
      subtitle: 'ডকুমেন্ট · ২.৪ এমবি'
    app:
      title: রিপোর্টিং
      subtitle: 'অ্যাপ্লিকেশন · ইনস্টল করা'
    setting:
      title: 'রিপোর্ট সংরক্ষণ'
      subtitle: 'সেটিং · স্টোরেজ'
  member:
    maya:
      title: 'মায়া লিন্ডকভিস্ট'
