th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: แถบ
  page_icon: 'ph:bold/rows'
  intro: 'แถบชื่อสิ่งหนึ่งในบรรทัดเดียว: มันคืออะไร, มันเรียกว่าอะไร, อะไรที่ทำให้มันเป็นไปได้, และอะไรที่อยู่ที่ปลายสุด มันเป็นรูปทรง ไม่ใช่การผูกพัน — หน่วยงานเข้าถึงมันผ่านแม่แบบของตนเอง แต่ผลการค้นหาที่เป็นไฟล์, แอปพลิเคชันหรือการตั้งค่าก็ใช้การจัดรูปแบบเดียวกัน'
  finding:
    fix: แก้ไข
    date: กำหนดวันที่
    error:
      title: 'ส่วนที่จำเป็น “วัตถุประสงค์” หายไป'
      subtitle: 01-PROCESSES/PR-004-document-control.md
    warning:
      title: วันที่ตรวจสอบอยู่ในอดีต
      subtitle: '01-PROCESSES/PR-004-document-control.md:4'
    info:
      title: ช่องเจ้าของถูกเว้นว่าง
      subtitle: 'ไม่เป็นอุปสรรคสำหรับร่าง, จำเป็นก่อนการตรวจสอบ'
  section:
    findings:
      title: ผลการค้นหา
      description: 'สิ่งที่การวิเคราะห์รายงาน, แถบแต่ละอัน: ผลการค้นหาเป็นชื่อ, ที่มันอยู่เป็นคำบรรยาย, และสิ่งที่สามารถทำได้เกี่ยวกับมันในช่องท้าย — ไม่มีที่นั่นเมื่อไม่สามารถทำอะไรได้ที่นี่ ความรุนแรงคือโทนของบล็อก, ซึ่งอวตารที่หัวก็รับไปด้วย'
    alone:
      title: แถบเอง
      description: 'ทุกอย่างนอกจากชื่อเป็นทางเลือก ช่องนำจะรับไอคอน, หรือการจัดรูปแบบใดๆ เมื่อต้องการอวตารจริง; ช่องท้ายจะรับวันที่, แท็ก, แถวของปุ่ม ให้ลิงก์, ความกว้างทั้งหมดจะกลายเป็นเป้าหมายและชื่อจะรักษาสีของที่มันนั่งอยู่'
    search:
      title: รายการผลลัพธ์
      description: 'รายการนำกรอบ, ช่องค้นหาและตัวแบ่ง; แถวแต่ละแถวจะนำแถบ ไม่มีที่นี่เป็นหน่วยงาน — นั่นคือจุดประสงค์: แถวเดียวกันให้บริการคน, เอกสาร, แอปพลิเคชันและความชอบ'
    surfaces:
      title: พื้นผิวแต่ละอัน
      description: 'การอ่านอีกอย่างของรายการ — ไม่มีพื้นหลังที่แชร์และไม่มีเส้น, แถบแต่ละอันยืนอยู่บนบล็อกของตัวเองพร้อมที่ว่างรอบๆ ไม่มีอะไรใหม่ให้สไตล์, แถบเพียงแค่รับคลาสบล็อก, และให้ลิงก์การ์ดทั้งหมดจะกลายเป็นเป้าหมาย'
    divided:
      title: รายการเปลือย
      description: 'เมื่อกรอบมีอยู่แล้ว, การจัดเรียงแนวตั้งพร้อมตัวแบ่งก็เพียงพอ — ไม่มีรูปทรงของตัวเอง, แค่เส้นระหว่างสองแถว'
    vue:
      title: 'รายการของพวกเขา, ใน Vue'
      description: 'แถวเดียวกันอ่านจากจุดสิ้นสุดแทนที่จะเขียนออก: รายการถือหน้าที่, การแบ่งหน้าและสถานะว่าง, และแต่ละหน่วยงานบอกว่าต้องอ่านอะไรเกี่ยวกับมัน — ชื่อ, อะไรที่ทำให้มันเป็นไปได้, ไอคอน, ที่มันนำไป, วันที่ที่ปลายสุด การอ่านด้านบนคือรูปแบบของมัน, `divided` จากนั้น `surfaces`.'
    keeping_up:
      title: และรักษาให้ทันสมัย
      description: 'รายการแถบเป็นการรวบรวมเช่นเดียวกับอื่นๆ, ดังนั้นสามวิธีที่การรวบรวมได้ยินว่าทางโลกก้าวไปข้างหน้าเปิดให้มัน: เหตุการณ์แอป, แหล่งสด, การตรวจสอบซ้ำ นี่ฟังเหตุการณ์ — โทรและดูแถวกลับมา ดูการรักษาให้ทันสมัยสำหรับสามรายการข้างเคียง'
