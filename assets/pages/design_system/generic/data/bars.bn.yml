page_title: বার
page_icon: 'ph:bold/rows'
intro: 'একটি বার এক লাইনে একটি জিনিসের নাম দেয়: এটি কী, এটি কী নামে ডাকা হয়, এটি কীভাবে যোগ্য হয় এবং এটি কোথায় শেষ হয়। এটি একটি আকার, একটি বাঁধন নয় — একটি সত্তা এটি তার নিজস্ব টেমপ্লেটের মাধ্যমে পৌঁছে, তবে একটি অনুসন্ধান ফলাফল যা একটি ফাইল, একটি অ্যাপ বা একটি সেটিং তা একই মার্কআপ ব্যবহার করে।'
finding:
  fix: 'সংশোধন করুন'
  date: 'একটি তারিখ নির্ধারণ করুন'
  error:
    title: 'অবশ্যই প্রয়োজনীয় বিভাগ “উদ্দেশ্য” অনুপস্থিত'
    subtitle: 01-PROCESSES/PR-004-document-control.md
  warning:
