    subtitle: 'ড্রাফ্টের জন্য বাধা নয়, পর্যালোচনার আগে প্রয়োজন'
section:
  findings:
    title: অনুসন্ধান
    description: 'একটি বিশ্লেষণের রিপোর্ট যা একটি বার প্রতিটি: খুঁজে পাওয়া শিরোনাম হিসেবে, এটি কোথায় আছে সাবশিরোনাম হিসেবে, এবং এটি সম্পর্কে কি করা যেতে পারে শেষ স্থানে — এখানে কিছুই না যখন এখানে কিছু করা যায় না। গুরুত্ব ব্লকের সুর, যা মাথায় অবতারও নেয়।'
  alone:
    title: 'বারটি নিজেই'
    description: 'শিরোনাম ছাড়া সবকিছু ঐচ্ছিক। শীর্ষস্থান একটি আইকন নেয়, অথবা যখন একটি বাস্তব অবতার প্রয়োজন হয় তখন কোনো মার্কআপ; শেষ স্থানে একটি তারিখ, একটি ট্যাগ, একটি বোতামের সারি থাকে। একটি লিঙ্ক দেওয়া হলে, পুরো প্রস্থ লক্ষ্য হয়ে যায় এবং শিরোনাম যেখানে বসে তার রঙ ধরে রাখে।'
  search:
    title: 'ফলাফলের একটি তালিকা'
    description: 'তালিকাটি ফ্রেম, অনুসন্ধান ক্ষেত্র এবং বিভাজক নিয়ে আসে; প্রতিটি সারি একটি বার নিয়ে আসে। এখানে কিছুই একটি সত্তা নয় — সেটাই মূল বিষয়: একই সারি একটি ব্যক্তি, একটি দলিল, একটি অ্যাপ এবং একটি পছন্দের জন্য কাজ করে।'
  surfaces:
    title: 'প্রতিটি একটি পৃষ্ঠ'
    description: 'একটি তালিকার অন্য একটি পাঠ — কোন শেয়ার করা পটভূমি এবং কোন লাইন নেই, প্রতিটি বার নিজ নিজ ব্লকে দাঁড়িয়ে আছে তার চারপাশে কিছু জায়গা নিয়ে। স্টাইল করার জন্য কিছু নতুন নেই, বারটি কেবল ব্লক ক্লাস গ্রহণ করে, এবং একটি লিঙ্ক দেওয়া হলে পুরো কার্ড লক্ষ্য হয়ে যায়।'
  divided:
    title: 'একটি খালি তালিকা'
    description: 'যখন ফ্রেম ইতিমধ্যেই সেখানে থাকে, একটি বিভাজকসহ উল্লম্ব স্তূপ যথেষ্ট — এটি নিজস্ব কোনো আকার নয়, কেবল দুটি সারির মধ্যে একটি লাইন।'
  vue:
    title: 'একটি তালিকা, Vue-তে'
    description: 'একই সারিগুলি একটি এন্ডপয়েন্ট থেকে পড়া হয় বরং লেখা হয়: তালিকাটি পৃষ্ঠা, পৃষ্ঠা পরিবর্তন এবং খালি অবস্থান ধারণ করে, এবং প্রতিটি সত্তা বলে যে এতে কি পড়তে হবে — একটি শিরোনাম, এটি কীভাবে যোগ্য, একটি আইকন, এটি কোথায় নিয়ে যায়, একটি তারিখ শেষ প্রান্তে। উপরের পাঠ্যগুলি এর ভেরিয়েন্ট, `divided` তারপর `surfaces`।'
  keeping_up:
    title: 'এবং আপ টু ডেট রাখা'
    description: 'একটি বার তালিকা অন্যান্য যেকোনো সংগ্রহের মতো একটি সংগ্রহ, তাই পৃথিবী এগিয়ে যাওয়ার তিনটি উপায় এটি শুনতে পারে: একটি অ্যাপ ইভেন্ট, একটি লাইভ সোর্স, পোলিং। এটি একটি ইভেন্ট শুনছে — এটি রিং করুন এবং সারিগুলি ফিরে আসতে দেখুন। তাদের তিনটি পাশে একটি সাথে দেখুন Keeping up।'
