fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: جدول‌ها
  page_icon: 'ph:bold/table'
  section:
    pagination:
      title: 'صفحه‌بندی، ترسیم شده توسط سرور'
      description: '`pagination(page, pages_count)` صفحات یک فهرست را به عنوان لینک رسم می‌کند: هر کدام مسیر و پرسش صفحه‌ای که در آن هست را حفظ می‌کند — یک جستجو، یک ترتیب — و فقط `page` را تغییر می‌دهد، که از ۱ شمارش می‌شود. اعداد نشان داده شده اعداد صفحه‌گردان ویو هستند: اولی، آخری، فعلی و همسایگانش. `compact` شماره‌های قبل و بعد را در اطراف شماره صفحه نگه می‌دارد؛ `route` و `params` از آدرس دیگری عبور می‌کنند.'
    wide:
      title: 'بزرگ‌تر از اتاق'
      description: 'جدولی که ستون‌های آن بیشتر از عرض صفحه باشد، به عرضی که نیاز دارد رسم می‌شود و به هر چیزی که در اطرافش اسکرول می‌کند — منطقه، صفحه — سرریز می‌شود، هرگز با نوار اسکرول خود. درخواست شده (`scroll: true`)، همانطور که در اینجا است، به سمت جانبی در قاب خود اسکرول می‌کند و صفحه اطرافش ثابت می‌ماند: برای جدولی در میان چیزهای دیگر در یک ظرف که اسکرول نمی‌شود. یک جدول چسبنده این را فدای می‌کند: یک هدر که به صفحه می‌چسبد و یک قاب که به تنهایی اسکرول می‌کند نمی‌تواند همزمان وجود داشته باشد.'
    default:
      title: 'جدول ساده'
    actions:
      title: 'جدول با عمل‌ها'
    links:
      title: 'سلول‌های لینک و آیکون'
    loading:
      title: 'وضعیت بارگذاری'
    empty:
      title: 'وضعیت خالی'
    alignment:
      title: 'تراز ستون‌ها'
    markdown:
      title: 'از Markdown'
      description: 'جدولی که به زبان Markdown نوشته شده و از طریق `markdown_ds` پردازش شده است: ستون‌ها، تراز آن‌ها و نشانه‌گذاری هر سلول از سند خوانده می‌شود و جدول اینجا مانند هر جدول دیگری رسم می‌شود. `markdown` متن ساده `<table>` را نگه می‌دارد، برای هر آنچه که صفحه نیست — یک ایمیل، یک فید.'
    groups:
      title: 'گروه‌بندی ردیف‌ها'
      description: 'یک ردیف که تنها یک گروه را حمل می‌کند، ردیف نیست: این خطی است بین دو دسته از آن‌ها، با یک کلمه. این ردیف جدول را پوشش می‌دهد و آنچه را که پس از آن می‌آید نامگذاری می‌کند — همانند خواندن یک جداکننده منو.'
    status:
      title: 'سلول‌های وضعیت'
      description: 'یک وضعیت یک دایره است، هرگز رنگی که کسی انتخاب کرده باشد: سلول یک نام نوع می‌گیرد، یا یک نوع با یک شمارش و عنوان، و آیکون وضعیت را همانطور که باقی سیستم رسم می‌کند، می‌کشد. هیچ چیزی برای استایل در صفحه وجود ندارد.'
    sticky:
      title: 'هدر چسبنده'
      description: 'یک جدول طولانی به اندازه‌ای که ردیف به ردیف خوانده می‌شود، به صورت ستون به ستون نیز خوانده می‌شود. با `sticky`، هدر در دید باقی می‌ماند در حالی که ردیف‌ها زیر آن اسکرول می‌شوند؛ یک صفحه با چیزی که در بالا چسبیده نشان می‌دهد که چقدر پایین در `--table-sticky-top` قرار دارد.'
    zone:
      title: 'جدولی در منطقه‌ای مختص به خود'
      description: 'یک منطقه `zone--table` به طور کامل به جدول داده می‌شود: چیزی که آن را در بالا می‌رانَد، صفحاتش در پایین، از آنچه اسکرول می‌کند، و بین آنها زمین جدول تا پایین منطقه، حتی برای سه ردیف. هر جدولی در آن قرار می‌گیرد، چه توسط سرور نوشته شده باشد و چه توسط یک ویو. با `natural`، مانند جدول سمت چپ، جدول عرض ستون‌های خود را حفظ می‌کند، نه کشیده و نه فشرده.'
    striped:
      title: 'ردیف‌های نوار دار، روشن زیر نشان‌گر'
    selection:
      title: 'ردیف‌هایی که می‌توان انتخاب کرد'
      description: 'یک مربع در بالای هر ردیف، یکی در هدر برای همه آن‌ها، و عمل‌ها در بالا: آن‌ها ردیف‌های انتخاب شده را به آدرس خود ارسال می‌کنند و در حالی که هیچ انتخابی نشده در دسترس نیستند، دور می‌مانند.'
    files:
      title: 'فایل‌ها، یک مجموع، یک عمل بر روی هر ردیف'
      description: 'مسیرها با نامشان خوانده می‌شوند، پوشه‌ها قبل از آن از ابتدا کوتاه می‌شوند. نوار به تعداد ردیف‌ها پایان می‌یابد و یک عمل با علامت `all` با هیچ چیز انتخاب شده کار می‌کند — آن هر ردیف را می‌گیرد و نوار را وقتی که یکی انتظار می‌رود پیش می‌برد.'
    filters:
      title: فیلترها
      description: 'نوار فیلترها در بالای جدول، هر کدام یک منوی نامحسوس، می‌گوید که وقتی فیلتر اعمال شد به چه چیزی محدود می‌شود. در سرور آن‌ها در پرسش صفحه زندگی می‌کنند — هر گزینه یک لینک است — و کنترل‌کننده ردیف‌ها را از آن محدود می‌کند؛ در vue آن‌ها مقدارهایی هستند که به صفحه برای api آن داده می‌شوند، یا توسط جدول به ردیف‌هایی که قبلاً دارد اعمال می‌شوند. هر گزینه یک مربع است — گرد برای انتخاب یکی — با رنگی که وقتی رنگی دارد، یک وضعیت یا یک دسته را نشان می‌دهد.'
    sorting:
      title: مرتب‌سازی
      description: 'یک هدر که مرتب‌سازی می‌کند یک لینک بر روی سرور و یک دکمه در ویو است: صعودی، نزولی، سپس بازگشت به ترتیبی که صفحه اعلام کرده است، که فهرست بر روی آن باز می‌شود و که فلش آن از ابتدا نشان می‌دهد. تاریخ‌های خالی هر دو طرف آخر می‌روند، و نام‌ها به روشی که زبان آنها را مرتب می‌کند مقایسه می‌شوند. در اینجا جدول ردیف‌هایی را که خود به آن داده شده است مرتب می‌کند؛ یک کنترل‌کننده که فهرست خود را صفحه‌بندی می‌کند همان پرسش را می‌خواند.'
    figures:
      title: 'کدها، اعداد و مجموع‌ها'
      description: "`cell: 'code'` یک شناسه در نوع مونو قرار می‌دهد؛ `cell: 'number'`، یا یک `unit`، یک عدد را به زبان محلی صفحه می‌نویسد. `negative: true` یک عدد زیر صفر را به رنگ خطا رسم می‌کند، علامت منفی آن نیز این را می‌گوید. `totals` یک ردیف است که صفحه به آن واگذار می‌کند، زیر دیگران رسم می‌شود — جدول هیچ چیزی را جمع نمی‌کند، یک صفحه یا یک فهرست فیلتر شده را نگه می‌دارد. توسط سرور رسم شده، سپس توسط ویو."
    sorting_vue:
      title: 'مرتب‌سازی در مرورگر، از twig'
      description: '`vue: true` همان ستون‌ها و ردیف‌ها را به دوقلوی ویو تحویل می‌دهد: آن تمام فهرست را در مرورگر مرتب و جستجو می‌کند، بدون بارگذاری صفحه. برای یک فهرست که صفحه به طور کامل نگه داشته است — یک فهرست کوتاه، یا یکی که هیچ API آن را ارائه نمی‌دهد.'
    selection_select:
      title: 'عمل‌ها در یک انتخاب'
      description: 'همین نوار زمانی که عمل‌های کافی برای شلوغ کردن آن وجود دارد: یکی انتخاب می‌شود، سپس اعمال می‌شود.'
    vue:
      title: 'جدول موجودیت Vue'
    vue_selection:
      title: 'جدول Vue با انتخاب'
      description: 'همین قرارداد در سمت کاربر: کلیدهای انتخاب شده از طریق v-model:selected برمی‌گردند، هر عمل به عنوان bulk-action منتشر می‌شود و یکی با یک آدرس به عنوان جدولی که سرور آن را ارسال می‌کند، ارسال می‌شود. این‌ها هیچ‌کدام ندارند، بنابراین خط زیر می‌گوید که چه چیزی باید انجام می‌شد. سه ردیف در هر صفحه، مجموع در انتهای نوار، و آرشیو همه نیاز به هیچ انتخابی ندارد.'
    vue_compact:
