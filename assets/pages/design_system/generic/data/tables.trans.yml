tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Tablolar
  page_icon: 'ph:bold/table'
  section:
    pagination:
      title: 'Sunucu tarafından oluşturulan sayfalama'
      description: "`pagination(page, pages_count)` bir liste sayfasını bağlantılar olarak çizer: her biri bulunduğu sayfanın rotasını ve sorgusunu korur — bir arama, bir sıralama — ve yalnızca `page` değişir, 1'den itibaren sayılır. Gösterilen numaralar vue sayfa numarasının: ilk, son, mevcut ve komşularıdır. `compact` önceki ve sonraki sayfa numarasını korur; `route` ve `params` başka bir adresten geçer."
    wide:
      title: 'Odanın genişliğinden daha geniş'
      description: 'Sayfa genişliğinden daha fazla sütun talep eden bir tablo, ihtiyaç duyduğu genişlikte çizilir ve etrafında kaydıran herhangi bir alana — bölgeye, sayfaya — taşar, kendi kaydırıcısı olmaz. İstenirse (`scroll: true`), burada olduğu gibi, kendi çerçevesinde yanlamasına kaydırılır ve etrafındaki sayfa yerinde kalır: kaydırmayan bir konteynerde diğer şeylerin arasında bir tablo için. Yapışkan bir tablo bunu kabul etmez: sayfaya yapışan bir başlık ve kendi başına kaydıran bir çerçeve bir arada olamaz.'
    default:
      title: 'Basit tablo'
    actions:
      title: 'İşlemlerle tablo'
    links:
      title: 'Bağlantı ve simge hücreleri'
    loading:
      title: 'Yükleniyor durumu'
    empty:
      title: 'Boş durum'
    alignment:
      title: 'Sütun hizalaması'
    markdown:
      title: "Markdown'dan"
      description: 'Markdown ile yazılmış ve `markdown_ds` üzerinden geçirilmiş bir tablo: sütunlar, hizalamaları ve her hücrenin işaretlemesi belgeden okunur ve tablo burada diğerleri gibi çizilir. `markdown`, sayfa olmayan her şey için düz `<table>` tutar — bir mail, bir akış.'
    groups:
      title: 'Gruplandırılmış satırlar'
      description: 'Sadece bir grubu taşıyan bir satır, bir satır değildir: iki grup arasında verilen bir kelime ile bir çizgidir. Tabloyu kaplar ve ardından gelenleri adlandırır — bir menü ayırıcı gibi aynı okuma.'
    status:
      title: 'Durum hücreleri'
      description: 'Bir durum bir dairedir, asla birinin seçtiği bir renk değildir: hücre bir tür adı alır, ya da bir sayı ve başlık ile bir tür alır ve durumu, sistemin geri kalanının çizdiği durum simgesini çizer. Sayfada stil verilecek bir şey yok.'
    sticky:
      title: 'Yapışkan başlık'
      description: 'Uzun bir tablo, hem sütun hem de satır olarak okunur. `sticky` ile başlık görünümde kalırken, satırlar altında kayar; kendi üstünde bir şey sabitlenmiş bir sayfa, ne kadar aşağıda olduğunu `--table-sticky-top` ile belirtir.'
    zone:
      title: 'Kendine ait bir alanda bir tablo'
      description: 'Tabloya tamamen verilen bir `zone--table` alanı: en üstte neyin yönettiği, ayak kısmında sayfaları, neyin kaydırılmadığından, bunlar arasında tablonun tabanı alanın en altına kadar, hatta üç satır için bile. Herhangi bir tablo bunun içine girebilir, sunucu veya vue tarafından yazılmış. `natural` ile, soldaki gibi, tablo sütunlarının genişliğini korur, ne uzatılır ne de sıkıştırılır.'
    striped:
      title: 'Şeritli satırlar, imleç altında aydınlatılır'
    selection:
      title: 'Seçilebilecek satırlar'
      description: 'Her satırın başında bir kutu, hepsi için bir başlıkta ve yukarıda işlemler: işaretlenmiş satırları kendi adreslerine gönderir ve hiçbiri işaretlenmediğinde erişilemez durumda kalır.'
    files:
      title: 'Dosyalar, toplam, her satırda bir işlem'
      description: 'Adlarıyla okunan yollar, önündeki klasörler başlangıcından kesilir. Çubuk, kaç satır olduğunu gösterir ve `tümü` ile işaretlenmemişken çalışan bir işlem — her satırı alır ve beklenildiğinde çubuğu yönlendirir.'
    filters:
      title: Filtreler
      description: "Tablonun başında bir filtre çubuğu, her biri neye daraldığını söyleyen bir menü. Sunucuda sayfanın sorgusunda yaşarlar — her seçenek bir bağlantıdır — ve denetleyici, ondan satırları daraltır; vue'da ise sayfaya api'si için verilen bir değer veya tablonun zaten sahip olduğu satırlara uygulanan bir değerdir. Her seçenek bir kutudur — bir seçim için yuvarlak — tonuna sahip olduğunda, bir durum veya kategori ile renklendirilir."
    sorting:
      title: Sıralama
      description: "Sıralayan bir başlık, sunucuda bir bağlantı ve vue'de bir düğmedir: artan, azalan, ardından sayfanın bildirdiği sıraya geri döner; liste başlangıçta gösterilen ok ile açılır. Boş tarihler her iki yönde de en sona gider ve isimler diliyle sıralanır. Burada tablo, kendisine verilen satırları sıralar; bir kontrolörü listesini sayfalar, aynı sorguyu okur."
    figures:
      title: 'Kodlar, sayılar ve toplamlar'
      description: "`cell: 'code'` mono yazı tipi içinde bir tanımlayıcı ayarlar; `cell: 'number'` veya bir `unit`, sayfanın yerelinde bir rakam yazar. `negative: true` sıfırın altında bir rakamı hata tonu ile çizer, eksi işareti de bunu söyler. `totals`, sayfanın teslim ettiği, diğerlerinin altında çizilen bir satırdır — tablo hiçbir şeyi toplamaz, bir sayfayı veya filtrelenmiş bir listeyi tutar. Sunucu tarafından çizilir, sonra vue tarafından."
    sorting_vue:
      title: "Tarayıcıda sıralama, twig'den"
      description: "`vue: true` aynı sütun ve satırları vue ikizine verir: tarayıcıda tüm listeyi sıralar ve arar, sayfa yüklemesi olmadan. Sayfanın tamamen tuttuğu bir liste için — kısa bir liste veya bir api'nin hizmet vermediği bir liste."
    selection_select:
      title: 'Seçimdeki işlemler'
      description: 'Yeterince işlem olduğunda aynı çubuk: biri seçilir, ardından uygulanır.'
    vue:
      title: 'Vue varlık tablosu'
    vue_selection:
      title: 'Seçim ile Vue tablosu'
      description: 'İstemcide aynı sözleşme: işaretlenmiş anahtarlar v-model:selected ile geri gelir, her işlem toplu işlem olarak iletilir ve bir adres ile olanı, sunucu tablosunun gönderdiği gibi gönderilir. Bunların hiçbiri yoktur, bu yüzden aşağıdaki satır ne yapılacağını söyler. Sayfada üç satır, çubuğun sonunda toplam ve Arşivle tümü hiçbir işaretleme gerektirmez.'
    vue_compact:
      title: 'Toplamsız sayfalama'
      description: 'API toplam döndürmediğinde, sayfa dönmeye önceki/sonraya geri döner.'
    vue_dates:
      title: 'Vue tarih biçimlendiricileri'
  column:
    wide: Sütun
    default:
      name: Ad
      date: Tarih
      seen: 'Son görülen'
    actions:
      name: Kaynak
      date: 'Güncellenme tarihi'
      operations: İşlemler
    links:
      source: Kaynak
      state: Durum
    status:
      name: Hattı
      build: İnşa
      tests: Testler
      deploy: Dağıtım
    alignment:
      left: 'Ad (sol)'
      center: 'Durum (orta)'
      right: 'Miktar (sağ)'
  row:
    wide: 'Yeterince uzun bir değer'
    one:
      title: 'Proje Alpha'
      meta: '2026-01-10'
    two:
      title: 'Proje Beta'
      meta: '2026-02-18'
    three:
      title: 'Proje Gamma'
      meta: '2026-03-25'
    action:
      one:
        title: 'Kaynak Alpha'
        meta: '2026-01-12'
      two:
        title: 'Kaynak Beta'
        meta: '2026-02-20'
      loading:
        label: 'Satırlar yükleniyor'
      empty:
        label: 'Veri mevcut değil.'
  group:
    first: 'Birinci grup'
    second: 'İkinci grup'
  status:
    flaky: 'Üç test dalgalı'
  bulk:
    archive: Arşivle
    export: 'Dışa aktar'
    delete: Sil
  files:
    column:
      path: Dosya
    fix_selected: 'Seçilenleri düzelt'
    fix_all: 'Hepsini düzelt'
  filters:
    owner: Sahip
    state: Durum
    open: Açık
    closed: Kapalı
    column:
      name: Ad
  action:
    open: Aç
  sorting:
    name: İsim
    city: Şehir
    measured: 'Son ölçüm'
    actions: Eylemler
  figures:
    code: Kod
    item: Öğe
    net: 'Net tedarik'
    area: Alan
    total: Toplam

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ٹیبلیں
  page_icon: 'ph:bold/table'
  section:
    pagination:
      title: 'سرور کی طرف سے تیار کردہ صفحہ بندی'
      description: '`pagination(page, pages_count)` ایک فہرست کے صفحات کو روابط کے طور پر ظاہر کرتا ہے: ہر ایک اس صفحے کا راستہ اور تلاش کو برقرار رکھتا ہے جس پر وہ موجود ہے — ایک تلاش، ایک ترتیب — اور صرف `page` کو تبدیل کرتا ہے، جو 1 سے شمار ہوتا ہے۔ دکھائے گئے نمبر vue پیجر کے ہیں: پہلا، آخری، موجودہ اور اس کے قریب۔ `compact` صفحہ نمبر کے ارد گرد پچھلا اور اگلا رکھتا ہے؛ `route` اور `params` کسی اور ایڈریس کے ذریعے صفحے کو منتقل کرتے ہیں۔'
    wide:
      title: 'کمرے سے وسیع'
      description: 'ایک جدول جس کے کالموں کو صفحے کی ضرورت سے زیادہ جگہ درکار ہے، اسے اس کی ضرورت کے مطابق چوڑائی میں بنایا جاتا ہے اور یہ اس کے گرد موجود کسی بھی چیز میں بہتا ہے — زون، صفحہ —، کبھی بھی اپنی اسکرول بار کے بغیر۔ اگر درخواست کی گئی (`scroll: true`)، جیسا کہ یہاں، یہ اپنے فریم میں سائیڈ وائز اسکرول کرتا ہے اور اس کے ارد گرد کا صفحہ اپنی جگہ پر رہتا ہے: ایک کنٹینر میں دوسری چیزوں کے درمیان ایک جدول کے لیے جو اسکرول نہیں کرتا۔ ایک چپکنے والا جدول اس کا قربان کر دیتا ہے: ایک ہیڈر جو صفحے پر چپک جاتا ہے اور ایک فریم جو اپنے طور پر اسکرول کرتا ہے، دونوں کو ایک ساتھ نہیں حاصل کیا جا سکتا۔'
    default:
      title: 'سادہ ٹیبل'
    actions:
      title: 'عمل کے ساتھ ٹیبل'
    links:
      title: 'لنک اور آئیکن سیل'
    loading:
      title: 'لوڈ ہو رہا ہے'
    empty:
      title: 'خالی حالت'
    alignment:
      title: 'کالم کی ہم آہنگی'
    markdown:
      title: 'مارک ڈاون سے'
      description: 'ایک ٹیبل جو مارک ڈاون میں لکھی گئی ہے اور `markdown_ds` کے ذریعے گزرتی ہے: کالم، ان کی ہم آہنگی اور ہر سیل کی مارک اپ دستاویز سے پڑھی جاتی ہے، اور ٹیبل یہاں دیگر ٹیبلز کی طرح بنایا جاتا ہے۔ `markdown` سادہ `<table>` کو برقرار رکھتا ہے، جو بھی صفحہ نہیں ہے — ایک میل، ایک فیڈ۔'
    groups:
      title: 'گروپ قطاریں'
      description: 'ایک قطار جو صرف ایک گروپ پر مشتمل ہوتی ہے وہ ایک قطار نہیں ہے: یہ دو گروپوں کے درمیان ایک لائن ہے، جسے ایک لفظ دیا گیا ہے۔ یہ ٹیبل کی چوڑائی میں پھیلی ہوئی ہے اور اس کے بعد آنے والی چیزوں کا نام دیتی ہے — ایک مینو سیپریٹر کی طرح۔'
    status:
      title: 'اسٹیٹس سیل'
      description: 'ایک حالت ایک دائرہ ہے، کبھی بھی کوئی رنگ جو کسی نے منتخب کیا: سیل ایک قسم کا نام لیتا ہے، یا ایک قسم جس کے ساتھ ایک تعداد اور ایک عنوان ہوتا ہے، اور اسٹیٹس آئیکن کو کھینچتا ہے جیسا کہ باقی سسٹم کھینچتا ہے۔ صفحے میں کچھ بھی اسٹائل کرنے کی ضرورت نہیں ہے۔'
    sticky:
      title: 'چپکنے والا ہیڈر'
      description: 'ایک طویل ٹیبل کو کالم بہ کالم پڑھا جاتا ہے جتنا کہ قطار بہ قطار۔ `sticky` کے ساتھ، ہیڈر نظر میں رہتا ہے جبکہ قطاریں اس کے نیچے سکرول کرتی ہیں؛ ایک صفحہ جس میں اوپر کچھ چپکایا گیا ہے وہ `--table-sticky-top` میں نیچے کتنا آگے ہے یہ بتاتا ہے۔'
    zone:
      title: 'اپنے زون میں ایک جدول'
      description: 'ایک `zone--table` زون پورے جدول کو دیا جاتا ہے: جو اسے اوپر چلاتا ہے، اس کے صفحات نیچے، اس سے جو اسکرول ہوتا ہے، اور ان کے درمیان جدول کا نیچے تک کا حصہ، یہاں تک کہ تین قطاروں کے لیے بھی۔ کوئی بھی جدول اس میں جا سکتا ہے، چاہے وہ سرور کے ذریعہ لکھا گیا ہو یا vue کے ذریعہ۔ `natural` کے ساتھ، جیسے کہ بائیں جانب، جدول اپنے کالموں کی چوڑائی برقرار رکھتا ہے، نہ تو کھینچا ہوا اور نہ ہی سکڑا ہوا۔'
    striped:
      title: 'پٹی دار قطاریں، پوائنٹر کے نیچے روشن'
    selection:
      title: 'قطاریں جنہیں نشان زد کیا جا سکتا ہے'
      description: 'ہر قطار کے سرے پر ایک باکس، ان سب کے لیے ایک ہیڈر میں، اور اوپر کے اعمال: یہ نشان زد قطاروں کو اپنے ایڈریس پر بھیجتے ہیں، اور جب کچھ نشان زد نہ ہو تو پہنچ سے باہر رہتے ہیں۔'
    files:
      title: 'فائلیں، کل، ہر قطار پر ایک عمل'
      description: 'نام سے پڑھی جانے والی پاتھیں، اس سے پہلے کے فولڈر اس کے شروع سے کاٹے جاتے ہیں۔ بار یہ بتاتی ہے کہ کتنی قطاریں ہیں، اور ایک عمل جس پر `all` کا نشان ہے وہ بغیر کسی نشان زد کے کام کرتا ہے — یہ ہر قطار کو لیتا ہے، اور جب یہ متوقع ہوتا ہے تو بار کو آگے لے جاتا ہے۔'
    filters:
      title: فلٹرز
      description: 'ٹیبل کے سرے پر فلٹرز کی ایک بار، ہر ایک ایک غیر واضح مینو، بتاتے ہوئے کہ یہ ایک بار جب یہ کرتا ہے تو کس چیز کو محدود کرتا ہے۔ سرور پر یہ صفحے کی درخواست میں رہتے ہیں — ہر آپشن ایک لنک ہے — اور کنٹرولر ان سے قطاروں کو محدود کرتا ہے؛ ویو میں یہ ایک قیمت ہے جو صفحے کو اس کی API کے لیے دی گئی ہے، یا ٹیبل کے ذریعے پہلے سے موجود قطاروں پر لگائی گئی ہے۔ ہر آپشن ایک باکس ہے — ایک کا انتخاب کرنے کے لیے گول — جب یہ ایک ہوتا ہے تو اس کے لہجے کے مطابق رنگین، ایک اسٹیٹس یا ایک زمرہ۔'
    sorting:
      title: ترتیب
      description: 'ایک ہیڈر جو ترتیب دیتا ہے، سرور پر ایک لنک اور vue میں ایک بٹن ہے: چڑھتا ہوا، اترتا ہوا، پھر اس ترتیب میں واپس جانا جو صفحے نے بیان کی ہے، جس پر فہرست کھلتی ہے اور جس کا تیر شروع سے دکھاتا ہے۔ خالی تاریخیں دونوں طریقوں میں آخر میں آتی ہیں، اور نام ان طریقوں سے موازنہ کرتے ہیں جن سے زبان انہیں ترتیب دیتی ہے۔ یہاں جدول خود ہی دی گئی قطاروں کو ترتیب دیتا ہے؛ ایک کنٹرولر جو اپنی فہرست کو صفحہ بند کرتا ہے، اسی تلاش کو پڑھتا ہے۔'
    figures:
      title: 'کوڈ، اعداد اور کل'
      description: "`cell: 'code'` ایک شناخت کار کو مونو چہرے میں سیٹ کرتا ہے؛ `cell: 'number'`، یا ایک `unit`، صفحے کی مقامی زبان میں ایک عدد لکھتا ہے۔ `negative: true` ایک عدد کو صفر سے نیچے غلطی کے لہجے میں ظاہر کرتا ہے، اس کا منفی نشان بھی یہی کہتا ہے۔ `totals` ایک قطار ہے جو صفحہ ہاتھ میں دیتا ہے، دوسروں کے نیچے بنائی گئی — جدول کچھ بھی جمع نہیں کرتا، ایک صفحہ یا ایک فلٹر کردہ فہرست کو پکڑتا ہے۔ سرور کی طرف سے بنایا گیا، پھر vue کی طرف سے۔"
    sorting_vue:
      title: 'براؤزر میں ترتیب دینا، ٹویگ سے'
      description: '`vue: true` ایک ہی کالم اور قطاریں vue جڑواں کو دیتا ہے: یہ براؤزر میں پوری فہرست کو ترتیب دیتا ہے اور تلاش کرتا ہے، بغیر کسی صفحہ کے لوڈ کے۔ ایک فہرست کے لیے جسے صفحہ پوری طرح رکھتا ہے — ایک چھوٹی، یا ایک جس کے لیے کوئی api خدمت نہیں کرتی۔'
    selection_select:
      title: 'منتخب میں اعمال'
      description: 'جب کافی اعمال ہوتے ہیں تو وہی بار: ایک منتخب کیا جاتا ہے، پھر لگایا جاتا ہے۔'
    vue:
      title: 'ویو اینٹیٹی ٹیبل'
    vue_selection:
      title: 'چناؤ کے ساتھ ویو ٹیبل'
      description: 'کلائنٹ پر وہی معاہدہ: نشان زد کردہ چابیاں v-model:selected کے ذریعے واپس آتی ہیں، ہر عمل کو bulk-action کے طور پر جاری کیا جاتا ہے، اور ایک ایڈریس کے ساتھ پوسٹ کیا جاتا ہے جیسا کہ سرور ٹیبل اسے پوسٹ کرتا ہے۔ ان میں کوئی نہیں ہے، تو نیچے کی لائن یہ بتاتی ہے کہ کیا کیا جا سکتا تھا۔ ہر صفحے پر تین قطاریں، بار کے آخر میں کل، اور آرکائیو سب کو کچھ بھی نشان زد کیے بغیر درکار ہے۔'
    vue_compact:
      title: 'کل کے بغیر صفحات'
      description: 'جب API کل واپس نہیں کرتی، تو پیجر پچھلے/اگلے پر واپس آ جاتا ہے۔'
    vue_dates:
      title: 'ویو تاریخ فارمیٹر'
