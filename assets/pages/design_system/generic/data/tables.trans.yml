      title: 'Proyecto Alpha'
      meta: '2026-01-10'
    two:
      title: 'Proyecto Beta'
      meta: '2026-02-18'
    three:
      title: 'Proyecto Gamma'
      meta: '2026-03-25'
    action:
      one:
        title: 'Fuente Alpha'
        meta: '2026-01-12'
      two:
        title: 'Fuente Beta'
        meta: '2026-02-20'
      loading:
        label: 'Cargando filas'
      empty:
        label: 'No hay datos disponibles.'
  group:
    first: 'Primer grupo'
    second: 'Segundo grupo'
