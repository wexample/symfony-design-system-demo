ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ٹیبلیں
  page_icon: 'ph:bold/table'
  section:
    wide:
      title: 'کمرے سے وسیع'
      description: 'ایک ٹیبل جس کے کالموں کو صفحے کی ضرورت سے زیادہ جگہ چاہیے، وہ اپنی ضرورت کے مطابق چوڑائی میں بنایا جاتا ہے، ایک ایسے فریم میں جو سائیڈوں پر سکرول ہوتا ہے — اس کے گرد صفحہ نہیں حرکت کرتا۔ ایک چپکنے والی ٹیبل اس سے الگ ہے: ایک ہیڈر جو صفحے پر چپکا رہتا ہے اور ایک فریم جو خود بخود سکرول کرتا ہے، دونوں ایک ساتھ نہیں ہو سکتے۔'
    default:
      title: 'سادہ ٹیبل'
    actions:
      title: 'عمل کے ساتھ ٹیبل'
    links:
      title: 'لنک اور آئیکن سیل'
    loading:
      title: 'لوڈ ہو رہا ہے'
    empty:
      title: 'خالی حالت'
    alignment:
      title: 'کالم کی ہم آہنگی'
    markdown:
      title: 'مارک ڈاون سے'
      description: 'ایک ٹیبل جو مارک ڈاون میں لکھی گئی ہے اور `markdown_ds` کے ذریعے گزرتی ہے: کالم، ان کی ہم آہنگی اور ہر سیل کی مارک اپ دستاویز سے پڑھی جاتی ہے، اور ٹیبل یہاں دیگر ٹیبلز کی طرح بنایا جاتا ہے۔ `markdown` سادہ `<table>` کو برقرار رکھتا ہے، جو بھی صفحہ نہیں ہے — ایک میل، ایک فیڈ۔'
    groups:
      title: 'گروپ قطاریں'
      description: 'ایک قطار جو صرف ایک گروپ پر مشتمل ہوتی ہے وہ ایک قطار نہیں ہے: یہ دو گروپوں کے درمیان ایک لائن ہے، جسے ایک لفظ دیا گیا ہے۔ یہ ٹیبل کی چوڑائی میں پھیلی ہوئی ہے اور اس کے بعد آنے والی چیزوں کا نام دیتی ہے — ایک مینو سیپریٹر کی طرح۔'
    status:
      title: 'اسٹیٹس سیل'
      description: 'ایک حالت ایک دائرہ ہے، کبھی بھی کوئی رنگ جو کسی نے منتخب کیا: سیل ایک قسم کا نام لیتا ہے، یا ایک قسم جس کے ساتھ ایک تعداد اور ایک عنوان ہوتا ہے، اور اسٹیٹس آئیکن کو کھینچتا ہے جیسا کہ باقی سسٹم کھینچتا ہے۔ صفحے میں کچھ بھی اسٹائل کرنے کی ضرورت نہیں ہے۔'
    sticky:
      title: 'چپکنے والا ہیڈر'
      description: 'ایک طویل ٹیبل کو کالم بہ کالم پڑھا جاتا ہے جتنا کہ قطار بہ قطار۔ `sticky` کے ساتھ، ہیڈر نظر میں رہتا ہے جبکہ قطاریں اس کے نیچے سکرول کرتی ہیں؛ ایک صفحہ جس میں اوپر کچھ چپکایا گیا ہے وہ `--table-sticky-top` میں نیچے کتنا آگے ہے یہ بتاتا ہے۔'
    striped:
      title: 'پٹی دار قطاریں، پوائنٹر کے نیچے روشن'
    selection:
      title: 'قطاریں جنہیں نشان زد کیا جا سکتا ہے'
      description: 'ہر قطار کے سرے پر ایک باکس، ان سب کے لیے ایک ہیڈر میں، اور اوپر کے اعمال: یہ نشان زد قطاروں کو اپنے ایڈریس پر بھیجتے ہیں، اور جب کچھ نشان زد نہ ہو تو پہنچ سے باہر رہتے ہیں۔'
    files:
      title: 'فائلیں، کل، ہر قطار پر ایک عمل'
      description: 'نام سے پڑھی جانے والی پاتھیں، اس سے پہلے کے فولڈر اس کے شروع سے کاٹے جاتے ہیں۔ بار یہ بتاتی ہے کہ کتنی قطاریں ہیں، اور ایک عمل جس پر `all` کا نشان ہے وہ بغیر کسی نشان زد کے کام کرتا ہے — یہ ہر قطار کو لیتا ہے، اور جب یہ متوقع ہوتا ہے تو بار کو آگے لے جاتا ہے۔'
    filters:
      title: فلٹرز
      description: 'ٹیبل کے سرے پر فلٹرز کی ایک بار، ہر ایک ایک غیر واضح مینو، بتاتے ہوئے کہ یہ ایک بار جب یہ کرتا ہے تو کس چیز کو محدود کرتا ہے۔ سرور پر یہ صفحے کی درخواست میں رہتے ہیں — ہر آپشن ایک لنک ہے — اور کنٹرولر ان سے قطاروں کو محدود کرتا ہے؛ ویو میں یہ ایک قیمت ہے جو صفحے کو اس کی API کے لیے دی گئی ہے، یا ٹیبل کے ذریعے پہلے سے موجود قطاروں پر لگائی گئی ہے۔ ہر آپشن ایک باکس ہے — ایک کا انتخاب کرنے کے لیے گول — جب یہ ایک ہوتا ہے تو اس کے لہجے کے مطابق رنگین، ایک اسٹیٹس یا ایک زمرہ۔'
    selection_select:
      title: 'منتخب میں اعمال'
      description: 'جب کافی اعمال ہوتے ہیں تو وہی بار: ایک منتخب کیا جاتا ہے، پھر لگایا جاتا ہے۔'
    vue:
      title: 'ویو اینٹیٹی ٹیبل'
    vue_selection:
      title: 'چناؤ کے ساتھ ویو ٹیبل'
      description: 'کلائنٹ پر وہی معاہدہ: نشان زد کردہ چابیاں v-model:selected کے ذریعے واپس آتی ہیں، ہر عمل کو bulk-action کے طور پر جاری کیا جاتا ہے، اور ایک ایڈریس کے ساتھ پوسٹ کیا جاتا ہے جیسا کہ سرور ٹیبل اسے پوسٹ کرتا ہے۔ ان میں کوئی نہیں ہے، تو نیچے کی لائن یہ بتاتی ہے کہ کیا کیا جا سکتا تھا۔ ہر صفحے پر تین قطاریں، بار کے آخر میں کل، اور آرکائیو سب کو کچھ بھی نشان زد کیے بغیر درکار ہے۔'
    vue_compact:
      title: 'کل کے بغیر صفحات'
      description: 'جب API کل واپس نہیں کرتی، تو پیجر پچھلے/اگلے پر واپس آ جاتا ہے۔'
