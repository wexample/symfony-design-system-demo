tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Tablolar
  page_icon: 'ph:bold/table'
  section:
    wide:
      title: 'Odanın genişliğinden daha geniş'
      description: 'Sayfanın sahip olduğu genişlikten daha fazla sütun talep eden bir tablo, ihtiyaç duyduğu genişlikte çizilir ve yanlara kaydırılan bir çerçeve içinde görüntülenir — etrafındaki sayfa hareket etmez. Yapışkan bir tablo bunu bırakır: sayfaya yapışan bir başlık ve kendi kendine kaydırılan bir çerçeve bir arada olamaz.'
    default:
      title: 'Basit tablo'
    actions:
      title: 'İşlemlerle tablo'
    links:
      title: 'Bağlantı ve simge hücreleri'
    loading:
      title: 'Yükleniyor durumu'
    empty:
      title: 'Boş durum'
    alignment:
      title: 'Sütun hizalaması'
    markdown:
      title: "Markdown'dan"
      description: 'Markdown ile yazılmış ve `markdown_ds` üzerinden geçirilmiş bir tablo: sütunlar, hizalamaları ve her hücrenin işaretlemesi belgeden okunur ve tablo burada diğerleri gibi çizilir. `markdown`, sayfa olmayan her şey için düz `<table>` tutar — bir mail, bir akış.'
    groups:
      title: 'Gruplandırılmış satırlar'
      description: 'Sadece bir grubu taşıyan bir satır, bir satır değildir: iki grup arasında verilen bir kelime ile bir çizgidir. Tabloyu kaplar ve ardından gelenleri adlandırır — bir menü ayırıcı gibi aynı okuma.'
    status:
      title: 'Durum hücreleri'
      description: 'Bir durum bir dairedir, asla birinin seçtiği bir renk değildir: hücre bir tür adı alır, ya da bir sayı ve başlık ile bir tür alır ve durumu, sistemin geri kalanının çizdiği durum simgesini çizer. Sayfada stil verilecek bir şey yok.'
    sticky:
      title: 'Yapışkan başlık'
      description: 'Uzun bir tablo, hem sütun hem de satır olarak okunur. `sticky` ile başlık görünümde kalırken, satırlar altında kayar; kendi üstünde bir şey sabitlenmiş bir sayfa, ne kadar aşağıda olduğunu `--table-sticky-top` ile belirtir.'
    striped:
      title: 'Şeritli satırlar, imleç altında aydınlatılır'
    selection:
      title: 'Seçilebilecek satırlar'
      description: 'Her satırın başında bir kutu, hepsi için bir başlıkta ve yukarıda işlemler: işaretlenmiş satırları kendi adreslerine gönderir ve hiçbiri işaretlenmediğinde erişilemez durumda kalır.'
    files:
      title: 'Dosyalar, toplam, her satırda bir işlem'
      description: 'Adlarıyla okunan yollar, önündeki klasörler başlangıcından kesilir. Çubuk, kaç satır olduğunu gösterir ve `tümü` ile işaretlenmemişken çalışan bir işlem — her satırı alır ve beklenildiğinde çubuğu yönlendirir.'
    filters:
      title: Filtreler
      description: "Tablonun başında bir filtre çubuğu, her biri neye daraldığını söyleyen bir menü. Sunucuda sayfanın sorgusunda yaşarlar — her seçenek bir bağlantıdır — ve denetleyici, ondan satırları daraltır; vue'da ise sayfaya api'si için verilen bir değer veya tablonun zaten sahip olduğu satırlara uygulanan bir değerdir. Her seçenek bir kutudur — bir seçim için yuvarlak — tonuna sahip olduğunda, bir durum veya kategori ile renklendirilir."
    selection_select:
      title: 'Seçimdeki işlemler'
      description: 'Yeterince işlem olduğunda aynı çubuk: biri seçilir, ardından uygulanır.'
    vue:
      title: 'Vue varlık tablosu'
    vue_selection:
      title: 'Seçim ile Vue tablosu'
      description: 'İstemcide aynı sözleşme: işaretlenmiş anahtarlar v-model:selected ile geri gelir, her işlem toplu işlem olarak iletilir ve bir adres ile olanı, sunucu tablosunun gönderdiği gibi gönderilir. Bunların hiçbiri yoktur, bu yüzden aşağıdaki satır ne yapılacağını söyler. Sayfada üç satır, çubuğun sonunda toplam ve Arşivle tümü hiçbir işaretleme gerektirmez.'
    vue_compact:
      title: 'Toplamsız sayfalama'
      description: 'API toplam döndürmediğinde, sayfa dönmeye önceki/sonraya geri döner.'
    vue_dates:
      title: 'Vue tarih biçimlendiricileri'
  column:
