zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 表格
  page_icon: 'ph:bold/table'
  section:
    wide:
      title: 比房间更宽
      description: 一个列数超过页面的表格会绘制成所需的宽度，以一个水平滚动的框架呈现——周围的页面不会移动。一个粘性表格放弃了这一点：一个固定在页面上的头部和一个独立滚动的框架不能同时存在。
    default:
      title: 简单表格
    actions:
      title: 带操作的表格
    links:
      title: 链接和图标单元格
    loading:
      title: 加载状态
    empty:
      title: 空状态
    alignment:
      title: 列对齐
    markdown:
      title: 来自markdown
      description: 通过`markdown_ds`传递的markdown编写的表格：列、对齐方式和每个单元格的标记从文档中读取，表格在这里像其他任何表格一样绘制。`markdown`保留了普通的`<table>`，用于不是页面的内容——邮件、动态消息。
    groups:
      title: 分组行
      description: 仅携带一个组的行不是一行：它是两个组之间的线，给定一个词。它跨越整个表格，并命名后续内容——与菜单分隔符的阅读相同。
    status:
      title: 状态单元格
      description: 状态是一个圆圈，从来不是某人选择的颜色：单元格采用类型名称，或带有计数和标题的类型，并绘制系统其余部分绘制的状态图标。页面中没有样式可设置。
    sticky:
      title: 粘性头部
      description: 长表格按列和行读取。使用`sticky`，头部在视野中保持，而行在其下滚动；带有其自身固定在顶部的页面说明在`--table-sticky-top`中向下滚动了多少。
    striped:
      title: 条纹行，指针下高亮
    selection:
      title: 可选行
      description: 每行头部的一个框，所有行的头部一个框，以及上方的操作：它们将选中的行发送到其自己的地址，并在没有选中时保持不可触及。
    files:
      title: 文件、总数、每行的操作
      description: 按名称读取的路径，前面的文件夹从开头剪切。条形图显示行数，标记为`all`的操作在没有选中时有效——它取每一行，并在预期时引导条形图。
    filters:
      title: 过滤器
      description: 在表格顶部的过滤器条，每个都是一个隐蔽的菜单，说明一旦过滤所缩小的内容。在服务器上，它们存在于页面的查询中——每个选项都是一个链接——控制器从中缩小行；在vue中，它们是传递给页面的值供其api使用，或由表格应用于它已经拥有的行。每个选项是一个框——选择一个时为圆形——当它有色调、状态或类别时为其色彩。
    selection_select:
      title: 选择中的操作
      description: 当有足够的操作挤满它时的同一条：选择一个，然后应用。
    vue:
      title: Vue实体表
    vue_selection:
      title: 带选择的Vue表
      description: '客户端上的相同合同：选中的键通过v-model:selected返回，每个操作作为bulk-action发出，带地址的作为服务器表发布。这些没有，因此下面的行说明了将会做的事情。每页三行，条形图末尾是总数，归档所有不需要选中。'
    vue_compact:
      title: 无总数的分页
      description: 当API未返回总数时，分页器回退到上/下。
    vue_dates:
      title: Vue日期格式化器
  column:
    wide: 列
    default:
      name: 名称
      date: 日期
      seen: 最后查看
    actions:
      name: 来源
      date: 更新时间
      operations: 操作
    links:
      source: 来源
      state: 状态
    status:
      name: 管道
      build: 构建
      tests: 测试
      deploy: 部署
    alignment:
      left: 名称（左）
      center: 状态（中）
      right: 数量（右）
  row:
    wide: 足够长的值
    one:
      title: 项目阿尔法
      meta: '2026-01-10'
    two:
      title: 项目贝塔
      meta: '2026-02-18'
    three:
      title: 项目伽马
      meta: '2026-03-25'
    action:
      one:
        title: 来源阿尔法
        meta: '2026-01-12'
      two:
        title: 来源贝塔
        meta: '2026-02-20'
      loading:
        label: 加载行
      empty:
        label: 没有可用数据。
  group:
    first: 第一组
    second: 第二组
  status:
    flaky: 三个测试不稳定
  bulk:
    archive: 归档
    export: 导出
    delete: 删除
  files:
    column:
      path: 文件
    fix_selected: 修复选中项
    fix_all: 修复所有
  filters:
    owner: 所有者
    state: 状态
    open: 打开
    closed: 关闭
    column:
      name: 名称
