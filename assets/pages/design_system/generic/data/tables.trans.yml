ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Таблицы
  page_icon: 'ph:bold/table'
  section:
    pagination:
      title: 'Пагинация, созданная сервером'
      description: '`pagination(page, pages_count)` создает страницы списка в виде ссылок: каждая сохраняет маршрут и запрос страницы, на которой находится — поиск, сортировка — и изменяет только `page`, считая с 1. Показанные номера — это номера vue пейджера: первый, последний, текущий и его соседи. `compact` сохраняет предыдущий и следующий вокруг номера страницы; `route` и `params` переходят по другому адресу.'
    wide:
      title: 'Шире, чем комната'
      description: 'Таблица, у которой столбцы требуют больше, чем страница может вместить, отображается на необходимой ширине и выходит за пределы зоны, страницы — никогда с собственным скроллом. Если требуется (`scroll: true`), как здесь, она прокручивается вбок в своем фрейме, а страница вокруг нее остается на месте: для таблицы среди других элементов в контейнере, который не прокручивается. Липкая таблица от этого отказывается: заголовок, который прилипает к странице, и фрейм, прокручивающийся самостоятельно, не могут быть одновременно.'
    default:
      title: 'Простая таблица'
    actions:
      title: 'Таблица с действиями'
    links:
      title: 'Ячейки со ссылками и значками'
    loading:
      title: 'Состояние загрузки'
    empty:
      title: 'Пустое состояние'
    alignment:
      title: 'Выравнивание колонок'
    markdown:
      title: 'Из Markdown'
      description: 'Таблица, написанная в Markdown и обработанная через `markdown_ds`: колонки, их выравнивание и разметка каждой ячейки считываются из документа, и таблица отображается здесь как любая другая. `markdown` сохраняет обычный `<table>`, для всего, что не является страницей — письмом, лентой.'
    groups:
      title: 'Группировать строки'
      description: 'Строка, содержащая только группу, не является строкой: это линия между двумя их сериями, данная словом. Она охватывает таблицу и называет то, что следует за ней — то же самое, что и разделитель в меню.'
    status:
      title: 'Ячейки состояния'
      description: 'Состояние — это круг, никогда не цвет, который кто-то выбрал: ячейка принимает название типа или тип с количеством и заголовком и рисует значок состояния, который рисует остальная часть системы. Ничего не нужно стилизовать на странице.'
    sticky:
      title: 'Липкий заголовок'
      description: 'Длинную таблицу читают по колонкам также, как и по строкам. С `sticky` заголовок остается на виду, пока строки прокручиваются под ним; страница с чем-то своим, прикрепленным вверху, показывает, насколько далеко вниз в `--table-sticky-top`.'
    zone:
      title: 'Таблица в своей зоне'
      description: 'Зоне `zone--table` отводится место под всю таблицу: что ведет ее сверху, ее страницы внизу, из того, что прокручивается, и между ними основание таблицы, доходящее до дна зоны, даже для трех строк. В нее помещается любая таблица, созданная сервером или vue. С `natural`, как та, что слева, таблица сохраняет ширину своих столбцов, не растягиваясь и не сжимаясь.'
    striped:
      title: 'Полосатые строки, подсвеченные под указателем'
    selection:
      title: 'Строки, которые можно отметить'
      description: 'Коробка в заголовке каждой строки, одна в заголовке для всех, и действия выше: они отправляют отмеченные строки по своему адресу и остаются вне досягаемости, пока ничего не отмечено.'
    files:
      title: 'Файлы, всего, действие для каждой строки'
      description: 'Пути, читаемые по их имени, папки перед ним отрезаются от начала. Полоса заканчивается на том, сколько строк есть, и действие, помеченное `all`, работает без отмеченных — оно берет каждую строку и ведет полосу, когда это ожидается.'
    filters:
      title: Фильтры
      description: 'Полоса фильтров в верхней части таблицы, по одному неприметному меню на каждую, указывающая, к чему она сужает, как только это делает. На сервере они живут в запросе страницы — каждый вариант является ссылкой — и контроллер сужает строки из него; в vue они являются значением, переданным странице для ее api, или применяются таблицей к уже имеющимся строкам. Каждый вариант — это коробка — круглая для выбора одного — окрашенная по своему оттенку, если он есть, статусу или категории.'
    sorting:
      title: Сортировка
      description: 'Заголовок, который сортирует, является ссылкой на сервер и кнопкой в vue: по возрастанию, по убыванию, затем возвращается к порядку, который была объявлен на странице, с которым открывается список и который его стрелка показывает с самого начала. Пустые даты идут последними в обоих направлениях, а имена сравниваются так, как их упорядочивает язык. Здесь таблица сортирует строки, которые были даны ей самой; контроллер, пейджингующий свой список, читает тот же запрос.'
    figures:
      title: 'Коды, цифры и итоги'
      description: "`cell: 'code'` устанавливает идентификатор в моноширинном шрифте; `cell: 'number'`, или `unit`, записывает цифру в локали страницы. `negative: true` рисует цифру ниже нуля в ошибочном тоне, ее знак минус говорит об этом тоже. `totals` — это строка, которую страница передает, отображаемая под другими — таблица ничего не складывает, удерживая одну страницу или отфильтрованный список. Создано сервером, затем vue."
    sorting_vue:
      title: 'Сортировка в браузере, из twig'
      description: '`vue: true` передает те же столбцы и строки двойнику vue: он сортирует и ищет весь список в браузере, без загрузки страницы. Для списка, который страница удерживает целиком — короткого или того, который не обслуживает api.'
    selection_select:
      title: 'Действия в выборе'
      description: 'Та же полоса, когда достаточно действий, чтобы она переполнилась: одно выбирается, затем применяется.'
    vue:
      title: 'Таблица сущностей Vue'
    vue_selection:
      title: 'Таблица Vue с выбором'
      description: 'Тот же контракт на клиенте: отмеченные ключи возвращаются через v-model:selected, каждое действие выдается как bulk-action, а одно с адресом отправляется по мере того, как серверная таблица его отправляет. У них ничего нет, поэтому строка ниже говорит о том, что было бы сделано. Три строки на странице, всего в конце полосы и Архивировать все, не требуя ничего отмеченного.'
    vue_compact:
      title: 'Пагинация без общего количества'
      description: 'Когда API не возвращает общего количества, пейджер откатывается к предыдущему/следующему.'
    vue_dates:
      title: 'Форматировщики дат Vue'
  column:
    wide: Колонка
    default:
      name: Имя
      date: Дата
      seen: 'Последний раз видели'
    actions:
      name: Источник
      date: Обновлено
