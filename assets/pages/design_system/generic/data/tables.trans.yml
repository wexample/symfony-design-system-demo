zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 表格
  page_icon: 'ph:bold/table'
  section:
    pagination:
      title: 分页，由服务器生成
      description: '`pagination(page, pages_count)` 将列表的页面绘制为链接：每个链接保留其所在页面的路径和查询 — 搜索、排序 — 仅更改 `page`，从 1 开始计数。显示的数字是 vue 分页器的：第一个、最后一个、当前页及其邻近页。`compact` 保留前后页围绕页码；`route` 和 `params` 通过另一个地址分页。'
    wide:
      title: 比房间更宽
      description: '一个列数超过页面所容纳的表格以所需的宽度绘制，并溢出到周围的滚动区域 — 区域、页面 —，永远不会有自己的滚动条。请求了（`scroll: true`），像这里一样，它在自己的框架中横向滚动，而周围的页面保持不动：对于一个不滚动的容器中的表格等。一个粘性表格放弃了这一点：一个粘在页面上的头部和一个独立滚动的框架不能同时存在。'
    default:
      title: 简单表格
    actions:
      title: 带操作的表格
    links:
      title: 链接和图标单元格
    loading:
      title: 加载状态
    empty:
      title: 空状态
    alignment:
      title: 列对齐
    markdown:
      title: 来自markdown
      description: 通过`markdown_ds`传递的markdown编写的表格：列、对齐方式和每个单元格的标记从文档中读取，表格在这里像其他任何表格一样绘制。`markdown`保留了普通的`<table>`，用于不是页面的内容——邮件、动态消息。
    groups:
      title: 分组行
      description: 仅携带一个组的行不是一行：它是两个组之间的线，给定一个词。它跨越整个表格，并命名后续内容——与菜单分隔符的阅读相同。
    status:
      title: 状态单元格
      description: 状态是一个圆圈，从来不是某人选择的颜色：单元格采用类型名称，或带有计数和标题的类型，并绘制系统其余部分绘制的状态图标。页面中没有样式可设置。
    sticky:
      title: 粘性头部
      description: 长表格按列和行读取。使用`sticky`，头部在视野中保持，而行在其下滚动；带有其自身固定在顶部的页面说明在`--table-sticky-top`中向下滚动了多少。
    zone:
      title: 一个独立区域中的表格
      description: '一个 `zone--table` 区域完全赋予给表格：它上方的驱动内容、底部的页面、滚动内容之间的表格底部，甚至对于三行的情况。任何表格都可以放入其中，由服务器或 vue 编写。使用 `natural`，如左侧的表格，表格保持其列的宽度，既不被拉伸也不被压缩。'
    striped:
      title: 条纹行，指针下高亮
    selection:
      title: 可选行
      description: 每行头部的一个框，所有行的头部一个框，以及上方的操作：它们将选中的行发送到其自己的地址，并在没有选中时保持不可触及。
    files:
      title: 文件、总数、每行的操作
      description: 按名称读取的路径，前面的文件夹从开头剪切。条形图显示行数，标记为`all`的操作在没有选中时有效——它取每一行，并在预期时引导条形图。
    filters:
      title: 过滤器
      description: 在表格顶部的过滤器条，每个都是一个隐蔽的菜单，说明一旦过滤所缩小的内容。在服务器上，它们存在于页面的查询中——每个选项都是一个链接——控制器从中缩小行；在vue中，它们是传递给页面的值供其api使用，或由表格应用于它已经拥有的行。每个选项是一个框——选择一个时为圆形——当它有色调、状态或类别时为其色彩。
    sorting:
      title: 排序
      description: '一个排序的头部是服务器上的链接和 vue 中的按钮：升序、降序，然后回到页面声明的顺序，列表从一开始就显示其箭头。空日期在两种方式中都排在最后，名称则按照语言的排序方式进行比较。这里表格对其自身给出的行进行排序；一个控制器翻页其列表时读取相同的查询。'
    figures:
      title: 代码、数字和总计
      description: "`cell: 'code'` 在单一字体中设置标识符；`cell: 'number'`，或 `unit`，在页面的区域写出数字。`negative: true` 将小于零的数字以错误语气绘制，其负号也表明这一点。`totals` 是页面交出的行，绘制在其他行之下 — 表格不进行任何加总，保持一个页面或过滤后的列表。由服务器绘制，然后由 vue 处理。"
    sorting_vue:
      title: '浏览器中的排序，来自 twig'
      description: '`vue: true` 将相同的列和行传递给 vue 兄弟：它在浏览器中对整个列表进行排序和搜索，无需页面加载。对于页面完整持有的列表 — 短列表，或没有 api 提供的列表。'
    selection_select:
      title: 选择中的操作
      description: 当有足够的操作挤满它时的同一条：选择一个，然后应用。
    vue:
      title: Vue实体表
    vue_selection:
      title: 带选择的Vue表
      description: '客户端上的相同合同：选中的键通过v-model:selected返回，每个操作作为bulk-action发出，带地址的作为服务器表发布。这些没有，因此下面的行说明了将会做的事情。每页三行，条形图末尾是总数，归档所有不需要选中。'
    vue_compact:
      title: 无总数的分页
      description: 当API未返回总数时，分页器回退到上/下。
    vue_dates:
      title: Vue日期格式化器
