en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Tables
  page_icon: ph:bold/table

  section:
    pagination:
      title: Pagination, drawn by the server
      description: "`pagination(page, pages_count)` draws the pages of a list as links: each keeps the route and the query of the page it is on — a search, a sort — and changes only `page`, counted from 1. The numbers shown are the vue pager's: the first, the last, the current one and its neighbours. `compact` keeps previous and next around the page number; `route` and `params` page through another address."
    wide:
      title: Wider than the room
      description: "A table whose columns ask for more than the page has is drawn at the width it needs and overflows to whatever scrolls around it — the zone, the page —, never with a scrollbar of its own. Asked for (`scroll: true`), as here, it scrolls sideways in its own frame and the page around it stays put: for a table among other things in a container that does not scroll. A sticky table gives this up: a header sticking to the page and a frame scrolling on its own cannot be had together."
    default:
      title: Simple table
    actions:
      title: Table with actions
    links:
      title: Link and icon cells
    loading:
      title: Loading state
    empty:
      title: Empty state
    alignment:
      title: Column alignment
    markdown:
      title: From markdown
      description: "A table written in markdown and passed through `markdown_ds`: the columns, their alignment and the markup of each cell are read from the document, and the table is drawn here like any other. `markdown` keeps the plain `<table>`, for whatever is not a page — a mail, a feed."
    groups:
      title: Group rows
      description: "A row carrying only a group is not a row: it is the line between two runs of them, given a word. It spans the table and names what follows — the same reading as a menu separator."
    status:
      title: Status cells
      description: "A state is a circle, never a colour someone picked: the cell takes a type name, or a type with a count and a title, and draws the status icon the rest of the system draws. Nothing to style in the page."
    sticky:
      title: Sticky header
      description: "A long table is read column by column as much as row by row. With `sticky`, the header stays in view while the rows scroll under it; a page with something of its own pinned at the top says how far down in `--table-sticky-top`."
    zone:
      title: A table in a zone of its own
      description: "A `zone--table` zone is given to the table whole: what drives it at the top, its pages at the foot, out of what scrolls, and between them the table's ground down to the bottom of the zone, even for three rows. Any table goes in it, written by the server or by a vue. With `natural`, as the one on the left, the table keeps the width of its columns, neither stretched nor squeezed."
    striped:
      title: Striped rows, lit under the pointer
    selection:
      title: Rows that can be ticked
      description: "A box at the head of each row, one in the header for them all, and the actions above: they post the ticked rows to their own address, and stay out of reach while nothing is ticked."
    files:
      title: Files, a total, an action on every row
      description: "Paths read by their name, the folders before it cut from their start. The bar ends on how many rows there are, and an action marked `all` works with nothing ticked — it takes every row, and leads the bar when it is the one expected."
    filters:
      title: Filters
      description: "A bar of filters at the head of the table, one discreet menu each, saying what it narrows to once it does. On the server they live in the page's query — each option is a link — and the controller narrows the rows from it; in vue they are a value handed to the page for its api, or applied by the table to the rows it already has. Each option is a box — round for a choice of one — coloured by its tone when it has one, a status or a category."
    sorting:
      title: Sorting
      description: "A header that sorts is a link on the server and a button in vue: ascending, descending, then back to the order the page declared, which the list opens on and which its arrow shows from the start. Empty dates go last both ways, and names compare the way the language orders them. Here the table sorts the rows it was given itself; a controller paging its list reads the same query instead."
    figures:
      title: Codes, figures and totals
      description: "`cell: 'code'` sets an identifier in the mono face; `cell: 'number'`, or a `unit`, writes a figure in the page's locale. `negative: true` draws a figure below zero in the error tone, its minus sign saying it too. `totals` is a row the page hands over, drawn under the others — the table adds nothing up, holding one page or a filtered list. Drawn by the server, then by vue."
    sorting_vue:
      title: Sorting in the browser, from twig
      description: "`vue: true` hands the same columns and rows to the vue twin: it sorts and searches the whole list in the browser, with no page load. For a list the page holds whole — a short one, or one no api serves."
    selection_select:
      title: Actions in a select
      description: "The same bar when there are enough actions to crowd it: one is chosen, then applied."
    vue:
      title: Vue entity table
    vue_selection:
      title: Vue table with selection
      description: "The same contract on the client: the ticked keys come back through v-model:selected, each action is emitted as bulk-action, and one with an address is posted as the server table posts it. These have none, so the line below says what would have been done. Three rows a page, the total at the end of the bar, and Archive all needing nothing ticked."
    vue_compact:
      title: Pagination without a total
      description: When the API does not return a total, the pager falls back to previous/next.
    vue_dates:
      title: Vue date formatters

  column:
    wide: Column
    default:
      name: Name
      date: Date
      seen: Last seen
    actions:
      name: Source
      date: Updated at
      operations: Actions
    links:
      source: Source
      state: State
    status:
      name: Pipeline
      build: Build
      tests: Tests
      deploy: Deploy
    alignment:
      left: Name (left)
      center: Status (center)
      right: Amount (right)

  row:
    wide: A value long enough
    one:
      title: Project Alpha
      meta: "2026-01-10"
    two:
      title: Project Beta
      meta: "2026-02-18"
    three:
      title: Project Gamma
      meta: "2026-03-25"
    action:
      one:
        title: Source Alpha
        meta: "2026-01-12"
      two:
        title: Source Beta
        meta: "2026-02-20"
      loading:
        label: Loading rows
      empty:
        label: No data available.

  group:
    first: First group
    second: Second group

  status:
    flaky: Three tests are flaky

  bulk:
    archive: Archive
    export: Export
    delete: Delete

  files:
    column:
      path: File
    fix_selected: Fix selected
    fix_all: Fix all

  filters:
    owner: Owner
    state: State
    open: Open
    closed: Closed
    column:
      name: Name
  action:
    open: Open
  sorting:
    name: Name
    city: City
    measured: Last measurement
    actions: Actions
  figures:
    code: Code
    item: Item
    net: Net supply
    area: Area
    total: Total

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: الجداول
  page_icon: 'ph:bold/table'
  section:
    pagination:
      title: 'التصفح، المرسوم بواسطة الخادم'
      description: '`pagination(page, pages_count)` يرسم صفحات قائمة كرابط: كل منها يحتفظ بالطريق والاستعلام عن الصفحة التي هو عليها — بحث، ترتيب — ويتغير فقط `page`، محسوبًا من 1. الأرقام المعروضة هي أرقام عداد vue: الأول، الأخير، الحالي وجيرانه. `compact` يحتفظ بالسابق واللاحق حول رقم الصفحة؛ `route` و `params` يتنقلان عبر عنوان آخر.'
    wide:
      title: 'أوسع من الغرفة'
      description: 'يتم رسم جدول الأعمدة الذي يطلب أكثر مما تحتويه الصفحة بالعرض الذي يحتاجه ويتجاوز ما يدور حوله — المنطقة، الصفحة —، ولا يظهر له شريط تمرير خاص. عند الطلب (`scroll: true`)، كما هو هنا، يتم التمرير أفقيًا في إطاره الخاص وتبقى الصفحة من حوله ثابتة: لجدول بين أشياء أخرى في حاوية لا تتمرر. جدول ثابت يتخلى عن هذا: لا يمكن أن يكون هناك رأس ثابت للصفحة وإطار يتنقل بمفرده معًا.'
    default:
      title: 'جدول بسيط'
    actions:
      title: 'جدول مع إجراءات'
    links:
      title: 'خلايا الروابط والأيقونات'
    loading:
      title: 'حالة التحميل'
    empty:
      title: 'حالة فارغة'
    alignment:
      title: 'محاذاة الأعمدة'
    markdown:
      title: 'من Markdown'
      description: 'جدول مكتوب بلغة Markdown وممر عبر `markdown_ds`: تُقرأ الأعمدة، محاذاتها وتنسيق كل خلية من الوثيقة، ويتم رسم الجدول هنا مثل أي جدول آخر. `markdown` يحتفظ بالصيغة العادية `<table>`، لأي شيء ليس صفحة — بريد، تغذية.'
    groups:
      title: 'تجميع الصفوف'
      description: 'صف يحمل مجموعة فقط ليس صفاً: إنه الخط بين اثنين من هذه الصفوف، مُعطى كلمة. يمتد عبر الجدول ويسمّي ما يتبعه — نفس قراءة فاصل القائمة.'
    status:
      title: 'خلايا الحالة'
      description: 'الحالة هي دائرة، وليست لوناً اختاره أحد: تأخذ الخلية اسم نوع، أو نوعاً مع عدد وعنوان، وتظهر أيقونة الحالة مثلما تظهرها بقية النظام. لا شيء لتصميمه في الصفحة.'
    sticky:
      title: 'رأس ثابت'
      description: 'يتم قراءة الجدول الطويل عمودًا بعمود كما هو الحال صفًا بصف. مع `sticky`، يبقى الرأس في العرض بينما تتصفح الصفوف تحته؛ الصفحة التي تحتوي على شيء خاص بها مثبت في الأعلى تقول مدى العمق في `--table-sticky-top`.'
    zone:
      title: 'جدول في منطقة خاصة به'
      description: 'منطقة `zone--table` تُعطى للجدول بالكامل: ما يدفعه من الأعلى، وصفحاته في الأسفل، بعيدًا عن ما يتمرر، وبينهما قاع الجدول حتى أسفل المنطقة، حتى لثلاثة صفوف. يمكن أن يدخل أي جدول فيها، مكتوب بواسطة الخادم أو بواسطة vue. مع `natural`، مثل الذي على اليسار، يحتفظ الجدول بعرض أعمدته، لا يتمدد ولا ينضغط.'
    striped:
      title: 'صفوف مخططة، مضاءة تحت المؤشر'
    selection:
      title: 'صفوف يمكن تحديدها'
      description: 'مربع في رأس كل صف، واحد في الرأس من أجلهم جميعًا، والإجراءات أعلاه: يقومون بإرسال الصفوف المحددة إلى عنوانهم الخاص، ويبقون خارج النطاق بينما لا يوجد شيء محدد.'
    files:
      title: 'ملفات، إجمالي، إجراء على كل صف'
      description: 'مسارات تُقرأ حسب اسمها، المجلدات قبله مقطوعة من بدايتها. تنتهي الشريط بعدد الصفوف الموجودة، وإجراء مُعَلَّم ب`all` يعمل مع عدم تحديد أي شيء — يأخذ كل صف، ويقود الشريط عندما يكون هو المتوقع.'
    filters:
      title: مرشحات
      description: 'شريط من المرشحات في رأس الجدول، قائمة خفية واحدة لكل منها، تقول ما تضيق عليه بمجرد أن تفعل ذلك. على الخادم تعيش في استعلام الصفحة — كل خيار هو رابط — ويسيطر المتحكم على تضييق الصفوف منها؛ في vue هم قيمة تُعطى للصفحة من أجل واجهتها، أو تُطبق بواسطة الجدول على الصفوف التي لديها بالفعل. كل خيار هو مربع — دائري لاختيار واحد — ملون بنغمة عندما تكون له، حالة أو فئة.'
    sorting:
      title: الفرز
      description: 'رأس يقوم بالفرز هو رابط على الخادم وزر في vue: تصاعدي، تنازلي، ثم العودة إلى الترتيب الذي أعلنت عنه الصفحة، والذي تفتحه القائمة والذي يظهر سهمها من البداية. التواريخ الفارغة تكون في النهاية من كلا الاتجاهين، والأسماء تقارن بالطريقة التي ترتبها اللغة. هنا يقوم الجدول بفرز الصفوف التي تم إعطاؤها له؛ يتحكم جهاز التحكم في قائمة الصفحات بنفس الاستعلام بدلاً من ذلك.'
    figures:
      title: 'الرموز، الأرقام والإجماليات'
      description: "`cell: 'code'` يحدد معرفًا في الوجه الأحادي؛ `cell: 'number'`، أو `unit`، يكتب رقمًا بلغة الصفحة. `negative: true` يرسم رقمًا تحت الصفر بنغمة خطأ، وعلامة السالب تشير إلى ذلك أيضًا. `totals` هو صف تسلمه الصفحة، مرسوم تحت الآخرين — لا يضيف الجدول شيئًا، محتفظًا بصفحة واحدة أو قائمة مصفاة. مرسوم بواسطة الخادم، ثم بواسطة vue."
    sorting_vue:
      title: 'الفرز في المتصفح، من twig'
      description: '`vue: true` يسلم نفس الأعمدة والصفوف إلى التوأم vue: يقوم بفرز والبحث في القائمة الكاملة في المتصفح، دون تحميل صفحة. لقائمة تحتفظ بها الصفحة بالكامل — واحدة قصيرة، أو واحدة لا تقدمها واجهة برمجة التطبيقات.'
    selection_select:
      title: 'إجراءات في اختيار'
      description: 'نفس الشريط عندما تكون هناك إجراءات كافية لزيادة الزحام: يتم اختيار واحدة، ثم تطبيقها.'
    vue:
      title: 'جدول كيان Vue'
    vue_selection:
      title: 'جدول Vue مع اختيار'
      description: 'نفس العقد على العميل: المفاتيح المحددة تعود عبر v-model:selected، كل إجراء يتم إصداره كإجراء جماعي، وواحد مع عنوان يُنشر مثلما ينشره جدول الخادم. هؤلاء ليس لديهم أي، لذا تقول السطر أدناه ما كان سيتم فعله. ثلاثة صفوف في الصفحة، الإجمالي في نهاية الشريط، وأرشفة جميعها دون حاجة لتحديد أي شيء.'
    vue_compact:
      title: 'التصفح بدون إجمالي'
      description: 'عندما لا تُرجع واجهة برمجة التطبيقات إجمالي، يعود شريط الصفحات إلى السابق/التالي.'
    vue_dates:
      title: 'منسقات تاريخ Vue'
  column:
    wide: عمود
    default:
      name: الاسم
      date: التاريخ
      seen: 'آخر ظهور'
    actions:
      name: المصدر
      date: 'تحديث في'
      operations: إجراءات
    links:
      source: المصدر
      state: الحالة
    status:
      name: 'خط الأنابيب'
      build: البناء
      tests: الاختبارات
      deploy: النشر
    alignment:
      left: 'الاسم (يسار)'
      center: 'الحالة (وسط)'
      right: 'المبلغ (يمين)'
  row:
    wide: 'قيمة طويلة بما فيه الكفاية'
    one:
      title: 'المشروع ألفا'
      meta: '2026-01-10'
    two:
      title: 'المشروع بيتا'
      meta: '2026-02-18'
    three:
      title: 'المشروع غاما'
      meta: '2026-03-25'
    action:
      one:
        title: 'المصدر ألفا'
        meta: '2026-01-12'
      two:
        title: 'المصدر بيتا'
        meta: '2026-02-20'
      loading:
        label: 'تحميل الصفوف'
      empty:
        label: 'لا توجد بيانات متاحة.'
  group:
    first: 'المجموعة الأولى'
    second: 'المجموعة الثانية'
  status:
    flaky: 'ثلاث اختبارات غير مستقرة'
  bulk:
    archive: أرشفة
    export: تصدير
    delete: حذف
  files:
    column:
      path: الملف
    fix_selected: 'إصلاح المحدد'
    fix_all: 'إصلاح الكل'
  filters:
    owner: المالك
    state: الحالة
    open: مفتوح
    closed: مغلق
    column:
      name: الاسم
  action:
    open: فتح
  sorting:
    name: الاسم
    city: المدينة
    measured: 'آخر قياس'
    actions: الإجراءات
  figures:
    code: الرمز
    item: العنصر
    net: 'الإمداد الصافي'
    area: المنطقة
    total: الإجمالي

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: টেবিল
  page_icon: 'ph:bold/table'
  section:
    pagination:
      title: 'পেজিনেশন, সার্ভার দ্বারা তৈরি'
      description: '`pagination(page, pages_count)` একটি তালিকার পৃষ্ঠাগুলিকে লিঙ্ক হিসাবে আঁকে: প্রতিটি তার পৃষ্ঠায় থাকা রুট এবং কোয়েরি রাখে — একটি অনুসন্ধান, একটি সাজানো — এবং শুধুমাত্র `page` পরিবর্তন করে, যা 1 থেকে গোনা হয়। প্রদর্শিত সংখ্যাগুলি vue পেজারের: প্রথম, শেষ, বর্তমান এবং এর প্রতিবেশী। `compact` পৃষ্ঠা সংখ্যার চারপাশে পূর্ববর্তী এবং পরবর্তী রাখে; `route` এবং `params` অন্য একটি ঠিকানার মাধ্যমে পেজ করে।'
    wide:
      title: 'কামরার চেয়ে বড়'
      description: 'একটি টেবিল যার কলামগুলি পৃষ্ঠার চেয়ে বেশি স্থান চায়, এটি প্রয়োজনীয় প্রস্থে আঁকা হয় এবং এর চারপাশে যা কিছু স্ক্রোল করে — অঞ্চল, পৃষ্ঠা — তাতে বিস্তৃত হয়, কখনই নিজস্ব স্ক্রোলবার ছাড়া। অনুরোধ করা হলে (`scroll: true`), যেমন এখানে, এটি তার নিজস্ব ফ্রেমে পাশের দিকে স্ক্রোল করে এবং এর চারপাশের পৃষ্ঠা স্থির থাকে: এমন একটি কন্টেইনারের মধ্যে অন্য জিনিসগুলোর মধ্যে একটি টেবিল যা স্ক্রোল করে না। একটি স্টিকি টেবিল এটি ত্যাগ করে: একটি হেডার পৃষ্ঠায় আটকে থাকা এবং একটি ফ্রেম স্বতন্ত্রভাবে স্ক্রোল করা একসাথে থাকতে পারে না।'
    default:
      title: 'সাধারণ টেবিল'
    actions:
      title: 'ক্রিয়াকলাপ সহ টেবিল'
    links:
      title: 'লিংক এবং আইকন সেল'
    loading:
      title: 'লোডিং অবস্থায়'
    empty:
      title: 'খালি অবস্থায়'
    alignment:
      title: 'কলামের সজ্জা'
    markdown:
      title: 'মার্কডাউন থেকে'
      description: 'একটি টেবিল যা মার্কডাউন এ লেখা হয়েছে এবং `markdown_ds` এর মাধ্যমে পাঠানো হয়েছে: কলামগুলো, তাদের সজ্জা এবং প্রতিটি সেলের মার্কআপ ডকুমেন্ট থেকে পড়া হয়, এবং টেবিলটি এখানে অন্য যেকোনোটির মতো অঙ্কিত হয়। `markdown` সাধারণ `<table>` রাখে, যা পৃষ্ঠা নয় — একটি মেইল, একটি ফিড।'
    groups:
      title: 'গ্রুপ সারি'
      description: 'একটি সারি যা শুধুমাত্র একটি গ্রুপ বহন করে, সেটি একটি সারি নয়: এটি তাদের দুটি দৌড়ের মধ্যে একটি লাইন, একটি শব্দ দেওয়া হয়েছে। এটি টেবিলটি ছাপিয়ে যায় এবং যা পরবর্তী তা নামকরণ করে — মেনু বিভাজকের মতো একই পড়া।'
    status:
      title: 'স্ট্যাটাস সেল'
      description: 'একটি অবস্থান একটি বৃত্ত, কখনোই একটি রঙ যা কেউ বেছে নিয়েছে: সেলটি একটি টাইপ নাম নেয়, অথবা একটি টাইপ যার একটি গণনা এবং একটি শিরোনাম রয়েছে, এবং স্ট্যাটাস আইকনটি আঁকে যা বাকি সিস্টেম আঁকে। পৃষ্ঠায় স্টাইল করার কিছু নেই।'
    sticky:
      title: 'স্টিকি শিরোনাম'
      description: 'একটি দীর্ঘ টেবিল কলাম দ্বারা কলাম হিসাবে পড়া হয় যতটা সারি দ্বারা পড়া হয়। `স্টিকি` এর সাথে, শিরোনাম দৃশ্যমান থাকে যখন সারিগুলি এর নিচে স্ক্রোল করে; একটি পৃষ্ঠা যার কিছু উপরে পিন করা আছে তা `--table-sticky-top` এ কত নিচে তা বলে।'
    zone:
      title: 'নিজস্ব অঞ্চলে একটি টেবিল'
      description: 'একটি `zone--table` অঞ্চল পুরো টেবিলকে দেওয়া হয়: যা উপরে এটি চালায়, এর পৃষ্ঠাগুলি পায়ের কাছে, যা কিছু স্ক্রোল করে, এবং তাদের মধ্যে টেবিলের জমি অঞ্চলের নিচে নামিয়ে, এমনকি তিনটি সারির জন্যও। যে কোনও টেবিল এতে যায়, সার্ভার দ্বারা লেখা বা একটি vue দ্বারা। `natural` এর সাথে, বামদিকে যেমন, টেবিলটি এর কলামের প্রস্থ রাখে, না প্রসারিত হয় এবং না সংকুচিত হয়।'
    striped:
      title: 'স্ট্রাইপড সারি, পয়েন্টারের নিচে উজ্জ্বল'
    selection:
      title: 'যা টিক করতে পারে এমন সারি'
      description: 'প্রতিটি সারির মাথায় একটি বাক্স, তাদের সকলের জন্য একটি শিরোনামে, এবং উপরে ক্রিয়াকলাপ: তারা টিক করা সারিগুলি তাদের নিজস্ব ঠিকানায় পোস্ট করে, এবং কিছু টিক না হওয়া পর্যন্ত পৌঁছানোর বাইরে থাকে।'
    files:
      title: 'ফাইল, মোট, প্রতিটি সারিতে একটি ক্রিয়া'
      description: 'পথগুলো তাদের নাম দ্বারা পড়া হয়, তার আগে ফোল্ডারগুলো তাদের শুরু থেকে কাটা হয়। বারটি কতগুলি সারি রয়েছে তার উপরে শেষ হয়, এবং একটি ক্রিয়া যা `all` চিহ্নিত করা হয়েছে তা কিছু টিক না হওয়া অবস্থায় কাজ করে — এটি প্রতিটি সারি গ্রহণ করে, এবং যখন এটি প্রত্যাশিত হয় তখন বারকে পরিচালনা করে।'
    filters:
      title: ফিল্টার
      description: 'টেবিলের মাথায় ফিল্টারের একটি বার, প্রতিটি একটি সূক্ষ্ম মেনু, যা এটি যখন সংকীর্ণ হয় তখন কি সংকীর্ণ হয় তা বলে। সার্ভারে তারা পৃষ্ঠার প্রশ্নে বসবাস করে — প্রতিটি অপশন একটি লিংক — এবং নিয়ন্ত্রক এটি থেকে সারিগুলি সংকীর্ণ করে; ভিউতে তারা পৃষ্ঠার জন্য এর এপিআই দ্বারা হস্তান্তরিত একটি মান, অথবা টেবিল দ্বারা ইতিমধ্যে থাকা সারিগুলিতে প্রয়োগ করা হয়। প্রতিটি অপশন একটি বাক্স — একটি একটিমাত্র পছন্দের জন্য গোল — যখন একটি রঙ থাকে, তার স্বর অনুযায়ী রঙিন, একটি স্ট্যাটাস বা একটি ক্যাটাগরি।'
    sorting:
      title: সাজানো
      description: 'একটি হেডার যা সাজায় তা সার্ভারে একটি লিঙ্ক এবং vue-তে একটি বোতাম: উর্ধ্বগামী, অবধি, তারপর ফিরে আসা সেই আদেশে যা পৃষ্ঠা ঘোষণা করেছে, যা তালিকা খুলে এবং যা এর তীর শুরু থেকে দেখায়। খালি তারিখগুলি উভয় দিকেই শেষ হয়, এবং নামগুলি ভাষার অনুযায়ী তুলনা করে। এখানে টেবিলটি নিজেই দেওয়া সারিগুলি সাজায়; একটি নিয়ন্ত্রক এর তালিকাটি পড়ে একই কোয়েরি।'
    figures:
      title: 'কোড, সংখ্যা এবং মোট'
      description: "`cell: 'code'` একটি শনাক্তকারী সেট করে একক ফেসে; `cell: 'number'`, অথবা একটি `unit`, পৃষ্ঠার লোকালে একটি সংখ্যা লেখে। `negative: true` একটি সংখ্যাকে শূন্যের নিচে আঁকে ত্রুটির স্বরে, এর মাইনাস চিহ্নও এটি নির্দেশ করে। `totals` একটি সারি যা পৃষ্ঠা অন্যদের নিচে হস্তান্তর করে — টেবিলটি কিছু যোগ করে না, একটি পৃষ্ঠা বা একটি ফিল্টার করা তালিকা ধারণ করে। সার্ভার দ্বারা আঁকা, তারপর vue দ্বারা।"
    sorting_vue:
      title: 'ব্রাউজারে সাজানো, twig থেকে'
      description: '`vue: true` একই কলাম এবং সারিগুলি vue যমজকে হস্তান্তর করে: এটি ব্রাউজারে পুরো তালিকা সাজায় এবং অনুসন্ধান করে, কোন পৃষ্ঠা লোড নেই। একটি তালিকার জন্য যা পৃষ্ঠা পুরোপুরি ধারণ করে — একটি সংক্ষিপ্ত, অথবা একটি যা কোন api পরিবেশন করে না।'
    selection_select:
      title: 'একটি নির্বাচনে ক্রিয়াকলাপ'
      description: 'যখন যথেষ্ট ক্রিয়াকলাপ থাকে তখন একই বার: একটি নির্বাচন করা হয়, পরে প্রয়োগ করা হয়।'
    vue:
      title: 'ভিউ এন্টিটি টেবিল'
    vue_selection:
      title: 'নির্বাচন সহ ভিউ টেবিল'
      description: 'ক্লায়েন্টে একই চুক্তি: টিক করা কীগুলি v-model:selected এর মাধ্যমে ফিরে আসে, প্রতিটি ক্রিয়া একটি বাল্ক-অ্যাকশন হিসাবে নির্গত হয়, এবং একটি ঠিকানা সহ একটি সার্ভার টেবিল পোস্টের মতো পোস্ট করা হয়। এগুলোর কিছু নেই, তাই নিচের লাইন বলে দেয় কি করা হবে। প্রতিটি পৃষ্ঠায় তিনটি সারি, বারটির শেষে মোট, এবং আর্কাইভ করার জন্য কিছু টিকের প্রয়োজন নেই।'
    vue_compact:
      title: 'মোট ছাড়া পৃষ্ঠা বিভাজন'
      description: 'যখন এপিআই মোট ফেরত দেয় না, তখন পেজার পূর্ববর্তী/পরবর্তীতে ফিরে আসে।'
    vue_dates:
      title: 'ভিউ তারিখ ফরম্যাটার'
