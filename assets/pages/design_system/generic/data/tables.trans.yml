    pagination:
      title: サーバーによって描画されたページネーション
      description: '`pagination(page, pages_count)` はリストのページをリンクとして描画します：各ページはそのページが持つルートとクエリ - 検索、ソート - を保持し、`page` のみを変更します。表示される数字はvueのページャーのもので、最初のページ、最後のページ、現在のページ、その隣のページです。`compact` はページ番号の周りに前後のページを保持します；`route` と `params` は別のアドレスを通ります。'
    wide:
      title: 部屋より広い
      description: 'ページが必要とする幅で描画され、周囲のスクロールゾーン - ゾーン、ページ - にオーバーフローしますが、自身のスクロールバーは持ちません。要求された場合（`scroll: true`）、ここでのように、独自のフレーム内で横にスクロールし、周囲のページはそのままです：スクロールしないコンテナ内の他の要素の間のテーブルとして機能します。スティッキーテーブルはこれを放棄します：ページに固定されたヘッダーと独自にスクロールするフレームは同時に持つことはできません。'
    default:
      title: シンプルテーブル
    actions:
      title: アクション付きテーブル
    links:
      title: リンクとアイコンのセル
    loading:
      title: 読み込み中
    empty:
      title: 空の状態
    alignment:
      title: カラムの整列
    markdown:
      title: Markdownから
      description: 'Markdownで書かれ、`markdown_ds`を通過したテーブル: カラム、その整列、各セルのマークアップはドキュメントから読み取られ、ここで他のテーブルと同様に描画されます。`markdown`は、ページでないもの — メール、フィードなどのために、平文の`<table>`を保持します。'
    groups:
      title: グループ行
      description: 'グループのみを持つ行は行ではありません: それは二つのグループの間の線であり、単語が与えられます。それはテーブルを横断し、続くものの名前を付けます — メニューセパレーターと同じ読み方です。'
    status:
      title: ステータスセル
      description: '状態は円であり、誰かが選んだ色ではありません: セルはタイプ名、またはカウントとタイトルのあるタイプを取り、システムの残りが描くステータスアイコンを描画します。ページ内にスタイルを適用することはありません。'
    sticky:
      title: スティッキーヘッダー
      description: '長いテーブルは、行ごとだけでなく、カラムごとにも読まれます。`sticky`を使用すると、ヘッダーが表示されたままで、行がその下をスクロールします; 自分の何かが上部に固定されたページは、`--table-sticky-top`でどれだけ下にあるかを示します。'
    zone:
      title: 独自のゾーン内のテーブル
      description: 'テーブル全体に与えられた `zone--table` ゾーン：それを上から駆動し、足元にページを持ち、スクロールするものから分けられ、上下にゾーンの底までテーブルのグラウンドが広がります。サーバーまたはvueによって書かれた任意のテーブルが入ります。左側のように `natural` を使用すると、テーブルは列の幅を保持し、伸びも縮みもしません。'
    striped:
      title: ストライプ行、ポインタの下で照らされる
    selection:
      title: チェック可能な行
      description: '各行の先頭にあるボックス、すべてのためのヘッダーに一つ、そして上にあるアクション: チェックされた行をそれぞれのアドレスに送信し、何もチェックされていない間は手の届かないところに留まります。'
    files:
      title: ファイル、合計、各行のアクション
      description: '名前で読み取られるパス、先頭から切り取られたフォルダ。バーは行の数で終了し、`all`とマークされたアクションは何もチェックされていない状態で機能します — すべての行を取得し、期待されるものであればバーを先導します。'
    filters:
      title: フィルター
      description: 'テーブルの先頭にあるフィルターのバー、各フィルターは控えめなメニューで、実行するとどのように絞り込むかを示します。サーバーではページのクエリに存在し — 各オプションはリンクです — コントローラーはそれから行を絞り込みます; Vueでは、APIのためにページに渡される値であるか、すでに持っている行にテーブルが適用します。各オプションはボックスです — 一つの選択肢のために丸く — トーンがあるときは色がつき、ステータスまたはカテゴリです。'
    sorting:
      title: ソート
      description: ソートするヘッダーはサーバーのリンクであり、vueのボタンです：昇順、降順、次にページが宣言した順序に戻ります。空の日時は両方とも最後に表示され、名前は言語がそれらを順序付ける方法で比較されます。ここでは、テーブルは自分に与えられた行をソートします；リストをページングするコントローラーは同じクエリを読み取ります。
    figures:
      title: コード、数値、合計
      description: "`cell: 'code'` はモノフォントで識別子を設定します； `cell: 'number'` または `unit` はページのロケールで数値を表示します。`negative: true` はエラー音でゼロ未満の数値を描画し、そのマイナス記号も示します。`totals` はページが引き渡す行で、他の行の下に描画されます - テーブルは合計を計算せず、1ページまたはフィルタリングされたリストを保持します。サーバーによって描画され、その後vueによって描画されます。"
    sorting_vue:
      title: ブラウザ内でのソート、twigから
      description: '`vue: true` は同じ列と行をvueの双子に渡します：それはブラウザ内で全体のリストをソートし、検索しますが、ページの読み込みはありません。ページが全体を保持するリストに対して - 短いもの、またはAPIが提供しないもの。'
    selection_select:
      title: 選択時のアクション
      description: '十分なアクションがあるときの同じバー: 一つが選ばれ、その後適用されます。'
    vue:
      title: Vueエンティティテーブル
    vue_selection:
      title: 選択付きVueテーブル
      description: 'クライアント上の同じ契約: チェックされたキーはv-model:selectedを通じて戻り、各アクションはbulk-actionとして発行され、アドレスのあるものはサーバーテーブルがそれを投稿するように投稿されます。これらには何もないので、下の行は何が行われたかを示します。ページあたり三行、バーの最後に合計、アーカイブすべては何もチェックされていない必要があります。'
    vue_compact:
      title: 合計なしのページネーション
      description: APIが合計を返さないとき、ページャーは前へ/次へに戻ります。
    vue_dates:
      title: Vue日付フォーマッタ
  column:
