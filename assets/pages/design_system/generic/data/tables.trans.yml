he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: טבלאות
  page_icon: 'ph:bold/table'
  section:
    pagination:
      title: 'דפדוף, נמשך על ידי השרת'
      description: '`pagination(page, pages_count)` מצייר את הדפים של רשימה כקישורים: כל אחד שומר על המסלול והשאלה של הדף שבו הוא נמצא — חיפוש, מיון — ומשנה רק את `page`, נספר מ-1. המספרים המוצגים הם של הממיר vue: הראשון, האחרון, הנוכחי והשכנים שלו. `compact` שומר על הקודם והבא סביב מספר הדף; `route` ו-`params` מדפדפים לכתובת אחרת.'
    wide:
      title: 'רחב יותר מהחדר'
      description: 'שולחן שהעמודות שלו דורשות יותר ממה שהדף כולל מצויר ברוחב הנדרש שלו ומע overflow לכל מה שסובב אותו — האזור, הדף —, אף פעם לא עם סרגל גלילה משלו. כשמבוקש (`scroll: true`), כמו כאן, הוא גולל צדדים במסגרת שלו והדף שסובב אותו נשאר במקום: עבור שולחן בין דברים אחרים במיכל שאינו גולל. שולחן דביק מוותר על זה: כותרת הדבוקה לדף ומסגרת הגוללת על עצמה לא יכולות להיות יחד.'
    default:
      title: 'טבלה פשוטה'
    actions:
      title: 'טבלה עם פעולות'
    links:
      title: 'תאים עם קישור ואייקון'
    loading:
      title: 'מצב טוען'
    empty:
      title: 'מצב ריק'
    alignment:
      title: 'יישור עמודות'
    markdown:
      title: ממרקדאון
      description: "טבלה שנכתבת במרקדאון ועוברת דרך `markdown_ds`: העמודות, היישור שלהן והסימון של כל תא נקראים מהמסמך, והטבלה מצויירת כאן כמו כל אחת אחרת. `markdown` שומר על ה'<table>' הפשוט, עבור כל מה שאינו עמוד — דוא\"ל, פיד."
    groups:
      title: 'קיבוץ שורות'
      description: 'שורה שמכילה רק קבוצה היא לא שורה: זו הקו בין שתי ריצות שלהן, שניתנה מילה. היא מתפרסת על פני הטבלה ומסמנת מה בא לאחר מכן — אותה קריאה כמו מפריד בתפריט.'
    status:
      title: 'תאים של סטטוס'
      description: 'מצב הוא מעגל, אף פעם לא צבע שמישהו בחר: התא לוקח שם סוג, או סוג עם מספר וכותרת, ומצייר את האייקון של הסטטוס שהשארת המערכת מציירת. אין מה לעצב בעמוד.'
    sticky:
      title: 'כותרת דביקה'
      description: 'טבלה ארוכה נקראת עמודה בעמודה כמו שורה בשורה. עם `sticky`, הכותרת נשארת בתצוגה בעוד השורות גוללות מתחתיה; עמוד עם משהו משלו נעוץ בחלק העליון אומר כמה רחוק למטה ב`--table-sticky-top`.'
    zone:
      title: 'שולחן באזור משלו'
      description: 'אזור `zone--table` ניתן לשולחן כולו: מה שמניע אותו בחלק העליון, הדפים שלו בתחתית, מתוך מה שגולל, ובין לבין הקרקע של השולחן עד לתחתית האזור, אפילו לשלוש שורות. כל שולחן נכנס אליו, נכתב על ידי השרת או על ידי vue. עם `natural`, כמו זה שבצד שמאל, השולחן שומר על רוחב העמודות שלו, לא מרוחב ולא לחוץ.'
    striped:
      title: 'שורות מפוספסות, מוארות מתחת לאצבע'
    selection:
      title: 'שורות שניתן לסמן'
      description: 'תיבה בראש כל שורה, אחת בכותרת עבור כולן, והפעולות למעלה: הן שולחות את השורות המסומנות לכתובת שלהן, ונשארות מחוץ להישג יד בזמן שאין שום דבר מסומן.'
    files:
      title: 'קבצים, סך הכול, פעולה על כל שורה'
      description: 'שמות הקבצים נקראים לפי שמם, התיקיות לפניו נחתכות מההתחלה. השורה מסתיימת לפי כמה שורות יש, ופעולה מסומנת `all` פועלת כשאין דבר מסומן — היא לוקחת כל שורה, ומובילה את השורה כשזו הצפויה.'
    filters:
      title: מסננים
      description: 'שורת מסננים בראש הטבלה, תפריט דיסקרטי לכל אחד, אומר מה היא מצמצמת כאשר היא עושה זאת. על השרת הם חיים בשאילתה של העמוד — כל אפשרות היא קישור — והמנהל מצמצם את השורות מזה; בווי הם ערך handed לעמוד עבור ה-api שלו, או מיושמים על ידי הטבלה לשורות שכבר יש לה. כל אפשרות היא תיבה — עגולה עבור בחירה אחת — צבעונית לפי גוון שלה כאשר יש לה, סטטוס או קטגוריה.'
    sorting:
      title: מיון
      description: 'כותרת שמסדרת היא קישור על השרת וכפתור ב-vue: בסדר עולה, בסדר יורד, ואז חוזרת לסדר שהדף הכריז, שעליו הרשימה נפתחת ואשר החץ שלה מראה מההתחלה. תאריכים ריקים הולכים אחרונים בשני הכיוונים, ושמות משווים כפי שהשפה מסדרת אותם. כאן השולחן מסדר את השורות שניתנו לו בעצמו; בקר שמדפדף ברשימה שלו קורא את אותה השאלה במקום.'
    figures:
      title: 'קודים, דמויות וסכומים'
      description: "`cell: 'code'` מגדיר מזהה בפנים חד צדדית; `cell: 'number'`, או `unit`, כותב דמות במיקום של הדף. `negative: true` מצייר דמות מתחת לאפס בגוון שגיאה, סימן המינוס שלו אומר את זה גם. `totals` היא שורה שהדף מעביר, מצוירת מתחת לאחרות — השולחן לא מוסיף כלום, מחזיק דף אחד או רשימה מסוננת. מצויר על ידי השרת, ואז על ידי vue."
    sorting_vue:
      title: 'מיון בדפדפן, מ-twig'
      description: '`vue: true` מעביר את אותם העמודות והשורות לתאום vue: הוא ממיין ומחפש את כל הרשימה בדפדפן, ללא טעינת דף. עבור רשימה שהדף מחזיק בשלמות — אחת קצרה, או אחת שאין לה api.'
    selection_select:
      title: 'פעולות בבחירה'
      description: 'אותה שורה כאשר יש מספיק פעולות כדי לדחוס אותה: אחת נבחרת, ואז מיושמת.'
    vue:
      title: 'טבלת ישות Vue'
    vue_selection:
      title: 'טבלה של Vue עם בחירה'
      description: 'אותה הסכם על הלקוח: המפתחות המסומנים חוזרים דרך v-model:selected, כל פעולה משודרת כפעולה מרוכזת, ואחת עם כתובת נשלחת כמו שהטבלה של השרת שולחת אותה. אלו אין להן, לכן השורה למטה אומרת מה היה נעשה. שלוש שורות בעמוד, הסך הכול בסוף השורה, וארכיון הכל זקוק לשום דבר לא מסומן.'
    vue_compact:
      title: 'דפים ללא סך הכול'
      description: 'כאשר ה-API לא מחזיר סך הכול, המנחה חוזר לדף הקודם/הבא.'
    vue_dates:
      title: 'פורמט תאריכים של Vue'
