th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ตาราง
  page_icon: 'ph:bold/table'
  section:
    wide:
      title: กว้างกว่าห้อง
      description: 'ตารางที่มีคอลัมน์มากกว่าที่หน้าสามารถรองรับได้ จะถูกวาดในความกว้างที่ต้องการในกรอบที่เลื่อนข้าง — หน้ารอบ ๆ จะไม่เคลื่อนที่ ตารางติดจะละทิ้งสิ่งนี้: หัวตารางที่ติดกับหน้าและกรอบที่เลื่อนเองไม่สามารถมีพร้อมกันได้.'
    default:
      title: ตารางธรรมดา
    actions:
      title: ตารางที่มีการกระทำ
    links:
      title: เซลล์ลิงก์และไอคอน
    loading:
      title: สถานะกำลังโหลด
    empty:
      title: สถานะว่างเปล่า
    alignment:
      title: การจัดตำแหน่งคอลัมน์
    markdown:
      title: 'จาก Markdown'
      description: 'ตารางที่เขียนใน Markdown และผ่าน `markdown_ds`: คอลัมน์ การจัดตำแหน่ง และการทำเครื่องหมายของแต่ละเซลล์จะถูกอ่านจากเอกสาร และตารางจะแสดงที่นี่เหมือนกับตารางอื่น ๆ `markdown` จะเก็บ `<table>` ไว้สำหรับสิ่งที่ไม่ใช่หน้า — อีเมล ฟีด'
    groups:
      title: กลุ่มแถว
      description: 'แถวที่มีเพียงกลุ่มเดียวไม่ถือว่าเป็นแถว: มันคือเส้นระหว่างการวิ่งสองชุดที่ให้คำหนึ่ง มันขยายไปทั่วตารางและระบุสิ่งที่จะตามมา — การอ่านเหมือนกับตัวแบ่งเมนู'
    status:
      title: เซลล์สถานะ
      description: 'สถานะคือวงกลม ไม่เคยเป็นสีที่ใครเลือก: เซลล์จะรับชื่อประเภท หรือประเภทที่มีนับและชื่อ และวาดไอคอนสถานะที่ระบบอื่น ๆ วาด ไม่มีอะไรให้ปรับแต่งในหน้า'
    sticky:
      title: หัวตารางติด
      description: 'ตารางยาวจะถูกอ่านเป็นคอลัมน์ทีละคอลัมน์และแถวทีละแถว ด้วย `sticky` หัวจะอยู่ในมุมมองขณะที่แถวเลื่อนอยู่ใต้; หน้าใด ๆ ที่มีบางอย่างของตนเองติดอยู่ที่ด้านบนจะบอกว่าลงไปไกลแค่ไหนใน `--table-sticky-top`.'
    striped:
      title: 'แถวที่มีลายริ้ว สว่างขึ้นเมื่อชี้ไปที่'
    selection:
      title: แถวที่สามารถเลือกได้
      description: 'กล่องที่หัวของแต่ละแถว หนึ่งในหัวสำหรับทั้งหมด และการกระทำด้านบน: พวกเขาจะส่งแถวที่ถูกเลือกไปยังที่อยู่ของพวกเขาเอง และไม่สามารถเข้าถึงได้ในขณะที่ไม่มีการเลือก.'
    files:
      title: 'ไฟล์ จำนวน และการกระทำในแต่ละแถว'
      description: 'เส้นทางที่อ่านจากชื่อของมัน โดยที่โฟลเดอร์ก่อนหน้าถูกตัดออกจากจุดเริ่มต้น แถบจะสิ้นสุดที่จำนวนแถวที่มี และการกระทำที่มีเครื่องหมาย `all` จะทำงานโดยไม่มีการเลือก — มันจะใช้ทุกแถว และนำทางแถบเมื่อมันเป็นสิ่งที่คาดหวัง'
    filters:
      title: ตัวกรอง
      description: 'แถบตัวกรองที่หัวของตาราง เมนูที่มีความละเอียดแต่ละอัน บอกว่ามันแคบลงเมื่อมันทำ ในเซิร์ฟเวอร์พวกเขาจะอยู่ในคำถามของหน้าที่ — แต่ละตัวเลือกคือการเชื่อมโยง — และตัวควบคุมจะทำให้แถวแคบลงจากมัน; ใน vue มันเป็นค่าที่ส่งให้กับหน้าเพื่อใช้กับ api ของมัน หรือใช้โดยตารางกับแถวที่มันมีอยู่แล้ว แต่ละตัวเลือกคือกล่อง — กลมสำหรับการเลือกหนึ่ง — มีสีตามโทนเมื่อมันมีหนึ่ง สถานะหรือหมวดหมู่'
    selection_select:
      title: การกระทำในตัวเลือก
      description: 'แถบเดียวกันเมื่อมีการกระทำมากพอที่จะทำให้แออัด: หนึ่งจะถูกเลือกแล้วนำไปใช้'
    vue:
      title: 'ตารางเอนทิตี Vue'
    vue_selection:
      title: 'ตาราง Vue พร้อมการเลือก'
      description: 'ข้อตกลงเดียวกันบนคลาย: คีย์ที่ถูกเลือกจะกลับมาผ่าน v-model:selected แต่ละการกระทำจะถูกปล่อยเป็นการกระทำแบบกลุ่ม และหนึ่งที่มีที่อยู่จะถูกโพสต์เมื่อเซิร์ฟเวอร์ส่งตารางออกมา. สิ่งเหล่านี้ไม่มี ดังนั้นบรรทัดด้านล่างบอกว่าสิ่งที่ควรจะทำ สามแถวต่อหน้า จำนวนที่สิ้นสุดแถบ และเก็บทุกอย่างไม่ต้องเลือก.'
    vue_compact:
      title: การแบ่งหน้าโดยไม่มีจำนวนรวม
      description: 'เมื่อ api ไม่ส่งจำนวนรวมกลับมา ตัวแบ่งหน้าจะกลับไปที่ก่อนหน้า/ถัดไป.'
