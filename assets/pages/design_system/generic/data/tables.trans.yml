th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ตาราง
  page_icon: 'ph:bold/table'
  section:
    pagination:
      title: 'การแบ่งหน้า โดยเซิร์ฟเวอร์'
      description: '`pagination(page, pages_count)` จะแสดงหน้าของรายการเป็นลิงก์: แต่ละลิงก์จะเก็บเส้นทางและคำค้นหาของหน้าที่มันอยู่ — การค้นหา, การเรียงลำดับ — และเปลี่ยนแค่ `page` นับจาก 1 ตัวเลขที่แสดงคือของ vue pager: แรกสุด, สุดท้าย, ปัจจุบันและเพื่อนบ้านของมัน `compact` จะเก็บหน้าก่อนและหน้าถัดไปไว้รอบตัวเลขหน้า; `route` และ `params` จะเปลี่ยนไปที่ที่อยู่ที่แตกต่างกัน.'
    wide:
      title: กว้างกว่าห้อง
      description: 'ตารางที่มีคอลัมน์มากกว่าที่เพจมีจะแสดงที่ความกว้างที่ต้องการและล้นไปที่สิ่งที่เลื่อนรอบๆ มัน — โซน, หน้า — ไม่เคยมีแถบเลื่อนของตัวเอง ถ้าถูกขอ (`scroll: true`), อย่างที่นี่, มันจะเลื่อนไปด้านข้างในกรอบของมันเองและหน้าไปรอบๆ จะอยู่ที่เดิม: สำหรับตารางในสิ่งอื่นๆ ในคอนเทนเนอร์ที่ไม่เลื่อน ตารางที่ติดจะละทิ้งสิ่งนี้: หัวข้อที่ติดกับหน้าและกรอบที่เลื่อนเองไม่สามารถมีพร้อมกันได้.'
    default:
      title: ตารางธรรมดา
    actions:
      title: ตารางที่มีการกระทำ
    links:
      title: เซลล์ลิงก์และไอคอน
    loading:
      title: สถานะกำลังโหลด
    empty:
      title: สถานะว่างเปล่า
    alignment:
      title: การจัดตำแหน่งคอลัมน์
    markdown:
      title: 'จาก Markdown'
      description: 'ตารางที่เขียนใน Markdown และผ่าน `markdown_ds`: คอลัมน์ การจัดตำแหน่ง และการทำเครื่องหมายของแต่ละเซลล์จะถูกอ่านจากเอกสาร และตารางจะแสดงที่นี่เหมือนกับตารางอื่น ๆ `markdown` จะเก็บ `<table>` ไว้สำหรับสิ่งที่ไม่ใช่หน้า — อีเมล ฟีด'
    groups:
      title: กลุ่มแถว
      description: 'แถวที่มีเพียงกลุ่มเดียวไม่ถือว่าเป็นแถว: มันคือเส้นระหว่างการวิ่งสองชุดที่ให้คำหนึ่ง มันขยายไปทั่วตารางและระบุสิ่งที่จะตามมา — การอ่านเหมือนกับตัวแบ่งเมนู'
    status:
      title: เซลล์สถานะ
      description: 'สถานะคือวงกลม ไม่เคยเป็นสีที่ใครเลือก: เซลล์จะรับชื่อประเภท หรือประเภทที่มีนับและชื่อ และวาดไอคอนสถานะที่ระบบอื่น ๆ วาด ไม่มีอะไรให้ปรับแต่งในหน้า'
    sticky:
      title: หัวตารางติด
      description: 'ตารางยาวจะถูกอ่านเป็นคอลัมน์ทีละคอลัมน์และแถวทีละแถว ด้วย `sticky` หัวจะอยู่ในมุมมองขณะที่แถวเลื่อนอยู่ใต้; หน้าใด ๆ ที่มีบางอย่างของตนเองติดอยู่ที่ด้านบนจะบอกว่าลงไปไกลแค่ไหนใน `--table-sticky-top`.'
    zone:
      title: ตารางในโซนของตัวเอง
      description: 'โซน `zone--table` จะถูกมอบให้กับตารางทั้งหมด: สิ่งที่ขับเคลื่อนมันที่ด้านบน, หน้าของมันที่ด้านล่าง, ออกจากสิ่งที่เลื่อน, และระหว่างพวกเขาพื้นของตารางจะถูกบดลงไปที่ด้านล่างของโซน, แม้จะมีสามแถว ตารางใดๆ ก็สามารถเข้าไปในนั้น, เขียนโดยเซิร์ฟเวอร์หรือโดย vue ด้วย `natural`, เช่นเดียวกับที่อยู่ทางซ้าย, ตารางจะรักษาความกว้างของคอลัมน์ของมัน, ไม่ถูกยืดหรือบีบ.'
    striped:
      title: 'แถวที่มีลายริ้ว สว่างขึ้นเมื่อชี้ไปที่'
    selection:
      title: แถวที่สามารถเลือกได้
      description: 'กล่องที่หัวของแต่ละแถว หนึ่งในหัวสำหรับทั้งหมด และการกระทำด้านบน: พวกเขาจะส่งแถวที่ถูกเลือกไปยังที่อยู่ของพวกเขาเอง และไม่สามารถเข้าถึงได้ในขณะที่ไม่มีการเลือก.'
    files:
      title: 'ไฟล์ จำนวน และการกระทำในแต่ละแถว'
      description: 'เส้นทางที่อ่านจากชื่อของมัน โดยที่โฟลเดอร์ก่อนหน้าถูกตัดออกจากจุดเริ่มต้น แถบจะสิ้นสุดที่จำนวนแถวที่มี และการกระทำที่มีเครื่องหมาย `all` จะทำงานโดยไม่มีการเลือก — มันจะใช้ทุกแถว และนำทางแถบเมื่อมันเป็นสิ่งที่คาดหวัง'
    filters:
      title: ตัวกรอง
      description: 'แถบตัวกรองที่หัวของตาราง เมนูที่มีความละเอียดแต่ละอัน บอกว่ามันแคบลงเมื่อมันทำ ในเซิร์ฟเวอร์พวกเขาจะอยู่ในคำถามของหน้าที่ — แต่ละตัวเลือกคือการเชื่อมโยง — และตัวควบคุมจะทำให้แถวแคบลงจากมัน; ใน vue มันเป็นค่าที่ส่งให้กับหน้าเพื่อใช้กับ api ของมัน หรือใช้โดยตารางกับแถวที่มันมีอยู่แล้ว แต่ละตัวเลือกคือกล่อง — กลมสำหรับการเลือกหนึ่ง — มีสีตามโทนเมื่อมันมีหนึ่ง สถานะหรือหมวดหมู่'
    sorting:
      title: การเรียงลำดับ
      description: 'หัวข้อที่เรียงลำดับเป็นลิงก์บนเซิร์ฟเวอร์และปุ่มใน vue: การเรียงลำดับจากน้อยไปมาก, จากมากไปน้อย, แล้วกลับไปที่ลำดับที่หน้าประกาศ, ซึ่งรายการเปิดอยู่และลูกศรของมันแสดงตั้งแต่ต้น วันว่างจะไปสุดท้ายทั้งสองทาง, และชื่อจะเปรียบเทียบตามที่ภาษาสั่งให้เรียง ที่นี่ตารางเรียงแถวที่มันได้รับมาเอง; ตัวควบคุมที่แบ่งหน้ารายการจะอ่านคำค้นหาเดียวกันแทน.'
    figures:
      title: 'รหัส, ตัวเลขและยอดรวม'
      description: "`cell: 'code'` ตั้งตัวระบุในรูปแบบโมโน; `cell: 'number'`, หรือ `unit`, เขียนตัวเลขในเขตข้อมูลของหน้า `negative: true` จะแสดงตัวเลขต่ำกว่าศูนย์ในโทนเสียงที่ผิดพลาด, เครื่องหมายลบบอกเช่นกัน `totals` คือแถวที่หน้าโอนให้, แสดงอยู่ใต้แถวอื่น ๆ — ตารางไม่เพิ่มอะไรขึ้น, ถือหนึ่งหน้า หรือรายการที่กรองแล้ว แสดงโดยเซิร์ฟเวอร์, จากนั้นโดย vue."
    sorting_vue:
      title: 'การเรียงลำดับในเบราว์เซอร์, จาก twig'
      description: '`vue: true` มอบคอลัมน์และแถวเดียวกันให้กับฝาแฝด vue: มันจะเรียงและค้นหารายการทั้งหมดในเบราว์เซอร์, โดยไม่ต้องโหลดหน้า สำหรับรายการที่หน้าเก็บทั้งหมด — รายการสั้น ๆ, หรือรายการที่ไม่มี api ให้บริการ.'
    selection_select:
      title: การกระทำในตัวเลือก
      description: 'แถบเดียวกันเมื่อมีการกระทำมากพอที่จะทำให้แออัด: หนึ่งจะถูกเลือกแล้วนำไปใช้'
    vue:
      title: 'ตารางเอนทิตี Vue'
    vue_selection:
      title: 'ตาราง Vue พร้อมการเลือก'
      description: 'ข้อตกลงเดียวกันบนคลาย: คีย์ที่ถูกเลือกจะกลับมาผ่าน v-model:selected แต่ละการกระทำจะถูกปล่อยเป็นการกระทำแบบกลุ่ม และหนึ่งที่มีที่อยู่จะถูกโพสต์เมื่อเซิร์ฟเวอร์ส่งตารางออกมา. สิ่งเหล่านี้ไม่มี ดังนั้นบรรทัดด้านล่างบอกว่าสิ่งที่ควรจะทำ สามแถวต่อหน้า จำนวนที่สิ้นสุดแถบ และเก็บทุกอย่างไม่ต้องเลือก.'
    vue_compact:
      title: การแบ่งหน้าโดยไม่มีจำนวนรวม
      description: 'เมื่อ api ไม่ส่งจำนวนรวมกลับมา ตัวแบ่งหน้าจะกลับไปที่ก่อนหน้า/ถัดไป.'
