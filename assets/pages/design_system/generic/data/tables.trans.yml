id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Tabel
  page_icon: 'ph:bold/table'
  section:
    wide:
      title: 'Lebih lebar dari ruangan'
      description: 'Sebuah tabel yang kolom-kolomnya membutuhkan lebih dari yang bisa ditampilkan halaman digambar dengan lebar yang diperlukan, dalam bingkai yang menggulir ke samping — halaman di sekitarnya tidak bergerak. Tabel lengket mengorbankan ini: sebuah header yang tetap pada halaman dan bingkai yang menggulir sendiri tidak bisa ada bersamaan.'
    default:
      title: 'Tabel sederhana'
    actions:
      title: 'Tabel dengan tindakan'
    links:
      title: 'Sel tautan dan ikon'
    loading:
      title: 'Status loading'
    empty:
      title: 'Status kosong'
    alignment:
      title: 'Penyelarasan kolom'
    markdown:
      title: 'Dari markdown'
      description: 'Sebuah tabel yang ditulis dalam markdown dan diproses melalui `markdown_ds`: kolom-kolom, penyelarasan mereka dan markup setiap sel dibaca dari dokumen, dan tabel digambar di sini seperti tabel lainnya. `markdown` mempertahankan `<table>` biasa, untuk apa pun yang bukan halaman — sebuah email, sebuah feed.'
    groups:
      title: 'Kelompok baris'
      description: 'Sebuh baris yang hanya membawa satu grup bukanlah sebuah baris: itu adalah garis antara dua rangkaian, diberikan sebuah kata. Itu membentang di seluruh tabel dan menamai apa yang mengikuti — pembacaan yang sama seperti pemisah menu.'
    status:
      title: 'Sel status'
      description: 'Sebuah status adalah sebuah lingkaran, tidak pernah sebuah warna yang dipilih seseorang: sel tersebut mengambil nama tipe, atau tipe dengan jumlah dan judul, dan menggambar ikon status seperti yang digambar oleh sisa sistem. Tidak ada yang perlu diatur dalam halaman.'
    sticky:
      title: 'Header lengket'
      description: 'Sebuah tabel panjang dibaca kolom per kolom sebanyak baris per baris. Dengan `sticky`, header tetap terlihat sementara baris menggulir di bawahnya; sebuah halaman dengan sesuatu yang dipasang di atasnya mengatakan seberapa jauh ke bawah dalam `--table-sticky-top`.'
    striped:
      title: 'Baris bergaris, diterangi di bawah pointer'
    selection:
      title: 'Baris yang dapat dicentang'
      description: 'Sebuah kotak di kepala setiap baris, satu di header untuk semuanya, dan tindakan di atas: mereka mengirim baris yang dicentang ke alamat mereka sendiri, dan tetap di luar jangkauan sementara tidak ada yang dicentang.'
    files:
      title: 'File, total, sebuah tindakan di setiap baris'
      description: 'Jalur dibaca berdasarkan namanya, folder sebelum itu dipotong dari awalnya. Batang berakhir pada berapa banyak baris yang ada, dan sebuah tindakan yang ditandai `semua` bekerja tanpa ada yang dicentang — itu mengambil setiap baris, dan memimpin batang ketika itu yang diharapkan.'
    filters:
      title: Filter
      description: 'Sebuah batang filter di kepala tabel, satu menu yang tersembunyi masing-masing, menyatakan apa yang dipersempit saat itu dilakukan. Di server mereka berada dalam kueri halaman — setiap opsi adalah tautan — dan pengendali mempersempit baris dari situ; dalam vue mereka adalah nilai yang diserahkan ke halaman untuk api-nya, atau diterapkan oleh tabel ke baris yang sudah dimilikinya. Setiap opsi adalah sebuah kotak — bulat untuk pilihan satu — berwarna sesuai nada ketika memiliki satu, status atau kategori.'
    selection_select:
      title: 'Tindakan dalam pemilihan'
      description: 'Batang yang sama ketika ada cukup tindakan untuk mengisinya: satu dipilih, lalu diterapkan.'
    vue:
      title: 'Tabel entitas Vue'
    vue_selection:
      title: 'Tabel Vue dengan pemilihan'
      description: 'Kontrak yang sama di klien: kunci yang dicentang kembali melalui v-model:selected, setiap tindakan dipancarkan sebagai bulk-action, dan satu dengan alamat diposting seperti tabel server mempostingnya. Ini tidak memiliki, jadi garis di bawah mengatakan apa yang seharusnya dilakukan. Tiga baris per halaman, total di akhir batang, dan Arsip semua membutuhkan tidak ada yang dicentang.'
    vue_compact:
      title: 'Paginasi tanpa total'
      description: 'Ketika API tidak mengembalikan total, pager kembali ke sebelumnya/selanjutnya.'
    vue_dates:
      title: 'Formatter tanggal Vue'
