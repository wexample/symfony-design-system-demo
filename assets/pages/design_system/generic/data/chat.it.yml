~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Chat
page_icon: 'ph:bold/chats-circle'
chat:
  title: 'Esempio di chat'
vue:
  title: Vue
  description: |
    Lo stesso thread e lo stesso compositore, disegnati dal componente chat dell'entità. Contiene una raccolta di entità e non sa nulla di cosa siano: l'autore, il testo e la data vengono letti attraverso proiezioni che una sottoclasse sovrascrive, e un messaggio inviato esce attraverso il repository come qualsiasi altra creazione. La risposta viene scritta una volta che la richiesta è completata, quindi non può tornare nella risposta al messaggio: arriva alla pagina attraverso l'abbonamento live che questo thread mantiene nella sua stanza.
description:
  body: |
    Questo playground per chat è utilizzato per convalidare il ritmo dei messaggi, il loro spazio e la densità verticale prima della stilizzazione finale dell'interfaccia. Mantieni questo blocco intenzionalmente verboso in modo che il layout abbia abbastanza altezza per simulare un flusso di conversazione realistico, includendo righe di media e lunga lunghezza, comportamento di avvolgimento e pause di lettura naturali attraverso più frasi. L'obiettivo è fornire una base visiva stabile che i futuri componenti della chat possano seguire, affinché le misurazioni rimangano coerenti quando si sostituisce questo testo con messaggi reali degli utenti e degli assistenti.
composer:
  placeholder: 'Scrivi un messaggio...'
  submit_label: 'Invia messaggio'
  action_plus_label: 'Aggiungi contenuto'
  action_smiley_label: 'Inserisci emoji'
  multiline_value: |
    Questo è un bozza di chat più lunga utilizzata per visualizzare lo stato multiriga. Si estende su più righe in modo che la differenza visiva con il campo su una sola riga sia evidente.
messages:
  user_1: |
    Puoi riassumere gli elementi d'azione dal sync di ieri e mantenere solo le decisioni che possiamo eseguire questa settimana?
  user_2: |
    Inoltre, mantieni l'output breve perché questo sarà copiato nella barra laterale del manager.
  assistant_1: |
    Certo. Posso fornire un riassunto conciso con priorità, responsabili e prossimi checkpoint.
  assistant_2: |
    Terrò solo le decisioni validate e rimuoverò le domande aperte che necessitano ancora di scoperta.
  assistant_3: |
    Struttura proposta: 1. Azioni immediate. 2. Dipendenze. 3. Rischi da monitorare.
  assistant_4: |
    Una volta convalidata, questa struttura può diventare il template predefinito per il menu della chat nel manager.
