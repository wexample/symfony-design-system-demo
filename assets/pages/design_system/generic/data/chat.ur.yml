~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: چیٹ
page_icon: 'ph:bold/chats-circle'
chat:
  title: 'چیٹ کی مثال'
vue:
  title: ویو
  description: |
    یہی دھاگہ اور یہی تخلیق کار، جو کہ ادارے کے چیٹ کمپوننٹ کے ذریعہ تیار کیا گیا ہے۔ یہ عناصر کے مجموعے کو رکھتا ہے اور یہ نہیں جانتا کہ وہ کیا ہیں: مصنف، متن اور تاریخ کو پروجیکشنز کے ذریعے پڑھا جاتا ہے جو ایک ذیلی کلاس کو اوور رائیڈ کرتی ہے، اور ایک جمع کردہ پیغام کسی دوسرے تخلیق کی طرح ریپوزٹری کے ذریعے باہر جاتا ہے۔ جواب ایک بار لکھا جاتا ہے جب درخواست ختم ہو جاتی ہے، اس لئے یہ پیغام کے جواب میں واپس نہیں آ سکتا: یہ اس کمرے میں اس دھاگے کے ذریعے لائیو سبسکرپشن کے ذریعے صفحے تک پہنچتا ہے۔
description:
  body: |
    یہ چیٹ پلے گراونڈ پیغام کے دھارے، فاصلے، اور عمودی کثافت کی توثیق کے لئے استعمال ہوتا ہے اس سے پہلے کہ حتمی UI اسٹائلنگ کی جائے۔ اس بلاک کو جان بوجھ کر تفصیلی رکھیں تاکہ لے آؤٹ میں اتنی اونچائی ہو کہ حقیقت پسندانہ گفتگو کے دھارے کی نقل کی جا سکے، بشمول درمیانے اور طویل لکیریں، لپیٹنے کا رویہ، اور متعدد جملوں میں قدرتی پڑھنے کے وقفے۔ مقصد یہ ہے کہ ایک مستحکم بصری بیس لائن فراہم کی جائے جس کی پیروی مستقبل کے چیٹ کمپوننٹس کر سکیں، تاکہ اس متن کو حقیقی صارف اور معاون پیغامات سے تبدیل کرتے وقت پیمائشیں مستقل رہیں۔
composer:
  placeholder: 'ایک پیغام لکھیں...'
  submit_label: 'پیغام بھیجیں'
  action_plus_label: 'مواد شامل کریں'
  action_smiley_label: 'ایموجی داخل کریں'
  multiline_value: |
    یہ ایک طویل چیٹ ڈرافٹ ہے جو ملٹی لائن حالت کا پیش نظارہ کرنے کے لئے استعمال ہوتا ہے۔ یہ متعدد لکیروں میں لپیٹتا ہے تاکہ ایک لائن والے میدان کے ساتھ بصری فرق واضح ہو۔
messages:
  user_1: |
    کیا آپ کل کی ہم آہنگی سے عملی اقدامات کا خلاصہ بنا سکتے ہیں اور صرف ان فیصلوں کو رکھ سکتے ہیں جن پر ہم اس ہفتے عملدرآمد کر سکتے ہیں؟
  user_2: |
    خلاصہ کو بھی مختصر رکھیں کیونکہ یہ مینیجر سائیڈبار میں کاپی کیا جائے گا۔
  assistant_1: |
    بالکل۔ میں ترجیحات، مالکان، اور اگلے چیک پوائنٹس کے ساتھ ایک مختصر خلاصہ فراہم کر سکتا ہوں۔
  assistant_2: |
    میں صرف تصدیق شدہ فیصلے رکھوں گا اور کھلے سوالات کو ہٹا دوں گا جن کی اب بھی دریافت کی ضرورت ہے۔
  assistant_3: |
    تجویز کردہ ساخت: 1. فوری اقدامات۔ 2. انحصار۔ 3. نگرانی کے لئے خطرات۔
  assistant_4: |
    ایک بار تصدیق ہونے کے بعد، یہ ساخت مینیجر میں چیٹ مینو کے لئے ڈیفالٹ ٹیمپلیٹ بن سکتی ہے۔
