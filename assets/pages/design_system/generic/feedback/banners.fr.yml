    title: Vue
    description: "La même bannière en ligne qu'un partiel vue, prenant le même type et message; le shell que le service de bannière remplit est un fichier différent."
  banners:
    neutral: 'Ceci est un message de bannière neutre.'
    info: "Ceci est un message de bannière d'information."
    warning: "Ceci est un message de bannière d'avertissement."
    error: "Ceci est un message de bannière d'erreur."
