page_title: Markers
page_icon: 'ph:bold/seal-check'
intro: 'एक कैप्सूल में एक शब्द के बारे में कहा गया सब कुछ: एक स्थिति, एक नाम, एक संस्करण, एक श्रेणी। वे दो वस्तुएं थीं जब तक कि एक दिन एक कोड और एक स्थिति एक हेडर में एक साथ खड़े नहीं हो गए, एक सिर के apart, और कोई नहीं कह सकता था कि इसका मतलब क्या था — इसलिए आकार एक है और स्वर वही है जो उन्हें अलग करता है। जो यह ले जाता है वह स्वतंत्र है: एक शब्द, एक आकृति, एक वर्ण, या इनमें से दो। वृत्त वहां खड़ा होता है जहां कैप्सूल के लिए जगह नहीं होती, और काउंटर, जो एक पंक्ति से लटका होता है और उस पाठ में आकार में होता है, यहां एकमात्र चीज है जो एक मार्कर नहीं है।'
section:
  inline:
    title: 'एक वाक्य के बीच में'
    description: 'एक शब्द को अलग रखा गया है जैसा कि इसे पढ़ा जाता है: एक संस्करण, एक चरण, एक श्रेणी। तटस्थ स्वर, क्योंकि एक मार्कर जो रंगीन आता है, पहले से ही यह दावा कर चुका है कि यह क्या मार्क करता है — और एक वाक्य में किसी भी चीज़ का दावा करने के लिए कुछ नहीं है।'
  palette:
    title: श्रेणियाँ
    description: 'स्वरों जो चीजों को बिना रैंक किए अलग बताते हैं। वे कोई अर्थ नहीं लाते हैं — कुछ भी नहीं कहता कि तीसरा पांचवें से बेहतर है — जो उन्हें एक वर्गीकरण के लिए उपयोगी बनाता है, जहां अर्थ एक झूठ होता। ठीक उसी तरह पहना जाता है जैसे एक स्थिति होती है: वही कैप्सूल, वही लय।'
  against:
    title: 'एक मार्कर के बगल में एक काउंटर'
    description: 'एकमात्र भेद बचा है, और यह अर्थ के बारे में नहीं है। बाईं ओर एक काउंटर: कुछ का बारह, उस पंक्ति से लटका हुआ जो इसे ले जाती है और उस पंक्ति के अपने पाठ में आकार में होता है। दाईं ओर एक मार्कर: कुछ का बारह जो अच्छा गया, अपने आप खड़ा और टोकन में आकार में। एक मेनू आइटम के बगल में एक गिनती एक काउंटर है; एक पाइपलाइन कॉलम में वही संख्या एक मार्कर है।'
  words:
    title: 'शब्दों में एक स्थिति'
    description: 'एक वाक्य में या एक शीर्षक के बगल में घोषित किया गया, जहां यह एक संदेश है न कि एक कॉलम में एक मार्क।'
  figures:
    title: 'एक स्थिति जो दर्जन में पढ़ी जाती है'
    description: 'एक कॉलम में, तटस्थ गिनती के बगल में एक टिक दो वस्तुओं के रूप में पढ़ी जाती है और उनके एक तालिका शोर के रूप में पढ़ी जाती है। यहां रंग आकृति को घेरता है और कॉलम को एक पास में स्कैन किया जाता है — कॉम्पैक्ट, चूंकि एक सेल के पास जगह नहीं होती।'
  payload:
    title: 'यह क्या ले जाता है'
    description: 'एक शब्द जो स्थिति है, एक आकृति यह बताने के लिए कि इसके कितने हैं, दोनों, या न तो। आकृति हमेशा बाकी से एक कदम पीछे खींची जाती है: यह स्थिति को योग्य बनाती है, यह स्थिति नहीं है।'
  weights:
    title: 'तीन रूप एक साथ'
    description: 'वही जानकारी उस स्थान पर जहां इसे वास्तव में पढ़ा जाता है। वृत्त एक सेल के लिए आकार है जो कैप्सूल के लिए बहुत संकीर्ण है, और एकमात्र जो यह दिखा सकता है कि स्थिति एक मात्रा है — और इसे उसी रंग से खींचा जाता है जिससे कैप्सूल को भरा जाता है।'
  circles:
    title: वृत्त
    description: 'एक स्थिति जो एक वृत्त द्वारा बताई जाती है न कि एक शब्द द्वारा, उन स्थानों के लिए जहां स्थितियाँ दर्जनों में पढ़ी जाती हैं — एक रन की सूची, काम की एक पंक्ति। अंगूठी रंग ले जाती है, अंदर का वर्ण बताता है कि यह कौन सी स्थिति है, और ढेर के दोनों पक्ष समान मार्कअप खींचते हैं।'
  progress:
    title: 'एक स्थिति जो मात्रा है'
    description: 'एक रन एकमात्र स्थिति है जिसमें मात्रा होती है, इसलिए इसका अंगूठी उस रन तक खींची जाती है। Twig इसे दिए गए मूल्य को प्रिंट करता है; इसे बाद में स्थानांतरित करना ब्राउज़र का काम है।'
  sizes:
    title: 'वृत्त के आकार'
  vue:
    title: Vue
    description: 'वही घटक, ड्राइव किया गया: प्रकार या मूल्य बदलने से आर्क को स्थानांतरित किया जाता है बजाय इसके कि इसे फिर से खींचा जाए। यह एक है जो एक ऐप रखता है जब स्थिति पाठक की आंखों के नीचे बदलने वाली होती है।'
  code:
    title: उपयोग
