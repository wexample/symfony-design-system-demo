~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: بازخورد
page_icon: 'ph:bold/notification'
section:
  vue:
    title: Vue
    description: 'همان توست به عنوان یک بخش vue. بسته شدن اینجا منتشر می‌شود نه اینکه به صورت انیمیشن برود: در داخل یک درخت vue، والد لیست را در اختیار دارد.'
  simple_toast:
    description: 'نمایش یک توست ساده'
    button: 'باز کردن توست'
    title: 'دموی توست'
    message: 'سلام از ToastService + ToastStack. شما همچنین می‌توانید لینک‌های عملیاتی مانند @action:demo(این یکی) را در داخل پیام تعریف کنید.'
  tl_toast:
    description: 'نمایش یک دسته توست در بالا سمت چپ'
    button: 'باز کردن توست'
    title: 'توست بالا سمت چپ'
    message: 'سلام از ToastService + ToastStack (TL).'
  medium_toast:
    description: 'نمایش یک پیام توست با طول متوسط'
    button: 'باز کردن توست'
    title: 'توست متوسط'
    message: 'این یک پیام توست با طول متوسط برای دمو است.'
  long_toast:
    description: 'نمایش یک پیام توست بلند'
    button: 'باز کردن توست'
    title: 'توست بلند'
    message: 'این یک پیام توست بلندتر برای دمو است. این پیام شامل متن بیشتری است تا بتوانید نحوه رفتار کامپوننت را با محتوای بزرگتر پیش‌نمایش کنید.'
  horizontal_toasts:
    description: 'نمایش چهار توست در یک دسته افقی'
    info:
      title: 'توست اطلاعاتی'
      message: 'پیش‌نمایش توست افقی.'
      button: 'نمایش توست'
    success:
      title: 'توست موفقیت'
      message: 'همه چیز در اینجا خوب به نظر می‌رسد.'
      button: 'نمایش توست'
    warning:
      title: 'توست هشدار'
      message: 'این عمل را دوباره بررسی کنید.'
      button: 'نمایش توست'
    error:
      title: 'توست خطا'
      message: 'در اینجا مشکلی پیش آمده است.'
      button: 'نمایش توست'
title:
  toasts: توست‌ها
