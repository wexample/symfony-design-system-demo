page_title: เครื่องหมาย
page_icon: 'ph:bold/seal-check'
intro: 'แคปซูลหนึ่งสำหรับทุกสิ่งที่พูดถึงเกี่ยวกับสิ่งหนึ่งในคำเดียว: สถานะ, ชื่อ, เวอร์ชัน, หมวดหมู่ พวกมันเป็นวัตถุสองชิ้นจนกระทั่งวันหนึ่งที่โค้ดและสถานะยืนอยู่ข้างกันในหัวข้อเดียว ห่างกันแค่หัวเดียว และไม่มีใครสามารถบอกได้ว่าสิ่งที่แตกต่างกันนั้นหมายถึงอะไร — ดังนั้นรูปทรงจึงเป็นหนึ่งเดียวและโทนเสียงคือทั้งหมดที่บอกความแตกต่างของพวกเขา สิ่งที่มันแบกรับนั้นฟรี: คำ, ตัวเลข, สัญลักษณ์, หรือสองในสาม สิ่งกลมยืนอยู่ในที่ที่ไม่มีที่สำหรับแคปซูล และเคาน์เตอร์ที่แขวนจากแถวและมีขนาดตามข้อความที่มันแขวนอยู่ คือตัวเดียวที่นี่ที่ไม่ใช่เครื่องหมาย'
section:
  inline:
    title: กลางประโยค
    description: 'คำที่ถูกตั้งแยกออกเมื่ออ่าน: เวอร์ชัน, เฟส, หมวดหมู่ โทนเสียงที่เป็นกลาง เพราะเครื่องหมายที่มาพร้อมสีได้ทำการอ้างอิงเกี่ยวกับสิ่งที่มันหมายถึง — และในประโยคไม่มีอะไรที่จะอ้างอิงได้'
  palette:
    title: หมวดหมู่
    description: 'โทนเสียงที่บอกความแตกต่างโดยไม่จัดอันดับ พวกมันไม่มีความหมาย — ไม่มีอะไรบอกว่าสิ่งที่สามดีกว่าสิ่งที่ห้า — ซึ่งก็คือสิ่งที่ทำให้มันใช้ได้สำหรับการจัดประเภท ที่ซึ่งความหมายจะเป็นการโกหก สวมใส่เช่นเดียวกับสถานะ: แคปซูลเดียวกัน, จังหวะเดียวกัน'
  against:
    title: เคาน์เตอร์ข้างเครื่องหมาย
    description: 'ความแตกต่างเดียวที่เหลืออยู่ และมันไม่เกี่ยวกับความหมาย ทางซ้ายคือเคาน์เตอร์: สิบสองของบางสิ่ง ที่แขวนจากแถวที่นำไปสู่และมีขนาดตามข้อความของแถวนั้น ทางขวาคือเครื่องหมาย: สิบสองของบางสิ่งที่ดี ยืนอยู่ตามลำพังและมีขนาดตามตัวเลข เคาน์เตอร์ข้างรายการเมนูคือเคาน์เตอร์; ตัวเลขเดียวกันในคอลัมน์ท่อคือเครื่องหมาย'
  words:
    title: สถานะในคำ
    description: 'ประกาศในประโยคหรือข้างชื่อเรื่อง ซึ่งเป็นข้อความมากกว่าการทำเครื่องหมายในคอลัมน์'
  figures:
    title: สถานะอ่านโดยสิบสอง
    description: 'ในคอลัมน์ เครื่องหมายถูกต้องข้างเคาน์เตอร์ที่เป็นกลางอ่านเป็นวัตถุสองชิ้นและตารางของพวกเขาอ่านเป็นเสียงดัง ที่นี่สีจะห่อหุ้มตัวเลขและคอลัมน์ถูกสแกนในครั้งเดียว — กะทัดรัด เนื่องจากเซลล์ไม่มีที่ว่างให้เหลือ'
  payload:
    title: สิ่งที่มันแบกรับ
    description: 'คำสำหรับสิ่งที่สถานะคือ ตัวเลขสำหรับจำนวนของมัน มีทั้งสองอย่างหรือไม่มีเลย ตัวเลขจะวาดห่างจากที่เหลือ: มันมีคุณสมบัติของสถานะ มันไม่ใช่สถานะ'
  weights:
    title: รูปแบบสามแบบข้างกัน
    description: 'ข้อมูลเดียวกันในที่ที่มันถูกอ่านจริง ๆ วงกลมคือรูปแบบสำหรับเซลล์ที่แคบเกินไปสำหรับแคปซูล และเป็นรูปแบบเดียวที่สามารถแสดงให้เห็นว่าสถานะเป็นปริมาณ — และมันถูกวาดด้วยสีเดียวกันที่แคปซูลเติมเต็ม'
  circles:
    title: วงกลม
    description: 'สถานะที่บอกโดยวงกลมแทนที่จะเป็นคำ สำหรับสถานที่ที่สถานะถูกอ่านโดยสิบสอง — รายการของการทำงาน แถวของงาน วงแหวนจะนำสีมา สัญลักษณ์ภายในบอกว่าสถานะคืออะไร และทั้งสองด้านของกองวาดเครื่องหมายเดียวกัน'
  progress:
    title: สถานะที่เป็นปริมาณ
    description: 'การวิ่งคือสถานะเดียวที่มีจำนวน ดังนั้นวงแหวนของมันจึงถูกวาดตามที่การวิ่งได้ไปถึง Twig แสดงค่าที่มันได้รับ; การเคลื่อนย้ายมันหลังจากนั้นเป็นเรื่องของเบราว์เซอร์'
  sizes:
    title: ขนาดวงกลม
  vue:
    title: Vue
    description: 'ส่วนประกอบเดียวกัน ขับเคลื่อน: การเปลี่ยนประเภทหรือค่าเคลื่อนที่บนโค้งแทนที่จะวาดใหม่ นี่คือสิ่งที่แอปวางเมื่อสถานะจะเปลี่ยนภายใต้สายตาของผู้อ่าน'
  code:
    title: การใช้งาน
