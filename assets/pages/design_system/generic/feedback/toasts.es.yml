~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Comentarios
page_icon: 'ph:bold/notification'
section:
  vue:
    title: Vue
    description: 'El mismo toast que un parcial de vue. El cierre se emite aquí en lugar de alejarse animado: dentro de un árbol de vue, el padre tiene la propiedad de la lista.'
  simple_toast:
    description: 'Mostrar un toast simple'
    button: 'Abrir toast'
    title: 'Demostración de toast'
    message: 'Hola desde ToastService + ToastStack. También puedes definir enlaces de acción como @action:demo(este) dentro de un mensaje.'
  tl_toast:
    description: 'Mostrar una pila de toast en la esquina superior izquierda'
    button: 'Abrir toast'
    title: 'Toast en la esquina superior izquierda'
    message: 'Hola desde ToastService + ToastStack (TL).'
  medium_toast:
    description: 'Mostrar un mensaje de toast de longitud media'
    button: 'Abrir toast'
    title: 'Toast mediano'
    message: 'Este es un mensaje de toast de longitud media para la demostración.'
  long_toast:
    description: 'Mostrar un mensaje de toast largo'
    button: 'Abrir toast'
    title: 'Toast largo'
    message: 'Este es un mensaje de toast más largo para la demostración. Contiene más texto para que puedas previsualizar cómo se comporta el componente con contenido más grande.'
  horizontal_toasts:
    description: 'Mostrar cuatro toasts en una pila horizontal'
    info:
      title: 'Toast de información'
      message: 'Una vista previa de toast horizontal.'
      button: 'Mostrar toast'
    success:
      title: 'Toast de éxito'
      message: 'Todo se ve bien aquí.'
      button: 'Mostrar toast'
    warning:
      title: 'Toast de advertencia'
      message: 'Verifica esta acción.'
      button: 'Mostrar toast'
    error:
      title: 'Toast de error'
      message: 'Algo salió mal aquí.'
      button: 'Mostrar toast'
title:
  toasts: Toasts
