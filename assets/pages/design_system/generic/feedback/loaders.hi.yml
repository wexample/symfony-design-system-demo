~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: लोडर्स
page_icon: 'ph:bold/spinner-gap'
intro: 'कुछ हो रहा है और इसका अंत ज्ञात नहीं है। दोनों ही इसका संकेत देते हैं और इससे अधिक नहीं बताते — जहां अंत ज्ञात है, वहां अगले टैब पर बार इसका संकेत देता है।'
section:
  spinner:
    title: स्पिनर
    description: 'एक मशीन व्यस्त है। तीन आकार, और जब यह टेक्स्ट की एक पंक्ति में खड़ी होती है तो इसके लिए एक इनलाइन संरेखण।'
  dots:
    title: डॉट्स
    description: 'कुछ कहा जाने वाला है। वही तीन आकार, और वही संरेखण — जो बदलता है वह यह है कि पाठक किसका इंतजार कर रहा है।'
  vue:
    title: व्यू
    description: 'दोनों vue भागों के रूप में भी आते हैं, वही विकल्प लेते हैं, एक पृष्ठ के लिए जो यह तय करता है कि क्या कुछ इंतजार करने के लिए है।'
spinner:
  label: 'लोड हो रहा है'
  inline: 'डेटा संसाधित कर रहा है'
dots:
  label: 'इंतज़ार कर रहा है'
  inline: 'दूसरी तरफ लिख रहा है'
