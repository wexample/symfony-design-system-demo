~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Feedback
page_icon: 'ph:bold/notification'
section:
  vue:
    title: Vue
    description: 'O mesmo toast que um parcial vue. O fechamento é emitido aqui em vez de ser animado para fora: dentro de uma árvore vue, o pai controla a lista.'
  simple_toast:
    description: 'Exibir um toast simples'
    button: 'Abrir toast'
    title: 'Demonstração de toast'
    message: 'Olá do ToastService + ToastStack. Você também pode definir links de ação como @action:demo(este aqui) dentro de uma mensagem.'
  tl_toast:
    description: 'Exibir uma pilha de toast no canto superior esquerdo'
    button: 'Abrir toast'
    title: 'Toast no canto superior esquerdo'
    message: 'Olá do ToastService + ToastStack (TL).'
  medium_toast:
    description: 'Exibir uma mensagem de toast de comprimento médio'
    button: 'Abrir toast'
    title: 'Toast médio'
    message: 'Esta é uma mensagem de toast de comprimento médio para a demonstração.'
  long_toast:
    description: 'Exibir uma mensagem de toast longa'
    button: 'Abrir toast'
    title: 'Toast longo'
    message: 'Esta é uma mensagem de toast mais longa para a demonstração. Ela contém mais texto para que você possa visualizar como o componente se comporta com conteúdos maiores.'
  horizontal_toasts:
    description: 'Exibir quatro toasts em uma pilha horizontal'
    info:
      title: 'Toast de informação'
      message: 'Uma prévia de toast horizontal.'
      button: 'Mostrar toast'
    success:
      title: 'Toast de sucesso'
      message: 'Tudo parece bom aqui.'
      button: 'Mostrar toast'
    warning:
      title: 'Toast de aviso'
      message: 'Verifique esta ação novamente.'
      button: 'Mostrar toast'
    error:
      title: 'Toast de erro'
      message: 'Algo deu errado aqui.'
      button: 'Mostrar toast'
title:
  toasts: Toasts
