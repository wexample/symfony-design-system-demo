~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: التوزيع
page_icon: 'ph:bold/chart-bar-horizontal'
intro: 'مما يتكون الإجمالي، في سطر واحد. حيث يقول شريط التقدم مدى تقدم قيمة واحدة، يقول هذا كيف ينقسم الكل: الأجزاء تحتفظ بالترتيب الذي تم إعطاؤه، لذا يقرأ خط الأنابيب من اليسار إلى اليمين مثلما هو. تُسمى الحالات بالمفردات التي تتحدث بها الكبسولة والدائرة بالفعل، لذا لا تأخذ حالة واحدة لونين.'
section:
  default:
    title: 'الكل، بأجزائه'
    description: 'تنمو الأجزاء بما يتناسب مع قيمتها، وتقول الأسطورة عنها بكلمات أسفلها — نفس الكبسولة التي ترسم بها الجدول حالة، لذا تتحرك العين بين الاثنين دون تعلم أي شيء جديد.'
  linked:
    title: 'أجزاء تؤدي إلى مكان ما'
    description: 'جزء له هدف هو رابط: يصبح الشريط الطريق إلى القائمة التي يلخصها. تحت المؤشر يأخذ فيلمًا من الضوء بدلاً من لون آخر، مما قد يشير إلى حالة مختلفة.'
  bare:
    title: 'بدون الأسطورة'
    description: 'حيث تُسمى الأجزاء بجوارها فقط، أو حيث يجب على الشريط أن يقول شكل الشيء فقط، يتم إسقاط الأسطورة ويقول كل جزء ما هو تحت المؤشر.'
  rest:
    title: 'إجمالي أكبر من أجزائه'
    description: 'ما يحسبه الإجمالي ولا تحسبه أي جزء يحمل نصيبه من الصف ويرسم لا شيء: يظهر المسار من خلال ذلك بالضبط، بدلاً من أن تمتد الأجزاء لملء شريط لا يمتلكونه.'
  empty:
    title: 'لا شيء محسوب بعد'
    description: 'لا إجمالي ولا جزء — العمل لم يبدأ بعد، لا تزال الحسبة خارجًا. يحتفظ الشريط بمكانه، كمسار عاري — نفس الأرض التي يظهر من خلالها إجمالي أكبر من أجزائه — لذا يحتفظ صف منها بشكله؛ شكلها هو شرطة، نظرًا لأن لا شيء محسوب ليس صفرًا.'
  compact:
    title: مضغوط
    description: 'شريط أنحف لصف أو تذييل بطاقة، مع الكثافة المنقولة إلى كبسولات أسطورتها.'
  vue:
    title: 'عرض، مدفوع'
    description: 'نفس الشريط، أجزائه مُعطاة كبيانات. جزء لا يؤدي إلى أي مكان يستجيب لنقرة بـ `select`، وهو ما يجب الاستماع إليه لجدول يقوم بتصفية نفسه بجانبه.'
bar:
  pipeline: 'صفحات الكتالوج'
  elements: 'عناصر نظام التصميم'
  partial: 'الملفات المقروءة'
state:
