page_icon: 'ph:bold/notification'
section:
  vue:
    title: Vue
    description: 'แบนเนอร์แบบอินไลน์เดียวกันกับส่วน Vue โดยใช้ประเภทและข้อความเดียวกัน; แต่ไฟล์ที่บริการแบนเนอร์เติมเป็นไฟล์ที่ต่างกัน.'
  banners:
