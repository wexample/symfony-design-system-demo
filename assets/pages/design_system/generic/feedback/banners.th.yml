    description: 'แบนเนอร์ส่วนใหญ่ใช้ที่ระดับเลย์เอาต์เพื่อแสดงข้อความสำคัญเกี่ยวกับกิจกรรมเบื้องหลัง เช่น สถานะการเชื่อมต่ออินเทอร์เน็ต.'
