~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Сообщения
page_icon: 'ph:bold/notification'
section:
  block:
    title: 'Блокировать сообщения'
  compact:
    title: 'Компактные сообщения'
    description: 'Несформатированный вариант, для указания постоянных правил, а не для сообщения о событии. Передайте compact в параметры.'
  default:
    title: 'Типы сообщений'
  vue:
