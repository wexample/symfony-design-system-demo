~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 분배
page_icon: 'ph:bold/chart-bar-horizontal'
intro: '총계가 무엇으로 구성되어 있는지를 한 줄로 나타냅니다. 진행률 표시줄이 하나의 값이 얼마나 진행되었는지를 보여주는 반면, 이 표시줄은 전체가 어떻게 나누어지는지를 나타냅니다: 각 부분은 주어진 순서를 유지하므로 파이프라인은 파이프라인처럼 왼쪽에서 오른쪽으로 읽습니다. 상태는 캡슐과 원이 이미 사용하는 용어로 명명되므로 한 상태가 두 가지 색상을 가질 수 없습니다.'
section:
  default:
    title: '부분으로 나눈 전체'
    description: '각 부분은 그 가치에 비례하여 성장하고, 전설은 그 아래에 단어로 설명합니다 — 테이블이 상태를 그리는 같은 캡슐이므로, 시선은 두 가지 사이를 이동하지만 새로운 것을 배우지는 않습니다.'
  linked:
    title: '어딘가로 연결되는 부분들'
    description: '목표가 있는 부분은 링크입니다: 바는 요약하는 목록으로 들어가는 길이 됩니다. 포인터 아래에서는 다른 색상이 아닌 빛의 필름을 취하여 다른 상태를 나타내지 않습니다.'
  bare:
    title: '전설 없이'
    description: '부분이 바로 옆에 이름이 붙어 있거나 바가 단지 사물의 형태만을 말해야 할 때, 전설은 생략되고 각 부분은 포인터 아래에서 자신이 무엇인지 말합니다.'
  rest:
    title: '부분보다 큰 총계'
    description: '총계가 세는 것과 어떤 부분도 설명하지 않는 것은 그 행의 몫을 차지하고 아무것도 그리지 않습니다: 트랙은 정확히 그만큼 보여지며, 부분이 채우지 않는 바를 채우기 위해 늘어나는 것이 아닙니다.'
  empty:
    title: '아직 집계되지 않음'
    description: '총계도 없고 부분도 없음 — 작업이 시작되지 않았고, 집계가 아직 남아 있습니다. 바는 그 자리를 유지하며, 벌거벗은 트랙처럼 — 부분보다 큰 총계가 보이는 같은 땅 — 그래서 그들의 행은 모양을 유지합니다; 집계된 것이 없으므로 그 수치는 대시입니다.'
  compact:
    title: 간결하게
    description: '행이나 카드 바닥글을 위해 더 얇은 바, 밀도가 전설의 캡슐로 전달됩니다.'
  vue:
    title: '구동되는 Vue'
    description: '같은 바, 그 부분이 데이터로 제공됩니다. 어딘가로 연결되지 않는 부분은 클릭에 `select`로 응답하며, 이는 그 옆에서 스스로 필터링하는 테이블에서 들어야 할 것입니다.'
bar:
  pipeline: '카탈로그의 페이지들'
  elements: '디자인 시스템의 요소들'
  partial: '읽은 파일들'
state:
  done: 완료
  running: '실행 중'
  todo: '할 일'
  failed: 실패
  skipped: '시작되지 않음'
