~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Ładowarki
page_icon: 'ph:bold/spinner-gap'
intro: 'Coś się dzieje, a jego koniec nie jest znany. Oba te przypadki mówią o tym, ale odmawiają dalszego wyjaśnienia — tam, gdzie koniec jest znany, pasek na następnej karcie mówi to zamiast nich.'
section:
  spinner:
    title: Spinner
    description: 'Maszyna jest zajęta. Trzy rozmiary i wyrównanie inline, gdy stoi w linii tekstu, a nie w swoim własnym oknie.'
  dots:
    title: Kropki
    description: 'Coś ma być powiedziane. Te same trzy rozmiary i te same wyrównania — to, co się zmienia, to kto czeka na czytelnika.'
  vue:
    title: Vue
    description: 'Oba również działają jako części vue, przyjmując te same opcje, na stronie, która decyduje podczas działania, czy jest cokolwiek do czekania.'
spinner:
  label: Ładowanie
  inline: 'Przetwarzanie danych'
dots:
  label: Czekanie
  inline: 'Druga strona pisze'
