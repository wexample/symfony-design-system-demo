~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: محملات
page_icon: 'ph:bold/spinner-gap'
intro: 'هناك شيء يحدث ونهايته غير معروفة. كلاهما يقول الكثير ويرفض قول المزيد - حيث تُعرف النهاية، يقول الشريط في علامة التبويب التالية ذلك بدلاً من ذلك.'
section:
  spinner:
    title: دوار
    description: 'آلة مشغولة. ثلاثة أحجام، ومحاذاة داخلية عندما تكون في سطر نص بدلاً من أن تكون في صندوق خاص بها.'
  dots:
    title: نقاط
    description: 'شيء على وشك أن يُقال. نفس الأحجام الثلاثة، ونفس المحاذاة - ما يتغير هو من ينتظر القارئ.'
  vue:
    title: فيو
    description: 'كلاهما يأتي كأجزاء vue أيضًا، مع نفس الخيارات، لصفحة تقرر أثناء تشغيلها ما إذا كان هناك أي شيء يجب الانتظار من أجله.'
spinner:
  label: 'جارٍ التحميل'
  inline: 'معالجة البيانات'
dots:
  label: 'في الانتظار'
  inline: 'الجانب الآخر يكتب'
