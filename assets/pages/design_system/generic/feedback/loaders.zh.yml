~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 加载器
page_icon: 'ph:bold/spinner-gap'
intro: 某些事情正在发生，结束未知。这两者都表明了这一点，但拒绝多说——当结束已知时，下一个标签上的条形图会代替它说明。
section:
  spinner:
    title: 旋转器
    description: 一台机器正在忙碌。三种尺寸，以及当它在文本行中排列而不是独立在框中时的内联对齐。
  dots:
    title: 点
    description: 即将要说些什么。相同的三种尺寸，以及相同的对齐方式——变化的是读者在等待谁。
  vue:
    title: Vue
    description: 这两者也作为vue组件一起提供，接受相同的选项，用于在运行时决定是否有任何内容要等待的页面。
spinner:
  label: 加载中
  inline: 处理数据
dots:
  label: 等待中
  inline: 另一方正在写
