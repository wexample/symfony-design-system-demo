page_title: مارکرها
page_icon: 'ph:bold/seal-check'
intro: 'یک کپسول برای هر آنچه که درباره یک چیز در یک کلمه گفته می‌شود: یک وضعیت، یک نام، یک نسخه، یک دسته. آن‌ها دو شیء بودند تا روزی که یک کد و یک وضعیت در یک هدر کنار هم قرار گرفتند، یک سر فاصله، و هیچ‌کس نمی‌توانست بگوید تفاوت به چه معنایی است — بنابراین شکل یکی است و لحن تمام آنچه را که آن‌ها را متمایز می‌کند شامل می‌شود. آنچه را که حمل می‌کند آزاد است: یک کلمه، یک عدد، یک نشانه، یا دو تا از این سه. دایره جایی قرار دارد که جایی برای یک کپسول نیست، و شمارنده‌ای که از یک ردیف آویزان است و در متنی که از آن آویزان است اندازه‌گیری می‌شود، تنها چیزی است که در اینجا نشانگر نیست.'
section:
  inline:
    title: 'در وسط یک جمله'
    description: 'یک کلمه که به‌طور جداگانه خوانده می‌شود: یک نسخه، یک مرحله، یک دسته. لحن خنثی، زیرا یک نشانگر که رنگی می‌رسد، قبلاً ادعایی درباره آنچه که نشان می‌دهد کرده است — و در یک جمله چیزی برای ادعا وجود ندارد.'
  palette:
    title: دسته‌ها
    description: 'لحن‌هایی که چیزها را بدون رتبه‌بندی از هم متمایز می‌کنند. آن‌ها هیچ معنایی ندارند — هیچ‌چیز نمی‌گوید که سوم از پنجم بهتر است — که دقیقاً همان چیزی است که آن‌ها را برای یک طبقه‌بندی قابل استفاده می‌کند، جایی که معنا دروغ خواهد بود. درست به همان شیوه‌ای که یک وضعیت است: همان کپسول، همان ریتم.'
  against:
    title: 'یک شمارنده در کنار یک نشانگر'
    description: 'تنها تمایز باقی‌مانده، و این به معنای چیزی نیست. در سمت چپ یک شمارنده: دوازده از چیزی، آویزان از ردیفی که به آن منتهی می‌شود و در متن آن ردیف اندازه‌گیری می‌شود. در سمت راست یک نشانگر: دوازده از چیزی که خوب پیش رفت، به‌تنهایی ایستاده و در توکن‌ها اندازه گرفته می‌شود. یک شمارش در کنار یک مورد منو یک شمارنده است؛ همان عدد در یک ستون خط لوله یک نشانگر است.'
  words:
    title: 'وضعیت به زبان'
    description: 'در یک جمله یا در کنار یک عنوان اعلام می‌شود، جایی که این پیام است نه یک علامت در یک ستون.'
  figures:
    title: 'وضعیت خوانده شده به صورت دوازدهی'
    description: 'در یک ستون، یک تیک در کنار یک شمارش خنثی به‌عنوان دو شیء خوانده می‌شود و یک جدول از آن‌ها به‌عنوان نویز خوانده می‌شود. در اینجا رنگ، عدد را احاطه می‌کند و ستون در یک عبور اسکن می‌شود — فشرده، زیرا یک سلول جایی برای اضافی ندارد.'
  payload:
    title: 'آنچه را که حمل می‌کند'
    description: 'یک کلمه برای آنچه که وضعیت است، یک عدد برای تعداد آن، هر دو، یا هیچ‌کدام. عدد همیشه یک قدم عقب‌تر از بقیه ترسیم می‌شود: این وضعیت را توصیف می‌کند، اما خود وضعیت نیست.'
  weights:
    title: 'سه فرم در کنار هم'
    description: 'همان اطلاعات در جایی که واقعاً خوانده می‌شود. دایره فرم یک سلول است که برای یک کپسول خیلی باریک است، و تنها فرمی که می‌تواند نشان دهد که یک وضعیت یک مقدار است — و این با همان رنگی که کپسول با آن پر می‌شود ترسیم شده است.'
  circles:
    title: دایره‌ها
    description: 'وضعیتی که توسط یک دایره گفته می‌شود نه یک کلمه، برای جایی که وضعیت‌ها به صورت دوازدهی خوانده می‌شوند — یک فهرست از اجراها، یک ردیف از مشاغل. حلقه رنگ را حمل می‌کند، نشانه درون آن می‌گوید که کدام وضعیت است، و هر دو طرف توده همان نشانه‌گذاری را ترسیم می‌کنند.'
  progress:
    title: 'وضعیتی که مقدار است'
    description: 'یک اجرا تنها وضعیتی است که مقدار دارد، بنابراین حلقه آن به اندازه‌ای که اجرا پیش رفته کشیده می‌شود. Twig مقدار داده شده را چاپ می‌کند؛ جابجایی آن بعد از آن به عهده مرورگر است.'
  sizes:
    title: 'اندازه‌های دایره'
  vue:
    title: ویو
    description: 'همان مؤلفه، هدایت شده: تغییر نوع یا مقدار، قوس را حرکت می‌دهد به جای اینکه آن را دوباره ترسیم کند. این همان چیزی است که یک برنامه زمانی که وضعیت قرار است در برابر چشم خواننده تغییر کند، قرار می‌دهد.'
