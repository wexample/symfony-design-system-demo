ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Прогресс
  page_icon: 'ph:bold/gauge'
  intro: 'Насколько далеко продвинулось что-то, выраженное в виде отношения между 0 и 1 в пользовательском свойстве — так же, как статусный круг отображает свой сектор, обе стороны стека заполняют полосу одним утверждением. Twig выводит значение, которое ему дано; перемещение его впоследствии — это дело браузера.'
  section:
    default:
      title: Состояния
      description: 'Значение — это количество или доля, выраженная в процентах, и оно никогда не выходит за свои пределы. Цвет — это цвет обратной связи, поэтому полоса показывает, как закончилась ее работа на том же языке, что и сообщение или статус.'
    plain:
      title: 'Без итога'
      description: 'Сотня — это то, к чему стремится полоса, если никто не говорит иначе, что делает процент единственным показателем. Собственный итог нужен для работы, подсчитываемой в вещах, а не в частях.'
    indeterminate:
      title: 'Конец, который неизвестен'
      description: 'Работа в процессе, размер которой никто не знает: полоса движется и не показывает числа. Утверждать долю здесь было бы предположением, замаскированным под измерение.'
    compact:
      title: Компактный
      description: 'Сокращено до необходимого, для строки состояния или подвала: более тонкая дорожка, текст рядом с ней, а не над ней, и плотность передана тому, что стоит рядом.'
    vue:
      title: 'Vue, управляемый'
      description: 'Та же полоса, с лексикой, которую уже использует cli progress — обновление, продвижение, завершение, сброс. Шаг, о котором ничего не сказано, стоит одну единицу, что и означает, когда ни единица, ни итог ничего не значат.'
  bar:
    queued: 'В очереди'
    working: 'Создание ресурсов'
    almost: Загрузка
    done: Развернуто
    failed: 'Ошибка миграции'
    counted: 'Файлы прочитаны'
    unknown: 'Ищем что-то'
    indexing: Индексация
  compact:
    app: acme-блог

th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ความก้าวหน้า
  page_icon: 'ph:bold/gauge'
  intro: 'ระยะทางที่บางสิ่งได้รับการดำเนินการ โดยแสดงเป็นอัตราส่วนระหว่าง 0 ถึง 1 ในคุณสมบัติที่กำหนดเอง — เช่นเดียวกับที่วงกลมสถานะแสดงอาร์คของมัน ดังนั้นทั้งสองด้านของสแต็กจึงเติมบาร์ด้วยการประกาศเดียว Twig จะแสดงค่าที่ได้รับ; การเคลื่อนที่หลังจากนั้นเป็นเรื่องของเบราว์เซอร์.'
  section:
    default:
      title: สถานะ
      description: 'ค่าคือจำนวนหรือตัวแบ่งที่เขียนเป็นเปอร์เซ็นต์ และไม่เคยตอบนอกเหนือจากขอบเขตของมัน สีคือการตอบกลับ ดังนั้นบาร์จึงบอกถึงวิธีที่งานของมันสิ้นสุดในภาษาเดียวกับข้อความหรือสถานะ.'
    plain:
      title: ไม่มีรวมทั้งหมด
      description: 'หนึ่งร้อยคือจำนวนที่บาร์นับเมื่อไม่มีใครบอกเป็นอย่างอื่น ซึ่งทำให้เปอร์เซ็นต์เป็นสิ่งเดียวที่ให้มัน รวมทั้งหมดของมันเองคือการนับในสิ่งต่าง ๆ แทนที่จะเป็นในส่วน.'
    indeterminate:
      title: จบที่ไม่รู้
      description: 'งานที่กำลังดำเนินการซึ่งขนาดไม่มีใครรู้: บาร์จะเคลื่อนที่และบอกว่าไม่มีหมายเลข การเรียกร้องส่วนที่นี่จะเป็นการเดาที่แต่งตัวเป็นการวัดผล.'
    compact:
      title: กะทัดรัด
      description: 'ลดลงเป็นสิ่งที่ต้องพูด สำหรับบรรทัดสถานะหรือฟุตเตอร์: เส้นทางที่บางลง คำพูดอยู่ข้างๆ แทนที่จะอยู่ด้านบน และความหนาแน่นที่ส่งต่อไปยังสิ่งที่ยืนอยู่กับมัน.'
    vue:
      title: 'Vue, ขับเคลื่อน'
      description: 'บาร์เดียวกันกับคำศัพท์ที่ cli progress พูดอยู่แล้ว — อัปเดต, ก้าวหน้า, เสร็จสิ้น, รีเซ็ต ขั้นตอนที่ไม่มีการพูดถึงมีค่าเท่ากับหนึ่งหน่วย ซึ่งคือสิ่งที่เรียกว่าที่ซึ่งทั้งหน่วยและรวมทั้งหมดไม่มีความหมาย.'
  bar:
    queued: อยู่ในคิว
    working: กำลังสร้างสินทรัพย์
    almost: กำลังอัปโหลด
    done: ถูกนำไปใช้งาน
    failed: การโยกย้ายล้มเหลว
