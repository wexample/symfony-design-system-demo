hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: प्रगति
  page_icon: 'ph:bold/gauge'
  intro: 'कुछ कितनी दूर पहुंचा है, इसे एक कस्टम प्रॉपर्टी में 0 और 1 के बीच के अनुपात के रूप में दर्शाया गया है - जैसे स्थिति वृत्त अपने आर्क को ले जाता है, वैसे ही स्टैक के दोनों पक्ष एक घोषणा के साथ बार को भरते हैं। Twig उसे दिया गया मान प्रिंट करता है; इसके बाद इसे हिलाना ब्राउज़र का काम है।'
  section:
    default:
      title: स्थितियाँ
      description: 'मान एक गणना या शेयर है जिसे प्रतिशत के रूप में लिखा जाता है, और कभी भी इसके सीमाओं के बाहर उत्तर नहीं देता। रंग प्रतिक्रिया वाला है, इसलिए एक बार बताता है कि इसका कार्य उसी भाषा में कैसे समाप्त हुआ है जैसे एक संदेश या स्थिति।'
    plain:
      title: 'कुल के बिना'
      description: 'एक सौ उस संख्या तक है जिसे एक बार गिनता है जब कोई और कुछ नहीं कहता, जो इसे देने के लिए एकमात्र चीज बनाता है। इसका अपना एक कुल उन कार्यों के लिए है जो चीजों में गिनती होती हैं न कि भागों में।'
    indeterminate:
      title: 'एक अंत जो ज्ञात नहीं है'
      description: 'कार्य प्रगति पर है जिसका आकार कोई नहीं जानता: बार सफाई करता है और कोई संख्या नहीं बताता। यहां एक शेयर का दावा करना एक माप के रूप में एक अनुमान होगा।'
    compact:
      title: संक्षिप्त
      description: 'जो कहना है उसमें संकुचित, एक स्थिति पंक्ति या फुटर के लिए: एक पतली पट्टी, उसके पास शब्दों का होना बजाय ऊपर, और घनत्व को उस किसी के साथ पास करना जो इसके साथ खड़ा है।'
    vue:
      title: 'Vue, संचालित'
      description: 'उसी बार, जिस शब्दावली के साथ cli प्रगति पहले से ही बोलता है - अपडेट, प्रगति, समाप्त, रीसेट। एक कदम जिसका कुछ नहीं कहा गया है वह एक इकाई के लायक है, जिसे तब माना जाता है जहां न तो इकाई और न ही कुल का कोई अर्थ है।'
  bar:
