en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Progress
  page_icon: ph:bold/gauge

  intro: "How far something has got, carried as a ratio between 0 and 1 in a custom property — the same way the status circle carries its arc, so both sides of the stack fill the bar with one declaration. Twig prints the value it is given; moving it afterwards is the browser's business."

  section:
    default:
      title: States
      description: "The value is a count or a share written as a percentage, and never answers outside its bounds. The colour is the feedback one, so a bar says how its work ended in the same language as a message or a status."
    plain:
      title: Without a total
      description: "A hundred is what a bar counts to when nobody says otherwise, which makes a percentage the only thing to give it. A total of its own is for work counted in things rather than in parts."
    indeterminate:
      title: An end that is not known
      description: "Work under way whose size nobody knows: the bar sweeps and says no number. Claiming a share here would be a guess dressed as a measurement."
    compact:
      title: Compact
      description: "Reduced to what it has to say, for a status line or a footer: a thinner track, the wording beside it rather than above, and the density passed on to whatever stands with it."
    vue:
      title: Vue, driven
      description: "The same bar, with the vocabulary the cli progress already speaks — update, advance, finish, reset. A step with nothing said about it is worth one unit, which is what to call where neither the unit nor the total means anything."

  bar:
    queued: Queued
    working: Building assets
    almost: Uploading
    done: Deployed
    failed: Migration failed
    counted: Files read
    unknown: Looking for something
    indexing: Indexing

  compact:
    app: acme-blog

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: التقدم
  page_icon: 'ph:bold/gauge'
  intro: 'مدى تقدم شيء ما، محمول كنسبة بين 0 و 1 في خاصية مخصصة - بنفس الطريقة التي يحمل بها دائرة الحالة قوسها، بحيث تملأ الجهتان من المكدس الشريط بإعلان واحد. تطبع Twig القيمة المعطاة لها؛ وتحريكها بعد ذلك هو من شأن المتصفح.'
  section:
    default:
      title: الحالات
      description: 'القيمة هي عدد أو حصة مكتوبة كنسبة مئوية، ولا تجيب أبداً خارج حدودها. اللون هو لون التغذية الراجعة، لذا فإن الشريط يوضح كيف انتهى عمله بنفس لغة رسالة أو حالة.'
    plain:
      title: 'بدون إجمالي'
      description: 'مئة هي ما يعده الشريط عندما لا يقول أحد خلاف ذلك، مما يجعل النسبة المئوية هي الشيء الوحيد الذي يمنحه. مجموع خاص به هو للعمل الذي يتم عدّه في الأشياء بدلاً من الأجزاء.'
    indeterminate:
      title: 'نهاية غير معروفة'
      description: 'عمل جارٍ لا يعرف أحد حجمه: يشير الشريط ولا يقول عددًا. المطالبة بحصة هنا ستكون تخمينًا مُتَزَيِّنًا كقياس.'
    compact:
      title: مضغوط
      description: 'مُختَصَر لما يجب أن يقوله، لخط حالة أو تذييل: مسار أرفع، النص بجانبه بدلاً من فوقه، والكثافة تُنقل إلى ما يقف معه.'
    vue:
      title: 'Vue، مدفوع'
      description: 'نفس الشريط، مع المفردات التي تتحدث بها تقدم cli بالفعل - تحديث، تقدم، إنهاء، إعادة تعيين. خطوة لم يُقال عنها شيء تستحق وحدة واحدة، وهي ما يسمى حيث لا تعني الوحدة ولا الإجمالي شيئًا.'
  bar:
    queued: 'في الانتظار'
    working: 'بناء الأصول'
    almost: 'يتم التحميل'
    done: 'تم النشر'
    failed: 'فشل النقل'
    counted: 'الملفات المقروءة'
    unknown: 'البحث عن شيء ما'
    indexing: 'يتم الفهرسة'
  compact:
    app: acme-blog

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: অগ্রগতি
  page_icon: 'ph:bold/gauge'
  intro: 'কিছু একটি কতদূর এগিয়েছে তা 0 এবং 1 এর মধ্যে একটি অনুপাত হিসেবে প্রকাশিত হয় — যেভাবে স্টেটাস সার্কেল তার আর্ক বহন করে, সেভাবেই স্ট্যাকের দুই পাশে বারটি একটি ঘোষণার মাধ্যমে পূর্ণ হয়। Twig যে মানটি পায় তা মুদ্রণ করে; পরে এটি স্থানান্তর করা ব্রাউজারের কাজ।'
  section:
    default:
      title: অবস্থা
      description: 'মানটি একটি গণনা বা শেয়ার যা শতাংশ হিসেবে লেখা হয়, এবং কখনো তার সীমার বাইরে উত্তর দেয় না। রঙটি প্রতিক্রিয়ার রঙ, তাই একটি বার তার কাজ কিভাবে শেষ হয়েছে তা একটি বার্তা বা স্ট্যাটাসের একই ভাষায় বলে।'
    plain:
      title: 'মোট ছাড়া'
      description: 'একশো হল একটি বার কতদূর গণনা করে যখন কেউ অন্যথায় কিছু বলে না, যা একটি শতাংশকে একমাত্র বিষয় করে তোলে। এর নিজস্ব মোট হচ্ছে সেই কাজ যা বিষয় হিসাবে গণনা করা হয় অংশ হিসাবে নয়।'
    indeterminate:
      title: 'একটি শেষ যা জানা নেই'
      description: 'চলমান কাজ যার আকার কেউ জানে না: বারটি সাফ করে এবং কোনো সংখ্যা বলে না। এখানে একটি শেয়ার দাবি করা একটি পরিমাপ হিসাবে সাজানো একটি অনুমান।'
    compact:
      title: কম্প্যাক্ট
      description: 'যা বলার প্রয়োজন তা কমিয়ে আনা, একটি স্ট্যাটাস লাইন বা ফুটারে: একটি পাতলা ট্র্যাক, এর পাশে লেখাটি উপরে না থেকে, এবং ঘনত্ব যা কিছু তার সাথে দাঁড়িয়ে আছে তা স্থানান্তরিত হয়।'
    vue:
      title: 'ভিউ, চালিত'
      description: 'একই বার, cli প্রগ্রেস ইতিমধ্যেই যে শব্দভান্ডার কথা বলে — আপডেট, অগ্রসর, সম্পন্ন, রিসেট। একটি পদ যা সম্পর্কে কিছু বলা হয়নি তা একক হিসাবে মূল্যবান, যা হল যেখানে না ইউনিট এবং মোটের কিছু মান নেই।'
  bar:
    queued: কিউতে
    working: 'সম্পদ তৈরি করছে'
    almost: 'আপলোড হচ্ছে'
    done: 'মোতায়েন করা হয়েছে'
    failed: 'মাইগ্রেশন ব্যর্থ'
    counted: 'ফাইল পড়া হয়েছে'
    unknown: 'কিছু খুঁজছি'
    indexing: ইন্ডেক্সিং
  compact:
    app: acme-blog

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Fortschritt
  page_icon: 'ph:bold/gauge'
  intro: 'Wie weit etwas fortgeschritten ist, dargestellt als Verhältnis zwischen 0 und 1 in einer benutzerdefinierten Eigenschaft – genauso wie der Statuskreis seinen Bogen trägt, füllen beide Seiten des Stapels die Leiste mit einer Erklärung. Twig gibt den Wert aus, den es erhält; ihn danach zu bewegen, ist das Geschäft des Browsers.'
  section:
    default:
      title: Zustände
      description: 'Der Wert ist eine Anzahl oder ein Anteil, der als Prozentsatz geschrieben ist, und beantwortet niemals außerhalb seiner Grenzen. Die Farbe ist die Feedbackfarbe, sodass eine Leiste anzeigt, wie ihre Arbeit in derselben Sprache wie eine Nachricht oder ein Status beendet wurde.'
    plain:
      title: 'Ohne Gesamt'
      description: 'Hundert ist das, was eine Leiste zählt, wenn niemand etwas anderes sagt, was macht, dass ein Prozentsatz das einzige ist, was es gibt. Ein eigenes Total ist für Arbeit, die in Dingen und nicht in Teilen gezählt wird.'
    indeterminate:
      title: 'Ein Ende, das nicht bekannt ist'
      description: 'Arbeit im Gange, deren Größe niemand kennt: die Leiste sweeped und sagt keine Zahl. Ein Anteil hier zu beanspruchen, wäre eine Vermutung, die als Messung verkleidet ist.'
    compact:
      title: Kompakt
      description: 'Reduziert auf das, was es sagen muss, für eine Statuszeile oder einen Fußbereich: eine dünnere Spur, die Formulierung daneben statt darüber und die Dichte, die an das weitergegeben wird, was damit steht.'
    vue:
      title: 'Vue, gesteuert'
      description: 'Die gleiche Leiste, mit dem Vokabular, das der CLI-Fortschritt bereits spricht – aktualisieren, vorankommen, beenden, zurücksetzen. Ein Schritt, über den nichts gesagt wird, zählt als eine Einheit, was zu nennen ist, wenn weder die Einheit noch das Gesamt etwas bedeuten.'
  bar:
    queued: 'In der Warteschlange'
    working: 'Assets werden erstellt'
    almost: Hochladen
    done: Bereitgestellt
    failed: 'Migration fehlgeschlagen'
    counted: 'Dateien gelesen'
    unknown: 'Suche nach etwas'
    indexing: Indizieren
  compact:
    app: acme-blog

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Progreso
  page_icon: 'ph:bold/gauge'
  intro: 'Qué tan lejos ha llegado algo, expresado como una proporción entre 0 y 1 en una propiedad personalizada; de la misma manera que el círculo de estado lleva su arco, así ambos lados de la pila llenan la barra con una declaración. Twig imprime el valor que se le da; moverlo después es cosa del navegador.'
  section:
    default:
      title: Estados
      description: 'El valor es un conteo o una parte expresada como un porcentaje, y nunca responde fuera de sus límites. El color es el feedback, así que una barra dice cómo terminó su trabajo en el mismo lenguaje que un mensaje o un estado.'
    plain:
      title: 'Sin un total'
      description: 'Cien es lo que cuenta una barra cuando nadie dice lo contrario, lo que hace que un porcentaje sea lo único que puede darle. Un total propio es para trabajos contados en cosas en lugar de en partes.'
    indeterminate:
      title: 'Un fin que no se conoce'
      description: 'Trabajo en curso cuyo tamaño nadie conoce: la barra se desplaza y no dice ningún número. Reclamar una parte aquí sería una suposición disfrazada de medición.'
    compact:
      title: Compacto
      description: 'Reducido a lo que tiene que decir, para una línea de estado o un pie de página: una pista más delgada, la redacción al lado en lugar de arriba, y la densidad transmitida a lo que lo acompaña.'
    vue:
      title: 'Vue, impulsado'
      description: 'La misma barra, con el vocabulario que ya habla el progreso de cli — actualizar, avanzar, terminar, reiniciar. Un paso sin nada dicho al respecto vale una unidad, que es lo que se llama donde ni la unidad ni el total significan nada.'
  bar:
    queued: 'En cola'
    working: 'Construyendo activos'
    almost: Subiendo
    done: Desplegado
    failed: 'La migración falló'
    counted: 'Archivos leídos'
    unknown: 'Buscando algo'
    indexing: Indexando
  compact:
    app: acme-blog

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: پیشرفت
  page_icon: 'ph:bold/gauge'
  intro: 'نشان‌دهنده میزان پیشرفت یک کار است که به صورت نسبتی بین ۰ و ۱ در یک ویژگی سفارشی نمایش داده می‌شود — به همان شیوه‌ای که دایره وضعیت قوس خود را نمایش می‌دهد، بنابراین هر دو سمت استک نوار را با یک اعلام پر می‌کنند. Twig مقداری را که به آن داده شده چاپ می‌کند؛ جابجایی آن بعداً مربوط به مرورگر است.'
  section:
    default:
      title: وضعیت‌ها
      description: 'مقدار یک شمارش یا سهم است که به صورت درصد نوشته شده و هرگز خارج از حدود خود پاسخ نمی‌دهد. رنگ آن رنگ بازخورد است، بنابراین یک نوار می‌گوید کارش چگونه به پایان رسید به همان زبانی که یک پیام یا وضعیت.'
    plain:
      title: 'بدون مجموع'
      description: 'صد است که یک نوار به آن می‌رسد تا زمانی که کسی چیز دیگری نگفته باشد، که باعث می‌شود درصد تنها چیزی باشد که می‌تواند به آن بدهد. مجموع خود به‌خودی برای کارهایی است که به صورت چیزها شمارش می‌شوند نه به صورت قطعات.'
    indeterminate:
      title: 'پایانی که مشخص نیست'
      description: 'کار در حال انجام که هیچ‌کس اندازه آن را نمی‌داند: نوار جابجا می‌شود و هیچ عددی نمی‌گوید. ادعای سهم در اینجا فقط یک حدس است که به عنوان یک اندازه‌گیری پوشانده شده است.'
    compact:
      title: 'جمع و جور'
      description: 'کاهش یافته به آنچه که باید بگوید، برای یک خط وضعیت یا یک پاورقی: نوار باریک‌تر، نوشته در کنار آن به جای بالای آن، و چگالی منتقل شده به هر چیزی که در کنار آن قرار دارد.'
    vue:
      title: 'Vue، هدایت شده'
      description: 'همان نوار، با واژگانی که پیشرفت cli قبلاً صحبت می‌کند — به‌روزرسانی، پیشرفت، اتمام، بازنشانی. یک قدم که هیچ چیزی درباره آن گفته نشده است، معادل یک واحد است، که باید نامید جایی که نه واحد و نه مجموع معنایی ندارد.'
  bar:
    queued: 'در صف'
    working: 'ساخت دارایی‌ها'
    almost: 'در حال بارگذاری'
    done: 'پیاده‌سازی شده'
    failed: 'مهاجرت ناموفق'
    counted: 'فایل‌ها خوانده شده'
    unknown: 'در حال جستجوی چیزی'
    indexing: نمایه‌سازی
  compact:
    app: acme-blog

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Edistyminen
  page_icon: 'ph:bold/gauge'
  intro: 'Kuinka pitkälle jokin on edennyt, ilmaistuna suhteena 0 ja 1 mukautetussa ominaisuudessa — samalla tavalla kuin tilapiiri kantaa kaarensa, niin myös pinon molemmat puolet täyttävät palkin yhdellä ilmoituksella. Twig tulostaa sille annetun arvon; sen siirtäminen jälkeenpäin on selaimen asia.'
  section:
    default:
      title: Tilat
      description: 'Arvo on lukumäärä tai osuus prosentteina, eikä koskaan ylitä rajojaan. Väri on palautteen väri, joten palkki kertoo, kuinka sen työ päättyi samalla kielellä kuin viesti tai tila.'
    plain:
      title: 'Ilman kokonaissummaa'
      description: 'Sata on se, mihin palkki laskee, ellei toisin sanota, mikä tekee prosentista ainoan asian, joka sen voi antaa. Omaa kokonaissummaa tarvitaan työlle, joka lasketaan asioina eikä osina.'
    indeterminate:
      title: 'Loppua ei tiedetä'
      description: 'Käynnissä oleva työ, jonka kokoa kukaan ei tiedä: palkki liikkuu ja ei ilmoita mitään numeroa. Osuuden vaatiminen tässä olisi arvio, joka on pukeutunut mittaukseen.'
    compact:
      title: Kompakti
      description: 'Vähennetty siihen, mitä sen on sanottava, tilariville tai alatunnisteeseen: ohuempi rata, sanamuoto sen vieressä sen sijaan, että se olisi ylhäällä, ja tiheys siirtyy siihen, mikä seisoo sen kanssa.'
    vue:
      title: 'Vue, ohjattu'
      description: 'Sama palkki, sanastolla, jota cli edistyminen jo puhuu — päivitä, etene, valmiina, nollaa. Askel, josta ei sanota mitään, on arvoltaan yksi yksikkö, mikä on se, mitä kutsua, kun sekä yksikkö että kokonaisuus eivät merkitse mitään.'
  bar:
    queued: Jonossa
    working: 'Rakennetaan resursseja'
    almost: Lähetetään
    done: Odotettu
    failed: 'Siirto epäonnistui'
    counted: 'Tiedostoja luettu'
    unknown: 'Etsitään jotakin'
    indexing: Indeksoidaan
  compact:
    app: acme-blog

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Progrès
  page_icon: 'ph:bold/gauge'
  intro: 'À quel point quelque chose a progressé, exprimé comme un ratio entre 0 et 1 dans une propriété personnalisée — de la même manière que le cercle de statut porte son arc, les deux côtés de la pile remplissent la barre avec une déclaration. Twig imprime la valeur qui lui est donnée ; la déplacer par la suite relève de la responsabilité du navigateur.'
  section:
    default:
      title: États
      description: "La valeur est un compte ou une part écrite sous forme de pourcentage, et ne répond jamais en dehors de ses limites. La couleur est celle du retour d'information, donc une barre indique comment son travail s'est terminé dans le même langage qu'un message ou un statut."
    plain:
      title: 'Sans total'
      description: "Une centaine est ce que compte une barre quand personne ne dit le contraire, ce qui rend un pourcentage la seule chose à lui donner. Un total propre est pour un travail compté en choses plutôt qu'en parties."
    indeterminate:
      title: "Une fin qui n'est pas connue"
      description: 'Travail en cours dont la taille est inconnue : la barre balaye et ne dit aucun nombre. Revendiquer une part ici serait une estimation déguisée en mesure.'
    compact:
      title: Compact
      description: "Réduit à ce qu'il a à dire, pour une ligne de statut ou un pied de page : une piste plus fine, la formulation à côté plutôt qu'au-dessus, et la densité transmise à tout ce qui se tient avec elle."
    vue:
      title: 'Vue, pilotée'
      description: "La même barre, avec le vocabulaire que le progrès cli parle déjà — mise à jour, avancée, finition, réinitialisation. Un pas sans rien à dire vaut une unité, ce qui est à appeler là où ni l'unité ni le total ne signifient quoi que ce soit."
  bar:
    queued: 'En attente'
    working: 'Construction des ressources'
    almost: Téléchargement
    done: Déployé
    failed: 'Échec de la migration'
    counted: 'Fichiers lus'
    unknown: 'Recherche de quelque chose'
    indexing: Indexation
  compact:
    app: acme-blog

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: התקדמות
  page_icon: 'ph:bold/gauge'
  intro: 'כמה רחוק משהו הגיע, נישא יחסית בין 0 ל-1 בנכס מותאם אישית — באותה צורה שסircle הסטטוס נושאת את הקשת שלה, כך ששני הצדדים של הערימה ממלאים את הסרגל עם הצהרה אחת. Twig מדפיסה את הערך שניתן לה; להזיז אותו לאחר מכן זה עניין של הדפדפן.'
  section:
    default:
      title: מצבים
      description: 'הערך הוא ספירה או נתח שנכתבים כאחוז, ולא עונה אף פעם מחוץ לגבולותיו. הצבע הוא צבע המשוב, כך שסְרָג אומר איך העבודה שלו הסתיימה באותה שפה כמו הודעה או מצב.'
    plain:
      title: 'בלי סך הכל'
      description: 'מאה זה מה שסְרָג סופר כאשר אף אחד לא אומר אחרת, מה שהופך את האחוז לדבר היחיד שיכול לתת לו. סך הכל משלו הוא עבור עבודה שנמדדת בדברים ולא בחלקים.'
    indeterminate:
      title: 'סוף שאינו ידוע'
      description: 'עבודה בעיצומה שמידותיה אינן ידועות: הסְרָג סוקר ואומר שאין מספר. לטעון נתח כאן יהיה ניחוש המלביש את עצמו כמדידה.'
    compact:
      title: קומפקטי
      description: 'מצומצם למה שיש לו לומר, עבור שורת מצב או כותרת תחתונה: מסלול דק יותר, המילים לצידו במקום מעל, והצפיפות מועברת לכל מה שעומד לצידו.'
    vue:
      title: 'Vue, מונע'
      description: 'אותו סְרָג, עם הלקסיקון שההתקדמות של CLI כבר מדברת — עדכון, התקדמות, סיום, אפס. שלב שללא דבר שנאמר עליו שווה יחידה אחת, שזה מה שכדאי לקרוא היכן לא היחידה ולא הסך הכל משמעותיים.'
