vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Tiến độ'
  page_icon: 'ph:bold/gauge'
  intro: 'Mức độ tiến triển của một cái gì đó, được biểu thị dưới dạng tỷ lệ giữa 0 và 1 trong một thuộc tính tùy chỉnh — giống như vòng tròn trạng thái mang theo cung của nó, cả hai bên của ngăn xếp lấp đầy thanh với một tuyên bố. Twig in giá trị mà nó nhận được; việc di chuyển sau đó là việc của trình duyệt.'
  section:
    default:
      title: 'Trạng thái'
      description: 'Giá trị là một số đếm hoặc một phần được viết dưới dạng phần trăm, và không bao giờ phản hồi ngoài giới hạn của nó. Màu sắc là phản hồi, vì vậy một thanh cho biết công việc của nó kết thúc như thế nào bằng ngôn ngữ giống như một thông điệp hoặc một trạng thái.'
    plain:
      title: 'Không có tổng số'
      description: 'Một trăm là số mà một thanh đếm đến khi không ai nói khác, điều này làm cho phần trăm trở thành thứ duy nhất để cung cấp cho nó. Một tổng số của riêng nó là cho công việc được đếm bằng thứ chứ không phải bằng phần.'
    indeterminate:
      title: 'Một kết thúc không biết'
      description: 'Công việc đang diễn ra mà kích thước không ai biết: thanh quét và không đưa ra số nào. Khẳng định một phần ở đây sẽ là một dự đoán được khoác lên như một phép đo.'
    compact:
      title: 'Gọn gàng'
      description: 'Giảm xuống những gì nó cần nói, cho một dòng trạng thái hoặc một chân trang: một đường ray mỏng hơn, từ ngữ bên cạnh nó thay vì bên trên, và độ dày truyền lại cho bất cứ điều gì đứng cùng nó.'
    vue:
      title: 'Vue, điều khiển'
      description: 'Cùng một thanh, với từ vựng mà tiến trình cli đã nói — cập nhật, tiến lên, hoàn thành, đặt lại. Một bước với không có gì được nói về nó có giá trị một đơn vị, đó là điều để gọi nơi mà cả đơn vị và tổng số đều không có nghĩa gì.'
  bar:
    queued: 'Đang chờ'
    working: 'Đang xây dựng tài nguyên'
    almost: 'Đang tải lên'
    done: 'Đã triển khai'
    failed: 'Di chuyển không thành công'
    counted: 'Tệp đã đọc'
    unknown: 'Đang tìm kiếm cái gì đó'
    indexing: 'Đang lập chỉ mục'
  compact:
    app: acme-blog

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 进度
  page_icon: 'ph:bold/gauge'
  intro: '某物进展的程度，以 0 和 1 之间的比率在自定义属性中表示——就像状态圆圈承载其弧线一样，因此堆栈的两侧用一个声明填充条。Twig 打印它所给的值；之后移动它是浏览器的事。'
  section:
    default:
      title: 状态
      description: 该值是以百分比形式写出的计数或份额，并且永远不会超出其范围。颜色是反馈色，因此条形图用与消息或状态相同的语言说明其工作结束的情况。
    plain:
      title: 没有总数
      description: 当没有其他说明时，条形图计数到一百，这使得百分比成为唯一的指标。它自己的总数适用于以物品而不是部分计数的工作。
    indeterminate:
      title: 未知的结束
      description: 正在进行的工作，其大小无人知晓：条形图扫过并不显示数字。在这里声称份额将是伪装成测量的猜测。
    compact:
      title: 紧凑
      description: 缩减至必须传达的内容，适用于状态行或页脚：更细的轨迹，文字旁边而不是上方，密度传递给与之并存的内容。
    vue:
      title: Vue，驱动
      description: '相同的条形图，使用 cli 进度已经使用的词汇——更新、前进、完成、重置。没有说明的步骤值为一个单位，这就是称之为当单位和总数都没有意义的地方。'
  bar:
    queued: 排队中
    working: 构建资产
    almost: 上传中
    done: 已部署
    failed: 迁移失败
    counted: 已读取文件
    unknown: 正在寻找某物
    indexing: 索引中
  compact:
    app: acme-blog
