id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Progres
  page_icon: 'ph:bold/gauge'
  intro: 'Seberapa jauh sesuatu telah berjalan, dibawa sebagai rasio antara 0 dan 1 dalam properti kustom — seperti halnya lingkaran status membawa busurnya, sehingga kedua sisi tumpukan mengisi bilah dengan satu deklarasi. Twig mencetak nilai yang diberikan; memindahkannya setelahnya adalah urusan browser.'
  section:
    default:
      title: Status
      description: 'Nilai adalah hitungan atau bagian yang dituliskan sebagai persentase, dan tidak pernah menjawab di luar batasnya. Warna adalah umpan balik, sehingga bilah menunjukkan bagaimana pekerjaannya berakhir dalam bahasa yang sama dengan pesan atau status.'
    plain:
      title: 'Tanpa total'
      description: 'Seratus adalah apa yang dihitung oleh bilah ketika tidak ada yang mengatakan sebaliknya, yang menjadikan persentase satu-satunya hal yang memberikannya. Totalnya sendiri adalah untuk pekerjaan yang dihitung dalam hal-hal daripada dalam bagian.'
    indeterminate:
      title: 'Akhir yang tidak diketahui'
      description: 'Pekerjaan yang sedang berlangsung yang ukurannya tidak diketahui: bilah bergerak dan tidak menunjukkan angka. Mengklaim bagian di sini akan menjadi tebakan yang berpura-pura sebagai pengukuran.'
    compact:
      title: Kompak
      description: 'Dikurangi menjadi apa yang harus dikatakannya, untuk garis status atau footer: trek yang lebih tipis, kata-kata di sampingnya daripada di atas, dan kepadatan diteruskan ke apa pun yang berdiri bersamanya.'
    vue:
      title: 'Vue, didorong'
      description: 'Bilah yang sama, dengan kosakata yang sudah dibicarakan oleh kemajuan cli — memperbarui, maju, selesai, reset. Satu langkah yang tidak disebutkan berarti satu unit, yang merupakan apa yang harus disebut di mana baik unit maupun total tidak berarti apa-apa.'
  bar:
    queued: Antrian
    working: 'Membangun aset'
    almost: Mengunggah
    done: Diterapkan
    failed: 'Migrasi gagal'
    counted: 'Berkas dibaca'
    unknown: 'Mencari sesuatu'
    indexing: Mengindeks
  compact:
    app: acme-blog

it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Progresso
  page_icon: 'ph:bold/gauge'
  intro: 'Quanto lontano è arrivato qualcosa, rappresentato come un rapporto tra 0 e 1 in una proprietà personalizzata — proprio come il cerchio di stato porta il suo arco, così entrambi i lati dello stack riempiono la barra con una dichiarazione. Twig stampa il valore che gli viene dato; spostarlo dopo è compito del browser.'
  section:
    default:
      title: Stati
      description: 'Il valore è un conteggio o una quota espressa come percentuale, e non risponde mai al di fuori dei suoi limiti. Il colore è quello del feedback, quindi una barra indica come è terminato il suo lavoro nello stesso linguaggio di un messaggio o di uno stato.'
    plain:
      title: 'Senza un totale'
      description: "Cento è ciò a cui conta una barra quando nessuno dice diversamente, il che rende una percentuale l'unica cosa in grado di darle un senso. Un totale proprio è per lavori conteggiati in cose piuttosto che in parti."
    indeterminate:
      title: 'Una fine che non è nota'
      description: "Lavoro in corso di cui nessuno conosce l'ampiezza: la barra si muove e non indica alcun numero. Rivendicare una quota qui sarebbe una stima travestita da misurazione."
    compact:
      title: Compatto
      description: 'Ridotto a ciò che deve dire, per una linea di stato o un piè di pagina: una traccia più sottile, la dicitura accanto piuttosto che sopra, e la densità trasferita a qualsiasi cosa si trovi con essa.'
    vue:
      title: 'Vue, guidata'
      description: "La stessa barra, con il vocabolario che il progresso della cli già parla — aggiorna, avanza, finisce, ripristina. Un passo senza nulla detto a riguardo vale un'unità, che è ciò che si chiama dove né l'unità né il totale significano qualcosa."
  bar:
    queued: 'In coda'
    working: 'Costruendo risorse'
    almost: 'Caricamento in corso'
    done: Distribuito
    failed: 'Migrazione fallita'
    counted: 'File letti'
    unknown: 'In cerca di qualcosa'
    indexing: Indicizzazione
  compact:
    app: acme-blog

ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 進捗
  page_icon: 'ph:bold/gauge'
  intro: 何かがどれくらい進んだかを0から1の比率で示すカスタムプロパティとして表現されます。ステータスサークルがその弧を持つのと同様に、スタックの両側は1つの宣言でバーを満たします。Twigは渡された値を表示し、その後の移動はブラウザの仕事です。
  section:
    default:
      title: 状態
      description: その値はカウントまたはシェアで、パーセンテージとして書かれ、境界外で回答することはありません。色はフィードバックのもので、バーは作業の結果をメッセージやステータスと同じ言語で示します。
    plain:
      title: 合計なし
      description: 誰も異なることを言わない限り、バーは100までカウントし、パーセンテージだけがそれを与えるものです。自身の合計は、部分ではなく物のカウントに対しての作業に対してのものです。
    indeterminate:
      title: 終わりがわからない
      description: サイズが誰にもわからない進行中の作業：バーはスイープし、数字を示しません。ここでのシェアを主張することは、測定として装った推測に過ぎません。
    compact:
      title: コンパクト
      description: 伝えるべきことに絞り、ステータスラインやフッター用：トラックを細くし、その横に文言を置き、密度をそれに寄り添うものへと引き継ぎます。
    vue:
      title: Vue、駆動
      description: '同じバーで、cliの進捗が既に話す語彙 — 更新、進行、完了、リセット。何も言われていないステップは1ユニットの価値があり、ユニットも合計も意味を持たない場所を指します。'
  bar:
    queued: キューに入っている
    working: アセットを構築中
    almost: アップロード中
    done: デプロイ済み
    failed: マイグレーション失敗
    counted: 読み取ったファイル
    unknown: 何かを探しています
    indexing: インデックス作成中
  compact:
    app: acme-blog

ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: '진행 상황'
  page_icon: 'ph:bold/gauge'
  intro: '어떤 것이 0과 1 사이의 비율로 진행된 정도 — 상태 원이 호를 나타내는 방식과 마찬가지로, 두 쪽의 스택이 하나의 선언으로 막대를 채웁니다. Twig는 주어진 값을 출력하며, 이후 이동은 브라우저의 몫입니다.'
  section:
    default:
      title: 상태
      description: '값은 백분율로 작성된 카운트 또는 비율이며, 그 한계를 벗어난 대답은 하지 않습니다. 색상은 피드백 색상으로, 막대는 메시지나 상태와 같은 언어로 작업의 결과를 나타냅니다.'
    plain:
      title: '총계 없이'
      description: '누군가 다르게 말하지 않는다면 막대는 백을 세며, 백분율이 유일한 기준이 됩니다. 고유한 총계는 부분이 아닌 개수로 세는 작업을 위해 존재합니다.'
    indeterminate:
      title: '알려지지 않은 끝'
      description: '크기가 알려지지 않은 진행 중인 작업: 막대는 스윕하고 숫자를 표시하지 않습니다. 여기서 비율을 주장하는 것은 측정으로 가장한 추측입니다.'
    compact:
      title: 간결하게
      description: '상태 라인이나 바닥글을 위해 필요한 내용으로 축소됨: 더 얇은 트랙, 그 옆에 있는 문구, 그리고 밀도는 함께 있는 것에 전달됩니다.'
    vue:
      title: 'Vue, 주도'
      description: 'CLI 진행에서 이미 사용되는 어휘를 가진 동일한 막대 — 업데이트, 진행, 완료, 재설정. 아무것도 언급되지 않은 단계는 하나의 단위의 가치가 있으며, 그 단위나 총계가 의미가 없을 때를 지칭합니다.'
  bar:
    queued: '대기 중'
    working: '자산 빌드 중'
    almost: '업로드 중'
    done: '배포 완료'
    failed: '마이그레이션 실패'
    counted: '파일 읽음'
    unknown: '무언가를 찾는 중'
    indexing: '인덱싱 중'
  compact:
    app: acme-blog

nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Voortgang
  page_icon: 'ph:bold/gauge'
  intro: 'Hoe ver iets gevorderd is, weergegeven als een verhouding tussen 0 en 1 in een aangepaste eigenschap — op dezelfde manier als de statuscirkel zijn boog draagt, vullen beide kanten van de stapel de balk met één verklaring. Twig print de waarde die het krijgt; het verplaatsen ervan is de zorg van de browser.'
  section:
    default:
      title: Statussen
      description: 'De waarde is een aantal of een aandeel geschreven als een percentage, en geeft nooit antwoorden buiten zijn grenzen. De kleur is de feedbackkleur, dus een balk zegt hoe zijn werk eindigde in dezelfde taal als een bericht of een status.'
    plain:
      title: 'Zonder totaal'
      description: 'Honderd is wat een balk telt wanneer niemand anders iets zegt, wat een percentage de enige manier maakt om het te geven. Een eigen totaal is voor werk dat in dingen wordt geteld in plaats van in delen.'
    indeterminate:
      title: 'Een eind dat niet bekend is'
      description: 'Werk in uitvoering waarvan niemand de omvang weet: de balk veegt en zegt geen nummer. Een aandeel hier claimen zou een gok zijn vermomd als een meting.'
    compact:
      title: Compact
      description: 'Verminderd tot wat het moet zeggen, voor een statusregel of een footer: een dunnere baan, de tekst ernaast in plaats van erboven, en de dichtheid doorgegeven aan wat er ook mee staat.'
    vue:
      title: 'Vue, gedreven'
      description: 'Dezelfde balk, met de woordenschat die de cli voortgang al spreekt — bijwerken, vooruitgang, afronden, resetten. Een stap waar niets over gezegd wordt is één eenheid waard, wat is wat te noemen waar noch de eenheid noch het totaal iets betekent.'
  bar:
    queued: 'In de wachtrij'
    working: 'Middelen aan het bouwen'
    almost: 'Aan het uploaden'
    done: Geïmplementeerd
    failed: 'Migratie mislukt'
    counted: 'Bestanden gelezen'
    unknown: 'Zoekt iets'
    indexing: Indexeren
  compact:
    app: acme-blog

pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Postęp
  page_icon: 'ph:bold/gauge'
  intro: 'Jak daleko coś zaszło, przedstawione jako stosunek między 0 a 1 w niestandardowej właściwości — w ten sam sposób, w jaki okrąg statusu przedstawia swój łuk, tak obie strony stosu wypełniają pasek jedną deklaracją. Twig drukuje wartość, którą otrzymuje; jej późniejsze przesunięcie to już sprawa przeglądarki.'
  section:
    default:
      title: Stany
      description: 'Wartość to liczba lub udział zapisany jako procent, i nigdy nie odpowiada poza swoimi granicami. Kolor to kolor feedbacku, więc pasek oznajmia, jak zakończyła się jego praca w tym samym języku, co komunikat lub status.'
    plain:
      title: 'Bez całkowitej wartości'
      description: 'Sto to to, do czego pasek liczy, gdy nikt nie mówi inaczej, co sprawia, że procent to jedyna rzecz, która to określa. Własna całkowita wartość jest dla pracy liczonej w rzeczach, a nie w częściach.'
    indeterminate:
      title: 'Koniec, którego nie znamy'
      description: 'Praca w toku, której rozmiaru nikt nie zna: pasek przesuwa się i nie podaje liczby. Twierdzenie o udziale tutaj byłoby zgadnięciem przebranym za pomiar.'
    compact:
      title: Kompaktowy
      description: 'Skrócony do tego, co ma do powiedzenia, dla linii statusu lub stopki: cieńszy tor, sformułowanie obok niego, a nie nad nim, oraz gęstość przekazywana do czegokolwiek, co stoi obok.'
    vue:
      title: 'Vue, napędzany'
      description: 'Ten sam pasek, z słownictwem, które już mówi postęp cli — aktualizacja, postęp, zakończenie, reset. Krok, o którym nic nie powiedziano, wart jest jednej jednostki, co oznacza, że ani jednostka, ani całkowita wartość nic nie znaczą.'
  bar:
    queued: 'W kolejce'
    working: 'Budowanie zasobów'
    almost: Przesyłanie
    done: Wdrożono
    failed: 'Migracja nie powiodła się'
    counted: 'Przeczytane pliki'
    unknown: 'Szukam czegoś'
    indexing: Indeksowanie
