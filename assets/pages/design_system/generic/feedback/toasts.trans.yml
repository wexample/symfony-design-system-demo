en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Feedback
  page_icon: ph:bold/notification

  section:
    vue:
      title: Vue
      description: "The same toast as a vue partial. Closing is emitted here rather than animated away: inside a vue tree the parent owns the list."
    simple_toast:
      description: Display a simple toast
      button: Open toast
      title: Toast demo
      message: Hello from ToastService + ToastStack. You can also define action links like @action:demo(this one) inside a message.
    tl_toast:
      description: Display a top-left toast stack
      button: Open toast
      title: Top-left toast
      message: Hello from ToastService + ToastStack (TL).
    medium_toast:
      description: Display a medium-length toast message
      button: Open toast
      title: Medium toast
      message: This is a medium-length toast message for the demo.
    long_toast:
      description: Display a long toast message
      button: Open toast
      title: Long toast
      message: This is a longer toast message for the demo. It contains more text so you can preview how the component behaves with bigger content.
    horizontal_toasts:
      description: Display four toasts in a horizontal stack
      info:
        title: Info toast
        message: A horizontal toast preview.
        button: Show toast
      success:
        title: Success toast
        message: Everything looks good here.
        button: Show toast
      warning:
        title: Warning toast
        message: Double-check this action.
        button: Show toast
      error:
        title: Error toast
        message: Something went wrong here.
        button: Show toast
  title:
    toasts: Toasts

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'تغذية راجعة'
  page_icon: 'ph:bold/notification'
  section:
    vue:
      title: فيو
      description: 'نفس التنبيه كجزء من فيو. يتم إصدار إغلاق هنا بدلاً من أن يتم إزالته بشكل متحرك: داخل شجرة فيو، يمتلك الوالد القائمة.'
    simple_toast:
      description: 'عرض تنبيه بسيط'
      button: 'فتح التنبيه'
      title: 'عرض التنبيه'
      message: 'مرحبا من ToastService + ToastStack. يمكنك أيضًا تعريف روابط الإجراءات مثل @action:demo(هذا واحد) داخل رسالة.'
    tl_toast:
      description: 'عرض مجموعة تنبيهات في الجزء العلوي الأيسر'
      button: 'فتح التنبيه'
      title: 'تنبيه في الجزء العلوي الأيسر'
      message: 'مرحبا من ToastService + ToastStack (TL).'
    medium_toast:
      description: 'عرض رسالة تنبيه متوسطة الطول'
      button: 'فتح التنبيه'
      title: 'تنبيه متوسط'
      message: 'هذه رسالة تنبيه متوسطة الطول للعرض.'
    long_toast:
      description: 'عرض رسالة تنبيه طويلة'
      button: 'فتح التنبيه'
      title: 'تنبيه طويل'
      message: 'هذه رسالة تنبيه أطول للعرض. تحتوي على نص أكثر حتى تتمكن من معاينة كيفية تصرف المكون مع المحتوى الأكبر.'
    horizontal_toasts:
      description: 'عرض أربعة تنبيهات في مجموعة أفقية'
      info:
        title: 'تنبيه معلومات'
        message: 'معاينة تنبيه أفقي.'
        button: 'عرض التنبيه'
      success:
        title: 'تنبيه نجاح'
        message: 'كل شيء يبدو جيدًا هنا.'
        button: 'عرض التنبيه'
      warning:
        title: 'تنبيه تحذير'
        message: 'تحقق من هذا الإجراء مرة أخرى.'
        button: 'عرض التنبيه'
      error:
        title: 'تنبيه خطأ'
        message: 'حدث شيء خاطئ هنا.'
        button: 'عرض التنبيه'
  title:
    toasts: التنبيهات

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ফিডব্যাক
  page_icon: 'ph:bold/notification'
  section:
    vue:
      title: ভিউ
      description: 'একটি ভিউ আংশিকের মতো একই টোস্ট। এখানে বন্ধ করা হয়েছে, অ্যানিমেটেড না হয়ে: একটি ভিউ গাছের মধ্যে প্যারেন্ট তালিকাটি মালিকানা নিয়ে থাকে।'
    simple_toast:
      description: 'একটি সাধারণ টোস্ট দেখান'
      button: 'টোস্ট খুলুন'
      title: 'টোস্ট ডেমো'
      message: 'টোস্টসার্ভিস + টোস্টস্ট্যাক থেকে হ্যালো। আপনি একটি বার্তার মধ্যে @action:demo(এইটি) এর মতো অ্যাকশন লিঙ্কও সংজ্ঞায়িত করতে পারেন।'
    tl_toast:
      description: 'একটি উপরের-বাঁয়ে টোস্ট স্ট্যাক দেখান'
      button: 'টোস্ট খুলুন'
      title: 'উপরের-বাঁয়ে টোস্ট'
      message: 'টোস্টসার্ভিস + টোস্টস্ট্যাক (TL) থেকে হ্যালো।'
    medium_toast:
      description: 'একটি মাঝারি দৈর্ঘ্যের টোস্ট বার্তা দেখান'
      button: 'টোস্ট খুলুন'
      title: 'মাঝারি টোস্ট'
      message: 'এটি ডেমোর জন্য একটি মাঝারি দৈর্ঘ্যের টোস্ট বার্তা।'
    long_toast:
      description: 'একটি দীর্ঘ টোস্ট বার্তা দেখান'
      button: 'টোস্ট খুলুন'
      title: 'দীর্ঘ টোস্ট'
      message: 'এটি ডেমোর জন্য একটি দীর্ঘ টোস্ট বার্তা। এতে আরও বেশি টেক্সট রয়েছে, তাই আপনি দেখতে পারেন কিভাবে উপাদানটি বড় কনটেন্টের সাথে আচরণ করে।'
    horizontal_toasts:
      description: 'চারটি টোস্ট একটি অনুভূমিক স্ট্যাকে দেখান'
      info:
        title: 'তথ্য টোস্ট'
        message: 'একটি অনুভূমিক টোস্ট প্রিভিউ।'
        button: 'টোস্ট দেখান'
      success:
        title: 'সফল টোস্ট'
        message: 'এখানে সবকিছু ভালো মনে হচ্ছে।'
        button: 'টোস্ট দেখান'
      warning:
        title: 'সতর্কতা টোস্ট'
        message: 'এই ক্রিয়াটি দ্বিগুণ চেক করুন।'
        button: 'টোস্ট দেখান'
      error:
        title: 'ত্রুটি টোস্ট'
        message: 'এখানে কিছু সমস্যা হয়েছে।'
        button: 'টোস্ট দেখান'
  title:
    toasts: টোস্ট

