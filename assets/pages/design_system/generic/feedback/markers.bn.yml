page_title: মার্কার
page_icon: 'ph:bold/seal-check'
intro: 'একটি ক্যাপসুল একটি শব্দে একটি বিষয়ে বলা সবকিছু: একটি অবস্থা, একটি নাম, একটি সংস্করণ, একটি বিভাগ। তারা দুটি বস্তু ছিল যতদিন না একটি কোড এবং একটি অবস্থা এক শিরোনামের পাশে দাঁড়াল, এক মাথার ব্যবধান দূরে, এবং কেউ বলতে পারল না যে পার্থক্য কি বোঝাতে চেয়েছিল — তাই আকৃতি এক এবং সুর হল তাদের আলাদা করার সম্পূর্ণ বিষয়। এটি যা বহন করে তা মুক্ত: একটি শব্দ, একটি চিত্র, একটি গ্লিফ, অথবা তিনটির মধ্যে দুটি। বৃত্তটি সেখানে দাঁড়ায় যেখানে একটি ক্যাপসুলের জন্য জায়গা নেই, এবং কাউন্টার, যা একটি সারি থেকে ঝুলছে এবং এটি যে টেক্সটের উপর ঝুলছে তার আকারে আকার দেওয়া হয়েছে, এটি এখানে একমাত্র বিষয় যা একটি মার্কার নয়।'
section:
  inline:
    title: 'একটি বাক্যের মাঝখানে'
    description: 'একটি শব্দ যা পড়ার সময় আলাদা হয়ে যায়: একটি সংস্করণ, একটি পর্যায়, একটি বিভাগ। নিরপেক্ষ সুর, কারণ একটি মার্কার যা রঙিন হয়ে আসে তা ইতিমধ্যেই দাবি করেছে যে এটি কি চিহ্নিত করে — এবং একটি বাক্যে দাবির কিছুই নেই।'
  palette:
    title: বিভাগসমূহ
    description: 'সুর যা জিনিসগুলিকে আলাদা করে র‌্যাংকিং ছাড়াই। এগুলি কোন অর্থ বহন করে না — কিছুই বলে না যে তৃতীয়টি পঞ্চমের চেয়ে ভাল — যা সঠিকভাবে তাদের একটি শ্রেণীবিভাগের জন্য ব্যবহারযোগ্য করে, যেখানে অর্থ একটি মিথ্যা হবে। এটি ঠিক যেমন একটি অবস্থা পরিধান করা হয়: একই ক্যাপসুল, একই তাল।'
  against:
    title: 'একটি মার্কারের পাশে একটি কাউন্টার'
    description: 'একটি পার্থক্য বাকি আছে, এবং এটি অর্থ সম্পর্কে নয়। বাম দিকে একটি কাউন্টার: কিছু একটা থেকে বারো, যে সারি থেকে এটি ঝুলছে তার উপর এবং সেই সারির নিজস্ব টেক্সটে আকার দেওয়া হয়েছে। ডান দিকে একটি মার্কার: কিছু একটা থেকে বারো যা ভালভাবে গেছে, এটি নিজের উপর দাঁড়িয়ে এবং টোকেনের আকারে আকার দেওয়া হয়েছে। একটি মেনু আইটেমের পাশে একটি গণনা একটি কাউন্টার; একটি পাইপলাইন কলামে একই সংখ্যা একটি মার্কার।'
  words:
    title: 'শব্দে একটি অবস্থা'
    description: 'একটি বাক্যে বা একটি শিরোনামের পাশে ঘোষণা করা হয়, যেখানে এটি একটি চিহ্নের পরিবর্তে একটি বার্তা।'
  figures:
    title: 'ডজন ধরে পড়া একটি অবস্থা'
    description: 'একটি কলামে, একটি নিরপেক্ষ গণনার পাশে একটি টিক দুইটি বস্তুর মতো পড়ে এবং তাদের একটি টেবিল শব্দদূষণ হিসেবে পড়ে। এখানে রঙ চিত্রকে ঘিরে রেখেছে এবং কলামটি একবারে স্ক্যান করা হয় — সংক্ষিপ্ত, যেহেতু একটি সেলের জন্য অতিরিক্ত জায়গা নেই।'
  payload:
    title: 'এটি কী বহন করে'
    description: 'যা অবস্থা, এর সংখ্যা কত, উভয়, নাকি কিছুই — তার জন্য একটি শব্দ। চিত্রটি সবসময় বাকি থেকে এক ধাপ পিছনে অঙ্কিত হয়: এটি অবস্থা যোগ্য করে, এটি অবস্থা নয়।'
  weights:
    title: 'তিনটি রূপ পাশাপাশি'
    description: 'একই তথ্য যেখানে এটি আসলে পড়া হয়। বৃত্ত একটি সেলের জন্য আকৃতি যা একটি ক্যাপসুলের জন্য খুব সংকীর্ণ, এবং একমাত্র যা একটি অবস্থা একটি পরিমাণ হিসাবে দেখাতে পারে — এবং এটি সেই রঙে অঙ্কিত হয় যা ক্যাপসুল পূর্ণ করে।'
  circles:
    title: বৃত্ত
    description: 'একটি বৃত্ত দ্বারা বলা একটি অবস্থা, একটি স্থানে যেখানে অবস্থা ডজন ধরে পড়া হয় — একটি রানগুলির তালিকা, একটি কাজের সারি। রিংটি রঙ বহন করে, ভেতরের গ্লিফটি বলে এটি কোন অবস্থা, এবং স্তূপের উভয় পাশ একই মার্কআপ অঙ্কন করে।'
  progress:
    title: 'একটি অবস্থা যা একটি পরিমাণ'
    description: 'একটি রান হল একমাত্র অবস্থা যার একটি পরিমাণ রয়েছে, তাই এর রিংটি যতদূর পর্যন্ত রানটি গিয়েছে ততদূর অঙ্কিত হয়। টুইগ প্রদত্ত মানটি মুদ্রণ করে; পরবর্তীতে এটি স্থানান্তর করা ব্রাউজারের বিষয়।'
  sizes:
    title: 'বৃত্তের আকার'
  vue:
    title: ভিউ
    description: 'একই উপাদান, চালিত: প্রকার বা মান পরিবর্তন করা হলে আর্কটি সরানো হয়, পুনরায় অঙ্কন করার পরিবর্তে। এটি হল যা একটি অ্যাপ্লিকেশন স্থাপন করে যখন অবস্থা পড়ার চোখের সামনে পরিবর্তিত হতে চলেছে।'
  code:
    title: ব্যবহার
