it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Distribuzione
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: "Di cosa è composto un totale, in un'unica riga. Dove una barra di progresso indica quanto un valore è stato raggiunto, questo indica come un intero si divide: le parti mantengono l'ordine in cui sono date, quindi un pipeline si legge da sinistra a destra come un pipeline. Gli stati sono nominati con il vocabolario che già parla la capsula e il cerchio, quindi uno stato non assume mai due colori."
  section:
    default:
      title: 'Un intero, in parti'
      description: "Le parti crescono in proporzione al loro valore, e la legenda le descrive a parole sottostanti — la stessa capsula con cui una tabella disegna uno stato, così l'occhio si muove tra i due senza apprendere nulla di nuovo."
    linked:
      title: 'Parti che conducono da qualche parte'
      description: 'Una parte con un obiettivo è un link: la barra diventa il modo per accedere alla lista che riassume. Sotto il puntatore prende un film di luce piuttosto che un altro colore, che indicherebbe un diverso stato.'
    bare:
      title: 'Senza la legenda'
      description: 'Dove le parti sono nominate proprio accanto, o dove la barra deve solo indicare la forma della cosa, la legenda viene rimossa e ogni parte indica cosa è sotto il puntatore.'
    rest:
      title: 'Un totale più grande delle sue parti'
      description: 'Ciò che il totale conta e nessuna parte rappresenta mantiene la sua quota della riga e non disegna nulla: il tracciato mostra attraverso esattamente tanto, invece delle parti che si allungano per riempire una barra che non riempiono.'
    empty:
      title: 'Niente conteggiato ancora'
      description: 'Nessun totale e nessuna parte — lavoro non iniziato, un conteggio ancora aperto. La barra mantiene il suo posto, come un tracciato nudo — lo stesso terreno che un totale più grande delle sue parti mostra attraverso — quindi una riga di essi mantiene la sua forma; la sua figura è un trattino, poiché nulla conteggiato non è zero.'
    compact:
      title: Compatto
      description: 'Una barra più sottile per una riga o un piè di pagina di una scheda, con la densità trasferita alle capsule della sua legenda.'
    vue:
      title: 'Vue, guidato'
      description: 'La stessa barra, le cui parti sono fornite come dati. Una parte che non conduce da nessuna parte risponde a un clic con `select`, che è ciò a cui prestare attenzione per una tabella che si filtra accanto ad essa.'
