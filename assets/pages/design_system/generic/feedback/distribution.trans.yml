ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 配分
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 合計が何で構成されているのかを一行で示します。プログレスバーがどれだけ進んでいるかを示すのに対し、これは全体がどのように分割されているかを示します：部分は与えられた順序を保持し、パイプラインはそれに従って左から右に読み取られます。状態はカプセルとサークルが既に使っている語彙で名付けられているため、1つの状態が2つの色を持つことはありません。
  section:
    default:
      title: 全体を部分に分ける
      description: '部分はそれぞれの価値に比例して成長し、伝説はその下に言葉で示します — 表が状態を描くのと同じカプセルなので、目は新しいことを学ぶことなく両者の間を移動します。'
    linked:
      title: どこかに繋がる部分
      description: ターゲットを持つ部分はリンクです：バーは要約するリストへの道になります。ポインターの下では、別の色ではなく光のフィルムを取ります。別の状態を示すことになるからです。
    bare:
      title: 伝説なしで
      description: 部分がすぐ隣に名付けられている場合、またはバーが物の形を示すだけの場合、伝説は省かれ、各部分はポインターの下で自分が何であるかを示します。
    rest:
      title: 部分よりも大きな合計
      description: 合計がカウントし、どの部分もカウントしないものは、その行のシェアを保持し、何も描きません：トラックはちょうどその分だけ見えるようにし、部分が満たしていないバーに合わせて伸びることはありません。
    empty:
      title: まだカウントされていない
      description: '合計も部分もない — 作業は始まっておらず、未集計の状態です。バーはその場所を保持し、裸のトラックとして存在します — 部分よりも大きな合計が見える同じ地面で — それでそれらの行はその形を保ちます；その形はダッシュであり、カウントされていないものはゼロではありません。'
    compact:
      title: コンパクト
      description: 行やカードのフッター用の細いバーで、密度はその伝説のカプセルに引き継がれます。
    vue:
      title: Vue、駆動
      description: 同じバーで、その部分はデータとして与えられます。どこにも繋がらない部分は、隣にあるテーブルが自己フィルタリングする際に、クリックに対して`select`で応答します。
  bar:
    pipeline: カタログのページ
    elements: デザインシステムの要素
    partial: 読み込まれたファイル
  state:
    done: 完了
    running: 実行中
    todo: 未着手
    failed: 失敗
    skipped: 未開始

ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 분배
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: '총계가 무엇으로 구성되어 있는지를 한 줄로 나타냅니다. 진행률 표시줄이 하나의 값이 얼마나 진행되었는지를 보여주는 반면, 이 표시줄은 전체가 어떻게 나누어지는지를 나타냅니다: 각 부분은 주어진 순서를 유지하므로 파이프라인은 파이프라인처럼 왼쪽에서 오른쪽으로 읽습니다. 상태는 캡슐과 원이 이미 사용하는 용어로 명명되므로 한 상태가 두 가지 색상을 가질 수 없습니다.'
  section:
    default:
      title: '부분으로 나눈 전체'
      description: '각 부분은 그 가치에 비례하여 성장하고, 전설은 그 아래에 단어로 설명합니다 — 테이블이 상태를 그리는 같은 캡슐이므로, 시선은 두 가지 사이를 이동하지만 새로운 것을 배우지는 않습니다.'
    linked:
      title: '어딘가로 연결되는 부분들'
      description: '목표가 있는 부분은 링크입니다: 바는 요약하는 목록으로 들어가는 길이 됩니다. 포인터 아래에서는 다른 색상이 아닌 빛의 필름을 취하여 다른 상태를 나타내지 않습니다.'
    bare:
      title: '전설 없이'
      description: '부분이 바로 옆에 이름이 붙어 있거나 바가 단지 사물의 형태만을 말해야 할 때, 전설은 생략되고 각 부분은 포인터 아래에서 자신이 무엇인지 말합니다.'
    rest:
      title: '부분보다 큰 총계'
      description: '총계가 세는 것과 어떤 부분도 설명하지 않는 것은 그 행의 몫을 차지하고 아무것도 그리지 않습니다: 트랙은 정확히 그만큼 보여지며, 부분이 채우지 않는 바를 채우기 위해 늘어나는 것이 아닙니다.'
    empty:
      title: '아직 집계되지 않음'
      description: '총계도 없고 부분도 없음 — 작업이 시작되지 않았고, 집계가 아직 남아 있습니다. 바는 그 자리를 유지하며, 벌거벗은 트랙처럼 — 부분보다 큰 총계가 보이는 같은 땅 — 그래서 그들의 행은 모양을 유지합니다; 집계된 것이 없으므로 그 수치는 대시입니다.'
    compact:
      title: 간결하게
      description: '행이나 카드 바닥글을 위해 더 얇은 바, 밀도가 전설의 캡슐로 전달됩니다.'
    vue:
      title: '구동되는 Vue'
      description: '같은 바, 그 부분이 데이터로 제공됩니다. 어딘가로 연결되지 않는 부분은 클릭에 `select`로 응답하며, 이는 그 옆에서 스스로 필터링하는 테이블에서 들어야 할 것입니다.'
  bar:
    pipeline: '카탈로그의 페이지들'
    elements: '디자인 시스템의 요소들'
    partial: '읽은 파일들'
  state:
    done: 완료
    running: '실행 중'
    todo: '할 일'
    failed: 실패
    skipped: '시작되지 않음'

nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Verdeling
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'Waaruit een totaal bestaat, in één regel. Waar een voortgangsbalk aangeeft hoe ver een waarde is, geeft dit aan hoe een geheel is verdeeld: de delen houden de volgorde aan zoals ze gegeven zijn, zodat een pijplijn van links naar rechts leest zoals de pijplijn die het is. De statussen zijn benoemd met de woordenschat die de capsule en de cirkel al gebruiken, zodat één status nooit twee kleuren heeft.'
  section:
    default:
      title: 'Een geheel, in delen'
      description: 'De delen groeien in verhouding tot hun waarde, en de legenda zegt ze in woorden eronder — dezelfde capsule die een tabel een status geeft, zodat het oog tussen de twee beweegt zonder iets nieuws te leren.'
    linked:
      title: 'Delen die ergens naartoe leiden'
      description: 'Een deel met een doel is een link: de balk wordt de weg naar de lijst die het samenvat. Onder de aanwijzer neemt het een film van licht in plaats van een andere kleur, wat een andere status zou aangeven.'
    bare:
      title: 'Zonder de legenda'
      description: 'Waar de delen net daarnaast zijn benoemd, of waar de balk alleen de vorm van het ding hoeft aan te geven, wordt de legenda weggelaten en zegt elk deel wat het is onder de aanwijzer.'
    rest:
      title: 'Een totaal groter dan zijn delen'
      description: 'Wat het totaal telt en waar geen deel voor opkomt, houdt zijn aandeel van de rij en trekt niets: het pad toont precies dat, in plaats van dat de delen zich uitstrekken om een balk te vullen die ze niet vullen.'
    empty:
      title: 'Nog niets geteld'
      description: 'Geen totaal en geen deel — werk nog niet begonnen, een telling nog uit. De balk behoudt zijn plaats, als een kaal pad — dezelfde grond die een totaal groter dan zijn delen toont — zodat een rij ervan zijn vorm behoudt; zijn figuur is een streep, aangezien niets geteld niet nul is.'
    compact:
      title: Compact
      description: 'Een dunnere balk voor een rij of een kaartvoettekst, met de dichtheid doorgegeven aan de capsules van zijn legenda.'
    vue:
      title: 'Vue, aangedreven'
      description: 'Dezelfde balk, zijn delen gegeven als gegevens. Een deel dat nergens naartoe leidt, reageert op een klik met `select`, wat is waarnaar te luisteren voor een tabel die zichzelf filtert ernaast.'
  bar:
    pipeline: "Pagina's van de catalogus"
    elements: 'Elementen van het ontwerpsysteem'
    partial: 'Gelezen bestanden'
  state:
    done: Voltooid
    running: Bezig
    todo: 'Te doen'
    failed: Mislukt
    skipped: 'Niet begonnen'

pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Dystrybucja
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: "Z czego składa się całość, w jednym zdaniu. Gdzie pasek postępu wskazuje, jak daleko zaszedł jeden z wartości, to pokazuje, jak całość się dzieli: części mają porządek, w jakim są podane, więc pipeline czyta z lewej do prawej, jak to jest w przypadku pipeline'u. Stany nazywane są słownictwem, którym już posługuje się kapsuła i okrąg, więc jeden stan nigdy nie przyjmuje dwóch kolorów."
  section:
    default:
      title: 'Całość, w częściach'
      description: 'Części rosną proporcjonalnie do swojej wartości, a legenda opisuje je słowami poniżej — ta sama kapsuła, którą tabela przedstawia stan, więc oko porusza się między nimi, nie ucząc się niczego nowego.'
    linked:
      title: 'Części, które prowadzą gdzieś'
      description: 'Część z celem to link: pasek staje się drogą do listy, którą podsumowuje. Pod wskaźnikiem przyjmuje obrazek światła zamiast innego koloru, co sugerowałoby inny stan.'
    bare:
      title: 'Bez legendy'
      description: 'Gdzie części są nazywane tuż obok, lub gdzie pasek ma tylko mówić o kształcie rzeczy, legenda jest pomijana, a każda część mówi, czym jest pod wskaźnikiem.'
    rest:
      title: 'Całość większa niż jej części'
      description: 'To, co całkowita liczba liczy, a żadna część tego nie ujmuje, zajmuje swoją część rzędu i nic nie rysuje: tor pokazuje się na dokładnie tyle, zamiast części rozciągających się, aby wypełnić pasek, którego nie wypełniają.'
    empty:
      title: 'Nic jeszcze nie policzone'
      description: 'Brak całości i brak części — praca nie rozpoczęta, rachunek wciąż otwarty. Pasek zajmuje swoje miejsce, jako nagi tor — ta sama ziemia, przez którą pokazuje się całość większa niż jej części — więc rząd z nich zachowuje swój kształt; jego figura to kreska, ponieważ nic policzone nie jest zerem.'
    compact:
      title: Kompaktowy
      description: 'Cieńszy pasek dla rzędu lub stopki karty, z gęstością przekazywaną do kapsuł w jego legendzie.'
    vue:
      title: 'Vue, napędzany'
      description: 'Ten sam pasek, jego części podane jako dane. Część, która nie prowadzi nigdzie, odpowiada na kliknięcie `select`, co jest tym, na co należy zwracać uwagę w tabeli, która filtruje się obok.'
  bar:
    pipeline: 'Strony katalogu'
    elements: 'Elementy systemu projektowania'
    partial: 'Przeczytane pliki'
  state:
    done: Zrobione
    running: 'W trakcie'
    todo: 'Do zrobienia'
    failed: Niepowodzenie
    skipped: 'Nie rozpoczęte'

pt_BR:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Distribuição
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'O que um total é composto, em uma linha. Onde uma barra de progresso indica até onde um valor chegou, isso mostra como um todo se divide: as partes mantêm a ordem em que são apresentadas, então um pipeline lê da esquerda para a direita, como um pipeline deve ser. Os estados são nomeados com o vocabulário que a cápsula e o círculo já usam, então um estado nunca assume duas cores.'
  section:
    default:
      title: 'Um todo, em partes'
      description: 'As partes crescem em proporção ao que representam, e a legenda as descreve em palavras abaixo — a mesma cápsula que uma tabela usa para desenhar um estado, então o olho se move entre os dois sem aprender nada novo.'
    linked:
      title: 'Partes que levam a algum lugar'
      description: 'Uma parte com um alvo é um link: a barra se torna o caminho para a lista que resume. Sob o ponteiro, ela adquire um brilho de luz em vez de outra cor, que indicaria um estado diferente.'
    bare:
      title: 'Sem a legenda'
      description: 'Onde as partes são nomeadas ao lado, ou onde a barra só precisa indicar a forma do objeto, a legenda é eliminada e cada parte diz o que é sob o ponteiro.'
    rest:
      title: 'Um total maior que suas partes'
      description: 'O que o total conta e nenhuma parte contabiliza mantém sua parte na linha e não desenha nada: a trilha se mostra exatamente por isso, ao invés das partes se esticarem para preencher uma barra que não preenchem.'
    empty:
      title: 'Nada contado ainda'
      description: 'Sem total e sem parte — trabalho não iniciado, um registro ainda em aberto. A barra mantém seu lugar, como uma trilha vazia — o mesmo espaço que um total maior que suas partes mostra — então uma linha delas mantém sua forma; sua figura é um traço, já que nada contado não é zero.'
    compact:
      title: Compacto
      description: 'Uma barra mais fina para uma linha ou um rodapé de cartão, com a densidade repassada para as cápsulas de sua legenda.'
    vue:
      title: 'Vue, dirigido'
      description: 'A mesma barra, suas partes apresentadas como dados. Uma parte que não leva a lugar nenhum responde a um clique com `select`, que é o que se deve ouvir para uma tabela que se filtra ao lado.'
  bar:
    pipeline: 'Páginas do catálogo'
    elements: 'Elementos do sistema de design'
    partial: 'Arquivos lidos'
  state:
    done: Concluído
    running: 'Em andamento'
    todo: 'A fazer'
    failed: Falhou
    skipped: 'Não iniciado'

ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Распределение
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'Что составляет общую сумму, в одной строке. Где индикатор прогресса показывает, насколько далеко продвинулось одно значение, это показывает, как целое делится: части идут в том порядке, в котором они даны, так что конвейер читается слева направо, как и положено. Состояния названы терминологией, которую уже используют капсула и круг, так что одно состояние никогда не принимает два цвета.'
  section:
    default:
      title: 'Целое, в частях'
      description: 'Части растут пропорционально своей ценности, а легенда обозначает их словами снизу — это такая же капсула, как и та, что рисует состояние в таблице, так что глаз перемещается между двумя, не узнавая ничего нового.'
    linked:
      title: 'Части, ведущие куда-то'
      description: 'Часть с целью — это ссылка: полоса становится путем в список, который она обобщает. Под указателем она принимает пленку света вместо другого цвета, что означало бы другое состояние.'
    bare:
      title: 'Без легенды'
      description: 'Где части названы прямо рядом, или где полоса должна лишь обозначить форму вещи, легенда опускается, и каждая часть говорит, что она под указателем.'
    rest:
      title: 'Общая сумма больше своих частей'
      description: 'Что учитывает общая сумма и ни одна часть не учитывает, занимает свою долю в ряду и ничего не рисует: трек виден ровно на столько, вместо того чтобы части растягивались, заполняя полосу, которую они не заполняют.'
    empty:
      title: 'Пока ничего не учтено'
      description: 'Нет общей суммы и нет частей — работа не начата, подсчет еще не произведен. Полоса сохраняет свое место, как голый трек — та же поверхность, через которую видно, что общая сумма больше своих частей — так что ряд из них сохраняет свою форму; его фигура — тире, так как ничего не учтено, это не равно нулю.'
    compact:
      title: Компактный
      description: 'Узкая полоса для ряда или нижнего колонтитула карточки, с плотностью, переданной капсулам его легенды.'
    vue:
      title: 'Vue, управляемый'
      description: 'Та же полоса, ее части представлены как данные. Часть, которая никуда не ведет, отвечает на клик `select`, что и есть то, что нужно слушать для таблицы, которая фильтрует себя рядом.'
  bar:
    pipeline: 'Страницы каталога'
    elements: 'Элементы системы дизайна'
    partial: 'Читаемые файлы'
  state:
    done: Готово
    running: 'В процессе'
    todo: Сделать
    failed: 'Не удалось'
    skipped: 'Не начато'

th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: การแจกจ่าย
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'สิ่งที่รวมกันเป็นทั้งหมดในบรรทัดเดียว โดยที่แถบความก้าวหน้าบอกว่าค่าหนึ่งไปได้ไกลแค่ไหน ขณะที่สิ่งนี้บอกว่าทั้งหมดแบ่งออกเป็นอย่างไร: ส่วนต่างๆ จะมีลำดับตามที่กำหนด ดังนั้นท่อจึงอ่านจากซ้ายไปขวาเหมือนกับที่มันเป็น ท่อต่างๆ จะถูกตั้งชื่อด้วยศัพท์ที่แคปซูลและวงกลมพูดถึงอยู่แล้ว ดังนั้นสถานะหนึ่งจึงไม่สามารถใช้สีได้สองสี'
  section:
    default:
      title: ทั้งหมดในส่วน
      description: 'ส่วนต่างๆ เติบโตตามสัดส่วนกับค่าของมัน และคำอธิบายบอกชื่อเหล่านั้นในคำใต้ — แคปซูลเดียวกับที่ตารางวาดสถานะให้ ดังนั้นตาจึงเคลื่อนที่ระหว่างทั้งสองโดยไม่เรียนรู้สิ่งใหม่'
    linked:
      title: ส่วนที่นำไปสู่ที่ไหนสักแห่ง
      description: 'ส่วนที่มีเป้าหมายคือการเชื่อมโยง: แถบกลายเป็นวิธีเข้าสู่รายการที่มันสรุปไว้ ใต้ตัวชี้มันจะมีแสงที่แสดงแทนสีอื่น ซึ่งจะบอกสถานะที่แตกต่างออกไป'
    bare:
      title: โดยไม่มีคำอธิบาย
      description: 'ที่ซึ่งส่วนต่างๆ ถูกตั้งชื่ออยู่ข้างๆ หรือที่แถบต้องแค่บอกรูปร่างของสิ่งนั้น คำอธิบายจะถูกละทิ้งและแต่ละส่วนบอกว่ามันคืออะไรใต้ตัวชี้'
    rest:
      title: รวมที่ใหญ่กว่าส่วนของมัน
      description: 'สิ่งที่รวมคำนวณและไม่มีส่วนใดที่คิดถึงถือว่ามีส่วนแบ่งในแถวและวาดอะไรไม่ได้: เส้นทางแสดงให้เห็นสำหรับจำนวนเท่านั้น แทนที่จะให้ส่วนต่างๆ ยืดเพื่อเติมเต็มแถบที่พวกเขาไม่เติมเต็ม'
    empty:
      title: ยังไม่มีการนับ
      description: 'ไม่มีทั้งหมดและไม่มีส่วน — งานยังไม่เริ่มต้น ยอดยังออกอยู่ แถบยังคงอยู่ที่ตำแหน่งของมัน เหมือนเส้นทางเปล่า — พื้นเดียวกับที่รวมที่ใหญ่กว่าส่วนของมันแสดงให้เห็น — ดังนั้นแถวของมันจึงรักษารูปทรง; รูปร่างของมันเป็นขีดกลาง เนื่องจากไม่มีการนับคือไม่ใช่ศูนย์'
    compact:
      title: กระชับ
      description: 'แถบที่บางลงสำหรับแถวหรือฟุตเตอร์การ์ด โดยมีความหนาแบ่งให้กับแคปซูลในคำอธิบายของมัน'
    vue:
      title: 'Vue, ขับเคลื่อน'
      description: 'แถบเดียวกัน โดยที่ส่วนต่างๆ ถูกให้เป็นข้อมูล ส่วนที่นำไปไหนไม่ได้จะตอบสนองต่อการคลิกด้วย `select` ซึ่งคือสิ่งที่ต้องฟังสำหรับตารางที่กรองตัวเองข้างๆ'
  bar:
    pipeline: หน้าของแคตตาล็อก
    elements: องค์ประกอบของระบบการออกแบบ
    partial: ไฟล์ที่อ่าน
  state:
    done: เสร็จเรียบร้อย
    running: กำลังดำเนินการ
    todo: ต้องทำ
    failed: ล้มเหลว
    skipped: ยังไม่ได้เริ่ม

tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Dağıtım
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'Bir toplamın neye dayandığını, tek bir satırda gösterir. Bir ilerleme çubuğu bir değerin ne kadar ilerlediğini gösterirken, bu bir bütünün nasıl bölündüğünü belirtir: parçalar verildiği sırayı korur, bu nedenle bir boru hattı soldan sağa doğru okunur, olduğu gibi. Durumlar, kapsül ve dairenin zaten konuştuğu kelimelerle adlandırılmıştır, bu yüzden bir durum asla iki renge sahip olamaz.'
  section:
    default:
      title: 'Bir bütün, parçalara ayrılmış'
      description: 'Parçalar, değerlerine orantılı olarak büyür ve açıklama altında kelimelerle belirtilir — bir tablo bir durumu çizerken kullanılan aynı kapsül, böylece göz iki arasında hareket ederken yeni bir şey öğrenmez.'
    linked:
      title: 'Bir yere giden parçalar'
      description: 'Bir hedefi olan parça bir bağlantıdır: çubuk, özetlediği listeye giden yol haline gelir. İmlecin altında başka bir renk yerine bir ışık filmi alır, bu farklı bir durumu belirtir.'
    bare:
      title: 'Açıklama olmadan'
      description: 'Parçaların hemen yanına adlandırıldığı yerlerde, ya da çubuğun sadece şeyin şekli hakkında konuşması gerektiğinde, açıklama kaldırılır ve her parça imlecin altında ne olduğunu belirtir.'
    rest:
      title: 'Parçalarından daha büyük bir toplam'
      description: 'Toplamın saydığı ve hiçbir parçanın karşılamadığı, satırda payını tutar ve hiçbir şey çizmez: bu kadarına tam olarak gösterir, parçaların doldurmadığı bir çubuğu doldurmak için uzandığı yerine.'
    empty:
      title: 'Henüz hiçbir şey sayılmadı'
      description: 'Ne toplam ne de parça — iş başlamadı, hala bir sayım yok. Çubuk yerini korur, çıplak bir iz olarak — parçalarından daha büyük bir toplamın gösterdiği aynı zemin — bu yüzden onların bir sırası şeklini korur; sayısı bir tire, çünkü sayılmamış hiçbir şey sıfır değildir.'
    compact:
      title: Kompakt
      description: 'Bir sıra veya kart altlığı için daha ince bir çubuk, yoğunluk açıklamasının kapsüllerine aktarılır.'
    vue:
      title: 'Vue, yönlendirilmiş'
      description: 'Aynı çubuk, parçaları veri olarak verilmiştir. Hiçbir yere götürmeyen bir parça, yanında kendini filtreleyen bir tablo için dinlemeniz gereken şey olan `seç` ile bir tıklamaya yanıt verir.'
  bar:
    pipeline: 'Katalog sayfaları'
    elements: 'Tasarım sisteminin elemanları'
    partial: 'Okunan dosyalar'
  state:
    done: Tamamlandı
    running: 'Devam ediyor'
    todo: Yapılacak
    failed: Başarısız
    skipped: Başlanmadı

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: تقسیم
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'کسی مجموعے کی تشکیل ایک لائن میں۔ جہاں ایک ترقی کی بار یہ بتاتی ہے کہ ایک قیمت کتنی دور پہنچ چکی ہے، یہ بتاتی ہے کہ ایک مکمل چیز کیسے تقسیم ہوتی ہے: حصے وہی ترتیب رکھتے ہیں جو انہیں دی گئی ہے، اس لئے پائپ لائن بائیں سے دائیں کی طرح پڑھتا ہے جیسا کہ یہ پائپ لائن ہے۔ ریاستوں کے نام وہی ہیں جو کیپسول اور دائرے پہلے ہی بولتے ہیں، اس لئے ایک ریاست کبھی بھی دو رنگ نہیں لیتی۔'
  section:
    default:
      title: 'ایک مکمل چیز، حصوں میں'
      description: 'حصے اس مقدار کے تناسب سے بڑھتے ہیں جس کی وہ قیمت رکھتے ہیں، اور وضاحت نیچے الفاظ میں انہیں بتاتی ہے — وہی کیپسول جس کے ساتھ ایک جدول ایک ریاست کو کھینچتا ہے، اس لئے آنکھ دونوں کے درمیان بغیر کچھ نیا سیکھے حرکت کرتی ہے۔'
    linked:
      title: 'حصے جو کہیں لے جاتے ہیں'
      description: 'ایک حصہ جس کا ہدف ہے ایک لنک ہے: بار اس فہرست میں جانے کا راستہ بن جاتا ہے جس کا یہ خلاصہ کرتا ہے۔ اشارے کے نیچے یہ روشنی کی ایک فلم لیتا ہے بجائے کسی اور رنگ کے، جو ایک مختلف ریاست بتاتا۔'
    bare:
      title: 'وضاحت کے بغیر'
      description: 'جہاں حصے بس کے قریب نامزد ہیں، یا جہاں بار کو صرف چیز کی شکل بتانی ہوتی ہے، وضاحت ہٹا دی جاتی ہے اور ہر حصہ اشارے کے نیچے یہ بتاتا ہے کہ وہ کیا ہے۔'
    rest:
      title: 'ایک مجموعہ جو اپنے حصوں سے بڑا ہے'
      description: 'جو مجموعہ شمار کرتا ہے اور کوئی حصہ اس کا حساب نہیں رکھتا وہ اپنی قطار کا حصہ رکھتا ہے اور کچھ نہیں کھینچتا: ٹریک بالکل اتنا دکھاتا ہے، بجائے اس کے کہ حصے ایک بار کو بھریں جو وہ نہیں بھرتے۔'
    empty:
      title: 'ابھی کچھ نہیں شمار کیا گیا'
      description: 'نہ کوئی مجموعہ اور نہ کوئی حصہ — کام شروع نہیں ہوا، ایک حساب ابھی باقی ہے۔ بار اپنی جگہ برقرار رکھتا ہے، جیسے ایک خالی ٹریک — وہی زمین جس پر ایک مجموعہ جو اپنے حصوں سے بڑا ہے دکھائی دیتا ہے — اس لئے ان کا ایک صف اپنی شکل برقرار رکھتا ہے؛ اس کی شکل ایک ڈیش ہے، کیونکہ کچھ شمار نہیں کیا گیا ہے جو صفر نہیں ہے۔'
    compact:
      title: کمپیکٹ
      description: 'ایک پتلی بار ایک صف یا کارڈ کے فوٹر کے لئے، جس کی کثافت اس کی وضاحت کے کیپسولز میں منتقل کی گئی ہے۔'
    vue:
      title: 'ویو، چلائی گئی'
      description: 'اسی بار، اس کے حصے ڈیٹا کے طور پر دیے گئے ہیں۔ ایک حصہ جو کہیں نہیں لے جاتا، ایک کلک کے جواب میں `select` کے ساتھ جواب دیتا ہے، جو اس جدول کے لئے سننا ہے جو اس کے پہلو میں خود کو فلٹر کرتا ہے۔'
  bar:
    pipeline: 'کتالوگ کے صفحات'
    elements: 'ڈیزائن سسٹم کے عناصر'
    partial: 'فائلیں پڑھیں'
  state:
    done: مکمل
    running: 'چل رہا ہے'
    todo: 'کرنا ہے'
    failed: ناکام
    skipped: 'شروع نہیں کیا'

vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Phân phối'
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'Một tổng thể được cấu thành từ những gì, trong một dòng. Nơi mà một thanh tiến độ cho biết một giá trị đã đạt được bao xa, điều này cho biết cách mà toàn bộ được chia: các phần giữ nguyên thứ tự mà chúng được đưa ra, vì vậy một đường ống đọc từ trái sang phải như chính nó. Các trạng thái được đặt tên bằng từ vựng mà viên nang và vòng tròn đã nói, vì vậy một trạng thái không bao giờ mang hai màu.'
  section:
    default:
      title: 'Một tổng thể, thành phần'
      description: 'Các phần phát triển tương ứng với giá trị của chúng, và chú giải nói chúng bằng từ ngữ bên dưới — cùng một viên nang mà một bảng vẽ một trạng thái với, vì vậy mắt di chuyển giữa hai cái mà không học được gì mới.'
    linked:
      title: 'Các phần dẫn đến nơi nào đó'
      description: 'Một phần có mục tiêu là một liên kết: thanh trở thành con đường vào danh sách mà nó tóm tắt. Dưới con trỏ, nó nhận một lớp ánh sáng thay vì một màu khác, điều này sẽ nói đến một trạng thái khác.'
    bare:
      title: 'Không có chú giải'
      description: 'Nơi mà các phần được đặt tên ngay bên cạnh, hoặc nơi mà thanh chỉ cần nói đến hình dạng của vật, chú giải bị bỏ qua và mỗi phần nói rõ nó là gì dưới con trỏ.'
    rest:
      title: 'Một tổng thể lớn hơn các phần của nó'
      description: 'Những gì tổng thể đếm được và không phần nào tính đến giữ phần của hàng và không vẽ gì: đường ray hiển thị cho đúng mức đó, thay vì các phần kéo dài để lấp đầy một thanh mà chúng không lấp đầy.'
    empty:
      title: 'Chưa có gì được đếm'
      description: 'Không tổng thể và không phần nào — công việc chưa bắt đầu, một phép đếm vẫn chưa có. Thanh giữ vị trí của nó, như một đường ray trống — cùng một mặt đất mà một tổng thể lớn hơn các phần của nó hiển thị — vì vậy một hàng trong số đó giữ hình dạng của nó; con số của nó là một dấu gạch ngang, vì không có gì được đếm không phải là số không.'
    compact:
      title: 'Gọn gàng'
      description: 'Một thanh mỏng hơn cho một hàng hoặc chân thẻ, với độ dày được truyền cho các viên nang của chú giải của nó.'
    vue:
      title: 'Vue, được điều khiển'
      description: 'Cùng một thanh, các phần được đưa ra dưới dạng dữ liệu. Một phần không dẫn đến đâu trả lời một cú nhấp chuột với `select`, đó là điều cần lắng nghe cho một bảng tự lọc bên cạnh nó.'
  bar:
    pipeline: 'Các trang của danh mục'
    elements: 'Các phần tử của hệ thống thiết kế'
    partial: 'Các tệp được đọc'
  state:
    done: 'Hoàn thành'
    running: 'Đang chạy'
    todo: 'Cần làm'
    failed: 'Thất bại'
    skipped: 'Chưa bắt đầu'

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 分布
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 总量的组成，简洁明了。进度条展示了一个值的进度，而这一部分则说明了整体如何划分：部分按照给定的顺序排列，因此管道从左到右读取，正如其本质。状态使用胶囊和圆圈已经使用的词汇命名，因此一个状态永远不会使用两种颜色。
  section:
    default:
      title: 整体，部分
      description: 部分根据其价值成比例增长，图例在下面用文字表达它们——与表格描绘状态的胶囊相同，因此眼睛在两者之间移动时不会学到任何新东西。
    linked:
      title: 通向某处的部分
      description: 具有目标的部分是一个链接：条形图成为其总结的列表的入口。在指针下，它呈现出光的效果，而不是另一种颜色，这将表明不同的状态。
    bare:
      title: 没有图例
      description: 当部分仅在旁边命名，或者条形图只需说明事物的形状时，图例被省略，每个部分在指针下说明其身份。
    rest:
      title: 总量大于其部分
      description: 总量计数而没有部分计入的内容在行中占据其份额而不绘制任何内容：轨迹恰好显示出如此，而不是部分拉伸填满一个它们并没有填满的条形图。
    empty:
      title: 尚未计数
      description: 没有总量和部分——工作尚未开始，计数仍未进行。条形图保持其位置，作为一个裸露的轨迹——总量大于其部分的相同基础透过——因此一排保持其形状；其数字为短横线，因为未计数的东西并不是零。
    compact:
      title: 紧凑
      description: 用于一排或卡片底部的更细条形图，密度传递给其图例的胶囊。
    vue:
      title: Vue，驱动
      description: 相同的条形图，其部分作为数据给出。一个没有去处的部分在点击时以`select`响应，这就是需要在旁边自我过滤的表格中监听的内容。
  bar:
    pipeline: 目录页面
    elements: 设计系统的元素
    partial: 读取的文件
  state:
    done: 完成
    running: 运行中
    todo: 待办
    failed: 失败
    skipped: 未开始
