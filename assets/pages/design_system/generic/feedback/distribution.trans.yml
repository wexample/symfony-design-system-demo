en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Distribution
  page_icon: ph:bold/chart-bar-horizontal

  intro: "What a total is made of, in one line. Where a progress bar says how far one value has got, this says how a whole divides: the parts hold the order they are given, so a pipeline reads from left to right like the pipeline it is. The states are named with the vocabulary the capsule and the circle already speak, so one state never takes two colours."

  section:
    default:
      title: A whole, in parts
      description: "The parts grow in proportion to what they are worth, and the legend says them in words underneath — the same capsule a table draws a state with, so the eye moves between the two without learning anything new."
    linked:
      title: Parts that lead somewhere
      description: "A part with a target is a link: the bar becomes the way into the list it summarises. Under the pointer it takes a film of light rather than another colour, which would say a different state."
    bare:
      title: Without the legend
      description: "Where the parts are named just beside, or where the bar only has to say the shape of the thing, the legend is dropped and each part says what it is under the pointer."
    rest:
      title: A total larger than its parts
      description: "What the total counts and no part accounts for holds its share of the row and draws nothing: the track shows through for exactly that much, instead of the parts stretching to fill a bar they do not fill."
    empty:
      title: Nothing counted yet
      description: "No total and no part — work not started, a tally still out. The bar keeps its place, as a bare track — the same ground a total larger than its parts shows through — so a row of them keeps its shape; its figure is a dash, since nothing counted is not zero."
    compact:
      title: Compact
      description: "A thinner bar for a row or a card footer, with the density passed on to the capsules of its legend."
    vue:
      title: Vue, driven
      description: "The same bar, its parts given as data. A part that leads nowhere answers a click with `select`, which is what to listen to for a table that filters itself beside it."

  bar:
    pipeline: Pages of the catalogue
    elements: Elements of the design system
    partial: Files read

  state:
    done: Done
    running: Running
    todo: To do
    failed: Failed
    skipped: Not started

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: التوزيع
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'مما يتكون الإجمالي، في سطر واحد. حيث يقول شريط التقدم مدى تقدم قيمة واحدة، يقول هذا كيف ينقسم الكل: الأجزاء تحتفظ بالترتيب الذي تم إعطاؤه، لذا يقرأ خط الأنابيب من اليسار إلى اليمين مثلما هو. تُسمى الحالات بالمفردات التي تتحدث بها الكبسولة والدائرة بالفعل، لذا لا تأخذ حالة واحدة لونين.'
  section:
    default:
      title: 'الكل، بأجزائه'
      description: 'تنمو الأجزاء بما يتناسب مع قيمتها، وتقول الأسطورة عنها بكلمات أسفلها — نفس الكبسولة التي ترسم بها الجدول حالة، لذا تتحرك العين بين الاثنين دون تعلم أي شيء جديد.'
    linked:
      title: 'أجزاء تؤدي إلى مكان ما'
      description: 'جزء له هدف هو رابط: يصبح الشريط الطريق إلى القائمة التي يلخصها. تحت المؤشر يأخذ فيلمًا من الضوء بدلاً من لون آخر، مما قد يشير إلى حالة مختلفة.'
    bare:
      title: 'بدون الأسطورة'
      description: 'حيث تُسمى الأجزاء بجوارها فقط، أو حيث يجب على الشريط أن يقول شكل الشيء فقط، يتم إسقاط الأسطورة ويقول كل جزء ما هو تحت المؤشر.'
    rest:
      title: 'إجمالي أكبر من أجزائه'
      description: 'ما يحسبه الإجمالي ولا تحسبه أي جزء يحمل نصيبه من الصف ويرسم لا شيء: يظهر المسار من خلال ذلك بالضبط، بدلاً من أن تمتد الأجزاء لملء شريط لا يمتلكونه.'
    empty:
      title: 'لا شيء محسوب بعد'
      description: 'لا إجمالي ولا جزء — العمل لم يبدأ بعد، لا تزال الحسبة خارجًا. يحتفظ الشريط بمكانه، كمسار عاري — نفس الأرض التي يظهر من خلالها إجمالي أكبر من أجزائه — لذا يحتفظ صف منها بشكله؛ شكلها هو شرطة، نظرًا لأن لا شيء محسوب ليس صفرًا.'
    compact:
      title: مضغوط
      description: 'شريط أنحف لصف أو تذييل بطاقة، مع الكثافة المنقولة إلى كبسولات أسطورتها.'
    vue:
      title: 'عرض، مدفوع'
      description: 'نفس الشريط، أجزائه مُعطاة كبيانات. جزء لا يؤدي إلى أي مكان يستجيب لنقرة بـ `select`، وهو ما يجب الاستماع إليه لجدول يقوم بتصفية نفسه بجانبه.'
  bar:
    pipeline: 'صفحات الكتالوج'
    elements: 'عناصر نظام التصميم'
    partial: 'الملفات المقروءة'
  state:
    done: منجز
    running: يعمل
    todo: لعمله
    failed: فشل
    skipped: 'لم يبدأ'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: বিতরণ
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'একটি মোট কিসের তৈরি, এক লাইনে। যেখানে একটি অগ্রগতির বার বলে কিভাবে একটি মান পৌঁছেছে, এটি বলে কিভাবে একটি সম্পূর্ণ ভাগ হয়: অংশগুলি তাদের দেওয়া ক্রমে থাকে, তাই একটি পাইপলাইন বাম থেকে ডানে পড়ে যেমন এটি একটি পাইপলাইন। রাজ্যগুলি সেই শব্দভান্ডার দিয়ে নামকরণ করা হয় যা ক্যাপসুল এবং সার্কেল ইতিমধ্যেই বলছে, তাই একটি রাজ্য কখনও দুইটি রঙ নেয় না।'
  section:
    default:
      title: 'একটি সম্পূর্ণ, অংশে'
      description: 'অংশগুলি তাদের মূল্য অনুযায়ী বাড়ে, এবং লিজেন্ড তাদের নিচে শব্দে বলে — একই ক্যাপসুল একটি টেবিলের সাথে একটি রাজ্য আঁকে, তাই চোখ দুটি মধ্যে চলে যায় কিছু নতুন শেখার ছাড়াই।'
    linked:
      title: 'কোথাও নিয়ে যাওয়া অংশ'
      description: 'একটি লক্ষ্যযুক্ত অংশ একটি লিঙ্ক: বারটি যে তালিকায় এটি সারাংশ দেয় সেখানে প্রবেশের পথ হয়ে ওঠে। পয়েন্টারের নিচে এটি একটি আলোর ফিল্ম নেয় অন্য রঙের পরিবর্তে, যা একটি ভিন্ন রাষ্ট্র বলবে।'
    bare:
      title: 'লিজেন্ড ছাড়া'
      description: 'যেখানে অংশগুলি পাশে নামকরণ করা হয়েছে, অথবা যেখানে বারটি কেবল বিষয়টির আকার বলার জন্য, সেখানে লিজেন্ডটি বাদ দেওয়া হয় এবং প্রতিটি অংশ পয়েন্টারের নিচে বলে এটি কি।'
    rest:
      title: 'এর অংশের চেয়ে বড় একটি মোট'
      description: 'যা মোট গণনা করে এবং কোন অংশ হিসাব করে না তা তার সারিতে অংশ ধারণ করে এবং কিছু আঁকে না: ট্র্যাকটি ঠিক সেই পরিমাণের জন্য দেখায়, অংশগুলি একটি বার পূর্ণ করতে প্রসারিত হওয়ার পরিবর্তে যা তারা পূর্ণ করে না।'
    empty:
      title: 'এখনও কিছু গোনা হয়নি'
      description: 'কোন মোট এবং কোন অংশ — কাজ শুরু হয়নি, একটি হিসাব এখনও বাইরে। বারটি তার স্থান ধরে রাখে, একটি নগ্ন ট্র্যাক হিসাবে — একই মাটির একটি মোট যা এর অংশের চেয়ে বড় দেখায় — তাই তাদের একটি সারি তার আকার রক্ষা করে; এর সংখ্যা একটি ড্যাশ, যেহেতু কিছু গোনা হয়নি তা শূন্য নয়।'
    compact:
      title: সংক্ষিপ্ত
      description: 'একটি সারি বা একটি কার্ড ফুটারের জন্য একটি পাতলা বার, যার ঘনত্ব তার লিজেন্ডের ক্যাপসুলগুলিতে প্রেরিত হয়।'
    vue:
      title: 'ভিউ, চালিত'
      description: 'একই বার, এর অংশগুলি ডেটা হিসাবে দেওয়া হয়েছে। একটি অংশ যা কোথাও নিয়ে যায় না একটি ক্লিকের সাথে `select` এর উত্তর দেয়, যা একটি টেবিলের জন্য শোনা উচিত যা পাশে নিজেই ফিল্টার করে।'
  bar:
    pipeline: 'ক্যাটালগের পৃষ্ঠা'
    elements: 'ডিজাইন সিস্টেমের উপাদানগুলি'
    partial: 'পড়া ফাইল'
  state:
    done: সম্পন্ন
    running: চলছে
    todo: 'করতে হবে'
    failed: ব্যর্থ
    skipped: 'শুরু হয়নি'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Verteilung
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'Woraus eine Gesamtheit besteht, in einer Zeile. Wo ein Fortschrittsbalken anzeigt, wie weit ein Wert fortgeschritten ist, zeigt dies, wie eine Gesamtheit unterteilt ist: die Teile haben die Reihenfolge, in der sie gegeben sind, sodass eine Pipeline von links nach rechts wie die Pipeline gelesen wird, die sie ist. Die Zustände sind mit dem Vokabular benannt, das die Kapsel und der Kreis bereits sprechen, sodass ein Zustand niemals zwei Farben annimmt.'
  section:
    default:
      title: 'Eine Gesamtheit, in Teilen'
      description: 'Die Teile wachsen proportional zu ihrem Wert, und die Legende beschreibt sie in Worten darunter – dieselbe Kapsel, mit der ein Tisch einen Zustand darstellt, sodass das Auge zwischen den beiden wechselt, ohne etwas Neues zu lernen.'
    linked:
      title: 'Teile, die irgendwohin führen'
      description: 'Ein Teil mit einem Ziel ist ein Link: der Balken wird zum Zugang zur Liste, die er zusammenfasst. Unter dem Zeiger nimmt er einen Lichtschein anstelle einer anderen Farbe an, was einen anderen Zustand anzeigen würde.'
    bare:
      title: 'Ohne die Legende'
      description: 'Wo die Teile direkt daneben benannt sind oder wo der Balken nur die Form der Sache angeben muss, wird die Legende weggelassen und jedes Teil sagt, was es unter dem Zeiger ist.'
    rest:
      title: 'Eine Gesamtheit, die größer ist als ihre Teile'
      description: 'Was die Gesamtheit zählt und kein Teil dafür verantwortlich ist, hat seinen Anteil an der Reihe und zeichnet nichts: die Spur zeigt sich genau für so viel, anstatt dass die Teile sich ausdehnen, um einen Balken zu füllen, den sie nicht füllen.'
    empty:
      title: 'Noch nichts gezählt'
      description: 'Keine Gesamtheit und kein Teil – Arbeit nicht begonnen, ein Zähler noch aus. Der Balken behält seinen Platz als bare Spur – derselbe Boden, den eine Gesamtheit, die größer ist als ihre Teile, zeigt – sodass eine Reihe davon ihre Form behält; ihre Figur ist ein Strich, da nichts gezählt nicht null ist.'
    compact:
      title: Kompakt
      description: 'Ein schmalerer Balken für eine Reihe oder einen Kartenfuß, wobei die Dichte an die Kapseln seiner Legende weitergegeben wird.'
    vue:
      title: 'Vue, getrieben'
      description: 'Der gleiche Balken, seine Teile als Daten angegeben. Ein Teil, das nirgendwohin führt, reagiert auf einen Klick mit `select`, was man beachten sollte, wenn sich ein Tisch daneben selbst filtert.'
  bar:
    pipeline: 'Seiten des Katalogs'
    elements: 'Elemente des Designsystems'
    partial: 'Gelesene Dateien'
  state:
    done: Fertig
    running: Läuft
    todo: 'Zu erledigen'
    failed: Fehlgeschlagen
    skipped: 'Nicht gestartet'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Distribución
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'De qué se compone un total, en una línea. Donde una barra de progreso indica hasta dónde ha llegado un valor, esto indica cómo se divide un todo: las partes mantienen el orden en que se presentan, así que un pipeline se lee de izquierda a derecha como el pipeline que es. Los estados están nombrados con el vocabulario que ya habla la cápsula y el círculo, así que un estado nunca toma dos colores.'
  section:
    default:
      title: 'Un todo, en partes'
      description: 'Las partes crecen en proporción a lo que valen, y la leyenda las dice en palabras debajo — la misma cápsula que dibuja un estado en una tabla, así que el ojo se mueve entre los dos sin aprender nada nuevo.'
    linked:
      title: 'Partes que llevan a algún lado'
      description: 'Una parte con un objetivo es un enlace: la barra se convierte en el camino hacia la lista que resume. Bajo el puntero toma un destello de luz en lugar de otro color, que diría un estado diferente.'
    bare:
      title: 'Sin la leyenda'
      description: 'Donde las partes están nombradas justo al lado, o donde la barra solo tiene que decir la forma de la cosa, se omite la leyenda y cada parte dice lo que es bajo el puntero.'
    rest:
      title: 'Un total mayor que sus partes'
      description: 'Lo que cuenta el total y ninguna parte contabiliza sostiene su parte de la fila y no dibuja nada: la pista se muestra exactamente así, en lugar de que las partes se estiren para llenar una barra que no llenan.'
    empty:
      title: 'Nada contado aún'
      description: 'Sin total y sin parte — trabajo no comenzado, un recuento aún pendiente. La barra mantiene su lugar, como una pista desnuda — el mismo terreno que un total mayor que sus partes muestra a través — así que una fila de ellas mantiene su forma; su figura es un guion, ya que nada contado no es cero.'
    compact:
      title: Compacto
      description: 'Una barra más delgada para una fila o un pie de tarjeta, con la densidad transmitida a las cápsulas de su leyenda.'
    vue:
      title: 'Vue, impulsado'
      description: 'La misma barra, sus partes dadas como datos. Una parte que no lleva a ningún lado responde a un clic con `select`, que es lo que hay que escuchar para una tabla que se filtra a sí misma al lado.'
  bar:
    pipeline: 'Páginas del catálogo'
    elements: 'Elementos del sistema de diseño'
    partial: 'Archivos leídos'
  state:
    done: Hecho
    running: 'En curso'
    todo: 'Por hacer'
    failed: Fallido
    skipped: 'No comenzado'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: توزیع
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'مجموعی که از چه چیزهایی تشکیل شده است، در یک خط. جایی که نوار پیشرفت نشان می‌دهد که یک مقدار چقدر پیش رفته، اینجا نشان می‌دهد که یک کل چگونه تقسیم می‌شود: اجزا به ترتیبی که داده شده‌اند نگهداری می‌شوند، بنابراین یک لوله‌کشی از چپ به راست خوانده می‌شود مانند لوله‌کشی که هست. وضعیت‌ها با واژگانی که کپسول و دایره قبلاً صحبت کرده‌اند نامگذاری شده‌اند، بنابراین یک وضعیت هرگز دو رنگ نمی‌گیرد.'
  section:
    default:
      title: 'یک کل، به اجزا'
      description: 'اجزا به نسبت ارزشی که دارند رشد می‌کنند و افسانه آنها را به کلمات زیر می‌گوید — همان کپسولی که یک جدول با آن وضعیت را ترسیم می‌کند، بنابراین چشم بین این دو حرکت می‌کند بدون اینکه چیز جدیدی یاد بگیرد.'
    linked:
      title: 'اجزا که به جایی می‌روند'
      description: 'یک جز با هدف یک لینک است: نوار به راهی به لیستی که خلاصه می‌کند تبدیل می‌شود. زیر نشانگر، یک فیلم نور می‌گیرد به جای رنگ دیگری که وضعیت متفاوتی را بیان کند.'
    bare:
      title: 'بدون افسانه'
      description: 'جایی که اجزا درست کنار هم نامگذاری شده‌اند، یا جایی که نوار فقط باید شکل چیز را بگوید، افسانه حذف می‌شود و هر جز زیر نشانگر می‌گوید که چیست.'
    rest:
      title: 'مجموعی بزرگتر از اجزای آن'
      description: 'آنچه مجموع حساب می‌کند و هیچ جزئی برای آن حساب نمی‌شود سهم خود را از ردیف نگه می‌دارد و چیزی ترسیم نمی‌کند: مسیر دقیقاً به همین مقدار نمایان می‌شود، به جای اینکه اجزا برای پر کردن نوار که پر نمی‌کنند بکشند.'
    empty:
      title: 'هیچ چیزی هنوز شمرده نشده'
      description: 'نه مجموع و نه جز — کار شروع نشده، یک شمارش هنوز در حال انجام است. نوار جای خود را نگه می‌دارد، مانند یک مسیر خالی — همان زمینی که مجموع بزرگتر از اجزای آن از آن نمایان می‌شود — بنابراین یک ردیف از آنها شکل خود را حفظ می‌کند؛ شکل آن یک خط است، چون هیچ چیزی که شمرده شده است صفر نیست.'
    compact:
      title: فشرده
      description: 'یک نوار نازک‌تر برای یک ردیف یا فوتر کارت، با چگالی منتقل شده به کپسول‌های افسانه‌اش.'
    vue:
      title: 'Vue، هدایت شده'
      description: 'همان نوار، اجزا به عنوان داده داده شده‌اند. یک جز که به جایی نمی‌رود به کلیک با `select` پاسخ می‌دهد، که چیزی است که باید برای جدولی که خود را کنار آن فیلتر می‌کند گوش داد.'
  bar:
    pipeline: 'صفحات کاتالوگ'
    elements: 'اجزای سیستم طراحی'
    partial: 'فایل‌های خوانده شده'
  state:
    done: 'انجام شده'
    running: 'در حال اجرا'
    todo: 'برای انجام'
    failed: ناموفق
