fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Distribution
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: "Ce que représente un total, en une ligne. Là où une barre de progression indique jusqu'où une valeur est arrivée, cela indique comment un tout se divise : les parties conservent l'ordre dans lequel elles sont données, donc un pipeline se lit de gauche à droite comme le pipeline qu'il est. Les états sont nommés avec le vocabulaire que la capsule et le cercle parlent déjà, donc un état ne prend jamais deux couleurs."
  section:
    default:
      title: 'Un tout, en parties'
      description: "Les parties croissent en proportion de leur valeur, et la légende les nomme en mots en dessous — la même capsule qu'un tableau dessine un état avec, donc l'œil se déplace entre les deux sans rien apprendre de nouveau."
    linked:
      title: 'Parties qui mènent quelque part'
      description: "Une partie avec un objectif est un lien : la barre devient le chemin vers la liste qu'elle résume. Sous le pointeur, elle prend un film de lumière plutôt qu'une autre couleur, ce qui indiquerait un état différent."
    bare:
      title: 'Sans la légende'
      description: "Là où les parties sont nommées juste à côté, ou là où la barre doit simplement indiquer la forme de la chose, la légende est abandonnée et chaque partie indique ce qu'elle est sous le pointeur."
    rest:
      title: 'Un total plus grand que ses parties'
      description: "Ce que le total compte et aucune partie ne compte pour tient sa part de la rangée et ne dessine rien : la piste montre à travers pour exactement cela, au lieu que les parties s'étirent pour remplir une barre qu'elles ne remplissent pas."
    empty:
      title: 'Rien compté encore'
      description: "Pas de total et pas de partie — travail non commencé, un compte toujours en attente. La barre garde sa place, comme une piste nue — le même sol qu'un total plus grand que ses parties montre à travers — donc une rangée d'eux garde sa forme ; sa figure est un tiret, puisque rien compté n'est pas zéro."
    compact:
      title: Compact
      description: 'Une barre plus fine pour une rangée ou un pied de carte, avec la densité transmise aux capsules de sa légende.'
    vue:
      title: 'Vue, animée'
      description: "La même barre, ses parties données comme données. Une partie qui ne mène nulle part répond à un clic avec `select`, qui est ce qu'il faut écouter pour un tableau qui se filtre lui-même à côté."
  bar:
    pipeline: 'Pages du catalogue'
    elements: 'Éléments du système de design'
    partial: 'Fichiers lus'
  state:
    done: Fait
    running: 'En cours'
    todo: 'À faire'
    failed: Échoué
    skipped: 'Non commencé'

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: הפצה
  page_icon: 'ph:bold/chart-bar-horizontal'
  intro: 'מה כולל סך הכול, בשורה אחת. בעוד שפס ההתקדמות מראה עד כמה ערך אחד התקדם, זה מראה כיצד הכול מתחלק: החלקים שומרים על הסדר שבו הם נתנים, כך שפייפליין נקרא משמאל לימין כמו הפייפליין שהוא. המדינות נקראות עם המונחים שהקפסולה והמעגל כבר מדברים, כך שמדינה אחת אף פעם לא לוקחת שני צבעים.'
  section:
    default:
      title: 'שלם, בחלקים'
      description: 'החלקים גדלים בהתאם למה שהם שווים, והאגדה אומרת אותם במילים מתחת — אותה קפסולה שבה טבלה מציירת מצב, כך שהעין נעה בין השניים מבלי ללמוד משהו חדש.'
    linked:
      title: 'חלקים שמובילים לאנשהו'
      description: 'חלק עם יעד הוא קישור: הפס הופך לדרך לרשימה שהוא מסכם. מתחת למצב, הוא מקבל סרט של אור במקום צבע אחר, שהיה אומר מצב שונה.'
    bare:
      title: 'בלי האגדה'
      description: 'כאשר החלקים נקראים מיד ליד, או כאשר הפס רק צריך לומר את הצורה של הדבר, האגדה נזרקת וכל חלק אומר מה הוא מתחת למצב.'
    rest:
      title: 'סך הכול גדול יותר מחלקיו'
      description: 'מה שסך הכול סופר ולא חלק מתחשב בו מחזיק את חלקו בשורה ומצייר כלום: המסילה מראה בדיוק על כך, במקום שהחלקים יתמשכו למלא פס שהם לא ממלאים.'
    empty:
      title: 'עדיין לא נרשם כלום'
      description: 'לא סך הכול ולא חלק — עבודה לא התחילה, ספירה עדיין לא קיימת. הפס שומר על מקומו, כמו מסילה חשופה — אותו קרקע שסך הכול גדול יותר מחלקיו מראה דרכו — כך ששורה מהם שומרת על צורתה; הדמות שלה היא מקף, מכיוון שאין שום דבר שנחשב שהוא לא אפס.'
    compact:
      title: קומפקטי
      description: 'פס דק יותר עבור שורה או תפריט כרטיס, עם הצפיפות מועברת לקפסולות של האגדה שלו.'
    vue:
      title: 'Vue, מונע'
      description: 'אותו פס, חלקיו ניתנים כנתונים. חלק שמוביל לשום מקום מגיב ללחיצה עם `select`, שזה מה שיש להקשיב לו עבור טבלה שמסננת את עצמה לצידה.'
