page_icon: 'ph:bold/spinner-gap'
intro: 'Bir şeyler oluyor ve sonu bilinmiyor. Her ikisi de bunu söylüyor ve daha fazlasını söylemeyi reddediyor - sonun bilindiği yerde, bir sonraki sekmedeki çubuk bunu söylüyor.'
section:
  spinner:
    title: Dönme
