  dots:
    title: Noktalar
    description: 'Bir şey söylenmek üzere. Aynı üç boyut ve aynı hizalamalar - değişen, okuyucunun kimin gelmesini beklediğidir.'
  vue:
    title: Vue
    description: 'Her ikisi de vue parçaları olarak da gönderilir, aynı seçenekleri alır ve çalışırken bekleyecek bir şey olup olmadığını belirleyen bir sayfa için.'
spinner:
  label: Yükleniyor
  inline: 'Veri işleniyor'
dots:
  label: Bekleniyor
