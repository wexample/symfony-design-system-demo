page_title: Marcadores
page_icon: 'ph:bold/seal-check'
intro: 'Uma cápsula para tudo o que foi dito sobre algo em uma palavra: um estado, um nome, uma versão, uma categoria. Eram dois objetos até o dia em que um código e um estado ficaram lado a lado em um cabeçalho, um cabeça de distância, e ninguém pôde dizer o que a diferença significava — então a forma é uma e o tom é o todo do que os distingue. O que carrega é livre: uma palavra, uma figura, um glifo, ou dois dos três. O círculo está onde não há espaço para uma cápsula, e o contador, que pendura de uma linha e é dimensionado no texto do qual pendura, é a única coisa aqui que não é um marcador.'
section:
  inline:
    title: 'No meio de uma frase'
    description: 'Uma palavra destacada enquanto é lida: uma versão, uma fase, uma categoria. O tom neutro, porque um marcador que chega colorido já fez uma afirmação sobre o que marca — e em uma frase não há nada a reivindicar.'
  palette:
    title: 'As categorias'
    description: 'Tons que distinguem as coisas sem classificá-las. Eles não carregam significado — nada diz que o terceiro é melhor que o quinto — o que é exatamente o que os torna utilizáveis para uma taxonomia, onde o significado seria uma mentira. Usados exatamente como um estado é: mesma cápsula, mesmo ritmo.'
  against:
    title: 'Um contador ao lado de um marcador'
    description: 'A única distinção restante, e não se trata de significado. À esquerda um contador: doze de algo, pendurado na linha que leva a ele e dimensionado no texto dessa linha. À direita um marcador: doze de algo que foi bem, de pé e dimensionado em tokens. Uma contagem ao lado de um item de menu é um contador; a mesma figura em uma coluna de pipeline é um marcador.'
  words:
    title: 'Um estado em palavras'
    description: 'Anunciado em uma frase ou ao lado de um título, onde é a mensagem em vez de uma marca em uma coluna.'
  figures:
    title: 'Um estado lido em dúzias'
    description: 'Em uma coluna, uma marca ao lado de uma contagem neutra é lida como dois objetos e uma tabela deles é lida como ruído. Aqui a cor envolve a figura e a coluna é escaneada em uma única passada — compacta, já que uma célula não tem espaço a sobrar.'
  payload:
    title: 'O que carrega'
    description: 'Uma palavra para o que o estado é, uma figura para quantos existem, ambos, ou nenhum. A figura está sempre desenhada um passo atrás do resto: ela qualifica o estado, não é o estado.'
  weights:
    title: 'As três formas lado a lado'
    description: 'A mesma informação no lugar onde realmente é lida. O círculo é a forma para uma célula muito estreita para uma cápsula, e a única que pode mostrar um estado sendo uma quantidade — e é desenhada com a mesma cor que a cápsula preenche.'
  circles:
    title: Círculos
    description: 'Um estado contado por um círculo em vez de por uma palavra, para um lugar onde os estados são lidos em dúzias — uma lista de execuções, uma linha de trabalhos. O anel carrega a cor, o glifo dentro diz qual estado é, e ambos os lados da pilha desenham a mesma marcação.'
  progress:
    title: 'Um estado que é uma quantidade'
    description: 'Uma execução é o único estado com uma quantidade a ele, então seu anel é desenhado até onde a execução chegou. Twig imprime o valor que lhe é dado; movê-lo depois é responsabilidade do navegador.'
  sizes:
    title: 'Tamanhos de círculos'
  vue:
    title: Vue
    description: 'O mesmo componente, acionado: mudar o tipo ou o valor move o arco em vez de redesenhá-lo. Este é o que um app coloca quando o estado vai mudar diante dos olhos do leitor.'
  code:
    title: Uso
