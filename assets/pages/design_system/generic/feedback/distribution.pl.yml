~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Dystrybucja
page_icon: 'ph:bold/chart-bar-horizontal'
intro: "Z czego składa się całość, w jednym zdaniu. Gdzie pasek postępu wskazuje, jak daleko zaszedł jeden z wartości, to pokazuje, jak całość się dzieli: części mają porządek, w jakim są podane, więc pipeline czyta z lewej do prawej, jak to jest w przypadku pipeline'u. Stany nazywane są słownictwem, którym już posługuje się kapsuła i okrąg, więc jeden stan nigdy nie przyjmuje dwóch kolorów."
section:
  default:
    title: 'Całość, w częściach'
    description: 'Części rosną proporcjonalnie do swojej wartości, a legenda opisuje je słowami poniżej — ta sama kapsuła, którą tabela przedstawia stan, więc oko porusza się między nimi, nie ucząc się niczego nowego.'
  linked:
    title: 'Części, które prowadzą gdzieś'
    description: 'Część z celem to link: pasek staje się drogą do listy, którą podsumowuje. Pod wskaźnikiem przyjmuje obrazek światła zamiast innego koloru, co sugerowałoby inny stan.'
  bare:
    title: 'Bez legendy'
    description: 'Gdzie części są nazywane tuż obok, lub gdzie pasek ma tylko mówić o kształcie rzeczy, legenda jest pomijana, a każda część mówi, czym jest pod wskaźnikiem.'
  rest:
    title: 'Całość większa niż jej części'
    description: 'To, co całkowita liczba liczy, a żadna część tego nie ujmuje, zajmuje swoją część rzędu i nic nie rysuje: tor pokazuje się na dokładnie tyle, zamiast części rozciągających się, aby wypełnić pasek, którego nie wypełniają.'
  empty:
    title: 'Nic jeszcze nie policzone'
    description: 'Brak całości i brak części — praca nie rozpoczęta, rachunek wciąż otwarty. Pasek zajmuje swoje miejsce, jako nagi tor — ta sama ziemia, przez którą pokazuje się całość większa niż jej części — więc rząd z nich zachowuje swój kształt; jego figura to kreska, ponieważ nic policzone nie jest zerem.'
  compact:
    title: Kompaktowy
    description: 'Cieńszy pasek dla rzędu lub stopki karty, z gęstością przekazywaną do kapsuł w jego legendzie.'
  vue:
    title: 'Vue, napędzany'
    description: 'Ten sam pasek, jego części podane jako dane. Część, która nie prowadzi nigdzie, odpowiada na kliknięcie `select`, co jest tym, na co należy zwracać uwagę w tabeli, która filtruje się obok.'
bar:
  pipeline: 'Strony katalogu'
  elements: 'Elementy systemu projektowania'
  partial: 'Przeczytane pliki'
state:
  done: Zrobione
  running: 'W trakcie'
  todo: 'Do zrobienia'
  failed: Niepowodzenie
  skipped: 'Nie rozpoczęte'
