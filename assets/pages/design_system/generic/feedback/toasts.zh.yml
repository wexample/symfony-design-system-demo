~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 反馈
page_icon: 'ph:bold/notification'
section:
  vue:
    title: Vue
    description: '与 Vue 部件相同的吐司。关闭在这里发出，而不是动画消失：在 Vue 树内部，父级拥有列表。'
  simple_toast:
    description: 显示一个简单的吐司
    button: 打开吐司
    title: 吐司演示
    message: '来自 ToastService + ToastStack 的问候。您还可以在消息中定义动作链接，如 @action:demo(这个) 。'
  tl_toast:
    description: 显示一个左上角的吐司堆栈
    button: 打开吐司
    title: 左上角吐司
    message: '来自 ToastService + ToastStack (TL) 的问候。'
  medium_toast:
    description: 显示一个中等长度的吐司消息
    button: 打开吐司
    title: 中等吐司
    message: 这是一个中等长度的吐司消息用于演示。
  long_toast:
    description: 显示一个长吐司消息
    button: 打开吐司
    title: 长吐司
    message: 这是一个较长的吐司消息用于演示。它包含更多文本，以便您预览组件在更大内容时的表现。
  horizontal_toasts:
    description: 在水平堆栈中显示四个吐司
    info:
      title: 信息吐司
      message: 水平吐司预览。
      button: 显示吐司
    success:
      title: 成功吐司
      message: 一切看起来不错。
      button: 显示吐司
    warning:
      title: 警告吐司
      message: 请仔细检查此操作。
      button: 显示吐司
    error:
      title: 错误吐司
      message: 这里出现了一些问题。
      button: 显示吐司
title:
  toasts: 吐司
