~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: لوڈرز
page_icon: 'ph:bold/spinner-gap'
intro: 'کچھ ہو رہا ہے اور اس کا اختتام معلوم نہیں ہے۔ دونوں یہ بہت کچھ کہتے ہیں اور مزید کچھ کہنے سے انکار کرتے ہیں — جہاں اختتام معلوم ہے، وہاں اگلے ٹیب پر بار یہ کہتا ہے۔'
section:
  spinner:
    title: اسپنر
    description: 'ایک مشین مصروف ہے۔ تین سائز، اور ایک ان لائن ترتیب جب یہ متن کی ایک لائن میں کھڑا ہو بجائے اس کے کہ اپنے الگ باکس میں۔'
  dots:
    title: ڈاٹس
    description: 'کچھ کہا جانے والا ہے۔ وہی تین سائز، اور وہی ترتیبیں — جو چیز بدلتی ہے وہ یہ ہے کہ قاری کس کا انتظار کر رہا ہے۔'
  vue:
    title: ویو
    description: 'دونوں ویو پارشلز کے طور پر بھی بھیجے جا رہے ہیں، وہی اختیارات لیتے ہیں، ایک صفحے کے لیے جو یہ طے کرتا ہے کہ کیا کچھ انتظار کرنے کے لیے ہے یا نہیں۔'
spinner:
  label: 'لوڈ ہو رہا ہے'
  inline: 'ڈیٹا پر عملدرآمد ہو رہا ہے'
dots:
  label: 'انتظار کر رہا ہے'
  inline: 'دوسری طرف لکھ رہی ہے'
