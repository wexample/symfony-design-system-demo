~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ফিডব্যাক
page_icon: 'ph:bold/notification'
section:
  vue:
    title: ভিউ
    description: 'একটি ভিউ আংশিকের মতো একই টোস্ট। এখানে বন্ধ করা হয়েছে, অ্যানিমেটেড না হয়ে: একটি ভিউ গাছের মধ্যে প্যারেন্ট তালিকাটি মালিকানা নিয়ে থাকে।'
  simple_toast:
    description: 'একটি সাধারণ টোস্ট দেখান'
    button: 'টোস্ট খুলুন'
    title: 'টোস্ট ডেমো'
    message: 'টোস্টসার্ভিস + টোস্টস্ট্যাক থেকে হ্যালো। আপনি একটি বার্তার মধ্যে @action:demo(এইটি) এর মতো অ্যাকশন লিঙ্কও সংজ্ঞায়িত করতে পারেন।'
  tl_toast:
    description: 'একটি উপরের-বাঁয়ে টোস্ট স্ট্যাক দেখান'
    button: 'টোস্ট খুলুন'
    title: 'উপরের-বাঁয়ে টোস্ট'
    message: 'টোস্টসার্ভিস + টোস্টস্ট্যাক (TL) থেকে হ্যালো।'
  medium_toast:
    description: 'একটি মাঝারি দৈর্ঘ্যের টোস্ট বার্তা দেখান'
    button: 'টোস্ট খুলুন'
    title: 'মাঝারি টোস্ট'
    message: 'এটি ডেমোর জন্য একটি মাঝারি দৈর্ঘ্যের টোস্ট বার্তা।'
  long_toast:
    description: 'একটি দীর্ঘ টোস্ট বার্তা দেখান'
    button: 'টোস্ট খুলুন'
    title: 'দীর্ঘ টোস্ট'
    message: 'এটি ডেমোর জন্য একটি দীর্ঘ টোস্ট বার্তা। এতে আরও বেশি টেক্সট রয়েছে, তাই আপনি দেখতে পারেন কিভাবে উপাদানটি বড় কনটেন্টের সাথে আচরণ করে।'
  horizontal_toasts:
    description: 'চারটি টোস্ট একটি অনুভূমিক স্ট্যাকে দেখান'
    info:
      title: 'তথ্য টোস্ট'
      message: 'একটি অনুভূমিক টোস্ট প্রিভিউ।'
      button: 'টোস্ট দেখান'
    success:
      title: 'সফল টোস্ট'
      message: 'এখানে সবকিছু ভালো মনে হচ্ছে।'
      button: 'টোস্ট দেখান'
    warning:
      title: 'সতর্কতা টোস্ট'
      message: 'এই ক্রিয়াটি দ্বিগুণ চেক করুন।'
      button: 'টোস্ট দেখান'
    error:
      title: 'ত্রুটি টোস্ট'
      message: 'এখানে কিছু সমস্যা হয়েছে।'
      button: 'টোস্ট দেখান'
title:
  toasts: টোস্ট
