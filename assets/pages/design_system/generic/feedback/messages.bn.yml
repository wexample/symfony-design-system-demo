~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: বার্তা
page_icon: 'ph:bold/notification'
section:
  block:
    title: 'বার্তা ব্লক করুন'
  compact:
    title: 'সংক্ষিপ্ত বার্তা'
    description: 'এটি একটি অ-framed ভ্যারিয়েন্ট, যা একটি স্থায়ী নিয়ম বলার জন্য ব্যবহৃত হয়, ঘটনা রিপোর্ট করার জন্য নয়। বিকল্পগুলিতে সংক্ষিপ্ত পাস করুন।'
  default:
    title: 'বার্তার প্রকার'
  vue:
    title: ভিউ
    description: 'ভিউ পার্সিয়াল-এর চারটি স্বাদ, প্রতিটি তার টুইগ ফাংশনের জন্য কলার-এ আইকন বহন করে।'
compact:
  rule:
    one: 'একটি আউটগোয়িং ইনভয়েসকে একটি ইনকামিংয়ের সাথে সংযুক্ত হতে হবে, এটি একটি বিক্রয় না হলে।'
    two: 'আউটগোয়িং ইনভয়েসগুলি একটি প্রশাসক দ্বারা তৈরি করতে হবে।'
    three: 'প্রথমে পুরো পরিমাণ বরাদ্দ করতে হবে, তারপর ইনভয়েসটি জারি করা যাবে।'
message:
  info:
    title: 'তথ্য বার্তা'
    body: 'এটি একটি সংক্ষিপ্ত তথ্য বার্তা।'
  success:
    title: 'সফল বার্তা'
    body: 'কার্যটি সফলভাবে সম্পন্ন হয়েছে।'
  warning:
    title: 'সতর্কতা বার্তা'
    body: 'কিছু আপনার মনোযোগের প্রয়োজন।'
  error:
    title: 'ত্রুটি বার্তা'
    body: 'অনুরোধ প্রক্রিয়া করার সময় একটি ত্রুটি ঘটেছে।'
