~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: הפצה
page_icon: 'ph:bold/chart-bar-horizontal'
intro: 'מה כולל סך הכול, בשורה אחת. בעוד שפס ההתקדמות מראה עד כמה ערך אחד התקדם, זה מראה כיצד הכול מתחלק: החלקים שומרים על הסדר שבו הם נתנים, כך שפייפליין נקרא משמאל לימין כמו הפייפליין שהוא. המדינות נקראות עם המונחים שהקפסולה והמעגל כבר מדברים, כך שמדינה אחת אף פעם לא לוקחת שני צבעים.'
section:
  default:
    title: 'שלם, בחלקים'
    description: 'החלקים גדלים בהתאם למה שהם שווים, והאגדה אומרת אותם במילים מתחת — אותה קפסולה שבה טבלה מציירת מצב, כך שהעין נעה בין השניים מבלי ללמוד משהו חדש.'
  linked:
    title: 'חלקים שמובילים לאנשהו'
    description: 'חלק עם יעד הוא קישור: הפס הופך לדרך לרשימה שהוא מסכם. מתחת למצב, הוא מקבל סרט של אור במקום צבע אחר, שהיה אומר מצב שונה.'
  bare:
    title: 'בלי האגדה'
    description: 'כאשר החלקים נקראים מיד ליד, או כאשר הפס רק צריך לומר את הצורה של הדבר, האגדה נזרקת וכל חלק אומר מה הוא מתחת למצב.'
  rest:
    title: 'סך הכול גדול יותר מחלקיו'
    description: 'מה שסך הכול סופר ולא חלק מתחשב בו מחזיק את חלקו בשורה ומצייר כלום: המסילה מראה בדיוק על כך, במקום שהחלקים יתמשכו למלא פס שהם לא ממלאים.'
  empty:
    title: 'עדיין לא נרשם כלום'
    description: 'לא סך הכול ולא חלק — עבודה לא התחילה, ספירה עדיין לא קיימת. הפס שומר על מקומו, כמו מסילה חשופה — אותו קרקע שסך הכול גדול יותר מחלקיו מראה דרכו — כך ששורה מהם שומרת על צורתה; הדמות שלה היא מקף, מכיוון שאין שום דבר שנחשב שהוא לא אפס.'
  compact:
    title: קומפקטי
    description: 'פס דק יותר עבור שורה או תפריט כרטיס, עם הצפיפות מועברת לקפסולות של האגדה שלו.'
  vue:
    title: 'Vue, מונע'
    description: 'אותו פס, חלקיו ניתנים כנתונים. חלק שמוביל לשום מקום מגיב ללחיצה עם `select`, שזה מה שיש להקשיב לו עבור טבלה שמסננת את עצמה לצידה.'
bar:
  pipeline: 'עמודים בקטלוג'
  elements: 'אלמנטים של מערכת העיצוב'
  partial: 'קבצים נקראים'
state:
  done: בוצע
  running: רץ
  todo: לעשות
  failed: נכשל
  skipped: 'לא התחיל'
