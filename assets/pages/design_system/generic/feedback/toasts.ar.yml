~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'تغذية راجعة'
page_icon: 'ph:bold/notification'
section:
  vue:
    title: فيو
    description: 'نفس التنبيه كجزء من فيو. يتم إصدار إغلاق هنا بدلاً من أن يتم إزالته بشكل متحرك: داخل شجرة فيو، يمتلك الوالد القائمة.'
  simple_toast:
    description: 'عرض تنبيه بسيط'
    button: 'فتح التنبيه'
    title: 'عرض التنبيه'
    message: 'مرحبا من ToastService + ToastStack. يمكنك أيضًا تعريف روابط الإجراءات مثل @action:demo(هذا واحد) داخل رسالة.'
  tl_toast:
    description: 'عرض مجموعة تنبيهات في الجزء العلوي الأيسر'
    button: 'فتح التنبيه'
    title: 'تنبيه في الجزء العلوي الأيسر'
    message: 'مرحبا من ToastService + ToastStack (TL).'
  medium_toast:
    description: 'عرض رسالة تنبيه متوسطة الطول'
    button: 'فتح التنبيه'
    title: 'تنبيه متوسط'
    message: 'هذه رسالة تنبيه متوسطة الطول للعرض.'
  long_toast:
    description: 'عرض رسالة تنبيه طويلة'
    button: 'فتح التنبيه'
    title: 'تنبيه طويل'
    message: 'هذه رسالة تنبيه أطول للعرض. تحتوي على نص أكثر حتى تتمكن من معاينة كيفية تصرف المكون مع المحتوى الأكبر.'
  horizontal_toasts:
    description: 'عرض أربعة تنبيهات في مجموعة أفقية'
    info:
      title: 'تنبيه معلومات'
      message: 'معاينة تنبيه أفقي.'
      button: 'عرض التنبيه'
    success:
      title: 'تنبيه نجاح'
      message: 'كل شيء يبدو جيدًا هنا.'
      button: 'عرض التنبيه'
    warning:
      title: 'تنبيه تحذير'
      message: 'تحقق من هذا الإجراء مرة أخرى.'
      button: 'عرض التنبيه'
    error:
      title: 'تنبيه خطأ'
      message: 'حدث شيء خاطئ هنا.'
      button: 'عرض التنبيه'
title:
  toasts: التنبيهات
