~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Caricamenti
page_icon: 'ph:bold/spinner-gap'
intro: 'Qualcosa sta accadendo e non si conosce la sua fine. Entrambi dicono questo e rifiutano di dire di più — dove la fine è conosciuta, la barra nella scheda successiva lo indica invece.'
section:
  spinner:
    title: Spinner
    description: 'Una macchina è occupata. Tre dimensioni e un allineamento inline per quando si trova in una riga di testo piuttosto che in una propria casella.'
  dots:
    title: Punti
    description: 'Qualcosa sta per essere detto. Le stesse tre dimensioni e gli stessi allineamenti — ciò che cambia è chi il lettore sta aspettando.'
  vue:
    title: Vue
    description: "Entrambi vengono forniti anche come partials vue, prendendo le stesse opzioni, per una pagina che decide mentre viene eseguita se c'è qualcosa da aspettare."
spinner:
  label: Caricamento
  inline: 'Elaborazione dati'
dots:
  label: Attesa
  inline: "L'altro lato sta scrivendo"
