~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Chargeurs
page_icon: 'ph:bold/spinner-gap'
intro: "Quelque chose se passe et la fin n'est pas connue. Les deux disent cela et refusent d'en dire plus - là où la fin est connue, la barre sur l'onglet suivant le dit à la place."
section:
  spinner:
    title: Spinners
    description: 'Une machine est occupée. Trois tailles, et un alignement en ligne pour quand il se trouve dans une ligne de texte plutôt que dans une boîte à part.'
  dots:
    title: Points
    description: "Quelque chose est sur le point d'être dit. Les mêmes trois tailles, et les mêmes alignements - ce qui change, c'est qui le lecteur attend."
  vue:
    title: Vue
    description: "Les deux sont également expédiés en tant que parties vue, prenant les mêmes options, pour une page qui décide en cours d'exécution s'il y a quelque chose à attendre."
spinner:
  label: Chargement
  inline: 'Traitement des données'
dots:
  label: 'En attente'
  inline: "L'autre côté est en train d'écrire"
