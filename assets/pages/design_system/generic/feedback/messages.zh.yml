  info:
    title: 信息消息
    body: 这是一条简短的信息消息。
  success:
    title: 成功消息
    body: 操作成功完成。
  warning:
    title: 警告消息
    body: 有些事情需要你的注意。
  error:
    title: 错误消息
    body: 处理请求时发生错误。
