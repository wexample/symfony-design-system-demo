~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 消息
page_icon: 'ph:bold/notification'
section:
  block:
    title: 阻止消息
  compact:
    title: 紧凑消息
    description: 无框变体，用于陈述固定规则而不是报告事件。将紧凑传递给选项。
  default:
    title: 消息类型
  vue:
    title: Vue
    description: 与vue部分相同的四种类型，每种都携带其twig函数为调用者放入的图标。
compact:
  rule:
    one: 外发发票必须与内发发票相关联，除非它是销售。
    two: 外发发票必须由管理员创建。
    three: 在发票可以开具之前，必须分配全部金额。
