~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: بارگذارها
page_icon: 'ph:bold/spinner-gap'
intro: 'چیزی در حال وقوع است و پایان آن مشخص نیست. هر دو اینها همین را می‌گویند و بیشتر از آن نمی‌گویند — جایی که پایان مشخص است، نوار در زبانه بعدی این را می‌گوید.'
section:
  spinner:
    title: چرخاننده
    description: 'یک دستگاه مشغول است. سه اندازه و یک تراز درون‌خطی برای زمانی که در یک خط متن قرار دارد به جای اینکه در یک جعبه جداگانه باشد.'
  dots:
    title: نقاط
    description: 'چیزی قرار است گفته شود. همان سه اندازه و همان ترازها — آنچه تغییر می‌کند این است که خواننده برای چه کسی منتظر است.'
  vue:
    title: Vue
    description: 'هر دو به عنوان بخش‌های vue نیز عرضه می‌شوند، با همان گزینه‌ها، برای صفحه‌ای که در حین اجرا تصمیم می‌گیرد آیا چیزی برای انتظار وجود دارد یا خیر.'
spinner:
  label: 'در حال بارگذاری'
  inline: 'در حال پردازش داده‌ها'
dots:
  label: منتظر
  inline: 'طرف دیگر در حال نوشتن است'
