page_title: Marcatori
page_icon: 'ph:bold/seal-check'
intro: "Una capsula per tutto ciò che è stato detto su una cosa in una parola: uno stato, un nome, una versione, una categoria. Erano due oggetti fino al giorno in cui un codice e uno stato si sono trovati fianco a fianco in un'unica intestazione, a un passo di distanza, e nessuno poteva dire cosa significasse la differenza — quindi la forma è unica e il tono è l'insieme di ciò che li distingue. Ciò che porta è libero: una parola, una figura, un glifo, o due dei tre. Il cerchio sta dove non c'è spazio per una capsula, e il contatore, che pende da una riga ed è dimensionato nel testo da cui pende, è l'unica cosa qui che non è un marcatore."
section:
  inline:
    title: 'Nel mezzo di una frase'
    description: "Una parola messa in evidenza mentre viene letta: una versione, una fase, una categoria. Il tono neutro, perché un marcatore che arriva colorato ha già fatto una rivendicazione su ciò che contrassegna — e in una frase non c'è nulla da rivendicare."
  palette:
    title: 'Le categorie'
    description: 'Toni che distinguono le cose senza classificarle. Non portano significato — nulla dice che il terzo sia meglio del quinto — il che è esattamente ciò che li rende utilizzabili per una tassonomia, dove il significato sarebbe una menzogna. Indossati esattamente come uno stato è: stessa capsula, stesso ritmo.'
  against:
    title: 'Un contatore accanto a un marcatore'
    description: "L'unica distinzione rimasta, e non riguarda il significato. A sinistra un contatore: dodici di qualcosa, pendente dalla riga che porta a esso e dimensionato nel testo di quella riga. A destra un marcatore: dodici di qualcosa che è andato bene, in piedi da solo e dimensionato in token. Un conteggio accanto a un elemento di menu è un contatore; la stessa figura in una colonna di pipeline è un marcatore."
  words:
    title: 'Uno stato in parole'
    description: 'Annunciato in una frase o accanto a un titolo, dove è il messaggio piuttosto che un segno in una colonna.'
  figures:
    title: 'Uno stato letto per dozzine'
    description: 'In una colonna, un segno accanto a un conteggio neutro viene letto come due oggetti e una tabella di essi viene letta come rumore. Qui il colore racchiude la figura e la colonna è scansionata in un colpo solo — compatta, poiché una cella non ha spazio da risparmiare.'
  payload:
    title: 'Ciò che porta'
    description: 'Una parola per ciò che è lo stato, una figura per quanti ce ne sono, entrambi, o nessuno. La figura è sempre disegnata un passo indietro rispetto al resto: qualifica lo stato, non è lo stato.'
  weights:
    title: 'Le tre forme affiancate'
    description: "Le stesse informazioni nel luogo in cui vengono effettivamente lette. Il cerchio è la forma per una cella troppo stretta per una capsula, e l'unica che può mostrare uno stato come quantità — ed è disegnata con il colore che la capsula riempie."
  circles:
    title: Cerchi
    description: "Uno stato raccontato da un cerchio piuttosto che da una parola, per un luogo in cui gli stati sono letti per dozzine — un elenco di esecuzioni, una fila di lavori. L'anello porta il colore, il glifo all'interno indica quale stato è, e entrambi i lati della pila disegnano lo stesso markup."
  progress:
    title: 'Uno stato che è una quantità'
    description: "Un'esecuzione è l'unico stato con un ammontare, quindi il suo anello è disegnato fino a dove è arrivata l'esecuzione. Twig stampa il valore che riceve; spostarlo successivamente è compito del browser."
  sizes:
    title: 'Dimensioni dei cerchi'
  vue:
    title: Vue
    description: "Lo stesso componente, pilotato: cambiare il tipo o il valore muove l'arco invece di ridisegnarlo. Questo è ciò che un'app posiziona quando lo stato sta per cambiare sotto gli occhi del lettore."
  code:
    title: Utilizzo
