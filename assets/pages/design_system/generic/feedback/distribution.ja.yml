~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 配分
page_icon: 'ph:bold/chart-bar-horizontal'
intro: 合計が何で構成されているのかを一行で示します。プログレスバーがどれだけ進んでいるかを示すのに対し、これは全体がどのように分割されているかを示します：部分は与えられた順序を保持し、パイプラインはそれに従って左から右に読み取られます。状態はカプセルとサークルが既に使っている語彙で名付けられているため、1つの状態が2つの色を持つことはありません。
section:
  default:
    title: 全体を部分に分ける
    description: '部分はそれぞれの価値に比例して成長し、伝説はその下に言葉で示します — 表が状態を描くのと同じカプセルなので、目は新しいことを学ぶことなく両者の間を移動します。'
  linked:
    title: どこかに繋がる部分
    description: ターゲットを持つ部分はリンクです：バーは要約するリストへの道になります。ポインターの下では、別の色ではなく光のフィルムを取ります。別の状態を示すことになるからです。
  bare:
    title: 伝説なしで
    description: 部分がすぐ隣に名付けられている場合、またはバーが物の形を示すだけの場合、伝説は省かれ、各部分はポインターの下で自分が何であるかを示します。
  rest:
    title: 部分よりも大きな合計
    description: 合計がカウントし、どの部分もカウントしないものは、その行のシェアを保持し、何も描きません：トラックはちょうどその分だけ見えるようにし、部分が満たしていないバーに合わせて伸びることはありません。
  empty:
    title: まだカウントされていない
    description: '合計も部分もない — 作業は始まっておらず、未集計の状態です。バーはその場所を保持し、裸のトラックとして存在します — 部分よりも大きな合計が見える同じ地面で — それでそれらの行はその形を保ちます；その形はダッシュであり、カウントされていないものはゼロではありません。'
  compact:
    title: コンパクト
    description: 行やカードのフッター用の細いバーで、密度はその伝説のカプセルに引き継がれます。
  vue:
    title: Vue、駆動
    description: 同じバーで、その部分はデータとして与えられます。どこにも繋がらない部分は、隣にあるテーブルが自己フィルタリングする際に、クリックに対して`select`で応答します。
bar:
  pipeline: カタログのページ
  elements: デザインシステムの要素
  partial: 読み込まれたファイル
state:
  done: 完了
  running: 実行中
  todo: 未着手
  failed: 失敗
  skipped: 未開始
