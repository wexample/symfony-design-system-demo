~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: লোডার
page_icon: 'ph:bold/spinner-gap'
intro: 'কিছু হচ্ছে এবং এর শেষ জানানো হয়নি। উভয়ই এটাই বলছে এবং আরও কিছু বলতে অস্বীকৃতি জানাচ্ছে — যেখানে শেষ জানা যায়, পরবর্তী ট্যাবে বারটি তা জানাচ্ছে।'
section:
  spinner:
    title: স্পিনার
    description: 'একটি মেশিন ব্যস্ত। তিনটি আকার, এবং যখন এটি একটি লেখার লাইনে দাঁড়িয়ে থাকে তখন একটি ইনলাইন অ্যালাইনমেন্ট।'
  dots:
    title: ডটস
    description: 'কিছু বলার প্রস্তুতি চলছে। একই তিনটি আকার, এবং একই অ্যালাইনমেন্ট — পরিবর্তন হচ্ছে পড়ার জন্য অপেক্ষা করা কারা।'
  vue:
    title: ভিউ
    description: 'দুটোই ভিউ পার্শিয়াল হিসেবেও পাঠানো হচ্ছে, একই অপশন নিয়ে, একটি পৃষ্ঠার জন্য যা চলাকালীন সিদ্ধান্ত নেয় যে কিছু অপেক্ষা করার আছে কিনা।'
spinner:
  label: 'লোড হচ্ছে'
  inline: 'ডেটা প্রক্রিয়াকরণ হচ্ছে'
dots:
  label: 'অপেক্ষা করছে'
  inline: 'অন্যপক্ষ লিখছে'
