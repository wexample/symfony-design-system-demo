      title: 'حباب'
      description: 'با گزینهٔ compact، بنر به حبابی به پهنای پیامش کوچک می‌شود و از لبهٔ صفحه فاصله می‌گیرد. در حالت شناور، بالا یا پایین قرار می‌گیرد.'
      top: 'حباب در بالا'
      bottom: 'حباب در پایین'
    pending_writes:
      title: 'ذخیره در پس‌زمینه'
      description: 'صفحه‌ای که بدون دکمهٔ ارسال ذخیره می‌کند، هر نوشتن را به سرویس نوشتن‌های در انتظار می‌سپارد: یک بنر نشان می‌دهد که در حال ذخیره است، سپس که همه چیز ذخیره شد، و اگر نوشتنی ناموفق بود پیوند تلاش دوباره را نگه می‌دارد. ترک صفحه در این میان تأیید می‌خواهد. برای انباشتن نوشتن‌ها چند بار کلیک کنید.'
      save: 'ذخیره'
      save_failing: 'ذخیره با خطا'

