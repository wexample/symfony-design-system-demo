    layout_banner:
      description: 'بنرها عمدتاً در سطح طراحی برای نمایش پیام‌های مهم فعالیت‌های پس‌زمینه مانند وضعیت اتصال اینترنت استفاده می‌شوند.'
      button: 'نمایش بنر'
      messages:
        info: 'پیام بنر اطلاعاتی طراحی.'
