en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Banners
  page_icon: ph:bold/notification

  section:
    vue:
      title: Vue
      description: "The same inline banner as a vue partial, taking the same type and message; the shell the banner service fills is a different file."
    banners:
      neutral: This is a neutral banner message.
      info: This is an info banner message.
      warning: This is a warning banner message.
      error: This is an error banner message.
      success: This is a success banner message.
    layout_banner:
      description: Banners are mainly used at layout level to display background activity important messages like Internet connexion status.
      button: Show banner
      messages:
        info: Layout banner info message.
        success: Layout banner success message.
        warning: Layout banner warning message.
        error: Layout banner error message.
    compact:
      title: 'Bubble'
      description: 'With compact, the banner shrinks to a bubble the width of its message, held off the edge of the screen. Floating, it sits at the top or at the bottom.'
      top: 'Bubble at the top'
      bottom: 'Bubble at the bottom'
    pending_writes:
      title: 'Saving in the background'
      description: 'A page that saves without a submit button hands each write to the pending writes service: a banner says it is saving, then that everything is saved, and keeps a retry link up when a write failed. Leaving the page meanwhile asks for confirmation. Click several times to stack writes.'
      save: 'Save'
      save_failing: 'Save and fail'

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: لافتات
  page_icon: 'ph:bold/notification'
  section:
    vue:
      title: فيو
      description: 'نفس لافتة السطر الواحد كجزء من فيو، تأخذ نفس النوع والرسالة؛ القالب الذي يملأه خدمة اللافتات هو ملف مختلف.'
    banners:
      neutral: 'هذه رسالة لافتة محايدة.'
      info: 'هذه رسالة لافتة معلوماتية.'
      warning: 'هذه رسالة لافتة تحذيرية.'
      error: 'هذه رسالة لافتة خطأ.'
      success: 'هذه رسالة لافتة نجاح.'
    layout_banner:
      description: 'تستخدم اللافتات بشكل أساسي على مستوى التخطيط لعرض الرسائل المهمة المتعلقة بالنشاط في الخلفية مثل حالة اتصال الإنترنت.'
      button: 'عرض اللافتة'
      messages:
        info: 'رسالة لافتة معلوماتية للتخطيط.'
        success: 'رسالة لافتة نجاح للتخطيط.'
        warning: 'رسالة لافتة تحذيرية للتخطيط.'
        error: 'رسالة لافتة خطأ للتخطيط.'
    compact:
      title: 'فقاعة'
      description: 'مع الخيار compact، تتقلّص اللافتة إلى فقاعة بعرض رسالتها، مبتعدة عن حافة الشاشة. وعندما تكون عائمة، تظهر في الأعلى أو في الأسفل.'
      top: 'فقاعة في الأعلى'
      bottom: 'فقاعة في الأسفل'
    pending_writes:
      title: 'الحفظ في الخلفية'
      description: 'الصفحة التي تحفظ دون زر إرسال تسلّم كل عملية كتابة إلى خدمة الكتابات المعلّقة: تعلن لافتة أن الحفظ جارٍ، ثم أن كل شيء قد حُفظ، وتُبقي رابط إعادة المحاولة ظاهرًا عند فشل عملية كتابة. ومغادرة الصفحة خلال ذلك تطلب التأكيد. انقر عدة مرات لتكديس عمليات الكتابة.'
      save: 'حفظ'
      save_failing: 'حفظ مع فشل'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: বানার
  page_icon: 'ph:bold/notification'
  section:
    vue:
      title: ভিউ
      description: 'একটি ভিউ আংশিক হিসাবে একই ইনলাইন বানার, একই প্রকার এবং বার্তা গ্রহণ করে; বানার পরিষেবাটি যে শেলের মাধ্যমে পূরণ করা হয় তা একটি ভিন্ন ফাইল।'
    banners:
      neutral: 'এটি একটি নিরপেক্ষ বানার বার্তা।'
      info: 'এটি একটি তথ্য বানার বার্তা।'
      warning: 'এটি একটি সতর্কতা বানার বার্তা।'
      error: 'এটি একটি ত্রুটি বানার বার্তা।'
      success: 'এটি একটি সফল বানার বার্তা।'
    layout_banner:
      description: 'বানারগুলি প্রধানত লেআউট স্তরে ব্যাকগ্রাউন্ড কার্যকলাপের গুরুত্বপূর্ণ বার্তা যেমন ইন্টারনেট সংযোগের স্থিতি প্রদর্শনের জন্য ব্যবহৃত হয়।'
      button: 'বানার দেখান'
      messages:
        info: 'লেআউট বানার তথ্য বার্তা।'
        success: 'লেআউট বানার সফল বার্তা।'
        warning: 'লেআউট বানার সতর্কতা বার্তা।'
        error: 'লেআউট বানার ত্রুটি বার্তা।'
    compact:
      title: 'বুদবুদ'
      description: 'compact দিলে বানারটি তার বার্তার প্রস্থের একটি বুদবুদে ছোট হয়ে যায়, পর্দার কিনারা থেকে একটু দূরে। ভাসমান অবস্থায় এটি উপরে বা নিচে থাকে।'
      top: 'উপরে বুদবুদ'
      bottom: 'নিচে বুদবুদ'
    pending_writes:
      title: 'পটভূমিতে সংরক্ষণ'
      description: 'জমা দেওয়ার বোতাম ছাড়া সংরক্ষণ করা একটি পৃষ্ঠা প্রতিটি লেখা অপেক্ষমাণ লেখা পরিষেবার হাতে দেয়: একটি বানার জানায় যে সংরক্ষণ চলছে, তারপর সব সংরক্ষিত হয়েছে, এবং কোনো লেখা ব্যর্থ হলে আবার চেষ্টার লিংক রেখে দেয়। এর মধ্যে পৃষ্ঠা ছাড়লে নিশ্চিতকরণ চাওয়া হয়। লেখা জমাতে কয়েকবার ক্লিক করুন।'
      save: 'সংরক্ষণ'
      save_failing: 'সংরক্ষণ ও ব্যর্থতা'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Banner
  page_icon: 'ph:bold/notification'
  section:
    vue:
      title: Vue
      description: 'Das gleiche Inline-Banner wie ein Vue-Teil, das denselben Typ und dieselbe Nachricht verwendet; die Hülle, die der Banner-Dienst ausfüllt, ist eine andere Datei.'
    banners:
      neutral: 'Dies ist eine neutrale Banner-Nachricht.'
      info: 'Dies ist eine Informations-Banner-Nachricht.'
      warning: 'Dies ist eine Warn-Banner-Nachricht.'
      error: 'Dies ist eine Fehler-Banner-Nachricht.'
      success: 'Dies ist eine Erfolgs-Banner-Nachricht.'
    layout_banner:
      description: 'Banner werden hauptsächlich auf Layout-Ebene verwendet, um wichtige Hintergrundaktivitätsnachrichten wie den Status der Internetverbindung anzuzeigen.'
      button: 'Banner anzeigen'
      messages:
        info: 'Layout-Banner Informationsnachricht.'
        success: 'Layout-Banner Erfolgsnachricht.'
        warning: 'Layout-Banner Warnnachricht.'
        error: 'Layout-Banner Fehlermeldung.'
    compact:
      title: 'Blase'
      description: 'Mit compact schrumpft das Banner zu einer Blase in der Breite seiner Nachricht, mit Abstand zum Bildschirmrand. Schwebend sitzt es oben oder unten.'
      top: 'Blase oben'
      bottom: 'Blase unten'
    pending_writes:
      title: 'Speichern im Hintergrund'
      description: 'Eine Seite, die ohne Absenden-Schaltfläche speichert, übergibt jeden Schreibvorgang dem Dienst für ausstehende Schreibvorgänge: Ein Banner zeigt, dass gespeichert wird, dann, dass alles gespeichert ist, und behält einen Link zum erneuten Versuch, wenn ein Schreibvorgang fehlschlug. Wer die Seite währenddessen verlässt, wird um Bestätigung gebeten. Mehrmals klicken, um Schreibvorgänge zu stapeln.'
      save: 'Speichern'
      save_failing: 'Speichern mit Fehler'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
