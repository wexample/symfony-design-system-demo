~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: توزیع
page_icon: 'ph:bold/chart-bar-horizontal'
intro: 'مجموعی که از چه چیزهایی تشکیل شده است، در یک خط. جایی که نوار پیشرفت نشان می‌دهد که یک مقدار چقدر پیش رفته، اینجا نشان می‌دهد که یک کل چگونه تقسیم می‌شود: اجزا به ترتیبی که داده شده‌اند نگهداری می‌شوند، بنابراین یک لوله‌کشی از چپ به راست خوانده می‌شود مانند لوله‌کشی که هست. وضعیت‌ها با واژگانی که کپسول و دایره قبلاً صحبت کرده‌اند نامگذاری شده‌اند، بنابراین یک وضعیت هرگز دو رنگ نمی‌گیرد.'
section:
  default:
    title: 'یک کل، به اجزا'
    description: 'اجزا به نسبت ارزشی که دارند رشد می‌کنند و افسانه آنها را به کلمات زیر می‌گوید — همان کپسولی که یک جدول با آن وضعیت را ترسیم می‌کند، بنابراین چشم بین این دو حرکت می‌کند بدون اینکه چیز جدیدی یاد بگیرد.'
  linked:
    title: 'اجزا که به جایی می‌روند'
    description: 'یک جز با هدف یک لینک است: نوار به راهی به لیستی که خلاصه می‌کند تبدیل می‌شود. زیر نشانگر، یک فیلم نور می‌گیرد به جای رنگ دیگری که وضعیت متفاوتی را بیان کند.'
  bare:
    title: 'بدون افسانه'
    description: 'جایی که اجزا درست کنار هم نامگذاری شده‌اند، یا جایی که نوار فقط باید شکل چیز را بگوید، افسانه حذف می‌شود و هر جز زیر نشانگر می‌گوید که چیست.'
  rest:
    title: 'مجموعی بزرگتر از اجزای آن'
    description: 'آنچه مجموع حساب می‌کند و هیچ جزئی برای آن حساب نمی‌شود سهم خود را از ردیف نگه می‌دارد و چیزی ترسیم نمی‌کند: مسیر دقیقاً به همین مقدار نمایان می‌شود، به جای اینکه اجزا برای پر کردن نوار که پر نمی‌کنند بکشند.'
  empty:
    title: 'هیچ چیزی هنوز شمرده نشده'
    description: 'نه مجموع و نه جز — کار شروع نشده، یک شمارش هنوز در حال انجام است. نوار جای خود را نگه می‌دارد، مانند یک مسیر خالی — همان زمینی که مجموع بزرگتر از اجزای آن از آن نمایان می‌شود — بنابراین یک ردیف از آنها شکل خود را حفظ می‌کند؛ شکل آن یک خط است، چون هیچ چیزی که شمرده شده است صفر نیست.'
  compact:
    title: فشرده
    description: 'یک نوار نازک‌تر برای یک ردیف یا فوتر کارت، با چگالی منتقل شده به کپسول‌های افسانه‌اش.'
  vue:
    title: 'Vue، هدایت شده'
    description: 'همان نوار، اجزا به عنوان داده داده شده‌اند. یک جز که به جایی نمی‌رود به کلیک با `select` پاسخ می‌دهد، که چیزی است که باید برای جدولی که خود را کنار آن فیلتر می‌کند گوش داد.'
