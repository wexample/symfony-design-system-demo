en:
  page_title: Markers
  page_icon: ph:bold/seal-check
  leds:
    ok: ok
    running: running
    errors: errors
    queued: queued
    alone: A dot alone, named by its title

  intro: "One capsule for everything said about a thing in a word: a state, a name, a version, a category. They were two objects until the day a code and a state stood side by side in one header, a head apart, and nobody could say what the difference was meant to mean — so the shape is one and the tone is the whole of what tells them apart. What it carries is free: a word, a figure, a glyph, or two of the three. The circle stands where there is no room for a capsule, and the counter, which hangs from a row and is sized in the text it hangs from, is the one thing here that is not a marker."

  section:
    leds:
      title: LEDs
      description: "A lit dot and its words: a state read at a glance in a line, by the dozen in a summary or a list of services. Smaller than a marker, quieter than a circle. off is the dot unlit — a count at zero —, running breathes."
    inline:
      title: In the middle of a sentence
      description: "A word set apart as it is read: a version, a phase, a category. The neutral tone, because a marker that arrives coloured has already made a claim about what it marks — and in a sentence there is nothing to claim."
    palette:
      title: The categories
      description: "Tones that tell things apart without ranking them. They carry no meaning — nothing says the third is better than the fifth — which is exactly what makes them usable for a taxonomy, where meaning would be a lie. Worn exactly as a state is: same capsule, same rhythm."
    against:
      title: A counter beside a marker
      description: "The one distinction left, and it is not about meaning. On the left a counter: twelve of something, hanging from the row that leads to it and sized in that row's own text. On the right a marker: twelve of something that went well, standing on its own and sized in tokens. A count beside a menu item is a counter; the same figure in a pipeline column is a marker."
    words:
      title: A state in words
      description: "Announced in a sentence or beside a title, where it is the message rather than a mark in a column."
    figures:
      title: A state read by the dozen
      description: "In a column, a tick beside a neutral count reads as two objects and a table of them reads as noise. Here the colour encloses the figure and the column is scanned in one pass — compact, since a cell has no room to spare."
    payload:
      title: What it carries
      description: "A word for what the state is, a figure for how many of it there are, both, or neither. The figure is always drawn a step back from the rest: it qualifies the state, it is not the state."
    weights:
      title: The three forms side by side
      description: "The same information in the place it is actually read. The circle is the form for a cell too narrow for a capsule, and the only one that can show a state being a quantity — and it is drawn with the very colour the capsule fills with."
    circles:
      title: Circles
      description: "A state told by a circle rather than by a word, for a place where states are read by the dozen — a list of runs, a row of jobs. The ring carries the colour, the glyph inside says which state it is, and both sides of the stack draw the same markup."
    progress:
      title: A state that is a quantity
      description: "A run is the one state with an amount to it, so its ring is drawn as far as the run has got. Twig prints the value it is given; moving it afterwards is the browser's business."
    sizes:
      title: Circle sizes
    vue:
      title: Vue
      description: "The same component, driven: switching the type or the value moves the arc instead of redrawing it. This one is what an app places when the state is going to change under the reader's eyes."
    code:
      title: Usage

  state:
    success: Operation successful
    error: An error occurred
    warning: Proceed with caution
    info: For your information
    passed: Passed

  weights:
    column:
      form: Form
    row:
      capsule: Capsule
      circle: Circle

  example:
    sentence:
      released: "Version 2.4 is"
      deprecated: "This API is"

  marker:
    neutral: Neutral
    released: Released
    deprecated: Deprecated
    tag: Category

ar:
  page_title: Markers
  page_icon: 'ph:bold/seal-check'
  intro: 'كبسولة واحدة لكل شيء قيل عن شيء ما في كلمة: حالة، اسم، إصدار، فئة. كانا كائنين حتى اليوم الذي وقف فيه رمز وحالة بجانب بعضهما البعض في رأس واحد، برأس واحد، ولم يستطع أحد أن يقول ما تعنيه الفرق — لذا الشكل واحد والنغمة هي كل ما يميز بينهما. ما تحمله مجاني: كلمة، رقم، رمز، أو اثنان من الثلاثة. الدائرة تقف حيث لا يوجد مكان لكبسولة، والعداد، الذي يتدلى من صف ويتم حجمه بالنص الذي يتدلى منه، هو الشيء الوحيد هنا الذي ليس علامة.'
  section:
    inline:
      title: 'في وسط جملة'
      description: 'كلمة مميزة كما تُقرأ: إصدار، مرحلة، فئة. النغمة المحايدة، لأن علامة تصل ملونة قد قامت بالفعل بمطالبة حول ما تشير إليه — وفي جملة لا يوجد شيء للمطالبة به.'
    palette:
      title: الفئات
      description: 'نغمات تميز الأشياء دون تصنيفها. لا تحمل أي معنى — لا شيء يقول أن الثالث أفضل من الخامس — وهذا بالضبط ما يجعلها قابلة للاستخدام في تصنيف، حيث سيكون المعنى كذبة. تُرتدي تمامًا كما هي الحالة: نفس الكبسولة، نفس الإيقاع.'
    against:
      title: 'عداد بجانب علامة'
      description: 'التمييز الوحيد المتبقي، وليس له علاقة بالمعنى. على اليسار عداد: اثنا عشر من شيء، يتدلى من الصف الذي يقوده ويتم حجمه بنص ذلك الصف. على اليمين علامة: اثنا عشر من شيء سار بشكل جيد، واقفًا بمفرده وحجمه بالرموز. العد بجانب عنصر القائمة هو عداد؛ نفس الرقم في عمود خط أنابيب هو علامة.'
    words:
      title: 'حالة بالكلمات'
      description: 'مُعلنة في جملة أو بجانب عنوان، حيث تكون هي الرسالة بدلاً من علامة في عمود.'
    figures:
      title: 'حالة تُقرأ بالعشرات'
      description: 'في عمود، علامة بجانب عدد محايد تُقرأ ككائنين و جدول منها يُقرأ كضجيج. هنا اللون يحيط بالشكل والعمود يمسح في تمريرة واحدة — مضغوط، لأن الخلية ليس لديها مكان للتوفير.'
    payload:
      title: 'ما تحمله'
      description: 'كلمة لما هي الحالة، رقم لعددها، كلاهما، أو لا شيء. الرقم دائمًا ما يُرسم خطوة إلى الوراء عن البقية: يُؤهل الحالة، وليس الحالة.'
    weights:
      title: 'الأشكال الثلاثة جنبًا إلى جنب'
      description: 'نفس المعلومات في المكان الذي تُقرأ فيه فعليًا. الدائرة هي الشكل لخلية ضيقة جدًا لكبسولة، وهي الوحيدة التي يمكن أن تظهر حالة ككمية — ويتم رسمها بنفس اللون الذي تملؤه الكبسولة.'
    circles:
      title: دوائر
      description: 'حالة تُروى بدائرة بدلاً من كلمة، لمكان تُقرأ فيه الحالات بالعشرات — قائمة من الجولات، صف من الوظائف. الحلقة تحمل اللون، والرمز داخلها يقول أي حالة هي، وكلا جانبي الكومة يرسمان نفس العلامة.'
    progress:
      title: 'حالة هي كمية'
      description: 'الجولة هي الحالة الوحيدة التي لها مقدار، لذا يتم رسم حلقتها بقدر ما وصلت إليه الجولة. طباعة Twig القيمة المعطاة لها؛ تحريكها لاحقًا هو من مسؤولية المتصفح.'
    sizes:
      title: 'أحجام الدوائر'
    vue:
      title: Vue
      description: 'نفس المكون، مدفوع: تغيير النوع أو القيمة يحرك القوس بدلاً من إعادة رسمه. هذا ما تضعه التطبيق عندما ستتغير الحالة أمام أعين القارئ.'
    code:
      title: الاستخدام
  state:
    success: 'تمت العملية بنجاح'
    error: 'حدث خطأ'
    warning: 'تابع بحذر'
    info: 'للمعلومات الخاصة بك'
    passed: 'تمت الموافقة'
  weights:
