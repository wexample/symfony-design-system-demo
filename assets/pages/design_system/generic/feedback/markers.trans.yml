id:
  page_title: Penanda
  page_icon: 'ph:bold/seal-check'
  intro: 'Sebuah kapsul untuk segala sesuatu yang diungkapkan tentang suatu hal dalam satu kata: sebuah status, sebuah nama, sebuah versi, sebuah kategori. Mereka adalah dua objek hingga suatu hari kode dan status berdiri berdampingan dalam satu header, terpisah satu kepala, dan tidak ada yang bisa mengatakan apa arti perbedaan itu — jadi bentuknya satu dan nada adalah keseluruhan yang membedakan mereka. Apa yang dibawanya adalah bebas: sebuah kata, sebuah angka, sebuah glif, atau dua dari tiga tersebut. Lingkaran berdiri di tempat yang tidak ada ruang untuk kapsul, dan penghitung, yang menggantung dari baris dan berukuran sesuai teks yang digantungnya, adalah satu hal di sini yang bukan penanda.'
  section:
    inline:
      title: 'Di tengah kalimat'
      description: 'Sebuah kata yang dipisahkan saat dibaca: sebuah versi, sebuah fase, sebuah kategori. Nada netral, karena penanda yang datang berwarna telah membuat klaim tentang apa yang ditandainya — dan dalam sebuah kalimat tidak ada yang dapat diklaim.'
    palette:
      title: Kategori-kategori
      description: 'Nada yang membedakan tanpa memberi peringkat. Mereka tidak membawa makna — tidak ada yang mengatakan bahwa yang ketiga lebih baik dari yang kelima — yang justru membuatnya dapat digunakan untuk taksonomi, di mana makna akan menjadi kebohongan. Dipakai persis seperti sebuah status: kapsul yang sama, ritme yang sama.'
    against:
      title: 'Sebuah penghitung di samping penanda'
      description: 'Satu perbedaan yang tersisa, dan itu bukan tentang makna. Di sebelah kiri sebuah penghitung: dua belas dari sesuatu, menggantung dari baris yang mengarah ke sana dan berukuran dalam teks baris itu sendiri. Di sebelah kanan sebuah penanda: dua belas dari sesuatu yang berjalan dengan baik, berdiri sendiri dan berukuran dalam token. Sebuah hitungan di samping item menu adalah sebuah penghitung; angka yang sama dalam kolom saluran adalah sebuah penanda.'
    words:
      title: 'Sebuah status dalam kata-kata'
      description: 'Diumumkan dalam sebuah kalimat atau di samping judul, di mana itu adalah pesan alih-alih tanda dalam kolom.'
    figures:
      title: 'Sebuah status dibaca secara dozen'
      description: 'Dalam sebuah kolom, sebuah centang di samping hitungan netral dibaca sebagai dua objek dan tabelnya dibaca sebagai kebisingan. Di sini warna mengelilingi angka dan kolom dipindai dalam satu langkah — kompak, karena sebuah sel tidak memiliki ruang untuk spare.'
    payload:
      title: 'Apa yang dibawanya'
      description: 'Sebuah kata untuk apa status itu, sebuah angka untuk berapa banyak dari itu, keduanya, atau tidak ada. Angka selalu digambar satu langkah mundur dari yang lainnya: itu memenuhi syarat status, bukan status itu sendiri.'
    weights:
      title: 'Tiga bentuk berdampingan'
      description: 'Informasi yang sama di tempat yang sebenarnya dibaca. Lingkaran adalah bentuk untuk sel yang terlalu sempit untuk kapsul, dan satu-satunya yang dapat menunjukkan status sebagai jumlah — dan itu digambar dengan warna yang sama yang diisi kapsul.'
    circles:
      title: Lingkaran
      description: 'Sebuah status yang diceritakan oleh sebuah lingkaran alih-alih oleh sebuah kata, untuk tempat di mana status dibaca secara dozen — sebuah daftar lari, baris pekerjaan. Cincin membawa warna, glif di dalamnya menunjukkan status mana itu, dan kedua sisi tumpukan menggambar markup yang sama.'
    progress:
      title: 'Sebuah status yang merupakan jumlah'
      description: 'Sebuah lari adalah satu-satunya status dengan jumlah di dalamnya, jadi cincin digambar sejauh mana lari telah mencapai. Twig mencetak nilai yang diberikan; memindahkannya setelah itu adalah urusan browser.'
    sizes:
      title: 'Ukuran lingkaran'
    vue:
      title: Vue
      description: 'Komponen yang sama, digerakkan: mengganti jenis atau nilai menggerakkan busur alih-alih menggambar ulang. Ini adalah apa yang ditempatkan aplikasi saat status akan berubah di depan mata pembaca.'
    code:
      title: Penggunaan
  state:
    success: 'Operasi berhasil'
