    released: Rilasciato
    deprecated: Deprecato
    tag: Categoria

ja:
  page_title: マーカー
  page_icon: 'ph:bold/seal-check'
  intro: '物事について言われたすべてを言葉で表現するためのカプセル：状態、名前、バージョン、カテゴリ。それらは二つのオブジェクトでしたが、ある日、コードと状態が一つのヘッダーの横に並び、一つの頭の距離を置いて、誰もその違いが何を意味するのかを言えなくなりました — だから形は一つで、トーンはそれらを区別するすべてのものです。持っているものは自由です：言葉、数字、グリフ、またはその三つのうちの二つ。円はカプセルを置く余地がないところに立ち、行からぶら下がり、その行のテキストに合わせてサイズを持つカウンターは、ここで唯一マーカーではないものです。'
  section:
    inline:
      title: 文の中で
      description: '読まれる際に特別に設定された言葉：バージョン、フェーズ、カテゴリ。中立的なトーン、なぜなら色がついたマーカーは、すでにそれが示すものについての主張を行っているからです — 文の中には主張するものはありません。'
    palette:
      title: カテゴリ
      description: 'ランク付けせずに物事を区別するトーン。それらは意味を持たず — 第三が第五より優れているとは何も言いません — それがまさに分類法で使える理由であり、意味は嘘になります。状態と同じように着用されます：同じカプセル、同じリズム。'
    against:
      title: マーカーの隣にあるカウンター
      description: 残された一つの区別であり、それは意味に関するものではありません。左にカウンター：何かの12、そこに導く行からぶら下がり、その行のテキストに合わせてサイズが決まります。右にマーカー：うまくいった何かの12、独立して立ち、トークンでサイズが決まります。メニュー項目の隣にあるカウントはカウンターです；パイプラインの列にある同じ数字はマーカーです。
    words:
      title: 言葉で表現された状態
      description: 文中またはタイトルの横で発表され、それはカラムのマークではなくメッセージです。
    figures:
      title: 12単位で読む状態
      description: 'カラム内で、中立的なカウントの横にあるチェックは二つのオブジェクトとして読み取られ、それらのテーブルはノイズとして読み取られます。ここでは色が数字を包み、カラムは一度にスキャンされます — コンパクトで、セルに余裕がありません。'
    payload:
      title: 持っているもの
      description: 状態が何であるかを示す言葉、それがいくつあるかを示す数字、両方またはどちらでもない。数字は常に他のものから一歩引いて描かれます：それは状態を修飾し、状態そのものではありません。
    weights:
      title: 三つの形が並んで
      description: '実際に読まれる場所にある同じ情報。円はカプセルに対して狭すぎるセルのための形であり、量としての状態を示す唯一のものです — そして、それはカプセルが満たす色と同じ色で描かれます。'
    circles:
      title: 円
      description: '言葉ではなく円で表現された状態、12単位で状態が読み取られる場所 — 実行のリスト、仕事の行。リングは色を持ち、内部のグリフはどの状態であるかを示し、スタックの両側は同じマークアップを描きます。'
    progress:
      title: 量としての状態
      description: 実行は量を持つ唯一の状態であり、そのためリングは実行が到達したところまで描かれます。Twigは与えられた値を印刷し、その後に移動するのはブラウザの仕事です。
    sizes:
      title: 円のサイズ
    vue:
      title: Vue
      description: 同じコンポーネント、駆動：タイプまたは値を切り替えると、弧が再描画されるのではなく移動します。これは、状態が読者の目の前で変わるときにアプリが配置するものです。
    code:
      title: 使用法
  state:
    success: 操作が成功しました
    error: エラーが発生しました
    warning: 注意して進んでください
    info: ご参考までに
    passed: 合格
  weights:
    column:
      form: フォーム
    row:
      capsule: カプセル
      circle: 円
  example:
    sentence:
      released: 'バージョン 2.4 は'
      deprecated: 'この API は'
  marker:
    neutral: 中立
    released: リリース済み
    deprecated: 非推奨
    tag: カテゴリ

ko:
  page_title: 마커
  page_icon: 'ph:bold/seal-check'
  intro: '사물에 대한 모든 것을 한 단어로 압축한 캡슐: 상태, 이름, 버전, 카테고리. 코드와 상태가 하나의 헤더에서 나란히 서기 전까지는 두 개의 객체였습니다. 그 차이가 의미하는 바를 아무도 말할 수 없었습니다 — 그래서 형태는 하나이고, 톤은 그들을 구별하는 모든 것입니다. 그것이 담고 있는 것은 자유롭습니다: 단어, 숫자, 기호, 또는 이 셋 중 두 개. 원은 캡슐을 담을 공간이 없는 곳에 서 있으며, 행에서 걸려 있고 그 행의 텍스트 크기에 맞춰진 카운터가 여기서 유일하게 마커가 아닌 것입니다.'
  section:
    inline:
      title: '문장 중간에'
      description: '읽히는 대로 분리된 단어: 버전, 단계, 카테고리. 중립적인 톤, 색이 있는 마커는 이미 그것이 표시하는 것에 대해 주장했기 때문에 — 그리고 문장에는 주장할 것이 없습니다.'
    palette:
      title: 카테고리들
      description: '서로를 구별하지만 순위를 매기지 않는 톤. 의미를 담고 있지 않습니다 — 세 번째가 다섯 번째보다 낫다는 것은 없습니다 — 이는 의미가 거짓이 되는 분류법에 사용 가능하게 만듭니다. 상태와 똑같이 착용됩니다: 같은 캡슐, 같은 리듬.'
    against:
      title: '마커 옆의 카운터'
      description: '남은 유일한 구별, 그리고 그것은 의미에 관한 것이 아닙니다. 왼쪽에 카운터: 무엇인가 열두 개, 그것으로 이어지는 행에서 걸려 있고 그 행의 텍스트 크기에 맞춰져 있습니다. 오른쪽에 마커: 잘 된 무언가 열두 개, 독립적으로 서 있으며 토큰 크기에 맞춰져 있습니다. 메뉴 항목 옆의 수치는 카운터입니다; 파이프라인 열의 동일한 숫자는 마커입니다.'
    words:
      title: '단어로 표현된 상태'
      description: '문장이나 제목 옆에 발표되어, 열의 표시가 아닌 메시지입니다.'
    figures:
      title: '열두 개로 읽는 상태'
      description: '열에서 중립적인 수치 옆의 체크는 두 개의 객체로 읽히고, 그것의 표는 잡음으로 읽힙니다. 여기서 색은 숫자를 감싸고 열은 한 번에 스캔됩니다 — 압축되어, 셀에 여유가 없습니다.'
    payload:
      title: '담고 있는 것'
      description: '상태가 무엇인지에 대한 단어, 몇 개인지에 대한 숫자, 둘 다 또는 아무것도 아닙니다. 숫자는 항상 나머지보다 한 걸음 뒤로 그려집니다: 상태를 수식하며, 상태가 아닙니다.'
    weights:
      title: '나란히 있는 세 가지 형태'
      description: '실제로 읽히는 자리의 동일한 정보. 원은 캡슐에 비해 너무 좁은 셀의 형태이며, 상태가 수량이라는 것을 보여줄 수 있는 유일한 것입니다 — 그리고 캡슐이 채우고 있는 색으로 그려집니다.'
    circles:
      title: 원
      description: '단어가 아닌 원으로 표현된 상태, 열두 개로 읽히는 곳 — 실행 목록, 작업 행. 링은 색을 담고, 내부의 기호는 어떤 상태인지 말하며, 스택 양쪽의 마크업은 동일합니다.'
    progress:
      title: '수량인 상태'
      description: '런은 수량이 있는 유일한 상태이므로, 그 링은 런이 도달한 만큼 그려집니다. Twig은 주어진 값을 인쇄합니다; 이후 이동하는 것은 브라우저의 일입니다.'
    sizes:
      title: '원 크기'
    vue:
      title: Vue
      description: '같은 컴포넌트, 구동됨: 유형이나 값을 전환하면 아크가 다시 그려지지 않고 이동합니다. 이는 상태가 독자의 눈앞에서 바뀔 예정일 때 앱이 배치하는 것입니다.'
    code:
      title: 사용법
  state:
    success: '작업이 성공적으로 완료되었습니다'
    error: '오류가 발생했습니다'
    warning: '주의하여 진행하세요'
    info: '정보 제공을 위해'
    passed: 통과됨
  weights:
