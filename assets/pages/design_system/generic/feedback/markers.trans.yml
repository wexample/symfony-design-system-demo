ur:
  page_title: مارکر
  page_icon: 'ph:bold/seal-check'
  intro: 'ایک کیپسول ہر چیز کے بارے میں کہا گیا ایک لفظ میں: ایک حالت، ایک نام، ایک ورژن، ایک زمرہ۔ یہ دو اشیاء تھیں جب تک کہ ایک دن ایک کوڈ اور ایک حالت ایک ہی ہیڈر میں ساتھ ساتھ کھڑی نہیں ہو گئیں، ایک سر کے فاصلے پر، اور کوئی نہیں کہہ سکا کہ اس فرق کا کیا مطلب تھا — تو شکل ایک ہے اور لہجہ وہ سب کچھ ہے جو انہیں الگ کرتا ہے۔ جو وہ لے کر آتا ہے وہ آزاد ہے: ایک لفظ، ایک عدد، ایک گلیف، یا ان تینوں میں سے دو۔ دائرہ وہاں ہوتا ہے جہاں کیپسول کے لیے کوئی جگہ نہیں ہوتی، اور کاؤنٹر، جو ایک قطار سے لٹکتا ہے اور اس کے لٹکنے والے متن میں سائز میں ہوتا ہے، یہاں ایک ہی چیز ہے جو نشان نہیں ہے۔'
  section:
    inline:
      title: 'ایک جملے کے درمیان'
      description: 'ایک لفظ جو پڑھتے وقت الگ ہوتا ہے: ایک ورژن، ایک مرحلہ، ایک زمرہ۔ نیوٹرل لہجہ، کیونکہ ایک نشان جو رنگین آتا ہے پہلے ہی یہ دعویٰ کر چکا ہے کہ وہ کیا نشان زد کرتا ہے — اور ایک جملے میں کچھ بھی دعویٰ کرنے کے لیے نہیں ہوتا۔'
    palette:
      title: زمرے
      description: 'لہجے جو چیزوں کو الگ کرتے ہیں بغیر انہیں رینک کیے۔ ان کا کوئی معنی نہیں ہوتا — کچھ بھی نہیں کہتا کہ تیسرا پانچویں سے بہتر ہے — جو انہیں ایک درجہ بندی کے لیے قابل استعمال بناتا ہے، جہاں معنی جھوٹ ہوتا۔ بالکل ویسے ہی پہنا جاتا ہے جیسے ایک حالت: ایک ہی کیپسول، ایک ہی ردھم۔'
    against:
      title: 'ایک نشان کے ساتھ ایک کاؤنٹر'
      description: 'ایک فرق باقی ہے، اور یہ معنی کے بارے میں نہیں ہے۔ بائیں طرف ایک کاؤنٹر: کسی چیز کے بارہ، اس قطار سے لٹکتا ہوا جو اس کی طرف لے جاتی ہے اور اس قطار کے اپنے متن میں سائز میں ہوتا ہے۔ دائیں طرف ایک نشان: کسی چیز کے بارہ جو اچھا گزرا، اکیلا کھڑا ہے اور ٹوکنز میں سائز میں ہے۔ ایک مینو آئٹم کے ساتھ ایک کاؤنٹر ہوتا ہے؛ ایک پائپ لائن کالم میں وہی عدد ایک نشان ہوتا ہے۔'
    words:
      title: 'الفاظ میں ایک حالت'
      description: 'ایک جملے میں یا ایک عنوان کے ساتھ اعلان کیا گیا، جہاں یہ ایک پیغام ہے نہ کہ ایک کالم میں نشان۔'
    figures:
      title: 'ایک حالت جو درجن میں پڑھی جاتی ہے'
      description: 'ایک کالم میں، ایک نیوٹرل کاؤنٹ کے ساتھ ایک ٹک پڑھنے میں دو اشیاء اور ان کی میز شور کے طور پر پڑھتا ہے۔ یہاں رنگ عدد کو گھیر لیتا ہے اور کالم ایک بار میں سکین کیا جاتا ہے — کمپیکٹ، کیونکہ ایک سیل کے پاس جگہ نہیں ہے۔'
    payload:
      title: 'جو وہ لے کر آتا ہے'
      description: 'ایک لفظ جو ریاست ہے، ایک عدد جو اس کی تعداد ہے، دونوں، یا کچھ بھی نہیں۔ عدد ہمیشہ باقی چیزوں سے ایک قدم پیچھے کھینچا جاتا ہے: یہ حالت کی وضاحت کرتا ہے، یہ حالت نہیں ہے۔'
    weights:
      title: 'تین اشکال ایک ساتھ'
      description: 'وہی معلومات اس جگہ پر جہاں یہ واقعی پڑھا جاتا ہے۔ دائرہ اس شکل کے لیے ہے جو کیپسول کے لیے بہت تنگ ہے، اور یہ واحد ہے جو ایک حالت کو مقدار کے طور پر دکھا سکتا ہے — اور یہ اسی رنگ سے کھینچا جاتا ہے جس سے کیپسول بھرا جاتا ہے۔'
    circles:
      title: دایرے
      description: 'ایک حالت جو ایک دائرے کے ذریعے بیان کی گئی ہے نہ کہ ایک لفظ کے ذریعے، ایک جگہ کے لیے جہاں ریاستیں درجنوں میں پڑھی جاتی ہیں — ایک دوڑ کی فہرست، کاموں کی ایک صف۔ رنگ دائرہ لے کر آتا ہے، اندر کا گلیف یہ کہتا ہے کہ یہ کون سی حالت ہے، اور ڈھیر کے دونوں طرف ایک ہی مارک اپ کھینچتے ہیں۔'
    progress:
      title: 'ایک حالت جو مقدار ہے'
      description: 'ایک دوڑ ایک ایسی حالت ہے جس میں ایک مقدار ہوتی ہے، لہذا اس کا دائرہ اس حد تک کھینچا جاتا ہے جہاں دوڑ پہنچی ہے۔ ٹویگ وہ قیمت پرنٹ کرتا ہے جو اسے دی گئی ہے؛ اس کے بعد اسے منتقل کرنا براؤزر کا کام ہے۔'
    sizes:
      title: 'دایروں کے سائز'
    vue:
      title: Vue
      description: 'ایک ہی جزو، چلایا گیا: قسم یا قیمت کو تبدیل کرنے سے قوس منتقل ہوتی ہے بجائے اس کے کہ اسے دوبارہ کھینچا جائے۔ یہ وہی ہے جو ایک ایپ رکھتا ہے جب حالت قارئین کی آنکھوں کے سامنے تبدیل ہونے والی ہوتی ہے۔'
    code:
      title: استعمال
  state:
