    tag: Categoria

ru:
  page_title: Маркер
  page_icon: 'ph:bold/seal-check'
  intro: 'Одна капсула для всего, что сказано о вещи одним словом: состояние, имя, версия, категория. Они были двумя объектами до того дня, когда код и состояние встали бок о бок в одном заголовке, на расстоянии головы, и никто не мог сказать, что значит различие — так что форма едина, а тон составляет всё, что отличает их. То, что она несет, свободно: слово, число, символ или два из трех. Круг стоит там, где нет места для капсулы, а счетчик, который висит из ряда и имеет размер в тексте, из которого он свисает, — это единственное здесь, что не является маркером.'
  section:
    inline:
      title: 'В середине предложения'
      description: 'Слово, выделенное в процессе чтения: версия, фаза, категория. Нейтральный тон, потому что маркер, пришедший окрашенным, уже сделал заявление о том, что он маркирует — а в предложении нечего заявлять.'
    palette:
      title: Категории
      description: 'Тоны, которые различают вещи без ранжирования. Они не несут смысла — ничто не говорит о том, что третья лучше пятой — что как раз и делает их пригодными для таксономии, где смысл был бы ложью. Носится так же, как состояние: та же капсула, тот же ритм.'
    against:
      title: 'Счетчик рядом с маркером'
      description: 'Единственное оставшееся различие, и оно не связано со смыслом. Слева счетчик: двенадцать чего-то, висящих из ряда, который ведет к нему, и размером в текст этого ряда. Справа маркер: двенадцать чего-то, что прошло успешно, стоящий отдельно и размером в токены. Счетчик рядом с элементом меню — это счетчик; то же самое число в столбце конвейера — это маркер.'
    words:
      title: 'Состояние словами'
      description: 'Объявлено в предложении или рядом с заголовком, где это сообщение, а не отметка в столбце.'
    figures:
      title: 'Состояние, читаемое по дюжинам'
      description: 'В столбце галочка рядом с нейтральным счетом читается как два объекта, а таблица из них читается как шум. Здесь цвет обрамляет фигуру, и столбец сканируется за один проход — компактно, так как ячейка не имеет лишнего места.'
    payload:
      title: 'То, что она несет'
      description: 'Слово для описания состояния, число для количества, оба или ни одно. Число всегда рисуется на шаг назад от остального: оно квалифицирует состояние, но не является состоянием.'
    weights:
      title: 'Три формы бок о бок'
      description: 'Та же информация в месте, где она фактически читается. Круг — это форма для ячейки, слишком узкой для капсулы, и единственная, которая может показать состояние как количество — и она рисуется тем же цветом, который заполняет капсула.'
    circles:
      title: Круги
      description: 'Состояние, рассказанное кругом, а не словом, для места, где состояния читаются по дюжинам — список пробежек, ряд заданий. Кольцо несет цвет, символ внутри говорит, какое это состояние, и обе стороны стека рисуют одни и те же разметки.'
    progress:
      title: 'Состояние, которое является количеством'
      description: 'Пробежка — это единственное состояние с количеством, поэтому ее кольцо рисуется так далеко, как пробежка достигла. Twig печатает значение, которое ему дано; перемещение его впоследствии — это дело браузера.'
    sizes:
      title: 'Размеры кругов'
    vue:
      title: Vue
      description: 'Тот же компонент, управляемый: переключение типа или значения перемещает дугу вместо перерисовки. Это то, что приложение помещает, когда состояние собирается измениться на глазах у читателя.'
    code:
      title: Использование
  state:
    success: 'Операция успешна'
    error: 'Произошла ошибка'
    warning: 'Будьте осторожны'
    info: 'Для вашей информации'
    passed: Пройдено
  weights:
    column:
      form: Форма
    row:
      capsule: Капсула
      circle: Круг
  example:
    sentence:
      released: 'Версия 2.4'
      deprecated: 'Этот API устарел'
  marker:
    neutral: Нейтральный
    released: Выпущен
    deprecated: Устаревший
    tag: Категория

th:
  page_title: เครื่องหมาย
  page_icon: 'ph:bold/seal-check'
  intro: 'แคปซูลหนึ่งสำหรับทุกสิ่งที่พูดถึงเกี่ยวกับสิ่งหนึ่งในคำเดียว: สถานะ, ชื่อ, เวอร์ชัน, หมวดหมู่ พวกมันเป็นวัตถุสองชิ้นจนกระทั่งวันหนึ่งที่โค้ดและสถานะยืนอยู่ข้างกันในหัวข้อเดียว ห่างกันแค่หัวเดียว และไม่มีใครสามารถบอกได้ว่าสิ่งที่แตกต่างกันนั้นหมายถึงอะไร — ดังนั้นรูปทรงจึงเป็นหนึ่งเดียวและโทนเสียงคือทั้งหมดที่บอกความแตกต่างของพวกเขา สิ่งที่มันแบกรับนั้นฟรี: คำ, ตัวเลข, สัญลักษณ์, หรือสองในสาม สิ่งกลมยืนอยู่ในที่ที่ไม่มีที่สำหรับแคปซูล และเคาน์เตอร์ที่แขวนจากแถวและมีขนาดตามข้อความที่มันแขวนอยู่ คือตัวเดียวที่นี่ที่ไม่ใช่เครื่องหมาย'
  section:
    inline:
      title: กลางประโยค
      description: 'คำที่ถูกตั้งแยกออกเมื่ออ่าน: เวอร์ชัน, เฟส, หมวดหมู่ โทนเสียงที่เป็นกลาง เพราะเครื่องหมายที่มาพร้อมสีได้ทำการอ้างอิงเกี่ยวกับสิ่งที่มันหมายถึง — และในประโยคไม่มีอะไรที่จะอ้างอิงได้'
    palette:
      title: หมวดหมู่
      description: 'โทนเสียงที่บอกความแตกต่างโดยไม่จัดอันดับ พวกมันไม่มีความหมาย — ไม่มีอะไรบอกว่าสิ่งที่สามดีกว่าสิ่งที่ห้า — ซึ่งก็คือสิ่งที่ทำให้มันใช้ได้สำหรับการจัดประเภท ที่ซึ่งความหมายจะเป็นการโกหก สวมใส่เช่นเดียวกับสถานะ: แคปซูลเดียวกัน, จังหวะเดียวกัน'
    against:
      title: เคาน์เตอร์ข้างเครื่องหมาย
      description: 'ความแตกต่างเดียวที่เหลืออยู่ และมันไม่เกี่ยวกับความหมาย ทางซ้ายคือเคาน์เตอร์: สิบสองของบางสิ่ง ที่แขวนจากแถวที่นำไปสู่และมีขนาดตามข้อความของแถวนั้น ทางขวาคือเครื่องหมาย: สิบสองของบางสิ่งที่ดี ยืนอยู่ตามลำพังและมีขนาดตามตัวเลข เคาน์เตอร์ข้างรายการเมนูคือเคาน์เตอร์; ตัวเลขเดียวกันในคอลัมน์ท่อคือเครื่องหมาย'
    words:
      title: สถานะในคำ
      description: 'ประกาศในประโยคหรือข้างชื่อเรื่อง ซึ่งเป็นข้อความมากกว่าการทำเครื่องหมายในคอลัมน์'
    figures:
      title: สถานะอ่านโดยสิบสอง
      description: 'ในคอลัมน์ เครื่องหมายถูกต้องข้างเคาน์เตอร์ที่เป็นกลางอ่านเป็นวัตถุสองชิ้นและตารางของพวกเขาอ่านเป็นเสียงดัง ที่นี่สีจะห่อหุ้มตัวเลขและคอลัมน์ถูกสแกนในครั้งเดียว — กะทัดรัด เนื่องจากเซลล์ไม่มีที่ว่างให้เหลือ'
    payload:
      title: สิ่งที่มันแบกรับ
      description: 'คำสำหรับสิ่งที่สถานะคือ ตัวเลขสำหรับจำนวนของมัน มีทั้งสองอย่างหรือไม่มีเลย ตัวเลขจะวาดห่างจากที่เหลือ: มันมีคุณสมบัติของสถานะ มันไม่ใช่สถานะ'
    weights:
      title: รูปแบบสามแบบข้างกัน
      description: 'ข้อมูลเดียวกันในที่ที่มันถูกอ่านจริง ๆ วงกลมคือรูปแบบสำหรับเซลล์ที่แคบเกินไปสำหรับแคปซูล และเป็นรูปแบบเดียวที่สามารถแสดงให้เห็นว่าสถานะเป็นปริมาณ — และมันถูกวาดด้วยสีเดียวกันที่แคปซูลเติมเต็ม'
    circles:
      title: วงกลม
      description: 'สถานะที่บอกโดยวงกลมแทนที่จะเป็นคำ สำหรับสถานที่ที่สถานะถูกอ่านโดยสิบสอง — รายการของการทำงาน แถวของงาน วงแหวนจะนำสีมา สัญลักษณ์ภายในบอกว่าสถานะคืออะไร และทั้งสองด้านของกองวาดเครื่องหมายเดียวกัน'
    progress:
      title: สถานะที่เป็นปริมาณ
      description: 'การวิ่งคือสถานะเดียวที่มีจำนวน ดังนั้นวงแหวนของมันจึงถูกวาดตามที่การวิ่งได้ไปถึง Twig แสดงค่าที่มันได้รับ; การเคลื่อนย้ายมันหลังจากนั้นเป็นเรื่องของเบราว์เซอร์'
    sizes:
      title: ขนาดวงกลม
    vue:
      title: Vue
      description: 'ส่วนประกอบเดียวกัน ขับเคลื่อน: การเปลี่ยนประเภทหรือค่าเคลื่อนที่บนโค้งแทนที่จะวาดใหม่ นี่คือสิ่งที่แอปวางเมื่อสถานะจะเปลี่ยนภายใต้สายตาของผู้อ่าน'
    code:
      title: การใช้งาน
  state:
    success: ดำเนินการสำเร็จ
    error: เกิดข้อผิดพลาด
    warning: โปรดดำเนินการด้วยความระมัดระวัง
    info: เพื่อข้อมูลของคุณ
    passed: ผ่าน
  weights:
    column:
      form: รูปแบบ
    row:
      capsule: แคปซูล
      circle: วงกลม
