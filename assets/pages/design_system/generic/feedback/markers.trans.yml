tr:
  page_title: İşaretleyiciler
  page_icon: 'ph:bold/seal-check'
  intro: 'Bir şey hakkında söylenen her şeyin tek bir kelimeyle ifade edildiği bir kapsül: bir durum, bir isim, bir versiyon, bir kategori. Bir gün bir kod ve bir durum yan yana gelene kadar iki nesne olarak kaldılar, bir başlıkta, aralarındaki farkın ne anlama geldiğini kimse bilemedi — bu yüzden şekil birdir ve ton, onları ayıran her şeyin toplamıdır. Taşıdığı şey serbesttir: bir kelime, bir rakam, bir glif veya bunlardan ikisi. Daire, bir kapsül için yer olmadığında durur ve bir sıradan asılı olan ve asıldığı metinde boyutlandırılan sayaç, burada bir işaretleyici olmayan tek şeydir.'
  section:
    inline:
      title: 'Cümlenin ortasında'
      description: 'Okunduğu gibi ayrı bırakılmış bir kelime: bir versiyon, bir aşama, bir kategori. Nötr ton, çünkü renkli gelen bir işaretleyici, işaretlediği şey hakkında zaten bir iddia ortaya koymuştur — ve bir cümlede iddia edilecek bir şey yoktur.'
    palette:
      title: Kategoriler
      description: 'Sıralama yapmadan şeyleri ayıran tonlar. Hiçbir anlam taşımazlar — üçüncünün beşinciden daha iyi olduğunu söyleyen bir şey yoktur — bu da onları bir taksonomi için kullanılabilir kılan tam olarak budur, burada anlam bir yalan olur. Bir durum gibi giyilir: aynı kapsül, aynı ritim.'
    against:
      title: 'Bir işaretleyicinin yanındaki sayaç'
      description: 'Kalan tek ayrım ve bu anlamla ilgili değil. Solda bir sayaç: bir şeyin on iki tanesi, ona giden sıradan asılı ve o sıranın kendi metninde boyutlandırılmış. Sağda bir işaretleyici: iyi giden bir şeyin on iki tanesi, kendine ait olarak duruyor ve tokenlerle boyutlandırılmış. Bir menü öğesinin yanındaki bir sayı bir sayacıdır; bir boru hattı sütunundaki aynı rakam bir işaretleyicidir.'
    words:
      title: 'Kelimelerle bir durum'
      description: 'Bir cümlede veya bir başlığın yanında duyurulmuş, burada mesajdır, bir sütunda bir işaret değil.'
    figures:
      title: 'Onlarca okunan bir durum'
      description: 'Bir sütunda, nötr bir sayımın yanındaki bir tik, iki nesne olarak okunur ve bunların bir tablosu gürültü olarak okunur. Burada renk, rakamı sarar ve sütun tek bir geçişte taranır — kompakt, çünkü bir hücrenin fazladan yeri yoktur.'
    payload:
      title: 'Taşıdığı şey'
      description: 'Durumun ne olduğunu belirten bir kelime, kaç tane olduğunu belirten bir rakam, her ikisi veya hiçbiri. Rakam her zaman geri adım atarak çizilir: durumu nitelendirir, durum değildir.'
    weights:
      title: 'Yan yana üç form'
      description: 'Gerçekten okunan yerindeki aynı bilgi. Daire, kapsül için çok dar bir hücre için formdur ve bir durumun miktar olduğunu gösterebilen tek formdur — ve kapsülün doldurduğu renkle çizilir.'
    circles:
      title: Daireler
      description: 'Bir kelime yerine bir daireyle anlatılan bir durum, onlarla okunan bir yer için — bir koşu listesi, bir iş sırası. Halkaya renk taşır, içindeki glif hangi durum olduğunu söyler ve yığmanın her iki tarafı aynı işaretleme ile çizilir.'
    progress:
      title: 'Bir miktar olan durum'
      description: 'Bir koşu, içinde bir miktar olan tek durumdur, bu yüzden halkası koşunun ne kadar ilerlediği kadar çizilir. Twig, kendisine verilen değeri yazdırır; sonrasında taşımak tarayıcının işidir.'
    sizes:
      title: 'Daire boyutları'
    vue:
      title: Vue
      description: 'Aynı bileşen, sürücü: türü veya değeri değiştirmek, yayı yeniden çizmek yerine yay hareket ettirir. Bu, durumun okuyucunun gözleri önünde değişeceği zaman bir uygulamanın yerleştirdiği şeydir.'
