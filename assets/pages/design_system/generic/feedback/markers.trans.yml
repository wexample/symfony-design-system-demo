he:
  page_title: סימנים
  page_icon: 'ph:bold/seal-check'
  intro: 'קפסולה אחת לכל מה שנאמר על דבר במילה: מצב, שם, גרסה, קטגוריה. הם היו שני אובייקטים עד שהיום שבו קוד ומצב עמדו זה לצד זה בכותרת אחת, ראש אחד, ואף אחד לא יכול היה לומר מה ההבדל אמור להיות - כך שהצורה היא אחת והטון הוא כל מה שמפריד ביניהם. מה שהיא נושאת הוא חופשי: מילה, דמות, גופן, או שניים מתוך השלושה. המעגל נמצא היכן שאין מקום לקפסולה, והספירה, שתלויה משורה ומוגדרת בטקסט שהיא תלויה ממנו, היא הדבר היחיד כאן שאינו סימן.'
  section:
    inline:
      title: 'במרכז משפט'
      description: 'מילה מופרדת כפי שהיא נקראת: גרסה, שלב, קטגוריה. הטון הנייטרלי, כי סימן שמגיע בצבע כבר עשה טענה לגבי מה שהוא מסמן - ובמשפט אין מה לטעון.'
    palette:
      title: הקטגוריות
      description: 'טונים שמפרידים דברים מבלי לדרג אותם. הם אינם נושאים משמעות - שום דבר לא אומר שהשלישי טוב מהחמישי - וזה בדיוק מה שעושה אותם שימושיים לטקסונומיה, שם משמעות תהיה שקר. נלבש בדיוק כמו מצב: אותה קפסולה, אותו קצב.'
    against:
      title: 'ספירה לצד סימן'
      description: 'ההבחנה היחידה שנותרה, והיא לא נוגעת למשמעות. משמאל ספירה: שתיים עשרה ממשהו, תלויה מהשורה שמובילה אליה ומוגדרת בטקסט של השורה הזו. מימין סימן: שתיים עשרה ממשהו שהלך טוב, עומד בפני עצמו ומוגדר בטוקנים. ספירה לצד פריט בתפריט היא ספירה; אותה דמות בעמודת צינור היא סימן.'
    words:
      title: 'מצב במילים'
      description: 'מוכר במשפט או לצד כותרת, שם הוא המסר ולא סימן בעמודה.'
    figures:
      title: 'מצב נקרא בעשרות'
      description: 'בעמודה, סימן ליד ספירה נייטרלית נקרא כשני אובייקטים וטבלה שלהם נקראת רעש. כאן הצבע עוטף את הדמות והעמודה נסרקת במעבר אחד - קומפקטי, מכיוון שתא אין לו מקום פנוי.'
    payload:
      title: 'מה שהיא נושאת'
      description: 'מילה עבור מה שהמצב הוא, דמות עבור כמה יש ממנו, שניהם, או אף אחד. הדמות תמיד נראית צעד אחורה מהשאר: היא מאשרת את המצב, היא לא המצב.'
    weights:
      title: 'שלוש הצורות זו לצד זו'
      description: 'אותה מידע במקום שבו היא נקראת בפועל. המעגל הוא הצורה עבור תא צר מדי עבור קפסולה, והיחידה שיכולה להראות מצב שהוא כמות - והוא מצויר עם הצבע בדיוק שהקפסולה ממלאה בו.'
    circles:
      title: מעגלים
      description: 'מצב שנאמר על ידי מעגל ולא על ידי מילה, עבור מקום שבו מצבים נקראים בעשרות - רשימה של ריצות, שורה של עבודות. הטבעת נושאת את הצבע, הגופן בפנים אומר איזה מצב זה, ושני צדדי הערימה מציירים את אותו סימון.'
    progress:
      title: 'מצב שהוא כמות'
      description: 'ריצה היא המצב היחיד עם כמות, כך שהטבעת שלה מצויירת עד היכן שהריצה הגיעה. Twig מדפיס את הערך שניתן לו; להזיז אותו אחר כך זה עניין של הדפדפן.'
    sizes:
      title: 'גודלי מעגלים'
    vue:
      title: Vue
      description: 'אותו רכיב, מונע: החלפת סוג או ערך מזיזה את הקשת במקום לצייר אותה מחדש. זה מה שאפליקציה מניחה כאשר המצב צפוי להשתנות מול עיני הקורא.'
    code:
      title: שימוש
