~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: संदेश
page_icon: 'ph:bold/notification'
section:
  block:
    title: 'संदेश ब्लॉक करें'
  compact:
    title: 'संक्षिप्त संदेश'
    description: 'बिना फ्रेम का रूप, जो स्थायी नियमों को बताने के लिए है, न कि किसी घटना की रिपोर्ट करने के लिए। विकल्पों के लिए संक्षिप्त पास करें।'
  default:
    title: 'संदेश प्रकार'
  vue:
    title: व्यू
    description: 'व्यू आंशिक के समान चार स्वाद, प्रत्येक अपने कॉलर के लिए उसके टुइग फ़ंक्शन द्वारा डाले गए आइकन को ले जाता है।'
compact:
  rule:
    one: 'एक outgoing इनवॉइस को एक incoming इनवॉइस से जोड़ा जाना चाहिए, जब तक कि यह एक बिक्री न हो।'
    two: 'Outgoing इनवॉइस को एक प्रशासक द्वारा बनाया जाना चाहिए।'
    three: 'इनवॉइस जारी करने से पहले पूरे राशि का आवंटन होना चाहिए।'
message:
  info:
    title: 'सूचना संदेश'
    body: 'यह एक संक्षिप्त जानकारी संदेश है।'
  success:
    title: 'सफलता संदेश'
    body: 'क्रिया सफलतापूर्वक पूरी हुई।'
  warning:
    title: 'चेतावनी संदेश'
    body: 'कुछ आपकी ध्यान की आवश्यकता है।'
  error:
    title: 'त्रुटि संदेश'
    body: 'अनुरोध को संसाधित करते समय एक त्रुटि हुई।'
