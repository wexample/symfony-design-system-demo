~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: वितरण
page_icon: 'ph:bold/chart-bar-horizontal'
intro: 'किसी कुल का एक पंक्ति में निर्माण। जहां एक प्रगति पट्टी बताती है कि एक मान कितना आगे बढ़ा है, यह बताता है कि एक संपूर्ण कैसे विभाजित होता है: भागों का क्रम वही होता है जो उन्हें दिया गया है, इसलिए एक पाइपलाइन बाईं से दाईं ओर पढ़ती है जैसे कि यह एक पाइपलाइन है। राज्यों के नाम उस शब्दावली से हैं जो कैप्सूल और वृत्त पहले से ही बोलते हैं, इसलिए एक राज्य कभी दो रंग नहीं लेता।'
section:
  default:
    title: 'एक संपूर्ण, भागों में'
    description: 'भाग अपने मूल्य के अनुपात में बढ़ते हैं, और उनके नीचे शब्दों में किंवदंती कहती है — वही कैप्सूल जो एक टेबल में एक राज्य को चित्रित करता है, इसलिए आंख दोनों के बीच जाती है बिना कुछ नया सीखे।'
  linked:
    title: 'भाग जो कहीं ले जाते हैं'
    description: 'एक भाग जिसका लक्ष्य है एक लिंक है: पट्टी उस सूची में जाने का रास्ता बन जाती है जिसे यह संक्षेपित करती है। पॉइंटर के नीचे यह एक रोशनी की फिल्म लेती है न कि एक अन्य रंग, जो एक अलग राज्य कहता।'
  bare:
    title: 'किंवदंती के बिना'
    description: 'जहां भागों के नाम बस बगल में हैं, या जहां पट्टी को केवल चीज़ के आकार को बताना है, वहां किंवदंती छोड़ दी जाती है और प्रत्येक भाग बताता है कि यह पॉइंटर के नीचे क्या है।'
  rest:
    title: 'कुल जो अपने भागों से बड़ा है'
    description: 'जो कुल गिनता है और कोई भाग नहीं गिनता है वह अपनी पंक्ति का हिस्सा रखता है और कुछ नहीं खींचता: ट्रैक ठीक उसी के लिए दिखता है, इसके बजाय भागों का फैलना एक पट्टी को भरने के लिए जो वे नहीं भरते।'
  empty:
    title: 'अभी तक कुछ नहीं गिना गया'
    description: 'कोई कुल नहीं और कोई भाग नहीं — कार्य शुरू नहीं हुआ, एक गणना अभी बाकी है। पट्टी अपनी जगह बनाए रखती है, एक नंगे ट्रैक के रूप में — वही जमीन जो एक कुल जो अपने भागों से बड़ा है दिखाता है — इसलिए उनकी एक पंक्ति अपनी आकृति बनाए रखती है; इसका आंकड़ा एक डैश है, क्योंकि कुछ भी गिना गया शून्य नहीं है।'
  compact:
    title: संक्षिप्त
    description: 'एक पंक्ति या कार्ड फुटर के लिए एक पतली पट्टी, जिसमें घनत्व इसके किंवदंती के कैप्सूल पर पारित किया गया है।'
  vue:
    title: 'व्यू, संचालित'
    description: 'वही पट्टी, इसके भाग डेटा के रूप में दिए गए। एक भाग जो कहीं नहीं जाता है एक क्लिक पर `select` के साथ प्रतिक्रिया करता है, जो एक टेबल के लिए सुनने के लिए है जो इसके बगल में अपने आप को फ़िल्टर करता है।'
bar:
  pipeline: 'कैटलॉग के पृष्ठ'
