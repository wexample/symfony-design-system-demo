~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: 'Обратная связь'
page_icon: 'ph:bold/notification'
section:
  vue:
    title: Vue
    description: 'Такой же тост, как в частичном vue. Закрытие происходит здесь, а не с анимацией: внутри дерева vue родитель управляет списком.'
  simple_toast:
    description: 'Отобразить простой тост'
    button: 'Открыть тост'
    title: 'Демонстрация тоста'
    message: 'Привет от ToastService + ToastStack. Вы также можете определить действия, такие как @action:demo(это) внутри сообщения.'
  tl_toast:
    description: 'Отобразить стек тостов в верхнем левом углу'
    button: 'Открыть тост'
    title: 'Тост в верхнем левом углу'
    message: 'Привет от ToastService + ToastStack (TL).'
  medium_toast:
    description: 'Отобразить сообщение среднего размера'
    button: 'Открыть тост'
    title: 'Средний тост'
    message: 'Это сообщение среднего размера для демонстрации.'
  long_toast:
    description: 'Отобразить долгое сообщение'
    button: 'Открыть тост'
    title: 'Длинный тост'
    message: 'Это более длинное сообщение для демонстрации. Оно содержит больше текста, чтобы вы могли увидеть, как компонент ведет себя с большим содержимым.'
  horizontal_toasts:
    description: 'Отобразить четыре тоста в горизонтальном стеке'
    info:
      title: 'Информационный тост'
      message: 'Предпросмотр горизонтального тоста.'
      button: 'Показать тост'
    success:
      title: 'Успешный тост'
      message: 'Все выглядит хорошо.'
      button: 'Показать тост'
    warning:
      title: 'Тост с предупреждением'
      message: 'Проверьте это действие еще раз.'
      button: 'Показать тост'
    error:
      title: 'Ошибка тоста'
      message: 'Что-то пошло не так.'
      button: 'Показать тост'
title:
  toasts: Тосты
