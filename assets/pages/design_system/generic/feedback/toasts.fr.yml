~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: "Retour d'information"
page_icon: 'ph:bold/notification'
section:
  vue:
    title: Vue
    description: "Le même toast qu'un composant vue partiel. La fermeture est émise ici plutôt que d'être animée : à l'intérieur d'un arbre vue, le parent possède la liste."
  simple_toast:
    description: 'Afficher un toast simple'
    button: 'Ouvrir le toast'
    title: 'Démonstration de toast'
    message: "Bonjour de ToastService + ToastStack. Vous pouvez également définir des liens d'action comme @action:demo(celui-ci) à l'intérieur d'un message."
  tl_toast:
    description: 'Afficher une pile de toasts en haut à gauche'
    button: 'Ouvrir le toast'
    title: 'Toast en haut à gauche'
    message: 'Bonjour de ToastService + ToastStack (TL).'
  medium_toast:
    description: 'Afficher un message de toast de longueur moyenne'
    button: 'Ouvrir le toast'
    title: 'Toast moyen'
    message: 'Ceci est un message de toast de longueur moyenne pour la démonstration.'
  long_toast:
    description: 'Afficher un message de toast long'
    button: 'Ouvrir le toast'
    title: 'Toast long'
    message: 'Ceci est un message de toast plus long pour la démonstration. Il contient plus de texte afin que vous puissiez prévisualiser comment le composant se comporte avec un contenu plus important.'
  horizontal_toasts:
    description: 'Afficher quatre toasts dans une pile horizontale'
    info:
      title: "Toast d'information"
      message: "Aperçu d'un toast horizontal."
      button: 'Afficher le toast'
    success:
      title: 'Toast de succès'
      message: 'Tout semble bon ici.'
      button: 'Afficher le toast'
    warning:
      title: "Toast d'avertissement"
      message: 'Vérifiez à nouveau cette action.'
      button: 'Afficher le toast'
    error:
      title: "Toast d'erreur"
      message: 'Quelque chose a mal tourné ici.'
      button: 'Afficher le toast'
title:
  toasts: Toasts
