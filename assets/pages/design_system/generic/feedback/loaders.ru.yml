~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Загрузчики
page_icon: 'ph:bold/spinner-gap'
intro: 'Что-то происходит, и его конец неизвестен. Оба этих элемента говорят именно это и отказываются говорить больше — когда конец известен, полоса на следующей вкладке сообщает об этом вместо них.'
section:
  spinner:
    title: Спиннер
    description: 'Машина занята. Три размера и встроенное выравнивание для случаев, когда она стоит в строке текста, а не в отдельном блоке.'
  dots:
    title: Точки
    description: 'Скоро что-то будет сказано. Те же три размера и те же выравнивания — меняется только то, кого читатель ждет.'
  vue:
    title: Vue
    description: 'Они также поставляются как частичные шаблоны Vue, принимая те же параметры, для страницы, которая решает во время выполнения, есть ли что-то, чего стоит ждать.'
spinner:
  label: Загрузка
  inline: 'Обработка данных'
dots:
  label: Ожидание
  inline: 'Другая сторона пишет'
