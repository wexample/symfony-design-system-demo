en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Messages
  page_icon: ph:bold/notification

  section:
    block:
      title: Block messages
    compact:
      title: Compact messages
      description: Unframed variant, for stating standing rules rather than reporting an event. Pass compact to the options.
    default:
      title: Message types
    vue:
      title: Vue
      description: "The same four flavours as vue partials, each carrying the icon its twig function puts in for the caller."

  compact:
    rule:
      one: An outgoing invoice must be linked to an incoming one, unless it is a sale.
      two: Outgoing invoices must be created by an administrator.
      three: The whole amount has to be allocated before the invoice can be issued.

  message:
    info:
      title: Info message
      body: This is a short informational message.
    success:
      title: Success message
      body: The action completed successfully.
    warning:
      title: Warning message
      body: Something needs your attention.
    error:
      title: Error message
      body: An error occurred while processing the request.

