~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: İlerleme
page_icon: 'ph:bold/gauge'
intro: 'Bir şeyin ne kadar ilerlediği, özel bir özellikte 0 ile 1 arasında bir oran olarak taşınır - durum çemberinin kavisini taşıdığı şekilde, yığının her iki tarafı da çubuğu tek bir beyan ile doldurur. Twig, verilen değeri yazdırır; sonrasında hareket ettirmek tarayıcının işidir.'
section:
  default:
    title: Durumlar
    description: 'Değer, bir sayı veya yüzde olarak yazılmış bir paydır ve asla sınırlarının dışına cevap vermez. Renk, geri bildirim rengidir, bu yüzden bir çubuk çalışmasının sona erdiğini bir mesaj veya durumla aynı dilde ifade eder.'
  plain:
    title: 'Toplam olmadan'
    description: 'Kimse başka bir şey söylemediğinde bir çubuk yüz sayısına kadar sayar, bu da yüzdeyi onun için tek şey yapar. Kendi toplamı, parçalar yerine şeyler olarak sayılan işler içindir.'
  indeterminate:
    title: 'Bilinmeyen bir son'
    description: 'Kimsenin bilmediği büyüklükte bir çalışmanın devam ettiği: çubuk süzüldü ve hiçbir sayı söylemiyor. Burada bir pay talep etmek, bir ölçüm olarak giydirilmiş bir tahmin olur.'
  compact:
    title: Kompakt
    description: 'Söylemesi gerekenlerin kısaltılmış hali, bir durum satırı veya bir alt bilgi için: daha ince bir iz, kelimelerin yanında olması, yukarısında değil, ve yoğunluğun yanında durana iletilmesi.'
  vue:
    title: 'Vue, sürülmüş'
    description: 'Aynı çubuk, cli ilerlemenin zaten konuştuğu kelime dağarcığı ile — güncelle, ilerle, bitir, sıfırla. Üzerinde hiçbir şey söylenmeyen bir adım bir birim değerindedir; bu da ne birimin ne de toplamın bir şey ifade etmediği yerdir.'
bar:
  queued: Beklemede
  working: 'Varlıkları oluşturuyor'
  almost: Yükleniyor
  done: Yayımlandı
  failed: 'Göç başarısız'
  counted: 'Dosyalar okundu'
  unknown: 'Bir şey aranıyor'
  indexing: İndeksleniyor
compact:
  app: acme-blog
