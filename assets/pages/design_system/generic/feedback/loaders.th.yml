~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: โหลด
page_icon: 'ph:bold/spinner-gap'
intro: 'กำลังเกิดบางอย่างขึ้นและไม่ทราบจุดสิ้นสุด ทั้งคู่บอกเพียงเท่านี้และไม่บอกอะไรเพิ่มเติม — เมื่อตอนจบทราบแล้ว แถบในแท็บถัดไปจะแสดงแทน.'
section:
  spinner:
    title: สปินเนอร์
    description: 'เครื่องจักรกำลังทำงาน มีสามขนาด และการจัดเรียงในบรรทัดสำหรับเมื่อมันอยู่ในบรรทัดข้อความแทนที่จะอยู่ในกล่องของมันเอง.'
  dots:
    title: จุด
    description: 'กำลังจะมีบางอย่างที่จะพูด เช่นเดียวกับสามขนาด และการจัดเรียงเดียวกัน — สิ่งที่เปลี่ยนคือผู้อ่านกำลังรอใคร.'
  vue:
    title: Vue
    description: 'ทั้งคู่ยังถูกส่งเป็น vue partials ด้วย โดยใช้ตัวเลือกเดียวกัน สำหรับหน้าที่ตัดสินใจในขณะที่ทำงานว่ามีอะไรให้รอหรือไม่.'
spinner:
  label: กำลังโหลด
  inline: กำลังประมวลผลข้อมูล
dots:
  label: รอ
  inline: อีกฝ่ายกำลังเขียน
