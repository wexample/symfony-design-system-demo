~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: フィードバック
page_icon: 'ph:bold/notification'
section:
  vue:
    title: Vue
    description: Vueパーシャルと同じトーストです。アニメーションではなく、ここで閉じることが発生します：Vueツリーの中で親がリストを所有します。
  simple_toast:
    description: シンプルなトーストを表示
    button: トーストを開く
    title: トーストデモ
    message: 'ToastService + ToastStackからこんにちは。メッセージ内で@action:demo(this one)のようにアクションリンクを定義することもできます。'
  tl_toast:
    description: 左上にトーストスタックを表示
    button: トーストを開く
    title: 左上トースト
    message: 'ToastService + ToastStack (TL)からこんにちは。'
  medium_toast:
    description: 中程度の長さのトーストメッセージを表示
    button: トーストを開く
    title: 中程度のトースト
    message: これはデモ用の中程度の長さのトーストメッセージです。
  long_toast:
    description: 長いトーストメッセージを表示
    button: トーストを開く
    title: 長いトースト
    message: これはデモ用の長いトーストメッセージです。より多くのテキストが含まれているので、コンポーネントが大きなコンテンツでどう動作するかをプレビューできます。
  horizontal_toasts:
    description: 横に4つのトーストを表示
    info:
      title: 情報トースト
      message: 横のトーストプレビュー。
      button: トーストを表示
    success:
      title: 成功トースト
      message: すべて良好に見えます。
      button: トーストを表示
    warning:
      title: 警告トースト
      message: このアクションを再確認してください。
      button: トーストを表示
    error:
      title: エラートースト
      message: ここで何かがうまくいきませんでした。
      button: トーストを表示
title:
  toasts: トースト
