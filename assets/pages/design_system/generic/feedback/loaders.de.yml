~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Ladeanzeigen
page_icon: 'ph:bold/spinner-gap'
intro: 'Es passiert etwas, und das Ende ist nicht bekannt. Beides sagt das aus und weigert sich, mehr zu verraten — wo das Ende bekannt ist, zeigt die Leiste im nächsten Tab es stattdessen an.'
section:
  spinner:
    title: Spinner
    description: 'Eine Maschine ist beschäftigt. Drei Größen und eine Inline-Ausrichtung für den Fall, dass sie in einer Textzeile steht, anstatt in einem eigenen Kästchen.'
  dots:
    title: Punkte
    description: 'Es steht etwas bevor. Die gleichen drei Größen und die gleichen Ausrichtungen — was sich ändert, ist, auf wen der Leser wartet.'
  vue:
    title: Vue
    description: 'Beide werden auch als Vue-Teile geliefert, die die gleichen Optionen übernehmen, für eine Seite, die während des Betriebs entscheidet, ob es etwas gibt, auf das sie warten muss.'
spinner:
  label: Laden
  inline: 'Daten werden verarbeitet'
dots:
  label: Warten
  inline: 'Die andere Seite schreibt'
