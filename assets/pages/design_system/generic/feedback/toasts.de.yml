~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: Feedback
page_icon: 'ph:bold/notification'
section:
  vue:
    title: Vue
    description: 'Der gleiche Toast wie ein Vue-Teil. Das Schließen wird hier ausgelöst, anstatt animiert zu verschwinden: innerhalb eines Vue-Baums gehört die Liste dem Elternteil.'
  simple_toast:
    description: 'Einen einfachen Toast anzeigen'
    button: 'Toast öffnen'
    title: Toast-Demo
    message: 'Hallo von ToastService + ToastStack. Sie können auch Aktionslinks wie @action:demo(dieser hier) innerhalb einer Nachricht definieren.'
  tl_toast:
    description: 'Einen Toast-Stapel oben links anzeigen'
    button: 'Toast öffnen'
    title: 'Toast oben links'
    message: 'Hallo von ToastService + ToastStack (TL).'
  medium_toast:
    description: 'Eine Toast-Nachricht mittlerer Länge anzeigen'
    button: 'Toast öffnen'
    title: 'Mittlerer Toast'
    message: 'Dies ist eine Toast-Nachricht mittlerer Länge für die Demo.'
  long_toast:
    description: 'Eine lange Toast-Nachricht anzeigen'
    button: 'Toast öffnen'
    title: 'Langer Toast'
    message: 'Dies ist eine längere Toast-Nachricht für die Demo. Sie enthält mehr Text, damit Sie sehen können, wie die Komponente mit größeren Inhalten funktioniert.'
  horizontal_toasts:
    description: 'Vier Toasts in einem horizontalen Stapel anzeigen'
    info:
      title: Info-Toast
      message: 'Eine Vorschau des horizontalen Toasts.'
      button: 'Toast anzeigen'
    success:
      title: Erfolg-Toast
      message: 'Hier sieht alles gut aus.'
      button: 'Toast anzeigen'
    warning:
      title: Warnung-Toast
      message: 'Überprüfen Sie diese Aktion noch einmal.'
      button: 'Toast anzeigen'
    error:
      title: Fehler-Toast
      message: 'Hier ist etwas schiefgegangen.'
      button: 'Toast anzeigen'
title:
  toasts: Toasts
