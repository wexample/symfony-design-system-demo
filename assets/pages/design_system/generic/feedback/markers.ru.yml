page_title: Маркер
page_icon: 'ph:bold/seal-check'
intro: 'Одна капсула для всего, что сказано о вещи одним словом: состояние, имя, версия, категория. Они были двумя объектами до того дня, когда код и состояние встали бок о бок в одном заголовке, на расстоянии головы, и никто не мог сказать, что значит различие — так что форма едина, а тон составляет всё, что отличает их. То, что она несет, свободно: слово, число, символ или два из трех. Круг стоит там, где нет места для капсулы, а счетчик, который висит из ряда и имеет размер в тексте, из которого он свисает, — это единственное здесь, что не является маркером.'
section:
  inline:
    title: 'В середине предложения'
    description: 'Слово, выделенное в процессе чтения: версия, фаза, категория. Нейтральный тон, потому что маркер, пришедший окрашенным, уже сделал заявление о том, что он маркирует — а в предложении нечего заявлять.'
  palette:
    title: Категории
    description: 'Тоны, которые различают вещи без ранжирования. Они не несут смысла — ничто не говорит о том, что третья лучше пятой — что как раз и делает их пригодными для таксономии, где смысл был бы ложью. Носится так же, как состояние: та же капсула, тот же ритм.'
  against:
    title: 'Счетчик рядом с маркером'
    description: 'Единственное оставшееся различие, и оно не связано со смыслом. Слева счетчик: двенадцать чего-то, висящих из ряда, который ведет к нему, и размером в текст этого ряда. Справа маркер: двенадцать чего-то, что прошло успешно, стоящий отдельно и размером в токены. Счетчик рядом с элементом меню — это счетчик; то же самое число в столбце конвейера — это маркер.'
  words:
    title: 'Состояние словами'
    description: 'Объявлено в предложении или рядом с заголовком, где это сообщение, а не отметка в столбце.'
  figures:
    title: 'Состояние, читаемое по дюжинам'
    description: 'В столбце галочка рядом с нейтральным счетом читается как два объекта, а таблица из них читается как шум. Здесь цвет обрамляет фигуру, и столбец сканируется за один проход — компактно, так как ячейка не имеет лишнего места.'
  payload:
    title: 'То, что она несет'
    description: 'Слово для описания состояния, число для количества, оба или ни одно. Число всегда рисуется на шаг назад от остального: оно квалифицирует состояние, но не является состоянием.'
  weights:
    title: 'Три формы бок о бок'
    description: 'Та же информация в месте, где она фактически читается. Круг — это форма для ячейки, слишком узкой для капсулы, и единственная, которая может показать состояние как количество — и она рисуется тем же цветом, который заполняет капсула.'
  circles:
    title: Круги
    description: 'Состояние, рассказанное кругом, а не словом, для места, где состояния читаются по дюжинам — список пробежек, ряд заданий. Кольцо несет цвет, символ внутри говорит, какое это состояние, и обе стороны стека рисуют одни и те же разметки.'
  progress:
    title: 'Состояние, которое является количеством'
    description: 'Пробежка — это единственное состояние с количеством, поэтому ее кольцо рисуется так далеко, как пробежка достигла. Twig печатает значение, которое ему дано; перемещение его впоследствии — это дело браузера.'
  sizes:
    title: 'Размеры кругов'
  vue:
    title: Vue
    description: 'Тот же компонент, управляемый: переключение типа или значения перемещает дугу вместо перерисовки. Это то, что приложение помещает, когда состояние собирается измениться на глазах у читателя.'
