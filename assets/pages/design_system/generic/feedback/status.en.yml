page_title: Status
page_icon: ph:bold/seal-check

intro: "A state said in one object. The same nine states throughout: the capsule carries a word, a figure or both and comes in two weights, the circle stands where there is no room for a capsule. What none of them does is pick a colour — a state names itself, and the theme decides what that looks like."

section:
  soft:
    title: A state on its own
    description: "Announced in a sentence or beside a title, where it is the message rather than a mark in a column: a tinted ground, the colour as ink, a line around it. This is the weight to reach for when there is one of them on the page."
  solid:
    title: A state read by the dozen
    description: "In a column, a tick beside a neutral count reads as two objects and a table of them reads as noise. Filled, the colour encloses the figure and the column is scanned in one pass. A filled capsule is its own ground, which is why it carries no line and why it keeps the same intensity in light and in dark."
  payload:
    title: What it carries
    description: "A word for what the state is, a figure for how many of it there are, both, or neither. The figure is always drawn a step back from the rest: it qualifies the state, it is not the state."
  weights:
    title: The three forms side by side
    description: "The same information in the place it is actually read. Soft and filled are the same capsule; the circle is the form for a cell too narrow for words, and the only one that can show a state being a quantity."
  circles:
    title: Circles
    description: "A state told by a circle rather than by a word, for a place where states are read by the dozen — a list of runs, a row of jobs. The ring carries the colour, the glyph inside says which state it is, and both sides of the stack draw the same markup."
  progress:
    title: A state that is a quantity
    description: "A run is the one state with an amount to it, so its ring is drawn as far as the run has got. Twig prints the value it is given; moving it afterwards is the browser's business."
  sizes:
    title: Circle sizes
  vue:
    title: Vue
    description: "The same component, driven: switching the type or the value moves the arc instead of redrawing it. This one is what an app places when the state is going to change under the reader's eyes."
  code:
    title: Usage

state:
  success: Operation successful
  error: An error occurred
  warning: Proceed with caution
  info: For your information
  passed: Passed

