  working: 'اثاثے بنائے جا رہے ہیں'
  almost: 'اپ لوڈ ہو رہا ہے'
  done: 'پہنچایا گیا'
  failed: 'ہجرت ناکام'
  counted: 'فائلیں پڑھی گئیں'
  unknown: 'کچھ تلاش کیا جا رہا ہے'
  indexing: انڈیکسنگ
