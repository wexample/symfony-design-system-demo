~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: ترقی
page_icon: 'ph:bold/gauge'
intro: 'کسی چیز کی ترقی کی سطح، جو ایک مخصوص خاصیت میں 0 اور 1 کے درمیان تناسب کے طور پر دکھائی جاتی ہے — جیسے حیثیت کا دائرہ اپنی قوس کو ظاہر کرتا ہے، اسی طرح دونوں طرف کے اسٹیک اس بار کو ایک اعلان کے ساتھ بھر دیتے ہیں۔ ٹوئگ وہ قیمت پرنٹ کرتا ہے جو اسے دی گئی ہے؛ بعد میں اسے منتقل کرنا براؤزر کا کام ہے۔'
section:
  default:
    title: حالتیں
    description: 'یہ قیمت ایک تعداد یا ایک حصہ ہے جو فیصد کے طور پر لکھی گئی ہے، اور کبھی بھی اپنے حدود سے باہر جواب نہیں دیتی۔ رنگ فیڈبیک کا ہوتا ہے، لہٰذا ایک بار یہ بتاتی ہے کہ اس کا کام کس طرح ختم ہوا اسی زبان میں جیسے ایک پیغام یا حیثیت۔'
  plain:
    title: 'بغیر مجموعی'
    description: 'سو وہ تعداد ہے جس تک ایک بار پہنچتا ہے جب کوئی اور کچھ نہیں کہتا، جو اسے دینے کے لیے صرف فیصد بناتا ہے۔ اپنا مجموعہ چیزوں میں شمار شدہ کام کے لیے ہے نہ کہ حصوں میں۔'
  indeterminate:
    title: 'ایک اختتام جو معلوم نہیں'
    description: 'کام جاری ہے جس کا سائز کوئی نہیں جانتا: بار جھاڑتا ہے اور کوئی نمبر نہیں بتاتا۔ یہاں کسی حصہ کا دعویٰ کرنا ایک اندازہ ہوگا جو ایک پیمائش کی شکل میں ہے۔'
  compact:
    title: کمپیکٹ
    description: 'اسے صرف وہی کہنا ہے جو اسے کہنا ہے، ایک حیثیت لائن یا فٹر کے لیے: ایک پتلا راستہ، اس کے ساتھ الفاظ اوپر نہیں بلکہ اس کے ساتھ، اور کثافت جو کچھ بھی اس کے ساتھ ہو اس پر منتقل کر دی گئی ہے۔'
  vue:
    title: 'ویو، چلایا گیا'
    description: 'وہی بار، cli ترقی کی زبان کے ساتھ — اپ ڈیٹ، ترقی، ختم، ری سیٹ۔ ایک قدم جس کے بارے میں کچھ نہیں کہا گیا ایک یونٹ کے قابل ہے، جو یہ ہے کہ جہاں نہ تو یونٹ اور نہ ہی مجموعہ کا کوئی مطلب ہے۔'
