~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
page_title: फीडबैक
page_icon: 'ph:bold/notification'
section:
  vue:
    title: व्यू
    description: 'यह एक vue आंशिक के रूप में समान टोस्ट है। बंद करना यहां उत्सर्जित होता है न कि एनीमेशन के माध्यम से: एक vue ट्री के अंदर, माता-पिता सूची का मालिक होता है।'
  simple_toast:
    description: 'एक साधारण टोस्ट प्रदर्शित करें'
    button: 'टोस्ट खोलें'
    title: 'टोस्ट डेमो'
    message: 'टोस्टसर्विस + टोस्टस्टैक से नमस्ते। आप संदेश के अंदर कार्रवाई लिंक भी परिभाषित कर सकते हैं जैसे @action:demo(यह वाला)।'
  tl_toast:
    description: 'ऊपर-बाएं टोस्ट स्टैक प्रदर्शित करें'
    button: 'टोस्ट खोलें'
    title: 'ऊपर-बाएं टोस्ट'
    message: 'टोस्टसर्विस + टोस्टस्टैक (टीएल) से नमस्ते।'
  medium_toast:
    description: 'मध्यम-लंबाई का टोस्ट संदेश प्रदर्शित करें'
    button: 'टोस्ट खोलें'
    title: 'मध्यम टोस्ट'
    message: 'यह डेमो के लिए एक मध्यम-लंबाई का टोस्ट संदेश है।'
  long_toast:
    description: 'एक लंबे टोस्ट संदेश प्रदर्शित करें'
    button: 'टोस्ट खोलें'
    title: 'लंबा टोस्ट'
    message: 'यह डेमो के लिए एक लंबा टोस्ट संदेश है। इसमें अधिक पाठ है ताकि आप देख सकें कि घटक बड़े सामग्री के साथ कैसे व्यवहार करता है।'
  horizontal_toasts:
    description: 'चार टोस्ट को क्षैतिज स्टैक में प्रदर्शित करें'
    info:
      title: 'जानकारी टोस्ट'
      message: 'एक क्षैतिज टोस्ट पूर्वावलोकन।'
      button: 'टोस्ट दिखाएँ'
    success:
      title: 'सफलता टोस्ट'
      message: 'यहां सब कुछ सही लग रहा है।'
      button: 'टोस्ट दिखाएँ'
    warning:
      title: 'चेतावनी टोस्ट'
      message: 'इस क्रिया की दोबारा जांच करें।'
      button: 'टोस्ट दिखाएँ'
    error:
      title: 'त्रुटि टोस्ट'
      message: 'यहां कुछ गलत हो गया।'
      button: 'टोस्ट दिखाएँ'
title:
  toasts: टोस्ट
