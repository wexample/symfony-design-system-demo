page_title: 标记
page_icon: 'ph:bold/seal-check'
intro: 一个胶囊代表关于某事的所有言论：一个状态，一个名称，一个版本，一个类别。它们曾经是两个物体，直到有一天一个代码和一个状态并排在一个标题中，头相隔，没人能说出它们的区别意味着什么——所以形状是一个，音调是区分它们的全部。它所承载的是免费的：一个词，一个数字，一个符号，或三者中的两个。圆圈出现在没有胶囊的地方，而悬挂在一行中的计数器，其大小与它悬挂的文本相同，是这里唯一不是标记的东西。
section:
  inline:
    title: 在句子中间
    description: 一个独立的词在阅读时：一个版本，一个阶段，一个类别。中性音调，因为一个带颜色的标记已经对它所标记的内容做出了声明——而在一个句子中没有什么可以主张的。
  palette:
    title: 类别
    description: 区分事物而不排名的色调。它们没有意义——没有什么表明第三个比第五个更好——这正是使它们可用于分类法的原因，其中的意义将是谎言。与状态完全相同：相同的胶囊，相同的节奏。
  against:
    title: 标记旁的计数器
    description: 剩下的唯一区别，与意义无关。左边是一个计数器：十二个某物，悬挂在通往它的行中，并与该行的文本大小相同。右边是一个标记：十二个某物做得很好，独立站立并以代币为单位。菜单项旁的计数是一个计数器；管道列中的相同数字是一个标记。
  words:
    title: 用词表达的状态
    description: 在句子或标题旁宣布，它是信息而不是列中的标记。
  figures:
    title: 以十二为单位读取的状态
    description: 在一列中，中性计数旁的勾号被视为两个物体，而它们的表格被视为噪音。这里的颜色包围了数字，列在一次扫描中完成——紧凑，因为一个单元没有多余的空间。
  payload:
    title: 它所承载的内容
    description: 表示状态的一个词，表示数量的一个数字，二者皆有，或皆无。数字总是比其他部分稍微后退：它修饰状态，而不是状态。
  weights:
    title: 并排的三种形式
    description: 在实际阅读的位置中相同的信息。圆圈是对于一个过于狭窄而无法容纳胶囊的单元的形式，且是唯一能显示状态为数量的形式——它是用胶囊填充的颜色绘制的。
  circles:
    title: 圆圈
    description: 用圆圈而不是词语表达的状态，适用于以十二为单位读取状态的地方——一列运行，一行工作。环带着颜色，内部的符号表示它是什么状态，堆的两侧绘制相同的标记。
  progress:
    title: 一种数量状态
    description: 运行是唯一具有数量的状态，因此其环的绘制程度取决于运行的进度。Twig打印它被赋予的值；之后的移动由浏览器负责。
  sizes:
    title: 圆圈大小
  vue:
    title: Vue
    description: 相同的组件，驱动：切换类型或值会移动弧，而不是重新绘制它。这是一个应用程序在状态将在读者眼前变化时放置的内容。
  code:
    title: 用法
