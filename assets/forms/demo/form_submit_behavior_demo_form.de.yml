field:
  entity_search:
    label: Raum
    placeholder: 'Raum suchen...'
    help: 'Wählt einen Datensatz durch Suche aus. Was das Formular überträgt, ist seine ID.'
  password:
    label: Passwort
    help: 'Geben Sie Ihr Passwort zur Authentifizierung ein.'
    error:
      ERR_FIELD_PASSWORD_INVALID: 'Passwort ist zu Testzwecken ungültig.'
  emoji:
    label: Emoji
    help: 'Wählen Sie ein Emoji, um Ihre Stimmung darzustellen.'
    error:
      ERR_FIELD_EMOJI_INVALID: 'Emoji ist zu Testzwecken ungültig.'
  text_simple:
    label: Text
    help: 'Einzeiliges Texteingabefeld für kurze Inhalte.'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 'Text ist zu Testzwecken ungültig.'
  text_area:
    label: 'Langer Text'
    placeholder: 'Geben Sie ein, was Sie möchten...'
    help: 'Ein mehrzeiliges Texteingabefeld für längere Inhalte.'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'Langer Text ist zu Testzwecken ungültig.'
  behavior:
    label: Verhalten
    help: 'Wählen Sie aus, wie das Formular nach der Einsendung reagiert.'
    error:
      ERR_FIELD_BEHAVIOR_INVALID: 'Verhaltensauswahl ist zu Testzwecken ungültig.'
    choice:
      error:
        label: 'Fehler anzeigen'
        description: 'schließt die Einbettung (oder tut nichts auf der Seite).'
      js:
        label: 'JS-Aktion (Toast)'
        description: 'gibt Validierungsfehler zurück.'
      redirect:
        label: Weiterleitung
        description: 'löst einen Toast aus, ohne zu übermitteln.'
      default:
        label: Standard
        description: 'navigiert zur vollständigen Seite oder schließt das Modal.'
      embed_stay:
        label: 'Einbettung offen halten (Modal / Panel)'
        description: 'bleibt im Modal/Panel offen.'
      embed_redirect:
        label: 'Weiterleitung in Einbettung (Modal / Panel)'
        description: 'navigiert innerhalb des Modals/Panels.'
  date:
    label: Datum
    help: 'Wählen Sie ein Datum mit dem Datumsauswähler aus.'
    error:
      ERR_FIELD_DATE_INVALID: 'Datum ist zu Testzwecken ungültig.'
  datetime:
    label: 'Datum & Uhrzeit'
    help: 'Wählen Sie ein Datum und eine Uhrzeit kombiniert aus.'
    error:
      ERR_FIELD_DATETIME_INVALID: 'Datum & Uhrzeit sind zu Testzwecken ungültig.'
  time:
    label: Uhrzeit
    help: 'Wählen Sie eine Tageszeit aus.'
    error:
      ERR_FIELD_TIME_INVALID: 'Uhrzeit ist zu Testzwecken ungültig.'
  file:
    label: Datei
    help: 'Laden Sie eine oder mehrere Dateien von Ihrem Gerät hoch.'
    error:
      ERR_FIELD_FILE_INVALID: 'Datei ist zu Testzwecken ungültig.'
  email:
    label: E-Mail
    placeholder: you@example.com
    help: 'Geben Sie eine gültige E-Mail-Adresse ein.'
    error:
      ERR_FIELD_EMAIL_INVALID: 'E-Mail ist zu Testzwecken ungültig.'
  number:
    label: Nummer
    help: 'Geben Sie einen numerischen Wert ein.'
    error:
      ERR_FIELD_NUMBER_INVALID: 'Nummer ist zu Testzwecken ungültig.'
  url:
    label: URL
    placeholder: 'https://'
    help: 'Geben Sie eine vollständige URL einschließlich des Protokolls ein.'
    error:
      ERR_FIELD_URL_INVALID: 'URL ist zu Testzwecken ungültig.'
  switch:
    label: Schalter
    help: 'Schalten Sie diese Option ein oder aus.'
    error:
      ERR_FIELD_SWITCH_INVALID: 'Schalter ist zu Testzwecken ungültig.'
  radio_choice:
    label: Radioauswahl
    help: 'Wählen Sie eine Option aus der Liste.'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'Radioauswahl ist zu Testzwecken ungültig.'
    choice:
      option_a:
        label: 'Option A'
      option_b:
        label: 'Option B'
      option_c:
        label: 'Option C'
action:
  button_demo: 'Nichts tun'
  submit_default: Einreichen
  submit_error: 'Fehler anzeigen'
  submit_js: JS-Aktion
  submit_redirect: Weiterleiten
  submit_embed_stay: 'Einbettung offen halten'
  submit_embed_redirect: 'Weiterleitung in Einbettung'
error:
  ERR_FORM_TEST:
    message: 'Globale Fehlermeldung zu Testzwecken.'
description: |
  Verwenden Sie dieses Formular, um Einsendeverhalten zu testen. Diese Demo ist in Seiten-, Ajax- und Modal-Kontexten verfügbar. Wählen Sie ein Verhalten unten aus und senden Sie es ab:
toast:
  success:
    title: Erfolg
    message: 'Formular erfolgreich eingereicht.'
  js_action:
    title: JS-Aktion
    message: 'Möchten Sie das Formular reaktivieren?'
    reactivate: Reaktivieren
    dismiss: Schließen
