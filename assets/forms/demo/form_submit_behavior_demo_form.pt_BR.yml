field:
  entity_search:
    label: Sala
    placeholder: 'Pesquise uma sala...'
    help: 'Seleciona um registro pesquisando por ele. O que o formulário carrega é seu id.'
  password:
    label: Senha
    help: 'Digite sua senha para autenticação.'
    error:
      ERR_FIELD_PASSWORD_INVALID: 'Senha inválida para fins de teste.'
  emoji:
    label: Emoji
    help: 'Escolha um emoji para representar seu humor.'
    error:
      ERR_FIELD_EMOJI_INVALID: 'Emoji inválido para fins de teste.'
  text_simple:
    label: Texto
    help: 'Um campo de texto de uma linha para conteúdo curto.'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 'Texto inválido para fins de teste.'
  text_area:
    label: 'Texto longo'
    placeholder: 'Digite o que você quiser...'
    help: 'Uma área de texto multi-linha para conteúdo mais longo.'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'Texto longo inválido para fins de teste.'
  behavior:
    label: Comportamento
    help: 'Escolha como o formulário reage após a submissão.'
    error:
      ERR_FIELD_BEHAVIOR_INVALID: 'Seleção de comportamento inválida para fins de teste.'
    choice:
      error:
        label: 'Mostrar erros'
        description: 'fecha o embed (ou não faz nada na página).'
      js:
        label: 'Ação JS (toast)'
        description: 'retorna erros de validação.'
      redirect:
        label: Redirecionar
        description: 'dispara um toast sem submeter.'
      default:
        label: Padrão
        description: 'navega pela página completa ou fecha o modal.'
      embed_stay:
        label: 'Manter embed aberto (modal / painel)'
        description: 'permanece aberto no modal/painel.'
      embed_redirect:
        label: 'Redirecionar no embed (modal / painel)'
        description: 'navega dentro do modal/painel.'
  date:
    label: Data
    help: 'Selecione uma data usando o seletor de data.'
    error:
      ERR_FIELD_DATE_INVALID: 'Data inválida para fins de teste.'
  datetime:
    label: 'Data e hora'
    help: 'Selecione uma data e hora combinadas.'
    error:
      ERR_FIELD_DATETIME_INVALID: 'Data e hora inválidas para fins de teste.'
  time:
    label: Hora
    help: 'Selecione um horário do dia.'
    error:
      ERR_FIELD_TIME_INVALID: 'Hora inválida para fins de teste.'
  file:
    label: Arquivo
    help: 'Envie um ou mais arquivos do seu dispositivo.'
    error:
      ERR_FIELD_FILE_INVALID: 'Arquivo inválido para fins de teste.'
  email:
    label: Email
    placeholder: você@exemplo.com
    help: 'Digite um endereço de email válido.'
    error:
      ERR_FIELD_EMAIL_INVALID: 'Email inválido para fins de teste.'
  number:
    label: Número
    help: 'Digite um valor numérico.'
    error:
      ERR_FIELD_NUMBER_INVALID: 'Número inválido para fins de teste.'
  url:
    label: URL
    placeholder: 'https://'
    help: 'Digite uma URL completa incluindo o protocolo.'
    error:
      ERR_FIELD_URL_INVALID: 'URL inválida para fins de teste.'
  switch:
    label: Interruptor
    help: 'Ative ou desative esta opção.'
    error:
      ERR_FIELD_SWITCH_INVALID: 'Interruptor inválido para fins de teste.'
  radio_choice:
    label: 'Escolha de rádio'
    help: 'Selecione uma opção da lista.'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'Escolha de rádio inválida para fins de teste.'
    choice:
      option_a:
        label: 'Opção A'
      option_b:
        label: 'Opção B'
      option_c:
        label: 'Opção C'
action:
  button_demo: 'Não fazer nada'
  submit_default: Enviar
  submit_error: 'Mostrar erros'
  submit_js: 'Ação JS'
  submit_redirect: Redirecionar
  submit_embed_stay: 'Manter embed aberto'
  submit_embed_redirect: 'Redirecionar no embed'
error:
  ERR_FORM_TEST:
    message: 'Erro global para fins de teste.'
description: |
  Use este formulário para testar comportamentos de submissão. Esta demonstração está disponível em contexto de página, ajax e modal. Escolha um comportamento abaixo e envie:
toast:
  success:
    title: Sucesso
    message: 'Formulário enviado com sucesso.'
  js_action:
    title: 'Ação JS'
    message: 'Você deseja reativar o formulário?'
    reactivate: Reativar
    dismiss: Dispensar
