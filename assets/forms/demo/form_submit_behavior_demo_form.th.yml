field:
  entity_search:
    label: ห้อง
    placeholder: ค้นหาห้อง...
    help: 'เลือกบันทึกโดยการค้นหา สิ่งที่ฟอร์มเก็บคือรหัสของมัน'
  password:
    label: รหัสผ่าน
    help: กรอกรหัสผ่านของคุณเพื่อยืนยันตัวตน
    error:
      ERR_FIELD_PASSWORD_INVALID: รหัสผ่านไม่ถูกต้องสำหรับการทดสอบ
  emoji:
    label: อีโมจิ
    help: เลือกอีโมจิเพื่อแสดงอารมณ์ของคุณ
    error:
      ERR_FIELD_EMOJI_INVALID: อีโมจิไม่ถูกต้องสำหรับการทดสอบ
  text_simple:
    label: ข้อความ
    help: ช่องกรอกข้อความแบบบรรทัดเดียวสำหรับเนื้อหาสั้น
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: ข้อความไม่ถูกต้องสำหรับการทดสอบ
  text_area:
    label: ข้อความยาว
    placeholder: พิมพ์สิ่งที่คุณต้องการ...
    help: พื้นที่ข้อความแบบหลายบรรทัดสำหรับเนื้อหายาว
    error:
      ERR_FIELD_TEXT_AREA_INVALID: ข้อความยาวไม่ถูกต้องสำหรับการทดสอบ
  behavior:
    label: พฤติกรรม
    help: เลือกวิธีที่ฟอร์มตอบสนองหลังการส่ง
    error:
      ERR_FIELD_BEHAVIOR_INVALID: การเลือกพฤติกรรมไม่ถูกต้องสำหรับการทดสอบ
    choice:
      error:
        label: แสดงข้อผิดพลาด
        description: 'ปิดการฝัง (หรือไม่ทำอะไรในหน้า)'
      js:
        label: 'การกระทำ JS (toast)'
        description: ส่งคืนข้อผิดพลาดการตรวจสอบ
      redirect:
        label: เปลี่ยนเส้นทาง
        description: 'กระตุ้น toast โดยไม่ต้องส่งข้อมูล'
      default:
        label: ค่าเริ่มต้น
        description: 'นำทางไปยังหน้าเต็ม หรือปิดโมดัล'
      embed_stay:
        label: 'คงการฝังไว้ (โมดัล / แผง)'
        description: คงไว้ในโมดัล/แผง
      embed_redirect:
        label: 'เปลี่ยนเส้นทางในฝัง (โมดัล / แผง)'
        description: นำทางภายในโมดัล/แผง
  date:
    label: วันที่
    help: เลือกวันที่โดยใช้ตัวเลือกวันที่
    error:
      ERR_FIELD_DATE_INVALID: วันที่ไม่ถูกต้องสำหรับการทดสอบ
  datetime:
    label: 'วันที่ & เวลา'
    help: เลือกวันที่และเวลารวมกัน
    error:
      ERR_FIELD_DATETIME_INVALID: 'วันที่ & เวลาไม่ถูกต้องสำหรับการทดสอบ'
  time:
    label: เวลา
    help: เลือกเวลาของวัน
    error:
      ERR_FIELD_TIME_INVALID: เวลาไม่ถูกต้องสำหรับการทดสอบ
  file:
    label: ไฟล์
    help: อัปโหลดไฟล์หนึ่งหรือหลายไฟล์จากอุปกรณ์ของคุณ
    error:
      ERR_FIELD_FILE_INVALID: ไฟล์ไม่ถูกต้องสำหรับการทดสอบ
  email:
    label: อีเมล
    placeholder: you@example.com
    help: กรอกที่อยู่อีเมลที่ถูกต้อง
    error:
      ERR_FIELD_EMAIL_INVALID: อีเมลไม่ถูกต้องสำหรับการทดสอบ
  number:
    label: หมายเลข
    help: กรอกค่าตัวเลข
    error:
      ERR_FIELD_NUMBER_INVALID: หมายเลขไม่ถูกต้องสำหรับการทดสอบ
  url:
    label: URL
    placeholder: 'https://'
    help: 'กรอก URL เต็มรูปแบบรวมถึงโปรโตคอล'
    error:
      ERR_FIELD_URL_INVALID: 'URL ไม่ถูกต้องสำหรับการทดสอบ'
  switch:
    label: สวิตช์
    help: เปิดหรือปิดตัวเลือกนี้
    error:
      ERR_FIELD_SWITCH_INVALID: สวิตช์ไม่ถูกต้องสำหรับการทดสอบ
  radio_choice:
    label: ตัวเลือกวิทยุ
    help: เลือกหนึ่งตัวเลือกจากรายการ
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: ตัวเลือกวิทยุไม่ถูกต้องสำหรับการทดสอบ
    choice:
      option_a:
        label: 'ตัวเลือก A'
      option_b:
        label: 'ตัวเลือก B'
      option_c:
        label: 'ตัวเลือก C'
action:
  button_demo: ไม่ทำอะไร
  submit_default: ส่ง
  submit_error: แสดงข้อผิดพลาด
  submit_js: 'การกระทำ JS'
  submit_redirect: เปลี่ยนเส้นทาง
  submit_embed_stay: คงการฝังไว้
  submit_embed_redirect: เปลี่ยนเส้นทางในฝัง
error:
  ERR_FORM_TEST:
    message: ข้อผิดพลาดทั่วไปสำหรับการทดสอบ
description: |
  ใช้ฟอร์มนี้เพื่อลองพฤติกรรมการส่ง ฟอร์มนี้มีให้ในหน้า, ajax, และบริบทโมดัล เลือกพฤติกรรมด้านล่างและส่ง:
toast:
  success:
    title: สำเร็จ
    message: ส่งฟอร์มสำเร็จแล้ว
  js_action:
    title: 'การกระทำ JS'
    message: 'คุณต้องการเปิดใช้งานฟอร์มอีกครั้งหรือไม่?'
    reactivate: เปิดใช้งานอีกครั้ง
    dismiss: ปิด
