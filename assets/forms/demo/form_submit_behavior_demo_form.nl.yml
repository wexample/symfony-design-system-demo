field:
  entity_search:
    label: Kamer
    placeholder: 'Zoek een kamer...'
    help: 'Kies een record door erin te zoeken. Wat het formulier meedraagt, is de id.'
  password:
    label: Wachtwoord
    help: 'Voer uw wachtwoord in om te authenticeren.'
    error:
      ERR_FIELD_PASSWORD_INVALID: 'Wachtwoord is ongeldig voor testdoeleinden.'
  emoji:
    label: Emoji
    help: 'Kies een emoji om uw stemming weer te geven.'
    error:
      ERR_FIELD_EMOJI_INVALID: 'Emoji is ongeldig voor testdoeleinden.'
  text_simple:
    label: Tekst
    help: 'Een tekstinvoer op één regel voor korte inhoud.'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 'Tekst is ongeldig voor testdoeleinden.'
  text_area:
    label: 'Langere tekst'
    placeholder: 'Typ wat je wilt...'
    help: 'Een tekstgebied met meerdere regels voor langere inhoud.'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'Langere tekst is ongeldig voor testdoeleinden.'
  behavior:
    label: Gedrag
    help: 'Kies hoe het formulier reageert na indiening.'
    error:
      ERR_FIELD_BEHAVIOR_INVALID: 'Selectie van gedrag is ongeldig voor testdoeleinden.'
    choice:
      error:
        label: 'Toon fouten'
        description: 'sluit de embed (of doet niets in de pagina).'
      js:
        label: 'JS actie (toast)'
        description: 'geeft validatiefouten terug.'
      redirect:
        label: Doorsturen
        description: 'veroorzaakt een toast zonder in te dienen.'
      default:
        label: Standaard
        description: 'navigeert naar de volledige pagina, of sluit de modal.'
      embed_stay:
        label: 'Houd embed geopend (modal / paneel)'
        description: 'blijft open in modal/paneel.'
      embed_redirect:
        label: 'Doorsturen in embed (modal / paneel)'
        description: 'navigeert binnen de modal/paneel.'
  date:
    label: Datum
    help: 'Selecteer een datum met de datumkiezer.'
    error:
      ERR_FIELD_DATE_INVALID: 'Datum is ongeldig voor testdoeleinden.'
  datetime:
    label: 'Datum & tijd'
    help: 'Selecteer een gecombineerde datum en tijd.'
    error:
      ERR_FIELD_DATETIME_INVALID: 'Datum & tijd is ongeldig voor testdoeleinden.'
  time:
    label: Tijd
    help: 'Selecteer een tijd van de dag.'
    error:
      ERR_FIELD_TIME_INVALID: 'Tijd is ongeldig voor testdoeleinden.'
  file:
    label: Bestand
    help: 'Upload een of meer bestanden van uw apparaat.'
    error:
      ERR_FIELD_FILE_INVALID: 'Bestand is ongeldig voor testdoeleinden.'
  email:
    label: E-mail
    placeholder: jij@example.com
    help: 'Voer een geldig e-mailadres in.'
    error:
      ERR_FIELD_EMAIL_INVALID: 'E-mail is ongeldig voor testdoeleinden.'
  number:
    label: Nummer
    help: 'Voer een numerieke waarde in.'
    error:
      ERR_FIELD_NUMBER_INVALID: 'Nummer is ongeldig voor testdoeleinden.'
  url:
    label: URL
    placeholder: 'https://'
    help: 'Voer een volledige URL in, inclusief het protocol.'
    error:
      ERR_FIELD_URL_INVALID: 'URL is ongeldig voor testdoeleinden.'
  switch:
    label: Schakelaar
    help: 'Schakel deze optie aan of uit.'
    error:
      ERR_FIELD_SWITCH_INVALID: 'Schakelaar is ongeldig voor testdoeleinden.'
  radio_choice:
    label: 'Radio keuze'
    help: 'Selecteer één optie uit de lijst.'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'Radio keuze is ongeldig voor testdoeleinden.'
    choice:
      option_a:
        label: 'Optie A'
      option_b:
        label: 'Optie B'
      option_c:
        label: 'Optie C'
action:
  button_demo: 'Doe niets'
  submit_default: Indienen
  submit_error: 'Toon fouten'
  submit_js: 'JS actie'
  submit_redirect: Doorsturen
  submit_embed_stay: 'Houd embed geopend'
  submit_embed_redirect: 'Doorsturen in embed'
error:
  ERR_FORM_TEST:
    message: 'Globale fout voor testdoeleinden.'
description: |
  Gebruik dit formulier om indieningsgedragingen te testen. Deze demo is beschikbaar in pagina-, ajax- en modalcontexten. Kies hieronder een gedrag en dien in:
toast:
  success:
    title: Succes
    message: 'Formulier succesvol ingediend.'
  js_action:
    title: 'JS actie'
    message: 'Wilt u het formulier opnieuw activeren?'
    reactivate: Heractiveren
    dismiss: Afwijzen
