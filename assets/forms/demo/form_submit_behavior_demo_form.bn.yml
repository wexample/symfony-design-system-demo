field:
  entity_search:
    label: ঘর
    placeholder: 'একটি ঘর খুঁজুন...'
    help: 'একটি রেকর্ড খুঁজে বের করে নির্বাচন করুন। ফর্মে যা আছে তা হল এর আইডি।'
  password:
    label: পাসওয়ার্ড
    help: 'প্রমাণীকরণের জন্য আপনার পাসওয়ার্ড প্রবেশ করুন।'
    error:
      ERR_FIELD_PASSWORD_INVALID: 'পাসওয়ার্ড পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  emoji:
    label: ইমোজি
    help: 'আপনার মেজাজ প্রকাশ করতে একটি ইমোজি বেছে নিন।'
    error:
      ERR_FIELD_EMOJI_INVALID: 'ইমোজি পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  text_simple:
    label: টেক্সট
    help: 'ছোট বিষয়বস্তুর জন্য একটি একক লাইনের টেক্সট ইনপুট।'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 'টেক্সট পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  text_area:
    label: 'দীর্ঘ টেক্সট'
    placeholder: 'আপনি যা চান লিখুন...'
    help: 'দীর্ঘ বিষয়বস্তুর জন্য একটি বহু-লাইন টেক্সট এরিয়া।'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'দীর্ঘ টেক্সট পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  behavior:
    label: আচরণ
    help: 'জমা দেওয়ার পর ফর্মটি কিভাবে প্রতিক্রিয়া জানাবে তা নির্বাচন করুন।'
    error:
      ERR_FIELD_BEHAVIOR_INVALID: 'আচরণ নির্বাচন পরীক্ষার উদ্দেশ্যে অকার্যকর।'
    choice:
      error:
        label: 'ত্রুটি দেখান'
        description: 'অন্তর্ভুক্তি বন্ধ করে (অথবা পৃষ্ঠায় কিছুই করে না)।'
      js:
        label: 'JS অ্যাকশন (টোস্ট)'
        description: 'প্রমাণীকরণ ত্রুটিগুলি ফেরত দেয়।'
      redirect:
        label: 'পুনঃনির্দেশিত করুন'
        description: 'জমা না দিয়ে একটি টোস্ট চালু করে।'
      default:
        label: ডিফল্ট
        description: 'সম্পূর্ণ পৃষ্ঠায় নেভিগেট করে, অথবা মডাল বন্ধ করে।'
      embed_stay:
        label: 'অন্তর্ভুক্তি খোলা রাখুন (মডাল / প্যানেল)'
        description: 'মডাল/প্যানেলে খোলা থাকে।'
      embed_redirect:
        label: 'অন্তর্ভুক্তিতে পুনঃনির্দেশিত করুন (মডাল / প্যানেল)'
        description: 'মডাল/প্যানেলের ভিতরে নেভিগেট করে।'
  date:
    label: তারিখ
    help: 'তারিখ পিকার ব্যবহার করে একটি তারিখ নির্বাচন করুন।'
    error:
      ERR_FIELD_DATE_INVALID: 'তারিখ পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  datetime:
    label: 'তারিখ ও সময়'
    help: 'একত্রিত তারিখ এবং সময় নির্বাচন করুন।'
    error:
      ERR_FIELD_DATETIME_INVALID: 'তারিখ ও সময় পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  time:
    label: সময়
    help: 'একদিনের সময় নির্বাচন করুন।'
    error:
      ERR_FIELD_TIME_INVALID: 'সময় পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  file:
    label: ফাইল
    help: 'আপনার ডিভাইস থেকে এক বা একাধিক ফাইল আপলোড করুন।'
    error:
      ERR_FIELD_FILE_INVALID: 'ফাইল পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  email:
    label: ইমেইল
    placeholder: you@example.com
    help: 'একটি বৈধ ইমেইল ঠিকানা প্রবেশ করুন।'
    error:
      ERR_FIELD_EMAIL_INVALID: 'ইমেইল পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  number:
    label: সংখ্যা
    help: 'একটি সংখ্যামূলক মান প্রবেশ করুন।'
    error:
      ERR_FIELD_NUMBER_INVALID: 'সংখ্যা পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  url:
    label: URL
    placeholder: 'https://'
    help: 'প্রোটোকলসহ সম্পূর্ণ URL প্রবেশ করুন।'
    error:
      ERR_FIELD_URL_INVALID: 'URL পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  switch:
    label: সুইচ
    help: 'এই বিকল্পটি চালু বা বন্ধ করুন।'
    error:
      ERR_FIELD_SWITCH_INVALID: 'সুইচ পরীক্ষার উদ্দেশ্যে অকার্যকর।'
  radio_choice:
    label: 'রেডিও নির্বাচন'
    help: 'তালিকা থেকে একটি বিকল্প নির্বাচন করুন।'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'রেডিও নির্বাচন পরীক্ষার উদ্দেশ্যে অকার্যকর।'
    choice:
      option_a:
        label: 'অপশন A'
      option_b:
        label: 'অপশন B'
      option_c:
        label: 'অপশন C'
action:
  button_demo: 'কিছুই করবেন না'
  submit_default: 'জমা দিন'
  submit_error: 'ত্রুটি দেখান'
  submit_js: 'JS অ্যাকশন'
  submit_redirect: 'পুনঃনির্দেশিত করুন'
  submit_embed_stay: 'অন্তর্ভুক্তি খোলা রাখুন'
  submit_embed_redirect: 'অন্তর্ভুক্তিতে পুনঃনির্দেশিত করুন'
error:
  ERR_FORM_TEST:
    message: 'পরীক্ষার উদ্দেশ্যে গ্লোবাল ত্রুটি।'
description: |
  জমা দেওয়ার আচরণ পরীক্ষার জন্য এই ফর্মটি ব্যবহার করুন। এই ডেমো পৃষ্ঠায়, AJAX, এবং মডাল প্রসঙ্গে উপলব্ধ। নীচে একটি আচরণ বেছে নিন এবং জমা দিন:
toast:
  success:
    title: সাফল্য
    message: 'ফর্ম সফলভাবে জমা দেওয়া হয়েছে।'
  js_action:
    title: 'JS অ্যাকশন'
    message: 'আপনি কি ফর্মটি পুনরায় সক্রিয় করতে চান?'
    reactivate: 'পুনরায় সক্রিয় করুন'
    dismiss: 'অগ্রাহ্য করুন'
