field:
  entity_search:
    label: 房间
    placeholder: 搜索房间...
    help: 通过搜索记录来选择一条记录。表单携带的是其ID。
  password:
    label: 密码
    help: 输入您的密码以进行身份验证。
    error:
      ERR_FIELD_PASSWORD_INVALID: 密码无效，仅用于测试。
  emoji:
    label: 表情符号
    help: 选择一个表情符号来表示您的心情。
    error:
      ERR_FIELD_EMOJI_INVALID: 表情符号无效，仅用于测试。
  text_simple:
    label: 文本
    help: 单行文本输入，用于短内容。
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 文本无效，仅用于测试。
  text_area:
    label: 长文本
    placeholder: 输入您想要的内容...
    help: 用于更长内容的多行文本区域。
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 长文本无效，仅用于测试。
  behavior:
    label: 行为
    help: 选择表单提交后的反应方式。
    error:
      ERR_FIELD_BEHAVIOR_INVALID: 行为选择无效，仅用于测试。
    choice:
      error:
        label: 显示错误
        description: 关闭嵌入（或在页面内不执行任何操作）。
      js:
        label: JS操作（吐司）
        description: 返回验证错误。
      redirect:
        label: 重定向
        description: 触发吐司而不提交。
      default:
        label: 默认
        description: 导航到完整页面，或关闭模态框。
      embed_stay:
        label: 保持嵌入打开（模态框/面板）
        description: 在模态框/面板中保持打开。
      embed_redirect:
        label: 在嵌入中重定向（模态框/面板）
        description: 在模态框/面板内导航。
  date:
    label: 日期
    help: 使用日期选择器选择日期。
    error:
      ERR_FIELD_DATE_INVALID: 日期无效，仅用于测试。
  datetime:
    label: 日期和时间
    help: 选择一个结合的日期和时间。
    error:
      ERR_FIELD_DATETIME_INVALID: 日期和时间无效，仅用于测试。
  time:
    label: 时间
    help: 选择一天中的时间。
    error:
      ERR_FIELD_TIME_INVALID: 时间无效，仅用于测试。
  file:
    label: 文件
    help: 从您的设备上传一个或多个文件。
    error:
      ERR_FIELD_FILE_INVALID: 文件无效，仅用于测试。
  email:
    label: 电子邮件
    placeholder: you@example.com
    help: 输入有效的电子邮件地址。
    error:
      ERR_FIELD_EMAIL_INVALID: 电子邮件无效，仅用于测试。
  number:
    label: 数字
    help: 输入数值。
    error:
      ERR_FIELD_NUMBER_INVALID: 数字无效，仅用于测试。
  url:
    label: 网址
    placeholder: 'https://'
    help: 输入包括协议的完整网址。
    error:
      ERR_FIELD_URL_INVALID: 网址无效，仅用于测试。
  switch:
    label: 开关
    help: 切换此选项开或关。
    error:
      ERR_FIELD_SWITCH_INVALID: 开关无效，仅用于测试。
  radio_choice:
    label: 单选
    help: 从列表中选择一个选项。
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 单选无效，仅用于测试。
    choice:
      option_a:
        label: 选项A
      option_b:
        label: 选项B
      option_c:
        label: 选项C
action:
  button_demo: 什么也不做
  submit_default: 提交
  submit_error: 显示错误
  submit_js: JS操作
  submit_redirect: 重定向
  submit_embed_stay: 保持嵌入打开
  submit_embed_redirect: 在嵌入中重定向
error:
  ERR_FORM_TEST:
    message: 用于测试的全局错误。
description: |
  使用此表单测试提交行为。此演示可在页面、ajax和模态上下文中使用。选择下面的行为并提交：
toast:
  success:
    title: 成功
    message: 表单提交成功。
  js_action:
    title: JS操作
    message: 您想重新激活表单吗？
    reactivate: 重新激活
    dismiss: 关闭
