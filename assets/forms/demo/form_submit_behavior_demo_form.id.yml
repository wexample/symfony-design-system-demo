field:
  entity_search:
    label: Ruang
    placeholder: 'Cari sebuah ruang...'
    help: 'Pilih sebuah catatan dengan mencarinya. Yang dibawa formulir adalah id-nya.'
  password:
    label: 'Kata Sandi'
    help: 'Masukkan kata sandi Anda untuk autentikasi.'
    error:
      ERR_FIELD_PASSWORD_INVALID: 'Kata sandi tidak valid untuk tujuan percobaan.'
  emoji:
    label: Emoji
    help: 'Pilih emoji untuk mewakili suasana hati Anda.'
    error:
      ERR_FIELD_EMOJI_INVALID: 'Emoji tidak valid untuk tujuan percobaan.'
  text_simple:
    label: Teks
    help: 'Input teks satu baris untuk konten singkat.'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 'Teks tidak valid untuk tujuan percobaan.'
  text_area:
    label: 'Teks panjang'
    placeholder: 'Ketik apa saja yang Anda mau...'
    help: 'Area teks multi-baris untuk konten yang lebih panjang.'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'Teks panjang tidak valid untuk tujuan percobaan.'
  behavior:
    label: Perilaku
    help: 'Pilih bagaimana formulir bereaksi setelah pengiriman.'
    error:
      ERR_FIELD_BEHAVIOR_INVALID: 'Pemilihan perilaku tidak valid untuk tujuan percobaan.'
    choice:
      error:
        label: 'Tampilkan kesalahan'
        description: 'menutup embed (atau tidak melakukan apa-apa di halaman).'
      js:
        label: 'Aksi JS (toast)'
        description: 'mengembalikan kesalahan validasi.'
      redirect:
        label: Pengalihan
        description: 'memicu toast tanpa mengirim.'
      default:
        label: Bawaan
        description: 'navigasi ke halaman penuh, atau menutup modal.'
      embed_stay:
        label: 'Tetap buka embed (modal / panel)'
        description: 'tetap terbuka di modal/panel.'
      embed_redirect:
        label: 'Pengalihan di embed (modal / panel)'
        description: 'navigasi di dalam modal/panel.'
  date:
    label: Tanggal
    help: 'Pilih tanggal menggunakan pemilih tanggal.'
    error:
      ERR_FIELD_DATE_INVALID: 'Tanggal tidak valid untuk tujuan percobaan.'
  datetime:
    label: 'Tanggal & waktu'
    help: 'Pilih tanggal dan waktu gabungan.'
    error:
      ERR_FIELD_DATETIME_INVALID: 'Tanggal & waktu tidak valid untuk tujuan percobaan.'
  time:
    label: Waktu
    help: 'Pilih waktu dalam sehari.'
    error:
      ERR_FIELD_TIME_INVALID: 'Waktu tidak valid untuk tujuan percobaan.'
  file:
    label: Berkas
    help: 'Unggah satu atau lebih berkas dari perangkat Anda.'
    error:
      ERR_FIELD_FILE_INVALID: 'Berkas tidak valid untuk tujuan percobaan.'
  email:
    label: Email
    placeholder: anda@contoh.com
    help: 'Masukkan alamat email yang valid.'
    error:
      ERR_FIELD_EMAIL_INVALID: 'Email tidak valid untuk tujuan percobaan.'
  number:
    label: Nomor
    help: 'Masukkan nilai numerik.'
    error:
      ERR_FIELD_NUMBER_INVALID: 'Nomor tidak valid untuk tujuan percobaan.'
  url:
    label: URL
    placeholder: 'https://'
    help: 'Masukkan URL lengkap termasuk protokol.'
    error:
      ERR_FIELD_URL_INVALID: 'URL tidak valid untuk tujuan percobaan.'
  switch:
    label: 'Tombol Ganti'
    help: 'Aktifkan atau nonaktifkan opsi ini.'
    error:
      ERR_FIELD_SWITCH_INVALID: 'Tombol ganti tidak valid untuk tujuan percobaan.'
  radio_choice:
    label: 'Pilihan Radio'
    help: 'Pilih satu opsi dari daftar.'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'Pilihan radio tidak valid untuk tujuan percobaan.'
    choice:
      option_a:
        label: 'Opsi A'
      option_b:
        label: 'Opsi B'
      option_c:
        label: 'Opsi C'
action:
  button_demo: 'Tidak melakukan apa-apa'
  submit_default: Kirim
  submit_error: 'Tampilkan kesalahan'
  submit_js: 'Aksi JS'
  submit_redirect: Pengalihan
  submit_embed_stay: 'Tetap buka embed'
  submit_embed_redirect: 'Pengalihan di embed'
error:
  ERR_FORM_TEST:
    message: 'Kesalahan global untuk tujuan percobaan.'
description: |
  Gunakan formulir ini untuk menguji perilaku pengiriman. Demo ini tersedia dalam konteks halaman, ajax, dan modal. Pilih perilaku di bawah ini dan kirim:
toast:
  success:
    title: Sukses
    message: 'Formulir berhasil disubmit.'
  js_action:
    title: 'Aksi JS'
    message: 'Apakah Anda ingin mengaktifkan kembali formulir?'
    reactivate: 'Aktifkan kembali'
    dismiss: Tutup
