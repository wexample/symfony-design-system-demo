field:
  entity_search:
    label: 部屋
    placeholder: 部屋を検索...
    help: 検索してレコードを選択します。フォームが持つのはそのIDです。
  password:
    label: パスワード
    help: 認証するためにパスワードを入力してください。
    error:
      ERR_FIELD_PASSWORD_INVALID: テスト目的のため、パスワードが無効です。
  emoji:
    label: 絵文字
    help: 気分を表す絵文字を選んでください。
    error:
      ERR_FIELD_EMOJI_INVALID: テスト目的のため、絵文字が無効です。
  text_simple:
    label: テキスト
    help: 短い内容のための1行テキスト入力です。
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: テスト目的のため、テキストが無効です。
  text_area:
    label: 長文
    placeholder: 好きなことを入力してください...
    help: 長い内容のための複数行テキストエリアです。
    error:
      ERR_FIELD_TEXT_AREA_INVALID: テスト目的のため、長文が無効です。
  behavior:
    label: 動作
    help: 送信後のフォームの反応を選択してください。
    error:
      ERR_FIELD_BEHAVIOR_INVALID: 動作の選択が無効です。
    choice:
      error:
        label: エラーを表示
        description: 埋め込みを閉じる（またはページ内で何もしない）。
      js:
        label: JSアクション（トースト）
        description: 検証エラーを返します。
      redirect:
        label: リダイレクト
        description: 送信せずにトーストを表示します。
      default:
        label: デフォルト
        description: フルページに移動するか、モーダルを閉じます。
      embed_stay:
        label: 埋め込みを維持（モーダル／パネル）
        description: モーダル／パネルで開いたままにします。
      embed_redirect:
        label: 埋め込みでリダイレクト（モーダル／パネル）
        description: モーダル／パネル内を移動します。
  date:
    label: 日付
    help: 日付ピッカーを使って日付を選択します。
    error:
      ERR_FIELD_DATE_INVALID: テスト目的のため、日付が無効です。
  datetime:
    label: 日付と時刻
    help: 日付と時刻を組み合わせて選択します。
    error:
      ERR_FIELD_DATETIME_INVALID: テスト目的のため、日付と時刻が無効です。
  time:
    label: 時間
    help: 1日の時間を選択します。
    error:
      ERR_FIELD_TIME_INVALID: テスト目的のため、時間が無効です。
  file:
    label: ファイル
    help: デバイスから1つ以上のファイルをアップロードします。
    error:
      ERR_FIELD_FILE_INVALID: テスト目的のため、ファイルが無効です。
  email:
    label: メール
    placeholder: you@example.com
    help: 有効なメールアドレスを入力してください。
    error:
      ERR_FIELD_EMAIL_INVALID: テスト目的のため、メールが無効です。
  number:
    label: 数値
    help: 数値を入力してください。
    error:
      ERR_FIELD_NUMBER_INVALID: テスト目的のため、数値が無効です。
  url:
    label: URL
    placeholder: 'https://'
    help: プロトコルを含む完全なURLを入力してください。
    error:
      ERR_FIELD_URL_INVALID: テスト目的のため、URLが無効です。
  switch:
    label: スイッチ
    help: このオプションをオンまたはオフに切り替えます。
    error:
      ERR_FIELD_SWITCH_INVALID: テスト目的のため、スイッチが無効です。
  radio_choice:
    label: ラジオ選択
    help: リストから1つのオプションを選択します。
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: テスト目的のため、ラジオ選択が無効です。
    choice:
      option_a:
        label: オプションA
      option_b:
        label: オプションB
      option_c:
        label: オプションC
action:
  button_demo: 何もしない
  submit_default: 送信
  submit_error: エラーを表示
  submit_js: JSアクション
  submit_redirect: リダイレクト
  submit_embed_stay: 埋め込みを維持
  submit_embed_redirect: 埋め込みでリダイレクト
error:
  ERR_FORM_TEST:
    message: テスト目的のためのグローバルエラー。
description: |
  このフォームを使って送信動作をテストします。このデモはページ、ajax、およびモーダルコンテキストで利用可能です。以下の動作を選択して送信してください：
toast:
  success:
    title: 成功
    message: フォームが正常に送信されました。
  js_action:
    title: JSアクション
    message: フォームを再度アクティブにしますか？
    reactivate: 再アクティブ化
    dismiss: 閉じる
