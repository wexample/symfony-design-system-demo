field:
  entity_search:
    label: 방
    placeholder: '방 검색...'
    help: '레코드를 검색하여 선택합니다. 폼이 가지고 있는 것은 ID입니다.'
  password:
    label: 비밀번호
    help: '인증을 위해 비밀번호를 입력하세요.'
    error:
      ERR_FIELD_PASSWORD_INVALID: '테스트 용도로 비밀번호가 유효하지 않습니다.'
  emoji:
    label: 이모지
    help: '당신의 기분을 나타낼 이모지를 선택하세요.'
    error:
      ERR_FIELD_EMOJI_INVALID: '테스트 용도로 이모지가 유효하지 않습니다.'
  text_simple:
    label: 텍스트
    help: '짧은 내용을 위한 한 줄 텍스트 입력입니다.'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: '테스트 용도로 텍스트가 유효하지 않습니다.'
  text_area:
    label: '긴 텍스트'
    placeholder: '원하는 내용을 입력하세요...'
    help: '긴 내용을 위한 여러 줄 텍스트 영역입니다.'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: '테스트 용도로 긴 텍스트가 유효하지 않습니다.'
  behavior:
    label: 동작
    help: '제출 후 폼이 어떻게 반응할지 선택하세요.'
    error:
      ERR_FIELD_BEHAVIOR_INVALID: '동작 선택이 테스트 용도로 유효하지 않습니다.'
    choice:
      error:
        label: '오류 표시'
        description: '임베드를 닫거나 페이지 내에서 아무 것도 하지 않습니다.'
      js:
        label: 'JS 동작 (토스트)'
        description: '유효성 검사 오류를 반환합니다.'
      redirect:
        label: 리다이렉트
        description: '제출 없이 토스트를 발동합니다.'
      default:
        label: 기본
        description: '전체 페이지로 이동하거나 모달을 닫습니다.'
      embed_stay:
        label: '임베드 열기 유지 (모달 / 패널)'
        description: '모달/패널에서 열려 있습니다.'
      embed_redirect:
        label: '임베드에서 리다이렉트 (모달 / 패널)'
        description: '모달/패널 내부로 이동합니다.'
  date:
    label: 날짜
    help: '날짜 선택기를 사용하여 날짜를 선택하세요.'
    error:
      ERR_FIELD_DATE_INVALID: '테스트 용도로 날짜가 유효하지 않습니다.'
  datetime:
    label: '날짜 및 시간'
    help: '날짜와 시간을 함께 선택하세요.'
    error:
      ERR_FIELD_DATETIME_INVALID: '테스트 용도로 날짜 및 시간이 유효하지 않습니다.'
  time:
    label: 시간
    help: '하루의 시간을 선택하세요.'
    error:
      ERR_FIELD_TIME_INVALID: '테스트 용도로 시간이 유효하지 않습니다.'
  file:
    label: 파일
    help: '장치에서 하나 이상의 파일을 업로드하세요.'
    error:
      ERR_FIELD_FILE_INVALID: '테스트 용도로 파일이 유효하지 않습니다.'
  email:
    label: 이메일
    placeholder: you@example.com
    help: '유효한 이메일 주소를 입력하세요.'
    error:
      ERR_FIELD_EMAIL_INVALID: '테스트 용도로 이메일이 유효하지 않습니다.'
  number:
    label: 숫자
    help: '숫자 값을 입력하세요.'
    error:
      ERR_FIELD_NUMBER_INVALID: '테스트 용도로 숫자가 유효하지 않습니다.'
  url:
    label: URL
    placeholder: 'https://'
    help: '프로토콜을 포함하여 전체 URL을 입력하세요.'
    error:
      ERR_FIELD_URL_INVALID: '테스트 용도로 URL이 유효하지 않습니다.'
  switch:
    label: 스위치
    help: '이 옵션을 켜거나 끕니다.'
    error:
      ERR_FIELD_SWITCH_INVALID: '테스트 용도로 스위치가 유효하지 않습니다.'
  radio_choice:
    label: '라디오 선택'
    help: '목록에서 한 가지 옵션을 선택하세요.'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: '테스트 용도로 라디오 선택이 유효하지 않습니다.'
    choice:
      option_a:
        label: '옵션 A'
      option_b:
        label: '옵션 B'
      option_c:
        label: '옵션 C'
action:
  button_demo: '아무것도 하지 않음'
  submit_default: 제출
  submit_error: '오류 표시'
  submit_js: 'JS 동작'
  submit_redirect: 리다이렉트
  submit_embed_stay: '임베드 열기 유지'
  submit_embed_redirect: '임베드에서 리다이렉트'
error:
  ERR_FORM_TEST:
    message: '테스트 용도로 전역 오류입니다.'
description: |
  이 폼을 사용하여 제출 동작을 테스트하세요. 이 데모는 페이지, AJAX 및 모달 컨텍스트에서 사용할 수 있습니다. 아래에서 동작을 선택하고 제출하세요:
toast:
  success:
    title: 성공
    message: '폼이 성공적으로 제출되었습니다.'
  js_action:
    title: 'JS 동작'
    message: '폼을 재활성화하시겠습니까?'
    reactivate: 재활성화
    dismiss: 닫기
