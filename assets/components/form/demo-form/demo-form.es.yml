      ERR_FIELD_RADIO_CHOICE_INVALID: 'La opción de radio no es válida para fines de prueba.'
    choice:
      option_a:
        label: 'Opción A'
      option_b:
        label: 'Opción B'
      option_c:
        label: 'Opción C'
