field:
  password:
    label: Hasło
    help: 'Wprowadź swoje hasło, aby się uwierzytelnić.'
    error:
      ERR_FIELD_PASSWORD_INVALID: 'Hasło jest nieprawidłowe w celach testowych.'
  emoji:
    label: Emoji
    help: 'Wybierz emoji, które odzwierciedla twój nastrój.'
    error:
      ERR_FIELD_EMOJI_INVALID: 'Emoji jest nieprawidłowe w celach testowych.'
  text_simple:
    label: Tekst
    help: 'Jedna linia tekstu dla krótkiej treści.'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 'Tekst jest nieprawidłowy w celach testowych.'
  text_area:
    label: 'Długi tekst'
    placeholder: 'Wpisz, co chcesz...'
    help: 'Wieloliniowe pole tekstowe dla dłuższej treści.'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'Długi tekst jest nieprawidłowy w celach testowych.'
  number:
    label: Liczba
    help: 'Wprowadź wartość numeryczną.'
    error:
      ERR_FIELD_NUMBER_INVALID: 'Liczba jest nieprawidłowa w celach testowych.'
  email:
    label: Email
    placeholder: you@example.com
    help: 'Wprowadź prawidłowy adres email.'
    error:
      ERR_FIELD_EMAIL_INVALID: 'Email jest nieprawidłowy w celach testowych.'
  url:
    label: URL
    placeholder: 'https://'
    help: 'Wprowadź pełny adres URL, w tym protokół.'
    error:
      ERR_FIELD_URL_INVALID: 'URL jest nieprawidłowy w celach testowych.'
  date:
    label: Data
    help: 'Wybierz datę za pomocą selektora daty.'
    error:
      ERR_FIELD_DATE_INVALID: 'Data jest nieprawidłowa w celach testowych.'
  datetime:
    label: 'Data i czas'
    help: 'Wybierz połączoną datę i czas.'
    error:
      ERR_FIELD_DATETIME_INVALID: 'Data i czas są nieprawidłowe w celach testowych.'
  time:
    label: Czas
    help: 'Wybierz porę dnia.'
    error:
      ERR_FIELD_TIME_INVALID: 'Czas jest nieprawidłowy w celach testowych.'
  file:
    label: Plik
    help: 'Prześlij jeden lub więcej plików z urządzenia.'
    error:
      ERR_FIELD_FILE_INVALID: 'Plik jest nieprawidłowy w celach testowych.'
  radio_choice:
    label: 'Wybór radiowy'
    help: 'Wybierz jedną opcję z listy.'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'Wybór radiowy jest nieprawidłowy w celach testowych.'
    choice:
      option_a:
        label: 'Opcja A'
      option_b:
        label: 'Opcja B'
      option_c:
        label: 'Opcja C'
  switch:
    label: Przełącznik
    help: 'Włącz lub wyłącz tę opcję.'
    error:
      ERR_FIELD_SWITCH_INVALID: 'Przełącznik jest nieprawidłowy w celach testowych.'
form:
  error:
    ERR_FORM_TEST: 'Błąd globalny w celach testowych.'
action:
  button_demo: 'Nie rób nic'
  submit_default: Wyślij
  submit_error: 'Pokaż błędy'
  submit_js: 'Akcja JS'
  submit_redirect: Przekieruj
toast:
  success:
    title: Sukces
    message: 'Formularz został pomyślnie wysłany.'
  js_action:
    title: 'Akcja JS'
    message: 'Czy chcesz ponownie aktywować formularz?'
    reactivate: Reaktywuj
    dismiss: Odrzuć
description: |
  Użyj tego formularza, aby przetestować zachowania przy wysyłaniu. Ten demonstracyjny przykład jest w komponencie Vue.
