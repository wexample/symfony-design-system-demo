field:
  password:
    label: סיסמא
    help: 'הזן את הסיסמא שלך לאימות.'
    error:
      ERR_FIELD_PASSWORD_INVALID: 'הסיסמא אינה תקינה למטרות בדיקה.'
  emoji:
    label: "אימוג'י"
    help: "בחר אימוג'י שיבטא את מצב הרוח שלך."
    error:
      ERR_FIELD_EMOJI_INVALID: "האימוג'י אינו תקין למטרות בדיקה."
  text_simple:
    label: טקסט
    help: 'שדה טקסט בשורה אחת לתוכן קצר.'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 'הטקסט אינו תקין למטרות בדיקה.'
  text_area:
    label: 'טקסט ארוך'
    placeholder: 'כתוב מה שבא לך...'
    help: 'שדה טקסט מרובה שורות לתוכן ארוך יותר.'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'הטקסט הארוך אינו תקין למטרות בדיקה.'
  number:
    label: מספר
    help: 'הזן ערך מספרי.'
    error:
      ERR_FIELD_NUMBER_INVALID: 'המספר אינו תקין למטרות בדיקה.'
  email:
    label: אימייל
    placeholder: you@example.com
    help: 'הזן כתובת אימייל תקינה.'
    error:
      ERR_FIELD_EMAIL_INVALID: 'האימייל אינו תקין למטרות בדיקה.'
  url:
    label: 'כתובת URL'
    placeholder: 'https://'
    help: 'הזן כתובת URL מלאה כולל הפרוטוקול.'
    error:
      ERR_FIELD_URL_INVALID: 'כתובת ה-URL אינה תקינה למטרות בדיקה.'
  date:
    label: תאריך
    help: 'בחר תאריך באמצעות בורר התאריך.'
    error:
      ERR_FIELD_DATE_INVALID: 'התאריך אינו תקין למטרות בדיקה.'
  datetime:
    label: 'תאריך ושעה'
    help: 'בחר תאריך ושעה משולבים.'
    error:
      ERR_FIELD_DATETIME_INVALID: 'התאריך והשעה אינם תקינים למטרות בדיקה.'
  time:
    label: שעה
    help: 'בחר שעת יום.'
    error:
      ERR_FIELD_TIME_INVALID: 'השעה אינה תקינה למטרות בדיקה.'
  file:
    label: קובץ
    help: 'העלה קובץ אחד או יותר מהמכשיר שלך.'
    error:
      ERR_FIELD_FILE_INVALID: 'הקובץ אינו תקין למטרות בדיקה.'
  radio_choice:
    label: 'בחירת רדיו'
    help: 'בחר אפשרות אחת מהרשימה.'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'בחירת הרדיו אינה תקינה למטרות בדיקה.'
    choice:
      option_a:
        label: "אפשרות א'"
      option_b:
        label: "אפשרות ב'"
      option_c:
        label: "אפשרות ג'"
  switch:
    label: מתג
    help: 'הפעל או כבה אפשרות זו.'
    error:
      ERR_FIELD_SWITCH_INVALID: 'המתג אינו תקין למטרות בדיקה.'
form:
  error:
    ERR_FORM_TEST: 'שגיאה גלובלית למטרות בדיקה.'
action:
  button_demo: 'לא לעשות כלום'
  submit_default: שלח
  submit_error: 'הצג שגיאות'
  submit_js: 'פעולה JS'
  submit_redirect: הפנה
toast:
  success:
    title: הצלחה
    message: 'הטופס נשלח בהצלחה.'
  js_action:
    title: 'פעולה JS'
    message: 'האם אתה רוצה להפעיל מחדש את הטופס?'
    reactivate: 'הפעל מחדש'
    dismiss: מחק
description: |
  השתמש בטופס זה כדי לבדוק התנהגויות שליחה. הדמו הזה נמצא בתוך רכיב Vue.
