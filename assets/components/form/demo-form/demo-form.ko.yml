field:
  password:
    label: 비밀번호
    help: '인증을 위해 비밀번호를 입력하세요.'
    error:
      ERR_FIELD_PASSWORD_INVALID: '비밀번호가 테스트 용도로 유효하지 않습니다.'
  emoji:
    label: 이모지
    help: '당신의 기분을 나타낼 이모지를 선택하세요.'
    error:
      ERR_FIELD_EMOJI_INVALID: '이모지가 테스트 용도로 유효하지 않습니다.'
  text_simple:
    label: 텍스트
    help: '짧은 내용을 위한 한 줄 텍스트 입력입니다.'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: '텍스트가 테스트 용도로 유효하지 않습니다.'
  text_area:
    label: '긴 텍스트'
    placeholder: '원하는 내용을 입력하세요...'
    help: '더 긴 내용을 위한 여러 줄 텍스트 영역입니다.'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: '긴 텍스트가 테스트 용도로 유효하지 않습니다.'
  number:
    label: 숫자
    help: '숫자 값을 입력하세요.'
    error:
      ERR_FIELD_NUMBER_INVALID: '숫자가 테스트 용도로 유효하지 않습니다.'
  email:
    label: 이메일
    placeholder: you@example.com
    help: '유효한 이메일 주소를 입력하세요.'
    error:
      ERR_FIELD_EMAIL_INVALID: '이메일이 테스트 용도로 유효하지 않습니다.'
  url:
    label: URL
    placeholder: 'https://'
    help: '프로토콜을 포함한 전체 URL을 입력하세요.'
    error:
      ERR_FIELD_URL_INVALID: 'URL이 테스트 용도로 유효하지 않습니다.'
  date:
    label: 날짜
    help: '날짜 선택기를 사용하여 날짜를 선택하세요.'
    error:
      ERR_FIELD_DATE_INVALID: '날짜가 테스트 용도로 유효하지 않습니다.'
  datetime:
    label: '날짜 및 시간'
    help: '날짜와 시간을 결합하여 선택하세요.'
    error:
      ERR_FIELD_DATETIME_INVALID: '날짜 및 시간이 테스트 용도로 유효하지 않습니다.'
  time:
    label: 시간
    help: '하루 중 시간을 선택하세요.'
    error:
      ERR_FIELD_TIME_INVALID: '시간이 테스트 용도로 유효하지 않습니다.'
  file:
    label: 파일
    help: '장치에서 하나 이상의 파일을 업로드하세요.'
    error:
      ERR_FIELD_FILE_INVALID: '파일이 테스트 용도로 유효하지 않습니다.'
  radio_choice:
    label: '라디오 선택'
    help: '목록에서 하나의 옵션을 선택하세요.'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: '라디오 선택이 테스트 용도로 유효하지 않습니다.'
    choice:
      option_a:
        label: '옵션 A'
      option_b:
        label: '옵션 B'
      option_c:
        label: '옵션 C'
  switch:
    label: 스위치
    help: '이 옵션을 켜거나 끄세요.'
    error:
      ERR_FIELD_SWITCH_INVALID: '스위치가 테스트 용도로 유효하지 않습니다.'
form:
  error:
    ERR_FORM_TEST: '테스트 용도의 전역 오류입니다.'
action:
  button_demo: '아무것도 하지 않음'
  submit_default: 제출
  submit_error: '오류 표시'
  submit_js: 'JS 작업'
  submit_redirect: 리다이렉트
toast:
  success:
    title: 성공
    message: '폼이 성공적으로 제출되었습니다.'
  js_action:
    title: 'JS 작업'
    message: '폼을 다시 활성화하시겠습니까?'
    reactivate: '다시 활성화'
    dismiss: 무시
description: |
  이 폼을 사용하여 제출 동작을 테스트하세요. 이 데모는 Vue 컴포넌트에 있습니다.
