      ERR_FIELD_PASSWORD_INVALID: 'परीक्षण के उद्देश्य के लिए पासवर्ड अमान्य है।'
  emoji:
    label: इमोजी
    help: 'अपने मूड का प्रतिनिधित्व करने के लिए एक इमोजी चुनें।'
