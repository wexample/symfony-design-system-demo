      ERR_FIELD_TEXT_SIMPLE_INVALID: 'परीक्षण के उद्देश्य के लिए पाठ अमान्य है।'
  text_area:
    label: 'लंबा पाठ'
    placeholder: 'आप जो चाहें टाइप करें...'
    help: 'लंबी सामग्री के लिए एक मल्टी-लाइन टेक्स्ट क्षेत्र।'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'लंबा पाठ परीक्षण के उद्देश्य के लिए अमान्य है।'
  number:
    label: संख्या
    help: 'एक संख्यात्मक मान दर्ज करें।'
    error:
      ERR_FIELD_NUMBER_INVALID: 'संख्या परीक्षण के उद्देश्य के लिए अमान्य है।'
  email:
    label: ईमेल
    placeholder: you@example.com
    help: 'एक मान्य ईमेल पता दर्ज करें।'
    error:
      ERR_FIELD_EMAIL_INVALID: 'ईमेल परीक्षण के उद्देश्य के लिए अमान्य है।'
  url:
    label: URL
    placeholder: 'https://'
    help: 'प्रोटोकॉल सहित पूरा URL दर्ज करें।'
    error:
      ERR_FIELD_URL_INVALID: 'URL परीक्षण के उद्देश्य के लिए अमान्य है।'
  date:
    label: तारीख
    help: 'तारीख चुनने के लिए तारीख चयनकर्ता का उपयोग करें।'
    error:
      ERR_FIELD_DATE_INVALID: 'तारीख परीक्षण के उद्देश्य के लिए अमान्य है।'
  datetime:
    label: 'तारीख और समय'
    help: 'संयुक्त तारीख और समय चुनें।'
    error:
      ERR_FIELD_DATETIME_INVALID: 'तारीख और समय परीक्षण के उद्देश्य के लिए अमान्य है।'
  time:
    label: समय
    help: 'दिन के समय का चयन करें।'
    error:
      ERR_FIELD_TIME_INVALID: 'समय परीक्षण के उद्देश्य के लिए अमान्य है।'
  file:
    label: फाइल
    help: 'अपने डिवाइस से एक या अधिक फाइलें अपलोड करें।'
    error:
      ERR_FIELD_FILE_INVALID: 'फाइल परीक्षण के उद्देश्य के लिए अमान्य है।'
  radio_choice:
    label: 'रेडियो विकल्प'
    help: 'सूची में से एक विकल्प चुनें।'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'रेडियो विकल्प परीक्षण के उद्देश्य के लिए अमान्य है।'
    choice:
      option_a:
        label: 'विकल्प ए'
      option_b:
        label: 'विकल्प बी'
      option_c:
        label: 'विकल्प सी'
  switch:
    label: स्विच
    help: 'इस विकल्प को चालू या बंद करें।'
    error:
      ERR_FIELD_SWITCH_INVALID: 'स्विच परीक्षण के उद्देश्य के लिए अमान्य है।'
form:
  error:
    ERR_FORM_TEST: 'परीक्षण के उद्देश्य के लिए वैश्विक त्रुटि।'
