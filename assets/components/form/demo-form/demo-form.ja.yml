field:
  password:
    label: パスワード
    help: 認証のためにパスワードを入力してください。
    error:
      ERR_FIELD_PASSWORD_INVALID: パスワードはテスト用に無効です。
  emoji:
    label: 絵文字
    help: あなたの気分を表す絵文字を選んでください。
    error:
      ERR_FIELD_EMOJI_INVALID: 絵文字はテスト用に無効です。
  text_simple:
    label: テキスト
    help: 短い内容のための1行テキスト入力。
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: テキストはテスト用に無効です。
  text_area:
    label: 長文
    placeholder: 好きなことを入力してください...
    help: 長い内容のための複数行テキストエリア。
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 長文はテスト用に無効です。
  number:
    label: 数値
    help: 数値を入力してください。
    error:
      ERR_FIELD_NUMBER_INVALID: 数値はテスト用に無効です。
  email:
    label: メールアドレス
    placeholder: you@example.com
    help: 有効なメールアドレスを入力してください。
    error:
      ERR_FIELD_EMAIL_INVALID: メールアドレスはテスト用に無効です。
  url:
    label: URL
    placeholder: 'https://'
    help: プロトコルを含む完全なURLを入力してください。
    error:
      ERR_FIELD_URL_INVALID: URLはテスト用に無効です。
  date:
    label: 日付
    help: 日付ピッカーを使って日付を選択してください。
    error:
      ERR_FIELD_DATE_INVALID: 日付はテスト用に無効です。
  datetime:
    label: 日付と時刻
    help: 日付と時刻を組み合わせて選択してください。
    error:
      ERR_FIELD_DATETIME_INVALID: 日付と時刻はテスト用に無効です。
  time:
    label: 時刻
    help: 1日の時刻を選択してください。
    error:
      ERR_FIELD_TIME_INVALID: 時刻はテスト用に無効です。
  file:
    label: ファイル
    help: デバイスから1つまたは複数のファイルをアップロードしてください。
    error:
      ERR_FIELD_FILE_INVALID: ファイルはテスト用に無効です。
  radio_choice:
    label: ラジオ選択
    help: リストから1つのオプションを選択してください。
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: ラジオ選択はテスト用に無効です。
    choice:
      option_a:
        label: オプションA
      option_b:
        label: オプションB
      option_c:
        label: オプションC
  switch:
    label: スイッチ
    help: このオプションをオンまたはオフに切り替えます。
    error:
      ERR_FIELD_SWITCH_INVALID: スイッチはテスト用に無効です。
form:
  error:
    ERR_FORM_TEST: テスト用のグローバルエラー。
action:
  button_demo: 何もしない
  submit_default: 送信
  submit_error: エラーを表示
  submit_js: JSアクション
  submit_redirect: リダイレクト
toast:
  success:
    title: 成功
    message: フォームが正常に送信されました。
  js_action:
    title: JSアクション
    message: フォームを再アクティブ化しますか？
    reactivate: 再アクティブ化
    dismiss: 閉じる
description: |
  このフォームを使用して送信動作をテストします。このデモはVueコンポーネント内にあります。
