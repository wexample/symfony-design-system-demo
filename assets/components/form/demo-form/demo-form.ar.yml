field:
  password:
    label: 'كلمة المرور'
    help: 'أدخل كلمة المرور الخاصة بك للمصادقة.'
    error:
      ERR_FIELD_PASSWORD_INVALID: 'كلمة المرور غير صالحة لغرض الاختبار.'
  emoji:
    label: 'رمز تعبيري'
    help: 'اختر رمزًا تعبيريًا لتمثيل مزاجك.'
    error:
      ERR_FIELD_EMOJI_INVALID: 'الرمز التعبيري غير صالح لغرض الاختبار.'
  text_simple:
    label: نص
    help: 'مدخل نصي لخط واحد للمحتوى القصير.'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 'النص غير صالح لغرض الاختبار.'
  text_area:
    label: 'نص طويل'
    placeholder: 'اكتب ما تريد ...'
    help: 'منطقة نص متعددة الأسطر للمحتوى الأطول.'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'النص الطويل غير صالح لغرض الاختبار.'
  number:
    label: رقم
    help: 'أدخل قيمة رقمية.'
    error:
      ERR_FIELD_NUMBER_INVALID: 'الرقم غير صالح لغرض الاختبار.'
  email:
    label: 'البريد الإلكتروني'
    placeholder: you@example.com
    help: 'أدخل عنوان بريد إلكتروني صالح.'
    error:
      ERR_FIELD_EMAIL_INVALID: 'البريد الإلكتروني غير صالح لغرض الاختبار.'
  url:
    label: رابط
    placeholder: 'https://'
    help: 'أدخل رابطًا كاملاً بما في ذلك البروتوكول.'
    error:
      ERR_FIELD_URL_INVALID: 'الرابط غير صالح لغرض الاختبار.'
  date:
    label: تاريخ
    help: 'اختر تاريخًا باستخدام أداة اختيار التاريخ.'
    error:
      ERR_FIELD_DATE_INVALID: 'التاريخ غير صالح لغرض الاختبار.'
  datetime:
    label: 'تاريخ ووقت'
    help: 'اختر تاريخًا ووقتًا معًا.'
    error:
      ERR_FIELD_DATETIME_INVALID: 'التاريخ والوقت غير صالح لغرض الاختبار.'
  time:
    label: وقت
    help: 'اختر وقتًا من اليوم.'
    error:
      ERR_FIELD_TIME_INVALID: 'الوقت غير صالح لغرض الاختبار.'
  file:
    label: ملف
    help: 'قم بتحميل ملف واحد أو أكثر من جهازك.'
    error:
      ERR_FIELD_FILE_INVALID: 'الملف غير صالح لغرض الاختبار.'
  radio_choice:
    label: 'اختيار إذاعي'
    help: 'اختر خيارًا واحدًا من القائمة.'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'الاختيار الإذاعي غير صالح لغرض الاختبار.'
    choice:
      option_a:
        label: 'الخيار A'
      option_b:
        label: 'الخيار B'
      option_c:
        label: 'الخيار C'
  switch:
    label: تبديل
    help: 'قم بتفعيل أو تعطيل هذا الخيار.'
    error:
      ERR_FIELD_SWITCH_INVALID: 'التبديل غير صالح لغرض الاختبار.'
form:
  error:
    ERR_FORM_TEST: 'خطأ عام لغرض الاختبار.'
action:
  button_demo: 'لا تفعل شيئًا'
  submit_default: إرسال
  submit_error: 'عرض الأخطاء'
  submit_js: 'إجراء JS'
  submit_redirect: 'إعادة توجيه'
toast:
  success:
    title: نجاح
    message: 'تم إرسال النموذج بنجاح.'
  js_action:
    title: 'إجراء JS'
    message: 'هل تريد إعادة تفعيل النموذج؟'
    reactivate: 'إعادة تفعيل'
    dismiss: رفض
description: |
  استخدم هذا النموذج لاختبار سلوكيات الإرسال. هذا العرض في مكون Vue.
