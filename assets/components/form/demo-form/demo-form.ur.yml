field:
  password:
    label: پاسورڈ
    help: 'اپنا پاسورڈ داخل کریں تاکہ تصدیق ہو سکے۔'
    error:
      ERR_FIELD_PASSWORD_INVALID: 'پاسورڈ ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
  emoji:
    label: ایموجی
    help: 'اپنی کیفیت کی نمائندگی کرنے کے لیے ایک ایموجی منتخب کریں۔'
    error:
      ERR_FIELD_EMOJI_INVALID: 'ایموجی ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
  text_simple:
    label: متن
    help: 'مختصر مواد کے لیے ایک لائن کا متن داخل کریں۔'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 'متن ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
  text_area:
    label: 'طویل متن'
    placeholder: 'جو چاہیں ٹائپ کریں...'
    help: 'طویل مواد کے لیے ایک متعدد لائنوں کا متن کا علاقہ۔'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'طویل متن ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
  number:
    label: نمبر
    help: 'ایک عددی قیمت داخل کریں۔'
    error:
      ERR_FIELD_NUMBER_INVALID: 'نمبر ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
  email:
    label: 'ای میل'
    placeholder: you@example.com
    help: 'ایک درست ای میل ایڈریس داخل کریں۔'
    error:
      ERR_FIELD_EMAIL_INVALID: 'ای میل ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
  url:
    label: 'یو آر ایل'
    placeholder: 'https://'
    help: 'پروٹوکول سمیت مکمل یو آر ایل داخل کریں۔'
    error:
      ERR_FIELD_URL_INVALID: 'یو آر ایل ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
  date:
    label: تاریخ
    help: 'تاریخ منتخب کرنے کے لیے تاریخ چننے والے کا استعمال کریں۔'
    error:
      ERR_FIELD_DATE_INVALID: 'تاریخ ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
  datetime:
    label: 'تاریخ اور وقت'
    help: 'تاریخ اور وقت کا مجموعہ منتخب کریں۔'
    error:
      ERR_FIELD_DATETIME_INVALID: 'تاریخ اور وقت ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
  time:
    label: وقت
    help: 'دن کا ایک وقت منتخب کریں۔'
    error:
      ERR_FIELD_TIME_INVALID: 'وقت ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
  file:
    label: فائل
    help: 'اپنی ڈیوائس سے ایک یا زیادہ فائلیں اپ لوڈ کریں۔'
    error:
      ERR_FIELD_FILE_INVALID: 'فائل ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
  radio_choice:
    label: 'ریڈیو انتخاب'
    help: 'فہرست میں سے ایک آپشن منتخب کریں۔'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'ریڈیو انتخاب ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
    choice:
      option_a:
        label: 'آپشن A'
      option_b:
        label: 'آپشن B'
      option_c:
        label: 'آپشن C'
  switch:
    label: سوئچ
    help: 'اس آپشن کو آن یا آف کریں۔'
    error:
      ERR_FIELD_SWITCH_INVALID: 'سوئچ ٹیسٹ کے مقصد کے لیے درست نہیں ہے۔'
form:
  error:
    ERR_FORM_TEST: 'ٹیسٹ کے مقصد کے لیے عالمی غلطی۔'
action:
  button_demo: 'کچھ نہ کریں'
  submit_default: 'جمع کرائیں'
  submit_error: 'غلطیاں دکھائیں'
  submit_js: 'JS عمل'
  submit_redirect: 'ری ڈائریکٹ کریں'
toast:
  success:
    title: کامیابی
    message: 'فارم کامیابی سے جمع کرایا گیا۔'
  js_action:
    title: 'JS عمل'
    message: 'کیا آپ فارم کو دوبارہ فعال کرنا چاہتے ہیں؟'
    reactivate: 'دوبارہ فعال کریں'
    dismiss: 'بند کریں'
description: |
  اس فارم کا استعمال جمع کرنے کے رویوں کو جانچنے کے لیے کریں۔ یہ ڈیمو ایک Vue کمپوننٹ میں ہے۔
