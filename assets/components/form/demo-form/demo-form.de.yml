field:
  password:
    label: Passwort
    help: 'Geben Sie Ihr Passwort zur Authentifizierung ein.'
    error:
      ERR_FIELD_PASSWORD_INVALID: 'Das Passwort ist zu Testzwecken ungültig.'
  emoji:
    label: Emoji
    help: 'Wählen Sie ein Emoji, das Ihre Stimmung widerspiegelt.'
    error:
      ERR_FIELD_EMOJI_INVALID: 'Das Emoji ist zu Testzwecken ungültig.'
  text_simple:
    label: Text
    help: 'Einzeiliges Texteingabefeld für kurze Inhalte.'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 'Der Text ist zu Testzwecken ungültig.'
  text_area:
    label: 'Langer Text'
    placeholder: 'Geben Sie ein, was Sie möchten...'
    help: 'Ein mehrzeiliges Textfeld für längere Inhalte.'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'Langer Text ist zu Testzwecken ungültig.'
  number:
    label: Zahl
    help: 'Geben Sie einen numerischen Wert ein.'
    error:
      ERR_FIELD_NUMBER_INVALID: 'Die Zahl ist zu Testzwecken ungültig.'
  email:
    label: E-Mail
    placeholder: you@example.com
    help: 'Geben Sie eine gültige E-Mail-Adresse ein.'
    error:
      ERR_FIELD_EMAIL_INVALID: 'Die E-Mail ist zu Testzwecken ungültig.'
  url:
    label: URL
    placeholder: 'https://'
    help: 'Geben Sie eine vollständige URL inklusive Protokoll ein.'
    error:
      ERR_FIELD_URL_INVALID: 'Die URL ist zu Testzwecken ungültig.'
  date:
    label: Datum
    help: 'Wählen Sie ein Datum mit dem Datumswähler aus.'
    error:
      ERR_FIELD_DATE_INVALID: 'Das Datum ist zu Testzwecken ungültig.'
  datetime:
    label: 'Datum & Uhrzeit'
    help: 'Wählen Sie ein Datum und eine Uhrzeit aus.'
    error:
      ERR_FIELD_DATETIME_INVALID: 'Datum & Uhrzeit sind zu Testzwecken ungültig.'
  time:
    label: Uhrzeit
    help: 'Wählen Sie eine Tageszeit aus.'
    error:
      ERR_FIELD_TIME_INVALID: 'Die Uhrzeit ist zu Testzwecken ungültig.'
  file:
    label: Datei
    help: 'Laden Sie eine oder mehrere Dateien von Ihrem Gerät hoch.'
    error:
      ERR_FIELD_FILE_INVALID: 'Die Datei ist zu Testzwecken ungültig.'
  radio_choice:
    label: Radioauswahl
    help: 'Wählen Sie eine Option aus der Liste aus.'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'Die Radioauswahl ist zu Testzwecken ungültig.'
    choice:
      option_a:
        label: 'Option A'
      option_b:
        label: 'Option B'
      option_c:
        label: 'Option C'
  switch:
    label: Schalter
    help: 'Schalten Sie diese Option ein oder aus.'
    error:
      ERR_FIELD_SWITCH_INVALID: 'Der Schalter ist zu Testzwecken ungültig.'
form:
  error:
    ERR_FORM_TEST: 'Globale Fehlermeldung zu Testzwecken.'
action:
  button_demo: 'Nichts tun'
  submit_default: Absenden
  submit_error: 'Fehler anzeigen'
  submit_js: JS-Aktion
  submit_redirect: Weiterleiten
toast:
  success:
    title: Erfolg
    message: 'Formular erfolgreich eingereicht.'
  js_action:
    title: JS-Aktion
    message: 'Möchten Sie das Formular reaktivieren?'
    reactivate: Reaktivieren
    dismiss: Schließen
description: 'Verwenden Sie dieses Formular, um die Übermittlungsverhalten zu testen. Diese Demo ist in einer Vue-Komponente.'
