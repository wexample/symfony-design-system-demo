field:
  password:
    label: Пароль
    help: 'Введите ваш пароль для аутентификации.'
    error:
      ERR_FIELD_PASSWORD_INVALID: 'Пароль недействителен для теста.'
  emoji:
    label: Эмодзи
    help: 'Выберите эмодзи, чтобы выразить ваше настроение.'
    error:
      ERR_FIELD_EMOJI_INVALID: 'Эмодзи недействителен для теста.'
  text_simple:
    label: Текст
    help: 'Однострочное текстовое поле для короткого контента.'
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: 'Текст недействителен для теста.'
  text_area:
    label: 'Длинный текст'
    placeholder: 'Введите что угодно...'
    help: 'Многострочное текстовое поле для более длинного контента.'
    error:
      ERR_FIELD_TEXT_AREA_INVALID: 'Длинный текст недействителен для теста.'
  number:
    label: Число
    help: 'Введите числовое значение.'
    error:
      ERR_FIELD_NUMBER_INVALID: 'Число недействительно для теста.'
  email:
    label: Email
    placeholder: you@example.com
    help: 'Введите действительный адрес электронной почты.'
    error:
      ERR_FIELD_EMAIL_INVALID: 'Email недействителен для теста.'
  url:
    label: URL
    placeholder: 'https://'
    help: 'Введите полный URL, включая протокол.'
    error:
      ERR_FIELD_URL_INVALID: 'URL недействителен для теста.'
  date:
    label: Дата
    help: 'Выберите дату с помощью выбора даты.'
    error:
      ERR_FIELD_DATE_INVALID: 'Дата недействительна для теста.'
  datetime:
    label: 'Дата и время'
    help: 'Выберите дату и время вместе.'
    error:
      ERR_FIELD_DATETIME_INVALID: 'Дата и время недействительны для теста.'
  time:
    label: Время
    help: 'Выберите время суток.'
    error:
      ERR_FIELD_TIME_INVALID: 'Время недействительно для теста.'
  file:
    label: Файл
    help: 'Загрузите один или несколько файлов с вашего устройства.'
    error:
      ERR_FIELD_FILE_INVALID: 'Файл недействителен для теста.'
  radio_choice:
    label: 'Выбор радио'
    help: 'Выберите один вариант из списка.'
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: 'Выбор радио недействителен для теста.'
    choice:
      option_a:
        label: 'Вариант A'
      option_b:
        label: 'Вариант B'
      option_c:
        label: 'Вариант C'
  switch:
    label: Переключатель
    help: 'Включите или выключите эту опцию.'
    error:
      ERR_FIELD_SWITCH_INVALID: 'Переключатель недействителен для теста.'
form:
  error:
    ERR_FORM_TEST: 'Глобальная ошибка для теста.'
action:
  button_demo: 'Не делать ничего'
  submit_default: Отправить
  submit_error: 'Показать ошибки'
  submit_js: 'JS действие'
  submit_redirect: Перенаправить
toast:
  success:
    title: Успех
    message: 'Форма успешно отправлена.'
  js_action:
    title: 'JS действие'
    message: 'Хотите повторно активировать форму?'
    reactivate: 'Повторно активировать'
    dismiss: Закрыть
description: |
  Используйте эту форму для тестирования поведения отправки. Этот демонстрационный пример находится в компоненте Vue.
