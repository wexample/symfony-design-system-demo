      ERR_FIELD_TEXT_SIMPLE_INVALID: 'Il testo non è valido per scopi di test.'
  text_area:
    label: 'Testo lungo'
    placeholder: 'Scrivi quello che vuoi...'
    help: "Un'area di testo multi-linea per contenuti più lunghi."
