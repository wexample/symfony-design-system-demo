      ERR_FIELD_TEXT_AREA_INVALID: 'Il testo lungo non è valido per scopi di test.'
  number:
    label: Numero
    help: 'Inserisci un valore numerico.'
    error:
      ERR_FIELD_NUMBER_INVALID: 'Il numero non è valido per scopi di test.'
  email:
    label: Email
    placeholder: tuo@example.com
    help: 'Inserisci un indirizzo email valido.'
