      ERR_FIELD_DATE_INVALID: 'La data non è valida per scopi di test.'
  datetime:
    label: 'Data e ora'
    help: "Seleziona una data e un'ora combinate."
    error:
      ERR_FIELD_DATETIME_INVALID: 'La data e ora non sono valide per scopi di test.'
  time:
    label: Ora
    help: 'Seleziona un orario della giornata.'
    error:
      ERR_FIELD_TIME_INVALID: "L'ora non è valida per scopi di test."
  file:
    label: File
    help: 'Carica uno o più file dal tuo dispositivo.'
