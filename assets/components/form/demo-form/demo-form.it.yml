      ERR_FIELD_RADIO_CHOICE_INVALID: 'La scelta radio non è valida per scopi di test.'
    choice:
      option_a:
        label: 'Opzione A'
      option_b:
        label: 'Opzione B'
      option_c:
        label: 'Opzione C'
  switch:
    label: Interruttore
    help: 'Attiva o disattiva questa opzione.'
