items:
  - name: DemoMessage
    type: class
    description: "One line said in a room, kept only so the demos have something real to show.\nWho spoke is its type and nothing else: a demo has no accounts, and the name\nthe reader sees is a translation of that type rather than a stored label."
    properties:
      - name: id
        type: Symfony\Component\Uid\Uuid
      - name: body
        type: string
        nullable: true
        default: null
      - name: dateCreated
        type: DateTimeInterface
        nullable: true
        default: null
      - name: type
        type: string
        nullable: true
        default: null
      - name: room
        type: DemoRoom
    methods:
      - type: method
        name: buildEntityPath
        parameters:
          - type: string
            name: className
        return:
          type: string
      - type: method
        name: getEntityKeyName
        return:
          type: string
      - type: method
        name: getEntityShortName
        return:
          type: string
      - type: method
        name: getId
        return:
          type: Symfony\Component\Uid\Uuid
      - type: method
        name: setId
        parameters:
          - type: Symfony\Component\Uid\Uuid
            name: id
        return:
          type: void
      - type: method
        name: getTableizedName
        return:
          type: string
      - type: method
        name: getCamelName
        return:
          type: string
      - type: method
        name: getBody
        return:
          type: string
      - type: method
        name: setBody
        parameters:
          - type: string
            name: body
        return:
          type: self
      - type: method
        name: getDateCreated
        return:
          type: DateTimeInterface
      - type: method
        name: setDateCreatedNow
        return:
          type: self
      - type: method
        name: setDateCreated
        parameters:
          - type: DateTimeInterface
            name: dateCreated
        return:
          type: self
      - type: method
        name: hasSomeType
        parameters:
          - type: array
            name: types
        return:
          type: bool
      - type: method
        name: getType
        return:
          type: string
      - type: method
        name: setType
        parameters:
          - type: string
            name: type
        return:
          type: void
      - type: method
        name: isOfType
        parameters:
          - type: string
            name: type
        return:
          type: bool
      - type: method
        name: checkAllowedOrFail
        parameters:
          - type: mixed
            name: value
          - type: array
            name: allowed
        return:
          type: void
      - type: method
        name: __construct
        parameters:
          - type: DemoRoom
            name: room
      - type: method
        name: getAllowedTypes
        description: ''
        return:
          type: array
      - type: method
        name: getRoom
        return:
          type: DemoRoom
